# genre-pack: infinite —— 无限流/诸天底座（机器契约层）
schema_version: 1
substrate: infinite
display_name: 无限流/诸天底座
substrate_config_keys:
  hub_space_mode: [有主神, 轻量中介, 无中介]
enum_extensions:
  world_facts_kind: []
  milestone_kind: [副本结算]
  thread_kind: []
  hook_type: []
worldbook_sections:
  - {section_id: hub-rulebook, template: infinite/hub-rulebook.md, mutability: axiom}
  - {section_id: conversion-table, template: infinite/conversion-table.md, mutability: append}
  - {section_id: world-card, template: infinite/world-card.md, mutability: append, per_instance: true}   # 每副本实例化 world-card-<n>.md
character_extensions:
  scope_layers: series 持久层 / arc 半持久层 / instance 临时层；账户、伤病、副本关系按本作规则确定持续范围，结算时核对实际保留项
  inheritance_list: 副本继承清单（带出物/能力，对照 hub-rulebook 兑换合同）
  power_anchor: 导入世界战力锚（对照 conversion-table）
