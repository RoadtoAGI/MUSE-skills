# 《日耳曼涅槃》Phase 1 逆向分析：世界构建
# 世界=限定：本作的叙事资源全部来自"真实历史+穿越者知识"这对规则的相互约束

analysis_meta:
  novel: 日耳曼涅槃
  source_text: navigation.md
  source_form: 长篇网络连载小说（538章约163万字，未完结）
  evidence_note: 结论以章节号锚定 segments/ 逐章摘要与 scenes/ 切片；世界规则重点取自序章-第12章原文与全书干预-连锁案例

setting:
  era: 架空1918-1940——魏玛共和国→第三帝国→二战初期；真实史实为底盘，自方彦各干预点起渐次分岔
  duration: 22年（1918年11月11日德国投降日 → 1940年10月3日意大利舰队出征）；和平期21年约占30%篇幅、战争期13个月约占70%篇幅（编年加速/战役减速）
  location: 德国为轴心（汉堡布罗姆-福斯船厂、柏林、基尔、威廉港）；延伸至意大利（米兰/罗马/塔兰托）、利比亚油田、大西洋、斯卡帕湾、挪威海/卑尔根、法国战场、摩尔曼斯克、直布罗陀
  conflict_levels:
    internal: 方彦的穿越者悖论——需要纳粹政权实现军事崛起，道德上又必须最终推翻它（第153-157章确立）；历史先知不可言说的绝对孤独
    personal: 与雷德尔的伯乐-猜忌双重关系（第45→246→368章）；与希特勒的宠信-拒绝张力（第35→375章）；鲍曼的嫉妒暗害（第366-377章）；西尔维娅（明）与琳娜（暗）的情感双线
    external: 德国vs英国的海权生死局（贯穿全书）；凡尔赛军备枷锁（第4-120章）；美国参战的时间窗口压力（第262、358、455章）；苏联的机会主义扩张

world_rules:
  physical:
    - 工业能力上限律：穿越者知识只能加速当期工业可行的路线（斜角甲板第101章、倾斜装甲第115章、钚弹路线第253章），不能凭空造物——技术兑现均以船厂/实验室/工期为载体
    - 历史惯性律：未被干预的事件沿真实轨道运行（凡尔赛第4章、鲁尔危机第11章、股灾第91章、慕尼黑第156章）；干预产生系统级蝴蝶效应（暗杀戈林第99章→空军不独立→海军航空兵存在→斯卡帕湾奇袭可行第168章）
    - 军事代差兑换律：先进设计=战场压倒性优势的直接兑换（氧气鱼雷第340章、雷达夜战第202章、装甲飞行甲板第177章）——参数即命运
  social:
    - 权力双轨制：国防军体制（论资排辈、军官团荣誉）与国社党体制（元首意志、派系倾轧）并行；方彦必须同时在两轨内维持地位，任一轨失宠即被锁死（第368-377章双重困境为此规则的兑现）
    - 政治投资兑换律：资本→党→庇护的交换链条（第35章5万马克→第109章元首亲密重逢→第353章元首派专机救命）
    - 海军封闭权威结构：雷德尔对海军人事的绝对控制；"忠于海军还是忠于党"的站队压力（第107章告诫、第360章密谋、第373章邓尼茨游说）
    - 国际体系的可操纵性：凡尔赛枷锁存在规避艺术（苏俄分厂第10章、意大利技术通道第26章）；英国绥靖倾向可被舆论工程放大（著书立说第59-64章）
  psychological:
    - 战败屈辱的民族复仇心理：德国社会对"强人"与"雪耻"的集体渴望（第4章祖父之死为全书情感原点；第442章贡比涅复仇仪式为其对位收束）
    - 面包收买律：民众拥护度由失业率与餐桌决定，而非意识形态（沃克一家第140-141、295-296章）——解释纳粹民意底座，也让"推翻纳粹"暗线更沉重
    - 军官团荣誉伦理与纳粹种族狂热之间存在裂缝：反纳粹密谋组织的心理土壤（第153章琳娜所属组织、第301-303章密谋受挫）
    - 独裁者心理机制：希特勒的赌徒式自信随胜利递增，可被恩情与"理论认同"打动（第33-34章种族理论共鸣、第425章两种和平论），也因造神运动加速膨胀失控（第469章方彦自己制造的反噬）

genre_conventions:
  primary_genre: 架空历史（穿越·军事）
  secondary_genre: 权谋政治
  conventions:
    - convention: 穿越者金手指
      planned_subversion: 金手指=历史知识+工程知识两种"可验证的知识"，无系统无异能；每次兑现必须通过体制程序（论文谒见第45-48章、竞标第100-102章、军衔逐级爬升），先知包装为天才判断，生成全书最稳定的表演性张力
    - convention: 历史名人集邮
      planned_subversion: 名人是双刃资源而非背景板——希特勒的宠信同时引来雷德尔猜忌（第360章）与鲍曼嫉妒（第367章）；每段名人关系都附带代价条款
    - convention: 爽文式连胜
      planned_subversion: 关键胜利均附带个人或战略代价——卑尔根大捷=重伤昏迷5天+明升暗降（第352-368章）；造神成功=独裁者膨胀失控（第469章）
    - convention: 对手弱智化
      planned_subversion: 英国被写成顽强体面的对手——丘吉尔"永远打下去"演说（第426章）、福布斯与勇士号同沉（第345章）、托维夜袭重创德航母（第492-501章）；对手视角章节占比可观

daily_life:
  - dimension: 通胀经济
    findings:
      - detail: 1923年马克崩溃期，持美元者在柏林咖啡馆一掷千金如国王（第12章）
        story_implication: 具象化家族"灾难套利"的资本扩张逻辑；方彦亲历民族苦难现场，强化使命感，并在此场景遇见齐亚诺（第13章）——世界规则直接生成情节
  - dimension: 工人生活
    findings:
      - detail: 船厂工人沃克一家的工资、就业、圣诞餐桌逐年变化（第140-141、295-296章）
        story_implication: 底层视角校准——解释民众为何拥护希特勒（面包收买律的实景），让反纳粹暗线背负"人民此刻确实过得更好"的道德重量
  - dimension: 权力者日常
    findings:
      - detail: 希特勒总理府晚餐的简朴与公众神格形象的反差（第365章）
        story_implication: 独裁者的人格化处理——支撑方彦"私人恩情 vs 政权罪恶"的内心撕裂（第359章救命之恩 vs 第157章水晶之夜）

creative_constraints:
  - constraint: 穿越者身份绝对不可暴露
    narrative_function: 所有先知必须转译为"研究成果/天才直觉"的可信载体（著书第59章、设计图第16-18章、论文第44章），生成"读者全知-角色无知"的持续反讽快感与表演性张力
  - constraint: 年龄与军衔的时间锁（10岁穿越，军校→少尉→少将逐级爬升，无跳级）
    narrative_function: 强制1918-1939的21年铺垫期存在，规定全书"和平加速/战争减速"的节奏结构；每一级军衔都是一个叙事关卡
  - constraint: 历史大势的惯性——一人不能凭空造史
    narrative_function: 方彦只能选择杠杆点精准干预（暗杀戈林第99章、奥斯陆空降建议第291章、敦刻尔克说服第424-425章），使每次干预都成为高价值决策场景而非任意改写；真实历史轨道成为悬在叙事上方的"对照组"
  - constraint: 盟友与体制不受主角意志控制
    narrative_function: 意大利的避战算计（第538章）、雷德尔的雪藏（第368章）、希特勒的政治直觉失误（第166章）保证世界的他者性——主角的先知优势永远要与不听话的现实讨价还价
