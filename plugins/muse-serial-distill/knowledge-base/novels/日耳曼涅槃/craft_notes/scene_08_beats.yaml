  quote: 帝国日薄西山的最后一抹还算明亮的余晖
- pattern_id: 08-p3
  beat: 口语骤断挽歌
  dimension: verb
  original_move: 软动词千字蓄势后硬动词断崖爆发，恐惧只写身体失控
  ai_default_failure: 用心理词直陈恐惧，补内心独白稀释动作定格
  transfer_rule: 建置与爆发用动词硬度分档，转折口语独立成段作剪刀
  quote: 望远镜啪地摔在了甲板上面
