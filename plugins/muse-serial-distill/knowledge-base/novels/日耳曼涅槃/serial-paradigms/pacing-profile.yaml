# 节奏形态 — 日耳曼涅槃
# 描述性、无硬数字指标；证据锚回章号。
schema_version: 1
profile:
  unit_shape: >-
    双形态单元。战争期以「战役单元」组织：临战静默建置（受袭方或出征方的盘点章，
    如第 169 章斯卡帕湾水兵闲谈）→ 多视角战斗连击（同一战役在攻方/守方/基层间轮切，
    卑尔根海战连排 27 章、法兰西战役 40 余章）→ 战果结算章（吨位与俘虏的算账文体）
    → 政治/家庭回气章。和平期以「编年单元」组织：技术节点章（样车 C0127/下水
    C0142/揭晓 C0145）与政治节点章（上台 C0108/协定/慕尼黑）作拍点，其间以家族商业
    与人事经营快进；强钩只留给拍点章，日常章以叙事惯性平收（章末钩子密度本身分层）。
  mainline_drip: >-
    对英主线在和平期靠军备里程碑滴灌——每件新武器登场章都显式指向未来对英之战
    （C0127 闪击任务、C0178 夕阳宣言）；战争期主线自足后，滴灌对象换成两条更长的线：
    美国参战倒计时（C0262-263 中立法、C0358 停援、C0455、C0523 时间窗计算）与反纳粹
    暗线（C0157 决心、C0301-302 平安夜密谈、C0375 操守抵押）。规律是「当前冲突之外
    永远悬着一条更大的债」——每逢大胜必插入代价信号（C0352 重伤、C0469 膨胀、C0505
    俾斯麦战沉）防止爽感失重。
  breath_pattern: >-
    大战役后必接余波章群回气：斯卡帕湾后切英方震恐与破交常态化（C0180 起），卑尔根
    后直接以「震动（C0355-358）」「苏醒（C0359）」命名章群完成政治余波与主角苏醒的
    双线减压，直布罗陀后以联盟政治与出征筹备（C0538）降速。回气的实现手段是视角
    轮换而非时间跳跃——前线打完切伦敦/华盛顿/克宫的决策席，再落回汉堡的家庭餐桌
    （沃克一家 C0140-141、C0295-296 两次在扩军与战时的间隙充当民意呼吸阀）；强弱章
    交替因此同时完成信息差管理（读者比任一阵营知道得多）与情绪配速。
  payoff_spacing: >-
    两段式间隔曲线。和平期（序章-C0165）兑现点为单章/短章群里程碑，间隔约 10-20 章
    并大体均匀：骗局启动（C0005-12）→意大利线（C0013）→初见希特勒（C0033）→谒见
    雷德尔献策（C0042 起）→著书立说（C0059-64）→暗杀戈林（C0099）→上台（C0108）→
    样车（C0127）→下水（C0142）→慕尼黑（C0148-156）→舰队出港（C0158-165）。开战后
    曲线由「均匀点状」变为「簇状脉冲」：兑现以战役连章簇形式出现——斯卡帕湾
    （C0168-179，12 章）→卑尔根（C0326-352，27 章）→敦刻尔克（C0422-430）→法国投降
    （C0431-442）→丹麦海峡（C0496-506）→直布罗陀（C0533-537）；簇内逐章连兑，簇间
    30-60 章由建置/政治/破交常态章填充，且簇的规模随卷递增（12→27→40 余章）。
    总趋势：间隔不缩短而是兑现形态升维——从点到簇、从章级爽点到卷级高潮。
  thread_economy: >-
    军事线近乎全开全收、回收距离短中为主：作战方案→战役兑现是标准短线（斯卡帕湾
    方案 C0158-165→C0168-179，距离约 10 章）；武器研发线为分段兑付的中长线（山猫/
    雪狼 C0114-139 立项，中途以下水/演习节点分段兑现，法兰西战役 C0401+ 终兑）；
    最长的已收线是海德里希潜伏（C0079 布子→C0168 斯卡帕湾情报兑现，约 90 章）。
    道德/终局域反向——多开少收：反纳粹暗线（C0157 开，悬置 380 余章至断章未收）、
    核武钚弹（C0253-254 开，未收）、私生子艾瑞克（C0300 点爆后悬置）、穿越勋章之谜
    （序章开，全书未收）。开收比大势：已收线以短中线为主，未收线集中在道德与终局域
    且全部为百章级长线——与 mainline_drip 的「当前冲突之外永远悬着更大的债」互为
    台账；断章时点未收长线按共创定调（ops/运营final.md 基调锁定节）整体归续作。
