# 卷结构样本 — 日耳曼涅槃（幽冷秋月）
# 注：原作文本无原生卷标（纯 538 章连载流）；卷界为分析推定——取 phase3_spine.yaml 七个
# Arc 的价值逆转边界作为卷批次。章号 CNNNN 对应原文「## 第N章」；序章并入 V1 卷首。
schema_version: 1
volumes:
  - volume: 1                        # 废墟奠基（1918-1930）
    span_chapters: [C0001, C0100]
    three_act:
      setup_until: C0035             # 穿越落位→资本积累→监狱注资希特勒：四重杠杆的前三重（知识/资本/政治期权）布局完成
      midpoint: C0064                # 《公海舰队兴衰启示录》风靡——舆论杠杆成型，个人影响力首次越出家族与军界
      climax_at: C0099               # 暗杀戈林：以体制外手段扫清空军独立障碍，卷尾接航母竞标赴柏林（C0100）开出下卷
    tentpoles:
      - at: C0035
        beat: 监狱初见希特勒并大额注资国社党
        value_shift: 家族资本 → 政治期权（与未来政权绑定，道德负债同步开始计息）
      - at: C0099
        beat: 雇凶暗杀戈林
        value_shift: 前途障碍 → 权力空缺（海军航空兵路径打开；主角首次为目标逾越底线）
    open_ended: false
  - volume: 2                        # 战争机器（1930-1939.8）
    span_chapters: [C0101, C0165]
    three_act:
      setup_until: C0112             # 政权更迭完成（上台→一体化→退出国联）：政治期权兑付为国家机器
      midpoint: C0142                # 齐柏林号航母下水——海军复兴由纸面计划变为钢铁存在
      climax_at: C0165               # 格莱维茨假旗事件：战争闸门落下，舰队已隐蔽出港，全卷以「上膛完毕」收束
    tentpoles:
      - at: C0108
        beat: 希特勒就任总理
        value_shift: 在野投资 → 体制内兑付（军备扩张全面解锁）
      - at: C0157
        beat: 水晶之夜后暗誓推翻国社党
        value_shift: 合作者 → 秘密反叛者（军事上膛与道德反转同步完成，双线引信就位）
    open_ended: false
  - volume: 3                        # 天谴与凯旋（1939.9-12）
    span_chapters: [C0166, C0254]
    three_act:
      setup_until: C0167             # 宣战两章极速过闸——设置段被压到最短，直接引爆
      midpoint: C0179                # 斯卡帕湾奇袭收官【全书第一高潮】——本卷为「前置高潮」型：最强战役置于卷首段
      climax_at: C0254               # 凯旋+核武（钚弹）规划启动：军事红利折算为政治地位与终局期权，长尾收束
    tentpoles:
      - at: C0179
        beat: 300 余架舰载机覆灭英国本土舰队主力
        value_shift: 纸面战略 → 海权主动权易手（全部前期铺垫一次性验证）
      - at: C0245
        beat: 晋升准将、威廉港凯旋
        value_shift: 军内才俊 → 国家英雄（政治资本达到第一峰值）
    open_ended: false
  - volume: 4                        # 北海霸权（1939.12-1940.1）
    span_chapters: [C0255, C0352]
    three_act:
      setup_until: C0285             # 破交游击常态化+援芬连环计布局：决战条件在场外酝酿
      midpoint: C0318                # 威悉河演习落地（奥斯陆空降）——诱出英国主力的战役前提完成
      climax_at: C0352               # 卑尔根海战收官【全书第二高潮】+英机撞舰、主角重伤昏迷——胜利首次索取血价，以生死悬念断卷
    tentpoles:
      - at: C0300
        beat: 冬季战争连环计兑现（苏联受挫后对德让利）
        value_shift: 苏联威胁 → 战略缓冲+资源让利（多线伏笔在此收口）
      - at: C0345
        beat: 福布斯与勇士号同沉
        value_shift: 英国第二支主力舰队 → 覆灭定局（对手阵营的殉葬式退场）
      - at: C0352
        beat: 主角重伤昏迷五天
        value_shift: 全知先知 → 可折损的凡人（金手指首次被「剧本外事件」放血）
    open_ended: false
  - volume: 5                        # 权力暗流（1940.2-5）
    span_chapters: [C0353, C0400]
    three_act:
      setup_until: C0365             # 养伤+圣眷蜜月（专机名医、总理府晚餐）：恩情债务加仓
      midpoint: C0369                # 雷德尔明升暗降落定——军事巅峰者被体制合规地锁进文职
      climax_at: C0375               # 拒绝邓尼茨转达的交易+深夜直谏保雷德尔【全书危机节点】：权力与操守的两难抉择
    tentpoles:
      - at: C0369
        beat: 明升暗降（勋章换实职）
        value_shift: 国家英雄 → 被防备的功高者（外胜内危反相结构成立）
      - at: C0375
        beat: 深夜直谏、拒当元首之刃
        value_shift: 圣眷 → 冷遇（人格底线显影；「未来背叛独裁者」的保证金付讫）
    open_ended: false
  - volume: 6                        # 大陆征服（1940.5-7）
    span_chapters: [C0401, C0470]
    three_act:
      setup_until: C0410             # 埃本-埃迈尔奇袭+阿登突破：西线战役机器全速展开
      midpoint: C0430                # 敦刻尔克围歼完成（18 万英军被俘）——全书最大历史分歧兑现
      climax_at: C0466               # 元首颂歌发布、造神运动登顶：军事高潮折返为政治重生，卷尾埋反噬伏笔（C0469 独裁者膨胀）
    tentpoles:
      - at: C0425
        beat: 以航拍证据+数据轰炸+两种和平论说服希特勒取消停止令
        value_shift: 无职无权的文职 → 战略话语权重建（知识杠杆的极限演出）
      - at: C0442
        beat: 贡比涅车厢受降、法国投降
        value_shift: 西线悬局 → 大陆霸权（对英孤悬格局形成）
    open_ended: false
  - volume: 7                        # 海峡与巨岩（1940.7-10，断章）
    span_chapters: [C0471, C0538]
    three_act:
      setup_until: C0476             # 登陆之争→直布罗陀方案确立：主角从执行者升为对英绞杀战略总设计师
      midpoint: C0505                # 丹麦海峡夜战互重创（俾斯麦号战沉）——胜利叙事首次被对手大幅回敬
      climax_at: C0537               # 直布罗陀要塞陷落【全书第三高潮】——地中海门户易手
    tentpoles:
      - at: C0523
        beat: 佛朗哥被造神景观击穿评估、给出有限度中立（借道）
        value_shift: 武力无解题 → 政治杠杆解题（直布罗陀战役前提达成）
      - at: C0538
        beat: 意大利交出联合舰队指挥权、德意舰队出征（文本在此中断）
        value_shift: 绞索合拢前夜 → 悬置（对英终局、反纳粹暗线、美苏变量全部场外待命）
    open_ended: true                 # 未完结卷：三幕落点与卷尾价值均为暂定态
