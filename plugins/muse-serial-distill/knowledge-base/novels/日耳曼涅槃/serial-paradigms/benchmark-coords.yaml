# 类型坐标 — 日耳曼涅槃（对标反查数据源）
# 写作侧 S1 类型判定"像日耳曼涅槃那样"按本卡取坐标预填；值域与 genre-profile 同（genre-packs 词表）。
# 底座专属配置（供 substrate_config 预填参考）：history_coupling: 分岔架空——真实历史人物/事件全量在场，
# 由穿越者的蝴蝶效应制造分岔（暗杀戈林 C0099、敦刻尔克取消停止令 C0424-425、直布罗陀陷落 C0533-537）。
schema_version: 1
coords:
  substrate: history
  engine: {primary: 穿越, secondary: 军事技术流}
  mainline_type: 事业线
  pacing_contract: 付费标准
  evidence: >-
    开篇形态：序章触发穿越、第1章末即抛全书战书（"让英语国家主导的世界秩序被砸得粉碎"），
    读者从C0001起持有长期验证凭证——穿越先知是主爽点引擎（每个历史节点=一次先知兑现）；
    副引擎为硬核军事技术流，舰船参数/装甲计算/战术推演是核心卖点（样车C0127、下水C0142、
    参数收章形态见 hook-samples 信息投放型）。主线为纯事业线：海军军职+政治投资+军工设计
    三轨并进，感情线（西尔维娅/琳娜）仅作支线调剂。节奏合同为付费标准档：535章约163万字、
    章均约3000字；和平期以拍点章（政变/上台/下水/协定）间隔约10-20章推进并快进编年，
    战争期战役连章兑现（斯卡帕湾12章、卑尔根27章、法兰西40余章）；强钩留给结构章与战役章、
    日常章叙事惯性平收——兑现密度分层是典型付费标准形态，非免费快节奏的逐章硬钩，
    亦非慢热精品的长篇蓄势。
