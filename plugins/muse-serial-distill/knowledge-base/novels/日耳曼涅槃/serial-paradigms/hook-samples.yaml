samples:
  - hook_type: 悬念
    at: C0092
    quote: 那名奥地利下士的容貌，已经悄然在他的心中浮现了出来。
    mechanism: 不点名的指涉——读者凭史识补全「希特勒」，信息缺口设在「主角将如何接近他」；经济危机预告同段投放，双层期待叠加
  - hook_type: 悬念
    at: C0108
    quote: 这么多年过去，他又成长到了怎样的境地？
    mechanism: 视角反转式悬念——借希特勒之眼悬置主角成色，把「久别重逢」的答案推到下章；问句收尾直接把未答问题递给读者
  - hook_type: 悬念
    at: C0199
    quote: 他要借助爆炸产生的火光，继续寻找下一个进攻目标。
    mechanism: 进行时切断——狼群夜袭正酣处收章，动作链条故意不闭合；「下一个目标」即下一章的阅读契约
  - hook_type: 反转
    at: C0165
    quote: 把德国民众带到了一场他们本身所想要竭力避免的战争当中
    mechanism: 全知叙述者在假旗事件后突然拉高海拔宣判性质——庆祝叙事瞬间翻成悲剧预告，价值极性一句翻转，开战卷以寒意收口
  - hook_type: 反转
    at: C0352
    quote: 方彦脑中嗡然轰鸣，意识顷刻间被撕成了万千飞絮，随风飘散……
    mechanism: 凯旋顶点插入生死危机——全书第二高潮的胜利章以主角意识中断收尾；省略号+昏迷视角直接物理切断叙事，卷级 cliffhanger
  - hook_type: 情绪炸弹
    at: C0001
    quote: 让历史上由英语国家主导的世界秩序被砸得粉碎吧！
    mechanism: 开书立誓——把全书宏愿压缩成一句战书在第 1 章末引爆；读者从此持有「验证这句话」的长期凭证
  - hook_type: 情绪炸弹
    at: C0300
    quote: 小艾瑞克，他迄今为止只怕都不知道自己的生父。
    mechanism: 大胜间隙引爆私域愧疚——公线凯歌与私生子的父爱亏欠对撞；情绪落差由「即将年满 6 岁」的具体性引信点燃
  - hook_type: 情绪炸弹
    at: C0537
    quote: 所有从德意志身上夺走的东西，我都要让他们用鲜血成倍偿还！
    mechanism: 高潮章末让独裁者抛出下一场战争的血誓——胜利余温未散即预支更大冲突；狠厉声线同时深化人物危险性
  - hook_type: 信息投放
    at: C0127
    quote: 足可使它完成自己意想当中穿插包围的闪击任务。
    mechanism: 参数收章——章末以行程/速度硬数字收在「闪击任务」上，宣告闪击战物质前提成立；技术流读者获得推演素材，剧情读者获得「此物必将改写战场」的承诺
  - hook_type: 信息投放
    at: C0178
    quote: 等到这场战争结束后，不列颠就将再也看不到这片美丽的光华。
    mechanism: 战略路线图借主角之口在首胜现场投放——夕阳意象把「对英绞杀」的多卷主线提前具象化，为后续每场战役预装意义
  - hook_type: 信息投放
    at: C0523
    quote: 等到美国人真正回过劲来，英国早已成了一具尸体
    mechanism: 时间窗计算投放——用「美国动员 vs 英国存亡」的赛跑给终局卷装上倒计时钟；读者获得判断后续每章紧迫度的标尺
