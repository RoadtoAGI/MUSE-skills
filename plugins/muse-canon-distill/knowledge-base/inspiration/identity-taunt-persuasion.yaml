card_id: identity-taunt-persuasion
pattern_name: 身份激将说服术
dramatic_function: 说服不走利害分析而攻击对方身份认同，把退缩定义为自我否定，使让步成为唯一保全身份的出路
applicability: 适用于亲密或同侪关系内的道德拉锯，双方须共享同一身份价值脚本；纯利益陌生人关系失效（单书孤证，验证面窄）
