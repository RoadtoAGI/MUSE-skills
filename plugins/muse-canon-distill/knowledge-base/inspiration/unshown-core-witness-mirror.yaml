card_id: unshown-core-witness-mirror
pattern_name: 核心不直写·反应承载
dramatic_function: 把决定性暴力或核心造物移出正面描写，由声音、转述、身体反应或完成态物证交付冲击。
applicability: 适合核心对象直写会缩小想象或偏移人物反应的场合；因果理解依赖关键动作时需保留相应节拍。
reuse_candidates:
- 枭啼与敲门的具体声响设计
- 血手与匕首道具
- 弑君情节本身
- 雷暗、闪光、杖落、挺腰组成的解咒动作链
- 声音先改变听众、最后一句断杖的对决方式
- 三十幅阁楼油画
- 水果静物画色彩细节
- 西斯廷教堂比较
- 麻风病房壁画
- 死后焚毁遗作
- 失明画家结局
- 隔开变化过程的门
- 先报结果的群聊
- 从楼梯滚落的人头
- 拖把棍上的头颅
- 背包绑在手上的焦尸
tags:
- 省略
- 画外暴力
- 反应戏
- 听觉叙事
- 魔法表现
- 过程省略
- 环境叙事
- 听众反应
- 审美震动
- 观看反应
- 不可言说
- 有意空白
- 镜子技法
- 高潮揭示
- 完成态物证
- 幕后暴力
- 后果倒推
- 信息断面
source_scenes:
- novel: Macbeth
  scene_id: A2S2
  note: 弑君全程幕后，台上妻子听声计步
- novel: Macbeth
  scene_id: A4S2
  note: 全剧唯一台上一刀给孩子，作省略策略的反向爆点
- novel: 指环王
  scene_id: S26
  note: 雷暗与闪光只给因果两端，杖落挺腰完成解咒验证
- novel: 指环王
  scene_id: S35
  note: 声音法术全由听众受惑与大笑破幻来计量
- novel: 指环王
  scene_id: S13
  note: 两位高位者静止对峙，场外鸡鸣号角悬置胜负
- novel: 月亮与六便士
  scene_id: S11
  note: 技法笨拙与不可名状力量并存。
- novel: 月亮与六便士
  scene_id: S16a
  note: 焚毁过程平淡处理，保留不可描述的空白。
- novel: 月亮与六便士
  scene_id: S15
  note: 壁画几乎不正面描写，只写医生被击垮。
- novel: 狂病-莫千回
  scene_id: DT-S10
  note: 铁门后的试验、感染发生与刘敏遇害均未呈现，群消息、笑声和滚落人头逐级交付结果。
- novel: 狂病-莫千回
  scene_id: XX-S09
  note: 叙述者未听到社长惨叫，转身才由拖把棍上的头颅确认不可逆结果。
- novel: 狂病-莫千回
  scene_id: RS-S10
  note: 周全的追赶在即将扑到时截断，盲女继而通过焦尸、前伸双手和绑住的背包得知结果。
- novel: 狂病-莫千回
  scene_id: YY-S09
  note: 陈雨琪如何被抓到后厨保持空白，陆小虎冲入时直接看见灶台上的完成态伤害。
