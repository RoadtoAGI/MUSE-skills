card_id: wordless-severance-gesture
pattern_name: 无言决裂·身体替言
dramatic_function: 在语言失效或拒绝解释处，用极少的身体动作完成决裂、抗议与告别；独白缺席让不可逆选择更硬，断裂在读者等待解释时落定
applicability: 适用于长期关系弧线终点与高压伦理冲突；前文须累积足够矛盾，角色仍需解释动机则效果减弱
