card_id: duty-coded-sleeper-line
pattern_name: 责任暗线执行者
dramatic_function: 为长时间跨度叙事提供贯穿暗线：人物按责任而非结果行动，真实意图延迟两百年揭晓，回读时每个动作细节皆成伏笔
applicability: 适合多时代跳跃结构；须早期埋设可回读的具体动作，人物动机过早外露或缺乏「沉默塑形」则暗线塌陷（单书孤证，验证面窄）
reuse_candidates:
- 太空军与冬眠增援未来的制度设定
- 陨石子弹暗杀的具体手法
- 军人世家父子关系细节
tags:
- 暗线人物
- 延迟揭晓
- 伏笔回收
