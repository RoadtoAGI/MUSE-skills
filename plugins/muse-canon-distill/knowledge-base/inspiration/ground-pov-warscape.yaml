card_id: ground-pov-warscape
pattern_name: 分层小视角写大战
dramatic_function: 以局部感官、传令、专业判断及决策层、战位层、敌方层等限知视角替代全知战报；各层只交付本层信息，读者自行拼合战局与人命代价。
applicability: 适用于多线战役与巨灾场面；每个视角须有独立欲望、位置或专业判断，层间信息若随意互通，分层张力会消失。
