card_id: climax-scale-shrink
pattern_name: 尺度收缩高潮
dramatic_function: 让宏大后果在一个局部行动、物件或感知中得到收束，读者由具体经验理解文明命运与人物选择的关系。
applicability: 局部承载与更大处境之间已有可理解的联系时适用；重量、声音、形象或一次选择均可承担收束，具体形式取决于前文建立的关系及当前叙事作用。
