card_id: virtue-as-tragic-flaw
pattern_name: 美德即陷阱·善意致祸
dramatic_function: 人物珍视的价值在特定权力规则、责任分配或资源条件下转化为风险与代价，让人物选择和局势后果相互牵动。
applicability: 适用于价值承诺与现实条件存在具体张力的情节；迁移时保留选择怎样影响风险、关系或责任的因果联系，代价能否挽回及故事怎样评价该选择由当前作品决定。
reuse_candidates:
- 执剑人威慑机制
- 光速飞船禁令情节
- 程心的航天职业线
- 荣誉至上的北境领主人设
- 提前警告政敌带孩子逃亡的具体桥段
- 为救父亲独自试险
- 把保护同伴的战力留在队中
- 为掉队者承担坏人角色
- 抗生素留给受伤同伴
- 断后换取他人逃生
tags:
- 悲剧缺陷
- 道德拷问
- 主角设计
- 性格悲剧
- 权谋
- 价值反讽
- 价值驱动
- 美德风险
- 责任选择
- 人物情节统一
