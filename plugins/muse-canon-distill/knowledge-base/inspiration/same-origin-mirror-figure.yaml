card_id: same-origin-mirror-figure
pattern_name: 同源镜像·主题人格化
dramatic_function: 把主题辩题人格化为同源异路的镜像人物：同一起点在对立环境或价值取向下走向两端，对比贯穿全书，论证免于说教
applicability: 适用于主题驱动的成长或悲剧叙事；镜像方须与主角共享出身或核心欲望且戏份立得住；沦为反面工具人即失效
reuse_candidates:
- 靖康之耻的命名梗与宋金蒙具体史局
- 认贼作父的王府养子设定
- 比武招亲式的相遇桥段
- 「问世间情是何物」主题曲
- 情花自焚的具体死法
- 古墓同门的师承设定
