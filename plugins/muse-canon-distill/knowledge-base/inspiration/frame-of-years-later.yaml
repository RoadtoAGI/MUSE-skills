card_id: frame-of-years-later
pattern_name: 序尾回环·距离框
dramatic_function: 把高烈度悲剧装进多年后回看的框架，先抛问题再让正剧作答，以距离调出哀静，防止煽情灼伤观众。
applicability: 适用烈度过高易煽情的题材；正剧不够厚重则框架空转；演出常删框需接受失距离的风险（单书孤证，验证面窄）
reuse_candidates:
- 教堂医院与巴赫弥撒的具体环境
- 姊弟问话机器的具体人物设定
tags:
