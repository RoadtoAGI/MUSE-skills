card_id: blank-space-farewell
pattern_name: 情感节点留白
dramatic_function: 把告白与告别等最高情感节点交给省略：短音节、未说出口、隔墙帘幕、停顿与事后空场，重量由读者补完
applicability: 适用于已被前文充分铺垫的关系节点；铺垫不足会显得空洞或故弄玄虚；类型需要即时情绪宣泄则失效
