card_id: climactic-question-duel
pattern_name: 终极对决·以问收束
dramatic_function: 把全书主控思想压到一场无武力的对话：以最朴素的问题对位最庞大的权力，对方以身体反应作答，结局不给答案。
applicability: 适用于主题型史诗收尾；主角须先以行动积累道德资本，否则质问沦为说教（单书孤证，验证面窄）
