mechanism: 具体意象在感知、记忆与关系之间形成联系，读者经历这些联系而保留解释空间。
source_analyses:
- novel: 挪威的森林
  creative_move: 萤火虫从瓶中飞走，留下脑际光迹与伸手无法触及的感受；关于直子的记忆也与一口未曾亲见的井和草地纠缠。
  narrative_reason: 当下微弱的光与记忆中的明亮相对照，等待、飞离和事后伸手把距离变成经验。另一段中，面影渐难唤回，景物却反复浮现；井的实际存在未被确定，但已进入叙述者的记忆。两段的联系支持对记忆与不可触及之物的理解，无需唯一符号答案。
  transfer_conditions: 意象需要处于人物具体感知、记忆或关系中，并由前后经验获得分量；若新作品需要传递精确情报，应另外提供相应依据，不能把开放象征当作已完成的解码。
  source_scene_ids:
  - S05
  - S02
