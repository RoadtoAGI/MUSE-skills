card_id: untranslated-symbol
pattern_name: 象征不释义
dramatic_function: 让象征物与神异意象只按自身逻辑行动，不证明真假不补主题解释；意义由读者投射生成，命运感与抒情浓度同增
applicability: 适用于抒情现实主义与有民间信仰底色的叙事；解释成设定规则或寓言说明即变窄失效
