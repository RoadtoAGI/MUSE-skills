card_id: kindhearted-harm-no-villain
pattern_name: 无恶人灾难
dramatic_function: 让灾难与阻力全部来自温和、合理、善良者的过失链与现实约束；愤怒无处安放，悲剧感与主题的结构性难题同时加深
applicability: 适用于反偏见、关系伦理与权力改革题材；肇事者判断须在情境内合理且缺陷有铺垫；写成蓄意恶行或纯意外即失道德模糊性
