card_id: double-layer-code-speech
pattern_name: 中介与坐标传意
dramatic_function: 在监听条件下，以能独立成立的童话传递情报；接收者通过熟悉的中介现象与辅助线索理解陌生关系。
applicability: 适用于需要较精确传意且接收者具有相关先验的嵌套故事；只给意象对应、缺少关系依据时难以收敛含义。
