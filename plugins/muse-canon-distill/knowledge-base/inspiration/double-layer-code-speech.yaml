mechanism: 表层事物先参与故事行动，再通过接收者熟悉的中介关系指向深层含义；其他线索约束可能解释。
source_analyses:
- novel: 三体Ⅲ-死神永生
  creative_move: 香皂泡沫让人物渡过封锁的海；母作品的解码将这一组关系连接到肥皂船与曲率驱动，雪浪纸的卷曲和熨平进一步限定含义。
  narrative_reason: 童话先给封锁、洗脸用品与泡沫反应，再由木盆事故促成渡海办法。人物有使用这些物件的理由。后续解码借助熟悉的肥皂船实验建立关系，卷纸变化排除部分其他解释；这是对文本安排的分析。
  transfer_conditions: 表层问题与解法须由本作条件支持；中介关系需在接收者经验中可理解，辅助线索有区分作用。精确传意和开放象征需要不同的解释空间，线索数量由具体歧义决定。
  source_scene_ids:
  - S26
  - S27
  - S28
  - S07
