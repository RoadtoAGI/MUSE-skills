card_id: emotion-powered-craft-system
pattern_name: 情感供能的技艺系统
dramatic_function: 把内在情感状态硬编码为能力开关——唯痛苦时招法有效、动情即剧痛，使情节高潮与情感高潮自动重合。
applicability: 适用于任何超常能力体系；规则须全书一致且有真实代价；若只作修辞比喻不进系统即失效（单书孤证，验证面窄）
reuse_candidates:
