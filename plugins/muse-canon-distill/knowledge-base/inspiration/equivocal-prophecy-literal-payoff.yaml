card_id: equivocal-prophecy-literal-payoff
pattern_name: 双关预言·字面兑现
dramatic_function: 让可双解的预言给持有者虚假安全并埋雷；终局按字面由被忽视者兑现，反转惊奇而回看全然公平，宿命感一次完成
applicability: 适用于有预言、神谕、合同等可双解文本的故事；歧义须在原文自然成立并早播，须先当众验真一次取信；临时补设歧义或预言单义即失效
