pattern_name: 一物试众生·执念自毁
dramatic_function: 用单一诱惑物串联多方群像：各角色差异反应当场立人并完成主题对比，执念者被宝物反噬，收束于自毁
applicability: 适用于群像多势力叙事需统一动力源；诱惑须向每人承诺其最深欲望且理由体面；宝物只是奖品而不反噬人格即失效
