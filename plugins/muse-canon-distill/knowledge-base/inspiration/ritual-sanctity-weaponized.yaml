card_id: ritual-sanctity-weaponized
pattern_name: 礼仪先立后破
dramatic_function: 先足额建立公共礼仪的保护性与秩序基线，再当众反用或践踏；崩坏可被精确度量，背叛感与秩序塌陷同拍完成
