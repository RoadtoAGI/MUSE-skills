pattern_name: 底层闲谈承重锤
dramatic_function: 大悲或末日主线中插入底层闲谈：俗语歪理先把死亡主题说粗，拌嘴间突然坍缩出深渊句；减压与重锤一体，留白由读者承重
applicability: 适用于悲剧与大变局的节奏调控；闲谈须自洽有趣并与主线人物形成语域反差，深渊句须由人物口吻自然带出；说教或闹剧过度即拆台
