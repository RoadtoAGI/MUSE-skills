card_id: label-cage-expulsion
pattern_name: 标签即无形对手
dramatic_function: 让出身标签成为无形对手：压进每次社交与求名，主角每获得位置即被同一标签逐出；重复结构价值递进，制度压力可感
applicability: 适用于身份规则严密的社会题材；每次退场须价值递进而非换表层事故；主角可轻易改换身份则失效
