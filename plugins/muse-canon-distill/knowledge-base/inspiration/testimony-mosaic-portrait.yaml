card_id: testimony-mosaic-portrait
pattern_name: 他者之眼·证词拼图
dramatic_function: 让核心人物保持缺席或不可知，由多名独立见证者的转述拼出其形象与影响力；读者重新仰望，免于叙述者自夸
applicability: 适用于神秘强人物或大时间跳跃后的再登场；需多个独立信源互证；主角中途现身自我解释即破功
