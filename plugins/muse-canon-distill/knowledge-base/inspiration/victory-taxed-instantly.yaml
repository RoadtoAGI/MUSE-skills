card_id: victory-taxed-instantly
pattern_name: 胜利焊死代价
dramatic_function: 让大胜在同场或紧邻结构中扣回身体、资产或权力代价；胜利越大，下一阶段的绞索越紧，抑制连胜带来的爽感通胀。
applicability: 适用于连胜型长篇主线；代价须落在主角最在意的资产上，且改变后续行动空间；仅伤无关角色或事后口头总结会失去反噬力度。（单书孤证，验证面窄）
