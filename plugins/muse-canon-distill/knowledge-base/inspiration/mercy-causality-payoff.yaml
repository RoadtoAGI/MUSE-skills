card_id: mercy-causality-payoff
pattern_name: 怜悯因果链终局兑现
dramatic_function: 解决「高潮靠主角意志开挂」的失真：主角在终点真实失败，由早期对敌人的仁慈所埋因果意外完成使命，兼得肯定与反讽
applicability: 需全程多次可信播种饶恕且每次代价真实；若仁慈只出现一次、或被饶者无独立欲望驱动，兑现就沦为机械降神（单书孤证，验证面窄）
reuse_candidates:
- 咬断手指坠入火山的具体桥段
- 魔戒、咕噜等专名与设定
tags:
- 怜悯
- 高潮设计
- 因果链
- 反讽
