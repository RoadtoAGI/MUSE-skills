mechanism: 一方的具体指控，经另一方既有的诊断框架，被重新理解为该诊断的证据；不同解释继续改变关系与应对。
source_analyses:
- novel: 哈姆雷特
  creative_move: 波隆尼尔已将王子的反常解释为失恋；哈姆雷特称他为鱼贩并反复提到女儿，波隆尼尔继续将这些话归入自己的判断。
  narrative_reason: 前段交代父亲干预恋情并计划利用女儿观察王子，随后的对话与私下旁白并列，读者能看出话语对关系的攻击及听者的再解释。下一幕中，国王与波隆尼尔对同一场谈话也作出不同判断。
  transfer_conditions: 先有可见的诊断框架和双方关系，双关才能产生具体作用。它依靠解释不对等，不要求精确编码或一个最终解码答案；王子对全部窃听细节的知情程度应按具体文本判断。
  source_scene_ids:
  - A2S2
  - A3S1
