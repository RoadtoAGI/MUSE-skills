card_id: diagnosis-reframes-accusation
pattern_name: 诊断吸收指控
dramatic_function: 人物借错认和双关表达攻击，对方却把言语纳入已有诊断；同场言语揭示彼此不同的理解与权力处境。
applicability: 适用于一方已给另一方贴上认知标签、双方解释不对等的对话；需有具体关系与利益支持各自的误读。
