card_id: mentor-fall-transfigured-return
pattern_name: 导师退场变容归来
dramatic_function: 中途移除最强庇护者，逼群体在真实缺席代价中自立；再以更高形态归来重新洗牌力量格局，绝望与希望各得其重
applicability: 缺席期须足够长且团队确实受损；归来需付出可见代价并换形态。若速回或无代价，牺牲与惊喜都被稀释（单书孤证，验证面窄）
