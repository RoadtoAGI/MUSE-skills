card_id: zero-degree-violence-pov
pattern_name: 暴力零度叙述
dramatic_function: 让承载暴行的视角与语调不识其重量：孩童当物理事件、照料话术推进伤害、灭世写成工作日志；恐怖来自温度差而非渲染
applicability: 适用于写意外、熟人互害与异文明视角；视角的价值体系须自洽；旁白解释道德或切入受害者反应即破功
