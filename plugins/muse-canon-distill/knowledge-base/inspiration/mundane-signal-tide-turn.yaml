card_id: mundane-signal-tide-turn
pattern_name: 至暗时刻微声转机
dramatic_function: 守方绝望最低点不直接降援军，先以一个不受战争逻辑支配的日常微小信号宣告转折，希望显得来自世界本身
applicability: 信号须属日常秩序且剧内不解释；援军须在信号之后到场。让援军直接救场或解释信号成因，超越感即消失（单书孤证，验证面窄）
reuse_candidates:
- 公鸡啼叫与洛汗号角的具体组合
- 鹰作为终局救援的物种设定
tags:
- 转折信号
- 围城
- 希望
