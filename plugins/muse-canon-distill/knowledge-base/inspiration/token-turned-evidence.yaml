card_id: token-turned-evidence
pattern_name: 证据翻面·意义倒置
dramatic_function: 让同一真实物件或信号在不同背景与新增标记下支持两种合理解释：先由误读触发代价，再以语境变化翻转身份、战局或价值选择。
applicability: 适合信物、旗帜、身份标记等可多解证据；须先建立原始读法并让误读产生真实代价；提前揭底或物件前史不足会削弱反转。
reuse_candidates:
- 守誓剑
- 兰尼斯特狮子
- 石心夫人
- 黑帆先被认作海盗、展旗后改判援军的桥段
- 同一阵风先被赞美、再被诅咒、终获平反的征兆链
tags:
- 物件反转
- 誓言考验
- 两难
- 信息误读
- 战局翻面
- 身份揭示
- 视点控制
