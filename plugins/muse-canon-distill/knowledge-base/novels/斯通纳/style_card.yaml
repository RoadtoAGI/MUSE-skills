novel: 斯通纳
author: 约翰·威廉斯
lang: zh
translator: ''
narration_voice: 贴近斯通纳的限知叙述，少评判，多让动作和物显义
diction: 译文长句稳重，学院词、农事词和触觉词并行
rhetoric_density: medium
dialogue_mode: 对白短而克制，关键关系靠停顿、误解和未说出口推进
pacing: 人生大事常压缩，内在醒悟和末尾动作放慢
signature_moves:
- 用冷静物理细节承载无法言说的情绪
- 让重大转折以低声对白或行政动作出现
- 先铺环境温度和光线，再让人物意识轻微偏移
- 以手、书、木板、土地等物件回环人物命运
- 把胜利、失败、爱和死亡都写成克制的余波
anti_signature:
- 直接宣泄情绪或替人物做道德判词
- 用密集华丽比喻覆盖朴素动作
- 把冲突写成高声争吵和戏剧化反转
author_cross_ref: ''
style_card_by: Codex (executor)
