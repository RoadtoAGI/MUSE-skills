# Phase 2: 人物系统设计图 —— 《斯通纳》逆向分析
# 只记角色之间的关系，不记个体画像（个体画像见 characters/*.md）

cast_overview:
  protagonist: 威廉·斯通纳
  antagonist:
    - name: 伊迪丝·斯通纳
      domain: 家庭/私人生活
      mechanism: "冷暴力、空间侵占、以女儿为武器——不是恶意攻击，而是被创伤驱动的控制"
    - name: 霍利斯·劳曼克思
      domain: 职场/学术生活
      mechanism: "课程报复、权力碾压、以学生为棋子——不是私人仇恨，而是被背叛感驱动的防御"
  supporting_cast:
    - name: 阿切尔·斯隆
      function: "精神接生婆——唤醒斯通纳的灵魂，为他命名身份（'你想当老师——因为爱'），然后退场（死亡）"
    - name: 戴夫·马斯特思
      function: "预言者/镜像——精确预言斯通纳的一生（'你太弱了，你又太固执了'），然后在一战中无谓死去——示范了另一种'不属于这个世界'的命运"
    - name: 戈登·费奇
      function: "忠实的中间人——从不真正理解斯通纳，但始终在场。在劳曼克思冲突中充当缓冲，在临终时充当最后的陪伴者。代表'够用但不深刻'的友谊"
    - name: 凯瑟琳·德里斯科尔
      function: "灵魂镜像/真爱——唯一真正理解斯通纳的人。她的存在证明斯通纳有能力爱和被爱，她的离开证明世界不允许这种纯粹"
    - name: 格蕾斯·斯通纳
      function: "伊迪丝'战争'的战利品/受害者——从父亲的怀抱中被夺走，长大后用酗酒逃避被毁坏的人生。她是斯通纳最大的遗憾"
    - name: 查尔斯·沃尔克
      function: "导火索——他本身不重要，但他引爆了斯通纳与劳曼克思之间的核心冲突"

contrast_axes:
  axis_1:
    name: "面对世界的姿态"
    description: "三个朋友在同一维度上的三种选择"
    characters:
      斯通纳: "承受——不反抗也不逃避，只是继续存在"
      马斯特思: "看穿——用智识解剖世界，但自己也被世界消灭（战死）"
      费奇: "适应——不深刻但实用地周旋于体制中"

  axis_2:
    name: "爱的能力 vs 爱的恐惧"
    description: "斯通纳生命中的三个女性代表三种与亲密关系的姿态"
    characters:
      凯瑟琳: "能给予也能接受爱——但被外力摧毁"
      伊迪丝: "恐惧亲密——把爱转化为控制"
      格蕾斯: "曾经能爱（童年时与父亲的亲密）——但被母亲的战争毁坏，用酒精麻痹"

  axis_3:
    name: "对文学/知识的关系"
    description: "导师-弟子链条中的不同觉醒路径"
    characters:
      斯隆: "通过嘲讽保护自己对文学的热爱——用冷的外壳包裹热的内核"
      斯通纳: "通过沉默保护自己对文学的热爱——用被动包裹忠诚"
      劳曼克思: "通过残疾独自发现文学的自由——但这份发现太私密以至于暴露后变成攻击性"

relationships:
  power_dynamics:
    - "伊迪丝对斯通纳：她的权力来源是他的被动——'你永远不会离开我'。她不需要积极的力量，只需要他的惰性"
    - "劳曼克思对斯通纳：系主任对普通教授的制度性权力——课程分配、升职推荐。斯通纳无法反抗不是因为软弱，而是因为体制不提供反抗的工具"
    - "费奇作为中间人：先是同事，后升为院长——他的权力在于缓冲，而非主导"

  key_tensions:
    - "斯通纳-伊迪丝：不是爱恨交织，而是'无法离开也无法接近'的死锁。两人都在对方身上投射了自己无法面对的东西"
    - "斯通纳-劳曼克思：起初的精神共鸣（暖房聚会的深夜）使后来的决裂格外痛苦——他们本可以是最亲密的朋友，却变成最持久的敌人"
    - "斯通纳-凯瑟琳：唯一没有权力不对等的关系——两人是真正的平等相遇，这也是为什么这段关系最纯粹也最脆弱"
    - "伊迪丝-格蕾斯：母亲'夺走'女儿不是出于母爱，而是出于对丈夫的攻击——格蕾斯是战略工具，不是被爱的对象"

  potential_shifts:
    - "劳曼克思退休晚宴：二十年的宿怨以无言和解——劳曼克思致辞时斯通纳'听出了讽刺味，同时也懂得他在以自己的方式跟他说话'，经过时劳曼克思不转身——这是他们之间最深的理解时刻"
    - "伊迪丝临终：在死亡面前'酝酿出新的平静，就像爱情刚刚萌芽时的那种安静'——几十年的伤害在终极脆弱中消融"
