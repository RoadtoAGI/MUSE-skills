# Phase 0: 构想 —— 《斯通纳》逆向分析
# 约翰·威廉斯 (John Williams), 1965

premise: "如果一个密苏里农场的沉默男孩在大学课堂上被文学唤醒，将一生奉献给教学和学术，却在婚姻、职场和爱情中遭遇系统性的失败与剥夺——他的人生还有什么意义？"

core_value:
  positive: 忠于自我的爱（对知识、教学、真情的纯粹热爱）
  negative: 自我背叛（屈从外界期待而放弃内心真实渴望）
  spectrum:
    contradictory: 冷漠麻木（既不忠于自我也不主动背叛，只是停止感受）
    contrary: 世俗成功（在外部评价体系中获得认可，但未必忠于内心）
    negation_of_negation: 以爱之名的自我放弃（为保护所爱之人而放弃爱本身——斯通纳放弃凯瑟琳正是此层）

controlling_idea:
  value: 忠于自我的爱
  cause: 即便一生被世界剥夺、被他人误解，一个人只要始终保持对所爱之物的忠诚——哪怕这份忠诚从未被承认、从未获得回报——他就已经活过了真实的一生
  full_statement: "当一个人在死亡面前回望自己充满'失败'的一生，发现那些失败不过是平庸的、不重要的，因为他始终拥有爱的能力——对知识、对工作、对人——这种能力本身就是生命的意义。"
  type: ironic  # 表面是悲剧（失败的一生），实质是肯定（爱赋予生命意义）

genre:
  primary: 教育小说 (Bildungsroman) / 人生小说
  secondary: 学院小说 (Academic Novel)
  conventions:
    - setting: 大学校园——封闭的知识分子社会，有自己的权力结构和政治
    - characters: 学者、教授、学生——以智识生活为中心的人物群像
    - events: 学术争斗、婚姻危机、师生关系——在日常框架内展开的人生戏剧
    - values: 知识、真理、自我实现——与世俗成功（职称、声誉）的张力

originality_statement:
  unique_angle: "反英雄史诗——用描写国王的严肃性来写一个从未升到助理教授以上的普通人。开篇即交代主角一生的结局（死亡、默默无闻），然后在已知结局的框架下展开故事，使每个细节都获得悲剧性的张力。不是'失败者如何奋斗'，而是'失败本身是否构成一种值得度过的人生'。"
  cliches_to_avoid:
    - "逆袭叙事——斯通纳从未逆袭，他只是继续存在"
    - "苦难升华——小说不赋予苦难任何崇高意义"
    - "悔恨与和解的大团圆——临终的和解是平静的接受，不是释然的欢喜"

style_directives:
  - "零度叙事：第三人称全知视角，叙述者保持冰冷的克制距离，不评判不煽情"
  - "物件承载情感：关键情感时刻通过身体细节和物件传递（父亲泥污的手、松开的手指、临终握住的书）"
  - "时间的弹性：数年一笔带过与关键时刻的极度放慢交替进行"
  - "对称结构：开篇与结尾的意象呼应（手、书、阳光、刺痛感）"
  - "已知结局的框架：第一段已交代一生结局，后续叙事在'已知终点'中运行"

word_count: 约160000  # 中译本约16万字
