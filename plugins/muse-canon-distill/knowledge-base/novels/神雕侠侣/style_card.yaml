novel: 神雕侠侣
author: 金庸
lang: zh
translator: ''
narration_voice: 全知说书人随场轮入各人心声，驻足直评礼法人情，误会成因由叙述者整段补叙拆解
diction: 半文半白话本腔，招式经穴名目精确，诗词碑铭成句嵌入，情话直白如誓不绕弯
rhetoric_density: medium
dialogue_mode: 「某某道」高频归属，宣情誓言与斗口讥语承重场，群口插话作和声与节拍
pacing: 误会与危机层层加码不松手，武戏一招一拍，深情处以日升月落计时拉满再骤收
signature_moves:
- 误会剧引擎：放任错解发酵数场，再以整段倒叙补全成因链，让读者先于人物知情
- 当众宣情：把最私密的情感置于数百人大厅，以群体哗然反衬一往无前
- 武功名目即情感注脚：黯然销魂掌、君子淑女剑等招名自带主题与人物心境
- 借旁观者讲古塑人：风陵夜话式群口接力转述，主角缺席而传奇自立
- 情理正面对峙：礼法卫道者与至情叛逆者同场辩难，双方都给足道理
anti_signature:
- 限知单视角贴地到底——本作靠全知轮转与补叙拆误会，锁死视角即垮
- 武戏写成意象抒情流——他的战斗必须有招名、方位与力学因果
- 情话含蓄留白欲说还休——杨龙声口是直白誓言，绕弯即失味
author_cross_ref: 与射雕同享全知说书人与半文半白话本腔，但本作以误会剧和至情宣言为引擎，抒情浓度更高，武理考据让位于情感节拍。
style_card_by: claude-fable-5
