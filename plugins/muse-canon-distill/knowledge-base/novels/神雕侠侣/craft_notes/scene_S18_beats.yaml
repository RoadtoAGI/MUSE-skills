  dimension: omission
  original_move: 仪式只剩跪拜祝祷三动作，极简证明婚礼本质
  ai_default_failure: 补虽无红烛却更庄重的旁白
  transfer_rule: 违规仪式靠粗暴动作与庄重程式的张力
