patterns:
- pattern_id: S25-p1
  beat: 两鬓如霜
  dimension: omission
  original_move: 白发作不可伪造物证，借苏词盛放装不下的悲伤
  ai_default_failure: 写五句泪水滑落的情绪铺排
  transfer_rule: 时间的重量用身体痕迹呈现，身体不撒谎
  quote: 三根中倒有两根是白的
- pattern_id: S25-p2
  beat: 双足一登跃入深谷
  dimension: verb
  original_move: 登、飞、跃纯动作八字，殉情零秒犹豫
  ai_default_failure: 加崖边犹豫、回忆闪回与遗言
  transfer_rule: 等待已尽的决定不再写犹豫，否则否定等待
