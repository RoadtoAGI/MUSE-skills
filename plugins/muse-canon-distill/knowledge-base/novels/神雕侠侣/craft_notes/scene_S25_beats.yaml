- pattern_id: S25-p3
  beat: 甚么事不痛快了
  dimension: omission
  original_move: 重逢第一句是日常哄孩话，假装什么都没发生
  ai_default_failure: 写确认身份对白与十六年的痛哭宣泄
  transfer_rule: 越大的情感用越小的词装，轻轻一碰即可
  quote: 过儿，甚么事不痛快了？
overall_traits:
- 让身体沉默日常说话，不让情感直说
