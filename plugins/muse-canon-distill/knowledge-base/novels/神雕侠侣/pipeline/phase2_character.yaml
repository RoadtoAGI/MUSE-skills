# Phase 2: 角色系统设计图 —— 《神雕侠侣》逆向分析
# 只记角色之间的关系，不记个体画像（个体画像见 characters/*.md）

cast_overview:
  protagonist: 杨过
  co_protagonist: 小龙女
  antagonist: "多层对抗力量：礼教秩序（群雄唾弃师徒恋）> 金轮法王（武学对手）> 蒙古军（家国威胁）> 命运本身（情花毒、十六年分离）"
  supporting_cast:
    - name: 郭靖
      function: "精神导师/道德标杆——定义'侠之大者'的内涵，是杨过从叛逆到侠义的精神引力中心"
    - name: 黄蓉
      function: "智谋担当/母性控制者——对杨过既疏忌又护佑，'南海神尼'谎言是其控制欲与母性的矛盾产物"
    - name: 郭芙
      function: "宿命纠缠者/情感暗线——断臂事件的实施者，二十年排斥背后是'被忽视的爱'"
    - name: 郭襄
      function: "终幕视角人物/新一代的窗口——以'他者之眼'重新审视杨过，为《倚天屠龙记》埋种子"
    - name: 李莫愁
      function: "黑暗镜像——'如果杨过走向毁灭'的可能性人格化，同样因情受伤但选择了杀戮而非升华"
    - name: 金轮法王
      function: "武学终极对手——纯力量维度的天花板，与杨过构成'无情武学 vs 有情武学'的对比"
    - name: 公孙绿萼
      function: "'情是何物'主题的殉道者——以生命换解药，使杨过背负无法偿还的情债"
    - name: 黄药师
      function: "忘年交/武学传承者——亦正亦邪的性情中人，是杨过在主流武林外的精神盟友"
    - name: 洪七公
      function: "旧时代的见证者/武学遗产——传杨过打狗棒法，与欧阳锋同归于尽标志旧五绝终结"
    - name: 欧阳锋
      function: "杨过义父/'邪'的遗产——与郭靖构成杨过身上'正邪'双重烙印"
    - name: 一灯大师
      function: "慈悲化解者——一灯/瑛姑/周伯通的旧怨化解是杨龙团圆的'前代预演'"
    - name: 周伯通
      function: "武学标尺/喜剧缓冲——与杨过比武使黯然销魂掌获得完整展示"
    - name: 程英
      function: "隐忍型情感陪衬——'既见君子，云胡不喜'的无声之爱，衬托杨龙之情的不可替代"
    - name: 陆无双
      function: "泼辣型情感陪衬——与程英成对出现，展示'如果杨过没有遇到小龙女'的其他可能"
    - name: 耶律齐
      function: "正统婚恋参照系——门当户对的'正确'婚姻模式，衬托杨龙模式的反叛性"

# ── 对比轴 ──

contrast_axes:
  - axis: "情之走向：升华 vs 毁灭"
    characters: [杨过, 李莫愁]
    description: "二人皆因情受伤、被世界排斥。杨过将痛苦升华为侠义，李莫愁将痛苦降解为杀戮。全书的核心问题是：杨过会不会走上李莫愁的路？答案在第21-22回给出"

  - axis: "侠之定义：为国为民 vs 至情至性"
    characters: [郭靖, 杨过]
    description: "郭靖的'侠'是克己奉公、鞠躬尽瘁；杨过的'侠'是至情至性、率性而为。全书最终证明两者可以合一——但需要杨过走完从叛逆到觉醒的全程"

  - axis: "对杨过的态度：接纳 vs 排斥"
    characters: [郭靖, 黄蓉]
    description: "郭靖无条件接纳（'我把他当亲生儿子'），黄蓉有条件接纳（始终疏忌杨康基因）。这种父母式的分裂态度构成杨过成长中最核心的人际张力"

  - axis: "武学路径：有情 vs 无情"
    characters: [杨过, 金轮法王]
    description: "杨过融会百家、因情创招（黯然销魂掌以'情'为力量源泉），法王一门深入、以力破巧。最终对决证明'有情武学'胜过'无情武学'"

  - axis: "情感表达：过度表达 vs 过度压制"
    characters: [杨过, 小龙女]
    description: "杨过的问题是情感外溢（偏激、冲动），小龙女的问题是情感封冻（不悲不喜）。他们相互矫正，最终各自走向更完整的自我"

  - axis: "对杨过的爱：显性排斥/隐性爱慕 vs 显性崇拜"
    characters: [郭芙, 郭襄]
    description: "郭芙二十年排斥杨过，第39回才意识到那是爱慕（'迟到的领悟'）；郭襄初见即倾心，三枚金针毫不掩饰。姐妹二人是'情之自知'的正反面"

# ── 关系网与权力动态 ──

relationships:
  power_dynamics: |
    三层权力结构：
    1. 武林秩序层：全真教（正统）> 古墓派（异端）> 绝情谷（边缘）。杨过始终在主流秩序之外
    2. 家国层：郭靖（襄阳支柱）> 杨过（游侠）> 蒙古/金轮法王（外敌）。杨过的权力来自个人武力而非体制位置
    3. 情感层：小龙女对杨过有绝对的情感权力（每次出走都能瞬间瓦解杨过的行动力）；黄蓉对郭靖/郭芙有智谋层面的控制权
  key_tensions:
    - "杨过 vs 礼教秩序：师徒恋是否有错？全书用四十回证明无错"
    - "杨过 vs 郭靖：杨康之仇 vs 养育之恩——第21回'为国为民'是转折点，第40回'感恩之言'是完结点"
    - "杨过 vs 郭芙：断臂之仇 vs 隐秘之爱——唯一未被正面和解的关系，以'迟到的领悟'留白"
    - "杨过 vs 命运：情花毒/断臂/十六年分离——最强大的对手不是任何人，而是命运本身"
  potential_shifts:
    - "第14回中点反转：杨过从'被接纳'变为'被放逐'，所有关系重新洗牌"
    - "第21-22回道德觉醒：杨过与郭靖的关系从'潜在敌人'转为'精神传承'"
    - "第38回谷底重逢：杨过与小龙女的关系从'十六年缺失'转为'永恒'"
    - "第40回新五绝：杨过获得体制性认可（'西狂'），从秩序外的叛逆者变为秩序内的守护者"
