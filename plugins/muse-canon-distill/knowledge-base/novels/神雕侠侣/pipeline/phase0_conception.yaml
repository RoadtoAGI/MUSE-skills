# Phase 0: 构想 —— 《神雕侠侣》逆向分析

premise: "如果一个被遗弃的孤儿爱上了自己的师父，在礼教森严的江湖中坚持这份禁忌之爱，他将经历怎样的磨难，最终能否以'至情至性'超越命运的阻隔？"

core_value:
  positive: 至情（深情、忠贞、不离不弃）
  negative: 绝情（遗弃、背叛、礼教压制下的感情扼杀）
  spectrum:
    contradictory: 薄情（表面有情实则自保，如公孙止对裘千尺）
    contrary: 无情（超脱情感的冷漠，如小龙女初始的"不悲不喜"）
    negation_of_negation: 以深情之名行毁灭之实（李莫愁因爱生恨，以"情"为理由杀人满门——"问世间情为何物，直教生死相许"成为杀戮的伴奏曲）

controlling_idea:
  value: 至情至性的爱得以圆满，个人深情与家国大义最终合一
  cause: 主人公在每一个绝境中都做出"不顾一切"的选择——正因至死不渝的深情本性，他才在断肠崖纵身一跃而得以重逢，也因内心圆满而能无畏赴死、飞石退敌
  full_statement: "当一个人怀有至死不渝的深情并以此为行动之源时，他不仅能超越礼教与命运的阻隔而获得爱情的圆满，更能将个人情感升华为家国大义——因为真正的深情不使人软弱，而赋予人'精诚所至、金石为开'的力量。"
  type: idealistic  # 正面结局：爱情圆满 + 襄阳得保 + 新五绝确立

genre:
  primary: 武侠（爱情线为核心驱动力的武侠小说）
  secondary: 爱情传奇
  conventions:
    - setting: 南宋末年，蒙古南侵的历史背景；江湖门派林立，终南山/绝情谷/襄阳城为主要场域
    - characters: 孤儿英雄成长型主角；禁忌之恋的师徒关系；亦师亦父的精神导师（郭靖）；镜像反派（李莫愁——"如果杨过走向毁灭"的可能性）
    - events: 武林大会/比武、师徒恋情曝光遭世人唾弃、断臂后武功重塑、十六年生死离别、最终以一人之力扭转战局
    - values: 情与义的张力（个人深情 vs. 家国大义）；自由与礼教的对抗；正与邪标签的解构

originality_statement:
  unique_angle: "以'师徒禁忌之恋'为核心驱动力——在武侠类型中前所未有地将爱情线置于侠义线之上，并通过杨过的成长证明两者并非对立而是统一"
  cliches_to_avoid:
    - "正邪二元对立"——杨过师从欧阳锋（邪）却成为大侠，小龙女出身古墓（异端）却是全书最纯净的角色
    - "大侠必须克制私情"——杨过恰恰因为深情才成为大侠，黯然销魂掌以"情"为力量源泉
    - "武功决定一切"——最终决战中杨过以一块石头击杀蒙哥，而非以绝世武功

style_directives:
  - 全知视角灵活切换，以信息差制造戏剧反讽
  - 情感通过外化行为承载（掘坟、断臂、跳崖），极少内心独白
  - 古白话与文言糅合的武侠语体
  - 反复使用"分离-重逢"模式推进情感线（至少5次分离）
  - "给予希望再剥夺"的残酷叙事节奏（尤其第29-32回）
  - 对称结构：开篇华山（旧五绝之死）与结尾华山（新五绝确立）

word_count: 约970000字
