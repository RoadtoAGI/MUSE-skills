# Phase 1: 世界 —— 《神雕侠侣》逆向分析

setting:
  era: "南宋理宗年间（约1237-1260年代），蒙古灭金后南侵，南宋偏安江南"
  duration: "约二十余年（杨过少年至三十六岁），其中含十六年时间跳跃"
  location: "嘉兴南湖→桃花岛→终南山重阳宫/活死人墓→绝情谷→襄阳城→华山。地理跨度覆盖江南至西北"
  conflict_levels:
    internal: "杨过的身份焦虑（杨康之子的原罪）与情感渴望（被接纳 vs. 骄傲不允乞求）的撕裂"
    personal: "师徒禁忌之恋遭群雄唾弃；杨过与郭靖家族的三代恩怨（杨康之仇 vs. 养育之恩）"
    external: "蒙古南侵，襄阳城数度被围；江湖门派正邪对立的秩序压力"

world_rules:
  physical:
    - "内力是武功根基，决定一切招式的威力上限。同一招数因内力深浅效果天差地别"
    - "武功可逆练（欧阳锋逆练九阴真经），风险极大但可能产生异变效果"
    - "毒是超越武功等级的变量——冰魄银针、情花毒、绝情丹构成独立的'毒物经济学'"
    - "独孤求败剑学四境：利剑→软剑→重剑→木剑→无剑。'重剑无锋，大巧不工'是武学哲学的转折点"
    - "黯然销魂掌以情感为力量源——深情时威力极大，心境平和时反而无力。武功与情感直接挂钩"
    - "玉女素心剑法需男女二人心意相通方能施展，是'情'的武功化形式"
  social:
    - "师徒关系等同父子，僭越即为大逆不道——杨过爱上师父小龙女是全书核心禁忌"
    - "门派壁垒森严：各派武功不得互传，叛师出门即为江湖公敌"
    - "江湖恩仇有'约'的约束力：十年之约、十八日取首级之约、十六年断肠崖之约——'约'是推动叙事的定时装置"
    - "名号即身份：'赤练仙子''神雕大侠''西狂'等称号承载江湖地位与评价"
    - "正邪标签具有社会暴力：全真教弟子不分青红皂白将陌生人定义为'淫贼''妖人'"
    - "婚约世袭：郭杨两家'一男一女则结为夫妇'的世代约定仍有约束力"
  psychological:
    - "爱的偏执可致疯——武三通因何沅君出嫁而疯癫十年；李莫愁因爱生恨杀人满门"
    - "迁怒无限扩大——李莫愁在沅江毁六十三家货栈，'只因招牌上带了这个臭字（沅）'"
    - "父辈之罪延及子女——黄蓉因杨康之罪对杨过心存疏忌，贯穿全书"
    - "孤儿的骄傲是最后的盾牌——杨过宁死不求饶，宁饿不乞食"
    - "误会是情感毁灭的主要机制——小龙女至少因三次误会离开杨过（黄蓉之言、杨过谎称与郭芙定亲、'南海神尼'之约）"

genre_conventions:
  primary_genre: 武侠
  secondary_genre: 爱情传奇
  conventions:
    - convention: "英雄以武功征服江湖，最终成为武林领袖"
      planned_subversion: "杨过从未追求武林领袖地位，'西狂'之号来自他人追封；他以一块石头而非绝世武功终结战争"
    - convention: "大侠克制私情、以天下为重"
      planned_subversion: "杨过恰恰因为深情才成为大侠——黯然销魂掌以'情'为力量源泉，断肠崖跳崖的'至情'行为反而成就了重逢"
    - convention: "正派弟子必须恪守师门规矩"
      planned_subversion: "杨过叛出全真教、娶师父为妻、学遍正邪各派武功，却最终被公认为'侠之大者'"
    - convention: "反派必须被正面击败"
      planned_subversion: "李莫愁之死是自焚于情花丛中，边唱'问世间情为何物'——以悲剧收场而非被打败；金轮法王之死是被高台塌陷压入火中"
    - convention: "师徒恋情是禁忌、必须被纠正"
      planned_subversion: "全书始终不认为师徒之恋有错，最终以重阳宫拜堂、新五绝册封的方式给予最高肯定"

daily_life:
  - dimension: "江湖行旅"
    findings:
      - detail: "行走江湖常以客栈、庄园、寺庙为落脚点；换马、乔装是基本生存技能"
        story_implication: "杨过与陆无双百般乔装躲避李莫愁的情节依赖这一日常基础设施"
  - dimension: "武功修炼"
    findings:
      - detail: "修炼需长期闭关——古墓修炼数年、神雕谷修炼数年、断肠崖前苦等十六年"
        story_implication: "时间跨度大，故事中的'修炼期'既是成长也是分离"
  - dimension: "饮食与毒物"
    findings:
      - detail: "玉蜂蜜可解毒续命；寒潭白鱼可疗情花之毒；断肠草是以毒攻毒的解药"
        story_implication: "食物/毒物体系构成独立的叙事资源，多次成为情节转折的关键道具"

creative_constraints:
  - constraint: "师徒不可相恋的礼教禁忌"
    narrative_function: "构成全书核心冲突——没有这条禁忌，杨过与小龙女的爱情不会遭遇任何外部阻力"
  - constraint: "绝情丹仅有半枚，且掌握在反派手中"
    narrative_function: "解药的稀缺性驱动了第17-32回几乎所有的情节运动"
  - constraint: "十六年之约的时间锁"
    narrative_function: "制造全书最大的叙事断裂（时间跳跃），同时在读者心中埋下最深的悬念"
  - constraint: "杨过失去右臂"
    narrative_function: "不可逆的身体损伤终结了旧杨过，迫使他在武学和人格上完成质变——独臂反而成就了'重剑无锋'的境界"
