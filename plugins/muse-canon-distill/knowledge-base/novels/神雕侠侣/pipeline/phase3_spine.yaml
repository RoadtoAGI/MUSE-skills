# Phase 3: 脊椎 + Arc 框架 + 故事高潮 —— 《神雕侠侣》逆向分析

inciting_incident:
  description: "杨过叛出全真教，逃入活死人墓，被小龙女收为弟子——孤儿第一次获得归属，师徒关系从此绑定了他的命运"
  type: decision
  timing: "第5回（约全书12%处）"
  balance_before: "杨过在全真教受赵志敬虐待，无人关爱，孤立无援——但仍在'正常'的江湖秩序内"
  balance_after: "杨过获得师父、家园和情感纽带，但进入了与江湖主流完全隔绝的'异世界'（古墓）——此后一切磨难皆源于这个选择"
  impact_on_protagonist: "杨过从'被遗弃的孤儿'变为'被接纳的弟子'，获得了他毕生渴望的归属感。但古墓的封闭性和师徒关系的亲密性，注定了他日后的禁忌之恋"

desire_object:
  conscious: "与小龙女在一起——不被分离、不受礼教阻隔、不因身世/门派/世俗偏见而被拆散"
  unconscious: "被这个世界完全接纳——不仅是小龙女的爱，更是江湖社会对他这个'杨康之子''叛教弟子''师徒恋人'的认可。他真正需要的是：以真实的自己（而非被标签定义的身份）获得尊严"
  tension: "杨过以为只要找到小龙女就够了，但每次重逢后新的灾难都指向更深的问题：他必须在'侠'与'情'之间找到统一，才能真正获得内心的安宁"

spine_statement: "一个被遗弃的孤儿，为了与自己的师父相守，在礼教、仇恨、毒药和十六年生死离别的重重阻隔中，以至死不渝的深情一次次做出不顾一切的选择，最终证明真正的深情不是软弱而是力量"
spine_type: conscious

dramatic_question:
  question: "杨过与小龙女能否超越一切阻隔（礼教、仇恨、毒药、十六年分离）最终在一起？"
  obligatory_scene: "断肠崖重逢——十六年之约到期后，杨过必须与小龙女重新相见（或永远失去她）。第38回谷底重逢是对这个戏剧问题的最终回答"

opposing_forces:
  internal: "杨过对杨康之仇的执念（一度想刺杀郭靖）；骄傲导致的自我封闭；失去右臂后的绝望"
  personal: "礼教代言人（郭靖、全真教、群雄）对师徒恋的唾弃；黄蓉因杨康之罪对杨过的疏忌；郭芙的嫉妒与伤害（断臂、误射毒针）；公孙止/裘千尺对解药的操控"
  external: "蒙古南侵构成的家国压力；金轮法王作为武学对手的持续威胁；情花毒/绝情丹的物理限制（无解药则必死）"

# ── 幕/Arc 框架（从高潮回溯：故事需要几个重大逆转？）──

arcs:
  - arc_id: ARC-1
    name: "孤儿入墓"
    value_at_start: "孤绝（无父无母，被排挤被遗弃）"
    value_at_end: "归属（获得师父、武功、情感纽带）"
    climax_event: "杨过放下断龙石后又钻回墓中，甘愿与小龙女同生共死；小龙女破除誓言"
    function_note: "建置——确立师徒情感绑定"

  - arc_id: ARC-2
    name: "江湖扬名"
    value_at_start: "无名（江湖中的陌生少年）"
    value_at_end: "扬名（英雄宴上的功臣，获郭靖认可）"
    climax_event: "杨过与小龙女联手玉女素心剑法逼退金轮法王"
    function_note: "建置——杨过获得江湖地位，为下一Arc的坠落蓄势"

  - arc_id: ARC-3
    name: "礼教逐客"
    value_at_start: "被接纳（英雄宴扬名，郭靖欲嫁女结亲）"
    value_at_end: "被放逐（师徒恋情曝光，众叛亲离，心生仇杀之念）"
    climax_event: "小龙女当众宣言'我要做过儿的妻子'，赵志敬揭破，郭靖举掌欲杀——全书中点反转"

  - arc_id: ARC-4
    name: "绝情谷与襄阳"
    value_at_start: "仇恨与求药的双重困境"
    value_at_end: "道德觉醒但身体残缺（放弃刺杀、获精神成长，却失去右臂）"
    climax_event: "杨过城头飞身救郭靖'是我害了你，今日我和你死在一起'；随后郭芙斩断杨过右臂"

  - arc_id: ARC-5
    name: "蜕变与成婚"
    value_at_start: "残缺与绝望（断臂、小龙女重伤、天各一方）"
    value_at_end: "短暂的圆满（武功大成、拜堂成亲、以寒玉床疗伤）"
    climax_event: "杨过在重阳宫王重阳像前强行拜堂成亲——爱情战胜礼教"

  - arc_id: ARC-6
    name: "阶梯式劫难"
    value_at_start: "短暂的希望（古墓疗伤，看似即将痊愈）"
    value_at_end: "绝望深渊（小龙女跳崖，解药无望，十六年分离开始）"
    climax_event: "小龙女纵身跃下断肠崖，以'十六年后在此相会'的虚假约定保全杨过性命"

  - arc_id: ARC-7
    name: "神雕大侠与谷底重逢"
    value_at_start: "漫长等待（杨过已成大侠，但内心空缺）"
    value_at_end: "情感圆满（谷底重逢，十六年相思终了）"
    climax_event: "杨过在断肠崖纵身跳下，谷底花谷中与小龙女十六年后重逢"

  - arc_id: ARC-8
    name: "襄阳大战与新五绝"
    value_at_start: "家国危机（襄阳被围，城破在即）"
    value_at_end: "情义双全（爱情圆满 + 襄阳得保 + 新五绝册封）"
    climax_event: "杨过飞石击杀蒙哥大汗，蒙古军大溃，襄阳围解"

# ── 故事高潮设计（从结局回溯）──

story_climax_design:
  crisis:
    dilemma: "十六年之约到期，小龙女没有出现。杨过面对终极选择"
    option_a: "接受她已死的事实，继续活着（放弃深情，保全性命）"
    option_b: "纵身跳入断肠崖赴死（坚守深情，放弃生命）"
    character_revelation: "杨过没有犹豫——他选择跳崖。揭示了他的核心本质：至死不渝的深情。而正是这个'赴死'的选择反而成就了重逢——'精诚所至，金石为开'"
  climax:
    action: "双重高潮——(1) 谷底重逢小龙女（第38回）；(2) 飞石击杀蒙哥大汗（第39回）"
    value_change: { from: "绝望/分离/死亡", to: "圆满/团聚/新生" }
    controlling_idea_expression: "杨过以'至死不渝的深情'跳崖，在谷底找到小龙女；又因'内心圆满'而无畏赴死、飞石退敌——证明'真正的深情不使人软弱，而赋予人力量'"
  resolution:
    new_balance: "杨过获封'西狂'，与小龙女携手；新五绝确立；襄阳保全太平十三年；杨过对郭靖说出二十余年未说的感恩之言，三代恩怨彻底化解"
    lingering_feeling: "大喜中含大悲——杨过在最辉煌时刻'汗流浃背、暗自心惊'，想到若非郭靖引导可能误入歧途。'大醉而散'四字收束全书，既是快意宣泄，也暗含'天下没有不散的筵席'的苍凉"
