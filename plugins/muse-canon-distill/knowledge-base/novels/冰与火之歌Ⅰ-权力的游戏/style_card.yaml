novel: 冰与火之歌Ⅰ-权力的游戏
author: 乔治·R·R·马丁
lang: zh
translator: 谭光磊、屈畅
narration_voice: 多POV轮替的限知第三人称，每章贴一人感官与判断行文，叙述染其年龄身份滤镜，不越权直评
diction: 译笔文白相济：叙述书面雅驯杂文言成语，对白按身份分层——贵族庄语、市井俚骂、异域音译词
rhetoric_density: medium
dialogue_mode: 对白承担权谋交锋与信息揭示，归属高频用「某某道／说／问」，话里藏刀，要害处一句金句收口
pacing: 长卷铺陈（仪典、衣甲、谱系）与短句爆发（杀阵、转折）交替，章末必收紧成悬念或落一记重锤
signature_moves:
- POV滤镜叙事：同一事件按视角人物的认知偏差着色，孩童不识奸情、少女自带浪漫滤镜
- 感官锚定的仪式工笔：行刑、婚礼、火葬均按流程逐项铺陈，以气味、声响、触感压实临场
- 对白机锋落金句：权谋对峙以问答攻防推进，收在可独立引用的格言句（如权力的游戏没有中间地带）
- 意象贯穿回环：狼嚎、雨、碧蓝玫瑰、答应我等母题在场景间复现，承担情绪与伏笔双职
- 残酷急转：安稳铺陈后数句内完成死亡或背叛，不渲染慢镜，靠落差击打读者
anti_signature:
- 全知视角越过当前POV去解释他人内心或预告后事，就不像了
- 正邪分明的道德判词与英雄主义浪漫化，违背其人人有理、好人横死的冷酷质地
- 对白空转寒暄不载权谋或性格信息，或叙述用华丽辞藻自我陶醉而无感官实物
