# Phase 3: 脊椎 — 《冰与火之歌Ⅰ·权力的游戏》

# ── 注：本书为多线叙事，无单一主角。奈德·史塔克是全书政治主线的核心POV，
#    但脊椎分析需覆盖三条主线。以下以奈德线为主脊椎，丹妮线和琼恩线为辅脊椎。

# ═══════ 主脊椎：奈德·史塔克 / 君临权力线 ═══════

inciting_incident:
  description: 詹姆·兰尼斯特将布兰推下高塔——布兰目睹瑟曦与詹姆的乱伦，被灭口未遂
  type: accident  # 布兰的发现是意外，但詹姆的行动是决定
  timing: 第9章，约故事12%处
  balance_before: 临冬城的和平生活——奈德是受人敬重的北境守护，家庭完整，最大的烦恼是是否接受首相之职
  balance_after: 家族安全被打破——布兰昏迷、刺客随后行刺；凯特琳获得密信指控兰尼斯特谋杀前首相，奈德被迫南下追查真相
  impact_on_protagonist: 将奈德从"要不要参与权力游戏"的犹豫推入"必须参与以保护家人和揭露真相"的使命

desire_object:
  conscious: 查明琼恩·艾林的死因、揭露兰尼斯特家族的阴谋、保护劳勃和自己的家人
  unconscious: 证明荣誉和正义在这个世界仍然有效——即在权力的游戏中，正直的人可以按照自己的规则行事并获胜
  tension: 奈德追求的正义要求他揭露真相、按规则行事，但这个世界的真实规则是"权力来自刀剑而非纸张"。他的荣誉感使他不断选择"正确"而非"有效"的行动（提前警告瑟曦、拒绝蓝礼的夺权建议、信任小指头），每一次"正确"的选择都在加速他的毁灭

spine_statement: 一个正直的人被召唤进入一个腐败的权力中心，试图用荣誉的准则战胜阴谋，却发现荣誉本身就是他最大的弱点
spine_type: unconscious  # 奈德意识层面追查谋杀案，潜意识层面在验证自己的信仰体系

dramatic_question:
  question: 荣誉能否在权力的游戏中存活？
  obligatory_scene: 奈德必须面对一个无法用荣誉解决的终极困境——他在贝勒大圣堂的认罪与斩首回答了这个问题（第66章）

opposing_forces:
  internal: 奈德对莱安娜的承诺（暗藏的秘密）与他对"真相"的信仰之间的矛盾；他对劳勃友谊的忠诚与对劳勃堕落的失望
  personal: 瑟曦保护乱伦秘密的决心；小指头以友谊为面具的背叛；凯特琳的冲动行动（逮捕提利昂）加速冲突
  external: 兰尼斯特家族的军事和经济力量；宫廷的谎言网络（瓦里斯的情报、小指头的操控）；封建制度本身对荣誉者的结构性不利

# ═══════ 辅脊椎A：丹妮莉丝·坦格利安 / 海外觉醒线 ═══════

daenerys_spine:
  inciting_incident: 被韦赛里斯卖给卓戈卡奥换取多斯拉克骑兵（第4章）
  conscious_desire: 回到维斯特洛，夺回坦格利安王朝的铁王座
  unconscious_need: 成为一个真正的自我——不是韦赛里斯的附属品，不是卓戈的妻子，而是一个独立的、有能力改变世界的人
  spine_statement: 一个被当作筹码的少女在失去一切之后发现，真正的力量来自于走入火中的勇气
  dramatic_question: 丹妮莉丝能否从被交易的公主蜕变为拥有真正力量的女王？

# ═══════ 辅脊椎B：琼恩·雪诺 / 长城线 ═══════

jon_spine:
  inciting_incident: 作为私生子被迫选择加入守夜人——唯一"体面"的出路（第6-7章）
  conscious_desire: 在守夜人中找到归属和荣誉，摆脱私生子的耻辱
  unconscious_need: 理解"责任"的真正含义——不是逃避世俗（加入守夜人），而是面对更大的威胁（异鬼）
  spine_statement: 一个被社会排斥的私生子在世界的边缘发现了比身份更重要的使命
  dramatic_question: 琼恩能否超越"私生子"的标签，找到真正的自我？

# ═══════ 幕/Arc 框架 ═══════

arcs:
  - arc_id: ARC-1
    name: "临冬城的崩裂"
    value_at_start: "和平、家庭完整、北境的安宁"
    value_at_end: "家族分裂、布兰残疾、凯特琳南下、奈德被迫入局"
    climax_event: "刺客持瓦雷利亚钢匕首行刺布兰，冰原狼救主，凯特琳决定赴君临示警（第15章）"
    function_note: "建置弧——确立所有主要角色和冲突种子，打破初始平衡"

  - arc_id: ARC-2
    name: "暗流涌动"
    value_at_start: "史塔克家秘密调查兰尼斯特，双方暗中博弈"
    value_at_end: "凯特琳公开逮捕提利昂，暗斗变为明争"
    climax_event: "凯特琳在旅店当众逮捕提利昂·兰尼斯特（第29章）"
    function_note: "升级弧——政治冲突从暗线走向明线，不可逆地引爆两大家族对抗"

  - arc_id: ARC-3
    name: "真相与代价"
    value_at_start: "奈德拥有调查权力和国王信任"
    value_at_end: "奈德发现乔佛里血统真相，但劳勃已死，他成为阶下囚"
    climax_event: "小指头背叛，都城守备队屠杀奈德卫士，奈德被捕（第50章）"
    function_note: "灾变弧——奈德线的核心翻转，从权力巅峰跌入深渊。也是全书的中点"

  - arc_id: ARC-4
    name: "战火与处刑"
    value_at_start: "奈德入狱但尚有生还希望（认罪换穿黑衣）；罗柏南下可能扭转局势"
    value_at_end: "奈德被斩首，战争全面爆发，史塔克家族被永久改变"
    climax_event: "乔佛里违约下令处死奈德，艾莉亚在人群中目睹（第66章）"
    function_note: "高潮弧——全书的情感顶点和最大价值翻转。奈德之死回答了戏剧问题：荣誉在权力游戏中不能存活"

  - arc_id: ARC-5
    name: "灰烬中的新秩序"
    value_at_start: "毁灭之后的绝望与混乱"
    value_at_end: "三个新力量诞生——北境之王、龙母、守夜人的北征使命"
    climax_event: "丹妮莉丝走入火葬台，三条龙破壳而出（第73章）"
    function_note: "重生弧——从旧世界的废墟中诞生新的可能性，为系列后续卷奠基"

# ── 故事高潮设计 ──

story_climax_design:
  crisis:
    dilemma: 奈德在地牢中面对终极抉择——坚守荣誉（拒绝认罪，保全名节但女儿可能被杀）还是放弃荣誉（公开认罪，承认叛国以换取女儿的安全）
    option_a: 坚持真相，拒绝认罪——保全名节，但珊莎可能被杀
    option_b: 公开认罪——放弃一生信守的荣誉，但换取女儿的生命
    character_revelation: 奈德选择了B——当瓦里斯提到"珊莎的项上人头"，他的荣誉信念瞬间崩塌。这揭示了一个深层真相：他的荣誉不是他最深层的价值，父爱才是。但悲剧在于，他的妥协仍然无法拯救他——乔佛里违约斩首
  climax:
    action: 奈德在贝勒大圣堂当众认罪后，乔佛里违背所有人（包括母后瑟曦）的预期，下令伊林·派恩用奈德自己的巨剑"寒冰"将其斩首
    value_change:
      from: "荣誉者或可通过妥协求存"
      to: "在这个世界里，连妥协都无法拯救正直者——荣誉无法救他，放弃荣誉同样无法救他"
    controlling_idea_expression: |
      奈德之死是全书主控思想的最残酷表达：不仅"按规则行事的人会输"，甚至"接受失败、放弃原则试图求存的人也会输"。
      权力游戏的规则比任何人想象的都更无情——它不仅碾碎坚守者，也碾碎妥协者。
      而与此同时，丹妮在第73章走入火中获得龙，呈现了硬币的另一面：
      真正的重生需要的不是妥协，而是敢于赌上一切的行动。
  resolution:
    new_balance: |
      三个新的不稳定平衡：
      1. 罗柏被拥立为北境之王——北境独立，五王之战全面展开
      2. 丹妮成为龙母——三百年来首次有活龙出现，魔法回归世界
      3. 琼恩选择留在长城——莫尔蒙宣布大举越墙北进对抗异鬼
      旧秩序（劳勃的七国）已经崩溃，新秩序尚未形成——这是一个充满可能性也充满危险的过渡状态
    lingering_feeling: |
      悲壮与希望的复杂交织。读者为奈德的死亡感到愤怒和悲伤，同时被龙的诞生和北境独立所振奋——
      但这种振奋中带着不安，因为马丁已经证明了：在这个世界里，胜利和正义之间没有必然联系。
      "凛冬将至"不仅是史塔克家训，也是整部作品留给读者的最终预感。
