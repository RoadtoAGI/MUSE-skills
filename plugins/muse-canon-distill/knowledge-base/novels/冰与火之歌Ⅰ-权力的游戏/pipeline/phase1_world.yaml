# Phase 1: 世界 — 《冰与火之歌Ⅰ·权力的游戏》

setting:
  era: 架空中世纪——维斯特洛大陆"夏天的第九年"，类似欧洲中世纪但有独特的季节体系和消亡的魔法传统
  duration: 约一年（从夏末到冬季来临前夕）
  location: |
    三大地理空间并行：
    1. 维斯特洛南部（君临、三叉戟河、奔流城）——权力博弈的核心战场
    2. 维斯特洛北部（临冬城、绝境长城）——家族根基与超自然威胁
    3. 厄斯索斯（潘托斯、多斯拉克草原、维斯·多斯拉克）——流亡者的觉醒
  conflict_levels:
    internal: 荣誉与生存的撕裂（奈德）、恐惧与勇气的挣扎（丹妮、琼恩）、身份认同的危机（琼恩的私生子身份、丹妮从筹码到女王）
    personal: 史塔克vs兰尼斯特的家族仇杀、夫妻间的信任与欺骗（劳勃与瑟曦）、兄妹间的控制与反抗（韦赛里斯与丹妮）
    external: 七国王位争夺、多斯拉克对维斯特洛的威胁、异鬼从长城以北的入侵

world_rules:
  physical:
    - 季节运作不可预测——长夏可持续数年甚至数十年，严冬同样漫长，没人知道何时转换；"凛冬将至"既是物理事实也是精神警示
    - 绝境长城——八千年历史的冰墙，高七百尺，是人类世界与北方威胁的唯一屏障
    - 魔法已近乎消亡——龙灭绝数百年，异鬼被视为传说，但残余迹象（龙蛋、尸鬼、三眼乌鸦）暗示魔法正在回归
    - 瓦雷利亚钢——失传技术锻造的武器，极其稀有和锋利，同时是身份象征（寒冰剑、长爪）
    - 渡鸦通信系统——学士们通过训练渡鸦传递信息，速度远超骑手但可被截获
  social:
    - 封建等级森严——国王→御前首相→守护/公爵→封臣/骑士→平民→私生子；判决死刑者必须亲自执行（北方传统）
    - 联姻即政治——女性命运由婚约决定，贵族女孩十二三岁即被许婚；婚约可因当事人死亡而"转继"（凯特琳从布兰登转嫁奈德）
    - 养子/人质制度——贵族将子嗣送往他家是政治联盟的筹码，也是人质手段（席恩·葛雷乔伊）
    - 守夜人制度——终身服役、不婚不育、不参与世俗政治；理论上崇高，实际上沦为"接收全国各地人渣废物的垃圾场"
    - 私生子系统性歧视——冠特殊姓氏（雪诺、石东等），无继承权，不被正室接纳，唯一体面出路是守夜人
    - 宾客权利——接受主人面包和盐的客人受到保护，违反此规则是最大的禁忌
  psychological:
    - 荣誉观的南北分裂——北方"先民"传统崇尚沉默克己、言出必行；南方"安达尔人"文化更重仪式、更擅权术
    - 家族忠诚压倒个人意志——"我们遵循古老的传统"；个人的欲望、爱情、友谊都必须服从家族利益
    - 恐惧被当作弱点——"人唯有恐惧的时候方能勇敢"是少数例外，主流文化鄙视恐惧
    - 对超自然的集体否认——南方人视异鬼为"老奶妈的故事"，但北方人的潜意识中保留着原始恐惧（异鬼作为咒骂词存在于日常语言中）
    - 权力的真实信条——"在权力的游戏之中，你不当赢家，就只有死路一条"（瑟曦语）

genre_conventions:
  primary_genre: 史诗奇幻
  secondary_genre: 政治权谋
  conventions:
    - convention: 选定之人/预言英雄
      planned_subversion: 没有单一的"选定之人"——多条线并行，最像主角的人（奈德）第一卷即死；预言（"骑着世界的骏马"）以悲剧性方式落空
    - convention: 魔法系统驱动情节
      planned_subversion: 魔法被推至边缘——异鬼只在序幕和尾声出现，龙蛋在最后一章才孵化；前景完全由政治、军事和人性驱动
    - convention: 善恶阵营泾渭分明
      planned_subversion: 没有纯粹的善恶——奈德的荣誉导致家族灾难，瑟曦的残酷出于保护孩子，提利昂的善良与兰尼斯特阵营并存
    - convention: 英雄成长与凯旋
      planned_subversion: 战争英雄劳勃赢了王位却输了一切；正直的奈德在权力游戏中被碾碎；真正的"成长"发生在边缘角色身上（丹妮、琼恩）
    - convention: 流亡王子的复国之路
      planned_subversion: 流亡王子韦赛里斯是个可悲的暴虐庸才，被自己的盟友用熔金浇死；真正的复国力量来自被当作筹码的公主

daily_life:
  - dimension: 北方饮食与生存
    findings:
      - detail: 临冬城建在天然温泉之上，热水通过墙壁管道供暖，这是北方在严冬中生存的关键
        story_implication: 温泉赋予临冬城不可替代的战略价值，也暗示北方文明依赖自然的脆弱平衡
      - detail: 长城守夜人的伙食粗陋——黑面包、硬奶酪、咸肉
        story_implication: 守夜人的物质匮乏反映其社会地位的边缘化
  - dimension: 多斯拉克游牧文化
    findings:
      - detail: 卡拉萨（部落大军）随卡奥迁移，以马为生活中心——骑术是身份，马奶是饮品，马心仪式是最高荣誉
        story_implication: 丹妮必须融入马背文化才能获得权力基础，她的蜕变以骑术进步为外在标志
      - detail: 多斯拉克人不渡海——"马不能喝的水不值得信任"
        story_implication: 这条文化禁忌使卓戈的西征誓言格外震撼，也为其最终未能实现埋下伏笔
  - dimension: 宫廷礼仪与权力符号
    findings:
      - detail: 铁王座由征服者伊耿用龙火熔铸千把敌人之剑而成，坐上去会被割伤——"铁王座不让人舒服，伊耿的用意就是如此"
        story_implication: 权力的物理象征本身就是一个警告——统治是痛苦的、危险的
      - detail: 首相徽章（手形胸针）的授予与交还是权力转移的核心仪式
        story_implication: 奈德两次与首相徽章的关系（被迫接受、愤怒交出、被强行塞回）直接标记了他命运的三个阶段

creative_constraints:
  - constraint: 多POV视角的信息隔离——每个角色只知道自己所在空间发生的事
    narrative_function: 制造信息不对称——读者知道布兰为何坠楼，但奈德不知道；读者知道丹妮的龙蛋，但君临的人不知道。这种不对称是戏剧张力的核心来源
  - constraint: 魔法处于"将醒未醒"状态——龙蛋未孵化、异鬼刚出现、三眼乌鸦仅在梦中
    narrative_function: 允许第一卷以纯政治/军事叙事为主，将超自然元素留到系列后续卷爆发，建立"低魔→高魔"的渐进节奏
  - constraint: 核心角色可以死亡
    narrative_function: 打破读者的类型契约——当奈德被斩首，读者意识到没有人是安全的，此后每个角色的命运都充满真实的悬念
