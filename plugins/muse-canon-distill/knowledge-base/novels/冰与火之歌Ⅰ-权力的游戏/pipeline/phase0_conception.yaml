# Phase 0: 构想 — 《冰与火之歌Ⅰ·权力的游戏》

premise: "如果一个信仰荣誉的正直之人被卷入一个以背叛为通行证的权力游戏，他的荣誉将会拯救他还是毁灭他？"

core_value:
  positive: 权力（通过理解人性和把握时机获得的真实影响力）
  negative: 荣誉的幻觉（将道德准则等同于权力的致命错觉）
  spectrum:
    contradictory: 无力感（拥有荣誉却无法保护所爱之人）
    contrary: 妥协（放弃部分原则以求存活，如奈德被迫认罪）
    negation_of_negation: 以正义之名行暴政（乔佛里以"合法国王"名义处死奈德；凯特琳以"正义"之名逮捕提利昂引爆战争）

controlling_idea:
  value: 在一个由权力、暴力和背叛主导的世界里，荣誉不是护身符——它可以是最高贵的品质，也可以是最致命的弱点
  cause: 因为权力游戏的规则不承认道德优越性，而遵守规则的人往往是第一个被淘汰的人；真正的力量来自于对人性的理解和在绝境中仍敢行动的勇气
  full_statement: "在权力的游戏中，荣誉导致毁灭，因为正直者无法理解——更不愿参与——支配世界运转的欺骗与背叛；而真正的重生只属于那些失去一切后仍敢走入火中的人。"
  type: ironic  # 多线交织：奈德线悲观，丹妮线理想主义，整体为反讽——荣誉者死、无耻者兴、而全新的力量从灰烬中诞生

genre:
  primary: 史诗奇幻（Epic Fantasy）
  secondary: 政治权谋 / 宫廷阴谋（Political Intrigue）
  conventions:
    - setting: 架空中世纪封建社会，多王国并立，超自然元素在边缘潜伏
    - characters: 流亡王族、正直领主、阴谋家、骑士与战士、边境守卫
    - events: 王位争夺、家族战争、联姻政治、背叛与暗杀、超自然入侵
    - values: 荣誉 vs 权力、忠诚 vs 生存、家族 vs 个人、秩序 vs 混乱

originality_statement:
  unique_angle: |
    颠覆传统奇幻"善恶分明+英雄必胜"的叙事模式。通过多POV视角（9个）消解全知叙述者，
    让读者从不同立场理解每个角色的"合理性"；最核心的POV角色（奈德，15章）在第一卷即被处死，
    彻底打破"主角不死"的类型契约。魔法被推至背景（龙蛋、异鬼仅在首尾出现），
    前景是赤裸裸的人性博弈——权力来自刀剑而非正义。
  cliches_to_avoid:
    - "高贵血统即正义"（韦赛里斯是真龙传人却是暴虐的庸才）
    - "英雄凯旋后的荣耀统治"（劳勃赢了战争却输了和平，堕落为酒色之徒）
    - "公主等待拯救"（丹妮从政治筹码蜕变为龙母）
    - "忠诚即美德"（奈德的忠诚和荣誉恰恰是摧毁他的工具）
    - "善恶分明的阵营"（每个角色都在自己的规则框架内做出"合理"选择）
    - "魔法作为核心驱动力"（所有冲突的底层逻辑是权力、利益和人性弱点）

style_directives:
  - 多POV有限视角轮换，严格限于当前角色的所见所闻所想
  - 信息不对称驱动戏剧张力——读者通过交叉POV获取的信息远多于任何单一角色
  - 低魔幻前景+高魔幻背景——政治和人性在前，超自然在首尾和边缘
  - 颠覆性死亡——核心角色可以死，且死于叙事逻辑而非戏剧便利
  - 灰色道德——没有纯粹的善人或恶人，只有不同立场的选择
  - 预兆系统——象征物（冰原狼死于鹿角、三眼乌鸦、龙蛋）贯穿全书

word_count: 约163万字符（中译本）
