# Phase 2: 人物系统设计图 — 《冰与火之歌Ⅰ·权力的游戏》
# 注：本文件只记角色之间的关系（系统层），不记个体画像（声音、对白、弧光详见 characters/*.md）

cast_overview:
  # 本书无单一主角——8个POV角色构成多中心叙事网络
  # 以叙事功能而非"主角/配角"来定位每个角色

  protagonist_cluster:  # 三条主线的核心驱动者
    - name: 艾德·史塔克
      function: "君临政治线的悲剧核心——荣誉信仰在权力游戏中被碾碎的全过程"
    - name: 丹妮莉丝·坦格利安
      function: "海外觉醒线的蜕变核心——从被交易的筹码到龙母的独立崛起"
    - name: 琼恩·雪诺
      function: "长城线的成长核心——私生子在世界边缘发现比身份更重要的使命"

  antagonist_cluster:  # 对抗不是来自单一反派，而是一个系统
    - name: 瑟曦·兰尼斯特
      function: "直接对手——为保护乱伦秘密和子女权力不惜一切"
    - name: 培提尔·贝里席（小指头）
      function: "隐形操盘手——以友谊为面具的终极背叛者，推动了最关键的翻盘"
    - name: 乔佛里·拜拉席恩
      function: "不可控变量——少年暴君的任性碾碎了所有人的计算"
    - name: 泰温·兰尼斯特
      function: "幕后棋手——兰尼斯特家族力量的真正源头，极少出场但影响力无处不在"

  supporting_cast:
    - name: 凯特琳·史塔克
      function: "母亲/政治家——连接北境与君临两线的枢纽，冲动决策（逮捕提利昂）引爆全面冲突"
    - name: 提利昂·兰尼斯特
      function: "跨阵营的道德灰色地带——兰尼斯特家的异类，以智谋在夹缝中求存，既是敌对阵营成员又赢得读者同情"
    - name: 布兰·史塔克
      function: "激励事件的承载者 + 超自然线索的窗口——坠楼启动全书因果链，三眼乌鸦暗示更大的命运"
    - name: 珊莎·史塔克
      function: "幻想破灭的见证者——天真少女在暴政下的痛苦觉醒，体现权力对无辜者的碾压"
    - name: 艾莉亚·史塔克
      function: "反叛与生存的化身——拒绝顺从的少女，父亲之死的目击者，走向复仇之路"
    - name: 劳勃·拜拉席恩
      function: "堕落的英雄——战争赢家/和平输家，他的死引爆权力真空"
    - name: 罗柏·史塔克
      function: "新一代领袖的诞生——少年军事天才，被拥立为王但被战争绑定"
    - name: 詹姆·兰尼斯特
      function: "行动的催化剂——推布兰、截杀奈德护卫、被俘——每次出场都改变格局"
    - name: 乔拉·莫尔蒙
      function: "丹妮的守护者和现实之声——流亡骑士，兼具保护者和（隐藏的）间谍双重身份"
    - name: 山姆威尔·塔利
      function: "琼恩的镜像——恐惧中的勇气，智识vs武力，证明守夜人需要多元能力"
    - name: 桑铎·克里冈（猎狗）
      function: "系统内的异见者——服务于暴政体系但保留了人性残余，珊莎线中的暗色保护者"

# ═══════ 对比轴 ═══════

contrast_axes:
  - axis: "荣誉 vs 权术"
    characters: [艾德·史塔克, 培提尔·贝里席]
    description: |
      同一场景（第50章政变）中的对比：奈德手握遗嘱按法理行事，小指头用匕首按现实行事。
      奈德相信"规则"，小指头相信"力量"。结果：规则被撕碎，力量获胜。
      两人对凯特琳的不同态度揭示了对比的根源——奈德以忠诚赢得她，小指头以操控试图得到她。

  - axis: "责任 vs 自由"
    characters: [琼恩·雪诺, 丹妮莉丝·坦格利安]
    description: |
      琼恩被送往长城（被社会排斥后的唯一出路），丹妮被卖给卓戈（被兄长当作筹码）。
      两人都从"被迫的处境"中主动选择了使命——琼恩选择留在长城面对异鬼，丹妮选择走入火中获得龙。
      关键差异：琼恩的选择是放弃（放弃南下复仇），丹妮的选择是赌上一切（走入火中）。

  - axis: "理性 vs 激情"
    characters: [凯特琳·史塔克, 瑟曦·兰尼斯特]
    description: |
      两个母亲，同样为保护孩子而战。凯特琳在第72章用理性论证议和被激情碾压；
      瑟曦在第50章用激情（撕毁遗嘱）碾压奈德的理性（法理遗嘱）。
      两人的冲动行为（凯特琳逮捕提利昂、瑟曦谋害劳勃）都出于母爱，但后果截然不同。

  - axis: "面具 vs 真相"
    characters: [提利昂·兰尼斯特, 珊莎·史塔克]
    description: |
      提利昂用嘲讽和智慧做面具，隐藏内心的伤痛和善良——"永远不要忘记自己是谁，用它来武装自己"。
      珊莎用骑士故事和公主幻想做面具，直到现实将面具撕碎——从"乔佛里会成为好国王"到被迫观看父亲人头。
      提利昂主动戴上面具以求存，珊莎被动失去面具后必须学会新的生存方式。

  - axis: "服从 vs 反叛"
    characters: [珊莎·史塔克, 艾莉亚·史塔克]
    description: |
      姐妹在同一个家庭中走向截然相反的道路：珊莎顺从（嫁给王子、做淑女、听从安排），
      艾莉亚反叛（学剑、穿男装、杀人逃亡）。两人都在父亲死后被迫独立生存，
      但珊莎的武器是忍耐和外交，艾莉亚的武器是缝衣针和愤怒。

  - axis: "新秩序 vs 旧秩序"
    characters: [罗柏·史塔克, 劳勃·拜拉席恩]
    description: |
      罗柏是劳勃的镜像——年轻的战争天才，被拥立为王。但劳勃赢了战争输了和平，
      凯特琳看着罗柏说"他真正的新娘是那把剑"——暗示罗柏可能重蹈覆辙。
      劳勃的堕落是"英雄之后"的警示，罗柏的崛起是"英雄之前"的希望与危险。

# ═══════ 关系网络 ═══════

relationships:
  power_dynamics: |
    全书权力动态可分为三个层级：

    【铁王座层】
    劳勃 → 瑟曦（名义夫妻，实质敌对）→ 乔佛里（傀儡→暴君）
    奈德 ← 劳勃（友谊调用）→ 小指头（利用）→ 瑟曦（交易）
    泰温（幕后）→ 詹姆 + 瑟曦 + 提利昂（三个棋子，各有不同的利用价值）

    【北境层】
    奈德 → 凯特琳（婚姻联盟，深厚情感）→ 罗柏（继承者）
    凯特琳 ←→ 莱莎（姐妹纽带，但莱莎已不可信赖）
    奈德 → 琼恩（父子但有隐藏的秘密）→ 守夜人体系

    【海外层】
    韦赛里斯 → 丹妮（控制/出卖）→ 卓戈（联姻工具→真实情感）
    伊利里欧 + 瓦里斯（暗中操控坦格利安复辟线）
    乔拉（保护者 + 隐藏的间谍身份）

  key_tensions:
    - "奈德 vs 小指头：信任与背叛——奈德信任小指头是全书最致命的误判"
    - "凯特琳 vs 提利昂：错误的指控——小指头的匕首谎言将两个本不该为敌的人推向对立"
    - "丹妮 vs 韦赛里斯：控制与觉醒——妹妹超越哥哥的蜕变过程"
    - "琼恩 vs 艾里沙·索恩：制度性压迫——代表守夜人体系对'异类'的排斥"
    - "珊莎 vs 乔佛里：幻想与现实——从期待的婚姻到实际的囚禁"
    - "提利昂 vs 泰温：父子的永恒对抗——泰温视提利昂为家族耻辱，提利昂渴望被承认"

  potential_shifts:
    - "提利昂从'被指控的凶手'到'代理首相'——身份的急剧翻转预示他在后续卷中的核心角色"
    - "珊莎从'天真公主'到'政治人质'——被迫学习她曾鄙视的生存技能"
    - "艾莉亚从'叛逆少女'到'杀手雏形'——第一次杀人后走上不归路"
    - "罗柏从'少年继承人'到'北境之王'——被战争加冕也被战争绑定"
    - "乔拉的双重身份——间谍与守护者的张力将在后续卷爆发"
