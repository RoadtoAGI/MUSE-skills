novel: 你好，旧时光
author: 八月长安
lang: zh
translator: ''
narration_voice: 限知贴身回望，成人旁白轻点成长规则
diction: 校园日常口语混童年幻想和流行文化词
rhetoric_density: medium
dialogue_mode: 对白短而克制，未说之意交给旁白补足
pacing: 小事件细拆，情绪拐点后留白回环
signature_moves:
- 把儿童幻想当真实战场写，再用成人现实轻轻打断
- 用旧物、食物、歌名、动画名保存人物关系
- 先写误会和羞耻，再让温柔在结尾后置出现
- 用简短对白确认关系，把深情藏进动作和沉默
- 让成长节点与回忆物件循环呼应
anti_signature:
- 不要用大段抒情直接宣告青春疼痛
- 不要让人物把心理动机一次说透
- 不要把校园冲突写成单纯胜负爽点
author_cross_ref: ''
style_card_by: Codex (executor)
