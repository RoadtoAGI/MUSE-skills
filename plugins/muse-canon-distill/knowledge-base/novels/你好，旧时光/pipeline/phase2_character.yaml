# Phase 2: 角色系统设计图
# 只记角色之间的关系，个体画像在 characters/*.md 中

cast_overview:
  protagonist: 余周周
  antagonist: >
    无单一对手。对抗力量是结构性的——"私生女"身份在社会中激起的连锁排斥。
    辛锐是最接近传统对手的角色，但她的对抗来自于被帮助后产生的嫉妒，
    本质上是主角善意的"副产品"而非独立的恶意。
  supporting_cast:
    - name: 林杨
      function: "情感锚点——从幼儿园到高三的长情见证者，是余周周'被无条件爱着'的物证"
    - name: 陈桉
      function: "精神导师——在每个关键节点提供方法论（'你到底相信谁''主角游戏'），但自身也有创伤"
    - name: 辛美香/辛锐
      function: "镜像角色——余周周善意的接收者和反面验证者，证明'帮助'不一定带来'感恩'"
    - name: 温淼
      function: "日常伙伴——提供轻松幽默的日常质感，也是唯一预言辛美香危险的人"
    - name: 凌翔茜
      function: "平行成长线——从'完美女生'到'被击碎后重新站起来'，与余周周形成对照"
    - name: 米乔
      function: "生命力的象征——用极度张扬的短暂生命映衬'活着'的珍贵"
    - name: 奔奔/慕容沉樟
      function: "童年的连接——从幻想时代延续到现实时代的唯一纽带，证明'过去'不会消失"
    - name: 余妈妈
      function: "沉默的爱——用行动而非言语表达的母爱，她的去世是全书最大的延迟揭示"
    - name: 外婆
      function: "时间的标尺——从清醒到老年痴呆的衰变映射时间的不可逆"
    - name: 余乔
      function: "保护者——在余周周最脆弱的童年充当盾牌，也是'叛逆但本质善良'的范例"
    - name: 郑彦一
      function: "梦想的出走者——放弃安全选择追逐漫画梦的勇气，呼应'主角游戏'的主题"
    - name: 沈屾
      function: "尊严的标杆——因拒绝被施舍而选择普高，与辛美香形成对照（同样贫寒但选择不同）"

contrast_axes: >
  本书的角色对比不是简单的二元对立，而是围绕同一核心命题——
  "面对不公和困境，如何自处？"——展开的多种回应方式：

  1. **余周周 vs 辛美香/辛锐**（核心对比轴）：
     同样是底层出身、被家庭/身世伤害的女孩。
     余周周选择"主动重新开始"（放弃师大附中），辛锐选择"向上攀附再报复"。
     余周周的痛苦外化为自我隔离（推开林杨），辛锐的痛苦外化为伤害他人（陷害凌翔茜）。
     关键差异：余周周有陈桉作为精神支柱，辛美香只有余周周——
     当唯一的支柱也成为嫉妒对象时，辛锐的世界就塌了。

  2. **余周周 vs 凌翔茜**（平行对比）：
     一个从底层出发向上证明自己，一个从顶端出发试图维持完美。
     两人最终在同一个位置汇合——都失去了保送资格，都在毕业典礼上释然。
     凌翔茜的崩溃（被陷害后独自游荡全城）映射了余周周童年的崩溃（被排斥后主动断交）。

  3. **林杨 vs 陈桉**（对余周周的两种爱）：
     林杨是无条件的等待——他不给余周周方向，只给她"我在这里"的确认。
     陈桉是有引导的陪伴——他给余周周方法论，但最终会离开。
     余周周需要的是先从陈桉那里获得独立的能力，然后才能接受林杨的爱。

  4. **辛锐 vs 沈屾**（同样贫寒的两种选择）：
     沈屾因尊严拒绝姑姑资助，选择读普高——痛苦但自洽。
     辛锐接受余周周的帮助但无法消化"被帮助"的屈辱——最终走向自毁。
     "久负大恩必成仇"在辛锐身上完整应验，在沈屾身上被她用拒绝来规避。

  5. **米乔 vs 余周周**（面对命运的两种态度）：
     米乔知道自己会死，选择把每一天活成狂欢节（贴艾弗森海报、cosplay、当"军师"）。
     余周周不知道幸福何时消失，选择用克制和防御来"省着用"幸福。
     米乔的死让余周周明白：生命不能"省着用"，要"Fly free"。

relationships:
  power_dynamics: >
    本书的权力结构是成人世界对儿童世界的单向压制——
    家长（林杨妈妈、蒋川妈妈）掌握信息网络和社交规则，
    孩子只能在成人划定的边界内尝试建立真实的关系。
    这种权力不对称随年龄增长逐渐消退：
    小学时完全被家长控制 → 初中开始有自主空间 → 高中基本独立。
    到了高中，权力关系转为同龄人之间的竞争（名次、保送名额），
    辛锐对凌翔茜的陷害本质上是一种"底层对精英的逆向暴力"。

  key_tensions:
    - "余周周与林杨之间的'推-拉'张力——她反复推开他（保护自尊），他反复回来（无条件的爱）"
    - "余周周与辛美香之间的'恩-仇'张力——帮助带来了感激也带来了嫉妒，两者同时存在不可分割"
    - "凌翔茜与辛锐之间的'明-暗'张力——凌翔茜是明面上的完美（校花/年级第一），辛锐是暗处的观察者和觊觎者"
    - "余周周与陈桉之间的'依赖-独立'张力——她需要从他那里毕业，但总在最脆弱的时候找他"

  potential_shifts:
    - "辛美香→辛锐的身份转变是全书最大的关系逆转——从沉默感恩者到主动施害者"
    - "凌翔茜从余周周的'对手'（童年挑衅）变为'同路人'（高中并肩）——她们在毕业典礼上作为护旗手站在一起"
    - "林杨从'被保护的小皇帝'成长为'主动等待的守候者'——权力关系在高中完全反转"
