setting:
  era: "1993-2008年，主体为1993-2005年（余周周6岁至高中毕业）"
  duration: "约15年，跨越幼年、小学、初中、高中至大学"
  location: >
    中国北方省会城市（未具名），具体场景包括：
    大杂院（幼年）、外婆家/大学家属区（小学）、师大附小、
    北江区十三中（初中）、振华中学（高中）。
    辅助场景：少年宫、冰雪游乐场、师大天桥、美香食杂店、泰国普吉岛。
  conflict_levels:
    internal: >
      幻想世界与现实世界的拉扯——余周周用角色扮演作为心灵防御机制，
      但每一次成长都迫使她放弃一层幻想的保护壳。
      自我认同的核心困境：私生女身份是否定义了她的价值？
    personal: >
      与林杨反复的分离与重逢（家长阻隔→主动断交→重逢→拒绝→接纳）；
      与辛美香/辛锐从恩人到仇人的关系演变；
      与陈桉从依赖到告别的精神成长线；
      家庭关系中妈妈的辛劳、外婆的衰老、亲戚的势利。
    external: >
      升学制度的结构性不公（户口决定升学权利、奥数绑架教育、关系决定机会）；
      "私生女"身份在家长社交圈中的烙印效应——一个母亲的信息足以切断孩子的友谊；
      阶层差距的无声压力（省政府大院家庭 vs 单亲推拿师家庭）。

world_rules:
  physical:
    - "90年代中国城市化进程中的北方城市——大杂院正在拆迁，老城区向新城区过渡"
    - "冬季漫长寒冷，冰雪是重要的叙事场景（初雪、雪仗、冰滑梯、冰雪游乐场）"
    - "物质生活逐渐改善但仍有明显匮乏感——一排四个的'喜乐'饮料是珍贵的礼物"
  social:
    - "家长圈是隐形的权力网络：蒋川妈妈、林杨妈妈、凌翔茜妈妈构成信息共同体，一条八卦足以改变孩子们的社交版图"
    - "升学制度层层设卡：小升初看户口和奥数，中考看分数和协议，高考看保送和自主招生——每一道关卡都有明规则和暗规则"
    - "'好学生'是一种社会身份，不仅是成绩标签，更是获取资源和尊重的通行证"
    - "私生女身份是社会性原罪——不是法律问题，而是家长们用来'保护'自己孩子远离'不正经人家'的理由"
  psychological:
    - "孩子用幻想/角色扮演来处理无法理解的成人世界问题——被打时假装自己在战斗，被孤立时假装自己在执行秘密任务"
    - "'别人家的孩子'比较文化贯穿始终——余婷婷的小红花、沈屾的满分、凌翔茜的完美"
    - "表面坚强的孩子往往内心最脆弱——余周周的冷静微笑、辛美香的沉默、温淼的懒散，都是不同形式的防御面具"
    - "'久负大恩必成仇'——温淼父亲的这句话精准预言了辛美香与余周周的关系走向"

genre_conventions:
  primary_genre: 成长小说
  secondary_genre: 青春文学
  conventions:
    - convention: "校园生活作为成长的舞台"
      planned_subversion: >
        不以单一校园为固定舞台——余周周跨越大杂院、师大附小、十三中、振华四个空间，
        每次空间转换都是一次自我重塑。"主角游戏"的核心就是：换一个没人认识你的地方重新开始。
    - convention: "初恋是青春故事的核心驱动力"
      planned_subversion: >
        林杨对余周周的爱情线长达十余年，但从不充当叙事主动力。
        余周周的成长核心是自我认同而非爱情，林杨更像是"见证者"和"等待者"，
        而非推动情节的力量。最终的"To be continued"不是告白，而是对整段关系的释然与开放。
    - convention: "反派对手制造核心冲突"
      planned_subversion: >
        没有真正的反派——辛锐是被余周周帮助过的人变成的"仇人"，
        凌翔茜从最初的"冷嘲热讽者"成长为"同病相怜者"，
        甚至于老师这样的"坏老师"也有其人性的复杂性。
        最大的对抗力量不是某个人，而是"身世"这个结构性不公。
    - convention: "导师型角色提供成长指引"
      planned_subversion: >
        陈桉是精神导师，但他自己也是有创伤的人（母亲私奔后车祸去世、被父亲再婚家庭收养）。
        他给余周周的最大帮助不是答案，而是一个提问："你到底相信谁？"
        谷老师更是在去世后才通过遗愿继续影响余周周。导师是会消失的——这本身就是成长的一部分。

daily_life:
  - dimension: 娱乐与流行文化
    findings:
      - detail: "90年代初看《魔神英雄传》《白眉大侠》《圣斗士星矢》，后期看《美少女战士》《灌篮高手》《流星花园》"
        story_implication: "动画片/流行文化标记成长阶段，也是余周周幻想世界的素材库——幻想内容的变化映射她的心理成长"
      - detail: "租书屋是青少年的社交据点，《十七岁不哭》《花季雨季》是同龄人的共同语言"
        story_implication: "余周周在十三中报到日捡到的《十七岁不哭》成为她与辛美香破冰的媒介"
  - dimension: 教育与升学
    findings:
      - detail: "小学有奥数班（半强制）、英语班；中考分数线决定去重点还是普通学校；高中有自主招生和保送名额竞争"
        story_implication: "升学制度的每一道关卡都是叙事的压力源——奥数失败迫使余周周另寻出路，保送名额竞争激发辛锐的嫉妒"
      - detail: "小红花、大队长、三道杠——小学的荣誉体系是微型权力场"
        story_implication: "余周周获得第一朵小红花是关键的价值翻转点，标志她走出最低谷"
  - dimension: 家庭经济
    findings:
      - detail: "余周周妈妈从做推拿到卖化妆品，自行车后座是余周周的移动基地"
        story_implication: "经济拮据是余周周被歧视的物质基础——她买不起同学录、没有奥数班学费、连一排喜乐饮料都是奢侈"

creative_constraints:
  - constraint: "主角的幻想世界必须随成长逐渐退场"
    narrative_function: "幻想的退场即成长的进程——从美好之一的沉浸式角色扮演，到美好之二的'画画扮演命运'，到美好之四的彻底告别，形成清晰的弧线"
  - constraint: "身世真相不能由主角主动揭示，必须通过他人泄露"
    narrative_function: "余周周从不主动提起父亲——身世是被蒋川妈妈、周沈然、辛锐等人一次次从外部撕开的，强化了被动受伤的感觉"
  - constraint: "妈妈的死亡不能在发生时叙述，必须事后揭示"
    narrative_function: "美好之七·6才揭示妈妈和齐叔叔已因车祸去世——这个延迟揭示制造了巨大的情感冲击，也解释了余周周高中时期的独立与孤寂"
