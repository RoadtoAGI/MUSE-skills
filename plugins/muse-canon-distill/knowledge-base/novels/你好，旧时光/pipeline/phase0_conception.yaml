premise: "如果一个私生女从小用动画片和角色扮演来对抗现实的残酷，当幻想一次次被现实击碎后，她能否找到超越幻想的真实力量？"

core_value:
  positive: 生命的丰盛与自由（真实地活着）
  negative: 自我否定与困顿（被身世和幻想困住）
  spectrum:
    contradictory: 虚假的坚强（用幻想伪装的自信，实为逃避）
    contrary: 麻木随波逐流（放弃挣扎，接受"私生女就该低头"的命运）
    negation_of_negation: 以坚强之名拒绝一切真实情感（如辛锐——用努力和成功掩盖内心的空洞，谁都不妒忌谁都不喜欢）

controlling_idea:
  value: 生命的丰盛与自由
  cause: 因为主角选择直面每一次失去与不公，用真实的勇气而非幻想来回应世界
  full_statement: "当我们不再用幻想逃避现实，而是以真实的内心力量直面生活的残酷与不公时，生命虽不完美，却过分美丽。"
  type: idealistic

genre:
  primary: 成长小说（Bildungsroman）
  secondary: 青春文学
  conventions:
    - setting: 中国北方省会城市，1990年代末至2000年代中期的校园与家庭
    - characters: 有创伤但不屈服的主角、长情的青梅竹马、精神导师式的年长者、因嫉妒走向歧途的友人
    - events: 升学考试、家庭变故、童年友谊的分离与重逢、初恋的漫长等待
    - values: 自我认同、归属感、成长的代价

originality_statement:
  unique_angle: >
    用动画片角色扮演（《魔神英雄传》《美少女战士》《灌篮高手》）作为童年心灵防御机制的核心意象，
    将成长叙事编织进90年代-00年代中国特有的流行文化纹理中。
    幻想不是简单地被"抛弃"，而是从童年的逃避机制进化为成年的内心力量——
    "她永远不会放弃她的雅典娜"。
  cliches_to_avoid:
    - "避免了青春小说常见的狗血三件套（堕胎/车祸/出国），死亡是在后半段才揭示的，且处理极其克制"
    - "没有用爱情作为成长的唯一驱动力——林杨的爱是线索之一，但余周周的成长核心是自我认同"
    - "反派不是脸谱化的坏人——辛锐的嫉妒有完整的心理成因，凌翔茜从'对手'成长为'同路人'"

style_directives:
  - "温暖怀旧但不滥情的叙事语调"
  - "以'美好之X'反讽命名的章节结构——每一章的'美好'标题下都藏着创伤"
  - "频繁嵌入90年代流行文化引用（动画片、港台歌曲、《流星花园》），作为时代标记和情感锚点"
  - "双层叙事：外层是校园日常，内层是余周周的幻想/内心世界"
  - "以物件承载情感——铁皮饼干盒、红气球、喜乐饮料、自制连环画"

word_count: 约51万字
