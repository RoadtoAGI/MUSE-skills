# Phase 5: 关键场景
# 51万字长篇，提取 18 个关键场景节点（结构转折点、高潮、关键建置场景）

sequence_expansions:
  # ── ARC-1: 幻想的建立与崩塌 ──

  - seq_id: ARC1-SEQ1
    scenes:
      - scene_id: S01
        arc_id: ARC-1
        location: 大杂院小屋
        time: "1993年初春，余周周六岁"
        participants: [余周周]
        pov: 余周周
        conflict: 孤独的现实 vs 丰盛的幻想
        value_start: 孤独（独自在家）
        value_end: 充盈（在幻想中她是英雄、是西米克、是大魔王）
        must_include: >
          建立余周周"一人分饰多角"的核心机制——
          含水装吐血、用外婆输液瓶当圣水、从死去的英雄变成哭泣的西米克再变成大魔王。
          妈妈路过门口说"正在犯病"。
        handoff: 引出奔奔的出场（下一节"圣蛋"事件）
        source_chapter: "美好之一·1（余周周小朋友的个人秀第一幕）"

      - scene_id: S02
        arc_id: ARC-1
        location: 大杂院 → 外婆家
        time: "约1994年，余周周七岁"
        participants: [余周周, 奔奔]
        pov: 余周周
        conflict: 离别的不可逆 vs 孩子的无力
        value_start: 温暖（与奔奔在雨后彩虹下和解）
        value_end: 失去（搬家离别，奔奔说"你一定能成为特别了不起的人"）
        must_include: >
          彩虹下和解、奔奔的期许、第一段真实友谊的终结。
          "了不起的人"成为贯穿全书的伏笔。
        handoff: 余周周进入外婆家和学校的新世界
        source_chapter: "美好之一·6（芳草碧连天）"

  - seq_id: ARC1-SEQ2
    scenes:
      - scene_id: S03
        arc_id: ARC-1
        location: 师大附小教室 → 放学路
        time: "约1995年，一年级"
        participants: [余周周, 林杨, 于老师]
        pov: 余周周
        conflict: 在学校被彻底碾碎的自尊 vs 林杨无条件的善意
        value_start: 绝望（拼音40分/作业被撕/被罚/被抓——最黑暗的一天）
        value_end: 被温暖（林杨在夕阳下亲了她的脸颊，提议一起回家）
        must_include: >
          余周周一天内遭受四重打击的累积效应；
          林杨在值周生面前为她解围；
          放学后林杨的脸颊亲吻——简单、冲动、纯粹。
        handoff: 建立每日同行回家的默契，为后来的断交铺设情感高度
        source_chapter: "美好之二·8（黑色星期二）"

      - scene_id: S04
        arc_id: ARC-1
        location: 省少年宫决赛舞台
        time: "约1996年"
        participants: [余周周, 陈桉, 单洁洁]
        pov: 余周周
        conflict: 规则的限制（时间限定/准备好的故事）vs 真实的表达冲动
        value_start: 紧张（按稿子讲"赵一曼"）
        value_end: 胜利（即兴编"小老鼠奔奔"故事获特等奖——人生第一次尝到被认可的"甜"）
        must_include: >
          抛弃准备好的稿子，即兴编故事——她把失去奔奔的真实情感灌注进了虚构；
          严重超时但感动全场；
          陈桉在后台为她庆祝。
        handoff: 成功的甜蜜为即将到来的坠落铺设最高点
        source_chapter: "美好之二·13（可是我还没有讲完）"

  - seq_id: ARC1-SEQ3
    scenes:
      - scene_id: S05
        arc_id: ARC-1
        location: 学校走廊 → 教室
        time: "约1996-97年"
        participants: [余周周, 林杨, 蒋川]
        pov: 余周周
        conflict: 身世真相的社会冲击 vs 孩子无力抵抗的现实
        value_start: 被爱/归属（与林杨的友谊正在巅峰）
        value_end: 孤立/幻灭（主动断交林杨，"照妖镜摄走了她的魔法"）
        must_include: >
          蒋川传话"家长们让自己的孩子离她远点"；
          余周周把卡带送给林杨却说"我再也不想跟你玩了"；
          红气球被收进铁皮盒；
          叙述者的判词："蒋川妈妈的照妖镜摄走了她的魔法。"
        handoff: 童年角色扮演游戏彻底落幕——故事进入全新的阶段
        beat_direction: "ARC-1 高潮——全书的激励事件。必须同时呈现外部力量（家长圈）的不可抗和余周周的主动选择（她选择断交而非被断交）"
        source_chapter: "美好之二·17-18（照妖镜 / 你的格林，我的童话）"

  # ── ARC-2: 在现实中寻找出路 ──

  - seq_id: ARC2-SEQ1
    scenes:
      - scene_id: S06
        arc_id: ARC-2
        location: 学校走廊
        time: "约1999年，六年级"
        participants: [余周周, 凌翔茜]
        pov: 余周周
        conflict: 身世歧视的直接冲击 vs 余周周的自我保护
        value_start: 被动承受（凌翔茜挑衅"你不是正经人家的小孩"）
        value_end: 主动防御（以冷静微笑回击——"做反派比打倒反派更令人释然"）
        must_include: >
          凌翔茜撕扯帽子的肢体攻击；
          余周周不帽子也不示弱，从容离开；
          内心转折：发现"假装不在乎"是一种有效的武器。
        handoff: 余周周获得了新的防御机制，但也付出了情感隔离的代价
        source_chapter: "美好之三·9（反派）"

  - seq_id: ARC2-SEQ2
    scenes:
      - scene_id: S07
        arc_id: ARC-2
        location: 省二院重症监护室外 → 空排练室
        time: "约1999年"
        participants: [余周周, 陈桉]
        pov: 余周周
        conflict: 纯粹的善恶二元论 vs 灰色现实
        value_start: 恐惧（谷老师病危，余周周的最后庇护者即将消失）
        value_end: 新认知（"对你好的就是好人"——学会接受灰色地带）
        must_include: >
          陈桉揭示谷老师也有收礼偏心等不完美之处；
          余周周倔强回应"他对我是好人，就够了"；
          谷老师去世后在空排练室暖气前流泪——
          "再没有人会笑眯眯地问她'上星期是不是没好好练琴'"。
        handoff: 所有传统路径堵死，余周周陷入绝境
        source_chapter: "美好之四·5-6（好人 / 道别就是死去一点点）"

  - seq_id: ARC2-SEQ3
    scenes:
      - scene_id: S08
        arc_id: ARC-2
        location: 烂尾楼雪地
        time: "约1999-2000年冬"
        participants: [余周周, 林杨, 詹燕飞]
        pov: 余周周
        conflict: 即将分离的三人 vs 这一刻的纯粹
        value_start: 逃课的轻松（暂时脱离了升学压力）
        value_end: 被确认（詹燕飞问"你喜欢周周吧"，林杨安静回答"嗯"——雪落无声）
        must_include: >
          三人在烂尾楼雪地玩轮胎滑雪；
          林杨最简单纯粹的告白——只有一个字"嗯"；
          雪花的意象。
        handoff: 这个"嗯"让余周周知道自己被无条件地爱着，为她后来的选择提供了底气
        source_chapter: "美好之四·10（时间轴上的暂停键）"

      - scene_id: S09
        arc_id: ARC-2
        location: 江边 → 冰雪游乐场
        time: "约2000年初"
        participants: [余周周, 陈桉]
        pov: 余周周
        conflict: 被升学制度困住的绝望 vs 另一条道路的可能
        value_start: 绝望（奥数被淘汰，所有路都堵死）
        value_end: 顿悟（"我没学过奥数也上了振华——你到底相信谁？"）
        must_include: >
          冰滑梯的"失重"体验——暂时忘却烦恼的物理隐喻；
          陈桉用自身经历打破"不学奥数就完了"的恐惧；
          "主角的游戏"规则：去没有人认识的学校重新开始。
        handoff: 余周周获得了"主角游戏"的方法论，准备做出关键决定
        beat_direction: "ARC-2 的关键转折——陈桉不是给她答案，而是给她信心"
        source_chapter: "美好之四·13-15（Fly Away / 你到底相信谁 / 主角的游戏）"

      - scene_id: S10
        arc_id: ARC-2
        location: 林杨家 → 师大附中围墙外
        time: "约2000年夏秋"
        participants: [余周周, 林杨]
        pov: 余周周 / 林杨（双视角）
        conflict: 留下（选择安全）vs 离开（选择自由）
        value_start: 含糊（余周周在同学录写"万事胜意"但不说是否来师大附中）
        value_end: 分离（余周周未出现在师大附中名单上，林杨在雨中痛哭）
        must_include: >
          "万事胜意"四个字——"一切结果都比你想象的还要好一点点"；
          九月一日林杨在分班名单上找不到余周周的名字；
          雨中围墙的意象。
        handoff: 余周周开始十三中的新生活——ARC-2 高潮
        beat_direction: "ARC-2 高潮——余周周的第一次真正自主选择。双视角呈现选择的两面：余周周的决绝与林杨的心碎"
        source_chapter: "美好之四·16-18（你和别人不一样 / 万事胜意 / 从告别开始）"

  # ── ARC-3: 友谊、重逢与归属 ──

  - seq_id: ARC3-SEQ1
    scenes:
      - scene_id: S11
        arc_id: ARC-3
        location: 十三中 → 租书屋
        time: "约2000年"
        participants: [余周周, 奔奔/慕容沉樟]
        pov: 余周周
        conflict: 记忆中的奔奔 vs 眼前的少年
        value_start: 陌生（租书屋里一个清秀的少年）
        value_end: 重逢（"我叫奔奔"——童年的连接在意想不到的地方接通）
        must_include: >
          徐志强"表白"事件中少年的出手相助；
          租书屋偶遇、自报"奔奔"——余周周认出童年玩伴的瞬间。
        handoff: 奔奔回来了，但他已不是当年那个被打的小男孩
        source_chapter: "美好之五·4（重逢）"

  - seq_id: ARC3-SEQ2
    scenes:
      - scene_id: S12
        arc_id: ARC-3
        location: 师大附中公开课走廊
        time: "约2001年"
        participants: [余周周, 林杨, 温淼, 沈屾]
        pov: 余周周
        conflict: 过去的歉疚 vs 重逢的复杂情感
        value_start: 紧张（在师大附中走廊"推墙"缓解紧张时被林杨撞见）
        value_end: 修复（林杨当众道歉帮她解围——两人关系从断交到和解的转折点）
        must_include: >
          公开课前的"推墙"缓解紧张的细节；
          林杨以罗密欧身份登台表演；
          余周周说"我不会再欺负你了"——既是道歉也是距离感。
        handoff: 余周周和林杨重新建立联系，但她仍然保持着情感距离
        source_chapter: "美好之六·6-7（都是推墙惹的祸 / 冤家路窄）"

  - seq_id: ARC3-SEQ3
    scenes:
      - scene_id: S13
        arc_id: ARC-3
        location: 江边 / 婚纱影楼
        time: "约2002年夏"
        participants: [余周周, 陈桉, 温淼, 妈妈, 齐叔叔]
        pov: 余周周
        conflict: "也许我太幸福了"的不安 vs 真实的幸福
        value_start: 成功（中考542分全校第一考上振华）
        value_end: 幸福顶点（与陈桉重逢，看妈妈拍婚纱照，幸福到落泪）
        must_include: >
          中考成绩的实现——"主角游戏"第一局完成；
          与陈桉江边重逢的释然；
          妈妈拍婚纱照的温馨——这是妈妈在小说中最后的幸福画面；
          "也许，我太幸福了"——全书最大的不安伏笔。
        handoff: 幸福的顶点即将坠落——ARC-3 高潮
        beat_direction: "ARC-3 高潮——表面是大团圆，底层是不安。作者在最温暖的瞬间埋下最深的伏笔"
        source_chapter: "美好之六·15（也许，我太幸福了）"

  # ── ARC-4: 失去与自由 ──

  - seq_id: ARC4-SEQ1
    scenes:
      - scene_id: S14
        arc_id: ARC-4
        location: 振华三班门口 → 余周周内心
        time: "约2004年，高二开学"
        participants: [余周周, 林杨, 辛锐]
        pov: 余周周
        conflict: 表面的日常 vs 被隐藏的巨大失去
        value_start: 看似平常（给辛锐送练习册、与林杨对话）
        value_end: 痛彻（叙述者揭示——妈妈和齐叔叔已因车祸去世）
        must_include: >
          日常化的叙事表面下突然插入的揭示——读者此前毫不知情；
          余周周主动向林杨道歉说"当初不怪你"——她在用最平静的方式处理最大的痛苦；
          延迟揭示的叙事技法。
        handoff: 读者重新理解余周周高中时期所有行为的底色
        beat_direction: "延迟揭示——不是在事件发生时叙述，而是在日常中不经意地揭开，冲击力远大于直接描写"
        source_chapter: "美好之七·6（默契）"

  - seq_id: ARC4-SEQ2
    scenes:
      - scene_id: S15
        arc_id: ARC-4
        location: 泰国普吉岛 → 机场
        time: "约2004-2005年"
        participants: [余周周, 陈桉]
        pov: 余周周
        conflict: 对精神导师的依赖 vs 独立的必要
        value_start: 依赖（翘课与陈桉旅行——最后的庇护）
        value_end: 释怀（亲吻熟睡陈桉的额头，带走合照——"从此不再需要秘籍"）
        must_include: >
          陈桉讲述自己的身世（母亲带他私奔后车祸去世）——
          余周周终于看到导师也是有创伤的人；
          海边学会放下的意象；
          机场告别的亲吻——不是爱情，是对一段精神关系的完结。
        handoff: 余周周失去最后的精神支柱，必须独立面对一切
        source_chapter: "美好之八·10（下凡）"

  - seq_id: ARC4-SEQ3
    scenes:
      - scene_id: S16
        arc_id: ARC-4
        location: 美香食杂店拆迁现场
        time: "约2005年高三"
        participants: [余周周, 辛锐]
        pov: 余周周
        conflict: 恩怨的清算 vs 真相的残忍
        value_start: 对峙（辛锐承认妒忌）
        value_end: 穿透（余周周说"你谁都不妒忌，谁都不喜欢，你太可怜了"——辛锐痛哭）
        must_include: >
          美香食杂店被拆——辛美香身份的物理消亡；
          辛锐的自我辩解："因为我喜欢楚天阔"；
          余周周的穿透："你不是因为喜欢楚天阔所以才妒忌凌翔茜，
          你是因为妒忌凌翔茜所以才喜欢楚天阔"；
          辛锐蹲地痛哭——"她终于不再是辛美香"；
          余周周说"当年也谢谢你，美香"。
        handoff: 与辛锐的恩怨在拆迁的废墟上收束
        beat_direction: "高潮之一——不是用暴力或报复回应背叛，而是用真相。余周周没有原谅辛锐，但她看到了辛美香。"
        source_chapter: "美好之八·13（终将逝去的旧时光）"

      - scene_id: S17
        arc_id: ARC-4
        location: 食堂
        time: "约2005年，林杨生日"
        participants: [余周周, 林杨]
        pov: 林杨
        conflict: 十余年的等待 vs "To be continued"的开放性
        value_start: 期待（林杨用老办法"偶遇"余周周）
        value_end: 甜蜜且开放（收到手绘连环画，最后一页写"To be continued"）
        must_include: >
          余周周用儿童简笔画水准画的连环画——
          第一页幼儿园逃跑的背影、第二页"西红柿鸡蛋汤"、最后一页三个单词；
          林杨说"画得真丑"——余周周在桌子底下踩他一脚；
          "他们都还有长长的、明媚的以后"。
        handoff: 爱情线终于以开放的方式收束
        beat_direction: "高潮之二——不是告白，不是承诺，而是'未完待续'。余周周第一次允许了一段关系的可能性"
        source_chapter: "美好之八·13（终将逝去的旧时光）"

      - scene_id: S18
        arc_id: ARC-4
        location: 毕业典礼 → 墓地（尾声）
        time: "2005年毕业 → 约2008年大学"
        participants: [余周周, 澳洲外教, (尾声)余思窈, 外婆]
        pov: 余周周
        conflict: 所有的失去 vs 选择继续飞
        value_start: 痛苦（米乔已去世，1517只鸽子中少了一只）
        value_end: 自由（含泪说"Fly free" → 尾声"生命过分美丽"）
        must_include: >
          1517只白鸽放飞、米乔最后的玩笑（"圈地买房"）；
          余周周含泪笑着说"Fly free"——不是逃离而是自由地飞；
          尾声：余思窈把自己画进《喜羊羊》——新一代的角色扮演开始了；
          外婆活在"所有人都在最美好时光"的世界里；
          墓前对妈妈说"七十年之后我去看你——因为生命过分美丽"；
          "她永远不会放弃她的雅典娜"。
        handoff: 故事收束。陀螺转回原点，但转过的每一圈都算数。
        beat_direction: >
          故事高潮+尾声——"Fly free"是价值转化的瞬间（从被困到自由），
          尾声将余周周的个人故事升华为代际循环：余思窈就是新的余周周，
          但这次她有一个完整的、充满爱的家庭。
          最后一句"她永远不会放弃她的雅典娜"回应第一章，完成闭环。
        source_chapter: "美好之八·13（终将逝去的旧时光）+ 尾声"

