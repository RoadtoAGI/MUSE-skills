inciting_incident:
  description: >
    林杨妈妈从周书记儿媳处得知余周周是私生女，决定切断儿子与余周周的来往。
    余周周从蒋川口中得知"家长们也让自己的孩子离她远点"后，
    主动对林杨说"我再也不想跟你玩了"，将红气球收进铁皮饼干盒。
    叙述者写道："蒋川妈妈的照妖镜摄走了她的魔法"——
    幻想世界彻底崩塌，童年的角色扮演游戏落幕。
  type: accident  # 林杨妈妈的发现是偶然的，但余周周的应对是主动决定
  timing: "美好之二·17-18（约故事20%处）"
  balance_before: >
    余周周获"故事大王"特等奖、当上学习委员，与林杨建立深厚友谊，
    用幻想世界+真实友情构成了稳定的心理平衡。
    尽管是私生女，她暂时被一个温暖的微型世界保护着。
  balance_after: >
    失去林杨（唯一真正的朋友），失去幻想的能力（"魔法被摄走"），
    回到被孤立的原点，但这次连自我安慰的幻想都用不了了。
    她学会了冷静微笑和"假装不在乎"，但代价是情感隔离。
  impact_on_protagonist: >
    余周周的防御模式从"用幻想自我保护"转变为"用冷漠面具隔离他人"。
    她不再主动建立亲密关系，变成了一个表面坚强、内心孤立的孩子。
    这个模式将持续到她遇到陈桉和"主角游戏"。

desire_object:
  conscious: >
    证明自己的价值——在没有父亲、没有特权、没有关系的条件下，
    靠自己的能力（成绩、意志）赢得属于自己的位置。
    具体表现为：考上振华、拿到好名次、不依赖任何人。
  unconscious: >
    真正接纳自己的全部（包括身世、失去、不完美），
    并允许自己被爱——不再用"主动推开"来保护自尊，
    而是带着伤疤向世界敞开。
  tension: >
    她越努力"证明自己"，就越难以接受"被无条件地爱"——
    因为无条件的爱让她觉得自己在"负债"（久负大恩必成仇），
    而有条件的认可（成绩、名次）才是她唯一信任的衡量标准。
    这个张力在她与林杨的关系中最为明显：她反复推开他，
    因为接受林杨的爱意味着承认自己"值得被爱"——而这恰恰是她最不敢相信的。

spine_statement: >
  一个被身世定义的女孩，在幻想崩塌后，
  通过一次次"重新开始"来证明自己值得存在——
  直到她终于明白，不需要证明，生命本身已经过分美丽。
spine_type: unconscious  # 她真正需要的不是"证明"，而是"接纳"

dramatic_question:
  question: "余周周能否超越私生女身世的阴影和童年幻想的崩塌，找到不依赖证明也不依赖逃避的真实力量？"
  obligatory_scene: >
    余周周必须在最大的失去面前（妈妈去世、米乔去世、辛锐背叛、保送资格丧失），
    选择是继续用防御机制隔离世界，还是真正敞开自己——
    最终她选择了"Fly free"和"To be continued"。

opposing_forces:
  internal: >
    用幻想逃避现实的本能（"生活在别处"）；
    害怕被拒绝而主动推开他人的防御模式（对林杨反复说"我不会欺负你了""我从来没想过和你在一起"）；
    过度依赖"证明自己"作为自我价值的唯一支撑。
  personal: >
    林杨妈妈为代表的家长圈阶层歧视（信息网络切断孩子的友谊）；
    辛锐从受恩者到背叛者的演变（陷害凌翔茜、散布身世流言）；
    周沈然的恶意（"野种"辱骂、向辛锐泄露身世）；
    余乔等亲人的善意但有限的保护（无法改变结构性问题）。
  external: >
    升学制度的不公（户口决定直升权、奥数绑架教育、保送名额的关系运作）；
    "私生女"身份的社会烙印（不是法律问题而是社交圈的集体排斥）；
    不可抗力的命运打击（谷老师病逝、妈妈和齐叔叔车祸去世、米乔白血病去世）。

arcs:
  - arc_id: ARC-1
    name: "幻想的建立与崩塌"
    value_at_start: "天真——六岁的余周周用动画片构建完整的幻想宇宙，在其中她是雅典娜、是西米克、是命运的主人"
    value_at_end: "幻灭与孤立——幻想被'照妖镜'摄走，主动断交林杨，成为一个'假装不在乎'的孩子"
    climax_event: "余周周对林杨说'我再也不想跟你玩了'，将红气球收进铁皮盒，童年角色扮演游戏彻底落幕"
    function_note: "建置Arc——建立主角的核心机制（幻想作为防御），然后将其摧毁，迫使她寻找新的生存方式"

  - arc_id: ARC-2
    name: "在现实中寻找出路"
    value_at_start: "困顿——与林杨四年不说话，面临升学困境（户口+奥数），谷老师去世"
    value_at_end: "主动选择——放弃师大附中选择十三中，接受'主角游戏'的规则，开始全新人生"
    climax_event: "余周周自愿放弃进师大附中的机会，选择去北江区十三中从零开始。林杨在雨中围墙边痛哭。"
    function_note: "转化Arc——主角从被动承受转为主动选择，'主角游戏'成为她此后人生的方法论"

  - arc_id: ARC-3
    name: "友谊、重逢与归属"
    value_at_start: "孤立但自主——初到十三中，没有朋友，没有过去，只有'主角游戏'的信念"
    value_at_end: "归属与成就——考上振华，与陈桉重逢，妈妈再婚获得完整家庭，但也目睹了友谊的裂痕"
    climax_event: "中考542分全校第一考上振华；妈妈与齐叔叔再婚；与陈桉江边重逢，'也许，我太幸福了'"
    function_note: "上升Arc——主角在新环境中重建关系网（辛美香、温淼、奔奔），实现了'证明自己'的conscious desire"

  - arc_id: ARC-4
    name: "失去与自由"
    value_at_start: "表面幸福下的隐痛——高二振华，揭示妈妈和齐叔叔已因车祸去世，余周周独自面对一切"
    value_at_end: "释怀与自由——接纳失去，放下防御，对世界说'Fly free'"
    climax_event: >
      三重高潮叠加：1)对辛锐说'你谁都不妒忌，谁都不喜欢'——以真相回应背叛；
      2)送林杨手绘连环画'To be continued'——终于允许自己被爱；
      3)含泪对外教说'Fly free'——完成从幻想到自由的终极转化

story_climax_design:
  crisis:
    dilemma: >
      高三面临保送资格丧失、米乔病危、辛锐的背叛、生父的突然出现——
      余周周必须选择：是继续用冷漠面具和"靠自己"的信条隔离一切，
      还是真正面对并接纳生命中所有的失去、不公与不完美？
    option_a: "继续防御——像她一直做的那样，微笑着把所有人推开，独自坚强"
    option_b: "敞开——让自己感受痛苦，也让自己接受爱和连接"
    character_revelation: >
      余周周选择了敞开：对生父，她不恨不怨，只要了一排喜乐饮料然后独自离开——释怀但不原谅；
      对辛锐，她点破真相但也说"谢谢你，美香"——看到了仇人曾经的善意；
      对林杨，她画了连环画写"To be continued"——终于允许"未完待续"。
      这些选择揭示了她的真实面孔：不是那个"假装不在乎"的反派，而是一个选择"真实地活着"的人。
  climax:
    action: >
      毕业典礼上1517只白鸽放飞的瞬间，余周周含泪笑着对外教说"Fly free"——
      不是逃离，而是自由地飞。
    value_change:
      from: "被身世、失去、防御机制困住的女孩"
      to: "选择真实地、自由地活着的年轻女性"
    controlling_idea_expression: >
      高潮行动完美体现主控思想：余周周不是"克服"了所有困难（她仍然没有父母、失去了米乔、没有保送资格），
      而是在最大的不完美中选择了"生命过分美丽"——真实的勇气让不完美的生命绽放。
  resolution:
    new_balance: >
      尾声中余周周上大学，陪侄女余思窈玩耍（新一代的角色扮演开始了），
      去墓地看望妈妈说"我过得很精彩"。
      她说"七十年之后我去看你——因为生命过分美丽"。
      幻想没有消失，而是从逃避机制进化为生命的底色——"她永远不会放弃她的雅典娜"。
    lingering_feeling: >
      温暖而微痛的余味——生命确实过分美丽，但美丽的代价是那些永远回不去的旧时光，
      以及那些再也见不到的人。陀螺转回原点，但转过的每一圈都算数。
