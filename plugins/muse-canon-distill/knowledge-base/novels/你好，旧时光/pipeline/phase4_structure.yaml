# Phase 4: 结构（序列展开）
# 接收 Phase 3 的 4 个 Arc，逐 Arc 展开为内部序列

arc_expansions:
  - arc_id: ARC-1
    sequences:
      - seq_id: ARC1-SEQ1
        name: "幻想世界的建造"
        core_conflict: "现实的贫穷与孤独 vs 幻想的丰盛与陪伴"
        escalation_direction: "从独自幻想 → 邀请奔奔加入 → 与陈桉的真实对话 → 搬家失去奔奔"
        sequence_climax: "搬离大杂院，与奔奔永别。奔奔说'你以后一定能成为特别了不起的人'——第一段真实友谊的终结"
        closed: "大杂院生活的封闭世界"
        opened: "进入外婆家和学校的新社交环境——幻想能否在新世界继续运作？"

      - seq_id: ARC1-SEQ2
        name: "学校的起落"
        core_conflict: "被忽视/被欺负的透明人 vs 渴望被认可的表演欲"
        escalation_direction: "从拼音考试40分的最低谷 → 小红花 → 故事大王特等奖的最高峰"
        sequence_climax: "故事大赛决赛即兴编'小老鼠奔奔'的故事获特等奖——余周周人生第一次被公众认可"
        closed: "余周周在学校的'透明人'身份"
        opened: "成功带来的新问题——妈妈送礼的道德困惑；林杨的嫉妒和保护"

      - seq_id: ARC1-SEQ3
        name: "幻想的崩塌"
        core_conflict: "身世真相的社会冲击 vs 孩子们无力抵抗的友谊"
        escalation_direction: "妈妈送礼被揭穿 → 林杨妈妈发现身世 → 家长圈联合排斥 → 余周周主动断交"
        sequence_climax: "余周周对林杨说'我再也不想跟你玩了'，将红气球收进铁皮盒——'照妖镜摄走了她的魔法'"
        closed: "童年幻想世界——从此余周周不再一人分饰多角"
        opened: "一个失去了幻想保护的女孩如何在现实中生存？"

    arc_progression_note: >
      ARC-1 内部三个序列构成经典的"建置→上升→坠落"弧线：
      幻想世界从自娱自乐（SEQ1）上升到公众认可（SEQ2），
      然后被身世真相这个外力击碎（SEQ3）。
      坠落的力度与上升的高度成正比——正因为她刚刚尝到被认可的甜头，
      被排斥才如此致命。

  - arc_id: ARC-2
    sequences:
      - seq_id: ARC2-SEQ1
        name: "青春期的暗流"
        core_conflict: "成长带来的新意识（性别、嫉妒、竞争）vs 余周周的情感隔离状态"
        escalation_direction: "从与林杨四年不说话 → 卫生巾事件破冰 → 凌翔茜的敌意 → 学会'做反派'"
        sequence_climax: "凌翔茜挑衅'你不是正经人家的小孩'，余周周以冷静微笑回击——她第一次发现'做反派比打倒反派更令人释然'"
        closed: "余周周'透明人'式的被动防御"
        opened: "她学会了主动的防御（冷漠面具），但这也是一种新的困境"

      - seq_id: ARC2-SEQ2
        name: "升学困境与失去"
        core_conflict: "升学制度的结构性不公 vs 余周周仅有的才能（文艺、成绩）"
        escalation_direction: "户口无法直升 → 奥数26题只会7题 → 谷老师去世 → 绝望大哭"
        sequence_climax: "谷老师去世——余周周在空排练室暖气前流泪。最后的庇护者离开了。"
        closed: "通过文艺特长升学的可能性"
        opened: "所有传统路径都被堵死，余周周该何去何从？"

      - seq_id: ARC2-SEQ3
        name: "主角的游戏"
        core_conflict: "在绝境中是屈服于现有规则，还是创造新的游戏规则？"
        escalation_direction: "林杨雪地承认'嗯' → 陈桉'你到底相信谁？' → '主角游戏'规则 → 放弃师大附中"
        sequence_climax: "余周周选择不去师大附中而去十三中——她把命运从被动选择变为主动选择。林杨在雨中围墙边痛哭。"
        closed: "小学时代的所有关系和可能性"
        opened: "'主角游戏'能否在新环境中成功？代价是再次失去林杨。"

    arc_progression_note: >
      ARC-2 是全书最关键的转化弧——从被动承受转为主动选择。
      三个序列的情感走向：麻木（SEQ1）→ 绝望（SEQ2）→ 重生（SEQ3）。
      陈桉的"你到底相信谁？"是整个Arc的关键转折——不是给余周周答案，
      而是让她意识到她有能力为自己做选择。

  - arc_id: ARC-3
    sequences:
      - seq_id: ARC3-SEQ1
        name: "十三中新生"
        core_conflict: "在新环境中重建自我 vs 过去的阴影随时可能追上"
        escalation_direction: "新班级从零开始 → 与辛美香破冰 → 与奔奔重逢 → 外婆中风/家庭矛盾"
        sequence_climax: "与失散多年的奔奔重逢——童年的连接在意想不到的地方重新接通"
        closed: "余周周在十三中的'陌生人'阶段"
        opened: "辛美香的家庭暴力真相；余周周能否真正帮助另一个人？"

      - seq_id: ARC3-SEQ2
        name: "友谊网络的重建"
        core_conflict: "帮助他人成长的善意 vs 帮助可能带来的反噬（久负大恩必成仇）"
        escalation_direction: "与温淼成为挚友 → 在师大附中与林杨重逢 → 妈妈再婚 → 将'主角游戏'传给辛美香 → 辛美香成绩飙升"
        sequence_climax: "与林杨在师大附中重逢，林杨当众道歉帮她解围——两人的关系从'断交'终于修复为'朋友'"
        closed: "余周周的情感隔离——她开始允许他人进入自己的世界"
        opened: "辛美香的竞争心态开始萌芽——帮助她的代价正在酝酿"

      - seq_id: ARC3-SEQ3
        name: "中考与分道扬镳"
        core_conflict: "成功的喜悦 vs 成功必然带来的分离"
        escalation_direction: "辛美香一模超过余周周 → 马远奔退学 → 陈桉迟到的明信片 → 中考全校第一"
        sequence_climax: "中考542分考上振华——与陈桉江边重逢，看妈妈拍婚纱照，'也许，我太幸福了'"
        closed: "初中时代——'主角游戏'的第一局圆满完成"
        opened: "幸福的顶点往往是坠落的起点——温淼去新加坡、沈屾读普高、辛美香改名辛锐"

    arc_progression_note: >
      ARC-3 是全书最温暖的弧——余周周在十三中实现了conscious desire（证明自己）。
      但作者在序列末尾埋下了三个伏笔：
      1)辛美香的竞争心（离别曲的前奏）；2)温淼的"久负大恩必成仇"警告；3)"也许我太幸福了"的不安。
      这些伏笔在ARC-4中全部兑现。

  - arc_id: ARC-4
    sequences:
      - seq_id: ARC4-SEQ1
        name: "振华群像"
        core_conflict: "高中新格局中多个角色的欲望碰撞——每个人都在追求属于自己的'第一名'"
        escalation_direction: "辛锐改头换面 → 凌翔茜暗恋楚天阔 → 林杨追求余周周 → 米乔的张扬与脆弱 → 期中考揭榜"
        sequence_climax: "揭示妈妈和齐叔叔已因车祸去世——余周周高中独自面对一切的真相浮出水面"
        closed: "高中新格局的建置完成——每个人的欲望和位置清晰了"
        opened: "妈妈去世后，余周周的'幸福'底色被彻底抽走，她靠什么支撑？"

      - seq_id: ARC4-SEQ2
        name: "爱与告别"
        core_conflict: "是否允许自己被爱（林杨）？是否能放下精神依赖（陈桉）？"
        escalation_direction: "林杨雪地拥抱 → 余周周拒绝 → 凌翔茜向楚天阔表白 → 辛锐散布流言 → 与陈桉普吉岛告别"
        sequence_climax: "普吉岛机场，余周周亲吻熟睡的陈桉额头——与精神导师彻底告别，从此不再需要'秘籍'"
        closed: "对陈桉的精神依赖——余周周终于独立了"
        opened: "失去最后的精神支柱后，她能否独自面对高三的风暴？"

      - seq_id: ARC4-SEQ3
        name: "终局与释怀"
        core_conflict: "面对连环打击（辛锐背叛、米乔去世、保送资格丧失、生父出现），是继续防御还是敞开？"
        escalation_direction: "辛锐陷害凌翔茜 → 米乔昏迷 → 满城寻找凌翔茜 → 见生父要喜乐后离去 → 美香食杂店对峙 → 送连环画 → 毕业典礼 → Fly free"
        sequence_climax: >
          三重高潮叠加：
          1)对辛锐说'你谁都不妒忌，谁都不喜欢'——以真相回应背叛而非以牙还牙
          2)送林杨'To be continued'——允许爱的可能性
          3)1517只白鸽中含泪说'Fly free'——完成价值转化
        closed: "高中时代、少年时代——所有'旧时光'的故事在此收束"
        opened: "'To be continued'——生命本身是开放的、未完的，不需要'圆满结局'"

    arc_progression_note: >
      ARC-4 集中了全书最多的失去（妈妈、米乔、保送资格）和最大的考验（辛锐的背叛），
      但也包含了最终的释怀。三个序列呈"建置→深化→爆发"的节奏：
      SEQ1 揭示核心痛点（妈妈去世），SEQ2 切断最后的依赖（陈桉告别），
      SEQ3 在完全"孤立"的状态下选择敞开——完成了unconscious desire的实现。

causal_chain: >
  ARC1高潮（幻想崩塌/断交林杨）→ 迫使余周周在ARC2中寻找新的生存方式 →
  ARC2高潮（选择十三中/"主角游戏"）→ 在ARC3中实现自我证明 →
  ARC3高潮（中考成功/幸福顶点）→ 但"证明自己"解决不了真正的问题 →
  ARC4中所有虚假的安全感被剥夺（妈妈去世/陈桉告别/辛锐背叛/米乔去世），
  迫使她面对unconscious desire——不是"证明"而是"接纳" →
  ARC4高潮（Fly free）= 故事高潮 = 主控思想的实现。

arc_progression:
  impact_escalation: >
    ARC-1 高潮是失去一个朋友和一种能力（幻想），冲击在个人层面；
    ARC-2 高潮是主动放弃一个人生阶段（小学圈子），冲击在选择层面；
    ARC-3 高潮是获得成功但预感到代价，冲击在认知层面——"也许我太幸福了"；
    ARC-4 高潮是在最大的失去中选择敞开而非封闭，冲击在存在层面——
    "生命过分美丽"不是胜利宣言，而是在痛苦中做出的信仰选择。
  causal_chain: >
    ARC-1（幻想崩塌）→ 触发ARC-2（寻找出路）→
    ARC-2（主动选择）→ 触发ARC-3（重建与证明）→
    ARC-3（幸福顶点）→ 为ARC-4的坠落铺设最大高度差 →
    ARC-4（终极考验与释怀）= 故事高潮

narrative_threads:
  - name: "成长主线"
    description: "余周周从幻想中的雅典娜到真实的自由飞翔者的蜕变"
    primary_arcs: [ARC-1, ARC-2, ARC-3, ARC-4]

  - name: "爱情线"
    description: "林杨对余周周十余年的等待，从幼儿园到高三毕业"
    primary_arcs: [ARC-1, ARC-4]
    # 在ARC-2和ARC-3中作为暗线存在（四年不说话/重逢后保持距离）

  - name: "精神导师线"
    description: "陈桉从12岁少年到北大学生的引导角色，以及他自身创伤的逐步揭示"
    primary_arcs: [ARC-2, ARC-4]
    # ARC-1中首次出场但功能有限，ARC-3中以书信存在

  - name: "镜像线（辛美香/辛锐）"
    description: "余周周的'帮助'如何塑造了一个从沉默到嫉妒到自我毁灭的镜像角色"
    primary_arcs: [ARC-3, ARC-4]

  - name: "群像线（凌翔茜/温淼/米乔/彦一）"
    description: "不同背景的青少年各自的成长困境——完美女生的崩塌、懒天才的远走、绝症少女的光芒、画家少年的出走"
    primary_arcs: [ARC-3, ARC-4]
    presence: "ARC-3 中温淼和沈屾为主，ARC-4 中凌翔茜/米乔/彦一为主"
