role_slug: guo-jing
reviews:
  - id: R001
    reviewer: codex
    date: 2026-04-13
    severity: high
    type: direct_fact_error
    claim: |
      SKILL.md L29 写"能从旁观洪七公与欧阳锋比武中悟出空明拳理"——
      事实错误。空明拳是周伯通在桃花岛密室中亲自传授郭靖的，
      非从洪欧比武悟出。周伯通被困桃花岛 15 年创造了 72 路空明拳 +
      左右互搏术，把两者都传给了郭靖。
    location: SKILL.md L29
    canonical_source: |
      维基百科"周伯通"、"左右互搏术"；金庸《射雕英雄传》第 16-17 回
    status: resolved
    resolution: |
      2026-04-15：性格真相段已删除"从旁观洪欧比武悟出空明拳"的错误描写。
      改为"武学上他经周伯通在桃花岛传授空明拳+左右互搏，吸收快但靠的是
      '老实学+用心练'，不靠机锋"——准确还原传承关系（周伯通→郭靖）。

  - id: R002
    reviewer: codex
    date: 2026-04-13
    severity: high
    type: semantic_drift
    claim: |
      SKILL.md L14 "他是一个...的蒙古草原人"——身份归属漂移。
      郭靖是"在蒙古长大的宋人遗孤"，始终自认大宋臣民（见边界段
      "绝不卖国求荣、通敌叛宋"）。把成长环境误写成身份归属会污染
      下游（尤其同人/重生/续写）对角色的核心理解。
      codex 建议改为"在蒙古长大的宋人/汉人遗孤"。
    location: SKILL.md L14
    status: resolved
    resolution: |
      2026-04-15：身份段已重写。开篇明确"他是**在蒙古长大的宋人遗孤**——
      母亲二十年从未让他忘记自己姓郭、是大宋人、要回临安牛家村去"。
      "蒙古草原人"的身份归属表述完全删除；保留"两套生活经验并存"的描述
      但归到"对自己'是谁'的回答始终是'大宋臣民'"上。

  - id: R003
    reviewer: codex
    date: 2026-04-13
    severity: medium
    type: single_point_generalization
    claim: |
      SKILL.md L22 "核心缺陷：优柔——...每次都要靠别人（黄蓉的
      策略、母亲的死）替他把选择钉死"。全称量词 + 单点证据外推。
      郭靖在许多情境下是独立做出判断的（救穆念慈、与欧阳锋断绝
      师弟之义、为黄蓉辩护）。
      codex 建议收窄为"在情义/忠义冲突前会迟疑，但一旦认定是非，
      执行上很硬"。
    location: SKILL.md L22
    status: resolved
    resolution: |
      2026-04-15：核心缺陷段已收窄。改为"在**情义/忠义冲突**面前会迟疑——
      华筝 vs 黄蓉、养育之恩 vs 家国之义这类承诺不兼容的情境下"+
      "最大的两次都是靠他人替他把选择钉死"+"但一旦认定是非（如'我是大宋臣民'），
      执行上他极硬"。
      去掉了"每次都要靠别人"的全称量词，明确"最大的两次"。

