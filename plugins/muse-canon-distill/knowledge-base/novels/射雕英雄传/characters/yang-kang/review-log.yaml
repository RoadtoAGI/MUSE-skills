role_slug: yang-kang
reviews:
  - id: R001
    reviewer: model-self
    date: 2026-04-15
    severity: high
    type: direct_fact_error
    claim: |
      SKILL.md L12 写"本名杨康，乃抗金名将杨铁心、包惜弱之子"——
      事实错误。抗金名将是杨家祖上杨再兴（岳飞部将）；杨铁心本人
      是临安府牛家村的普通猎户/侠客，是杨再兴后代但无战功，在原著
      中没有"名将"身份。
      建议改为："乃杨家将后人杨铁心、包惜弱之子"或"乃牛家村侠士
      杨铁心、包惜弱之子"。
    location: SKILL.md L12
    canonical_source: |
      金庸《射雕英雄传》第 1-2 回（杨铁心、郭啸天牛家村身份描写）
    status: resolved
    resolution: |
      2026-04-15：身份段已修正。改为"乃牛家村侠士杨铁心（杨家将后人、
      杨再兴一脉）与包惜弱之子"——准确区分了"杨再兴是杨家将一脉的抗金
      名将"和"杨铁心是其后代但身份是牛家村侠士/猎户"。

  - id: R002
    reviewer: model-self
    date: 2026-04-15
    severity: medium
    type: canon_ending_logic
    claim: |
      canon-ending.md L10 "完颜洪烈走到欧阳锋面前跪地求他救治
      养子，欧阳锋念其被骗了自己亲生之子的情分（欧阳克之死），
      愿意救治"——语法混乱 + 逻辑存疑。
      问题：
      (1) "被骗了自己亲生之子"不是标准中文；
      (2) 欧阳克实际是被杨康偷袭刺杀的（因欧阳克觊觎穆念慈），
          "被骗"表述对事实的因果描述不清；
      (3) 原著中欧阳锋是否真的"愿意救治"以及救治结果如何，需回
          原文场景核对——canon-ending 的"毒发已至后期"等描述
          也需要精确佐证。
      建议：回原文 scenes/scene_12.md 核对铁枪庙段落，重写这段。
    location: references/canon-ending.md L10
    canonical_source: |
      金庸《射雕英雄传》第 35-36 回（铁枪庙真相揭穿 + 杨康毒发）
    status: resolved
    resolution: |
      2026-04-15：回原文核对了 scene_12.md L38-L44 完整段落，重写整篇
      canon-ending.md。关键事实纠正：
      (1) 欧阳锋**拒绝**救治杨康，原话"你儿子的性命是命，我侄儿的性命就
          不是命！"——是为欧阳克之死索命，不是"愿意救治"。
      (2) 欧阳锋还封死了外援可能："老毒物下的毒，天下有哪一个名医治得？
          又有哪一个名医不要性命，敢来坏我的事？"
      (3) 增补杨康临死前一句清醒话："你又不是我爹爹，你害死我妈，又想来
          害我！"——一生唯一一次以"杨康"视角说话，旋即又叫"父王"返回赵
          王府身份认知。
      (4) 增补"鲨鱼链"毒源原理（南希仁→软猬甲→杨康）的精确机制说明。
      (5) 增加沙通天被抓伤+彭连虎砍臂救命的细节。
