# ============================================================
# 武学体系总卡 —— 《射雕英雄传》（射雕宇宙基准卡）
# 面向写作消费的横向资产：战力谱系 / 力量来源 / 招式命名法 /
# 胜负判定 / 武戏写法入口 / 一致性硬约束。
# 战力规则原先散在 phase1（设计层）/ phase2（人物层）/ craft_notes
# （场景层）三处，本卡做横向汇总并标注来源，不替代三处原文。
# ============================================================
card_meta:
  card_type: martial_system
  scope: 射雕宇宙基准卡（《神雕侠侣》同名卡 extends 本卡，只记增量）
  derived_from:
    - pipeline/phase1_world.yaml
    - pipeline/phase2_character.yaml
    - craft_notes/
    - scene_index.json
  consumers: [phase1-world-building, phase6-scene-development, writer]
  annotated_by: claude-fable-5

power_hierarchy:
  note: 相对刻度，不是数值表——金庸从不给战力标数，层级只通过"接多少招/谁怕谁"间接显影
  tiers:
    - tier: 绝顶（五绝）
      members: [王重阳（中神通，已故）, 黄药师（东邪）, 欧阳锋（西毒）, 一灯/段智兴（南帝）, 洪七公（北丐）]
      markers: 自创武学体系；一招一式皆有武理可讲；彼此差距在毫厘与心境，不在招式
      adjacent: 周伯通——五绝级战力的武学天才，但"少一副救世济人的胸怀"（phase2_character.yaml）
    - tier: 准绝顶
      members: [郭靖（全书终点）, 裘千仞（铁掌水上飘）]
      markers: 能与五绝周旋数百招；尚无自创体系，靠绝学+内功硬度立身
    - tier: 一流
      members: [梅超风, 欧阳克, 全真七子（单人）, 灵智上人, 沙通天/彭连虎级]
      markers: 一门绝技立身；单挑接不下五绝五十招
    - tier: 二流及以下
      members: [江南六怪, 杨康, 侯通海]
      markers: 招式娴熟但内功有限；郭靖受六怪苦教十年仍不过二流，是"内功决定上限"的反面教材
  rules:
    - 不可跳级：跨一档可险胜（须付代价或借外力），跨两档只能逃不能胜（phase1 adaptation_constraints）
    - 合阵可升档：天罡北斗阵让全真七子合力可困五绝——结构补内力（S20）
    - 战力进步必须有因果链：内功→外功→奇遇→实战，且每次奇遇背后是品行的回报（郭靖模式：马钰内功→洪七公传掌→周伯通互搏，phase2 升维链每段都带"代价"）

power_source:
  - 内功是根基，决定一切招式的威力上限；同一招因内力深浅效果天差地别
  - 内功需数十年积累，速成必走火入魔（欧阳锋逆练经脉即明证，phase1 rules）
  - 外功招式是表达层：降龙十八掌是表达力的极致，但威力仍吃内功
  - 兵法/阵法/智计是独立加成层，可部分对冲战力差（武穆遗书 S21、天罡北斗阵 S20/S30）
  - 秘笈悖论：《九阴真经》至高，但"王重阳得经不练才是最高境界"——执念本身就是毁灭（phase1 genre_conventions）

move_naming:
  note: 命名即叙事——招式名承担武理说明/人物心境/哲学约束，AI 创招的默认失败是"视觉酷炫名"（九天雷劫式）
  systems:
    - system: 典籍力学系
      examples: [亢龙有悔, 飞龙在天, 见龙在田（降龙十八掌取《易经》）]
      rule: 名字给出力学意象+哲学约束——"亢龙有悔"的"悔"是留力哲学，名字本身教使用者怎么打
    - system: 物象形意系
      examples: [打狗棒法, 兰花拂穴手, 落英神剑掌, 灵蛇拳]
      rule: 以物象规定运动轨迹与气质；写新招先想"它像什么的运动"，不是"它多强"
    - system: 反常规系
      examples: [双手互搏（一心二用）, 逆练九阴（经脉逆行）]
      rule: 创新招不靠华丽名号，靠运动原理的反直觉——"似乎能于无法弯曲处弯曲"（craft_notes/scene_29_beats.yaml 29-p2）

victory_logic:
  note: 金庸的胜负从不由战力数值单独决出——高潮对决的最后一层永远不在武力层
  factors:
    - factor: 心理/认知
      canon: S31 华山论剑——欧阳锋败于"你是谁"的认知崩溃而非武力；"邪不胜正"是因为"气势先就沮了"（phase1 rules）
    - factor: 身份与威慑
      canon: S25——黄蓉以桃花岛弟子身份震慑梅超风；不在场者的名号比新招式更能止战
    - factor: 环境与结构
      canon: S20——浓雾重排能力序（盲者反而占优）；北斗阵把混战变成结构战
    - factor: 道德与因果
      canon: 郭靖每次战力跃迁都是善行的回报；裘千仞被一句"是非善恶"问垮（S14）
  writing_rule: 写终极对决时胜负要逐层上移——比武→比智→比心（craft_notes/scene_31_beats.md），最后一击的物理伤害远不如心智/价值层的决出致命

combat_scene_index:
  note: 按场面类型给 craft_notes 入口；写对应类型武戏前先读 craft_notes/scene_{id}_beats.yaml 的 transfer_rule
  单挑: [scene_29（三层节奏切换+评书旁白调节）, scene_30（武术动作即情感表达）, scene_31（双线并行+认知崩溃）]
  群战: [scene_02（黑暗改写战斗规则+伤情记账递进）, scene_20（阵法章法+楼头解说人+环境参战）]
  以寡敌众/追逐: [scene_08（倒置视点只写攻方挨打+地形兼幕布与武器）]
  偷袭: [scene_07（受袭者体感快写+宗师重创分台阶）]
  智斗代武: [scene_25（连续换赛道+名号威慑）, scene_28（考核类型轮换不靠难度加码）]
  传功: [scene_05（洪七公传降龙）, scene_24（暗线传功——最关键的传承发生在幕后）]
  旁观武戏: [scene_19（主角被困观众席，能看不能动）]

consistency_constraints:
  - 武功等级体系内在一致：五绝之下层层递减，不可随意跳级（phase1 adaptation_constraints）
  - 任何战力跃迁必须可追溯到具体传承/奇遇，且奇遇有品行因果——避免"一步登天"
  - 招式有谱系：每门武功有门派来历，叙述者可插评武理渊源——"武戏兼武学论文"（style_card.yaml）
  - 毒/暗器/阵法是独立变量：可越级伤人，但不可越级"赢"——赢仍要回到正面战力或心智层
