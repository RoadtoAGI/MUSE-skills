# ============================================================
# Phase 2: 人物系统设计图 — 《射雕英雄传》逆向分析
# ============================================================
# 本文件只记角色之间的关系（系统层），不记个体画像。
# 个体画像（声音、对白、弧光）见 characters/{角色名}.md

cast_overview:
  protagonist: 郭靖
  antagonist:
    primary: 欧阳锋（武力对手，贯穿全书）
    mirror: 杨康（镜像对手——同为遗孤却走向背叛）
    political: 完颜洪烈（杀父仇人+侵宋主谋）
    existential: 成吉思汗（养育恩人→最终的价值观对手）
  supporting_cast:
    - name: 黄蓉
      function: "灵魂伴侣+互补型搭档——智慧补郭靖之拙，策略补郭靖之直"
    - name: 洪七公
      function: "道德导师——以'二百三十一人'树立'有原则的行善'标杆，传降龙十八掌定武功根基"
    - name: 黄药师
      function: "门槛守护者+价值观挑战者——亦正亦邪，迫使郭靖证明自身配得上黄蓉"
    - name: 周伯通
      function: "天真之镜——武学天才但'少一副救世济人的胸怀'，反衬郭靖的精神高度"
    - name: 一灯大师
      function: "慈悲之镜——以自我牺牲（耗五年功力疗伤）和度化仇人展示'善'的极致形态"
    - name: 柯镇恶
      function: "师恩锚点——盲人老师的倔强与偏执，既是郭靖的义气来源，也是制造最大误会的根源"
    - name: 李萍
      function: "精神遗产——隐忍二十年后以死明志，一句'无愧于心'成为郭靖终身信条"
    - name: 穆念慈
      function: "杨康线的良知映照——她的存在证明杨康'知善'却'不能行善'"
    - name: 丘处机
      function: "命运编剧——取名'靖康'将家国仇恨刻入两个婴儿命运，又以十八年之约驱动前半部情节"
    - name: 成吉思汗
      function: "终极对照——帝王式的'英雄'vs 郭靖式的'侠'，在临终对话中完成主控思想的终极表达"

# ── 对比轴 ──

contrast_axes:
  primary_axis:
    name: "郭靖 vs 杨康：同一起点，相反终点"
    dimension: "面对身份危机时的选择"
    郭靖: "蒙古长大但认同大宋——'我是大宋臣民'（第38回）"
    杨康: "汉人血统但认同金国——拒认生父、拜欧阳锋为师、通敌卖国"
    structural_function: "镜像对比贯穿全书——同为遗孤、同被取名寓'靖康之耻'，但教养环境（大漠质朴 vs 王府奢靡）决定了根本分野"

  secondary_axis:
    name: "洪七公 vs 欧阳锋：同等武力，相反道德"
    dimension: "力量的使用方式"
    洪七公: "杀二百三十一人，个个恶徒——力量用于除恶"
    欧阳锋: "恩将仇报、暗算重伤救命恩人——力量用于自利"
    structural_function: "武力线的道德注脚——证明'天下第一'的追求本身无意义，关键在于武功用来做什么"

  tertiary_axis:
    name: "黄药师 vs 一灯大师：两种'退出者'"
    dimension: "面对伤痛时的选择"
    黄药师: "'自行其是，从来不为旁人着想'——以孤傲隔绝世界，把伤痛转化为对他人的控制"
    一灯大师: "'慈和宽厚'——以出家遁世，但在关键时刻仍以自我牺牲救人"
    structural_function: "展示'善'的不同形态和局限——黄药师的'邪'不在恶行而在冷漠，一灯的'善'被丘处机批评为'算不得大仁大勇'"

  quaternary_axis:
    name: "郭靖 vs 成吉思汗：两种'英雄'"
    dimension: "对英雄的定义"
    郭靖: "'杀得人多却未必算是英雄'——英雄是守护者"
    成吉思汗: "'历代莫可与比'——英雄是征服者"
    structural_function: "全书终极对比——在临终对话中完成主控思想表达"

# ── 关系网 ──

relationships:
  power_dynamics: >
    五绝格局定义了武林权力结构的天花板。郭靖从最底层（六怪弟子、天资鲁钝）起步，
    通过马钰（内功）→洪七公（降龙十八掌）→周伯通（双手互搏+九阴真经）的层层传功，
    最终在第二次华山论剑中跻身五绝级别。但全书的结论是：武力排名是虚名，
    真正的权力在于道德感召力——洪七公一段话就让裘千仞'天良发现'，
    郭靖一段话就让成吉思汗至死难安。

  key_tensions:
    - "郭靖-黄药师：准女婿 vs 亦正亦邪的岳父——黄药师折其手腕、限其领死、误信女儿已死后誓杀六怪，三次将郭靖推入绝境"
    - "郭靖-成吉思汗：养育之恩 vs 侵宋之仇——最终以李萍自刎为代价斩断"
    - "郭靖-杨康：义兄弟 vs 镜像对手——郭靖始终相信杨康能'回头'，直到铁枪庙真相大白"
    - "黄蓉-柯镇恶：爱人之师 vs 仇人之女——五怪惨案中柯镇恶要杀黄蓉，黄蓉却以命为其洗冤"
    - "周伯通-黄药师：被困十五年的囚犯 vs 囚禁者——但周伯通的顽童心性让这段囚禁变成了一场漫长的游戏"
    - "瑛姑-一灯-周伯通：三角恩怨——周伯通的私情→一灯的嫉妒→婴儿之死→瑛姑的复仇→一灯的出家"

  potential_shifts:
    - "杨康的'回头'可能性——全书多次给出希望（认祖归宗、与穆念慈相恋），但每次都被他的贪恋富贵所吞噬，直到毒血夺命"
    - "黄药师从'邪'到'正'——梅超风替师而死触发他的柔软面，最终重认郭靖为婿"
    - "裘千仞的度化——从'是非善恶'之问的强硬到被洪七公击溃、被一灯救下出家"

# ── 角色功能矩阵 ──

functional_matrix:
  mentor_chain:
    - stage: "内功根基"
      mentor: 马钰
      gift: "全真内功心法+金雁功"
      cost: "不留师徒名分——暗中传授两年"
    - stage: "外功突破"
      mentor: 洪七公
      gift: "降龙十八掌（十五掌）"
      cost: "黄蓉以厨艺交换——策略与真情结合"
    - stage: "武学升维"
      mentor: 周伯通
      gift: "空明拳+双手互搏+九阴真经全文"
      cost: "结为义兄弟——以赤诚换赤诚"
    - stage: "兵法韬略"
      mentor: 岳飞（遗书）
      gift: "《武穆遗书》"
      cost: "铁掌峰生死冒险"
    - stage: "道德觉醒"
      mentor: 洪七公+李萍
      gift: "'武功无善恶，端在人之为用'+' 无愧于心'"
      cost: "母亲以死明志"

  antagonist_escalation:
    - level: 1
      antagonist: 黑风双煞
      threat: "个人武力威胁"
      resolution: "陈玄风被杀、梅超风失明"
    - level: 2
      antagonist: 完颜洪烈+赵王府群敌
      threat: "政治权力+武力围攻"
      resolution: "逃脱+杨铁心夫妇殉情"
    - level: 3
      antagonist: 欧阳锋
      threat: "五绝级武力+阴毒手段"
      resolution: "逆练经脉疯癫——被自身的'天下第一'执念反噬"
    - level: 4
      antagonist: 成吉思汗
      threat: "帝王权力+养育恩情——无法用武力解决的对手"
      resolution: "李萍殉节斩断羁绊+'英雄论'以思想胜出"
