# ============================================================
# Phase 1: 世界 — 《射雕英雄传》逆向分析
# ============================================================

setting:
  era: "南宋末年（约1199-1227年），从牛家村惨变到成吉思汗病逝"
  duration: "约28年（郭靖出生前一年至成吉思汗西征归途病逝）"
  location: "蒙古大漠、中原江湖（临安/嘉兴/牛家村）、桃花岛、西域（花剌子模/撒麻尔罕）、大理、华山"
  conflict_levels:
    internal: "郭靖在蒙古养育之恩与大宋臣民身份之间的认同撕裂；武功是否害人的道德迷惘"
    personal: "郭靖与黄蓉的爱情 vs 华筝婚约；师父仇恨 vs 爱人之父；郭靖杨康的镜像对比"
    external: "金国侵宋、蒙古崛起、蒙宋联盟的脆弱与必然破裂；武林争夺九阴真经"

world_rules:
  physical:
    - "武功体系：内功为根基，外功为枝叶；内功修炼需数十年积累，速成必走火入魔（欧阳锋逆练经脉即为明证）"
    - "五绝格局：东邪西毒南帝北丐中神通，五种武学路线代表五种价值观"
    - "秘笈争夺：《九阴真经》为武学至高宝典，但王重阳得经不练——'不练'反而是最高境界"
    - "地理限制：大漠/中原/海岛/西域，不同地理塑造不同武学流派和生存方式"
  social:
    - "宋金蒙三国并立：宋朝偏安、金国占据中原、蒙古草原崛起，三方博弈"
    - "江湖与庙堂并行：武林门派自成体系，但与国家政治深度纠缠（丐帮抗金、铁掌帮通敌、全真教入世）"
    - "蒙古汗权：成吉思汗一言定生死，安答制度、那颜封赏、可汗婚配皆为权力工具"
    - "武林声望体系：华山论剑定天下第一，声望即权力，但'天下第一'终为虚名"
  psychological:
    - "侠义伦理：师恩如山、国仇家恨、知恩图报——这些伦理构成角色行为的基本约束"
    - "血统 vs 教养：杨康身为汉人却认金国王爷为父，郭靖在蒙古长大却认同宋人身份——出身不决定人格"
    - "武功与道德捆绑：'邪不胜正'不是因为正义方武功更高，而是'气势先就沮了'——心理优势决定胜负"
    - "仇恨的代际传递：丘处机取名'靖康'，将家国之恨刻入两个未出世婴儿的命运"

genre_conventions:
  primary_genre: 武侠
  secondary_genre: 历史传奇
  conventions:
    - convention: "少年拜师学艺，遍遇高人传功"
      planned_subversion: "郭靖不是天才——天资鲁钝，六位师父苦教十年不过二流水平；全靠马钰暗授内功、洪七公赏饭传掌、周伯通教双手互搏等'偶然'叠加才跻身一流，但每次'偶然'背后都是他的善良和义气换来的"
    - convention: "秘笈争夺推动情节"
      planned_subversion: "九阴真经最终的教训是'不练'——王重阳得经不练是最高境界；欧阳锋练了假经反而疯癫；郭靖虽习经中武功，但真正让他成为'天下第一'的不是经文而是人品"
    - convention: "善恶分明的正邪对立"
      planned_subversion: "五绝中除洪七公外皆有道德瑕疵：黄药师不为旁人着想、段智兴因嫉妒未救婴儿、欧阳锋坦荡地恶；裘千仞的'是非善恶'之问让所有正面人物哑口无言，只有洪七公能正面回应"
    - convention: "大团圆结局"
      planned_subversion: "母亲自刎、五师惨死、安答决裂、蒙古南侵——靖蓉南归时'但见骷髅白骨散处长草之间'，结尾诗'兵火有余烬，贫村才数家'，以忧患结束"

daily_life:
  - dimension: "蒙古游牧生活"
    findings:
      - detail: "骑马射箭为日常，六岁即学摔跤，汗血宝马是最高赏赐"
        story_implication: "塑造郭靖质朴刚毅的性格底色，骑射功夫成为他的标志性技能"
  - dimension: "江湖客栈文化"
    findings:
      - detail: "酒楼茶肆是消息集散地，比武招亲、约战定期是江湖社交方式"
        story_implication: "醉仙楼、烟雨楼等地标成为关键情节场所"
  - dimension: "武学师承"
    findings:
      - detail: "拜师需要引荐、考验、行礼；师恩等同父母；背叛师门是最大罪名"
        story_implication: "梅超风偷经叛师是黄药师终身之痛；杨康拜欧阳锋为师标志堕落不可逆"

creative_constraints:
  - constraint: "历史框架不可逆：蒙古统一、西征花剌子模、成吉思汗病逝皆为史实"
    narrative_function: "历史事件为虚构情节提供不可篡改的时间线骨架，郭靖的个人选择必须在历史约束内完成"
  - constraint: "武功等级体系需内在一致：五绝之下层层递减，不可随意跳级"
    narrative_function: "郭靖的武功进步必须有合理的因果链（内功→外功→奇遇→实战），避免'一步登天'"
  - constraint: "续书衔接：全书结尾须为《神雕侠侣》留出接口"
    narrative_function: "靖蓉南归守襄阳、杨康遗腹子（杨过）、欧阳锋疯癫未死等线索均指向续篇"
