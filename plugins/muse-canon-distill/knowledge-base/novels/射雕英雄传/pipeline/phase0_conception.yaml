# ============================================================
# Phase 0: 构想 — 《射雕英雄传》逆向分析
# ============================================================

premise: "如果两个在靖康之耻中家破人亡的遗孤，一个在大漠中由忠义之母养大，一个在敌国王府中认贼作父，他们各自走向怎样的人生？"

core_value:
  positive: 忠义（为国为民、侠之大者）
  negative: 背叛（认贼作父、通敌卖国）
  spectrum:
    contradictory: 冷漠（不关心国家兴亡、只顾个人恩怨）
    contrary: 自利（追求个人权势富贵而不顾大义）
    negation_of_negation: 以英雄之名行屠杀之实（成吉思汗式的"英雄"——征服天下却白骨累累）

controlling_idea:
  value: 忠义
  cause: 因为真正的英雄不是武力最强、疆域最广的人，而是为民造福、爱护百姓、行事无愧于心的人
  full_statement: "当一个人将武功与力量用于仗义为善、守护百姓时，他便是真正的英雄——侠之大者，为国为民；而以武力征服天下、杀人盈野者，纵横一世也不过是白骨堆上的虚名。"
  type: idealistic

genre:
  primary: 武侠（成长+爱情+家国）
  secondary: 历史传奇
  conventions:
    - setting: "宋末乱世，江湖与庙堂交织，武林门派与历史势力并存"
    - characters: "少年英雄成长、绝世高人传功、亦正亦邪的宗师、认贼作父的镜像对手"
    - events: "比武招亲、争夺秘笈、华山论剑、国仇家恨、群雄大战"
    - values: "侠义忠孝、家国天下、武功与道德的关系"

originality_statement:
  unique_angle: "以'靖康之耻'为命名起点，将武侠成长线与历史家国线深度绑定——郭靖杨康的人生对比不仅是个人选择的分野，更是对'英雄'定义的层层追问，最终在蒙古大汗临终之际给出'杀得人多却未必算是英雄'的回答。"
  cliches_to_avoid:
    - "主角天赋异禀一路开挂——郭靖天资鲁钝，武功进步全靠苦练和奇遇叠加"
    - "正邪二元对立——五绝各有道德瑕疵（黄药师自行其是、段智兴因嫉妒误事），只有洪七公获得完全认可"
    - "大团圆结局——母亲自刎、五师惨死、蒙古安答决裂，靖蓉南归时'但见骷髅白骨散处长草之间'"

style_directives:
  - "章回体结构，每回标题暗示核心冲突"
  - "全知视角为主，以郭靖为主要跟随对象"
  - "武打描写与性格刻画融合（武功即人格）"
  - "历史事件与虚构情节无缝嵌合（蒙古统一、西征花剌子模皆有史可依）"
  - "对白简洁有力，通过行动而非独白展现内心"

word_count: 约900000
