# ============================================================
# Phase 3: 脊椎 + Arc 框架 — 《射雕英雄传》逆向分析
# ============================================================

inciting_incident:
  description: "牛家村惨变——官兵与金兵围村，郭啸天战死，杨铁心失踪，包惜弱被完颜洪烈以'颜烈'之名骗走北上。两家遗孤从此天各一方。"
  type: accident
  timing: "第1回（故事0%处，主角尚未出生）"
  balance_before: "牛家村中郭杨两家虽身处乱世但尚有安居之所，丘处机偶然路过，三人结交甚欢"
  balance_after: "两家家破人亡；丘处机取名'靖''康'寓靖康之耻，将家国仇恨烙入两个未出世婴儿的命运；江南七怪与丘处机立下十八年之约"
  impact_on_protagonist: "郭靖在出生前即被'编程'——名字承载国耻、匕首寄托遗志；母亲忍辱北迁蒙古，他在大漠中以遗孤身份成长"

desire_object:
  conscious: "为父报仇、学好武功、在十八年之约中不辱师门——后扩展为保护黄蓉、守护大宋"
  unconscious: "理解'英雄'的真正含义——从个人武勇（弯弓射雕）到江湖道义（降龙十八掌）再到家国担当（为国为民）"
  tension: "郭靖的自觉追求（报仇、学武、赢得比武）始终停留在个人层面，直到母亲自刎（第38回）和洪七公破其心魔（第39回）后，他才真正理解武功之'用'不在胜负而在守护百姓——这个觉醒过程贯穿全书"

spine_statement: "一个天资鲁钝的大漠遗孤，在师恩、爱情、国仇的层层锻造中，逐步理解'侠之大者，为国为民'的真义。"
spine_type: unconscious

dramatic_question:
  question: "郭靖能否超越个人恩怨，成为真正的'侠之大者'？"
  obligatory_scene: "华山论剑后与成吉思汗的'英雄论'对话——'杀得人多却未必算是英雄'（第40回）"

opposing_forces:
  internal: "天资鲁钝、优柔寡断（面对华筝婚约和黄蓉的两难）、武功善恶的精神迷惘（第39回）"
  personal: "欧阳锋（武力对手）、杨康（镜像对手——同为遗孤却走向背叛）、黄药师（未来岳父但一度为仇人）、成吉思汗（养育恩人但终为敌国大汗）"
  external: "金国侵宋（完颜洪烈密谋）、蒙古南侵（锦囊密令）、武林争夺九阴真经"

# ── 幕/Arc 框架（从高潮回溯：故事有6个重大逆转）──

arcs:
  - arc_id: ARC-1
    name: "大漠成长"
    value_at_start: "失衡——家破人亡，遗孤流落异国"
    value_at_end: "局部恢复——郭靖在蒙古立身，但身份认同悬而未决"
    climax_event: "郭靖与黄蓉在张家口相遇，慷慨赠裘赠金赠马（第7回）"
    function_note: "建置Arc——郭靖性格定型（质朴、义气），遇黄蓉开启江湖线"

  - arc_id: ARC-2
    name: "江湖激荡"
    value_at_start: "郭靖初入江湖，武功不足但有黄蓉相伴"
    value_at_end: "武功大进（降龙十八掌+双手互搏+九阴真经），但面临桃花岛死局"
    climax_event: "杨铁心夫妇殉情、丘处机甘拜下风——十八年之约了结（第11回）"
    function_note: "升级Arc——武功跃升+杨康线正式展开（拒认生父，命运分野确立）"

  - arc_id: ARC-3
    name: "海上风波"
    value_at_start: "桃花岛三道试题获许婚，郭靖似乎万事如意"
    value_at_end: "洪七公重伤退场、黄药师误信女儿已死誓杀六怪——危机层层叠加"
    climax_event: "欧阳锋恩将仇报偷袭洪七公——'好人代价'最沉重的时刻（第21回）"
    function_note: "升级Arc——善人受创恶人得逞，黄蓉从少女转变为丐帮帮主"

  - arc_id: ARC-4
    name: "寻书问道"
    value_at_start: "各方势力交错，郭靖在师仇与爱情之间左右为难"
    value_at_end: "获武穆遗书（从个人武功到兵法韬略的升维），情感确定"
    climax_event: "铁掌峰禁地发现《武穆遗书》——从'个人武功'升维至'家国兵略'（第28回）"
    function_note: "转折Arc——郭靖的角色定位从江湖侠客转向军事将领"

  - arc_id: ARC-5
    name: "真相与抉择"
    value_at_start: "最深的误会——师仇与爱情的撕裂达到极致"
    value_at_end: "真相大白、杨康线终结、但李萍之死使郭靖付出了最大的个人代价"
    climax_event: "李萍自刎殉节——'只要一生行事无愧于心'（第38回）"
    function_note: "高潮Arc——身份认同的不可逆转变（蒙古金刀驸马→大宋臣民）"

  - arc_id: ARC-6
    name: "华山论剑"
    value_at_start: "郭靖武功已至顶级，但精神陷入'武功善恶'的迷惘"
    value_at_end: "彻底觉醒——'侠之大者，为国为民'；力量的意义在于守护"
    climax_event: "郭靖对成吉思汗说出'杀得人多却未必算是英雄'——主控思想终极表达（第40回）"
    function_note: "收束Arc——精神觉醒+华山论剑+南归守襄阳"

# ── 故事高潮设计（从结局回溯）──

story_climax_design:
  crisis:
    dilemma: "郭靖被成吉思汗以母亲性命要挟南攻大宋——服从意味着成为卖国贼，抗命意味着母子皆死"
    option_a: "服从大汗，南攻大宋——保全母亲性命但背叛国族"
    option_b: "抗命南归，忠于大宋——母亲和自己都将被处死"
    character_revelation: "郭靖在犹豫中暴露了核心弱点（优柔、重情），但李萍以自刎替他做了选择——'尽忠报国'不可违"
  climax:
    action: "郭靖对临终的成吉思汗说出'杀得人多却未必算是英雄'，然后南归襄阳以空城计退蒙古先锋"
    value_change:
      from: "失衡——家破人亡的遗孤在蒙古与大宋之间无所归属"
      to: "新平衡——'侠之大者，为国为民'，自觉选择守土御侮"
    controlling_idea_expression: "全书最后的行动（空城计退敌+定居襄阳）完美体现主控思想：真正的英雄不是征服天下的大汗，而是守护百姓的侠客"
  resolution:
    new_balance: "靖蓉南归襄阳，'鸳盟虽谐，可称无憾，但世人苦难方深，不知何日方得太平'——个人幸福与天下忧患并存"
    lingering_feeling: "忧患中的希望——结尾诗'兵火有余烬，贫村才数家。无人争晓渡，残月下寒沙'以苍凉收束，但靖蓉的存在本身就是对绝望的否定"
