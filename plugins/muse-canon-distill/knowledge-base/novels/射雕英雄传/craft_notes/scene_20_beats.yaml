scene_id: '20'
source_notes: scene_20_beats.md
patterns:
- pattern_id: 20-p1
  beat: 楼头解说人
  dimension: camera
  original_move: 镜头架在楼头观察点，混战意义由洪七公预言式解说揭示，画面随后兑现
  ai_default_failure: 全知视角逐招平铺八人攻防，读者三段后迷失
  transfer_rule: 群战安一个有判断力的旁观解说人，解说先行画面验证，镜头只在转折点切入战团
  quote: 十招之内，他就要缩小圈子了
- pattern_id: 20-p2
  beat: 阵法即章法
  dimension: overall
  original_move: 按星位调度镜头，攻防写成缺口—救援链，全场危机从同一结构缺陷（天璇弱点）生出
  ai_default_failure: 给每个成员轮流安排高光的车轮战，或只喊阵名不写运转原理
  transfer_rule: 用阵法队形给每人固定方位职责，结构弱点重复受击比新招迭出更有章法
  quote: 须由位当天权的丘处机和位当天璇的柯镇恶从旁侧击解救
- pattern_id: 20-p3
  beat: 郭靖抢占北极星位
  dimension: omission
  original_move: 主角抢位动作零镜头，拆给四方各自反应（认输忽见/心惊/惊问此人是谁/大喜过望）
  ai_default_failure: 给主角灵光一闪加慢镜头身姿加众人惊呼三件套
  transfer_rule: 单人从群像凸显靠对手与旁观者的认知落差，省略动作本身写发现后的反应链
  quote: 北极星位上多了一人，原来却是郭靖
- pattern_id: 20-p4
  beat: 浓雾参战
  dimension: camera
  original_move: 雾经三次天气预报铺垫后关闭视觉通道，感官切听觉，全员行动动词集体降级
  ai_default_failure: 雾只作氛围形容词，高手照打不误不改变任何战斗逻辑
  transfer_rule: 环境要素必须重排能力序才算参战——让最强者失能、让最弱者掌权
  quote: 各人近在身畔，却不见旁人面目
- pattern_id: 20-p5
  beat: 误会驱动多方
  dimension: info_density
  original_move: 恶斗中盘点各方动机账本，每个新信息入场重组一次敌我，武力始终未分胜负
  ai_default_failure: 把人群分正反两军、动机单一，战局变化只靠武力升级
  transfer_rule: 多方混战的推进器是信息差与误会，新信息入场即重排阵营而非升级招式
  quote: 不屑先行多言解释
overall_traits:
- 北斗阵给结构，洪七公给解说，先给图再让图变形
- 环境要素重排能力序才算参战：雾让武功第一者失能、让瞎子掌权
- 多方混战靠误会与信息差推进，各方都有理、无单一反派
- 主角凸显不靠主角描写，靠对手的认知落差
