  ai_default_failure: 安排父子对话回忆往事、以物件相认
  transfer_rule: 身份揭露改用领域专属技能作不可伪造的证明
  quote: 这招枪法我杨家传子不传女
- pattern_id: 04-p3
  beat: 踌躇对照冲出
  dimension: verb
  original_move: 「踌躇」对「冲出」，两代性格差在动作对比中完成
  ai_default_failure: 给杨康一段富贵与生父之间的内心独白
  transfer_rule: 关键抉择处用一静一动的动作对比代替心理铺陈
  quote: 完顔康踌躇难决
overall_traits:
