novel: 射雕英雄传
author: 金庸
lang: zh
translator: ''
narration_voice: 全知说书人视角，镜头随人物自由迁移，叙述者随时插评武理因果与兴亡之叹
diction: 半文半白话本腔，招式肴馔名物罗列见考究，诗词曲赋经史谜对自然嵌入白话
rhetoric_density: medium
dialogue_mode: 「某某道」高频归属，对白承载斗智斗嘴与解谜推案，长独白叙旧供状成段
pacing: 闲笔慢煨与祸变骤至交替，激战长句连绵不断行，临终托孤处逐句放慢
signature_moves:
- 拆招时叙述者亲自讲解拳理渊源与门派来历，武戏兼武学论文
- 饮食、谜对、点菜等生活雅趣场景作大事件之间的呼吸阀，借吃写人
- 嵌套口述史：让周伯通、一灯等角色用长篇第一人称自述补出前史
- 庄谐并置：诛心宣言与诨语撒泼同场，悲剧临头前先给笑闹
- 以物证与细节链推动揭秘，如玉鞋断秤层层倒推真相如断狱
anti_signature:
- 叙述者隐身的冷峻限知视角——金庸的说书人永远在场点破心思
- 意象堆叠的抒情散文化战斗——他的武戏靠招名与力学逻辑而非通感修辞
- 对白用现代翻译腔或心理剖白长句——人物声口须市井话本式短促有锋
author_cross_ref: ''
