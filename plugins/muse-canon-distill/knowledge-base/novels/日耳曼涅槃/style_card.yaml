novel: 日耳曼涅槃
author: 幽冷秋月
lang: zh
translator: ''
narration_voice: 全知军政史观，常直评制度与人物
diction: 雅化中文混军史术语和数据名词
rhetoric_density: medium
dialogue_mode: 对白多为试探、宣言和论证
pacing: 长段推演铺底，关键处爆炸式升压
signature_moves:
- 先列制度或舰队背景，再让人物行动兑现判断
- 用航程、吨位、工时等数据制造压服感
- 把私人情绪迅速接入国家战略或历史分歧
- 重大场面写成仪式、演说、回忆蒙太奇的叠合
- 战斗段以损管报告和灾难意象交替推进
anti_signature:
- 只写轻快对白，不给历史和制度背景
- 军事行动缺少具体数据与技术后果
- 人物只抒情，不进入政军推演
