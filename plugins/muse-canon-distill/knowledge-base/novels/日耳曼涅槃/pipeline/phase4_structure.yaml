# 《日耳曼涅槃》Phase 4 逆向分析：结构（逐 Arc 展开序列）
# 接收 Phase 3 的 7-Arc 框架，逐 Arc 展开为递进序列群；全篇危机/高潮见 phase3_spine.yaml 的 story_climax_design

analysis_meta:
  novel: 日耳曼涅槃
  source_text: navigation.md
  source_form: 长篇网络连载小说（538章约163万字，未完结）
  evidence_note: 序列边界与转折以章节号锚定 segments/segment1-5_summary.md 逐章摘要；关键序列高潮与 scenes/ 切片交叉验证

arc_expansions:
  - arc_id: ARC-1  # 废墟奠基（序章-第100章）
    sequences:
      - seq_id: ARC1-SEQ1
        name: 穿越与融入
        core_conflict: 现代灵魂 vs 战败废墟与陌生身份——能否接受"约纳斯"并找到行动方向
        escalation_direction: 个人身份危机（穿越）→ 家族生存危机（凡尔赛清算、船厂被劫、祖父离世）
        sequence_climax: 凡尔赛和约签订、祖父雷奥悲愤离世（第4章）；葬礼后家族会议上方彦首次输出战略（庞氏骗局构想，第5章）
        closed: 身份认同（决心以约纳斯改天换命）；方彦从被保护的孩童变为家族的隐形大脑
        opened: 废墟中的第一桶金从哪来？
      - seq_id: ARC1-SEQ2
        name: 灾难套利
        core_conflict: 家族资本 vs 崩坏的经济秩序——在通胀地狱里逆势扩张
        escalation_direction: 瓦尔特赴美庞氏骗局（第6-8章）→ 苏俄分厂布局（第9-10章）→ 鲁尔危机马克崩溃中大肆抄底（第11-12章）
        sequence_climax: 恶性通胀顶点，布罗姆家族以外汇吃进资产、完成原始积累（第12章）
        closed: 资本杠杆成型；"历史先知=套利工具"的兑换模式首次跑通
        opened: 钱要投向何处才能改变国运？（海军/政治两条管道待开）
      - seq_id: ARC1-SEQ3
        name: 意大利与石油
        core_conflict: 少年身份 vs 国家级合作的门槛——用革命性舰船设计撬开齐亚诺家族
        escalation_direction: 咖啡馆识人（第13章）→ 连夜绘制战舰总图（第16章）→ 设计震撼船厂（第17-18章）→ 西尔维娅定情（第20章）→ 利比亚石油发现（第30章）
        sequence_climax: 锡尔特盆地石油确认+安莎尔多订单+2400万里拉专利费（第30-31章）
        closed: 德意合作通道、石油命脉、婚姻同盟三线并成
        opened: 政治靠山缺位——工业与资本需要权力保护伞
      - seq_id: ARC1-SEQ4
        name: 危险的投资
        core_conflict: 识别潜力股 vs 与魔鬼签约的风险——狱中希特勒与妖妇琳娜两笔"不可控投资"
        escalation_direction: 兰德斯堡监狱精心表演种族理论（第32-34章）→ 5万马克政治投资（第35章）→ 琳娜设局强占（第36-39章）
        sequence_climax: 与希特勒缔结私人纽带并承诺季度资助（第35章）
        closed: 政治期权买入；国社党线开通
        opened: 琳娜这枚不受控的暗子（多年后将成为反纳粹暗线入口）；政治投资的回报与反噬待验
      - seq_id: ARC1-SEQ5
        name: 海军之路
        core_conflict: 军校新丁 vs 论资排辈的军官团——用超越时代的战略思想换取跳级式关注
        escalation_direction: 入伍磨砺（第40-41章）→ 论文震动雷德尔（第44-45章）→ 三日长谈兜售"决战型破交"（第46-48章）→ 著书风靡全德（第59-64章）→ 袖珍战巡方案定型（第69-70章）→ 少尉（第71章）
        sequence_climax: 《公海舰队兴衰启示录》40万册轰动、推动英国绥靖思潮萌芽（第61-64章）
        closed: 军职+军内伯乐+全国声望三重加持；海军战略话语权确立
        opened: 战略要变成真舰队，还差政权、预算与航空兵
      - seq_id: ARC1-SEQ6
        name: 收网
        core_conflict: 多线并进 vs 时间窗口（大萧条与政局剧变将至）——赶在风暴前完成布局
        escalation_direction: 琳娜以照片要挟复联（第81-83章）→ 米兰婚礼（第88章）→ 股灾中深度资助国社党（第91章）→ 挖美国专家（第98章）→ 暗杀戈林（第99章）
        sequence_climax: 雇凶铲除戈林——为未来海军航空兵扫清最大体制障碍（第99章）
        closed: 奠基期全部落子完成：资本、人脉、军职、政治期权、技术储备
        opened: 航母竞标与纳粹上台——布局进入兑现期
    arc_progression_note: 六个序列按"身份→资本→外援→政权→军权→收网"递进，每序列闭合一种资源、打开下一种资源的缺口；暗杀戈林是奠基期唯一的"脏手"行动，预示方彦为目标可以逾越常规底线

  - arc_id: ARC-2  # 战争机器（第101-165章）
    sequences:
      - seq_id: ARC2-SEQ1
        name: 竞标与政权更迭
        core_conflict: 航母理念 vs 炮舰传统；国社党 vs 魏玛宪政
        escalation_direction: 斜角甲板方案技压群雄（第101-102章）→ 国社党大选跃升（第103章）→ 希特勒就任总理、一体化（第108-110章）→ 退出国联（第111-112章）
        sequence_climax: 希特勒上台、基尔军港与方彦亲密重逢——政治投资全额兑付（第108-109章）
        closed: 权力保护伞就位；航母竞标胜出
        opened: 雷德尔目睹元首与方彦的亲密后"眉头紧锁"——军内猜忌的种子（第109章）
      - seq_id: ARC2-SEQ2
        name: 装备革命
        core_conflict: 方彦的后世蓝图 vs 各军种的技术惯性与资源争夺
        escalation_direction: 山猫坦克（第114-115、127章）→ 新海军发展计划（第116-117章）→ 英德海军协定解除枷锁（第119-120章）→ 氧气鱼雷技术交易（第129-131章）→ 瓦尔特掌四年计划（第134章）→ 齐柏林级装甲航母下水（第142章）
        sequence_climax: 英德海军协定签署，德国海军枷锁彻底解除、船厂获数亿马克合同（第120章）
        closed: 海陆空装备体系按方彦蓝图成型；家族权力（经济部）与军工利益深度绑定
        opened: 装备就位后，扩张冒险的政治节奏由希特勒掌控——方彦只能搭车
      - seq_id: ARC2-SEQ3
        name: 扩张与觉醒
        core_conflict: 国势日隆的狂欢 vs 政权罪恶的显影——方彦的道德立场经受正面轰击
        escalation_direction: 德奥合并（第149-150章）→ 苏台德危机（第151-152章）→ 琳娜以密谋组织成员身份重现、揭露暴行（第153-154章）→ 慕尼黑绥靖（第155-156章）→ 水晶之夜（第157章）
        sequence_climax: 水晶之夜——方彦对希特勒产生强烈厌恶，坚定推翻国社党统治的决心（第157章）
        closed: 道德翻转完成：从合作者到秘密反叛者；琳娜线从情欲纠缠升维为政治同盟
        opened: 如何既造战争机器又埋反纳粹火种——双面人生开始
      - seq_id: ARC2-SEQ4
        name: 战争前夜
        core_conflict: 奇袭构想 vs 海军保守派与 Z 计划幻想；备战 vs 诀别
        escalation_direction: 呈交斯卡帕湾方案（第158章）→ 否定 Z 计划、力主航母优先（第159章）→ 钢铁盟约与苏德条约（第161、165章）→ 与西尔维娅诀别、登俾斯麦号（第162-163章）→ 舰队夜雾出港（第164章）
        sequence_climax: 大洋舰队隐蔽出港、抵达挪威海待命——战争机器上膛（第164-165章）
        closed: 二十一年铺垫全部装填完毕
        opened: 英法是否宣战？奇袭能否成功？（悬念直接引爆 ARC-3）
    arc_progression_note: 四序列是"兑现→建造→变质→上膛"的完整装填过程；SEQ3 的道德觉醒被刻意插在军备狂欢与战争爆发之间，使 ARC-3 之后的每场胜利都自带道德阴影

  - arc_id: ARC-3  # 天谴与凯旋（第166-254章）
    sequences:
      - seq_id: ARC3-SEQ1
        name: 天谴降临（斯卡帕湾）
        core_conflict: 300架舰载机的奇袭方案 vs 皇家海军百年威严；计划精度 vs 战场意外（剑鱼侦察机暴露行踪）
        escalation_direction: 宣战与放飞（第166-168章）→ 两波空袭屠戮港内主力（第169-174章）→ 行踪暴露、俾斯麦号主动诱敌（第173、175-177章）→ 全身而退（第178-179章）
        sequence_climax: 英国本土舰队主力在港内覆灭；俾斯麦号以装甲飞行甲板扛住岸基报复（第174-177章）
        closed: 开战首日海权天平倾斜；航母时代以最暴烈方式宣告降临
        opened: 英国的举国反扑（丘吉尔回归海军部）；德国舰队深入大西洋的补给与退路问题
      - seq_id: ARC3-SEQ2
        name: 大西洋绞杀
        core_conflict: 破交体系（航母+袖珍战巡+狼群）vs 英国护航体系的重组
        escalation_direction: 航母破交开张（第206-208章）→ 舍尔号单舰屠杀船队（第201-204章）→ 狼群战术首秀（第195-200章）→ 磁性水雷封锁（第190-191章）
        sequence_climax: HX 船队连续覆灭、英国海上生命线告急，邦德倾全部主力围捕（第204-205章）
        closed: 三位一体破交体系经实战验证
        opened: 主力围捕网收拢——德国舰队如何全身而退
      - seq_id: ARC3-SEQ3
        name: 瀚海风波
        core_conflict: 受创舰队的归途 vs 英国全洋搜索网；方彦的冷静计算 vs 舰队的恐慌本能
        escalation_direction: 布吕歇尔号中雷（第215章）→ 方彦力主原地补油（第216章）→ 哈伍德舰队覆灭（第219-224章）→ 暴怒号被炸沉（第225-226章）→ 摩尔曼斯克入坞与军火黑市交易（第232-238章）→ 北海强行突围（第240-244章）
        sequence_climax: G 舰队4巡洋舰全灭+暴怒号沉没——围捕网被逐个击碎（第224、226章）
        closed: 舰队安全返航；苏联通道与军火交易（连环计的第一环）埋设完成
        opened: 军火的真实去向（芬兰）；苏德关系的暗盘博弈
      - seq_id: ARC3-SEQ4
        name: 凯旋与核火种
        core_conflict: 国家英雄的荣光 vs 权力场的暗流；核武远见 vs 现实资源约束
        escalation_direction: 威廉港20万人凯旋（第245章）→ 授勋晋升准将、希特勒借机在海军培植亲信（第245-246章）→ 说服瓦尔特启动钚弹路线（第251-254章）
        sequence_climax: 核武项目获批——全书最长线的伏笔点火（第253-254章）
        closed: 首航战役叙事完整闭环；方彦完成从设计师到统帅候补的形象升格
        opened: 雷德尔以论功行赏维护权威 vs 希特勒借授勋掺沙子——两个靠山的暗斗启动（第246章）
    arc_progression_note: 四序列按"奇袭→绞杀→脱险→加冕"排列，冲击力先军事后政治；SEQ3 用15章的连续危机证明方彦的价值不止于设计（临机决断），为 ARC-4 的统帅认证做铺垫

  - arc_id: ARC-4  # 北海霸权（第255-352章）
    sequences:
      - seq_id: ARC4-SEQ1
        name: 冬季连环计
        core_conflict: 方彦的多米诺设计（军火→芬兰→苏联受挫→对德让利）vs 大国博弈的不可控性
        escalation_direction: 军火验货启运（第256、271-273章）→ 冬季战争爆发（第275章）→ 意大利渠道倒卖、17倍暴利（第276-278章）→ 苏军铩羽（第279-281章）→ 苏联对德贸易让步（第299-300章）
        sequence_climax: 连环计全链闭合——苏联在苏德贸易中被迫让利（第300章）
        closed: 经济外交暗战的完胜；"用敌人的军火削弱敌人"的方氏手筋定型
        opened: 北欧军事真空暴露——英德两国同时盯上挪威
      - seq_id: ARC4-SEQ2
        name: 威悉河演习
        core_conflict: 抢滩时间差（德军先手 vs 英军已在装船）；方彦的历史教训（布吕歇尔号之殇）vs 传统海攻方案
        escalation_direction: 雷德尔提出占领挪威（第286章）→ 方彦力主奥斯陆改空降（第291章）→ 伞兵夺奥斯陆、国王被俘（第315-317章）→ 全线得手、丹麦一日而下（第318章）
        sequence_climax: 空降奥斯陆成功——历史上损失惨重的强攻被先知知识改写为奇袭（第315-317章）
        closed: 北欧侧翼与铁矿石生命线锁定
        opened: 英国本土舰队倾巢反扑——决战不可避免
      - seq_id: ARC4-SEQ3
        name: 卑尔根海战
        core_conflict: 英军诱饵-杀招双层战术 vs 方彦的战略解题；巨舰对轰的钢铁法则 vs 航空兵的降维打击
        escalation_direction: 托维设诱饵战术（第319章）→ 方彦判定英军必攻卑尔根、舰队南下（第322-324章）→ 战列舰白刃战（第326-340章）→ 氧气鱼雷终结罗德尼号（第340章）→ 舰载机全歼英主力（第341-345章）→ 追歼航母编队（第346-349章）→ 英机自杀撞击、方彦重伤（第350-352章）
        sequence_climax: 英4战列舰3航母覆灭、福布斯殉舰；方彦在胜利顶点被撞成重伤（第345-352章）
        closed: 海权更替完成（英国两支主力舰队先后覆灭）；方彦的统帅认证以血价签收
        opened: 方彦生死未卜；不世战功将如何搅动柏林的权力平衡
    arc_progression_note: 三序列是"谋略→奇兵→决战"的经典递进，连环计（经济）→威悉河（登陆）→卑尔根（决战）一环咬一环；Arc 高潮同时是个人生死危机——全书首次把胜利与代价焊死在同一场景

  - arc_id: ARC-5  # 权力暗流（第353-400章）
    sequences:
      - seq_id: ARC5-SEQ1
        name: 震动与苏醒
        core_conflict: 胜利的世界级冲击波 vs 方彦的生死一线
        escalation_direction: 柏林狂喜与紧急抢救（第353-354章）→ 英国举国悲痛、张伯伦辞职（第355-356章）→ 美国资本转向观望（第357-358章）→ 方彦昏迷5天后苏醒（第359章）
        sequence_climax: 张伯伦倒台+美国暂停援英宣传——战略格局因一场海战重排（第356、358章）
        closed: 卑尔根余波的全景呈现；希特勒派专机救命的"恩情债"记账（第359章）
        opened: 功高震主——雷德尔的忌惮进入行动阶段
      - seq_id: ARC5-SEQ2
        name: 明升暗降
        core_conflict: 雷德尔的体制自卫 vs 方彦的战功声望；文职牢笼 vs 战略价值自证
        escalation_direction: 雷德尔密谋调离（第360章）→ 借海战失误解除舰队职务、晋少将调造修局（第368-369章）→ 方彦以舰艇规划自证不可替代（第371-372章）
        sequence_climax: 授衔仪式上方彦洞悉"少将军衔=文职枷锁"的真实含义（第369章）
        closed: 雷德尔的猜忌落地为人事安排
        opened: 希特勒会如何利用这道裂缝？
      - seq_id: ARC5-SEQ3
        name: 信念抉择
        core_conflict: 权力的最短路径（配合倒雷德尔）vs 军人操守与体制大局
        escalation_direction: 邓尼茨携元首密令登门利诱（第373-374章）→ 方彦断然拒绝、当夜直谏希特勒（第375章）→ 希特勒失望震怒、鲍曼落井下石构陷瓦尔特（第376-377章）
        sequence_climax: 深夜面见希特勒拒绝倒雷——在权力与操守间选择操守（第375章）【全书危机节点】
        closed: 人物真相的最深揭示；方彦主动关闭了"元首之刃"这条上升通道
        opened: 双重困境（军内雪藏+元首失宠）如何破局
      - seq_id: ARC5-SEQ4
        name: 罗马斡旋
        core_conflict: 被雪藏者的价值重建 vs 意大利海军的派系泥潭
        escalation_direction: 赴意考察（第378-380章）→ 诊断意海军航空瘸腿（第381-382章）→ 借小齐亚诺的继承人之争威迫成事（第383-384章）→ 冬战落幕（第389章）→ 受命西线（第390-392章）
        sequence_climax: 意大利海军获独立海航——方彦在体制外重建战略价值（第384章）
        closed: 德意军事纽带加固；方彦证明自己不依附任何单一靠山也有筹码
        opened: 法兰西战役——方彦以海航协调者身份重返战争舞台
    arc_progression_note: 四序列构成"余波→收网→抉择→自救"的政治剧结构，与前一 Arc 的军事巅峰形成反相对照；第375章的选择是全书人格弧的顶点——此后方彦的一切政治经营（造神、联盟）都是对这次"失宠"的迂回补偿

  - arc_id: ARC-6  # 大陆征服（第401-470章）
    sequences:
      - seq_id: ARC6-SEQ1
        name: 黄色方案
        core_conflict: 镰割计划的速度赌博 vs 联军的数量优势与马奇诺迷信
        escalation_direction: 埃本-埃迈尔滑翔机奇袭（第402-404章）→ 联军主力被诱入比利时（第405-406章）→ 色当渡河、三点突破（第411-413章）→ 法军总崩溃（第415-416章）→ 装甲师抗命疾进（第417-419章）→ 抵达海峡、70万联军被断（第421章）
        sequence_climax: 古德里安抵达英吉利海峡——北线联军合围完成（第421章）
        closed: 陆战胜局奠定；方彦的海航空地协同首次大规模实战
        opened: 敦刻尔克口袋能否扎死——历史上最著名的"停止令"逼近
      - seq_id: ARC6-SEQ2
        name: 敦刻尔克
        core_conflict: 方彦的历史记忆（33万人从眼皮下逃走）vs 希特勒的政治幻想（保留英国体面以招安）
        escalation_direction: 方彦剖析撤退可能性（第422-423章）→ 携航拍照片闯入决策现场（第424章）→ "大国和平只有两种"击碎招安幻想（第425章）→ 英军突围失败、比利时投降（第427-428章）→ 18万英军投降、仅2万逃脱（第429-430章）
        sequence_climax: 希特勒收回停止令、装甲部队封死海滩（第425章）【全书最关键历史分歧】
        closed: 英国陆军精华被连锅端——对英战略的决定性筹码入手
        opened: 失去陆军的英国是求和还是死战？
      - seq_id: ARC6-SEQ3
        name: 法兰西落幕
        core_conflict: 德国的怀柔算计 vs 意大利的抢桃与英国的釜底抽薪（弩炮行动）
        escalation_direction: 墨索里尼末班车宣战（第431章）→ 贝当上台求和（第437-438章）→ 贡比涅车厢签字（第442章）→ 英国扣押法国舰队（第457-458章）
        sequence_climax: 贡比涅森林福煦车厢停战签字——1918年国耻的镜像复仇（第442章）
        closed: 西线战争落幕；1918年11月11日（穿越日）的历史创伤在叙事层完成对位闭环
        opened: 英国拒和已成定局——对英终局方案提上日程
      - seq_id: ARC6-SEQ4
        name: 造神运动
        core_conflict: 政治自保的需要 vs 亲手放大独裁者的风险
        escalation_direction: 编纂"希特勒思想"体系（第444-445章）→ 制作元首颂歌（第446-447章）→ 纪录片全国放映（第463-465章）→ 颂歌发布轰动（第466-467章）→ 瓦尔特借造神保住权位（第480章）→ 希特勒因造神愈发膨胀（第469章）
        sequence_climax: 元首颂歌发布、方彦政治影响力跃升（第466章）
        closed: 方彦以意识形态工程完成政治重生，雷德尔被迫转变态度（第468章）
        opened: 造神的反噬——一个更自信更专断的希特勒（第469章）；这台神像机器未来如何拆除？
    arc_progression_note: 军事三序列（突破→围歼→受降）与政治一序列（造神）交织；敦刻尔克是方彦"知识杠杆"的极限演出——不靠职务靠认知改写战略结局；造神运动把"喂养魔鬼"的主题推到自觉层面，方彦的道德账本进一步透支

  - arc_id: ARC-7  # 海峡与巨岩（第471-538章，未完）
    sequences:
      - seq_id: ARC7-SEQ1
        name: 对英战略之争
        core_conflict: 海狮登陆的浪漫想象 vs 方彦的现实主义绞杀路线（制海权→直布罗陀→封锁）
        escalation_direction: 希特勒拒和决心武力解决（第471章）→ 最高军事会议登陆之争（第472-474章）→ 方彦抛出直布罗陀方案（第475-476章）→ 登陆艇与陆战队筹建（第478、482-484章）→ 法国港口破交升级（第489-491章）
        sequence_climax: 直布罗陀战略确立——对英作战从"登陆幻想"收束为"绞杀体系"（第475-476章）
        closed: 战略方向权正式落入方彦之手（从执行者升为战略设计者）
        opened: 英国海军残余力量的最后反扑
      - seq_id: ARC7-SEQ2
        name: 丹麦海峡夜战
        core_conflict: 托维的夜战窗口理论（航母夜盲）vs 德军的雷达与巨舰
        escalation_direction: 托维制定夜袭计划（第492-493章）→ 夜幕接敌（第494-496章）→ 混战互创（第497-503章）→ 战损清点与战略评估（第504-506章）
        sequence_climax: 夜战互创——德航母受创但英国付出上万水兵与主力舰的代价，最后的主动反击被挫（第501-505章）
        closed: 英国海上反击能力基本出清；方彦获得更大指挥权（第507章）
        opened: 情报泄露的暗线追查（第513章）；直布罗陀万事俱备
      - seq_id: ARC7-SEQ3
        name: 纽伦堡与筹备
        core_conflict: 轴心同盟的貌合神离（西班牙的要价、意大利的避战）vs 战役窗口期
        escalation_direction: 纽伦堡党代会造神巅峰（第514-519章）→ 佛朗哥谈判（第518、526章）→ 战役筹备完成（第524-532章）
        sequence_climax: 德西军事合作达成、直布罗陀战役条件齐备（第526-527章）
        closed: 政治与后勤的全部前置条件
        opened: 巨岩要塞的攻坚血价
      - seq_id: ARC7-SEQ4
        name: 浴血与出征
        core_conflict: 山地攻坚的血肉磨盘 vs 孤山要塞的先天缺陷；意大利海军的避战私心 vs 方彦的联盟操纵
        escalation_direction: 1300架次空袭开路（第533章）→ 山地师血战巨岩（第534-536章）→ 英军士气崩溃、要塞陷落（第537章）→ 方彦借墨索里尼之手收缴意舰队指挥权（第538章）
        sequence_climax: 直布罗陀陷落+德意联合舰队出征——绞索合拢（第537-538章）【文本在此中断】
        closed: 地中海门户易手；意大利主力舰队纳入德国指挥体系
        opened: 【未完结悬置】大西洋终局之战；美国参战倒计时；反纳粹清算；核武；琳娜母子
    arc_progression_note: 四序列按"定策→拔刺→筑台→亮剑"推进；本 Arc 方彦的战场从舰桥彻底转移到会议桌与外交场——爽点形态从战术胜利升级为体系操纵，断章恰停在体系合拢、终局未启的最大张力点

# ── 全篇递进关系 ──

arc_progression:
  impact_escalation: >-
    军事冲击力逐级放大：暗杀个人（ARC-1戈林）→ 装备体系（ARC-2）→ 港内奇袭（ARC-3斯卡帕湾）
    → 舰队决战（ARC-4卑尔根）→ 大陆围歼（ARC-6敦刻尔克/法国）→ 要塞攻坚+联盟体系（ARC-7直布罗陀），
    每一级都把"英国的生存余地"进一步压缩；政治线冲击力与军事线反相交错——军事巅峰即政治危机
    （ARC-4重伤→ARC-5雪藏），军事空窗即政治攻势（ARC-6造神）；个人代价同步递增：
    金钱→道德（暗杀、造神）→ 鲜血（重伤）→ 权力处境（双重失宠）
  causal_chain: >-
    ARC-1 四重杠杆（资本/人脉/军职/政治期权）→ 使 ARC-2 装备革命与政治兑现可能 →
    战争机器上膛引爆 ARC-3 斯卡帕湾首胜与大西洋主动权 → 首胜树立的航空权威+摩尔曼斯克
    连环计使 ARC-4 威悉河与卑尔根决战可行 → 卑尔根的不世战功直接引发 ARC-5 功高震主
    与信念抉择 → 被雪藏反而使方彦以战略家身份介入 ARC-6 敦刻尔克决策、并以造神运动
    完成政治重生 → 西线全胜+政治资本使 ARC-7 方彦上位为对英绞杀战略的总设计师——
    每个 Arc 的收益与代价共同构成下个 Arc 的初始条件

# ── 多线叙事 ──

narrative_threads:
  - name: 军事线（海军建设与海战）
    description: 舰船设计→装备体系→破交→决战→绞杀体系，全书的骨架与卖点
    primary_arcs: [ARC-2, ARC-3, ARC-4, ARC-7]
  - name: 政治线（权力博弈）
    description: 希特勒投资与恩宠、雷德尔伯乐与猜忌、鲍曼构陷、造神运动——体制内生存的明暗手
    primary_arcs: [ARC-1, ARC-5, ARC-6]
  - name: 商业线（家族资本）
    description: 庞氏骗局、通胀套利、石油、军火倒卖、汇率掠夺——为军事政治线供血
    primary_arcs: [ARC-1]
    presence: ARC-4 军火连环计、ARC-6 汇率掠夺等间歇浮现
  - name: 情感线（西尔维娅/琳娜）
    description: 西尔维娅=德意联盟的人性支点与家庭锚；琳娜=从情欲纠缠升维为反纳粹暗线入口
    primary_arcs: []
    presence: 贯穿间歇——每逢出征/危机/团圆节点浮现（第57、88、113、162、249、297、359章）
  - name: 反纳粹暗线（密谋组织）
    description: 琳娜-沙赫特-密谋组织；方彦的道德觉醒与"推翻国社党"的长线承诺
    primary_arcs: []
    presence: 蛰伏贯穿——第36-39/81-83/92章（琳娜蜕变）、第153-157章（觉醒）、第301-303章（密谋受挫）、第375章（操守表态）；截至断章从未独立成 Arc，始终作为张力背景
  - name: 核武暗线
    description: 钚弹路线规划（第251-254章点火）——全书最长的未爆引信
    primary_arcs: []
    presence: ARC-3 末点火后蛰伏，断章前未再展开
  - name: 普通人窗口（沃克一家）
    description: 船厂工人家庭的餐桌与信仰——民意底座的定期采样，校准精英叙事
    primary_arcs: []
    presence: 特定章节——第140-141、184、295-296、464章
  - name: 历史对照线
    description: 叙述持续提示真实历史轨道（布吕歇尔号之殇、敦刻尔克奇迹、不列颠空战），供读者对比架空分岔——"历史分歧快感"的来源
    primary_arcs: []
    presence: 贯穿，以叙述者直评与方彦内心独白形式出现

