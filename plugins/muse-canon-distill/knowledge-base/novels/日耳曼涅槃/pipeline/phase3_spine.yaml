# 《日耳曼涅槃》Phase 3 逆向分析：故事脊椎 + Arc 框架
# 从结局回溯：断章顶点（直布罗陀+出征）→ 追因果链至激励事件（魂穿投降日）

analysis_meta:
  novel: 日耳曼涅槃
  source_text: navigation.md
  source_form: 长篇网络连载小说（538章约163万字，未完结）
  evidence_note: 激励事件与顶点章节读原文（序章-第2章、第537-538章）；Arc 边界依据 navigation.md 结构标记 + segments/ 逐章摘要交叉验证

inciting_incident:
  description: >-
    现代留学生方彦触发"黑豹"军品店店主所赠的神秘橡叶勋章，魂穿到1918年11月11日
    ——德国向协约国投降当天——的汉堡，成为布罗姆-福斯造船厂家族10岁幼子约纳斯；
    养病数日内他面对"卷款赴美享乐"与"改天换命"的岔路，毅然选择后者：
    "让历史上由英语国家主导的世界秩序被砸得粉碎吧"（序章-第1章）
  type: accident（穿越为意外；第1章末的决心把意外转化为自觉使命——事件的后半是 decision）
  timing: 序章-第1章（全书前0.5%；穿越日期与国家投降日重合，个人失衡与民族失衡同频共振）
  balance_before: 现代位面——孤儿留学生勤工俭学，德棍情结只存在于脑洞；1918位面——约纳斯是富家病童，家族在战败中惶然自保
  balance_after: 先知灵魂进入资本平台——拥有改写历史的知识与本钱，却身处战败国废墟，背负10岁躯壳与漫长的时间锁
  impact_on_protagonist: 幻想变成可执行却地狱难度的终身使命；从此每一步人生选择（学业、军职、婚姻、投资、著述）都成为战略布局的棋子

desire_object:
  conscious: 让德国赢得下一场对英战争、砸碎英语国家主导的世界秩序（第1章立誓；第7章确定海军为核心杠杆）
  unconscious: 为德意志找一条不属于纳粹的涅槃之路——在不背叛良知的前提下完成复兴（第153-157章被琳娜唤醒后显影；书名"涅槃"的完整含义包含"烧掉的必须是什么"这一未答之问）
  tension: 复兴必须借纳粹的权力杠杆，良知却要求最终清算它——他越成功，喂养的政权越强大，未来的清算越难、自身的共谋越深

spine_statement: >-
  一个知晓历史的穿越者，以二十年经营把自己嵌入第三帝国战争机器的每个杠杆点，
  为德意志赢得海权与生存空间——同时暗中为推翻这个他亲手喂大的政权保留火种。
spine_type: conscious（主线由自觉欲望驱动且高度自洽；unconscious 需要以琳娜暗线形式潜行，截至断章未与主线正面相撞）

dramatic_question:
  question: 方彦能否既让德国赢得战争、又阻止并清算纳粹的罪恶——鱼与熊掌能否兼得？（表层问题：德国能否击败英国？）
  obligatory_scene: >-
    方彦与希特勒的最终摊牌/决裂（推翻或被清算）——未完结文本中缺席。
    现有最接近的预演：第375章深夜拒绝希特勒（在权力与操守间选择操守）
    与第157章暗下推翻决心。表层问题的必备场景（对英终局之战）同样悬置。

opposing_forces:
  internal: 对希特勒的私人恩情（第359章救命）vs 对其政权罪恶的憎恶（第157章水晶之夜）；战功即共谋的道德负债；穿越者真相无人可诉的孤独
  personal: 雷德尔的伯乐→猜忌→雪藏三部曲（第45→246→368章）；鲍曼的嫉妒构陷（第366-377章）；希特勒的拉拢-控制欲（第373-375章）；意大利盟友的离心算计（第538章）
  external: 英国海军及其国家意志（丘吉尔"永远打下去"第426章）；美国参战的时间窗口（第262、358、455章持续倒计时）；苏联的机会主义扩张（第209、437章）；历史大势的惯性本身

# ── Arc 框架：7个叙事弧，由重大价值逆转划界 ──

arcs:
  - arc_id: ARC-1
    name: 废墟奠基（序章-第100章，1918-1930）
    value_at_start: 战败废墟中的无名孩童——知识与抱负毫无兑现渠道
    value_at_end: 手握资本、人脉、军职、政治期权四重杠杆的体制内玩家
    climax_event: 暗杀戈林扫清未来空军独立的最大障碍（第99章），携航母方案赴柏林竞标（第100章）
    function_note: establishing——铺设"知识→资本→权力"的兑换管道；意大利线/希特勒线/雷德尔线/琳娜线全部开局
  - arc_id: ARC-2
    name: 战争机器（第101-165章，1930-1939.8）
    value_at_start: 杠杆就位，但国家机器仍被凡尔赛枷锁与魏玛政局锁死
    value_at_end: 第三帝国海空陆装备体系按方彦蓝图成型、舰队隐蔽出港待命；方彦道德立场却从合作翻转为秘密反叛
    climax_event: 奇袭斯卡帕湾方案获准、大洋舰队战前出港（第158-165章）；道德线高潮=水晶之夜后决心推翻国社党（第157章）
    function_note: escalating——政治投资兑现（纳粹上台第108章）与军备革命并进；军事上膛与道德反转同步完成，构成全书的双线引信
  - arc_id: ARC-3
    name: 天谴与凯旋（第166-254章，1939.9-12）
    value_at_start: 纸上的战略与未经战火检验的舰队
    value_at_end: 英国本土舰队主力覆灭、大西洋主动权易手；方彦成为国家英雄（准将），并点燃核武火种
    climax_event: 300余架舰载机突袭斯卡帕湾，英本土舰队主力覆灭（第168-179章）【全书第一高潮】
    function_note: climactic——首胜验证全部前期铺垫；瀚海风波（第212-244章）与摩尔曼斯克军火交易埋下连环计伏笔
  - arc_id: ARC-4
    name: 北海霸权（第255-352章，1939.12-1940.1）
    value_at_start: 破交游击时代——德国海军仍回避正面决战
    value_at_end: 卑尔根决战全歼英国第二支主力舰队，海权更替完成；方彦重伤昏迷——胜利首次索取个人血价
    climax_event: 卑尔根海战击沉英4战列舰3航母；英机撞击希佩尔号舰桥、方彦重伤（第326-352章）【全书第二高潮】
    function_note: climactic——军事线登顶；援芬连环计（第236-300章）与威悉河演习（第286-318章）为决战铺路
  - arc_id: ARC-5
    name: 权力暗流（第353-400章，1940.2-5）
    value_at_start: 军事巅峰的国家英雄
    value_at_end: 被雷德尔雪藏+拒绝希特勒拉拢+遭鲍曼构陷的双重困境者；借意大利海航斡旋重建自身价值
    climax_event: 深夜面见希特勒、拒绝配合搞掉雷德尔——在权力与操守之间选择操守（第375章）【全书危机节点】
    function_note: transitional/crisis——外胜内危的反相结构；压力下的选择完成方彦人格的最深揭示（麦基式人物真相）
  - arc_id: ARC-6
    name: 大陆征服（第401-470章，1940.5-7）
    value_at_start: 被锁进文职的战略家 + 悬而未决的西线战局
    value_at_end: 法国投降、18万英军敦刻尔克被俘（全书最大历史分歧兑现）；方彦借造神运动完成政治自保与影响力重建
    climax_event: 用航拍数据与"大国和平两种论"说服希特勒取消停止令→敦刻尔克围歼（第424-430章）；政治线高潮=元首颂歌发布（第466章）
    function_note: climactic——军事高潮与政治重生双线合流；造神运动同时埋下独裁者膨胀的反噬伏笔（第469章）
  - arc_id: ARC-7
    name: 海峡与巨岩（第471-538章，1940.7-10，未完）
    value_at_start: 西线胜利后的战略迷茫——英国拒和、德国目标分散（本土/直布罗陀/北非/苏联）
    value_at_end: 直布罗陀陷落、意大利舰队入彀、德意联合舰队出征——绞索套上英国（文本在此中断）
    climax_event: 直布罗陀战役攻克要塞（第533-537章）【全书第三高潮】+ 方彦操纵意大利交出舰队指挥权、联合舰队出征（第538章）
    function_note: 未完成的 climactic——对英绞杀体系合拢前夜断章；反纳粹暗线、核武线、美苏变量全部悬置

story_climax_design:
  crisis:
    dilemma: >-
      （现有文本最深的两难，第373-375章）配合希特勒扳倒雷德尔，换取海军大权与
      元首绝对信任——还是拒绝，保住军人操守与海军体制的完整，却同时得罪独裁者
      并坐实自己被雪藏的处境
    option_a: 接受邓尼茨转达的交易——中将军衔与未来海军总司令之位（权力最大化，成为纯粹的元首之刃）
    option_b: 拒绝，并当夜直谏保雷德尔（操守优先，承受"背叛"独裁者的代价，两头失宠）
    character_revelation: >-
      方彦不是权力动物——他的复兴事业存在不可让渡的底线；这一底线是"推翻纳粹"
      暗线在人格层面的保证金：一个会为操守得罪独裁者的人，才可能在终局背叛独裁者
  climax:
    action: >-
      （截至断章的故事级顶点）直布罗陀要塞陷落 + 方彦以外交杠杆迫使意大利海军
      交出联合舰队指挥权，10月3日德意联合舰队自塔兰托出征大西洋（第533-538章）
    value_change:
      from: 英国握有地中海门户与海上生命线，尚存翻盘空间
      to: 德国绞索合拢——英国的生存只剩美援一线悬命
    controlling_idea_expression: >-
      先知知识+体制经营可以逆转民族命运（主控思想前半句的最强兑现）；
      但"涅槃"的道德下半场——烧掉纳粹这层旧皮——尚未开演（主控思想后半句悬置）
  resolution:
    new_balance: 无——小说未完结，止于出征晨光与"再没有谁能挽救英国的命运"的宣告（第538章）
    lingering_feeling: >-
      悬置的胜利前夜感。读者带着三个未爆引信离场：对英终局之战、方彦与纳粹的
      清算（琳娜/密谋组织/核武均在场外待命）、以及美苏两个正在苏醒的巨影
