# 《日耳曼涅槃》Phase 2 逆向分析：人物系统设计图
# 只记角色之间的功能分配、对比轴、关系网与权力动态；个体维度见 characters/*.md 与 Phase B 蒸馏产物

analysis_meta:
  novel: 日耳曼涅槃
  source_text: navigation.md
  source_form: 长篇网络连载小说（538章约163万字，未完结）
  evidence_note: 角色功能与关系以章节号锚定 segments/ 逐章摘要与 scenes/ 切片；系统级信息与个体画像分工（不重复记录）

cast_overview:
  protagonist: 方彦/约纳斯·布罗姆（穿越者——海军军官+军工设计师+政治投资人三位一体）
  antagonist: >-
    复合对抗体，逐 Arc 轮换主承担者：外敌=英国海军及其国家意志（丘吉尔/福布斯/托维，贯穿）；
    体制内=雷德尔（明，伯乐转猜忌，第360-372章）与鲍曼（暗，嫉妒构陷，第366-377章）；
    终极=希特勒与国社党政权本身——方彦"必须依赖又必须推翻"的对象（第157章立志，未爆）
  supporting_cast:
    - name: 阿道夫·希特勒
      function: 双刃轴心——政治靠山/资源阀门/救命恩人，同时是道德负债的债主与终极清算对象；其个人意志是全书最大的不可控变数（第166章误判、第469章膨胀）
    - name: 埃里希·雷德尔
      function: 军事伯乐与体制天花板——提供海军线的上升通道（第45章）也执行体制的自卫性打压（第368章）；方彦军旅命运的调节阀
    - name: 西尔维娅·齐亚诺
      function: 明线感情支柱+德意联盟的人性化接口（齐亚诺家族纽带）；飞行员身份提供技术线灵感（第57-58章远程飞机）
    - name: 琳娜
      function: 暗线枢纽——从情欲纠缠（第36-39章）蜕变为反纳粹密谋组织联络人（第153章）；方彦道德觉醒的点火器与"推翻纳粹"承诺的持券人；私生子艾瑞克是悬置的宿命变量
    - name: 瓦尔特
      function: 家族权力的政界延伸——庞氏骗局操盘手→四年计划负责人→经济部长；方彦经济政策与核武计划的执行阀门（第134、253章）；也是鲍曼攻击家族的突破口（第376章）
    - name: 鲁道夫
      function: 家族工业执行者与父辈锚点——把方彦的构想转化为船厂决策（第9、26、50章）
    - name: 弗雷亚
      function: 苏联分厂经营者——家族的东方触角与苏联情报来源（第89、128、135章）
    - name: 海德里希
      function: 潜伏英国的战略间谍——斯卡帕湾情报的来源（第145章）；方彦"长线布子"手法的人格化
    - name: 卡尔·邓尼茨
      function: 狼群战术执行者（第195-200章）+ 希特勒的说客（第373-374章）——军事同僚与政治试探的双重面孔
    - name: 海因茨·古德里安
      function: 陆军装甲盟友——方彦装备理念在陆军的接口与背书人（第127、267章）
    - name: 埃尔温·隆美尔
      function: 法兰西战役的空地协同伙伴（第399-400、413章）——方彦军事影响力向陆战的延伸见证
    - name: 贝尼托·墨索里尼/老齐亚诺/小齐亚诺
      function: 意大利线三级杠杆——岳家纽带（老齐亚诺）、独裁者接口（墨索里尼）、可威迫的同辈（小齐亚诺，第383章）；联盟操纵术的练习靶与资源池
    - name: 马丁·鲍曼
      function: 暗处的绞索——嫉妒驱动的构陷者（第367、376-377章）；代表"元首身边人"这一无法正面对抗的威胁形态
    - name: 温斯顿·丘吉尔
      function: 对手方的意志人格化——从海军大臣到战时领袖，每次德方胜利的余波都由他的"永不投降"折返回来（第182、426章）
    - name: 福布斯/托维/哈伍德
      function: 英国海军的体面与专业——殉舰（第345章）、夜袭（第492章）、巧战（第219章）；保证对手不脸谱化的战术级群像
    - name: 沃克一家
      function: 普通人窗口——政权民意底座的定期采样点（第140-141、295-296、464章）
    - name: 奥托/戴维/费恩/诺亚
      function: 军校同窗群体——海军基层的人脉网络与战场分视角（奥托在舍尔号，第201-203章）
    - name: 约瑟夫·斯大林
      function: 东方变数——机会主义扩张者与连环计的受害者/交易方（第209、275、300、437章）

contrast_axes: >-
  轴一「对希特勒的态度」：方彦（利用+暗反）/ 瓦尔特（依附求存）/ 雷德尔（体制内周旋）/
  琳娜（彻底反抗）/ 沃克（由衷崇拜）/ 鲍曼（寄生逢迎）——同一个独裁者，六种生存策略，
  方彦的"既喂养又备刀"在光谱正中央，张力最大。
  轴二「对战争的姿态」：方彦（手段论——战争是民族复兴的杠杆）/ 希特勒（目的论——征服
  即意义）/ 丘吉尔（意志论——存亡之战永不投降）/ 墨索里尼（投机论——搭车摘桃）。
  轴三「军人操守」：方彦（有底线，第375章拒绝倒雷）/ 邓尼茨（愿当政治说客）/ 福布斯
  （与舰同沉的旧式荣誉）/ 雷德尔（体制自卫优先于个人情义）。
  轴四「知识与权力的来源」：方彦（先知+工程，需伪装）/ 古德里安（专业天才，无需伪装）/
  鲍曼（纯权术，无专业）/ 瓦尔特（学术+投机的混血）——凸显方彦"知识必须转译"的独特负担。

relationships:
  power_dynamics: >-
    方彦位于三轨引力场的中心：党轨（希特勒的宠信）、军轨（雷德尔的提拔与辖制）、
    经济轨（家族资本+瓦尔特的部长权力）。三轨互相排斥——任何一轨的过度靠近都触发
    另一轨的防御（第109章雷德尔见元首亲密而皱眉→十年后第368章雪藏兑现；第375章
    拒绝党轨拉拢→圣眷冷却+鲍曼补刀）。英国作为外部压力源反向稳定内部结构：战时
    "不可自毁栋梁"的共识是方彦的隐形护身符，也意味着战争结束之日即政治清算之时。
  key_tensions:
    - 方彦↔希特勒：救命恩情与政治宠信 vs 隐秘的推翻决心——全书核心张力，持续加压未引爆（第35→157→359→375章）
    - 方彦↔雷德尔：知遇之恩 vs 功高震主——已引爆为明升暗降（第45→246→368章），造神后表面缓和（第468章）根子未除
    - 方彦↔鲍曼：影响力嫉妒→构陷家族（第366-377章）——进行中的暗战，攻击面是瓦尔特
    - 方彦↔琳娜：要挟-情欲-真情-同志的四段变奏（第37→82→92→153章）——反纳粹承诺的抵押关系
    - 方彦↔意大利盟友：姻亲温情面纱下的算计与反算计（第278章军火暴利、第538章舰队入彀）
    - 希特勒↔雷德尔：元首意志 vs 海军体制自主——方彦是双方争夺的杠杆（第246、366-368章）
    - 西尔维娅↔琳娜：明妻与暗情的结构性张力——借艾瑞克的存在悬置，未正面爆发（第301章方彦的双重思念）
  potential_shifts:
    - 若希特勒获知方彦与密谋组织的联系，宠信将瞬间翻转为清算——琳娜线是悬在方彦头上的达摩克利斯之剑（未爆）
    - 邓尼茨从说客可能转为海军接班竞争者——第373章的交易若由他人接受，方彦将面对一个"元首之刃"型同僚
    - 瓦尔特的经济权位与造神运动深度绑定——神像若塌，家族连坐（第480章的自救即新的人质关系）
    - 战争终局临近时，"外敌消失"将撤走方彦的隐形护身符——体制内三方（元首/海军/党务）的猜忌可能合流
    - 核武（第253章）与艾瑞克（第153章）两枚长线棋子，任一枚浮出水面都将重排方彦与政权的力量对比
