# 《日耳曼涅槃》Phase 5 逆向分析：关键场景编排
# 30 个关键场景节点，与 scenes/scene_01-30.md 切片及 scene_index.json 一一对应
# scene_27-30 为 Phase B 蒸馏期按 B3 路径补切的结构关键拍（暗线/权力线/情感线）
# 选取标准：结构转折点 / 高潮 / 关键建置——每场都有明确价值转变，非逐章罗列
# 补充要求（用户指定）：战争场面全覆盖（海战：斯卡帕湾/俾斯麦防空/狼群/舍尔号夜猎；
# 陆战：埃本-埃迈尔/装甲碰撞/直布罗陀攻坚）+ 决定性战争机器初登场
#（山猫 scene_16 / 齐柏林航母 scene_17 / 俾斯麦级 scene_18 / 雪狼 scene_19），
# 且山猫、俾斯麦级各有"登场→实战验证"闭环（16→24、18→20）

analysis_meta:
  novel: 日耳曼涅槃
  source_text: navigation.md
  source_form: 长篇网络连载小说（538章约163万字，未完结）
  evidence_note: 场景锚定原文章节号（见各 source_chapter）；正文切片在 scenes/ 目录，元数据在 scene_index.json

sequence_expansions:
  - seq_id: ARC1-SEQ1
    scenes:
      - scene_id: scene_01
        arc_id: ARC-1
        location: 现代汉堡（序章）→ 1918年汉堡布罗姆家宅邸
        time: 现代9月 → 1918年11月11日（德国投降日）起数日
        participants: [方彦/约纳斯, 鲁道夫]
        pov: 方彦（第三人称有限）
        conflict: 现代灵魂 vs 陌生躯壳与战败废墟——接受命运还是找回归途；躺平享乐还是改天换命
        value_start: 失重——身份崩塌、归途断绝
        value_end: 决断——以约纳斯之身立誓砸碎英语世界秩序
        scene_tasks: 建置穿越机制（橡叶勋章）；交代家族平台（布罗姆-福斯船厂）；用"卷款赴美"选项的排除完成主角价值观宣言；穿越日=投降日的象征对位
        handoff: 决心需要本钱与路线——引出家族会议与庞氏骗局构想（第5章）
        beat_direction: 眩惑（穿越震荡）→ 求生（融入身份）→ 诱惑（富贵躺平）→ 立誓（改天换命）
        source_chapter: 序章+第1章
  - seq_id: ARC1-SEQ3
    scenes:
      - scene_id: scene_02
        arc_id: ARC-1
        location: 通胀中的柏林咖啡馆
        time: 1923年夏（鲁尔危机、马克崩溃期）
        participants: [方彦, 老齐亚诺, 西尔维娅]
        pov: 方彦
        conflict: 15岁少年身份 vs 国家级人脉的攀附门槛——如何让意大利海军副部长把自己当回事
        value_start: 无名——家族有钱无势，国际通道为零
        value_end: 入局——用身份识破+战略谈吐换来齐亚诺的名片与兴趣
        scene_tasks: 一场戏开启三条线（德意合作/石油布局/西尔维娅情感线）；以美元少年vs通胀废墟的意象具象化"灾难套利"世界规则
        handoff: 名片要变成合作需要硬货——引出连夜绘制革命性战舰总图（第16章）
        beat_direction: 观察（识人）→ 试探（攀谈）→ 上钩（交换名片）
        source_chapter: 第13章
  - seq_id: ARC1-SEQ4
    scenes:
      - scene_id: scene_03
        arc_id: ARC-1
        location: 兰德斯堡监狱会客区
        time: 1924年（啤酒馆政变后希特勒服刑期）
        participants: [方彦, 希特勒, 赫斯]
        pov: 方彦
        conflict: 表演性认同 vs 内心冷计算——用精心排练的种族理论赢得未来独裁者，同时不让自己真信
        value_start: 陌路——政治期权无处买入
        value_end: 结盟——以"理论知己"身份进入希特勒的私人信任圈
        scene_tasks: 建置全书最重要的双刃关系（宠信与反噬同源）；展示方彦"先知包装为共鸣"的核心手法；为5万马克政治投资（第35章）铺垫
        handoff: 口头共鸣升级为真金白银——季度资助承诺开启政治线
        beat_direction: 布饵（话术试探）→ 共振（狂热应和）→ 缔结（私人纽带）
        source_chapter: 第33章
  - seq_id: ARC1-SEQ5
    scenes:
      - scene_id: scene_04
        arc_id: ARC-1
        location: 波罗的海军区司令部
        time: 1925年（军校基础训练期）
        participants: [方彦, 雷德尔]
        pov: 方彦
        conflict: 军校生的位阶 vs 战略话语权——论文能否让海军中将折节下问
        value_start: 无名之卒——才华锁在军衔之下
        value_end: 简在帅心——"决战型破交"战略被雷德尔接纳，伯乐关系缔结
        scene_tasks: 建置军事线的第二座靠山（与希特勒线互为镜像与冲突源）；输出全书海军战略总纲；确立"体制内以才升维"的爬升模式
        handoff: 雷德尔命其著书立说——通往全国声望与英国绥靖舆论工程（第59-64章）
        beat_direction: 震动（论文惊帅）→ 对答（层层折服）→ 收纳（入幕之宾）
        source_chapter: 第45章
  - seq_id: ARC1-SEQ6
    scenes:
      - scene_id: scene_27
        arc_id: ARC-1
        location: 贝鲁特庄园
        time: 1929年初（方彦蜜月归来后）
        participants: [方彦, 琳娜]
        pov: 方彦
        conflict: 要挟关系的表象 vs 琳娜压抑多年的真情——摊牌之后这段孽缘向何处去
        value_start: 戒备的猎物——方彦视琳娜为持柄的危险妖妇
        value_end: 相互抵押——真相换来承诺，"理性第一次在决断中败下阵来"，暗线情感奠基
        scene_tasks: 琳娜前史全揭（亡夫菲尼克斯/替身游戏/坏名声真相）；把情欲纠缠转写为孤独者的相认；为十年后的密谋线归来（scene_07）与艾瑞克存放情感本金
        handoff: 定时炸弹埋下——方彦转身投入经济危机前的布局（第91章股灾资助已启动）
        beat_direction: 怨怼（醋意耳光）→ 自白（金菊与替身）→ 相认（"我爱你唷"）
        source_chapter: 第92章
  - seq_id: ARC2-SEQ1
    scenes:
      - scene_id: scene_05
        arc_id: ARC-2
        location: 基尔军港纽伦堡号巡洋舰
        time: 1933年（希特勒就任总理后首次视察海军）
        participants: [方彦, 希特勒, 雷德尔]
        pov: 方彦
        conflict: 两座靠山在同一甲板相遇——元首的亲密 vs 总司令的警觉，方彦的双轨人生首次曝露于交叉火力
        value_start: 各行其道——党线与军线互不知情
        value_end: 结构性紧张——雷德尔目睹亲密后眉头紧锁，猜忌种子落地
        scene_tasks: 权力双轨制规则的实景演示；为十年后的明升暗降（第368章）埋下最早伏笔；展示政治投资兑付的红利与代价同时到账
        handoff: 元首的支持换来海军复兴计划全速推进——装备革命序列展开
        beat_direction: 荣光（元首重逢）→ 注视（雷德尔在场）→ 阴影（亲密即嫌隙）
        source_chapter: 第109章
  - seq_id: ARC2-SEQ2
    scenes:
      - scene_id: scene_16
        arc_id: ARC-2
        location: 坦克样车测试场
        time: 1936年
        participants: [方彦, 波尔舍, 古德里安]
        pov: 方彦
        conflict: 后世设计理念 vs 现行3/4号坦克路线——12吨样车的性能能否说服装甲兵之父改换门庭
        value_start: 图纸争议——"小坦克"被传统路线低估
        value_end: 路线确立——古德里安愿以山猫取代3/4号坦克计划
        scene_tasks: 山猫坦克初登场（50毫米L40炮+大倾角装甲+40km/h的现场兑现）；建立方彦-古德里安陆军盟友线；"性价比与吨位利用率"装备哲学的宣言场
        handoff: 山猫的成色留待法兰西战场裁决（scene_24 装甲碰撞构成登场-验证闭环）
        beat_direction: 质疑（纸面数据）→ 演示（样车驰骋）→ 换轨（古德里安拍板）
        source_chapter: 第127章
      - scene_id: scene_06
        arc_id: ARC-2
        location: 汉堡船厂工人社区（沃克家）
        time: 1937年（希特勒执政4周年）
        participants: [沃克, 维拉]
        pov: 沃克（普通人视角）
        conflict: 餐桌真理 vs 政权本质——生活实实在在变好了，崇拜由衷发生
        value_start: 匮乏记忆——失业与饥饿的魏玛岁月
        value_end: 感恩拥护——工资、就业、面包兑换成对元首的信仰
        scene_tasks: 民意底座采样（面包收买律的实景）；为反纳粹暗线提供道德配重——方彦要推翻的政权正让人民过上好日子；校准精英叙事的海拔
        handoff: 民众的信仰即将被战争动员——与后文柏林电台的胜利广播（第184章）形成回声
        beat_direction: 忆苦（对比魏玛）→ 思甜（细数改善）→ 归附（由衷崇拜）
        source_chapter: 第140-141章
      - scene_id: scene_17
        arc_id: ARC-2
        location: 基尔造船厂船台
        time: 1937年
        participants: [方彦]
        pov: 方彦
        conflict: 航空制胜理念 vs 大炮巨舰传统——3万吨装甲航母是海军资源豪赌的实体化
        value_start: 理念悬空——航母派仍被巨舰派视为异端投资
        value_end: 钢铁落地——齐柏林级下水，装甲飞行甲板+130余架载机的技术标杆树立
        scene_tasks: 齐柏林级装甲航母初登场；参数化描绘（270米甲板/100毫米装甲飞行甲板/33节）；为斯卡帕湾与卑尔根的航空屠杀预装弹药
        handoff: 平台就位，舰载机与飞行员线继续铺设；巨舰派的对冲产物即俾斯麦级（scene_18）
        beat_direction: 仪式（下水盛典）→ 参数（性能巡礼）→ 远望（航空时代前夜）
        source_chapter: 第142章
      - scene_id: scene_18
        arc_id: ARC-2
        location: 汉堡布罗姆-福斯造船厂船台（下水典礼）
        time: 1937年6月14日
        participants: [方彦, 希特勒, 马沙尔]
        pov: 方彦
        conflict: 方彦的均衡舰队观 vs 海军总部的巨舰狂热——用他的设计精髓造出的45600吨巨兽令设计者本人愠恼
        value_start: 设计失控——精髓被挪用，资源被巨舰吞噬
        value_end: 巨兽既成——450毫米L45主炮的世界最强战列舰下水，方彦被迫消化既成事实
        scene_tasks: 俾斯麦级初登场（吨位伪装/座圈障眼/450毫米巨炮的全知参数揭晓段）；"设计者与体制"张力具象化——金手指产物不受金手指控制；十几万民众+元首观礼的国家仪式描绘
        handoff: 巨兽成色留待战火检验——斯卡帕湾单舰诱敌战（scene_20 构成登场-验证闭环）
        beat_direction: 盛典（万民欢呼）→ 愠恼（设计被挪用）→ 揭幕（梦幻参数）
        source_chapter: 第145-146章
  - seq_id: ARC2-SEQ3
    scenes:
      - scene_id: scene_07
        arc_id: ARC-2
        location: 威廉港艾尔会馆密室
        time: 1938年（苏台德危机、水晶之夜前夜）
        participants: [方彦, 琳娜]
        pov: 方彦
        conflict: 五年重逢的旧情 vs 政治摊牌——琳娜以密谋组织成员身份揭露纳粹暴行，逼方彦在共谋与良知间选边
        value_start: 蒙眼狂奔——军备成就掩盖政权罪恶
        value_end: 道德觉醒启动——理性权衡后认同推翻国社党的必要性
        scene_tasks: 情感线升维为政治暗线的枢纽场景；揭露信息差（教育摧残/犹太迫害）完成方彦价值观的第二次锚定；私生子艾瑞克的存在加重宿命感
        handoff: 觉醒被水晶之夜（第157章）淬火成决心——双面人生自此定型
        beat_direction: 重逢（旧情涌动）→ 揭幕（暴行清单）→ 转向（立场松动）
        source_chapter: 第153章
  - seq_id: ARC2-SEQ4
    scenes:
      - scene_id: scene_19
        arc_id: ARC-2
        location: 柏林（希特勒50岁生日大阅兵）
        time: 1939年4月20日
        participants: [方彦, 希特勒, 古德里安]
        pov: 方彦
        conflict: 装备升级的军事逻辑 vs 政治献礼的仪式逻辑——下一代坦克以寿礼形式过审
        value_start: 山猫渐显瓶颈——20吨级换代车悬而未决
        value_end: 雪狼定型入列——75毫米炮中型坦克借寿辰东风立项
        scene_tasks: 雪狼坦克初登场；展示方彦"把军备包装成政治礼物"的运作术；战争前夜的国家武力橱窗（阅兵）描绘
        handoff: 战争爆发在即——雪狼与山猫将共同开进法兰西（ARC-6）
        beat_direction: 寿典（阅兵盛况）→ 献礼（模型呈上）→ 立项（元首欣然）
        source_chapter: 第160章
      - scene_id: scene_30
        arc_id: ARC-2
        location: 汉堡自家花园
        time: 1939年8月中旬（归队电报送达日）
        participants: [方彦, 西尔维娅]
        pov: 方彦
        conflict: 善意谎言的安抚 vs 西尔维娅的洞察——二十年布局者在诀别时刻直面战争的代价
        value_start: 战争=事业——方彦对开战只有"自信和期待"
        value_end: 战争=丑恶——"竟是那般的丑恶而令人厌憎"的顿悟，但开弓没有回头箭
        scene_tasks: 西尔维娅完成从被哄者到共担者的转身（识破谎言、索要真话与归来承诺）；给方彦的战争狂热装上唯一一次反思刹车；德波开战前的战略态势盘点（借内心独白）
        handoff: 登舰赴威廉港——舰队夜雾出港（第163-165章），战争引爆
        beat_direction: 电报（感慨廿年）→ 识破（泪眼索诺）→ 顿悟（战争之恶）
        source_chapter: 第162章
  - seq_id: ARC3-SEQ1
    scenes:
      - scene_id: scene_08
        arc_id: ARC-3
        location: 斯卡帕湾英军锚地
        time: 1939年9月3日（英国对德宣战当日）
        participants: [方彦, 伯梅, 英国守军（格林/布伦等）]
        pov: 多视角（德军机群/英军舰员交切）
        conflict: 三百架舰载机的天降杀阵 vs 毫无防备的皇家海军百年威严
        value_start: 威慑均势——纸面上皇家海军仍是海洋霸主
        value_end: 天谴降临——反击号沉没、本土舰队主力覆灭进行时
        scene_tasks: 全书第一战役高潮的爆发点；航母时代宣言（军事代差兑换律的最暴烈演示）；用英方视角承受毁灭以维持对手尊严
        handoff: 战果辉煌但行踪暴露——引出俾斯麦号诱敌与全身而退（第173-179章）
        beat_direction: 死寂（宣战晨雾）→ 骤袭（第一波俯冲）→ 崩解（巨舰倾覆）
        source_chapter: 第169章
      - scene_id: scene_20
        arc_id: ARC-3
        location: 斯卡帕湾以东海域·俾斯麦号
        time: 1939年9月3-4日（奇袭后撤离阶段）
        participants: [方彦, 林德曼]
        pov: 多视角（德舰舰桥与英机群交切）
        conflict: 单舰诱敌的钢铁堡垒 vs 英国岸基航空兵的复仇机群
        value_start: 行踪暴露——航母编队面临岸基空袭覆灭风险
        value_end: 坚盾验证——俾斯麦号以榴霰弹弹幕与装甲甲板扛住全部轰炸，掩护舰队脱离
        scene_tasks: 俾斯麦级实战首秀（与 scene_18 参数揭晓构成登场-验证闭环）；防空海战的技术流描绘（450毫米榴霰弹/210毫米总水平装甲扛弹）；方彦诱敌决策的胆识展示
        handoff: 全身而退转进大西洋——破交绞杀开场（ARC3-SEQ2）
        beat_direction: 断后（单舰离队）→ 弹幕（迎击机群）→ 坚盾（装甲扛弹）
        source_chapter: 第175-177章
  - seq_id: ARC3-SEQ2
    scenes:
      - scene_id: scene_21
        arc_id: ARC-3
        location: 北大西洋英国护航航线
        time: 1939年秋
        participants: [邓尼茨, 克雷齐默尔]
        pov: 多视角（艇群与船队交切）
        conflict: 狼群的夜间水面协同突击 vs 护航体系的探测盲区
        value_start: 单艇袭扰时代——潜艇战果零散不成体系
        value_end: 狼群体系确立——协同齐射夜屠船队，英国海上生命线告急
