tension_curve:
  description: >-
    多峰递升+断章悬置结构：建置期（scene_01-07）低缓爬升，武器登场场景（scene_16-19）
    以"参数悬念+路线之争"制造中等张力的建置峰，其中 scene_07 道德暗流突起；
    scene_08/20 斯卡帕湾第一主峰群（奇袭+诱敌防空战）；scene_21/22 破交猎杀维持高原张力；
    scene_09-11 卑尔根第二主峰群——峰顶叠加个人血价（scene_11），张力质变；
    scene_12 张力形态从外战转入内斗（权力危机峰）；scene_23/24 西线陆战再起高峰；
    scene_13 敦刻尔克决策主峰（无一枪一弹的最高张力）；scene_14 仪式性释放（谷）；
    scene_25/26 直布罗陀第三主峰群（天火→血磨盘→陷落）；scene_15 重新蓄压至断章
    ——蓄而未发是本作张力曲线的最终形态。
    全书宏观节奏：和平期编年加速（浅波），战争期战役减速（高峰群），峰值冲击力逐段递增。
  peaks: [scene_08, scene_10, scene_11, scene_13, scene_20, scene_22, scene_24, scene_25, scene_26]
  valleys: [scene_02, scene_06, scene_14, scene_17]

causal_chain: >-
  scene_01 立誓（使命确立）→ scene_02 入局（因为使命需要国际杠杆）→ scene_03 结盟
  （因为工业需要政治保护伞）→ scene_04 入幕（因为战略需要军内伯乐）→ scene_05 交叉
  火力（因为双靠山必然相遇，埋下猜忌）→ scene_06 民意底座（政权因面包而稳固，反噬
  暗线因此更沉重）→ scene_07 觉醒（因为琳娜撕开信息差）→ scene_08 天谴（二十一年
  铺垫的总兑现）→ scene_09 定向（因为首胜后英军必然反扑，判断力接棒先知）→ scene_10
  海权更替（判断兑现为决战全胜）→ scene_11 血价（胜利的物理反噬）→ scene_12 操守
  （因为战功引来权力绞杀，压力揭示人格底线）→ scene_13 扳道（因为被雪藏者只剩认知
  杠杆可用）→ scene_14 复仇闭环（西线因敦刻尔克围歼而速胜）→ scene_15 绞索出海
  （因为英国拒和，战略收束为体系绞杀）——【断章】。
  战争机器登场节点（scene_16-19）与战争场面节点（scene_20-26）作为"兑现层"挂靠主链：
  每台机器先以建置场景登场（样车/下水/阅兵），再在对应战役场景中实战验证
  （山猫 16→24、俾斯麦级 18→20、齐柏林航母 17→scene_08 机群之源、雪狼 19→ARC-6 陆战），
  构成本作"设计→登场→验证"的标志性爽点链路。
