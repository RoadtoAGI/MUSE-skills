# Phase 1: 世界 — 《大唐李白》（张大春）
# 逆向分析：从原文前10章及代序提取世界规则

setting:
  era: >
    大唐帝国开元年间（约701-728年）。
    从武则天末期到玄宗李隆基执政中期，
    帝国立国以来变动最剧烈的半世纪。
  duration: >
    约27年（李白出生至入赘许家）。
    三卷时间分布不均——卷一覆盖李白少年至约20岁，
    卷二/三集中于出蜀后约3年（开元十三至十六年）。
  location: >
    蜀中（绵州昌明、大匡山、成都）→ 出蜀路线（三峡、江陵）→
    洞庭湖 → 金陵 → 广陵 → 安州。
    空间扩展与李白的成长同步——从山中到天下。
  conflict_levels:
    internal: >
      李白的身份焦虑：商人之子无法参加科举，
      "白身"困境贯穿全书。他必须隐瞒出身，
      在"诗人"与"胡商之子"之间建构新的自我。
    personal: >
      师徒张力（赵蕤以纵横术/隐士之道训练李白，
      但李白的天性趋向诗的自由而非权谋）；
      同行者的消逝（吴指南之死）；
      情感的不可得（段七娘的缘起缘灭）。
    external: >
      大唐门第制度——帝国最核心的社会规则。
      商人无地位，其子女无科举资格。
      李白家族的"偷渡"身份更是永远不能曝光的秘密。

world_rules:
  physical:
    - >
      驿递系统：帝国以驿站网络连接州县，
      旅行者必须持有"过所"（通行证），
      商人之子在驿路上的身份审查构成持续威胁。
      （卷三第五章，李白在广陵渡头遭公验盘查）
    - >
      水运经济：长江航道是帝国经济命脉，
      李客的商队在三峡和九江之间运营，
      贸易利润通过寺院"无尽藏"系统转化为债权网络。
    - >
      蜀地地理：大匡山、峨眉山等构成天然的隐居空间，
      蜀道之难既是物理障碍也是身份屏障——
      入蜀可隐，出蜀则意味着暴露。
  social:
    - >
      门第制度：唐初政治工程的核心——以姓氏、郡望、
      家世定义社会地位。皇室李家本身也在重写身世
      （从陇西狄道鲜卑血统到"陇西成纪"的李广后裔），
      这为李客仿效"改姓李"提供了镜像。
    - >
      科举壁垒："选人"与"任官"已是两条路。
      即使博一出身，未必能获铨选。
      商人之子连第一步（参加科举的资格）都没有。
      （卷一第四章，李客言："而今选人、任官已是两条路"）
    - >
      干谒与荐举：科举之外的替代路径——通过诗文
      获得权贵赏识，以荐举入仕。
      赵蕤为李白设计的"举而不应"策略，
      本质上是在门第制度外另辟蹊径。
    - >
      僧道经济：寺院运营"无尽藏"放贷系统，
      大明寺慈元处置债务契券，
      李客以"钵底"身份寄存资金——
      宗教机构是帝国金融体系的隐形支柱。
  psychological:
    - >
      "热中"文化：士人以诗博取功名，
      声律格调成为通往仕途的工具。
      赵蕤所批评的"时风"——诗沦为功利手段，
      丧失了"动摇性情、引发感悟"的本来面目。
    - >
      隐逸传统：表面超脱、实际入世的双面策略。
      赵蕤并非真正的世外高人——他的隐居是精心设计的
      "举而不应"，以获取比应举更高的声望。
      （卷一第二三章揭示）
    - >
      身世禁忌：李白"绝口不提自己的身世"（代序），
      这不是个人选择而是生存策略——
      在帝国的身份体系中，"出身不可言说"
      等于永远携带一个随时可能引爆的秘密。

genre_conventions:
  primary_genre: 历史传记小说
  secondary_genre: 考据小说
  conventions:
    - convention: 历史小说通常以戏剧化方式再现"大事件"
      planned_subversion: >
        张大春刻意回避戏剧化——宫廷政变（太平公主之乱、
        唐隆之变）都以插叙/转述呈现，从不直接展开为场景。
        小说的重心不在事件而在"事件如何被传述和理解"。
    - convention: 传记小说通常按时间线性推进
      planned_subversion: >
        大量使用插叙、倒叙和考据离题——
        一章之内可能从李白的当下跳到数百年前的典故，
        再跳到数十年后杜甫的诗句，
        时间线如河流般蜿蜒而非直线前行。
    - convention: 历史小说中超自然元素通常被理性化解释
      planned_subversion: >
        钱塘龙君、薛稷鬼魂、吴指南的酒壶从天而降——
        这些超自然事件不被解释也不被否认，
        它们与严谨的历史考据并存，
        构成"仙与凡"的张力层。
    - convention: 主人公通常有明确的成长弧线
      planned_subversion: >
        李白在三卷中几乎没有"成长"——他始终是那个
        不肯安分、绝口不提身世、以诗换名的人。
        变化的不是李白，而是读者对他的理解深度。

daily_life:
  - dimension: 经济与货币
    findings:
      - detail: >
          帝国以实物税（谷米、丝棉）为基础，
          货币流通不足，借贷遍及城乡。
          李白"散钱三十万"可买三万斗米。
        story_implication: >
          李白的"豪侠"形象背后是父亲的商业债权网络，
          经济自由是诗人自由的物质基础。
  - dimension: 驿路与旅行
    findings:
      - detail: >
          唐代旅行依赖驿站系统，
          旅人需持"过所"接受检查。
          驿卒（如侯矩）既是服务者也是监控者。
        story_implication: >
          每一段旅途都是身份审查的风险——
          对隐瞒出身的李白而言，
          漫游不只是浪漫，也是持续的身份博弈。
  - dimension: 诗文生态
    findings:
      - detail: >
          诗是科举的核心技能，声律格调被制度化。
          "声妓会演唱他们的作品"——诗通过歌伎传播，
          琼花楼中征"瓜州调"即是此生态的缩影。
        story_implication: >
          李白以古风冲决格律，既是美学选择也是政治姿态——
          他无法走科举之路，索性以诗的自由否定那条路本身。

creative_constraints:
  - constraint: 商人之子不得参加科举
    narrative_function: >
      这是全书最核心的世界规则——
      一条不可逾越的社会壁垒，
      驱动了李白所有的替代策略
      （干谒、隐士声望、以财换名、入赘士族）。
  - constraint: 李白家族的"偷渡"身份必须永远保密
    narrative_function: >
      在身份即命运的帝国中，
      这个秘密使李白的每一次社交都带有表演性质——
      他必须不断建构一个可以示人的身份，
      而真实的自己永远不能示人。
  - constraint: 三卷已出版，第四卷（捉月歌）未完成
    narrative_function: >
      本分析基于已出版三卷（少年游、凤凰台、将进酒），
      故事止于李白入赘许家（约开元十六年），
      安史之乱、入宫、流放等后半生尚未展开。
