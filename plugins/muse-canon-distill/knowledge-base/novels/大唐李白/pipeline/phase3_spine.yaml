# Phase 3: 脊椎 — 《大唐李白》（张大春）
# 逆向分析：从结局回溯激励事件、欲望对象、脊椎

inciting_incident:
  description: >
    李客在山路边对赵蕤说出：儿子"还杀了人"，
    并跪地恳求"神仙倘不肯救，此儿日后不外便是横死于市的下场"。
    随后李白深夜现身大匡山，以"大道如青天，我独不得出"
    表明求学之志，赵蕤应允"一约既订"。
  type: decision  # 李客主动求师 + 李白主动拜师
  timing: 卷一第四章（李客求师）/ 第八-九章（师徒照面确立）
  balance_before: >
    李白是昌明县一个杀过人的少年游侠，随斋于大明寺，
    父亲是隐匿身份的西域胡商。少年有才但无方向，
    在市井间仗剑纵酒，身份和前途都悬而未决。
  balance_after: >
    赵蕤开始系统训练李白——不是传统的经学教育，
    而是纵横术、隐士之道、"以不应为应"的声望策略。
    一条从"横死于市"转向"以文乱法"的路径开启。
  impact_on_protagonist: >
    李白从一个无序的少年游侠，进入了有师承、有策略的
    身份建构过程。赵蕤给他的不是知识，而是方法论——
    如何在帝国的门第之外，以另一套规则建立自己的位置。

desire_object:
  conscious: >
    "达则兼济天下"——获得政治地位，以才学入仕报国。
    具体表现为干谒名臣（苏颋）、结交权贵（崔宗之）、
    散财求名（琼花楼三十万）、入赘士族（许家）。
  unconscious: >
    以诗回返自由的古风——在声律格调的时代重建诗的本真。
    李白真正需要的不是"位置"而是"不需要位置的自由"，
    但这种自由在帝国的规则里等于"无官职"即"无价值"。
  tension: >
    李白意识层面追求的"兼济天下"与他本能趋向的
    "诗的自由"不可兼得——每一次靠近权力中心的努力
    都意味着接受声律/门第/规矩的束缚，
    而他的诗恰恰是要冲决这些束缚。

spine_statement: >
  一个出身不可言说的天才诗人，在大唐帝国门第森严的秩序中，
  以诗文和漫游寻求"兼济天下"的位置，
  却在每一次接近目标时发现：他的自由之身正是他不得出的根源。
spine_type: unconscious
  # 表层故事追踪的是李白"获得地位"的努力，
  # 但真正被讲述的是他如何一步步认清"不得出"的宿命。

dramatic_question:
  question: >
    李白能否在大唐帝国的身份秩序中找到自己的位置——
    还是他注定只能以诗人之名流传，
    而"兼济天下"的追求全然落空？
  obligatory_scene: >
    代序已预告答案："千载以下，人们居然多只记得他的名字而已。"
    三卷结局是婚礼——看似安顿，但吴指南的酒壶从天而降，
    提醒读者：漫游虽止，李白的"不得出"远未终结。

opposing_forces:
  internal: >
    李白无法安于任何固定的身份和位置——
    赵蕤教他权谋他偏向诗，卢焕提醒"白身"他视而不见，
    婚姻提供出路他却心系远方。
    他的不安分既是才华的源泉，也是困境的根源。
  personal: >
    赵蕤的教育路线（纵横术/隐士策略）与李白的天性（诗的自由）
    之间的张力；吴指南的死造成同行者缺失；
    段七娘"好因缘恰是恶因缘"的点破。
  external: >
    大唐门第制度——商人之子不能科举，
    "白身"在士大夫社会中无立锥之地。
    李白家族的偷渡身份是悬在头顶的达摩克利斯之剑。

# ── 幕/Arc 框架 ──
arcs:
  - arc_id: ARC-1
    name: "大匡山求学"
    value_at_start: "无序的少年游侠，才华未经雕琢"
    value_at_end: "获得师承和策略，但被揭示'白身'困境的深度"
    climax_event: >
      赵蕤"举而不应"——拒绝刺史举荐，以此为李白
      谋取超越应举者的声望。策略本身精妙，
      但同时揭示了李白永远无法走正常仕途的事实。
    function_note: "建置Arc——确立核心困境（身份壁垒）和应对策略（以名代仕）"

  - arc_id: ARC-2
    name: "首游蜀中"
    value_at_start: "携师命出游，初涉天下"
    value_at_end: "诗名初立（苏颋'相如比肩'），但'白身'困境被明确点破"
    climax_event: >
      卢焕追问李白心仪何人后点破"白身"困境——
      "商人之子无法参加科举"被第一次明确说出。
      李白在成都获得诗名的同时，身份壁垒也第一次成为不可回避的现实。
    function_note: "递进Arc——从山中到世间，诗才得到验证的同时困境也被验证"

  - arc_id: ARC-3
    name: "出蜀漫游"
    value_at_start: "携诗名出蜀，满怀壮志"
    value_at_end: "获道教最高权威认可，但失去最亲密同行者"
    climax_event: >
      吴指南之死——在洞庭湖畔，李白与虎对峙时
      吴指南以最后的吼啸驱虎。这位从大匡山时代
      就伴随李白的少年伙伴的死亡，
      标志着李白少年时代的彻底终结。
    function_note: "转折Arc——得道统认可（司马承祯）与失人（吴指南）的双重价值变化"

  - arc_id: ARC-4
    name: "金陵交游"
    value_at_start: "孤身到金陵，丧友之后重建社交圈"
    value_at_end: "以诗才折服士族子弟，但以'神仙自处'回避科举问题"
    climax_event: >
      李白以"神仙自处"回应孟浩然、崔宗之
      关于为何不赴科举的追问——
      这是他第一次将"不得出"转化为主动选择的姿态。
    function_note: "重构Arc——从被动的'不能'转向主动的'不为'，但这姿态是否真实？"

  - arc_id: ARC-5
    name: "广陵散财"
    value_at_start: "以'五蠹人'自号，散财三十万求名"
    value_at_end: "决意不赴长安，以歌曲浪迹为志"
    climax_event: >
      琼花楼之会——李白散财三十万钱，以季札"以有易无"之论
      折服高适。随后在第十三章明确宣布不赴长安。
      这是全书中李白距离"兼济天下"最远的时刻，
      也是他在诗的自由中走得最深的时刻。
    function_note: "高潮Arc——conscious desire（入仕）与unconscious need（自由）的正面碰撞"

  - arc_id: ARC-6
    name: "安州入赘"
    value_at_start: "漫游将尽，偶遇叔父，婚事渐成"
    value_at_end: "入赘许家，漫游生涯终结"
    climax_event: >
      亲迎许宛——婚礼上吴指南的酒壶从天而降，
      砸中障车之人。这个超自然的回声提醒：
      过去并未真正过去，自由之身虽已以婚姻为代价出让，
      但李白的故事远未结束。
    function_note: "收束Arc——以婚姻'安顿'李白，但酒壶坠落暗示未来的动荡"

story_climax_design:
  crisis:
    dilemma: >
      李白面对的两难：接受入赘许家（获得士族出身，但失去自由），
      还是继续漫游（保持自由，但永远是"白身"无依之人）。
    option_a: 入赘许家——以婚姻换取社会位置
    option_b: 继续漫游——保持诗人的自由之身
    character_revelation: >
      李白选择了入赘——但这个选择并非心甘情愿的妥协，
      而是在李衍的安排、许自正的期许、段七娘的诀别
      等多重力量推动下的顺势而为。
      他既没有主动争取，也没有主动抗拒。
  climax:
    action: >
      亲迎婚礼（卷三第三三章）——李白完成了全部繁缛的
      士族婚仪，正式成为许府赘婿。
    value_change:
      from: "自由之身（无位置，但不受束缚）"
      to: "安顿之身（有位置，但以自由为代价）"
    controlling_idea_expression: >
      三卷以婚礼结尾——表面看是"获得了位置"，
      但代序已告诉读者最终结局是"全然落空"。
      婚姻不是终点而是新困境的起点——
      入赘并不能真正解决"不得出"的问题。
  resolution:
    new_balance: >
      李白有了妻子、有了士族姻亲，
      但寿山脚下的宅子距府城数十里——
      他依然是个"远离中心"的人。
    lingering_feeling: >
      酒壶从天而降——吴指南的遗物穿越时空回到李白手中，
      "那壶里的酒，是无论怎么喝也喝它不尽的。"
      这是全书最后一句，暗示：过去的自由、失去的友人、
      未竟的抱负，都将持续发酵，不会因婚姻而消散。

  # 注：这是三卷的收束，不是全书终局（第四卷未出版）。
  # 真正的故事高潮应在第四卷《捉月歌》中。
