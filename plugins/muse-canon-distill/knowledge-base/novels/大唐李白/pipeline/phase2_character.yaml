# Phase 2: 人物系统（系统设计图）— 《大唐李白》（张大春）
# 只记角色之间的关系，不记个体画像。个体档案见 characters/*.md

cast_overview:
  protagonist: 李白
  antagonist: >
    无具体反派角色。对抗力量是"大唐帝国的门第制度"——
    一套弥散在每一次身份审查、科举追问、社交礼仪中的无形壁垒。
    最接近"人形对手"的是卢焕，但他是善意的真相揭示者，不是敌人。
  supporting_cast:
    - name: 赵蕤
      function: "导师 / 策略设计者——为李白设计'举而不应'的声望策略，但其方法论与李白天性冲突"
    - name: 月娘
      function: "平行命运线 / 悲剧镜像——独立的第二主角，其沦落映照李白'自由'的暗面"
    - name: 吴指南
      function: "同行者 / 牺牲者——李白少年时代的锚，其死亡标志成长的不可逆"
    - name: 段七娘
      function: "自由的人格化 / 情感线——以音乐行走天下的女子，李白渴望的'自由'的具象"
    - name: 司马承祯
      function: "权威认可者——道教最高权威，给李白提供科举之外的身份合法性"
    - name: 李客
      function: "困境源头 / 影子——李白一切身份问题的起源，偷渡胡商"
    - name: 钱塘龙君
      function: "超自然诤友 / 预言者——唯一直接点破'当今世道不容天真'的存在"
    - name: 许宛
      function: "安顿者——入赘的对象，通过婚姻为李白提供社会位置"
    - name: 高适
      function: "镜像对手——走正统赴长安路径的诗人，李白的'如果能科举'版本"
    - name: 孟浩然
      function: "理想镜像——有门第的士人诗人典范，其追问逼出李白'神仙自处'宣言"

contrast_axes:
  - axis: "自由 vs 安顿"
    characters: [李白, 段七娘, 许宛]
    description: >
      段七娘 = 彻底自由（以漂泊为代价），
      许宛 = 彻底安顿（以士族规矩为框架），
      李白 = 在两者之间摆荡，最终倒向安顿。

  - axis: "策略 vs 天真"
    characters: [赵蕤, 李白, 钱塘龙君]
    description: >
      赵蕤 = 极致策略（举而不应），
      钱塘龙君 = 预言天真不容于世，
      李白 = 从策略训练中走出天真的路。

  - axis: "正途 vs 旁门"
    characters: [孟浩然, 高适, 李白]
    description: >
      孟浩然 = 有门第走正途，
      高适 = 赴长安走正途，
      李白 = 商人之子无正途可走，只能以名声/婚姻/仙道绕行。

  - axis: "自由者的命运"
    characters: [李白, 月娘, 段七娘]
    description: >
      三个"自由者"的不同结局：李白被婚姻收编，
      段七娘保持自由但隐匿身份，月娘被暴力彻底摧毁。

relationships:
  power_dynamics: >
    全书的权力结构是：帝国制度 > 士族门第 > 隐士声望 > 商人财富 > 白身。
    李白处于最底层（白身），每一段关系都涉及权力不对等：
    赵蕤对李白是师徒（上下），司马承祯对李白是认可者/被认可者，
    许家对李白是施恩者/受恩者（入赘），
    只有吴指南和段七娘与李白是平等关系——但两人最终都离开了。

  key_tensions:
    - "赵蕤的教育路线（纵横术）vs 李白的天性（诗的自由）——师徒方向分歧"
    - "吴指南的追随 vs 不理解——'至今仍不识此人'的裂痕"
    - "段七娘的自由 vs 李白的不舍——好因缘恰是恶因缘"
    - "月娘对赵蕤/李白的审视 vs 自身命运的不可控——冷厉者反被碾碎"
    - "许家的期许 vs 李白的真实出身——婚姻建立在未说破的秘密之上"

  potential_shifts:
    - "赵蕤的策略被李白内化后变形——从纵横术变为'以诗换名'"
    - "吴指南死后其影响以酒壶形式穿越时空回归"
    - "司马承祯的暗中安排通过紫绮裘串联到许家——道教网络操控世俗婚姻"
    - "月娘线与安禄山线交汇——预示盛唐即将崩塌的远因"
