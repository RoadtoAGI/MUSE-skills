# Phase 0: 构想 — 《大唐李白》（张大春）
# 逆向分析：从代序与结局回溯前提和主控思想

premise: >
  如果一个从西域偷渡回中土的胡商之子，出身永远被帝国门第制度排斥，
  却拥有不世出的诗才与不羁的灵魂，他将如何在大唐开元盛世中
  寻找自己的位置？

core_value:
  positive: 诗性自由（以诗回返古风，冲决格律藩篱）
  negative: 身份枷锁（门第制度、商人贱籍、科举壁垒）
  spectrum:
    contradictory: 无名声（既无门第亦无诗名，社会意义上的不存在）
    contrary: 虚名（以财换名、以婚求出身——看似获得位置，实质自我异化）
    negation_of_negation: 以自由之名行自我放逐（李白"不赴长安"的决定，看似最大自由，实为最深的不得出）

controlling_idea:
  value: 诗性自由
  cause: >
    在一个以门第和功名定义人之价值的帝国中，
    真正的诗意自由必然以丧失现实位置为代价
  full_statement: >
    在大唐帝国门第森严的秩序里，一个出身不可言说的天才诗人
    越是以诗追求自由、以古风冲决时风，就越不可能被现实秩序接纳——
    他的诗篇成就了传世之名，却注定换不来他渴望的"兼济天下"。
  type: ironic
  # 说明：三卷结束于李白入赘许家——看似安顿（正面），
  # 实则以出卖"自由身"为代价（反面），且全书始终未让李白
  # 获得他真正追求的政治地位，代序明言"全然落空"。

genre:
  primary: 历史小说（传记体）
  secondary: 考据小说 / 魔幻现实主义
  conventions:
    - setting: 盛唐开元年间（701-728），蜀中至江南的漫游路线
    - characters: 历史真人（李白、赵蕤、司马承祯、贺知章、孟浩然、高适）与虚构人物交织
    - events: 以诗论交、干谒求仕、仗剑游侠、道教修炼
    - values: 门第与自由、仕途与诗道、历史考据与小说想象的张力

originality_statement:
  unique_angle: >
    张大春不写"诗仙"的浪漫传奇，而是考据李白的经济来源、身份困境和社会网络。
    小说以密集的历史考证为骨架（典章制度、科举规则、驿递系统、货币流通），
    在缝隙中以虚构填充，形成"以实证虚、以虚见实"的独特叙事。
    叙事节奏极慢——不追求戏剧冲突的密度，而是用大量插叙、考据、
    诗文解读来构建一个关于"门第与诗"的思想世界。
  cliches_to_avoid:
    - 避免了"天才诗人被埋没后终获赏识"的传统叙事弧
    - 避免了将李白简化为"酒仙""剑客""浪漫主义者"的刻板形象
    - 避免了历史小说常见的全知视角——叙述者频繁暴露考据过程本身

style_directives:
  - 文白夹杂：叙述语言介于古典白话与现代散文之间，典雅而不艰涩
  - 考据嵌入叙事：频繁以插叙形式展开历史考证，构成独立的知识层
  - 诗文互文：李白原诗散布于叙事中，每一首诗的出现都对应特定情境
  - 慢节奏：单章常围绕一个议题（如声律之弊、无尽藏制度）展开千字论述
  - 魔幻元素克制使用：钱塘龙君、薛稷鬼魂等超自然存在出现频率低，但每次出现都携带明确的主题隐喻

word_count: 约650000
