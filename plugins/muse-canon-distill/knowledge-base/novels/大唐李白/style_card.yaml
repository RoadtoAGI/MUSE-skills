novel: 大唐李白
author: 张大春
lang: zh
translator: ''
narration_voice: 限知贴人物行思，旁白常转入考据释义
diction: 文言骨架、唐代名物、席间口语交织
rhetoric_density: high
dialogue_mode: 论诗论事对白密集，叙述补出未明心意
pacing: 长段铺史释典，关键处以短句或奇物断拍
signature_moves:
- 从一字一句进入史传典故和人物命运
- 以酒席、驿亭、山林谈话承载诗学辩难
- 让神异物象突然闯入现实场面改写局势
- 用旁白拆解诗句来推进人物自我认识
- 在热闹群声后压出寂寞的天下之问
anti_signature:
- 只写现代白话心理独白而无典故层
- 把诗歌当装饰，不让诗句改变关系
- 场景全靠动作推进，缺少论辨回环
author_cross_ref: ''
style_card_by: Codex (executor)
