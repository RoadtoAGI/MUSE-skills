# Phase 2: 人物系统设计图 — 《三体Ⅱ·黑暗森林》逆向分析
#
# 本文件只记录角色 **之间** 的关系（系统层）：
#   功能分配、对比轴、关系网、权力动态、跨部映射
#
# 角色 **自身** 的画像（声音、对白、弧光、压力选择）
#   → 见 characters/{角色名}.md
#
# 分析原则（麦基三条第一性原理）：
#   1. 塑造 vs 真相：面具与面孔的落差
#   2. 压力下的选择：选择揭示本性
#   3. 维度 = 矛盾：角色内部的对立面

# ═══════════════════════════════════════════
# 角色功能分配表
# ═══════════════════════════════════════════

cast_overview:
  protagonist: 罗辑
  secondary_protagonist: 章北海
  antagonist: 三体文明（非具象化，通过智子间接呈现）
  supporting_cast:
    - name: 史强（大史）
      function: 罗辑的人间尺度参照系，跨越两个世纪的守护者
    - name: 泰勒
      function: 面壁计划悖论的第一个祭品（自杀证明身份不可撤销）
    - name: 雷迪亚兹
      function: 面壁者权力反噬的极端案例（被自己的人民砸死）
    - name: 希恩斯
      function: 用技术改造信念结构的面壁者（思想钢印）
    - name: 山杉惠子
      function: 以夫妻关系为切入的破壁者，ETO最后成员
    - name: 丁仪
      function: 水滴真相的揭示者，人类知识边界的象征
    - name: 庄颜
      function: 罗辑行动力的情感来源（使他愿意拯救世界的原因）
    - name: 东方延绪
      function: 章北海末路上最后的见证者，新时代太空人类缩影
    - name: 叶文洁
      function: 缺席的导师——仅序章出场，思想遗产贯穿全书
    - name: 常伟思
      function: 制度的代表——最接近识破章北海但始终缺少最后一块拼图
    - name: 萨伊
      function: 制度权力对面壁者的压迫者与真相揭露者

# ═══════════════════════════════════════════
# 对手/对抗力量
# ═══════════════════════════════════════════

antagonist:
  name: 三体文明
  relationship_to_protagonist: >
    非具象化的宇宙级对手——通过智子间接呈现。
    从未以个体形象出场，只以字幕、探测器（水滴）和行动逻辑存在。
    最终以智子代言人的形象在墓地与罗辑谈判。
  power_source: >
    绝对的技术碾压（强互作用力材料、智子封锁基础物理学）
    + 思维透明带来的"无法理解欺骗"的特质（既是弱点也是恐惧之源）。
  motivation: >
    生存——三体文明因自身星系不稳定而必须寻找新家园，
    消灭人类是为了消除潜在威胁。冷酷但逻辑自洽。
  narrative_function: >
    不可见性是叙事的关键设计——对手越抽象，面壁者的战略空间越大。
    水滴攻击是三体威胁从抽象变为具体的唯一时刻，因此冲击力达到极致。

  internal_antagonists:
    - name: 失败主义
      description: >
        比三体舰队更先到达的心理武器。
        从泰勒的自杀到希恩斯的思想钢印，
        失败主义以不同形态侵蚀着每一个角色。
    - name: 猜疑链
      description: >
        黑暗森林法则在人类内部的微缩验证。
        星舰地球黑暗战役中五舰自相残杀证明了其普适性。

# ═══════════════════════════════════════════
# ETO / 破壁人：角色功能分配与跨部映射
# ═══════════════════════════════════════════
# 这些角色在《三体I》三体VR游戏中以历史人物化身首次登场，
# 在《三体Ⅱ》中延续同一化身参与破壁计划。
# 参见：novels/三体Ⅰ-地球往事/characters/三体游戏玩家.md
# 个体声音和对白 → characters/ETO与破壁人.md

eto_breaker_system:
  - game_alias: "秦始皇"
    system_role: ETO核心领导层代言人，破壁计划的发起者
    trisolaris_i_role: "统治者模板NPC"
    trisolaris_ii_role: "核心领导层的七人在说话"（行1029）
    cross_novel_note: >
      从NPC升格为ETO领导层化身——暗示ETO高层
      刻意选择了"统治者"形象投射权力意志。

  - game_alias: "冯·诺伊曼"
    system_role: 破壁人一号（泰勒的破壁人）
    trisolaris_i_role: "三体游戏最活跃的理想主义型真人玩家"
    trisolaris_ii_role: "单膝跪下接受破壁使命"（行1034）
    cross_novel_note: >
      理想主义特质演化为殉道式献身——
      "之后，我们也没有存在的必要了"（行1043）。
    narrative_note: >
      实际执行破壁的人以卑微小职员形象出现（行1768），
      是否为冯·诺伊曼的真身，文本未明确。

  - game_alias: "墨子"
    system_role: 破壁人二号（雷迪亚兹的破壁人）
    trisolaris_i_role: "三体I中被归类为NPC，但三体Ⅱ中以真人身份出现"
    trisolaris_ii_role: "高傲站立不跪，'我将是第一个破壁的'"（行1037）
    cross_novel_note: >
      如确为真人玩家，则三体I中沉默旁观→三体Ⅱ中施虐性自信，
      构成从隐忍到释放的弧线。
    narrative_note: >
      以英俊中年男形象破壁雷迪亚兹（行2661），
      与雷迪亚兹的暴力形成完全对称的精神暴力。

  - game_alias: "亚里士多德"
    system_role: 破壁人三号（希恩斯的破壁人，被指定但未实际执行）
    trisolaris_i_role: "对抗型真人玩家，逻辑质疑者"
    trisolaris_ii_role: "'他的破壁人也只能是我了'"（行1039）
    cross_novel_note: >
      逻辑质疑者气质延续——游戏中挑战理论，破壁中挑战战略。
    narrative_note: >
      被指定为希恩斯破壁人，但200年后实际破壁的是山杉惠子——
      暗示ETO破壁计划在冬眠间隙中已失效或被超越。

  - game_alias: "周文王"
    system_role: ETO降临派核心重建者
    trisolaris_i_role: "三体游戏中的引路人角色"
    trisolaris_ii_role: "在虚拟空间废墟荒原中重建ETO组织"（行259-367）
    cross_novel_note: >
      从"引路人"升格为组织重建者——
      引导他人的叙事功能保持不变，场域从游戏转入现实政治。

  - game_alias: "牛顿"
    system_role: ETO散户成员（组织生态的底层视角）
    trisolaris_i_role: "功利型真人玩家，精明的现实主义者"
    trisolaris_ii_role: "以单线联系存活，确认安全后才愿久留"（行366）
    cross_novel_note: >
      自保本能跨部一致——"你逃命的本事在秦始皇时代就表现出来了"（行359）。
      与冯·诺伊曼的理想/现实对照在两部中持续。

  - alias: "破壁人二号（化名）"
    system_role: >
      三体智子直接联络的ETO执行者（行200-256）。
      注意：此人与被秦始皇指定的"破壁人二号（墨子）"可能不是同一人。
    narrative_note: >
      展示三体人与ETO重新建立联系的过程。
      执行伊文斯遗命（刺杀罗辑的前置任务）。

# ═══════════════════════════════════════════
# 对比轴
# ═══════════════════════════════════════════

contrast_axes:
  luo_ji_vs_zhang_beihai: >
    全书最核心的镜像对照。
    罗辑：unconscious型脊椎，从逃避到被迫承担，最终选择留下对抗。
    章北海：conscious型脊椎，从一开始就知道要做什么，选择逃亡。
    两人面对相同的宇宙真相（人类必败），给出了相反的答案——
    罗辑以同归于尽的威慑创造脆弱的和平，
    章北海以逃亡为人类保存种子。
    两种答案都付出了极大代价，且都有自己的合理性。
    最终章北海死于内心的柔软，罗辑活下来因为他从未假装坚硬。

  four_wallfacers: >
    四位面壁者构成递进式的面壁困境展示：
    泰勒（军事极端主义）→ 雷迪亚兹（同归于尽主义）→
    希恩斯（信念改造主义）→ 罗辑（哲学洞见主义）。
    前三者都在技术/军事层面寻找出路，全部失败；
    罗辑在哲学层面找到了答案——唯一有效的武器不是技术而是认知。

  shi_qiang_vs_zhuang_yan: >
    罗辑身边两个守护者的对照：
    史强以职业本能守护（不判断、不施压、只行动），
    庄颜以存在本身守护（她的幸福就是罗辑的动力来源）。
    史强活到了最后，庄颜被冬眠——
    代表"行动的守护"比"存在的守护"更持久。

  feng_neumann_vs_newton: >
    三体I延续至三体Ⅱ的跨部对照：
    冯·诺伊曼（理想主义→殉道式破壁人）vs 牛顿（现实主义→谨慎的生存者）。
    代表技术精英面对终极危机时的两种人格归宿。

# ═══════════════════════════════════════════
# 关系动态
# ═══════════════════════════════════════════

relationships:
  power_dynamics: >
    面壁者拥有形式上的绝对权力，但实际上被制度困住：
    PDC可以用家人威胁（庄颜冬眠），破壁人可以摧毁战略，
    社会可以遗忘和驱逐。面壁者的权力悖论——
    越是不可解释的权力，越是脆弱的权力。

  key_tensions:
    - "罗辑 vs 萨伊/PDC：个体自由 vs 制度强制"
    - "章北海 vs 常伟思：隐藏的真相 vs 直觉的怀疑"
    - "希恩斯 vs 山杉惠子：信念的共谋 vs 信念的背叛"
    - "章北海 vs 东方延绪：两个世纪的隔阂 vs 超越立场的信任"
    - "罗辑 vs 三体文明：一人对抗一个文明的终极不对称"
    - "面壁者 vs 破壁人：思维密室 vs 行为推断的智识博弈"

  potential_shifts:
    - "章北海从'可靠的军人'到'最大的叛徒'——身份的180度翻转"
    - "山杉惠子从'忠诚的妻子'到'最后的破壁人'——亲密关系的颠覆"
    - "罗辑从'被遗忘的面壁者'到'唯一的执剑人'——从底谷到顶点"
    - "亚里士多德被指定为破壁人→山杉惠子实际执行——ETO计划的失效与替代"
