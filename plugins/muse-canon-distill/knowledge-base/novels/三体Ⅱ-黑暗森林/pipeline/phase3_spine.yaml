# Phase 3: 故事脊椎 + Arc 框架 — 《三体Ⅱ·黑暗森林》逆向分析
# 分析依据：navigation.md + 序章(行3-57) + 面壁者任命(行822-950)
#            + 冰湖顿悟(行2039-2074) + 最终对决(行4562-4626)
#
# 本书存在双主角（罗辑 + 章北海），脊椎以罗辑为主轴。

# ═══════════════════════════════════════════
# 激励事件
# ═══════════════════════════════════════════

inciting_incident:
  description: >
    叶文洁在杨冬墓前向罗辑传授宇宙社会学的两条公理
    （生存是文明第一需要；文明不断扩张，物质总量不变），
    并提出"猜疑链"和"技术爆炸"两个关键概念。
    罗辑当时并未理解其深意，但它在他的大脑中埋下了
    200年后推导出黑暗森林法则的全部要素。
  type: accident
  timing: 序章，行46（故事0%处）
  balance_before: >
    罗辑是一个胸无大志的社会学讲师，
    生活处于无风无浪的平庸平衡中。
  balance_after: >
    公理的种子尚未发芽，但三体世界已因此对罗辑发出刺杀令（行249-251）。
    罗辑的生活平衡被打破——虽然他自己尚不知情。
  impact_on_protagonist: >
    短期内罗辑未受影响，但面壁者身份的赋予（行822）是公理传授的直接后果——
    三体世界知道叶文洁告诉了罗辑"某些东西"。

  secondary_inciting_incident:
    description: >
      罗辑被联合国宣布为第四面壁者（行822），
      并领悟到面壁者身份不可撤销（行946-950）。
    timing: 上部，行822（约故事18%处）
    significance: >
      公理是"思想层面的激励事件"，面壁者任命是"行动层面的激励事件"——
      强制改变了罗辑的社会身份和生存处境。

# ═══════════════════════════════════════════
# 欲望对象与脊椎
# ═══════════════════════════════════════════

desire_object:
  conscious: >
    前期：逃避面壁者身份，追求个人幸福（庄园、庄颜、爱情）。
    后期：保护庄颜和孩子 → 保护地球文明的生存。
  unconscious: >
    完成叶文洁未竟的思想推导——将两条公理延伸为完整的黑暗森林法则。
    这一不自觉欲望在冰湖顿悟时突然涌现（行2074）。
  tension: >
    罗辑越是想逃避面壁者身份去追求爱情，
    就越是被命运推向必须面对宇宙真相的位置。
    庄颜被强制冬眠（行1875）是两种欲望碰撞的关键节点。

spine_statement: >
  一个浪荡的普通人被迫成为人类的最后守护者，
  经历逃避、顿悟和失去一切后，
  以自己的生命为筹码向宇宙发出威慑，换取文明的存续。
spine_type: unconscious

dramatic_question:
  question: >
    罗辑能否从叶文洁的两条公理中推导出拯救地球的方法，
    并在三体文明的全面压制下将其实现？
  obligatory_scene: >
    罗辑独自面对三体（智子），以个人生命为筹码迫使三体妥协——
    必须出现在叶文洁墓前（首尾呼应序章）。
    实际出现于行4562-4626。

# ═══════════════════════════════════════════
# 对抗力量（三层）
# ═══════════════════════════════════════════

opposing_forces:
  internal: >
    罗辑天性中的逃避倾向——他最初真心不想承担面壁者使命。
    冰湖顿悟后又患上星空恐惧症，承受知道真相的精神重压。
  personal: >
    萨伊/PDC的强迫（夺走庄颜逼他工作）；
    ETO的持续刺杀（KILLER病毒跨越世纪追杀）；
    面壁计划被废除后社会的遗忘和驱逐。
  external: >
    三体文明的全面技术压制——智子监控、水滴攻击、太阳封锁。
    三体专门针对罗辑的刺杀令（唯一被点名必杀的面壁者）。

# ═══════════════════════════════════════════
# 幕/Arc 框架（从高潮回溯：6个重大逆转）
# ═══════════════════════════════════════════

arcs:
  - arc_id: ARC-1
    name: "种子与面壁"
    value_at_start: "平庸的安宁——罗辑是无忧无虑的普通讲师"
    value_at_end: "被迫承担——面壁者身份不可撤销"
    climax_event: "罗辑从凶手微笑中领悟面壁者本质（行946-950）"
    function_note: "建置——埋下思想种子，确立主角身份困境"

  - arc_id: ARC-2
    name: "逃避与爱情"
    value_at_start: "逃避中的自由——罗辑在庄园享受面壁者特权"
    value_at_end: "爱情的甜蜜被末日阴影笼罩——三体舰队被证实"
    climax_event: "哈勃二号发现三体舰队尾迹（行1705-1759）"
    function_note: "建置——展示四位面壁者各自推进，确立爱情线"

  - arc_id: ARC-3
    name: "破壁与顿悟"
    value_at_start: "面壁者的困境——一个面壁者已死，罗辑仍在逃避"
    value_at_end: "觉醒——罗辑顿悟黑暗森林法则，发出第一击"
    climax_event: "冰湖顿悟 + 咒语发射（行2074 + 行2231）"
    function_note: "递升——思想核心时刻，脊椎转折点"

  - arc_id: ARC-4
    name: "暗杀与冬眠"
    value_at_start: "行动的代价——罗辑已冬眠，章北海在暗中行动"
    value_at_end: "历史的暂停——所有棋子落位，等待200年后揭晓"
    climax_event: "雷迪亚兹被民众砸死，200年时间断裂（行2716-2800）"
    function_note: "过渡——多面壁者陨落，章北海暗杀改变技术路线"

  - arc_id: ARC-5
    name: "末日与覆灭"
    value_at_start: "虚假的繁荣——人类自以为已经胜利"
    value_at_end: "全面覆灭——太空力量毁灭，猜疑链在人类内部验证"
    climax_event: "水滴全歼联合舰队 + 黑暗战役章北海之死（行3819-4191）"
    function_note: "高潮——双重毁灭（外部技术碾压 + 内部猜疑链验证）"

  - arc_id: ARC-6
    name: "黑暗森林"
    value_at_start: "近乎灭绝——地球被封锁，无力反抗"
    value_at_end: "威慑和平——以同归于尽的恐怖平衡实现脆弱的生存"
    climax_event: "罗辑在叶文洁墓前以生命为开关迫使三体妥协（行4562-4626）"
    function_note: "高潮+结局——全书终极价值变化，首尾呼应"

# ═══════════════════════════════════════════
# 故事高潮设计（从结局回溯）
# ═══════════════════════════════════════════

story_climax_design:
  crisis:
    dilemma: >
      罗辑在水滴封锁太阳后面临终极两难：
      A）接受人类无力反抗的现实，在绝望中度过余生；
      B）以自己的生命为赌注，向三体发出同归于尽的威胁——
      如果三体不妥协，他的死亡将触发三体世界坐标的宇宙广播，
      但同时也会暴露地球的存在。
    option_a: "接受无力的现实，在绝望中度过余生"
    option_b: "以生命为赌注，将两个文明同时置于黑暗森林猎枪之下"
    character_revelation: >
      一个曾经"去他妈的面壁计划"的人，最终愿意用自己的生命
      作为文明存续的唯一保险丝——真正的勇气不是无所畏惧，
      而是在恐惧中仍然选择承担。
  climax:
    action: >
      罗辑在叶文洁/杨冬墓前挖好自己的墓穴，
      将生命体征监测仪连接到3614枚核弹网络，
      以手枪抵胸等待智子出现。三体被迫谈判并妥协。
    value_change:
      from: "全面的无力——被封锁、被遗弃、被驱逐"
      to: "威慑和平——以同归于尽的恐怖平衡实现脆弱的生存"
    controlling_idea_expression: >
      反讽型主控思想：人类存活了（正面），但手段是以毁灭威胁毁灭（负面机制），
      威慑由一个被所有人遗弃的孤独个体独自建立。
      结尾与三体监听员的对话暗示超越这一逻辑的可能性——爱。
  resolution:
    new_balance: >
      威慑平衡——双方都拥有暴露对方坐标的能力，
      引力波天线成为新的威慑装置，罗辑成为"执剑人"。
    lingering_feeling: >
      反讽中的一线温暖：和平建立在恐怖平衡上，但最后一幕——
      孩子在草地上奔跑，监听员谈论"爱的萌芽"——
      暗示这不是终点，而是新纪元的开始。
      "当然不害怕，她知道明天太阳还会升起来的。"

# ═══════════════════════════════════════════
# 章北海平行脊椎（副线）
# ═══════════════════════════════════════════

secondary_spine:
  character: 章北海
  spine_statement: >
    一个坚信人类必败的军人，以两百年的隐忍和欺骗，
    试图为人类保存一粒逃亡的种子。
  spine_type: conscious
  inciting_incident: >
    父亲临终嘱咐"要多想"（行458-531），
    章北海领悟到必须以长期主义的方式为人类未来行动。
  dramatic_question: >
    章北海能否骗过所有人两百年，
    并在关键时刻带领人类飞船逃离太阳系？
  resolution: >
    部分成功：他成功劫持"自然选择"号，建立了星舰地球，
    但在黑暗战役中因最后的犹豫被抢先击杀（行4170-4191）。
    "蓝色空间"号最终飞向深空，实现了他的遗志。
