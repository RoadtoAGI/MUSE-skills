        handoff: 罗辑靠在墓碑上睡着，梦到庄颜在雪原上远去
        beat_direction: "音乐的负空间——《山楂树》只存在几秒就消失，缺席比在场更有力"
        source_chapter: "下部，行4529-4557"

      - scene_id: "S13"
        arc_id: ARC-6
        location: 叶文洁/杨冬墓地（雨夜 → 黎明）
