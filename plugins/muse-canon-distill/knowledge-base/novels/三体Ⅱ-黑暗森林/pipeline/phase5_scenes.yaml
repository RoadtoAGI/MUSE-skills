        handoff: 章北海率五舰建立"星舰地球"
        beat_direction: "以'邮差路线'的几何之美表现毁灭之恐怖——美学与暴力的极端反差"
        source_chapter: "下部，行3752-3914"

  - seq_id: ARC5-SEQ4
    scenes:
      - scene_id: "S11"
        arc_id: ARC-5
        location: 星舰地球（五艘飞船的太空深处）
        time: 危机纪年第205年后不久
