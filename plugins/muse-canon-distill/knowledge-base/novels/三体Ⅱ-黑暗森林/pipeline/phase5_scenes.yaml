# Phase 5: 关键场景（27个节点）— 《三体Ⅱ·黑暗森林》逆向分析
# 场景挂在 Phase 4 的序列下，只提取结构转折点、高潮、关键建置场景。
# 并非所有序列都有场景——无关键转折的序列不占场景位。

# ═══════════════════════════════════════════
# 场景编排（按序列组织）
# ═══════════════════════════════════════════

sequence_expansions:

  # ── ARC-1: 种子与面壁 ──

  - seq_id: ARC1-SEQ1
    scenes:
      - scene_id: "S01"
        arc_id: ARC-1
        location: 杨冬墓前（暮色中的墓地）
        time: 危机纪年前夕，黄昏
        participants: [叶文洁, 罗辑, 褐蚁]
        pov: 褐蚁（微观视角对位宇宙命题）
        conflict: >
          表面无冲突（两人平和对话），但深层冲突已埋下：
          叶文洁即将赴死，罗辑对公理的含义毫无概念，
          而这次信息传递将让他成为三体世界的头号刺杀目标。
        value_start: 无知的安宁
        value_end: 种子已种下（罗辑不自知）
        must_include: >
          两条公理的明确陈述；"猜疑链"和"技术爆炸"两个概念；
          叶文洁的"怕没有机会了"；蚂蚁爬过墓碑上的数字和汉字。
        handoff: 时间回溯至"更早一些的时候"——切换到伊文斯与三体人的对话
        source_chapter: "序章，行3-57"

      - scene_id: "S02"
        arc_id: ARC-1
        location: "审判日"号船首/船尾，太平洋夜色
        time: 危机纪年前夕，深夜
        participants: [伊文斯, 三体智子]
        pov: 伊文斯
        conflict: >
          两种文明的根本差异碰撞：三体人无法理解"狼和孩子"的故事，
          因为在他们的世界，交流等于完全暴露思想。
        value_start: 三体人自以为理解人类
        value_end: "我害怕你们"——恐惧取代自信
        must_include: >
          "想"和"说"不是同义词；"狼和孩子"寓言；
          三体人承认思维透明是文化习性；"我害怕你们"。
        handoff: 时间跳跃至危机纪年第3年
        source_chapter: "序章，行58-121"

      - scene_id: "S15"
        arc_id: ARC-1
        location: 地下室病房
        time: 危机纪年第3年
        participants: [破壁人二号, 三体智子]
        pov: 破壁人二号
        conflict: >
          三体恢复与ETO联系，但明言"消灭人类后再消灭你们"——
          ETO的效忠对象明确表达了对他们的厌恶和利用。
        value_start: ETO被抛弃的绝望
        value_end: 被利用的"复活"——三体需要ETO但不信任他们
        must_include: >
          金鱼之死验证智子存在；"消灭人类后再消灭你们"；
          三体人承认"你是对的，我们学会隐瞒了"；
          伊文斯遗命的解密。
        handoff: ETO在虚拟空间重建
        source_chapter: "上部，行200-256"

  - seq_id: ARC1-SEQ2
    scenes:
      - scene_id: "S08b"
        arc_id: ARC-1
        location: 病房（夕阳中）
        time: 危机纪年第3年
        participants: [章北海, 章北海父亲]
        pov: 章北海
        conflict: >
          章北海整夜未眠后向病危父亲问出"那我该怎么办"——
          他知道这是最让父亲失望的一句话，但他需要这个确认。
        value_start: 迷茫的军人——加入太空军但不知如何行动
        value_end: "要多想"——一生决定的起点，章北海副线脊椎的激励事件
        must_include: >
          "要多想"三字的完整对话；章北海双手攥床单的身体细节；
          "我们想的一样"的内心独白；夕阳/怒海/驱逐舰的意象闪回。
        handoff: 罗辑在专机上回忆往事——双线并行的起点
        beat_direction: "对白只有三句，内心独白用三万字也说不完——外部极简 vs 内部极丰"
        source_chapter: "上部，行458-479"

      - scene_id: "S03"
        arc_id: ARC-1
        location: 联合国大厅 → 萨伊办公室
        time: 危机纪年第3年
        participants: [罗辑, 萨伊, 泰勒, 雷迪亚兹, 希恩斯, 坎特]
        pov: 罗辑
        conflict: >
          罗辑被宣布为第四面壁者，当场拒绝但发现拒绝本身也可被解读为面壁战略。
          随后遭ETO狙击手狙击（防弹衣保命）。
        value_start: 普通公民
        value_end: 不可撤销的面壁者——一座无形的牢笼
        must_include: >
          萨伊公布四人名单；罗辑当场拒绝；
          ETO凶手的"永恒微笑"；罗辑领悟面壁者不可撤销的逻辑。
        handoff: 罗辑利用面壁权力要求建造庄园——从抗拒到利用
        beat_direction: "从愤怒爆发（'为什么选中我？'）→ 冷静认知（'对我没有信心是对的'）→ 转向利用"
        source_chapter: "上部，行793-950"

  # ── ARC-2: 逃避与爱情 ──

  - seq_id: ARC2-SEQ1
    scenes:
      - scene_id: "S04"
        arc_id: ARC-2
        location: 三体虚拟空间（废墟荒原）
        time: 危机纪年第3年
        participants: [秦始皇, 冯·诺伊曼, 墨子, 亚里士多德]
        pov: ETO虚拟空间成员
        conflict: >
          三体世界为三个面壁者各指定破壁人，唯独罗辑"以自己为破壁人"——
          连三体人都不知道罗辑为何危险。
        value_start: 面壁计划看似可控
        value_end: 最大悬念确立——罗辑的威胁性连对手都无法评估
        must_include: >
          "罗辑直接与主对决"；"伊文斯知道原因但已死"；
          三位破壁人以册封骑士方式指定。
        handoff: 切回地球——章北海在太空军会议中展示唯一的胜利信念
        source_chapter: "上部，行1022-1050"

      - scene_id: "S16"
        arc_id: ARC-2
        location: 太空军政治部会议室
        time: 危机纪年第3年
        participants: [章北海, 常伟思, 32名太空军政工军官]
        pov: 章北海
        conflict: >
          常伟思问谁认为有"真正有意义的胜利可能性"——
          32人中只有章北海举起手。
        value_start: 集体的失败主义沉默
        value_end: 唯一的胜利主义者站起——但这是面具
        must_include: >
          立正站着拒绝坐下；"一次例外就够了"；
          "如果用这种思维方式去思考星际战争，我们永远无法建立胜利的信念"。
        handoff: 面壁者各自推进战略
        source_chapter: "上部，行1051-1087"

  - seq_id: ARC2-SEQ2
    scenes:
      - scene_id: "S21"
        arc_id: ARC-2
        location: 专机上 → 心理诊所（回忆）
        time: 危机纪年第3年（回忆跨越数年）
        participants: [罗辑, 白蓉, 心理医生]
        pov: 罗辑
        conflict: >
          罗辑发现自己疯狂爱上了自己为白蓉的小说虚构的角色——
          他把最深的爱给了一个幻影。
        value_start: 普通的感情生活
        value_end: 心灵最僻静的疆土永久属于一个幻影——庄颜的原型
        must_include: >
          白蓉要求写小说创造完美女孩；与虚构角色共同旅行；
          心理医生："别人所爱的对象也只是存在于想象之中"；
          雪原、壁炉、弯月的意象——后来全部在庄颜身上重现。
        handoff: 庄颜真正出现（壁炉场景）
        source_chapter: "上部，行596-733"

      - scene_id: "S05"
        arc_id: ARC-2
        location: 北欧庄园（壁炉前 → 雪山路 → 卢浮宫）
        time: 危机纪年第3-5年
        participants: [罗辑, 庄颜, 史强]
        pov: 罗辑
        conflict: >
          罗辑用面壁权力追求个人幸福，但史强患白血病入冬眠（失去守护者），
          "使你幸福快乐，是面壁计划的一部分"既是真话也是谎话。
        value_start: 孤独的逍遥
        value_end: 爱情确立但带着末日阴影
        must_include: >
          壁炉点燃时庄颜在金色火光中显现；
          卢浮宫蒙娜丽莎前的对视——爱情确认。
        handoff: 哈勃二号发现三体舰队尾迹——末日从抽象变为具体
        source_chapter: "上部，行1424-1704"

  # ── ARC-3: 破壁与顿悟 ──

  - seq_id: ARC3-SEQ1
    scenes:
      - scene_id: "S06"
        arc_id: ARC-3
        location: 罗辑庄园旁的湖边
        time: 危机纪年第8年
        participants: [泰勒, 罗辑]
        pov: 罗辑
        conflict: >
          泰勒被破壁后精神崩溃，来向罗辑倾诉后饮弹自杀。
        value_start: 面壁者的困境
        value_end: 面壁者的代价是死亡
        must_include: >
          泰勒讲述被破壁经历；湖边枪声；庄颜闻声而来的恐惧。
        handoff: PDC以庄颜为人质逼罗辑工作——逃避的终结
        source_chapter: "中部，行1795-1874"

      - scene_id: "S06b"
        arc_id: ARC-3
        location: 罗辑庄园 → 萨伊的视频通话
        time: 危机纪年第8年
        participants: [罗辑, 萨伊, 庄颜]
        pov: 罗辑
        conflict: >
          PDC将庄颜和孩子强制冬眠以逼罗辑工作。
          萨伊揭露三体世界曾专门下令刺杀罗辑——唯一被点名必杀的面壁者。
        value_start: 逃避中的幸福（庄颜仍在身边）
        value_end: 失去一切——爱人被夺，逃避之路被封死
        must_include: >
          "我看到的是一个一个的人"；萨伊揭露三体刺杀令；
          "那我就和她们一起去末日"——被用庄颜命运逼回来。
        handoff: 罗辑被迫开始真正的思考——冬季散步
        source_chapter: "中部，行1875-1980"

  - seq_id: ARC3-SEQ2
    scenes:
      - scene_id: "S07"
        arc_id: ARC-3
        location: 庄园冬季，结冰的湖面
        time: 危机纪年第8-9年
        participants: [罗辑]
        pov: 罗辑
        conflict: >
          罗辑在冰面行走时冰面破裂跌入冰水，
          在极寒的刹那间，两条公理在他脑中延伸为完整的逻辑链。
        value_start: 漫长的迷茫——两条公理悬而未解
        value_end: 真相降临——宇宙是一座黑暗森林
        must_include: >
          冰面破裂的物理细节；极寒中的感官描写；
          "面壁者罗辑，我是你的破壁人"——自我破壁宣言。
        handoff: 罗辑向PDC提出"咒语"计划
        beat_direction: "感官极限体验承载思想突破——物理的破裂对应认知的破裂"
        source_chapter: "中部，行2039-2074"

      - scene_id: "S17"
        arc_id: ARC-3
        location: 地下安全设施 → ETO虚拟空间（反应）
        time: 危机纪年第9年
        participants: [罗辑, 坎特, ETO成员]
        pov: 罗辑 / ETO
        conflict: >
          罗辑提出以太阳为天线向宇宙广播一颗恒星坐标的"咒语"计划，
          ETO试图阻止但无法渗透他的厨房。
        value_start: 顿悟后的理论——尚未转化为行动
        value_end: 咒语已发射，不可收回
        must_include: >
          "除了安全，没有任何要求，要绝对安全"；
          ETO讨论："主很怕他"；
          三体拒绝向ETO透露罗辑的威胁本质——"宇宙中最重要的秘密"。
        handoff: 罗辑感染基因武器后冬眠
        source_chapter: "中部，行2075-2164"

  # ── ARC-4: 暗杀与冬眠 ──

  - seq_id: ARC4-SEQ1
    scenes:
      - scene_id: "S08"
        arc_id: ARC-4
        location: 太空（外太空10公里狙击距离）
        time: 危机纪年约15年
        participants: [章北海]
        pov: 章北海
        conflict: >
          章北海以铁陨石子弹在太空中狙杀三名阻碍辐射驱动研发的关键人物，
          伪装成陨石雨事故。
        value_start: 技术路线争议——工质推进vs辐射驱动
        value_end: 辐射驱动路线胜出（以三条人命为代价）
        must_include: >
          铁陨石子弹的精密制造；太空狙击的物理细节；
          常伟思的怀疑但无法证实；ETO评议"最危险的胜利主义者"。
        handoff: 章北海率特遣队入冬眠——200年时间断裂
        beat_direction: "极度冷静的叙述调——'心就像太空一般寒冷而平静'"
        source_chapter: "中部，行2321-2408"

  - seq_id: ARC4-SEQ2
    scenes:
      - scene_id: "S18"
        arc_id: ARC-4
        location: 张援朝家中，电视前
        time: 危机纪年约12年
        participants: [张援朝, 杨晋文, 苗福全]
        pov: 三位老人
        conflict: >
          三位退休老人在粮票重现的日子里讨论死后安排——
          太空葬、深埋矿井、立墓碑——直到杨晋文说出"那时已经没有人了"。
        value_start: 日常闲聊的平静
        value_end: "没有人了，什么都是空的了"——存在主义恐惧的突然坍缩
        must_include: >
          粮票在三代人手中传递；太空葬vs深埋矿井的荒诞讨论；
          "墓碑是给人看的，那时已经没有人了"。
        handoff: 章北海去核聚变基地找丁仪
        source_chapter: "中部，行2265-2299"

      - scene_id: "S09b"
        arc_id: ARC-4
        location: PDC听证会 → 委内瑞拉
        time: 危机纪年约18年
        participants: [雷迪亚兹, 破壁人, PDC代表]
        pov: 雷迪亚兹 / PDC
        conflict: >
          破壁人揭穿雷迪亚兹的水星坠日同归于尽战略——
          他从未想过保卫地球，只想在失败时拉上太阳系陪葬。
        value_start: 面壁者的权力尚存
        value_end: 被自己的人民乱石砸死——面壁者权力的终极反噬
        must_include: >
          破壁人精准揭穿"摇篮"假装置；雷迪亚兹暴力反击（掐住破壁人脖子）；
          回国后在阳光下高喊"我的太阳！"（恐日症消失）；被民众用石头砸死。
        handoff: 各角色中期结局交代——200年冬眠断裂
        source_chapter: "中部，行2626-2715"

  # ── ARC-5: 末日与覆灭 ──

  - seq_id: ARC5-SEQ1
    scenes:
      - scene_id: "S10b"
        arc_id: ARC-5
        location: 冬眠苏醒中心 → 地下北京（巨树城市）
        time: 危机纪年第205年，清晨
        participants: [罗辑, 护士]
        pov: 罗辑
        conflict: >
          罗辑185年后苏醒，初见地下千米深处的巨树城市——
          震撼之后发现"天是假的，太阳也是假的"。
        value_start: 冬眠的茫然——不知身在何处
        value_end: 新世界的震撼——"美丽的新世界"但罗辑泪流满面
        must_include: >
          飞行自行车（伞形螺旋桨）；"这是什么地方？""北京啊。"；
          "现在没有家了，婚姻家庭在大低谷后就没有了"。
        handoff: 面壁计划被全票废除
        source_chapter: "下部，行2896-2940"

      - scene_id: "S09c"
        arc_id: ARC-5
        location: 听证会（200年后）
        time: 危机纪年第205年
        participants: [山杉惠子, 希恩斯, 听证会代表]
        pov: 山杉惠子
        conflict: >
          山杉惠子以地球三体组织最后成员的身份宣布破壁——
          揭穿思想钢印的正负号被秘密反转，
          所有被印者实际被固化的是"人类必败"信念。
        value_start: 面壁计划的最后残余
        value_end: 面壁计划正式终结——四位面壁者的使命全部结束或失败
        must_include: >
          "面壁者比尔·希恩斯，我是你的破壁人"；
          希恩斯用思想钢印封死了自己的悔罪能力——"上帝不可能忏悔"；
          山杉惠子"草丛中蛇的鳞片反射的月光"般的表情。
        handoff: 章北海苏醒，被任命为执行舰长
        source_chapter: "下部，行3005-3049"

  - seq_id: ARC5-SEQ2
    scenes:
      - scene_id: "S09"
        arc_id: ARC-5
        location: "自然选择"号战舰操作室
        time: 危机纪年第205年
        participants: [章北海, 东方延绪, 列文, 井上明]
        pov: 章北海 / 东方延绪
        conflict: >
          章北海利用执行舰长权限将战舰设定为遥控状态，
          以全舰2000人为人质强行驶离木星军港。
        value_start: 表面的纪律与服从
        value_end: 逃亡主义的暴露——一个两百年的骗局揭晓
        must_include: >
          "前进四"命令；东方延绪的抉择；
          "一个尽责任的军人，为人类的生存而战"。
        handoff: 联合舰队全军出动拦截水滴
        source_chapter: "下部，行3491-3543"

      - scene_id: "S11b"
        arc_id: ARC-5
        location: "自然选择"号，球形舱内外
        time: 危机纪年第205年（劫舰后数日）
        participants: [章北海, 东方延绪]
        pov: 东方延绪
        conflict: >
          章北海被困在球形舱中用笔写回忆录，东方延绪隔舱质问他为何叛逃。
          追击舰队逼近，但两人之间却在进行一场关于"责任"的对话。
        value_start: 叛逃后的对立——东方延绪代表秩序，章北海代表判断
        value_end: 超越立场的理解——"没有永恒的敌人或同志，只有永恒的责任"
        must_include: >
          "你们按照可能的结果来决定行动；而我们，必须尽责任"；
          章北海用笔写纸质回忆录——"纸会比电脑保存得更久"；
          东方延绪承诺"自然选择号不会减速"。
        handoff: 丁仪被指派考察水滴——从内部危机切换到外部威胁
        source_chapter: "下部，行3632-3660"

  - seq_id: ARC5-SEQ3
    scenes:
      - scene_id: "S19"
        arc_id: ARC-5
        location: "量子"号指挥会议 → 穿梭艇
        time: 危机纪年第205年
        participants: [丁仪, 西子, 量子号军官]
        pov: 丁仪
        conflict: >
          丁仪看到水滴影像后"感觉不好"，请求量子号进入深海状态，
