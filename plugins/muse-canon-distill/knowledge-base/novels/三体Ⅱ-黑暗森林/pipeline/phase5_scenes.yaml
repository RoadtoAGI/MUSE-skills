        value_start: 乐观的准备——所有人认为水滴是和平使者
        value_end: 一个被忽略的预警——直觉 vs 集体乐观
        must_include: >
          "它不像星际探测器，却像艺术品。离概念差得太远，可不是好兆头"；
          请求深海状态被犹豫后执行；
          "孩子们啊，我这两个世纪前的人了，居然还能教物理"。
        handoff: 穿梭艇飞向水滴——丁仪和西子的闲聊（"我爱你，与你有何相干"）
        source_chapter: "下部，行3632-3704"

      - scene_id: "S10"
        arc_id: ARC-5
        location: "螳螂"号无人飞船 → 联合舰队阵列
        time: 危机纪年第205年
        participants: [丁仪, 西子, 联合舰队百万官兵]
        pov: 丁仪 → 舰队多视角
        conflict: >
          丁仪发现水滴为强互作用力材料后说"毁灭你，与你何干"，
