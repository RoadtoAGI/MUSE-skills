          生存第一 + 资源有限 + 猜疑链 + 技术爆炸 = 黑暗森林。
        value_start: 知道真相但无力行动
        value_end: 理论体系完成——但太阳已被封锁
        must_include: >
          两根烟头比喻；猜疑链的逐步推导；
          "宇宙就是一座黑暗森林"的最终宣言；
          咒语已生效（187J3X1已被摧毁）的证实。
