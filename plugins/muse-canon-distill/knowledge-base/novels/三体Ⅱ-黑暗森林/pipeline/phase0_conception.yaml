# Phase 0: 构想 — 《三体Ⅱ·黑暗森林》逆向分析
# 分析依据：navigation.md + 序章(行3-57) + 结局(行4562-4657)

premise: >
  如果宇宙中所有文明都遵循"生存第一"和"资源有限"两条公理，
  在猜疑链和技术爆炸的作用下形成了一座黑暗森林——
  那么当一个普通人被迫成为人类的守护者，发现了这一法则后，
  他将如何利用它来拯救地球？

core_value:
  positive: 生存（文明的延续与自我保存）
  negative: 毁灭（文明的灭绝与消亡）
  spectrum:
    contradictory: 蒙昧中的安全感（人类在不知黑暗森林法则时的虚假安宁——不知恐惧，也无力自保）
    contrary: 恐惧与绝望（得知宇宙真相后的精神崩溃——水滴攻击后全人类的瘫痪状态）
    negation_of_negation: >
      以毁灭换取的生存（通过同归于尽的威慑实现和平——人类存活了，
      但代价是成为黑暗森林的参与者，用毁灭他者的能力维持自身存在）

controlling_idea:
  value: 生存
  cause: >
    因为一个被所有人遗忘的普通人，独自洞悉了宇宙的根本法则，
    并以自己的生命为筹码建立起同归于尽的威慑
  full_statement: >
    文明能够在宇宙的黑暗森林中存活，因为即使最弱小的个体，
    只要理解了宇宙的根本法则，就能以同归于尽的威慑建立起脆弱的和平——
    但真正的希望不在威慑本身，而在超越黑暗森林逻辑的爱的可能性。
  type: ironic
  # 理由：结局同时包含正面（地球获救）和负面（和平建立在恐怖平衡上）的价值，
  # 并以三体监听员与罗辑关于"爱"的对话暗示第三层可能性。
  # 罗辑说"也许有一天，灿烂的阳光能照进黑暗森林"，这是反讽中的一线光明。

genre:
  primary: 硬科幻（Hard Science Fiction）
  secondary: 哲学悬疑 / 太空歌剧
  conventions:
    - setting: >
        宏大的时间尺度（跨越200余年）、外星文明入侵、
        星际距离的物理约束、技术发展的合理推演
    - characters: >
        面壁者（孤独承担使命的英雄原型）、破壁人（智识对手）、
        科学家群像、军人群像、平民视角
    - events: >
        外星舰队入侵的倒计时、面壁/破壁的战略博弈、
        太空舰队决战、同归于尽式的最终对决
    - values: >
        生存 vs 毁灭、个体 vs 文明、
        理性/科学 vs 信仰/直觉、爱 vs 猜疑

originality_statement:
  unique_angle: >
    将博弈论和社会学推演为宇宙文明间的基本法则（黑暗森林理论），
    并以一个最不可能的人（浪荡的大学讲师）作为这一宇宙级洞见的承载者。
    "面壁计划"的设计让思维本身成为武器——
    唯一不可被智子监控的战场是人的大脑内部，
    这将"想"与"说"的不同义性从叙事前提升格为核心战略机制。
  cliches_to_avoid:
    - 避免了"天选之人"套路：罗辑不是先知或超级英雄，而是一个被命运强推上位的普通人
    - 避免了"人类团结战胜外敌"套路：人类内部的失败主义、逃亡主义、猜疑链贯穿始终
    - 避免了"科技vs外星人"的单纯对抗：真正的武器不是技术而是哲学洞见
    - 避免了"光明结局"：和平建立在恐怖平衡之上，黑暗森林的本质未变

style_directives:
  - 零度叙事与诗意段落交替：技术描写极度冷静，情感高潮使用意象化笔法（冰湖顿悟、蒙娜丽莎前对视）
  - 多视角交织：主线（罗辑）与平行线（章北海）双轨推进，辅以面壁者支线和平民线
  - 微观对位宏观：序章以蚂蚁视角起笔，结尾同一只蚂蚁呼应，以微小生命框定宇宙命题
  - 冬眠跳跃：通过冬眠机制实现200年时间跨度，人物主观时间远短于客观时间
  - 概念小说特质：叙事服务于思想实验（黑暗森林法则的逐步推导与验证）

word_count: 约320000字
