# Phase 1: 世界构建 — 《三体Ⅱ·黑暗森林》逆向分析
# 分析依据：navigation.md + 定向阅读（行58-320, 2265-2304, 2895-2940）

setting:
  era: >
    近未来至远未来（危机纪年第3年 → 第208年），
    从21世纪初的当代地球延展至200余年后的地下城市文明。
    时代气质：人类整体处于"被宣判死刑后的倒计时"——
    知道400年后三体舰队将抵达，但无力改变物理学被智子锁死的现实。

  duration: >
    故事时间跨度约205年（危机纪年3-208年），
    但主角罗辑的主观体验时间约15年（中间冬眠185年）。
    上部+中部覆盖约17年（纪年3-20），下部跳跃至纪年205年。
    冬眠机制是关键叙事装置——让角色穿越世纪而不衰老。

  location: >
    多地点全球叙事：联合国纽约总部、北欧庄园（罗辑隐居）、
    洛斯阿拉莫斯核实验室、日本京都、阿富汗山洞、卢浮宫、
    中国太空军基地、太空电梯、木星军港、地下北京（巨树城市）。
    空间从地面→太空→星际逐步扩展，最终到达太阳系边缘。

  conflict_levels:
    internal: >
      罗辑内心的逃避与责任之战——他本能地拒绝面壁者身份，
      沉溺于爱情和逍遥，直到庄颜被带走才被迫面对使命。
      章北海的隐藏信念——表面上是坚定的胜利主义者，
      内心实为逃亡主义者，两百年来隐忍不发。
    personal: >
      面壁者与破壁人的智识博弈（泰勒vs破壁人、雷迪亚兹vs破壁人、希恩斯vs山杉惠子）；
      罗辑与萨伊/PDC的权力角力；章北海与东方延绪的信任与背叛；
      史强与罗辑的守护关系。
    external: >
      人类文明 vs 三体文明的生存对决（智子封锁、舰队入侵、水滴攻击）；
      人类内部的失败主义/逃亡主义撕裂社会；
      星舰地球中的猜疑链——黑暗森林法则在人类内部的微缩验证。

world_rules:
  universe_axioms:  # 宇宙公理层——本部揭示/证明的基础规则
    - >
      宇宙社会学两条公理（序章提出，全书证明）：
      公理一：生存是文明的第一需要。
      公理二：文明不断增长和扩张，但宇宙中的物质总量保持不变。
      由叶文洁在生命最后时刻传授给罗辑（序章），
      构成黑暗森林法则的理论根基。
    - >
      猜疑链：两个文明之间，由于宇宙距离和物种差异，
      无法确认对方是否善意，也无法确认对方是否确认自己善意，
      形成无限递归的猜疑。猜疑链不可消除——
      即使双方都真诚善意，也无法建立信任。
      在星舰地球的"黑暗战役"中被微缩验证（行4002-4191）。
    - >
      技术爆炸：文明可能在极短时间内经历技术革命，
      使整个文明面貌根本改变。人类从石器到核武器仅数千年。
      因此即使当前某文明技术远落后于自己，
      也无法保证它不会在短时间内实现反超。
      技术爆炸使"当前实力对比"失去意义。
    - >
      黑暗森林法则（两公理 + 猜疑链 + 技术爆炸的逻辑推论）：
      宇宙如同黑暗森林，每个文明都是持枪的猎人。
      发现任何其他生命的位置，唯一安全的选择是消灭对方——
      因为猜疑链不可消除，技术爆炸不可预测。
      罗辑通过向宇宙广播一颗恒星的坐标验证了这一法则——
      该恒星果然被未知高级文明摧毁（行4310-4360）。
  physical:  # 故事机制层
    - >
      智子封锁：三体人以智子（质子级计算机）干扰地球所有粒子加速器，
      锁死人类基础物理学进展，同时实时监控地球上一切可见信息。
      唯一不可监控的领域是人类大脑内部的思维。（序章行68-120, 行1185-1190）
    - >
      冬眠技术：人类可以通过冬眠跨越数十至数百年的时间，
      身体不衰老，成为穿越世纪的叙事装置。（行1524, 行2805）
    - >
      可控核聚变：危机纪年约12-15年实现突破，
      能源不再稀缺，太空电梯和恒星级战舰由此成为可能。（行2300-2304）
    - >
      强互作用力材料：三体探测器"水滴"由强互作用力材料构成，
      表面绝对光滑、坚不可摧，人类武器对其无效。（行3799-3818）
    - >
      引力波广播与终极威慑：故事末期人类掌握引力波发射技术，
      可向宇宙广播坐标信息。根据黑暗森林法则，
      广播三体星和太阳系的坐标将导致双方被高级文明消灭——
      宇宙级的"相互确保毁灭"（MAD）。
      罗辑以自己的生命为威慑开关（心跳停止即触发广播），
      迫使三体文明撤回舰队。（行4630-4632）

  social:
    - >
      面壁计划制度：联合国授权四名面壁者拥有调动全球资源的权力，
      其战略意图无需向任何人解释——因为一旦解释就会被智子获知。
      面壁者的任何行为（包括拒绝、逃避）都可被解读为计划的一部分，
      因此该身份一旦授予便不可撤销。（行822-950）
    - >
      破壁计划：三体世界针对每位面壁者指定一名破壁人，
      负责推断和揭穿面壁者的真实战略。（行1022-1050）
    - >
      逃亡主义非法化：联合国117号决议将逃亡主义定为非法，
      因为"谁走谁留"触及人类基本价值观的陷阱。（行319-323, 行435）
    - >
      大低谷后的社会重建：经历全球人口从83亿降至35亿的灾难后，
      人类社会经历第二次启蒙运动和文艺复兴，
      婚姻家庭制度消亡，城市转入地下。（行2908, 行3325-3391）
    - >
      三大舰队独立：亚洲/欧洲/北美舰队发展为独立政治实体，
      与地球政府形成新的权力格局。（行3261-3299）

  psychological:
    - >
      思维透明 vs 思维不透明：三体人思维完全透明（"想"等于"说"），
      因此无法理解欺骗，这既是弱点也是恐惧之源。
      人类的思维不透明是唯一的战略优势。（行58-120）
    - >
      失败主义：知道物理学被锁死后，"人类必败"的信念蔓延，
      成为比三体舰队更先到达的心理武器。
      希恩斯的思想钢印将失败主义固化为不可逆的神经回路。（行2409-2560）
    - >
      猜疑链：两个文明（或个体）之间，由于无法确认对方是否善意，
      也无法确认对方是否确认自己是善意的，形成无限递归的猜疑。
      在星舰地球的黑暗战役中被微缩验证。（行4002-4191）
    - >
      恐日症：雷迪亚兹在研制超级核弹过程中产生对太阳的病理性恐惧，
      象征面壁者使命对人格的侵蚀。（行1279-1312）

genre_conventions:
  primary_genre: 硬科幻（Hard Science Fiction）
  secondary_genre: 哲学悬疑 / 太空歌剧
  conventions:
    - convention: 外星入侵叙事——强大外星文明威胁地球生存
      planned_subversion: >
        颠覆"人类团结抗敌"套路——人类内部的失败主义、逃亡主义、
        猜疑链比外敌更致命。水滴攻击用30分钟毁灭2000艘战舰，
        证明技术差距不可弥补，真正的武器是哲学洞见而非军事力量。

    - convention: 救世主英雄——被选中的人拯救世界
      planned_subversion: >
        罗辑是"最不可能的救世主"——浪荡的社会学讲师，
        前期沉溺于逃避和享乐，拒绝面壁者身份。
        他的拯救手段不是英雄行动而是思想实验（黑暗森林推导），
        最终以自杀式威胁（生命为开关）实现威慑。

    - convention: 太空战争——舰队对决的宏大战斗
      planned_subversion: >
        联合舰队2000艘战舰被一粒探测器30分钟全歼，
        彻底颠覆"公平对决"的太空战争幻想。
        水滴以"邮差路线"的几何之美执行毁灭，
        将太空战争的浪漫想象转化为对技术碾压的冷酷呈现。

    - convention: 时间跨度叙事——跨越世纪的文明史诗
      planned_subversion: >
        通过冬眠机制让主角"跳过"历史，以个人体验的即时性
        替代编年史的宏大叙事。200年的文明变迁被压缩为
        罗辑苏醒后的几天震惊体验（地下城市、飞行自行车、消失的婚姻）。

daily_life:
  - dimension: 危机时代的日常生活（上部/中部）
    findings:
      - detail: >
          粮票和定量卡重新出现，副食需要号票，
          工业券即将恢复——社会倒退至计划经济。（行2268-2279）
        story_implication: >
          战争准备对平民生活的直接冲击，折射出"给岁月以文明"
          与"给文明以岁月"的根本矛盾。
      - detail: >
          太空葬——骨灰通过太空电梯发射到第三宇宙速度，
          飞出太阳系。（行2288）
        story_implication: >
          逃亡主义渗透到死亡仪式中，成为普通人对末日的个人回应。

  - dimension: 未来世界的日常生活（下部）
    findings:
      - detail: >
          地下巨树城市——建在地下一千米的悬挂式建筑，
          地址格式为"×树×枝×叶"，天空为万米高空实时投影。（行2915-2933）
        story_implication: >
          战争恐惧塑造了文明形态——地下城市是对末日之战的建筑学回应。
      - detail: >
          飞行自行车——双旋翼个人飞行器，婚姻家庭制度已消亡。（行2906-2910）
        story_implication: >
          大低谷后的社会重建彻底重塑了人类生活方式，
          为罗辑的"过去只是一场梦"的心理冲击提供物质基础。

creative_constraints:
  - constraint: 智子的全面监控——除大脑内部思维外，一切信息对三体透明
    narrative_function: >
      这一限制直接催生了面壁计划的核心机制——
      只有在大脑中构思的战略才有意义。
      它迫使叙事聚焦于"内心"而非"行动"，
      创造出独特的"猜不到主角在想什么"的悬疑张力。

  - constraint: 物理学被锁死——人类无法在基础科学上取得突破
    narrative_function: >
      排除了"人类发明超级武器击败外星人"的常规出路，
      迫使故事转向哲学层面寻找解决方案。
      黑暗森林法则是社会学/博弈论的产物，不是物理学的产物。

  - constraint: 400年倒计时——三体舰队的固定到达时间
    narrative_function: >
      为所有决策提供不可改变的时间框架，
      冬眠成为唯一的"快进"手段，
      创造出"当代无法验证策略是否有效"的独特困境。
