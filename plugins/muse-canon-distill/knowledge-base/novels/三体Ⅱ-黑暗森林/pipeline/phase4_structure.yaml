# Phase 4: 结构（序列展开）— 《三体Ⅱ·黑暗森林》逆向分析
# 接收 Phase 3 的 arcs[] 框架，逐 Arc 展开为序列。
# 每个序列是一组递进的场景群，有核心冲突、递进方向和序列高潮。
#
# 全篇危机/高潮/结局 → 见 Phase 3 的 story_climax_design

# ═══════════════════════════════════════════
# 逐 Arc 展开为序列
# ═══════════════════════════════════════════

arc_expansions:
  - arc_id: ARC-1
    sequences:
      - seq_id: ARC1-SEQ1
        name: "公理传授与思维透明"
        core_conflict: "两条公理被播种但无人理解其意义；三体人发现人类能欺骗"
        escalation_direction: "从微观（蚂蚁/墓碑）递进到宏观（文明间的信息不对称）"
        sequence_climax: "三体人说'我害怕你们'——恐惧源于无法理解欺骗（行120）"
        closed: "三体与人类的根本差异被揭示"
        opened: "这种差异将如何被利用？（面壁计划的理论基础）"

      - seq_id: ARC1-SEQ2
        name: "面壁者任命与身份困境"
        core_conflict: "罗辑被赋予不可撤销的面壁者身份，他的一切行为都可被解读为战略"
        escalation_direction: "从公布仪式 → ETO狙击 → 凶手的微笑 → 萨伊的沉默"
        sequence_climax: "罗辑领悟面壁者本质——否认本身就是面壁（行946-950）"
        closed: "罗辑的自由身份"
        opened: "他将如何应对这座无形的牢笼？"

    arc_progression_note: "从思想种子（序章）到身份困境（上部前半），冲击力从0递增到8"

  - arc_id: ARC-2
    sequences:
      - seq_id: ARC2-SEQ1
        name: "破壁计划与面壁者困境"
        core_conflict: "ETO为每个面壁者指定破壁人，但罗辑的破壁人是他自己——因为无人知道他为何危险"
        escalation_direction: "从秦始皇册封 → 各面壁者各自推进战略 → 雷迪亚兹恐日症"
        sequence_climax: "'罗辑直接与主对决'——全书最大悬念确立（行1050）"
        closed: "对抗机制建立"
        opened: "四位面壁者各自的命运走向何方？"

      - seq_id: ARC2-SEQ2
        name: "庄颜爱情线"
        core_conflict: "罗辑用面壁权力追求个人幸福，但这幸福建立在末日阴影之上"
        escalation_direction: "从壁炉点燃（行1433）→ 雪山之行 → 卢浮宫对视"
        sequence_climax: "蒙娜丽莎前的对视——爱情确认，但罗辑知道这是借来的时间（行1700-1704）"
        closed: "罗辑从孤独者变成了有所牵挂的人"
        opened: "庄颜将成为逼迫他行动的杠杆"

      - seq_id: ARC2-SEQ3
        name: "三体舰队证实"
        core_conflict: "人类对三体入侵的最后一丝侥幸被粉碎"
        escalation_direction: "哈勃二号的'刷子'图像 → 天文学家当场痛哭"
        sequence_climax: "三体舰队尾迹被直接观测到（行1705-1759）"
        closed: "入侵不再是假设"
        opened: "面壁者的时间压力骤增"

    arc_progression_note: "三个序列平行推进（对抗/爱情/危机），在Arc末尾被舰队证实同时收紧"

  - arc_id: ARC-3
    sequences:
      - seq_id: ARC3-SEQ1
        name: "泰勒之死与庄颜被夺"
        core_conflict: "面壁计划的代价浮现——面壁者可以被破壁致死，面壁者的家人可以被用作人质"
        escalation_direction: "泰勒被破壁自杀（行1837-1874）→ PDC强制冬眠庄颜（行1875-1980）"
        sequence_climax: "萨伊揭露三体刺杀令——罗辑首次听到内心的'面壁者'声音"
        closed: "罗辑的逃避之路"
        opened: "失去一切后，他将如何面对使命？"

      - seq_id: ARC3-SEQ2
        name: "冰湖顿悟与咒语"
        core_conflict: "罗辑独自在冰雪中求索叶文洁公理的完整含义"
        escalation_direction: "长期思考无果 → 冰面行走 → 冰面破裂跌入冰水 → 极寒中顿悟"
        sequence_climax: "'面壁者罗辑，我是你的破壁人'——自我破壁宣言（行2074）"
        closed: "两条公理悬而未解的状态"
        opened: "黑暗森林法则已知，但如何运用？→ 以太阳为天线发射咒语"

    arc_progression_note: "从被动失去（泰勒死/庄颜冬眠）到主动觉醒（冰湖顿悟），痛苦催化思想突破"

  - arc_id: ARC-4
    sequences:
      - seq_id: ARC4-SEQ1
        name: "章北海的暗杀"
        core_conflict: "人类太空技术路线之争——工质推进 vs 辐射驱动"
        escalation_direction: "购买陨石 → 制造陨石子弹 → 太空等待 → 狙击 → 常伟思的疑惑"
        sequence_climax: "三名航天界高层被射杀，ETO评议'最危险的胜利主义者'（行2385-2397）"
        closed: "技术路线争议——辐射驱动路线胜出"
        opened: "章北海的真实身份何时暴露？"

      - seq_id: ARC4-SEQ2
        name: "思想钢印与雷迪亚兹之死"
        core_conflict: "面壁者们各自走向极端——改造信念结构 vs 同归于尽"
        escalation_direction: "希恩斯发明思想钢印 → 山杉惠子最后的惊惧 → 雷迪亚兹被破壁被砸死"
        sequence_climax: "雷迪亚兹在阳光下高喊'我的太阳！'，被自己的人民用石头砸死（行2716-2800）"
        closed: "黄金时代——所有关键人物进入冬眠"
        opened: "200年后的交汇将带来什么？"

    arc_progression_note: "过渡Arc——章北海暗中行动为Arc5做物质准备，雷迪亚兹之死为面壁计划做精神收束"

  - arc_id: ARC-5
    sequences:
      - seq_id: ARC5-SEQ1
        name: "苏醒与新世界"
        core_conflict: "罗辑和章北海在200年后的繁荣世界中分别重新定位自己"
        escalation_direction: "罗辑苏醒初见地下北京 → 面壁计划被废除 → 山杉惠子破壁希恩斯"
        sequence_climax: "思想钢印正负号反转的真相揭露——'必胜'变'必败'（行3005-3049）"
        closed: "面壁计划正式终结——四位面壁者的使命全部结束或失败"
        opened: "人类自以为已胜利，但水滴正在接近"

      - seq_id: ARC5-SEQ2
        name: "章北海叛逃"
        core_conflict: "章北海两百年隐忍的爆发——他在纪律与使命之间做出最终选择"
        escalation_direction: "被任命执行舰长 → 十分钟完成全舰控制 → 强制叛逃"
        sequence_climax: "'一个尽责任的军人，为人类的生存而战'（行3521）"
        closed: "章北海的面具——两百年的伪装揭晓"
        opened: "逃亡的飞船能走多远？联合舰队倾巢出动拦截水滴"

      - seq_id: ARC5-SEQ3
        name: "水滴攻击"
        core_conflict: "人类自信 vs 三体技术的绝对碾压"
        escalation_direction: "丁仪发现强互作用力 → '毁灭你，与你何干' → 水滴启动 → 30分钟全歼"
        sequence_climax: "联合舰队2000艘战舰全军覆没，百万人死亡（行3819-3914）"
        closed: "人类的太空军事力量"
        opened: "逃亡的五艘飞船将面临什么？"

      - seq_id: ARC5-SEQ4
        name: "黑暗战役"
        core_conflict: "猜疑链从宇宙理论降格为人类内部的残酷实践"
        escalation_direction: "五舰面临燃料死局 → 眼神中的无声推演 → 各舰锁定武器"
        sequence_climax: "章北海完成锁定但犹豫了几秒，被'终极规律'号抢先击杀（行4170）"
        closed: "章北海副线脊椎——'心中最后的柔软杀了他'"
        opened: "'蓝色空间'号飞向深空；罗辑从中领悟猜疑链的真实性"

    arc_progression_note: >
      四个序列形成密集的高潮链：苏醒→叛逃→水滴→黑暗战役，
      冲击力从8→9→10→10，是全书最密集的毁灭段落

  - arc_id: ARC-6
    sequences:
      - seq_id: ARC6-SEQ1
        name: "黑暗森林理论完成"
        core_conflict: "罗辑已知真相但太阳被封锁，无法再次发射咒语"
        escalation_direction: "咒语证实生效 → 完整推导猜疑链+技术爆炸 → 被社区驱逐"
        sequence_climax: "两根烟头——罗辑向史强完整阐述黑暗森林法则（行4380-4435）"
        closed: "理论体系的最后一环（猜疑链验证）"
        opened: "理论已完成，但实施手段在哪？"

      - seq_id: ARC6-SEQ2
        name: "墓地对峙"
        core_conflict: "一个被抛弃的个体 vs 一个文明——终极不对称对决"
        escalation_direction: "被驱逐 → 雨夜独行 → 挖墓 → 以生命连接核弹 → 智子出现"
        sequence_climax: "三体妥协：停止封锁太阳、水滴撤离、舰队转向（行4594）"
        closed: "面壁使命——在叶文洁墓前（首尾呼应）完成"
        opened: "威慑和平能持续多久？"

      - seq_id: ARC6-SEQ3
        name: "引力波天线下的重聚"
        core_conflict: "表面无冲突——但三体监听员引出爱能否超越黑暗森林法则的问题"
        escalation_direction: "家庭重聚 → 引力波天线 → 监听员出现 → 爱的讨论"
        sequence_climax: "'当然不害怕，她知道明天太阳还会升起来的'（行4657）"
        closed: "全书——以低张力的诗意余韵收束"
        opened: "《三体III》的伏笔——威慑平衡随时可能崩塌"

    arc_progression_note: "从理论完成→孤独行动→诗意余韵，张力先升至10再降至2"

# ═══════════════════════════════════════════
# 序列级因果链
# ═══════════════════════════════════════════

causal_chain: >
  ARC1-SEQ1（公理传授）→（因此三体下令刺杀）→
  ARC1-SEQ2（面壁者任命）→（因此ETO启动破壁）→
  ARC2-SEQ1（破壁计划）→（罗辑逃避中）→
  ARC2-SEQ2（爱情确立）→（三体舰队被证实）→
  ARC2-SEQ3（侥幸心理熄灭）→（泰勒被破壁后自杀）→
  ARC3-SEQ1（庄颜被夺）→（失去一切后被迫思考）→
  ARC3-SEQ2（冰湖顿悟+咒语）→（章北海暗杀改变技术路线）→
  ARC4-SEQ1（辐射驱动路线胜出）→（面壁者陆续陨落）→
  ARC4-SEQ2（雷迪亚兹死/所有人冬眠）→ [200年时间断裂] →
  ARC5-SEQ1（面壁计划废除）→（章北海利用执行舰长权限）→
  ARC5-SEQ2（劫持叛逃）→（联合舰队出动拦截水滴）→
  ARC5-SEQ3（水滴全歼舰队）→（逃亡舰队陷入猜疑链）→
  ARC5-SEQ4（黑暗战役/章北海死）→（罗辑从中领悟猜疑链真实性）→
  ARC6-SEQ1（咒语证实+理论完成）→（被驱逐后独赴墓地）→
  ARC6-SEQ2（墓地威慑/三体妥协）→（五年后）→
  ARC6-SEQ3（引力波天线重聚/"明天太阳还会升起来的"）

# ═══════════════════════════════════════════
# 全篇递进关系
# ═══════════════════════════════════════════

arc_progression:
  impact_escalation: >
    ARC-1（个人身份改变）→ ARC-2（存在危机确认）→
    ARC-3（思想突破但代价惨重）→ ARC-4（多面壁者陨落，历史暂停）→
    ARC-5（全面覆灭——太空力量毁灭 + 猜疑链验证）→
    ARC-6（一人对抗一个文明的终极对决）。
    冲击力严格递增：个人 → 面壁者群体 → 全人类军事力量 → 文明存亡。
  causal_chain: >
    叶文洁传授公理(ARC-1) → 逃避中获得爱情但舰队被证实(ARC-2) →
    失去庄颜后顿悟并发射咒语(ARC-3) → 章北海暗杀/面壁者陨落(ARC-4) →
    水滴全歼舰队/黑暗战役(ARC-5) → 罗辑以生命为开关建立威慑(ARC-6)

# ═══════════════════════════════════════════
# 多线叙事
# ═══════════════════════════════════════════

narrative_threads:
  - name: "罗辑线（主线）"
    description: "从浪荡讲师到面壁者到地球文明最终守护者"
    primary_arcs: [ARC-1, ARC-2, ARC-3, ARC-6]

  - name: "章北海线（副主线）"
    description: "两百年隐忍的逃亡主义者——与罗辑线形成镜像对照"
    primary_arcs: [ARC-1, ARC-4, ARC-5]

  - name: "面壁者/破壁者线"
    description: "泰勒、雷迪亚兹、希恩斯三位面壁者各自的战略推进和被破壁过程"
    primary_arcs: [ARC-2, ARC-3, ARC-4, ARC-5]

  - name: "平民生活线"
    description: "张援朝/杨晋文/苗福全三位退休老人折射危机时代的社会变迁"
    presence: "间歇——上部(行172-199)、中部(行2265-2299)、下部(行3325-3391)"

  - name: "天文观测线"
    description: "林格-斐兹罗的哈勃二号持续追踪三体舰队和探测器"
    presence: "间歇——上部末、中部初、下部中（水滴接触前）"

  - name: "三体/ETO暗线"
    description: "智子与ETO的交流、破壁计划推进，始终作为不可见的对抗背景"
    presence: "贯穿全书——通过智子字幕和破壁人行动间接呈现"
