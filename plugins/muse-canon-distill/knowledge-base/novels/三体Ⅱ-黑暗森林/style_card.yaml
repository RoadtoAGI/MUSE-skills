novel: 三体Ⅱ-黑暗森林
author: 刘慈欣
lang: zh
translator: ''
narration_voice: 全知多线轮转（罗辑/章北海/舰队），重场面退为字幕体·笔录体·通话记录等准文档语态；抒情段深贴罗辑直抒
diction: 白话为骨，舰队军政术语与天文参数精确入文；格言式短句承担思想重量，浪漫段落转抒情书面语成双色
rhetoric_density: medium
dialogue_mode: 苏格拉底式问答推演理论（罗辑对大史），格言对答塑军人（章北海）；字幕对人声的剧本体写跨文明交流
pacing: 长线铺陈蓄势数章，爆点一令一句释放（前进四/点名罗辑）；屠戮与奇观慢摇细写，高潮后以童真或冷句轻收
signature_moves:
- 字幕体跨文明对话：智子字幕对人声独白，文体差即文明差，谈判如对弈逐条落子
- 审美麻痹再屠戮：先用唯美意象写敌方造物（水滴如圣母泪），再无过渡直切毁灭，落差即恐怖
- 格言式军人对答：用「没有永恒的敌人只有永恒的责任」类短句立人，沉默与三字答承载万字心声
- 公理推演戏剧化：把理论推导写成黑暗中两点烟火的问答现场，让读者与提问者同步抵达结论
- 微观视角开闭环：以蚂蚁爬碑这类极小生命旁观文明级事件，首尾呼应制造宇宙尺度反讽
anti_signature:
- 把军人写成口号式热血——本作军人靠克制、沉默与责任逻辑立住，不喊口号
- 理论阐述写成作者旁白灌输——本作推演必有现场、道具与对话者
- 浪漫线写成甜宠日常——本作爱情自带虚构与幻境质地，始终与使命撕扯
author_cross_ref: 与前作同享问答释设定、奇观慢摇、冷句收束；本作语态更多线，新增字幕体跨文明对话与格言式军人形象，浪漫抒情比重显著加大
style_card_by: claude-fable-5
