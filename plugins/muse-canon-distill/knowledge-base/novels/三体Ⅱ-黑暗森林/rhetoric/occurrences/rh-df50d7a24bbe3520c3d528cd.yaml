figure_type: simile
quote: 像是一个橡胶面具似的
sensory_mapping: 光滑橡胶、固定五官、遮覆、无肌肉变化
context_fact: 罗辑询问是否有人能强制他，史强只按命令回答，脸上没有任何表情。
image_mechanism: 活的面部肌肉被一层弹性却不动的假脸封住，罗辑的目光只能撞在表面。
property_alignment: 1）史强面孔对应面具；2）职业克制对应定型材质；3）真实态度对应被遮真脸；4）不可解读对应表面无变化。
context_alignment: 史强平时有调侃傻笑，此刻突变为制度执行者；橡胶的人工僵硬使这种角色切换格外可见。
narrative_function: 切断罗辑从熟人处获取答案的途径，强化所有人都无法替他解除身份的孤立。
transfer_rule: 面具写克制时，要有可对照的常态表情，并区分外层固定表现与被遮蔽的内在态度。
failure_boundary: 无表情不等于虚伪，史强可能只是在守令；面具意象不能证明他另有敌意。
