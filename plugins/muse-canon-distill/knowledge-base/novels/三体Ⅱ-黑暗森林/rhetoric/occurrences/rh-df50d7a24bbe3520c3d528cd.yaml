tenor: 史强面对罗辑追问时毫无可读情绪的脸
vehicle: 表面平整、形状固定且遮住真人表情的橡胶面具
ground: 1）面部无表情对应面具定型；2）内心不可读对应遮住真脸；3）安保职业控制对应人工材质；4）回答机械对应面具僵硬。
