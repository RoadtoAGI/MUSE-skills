chapter: 正文
figure_type: simile
quote: 孩子看到后说它像一位巨人爷爷的白头发
sensory_mapping: 云洞在孩子眼里变成巨人头顶，白云是一蓬被风掀起又长回来的老人银发
context_fact: 孩子从天线旁观看波束云区，以自己的生活想象为异常天象命名。
image_mechanism: 宏大时空奇观被儿童身体尺度重新人格化，云的颜色、纹理和风动先构成头发，再反推出看不见的巨人。
property_alignment: 1）云白对应银发；2）纤维云边对应发丝；3）风场对应梳动；4）天幕对应巨型头颅。
context_alignment: 上一喻体是成人科幻的时空洞，孩子立即改用爷爷白发，使结尾技术景观进入家庭语言。
narrative_function: 降低威慑设施的冷硬感，展示下一代能把宇宙技术当作日常、温和的想象对象。
transfer_rule: 儿童喻体应从颜色、纹理和动作出发，再用熟悉亲属形象缩放陌生尺度，保持口语直观。
failure_boundary: 云没有毛发结构或隐藏巨人；若缺少白色丝状边缘和风动，爷爷白发只剩童趣称呼。
