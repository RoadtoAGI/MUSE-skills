quote: 看上去像是一盘以恒星为中心的正在松开的发条
sensory_mapping: 中心亮星、螺带盘绕、圈层外张、发条缓释
context_fact: 275E1的行星坠落击穿恒星外壳，内部物质从固定点喷出，又被恒星自转拖成向外扩展的螺旋。
image_mechanism: 高速等离子体被压成一条有宽度的机械钢带，自转负责卷绕，持续外射负责松展，二维轮廓与生成过程同时可见。
property_alignment: 1）恒星对应发条轴心；2）射流对应金属条；3）自转对应盘绕动作；4）喷流扩张对应弹簧释放；5）螺旋半径对应松开圈径。
context_alignment: 观测只能见到螺旋形云，发条不仅复刻外形，还解释中心固定、外圈扩张和时间方向，直接成为后续毁灭链条的预测模型。
narrative_function: 把天文奇观转为可操作机械图，让破壁人据此演算太阳螺旋大气层如何扫过各行星轨道。
transfer_rule: 以发条描述扩张螺旋时，应同时对齐轴心、卷绕成因、连续带体和半径随时间增长，而非只取螺旋轮廓。
failure_boundary: 发条靠弹性势能回弹且带体长度固定，恒星物质流由喷射和自转形成并持续增质；不能据此套用机械速度规律。
quality_assessment: exemplary
