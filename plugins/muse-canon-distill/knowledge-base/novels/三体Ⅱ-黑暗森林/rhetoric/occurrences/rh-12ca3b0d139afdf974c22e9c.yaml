review_status: reviewed
tenor: 行星坠入275E1后，恒星喷出的物质因自转形成并持续向外扩展的螺旋流
vehicle: 以中心轴固定、紧密盘卷后逐圈松脱并向外张开的机械发条
ground: 1）恒星对应发条中心轴；2）螺旋物质流对应盘卷钢带；3）恒星自转对应发条绕轴；4）半径持续增大对应逐圈松开；5）连续喷流对应不断延长的带体。
