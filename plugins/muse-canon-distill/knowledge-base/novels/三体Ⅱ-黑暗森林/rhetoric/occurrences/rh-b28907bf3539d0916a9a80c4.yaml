tenor: 周文王的呼喊在空旷三体荒漠中迅速消散且无人回应
vehicle: 巨大荒漠张口吞下声音，使其不再存在
ground: 1）声波扩散变弱对应被吞下；2）荒漠无边对应吞噬者体量巨大；3）无人回应对应声音进入后没有返回。
