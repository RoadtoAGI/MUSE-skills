chapter: 正文
figure_type: metaphor
quote: 周文王的声音立刻被这无边的荒漠吞没了
sensory_mapping: 听觉、空间尺度、吞咽动作
context_fact: 虚拟世界空无一人，周文王多次高喊“有人吗”，随后疲惫坐下。
image_mechanism: 给空无一物的荒漠一个吸收动作，呼喊从人物口中发出便消失在巨大空间腹中，寂静因而具有主动压制力。
property_alignment: 1）声音衰减对应吞没；2）无边空间对应巨大吞噬容量；3）没有回声或回答对应被吞后不返。
context_alignment: 前句网络角落刚让三体世界“复活”，内部却仍无人；吞声荒漠把组织失散后的孤独落实在听觉上。
narrative_function: 强化虚拟世界的死寂，并为周文王等待同志出现制造空场张力。
transfer_rule: 用吞噬动作写声音消失时，应同时给出传播空间、衰减速度和回应缺席，使环境像有体量地吸收声源。
failure_boundary: 有强回声、近距离听众或声音持续放大时不能称被吞没；该比喻不表示荒漠具有真实意志。
quality_assessment: effective
