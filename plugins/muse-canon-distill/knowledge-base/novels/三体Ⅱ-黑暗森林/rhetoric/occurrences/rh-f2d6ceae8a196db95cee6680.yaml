chapter: 正文
figure_type: simile
quote: 金鱼在阳光下像一片流动的火焰
sensory_mapping: 色彩、流动、光线
context_fact: 女孩在集市金鱼摊前停留，罗辑给她买了两条。
image_mechanism: 水中冷生物被颜色和运动改写为火，鳍尾接力成摇曳亮面。
property_alignment: 1）金红鱼体对应焰色；2）游姿对应火舌；3）群体对应一团火；4）折射对应火星。
context_alignment: 火焰是二人关系核心意象，金鱼让火获得可携带的生命形态。
narrative_function: 为漫游插入鲜亮焦点并延续火焰意象链。
transfer_rule: 用火比拟群动，应匹配色温、局部摆动、整体聚散和光泽。
failure_boundary: 色暗静止或单鱼难成一片火；不承载真实温度。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 圆鱼缸中成群游动、被阳光照亮的红金鱼
vehicle: 在透明空间不断变形、连成一片的火焰
ground: 1）鱼体金红对应火色；2）摆尾对应火舌；3）聚散对应焰面变化；4）水缸折光对应闪烁。
