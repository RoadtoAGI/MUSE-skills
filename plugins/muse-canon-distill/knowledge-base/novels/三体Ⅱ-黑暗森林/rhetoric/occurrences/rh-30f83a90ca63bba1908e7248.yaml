context_fact: 秘书长突然宣布罗辑成为第四位面壁者，他在寂静会场中被催促起身，独自走向主席台。
image_mechanism: 成年学者的社会身份瞬间剥落，身体在短短过道上缩回童年尺寸，每一步都等待一只没有出现的手。
property_alignment: 1）认知失控对应儿童无知；2）求助冲动对应伸手；3）无人解释对应无人牵引；4）众目压力对应陌生成人世界。
context_alignment: 任命把宇宙命运直接压给毫无准备的人，心理退行比抽象“害怕”更贴近突发失控；会场的实际步行又支撑儿童行路图景。
narrative_function: 削去面壁者头衔的英雄光环，让罗辑首次登台呈现为被遗弃者。
transfer_rule: 写成人在权力冲击下退行，可选一个具体童年动作，并让当前空间与该动作共享路线、旁观者和缺失的援手。
failure_boundary: 罗辑仍有成年判断力，童年只描述瞬时感受；持续把他儿童化会抹去其主动选择与责任。
