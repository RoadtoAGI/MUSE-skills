figure_type: simile
quote: 这景象看上去像一幅描绘圣人的古典油画
sensory_mapping: 暗底画布、白须圣人、弱金镀光、静态构图
context_fact: 泰勒进入山洞会见长期追捕的老人，病床尽头几乎所有物体皆白，灯光微弱偏金。
image_mechanism: 山洞尽头被矩形构图框住，真实人物停止为画中模特；暗部吞掉杂物，只留下白与金组织成圣像。
property_alignment: 1）老人对应圣人；2）病床区域对应画布；3）白色物件对应圣洁服饰；4）弱金灯对应古典画光。
context_alignment: 泰勒视老人为敌，却被现场视觉强迫产生圣人联想，紧接自我咒骂，形成政治判断与审美感受冲突。
narrative_function: 制造敌人被神圣化的瞬间并暴露泰勒认知裂缝，为双方讽刺对话定调。
transfer_rule: 画作类比应明确构图、色域、光法和人物姿态，并让观看者对该图像产生有意义的情感冲突。
failure_boundary: 视觉像圣像不证明老人道德神圣；若去掉白色和侧暗金光，该画种判断便难成立。
quality_assessment: exemplary
