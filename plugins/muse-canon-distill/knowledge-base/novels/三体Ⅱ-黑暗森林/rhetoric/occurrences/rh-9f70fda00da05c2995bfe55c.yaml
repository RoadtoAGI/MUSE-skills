chapter: 正文
figure_type: simile
quote: 空间在瞬间如水晶般透明
sensory_mapping: 透明晶体、无杂质、星光穿透、冷亮折射
context_fact: 地球焰火熄灭后，周围只剩宇宙和星辰，星光随即织成巨毯。
image_mechanism: 无形真空突然凝成一整块透明晶体，星光穿透其内部，让本来不可见的空间自身显出清澈质地。
property_alignment: 1）宇宙空间对应水晶；2）无遮挡对应透明；3）星光传播对应透光；4）晶莹视觉对应折射亮面。
context_alignment: 地球碎片被清空后，透明意象准确承接视野骤然开放，并为星辰的晶莹材质统一色调。
narrative_function: 在地球毁灭与群星聚拢之间清空舞台，将幻视尺度推向宇宙。
transfer_rule: 把空间写成透明材质时，应先移除遮挡，再让光线穿透或折射显示这种材质。
failure_boundary: 真空不是水晶实体，也无固定折射面；尘埃密集或视野昏暗时，晶体透明感不成立。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 地球幻象熄灭后宇宙空间显得无遮挡、清澈且可见全部星辰的状态
vehicle: 内部无杂质、让光线透过并折出晶亮光泽的水晶
ground: 1）无遮挡对应水晶透明；2）星光清晰对应晶体透光；3）空间瞬间净化对应杂质消失；4）晶莹光芒对应水晶闪面。
