figure_type: simile
quote: 像一出没有任何逻辑的后现代戏剧
sensory_mapping: 舞台、空椅、演员走位、断裂情节
context_fact: 罗辑被公开任命又获准辞职，独自穿过散会后的成排空椅，仍毫无解脱。
image_mechanism: 会场直接换成剧场，官员和安保成为按未知剧本走位的演员，罗辑既在台上又无法读懂剧本。
property_alignment: 1）大会事件对应戏；2）制度规则对应隐藏剧本；3）人物行动对应表演；4）因果断裂对应后现代结构。
context_alignment: 真实空间本就是大会表演场，空座与独行强化落幕后舞台感；罗辑的职业与经验都无法提供解释。
narrative_function: 把读者与罗辑共同置于不可解释状态，为随后揭示“所有行为都算计划”的悖论准备认知落差。
transfer_rule: 以戏剧写现实失真，可对齐场所、角色、剧本知识和因果规则，并明确谁被迫演出、谁在观看。
failure_boundary: 现实事件有严密的面壁逻辑，只是罗辑尚未知；“没有逻辑”是当下感受，不能当作制度真的随机。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 罗辑经历突然任命、轻易辞去后感到的荒诞不真实现实
vehicle: 人物行为失去因果、场面拒绝常规解释的后现代舞台剧
ground: 1）事件转折无可理解因果对应戏剧情节反逻辑；2）众人角色化举止对应演员表演；3）大会厅与主席台对应舞台；4）罗辑的疏离感对应观众不信舞台为现实。
