context_fact: 全球打击后ETO分支相互孤立，周文王向牛顿保证三体游戏聚会处难被发现和追踪。
image_mechanism: 将安全架构竖向叠成层层下潜的道路，访问者越深入越远离公开入口，追踪者则在岔路中失去方向。
property_alignment: 1）匿名层级对应迷宫层数；2）隐蔽入口对应难找通道；3）反追踪对应无法原路定位；4）底部聚会对应最深安全室。
context_alignment: 前文已写“角落中的角落”，此处把隐蔽空间转成可防守路线；角色正讨论组织安全，喻体承担实际风险判断。
narrative_function: 解释残余ETO为何敢重新聚会，也为其“绝对安全”的自信保留可能被攻破的反讽。
transfer_rule: 用迷宫写网络安全时，应对应访问层级、入口发现、追踪回溯和核心位置，而非把所有复杂系统笼统称迷宫。
failure_boundary: 数字路径可复制、搜索和旁路进入，并无物理唯一通道；迷宫不能证明系统绝对安全。
