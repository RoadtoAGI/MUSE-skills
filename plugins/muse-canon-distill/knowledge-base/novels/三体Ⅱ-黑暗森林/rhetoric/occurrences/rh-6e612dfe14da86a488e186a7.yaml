quote: 其他服务员也都是这种天仙般的形象
sensory_mapping: 无瑕面容、轻盈身姿、席间袅袅穿行、凡俗餐厅骤现仙女群
context_fact: 罗辑第一次看到餐厅机器人，把它们误认为真人，并因所有服务员同样完美而感到不真实。
image_mechanism: 工业复制的审美外壳被抬到神话层，超出常人分布的整齐美感通过‘非人间’直觉显形。
property_alignment: 1）机器人服务员对应天仙；2）程序化外貌对应无瑕仙姿；3）固定路线移动对应飘行；4）柔声服务对应仙音；5）批量同貌对应仙女群；6）罗辑惊艳对应凡人仰视。
context_alignment: 喻体先赞美后揭示‘假的’，天仙本就不是凡人，因而自然过渡到服务员实际上是机器的真相。
narrative_function: 先以视觉诱惑遮住技术迟钝，再让持刀袭击把完美外表与机械危险猛烈反转。
transfer_rule: 非人完美写成仙姿时，应让无瑕程度、运动方式和观察者距离共同支持，并准备解释这种完美为何脱离真实人群。
failure_boundary: 机器人没有神性、自由意志或超自然能力，外形美也不代表智能、善意和动作可靠。
