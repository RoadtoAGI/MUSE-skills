tenor: 餐厅机器服务员的相貌、身材、动作与声音都经过理想化设计，美得统一而缺少真实人的瑕疵
vehicle: 神话中远离尘世、容貌无瑕、体态轻盈且带超凡气质的天上仙女
ground: 1）机器美女对应天仙；2）无瑕容貌对应神仙美貌；3）袅袅行走对应仙女飘行；4）不真实感对应非凡人；5）统一设计对应同类仙众；6）柔美声音对应仙乐气质。
