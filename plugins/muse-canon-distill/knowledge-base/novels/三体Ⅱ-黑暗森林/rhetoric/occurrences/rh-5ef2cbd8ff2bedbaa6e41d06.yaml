review_status: reviewed
tenor: 罗辑在墓碑前发出的叹息声在蚂蚁尺度中的感受
vehicle: 一阵穿过草丛、推动空气的风
ground: 1）人声气流相对蚂蚁强大对应阵风；2）声音穿越低矮植被对应风穿草丛；3）叹息持续而低缓对应一股掠过的气流。
