chapter: 正文
figure_type: simile
quote: 他发出穿过草丛的阵风那样的空气流动的声音，那是叹息
sensory_mapping: 听觉、气流触觉、尺度
context_fact: 罗辑蹲在杨冬墓碑前说话并叹息，褐蚁正在碑面沟槽中爬行。
image_mechanism: 取消人类语言意义，只保留小动物能承受的空气振动；一句叹息因此从声音放大为掠过身体与草叶的天气。
property_alignment: 1）声带推动空气对应风的气流；2）低沉延长的叹声对应阵风掠行；3）人蚁体量差对应微小生物感到的风力。
context_alignment: 叙述牢牢停在蚂蚁认知边界内，它听不懂内容却能感到气流；紧接“那是叹息”又把读者拉回人类情绪。
narrative_function: 把同一时刻拆成蚂蚁的物理经验与罗辑的哀伤意义，强化两种尺度互不相通。
transfer_rule: 写跨物种感知时，可把交流内容还原为声压、气流、亮度等物理量，再用对象熟悉的自然现象标定强度。
failure_boundary: 耳语距离远、没有可感气流时不宜写成阵风；该比喻描述蚂蚁体验，不能据此判断罗辑实际音量很大。
quality_assessment: exemplary
