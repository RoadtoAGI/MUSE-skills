chapter: 正文
figure_type: simile
quote: 在偶尔的目光相遇时，会像触电似的立刻把视线移开
sensory_mapping: 两束阴沉目光短暂碰上、无形电流骤穿神经、双方视线立即弹开
context_fact: 中校以上人员逐渐沉默、目光阴沉，且都避免别人注意自己的心理失衡。
image_mechanism: 社会性羞耻和互相识破的恐惧被转换为瞬时电刺激，对视从交流变成疼痛接触。
property_alignment: 1）眼神相交对应导体接触；2）羞耻警觉对应电流；3）视线撤离对应断开回路；4）本能动作对应反射。
context_alignment: 群体心理危机正通过互相观察扩散，触电意象表现每个人既渴望联系又畏惧暴露。
narrative_function: 以微动作显出高层之间信任断裂，给蓝西的群体症候判断提供可观察证据。
transfer_rule: 社交接触作触电时，应写明接触点、瞬间刺激、撤离反射和持续回避，突出身体先于语言。
failure_boundary: 对视没有真实电流或组织损伤，移目也可能出于礼貌、疲劳等原因，需结合群体语境判断。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 高层军官害怕他人从眼神看出自己的心理阴霾，一旦对视便本能、快速地避开
vehicle: 身体意外接触电流会瞬间抽动并脱离带电物，反应快于思考且伴随痛感和恐惧
ground: 1）目光接触对应触电；2）暴露内心对应电击；3）移开视线对应缩手；4）反应迅速对应神经反射；5）畏惧对视对应怕再次通电。
