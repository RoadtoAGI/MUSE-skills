chapter: 正文
figure_type: simile
quote: 舰队传出的浩如烟海的巨量信息
sensory_mapping: 记录堆成无岸海面、数据烟雾遮住线索、两名军官的通话像细点浮出
context_fact: 后世分析舰队传出的全部信息，确认两名低级军官最早从可见光数据接近真相。
image_mechanism: 常用数量成语把无形数据赋予广度与遮蔽性，强调真相并非缺席而是淹没在体量中。
property_alignment: 1）数据条目对应水滴/烟粒；2）总量对应海域；3）噪声对应烟雾；4）关键通话对应海中小目标。
context_alignment: 紧邻前句的信息潮水，成语继续水域尺度但语义较常规，主要承担数量说明。
narrative_function: 衬托低级军官独立判断的稀有，并说明指挥层为何没及时捕获正确分析。
transfer_rule: 资料作烟海时，宜给出被遮蔽的具体线索和检索动作，否则只剩泛化的‘很多’。
failure_boundary: 数字资料可索引、复制和精确过滤，不具真实烟雾或海水的物理阻隔。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 舰队在毁灭过程中传出的战场记录数量极大、来源繁杂，后人必须从中检索最早正确判断
vehicle: 烟雾弥漫无边、海水广阔难尽，观察者面对覆盖视野的巨大体量难以逐项辨清
ground: 1）信息量对应海量；2）资料纷杂对应烟霭；3）检索困难对应海中寻物；4）覆盖战场对应无边视野。
