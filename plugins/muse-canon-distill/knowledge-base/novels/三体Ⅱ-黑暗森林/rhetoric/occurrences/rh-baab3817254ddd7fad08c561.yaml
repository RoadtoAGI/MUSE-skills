figure_type: simile
quote: 洁净得像是电脑中的三维动画
sensory_mapping: 长廊无尘、表面光滑、光照匀净、现实似渲染
context_fact: 走廊墙壁自发光并智能调亮，地面生成发光波纹，行人与自动病床在其中无声移动。
image_mechanism: 现实空间被抽掉日常磨损和脏乱，只剩算法般纯净的几何体与光效，洁净程度反而让实体显得不真实。
property_alignment: 1）医院走廊对应三维场景；2）墙地表面对应数字材质；3）智能光线对应渲染；4）无污痕对应理想模型；5）行进视角对应虚拟漫游。
context_alignment: 周围已有响应式显示与动态特效，电脑动画不仅比颜色洁白，更概括其无瑕、平滑和轻微失真感。
narrative_function: 让未来的舒适与陌生同时出现，并提示罗辑仍需反复确认眼前世界真实。
transfer_rule: 把现实洁净写成数字画面时，应给出无瑕材质、规则光效和真实感降低三层对应，避免仅以‘高科技’替代观察。
failure_boundary: 走廊有真实物质、触感和人员活动，电脑动画没有卫生维护成本；相似不证明环境虚拟。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 未来医院走廊表面毫无污渍、杂物和材质瑕疵，整体呈现过度整齐光滑的观感
vehicle: 电脑生成的三维场景中由纯净表面、规则光照和无随机污痕构成的虚拟空间
ground: 1）无尘表面对应无纹理污点；2）空间规整对应建模场景；3）光线均匀对应渲染光照；4）发光波纹对应数字特效；5）真实感减弱对应虚拟画面。
