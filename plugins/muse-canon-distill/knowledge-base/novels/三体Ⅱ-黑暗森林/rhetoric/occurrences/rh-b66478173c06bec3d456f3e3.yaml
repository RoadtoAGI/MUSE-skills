tenor: 宇宙文明可能在几十亿年前便从无到有地出现，并开始后续成长与扩张
vehicle: 种子在适宜环境中破开外壳长出幼芽，早期形体微小，随后可持续生长并占据空间
ground: 1）文明起源对应种子萌发；2）适居星球对应土壤；3）早期文明对应幼芽；4）技术发展对应生长；5）星际扩张对应植株蔓延。
