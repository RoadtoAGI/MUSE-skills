quote: 文明很可能几十亿年前就在宇宙中萌发了
sensory_mapping: 古老星球像土壤裂开，文明嫩芽在几十亿年前探出，随后枝蔓延向更多恒星
context_fact: 罗辑援引希恩斯关于古老文明的说法，推断漫长时间已足以让宇宙资源被大量占用。
image_mechanism: 文明出现由抽象时间点转成可见破土过程，微小起始与后续扩张被放在同一生命序列。
property_alignment: 1）生命条件对应萌发环境；2）文明诞生对应破土；3）长期发展对应生长；4）扩张范围对应根枝延伸。
context_alignment: 前句把人类和三体称为婴儿文明，植物萌发继续生命词场，用古老生长解释今天资源压力。
narrative_function: 把生存死局的起点推回几十亿年前，使看似空旷的当下宇宙承载久远占用史。
transfer_rule: 文明作萌芽时，应写明种子条件、萌发时点、成长时间和扩张结果，让起源意象服务时间推理。
failure_boundary: 文明产生不是单一植物的自然生长，可能反复兴亡；‘萌发’不能证明早期文明一直存活至今。
quality_assessment: conventional
