chapter: 正文
figure_type: metaphor
quote: 他的情绪飞快地跌到了谷底
sensory_mapping: 罗辑的兴奋从高处失足、沿陡坡急坠、重重落进情绪谷底、抬头看不见出口
context_fact: 他喊出自己掌握胜利钥匙后，大史问下一步做什么，他回答好像什么也做不了。
image_mechanism: 情绪变化获得垂直速度和终点，前后两句话的高亢—低落被压成一次急坠。
property_alignment: 1）胜利确信对应峰顶；2）现实无力对应失足；3）心理下降对应坠落；4）最低绝望对应谷底；5）行动阻塞对应谷壁。
context_alignment: 沙漠地貌尚未进入画面，但角色很快会走入山谷；空间预演与心理落差自然贴合。
narrative_function: 立即抵消理论发现的胜利感，把叙事目标从发现真理转为艰难传递真理。
transfer_rule: 情绪作高低地形时，应给出起点、触发坠落、速度、谷底状态和可能出口，呈现变化而非静态低落。
failure_boundary: 情绪可再次回升且非单轴高度；罗辑仍有市政府这一行动选项，并未真正无路。
quality_assessment: conventional
confidence: 0.99
review_status: reviewed
tenor: 罗辑刚因黑暗战役验证理论而亢奋，随即意识到无人会采纳、自己也缺乏行动渠道，情绪骤降至绝望
vehicle: 物体从高处快速坠入深谷最低点，势能骤失、四周高壁封闭，难以继续下落也难以爬出
ground: 1）亢奋对应高处；2）绝望对应谷底；3）突然认知对应坠落；4）无行动办法对应四壁封闭；5）情绪幅度对应高度差。
