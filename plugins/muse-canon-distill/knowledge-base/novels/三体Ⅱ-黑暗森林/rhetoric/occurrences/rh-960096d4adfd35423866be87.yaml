quote: 关于他们拥有超能力的神话还是不胫而走
sensory_mapping: 无腿奔跑、消息穿街、越过人群、迅速远去
context_fact: 联合国和PDC反复解释面壁者并无超能力，公众崇拜却继续增长，电影还把他们塑成超人英雄。
image_mechanism: 抽象传言长出自主移动能力，即使官方不给它脚，它仍沿着崇拜网络跑遍社会。
property_alignment: 1）超能力神话对应奔跑者；2）传播渠道对应道路；3）公众转述对应移动；4）官方澄清对应未能拦住。
context_alignment: ‘不胫’突出没有组织发布者，与面壁者神话自发扩散的社会机制贴合，也承接随后‘越传越神’。
narrative_function: 迅速交代公众崇拜脱离制度控制，为面壁者获得政治能量提供传播前提。
transfer_rule: 用奔跑写传言时，应突出传播速度、跨域范围和缺少中心推手，三者至少具备两项。
failure_boundary: 传言依赖媒体、电影和转述者，并非真正自主；若存在有组织宣传，‘无胫’会遮蔽推动者。
quality_assessment: conventional
