review_status: reviewed
tenor: 面壁者拥有超能力的未经证实说法在公众中自行快速传播
vehicle: 没有小腿却能独自奔跑、越过人群和地域的有生命之物
ground: 1）传言对应奔跑者；2）无人正式推动对应无胫；3）迅速扩散对应疾走；4）跨越群体对应穿行远方。
