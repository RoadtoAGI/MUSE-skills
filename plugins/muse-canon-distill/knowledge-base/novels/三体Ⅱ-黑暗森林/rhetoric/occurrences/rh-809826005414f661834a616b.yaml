chapter: 正文
figure_type: analogy
quote: 有的像河流，有的像旋涡，有的像横扫一切的潮汐
sensory_mapping: 星河奔流、局部旋转、潮墙横扫、流态不断改形
context_fact: 全息图放大到星空模式，神经元光点形成的扰动在各位置以不同形式迅速出现和消失。
image_mechanism: 离散星点被连续运动串成流体，传播轨迹决定水的形态：直行成河、回卷成涡、整片推进成潮。
property_alignment: 1）神经冲动对应水流；2）网络路径对应河道；3）反馈回路对应旋涡；4）同步激活对应潮汐；5）信号强弱对应水势。
context_alignment: 说话对象是动态网络而非静态细胞，三种流体分别描述不同拓扑动作，避免单一‘流动’掩盖模式差异。
narrative_function: 把复杂神经动力学分成三类可见运动，为思维点的识别与后续干预建立直觉。
transfer_rule: 用一组流体喻体分类动态模式时，每个喻体应承担不同轨迹或尺度，避免同义堆叠。
failure_boundary: 神经活动沿离散突触传递，不服从真实水动力学；三类图形只是视觉模式，不能直接等同具体认知功能。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大脑宇宙中不同区域神经激活形成的多种传播方向、局部回转与大范围同步模式
vehicle: 水体中的定向河流、围绕中心旋转的旋涡和跨区域推进的潮汐
ground: 1）定向信号带对应河流；2）局部循环激活对应旋涡；3）大范围同步传播对应潮汐；4）神经活动强度对应水势；5）瞬息变化对应流体变形。
