tenor: 罗辑突然爆发、强到几乎驱使其砸毁办公室的愤怒
vehicle: 从下方向上喷涌并直冲天空的巨大火焰或燃烧洪流
ground: 1）情绪骤增对应火势暴起；2）身体热与激动对应火焰高温；3）从内心上升对应火从下涌上；4）破坏冲动对应火的焚毁力；5）最终压下行动对应火被控制。
