quote: 一股从未有过的冲天怒火涌上罗辑的心头
sensory_mapping: 高温、上冲火柱、涌流、焚毁冲动
context_fact: 确认面壁者身份无法放弃后，罗辑想辱骂联合国、摔文件并撕旗，最后克制自己坐回沙发。
image_mechanism: 愤怒同时取得水的涌势与火的温度，从胸口向上灌满身体，直抵天空，准备外溢为破坏动作。
property_alignment: 1）怒气对应火；2）心头对应火源；3）强度增长对应上冲；4）砸毁欲望对应燃烧破坏；5）克制对应压火。
context_alignment: 前文逻辑铁环冷硬，此处怒火用温度反击，却仍无法熔断制度，冷热冲突强化无力感。
narrative_function: 释放顿悟后的情绪峰值，再让罗辑第一次主动控制自己，为下一步追问原因留出理智。
transfer_rule: 火写愤怒时，应安排起火位置、火势方向、潜在燃烧对象和被压制或外溢的结果。
failure_boundary: 并非所有愤怒都表现为热与破坏；冷静报复或麻木状态不适用冲天火柱。
quality_assessment: conventional
