chapter: 正文
figure_type: metaphor
quote: 把多人的思维融为一体
sensory_mapping: 熔化、流体汇合、边界消退、新整体成形
context_fact: 希恩斯在脑机连接之后提出另一候选路径：人脑之间直接互联。
image_mechanism: 每个人的思想先从封闭固体变成流体，再沿接口汇入同一容器，多个“我”的边界被熔掉。
property_alignment: 1）个体思维对应材料块；2）接口对应熔接通道；3）共享信息对应混合；4）群体智能对应合体；5）个体边界对应熔前界面。
context_alignment: 面壁计划依赖绝对封闭的个人思想，这一设想反向追求彻底互联，形成主题上的强烈张力。
narrative_function: 扩展计划尺度，也提前暴露增强智力可能牺牲个体性的伦理问题。
transfer_rule: 融合隐喻写协同时，应明确哪些边界消失、哪些差异仍保留以及合体后由谁控制行动。
failure_boundary: 交流与协作不必消灭个体，真正“融为一体”可能抹去隐私、责任和人格；技术可行性未知。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 通过脑间直接互联形成共享、协同的多人认知系统
vehicle: 多块固体或多股液体熔化混合，失去边界后成为一个整体
ground: 1）各人独立思维对应分离材料；2）直接互联对应加热或混合通道；3）信息完全共享对应边界消失；4）群体认知对应新整体；5）能力增加对应体量汇聚。
