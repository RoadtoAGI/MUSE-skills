quote: 从外部看如同纸灯笼内的蜡烛被点燃了一样
sensory_mapping: 黑空中船壳由内透红、整舰点成灯笼、钢铁像热蜡塌流、白炽液体炸散
context_fact: 水滴启动推进后在主舱内摧毁螳螂号，金属先发红熔化，随后飞船爆炸且几乎无固体残片。
image_mechanism: 百万级工业材料的耐热性被两种家用脆弱物降格，内部红光先显示热源位置，蜡化再显示结构失守。
property_alignment: 1）飞船对应纸灯笼；2）推进光环对应内烛；3）壳体红炽对应透光；4）钢材对应蜡；5）热软化对应融蜡；6）爆炸碎液对应灯笼烧毁。
context_alignment: 此前水滴被误作暖瓶胆，真正脆弱的却是人类飞船；纸与蜡连续完成强弱关系倒置。
narrative_function: 用一秒内可读的日常材料变化呈现水滴首次杀伤，宣布人类工程强度全面失效。
transfer_rule: 高温毁坏载具可用透光壳与熔材两阶段类比，分别说明热源位置和承力结构崩溃。
failure_boundary: 船壳不是纸或蜡，实际熔点、爆炸和辐射机制复杂；灯笼意象不提供温度数值。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴推进高温从螳螂号内部加热金属壳，使整船透出红光并迅速软化液化直至爆炸
vehicle: 纸灯笼内部点燃蜡烛，薄壳被火从内照红；热量继续使蜡体软化流淌并毁掉原形
ground: 1）螳螂号外壳对应灯笼纸；2）内部高温对应蜡烛火；3）红光透出对应灯笼亮起；4）金属对应蜡；5）熔化对应蜡流；6）爆炸对应灯笼焚毁。
