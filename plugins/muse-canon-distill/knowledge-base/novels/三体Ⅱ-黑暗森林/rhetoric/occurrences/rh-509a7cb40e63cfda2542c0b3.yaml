context_fact: 冰面破裂后罗辑沉入夜湖，在生死边缘第一次看见宇宙社会的真相。
image_mechanism: 冰面破口翻转成通向宇宙的舱门，下沉方向被重新命名为向外跃出；湖水触感退去，只剩冷黑空间。
property_alignment: 1）冰湖对应太空；2）破口对应入口；3）下沉对应跃入；4）水中漂浮对应失重；5）寒冷黑暗对应宇宙环境。
context_alignment: 罗辑刻意远离尘世建立思想平台，意外坠水最终完成从地球景物到宇宙视角的彻底剥离。
narrative_function: 把身体险境与黑暗森林理论诞生合为一次“出舱”，确立星空恐惧的感官根源。
transfer_rule: 局部环境转写为宇宙应逐项移除重力、光、声和近景参照，并让认知目标确指向宇宙。
failure_boundary: 湖水有压力、可呼吸风险和浮力，太空是真空；罗辑被动跌落而非主动跃入，主动词体现心理转换。
