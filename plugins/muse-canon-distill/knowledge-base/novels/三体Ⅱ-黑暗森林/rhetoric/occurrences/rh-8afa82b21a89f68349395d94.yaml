tenor: 未来走廊地面在脚底和病床轮子接触处生成并向外扩散的发光水状波纹
vehicle: 手指按压旧式液晶屏时，受压区域产生并扩散的亮暗色纹和水波状变形
ground: 1）脚和轮子对应按屏手指；2）地面对应液晶面板；3）接触压力对应手指按压；4）发光波纹对应屏幕受压纹；5）随移动生成对应触点变化。
