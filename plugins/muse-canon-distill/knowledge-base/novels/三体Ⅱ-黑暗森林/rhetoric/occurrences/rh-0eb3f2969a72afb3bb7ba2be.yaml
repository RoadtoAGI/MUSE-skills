chapter: 正文
figure_type: simile
quote: 仿佛整个世界都因她的美丽而隐去似的
sensory_mapping: 白色世界褪去、人物独亮、视野向她收束、背景静默消失
context_fact: 东方延绪问自己的眼睛像什么，章北海以女儿回应后仍不移目光，二人在空白球舱中近距离对视。
image_mechanism: 注意力被写成删去背景的力量，美丽不改变舱室，却把感知画面中除她之外的像素全部擦掉。
property_alignment: 1）东方延绪对应画面中心；2）周围舱室对应被隐去背景；3）章北海视线对应聚焦镜头；4）吸引力对应遮罩；5）持续凝视对应主体独占画幅。
context_alignment: 球舱本就洁白空无，环境极易退场；夸张由章北海克制视角生出，既显审美震动又遮掩其真实战略意图。
narrative_function: 制造亲近与暧昧的表层，使东方延绪暂时放松警惕，也加深章北海行动前的复杂人际张力。
transfer_rule: 人物美感作世界隐去时，应有明确视角、极简背景和持续聚焦动作，让夸张落在主观注意而非客观魔力。
failure_boundary: 舱室、职责和危险仍真实存在，章北海也在策略性应答；美丽并未实际消除世界或判断能力。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 章北海凝视东方延绪时，注意力高度集中于她，使洁白球舱和周遭事物在主观感知中退到不可见背景
vehicle: 舞台或画面中除一个明亮主体外，整个外部世界被撤走、遮暗或消失
ground: 1）东方延绪对应唯一可见主体；2）章北海凝视对应聚光；3）球舱背景对应隐去世界；4）美丽吸引对应遮蔽其他刺激；5）目光不移对应画面锁定；6）外界退场对应注意力收束。
