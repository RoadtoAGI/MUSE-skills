chapter: 正文
figure_type: metaphor
quote: 联合舰队就是太空中的一个100×20的矩阵
sensory_mapping: 舰队压成数字方格、巨舰化为元素、假想敌矩阵准备相乘、现实只留下孤零零一点
context_fact: 丁仪从远处只能看到舰队的规则光点，想象另一矩阵与其相乘，却意识到对手只有水滴。
image_mechanism: 空间阵列被抽象为数学对象，原可带来镇静的可计算性因‘矩阵对一点’的极端不对称而失败。
property_alignment: 1）舰体对应数值元素；2）百舰长边对应矩阵横行；3）二十舰短边对应竖列；4）交战对应运算；5）水滴对应维度失配的点。
context_alignment: 物理学家丁仪以思维体操自救，数学喻体符合人物职业，也提前显出规模优势无法进入正确运算。
narrative_function: 把壮观阵列重写成脆弱排列，并用无法相乘的尺度关系预告战斗逻辑失效。
transfer_rule: 秩序群体作矩阵时，应落实元素、行列、运算规则和对手维度，让形式结构产生情节判断。
failure_boundary: 战舰有质量、人员和自主机动，不是同质数字；水滴也不是数学零维点。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 两千艘战舰按一百乘二十的规则矩形阵列分布，丁仪试图用数学秩序理解舰队与水滴的对峙
vehicle: 矩阵把大量元素安放在固定行列中，并可与另一矩阵按规则相乘产生可计算结果
ground: 1）战舰对应元素；2）舰列对应行列；3）规则间距对应矩阵秩序；4）对敌行动对应矩阵运算；5）水滴对应极小单点。
