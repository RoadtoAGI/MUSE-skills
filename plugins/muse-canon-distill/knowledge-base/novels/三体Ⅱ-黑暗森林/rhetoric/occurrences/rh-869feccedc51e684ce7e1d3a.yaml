chapter: 正文
figure_type: metaphor
quote: 在亚洲舰队司令官的背后，灿烂的星河浩荡流过
sensory_mapping: 星点汇成亮水、宽河横过窗后、光流持续移动、人物立在宇宙岸边
context_fact: 木星轨道司令部靠旋转产生重力，宽大窗口尽量让室内与太空相融，因此星空看似在人物身后移动。
image_mechanism: 旋转造成的星空位移被水流化，静止星点集合获得方向、速度与水量，窗口也变成宇宙河岸。
property_alignment: 1）银河对应大河；2）恒星对应浪面光点；3）司令部旋转对应河水流过；4）星带尺度对应浩荡水面；5）窗口对应岸线；6）司令官对应临河人物。
context_alignment: 紧接章北海跨越两个世纪的到达，外部星河与稍后时间长河相连，使太空地点和历史位置同时获得流动感。
narrative_function: 以宏阔背景抬升舰队司令部场景，并自然引出人物回望常伟思所处的历史上游。
transfer_rule: 星带作河流时，应利用实际相对运动、带状分布和点光聚集，给观察者安排明确岸边位置。
failure_boundary: 恒星彼此距离巨大且没有共同水流，视运动来自司令部旋转；河流方向不能推导星体真实运动。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 司令部旋转时，窗外密集星带在司令官身后产生宽阔、连续而壮丽的相对移动
vehicle: 一条光辉宽阔的大河携带无数闪亮水点，以巨大水量从岸边浩荡奔流
ground: 1）银河星带对应河流；2）群星对应水光；3）相对位移对应流动；4）星带宽广对应河面；5）连续运动对应水势；6）司令官位置对应岸边观察点。
