tenor: 智子封锁后，人类在引力波研究上仍取得了相对其他基础物理领域更多的进展和理解
vehicle: 行者沿道路向前跋涉，在其他路线受阻时，有一条路线已经走出更长距离
ground: 1）物理学发展对应行走；2）研究领域对应道路；3）新知识对应前进距离；4）智子封锁对应路障；5）较多进展对应走得更远。
