chapter: 正文
figure_type: simile
quote: 年轻的母亲和孩子都消失了，像是融化在白雪中
sensory_mapping: 人物轮廓化开、白色吞没、雪面无痕、追赶落空
context_fact: 罗辑梦见庄颜抱孩子在雪野艰难前行，他想追过去却听不见她们的声音。
image_mechanism: 母女身影失去实体边缘，如冰雪化水渗回整片白色；前方没有留下可追踪脚印或方向。
property_alignment: 1）庄颜孩子对应融雪；2）白色世界对应雪地；3）消失对应融化；4）无法追赶对应无实体可触。
context_alignment: 庄颜此前从梦中来又回梦中，此刻在冬眠临界幻象里融入白雪，视觉同色性让消失过程自然。
narrative_function: 再次剥夺罗辑与家人相会，使冬眠成为独自滑向未来的必经状态。
transfer_rule: 人物融入背景应利用颜色或材质同一，描写轮廓消散而非突然切走，适合意识淡出的场景。
failure_boundary: 庄颜和孩子仍真实存活并在冬眠，消失只属幻觉；色差强烈或动作突兀时不宜写融化。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 庄颜与孩子的幻影在罗辑试图追赶时失去轮廓、无声融入雪白意识背景
vehicle: 白色物质受热融解后边界消失，与周围同色雪地混为一体
ground: 1）人影消失对应固体融化；2）轮廓渐无对应边缘化开；3）白色背景吞没对应同色相融；4）无法追及对应融物不可抓；5）无声过程对应雪融静默。
