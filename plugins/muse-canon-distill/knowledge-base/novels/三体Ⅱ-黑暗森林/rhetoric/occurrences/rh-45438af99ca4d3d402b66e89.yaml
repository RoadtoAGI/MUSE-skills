chapter: 正文
figure_type: simile
quote: 就像他从遥远的过去带过来的其他东西一样，他这个习惯动作一直没有改过来
sensory_mapping: 大史从时间故乡走来、口袋里除旧烟外还装着掏火动作、两百年后手仍按原路线摸索
context_fact: 未来香烟无需点火，但史强每次仍会掏打火机；罗辑正与这位旧时代同伴告别。
image_mechanism: 无形肌肉记忆被物化为跨时行李，动作比制度和器物更顽固地保存一个时代。
property_alignment: 1）习惯对应物品；2）身体记忆对应行李容器；3）冬眠跨时对应长途运输；4）重复动作对应旧物未损；5）未来烟对应新环境。
context_alignment: 分别前的细节把大史从救世讨论拉回具体朋友，旧动作也呼应‘时间老乡’的身份连续。
narrative_function: 用微小动作保存人物真实感，并使罗辑即将失去的不是抽象助手，而是一整套旧时代生活。
transfer_rule: 习惯作跨时旧物时，应选可重复身体动作，写清原环境、迁移媒介、新环境失配和仍未改变之处。
failure_boundary: 习惯不能脱离身体独立携带，也可能经训练改变；这里只说明一个动作而非全部人格不变。
quality_assessment: exemplary
