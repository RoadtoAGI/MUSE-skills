property_alignment: 1）破壁人对应超人演员形象；2）帅气面容对应英雄脸型；3）自信站姿对应银幕姿态；4）他人评价对应公众识别。
context_alignment: 类比由人物自述且限定‘老版电影’，随后雷迪亚兹用演员里夫摔断脖子的经历反击，使表面赞美转成死亡伏笔。
narrative_function: 迅速勾勒来客外貌，建立雷迪亚兹后来狂笑和扭颈攻击所需的黑色呼应。
transfer_rule: 用知名角色写人物外貌时，应限定具体版本和可见特征，并让文化联想参与后续情节而非充当空泛赞美。
