tenor: 章北海听到自己将获战舰指挥权限时，目光突然显出强烈、明亮且持续的激动与使命感
vehicle: 两颗微型恒星在眼眶内进行核燃烧，释放高亮光芒与巨大热能
ground: 1）双眼对应两颗太阳；2）目光明亮对应恒星发光；3）激动对应高热；4）使命感对应持续燃料；5）内在意志对应核火；6）双目数量对应双星。
