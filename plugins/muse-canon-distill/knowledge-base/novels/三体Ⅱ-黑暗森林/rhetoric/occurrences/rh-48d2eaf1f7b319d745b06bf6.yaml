quote: 章北海的眼睛中，有两个小太阳在燃烧
sensory_mapping: 眼眶容纳双星、瞳孔迸光、热力向外喷涌、意志持续燃烧
context_fact: 司令官宣布冬眠特遣队因未接触思想钢印而最可信，将获得集中指挥战舰的执行舰长权限。
image_mechanism: 抽象意志被压缩进双眼并点燃成恒星，人物克制话语与几乎无法遮住的巨大内能形成反差。
property_alignment: 1）章北海眼睛对应太阳；2）目光光泽对应日光；3）接受使命的兴奋对应燃烧；4）长期信念对应核燃料；5）坚决意志对应高能量；6）外表克制对应小尺度容器。
context_alignment: 他始终隐藏逃亡计划，此刻战舰权限正是关键机会；太阳之火既可读作忠诚热情，也暗藏将驱动逃亡的能量。
narrative_function: 在章北海口头拒绝前泄露真实激动，让读者看到谨慎表演下计划突然获得突破口。
transfer_rule: 眼中燃星时，应让人物面对足以点燃长期欲望的具体事件，并利用目光亮度与话语克制制造张力。
failure_boundary: 眼睛不产生恒星能量，亮光不能证明章北海的真实忠诚对象；激动的方向仍需后续行动判断。
quality_assessment: exemplary
