chapter: 正文
figure_type: simile
quote: 仿佛是燃烧的血滴
sensory_mapping: 银镜骤亮又转暗红、液滴像含血燃烧、每次闪烁都映着一艘舰的火球
context_fact: 图像软件终于从爆炸资料中抽出水滴，其表面频繁映射舰船核爆和金属岩浆的光。
image_mechanism: 反射光被读成物体自身的血与火，攻击者在受害者光芒中获得染血外观。
property_alignment: 1）水滴外形对应血滴；2）岩浆红光对应血色；3）聚变强光对应火焰；4）镜面闪变对应燃烧跳动。
context_alignment: 水滴一直以纯净艺术品出现，此刻仅靠反射便变成燃血，形象转色对应人类认知从礼物转向凶器。
narrative_function: 为终于显影的敌人赋予杀戮标记，浓缩它吸收整片战场死亡景象的视觉效果。
transfer_rule: 反光物作染血燃烧时，应交代颜色来源、明暗节奏、外形基础和事件伦理，让映像承担转义。
failure_boundary: 水滴本身未燃烧也没有血液，红光完全来自被毁战舰；不能据此判断其温度或生物性。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 高速水滴的镜面交替映出核火球强光与金属岩浆暗红，外形仍保持完整液滴
vehicle: 一滴鲜血在火中燃烧，液滴轮廓呈红亮色并随火焰明暗闪烁，兼有生命与毁灭感
ground: 1）探测器形状对应液滴；2）暗红反光对应血色；3）强光交替对应燃烧；4）屠杀背景对应鲜血来源。
