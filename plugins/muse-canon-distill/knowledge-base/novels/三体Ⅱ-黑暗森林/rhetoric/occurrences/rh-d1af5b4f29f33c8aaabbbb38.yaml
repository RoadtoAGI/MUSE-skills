quote: 希望从中寻找到你真实思想的蛛丝马迹
sensory_mapping: 暗处细丝、地面浅痕、俯身辨迹、线索通向隐处
context_fact: 作为破壁人和妻子，惠子多年观察希恩斯的一举一动，甚至在他冬眠时反复回忆细节，试图识破思想伪装。
image_mechanism: 不可见思想被设定为曾在生活表面经过的隐物，哪怕主体沉默，也会在眼神与动作上留下可供追踪的纤细残迹。
property_alignment: 1）真实战略对应潜藏者；2）眼神动作对应蛛丝马迹；3）惠子对应追踪者；4）婚姻日常对应搜索现场；5）推理识破对应沿迹找到目标。
context_alignment: 希恩斯把欺骗融入亲密生活，线索只能细到眼神和梦话，惯用语在此获得完整的侦查过程支撑。
narrative_function: 把漫长婚姻转成无声破壁调查，显示惠子的亲密与监视始终重叠。
transfer_rule: 用痕迹写心理推断时，应明确隐藏对象、残留载体、观察动作和由碎片到整体的推理链。
failure_boundary: 眼神和动作可能多义，不能像物理足迹那样唯一指向一种思想；惠子的结论仍需其他证据验证。
quality_assessment: conventional
