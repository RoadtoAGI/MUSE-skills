tenor: 惠子从希恩斯极细微的眼神、举动和梦呓中搜寻其隐蔽真实战略的零碎线索
vehicle: 侦查者从残留的细蜘蛛丝和足迹判断某个生物经过、去向与隐藏位置
ground: 1）细微行为对应蛛丝足迹；2）真实思想对应隐匿目标；3）长期观察对应现场搜寻；4）碎片信息对应微弱痕迹；5）推断战略对应循迹追踪。
