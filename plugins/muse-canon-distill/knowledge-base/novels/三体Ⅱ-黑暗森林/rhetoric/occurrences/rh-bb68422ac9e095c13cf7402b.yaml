tenor: 公众不再相信罗辑后，他的政治威望、实际权力及由此维持的警戒强度持续下降
vehicle: 高处物体向下坠落，同时一根拉紧的绳索逐渐失去张力、变松并无法继续约束周围
ground: 1）社会地位对应高度；2）失去信任对应下落；3）戒严强度对应绳索张力；4）控制减弱对应松弛；5）骚扰进入对应约束失效。
