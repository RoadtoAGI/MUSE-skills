quote: 随着罗辑地位的衰落，对小区的戒严也渐渐松懈下来
sensory_mapping: 罗辑从权力高处向下跌，牵着小区警戒的绳索随之松垂，人群和记者穿过松开的边界
context_fact: 雪地工程停顿后罗辑由救世主变成骗子，戒严放松，抗议者与记者频繁聚到楼下。
image_mechanism: 政治变化同时获得垂直高度和绳索张力，身份下落直接带动防护边界放松。
property_alignment: 1）威望对应位置高度；2）信任流失对应衰落；3）治安控制对应拉紧；4）人员涌入对应绳索失约束。
context_alignment: 罗辑权力确实决定小区警戒资源，两个常规空间隐喻在因果上相扣，简洁交代制度撤退。
narrative_function: 把世界失望转成可见生活后果，为居民驱逐和罗辑孤身离开建立压力。
transfer_rule: 地位作高度并联控制作张力时，应写出连接机制，说明谁随下降而放松、边界如何失效。
failure_boundary: 社会地位没有统一高度，戒严放松也来自行政决策；空间变化不能代替具体权力过程。
