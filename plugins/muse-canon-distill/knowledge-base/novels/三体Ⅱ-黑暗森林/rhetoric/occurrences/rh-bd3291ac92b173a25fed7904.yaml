chapter: 正文
figure_type: simile
quote: 飞船巨大的残骸像山峰般围成一圈
sensory_mapping: 舰体残段竖成环山、漆黑裂口化作洞穴、幸存方阵停在夜谷底、银河冷光从峰缝漏下
context_fact: 蓝色空间号把三舰残骸围成巨石阵作为陵墓，幸存者在中央为四千余死者举行葬礼。
image_mechanism: 工业残骸被地貌化，尺寸、环绕、裂口与阴影各自占据山谷部件，使无行星太空临时生成人类葬地。
property_alignment: 1）舰壳块对应山体；2）断口对应洞口；3）围圈对应山谷；4）死者遗体对应洞葬；5）活人方阵对应谷中送葬者；6）星光对应夜空。
context_alignment: 星舰人已无土地可埋葬，借残舰造山谷让传统山地陵墓在太空重现，贴合失乡文明的仪式需求。
narrative_function: 把拆卸后的冰冷残骸转成可容纳哀悼的景观，为长明灯和文明成人礼建立场所。
transfer_rule: 人造残骸作山谷时，应系统分配峰、洞、谷、阴影和天光，让尺度与仪式功能共同成立。
failure_boundary: 残骸没有岩石地质、重力地面或真实洞穴，幸存者悬浮而非站在谷底；景观由人为排列。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三艘被切成多段的巨舰残骸环绕幸存者方阵，裂口漆黑、尺度高大，死者遗体置于其中
vehicle: 群山围成深夜山谷，山峰高耸、洞穴黑暗，谷中人处在山影下，仅能从峰隙看到冷星光
ground: 1）残舰段对应山峰；2）切割裂口对应山洞；3）环形排列对应谷壁；4）幸存者对应谷底人群；5）残骸阴影对应深夜；6）缝隙星光对应峰隙天光。
