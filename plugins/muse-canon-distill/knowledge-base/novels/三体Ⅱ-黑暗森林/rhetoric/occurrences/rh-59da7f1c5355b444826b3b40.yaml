tenor: 互联网庞大信息空间中层层隐藏的三体游戏入口
vehicle: 浩瀚海洋里不断嵌套、越来越偏远的角落
ground: 1）海量信息对应海洋广度；2）目标难以发现对应位置偏僻；3）角落层层嵌套对应多级隐藏路径；4）虚拟世界在最深处复活对应抵达隐蔽空间底部。
