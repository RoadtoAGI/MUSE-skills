quote: 在互联网浩瀚的信息海洋中，有一个偏僻的角落
sensory_mapping: 空间、尺度、深度、导航
context_fact: ETO遭全球打击后，以多层隐蔽网络位置重新开放三体虚拟世界。
image_mechanism: 先把信息量铺成无边水域，再反复折入“角落中的角落”，用尺度扩张与路径收窄同时制造难以搜索的网络位置。
property_alignment: 1）数据总量对应海洋；2）低可见链接对应偏僻角落；3）多层访问结构对应角落嵌套；4）进入成本对应深入航行。
context_alignment: 组织刚被清剿，需要安全聚会地点；空间隐蔽词让抽象网络拓扑具有逃亡者寻找藏身处的质感。
narrative_function: 完成场景从现实转入秘密虚拟世界的镜头，并直观交代ETO残部的隐蔽程度。
transfer_rule: 写网络隐藏时，可同时刻画总体信息规模、入口稀缺和访问层级，让“难找”具有可行走的路径结构。
failure_boundary: 互联网没有固定海岸或物理角落，链接可被搜索与复制；该图景只表达发现概率和层级访问，不说明真实距离。
quality_assessment: effective
