quote: 当“唐”号夭折时，章北海仿佛失去了一个精神家园
sensory_mapping: 未成之家熄灭、门未入便失、心灵漂泊、巨舰重新开门
context_fact: 章北海曾参与以海军为基础的太空舰队开端，‘唐’号未成；冬眠两世纪后他被任命为‘自然选择’号执行舰长。
image_mechanism: 军舰从装备转为容纳身份的居所，项目失败不只是职业挫折，而像一座尚未入住的家在远处早夭，留下心灵无处停泊。
property_alignment: 1）‘唐’号对应精神家园；2）海军使命对应家庭归属；3）项目终止对应家园夭折；4）章北海对应未入住者；5）长期冬眠对应漂泊；6）新舰对应重获住所。
context_alignment: ‘唐’号与‘自然选择’号外形全然不同，家园感来自使命传承而非视觉相似，准确揭示章北海依附的是舰队理想。
narrative_function: 把两世纪战略坚持落到归属需求，使他扑向新舰的强烈情绪不显突兀，也预示他会把舰视作命运共同体。
transfer_rule: 机构或载具作精神家园时，应说明它容纳的身份、失去后的漂泊和新对象如何继承核心归属。
failure_boundary: 章北海从未在‘唐’号生活，军舰也承担战争而非家庭照护；家园感不能证明他会服从舰队当前路线。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 章北海寄托海军传统与未来太空使命的‘唐’号航母项目中止，使其长期缺少可归属的军事载体
vehicle: 一个尚未建成便早早死亡、原可供人安身认同的家园突然失去
ground: 1）‘唐’号对应家园；2）项目中止对应夭折毁失；3）军事理想对应居住归属；4）章北海未登舰对应从未入住；5）两个世纪漂泊对应无家流浪；6）‘自然选择’号对应新归宿。
