quote: 如同一个初入童话中神奇宫殿的孩子，怕吵醒这里沉睡的什么东西
sensory_mapping: 神奇宫殿、孩子蹑足、沉睡器物、压低呼吸
context_fact: 庄颜第一次来卢浮宫，在空旷长厅走得极轻，长时间只凝神看了五幅画。
image_mechanism: 展柜和画框脱离博物馆分类，变成可能呼吸的沉睡生命；庄颜缩回孩子，以脚尖穿行其间。
property_alignment: 1）庄颜对应孩子；2）卢浮宫对应童话宫殿；3）艺术品对应沉睡之物；4）轻走对应怕惊醒。
context_alignment: 她的天真与艺术敏感此前已有铺垫，深夜闭馆环境使宫殿只为二人开放，童话感来自真实时空。
narrative_function: 将参观转为奇遇，突出庄颜与艺术世界天然相容。
transfer_rule: 童话入境喻应赋予环境一条角色会信以为真的隐性规则，并让动作遵守它。
failure_boundary: 庄颜知道艺术品不会醒，孩子身份仅写敬畏；嘈杂群游或专业冷静鉴赏会破坏童话规则。
