chapter: 正文
figure_type: simile
quote: 他的目光平静如水
sensory_mapping: 双眼铺成静水、表面无纹、外界话语落下也不起浪、深处不可见
context_fact: 自然选择号燃料不足，章北海知道会被追上，仍称行动是否成功不影响自己履行责任。
image_mechanism: 可能失败的冲击被当作投入水面的物体，却没有激起可见波纹，克制由水面静态得到直接证明。
property_alignment: 1）章北海眼神对应水面；2）情绪对应水势；3）东方质问对应外力；4）不动摇对应不起波；5）理性清晰对应澄水；6）真实计划对应水下暗层。
context_alignment: 他身处充满深海液的飞船并以海军伦理答话，水喻体同时贴合物理环境、职业背景和性格控制。
narrative_function: 阻止失败信息削弱人物意志，显示章北海夺舰依据责任伦理而非成功概率。
transfer_rule: 目光作静水时，应给出足以起浪的外部刺激，并通过无波、清澈和深度分别对应稳定、理性与保留。
failure_boundary: 平静外表不能证明内心无冲突，水下深度也不可直接读取；此句不保证章北海判断正确。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 章北海面对东方延绪指出逃亡必败时，眼神仍稳定、无波动且不显慌乱或悔意
vehicle: 无风水面平展安静，没有涟漪、浪头和浑浊扰动
ground: 1）目光表面对应水面；2）情绪稳定对应无风；3）没有慌乱对应无浪；4）思路清晰对应水体澄静；5）持续凝视对应平面不动；6）深藏意图对应水下深度。
