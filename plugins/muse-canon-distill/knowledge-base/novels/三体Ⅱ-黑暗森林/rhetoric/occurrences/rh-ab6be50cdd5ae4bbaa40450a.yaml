chapter: 正文
figure_type: simile
quote: 像灼热的铁水一般在他的意识中烙下印记
sensory_mapping: 高温、熔融金属、烧灼、凹凸印痕
context_fact: 罗辑此刻只浅浅记住凶手微笑，叙述预告这次刺杀及其后果将使他疼痛一生。
image_mechanism: 轻薄表情突然获得熔铁重量和温度，从视觉输入穿入意识表面，冷却后变成终身可触的伤痕。
property_alignment: 1）微笑印象对应铁水；2）意识对应承印材料；3）创伤形成对应烙下；4）持久记忆对应凝固印记。
context_alignment: 前文笑容曾是油膜和屏幕亮光，铁水让同一视觉母题骤然增重升温，准确转向未来创伤。
narrative_function: 从当前病房跳接罗辑一生，预告这张笑脸会成为面壁命运的痛苦符号。
transfer_rule: 写创伤记忆可把感知、侵入、定形和余痛排成材料变化链，使“记住”具有发生过程。
failure_boundary: 所有鲜明记忆都未必由创伤烧灼形成；铁水强度只适合文本已明确预告长期疼痛的节点。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 凶手的鲜明微笑日后在罗辑记忆中留下持久而痛苦的心理创伤
vehicle: 灼热铁水接触材料、烧灼并凝固成不可磨灭烙印
ground: 1）当下印象高温强烈对应铁水灼热；2）进入意识对应浇到承印面；3）记忆永久留下对应烙印凝固；4）多年心理疼痛对应烧伤余痛。
