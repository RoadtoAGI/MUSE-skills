chapter: 正文
figure_type: simile
quote: 一条红线像懒洋洋的蛇一般在世界地图上动
sensory_mapping: 视觉、线形、运动节奏
context_fact: 斐兹罗想在抽象数据屏中找到NASA式的直观发射画面，以便确认有东西射向太空。
image_mechanism: 将不可读的弹道数据变成带方向、速度和身体轮廓的活动红线，观众无需理解坐标便能追踪运动。
property_alignment: 1）红线长度对应蛇身；2）正弦形弯曲对应蛇行；3）逐帧位移对应缓慢爬动。
context_alignment: 这是将军设想的科普式界面而非真实屏幕，蛇形运动正好承担他作为外行所需的直观性。
narrative_function: 对照控制室真实数据的杂乱抽象，凸显决策者与技术人员之间的认知距离。
transfer_rule: 把轨迹数据可视化时，喻体应同时给出线体形状、推进方向和速度观感，并说明形状由何种投影产生。
failure_boundary: 弹道真实速度并不懒散，蛇只承载屏幕显示；不能据此推断导弹机动方式或物理航迹呈正弦。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 显示在世界地图上的导弹飞行红色轨迹线
vehicle: 在平面上缓慢蜿蜒爬行的蛇
ground: 1）轨迹细长连续对应蛇身；2）地图投影造成的弯曲对应蛇的蜿蜒；3）屏幕上缓慢推进对应懒洋洋爬行。
