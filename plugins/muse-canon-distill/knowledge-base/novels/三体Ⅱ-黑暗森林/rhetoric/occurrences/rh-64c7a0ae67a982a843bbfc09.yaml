chapter: 正文
figure_type: simile
quote: 她像是一根飘浮在星海背景上的轻盈的羽毛
sensory_mapping: 星海深蓝、细羽悬空、轮廓轻柔、几乎无重漂着
context_fact: 全景显示让飞船消失，两人仿佛直接悬于太空；五个天文单位外的阳光照在东方延绪身上。
image_mechanism: 失重移除身体重量，远阳光勾出细长轮廓，使人像一根被置于巨大星幕前的白羽，轻到不属于任何地面。
property_alignment: 1）东方延绪对应羽毛；2）苗条身形对应羽轴；3）失重对应轻质；4）悬浮姿态对应随风漂浮；5）星空对应衬底；6）远阳光对应羽缘亮光。
context_alignment: 此前她移动如音符，此处静止如羽毛；两个喻体分别写动作节奏和失重质感，未作纯粹复指。
narrative_function: 在章北海试探钢印族前保留东方延绪的轻盈人性，也加深巨舰权力与个体脆弱的尺度反差。
transfer_rule: 失重人物作羽毛时，应对齐体态轮廓、低重量感、漂浮速度和背景反差，并区分静止与飞行动作。
failure_boundary: 舱内没有风，人体质量并未消失且受磁力控制；羽毛的被动漂流不能代表东方延绪的自主性。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 东方延绪修长的身体在失重舱全景星空中无依托地安静悬浮、显得轻柔纤细
vehicle: 一根几乎无重量的羽毛在广阔背景前缓慢漂浮，姿态随微小气流轻轻变化
ground: 1）身体修长对应羽轴；2）轻盈体态对应羽毛低重；3）失重悬浮对应飘浮；4）星海对应深色背景；5）发丝衣物微动对应羽枝轻颤；6）个体渺小对应单羽尺度。
