quote: 航天服就像太空自行车
sensory_mapping: 单人骑行、轻装转向、站点穿梭、短程通勤
context_fact: 人们已习惯只身穿行太空，推进器时速可达五百公里，在电梯周围是最方便交通工具。
image_mechanism: 高风险航天装备被缩成日常代步工具，喷气飞行转译为蹬车穿街，使轨道生活的常态化一瞬可感。
property_alignment: 1）航天服对应自行车；2）航天员对应骑手；3）推进器对应驱动轮；4）空间站间航线对应街道；5）短途灵活对应通勤便利。
context_alignment: 前句已把设施组织成城市与村庄，自行车顺势补全个人交通层级，整套类比彼此支撑。
narrative_function: 显示太空活动从英雄探险变成普通通勤，也解释监测系统为何不会关注章北海。
transfer_rule: 新型载具作自行车应对齐使用人数、路程尺度、操作自主性和交通层级，速度差异可由环境说明。
failure_boundary: 航天服维生要求高、失效致命，远比自行车复杂危险；离开电梯周边或长途飞行时类比失效。
