chapter: 正文
figure_type: analogy
quote: 这光芒完全像雪自己发出的，仿佛照亮这世界的从来就不是太阳，而只是这座雪峰
sensory_mapping: 雪体内发光、银辉四射、太阳隐退、世界受照
context_fact: 太阳已经西斜，周围雪坡在阴影中呈淡蓝色，只有远处高峰仍处于阳光中。
image_mechanism: 真实太阳被叙述从画面背后撤走，反射光的终点雪峰反转为光的起点；银辉从山体内部向四面喷出。
property_alignment: 1）反光雪峰对应发光体；2）太阳照射对应被隐藏能源；3）四散银光对应辐射；4）周围阴影对应世界受其照亮。
context_alignment: 逆光条件把照明来源遮蔽，只留下亮峰与暗坡的强反差，使主观错觉在光学上可理解。
narrative_function: 把雪峰神圣化为“空白世界”的中心，为其光映入庄颜双眼和告白场面聚焦。
transfer_rule: 反射物写成光源时，应隐藏真实光源并安排周围暗面，让光线方向在观看者视角中可信地倒置。
failure_boundary: 雪峰实际依赖夕阳且不能照亮全球；当太阳可见或山体不反光时，取代光源的错觉立即消失。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 夕阳照射下远峰反射强烈银光、在阴影雪坡中显得具有独立照明权的视觉效果
vehicle: 自身发光并取代太阳、成为整个世界唯一光源的雪峰
ground: 1）雪面强反射对应自发光；2）近处阴影对应外界光源退场；3）银光撒向四方对应照亮世界；4）雪峰独亮对应取代太阳；5）视觉中心对应唯一光源。
