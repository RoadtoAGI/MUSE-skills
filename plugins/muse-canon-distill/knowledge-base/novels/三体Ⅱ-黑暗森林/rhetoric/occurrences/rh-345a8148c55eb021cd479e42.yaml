chapter: 正文
figure_type: simile
quote: 像一对幸福的情侣那样相互扶持着走远
sensory_mapping: 两名严肃代表泪痕未干，肩臂互相支住，像刚获幸福的恋人并肩消失在沙地
context_fact: 希恩斯与乔纳森分别为先前怀疑生命道德和上帝而羞愧，认为彼此说的是同一回事，随即拥抱。
image_mechanism: 思想和信仰上的相互确认被转成情侣身体亲密，庄重代表的身份与姿态产生温和滑稽反差。
property_alignment: 1）价值一致对应心意相通；2）相拥对应情侣拥抱；3）搀扶对应依偎；4）满足感对应幸福。
context_alignment: 比喻来自罗辑略带旁观和讽刺的视线，在神圣狂热刚散后用世俗亲密感降低场面温度。
narrative_function: 以幽默收束公众宗教高潮，显出希恩斯与乔纳森判断仍受情绪驱动。
transfer_rule: 用情侣比拟非恋爱搭档时，应有双人互信、身体靠近、共同情绪和成对行动，并利用身份反差控制语气。
failure_boundary: 两人不是恋爱关系，幸福也来自信仰确认而非亲密伴侣生活；不能扩写成真实爱情。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 希恩斯与乔纳森在信仰重新获得确认后拥抱流泪，并肩互相搀扶离开
vehicle: 感情亲密、心意相通的情侣在幸福时靠着彼此缓慢走远
ground: 1）共同信念对应情感亲密；2）拥抱流泪对应幸福激动；3）互相扶持对应情侣依偎；4）两人同行对应成双离开。
