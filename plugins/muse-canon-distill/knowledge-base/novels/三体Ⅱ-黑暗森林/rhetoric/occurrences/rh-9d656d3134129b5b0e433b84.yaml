quote: 那就是宇宙中的一把刷子，更准确地说只有刷毛，没刷柄
sensory_mapping: 千根刷毛、平行暗线、无柄毛束、宇宙黑底
context_fact: 哈勃图像中出现比恒星更大的不规则暗区，外行将军先喊“刷子”，专家随后采用该名称。
image_mechanism: 难辨尘埃吸收差异被轮廓识别压成日常工具，密集尾迹各自变成细毛；缺少可见舰队主体则被解释为无柄。
property_alignment: 1）航迹对应刷毛；2）舰队群对应刷子；3）平行尾迹对应毛束排列；4）主体不可见对应没有刷柄。
context_alignment: 命名由外行先抓整体形态，再由专业模型解释物理成因，喻体因此兼具视觉准确和交流效率。
narrative_function: 给不可见舰队的间接证据一个可复用名称，支撑后文刷毛计数、伸长与第二把刷子。
transfer_rule: 科学形态命名应先抓可稳定复认的线条、排列与缺失部件，并允许后续观测沿喻体测量。
failure_boundary: 尾迹会扩散生长且并非实体毛，刷柄缺失也不代表舰队无组织；形态改变时应更新喻体。
