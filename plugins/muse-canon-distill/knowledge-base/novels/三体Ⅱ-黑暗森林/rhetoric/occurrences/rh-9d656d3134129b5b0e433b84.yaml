tenor: 三体舰队穿过尘埃云留下的一千条平行、细长且整体成束的吸收尾迹
vehicle: 一把竖着许多平行刷毛却没有刷柄的刷子，或一排直立头发
ground: 1）单条尾迹对应一根刷毛；2）约千条平行排列对应毛束；3）共同起点区域对应刷毛根部；4）无实体连接对应没有刷柄；5）纵向细线对应竖发。
