tenor: 能广泛传播却只在识别罗辑基因后制造致命毒素的定向改造病毒
vehicle: 携带杀伤载荷、按目标特征制导并在命中后引爆的导弹
ground: 1）病毒对应导弹；2）基因识别对应制导系统；3）感染传播对应飞行搜索；4）致命毒素对应战斗部；5）罗辑基因对应目标信标；6）普通人轻症对应未锁定时不爆炸。
