quote: 这是基因武器，或者叫基因导弹
sensory_mapping: 病毒弹体、基因雷达、全球巡航、命中释毒
context_fact: 轻流感在人群中传播，对多数人症状轻微，却令罗辑迅速休克；专家确认病毒经过基因改造。
image_mechanism: 肉眼不可见的病原体获得武器结构：传播链成为搜索航路，基因匹配像末端制导，进入目标血液后才释放弹头。
property_alignment: 1）改造病毒对应导弹；2）传染性对应射程；3）基因识别对应制导；4）毒素对应弹头；5）罗辑对应锁定目标；6）人群对应掩护航域。
context_alignment: 暗杀可在全球撒播而不暴露接近者，导弹类比准确解释其远程、定向和命中后杀伤三项机制。
narrative_function: 把看似普通流感揭示为高度工程化袭击，兑现ETO无法接近地堡仍能刺杀的威胁。
transfer_rule: 生物手段作导弹应逐项对应载体、制导、目标识别和载荷释放，不能只因致命便军事化命名。
failure_boundary: 病毒会复制、变异并在人群传播，不按单枚导弹可控轨迹运行；基因相近者可能误伤，‘精准’不能绝对化。
