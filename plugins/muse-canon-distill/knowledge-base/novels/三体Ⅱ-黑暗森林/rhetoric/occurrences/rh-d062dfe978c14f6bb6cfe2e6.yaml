quote: 这是小题大做
sensory_mapping: 一行小题摆在纸上、答卷铺得过大、笔墨层层增加、旁观者嫌其过量
context_fact: 警察先断言坠车只是交通事故，大史坚持按可能谋杀报案；后来系统才开始四十八小时警务跟踪。
image_mechanism: 风险判断被换算成题目与答卷的尺寸比例，争议从‘是否有凶手’变成处置是否超额。
property_alignment: 1）事故对应题目；2）危险程度对应题目大小；3）谋杀调查对应作答规模；4）大史坚持对应扩写；5）警察经验对应评分标准；6）资源投入对应篇幅。
context_alignment: 未来低犯罪社会使警察惯于把事故判为小题，而大史来自高风险旧时代；成语简洁暴露双方基准差。
narrative_function: 用日常成语压低紧张，为大史的反常坚持保留悬念，并表现未来治安系统的自满。
transfer_rule: 处置失衡写成题目与答卷时，应给出双方对事件尺寸的不同估计以及投入为何被认为过大。
failure_boundary: 事件真实危险尚未查明，题目大小不能由表面事故率决定；立案也不等于浪费资源。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 未来警察认为大史把一次常见交通事故升级为谋杀案并要求立案，处置规模超过事件本身
vehicle: 面对一道内容很小的题目，却写出规格、篇幅和投入都过大的文章或工程
ground: 1）坠车事件对应小题；2）谋杀判断对应大文章；3）坚持报案对应大做；4）低事故率对应题目不寻常；5）警务资源对应写作投入；6）警方轻视对应认为比例失衡。
