tenor: 罗辑确认妻女被带走后，外部现实感瓦解，剧烈痛苦从四周压下并集中为心中的灼烧
vehicle: 世界结构熔塌成滚烫岩浆，从高处倾泻并汇入中心，随后被冷风和凉雨降温
ground: 1）安全生活对应稳定地层；2）真相冲击对应崩塌；3）痛苦流动对应岩浆下泻；4）情绪强度对应灼热；5）痛苦集中对应汇入心中；6）萨伊安慰与风雨对应冷却。
