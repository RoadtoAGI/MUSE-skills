quote: 感到周围的一切再次崩塌，化做岩浆自顶而下，但这次的岩浆是灼热的，都聚集在他的心中
sensory_mapping: 四壁熔塌、红热岩浆、向心汇流、凉雨降温
context_fact: 庄颜与孩子离开使五年家庭生活突然终止；萨伊说明她们在未来等候，一阵风又把清凉雨丝吹入门廊。
image_mechanism: 住宅和世界的坚固表面先失去形状，熔成高温液体朝罗辑坠落；外在冷风与语言安慰一起接触内在火流，温度才略降。
property_alignment: 1）罗辑生活世界对应地层建筑；2）失去妻女对应塌陷；3）悲痛对应岩浆；4）情绪集中对应汇流心脏；5）安慰和雨风对应冷却介质。
context_alignment: 上次爱情高潮曾写周围熔化、岩浆冰冷，此处用‘再次’反转温度：获得爱时冷，失去爱时灼热，形成精确回声。
narrative_function: 把家庭幻境崩溃写成全感官灾变，并用冷热反转区分爱情投入与被迫承担责任。
transfer_rule: 延展熔毁意象时，应保留先前物态框架并改变一项关键参数，如温度或流向，使新情境既呼应又分化。
failure_boundary: 环境没有物理崩塌，萨伊的话也只能短暂缓和情绪；若人物处于麻木或缓慢哀伤，爆发岩浆会夸大速度。
