chapter: 正文
figure_type: metaphor
quote: 宏原子核在禁锢磁场之中跳着永恒之舞
sensory_mapping: 线形舞者、磁场舞台、循环舞步、无尽节拍
context_fact: 泰勒在地下存贮库连续数小时凝视宏原子核，只有观看这种运动时才获得心灵宁静。
image_mechanism: 不可直观理解的微观运动被赋予身体与节拍，磁力约束划出舞台；重复轨迹由实验现象转成没有谢幕的表演。
property_alignment: 1）宏原子核对应舞者；2）运动轨迹对应舞步；3）禁锢磁场对应舞台；4）持续循环对应永恒演出。
context_alignment: 下句直接称其为‘这些线形物的舞蹈’并写催眠效果，人物观看方式使舞蹈并非孤立装饰，而是焦虑的镇静仪式。
narrative_function: 给冷硬武器材料以优美秩序，同时反衬泰勒战略被破壁前的焦躁与孤独。
transfer_rule: 以舞蹈写物理运动，应让轨迹、节律、边界和观看反应分别落到可观察现象上。
failure_boundary: 宏原子核没有意志也不随音乐编排；无规律碰撞或一次性衰变缺少可称为舞步的重复结构。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 线形宏原子核被磁场束缚后持续、规律地运动并呈现催眠般观感
vehicle: 舞者在限定舞台上按永不结束的节律反复旋转和移步
ground: 1）宏原子核对应舞者；2）磁场对应舞台边界；3）周期运动对应舞步；4）持续稳定对应永恒；5）观看入迷对应舞蹈催眠性。
