chapter: 正文
figure_type: analogy
quote: 现实中的她(他)只是他们创造梦中情人的一个模板
sensory_mapping: 模板轮廓、复制加工、成品对照、偏差测量
context_fact: 心理医生解释罗辑爱上虚构人物并非与普通爱情完全不同，只是他直接创造理想对象。
image_mechanism: 爱情对象被拆成现实底板和心中成品，人们并非直接拥抱模板，而是在其轮廓上加工一个梦中人。
property_alignment: 1）真人对应模板；2）想象对象对应制成品；3）理想化对应加工；4）关系磨合对应校正偏差；5）分手对应拒绝差异。
context_alignment: 医生需要把罗辑的极端案例放入普通心理连续谱，制作模型比道德判断更适合其解释性口吻。
narrative_function: 为罗辑去病理化，也揭示后文他按想象寻找真人时可能颠倒模板与成品。
transfer_rule: 模板类比分析投射时，应区分原型、选择过程、心理成品和差异反馈，不能把真人压成静态素材。
failure_boundary: 现实伴侣有独立主体性且会共同塑造关系，不只是被复制的模板；模型过强会合理化对他人的忽视。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 恋爱者以真实伴侣为基础形成、随后拿来爱与比较的内心理想对象
vehicle: 依据一个初始模板复制、加工并允许偏离原型的成品模型
ground: 1）现实伴侣对应模板；2）选择性观察对应取样轮廓；3）理想化想象对应加工成品；4）发现差异对应成品与模板比对；5）适应差异对应修正模型；6）罗辑无需真人对应无模板生成。
