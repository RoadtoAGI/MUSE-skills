quote: 脚下的大地同他的心一起变软了
sensory_mapping: 夕阳下沙地失去硬度、罗辑的心也像融软、双脚与意志同时下沉、告别姿势难以站稳
context_fact: 水滴预计即将撞击罗辑所在区域，他让大史离开，准备独自承受可能的死亡。
image_mechanism: 内外两个承重系统同步改变材质，心理崩软直接传到脚下空间，形成眩晕般失重感。
property_alignment: 1）地面对应外部支点；2）心志对应内部支点；3）决死压力对应热/溶剂；4）软化对应失去抵抗；5）虚弱对应下陷。
context_alignment: 罗辑过去依赖大地与家庭生活，此刻告别唯一同伴，真实沙漠与精神支点同时松散。
narrative_function: 在宏大救世判断后恢复普通人的身体恐惧，使最后独行不是英雄姿态的无缝延续。
transfer_rule: 内心软化与地面联动时，应明确共同承重功能、触发压力和身体后果，让环境成为感受器。
failure_boundary: 大地物理性质未变，站不稳也可能是生理应激；软并不等于罗辑放弃行动。
