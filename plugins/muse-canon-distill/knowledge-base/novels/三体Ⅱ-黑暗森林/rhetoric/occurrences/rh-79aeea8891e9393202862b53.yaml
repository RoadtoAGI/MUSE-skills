quote: 他感觉自己点燃了一个太阳
sensory_mapping: 太阳点火、金色强光、世界显现、中心光源升起
context_fact: 庄颜在壁炉的金色柔光里第一次显出面容，罗辑需以火柴灼痛确认自己没有做梦。
image_mechanism: 小小火柴的火芯在主观尺度上膨胀成恒星，光越过客厅边界，给梦中世界全部轮廓通电。
property_alignment: 1）壁炉火对应太阳；2）罗辑划火柴对应点燃恒星；3）庄颜与梦境对应被照亮世界；4）幸福对应辐射能量。
context_alignment: 现场真实点火与人物梦想成真同刻发生，夸张尺度表达罗辑主观宇宙被重建，且紧接金色显影。
narrative_function: 把庄颜到来确立为罗辑私人世界的中心事件，也暴露其情感投射规模。
transfer_rule: 微小光源升格为恒星时，应让它确实改变人物所见世界，并用视野或情绪尺度解释物理夸张。
failure_boundary: 壁炉无法照亮外部世界，庄颜也非罗辑生活的客观唯一中心；离开强烈主观视角便显得失真。
