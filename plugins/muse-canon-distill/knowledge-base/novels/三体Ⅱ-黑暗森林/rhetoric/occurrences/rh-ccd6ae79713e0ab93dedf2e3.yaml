tenor: 金字塔灯光与喷泉在二人进入时同时启动，使闭馆后的卢浮宫由静暗转为明亮有声
vehicle: 沉睡的巨大生命听见来客后睁眼、活动并发出声音
ground: 1）熄灯安静对应睡眠；2）灯全亮对应睁眼；3）喷泉启动对应呼吸活动；4）二人到来对应唤醒触发；5）庄颜不安对应惊动生命。
