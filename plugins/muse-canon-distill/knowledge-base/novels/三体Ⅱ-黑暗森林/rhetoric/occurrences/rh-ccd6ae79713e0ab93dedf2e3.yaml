quote: 对卢浮宫因他们的到来而苏醒感到很不安
sensory_mapping: 宫殿沉睡、灯眼睁开、喷泉呼吸、来客惊醒
context_fact: 深夜卢浮宫为安全安排而临时开放，金字塔亮灯和喷泉启动恰在二人到达时发生。
image_mechanism: 建筑的灯变成眼睛，喷泉水声变成醒后呼吸；机械联动被庄颜误读为整座宫殿对脚步作出生命反应。
property_alignment: 1）卢浮宫对应沉睡生物；2）黑暗静止对应睡眠；3）亮灯对应醒来；4）喷泉对应活动；5）来访对应唤醒。
context_alignment: 庄颜随后像怕惊醒沉睡之物的孩子轻步，苏醒框架先赋予整座博物馆生命，再规定她的行为。
narrative_function: 把包场特权转成对艺术圣境的冒犯感，显出庄颜敬畏和罗辑权力之间的张力。
transfer_rule: 建筑苏醒应安排至少两类设施由静转动，并让人物把同步启动误读为对自身到来的回应。
failure_boundary: 灯和喷泉由工作人员控制，卢浮宫没有意识；白昼常态运行时使用苏醒会失去前后状态差。
