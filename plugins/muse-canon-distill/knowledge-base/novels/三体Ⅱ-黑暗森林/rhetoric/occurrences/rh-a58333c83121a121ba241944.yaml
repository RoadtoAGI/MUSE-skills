chapter: 正文
figure_type: metaphor
quote: 只是地球放出的风筝，有一根精神之线把他们与地球相连，现在这根线断了
sensory_mapping: 地球手掌放出五艘风筝、精神细线跨越太空、末日让手与线同时消失、飞船在深渊中无牵引漂去
context_fact: 东方认为这是人类第一次真正进入太空，因为五舰与任何世界无联系，周围只有太空深渊。
image_mechanism: 物理距离与精神依附被一根可拉可断的线统一，关键递进从‘手松开’转为‘手消失’，切断回归主体本身。
property_alignment: 1）地球文明对应放飞之手；2）飞船对应风筝；3）通信亲缘对应牵线；4）太阳系外航行对应高飞；5）末日预期对应手消亡；6）新人类对应断线风筝。
context_alignment: 风筝常象征仍可归家的远行，星舰不归航正需要这一日常模型说明何谓‘真正进入太空’。
narrative_function: 给五舰心理突变提供核心因果模型，并把资源危机之外的精神断根明确说出。
transfer_rule: 远行依附作风筝线时，应区分距离、牵引、返航、断线与放线者是否仍在，层层推进断联程度。
failure_boundary: 飞船有自主动力和治理能力，不会像断线风筝完全失控；通信尚可存在，断裂主要是精神与未来预期。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 过去的太空旅行者无论多远仍受地球社会、亲缘与返航预期支撑，五舰如今因地球精神消亡而彻底失去联系
vehicle: 风筝由地面的人放出，飞得再高仍靠线牵引、供给方向并保证可收回；线断后只在空中漂失，拉线者也不复存在
ground: 1）航天器对应风筝；2）地球对应放飞者与地面；3）精神归属对应风筝线；4）远航对应升空；5）返航可能对应收线；6）地球末日对应拉线手消失。
