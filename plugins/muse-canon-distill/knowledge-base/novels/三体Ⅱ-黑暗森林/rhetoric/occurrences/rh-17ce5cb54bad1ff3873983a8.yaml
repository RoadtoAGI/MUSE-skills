quote: 能用生命作为武器打击敌人的武装力量
sensory_mapping: 生命装弹、人体发射、目标命中、牺牲爆发
context_fact: 泰勒希望把敢死精神保存到末日之战，用于需要抵近攻击的球状闪电武器。
image_mechanism: 人的身体与未来被压缩进弹体，意志成为引信；接近敌人时，生命本身作为最后一份可消耗能量释放。
property_alignment: 1）战士生命对应武器；2）献身意志对应引信；3）抵近行动对应发射；4）敌人损失对应杀伤。
context_alignment: 说话者正在比较装备不足后的战斗手段，生命—武器转写揭示泰勒计划真正依赖的不是技术而是可消耗的人。
narrative_function: 把英雄主义背后的工具化逻辑显形，为老人指出仇恨才是组织武器做铺垫。
transfer_rule: 生命作武器应交代谁将其装填、如何触发、打击何物以及不可回收代价，避免只作壮烈口号。
failure_boundary: 人有主体意愿和伦理权利，不是可任意部署的弹药；牺牲也不保证军事效果或道德正当。
