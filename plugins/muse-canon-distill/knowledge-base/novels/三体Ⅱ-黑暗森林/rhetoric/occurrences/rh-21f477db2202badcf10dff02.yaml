tenor: 哈里斯用“入侵可能不真实”的怀疑保护自己免受确定末日事实压垮的心理状态
vehicle: 一个可以居住终生、隔绝外界痛苦并给予庇护的安慰空间
ground: 1）怀疑降低恐惧对应安慰止痛；2）愿终生保持对应在其中居住；3）证据确认对应庇护被拆除；4）哭泣对应暴露在现实；5）最后幸运消失对应保护层破裂。
