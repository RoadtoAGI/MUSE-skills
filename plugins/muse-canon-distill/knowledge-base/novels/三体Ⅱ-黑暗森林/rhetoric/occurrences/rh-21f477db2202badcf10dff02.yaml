quote: 我知道怀疑只是一种安慰而已，但我想在这安慰中过完这一生
sensory_mapping: 安慰居所、庇护包围、现实闯入、保护层坍塌
context_fact: 模型证实三体舰队尾迹，年轻工程师哭泣，承认自己一直靠怀疑度过危机生活。
image_mechanism: 一种认知立场从判断变成可藏身房间，哈里斯本想关门住到死；观测证据像强光拆墙，使他被迫面对外界。
property_alignment: 1）怀疑对应庇护所；2）哈里斯对应居住者；3）一生维持对应长期居住；4）证据对应拆除力量；5）安慰消失对应无处躲藏。
context_alignment: “过完一生”把安慰明确空间化，控制室的集体压抑说明这并非学术争论，而是心理生存装置。
narrative_function: 呈现确认入侵对普通技术人员的精神代价，并让科学真相与人类承受力发生冲突。
transfer_rule: 信念作庇护应交代它遮挡哪种现实、居住者为何依赖以及何种证据能拆除，避免简单称自欺。
failure_boundary: 怀疑也可能是合理科学态度，不全等于逃避；安慰被打破不证明哈里斯之后必然崩溃。
