quote: 那儿就成了地狱
sensory_mapping: 人工城市灯光熄灭、生命系统停转、封闭地下空间化为受难场、人群向唯一出口涌动
context_fact: 舰队毁灭引发城市精神失控，大史担心人工生态出问题后地下居民全部拥向地面。
image_mechanism: 复杂基础设施风险被压成一个人人熟知的极端苦难空间，封闭性使警告具有立即行动力。
property_alignment: 1）地下封闭对应地狱无出口；2）生态崩溃对应持续苦难；3）失控人群对应受难群体；4）地表迁移对应逃离。
context_alignment: 大史说话直接、重行动，使用极端日常词迅速统一会议风险判断，符合其警察经验与口吻。
narrative_function: 把宏观失败落到社区迁移决策，推动冬眠者从情绪旁观转入现实生存准备。
transfer_rule: 失效环境作地狱时，应列出封闭条件、具体苦难和逃逸窗口，让强词由事实支撑。
failure_boundary: 地下城尚未实际失灵，地狱是风险情景而非现状；居民仍可能通过维护和疏散减灾。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 地下城人工生态若失灵，将出现拥挤、资源中断、秩序崩溃与大量死亡，居民难以逃生
vehicle: 地狱是封闭、痛苦、惩罚和死亡持续发生的空间，身处者无法靠自身摆脱
ground: 1）地下城对应封闭冥界；2）生态故障对应酷刑环境；3）居民对应受难者；4）出口拥堵对应无法逃离；5）死亡风险对应地狱后果。
