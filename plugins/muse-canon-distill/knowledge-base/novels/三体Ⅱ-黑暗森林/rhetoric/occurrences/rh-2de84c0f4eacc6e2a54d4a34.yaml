chapter: 正文
figure_type: simile
quote: 过去就像攥在手中的一把干沙
sensory_mapping: 一生化成掌中干沙、罗辑用力合拢手指、细粒在两百年间无声漏落、张手时几乎全空
context_fact: 他检索中学、初恋等早年经历，发现多数只剩问题，无法恢复情感和连续细节。
image_mechanism: 主动保存与被动流失在同一手势中对抗，细粒尺度解释遗忘为何难以逐次察觉却最终巨大。
property_alignment: 1）回忆单位对应沙粒；2）意志保存对应握力；3）遗忘通道对应指缝；4）时间长度对应漏沙时长；5）记忆余量对应掌中剩沙。
context_alignment: 人物正坐在真实沙漠，触手可及的干沙为记忆损耗提供即时触觉，极其贴合临终地点。
narrative_function: 把抽象遗忘转成无法靠用力阻止的身体过程，加重罗辑一生所剩无几的哀感。
transfer_rule: 过去作掌中沙时，应写握力、粒径、漏失路径、时间和张手检查，让徒劳保存可被触摸。
failure_boundary: 记忆不是固定粒子总量，新经验会重构旧事；用力回想有时能恢复线索而非只加速流失。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑自以为牢牢记住过去，实际经历在漫长时间中不断遗忘，到临终回望时所剩无几
vehicle: 手掌用力攥住干沙，细粒仍从指缝持续漏下；握得越久，掌中越空且难察觉每粒离开
ground: 1）过去事件对应沙粒；2）记忆控制对应手握；3）时间对应持续漏失；4）遗忘对应穿指缝；5）自信记得对应攥紧错觉；6）最终空白对应沙流光。
