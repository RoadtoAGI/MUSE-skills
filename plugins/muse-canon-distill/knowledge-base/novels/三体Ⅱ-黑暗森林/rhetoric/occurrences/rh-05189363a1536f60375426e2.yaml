chapter: 正文
figure_type: simile
quote: 张援朝看到他如同沙漠中的旅人遇到同行者，拉住不放。
sensory_mapping: 空间、孤独、动作
context_fact: 从不关心大事的张援朝刚被危机震动，正独自在家望城，门铃响后见到一向谈论国家大事的老杨。
image_mechanism: 把信息与情绪上的孤立扩展成缺水、无路的荒漠行走，再让“拉住不放”成为抓住同伴的求生动作。
property_alignment: 1）独处恐慌对应沙漠孤旅；2）老杨懂大事对应可能辨路的同行者；3）拉住不放对应避免再次落单。
context_alignment: 老张过去嘲笑老杨关心大事，此刻角色倒置；同行者意象精确表现他第一次需要老杨的知识与陪伴。
narrative_function: 用一个动作标出普通人心理秩序被危机翻转，也迅速建立两位老人接下来对话的依赖关系。
transfer_rule: 写人物突然需要他人时，可把抽象困境具体化为共同穿越的环境，并让见面动作承担求援强度。
failure_boundary: 若人物只想寒暄、并不感到孤立或无方向，沙漠求同行者会夸大关系和危机程度。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 张援朝在危机恐慌中见到能讨论世界局势的邻居杨晋文
vehicle: 独自在沙漠跋涉者突然遇到同行人
ground: 1）张援朝独自承受陌生恐慌对应旅人孤行；2）世界危机缺少可把握方向对应沙漠无路标；3）拉住邻居求谈对应旅人急切结伴。
