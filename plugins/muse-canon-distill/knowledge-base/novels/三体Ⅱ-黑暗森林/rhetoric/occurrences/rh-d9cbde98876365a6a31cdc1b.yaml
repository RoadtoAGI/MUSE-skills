quote: 像普通人看一部艰深的数学著作，要经过大量的思考并且充分发挥想象力才能弄懂一点儿。
sensory_mapping: 认知难度、学习过程、理解比例
context_fact: 三体文明刚承认自身欺骗和伪装十分简陋，随后说只看懂《三国演义》一小部分。
image_mechanism: 把跨文明心智鸿沟换成普通读者面对高等数学的阅读挫败，难度、耗时和有限收获都有熟悉尺度。
property_alignment: 1）缺乏欺骗经验对应缺乏数学训练；2）重建计谋对应补推证明；3）只懂一小部分对应只能理解少量章节或结论。
context_alignment: 三体字幕选择人类也能体会的学习困难来说明自身局限，语气保持分析性，符合跨文明解释场景。
narrative_function: 证明智子全知信息并不等于三体人能理解人类，为面壁计划的可行性留下认知缝隙。
transfer_rule: 表现理解鸿沟时，比较双方的先备知识、推理成本和可达到的理解比例，避免只说对象“很难”。
failure_boundary: 数学难度可随训练消除，而文明心智差异未必；该类比不能保证三体人最终一定能完整学会欺骗。
