quote: 铅色的时光之路在他们面前徐徐展开，在漫长的延伸中隐入未来的茫茫迷雾中。
sensory_mapping: 视觉、空间、重量、色彩
context_fact: 常伟思刚说明在场军人终生看不到舰队，第十几代子孙才会迎战三体舰队。
image_mechanism: 把不可亲历的几百年横放为从脚下延伸的道路：近处沉重可见，中段被雾遮蔽，终点只剩战争颜色。
property_alignment: 1）道路长度对应代际时长；2）迷雾对应未来未知；3）火与血对应已知战争终局；4）军人心灵飞越对应目光越过道路。
context_alignment: 军人被要求为自己不能抵达的战场工作，道路让“开始却走不到终点”的使命具有身体尺度。
narrative_function: 凝结创军者的代际悲剧与职业忠诚，把会议信息转成一幅可共同凝视的未来。
transfer_rule: 将长期进程写成道路时，应分别安排近处可控、中段未知、远端确定后果，并用颜色或材质标出情绪重量。
failure_boundary: 未来若完全可预测，迷雾不成立；若连战争终点也不确定，远处火与血会越过角色可知范围。
quality_assessment: exemplary
