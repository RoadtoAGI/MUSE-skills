review_status: reviewed
tenor: 太空军跨越三个世纪、由后代走向战争的未来历程
vehicle: 一条铅灰长路伸入迷雾，尽头闪着火焰与血光
ground: 1）数世纪进程对应漫长道路；2）无法得知后代细节对应前路没入迷雾；3）确定将有战争对应远端可见火焰血光；4）铅色对应沉重压抑。
