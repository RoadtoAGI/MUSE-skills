chapter: 正文
figure_type: simile
quote: 这间光线黯淡的老宅像一个小型的地质博物馆
sensory_mapping: 暗室展柜、射灯照石、标本环壁、工作台观察
context_fact: 章北海为制作陨石弹头拜访收藏者，进入胡同深处光线黯淡的老宅。
image_mechanism: 住宅墙面被展柜接管，日常家具退居暗处，每块不起眼石头在独立灯束下获得展品位置。
property_alignment: 1）老宅对应博物馆；2）玻璃柜对应展柜；3）陨石对应标本；4）专业灯对应展览照明。
context_alignment: 类比由可核室内设施和收藏活动支撑，也展现主人把私人“小世界”经营成制度化知识空间。
narrative_function: 快速建立收藏者专业可信度，合理化章北海能取得特定物性陨石。
transfer_rule: 私人空间像博物馆应列出陈列、照明、分类和研究行为，不能只因物品多便命名。
failure_boundary: 老宅不对公众开放，也未说明完整分类与说明牌；普通杂乱收藏室不具博物馆秩序。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 陨石收藏者四合院老宅中以专业方式陈列大量石样的室内空间
vehicle: 规模不大但有玻璃展柜、专业照明与系统藏品的地质博物馆
ground: 1）四壁玻璃柜对应展柜；2）陨石藏品对应地质标本；3）专业灯光对应博物馆照明；4）主人用放大镜研究对应专业人员；5）数量丰富对应常设陈列。
