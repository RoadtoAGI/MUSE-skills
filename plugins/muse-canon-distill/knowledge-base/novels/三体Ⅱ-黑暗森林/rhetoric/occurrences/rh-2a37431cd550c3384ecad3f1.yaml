quote: 枪声像爆炸般震耳欲聋
sensory_mapping: 狭室轰响、墙面回声、耳膜受压、硝烟充鼻
context_fact: 章北海在隐蔽地下室测试四发陨石子弹，空间狭小且没有吸声环境。
image_mechanism: 本来短促的枪响被墙壁反复折回，听觉体积膨胀成爆炸；紧随的硝烟味又补足爆炸现场的嗅觉。
property_alignment: 1）手枪击发对应爆炸；2）声波反射对应冲击波；3）地下室对应封闭爆点；4）章北海听觉对应受冲击者。
context_alignment: 类比依靠封闭空间的真实声学放大，而不是夸大神器威力，也让秘密试验的危险近距离压到人物身上。
narrative_function: 以强声切开安静准备过程，确认陨石弹首次实射并提高暗杀临近感。
transfer_rule: 声响比爆炸应提供封闭空间、低频冲击或身体反应等响度证据，避免任何突发声音都套用。
failure_boundary: 手枪能量远低于爆炸，室外或有消声装置时听感不会成立；类比只描述感受，不代表破坏范围。
