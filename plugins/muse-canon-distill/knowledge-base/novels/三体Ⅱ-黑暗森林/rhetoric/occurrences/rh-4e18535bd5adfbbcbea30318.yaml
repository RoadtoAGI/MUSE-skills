tenor: 地下城极密集狂欢人群的发光衣服连成大范围持续闪耀的整体
vehicle: 阳光下海面由无数波片共同反光，亮点随波起伏并融合成无边光域
ground: 1）人群对应海水；2）单件亮衣对应波光；3）拥挤覆盖对应海面；4）人群运动对应波动；5）最大亮度对应强反光；6）广场对应海盆。
