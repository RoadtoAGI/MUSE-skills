quote: 每个人的衣服都调到了最大亮度，构成一片闪耀的光海
sensory_mapping: 人潮铺满广场、衣服化成万点波光、个体边界消失、城市涌起闪耀海面
context_fact: 真正日出后，地下城市居民离开巨树涌入街道广场庆祝即将到来的谈判与胜利。
image_mechanism: 数量把离散发光个体融合成连续介质，视觉亮度与群体情绪共同起伏。
property_alignment: 1）狂欢者对应海水单元；2）衣服光对应波光；3）广场人群对应海面；4）走动欢呼对应波涛；5）集体情绪对应潮势。
context_alignment: 未来服装能真实发光，‘光海’同时准确概括物理景象和群体热潮，不依赖空泛夸张。
narrative_function: 将一个社区的误判扩展为整个人类世界的视觉性狂热。
transfer_rule: 发光人群作海时，应让密度、覆盖、个体波光和群体运动四项共同融合。
failure_boundary: 人群仍由独立个体组成，光海不能证明意见一致或判断正确；也没有真实液体。
