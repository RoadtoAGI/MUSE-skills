chapter: 正文
figure_type: metaphor
quote: 就把你的过去当做一场梦吧
sensory_mapping: 漫长睡眠断开年代、醒眼见新世界、旧恐惧退成梦影、晨光接管现实
context_fact: 护士在展示地下北京的蓝天、飞行交通和繁荣生活后离开，罗辑随即产生强烈新生感并接受这句话。
image_mechanism: 真实的冬眠给历史断裂提供睡醒结构，两个世纪的客观事件因缺乏主观时间而被压缩成一夜梦境。
property_alignment: 1）危机纪元初年对应梦境；2）一百八十五年冬眠对应睡眠；3）未来苏醒对应清晨睁眼；4）面壁恐惧对应噩梦；5）繁荣城市对应醒后安全房间；6）身份终止对应梦不再约束。
context_alignment: 说话者属于没有家庭制度、轻视旧危机的未来，她的劝告符合时代自信；对罗辑却有诱惑性，因为过去仍含妻女和咒语。
narrative_function: 确立罗辑短暂的重生错觉，随后用‘过去还是找上门’和咒语真相逐层击破。
transfer_rule: 历史断层作梦时，应让入睡、主观跳时、醒后新环境和旧事失效逐项对应，同时保留梦中未解决的牵连。
failure_boundary: 过去确实发生且仍产生法律、亲情和战略后果；梦的虚假性不能抹去责任，也不能证明未来安全。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 护士劝罗辑把旧时代的危机、责任、家庭与恐惧视为已经结束且不必再支配现实的经历
vehicle: 睡醒后退到意识背后的梦境，曾经逼真却已失去对清醒世界的实际效力
ground: 1）旧时代经历对应梦；2）冬眠对应睡眠；3）苏醒对应醒来；4）未来城市对应清醒现实；5）旧危机对应噩梦内容；6）放下过去对应不再追究梦境。
