quote: 用金属探测器找，简直是大海捞针
sensory_mapping: 无边海面、细针沉底、工具扫寻、偶然捞获
context_fact: 铁陨石只占陨石总数百分之五，收藏者曾在沙漠搜寻并因陷车差点丧命。
image_mechanism: 沙海的‘海’被字面激活，黄沙获得海水的无边尺度，沉在其中的暗色陨石缩成针尖大小的稀有目标。
property_alignment: 1）沙漠对应海；2）铁陨石对应针；3）收藏者对应捞针者；4）金属探测器对应捞具；5）搜寻风险对应深海险境。
context_alignment: 真实地点就是沙漠，成语中的大海与‘沙海’自然叠合，既说明稀缺性又为高价作铺垫。
narrative_function: 用常规成语快速量化采集成本，并间接提高章北海选择这些弹头材料的特殊性。
transfer_rule: ‘大海捞针’应同时满足搜索空间极大、目标极小且缺少精确坐标，已有定位时不宜沿用。
failure_boundary: 金属探测器能显著缩小搜索难度，陨石也比针大；该说法出自卖家，有抬价动机。
