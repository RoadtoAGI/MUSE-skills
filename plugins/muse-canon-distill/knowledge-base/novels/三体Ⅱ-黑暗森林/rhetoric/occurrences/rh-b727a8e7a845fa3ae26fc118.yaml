chapter: 正文
figure_type: simile
quote: 显示界面从半空中像雪片般疯狂地跳出
sensory_mapping: 白色信息窗如雪片炸出、半空瞬间下起数据暴雪、每片都带导弹警告却来不及看清
context_fact: 导弹已突破防御，从警报到爆炸只有四秒，大量系统窗口同时呈现来袭资料。
image_mechanism: 数字过载被天气化为三维颗粒，界面越多，信息可用性反而越低，视野被警告本身覆盖。
property_alignment: 1）窗口矩形对应雪片；2）弹出频率对应降雪；3）空间散布对应飘飞；4）信息过量对应白茫遮蔽；5）四秒期限对应暴雪突至。
context_alignment: 纯白舰舱与白色雪片同色，警告界面在视觉上融入环境，进一步表现系统虽报警却无法救人。
narrative_function: 把来袭数量和反应时间压缩成一幅过载画面，说明没有人能从信息中组织防御。
transfer_rule: 界面群作雪片时，应匹配形状、生成密度、空间遮蔽与读取失败，让信息视觉化同时表现无效。
failure_boundary: 窗口可冻结、筛选和排序，不受重力飘落；雪片无语义，界面每个都含具体警报。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 防御系统在极短时间内弹出数量巨大的来袭导弹信息窗口，迅速充满视野且无法逐项阅读
vehicle: 暴雪中无数雪片从空中连续出现、方向杂乱地飘落，密集遮住观察者视线
ground: 1）信息界面对应雪片；2）大量弹出对应暴雪密度；3）半空出现对应飘落；4）窗口移动对应翻飞；5）无法阅读对应雪幕遮挡。
