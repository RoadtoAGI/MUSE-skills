chapter: 正文
figure_type: simile
quote: 就像调高了一个显示屏的亮度
sensory_mapping: 屏幕发光、亮度滑杆、同图增亮、冷色电子感
context_fact: 罗辑用幽默回应凶手，凶手仍维持原有笑容，只是笑意更鲜明。
image_mechanism: 面孔转成显示器，情绪并未换台，只把既有图像的发光参数推高一格。
property_alignment: 1）面孔对应屏幕；2）笑容形态对应图像；3）鲜明增强对应亮度提高；4）受控反应对应参数调节。
context_alignment: 凶手的笑已被写成固定表层，显示屏比自然情绪更机械，贴合其训练有素、程序化的镇定。
narrative_function: 以微小视觉参数变化继续刻画凶手，让读者在不变笑容中读出强度升级。
transfer_rule: 设备参数比喻适合“形态不变、强度变化”的表情；应明确保持项与被调节项。
failure_boundary: 亮度只描述可见强度，不说明笑意真诚度；表情结构改变时不能仍归为单一参数。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 凶手原有淡笑突然变得更加鲜明可见
vehicle: 保持同一画面内容、只把显示屏发光强度向上调节
ground: 1）笑的形态不变对应画面内容不变；2）鲜明程度增加对应亮度上调；3）变化平滑可控对应电子调节；4）面孔被观看对应屏幕呈像。
