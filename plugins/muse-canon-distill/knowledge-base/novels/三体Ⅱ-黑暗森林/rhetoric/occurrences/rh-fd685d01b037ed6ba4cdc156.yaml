chapter: 正文
figure_type: simile
quote: 爆心处出现了一座缓缓隆起的山峰，像一个苏醒的巨人的脊背
sensory_mapping: 大地拱背、山体缓抬、巨躯醒转、峰顶骤裂
context_fact: 环形冲击波过后，地下火球持续上顶地层，隆起山峰升至约三千米才整体爆发。
image_mechanism: 地质运动被赋予躯体关节，平地不再是无生命表面，而像沉睡庞然之物用背部缓慢撑起世界。
property_alignment: 1）水星地层对应巨人身体；2）山峰对应脊背；3）爆压上顶对应肌肉发力；4）缓慢隆起对应苏醒动作；5）三千米尺度对应巨躯。
context_alignment: ‘苏醒’只持续到山峰爆开，准确包住爆前蓄力阶段；与后文‘怒发’共同形成行星被激活的身体图景。
narrative_function: 给缓慢隆起注入即将失控的生命感，延迟爆发并增强观测者的敬畏。
transfer_rule: 地表隆起作巨人动作时，应对齐弧形轮廓、抬升速度和潜在力量，让生命化集中于一个连续阶段。
failure_boundary: 山峰由爆压和破裂形成，没有意识、骨骼或自主苏醒；后续炸散也不是巨人真实起身。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 地下核爆把爆心上方地层顶起，形成缓慢升至数千米的弧形山体
vehicle: 沉睡巨人醒转时伏卧身体拱起、逐渐抬高的宽阔脊背
ground: 1）隆起地层对应巨人脊背；2）山峰弧面对应背部曲线；3）缓慢抬升对应苏醒翻身；4）行星尺度对应巨人体量；5）随后的爆发对应巨力挣动。
