chapter: 正文
figure_type: metaphor
quote: 时间的巨掌已经抚平了一切
sensory_mapping: 巨掌越过平原、灾难皱痕被慢慢压低、喧嚣退去、黄沙平展到天边
context_fact: 张延讲述饥饿大进军后，罗辑从窗外只见正午阳光下安静延伸的黄沙，看不到当年数千万人的苦难。
image_mechanism: 时间获得与地景同尺度的手，历史事件被转为土地表面的起伏；持续触摸消除可见痕迹，却也像安抚伤口。
property_alignment: 1）百余年时间对应巨掌；2）灾难现场对应皱纹伤痕；3）变迁遗忘对应抚摸；4）沙漠平静对应平面；5）死者声音对应被压下的起伏；6）罗辑眺望对应检查掌后地表。
context_alignment: 窗外确是一望无际的平坦沙地，触觉动作与物理地貌吻合；‘抚’兼具温柔与抹除，承载纪念的矛盾。
narrative_function: 把口述灾难与静默现景扣在一起，提示历史平息表面并未取消死亡重量。
transfer_rule: 时间作手掌时，应选择能保存或消除痕迹的具体表面，并区分安抚、磨损和抹除各自的情感效应。
failure_boundary: 历史后果仍存在于人口、生态和制度中，并未被全部抹去；平静景观也不能代表创伤已经治愈。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大低谷的逃荒、死亡和社会崩溃在一百多年后不再留有剧烈可见的现场起伏，只剩平静沙漠与记忆
vehicle: 一只覆盖广阔土地的巨大手掌长期来回摩挲，把皱褶、伤痕和突起逐渐压成平面
ground: 1）时间对应巨掌；2）历史创伤对应皱褶；3）年代流逝对应持续抚摸；4）现场消失对应被压平；5）华北平原对应掌下表面；6）平静沙漠对应平整结果。
