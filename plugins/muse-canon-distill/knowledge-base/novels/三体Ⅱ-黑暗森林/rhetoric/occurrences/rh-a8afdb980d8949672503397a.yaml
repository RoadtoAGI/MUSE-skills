quote: 她需要这里的呵护，这是她的城堡
sensory_mapping: 城墙合围、吊桥收起、守卫巡护、少女居中
context_fact: 庄颜初到便毫无戒心接受酒，罗辑认定整个世界都潜伏着对她的伤害，只有此处安全。
image_mechanism: 湖山庄园的开放美景在罗辑心中竖起防御墙，警卫与面壁权力成为不可见城垛，把庄颜包在中心。
property_alignment: 1）庄园对应城堡；2）庄颜对应受护者；3）罗辑与警卫对应守卫；4）外部社会对应攻城者。
context_alignment: 庄园确有严密警卫且与外界隔绝，城堡既贴合物理防护，也暴露罗辑把庄颜脆弱化和占有化的视角。
narrative_function: 为五年私人乐园提供保护逻辑，并预示PDC仍可越过这座城堡带走妻儿。
transfer_rule: 安全空间如城堡应列明边界、守卫、外部威胁和被护对象，同时保留保护可能转为控制的代价。
failure_boundary: 庄颜并非无力自保的被动居民，庄园也挡不住制度权力；若无真实威胁与防护，城堡只是浪漫占有。
