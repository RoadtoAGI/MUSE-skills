review_status: reviewed
tenor: 核聚变推进研究一度让人看到飞船突破，却因核星连续失控和预期智子障碍而重新失去乐观依据
vehicle: 黑暗中刚亮起的光源迅速减弱，照出的道路与前景重新被暗色吞没
ground: 1）技术成功可能对应光；2）失败主义对应黑暗；3）核聚变突破对应点亮；4）核星爆发对应变暗；5）未来道路对应被照区域；6）希望破灭对应光熄灭。
