quote: 刚刚出现的希望之光又黯淡了
sensory_mapping: 夜空核星骤亮、光点熄灭、道路重暗、城市灯海徒然灿烂
context_fact: 常伟思与希恩斯刚目睹本月第三次核星爆发，聚变堆功率仍仅达目标百分之一且约束反复失败。
image_mechanism: 真实夜空中的聚变亮光与抽象希望重叠；核星物理熄灭的同时，技术前景也失去照明。
property_alignment: 1）核星光芒对应希望；2）推进技术前景对应被照道路；3）实验失败对应光黯淡；4）智子障碍对应前方黑暗；5）失败主义回潮对应夜色加深。
context_alignment: 比喻直接从刚消失的核星光芒生长，景物与政治情绪同频，避免泛用‘希望之光’的空悬。
narrative_function: 把一次工程失败连接到全球失败主义回潮，为希恩斯提出思想钢印提供情势压力。
transfer_rule: 希望作光时，应把现场光源、照亮对象、变暗原因和人物前景逐项连上，使惯用意象重新具体。
failure_boundary: 一次失败不等于全部希望熄灭，城市灯仍亮且技术仍推进；光暗只表现此刻趋势判断。
quality_assessment: effective
