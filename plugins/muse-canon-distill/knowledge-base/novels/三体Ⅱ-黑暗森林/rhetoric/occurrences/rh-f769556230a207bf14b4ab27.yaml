sensory_mapping: 长睡像孕育期结束、章北海睁眼进入新世界、父亲目光撤去、个人生命重新起步
context_fact: 他睡十五小时醒来，审视内心后意识到父亲已不在，自己成为真正独立的人。
image_mechanism: 一次普通醒睡被扩大为身份出生，使命与父亲目光的消失共同切断旧人生脐带。
property_alignment: 1）长眠对应孕育；2）醒来对应出生；3）责任卸下对应脱离旧体；4）思想自由对应新生命展开。
context_alignment: 后文舰队成员被写成割断脐带的婴儿，章北海的私人新生先为集体出生意象奠基。
narrative_function: 把战役后的叙事焦点从毁灭转到星舰社会起点，并揭示章北海心理阶段转换。
transfer_rule: 身份转折作新生时，应给出旧生命的终止条件、脱离动作和新能力，而非只写情绪焕然。
failure_boundary: 章北海的身体与记忆连续存在，新生只描述心理角色变化，不意味着过去责任消失。
