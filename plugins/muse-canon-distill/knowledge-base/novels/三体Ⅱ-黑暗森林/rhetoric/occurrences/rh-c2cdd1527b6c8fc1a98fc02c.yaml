chapter: 正文
figure_type: simile
quote: 如水的宁静笼罩着一切
sensory_mapping: 包裹感、平滑水面、低温、细小涟漪
context_fact: 惠子轻声说话后竹林夏虫停止鸣叫，她在沉寂中听到丈夫叹息。
image_mechanism: 声音退去留下的空白获得液体体积，从竹叶间缓慢涨起，把人、竹和叹息一起浸住。
property_alignment: 1）寂静对应静水；2）竹林空间对应容器；3）夫妻对应水中物；4）叹息对应微波；5）笼罩对应水位漫过。
context_alignment: 前文月光常使希恩斯宁静，此处无月，环境本身以“水”接替月光的柔和作用；静水贴合东方庭院语调。
narrative_function: 清空听觉背景，突出希恩斯的叹息和无法完成使命的压力。
transfer_rule: 水写静默时，应选择具体水态，并让覆盖范围、表面扰动与下一声响建立关系。
failure_boundary: 水也可奔涌嘈杂，“如水”只有在平静、无风的语境中成立；用于紧促冲突会过软。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 虫鸣骤停后充满竹林、包围夫妻二人的深夜寂静
vehicle: 无声铺展并浸没空间、把物体包在其中的静水
ground: 1）宁静遍及四周对应水充满容器；2）人物被包围对应身体浸入；3）虫声停止后的平滑感对应无波水面；4）轻声叹息清晰可闻对应静水中微小扰动。
