chapter: 正文
figure_type: simile
quote: 前沿物理学如一池死水般停滞不前
sensory_mapping: 封闭水池、表面无波、浑水不流、岸边等待
context_fact: 八年巨量投入使既有技术加速冲刺，但理论储备持续消耗，前沿物理未能突破智子障碍。
image_mechanism: 学科发展从时间曲线变成水体运动，技术仍向前冲，而物理池面被封死，既无新水注入也无流向。
property_alignment: 1）前沿物理对应池水；2）理论创新对应流动；3）实验反馈对应入水；4）智子障碍对应封闭堤岸；5）停滞对应无波。
context_alignment: 同句以冲刺写技术前进，死水写理论停住，动与静的并置准确揭示应用消耗库存而基础不再补给。
narrative_function: 解释技术繁荣为何只是末日前冲刺，并为随后多条研究路线撞墙提供总判断。
transfer_rule: 领域作死水应说明输入、循环和出口为何同时消失；只有速度变慢而仍有补给时更适合缓流。
failure_boundary: 停滞可能是测量受阻而非理论完全无活动，数学与工程仍能进展；死水意象会压平学科内部差异。
quality_assessment: effective
