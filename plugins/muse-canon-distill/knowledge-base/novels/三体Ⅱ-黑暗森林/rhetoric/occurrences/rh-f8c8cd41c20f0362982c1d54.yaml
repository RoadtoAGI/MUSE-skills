quote: 像宇宙暗夜中时隐时现的一张阴沉的巨脸
sensory_mapping: 宇宙熄暗、火球一闪便托出苍白脸廓、下一瞬巨脸又沉回黑夜
context_fact: 舰队残骸形成持续膨胀的金属云，内部战舰爆炸的火球不断照亮其苍白边缘。
image_mechanism: 无定形残骸云被拟合为表情面孔，间歇照明像意识闪现，使战场废墟成为俯视幸存者的死亡脸。
property_alignment: 1）金属云边缘对应脸部轮廓；2）火球照明对应面光；3）灰暗颜色对应阴沉神情；4）宇宙黑幕对应背景。
context_alignment: 百万死者尚未被点名，云团先以集体面孔出现，把宏观物质残骸与人的死亡重新连接。
narrative_function: 为战役全景赋予情绪表情，在后续血霞和巨龙图像前建立压抑底色。
transfer_rule: 无定形大景作人脸时，应给出轮廓生成、光源明灭、表情色调和观看尺度，避免只凭‘可怕’命名。
failure_boundary: 云团没有稳定五官或意识，阴沉是观察者投射；爆炸照明也无表情意图。
