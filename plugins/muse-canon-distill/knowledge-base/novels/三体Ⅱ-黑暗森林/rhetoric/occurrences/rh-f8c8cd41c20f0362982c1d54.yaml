tenor: 直径十万公里的苍白金属碎片云在间歇核火球照明下反复显出巨大、模糊的整体轮廓
vehicle: 黑暗中一张巨大阴沉面孔被闪光断续照亮，五官若隐若现并以压迫神情俯视观察者
ground: 1）云团轮廓对应脸廓；2）核火球对应闪光；3）明灭对应时隐时现；4）灰白残骸对应阴沉肤色；5）尺度对应巨脸。
