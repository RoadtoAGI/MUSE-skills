chapter: 正文
figure_type: metaphor
quote: 进入太空的路仍然只有常规发射这条独木桥
sensory_mapping: 深壑阻隔、窄木横跨、单人通行、无路可绕
context_fact: 球状闪电与宏原子聚变实验必须在太空开展，太空电梯仍处研究阶段，常规发射能力也不足。
image_mechanism: 地球重力井被压成一道沟壑，火箭不是通天大道，只剩一根勉强承重的木梁；所有实验资源被迫排队过桥。
property_alignment: 1）重力阻隔对应深壑；2）常规火箭对应独木桥；3）太空实验对应过桥者；4）运力瓶颈对应桥窄；5）太空电梯对应未来宽路。
context_alignment: 句子处在实验受运力卡住的因果链中，‘独’准确标出技术单点依赖，‘木’又与后文石器时代的落后感衔接。
narrative_function: 把航天基础设施瓶颈变成一眼可见的通行风险，解释泰勒为何只能等待。
transfer_rule: 瓶颈作桥应同时核对通道数量、容量和跨越风险；只有‘唯一’而不狭窄时不宜选独木桥。
failure_boundary: 常规发射由多个国家和型号组成，不是真正单一设施；其可靠性提高后，独木桥会夸大脆弱程度。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 在太空电梯尚未建成时，人类只能依赖容量有限、风险高昂的常规火箭进入太空
vehicle: 跨越险地时唯一可走、狭窄且通行能力低的独木桥
ground: 1）地面至太空对应险壑两岸；2）常规发射对应独木桥；3）缺少替代方案对应只有一桥；4）运力有限对应桥面狭窄；5）发射风险对应失足危险。
