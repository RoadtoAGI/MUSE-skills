chapter: 正文
figure_type: metaphor
quote: 相当一部分脏水还得泼到我们头上
sensory_mapping: 污水越过责任边界、从头顶泼下、制服被染脏、旁观者只见污迹
context_fact: 三大舰队撤回跟踪飞船导致目标丢失，但林格-斐兹罗系统名义上负责深空跟踪，将军担心媒体不区分责任。
image_mechanism: 抽象声誉损害被转成可见污迹，责任转嫁成为方向明确的泼水动作，受害者即使无责也要带着脏痕。
property_alignment: 1）舆论责难对应污水；2）舰队失误对应水源；3）媒体转嫁对应泼；4）监测站对应头部目标；5）名誉损伤对应污渍；6）公众误解对应见污认脏。
context_alignment: 将军以粗俗口语纠正科学家只谈技术的视角，符合其政治责任敏感，也推动二人主动寻找补救方案。
narrative_function: 把制度问责压力变成迫近身体的威胁，促使监测站越权调用核弹和油膜尘埃。
transfer_rule: 归责作泼脏水时，应指出污水真实来源、转移方向、被泼者难以自证的可见后果和围观机制。
failure_boundary: 批评中可能含监测职责的合理部分，不能一概视为污水；名誉也可通过证据澄清。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 媒体和公众会把探测器失踪的部分责任、丑闻和负面评价归到监测站及其负责人身上
vehicle: 他人把装有污浊水液的容器朝某人头顶倾倒，使其身体沾污并在众目下显得肮脏
ground: 1）负面指责对应脏水；2）归责行为对应泼洒；3）监测站对应被泼者；4）声誉受损对应身体弄脏；5）媒体传播对应水花扩散；6）不完全责任对应水从别处转来。
