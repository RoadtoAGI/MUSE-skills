tenor: 可凭核动力航行、承载钢铁城市与太空电梯基点的人工海上浮岛
vehicle: 凡尔纳小说中由机械驱动、可移动且形成独立社会空间的机器岛
ground: 1）人工浮岛对应机器岛；2）核动力航行对应机械自驱；3）钢铁城市对应岛上设施；4）沿赤道移动对应可航行岛屿；5）文学想象落地对应现实版。
