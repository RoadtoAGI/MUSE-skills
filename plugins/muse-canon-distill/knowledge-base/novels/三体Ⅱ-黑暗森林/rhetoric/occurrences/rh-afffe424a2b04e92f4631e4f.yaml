quote: 浮岛是凡尔纳笔下机器岛的现实版
sensory_mapping: 钢铁岛体、核动力推进、海面迁移、城市随岛航行
context_fact: 天梯三号是唯一以人工浮岛为基点的太空电梯，基点可按需要沿赤道改变位置，正式命名为凡尔纳岛。
image_mechanism: 工程设施先被放回科幻小说的尺度，海上平台获得整座岛屿的自主生命；现实技术像从书页中抽出机器岛并接上天梯。
property_alignment: 1）凡尔纳岛对应文学机器岛；2）核动力对应机械心脏；3）移动能力对应航行；4）钢铁城市对应岛上文明；5）命名对应文本转现实。
context_alignment: 作品以早期科幻想象衡量危机时代工程，引用不是装饰，直接解释浮岛为何获名以及大众如何理解其规模。
narrative_function: 将太空电梯的宏大技术放入科幻史谱系，显示旧幻想已成为日常基础设施。
transfer_rule: 称现实工程为文学对象的现实版，应核对结构、动力、移动方式和社会功能，并指出由文本到实物的关键变化。
failure_boundary: 浮岛服务太空电梯且受赤道路线限制，不具小说机器岛完整自治功能；相似不能替代工程说明。
quality_assessment: exemplary
