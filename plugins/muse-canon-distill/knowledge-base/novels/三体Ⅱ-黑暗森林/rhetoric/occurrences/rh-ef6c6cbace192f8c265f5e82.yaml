quote: 托卡马克方式是一条死路，方向对了，突破肯定会产生
sensory_mapping: 岔口分路、前方封堵、转身换向、终点可达
context_fact: 丁仪淡化个人功劳，称基地上千人已有能力，自己只是指出正确方向，成果很快实现。
image_mechanism: 多种实验方案被铺成岔路，投入不再只看走了多远，而先看道路是否连到终点；一次换向让集体脚力产生有效位移。
property_alignment: 1）聚变研究对应行程；2）托卡马克对应断头路；3）新方案对应通路；4）研究人员对应行者；5）突破对应抵达。
context_alignment: 这段正讨论个人与团队对突破的贡献，路线模型准确说明丁仪的价值在选择方向而非亲自完成每步实验。
narrative_function: 说明聚变突破为何突然而必然，并将‘方向选择决定世纪’的主题引向章北海的飞船路线争夺。
transfer_rule: 技术死路喻应有明确目标、互斥路线和可验证的不可达原因；暂时困难不能轻率判为封死。
failure_boundary: 丁仪的判断可能受当时证据限制，旧路线也可能经新方法复活；方向正确不保证资源、工程和时间足够。
