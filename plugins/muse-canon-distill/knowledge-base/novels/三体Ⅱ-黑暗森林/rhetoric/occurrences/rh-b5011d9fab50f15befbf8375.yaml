chapter: 正文
figure_type: simile
quote: 路两侧的沙漠在暮色中泛出一片白色，像雪
sensory_mapping: 暮色抽走沙色、道路两侧铺成白雪平原、旧日冬夜的雪景从沙漠表面浮回
context_fact: 罗辑独自沿两百年前与庄颜出游的同一条路行驶，回忆当时华北平原真实覆盖着雪。
image_mechanism: 当下沙色因光线变成旧日雪色，视觉相似直接触发爱人记忆，使两个世纪在同一路面叠合。
property_alignment: 1）沙粒对应雪粒；2）暮色白光对应雪反光；3）沙漠铺展对应雪原；4）当前公路对应旧旅路线；5）冷寂氛围对应冬景。
context_alignment: 喻体不是任意颜色比对，而是罗辑与庄颜共同经历的真实雪，贴合临终回忆和地点。
narrative_function: 从大史告别自然转入庄颜幻觉，让最后路程与爱情起点重走重叠。
transfer_rule: 景物作记忆中材质时，应让颜色、铺展、光线与旧事件地点一致，使比喻承担触发回忆。
failure_boundary: 沙漠没有雪的低温、融化或柔软，白色来自暮光；罗辑触觉中的长发也是记忆幻感。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 暮色降临后，公路两旁浅色沙面失去暖色细节，远看呈连续冷白色
vehicle: 冬季积雪铺满平原，表面均匀洁白、冷静，在低光下反射微弱天光并抹平地物纹理
ground: 1）沙面对应雪地；2）浅白颜色对应雪色；3）连片覆盖对应积雪；4）暮光反射对应雪光；5）纹理模糊对应雪覆地表。
