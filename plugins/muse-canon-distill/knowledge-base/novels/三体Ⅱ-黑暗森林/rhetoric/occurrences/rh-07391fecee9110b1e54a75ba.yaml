quote: 我像看到毒蛇般恐惧和厌恶
sensory_mapping: 蛇身突现、身体后撤、毒牙待咬、厌恶警戒
context_fact: 代表们把设备视为剥夺自由思想、通向黑暗的技术；主席承认本能排斥，却要求在危机中冷静讨论。
image_mechanism: 抽象伦理风险被压成眼前活物，思想控制的作用像毒液从小伤口进入体内；本能反应先于理性审议。
property_alignment: 1）思想钢印对应毒蛇；2）植入操作对应咬击；3）固化信念对应毒素扩散；4）社会对应可能中毒者；5）主席恐惧对应避蛇反射。
context_alignment: 主席随后又称魔鬼出现，角色语言刻意把技术妖魔化后再要求克制，毒蛇是第一层可感危险。
narrative_function: 承认反对者的恐惧合理，同时为折中议案制造从本能到理性的转折。
transfer_rule: 技术作毒蛇应指出接触入口、隐蔽扩散与具体损害，使恐惧针对机制而非只借邪恶符号。
failure_boundary: 设备没有自主攻击意志且可受程序监督，自愿使用也不同于蛇咬；类比不能替代伦理论证。
