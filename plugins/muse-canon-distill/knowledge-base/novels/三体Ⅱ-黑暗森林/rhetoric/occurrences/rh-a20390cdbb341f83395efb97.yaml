chapter: 正文
figure_type: simile
quote: 它那弧形的表面看上去像是一个布满妖艳彩虹的星球
sensory_mapping: 透明巨弧显形、虹彩铺面、球体悬空、阳光沿膜流动
context_fact: 新望远镜没有镜筒，六片透镜独立漂浮且通常不可见；维护时虹膜反光才使巨镜显出形体。
image_mechanism: 光学元件的工程身份被尺度和虹彩抹去，单片弧镜在黑暗太空中自成一颗色彩过盛的微型世界。
property_alignment: 1）巨型透镜对应星球；2）曲率对应行星表面；3）虹膜干涉色对应彩色大气；4）独立漂浮对应轨道天体；5）阳光反射对应受照半球。
context_alignment: 工程师处在透镜之间，近距无法把握全貌，星球喻体准确传达千米镜片压倒人体的尺寸与陌生光色。
narrative_function: 让无镜筒望远镜第一次完整显形，兼具技术奇观与监视三体舰队的异域威严。
transfer_rule: 巨型曲面作星球时，应对齐曲率、完整轮廓、独立悬浮、受光纹理和观察尺度，而非仅因圆形。
failure_boundary: 透镜是薄片而非实心球体，没有引力、大气或自转；彩虹来自薄膜反射，不是行星气候。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 直径一千二百米的透明望远镜巨型透镜在防护虹膜反射阳光后，显出完整弧面与多彩光带
vehicle: 一颗具有巨大弧形地平、整个表面铺满浓烈彩虹色大气或纹理的奇异行星
ground: 1）透镜弧面对应行星球面；2）千米尺寸对应天体尺度感；3）防护虹膜色带对应彩虹大气；4）独立漂浮对应行星悬空；5）完整圆形轮廓对应星球盘面；6）阳光反射对应行星受照。
