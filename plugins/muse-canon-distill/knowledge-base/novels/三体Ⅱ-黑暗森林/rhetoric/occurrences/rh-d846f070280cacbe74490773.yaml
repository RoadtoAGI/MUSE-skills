chapter: 正文
figure_type: metaphor
quote: 老百姓存在银行里的钱就成了命根儿
sensory_mapping: 身体依赖、生命威胁、触觉
context_fact: 政府冻结部分存款，居民涌向银行取钱；在场老人也担心积蓄无法取出。
image_mechanism: 把账户数字接到身体生存上，政策冻结不再是财务不便，而像直接掐住居民赖以活下去的部位。
property_alignment: 1）储蓄供养老年生活对应生命供给；2）无社保替代对应单一要害；3）挤兑焦虑对应要害被抓住后的本能反应。
context_alignment: 说话者和听者都是退休老人，存款确实承载晚年生计，身体化口语比金融术语更贴近他们的风险体验。
narrative_function: 解释普通人的恐慌并把宏观政策落到身体安全感，使社会冲突具有个人尺度。
transfer_rule: 用身体要害比拟资源时，应交代它承担的具体生存功能、是否有替代渠道及受阻后的直接后果。
failure_boundary: 有多元收入和充分保障的人未必把存款视为唯一命根；该说法不能概括所有居民财务结构。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 低社会保障条件下居民维持生活与安全感所依赖的银行存款
vehicle: 一旦受损便危及生命的身体根本
ground: 1）存款承担养老与应急对应维持生命；2）冻结存款引发极端恐慌对应命根受威胁；3）缺少替代保障对应身体没有备用根系。
