chapter: 正文
figure_type: simile
quote: 一幅天堂般的景象
sensory_mapping: 柔金天光、雪山湖泊、幸福家庭、尘世退远
context_fact: 泰勒刚从严峻外界来到封闭庄园，看到庄颜和孩子画画、罗辑远望妻儿。
image_mechanism: 庄园边界像云门闭合，外部危机被挡在车后；夕阳给湖山和一家三口镀上无苦乐园的金光。
property_alignment: 1）庄园对应天堂；2）罗辑一家对应幸福居民；3）夕阳对应神圣光；4）外部世界对应尘世。
context_alignment: 泰勒已被破壁并身心枯竭，观察者处境使同一庄园显得是自己失去的人生和不可抵达的乐土。
narrative_function: 以极端宁静反衬泰勒带来的失败与死亡，并让罗辑的避世幸福达到最后展示。
transfer_rule: 天堂喻应由环境美、免于痛苦和观察者的尘世负担共同成立，最好让进入动作形成边界跨越。
failure_boundary: 庄园仍由公共资源维持且危机将侵入，幸福并不永恒；只凭漂亮景色不足以称天堂。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 夕阳下雪山、湖泊、森林与罗辑一家天伦之乐组成的宁静完满场景
vehicle: 远离尘世痛苦、光线柔美且生命幸福无缺的天堂图景
ground: 1）优美自然对应乐园；2）一家幸福对应无苦生活；3）柔和夕阳对应神圣光；4）与外界隔绝对应尘世之外；5）泰勒疲惫对应旅人见天堂。
