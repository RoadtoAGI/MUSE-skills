quote: 前三分之一段像在燃烧
sensory_mapping: 镜面水滴前段被阳光点着，亮斑像无烟火焰贴着银色表面烧向太阳
context_fact: 水滴静止在太阳同步轨道，推进光环已经消失，头部正对太阳并反射明亮阳光。
image_mechanism: 静态反光被转成持续燃烧动作，视觉亮度因此携带能量与危险，使封锁前的悬停不再安静。
property_alignment: 1）太阳反光对应火焰亮度；2）亮区边界对应燃烧段；3）水滴表面对应燃物；4）攻击前兆对应火势将起。
context_alignment: 罗辑等待水滴下一步，‘燃烧’把没有机械动作的镜面变化写成预兆，又保持其神秘不可解。
narrative_function: 在电磁压制爆发前制造可见危险信号，并把读者注意锁在水滴朝向太阳的头部。
transfer_rule: 反光作燃烧时，应限定亮区位置、真实光源和随后的能量事件，让火感来自可观察亮度。
failure_boundary: 水滴未发生氧化燃烧，也没有被太阳烧毁；喻体只描述反射观感与危险预兆。
