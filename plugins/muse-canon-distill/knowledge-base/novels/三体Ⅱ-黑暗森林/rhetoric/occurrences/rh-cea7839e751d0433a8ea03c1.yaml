chapter: 正文
figure_type: simile
quote: 像抚摸天鹅绒般感受着黑暗的质感
sensory_mapping: 罗辑伸手掠过无形黑幕，指间仿佛压过细密黑绒，光被绒面吸尽，只剩柔厚阻隔
context_fact: 烟头熄灭后夜空与沙漠融成一体，罗辑要把刚推导的宇宙状态讲成黑暗森林图景。
image_mechanism: 视觉黑度被移到手掌触觉，抽象宇宙背景先变成可摸表面，再由此展开森林实体。
property_alignment: 1）夜色颜色对应黑绒；2）无反光对应吸光表面；3）空气包围对应织物覆盖；4）挥手对应顺绒抚触。
context_alignment: 罗辑确实伸手挥动，触觉比喻从动作现场生出；天鹅绒的柔软与后续猎杀残酷形成克制反差。
narrative_function: 把理论命名从逻辑推导过渡到感官世界，让‘黑’先可触，再成为可行动的森林。
transfer_rule: 将视觉状态转成织物触感时，应让人物有真实触摸动作，并对应色泽、吸光、厚度和表面纹理。
failure_boundary: 夜空没有织物表面或柔毛，手也触不到宇宙；喻体只表达浓黑与包围感。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑在无星无风的浓黑沙漠中以手势感受仿佛具有实体厚度的宇宙黑暗
vehicle: 手掌掠过天鹅绒表面，触到细密、柔厚、吸光且方向变化明显的绒毛质地
ground: 1）浓黑夜色对应天鹅绒深色；2）视觉吸光对应绒面吞光；3）挥手感受对应手掌抚摸；4）厚重包围感对应柔密质地。
