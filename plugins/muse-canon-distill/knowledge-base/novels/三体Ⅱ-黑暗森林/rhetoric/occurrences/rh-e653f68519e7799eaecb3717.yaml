tenor: 罗辑在确认人类无救后极度绝望，想到庄颜和孩子可能苏醒，个人生活重新出现微弱希望
vehicle: 灰暗画面或天空中出现一小块明亮颜色，虽不能照亮全部，却打破单一暗色并吸引视线
ground: 1）心境对应画面；2）绝望对应灰暗；3）家人重逢对应亮色；4）希望微弱对应一点；5）情绪改善对应色彩恢复。
