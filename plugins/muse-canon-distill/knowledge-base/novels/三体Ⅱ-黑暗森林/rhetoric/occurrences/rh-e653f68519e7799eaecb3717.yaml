quote: 他那灰暗的心中终于有了一点亮色
sensory_mapping: 罗辑心里铺满灰黑、庄颜与孩子的形象像一点暖色浮出、周围仍暗但不再全无颜色
context_fact: 大史提醒庄颜和孩子可能即将解冻，罗辑认为重逢是唯一拯救自己的机会。
image_mechanism: 情绪从明暗色盘表现，微小希望没有被夸成阳光，只以局部色点对抗整体灰暗。
property_alignment: 1）绝望背景对应灰色；2）家人对应彩色焦点；3）希望大小对应色块面积；4）注意转向对应视觉聚焦。
context_alignment: 太阳通信已被封死，文明层面的光消失，个人家庭只剩一点亮色，尺度收缩准确。
narrative_function: 在‘人类无人能救’前给罗辑留下私人行动目标，推动他次日寻找冬眠移民局。
transfer_rule: 微弱希望作亮色时，应保留暗色基底、明确色源与面积比例，避免突兀写成全面光明。
failure_boundary: 家人苏醒尚被冻结，亮色只是预期；重逢也不能解决人类文明危机。
