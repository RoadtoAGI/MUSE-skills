chapter: 正文
figure_type: simile
quote: 超重的魔鬼之手把他们的身体像揉一堆湿泥人般揉成团
sensory_mapping: 无形巨手按下、人体像湿泥塌软、骨骼在掌下碎响、百人轮廓被揉掉
context_fact: 舰长绕过保护强行进入前进四，球形舱人员受超重滑挤到底部并被压碎。
image_mechanism: 不可见加速度被身体化为施暴的手，人体坚固感被湿泥触觉撤销，使挤压过程可被触觉想象。
property_alignment: 1）加速度场对应手掌；2）舱底对应揉捏台；3）人体对应泥偶；4）组织破裂对应泥料塌陷；5）混合肉团对应合泥。
context_alignment: 水滴之外的人类逃生决策成为施害者，‘魔鬼之手’把抽象参数转成舰长命令造成的具体惨死。
narrative_function: 迫使读者进入舰内感受溃逃代价，将舰船光点的宏观毁灭还原为人体灾难。
transfer_rule: 力场作手时，应写明施力方向、受力材质、形变步骤与伦理施动者，让触觉机制完整。
failure_boundary: 超重没有意志或手指动作，人体也不具湿泥的均匀塑性；骨骼破裂与器官喷出不能被柔软感淡化。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 未进入深海保护的人体在‘前进四’超重下滑到球舱底部，被巨大加速度挤压、破碎并混成肉团
vehicle: 一只恶意巨手把柔软湿泥捏压揉搓，泥制小人失去轮廓、相互黏合成无差别一团
ground: 1）超重对应魔鬼手；2）人体对应湿泥人；3）挤压力对应揉捏；4）骨肉变形对应泥塑失形；5）多人混合对应揉成团。
