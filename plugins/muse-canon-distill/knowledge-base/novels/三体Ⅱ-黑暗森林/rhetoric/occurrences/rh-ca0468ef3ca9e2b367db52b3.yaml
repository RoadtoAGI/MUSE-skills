chapter: 正文
figure_type: metaphor
quote: 责任分段儿必须明确！这得有条线，咔！
sensory_mapping: 刀线、断面、咔声、前后两段
context_fact: 史强要求下属落实抵达后的安保交接，明确事故在交接前后分别由谁负责。
image_mechanism: 不可见责任被拉成一根可切材料，史强用口头“咔”完成断面，模糊协作转为两段归属。
property_alignment: 1）任务时间对应材料长度；2）交接点对应切口；3）两方对应断口两边；4）归责对应分段占有。
context_alignment: 史强说话粗直接，拟声切割比制度术语更符合一线安保人员对责任边界的敏感。
narrative_function: 刻画史强专业经验和不信任，也预告罗辑的保护将跨机构持续。
transfer_rule: 用切割写职责划分时，应明确连续对象、切点、切前切后归属和需要避免的灰区。
failure_boundary: 联合行动常有重叠责任，现实交接未必能一刀断开；“咔”不能替代书面确认。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 护送罗辑过程中中方与接收方安全责任的明确交接时点
vehicle: 用刀沿一条界线把连续物切成前后两段
ground: 1）连续护送过程对应长条物；2）交接时点对应切线；3）此前责任归中方对应前段；4）此后责任归接方对应后段；5）“咔”对应切断的干脆声响。
