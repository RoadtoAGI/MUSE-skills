quote: 这是一个无限的猜疑链
sensory_mapping: 一个念头扣住下一个、心灵之间伸出无尽铁链、每加一层‘他们怎样想’便多一环、尽头消失
context_fact: 三人尝试假定双方都非魔鬼，却发现仍无法知道他舰对自身判断的判断，交流又受生存死局限制。
image_mechanism: 抽象递归语句被离散为可数链环，语法每重复一层就增加一节，逻辑结构直接可视化。
property_alignment: 1）主体推测对应链环；2）嵌套层级对应后继环；3）相互依赖对应扣合；4）无终止公理对应链无尽；5）可信沟通对应剪断工具。
context_alignment: 前文目光曾像高速通道连接心灵，资源死局使通道转为链条，连接仍在却变成束缚。
narrative_function: 为黑暗战役提炼认知机制，说明即使双方善良也会因无限递归走向先发攻击。
transfer_rule: 递归猜测作链条时，应让每一环对应明确认知层级，并指出链为何不能由普通交流终止。
failure_boundary: 真实推理受注意力和时间限制并非数学无限，外部承诺、透明资源或共同权威可能截断链条。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 每一方不断推测对方如何看自己、又如何推测自己的推测，互相怀疑层级无限递归
vehicle: 链条由一环扣一环延伸，每一环依赖前环又产生下一环，若没有外力切断便可无限增长
ground: 1）一次猜测对应一环；2）对方反猜对应下一环；3）递归嵌套对应环环相扣；4）无共同信息对应无限延伸；5）打破猜疑对应断链。
