chapter: 正文
figure_type: metaphor
quote: 他被一种从未有过的柔情所淹没
sensory_mapping: 水位、包围、没顶、失重漂浮
context_fact: 想象女孩在篝火旁重复壁炉前的幸福，罗辑被她吸引并认为自己活着只为给她温暖。
image_mechanism: 温柔不再是轻触而成为深水，从四周漫过罗辑；同句篝火则在水中仍燃，组成强烈情感的水火叠景。
property_alignment: 1）柔情对应洪水；2）意识对应低地；3）情感充盈对应淹没；4）自我失控对应被水托走。
context_alignment: 这是想象爱情最投入的顶点，淹没准确表现罗辑将全部生命目的交给她的危险绝对化。
narrative_function: 把保护欲推至失去自我边界，为白蓉来电切断幻境制造峰值。
transfer_rule: 洪水写情绪时，应指定水位如何上涨、哪些心理空间被覆盖以及人物失去何种行动能力。
failure_boundary: 柔情通常温和，洪水含灾害与窒息；若人物仍保持清醒边界，用“淹没”会过度病理化。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 罗辑突然充满全部意识、难以保持原有自我的强烈柔情
vehicle: 水位迅速上涨并完全没过一个人的洪水
ground: 1）情感强度上升对应水位上涨；2）占满意识对应身体被没过；3）无法抗拒对应失去立足和呼吸空间；4）篝火旁环境反衬对应水火并置。
