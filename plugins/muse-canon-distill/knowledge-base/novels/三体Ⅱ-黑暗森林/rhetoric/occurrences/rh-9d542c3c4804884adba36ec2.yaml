tenor: 三体舰队穿过星际尘埃云后，以高速冲击留下可由远方观测的尾迹机制
vehicle: 看不见或已离开的行者穿过雪地，在雪面留下可追踪脚印和路径
ground: 1）尘埃云对应雪地；2）舰队对应穿越者；3）冲击尾迹对应脚印；4）远处观测对应循迹追踪；5）只在云中可见对应无雪不留痕。
