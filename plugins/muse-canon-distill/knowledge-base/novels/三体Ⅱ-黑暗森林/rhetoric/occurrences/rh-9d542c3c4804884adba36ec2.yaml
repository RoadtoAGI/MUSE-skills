chapter: 正文
figure_type: analogy
quote: 人们把这些尘埃云称做“雪地”，其含义是雪地上能够留下穿越者的痕迹
sensory_mapping: 白雪地面、行者脚印、路径延伸、循迹追踪
context_fact: 舰队本体不可直接分辨，只在穿越五片已探明星际尘埃云时留下刷状吸收尾迹。
image_mechanism: 稀薄尘埃被压成可承印雪面，隐形舰队获得脚步；舰船离开后，地球观察者仍能沿被扰动的痕迹追踪。
property_alignment: 1）星际尘埃云对应雪地；2）三体舰队对应行者；3）高速冲击对应踩踏；4）尾迹对应脚印。
context_alignment: 比喻不仅命名外观，还准确解释可观测条件：航路大多无痕，只有穿云段像踏雪留印。
narrative_function: 把复杂天文探测机制压缩为追踪常识，并为“第二块雪地”等待提供语言框架。
transfer_rule: 痕迹介质类比要明确介质、穿越者、作用方式和事后读迹者，四者缺一便只剩标签。
failure_boundary: 尘埃尾迹会扩散且通过吸收背景光识别，不是固态脚印；舰队规模速度也不能由脚印直观全知。
