chapter: 正文
figure_type: simile
quote: 把所有的星系像面团一样捏成他们需要的形状
sensory_mapping: 亿万星辰缩成软团、巨手伸入宇宙、星系被揉压拉伸、按设计重新成形
context_fact: 丁仪感叹即使文明把规律探索到可改变整个宇宙的程度，规律本身仍独立不变。
image_mechanism: 不可想象的宇宙工程被缩到双手揉面，星系的巨大与坚固性被撤去，只留下结构可塑这一核心假设。
property_alignment: 1）星系物质对应面团；2）高级文明对应厨师；3）物理技术对应手力；4）改变结构对应捏塑；5）需要的宇宙对应成品形状；6）规律约束对应面团基本性质。
context_alignment: 丁仪用最大尺度夸张技术能力，随后仍判定规律不可改变，面团的可塑性恰衬托规律的超然。
narrative_function: 把科学探索推到极限反事实，建立‘现实可改、规律不改’的哲学区分。
transfer_rule: 宏大系统作面团时，应限定到可塑结构，明确操作者、施力方式和目标形状，并保留材料规律。
failure_boundary: 星系受引力和时间尺度制约，不具面团连续柔软性；文明是否能如此操控纯属设想。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 设想中的高级文明掌握规律后，能以技术任意重塑星系的结构、分布和形态
vehicle: 厨师把柔软面团握在手中揉压拉扯，按意图轻易改变形状且材料不会反抗
ground: 1）星系对应面团；2）宇宙工程者对应揉面者；3）引力结构对应可塑材质；4）技术操控对应手捏；5）目标形态对应模塑结果；6）巨大尺度被掌控对应掌中缩小。
