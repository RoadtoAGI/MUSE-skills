chapter: 正文
figure_type: simile
quote: 四周只有寒冷和墨水般的黑暗
sensory_mapping: 浓墨包围、光线吞没、轮廓消失、液体浸身
context_fact: 冰水淹过罗辑头部，他继续下沉，只能从破口看见头顶一团模糊光晕。
image_mechanism: 夜湖的水色加深成可触墨汁，从四周灌满视野；身体既浸在真实水里，也像沉入一瓶无透光黑墨。
property_alignment: 1）水下夜色对应墨水；2）湖水对应墨液；3）光线缺失对应浓黑；4）物体失形对应被墨遮盖。
context_alignment: 喻体与真实液体同质，颜色和包围方式高度贴合，又为下一步把湖水错觉成太空提供无参照背景。
narrative_function: 清空近处地景，让罗辑在感官上进入宇宙冷黑并领悟其生存规则。
transfer_rule: 墨水喻黑暗应利用液态包围、吸光和遮轮廓，最适合水下、雾中等有介质空间。
failure_boundary: 湖水并非真的含墨，头顶仍有光晕；干燥开阔且星光清晰的黑夜不具墨液包围感。
quality_assessment: effective
