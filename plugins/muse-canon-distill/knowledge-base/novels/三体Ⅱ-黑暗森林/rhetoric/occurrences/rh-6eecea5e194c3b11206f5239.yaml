review_status: reviewed
tenor: 罗辑沉入冰湖后视野被水下夜色完全封闭、没有方向和细节的深黑环境
vehicle: 浓厚墨汁包围视线、吸收光线并遮没所有轮廓
ground: 1）水下深黑对应墨色；2）光被吸收对应墨汁不透；3）四面包围对应浸入液体；4）看不见物体对应墨水遮蔽；5）冷水质感对应液态介质。
