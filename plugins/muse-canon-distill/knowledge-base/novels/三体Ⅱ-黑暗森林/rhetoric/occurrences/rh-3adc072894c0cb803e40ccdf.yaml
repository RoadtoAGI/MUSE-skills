quote: 这些骇人听闻的武器成了危险的鸡肋
sensory_mapping: 手中握着少肉硬骨、啃取费力、丢弃可惜、尖骨还可能刺伤持有者
context_fact: 五千多颗恒星型氢弹在新时期被送入太空储存，少量用于工程爆破，作为飞船燃料的设想因难拆解而搁置。
image_mechanism: 行星武器被缩成手中食余物，价值与处置成本的矛盾转成‘吃不值、扔不舍’，危险一词又把俗语骨刺重新激活。
property_alignment: 1）核弹库存对应鸡肋；2）有限军事作用对应肉少；3）昂贵材料对应可惜残肉；4）拆弹对应啃骨；5）储存对应握在手中；6）核事故风险对应骨刺。
context_alignment: 雷迪亚兹时代的末日武器如今被环保工程临时调用，鸡肋准确表现其从战略核心降为尴尬遗产的历史落差。
narrative_function: 交代巨型核弹为何仍散布太阳系，并自然把旧面壁计划遗产转化为追踪水滴的新工具。
transfer_rule: 资源作鸡肋时，应同时存在低收益、残余价值、高处理成本和弃置代价；若带危险，可让骨刺属性获得新作用。
failure_boundary: 氢弹用于造云时价值很高，且危险远超食物骨头；俗语不能替代库存安全与成本评估。
