chapter: 正文
figure_type: metaphor
quote: 这里丝毫看不到战争的阴影
sensory_mapping: 城市铺满亮色、草地无暗斑、威胁退到光外、行人在明处穿行
context_fact: 树形建筑把喧嚣悬在空中，地面像郊野般清新舒适；三体舰队尚未到达且居民普遍相信人类会胜利。
image_mechanism: 不可见的战争后果被压成光学暗区，叙述通过‘无影’呈现城市如何把危机从感官表面清除。
property_alignment: 1）末日战争对应遮光体；2）军备恐惧对应阴影；3）地下城日常对应受光地面；4）舒适惬意对应明亮；5）居民忽视威胁对应不见暗斑；6）三体仍来对应投影源未消失。
context_alignment: 场景充满人工阳光、发光衣服和飞车，阴影词直接依附强光环境，也暗示这种无阴影的胜利图景可能由照明控制造成。
narrative_function: 强化未来繁荣的表面完整，同时为无人车袭击和探测器危机让隐蔽威胁突然闯入亮处。
transfer_rule: 风险作阴影时，应先建立明确光源与明面生活，再决定影子可见、被遮蔽或尚未投到何处。
failure_boundary: 看不到社会影响不等于战争不存在，阴影缺失可能源于信息盲区；光学明亮不能证明战略安全。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 未来地下城市的日常景象舒适明亮，表面没有出现危机、军备或恐惧留下的可见影响
vehicle: 不透明物体遮住光线，在明亮地面投下暗色轮廓，提示某物虽不在眼前却正在附近阻光
ground: 1）战争对应遮光物；2）战争影响对应阴影；3）和平生活对应亮地；4）看不到恐惧对应无暗区；5）潜在威胁对应物体可能仍在远处；6）日常舒适对应阳光充足。
