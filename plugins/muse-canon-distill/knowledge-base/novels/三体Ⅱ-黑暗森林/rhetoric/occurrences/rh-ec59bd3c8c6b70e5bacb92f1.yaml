quote: 仿佛一个长途旅人终于到达了目标
sensory_mapping: 长路、沉重行囊、终点白椅、抵达后瘫坐
context_fact: 泰勒称只有面壁者之间能理解彼此痛苦，专程来告诉罗辑从怪圈脱身的方法。
image_mechanism: 几天精神危机被拉成漫长道路，庄园草坪成为路标终点；坐上白椅等同卸下背负已久的行囊。
property_alignment: 1）泰勒对应旅人；2）破壁危机对应长路；3）罗辑对应终点接应；4）软瘫对应抵达休息。
context_alignment: 前一段天堂、清泉意象已把庄园设为疲惫者目的地，长途旅人自然汇合这些空间关系。
narrative_function: 说明泰勒来访不是普通交流，而是临死前寻找见证与理解。
transfer_rule: 长途抵达喻应明确旅程由哪些持续压力构成、终点提供什么，并用卸力动作完成抵达。
failure_boundary: 泰勒的真正计划还包括自杀，罗辑并非问题解决终点；若角色只是短暂劳累，长途尺度会夸大。
