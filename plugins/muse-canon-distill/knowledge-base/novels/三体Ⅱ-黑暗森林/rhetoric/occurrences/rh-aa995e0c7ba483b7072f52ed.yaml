quote: 他们处于空天飞机的阴影中，他却像看到了刺眼的强光
sensory_mapping: 阴影中强闪、眼睑眯起、视野过曝、危险被照亮
context_fact: 常伟思告知政工干部增援未来尚不成熟，章北海认为合格人才只会越来越少。
image_mechanism: 空天飞机实体阴影保持黑暗，消息却在章北海意识内点亮探照灯，把四百年后的人才断层照得刺目。
property_alignment: 1）未来危险对应强光所照对象；2）认知突现对应闪亮；3）心理痛楚对应刺眼；4）眯眼对应承受光照。
context_alignment: 外在阴影与内在强光同句对冲，身体动作提供可见证据，也显示章北海的长远视野远超当下语境。
narrative_function: 揭示暂缓决定触及章北海核心计划，预示他将自行推进更激进方案。
transfer_rule: 认知如刺光要让新信息同时带来清晰与疼痛，并最好用现场明暗反差承载。
failure_boundary: 章北海未真的见光，眯眼也可能是习惯；普通温和认识不应写成刺眼强照。
