chapter: 正文
figure_type: simile
quote: 像困兽般在这里走来走去
sensory_mapping: 暗室如笼、脚步往返、躯体绷紧、出口封闭
context_fact: 破壁人借智子图像长期观察雷迪亚兹；雷迪亚兹因恐日住在地下室，也承受秘密计划与监视压力。
image_mechanism: 居所收缩成兽笼，日复一日的踱步成为受困动物沿同一路径磨损地面的本能动作。
property_alignment: 1）雷迪亚兹对应困兽；2）地下室对应笼舍；3）恐日症对应不敢越界；4）监视与使命对应囚禁；5）来回走动对应笼边巡行。
context_alignment: 破壁人以长期凝视者身份说出这一形象，既准确描述可见动作，也刺激雷迪亚兹不愿承认的失控处境。
narrative_function: 把面壁者的权力反转成囚禁感，为他随后对破壁人的兽性暴力预作动作铺垫。
transfer_rule: 用困兽写人物踱步，应让封闭空间、重复路径、无出口压力和潜伏攻击性共同出现。
failure_boundary: 雷迪亚兹仍可离开地下室并拥有政治权力，困境主要是心理与战略的；不能据此把他去人格化。
quality_assessment: exemplary
