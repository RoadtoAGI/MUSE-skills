tenor: 雷迪亚兹在封闭地下室中长时间焦躁踱步、无法摆脱恐日症和战略压力的状态
vehicle: 被关在狭小笼舍中反复沿边缘来回走动、蓄力却无处逃脱的野兽
ground: 1）地下室对应牢笼；2）反复踱步对应笼中巡行；3）焦躁对应困兽不安；4）面壁压力对应囚禁；5）攻击性对应野兽蓄力。
