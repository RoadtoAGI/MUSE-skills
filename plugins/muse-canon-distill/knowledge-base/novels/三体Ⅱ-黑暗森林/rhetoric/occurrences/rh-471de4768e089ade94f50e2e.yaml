chapter: 正文
figure_type: simile
quote: 一知道在哪儿，世界就变得像一张地图那么小了
sensory_mapping: 俯视纸面、比例缩小、坐标标记、二维压平
context_fact: 罗辑要求找到梦想之地，却明确禁止伽尔宁告诉他国家和位置。
image_mechanism: 一条地点知识像比例尺开关，把包围身体的世界瞬间折叠成手中纸片；保留未知便保留可居住的辽阔。
property_alignment: 1）现实世界对应地理实体；2）确切位置对应地图坐标；3）知道对应标注；4）失去神秘对应缩尺。
context_alignment: 罗辑追求的是想象成真的感觉而非地理知识；拒绝定位符合他借面壁权力保护梦境的自觉。
narrative_function: 刻画罗辑的审美逃避，也解释庄园地点为何保持匿名。
transfer_rule: 写知识缩小体验时，应说明信息如何把多感官现场压成哪个符号系统，以及人物主动保留何种未知。
failure_boundary: 地图扩大认知而非总使世界变小；对旅行、安全或科学任务而言，确切位置通常增加行动可能。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 理想庄园位置被命名后，罗辑对世界广阔未知感的骤然缩减
vehicle: 把真实辽阔地球按比例压缩在纸面上的一张地图
ground: 1）未知空间对应可继续探索的世界；2）地名坐标对应地图标注；3）丰富现场被归约为符号对应世界压平；4）心理尺度缩小对应地球落入一张纸。
