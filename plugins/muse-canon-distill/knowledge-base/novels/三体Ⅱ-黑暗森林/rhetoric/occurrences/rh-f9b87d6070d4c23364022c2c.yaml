tenor: 恒星型氢弹爆炸后向黑暗低温太空猛烈释放辐射，使四个油膜物质球汽化并被高能辐射快速推散
vehicle: 暴烈太阳把炽热洪流倒进寒冷无底深渊，同时掀起飓风卷走周围物质并向四方扩展
ground: 1）核爆火球对应小太阳；2）光热辐射对应倾泻洪流；3）真空空间对应寒冷深渊；4）辐射压对应飓风；5）油膜气体对应被风卷物；6）快速扩散对应风暴外推。
