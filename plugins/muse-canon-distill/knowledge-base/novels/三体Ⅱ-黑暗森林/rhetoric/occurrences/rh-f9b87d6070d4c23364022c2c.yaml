quote: 小太阳把光和热量疯狂地倾泻到这寒冷的太空深渊中，周围的球体在瞬间汽化，油膜汽体在氢弹辐射的飓风中迅速扩散
sensory_mapping: 人造太阳骤亮、光热如瀑布灌下、黑色深渊承接、无形飓风把蒸汽卷开
context_fact: 海王星工程飞船在四个油膜矿球中央引爆氢弹，以制造直径大于太阳的人造尘埃云。
image_mechanism: 不可见的辐射传能获得两种流体动作：能量先由上向深渊倾倒，随后横向化成飓风，把汽化物质推成巨云。
property_alignment: 1）核火球对应太阳；2）辐射能对应热洪流；3）太空对应深渊；4）辐射压力对应风力；5）汽化油膜对应风中云气；6）球体消失对应被暴风撕散；7）云膨胀对应风暴扩张。
context_alignment: 场景在海王星外侧的极冷黑暗中，热源、深渊与飓风的温度和方向反差把工程过程写成宇宙天气。
narrative_function: 让几乎不可见的造云物理过程获得暴烈动态，显示人类为寻找卡车大小目标制造太阳级尺度痕迹的豪举。
transfer_rule: 能量传递作风暴时，应区分能量流向与物质运动，分别安排倾泻介质、受力对象和扩散后果。
failure_boundary: 真空中没有空气飓风或液体瀑布，光热也不会向‘下’倾倒；辐射传播和压力需按物理模型理解。
