chapter: 正文
figure_type: simile
quote: 像一只太空中的暖瓶胆
sensory_mapping: 银亮薄胆悬在真空、硬钢爪压近、玻璃似将开裂、观众屏息
context_fact: 机械臂缓慢抓取水滴，人类仪器尚无法探知其内部，所有人从外形判断它十分脆弱。
image_mechanism: 宇宙奇物被拉回家用器皿经验，镀银反光与中空外观共同激活‘薄玻璃’触觉，产生完全错误的强度预期。
property_alignment: 1）水滴外壳对应暖瓶胆；2）全反射面对应银镀层；3）浑圆细尾对应瓶胆轮廓；4）机械夹持对应碰撞风险；5）内部不可见对应中空错觉；6）脆弱感对应玻璃易碎。
context_alignment: 古猿珍珠是文明尺度判断，暖瓶胆则是丁仪时代的日常材料判断；两层错误共同包围水滴真实强度。
narrative_function: 让观众担心水滴被人类机械损坏，随后以水滴像子弹穿奶酪摧毁舰队完成极端反转。
transfer_rule: 未知镜面物作易碎器皿时，应由材质光泽、壳体轮廓和接触方式触发，并准备明确的强度反证。
failure_boundary: 水滴不是玻璃内胆、不中空且强度远超人类物质；相同反光不能转移脆性。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴探测器呈镜面、薄壳般完整的液滴轮廓，被钢爪夹持时显得一碰就会破碎
vehicle: 老式热水瓶内部镀银玻璃胆反光光滑、壳薄中空，轻微碰撞便碎裂
ground: 1）水滴对应瓶胆；2）镜面对应镀银玻璃；3）流畅壳体对应吹制内胆；4）被钢爪夹住对应受硬物碰撞；5）无内部可见结构对应中空；6）观众担心对应易碎经验。
