quote: 这事儿对你们来说就像玩电子游戏那么方便
sensory_mapping: 终端屏幕、按键、即时重启、虚拟爆炸
context_fact: 洛斯阿拉莫斯刚完成一个模型便撒纸欢呼，雷迪亚兹对比本国没有超级计算机、只能进行真实试验。
image_mechanism: 高门槛核武研究在强者手里缩成桌面游戏，爆炸被关进屏幕，重置键抹去现实代价。
property_alignment: 1）模拟中心对应游戏平台；2）模型运行对应一局游戏；3）核爆参数对应游戏规则；4）低成本试错对应重玩；5）科研人员对应玩家。
context_alignment: 雷迪亚兹以穷国领导人口吻讽刺技术不平等，电子游戏的轻松与核爆的恐怖形成尖锐反差。
narrative_function: 说明计算资源如何改变核开发门槛，并暴露雷迪亚兹把真实核试验合理化的危险逻辑。
transfer_rule: 把高风险模拟比作游戏时，应对应界面、可重复性和现实代价被隔离的机制，同时指出谁被排除在模拟条件外。
failure_boundary: 核模拟仍需专业知识且后果重大，并非娱乐；类比不能由“操作方便”推出研究轻率或结果可靠。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 美国实验室依靠超级计算机频繁进行核爆模型试验的便捷与低成本
vehicle: 玩家在终端反复启动电子游戏关卡、失败后可立即重来
ground: 1）核试验在计算机中运行对应游戏在屏幕运行；2）可频繁重复对应反复开局；3）无真实爆炸伤亡对应虚拟行动无实物代价；4）操作终端便完成对应按键游玩；5）发展中国家必须实爆对应缺设备者无法进入游戏。
