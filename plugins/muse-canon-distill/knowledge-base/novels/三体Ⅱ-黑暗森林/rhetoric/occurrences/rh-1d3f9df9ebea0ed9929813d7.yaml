context_fact: 罗辑怀疑庄颜五年伪装，萨伊说明其生活、性格、思想和爱情都真实，只是接受冬眠安排。
image_mechanism: 政治任务的外壳被剥去后，庄颜仍保留此前白色、安静的天使轮廓，说明角色真实与安排可以并存。
property_alignment: 1）庄颜对应天使；2）纯真对应圣洁；3）文静对应安宁；4）真实爱情对应善意。
context_alignment: 天使意象此前来自罗辑和泰勒，此处由知情者在欺骗质疑中重申，功能从理想化外观转为辨别真实人格。
narrative_function: 阻止罗辑把全部共同生活判为骗局，为忧伤背景的揭示留下复杂性。
