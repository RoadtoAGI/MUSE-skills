tenor: 虚拟三体黑暗荒原中找不到说话者来源、四处移动并持续存在的私语声
vehicle: 没有可见身体、以漂浮方式在黑暗中游动的生物
ground: 1）找不到人对应身体无形；2）声音移动感对应生物漂浮；3）私语持续对应生命活动；4）黑暗包围对应栖息环境；5）多声交错对应生物群。
