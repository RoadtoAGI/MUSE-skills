chapter: 正文
figure_type: simile
quote: 这语声仿佛本身就是黑暗中飘浮的无形生物
sensory_mapping: 无形生物、黑暗漂游、低语呼吸、声源游移
context_fact: 两颗飞星下大地全黑，参与ETO会议的人尚未点燃火把，只能听见私语。
image_mechanism: 声音脱离喉咙获得自主生命，在看不见的高度缓慢游动；听者只能由低语轨迹猜测它们经过。
property_alignment: 1）语声对应生物；2）无说话者可见对应无形；3）声源飘忽对应漂浮；4）持续私语对应生命活动。
context_alignment: 虚拟世界允许物理规则松动，完全黑暗切断视觉后，听觉对象自然占据生物位置，制造秘密集会诡异感。
narrative_function: 在火把点亮人物前延迟身份显露，把ETO会议呈现为黑暗中滋生的生命。
transfer_rule: 声音生物化应赋予明确运动、栖息空间和持续活动，不能只说声音“活了”。
failure_boundary: 实际声音仍由隐藏玩家发出，没有自主生命；声源明确固定或环境明亮时，无形漂游感消失。
