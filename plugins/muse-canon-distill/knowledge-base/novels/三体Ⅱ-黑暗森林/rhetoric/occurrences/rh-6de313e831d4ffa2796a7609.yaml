context_alignment: 奶油喻体先软化材质，女性身体再赋予形态和生命，两个喻体依次完成触感与轮廓的递进。
narrative_function: 把曾吞噬华北的沙化景观纳入胜利黄昏的安宁美感，形成繁荣叙事的危险温柔。
transfer_rule: 地貌作人体时，应以连续曲线对应具体部位，并由光色、静态和观察距离支持睡卧姿态。
failure_boundary: 沙丘形状随风改变且没有生命、性别或意识，身体联想不能美化其生态灾害成因。
