chapter: 正文
figure_type: simile
quote: 荒漠像显影一般清晰起来
sensory_mapping: 暗底、轮廓渐现、明暗层次、相纸图像
context_fact: 雷迪亚兹与艾伦在第一颗原子弹爆心标志旁等待日出。
image_mechanism: 朝阳充当显影液，黑色荒漠是一张潜像相纸，野草和石碑随亮度一层层浮出。
property_alignment: 1）荒漠对应相纸；2）黑暗对应未显影；3）朝阳对应显影剂；4）地貌细节对应图像。
context_alignment: 爆心历史像一张旧照片，摄影过程既贴合视觉渐亮，也让场地记忆被重新显出。
narrative_function: 从核历史的黑暗过渡到新项目的发现希望，同时预备日出触发的恐惧。
transfer_rule: 显影比渐现景物时，应让画面从整体暗到细节分层出现，并有明确光或时间触发。
failure_boundary: 真实显影依靠化学反应而非日光照明；景物一直存在，只是观察条件改变。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 日出光线逐渐照亮、使白沙靶场细节从黑暗中浮现
vehicle: 暗房相纸经显影液处理后图像轮廓逐步出现
ground: 1）黎明前不可见对应空白相纸；2）光线增强对应显影反应；3）地貌细节渐现对应影像浮出；4）整个荒漠成画面对应相纸幅面。
