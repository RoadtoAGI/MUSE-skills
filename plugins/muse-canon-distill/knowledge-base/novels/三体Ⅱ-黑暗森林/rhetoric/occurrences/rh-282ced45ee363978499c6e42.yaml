quote: 像是欧洲修补古建筑时的做法：修补部分呈全新的与原建筑形成鲜明对比的色彩
sensory_mapping: 旧墙新补丁、色块对比、现代材料外挂、历史层次可见
context_fact: 空天飞机机腹有多次再入灼痕，只有翼下两个圆柱助推器看上去很新。
image_mechanism: 飞行器表面被读成一面历史建筑墙，新助推器像两块拒绝仿旧的补材，以颜色主动标注自身年代。
property_alignment: 1）机体对应古建筑；2）助推器对应新修部分；3）烧灼旧色对应原墙；4）新亮色对应现代标识。
context_alignment: 比较解释了本可能显突兀的色差，并把新航天器写出多代部件共存的时间层次。
narrative_function: 强化“新技术却有旧外观”的悖论，映照化学航天已近末代。
transfer_rule: 修复类比应让主体有可见历史层、附加件有清晰年代差，并说明为何不抹平色差。
failure_boundary: 助推器不是为保存历史而故意显新，色差来自使用状态；整体同批生产或统一涂装时该机制失效。
