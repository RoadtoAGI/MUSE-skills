quote: 把这个荣誉强加到我头上
sensory_mapping: 荣誉冠帽、外手下压、头顶负重、拒绝佩戴
context_fact: 罗辑称林格首先观测舰队航迹，林格立即纠正，认为荣誉应属于坚持提前观测的斐兹罗。
image_mechanism: 通常轻盈正面的荣誉突然获得重量与压迫感，错误归功像一双手把不合适的帽子按在林格头上。
property_alignment: 1）媒体荣誉对应帽冠；2）林格对应被戴者；3）归功行为对应扣帽；4）责任感对应不愿承受错位重量。
context_alignment: 林格并非谦辞，而是反复向记者纠错，‘强加’准确体现他把美名体验成事实负担。
narrative_function: 快速刻画科学家的归功原则，并把话题从个人名誉移向航迹定位知识。
transfer_rule: 荣誉作头上重物时，应存在归属错位或附带责任，使接受者确有负担而非普通谦逊。
failure_boundary: 荣誉没有物理重量，林格也可能从报道中获益；若称号准确且自愿，强扣意象会歪曲态度。
