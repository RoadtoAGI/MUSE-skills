chapter: 正文
figure_type: simile
quote: 像蜻蜓点水般轻盈迅捷
sensory_mapping: 翅振、快速俯冲、轻触水面、即时离开
context_fact: 罗辑要求不当面壁者，萨伊不加解释地立刻答“可以”，使他再次失去思路。
image_mechanism: 一个制度性许可缩成昆虫轻触水面的刹那，重若人类命运的问题只激起几乎看不见的涟漪。
property_alignment: 1）问答接触对应蜻蜓点水；2）速度对应迅捷；3）用词简短对应轻盈；4）不纠缠对应立刻离水。
context_alignment: 罗辑预期艰难交涉，答复越轻，面壁逻辑越诡异；轻动作与重大责任的重量差制造不安。
narrative_function: 通过速度反常制造悬念，逼罗辑继续发问并逐步悟出使命不可拒绝。
transfer_rule: 用瞬时动物动作写语言节奏时，要让发言长度、响应延迟和后续停留分别对应动作的轻、快、即离。
failure_boundary: “蜻蜓点水”也可指做事肤浅，本文仅取轻快触碰；迁移时若激活贬义，会歪曲萨伊的意图。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 萨伊对罗辑辞去面壁者要求立即作出的简洁答复
vehicle: 蜻蜓以极轻姿态快速触及水面后立刻离开
ground: 1）回答紧接提问对应点水瞬间；2）措辞只有“可以”对应接触极轻；3）没有追问阻拦对应触水即离；4）出乎预期对应水面只闪过一下。
