figure_type: metaphor
quote: 晚霞的眼睛
sensory_mapping: 深红虹膜、晶亮湿光、杯中圆眼、晚霞凝视
context_fact: 庄颜注意到葡萄酒在火光中很好看，罗辑追问它像什么，她先回答眼睛，随后接受“晚霞的眼睛”。
image_mechanism: 酒杯里的红色被收束成一枚晶亮瞳孔，遥远晚霞获得观看者的器官，静物因此反向凝视两人。
property_alignment: 1）葡萄酒对应眼睛；2）深红对应晚霞虹膜；3）液面反光对应眼神；4）酒杯轮廓对应眼眶。
context_alignment: 火光赋予酒液晚霞色，二人刚谈绘画和色彩，庄颜从视觉联想进入人格化命名符合美术背景。
narrative_function: 让二人以共同命名建立审美默契，并预告随后关于朝霞晚霞的偏好相合。
transfer_rule: 器官暗喻应由形状、颜色和观看关系共同支撑；若要写“眼睛”，最好让对象同时具有回望感。
failure_boundary: 酒液没有意识，圆形也未被原文明说；若杯形或光色不再近似眼睛，命名只剩浪漫姿态。
