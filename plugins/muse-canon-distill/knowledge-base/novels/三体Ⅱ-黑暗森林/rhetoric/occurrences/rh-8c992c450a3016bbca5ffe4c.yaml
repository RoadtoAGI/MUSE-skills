quote: 就像从美国西海岸观察东海岸一盏台灯旁的一只蚊子，而三体舰队只有蚊子腿上的细菌那么大
sensory_mapping: 超远距凝视、层层缩小、灯光、微生物尺度
context_fact: 林格解释哈勃二号虽比现有望远镜强几十倍，仍绝不可能看到三体舰队。
image_mechanism: 不可直觉的天文距离连续折叠成海岸—台灯—蚊子—细菌四级套娃，每深入一级目标都再缩小一次。
property_alignment: 1）星际基线对应跨洲距离；2）恒星系统对应灯旁局部；3）卫星对应蚊体；4）舰队对应细菌；5）成像任务对应远观。
context_alignment: 面对公众误解，科学家需要把数量级差异转成常识尺度；递进缩放比单报分辨率数字更能纠正期待。
narrative_function: 明确望远镜任务的能力边界，并突出军方与公众把科研设备神化的荒谬。
transfer_rule: 解释数量级差距可构造嵌套尺度链，每一层保持同一相对关系，并把最终目标放到读者可判断的分辨极限下。
failure_boundary: 美国海岸、肉眼与望远镜的具体光学条件并不等价；类比只呈现尺度悬殊，不能据此计算实际角分辨率。
