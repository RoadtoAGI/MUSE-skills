figure_type: simile
quote: 就像一只迅猛的牧羊犬奔跑着维持羊群的形状
sensory_mapping: 银色猎犬绕群疾跑、边缘舰只一越线便被咬灭、余舰受驱赶挤回金属云
context_fact: 水滴用不重复路线屠杀内部目标，同时在不同边缘实施拦阻攻击，遏止舰群向外疏散。
image_mechanism: 复杂的动态路径优化转成犬群控制：杀死少数边缘目标即可改变整体运动趋势。
property_alignment: 1）探测器对应牧犬；2）边缘战舰对应离群羊；3）高速截杀对应奔跑驱赶；4）舰群聚集对应维持群形。
context_alignment: 舰队曾是文明武力主体，此刻被降为受一只小动物管理的羊群，准确表现控制权倒置。
narrative_function: 解释水滴看似偏离最短杀戮路线的战术目的，并凸显其计算与威慑能力。
transfer_rule: 边界控制作牧羊时，应映射控制者、离群个体、惩罚动作和群体反馈，让局部动作解释全局形态。
failure_boundary: 水滴直接摧毁目标而非温和驱赶，战舰有自主指挥；羊群比喻不包含各舰策略差异。
quality_assessment: exemplary
