review_status: reviewed
tenor: 水滴不时冲向舰群边缘，优先消灭即将脱离的战舰，迫使其余舰船保持聚集而难以分散逃生
vehicle: 牧羊犬绕着羊群边缘高速奔跑，截住偏离个体并以威慑把群体赶回预定轮廓
ground: 1）水滴对应牧羊犬；2）战舰对应羊；3）边缘攻击对应截羊；4）舰群轮廓对应羊群形状；5）逃逸趋势对应离群。
