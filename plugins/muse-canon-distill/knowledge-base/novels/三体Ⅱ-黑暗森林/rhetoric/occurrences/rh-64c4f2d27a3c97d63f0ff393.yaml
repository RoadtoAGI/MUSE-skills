chapter: 正文
figure_type: simile
quote: 一丝羞涩的微笑像浮云般掠过女孩儿的脸庞
sensory_mapping: 薄云掠面、短暂云影、天幕脸庞、轻柔漂移
context_fact: 庄颜提到苏菲·玛索时带嫉妒委屈，罗辑立即说她更美，她随后小声提议离开。
image_mechanism: 脸庞展开成平静天幕，一小片笑意凝云，被羞涩的风迅速推过，只留下瞬间明暗。
property_alignment: 1）脸庞对应天空；2）微笑对应浮云；3）短暂显露对应掠过；4）羞涩对应云影轻薄。
context_alignment: 这是罗辑第一次见她羞涩，短时性比强度更重要；浮云与此前眼中情绪掠过形成一致而不完全重复的表情语汇。
narrative_function: 确认庄颜开始回应赞美，细微推进双方亲密关系。
transfer_rule: 浮云喻表情应突出出现与消退的速度，并以稳定脸色为天幕，适合轻微而未定型的情绪。
failure_boundary: 该表情不等于持久爱情或嫉妒确认；浓重、长期占据面部的情绪不宜写作一丝浮云。
quality_assessment: effective
