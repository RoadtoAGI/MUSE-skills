tenor: 庄颜听见罗辑称她更美时短暂显露、很快收起的羞涩笑意
vehicle: 一小片轻云从天空表面快速飘过、不久即离开
ground: 1）笑意轻淡对应一丝薄云；2）出现短暂对应掠过；3）脸庞对应天空；4）羞涩收敛对应云不驻留；5）表情带明暗变化对应云影。
