chapter: 正文
figure_type: simile
quote: 罗辑陶醉在这如梦如幻的意境中
sensory_mapping: 时间雾化、画中人物苏醒、现实退场、梦境包裹
context_fact: 夜间卢浮宫只为二人开放，罗辑远看庄颜，任时间流逝而未参与她的观看。
image_mechanism: 展厅边界被柔光溶去，画中人物获得目光，现实钟表停摆；罗辑停在由艺术和爱欲合成的梦层里。
property_alignment: 1）参观体验对应梦幻；2）柔光对应梦境朦胧；3）时间遗忘对应梦无时序；4）画中凝视对应幻象。
context_alignment: 前文庄颜本就是“从梦中走来”，深夜空馆与静默观看让常规词组得到具体场景支撑。
narrative_function: 维持罗辑私人乐园的非现实感，为随后情感幻视全面爆发蓄势。
transfer_rule: “如梦如幻”若要有效，需给出时间、空间或物性至少两处现实规则松动的证据。
failure_boundary: 场景仍在真实卢浮宫，庄颜也在认真学习；若没有活化艺术和失时感，该词组只是陈套。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 深夜空馆、庄颜与古典艺术共同形成的脱离日常时间的沉浸体验
vehicle: 边界模糊、时间失去刻度且美景不受现实约束的梦与幻境
ground: 1）闭馆独处对应梦中无人；2）时间不觉流逝对应梦失时序；3）艺术人物似在观看对应幻象活化；4）庄颜理想化对应梦中完美；5）现实巴黎被隔绝对应脱离日常。
