chapter: 正文
figure_type: simile
quote: 像天神之剑
sensory_mapping: 银光、锋刃、上刺姿态、神话尺度
context_fact: 罗辑在纸上向伽尔宁描述自己要求寻找的理想庄园，首先画出数座险峻雪山。
image_mechanism: 静止山峰被锻成竖立剑刃，雪光转为金属寒芒，地貌因此兼具危险和神圣。
property_alignment: 1）峰尖对应剑尖；2）山脊对应刃口；3）积雪反光对应银刃；4）巨大尺度对应神兵。
context_alignment: 这不是客观地理报告，而是罗辑经营梦境的口述；夸张神兵符合他要求的耀眼奇景。
narrative_function: 迅速立起理想世界的垂直边界，使安逸庄园仍保留远处不可接近的壮丽。
transfer_rule: 兵器比山形时，应对齐轮廓、材质光泽、方向和尺度，并决定意象提供威胁还是守护。
failure_boundary: 雪山没有剑的人工笔直和攻击意图；地势圆缓或光线柔和时，剑喻会制造不存在的锋利。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 罗辑梦想之地中银亮、险峻而直刺蓝天的雪山峰群
vehicle: 天神持有的巨大、锋利并闪着银光的剑刃
ground: 1）山脊尖锐对应剑锋；2）雪面银亮对应金属反光；3）峰体直插天空对应挥向天际；4）超人尺度对应天神兵器。
