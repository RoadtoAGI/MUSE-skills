tenor: 罗辑眼中庄园在妻儿离开后虽物理仍美却不再鲜活、有意义和可居
vehicle: 原本有生命与神圣气息的伊甸园在核心生灵离去后变成无魂空壳
ground: 1）妻儿对应乐园生命核心；2）离开对应灵魂抽离；3）色彩褪去对应生气消失；4）湖面封冻对应活力停止；5）罗辑孤独对应乐园无人。
