quote: 这个伊甸园仿佛是因爱人和孩子的离去而失去了灵气
sensory_mapping: 乐园空置、灵光熄灭、色彩退净、生命气息抽离
context_fact: 庄颜和孩子被送去冬眠，庄园随即入冬，罗辑独自在湖边反复思考。
image_mechanism: 伊甸园外壳仍保留湖山，内部那口使景物发亮的气息却随两个人离场被抽走，颜色和水流同时停息。
property_alignment: 1）庄园对应伊甸园；2）庄颜孩子对应灵气；3）离去对应抽魂；4）冬景对应失去生机。
context_alignment: “伊甸园”是罗辑幸福期反复母题，此处保留地名却撤去灵气，准确完成同一框架的衰败阶段。
narrative_function: 终结私人乐园叙事，把空庄园改造成冷静推演黑暗森林的思想场。
transfer_rule: 地点失灵喻应先建立哪些人物赋予其生命，再以离场后可见的光色、声响或运动减少证明抽离。
failure_boundary: 自然并未因个人离去改变意志，冬季也属正常气候；失灵完全是罗辑主观感受。
