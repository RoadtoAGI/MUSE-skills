quote: 天文专业是铁板一块，在哪儿钻个眼儿都不容易；而社会学之类的是木板，总能找些薄的地方钻透的
sensory_mapping: 触觉硬度、厚度、钻孔动作
context_fact: 罗辑解释自己从天文学转教社会学，坦言想在更容易产生小成果的领域“好混”。
image_mechanism: 把学科知识边界立成不同材质的板面，研究者从正面寻找薄点、用力钻孔，竞争门槛成为可触摸阻力。
property_alignment: 1）知识成熟度对应材料硬度；2）未解决问题的可进入性对应板材薄点；3）发表成果对应钻出孔洞；4）投机选题对应挑软处下钻。
context_alignment: 自嘲式体力劳动喻体符合罗辑此时“胸无大志、比较好混”的口吻，主动降低学术崇高感。
narrative_function: 刻画罗辑聪明而逃避艰难的早期性格，也反衬叶文洁交给他的宇宙社会学将是一块无人碰过的新材料。
transfer_rule: 比较领域门槛时，可把知识成熟度、问题缺口和研究动作分别对应材料硬度、薄处与加工操作。
failure_boundary: 学科难度并非固定材质，社会学的“薄处”也未必容易得出可靠结论；比喻只呈现罗辑的主观择业判断。
