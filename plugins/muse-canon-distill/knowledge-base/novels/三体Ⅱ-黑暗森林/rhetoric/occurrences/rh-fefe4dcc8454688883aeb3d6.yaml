quote: 说不定还不如鸟叫复杂呢，语言是以后才慢慢复杂起来的
sensory_mapping: 短促叫声、少量信号、逐步组合、语言枝杈增长
context_fact: 罗辑质疑表情无法表达飞船航程，庄颜用早期口语也曾简单来支持从简单信息开始。
image_mechanism: 庞大语言树被倒推成几声鸟鸣，复杂句法压回少量信号；这条生长路径又投影到尚不存在的表情语言。
property_alignment: 1）原始语言对应鸟叫；2）简单意思对应有限叫声；3）演化积累对应信号扩展；4）现代语言对应成熟复杂系统。
context_alignment: 庄颜以直觉类比回应技术质疑，重在论证起点可简陋，符合她从具体生命经验出发的说话方式。
narrative_function: 维持表情语言设想的可能性，推动二人亲自试验。
transfer_rule: 演化类比要明确比较的是起始复杂度与增长路径，不能把两个系统的全部机制等同。
failure_boundary: 鸟叫复杂度和语言起源未被此处证实，表情系统也未必沿同一路径演化；类比只能支持“可从简单开始”。
quality_assessment: functional
confidence: 0.95
review_status: reviewed
tenor: 人类原始语言在初生阶段信息容量有限、可经长期使用演化为复杂系统
vehicle: 鸟叫这类有限信号系统，已经能编码若干警告、求偶或群体信息
ground: 1）原始发声对应鸟叫信号；2）表达内容少对应复杂度有限；3）重复使用对应信号约定；4）后续演化对应从简单系统扩展；5）比较下限对应表情语言可从简起步。
