chapter: 正文
figure_type: simile
quote: 客观时间大约流逝了不到十秒钟，主观时间长得像一生
sensory_mapping: 每两次急促心跳才挪过一秒，十秒被拉成长路，罗辑仿佛在枪口前重新活完并耗尽一生
context_fact: 罗辑用心跳数三十秒，一开始数错重来；智子在客观不到十秒时出现，他却无法确认经过多久。
image_mechanism: 钟表时间与体验时间直接换尺，心跳既是计时单位又是被威胁的生命，使短秒获得一生终点。
property_alignment: 1）十秒等待对应人生过程；2）每次心跳对应生命步进；3）自杀风险对应死亡终点；4）心理事件密度对应主观时长。
context_alignment: 罗辑的生命监测信号就是威慑开关，用心跳度量时，‘一生’不是泛称漫长，而与装置条件完全咬合。
narrative_function: 放大三体沉默的每一瞬，把极短策略响应写成罗辑一人承担的完整生命代价。
transfer_rule: 短时作一生时，应让计时单位与人物生命直接关联，并写出终点风险、事件密度和主客观尺度差。
failure_boundary: 客观时间仍不足十秒，罗辑没有真实经历新的完整人生；比喻只刻画紧张下的时间知觉。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 罗辑把枪顶向心脏、等待三体在死亡倒计时内回应时体验到的极端漫长十秒
vehicle: 一个人从出生到死亡的完整一生，时段漫长、事件与恐惧密集，终点就是生命结束
ground: 1）不到十秒对应一生跨度；2）心跳计时对应生命节拍；3）等待终点对应走向死亡；4）高度紧张对应一生经验密度；5）智子出现对应终局到达。
