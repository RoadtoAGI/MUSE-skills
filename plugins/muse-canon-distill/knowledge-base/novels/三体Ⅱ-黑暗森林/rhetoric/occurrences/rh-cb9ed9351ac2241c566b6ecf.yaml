quote: 如果把那黑色绒面变成蓝色，就很像现在看到的天空了
sensory_mapping: 蓝绒铺底、银件散陈、细光闪耀、穹顶成展柜
context_fact: 罗辑仰望地下城天空投影，看到大量轨道设施亮点，由为想象中庄颜选礼物的珠宝店记忆触发联想。
image_mechanism: 天空倒扣成巨大展柜，遥远航天器失去工业重量，化为铺在柔软底色上的精巧银饰；只需替换绒布颜色，两幅画面即可重合。
property_alignment: 1）天幕对应绒面；2）轨道物体对应挂件；3）阳光对应聚光灯；4）金属反光对应银光；5）视距缩小对应首饰般细小。
context_alignment: 联想明确来自罗辑个人爱情记忆，使未来太空繁荣既可视又与庄颜缺席相连，避免通用‘繁星’陈词。
narrative_function: 用私人记忆测量未来天空的陌生物体，在技术奇观中悄悄恢复罗辑的情感连续性。
transfer_rule: 由记忆场景类比陌生景观时，应找到底色、物件尺度、光源和陈列关系的整体同构，并保留联想者的个人缘由。
failure_boundary: 太空设施体量巨大、在轨运动且功能复杂，珠宝静置于近处；蓝黑换色只解决视觉构图。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 蓝色天幕上密布的细小太空城与飞船亮点，大小精致并在光照下闪烁
vehicle: 珠宝展柜的绒面上摊放许多细小白金挂件，在聚光灯下发出银色亮光
ground: 1）蓝天对应换色绒面；2）太空物体对应白金挂件；3）细小精致对应首饰尺度感；4）银光闪烁对应聚光反射；5）密布陈列对应展柜铺排。
