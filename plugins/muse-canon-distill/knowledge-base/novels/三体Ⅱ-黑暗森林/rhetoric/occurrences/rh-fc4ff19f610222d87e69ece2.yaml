context_fact: 丁仪列举人类仅存的理论储备：古典物理、量子力学以及弦论，基础物理又被智子锁死。
image_mechanism: 一套尚在推演的理论获得生命阶段，它不是空白，却还没有脱离孕育环境成为可用个体。
property_alignment: 1）弦论对应胎儿；2）理论研究对应孕育；3）成熟体系对应出生；4）工程能力对应独立生存。
context_alignment: 与两套成熟理论并列时，胎儿形象立即标出弦论的代际差和不确定性，解释人类理论家底为何贫弱。
narrative_function: 以口语化生命阶段说明前沿理论不可支用，强化智子胜利后的技术绝境。
transfer_rule: 理论作胎儿应区分已有胚芽、成熟过程和可用出生点；完全没有雏形的设想不宜称在娘胎。
failure_boundary: 理论发展没有固定孕期，也可能被证伪而非顺利出生；弦论不同分支的成熟度不能被一概而论。
