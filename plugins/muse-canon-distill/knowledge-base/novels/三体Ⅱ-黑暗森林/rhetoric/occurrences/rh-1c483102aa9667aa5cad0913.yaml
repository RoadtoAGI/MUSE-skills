context_fact: 史强劝下属别因常伟思升职及其旧部态度而自卑，并列举己方实战贡献。
image_mechanism: 官场傲慢直接改造人体，把正常眼位推到颅顶，职位高低变成观看角度的畸形。
property_alignment: 1）傲慢者对应头顶长眼者；2）基层人员对应下方对象；3）升迁优越感对应眼位升高；4）轻视对应俯看。
context_alignment: 粗俗夸张符合史强训话口吻，身体化比“态度傲慢”更有嘲讽攻击力。
narrative_function: 消解权威光环，巩固史强团队以实战而非级别判断价值的声音。
transfer_rule: 器官错位写傲慢时，要让位置变化直接改变人物观看他人的角度，并由权力高低支撑。
failure_boundary: 职位较高不必然傲慢，畸形化属于说话者评价；不能据此概括全部机关人员。
