quote: 他就像一支点在夏夜里的蜡烛，那些词句像烛火周围的小虫子，不停地向他的脑子里钻
sensory_mapping: 视觉、运动、听觉侵入
context_fact: 餐厅各桌都在谈逃亡主义、ETO和战时经济，罗辑不想听却不断捕捉到术语。
image_mechanism: 把听觉碎片变成有趋光性的虫群，它们从四周主动逼近固定的意识中心，让被动接收具有烦扰运动。
property_alignment: 1）人物注意力对应烛火；2）碎词对应密集小虫；3）反复传入对应绕飞扑火；4）难以屏蔽对应虫群持续围困。
context_alignment: 早餐厅嘈杂且话语只以碎片抵达，虫群的零散、重复运动比连续对话更贴合。
narrative_function: 显示时代议题已无法被个人生活隔绝，并预演罗辑即将被强行拉入全球使命。
transfer_rule: 写信息侵入时，可给碎片一个持续趋近的运动动因，并让接收者的某种状态成为吸引中心。
failure_boundary: 若信息完整有序、人物主动寻听，虫群的随机烦扰与被动侵入都不成立。
