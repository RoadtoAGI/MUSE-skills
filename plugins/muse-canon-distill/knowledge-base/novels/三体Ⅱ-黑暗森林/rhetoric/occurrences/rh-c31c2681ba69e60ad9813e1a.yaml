chapter: 正文
figure_type: simile
quote: 像狗似的献媚着
sensory_mapping: 俯身、贴近、摇尾般动作、主仆距离
context_fact: 官员拒绝科学家进入贵宾看台，随即转向军装笔挺的将军们并领其通过岗哨。
image_mechanism: 人的礼貌动作被压低成犬类求宠姿态，权力梯度通过身体高度和依附方向显形。
property_alignment: 1）官员对应犬；2）将军对应主人；3）献媚对应摇尾求宠；4）通行特权对应奖赏。
context_alignment: 比喻来自受辱科学家林格的愤怒视角，粗鄙动物化与他称对方“狗娘养的”保持声音一致。
narrative_function: 建立科学共同体与军事接管之间的怨恨，为哈勃二号从科研设备变成战略资产定调。
transfer_rule: 动物比拟用于权力谄媚时，应从姿态、依附对象和预期奖赏建立映射，并让措辞属于明确人物视角。
failure_boundary: 顺从公务礼仪并不必然是献媚；脱离林格的愤怒判断，犬化会把动机武断降格。
quality_assessment: effective
