review_status: reviewed
tenor: NASA官员转向将军们时低姿态讨好、争取认可的行为
vehicle: 狗向主人摇尾贴近以换取宠爱或奖赏
ground: 1）权力不对等对应主人与狗；2）姿态骤然柔顺对应摇尾贴近；3）讨好期待回报对应求宠；4）对科学家粗暴而对将军谄媚对应择强依附。
