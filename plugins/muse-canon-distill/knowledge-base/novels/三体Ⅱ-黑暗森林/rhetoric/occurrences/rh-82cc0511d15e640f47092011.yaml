chapter: 正文
figure_type: metaphor
quote: 宇宙是很大，但生命更大
sensory_mapping: 银河像巨大空室，生命从微小一点急速膨胀，触到四壁后仍继续挤压每处空隙
context_fact: 大史认为宇宙太大而不缺资源，罗辑随即用指数增长和百万年扩遍银河反驳。
image_mechanism: ‘大’从空间尺寸转为增长与占用能力，同一量词制造悖论，再由指数机制消解尺度直觉。
property_alignment: 1）宇宙尺度对应容积；2）生命数量与活动域对应占用体积；3）文明复制对应膨胀；4）生存死局对应无空隙。
context_alignment: 面对大史的生活化疑问，罗辑先用一句尺寸反转抓住直觉，再接细菌模型给出数量证明。
narrative_function: 将第二公理转为可记忆判断，建立资源有限与生命增长冲突的核心张力。
transfer_rule: 用同一尺度词反转论证时，应明确两端测量的不同属性，并紧跟机制解释为何可比较。
failure_boundary: 生命没有统一物理外形可量尺寸，‘更大’指潜在数量与资源范围；不等于当前生命体积已超过宇宙。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 有限宇宙虽有巨大物质总量，生命和文明的指数增长及资源占用潜力仍能在短宇宙时间内覆盖它
vehicle: 容器本身很大，但其中不断膨胀的占据物增长得更大，最终触及并挤满全部边界
ground: 1）宇宙物质对应有限容器；2）生命扩张对应膨胀物；3）指数增长对应体积快速增大；4）资源耗尽对应容器被填满。
