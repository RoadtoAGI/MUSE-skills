tenor: 能驱使成员牺牲生命并攻击共同敌人的仇恨
vehicle: 锋利到足以穿透防御、直接造成最大杀伤的武器
ground: 1）仇恨促成攻击对应武器杀伤；2）使人献身对应高威力；3）指向敌人对应武器瞄准；4）长期积累对应武器储备；5）消失后不能作战对应失去装备。
