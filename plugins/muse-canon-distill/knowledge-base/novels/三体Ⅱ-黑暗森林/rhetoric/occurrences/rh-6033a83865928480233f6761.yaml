chapter: 正文
figure_type: metaphor
quote: 这世界上最犀利的武器
sensory_mapping: 锋刃出鞘、目标锁定、杀伤释放、武器库空置
context_fact: 老人解释组织曾靠对西方的仇恨存在，如今共同外敌使这种仇恨消退。
image_mechanism: 无形情绪被锻成一把有刃的兵器，敌人名称决定刀锋朝向；仇恨消失，成员手中只剩空握。
property_alignment: 1）仇恨对应武器；2）敌对对象对应靶标；3）献身行动对应攻击；4）情绪强度对应锋利度。
context_alignment: 泰勒正寻找以生命为武器的力量，老人用同一军事语言指出真正武器是仇恨，直接反转访谈目标。
narrative_function: 把敢死精神还原为敌意机制，拆毁泰勒将其抽象移植到太空军的幻想。
transfer_rule: 情绪—武器喻要说明瞄准对象、释放行为和杀伤结果，并让场景确在讨论行动动员。
failure_boundary: 仇恨无法保证战术效果，也可能反噬持有者；没有组织、目标和行动渠道时，它未必转化为武器。
quality_assessment: exemplary
