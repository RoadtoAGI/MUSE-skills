quote: 使得之前脑科学的所有研究成为浮光掠影的表面文章
sensory_mapping: 水面闪光、快速影子、薄层文字、向下深入
context_fact: 叙述称希恩斯夫妇发现思维记忆在量子层进行，把大脑机制的物质层次向下推进一级。
image_mechanism: 旧知识被压在一层薄表皮上，只留下滑过的光斑和浅字；新理论像钻头向下穿进更深材料。
property_alignment: 1）旧成果对应表面文章；2）有限观察对应掠影；3）量子机制对应内部深层；4）理论突破对应下钻。
context_alignment: “向下推一级”的空间表述已建立深浅轴，表面文章沿同一轴评价旧研究，结构紧密。
narrative_function: 夸张突出发现的革命性，解释双学科诺奖提名。
transfer_rule: 深浅隐喻评价研究时，应明确旧工作停在哪一层、新证据进入哪一层，以及表层成果仍有哪些有效部分。
failure_boundary: 新层次不会让全部旧研究失效，“所有”带人物简介式夸张；深层也不自动更完整或更正确。
