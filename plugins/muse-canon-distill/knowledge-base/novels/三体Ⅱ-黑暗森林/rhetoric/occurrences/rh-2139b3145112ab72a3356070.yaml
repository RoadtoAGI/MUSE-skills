tenor: 穿梭艇微弱发动机光只照亮量子号巨大舰体下方很小一片区域
vehicle: 深崖底部一支小蜡烛发出有限暖光，只能照见近旁岩壁，无法撼动整座悬崖黑影
ground: 1）量子号舰体对应悬崖；2）穿梭艇尾焰对应蜡烛；3）尺寸差对应崖与烛；4）局部照亮对应烛光范围；5）母舰阴影对应崖影；6）小艇脆弱对应烛火易灭。
