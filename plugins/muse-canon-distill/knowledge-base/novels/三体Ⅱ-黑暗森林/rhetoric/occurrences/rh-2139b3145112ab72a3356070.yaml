chapter: 正文
figure_type: simile
quote: 像一支悬崖下的蜡烛
sensory_mapping: 钢铁悬崖压在上方、底下一点烛火、亮区贴着舰壁、四周黑暗巨大
context_fact: 穿梭艇驶出量子号时发动机功率有限，光芒只覆盖母舰外壳的一小块。
image_mechanism: 光照比例转成垂直地形，母舰像压顶悬崖，小艇只剩崖脚烛火，安全庇护和个体脆弱同时显现。
property_alignment: 1）母舰对应悬崖；2）小艇对应蜡烛；3）发动机光对应烛焰；4）局部反光对应照亮岩面；5）舰体阴影对应崖下暗处；6）考察队生命对应易灭火苗。
context_alignment: 人物即将离开舰队巨体并被水滴摧毁，蜡烛的易灭性构成清晰死亡预兆。
narrative_function: 在同一句汽车类比之后骤然增加压迫与脆弱，使航程从日常交通转为离开庇护。
transfer_rule: 小光源贴近巨物时，可用烛与崖对齐亮区比例、垂直压迫和熄灭风险，避免只说大小。
failure_boundary: 发动机光远强于蜡烛，量子号也不是自然崖壁；烛火意象不描述真实推进能力。
quality_assessment: exemplary
