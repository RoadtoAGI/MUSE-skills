quote: 这儿像不像一个经营惨淡的夫妻店
sensory_mapping: 夫妻守柜、门厅空荡、游客只看不进、冷清小店
context_fact: 建筑已成旅游景点，人们在女神像和信念碑前拍照，却谨慎与中心保持距离，没有顾客。
image_mechanism: 庄严国际设施被缩小成街边店面，宏大信念变成货架服务，夫妇守着空门的尴尬因此带上日常喜剧。
property_alignment: 1）信念中心对应夫妻店；2）两位科学家对应店主；3）自愿者对应顾客；4）钢印操作对应商品服务；5）无人使用对应经营惨淡。
context_alignment: 比喻出自惠子对丈夫的私语，以家庭经营消解门厅庄严，符合二人并肩研究和等待的夫妻关系。
narrative_function: 短暂释放思想控制争议的紧张，也反衬希恩斯坚信此处终会成为圣地。
transfer_rule: 机构作店铺时，应对齐经营者、服务、顾客与客流状态，并利用尺度降格形成语气效果。
failure_boundary: 信念中心不收费也不追求利润，使用受军籍与监督限制；经营惨淡不能等同社会没有需求。
