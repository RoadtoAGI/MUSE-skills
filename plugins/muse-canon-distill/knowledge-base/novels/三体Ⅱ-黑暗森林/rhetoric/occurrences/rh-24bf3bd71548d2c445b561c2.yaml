chapter: 正文
figure_type: simile
quote: 飞船的外壁如镜面般光滑，完美地映出木星的大气海洋
sensory_mapping: 钢壁无纹、木星倒映、交通艇影靠近、巨镜铺满视野
context_fact: 交通艇已靠得无法看见整艘巨舰，只能在占满视野的局部外壁及其反射中判断周围。
image_mechanism: 装甲表面暂时取消钢铁粗重感，展开成一面天体尺度镜子；木星大气海洋被搬到舰壁上，交通艇也进入这幅反像。
property_alignment: 1）飞船外壁对应镜子；2）高精加工对应镜面光滑；3）木星对应被映景物；4）交通艇对应镜前物体；5）舰体曲面对应广阔反射面。
context_alignment: 章北海正从外部第一次接触精神家园，镜面既展示未来制造精度，也让木星基地与巨舰在同一表面合为一景。
narrative_function: 通过反射而非参数表现巨舰外壳品质与尺度，并在入舰前制造庄严、近乎无瑕的门面。
transfer_rule: 物体表面作镜面时，应同时具备平整度、反射清晰度、足够面积和明确被映对象，避免只写发亮。
failure_boundary: 舰壳需要装甲、传感器和结构接缝，不可能等同光学镜面；反射也受曲率与入射角影响。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: ‘自然选择’号巨大外壳平整光洁、反射率高，能完整呈现木星彩色大气与接近中的交通艇
vehicle: 表面高度平整、能清晰反射外界景物和运动物体的巨大镜面
ground: 1）舰壳对应镜面；2）材料光滑对应镜面平整；3）木星影像对应镜中景物；4）交通艇映像对应镜中移动点；5）广阔外壁对应巨镜面积；6）反射清晰对应成像完整。
