context_fact: 丁仪解释空间站项目用上百个低成本检测点观察宇宙高能粒子，并由结果判断更多智子已到太阳系。
image_mechanism: 实验室机器的真空管被扩张到整个宇宙，星际空间负责加速，科学家只需在各处摆下终端接住粒子。
property_alignment: 1）宇宙对应加速器主体；2）射线对应输出束；3）检测点对应终端；4）撞击事件对应实验数据；5）自然随机性对应不可控束流。
context_alignment: 基础加速器被智子锁死且造价高，替代模型准确说明项目为何转向太空、又为何需大规模分布式检测。
narrative_function: 清楚交代关键实验设计，并引出智子已能同时污染上百检测点的更坏结论。
transfer_rule: 自然系统替代设备的类比要逐项对应输入、处理过程、输出和检测端，同时明确失去哪些控制变量。
failure_boundary: 宇宙射线能量和到达时间不可控，不能完整替代人工加速器；类比解释功能重合，不证明实验等价。
