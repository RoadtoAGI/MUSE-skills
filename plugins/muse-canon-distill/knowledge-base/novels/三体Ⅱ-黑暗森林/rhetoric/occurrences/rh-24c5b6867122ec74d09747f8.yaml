tenor: 核爆强光照亮整支舰队，使舰体轮廓从深黑太空与变暗星海前清晰显现
vehicle: 黑色天鹅绒表面吸收光线、质地均匀，放在其上的亮物边缘鲜明并显得更耀眼
ground: 1）太空对应黑绒布；2）深黑对应吸光颜色；3）舰队对应陈列亮物；4）核火球对应照明；5）凸现对应高反差。
