chapter: 正文
figure_type: simile
quote: 在黑天鹅绒般的太空背景上凸现出来
sensory_mapping: 宇宙铺成无纹黑绒、火球骤亮、舰阵像展品从背景上浮起、银河被压暗
context_fact: ‘无限边疆’号聚变爆炸迅速扩张，强光照亮整个舰队并使银河失色。
image_mechanism: 无边空间被压平为展示衬布，光度反差让二维背景托出舰队几何形状。
property_alignment: 1）宇宙黑暗对应绒布黑色；2）星光受压对应绒面吸光；3）舰体轮廓对应展品边缘；4）爆光对应聚光灯。
context_alignment: 舰队像庄严陈列品被最后照亮，下一刻整列熔毁，展示感兼具祭台意味。
narrative_function: 建立爆炸全景的高反差底幕，让第一艘战舰毁灭具有照亮全军的信号作用。
transfer_rule: 暗场作天鹅绒时，应利用吸光、均匀、平面衬托和亮物边缘，而非只借黑色。
failure_boundary: 太空没有织物纹理或实体平面，星海只是相对核火球变暗，并未真正被遮蔽。
