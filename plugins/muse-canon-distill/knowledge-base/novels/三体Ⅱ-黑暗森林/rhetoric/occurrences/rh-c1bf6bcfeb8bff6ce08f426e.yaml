chapter: 正文
figure_type: analogy
quote: 如何用大理石做一张床，使人躺上去感觉像席梦思一样柔软
sensory_mapping: 背部触压、曲面凹槽、冷硬石材、软床承托
context_fact: 罗辑躺在默思室铁矿石上，用中学物理题和想象中的体温熔坑平复狂躁。
image_mechanism: 柔软从材料属性移到压力分布：石头不变软，身体形状却刻进表面，让触觉结果翻转。
property_alignment: 1）人体凹槽对应床垫形变；2）均压对应柔软触感；3）大理石对应固定承托面；4）席梦思对应自适应承托面。
context_alignment: 罗辑刚被制度铁环锁住，却以理性想象让同样坚硬的矿石迁就身体；物理题成为心理自救方法。
narrative_function: 把抽象冷静过程变为压力重新分配，也暗示他将利用面壁权力让世界按个人欲望塑形。
transfer_rule: 功能类比可让两种相反材料通过同一作用结果相连，关键要写清中间机制，而非只比最终感觉。
failure_boundary: 凿成人体形状只适配固定姿势和特定个体，也不等于材料变软；离开均压条件便不能推广。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 通过按人体曲面分散压强，使坚硬石床产生舒适承托感的物理设想
vehicle: 会顺应身体、均匀承托各处的席梦思软床垫
ground: 1）贴合背部曲线对应床垫下陷；2）受力面积增大对应均匀承托；3）局部压强下降对应不硌痛；4）材料虽硬却有柔软体感对应功能相同而材质相反。
