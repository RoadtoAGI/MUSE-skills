tenor: 大批穿发光信息服的人密集横排在沙漠公路前，形成连续阻挡并围候罗辑
vehicle: 墙体由紧密材料构成，横向延伸、难以穿过，形成空间边界并遮住后方
ground: 1）个体人身对应砖块；2）密集排列对应砌合；3）横挡道路对应墙面；4）发光衣对应彩色墙材；5）难以通过对应阻挡。
