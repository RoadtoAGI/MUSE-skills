chapter: 正文
figure_type: metaphor
quote: 他们面对着一道光怪陆离的人墙
sensory_mapping: 发光人群一层层砌起、无缝横在车前、衣服图像使墙面不断变色、罗辑面对其巨大立面
context_fact: 城内民众聚集在新生活五村外等罗辑，车辆接近时人群抬手挡光并围成连续前沿。
image_mechanism: 人群数量与密度被建筑化，个体表情暂时消失，发光服装成为动态墙面纹理。
property_alignment: 1）人对应墙砖；2）肩并肩对应砌缝闭合；3）队列前沿对应墙面；4）道路对应被隔空间；5）信息服对应装饰光。
context_alignment: 罗辑刚以为可回家，人墙却把私人道路重新封成公共救世舞台，物理阻挡对应身份召回。
narrative_function: 先隐藏人群意图、制造异类压迫感，再通过集体下跪把墙转为退潮。
transfer_rule: 密集人群作墙时，应匹配单元、排列、边界、阻挡方向和表面变化，并关注群体动作如何拆墙。
failure_boundary: 人群可移动、有意志且留出道路，不具墙的固定硬度；此处最终并未暴力阻拦。
quality_assessment: effective
