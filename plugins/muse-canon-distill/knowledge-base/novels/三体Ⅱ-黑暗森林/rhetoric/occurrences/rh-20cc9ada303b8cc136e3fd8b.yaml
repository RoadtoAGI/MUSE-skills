quote: 曾经的家园现在是一个死亡陷阱
sensory_mapping: 返乡道路通向熟悉门口、门后藏着银色杀器、旧家变成合拢的捕兽夹
context_fact: 水滴仍在太阳系，另九个即将到达；五舰无法返回，地球社会也可能先于主舰队崩溃。
image_mechanism: 家园的安全语义被翻面成诱捕结构，‘回去’从方向选择变为主动进入死亡机制。
property_alignment: 1）太阳系边界对应陷阱范围；2）水滴对应杀伤机关；3）返航舰队对应猎物；4）乡土吸引对应诱饵。
context_alignment: 章北海刚得到五舰指挥权，必须切断众人返乡心理，家园—陷阱反转直接完成精神断航。
narrative_function: 为‘回不去了’提供战略图像，迫使星舰地球从逃亡编队转为独立社会。
transfer_rule: 安全之地转为陷阱时，应保留熟悉诱引、设置明确杀伤机制并说明进入后为何无法退出。
failure_boundary: 太阳系并非处处有机关，部分小型航天器仍可活动；死亡结论针对五舰回航与当前技术条件。
