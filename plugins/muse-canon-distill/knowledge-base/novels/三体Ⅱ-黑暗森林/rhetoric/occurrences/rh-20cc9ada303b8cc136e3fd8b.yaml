tenor: 太阳系原是五舰人员的故乡，如今回航会遭水滴拦截，且地球文明本身可能迅速崩溃
vehicle: 熟悉住所外表仍像可归之处，内部却设有致命机关，进入者将被困并遭杀害
ground: 1）太阳系对应家园空间；2）水滴封锁对应机关；3）回航对应入陷阱；4）无防御手段对应无法脱身；5）地球崩溃对应庇护失效。
