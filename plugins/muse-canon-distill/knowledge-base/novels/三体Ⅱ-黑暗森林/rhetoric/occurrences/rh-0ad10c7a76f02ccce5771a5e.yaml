chapter: 正文
figure_type: simile
quote: 你就像画中的空白
sensory_mapping: 洁白空域、无墨静处、隐含景深、观者凝视
context_fact: 庄颜刚解释国画留白是画的眼睛，罗辑随即在心里把她放进该审美框架。
image_mechanism: 庄颜的身体轮廓被减去繁复色彩，化成画面中央一块洁白开放区域；她未明说的内容由观看者在空处补全。
property_alignment: 1）庄颜对应留白；2）纯洁对应白纸；3）含蓄对应无墨；4）内在美对应想象空间。
context_alignment: 比喻借用庄颜自己的美学语言回应她，贴合罗辑把她视为纯净而待解读的理想形象。
narrative_function: 把景物类比转为人物赞美，并显露罗辑以自身想象填充庄颜的观看方式。
transfer_rule: 以留白写人物应保留“少显露、容纳多重解读”的双层结构，并让人物确有含蓄或安静表现。
failure_boundary: 庄颜不是供罗辑填充的空容器，她有独立意愿；若人物表达强烈繁复，留白喻会抹平其个性。
