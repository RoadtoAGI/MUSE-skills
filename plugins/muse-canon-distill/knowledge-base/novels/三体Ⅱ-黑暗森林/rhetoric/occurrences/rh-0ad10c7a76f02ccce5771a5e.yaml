tenor: 罗辑眼中庄颜纯净、安静却蕴含丰富美感的存在方式
vehicle: 国画中表面无墨、实则组织观看并容纳想象的留白
ground: 1）庄颜纯净对应无墨白处；2）沉静含蓄对应表面空无；3）内在美丰富对应留白容纳想象；4）融入风景对应空白属于构图；5）需成熟欣赏对应留白价值依赖观者。
