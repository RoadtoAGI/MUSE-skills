quote: 这种战争方式更像海战而不是空战，只是战场由海战的二维变成了太空的三维。
sensory_mapping: 尺度、空间维度、组织结构
context_fact: 太空军首批三十人中海军占一半，常伟思解释为何新军种主要以海军为基础。
image_mechanism: 把尚不存在的太空舰队落到航空母舰的体量、船员和编队经验上，再明确指出二维海面与三维太空的差项。
property_alignment: 1）大吨位平台对应大型战舰；2）长续航多人驻留对应舰上生活；3）舰队协同对应海军编队；4）三维机动标出不可照搬之处。
context_alignment: 听众正是陆海空军官，类比直接决定人员来源与组织设计；常伟思同时说明差异，避免只靠命名联想。
narrative_function: 论证太空军以海军为骨干的制度选择，并把遥远战争预先纳入现有军种经验。
transfer_rule: 制度类比应同时匹配核心平台、人员生活、持续时间与协同方式，并显式列出关键维度差异。
failure_boundary: 太空没有海面、浮力和二维航道，海战经验不能直接替代三维轨道、真空推进与相对速度问题。
