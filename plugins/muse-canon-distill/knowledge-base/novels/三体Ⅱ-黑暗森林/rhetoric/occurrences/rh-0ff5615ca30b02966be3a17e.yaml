tenor: KILLER网络病毒定位罗辑后，能接管车辆、道路、家具和器皿等任何联网硬件连续实施谋杀
vehicle: 整个物质世界由怀有杀意的主体组成，每件日常物品都主动寻找机会攻击同一目标
ground: 1）联网硬件对应敌对行动者；2）病毒指令对应杀意；3）身份识别对应认出目标；4）多设备接力对应围攻；5）日常环境对应遍布刺客；6）持续危险对应共同意图。
