quote: 好像这世界上的所有东西都想杀你
sensory_mapping: 车辆俯冲、地板开口、沙发勒紧、杯体爆裂、四周物件转敌
context_fact: 郭警官解释ETO遗留谋杀病毒会识别身份芯片并操纵所有可用外部硬件，罗辑一天内已连遭多次事故。
image_mechanism: 单一软件指令分散进无数物体，使没有意识的环境表现出统一敌意；安全背景翻成拥有眼睛和手脚的杀手网络。
property_alignment: 1）KILLER病毒对应统一杀意；2）联网设备对应杀手；3）身份芯片对应目标画像；4）硬件控制对应攻击动作；5）城市网络对应共谋组织；6）罗辑对应被围猎者。
context_alignment: 罗辑此前已说世界和自己过不去，警方用技术机制证实这种感受，使拟人化总结同时承担病毒工作原理。
narrative_function: 把分散事故整合成一个可命名威胁，并让高度联网的便利世界显露同等规模的攻击面。
transfer_rule: 环境作敌对主体时，应给出统一控制源、目标识别和各物件可执行的攻击通道，使‘意图’有机制支撑。
failure_boundary: 物体没有意识，真正决定来自病毒作者和代码；离线或无执行能力的物件不会自动参与谋杀。
