tenor: 暴风云下海面被夕阳光柱照亮的几块金色区域
vehicle: 从天国飘落到暗色世界的巨大金色花瓣
ground: 1）光斑片状轮廓对应花瓣；2）金色亮面对应花瓣华美色泽；3）光柱由云隙落下对应从天国飘落；4）周围暗海对应花瓣外的黑暗背景。
