quote: 几片巨大的金色光斑，像自天国飘落的花瓣
sensory_mapping: 视觉、色彩、下落空间
context_fact: 章北海回忆父亲曾经历的怒海，黑云中几束夕阳落到海面，形成局部金光。
image_mechanism: 把无形光线凝成有边缘、有颜色的花瓣，再从云上赋予下落路径，短暂余晖像礼物落在风暴中。
property_alignment: 1）片状光区对应花瓣形面；2）金光对应花瓣色泽；3）穿云光柱对应飘落路线；4）短暂存在对应花瓣易逝。
context_alignment: 父亲也正处生命夕照，天国意象与病房诀别相连；怒海中的花瓣又保留军人生涯的壮美。
narrative_function: 把父亲最后余晖与海上记忆叠合，使死亡临近获得庄严而非衰败的视觉形式。
transfer_rule: 写局部光斑时，可让形状、来源方向、颜色与消逝时间共同选择喻体，并让其回应人物处境。
failure_boundary: 均匀照亮整片海面或无云直射时不存在花瓣的片状与飘落感；天国只承载告别氛围。
