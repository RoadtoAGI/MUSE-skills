chapter: 正文
figure_type: simile
quote: 像四把飞行在云海上的银色利剑
sensory_mapping: 视觉、线形、金属光泽、运动
context_fact: 罗辑夜间从舷窗发现专机两侧有多架歼击机护航，尾迹被月光照亮。
image_mechanism: 把飞机与尾迹合成长兵器，月光提供银刃，编队速度使四剑悬在云海上共同前刺。
property_alignment: 1）凝结尾迹对应剑刃；2）歼击机金属头部对应锋端；3）编队平行对应列剑；4）护航火力对应武器属性。
context_alignment: 罗辑刚意识到保护级别异常，利剑既准确呈形，也将护航的军事威慑显露出来。
narrative_function: 在静谧月色中揭示巨大安保规模，使未知使命的严峻性再次升级。
transfer_rule: 将飞行器写成兵器时，应让机体、尾迹、编队方向和实际战斗功能分别对应兵器部位与用途。
failure_boundary: 弯曲散乱尾迹或民用无武装编队不适合利剑；尾迹是凝结云，并非实体剑身。
