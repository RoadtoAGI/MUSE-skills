tenor: 四架护航歼击机及其在月光云海上拉出的笔直银色尾迹
vehicle: 四把平行飞行、刃身闪亮且指向前方的银剑
ground: 1）笔直尾迹对应长剑剑身；2）机头金属物对应剑尖或剑柄；3）四线同速护航对应并列兵刃；4）战机保护与攻击能力对应利剑威慑。
