chapter: 正文
figure_type: metaphor
quote: 技术被深深地隐藏在现实的后面
sensory_mapping: 白色现实铺在前景、机器退入深处、表面空无、需要时设施从幕后浮现
context_fact: ‘自然选择’号没有固定驾驶舱和仪表，任何舱室都能按权限调出全息界面，设施平时完全消失。
image_mechanism: 技术进步不再增加可见器物，而把复杂度推向表层之后；空间深度对应用户与实现细节的距离。
property_alignment: 1）现实表面对应舞台前景；2）自动系统对应幕后机械；3）空舱对应无景舞台；4）全息界面对应临时上场道具；5）权限请求对应开幕指令；6）内部复杂度对应幕后深度。
context_alignment: 前文把未来地球写成屏幕砖砌成的显性信息世界，舰队则让设施消失，‘现实后面’准确区分两个技术风格。
narrative_function: 命名去设施化的审美与认知代价，并为舰长只见简单界面、技术过程成为黑箱继续铺垫。
transfer_rule: 技术作幕后时，应写明前台保留什么、复杂度藏到哪一层、由何种权限召回，以及隐藏如何改变责任。
failure_boundary: 技术仍占据物质空间并需要维护，‘后面’是界面层级而非固定方位；不可见不等于不存在或可靠。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 舰队高度自动化后，复杂设备和计算过程从日常可见界面撤下，只在需要时从简洁环境中出现
vehicle: 庞大机构躲在舞台布景或表层世界背后，观众只见干净前景，触发时隐藏部分才现身工作
ground: 1）日常环境对应前景幕面；2）复杂技术对应幕后机构；3）设施不可见对应隐藏；4）按需出现对应上场；5）用户操作对应召唤；6）简洁空间对应空舞台。
