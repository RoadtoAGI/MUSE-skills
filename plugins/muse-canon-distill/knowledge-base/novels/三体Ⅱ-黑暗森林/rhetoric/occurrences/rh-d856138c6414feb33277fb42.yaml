quote: 罗辑这时突然像两个世纪前的吴岳一样，悔恨自己是个无神论者
sensory_mapping: 两个世纪前吴岳的绝望影子叠到罗辑身上、两人都站在死亡门前、身后没有可相信的来世道路
context_fact: 罗辑刚与大史告别并说也许在别处再见，想到上次重逢靠冬眠，这次可能需跨越死亡。
image_mechanism: 相隔两世纪的人物在同一死亡困境中重叠，个人情绪借已知先例获得历史回声。
property_alignment: 1）两人对应处境同位者；2）末日/水滴对应死亡威胁；3）信仰缺失对应无彼岸；4）告别亲友对应重逢愿望。
context_alignment: 罗辑曾旁观吴岳崩溃，如今走到相同心理位置，类比完成角色从理性评论者到临终普通人的转换。
narrative_function: 让罗辑对死亡的恐惧穿透救世身份，并回收危机初期人物的精神创伤。
transfer_rule: 人物类比前例时，应对应触发处境、核心缺失、情感反应和两案差异，使历史镜像推动自我认识。
failure_boundary: 吴岳的绝望源于军人使命崩溃，罗辑源于预期被杀与告别；两人的信仰经历并不完全相同。
