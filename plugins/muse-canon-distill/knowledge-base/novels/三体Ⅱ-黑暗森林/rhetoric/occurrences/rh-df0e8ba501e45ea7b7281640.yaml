tenor: 面壁者身份令任何拒绝或反常行为都被解释为计划组成部分的自证逻辑
vehicle: 一经施放便持续生效、受咒者无法凭自身解除的超自然咒语
ground: 1）身份授予对应施咒；2）所有行为被改义对应魔法改变现实规则；3）拒绝仍算计划对应挣扎强化咒效；4）本人不能取消对应不可解；5）长期持续对应咒语不撤销。
