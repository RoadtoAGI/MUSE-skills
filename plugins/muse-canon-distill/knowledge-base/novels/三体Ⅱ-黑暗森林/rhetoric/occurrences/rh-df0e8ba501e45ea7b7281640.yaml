quote: 这是一个不可撤销的魔咒
sensory_mapping: 咒语落身、无形束缚、挣扎反噬、持续效力
context_fact: 罗辑悟到辞职、撤保护等行为都会被旁人当作面壁策略，因此身份实际无法放弃。
image_mechanism: 制度解释规则化成一句已经出口的咒文，落到罗辑身上后，连反抗动作都会被咒语自动翻译。
property_alignment: 1）联合国任命对应施咒；2）罗辑对应受咒者；3）解释闭环对应魔法规则；4）辞职失败对应无法解除。
context_alignment: 同句普罗米修斯铁环强调坚固，魔咒补足其诡异、自我实现的语义机制，符合罗辑感到逻辑变态。
narrative_function: 把面壁制度从法律授权转为无法退出的命运控制，突出权力也是刑罚。
transfer_rule: 魔咒隐喻适合规则会自动重写当事人每次反应的处境，应写明触发、持续和解除为何失败。
failure_boundary: 制度仍由人执行并可被法律修改，并非超自然不可逆；魔咒感是罗辑当下认知，不证明永久无解。
