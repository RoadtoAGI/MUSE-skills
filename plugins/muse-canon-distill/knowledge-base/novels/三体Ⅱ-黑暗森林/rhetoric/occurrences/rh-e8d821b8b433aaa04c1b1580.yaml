chapter: 正文
figure_type: simile
quote: 目光仍平静如水
sensory_mapping: 惨败消息像风掠过、章北海眼中水面无波、深处判断不向外翻涌
context_fact: 他认为密集编队错误，其余结果都在预料中，因此面对全军覆没仅作淡淡评论。
image_mechanism: 内在稳定被表面流体化，眼神是否起波成为情绪是否受冲击的可见指标。
property_alignment: 1）眼神表面对应水面；2）心理震动对应水波；3）长期预判对应深水稳定；4）淡语对应轻流。
context_alignment: 此前父亲目光如日星，此处章北海自己的目光成为平水，标志他从被照看者转为他人稳定源。
narrative_function: 用一个静态细节确立他在集体崩溃中的领导中心，为官兵交出指挥权提供心理依据。
transfer_rule: 目光作水时，应明确扰动来源、表面反应和潜在深度，让‘平静’由事件压力检验。
failure_boundary: 眼睛不是液面，外表平静不能证明内心没有悲痛；章北海可能有意控制表达。
quality_assessment: conventional
confidence: 0.99
review_status: reviewed
tenor: 章北海听完联合舰队全灭报告后眼神和情绪保持稳定，没有显出惊慌、震动或得意
vehicle: 无风水面平整安静，不起波纹，外界景物映在其上也不改变水体状态
ground: 1）目光对应水面；2）情绪波动对应波纹；3）报告冲击对应风；4）无表情变化对应水面不动；5）深藏判断对应水下深度。
