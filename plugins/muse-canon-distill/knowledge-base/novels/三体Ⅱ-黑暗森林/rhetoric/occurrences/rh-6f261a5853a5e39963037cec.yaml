chapter: 正文
figure_type: metaphor
quote: 那个在大失败的沉重打击下陷入混乱的世界已经充满了死亡的气息
sensory_mapping: 地球影像像腐败物散气、死亡味穿过九小时通信、舰员隔着屏幕也不愿再把希望寄回
context_fact: 地球在失败后陷入混乱，星舰成员从新闻判断故乡无望，因此思乡病反而不强。
image_mechanism: 视觉资讯跨感官转成嗅觉预警，尚未到来的末日因‘气息’而成为已经可感的环境。
property_alignment: 1）地球世界对应濒死身体；2）混乱新闻对应气味；3）通信传播对应气息扩散；4）末日判断对应闻到死亡。
context_alignment: 心理学家解释思乡减弱，气味意象说明家园已失去吸引力而带排斥感，比抽象‘没希望’更具体。
narrative_function: 排除思乡病作为主因，把调查注意转向更深的资源与猜疑危机。
transfer_rule: 社会危机作死亡气息时，应列出可传播迹象、感知者距离和判断后果，避免只用阴森氛围。
failure_boundary: 通信不能传递真实气味，地球尚有生命与两个世纪时间；‘死亡’是趋势判断而非即时事实。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 地球社会在舰队覆灭后秩序崩坏、末日预期加深，新闻持续传来衰败与死亡风险
vehicle: 腐败或将死之物散出可嗅气味，气息弥漫整个空间，使远处的人也能判断死亡临近
ground: 1）社会衰败对应尸体腐败；2）新闻迹象对应气味分子；3）全球混乱对应气息弥漫；4）星舰观察者对应嗅闻者；5）末日临近对应死味增强。
