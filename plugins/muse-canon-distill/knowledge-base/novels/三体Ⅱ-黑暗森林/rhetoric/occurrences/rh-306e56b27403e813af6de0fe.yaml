review_status: reviewed
tenor: 罗辑辞去面壁者后意识恍惚、失去方向与理性判断的行走状态
vehicle: 睡眠中身体自行行走、意识未清醒且不知来去的梦游者
ground: 1）脚步继续对应梦游身体活动；2）理智停摆对应意识睡眠；3）不知来处去处对应梦游无方向；4）现实显得不真实对应梦境感；5）对危险反应迟钝对应梦游脆弱。
