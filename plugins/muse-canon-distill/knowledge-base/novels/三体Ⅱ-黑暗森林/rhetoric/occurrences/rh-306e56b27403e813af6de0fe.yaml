chapter: 正文
figure_type: simile
quote: 梦游般地走在荒诞的现实中
sensory_mapping: 恍惚步行、失焦视线、自动身体、梦境薄雾
context_fact: 萨伊轻易同意罗辑拒绝身份，他穿过空会场走到广场，无法理解众人的敬畏。
image_mechanism: 清醒世界外壳保留，罗辑的意识却被调到睡眠层，身体独自在制度荒诞中按惯性移动。
property_alignment: 1）罗辑对应梦游者；2）广场现实对应梦境场景；3）失去思维对应未醒；4）无目的行走对应自动步态。
context_alignment: 此前他称事件为后现代戏剧，此处梦游把“不真实”落到身体状态，并直接导向未察觉刺杀风险。
narrative_function: 延长任命冲击的主观失真，同时为雕塑锤击与真实枪击的骤然重合蓄势。
transfer_rule: 梦游写恍惚时，应让身体动作仍连续，而方向感、因果判断和危险反应同步缺失。
failure_boundary: 罗辑并未真正睡着，仍能看见雕塑；需要精确决策的场景不能用梦游替代具体认知症状。
quality_assessment: effective
