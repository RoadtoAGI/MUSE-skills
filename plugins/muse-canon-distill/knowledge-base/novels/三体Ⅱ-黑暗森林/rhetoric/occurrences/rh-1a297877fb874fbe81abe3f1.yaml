chapter: 正文
figure_type: simile
quote: 整个舰队的阵列像是一片沉默的远古巨石阵
sensory_mapping: 黑暗平原上巨石列阵、每块沉默矗立、中央仪式将启、时间似停在远古
context_fact: 舰队为共同参战荣誉采用超密集检阅阵形，螳螂号独自缓慢靠近水滴。
image_mechanism: 高科技舰群被去除动力与噪声后退化为石块，秩序仍在却无法解释，现代自信转成原始祭祀般等待。
property_alignment: 1）战舰对应巨石；2）编队规则对应石阵几何；3）关闭发动机对应静止；4）全舰屏息对应沉默；5）水滴接触对应祭祀中心；6）宇宙时间对应远古感。
context_alignment: 人类把行动神圣化，本句却把舰队放回前科学仪式，暗示面对更高技术时其现代性只是自我想象。
narrative_function: 从单舰空城推到全阵石阵，完成生命撤离感，并强化接触前超长静默。
transfer_rule: 规则阵列作巨石阵时，应对齐单元体量、几何秩序、共同朝向、沉默和仪式未知性。
failure_boundary: 战舰可高速机动且内部复杂，巨石阵不会计算或作战；类比只描述此刻外观与气氛。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 两千艘巨舰按严整矩形规则排列、静止无声并共同朝向中心接触事件的整体阵列
vehicle: 史前巨石按未知仪式与天文秩序竖立成阵，历经漫长时间仍沉默、庄严且意义神秘
ground: 1）单舰对应巨石；2）矩形排列对应石阵；3）舰体庞大对应巨石尺度；4）静默等待对应远古沉寂；5）接触仪式对应祭典；6）规则朝向对应天文布局。
