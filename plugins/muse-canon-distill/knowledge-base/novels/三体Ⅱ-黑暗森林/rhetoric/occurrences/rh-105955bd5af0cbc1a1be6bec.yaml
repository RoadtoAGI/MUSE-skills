chapter: 正文
figure_type: metaphor
quote: 顶着密集的弹雨向“绿”号飞去
sensory_mapping: 炮弹铺成迎面暴雨、银滴逆雨疾行、弹点连续撞上镜面又散开、目标路线不偏
context_fact: ‘绿’号改用电磁动能武器拦截，金属弹只能短暂减慢水滴，水滴随即恢复速度并穿舰。
image_mechanism: 重磅炸弹级弹丸被降成天气颗粒，人类最强动能攻击在强度差前只剩微弱阻滞。
property_alignment: 1）炮弹群对应雨幕；2）单弹撞击对应雨点击身；3）推进力对应逆雨步力；4）水滴镜面对应不受损外衣。
context_alignment: 攻击者名为水滴却能‘顶弹雨’，水的尺度词反过来贬低人类炮火，语言位置巧妙。
narrative_function: 迅速交代第二种武器同样无效，为下一段固液、海浪礁石类比提供现场证据。
transfer_rule: 密集射弹作雨时，应写清颗粒数量、迎面方向、连续撞击和目标受阻程度，体现强弱比例。
failure_boundary: 金属弹动能足以削平山峰，不具雨滴柔软性；水滴前进依靠推进而非步行。
quality_assessment: conventional
confidence: 0.99
review_status: reviewed
tenor: 水滴迎着电磁炮高速、连续发射的大量金属弹前进，受击仅略减速且表面无划痕
vehicle: 行进者冒着密集雨滴逆向前行，雨点连续打在身上，却未能使其停步或受伤
ground: 1）金属弹对应雨滴；2）连续齐射对应密集降雨；3）水滴迎击对应顶雨前行；4）轻微减速对应雨阻；5）无损对应防雨。
