quote: 蓝西和部下就像面对强敌进攻的战士一样高度紧张起来
sensory_mapping: 无形心理威胁化成来敌、军官守在精神防线、预案像武器上膛、症候一出现便准备阻击
context_fact: 第二战勤部专责远航心理工作，星舰社会独立后立即预备应对多种心理危机。
image_mechanism: 内在情绪风险被外敌化，心理专业的观察、预案和干预因此获得战场动作序列。
property_alignment: 1）焦虑崩溃对应敌军；2）心理团队对应战士；3）舰员精神对应阵地；4）演习预案对应战术；5）危机处置对应战斗。
context_alignment: 人员本就是舰队军官，用战斗语言描述专业职责自然贴合组织身份，也提示真正敌人已转入舰内。
narrative_function: 从外部水滴战切入内部生存战，宣布星舰社会首个威胁是自身心理结构。
transfer_rule: 专业风险处置作作战时，应配齐敌人、阵地、侦察、武器和交战条件，避免只写‘像战士紧张’。
failure_boundary: 心理症候不是有统一意志的敌军，过度敌对化可能污名化患者并妨碍照护。
