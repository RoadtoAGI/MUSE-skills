chapter: 正文
figure_type: simile
quote: 恒纪元的太阳像钟摆般一次次划过长空
sensory_mapping: 运动、弧线、节奏
context_fact: 周文王调快三体游戏时间，连续观看太阳与飞星交替出现。
image_mechanism: 把天文尺度的重复运动缩成钟表内部可见摆动，速度压缩后形成稳定、机械又令人疲惫的节拍。
property_alignment: 1）太阳轨迹对应摆弧；2）恒纪元反复到来对应摆动周期；3）时间加速对应钟摆节拍被看见。
context_alignment: 角色正在主动调节时间进度，钟摆既描述运动，也呼应计时装置，贴合虚拟世界的控制界面。
narrative_function: 将长周期天象变成可读节奏，突出三体世界在规律与突变间机械循环。
transfer_rule: 压缩长时运动时，可选周期装置对齐轨迹、重复频率和观察尺度，让时间变化同时成为画面变化。
failure_boundary: 三体太阳的真实轨道并非钟摆往返；喻体只适用于加速视景中的弧线与重复，不能说明动力机制。
quality_assessment: effective
