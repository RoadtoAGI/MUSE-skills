tenor: 加速时间中恒纪元太阳反复横越天空的视运动
vehicle: 在固定范围内周期往返的钟摆
ground: 1）太阳沿天空划出弧线对应摆锤弧线；2）一次次出现对应周期摆动；3）加速观看使漫长天体运动对应肉眼可见的机械节拍。
