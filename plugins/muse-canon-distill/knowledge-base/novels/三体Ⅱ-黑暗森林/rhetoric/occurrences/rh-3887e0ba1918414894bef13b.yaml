quote: 像在风雪中挣扎的小火苗。
sensory_mapping: 视觉、色彩、温度、点燃过程
context_fact: 罗辑彻夜担心想象女孩，思念如火；次晨觉得自己是被她这团风雪小火苗点燃的旧蜡烛。
image_mechanism: 红围巾先把女孩变为雪中的微火，火势越过想象边界进入罗辑内心，最终找到尘封烛芯并让沉睡生命重新发光。
property_alignment: 1）红围巾对应火焰颜色；2）女孩抗风雪对应火苗挣扎；3）思念增强对应燃烧扩大；4）罗辑新生对应旧烛被重新点亮。
context_alignment: 冰雪提供真实低温与白色背景，火的颜色、温度和传播都从场景物理条件生长；壁炉想象继续维持同一框架。
narrative_function: 以连续点燃链呈现罗辑从审美想象到关爱、再到自我复苏的情感生成。
transfer_rule: 延展火焰意象时，要稳定分配火源、燃料、传播路径和被点亮结果，使每次复现推进关系而非只重复热烈。
failure_boundary: 火会消耗并毁坏，女孩并非仅为点燃罗辑而存在；缺少寒冷背景、红色标志或情感传播时，这套点火链会失去精确性。
