quote: 把三体危机的事儿抛在了脑后
sensory_mapping: 沉重议题越过肩头、落到身后、视线转向前路、旧物仍未消失
context_fact: 全球恢复民生后约半个世纪过平安日子，随后才重新考虑三体战争并建造舰队。
image_mechanism: 注意力排序被写成身体前后方，议题离开视野并不等于被解决，只是被留在行程后部。
property_alignment: 1）三体危机对应随身物；2）人类社会对应行者；3）优先关注对应拿在面前；4）和平时期对应继续前行；5）忽略对应抛后；6）后来重提对应回头拾起。
context_alignment: 它紧接‘舒服道儿’的行路框架，危机被抛在路后却又会被重新捡起，历史叙述保持空间连续。
narrative_function: 压缩半世纪战略停顿，并强调技术突破发生在社会暂时放下末日目标之后。
transfer_rule: 议题作身后物时，应区分解决、遗弃和暂时不看，并安排它后来是否被重新拾回。
failure_boundary: 三体舰队仍在逼近，忽略只改变人类注意和资源分配；危机没有物理位置，也不会因抛后减速。
