tenor: 大低谷后的世界暂时不再把三体入侵作为日常政治和个人生活的优先事项
vehicle: 行路者把携带的物件甩到头部后方，继续向前而不再回看或处理它
ground: 1）危机议题对应物件；2）公众注意对应正面视野；3）降低优先级对应抛后；4）继续生活对应向前走；5）不再讨论对应不回头；6）危机仍存在对应物件留在路上。
