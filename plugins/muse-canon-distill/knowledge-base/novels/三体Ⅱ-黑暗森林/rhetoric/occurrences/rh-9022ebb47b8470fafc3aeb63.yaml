tenor: 大国的技术研发无意中为小国未来获得全球力量提供基础条件
vehicle: 先行者铺设坚硬地基与道路石块，后来的小国沿其上走向高处
ground: 1）大国研发对应铺设；2）通用技术成果对应基石；3）小国采用对应踏上基础；4）霸权目标对应道路终点；5）无意受益对应铺路者与行路者分离。
