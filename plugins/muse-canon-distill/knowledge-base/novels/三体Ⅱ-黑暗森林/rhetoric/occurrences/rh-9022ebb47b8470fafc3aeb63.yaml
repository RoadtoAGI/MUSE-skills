chapter: 正文
figure_type: metaphor
quote: 大国不遗余力发展技术，实际上是为小国通向世界霸权铺下基石
sensory_mapping: 石基、道路、铺设、后来者踏行
context_fact: 泰勒认为技术进步会削弱人口资源优势，让某些小国突然获得战略分量。
image_mechanism: 研发成果从实验室沉到地面变成道路基础，大国费力铺石，小国反而沿路越过它走向权力中心。
property_alignment: 1）技术对应基石；2）大国对应铺路者；3）小国对应行路者；4）战略崛起对应通行；5）世界霸权对应目的地。
context_alignment: 同段杠杆隐喻解释力量放大，铺路隐喻补充技术外溢的时间顺序与受益者错位。
narrative_function: 浓缩泰勒对大国研发悖论的判断，说明其全球反恐思想来源。
transfer_rule: 铺路写非预期赋能时，应区分建设者、基础设施、实际行路者和他们可能不同的目的地。
failure_boundary: 技术有专利、供应链和制度门槛，不会自动成为公共道路；小国也未必因此通向霸权。
quality_assessment: effective
