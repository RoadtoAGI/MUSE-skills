chapter: 正文
figure_type: simile
quote: 种种复杂的感情如天上的浮云般掠过
sensory_mapping: 云影掠空、形态变换、明暗交替、远天流动
context_fact: 罗辑宣布庄颜的任务是成为最幸福快乐的女孩，她沉默后才从很远似的声音发问。
image_mechanism: 她的清澈双眼铺成天空，惊讶、疑惑与不安各自凝成云影，被内心风力先后推过瞳孔。
property_alignment: 1）双眸对应天空；2）复杂情感对应浮云；3）情绪更替对应云影掠过；4）清澈底色对应高空。
context_alignment: 雪峰光已映入眼睛，天空与浮云自然进入同一视觉场；“掠过”准确限制这些表情尚未成为明确决定。
narrative_function: 延长庄颜接受荒诞任务前的反应时间，让罗辑和读者等待她的真实态度。
transfer_rule: 云喻写表情变化时，应把眼或脸设为稳定天幕，再用速度、形态和明暗区分情绪流动。
failure_boundary: 浮云只表示短暂可见的表层变化，不能确定每种具体情绪；长期固着情绪不宜写作掠过。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 庄颜听见自己的工作是获得幸福后，目光中接连出现又消失的多种情绪
vehicle: 高空中形态各异、被风迅速推过视野的浮云
ground: 1）情绪多变对应云形变化；2）依次出现对应云朵掠过；3）难以固定对应浮云无根；4）眼中可见对应云映天幕；5）短暂停留对应风中移动。
