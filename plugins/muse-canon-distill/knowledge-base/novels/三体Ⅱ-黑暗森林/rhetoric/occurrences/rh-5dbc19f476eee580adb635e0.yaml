context_fact: 两派只能选一条飞船路线为主，三四名关键人物支持工质飞船；章北海认定必须取得恒星际航行能力。
image_mechanism: 世纪级技术规划被压缩为岔口第一步，早期细小偏向会随投入里程放大；所有公开道路封闭后，人物目光落到一条危险暗径。
property_alignment: 1）章北海与舰队对应行路者；2）技术路线对应道路；3）规划决策对应落脚；4）时间资源对应路程；5）暗杀计划对应险恶余路。
context_alignment: 丁仪刚用死路和方向解释聚变突破，章北海沿用路线逻辑评估飞船规划，随后立即去寻找制作暗杀子弹的陨石。
narrative_function: 把技术争论转成不可延误的路径危机，为章北海选择谋杀建立其自认的行动必然性。
transfer_rule: 战略路径类比应标出岔口、沉没成本、改向窗口与剩余路线，‘走错’须有明确不可逆机制。
failure_boundary: 研发可并行、复用或在新证据下改向，未必像单人走路互斥；路线隐喻不能替暗杀提供正当性。
