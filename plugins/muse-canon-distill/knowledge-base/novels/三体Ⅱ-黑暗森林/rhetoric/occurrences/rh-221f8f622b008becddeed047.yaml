quote: 这种喷发并不是恒定的，像火山一样
sensory_mapping: 壳口蓄压、喷流骤起、间歇沉寂、物质云扩散
context_fact: 研究者用间歇喷发解释三体恒星大气层在被引力驱散后又不断补充、收缩和膨胀。
image_mechanism: 难以直接想象的恒星表层过程缩成行星地质模型，压力从破口时断时续释放，突发峰值由火山爆发提供。
property_alignment: 1）恒星外壳对应地壳；2）撞击破口对应火山口；3）恒星物质对应岩浆喷出物；4）喷发周期对应火山休眠与爆发；5）外层云对应火山羽流。
context_alignment: 类比只解释喷发时间形态，并由大气层涨落这一观测结果支持，没有把恒星机制整体等同火山。
narrative_function: 用熟悉的非恒定喷发建立科兹莫假说，为275E1观测和雷迪亚兹计划的推演提供直觉模型。
transfer_rule: 用火山类比天体喷发时，应限定对应为压力积累、破口与间歇释放，并另行保留能源和尺度差异。
failure_boundary: 恒星喷流由高温等离子体、磁场和撞击作用驱动，不是岩浆与板块活动；火山周期不能预测恒星爆发。
