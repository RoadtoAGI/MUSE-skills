chapter: 正文
figure_type: simile
quote: 雨水在石碑上反着光，像闪动的眸子一般
sensory_mapping: 手电扫过碑群，雨膜亮点逐块闪起，死者的石面仿佛一双双眸子转向罗辑
context_fact: 罗辑在半埋沙下的墓地逐排寻找叶文洁与杨冬，只看简朴小碑上的碑文。
image_mechanism: 无生命石面借水膜和移动光源获得眨动眸光，搜寻墓碑被改写为活人与死者相互辨认。
property_alignment: 1）石碑表面对应眼球；2）雨水对应泪膜；3）反射亮点对应眸光；4）光斑移动对应眼神闪动。
context_alignment: 此前旧城窗像孤眼，此处眼睛从活城转到墓碑；罗辑将向死者陈述并执行文明终局，见证者逐渐聚集。
narrative_function: 赋予墓地注视感，让叶文洁理论的最终验证在她与杨冬墓前具有仪式性见证。
transfer_rule: 反光面作眸子时，应落实湿润膜、点状高光、移动来源和被注视者，避免只因‘亮’称眼。
failure_boundary: 墓碑不会观看或闪动，亮点由手电和雨水造成；不能把死者意志写成真实回返。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 手电照到雨湿墓碑时，碑面随移动视角出现不断变化的细小反光
vehicle: 活人眼球湿润表面随光线和注视轻微转动而闪出亮点
ground: 1）湿碑反光对应眼中高光；2）手电移动对应眸光转动；3）碑面水膜对应眼球湿润；4）成排墓碑对应众多眼睛；5）寻找动作对应彼此对视。
