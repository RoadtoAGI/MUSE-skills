chapter: 正文
figure_type: simile
quote: 她滚过的地面上有一道血迹，形状像一个有意义的符号
sensory_mapping: 视觉、图形、阅读动作
context_fact: 罗辑此前想不起女子姓名，车祸后看着她留下的血迹却瞬间记起。
image_mechanism: 让随机血痕获得文字功能，身体以死亡在地面写下一笔，迟到的姓名从这笔中被读出。
property_alignment: 1）血迹轮廓对应字形；2）凝视血迹对应阅读；3）记起姓名对应解码意义。
context_alignment: 前文女子只是无名电影剪影，此刻血迹反而成为最有意义的符号，完成形象到姓名的残酷逆转。
narrative_function: 把罗辑的记忆迟钝与事故死亡锁成一个瞬间，形成强烈道德刺痛。
transfer_rule: 把痕迹写成符号时，应安排观察者的阅读动作和确切被唤回的信息，使“有意义”得到情节兑现。
failure_boundary: 血迹并非真的书写姓名；若它没有触发具体记忆，称符号只会是神秘化随机形状。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 女子身体滚过路面留下、触发罗辑记起姓名的血迹
vehicle: 形状可被阅读并承载信息的书写符号
ground: 1）血迹形成可辨轮廓对应符号外形；2）罗辑凝视后想起名字对应符号传递意义；3）血由身体运动留下对应一次不可重复的书写。
