chapter: 正文
figure_type: metaphor
quote: 上方出现了一个覆盖整个天空的巨掌，向他压下来
sensory_mapping: 夜空凝成无边手掌、掌面缓慢压低、罗辑头皮发紧等着被碾、随后巨掌从天幕撤回
context_fact: 新闻预测水滴将撞击首都西北，倒计时结束前罗辑坐在空旷沙地；水滴随后在两万公里处转向。
image_mechanism: 点状探测器的威胁被放大为全天空覆盖的身体部位，下压—抽回与轨迹逼近—转向精确同步。
property_alignment: 1）水滴力量对应手力；2）天空对应掌幅；3）轨道下降对应按压；4）撞击预期对应碾碎；5）改向远离对应收手。
context_alignment: 罗辑并不知道水滴目的，巨掌体现的是恐惧感知而非客观尺寸；转向时意象动作随事实立即反转。
narrative_function: 在倒计时末端把无形压力推至身体上方，并用手掌抽回制造暂缓而非胜利的落差。
transfer_rule: 天降威胁作巨掌时，应让覆盖、下压速度、受压位置和撤回动作对应真实轨迹变化。
failure_boundary: 水滴体积很小且没有手形或抓握意志，它的任务是封锁太阳而非直接碾压罗辑。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑等待水滴撞击时感到即将到来的全球性毁灭从天空压迫自己，身体与意识承受极端恐惧
vehicle: 巨大手掌遮住整片天空并向下按压，覆盖范围无处可逃，受压者将被掌力碾碎
ground: 1）水滴撞击威胁对应巨掌；2）天空覆盖对应掌面；3）逼近地球对应下压；4）罗辑对应掌下微小身体；5）水滴转向对应手抽回。
