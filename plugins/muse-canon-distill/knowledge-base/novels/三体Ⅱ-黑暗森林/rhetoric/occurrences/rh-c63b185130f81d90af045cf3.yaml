quote: 仿佛在向它致意
sensory_mapping: 船体俯仰、水上队列、缓慢经过、送别仪式
context_fact: 停工航母为腾空船坞被拖去拆毁，入水大浪带动港内船只起伏。
image_mechanism: 被动波动被赋予礼仪意志，港口船群成为送葬队列，以船首俯仰向未服役的巨舰告别。
property_alignment: 1）浪致起伏对应鞠躬；2）其他船对应送别者；3）“唐”号对应受礼者；4）拖离对应告别行进。
context_alignment: 紧邻吴岳与航母“未起航就结束”的类比，礼仪化波浪让一项工业拆毁拥有葬礼尊严。
narrative_function: 为失败项目补上一场无人主持的告别，也映照吴岳军旅退出无人庆典。
transfer_rule: 把无生命群体动作写成仪式时，应从同步姿态、队列关系和明确离场对象建立礼仪结构。
failure_boundary: 船只只是受浪作用，并无敬意；若缺少终结语境，上下起伏更可能是普通物理运动。
