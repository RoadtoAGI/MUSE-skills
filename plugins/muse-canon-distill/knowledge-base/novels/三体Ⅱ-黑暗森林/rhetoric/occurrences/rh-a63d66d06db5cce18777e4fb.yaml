quote: 黑暗又吞噬了一切
sensory_mapping: 火把熄灭、黑口合拢、形体消失、暗中余声
context_fact: ETO成员围火讨论刺杀罗辑，秦始皇遣散众人后火把依次燃尽，窃窃私语仍未停止。
image_mechanism: 光退去不再是亮度降低，而是有方向的捕食动作；暗色从边缘推进，把人群和荒原逐层收入不可见腹中。
property_alignment: 1）黑暗对应巨兽；2）场景万物对应猎物；3）光圈缩小对应吞咽；4）完全不可见对应吞尽；5）私语对应腹中余响。
context_alignment: 成员正在策划隐秘谋杀，吞噬意象让会场本身被他们所服务的黑暗覆盖，并与后文黑暗森林主题暗合。
narrative_function: 为秘密会议收束画面，同时把组织的道德与宇宙环境统一到黑暗母题。
transfer_rule: 黑暗作吞噬者应呈现光源衰减、边界推进和可见物依次消失，让动作有实际光学过程支撑。
failure_boundary: 黑暗只是缺光，没有意志；若光源瞬间关闭且无空间推进，‘吞噬’的动态层次会减弱。
quality_assessment: effective
