tenor: 火把相继熄灭后，三体虚拟荒原上的人物、地貌和可见细节全部隐没
vehicle: 一只扩张的巨兽张口把光照范围和其中万物吞入体内
ground: 1）黑暗对应吞噬者；2）火光与景物对应猎物；3）火把燃尽对应入口打开；4）视觉消失对应被吞下；5）私语残留对应猎物外仍有声音。
