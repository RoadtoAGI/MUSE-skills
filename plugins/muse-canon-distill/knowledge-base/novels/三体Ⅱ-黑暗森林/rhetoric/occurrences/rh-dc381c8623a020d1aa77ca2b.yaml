review_status: reviewed
tenor: 传统计算机架构在理论与制造路线接近极限后，仍被工程师挖出一万倍性能提升的剩余潜力
vehicle: 一只已被反复挤压、几乎干瘪的柠檬又被用力榨出大量残余汁液
ground: 1）摩尔定律对应柠檬；2）可提升性能对应果汁；3）历代技术开发对应反复挤压；4）接近极限对应果实将干；5）一万倍提升对应意外大量汁；6）最终到头对应再无可榨。
