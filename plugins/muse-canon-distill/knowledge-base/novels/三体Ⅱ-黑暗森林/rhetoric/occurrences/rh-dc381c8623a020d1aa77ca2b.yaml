quote: 能从摩尔定律这个柠檬里又榨出这么多汁来
sensory_mapping: 干瘪柠檬、再次挤压、残汁涌出、果肉终于榨尽
context_fact: 新超级计算机仍采用传统结构，性能达八年前最强机器一万倍，但惠子确认这次已到技术终点。
image_mechanism: 抽象增长规律变成有限果实，工程进步不是无穷曲线，而是不断压取其中越来越少的可用液体。
property_alignment: 1）摩尔定律对应果实；2）晶体管潜力对应汁液；3）研发投入对应榨压；4）性能增长对应出汁；5）物理极限对应榨干。
context_alignment: 惠子疲惫又惊讶，实验室口吻用酸果既表达惊喜，也保留资源耗尽的苦味与终局感。
narrative_function: 把一万倍飞跃与‘真的到头’放在同一图像中，避免读者把数字误认成无限进步。
transfer_rule: 把技术潜力作可榨资源时，应交代既往开发、剩余量、提取动作和终极耗尽，数量增长不能脱离存量。
failure_boundary: 摩尔定律是经验趋势，不是装有固定汁量的实体；新架构或材料仍可能打开其他增长来源。
quality_assessment: exemplary
