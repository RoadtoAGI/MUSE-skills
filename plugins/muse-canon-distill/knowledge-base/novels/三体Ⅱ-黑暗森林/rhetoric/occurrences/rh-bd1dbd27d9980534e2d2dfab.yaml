chapter: 正文
figure_type: metaphor
quote: 他们的眼睛像时光之窗
sensory_mapping: 双眼开窗、年代隔墙穿透、灰色旧景重现、目光相接
context_fact: 罗辑先被未来人自信明亮的目光震动，进入监护室后仅凭两名苏醒者的眼睛就认出他们来自同一时代。
image_mechanism: 眼球不再只反映个人情绪，而在两世纪隔层上开洞；一次对视使已经消失的社会背景重新进入当前房间。
property_alignment: 1）苏醒者眼睛对应窗户；2）共同年代经验对应窗后旧景；3）冬眠跨时对应隔墙；4）罗辑观看对应从窗回望；5）目光灰暗对应过去色调。
context_alignment: 前文刚把普通人的目光定义为时代文明程度的反映，本句把这一判断凝成窗口，逻辑与视觉铺垫完整。
narrative_function: 在未来明亮人群中迅速结成旧时代同类，也突出罗辑与新社会之间尚未消失的历史隔膜。
transfer_rule: 以眼睛作时间窗口时，应先建立目光承载时代经验，再让观看者通过具体差异辨认过去，而非泛称沧桑。
failure_boundary: 眼睛不能提供过去事件的客观画面，同代者经历也不完全相同；罗辑看到的是时代气质和自我投射。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 两名同代冬眠者的目光保存着旧时代共同形成的神态，使罗辑立刻重新感到自己来处的灰暗气氛
vehicle: 开在时间隔墙上的窗户，让观看者越过当前年代直接看见过去的一处景象
ground: 1）眼睛对应窗面；2）目光中的时代气质对应窗后景色；3）同代身份对应通向过去；4）罗辑辨认对应向窗内观看；5）灰暗神态对应旧时代色调。
