quote: 大史，你真是个魔鬼
sensory_mapping: 窥心魔鬼、画像召唤、超常命中、敬畏后退
context_fact: 史强按罗辑零散描述画出少女，罗辑盯住画像许久，认为世上不可能存在这样的人。
image_mechanism: 刑警的经验推断在罗辑视角中越过技术边界，史强的普通身体后显出能伸入梦境取人的魔鬼轮廓。
property_alignment: 1）史强对应魔鬼；2）识人经验对应窥心术；3）生成画像对应召唤形象；4）罗辑惊叹对应敬畏魔力。
context_alignment: 它紧接“福尔摩斯再世”和“魔咒定身”，把罗辑无法理解的经验能力纳入同一超自然语域，符合亢奋口吻。
narrative_function: 把寻找梦中人从警务任务推成近乎召唤术，并强化史强作为现实执行者的关键作用。
transfer_rule: 把能人称魔鬼应提供其越过常识边界的具体成果和观察者的敬畏反应，避免只表示讨厌。
failure_boundary: 史强依靠类型经验和软件，并无超自然能力；魔鬼也不表示其道德邪恶，后文复指不另建卡。
