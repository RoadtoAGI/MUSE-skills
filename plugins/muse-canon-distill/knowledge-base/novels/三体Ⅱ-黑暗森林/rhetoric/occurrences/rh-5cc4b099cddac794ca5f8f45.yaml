tenor: 罗辑面对庄颜直问自己是否能战胜外星人时，防备、权威姿态和判断力迅速被天真吸引压倒
vehicle: 一方攻破防线、迫使对手放弃抵抗并接受支配的征服行动
ground: 1）孩子气对应进攻力量；2）罗辑心理防线对应被攻领土；3）无法责怪唐突对应放弃抵抗；4）完全吸引对应全面占领；5）随后坦白对应打开城门。
