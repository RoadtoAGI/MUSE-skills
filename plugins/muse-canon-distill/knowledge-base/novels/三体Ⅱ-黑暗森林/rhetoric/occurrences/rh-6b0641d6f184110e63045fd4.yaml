quote: 她像一个礼貌周到的东京大饭店服务生
sensory_mapping: 前台鞠躬、温和敬语、动作规范、客人受迎
context_fact: 醉酒文职人员进入中心索取私人爱情信念，惠子仍先按规定礼貌要求出示太空军证件。
image_mechanism: 科学家身份暂时退到制服之后，鞠躬与标准句式把她变成门厅服务人员，技术设施也随之像接待大厅。
property_alignment: 1）惠子对应饭店服务生；2）信念中心门厅对应饭店前台；3）来访者对应住客；4）程序说明对应服务流程；5）鞠躬对应职业礼仪。
context_alignment: 喻体来自惠子本国的高标准服务文化，又由丈夫视角观察，既亲近又带一点幽默而不嘲讽。
narrative_function: 刻画惠子在荒唐来客面前仍维持专业礼节，并延续夫妻店的经营意象。
transfer_rule: 人物作服务人员时，应由具体动作、话术和空间职责支撑，并从视角人物熟悉的地域文化取材。
failure_boundary: 惠子是共同发明者和决策者，不是从属服务者；类比只适用于此刻接待姿态，不能概括其权力。
