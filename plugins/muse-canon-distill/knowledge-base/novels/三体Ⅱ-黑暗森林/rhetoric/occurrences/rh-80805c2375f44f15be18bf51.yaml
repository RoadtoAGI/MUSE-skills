tenor: 墓碑上多个汉字凹槽交叠成的复杂形状
vehicle: 岔路、转折密集且难以建立全图的迷宫
ground: 1）组合凹槽的多次转折对应迷宫岔路；2）蚂蚁必须逐段爬行才能识别对应在迷宫中探索；3）有限记忆容不下全形对应迷路风险。
