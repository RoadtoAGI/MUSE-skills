quote: 而且是一堆凹槽的组合，结构像迷宫般复杂。
sensory_mapping: 空间、运动、认知负荷
context_fact: 褐蚁从单个数字凹槽爬到汉字组合，必须清空此前记忆才能继续辨形。
image_mechanism: 将二维字形放大为蚂蚁身体进入的道路系统，笔画复杂度变成转弯、岔路和记忆消耗。
property_alignment: 1）笔画交错对应迷宫道路交错；2）沿槽探索对应沿路寻径；3）忘掉旧形才能存新形对应有限方向记忆。
context_alignment: 蚂蚁不是俯视字形而是在槽内行走，“迷宫”准确服从其尺度与感知方式。
narrative_function: 延缓墓碑文字的揭示，让“杨冬之墓”通过微观探索逐字显现。
transfer_rule: 描写小尺度视角时，可把平面纹样转换为可进入的空间，但应同时写路线结构、身体动作和认知限制。
failure_boundary: 若观察者能一次俯瞰全貌，或图形没有岔路与转折，“迷宫”便只剩“复杂”的泛称。
