chapter: 正文
figure_type: metaphor
quote: 由狂热的民众组成的人群在阳光下沸腾
sensory_mapping: 广场液面翻滚、人头如泡、热势上冲、警戒容器被溢破
context_fact: 雷迪亚兹回国后站在波利瓦尔铜像基座，误以为人民欢迎自己；军警鸣枪也挡不住人群。
image_mechanism: 广场被当作受热容器，政治愤怒成为温度，数万人的局部动作汇成一锅无法压住的翻腾流体。
property_alignment: 1）民众对应沸水；2）狂热愤怒对应热量；3）广场对应容器；4）军警线对应容器边缘；5）前拥对应液体翻滚；6）突破对应溢出。
context_alignment: 后文连续使用‘人潮’‘汹涌’‘冲垮’，沸腾是整套流体框架首处，既写欢迎假象也隐藏致死怒意。
narrative_function: 在第一块石头出现前先让群体失去固态边界，预示个体雷迪亚兹将被整体浪潮吞没。
transfer_rule: 人群作沸液时，应给出热源、容器、内部运动和溢出边界，并让情绪强度对应温度。
failure_boundary: 民众有不同动机与自主选择，不是同质液体；流体图景不能抹去具体政治责任。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 波利瓦尔广场民众情绪极度激昂、密集涌动并迅速突破军警阻拦的集体状态
vehicle: 大量液体受热达到沸点，内部剧烈翻滚、气泡冲撞并溢出容器边界
ground: 1）人群对应液体；2）阳光与狂热对应加热；3）个体躁动对应气泡翻滚；4）向前拥挤对应沸液上涌；5）冲垮警线对应液体溢出容器；6）人潮汹涌对应流体持续。
