review_status: reviewed
tenor: 章北海乘交通艇接近‘自然选择’号时，以罕见的急切、信任和归属感投向巨舰
vehicle: 漂泊或受惊的孩子看见强大照护者后，放下戒备奔扑进其怀抱
ground: 1）章北海对应孩子；2）巨舰对应强大成人；3）交通艇接近对应扑近；4）舰体包容对应怀抱；5）心灵归宿对应获得庇护；6）平日克制消失对应儿童式坦率。
