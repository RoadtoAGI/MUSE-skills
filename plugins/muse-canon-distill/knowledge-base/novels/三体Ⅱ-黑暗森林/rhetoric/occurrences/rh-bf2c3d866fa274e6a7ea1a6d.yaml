chapter: 正文
figure_type: analogy
quote: 外部世界也许真的是一种类似于量子态的东西，他不观察就不存在
sensory_mapping: 概率云悬置、观察目光、状态坍缩、现实骤现
context_fact: 泰勒刚讲完量子舰队和概率云，罗辑意识到五年幸福让自己忘却外部世界，随后外界在伊甸园中突然出现。
image_mechanism: 心理回避借用刚听到的物理规则，把新闻之外的现实悬成概率云；泰勒的到访像一次测量，使危机在眼前坍缩成确定事件。
property_alignment: 1）外部世界对应量子态；2）不关注对应未观察；3）主观不存在对应状态未定；4）泰勒叙述对应测量；5）危机重现对应坍缩。
context_alignment: 量子语言来自紧邻的泰勒计划，不是任意科技术语；它精准暴露罗辑把认识论逃避误当成本体消失。
narrative_function: 讽刺罗辑的自我封闭，并把科学概念转为人物心理机制。
transfer_rule: 借科学模型写心理时，应让触发、状态变化与认知结果逐项对应，同时保留人物是在类比而非陈述物理事实。
failure_boundary: 宏观社会不会因个人不观察而不存在；若叙述把量子术语当科学证明，就会把主观逃避伪装成客观规律。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑在隔绝生活中形成的主观幻觉：只要不关注人类危机，它就仿佛不会侵入自己的现实
vehicle: 量子系统在被观察前不取得确定现实状态、观察才使其显现的通俗模型
ground: 1）外部危机对应量子系统；2）罗辑关注对应测量观察；3）不看新闻对应不测量；4）危机不进入体验对应未显现；5）泰勒到来对应观测导致坍缩。
