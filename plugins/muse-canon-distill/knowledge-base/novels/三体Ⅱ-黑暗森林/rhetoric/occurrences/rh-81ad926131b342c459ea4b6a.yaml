chapter: 正文
figure_type: metaphor
quote: 老乡这个词的涵义由地理变成时间
sensory_mapping: 两百年前的年代铺成故土、冬眠者从同一时间乡村远行、在未来城市听见彼此的‘乡音’
context_fact: 史强称新市长为老乡，解释只有相近时间进入冬眠者才能如此互称，关系比旧地理老乡更亲密。
image_mechanism: 时间轴被折成地域地图，跨时代迁移获得移民经验，共同年代因此像共同出生地可供归属。
property_alignment: 1）年代对应地域；2）旧时代文化对应乡土习俗；3）苏醒未来对应异乡；4）同期冬眠者对应同乡；5）共同记忆对应亲密纽带。
context_alignment: 地下城现代人崩溃时，冬眠者靠‘时间老乡’网络接管治理，词义变化直接服务危机中的社会组织。
narrative_function: 用一个词义迁移说明冬眠者群体身份，解释大史为何能通过市长获得接见和工作机会。
transfer_rule: 时间作故乡时，应匹配共同文化、离开方式、异时重逢和身份边界，使新称谓有社会功能。
failure_boundary: 同年代不保证价值和经历相同，也不能取代真实地理、阶层与个人差异。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 冬眠使同一年代出生和入眠的人跨越两百年在未来相逢，时代共同经验取代籍贯成为亲缘基础
vehicle: 地理故乡原以共同土地、方言和生活环境联结人；现在同一时间段被当作可共同来自的‘地方’
ground: 1）出生时代对应故乡地域；2）冬眠年代对应籍贯；3）跨世纪苏醒对应远行重逢；4）共同旧经验对应乡音；5）时间差对应空间距离。
