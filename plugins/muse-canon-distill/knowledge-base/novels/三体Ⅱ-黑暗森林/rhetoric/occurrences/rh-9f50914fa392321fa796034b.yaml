chapter: 正文
figure_type: metaphor
quote: 使其本身变成一座宇宙灯塔
sensory_mapping: 黑海无岸、孤塔闪烁、强光扫远、航者定向
context_fact: 低频通讯只能暴露大致方向，林格解释最直接办法是让恒星自身闪烁，但功率远超人类能力。
image_mechanism: 普通恒星从背景光点变成主动设施，规律闪烁像塔顶旋光穿过宇宙黑暗，把自身从亿万光点中挑出。
property_alignment: 1）宇宙空间对应海面；2）恒星对应灯塔；3）电磁脉冲对应灯光；4）第三方观察者对应船只；5）位置识别对应导航。
context_alignment: 紧跟沙漠中沙粒无法定位的类比，灯塔提供另一种视觉解决方案；两种日常空间共同解释宇宙坐标。
narrative_function: 展示直接广播位置的技术门槛，并衬托罗辑随后采用恒星构图的间接办法。
transfer_rule: 信号源作灯塔应具备黑暗背景、可区别的周期或强度，以及依据信号完成定位的远方接收者。
failure_boundary: 恒星闪烁未必提供方向外的完整距离信息，接收者也未必把信号理解为坐标；灯塔不会自动保证被友善航者看到。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 让目标恒星以恒星级功率发出可定位的高频电磁信号，主动标明自身坐标
vehicle: 在辽阔黑暗中周期闪光、让远方航行者确定方位的灯塔
ground: 1）宇宙对应黑海；2）目标恒星对应灯塔；3）高频闪烁对应塔灯；4）远方文明对应航行者；5）定位信息对应方位信号。
