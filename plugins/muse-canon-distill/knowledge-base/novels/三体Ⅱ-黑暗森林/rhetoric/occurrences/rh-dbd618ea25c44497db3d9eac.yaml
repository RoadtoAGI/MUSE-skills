tenor: 水滴表面近乎百分之百反射高频电磁波，按人类推断无法吸收可见光或雷达信号进行常规探测
vehicle: 失明者的眼睛不能接收外界光信息，无法凭视觉判断周围物体和方向
ground: 1）探测器传感器对应眼睛；2）电磁波对应光；3）不吸收对应视网膜不受光；4）无法探测对应失明；5）自盲设计对应主动闭眼。
