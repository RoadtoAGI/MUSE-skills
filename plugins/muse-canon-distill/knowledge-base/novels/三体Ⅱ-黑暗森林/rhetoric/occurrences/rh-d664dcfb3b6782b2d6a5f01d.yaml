chapter: 正文
figure_type: simile
quote: 衣冠不整，胡子老长，像个流浪汉
sensory_mapping: 面壁者的正式形象剥落，皱衣、长须和酒气把他变成街头漂泊者般的身影
context_fact: 听证会后罗辑闭门不出、整日饮酒，大部分时间醉着，偶尔才被人看见出门。
image_mechanism: 内部崩溃由社会可辨识的流浪者外观外显，衣着、毛发和居所关系共同完成身份降格。
property_alignment: 1）自理停止对应蓬乱外表；2）生活无序对应漂泊状态；3）社会退缩对应边缘身份；4）缺少家庭陪伴对应无家感。
context_alignment: 公众刚把他奉为神使，流浪汉形象形成强烈落差，也为后来被小区驱逐预示真正无家可归。
narrative_function: 用一眼可见的外貌概括崩溃程度，推动委员会以妻女为条件迫使他工作。
transfer_rule: 人物作流浪者时，应至少对应衣着维护、身体护理、居所关系和社会位置，避免只用‘邋遢’单点。
failure_boundary: 罗辑仍有固定住所、法律身份和资源，并非实际流浪者；喻体描述外观与心理失根。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 罗辑长期醉酒、自我照料崩溃后在公众面前呈现的潦倒外貌和无归属状态
vehicle: 长期漂泊、缺少固定住所和照料的流浪汉，衣物凌乱、胡须久未修剪、生活秩序松散
ground: 1）衣冠不整对应流浪装束；2）长胡子对应久未清理；3）闭门醉酒对应生活失序；4）妻女缺席对应无归属感。
