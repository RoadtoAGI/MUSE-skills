chapter: 正文
figure_type: metaphor
quote: 妈妈，我将变成一只萤火虫
sensory_mapping: 夜色微光、短暂飞行、生命变形、向母亲闪烁
context_fact: 泰勒参观神风特攻纪念馆后，从一名即将出击队员写给母亲的遗书中记住这句话。
image_mechanism: 无法直说的死亡被改写成轻小生命的羽化：战机和身体消失后，只剩一粒会飞、会发光的温柔替身回到母亲记忆。
property_alignment: 1）神风队员对应萤火虫；2）出击对应飞行；3）短暂生命对应虫生；4）遗书记忆对应微光；5）死亡对应物种转化。
context_alignment: 遗书面向母亲，萤火虫把自杀攻击的暴烈规模缩成孩子式安慰；随后该句在不同青年战士处反复回响。
narrative_function: 为泰勒追求自我牺牲精神建立温柔而可怕的核心母题，并把宏大战争压进母子告别。
transfer_rule: 用小生命替代死亡时，应让其寿命、运动与光色都能对应死者处境，并保留安慰对象的具体关系。
failure_boundary: 萤火虫意象会柔化神风攻击造成的他者死亡，不能据此浪漫化自杀行为；后续纯复诵不另建卡。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 即将驾驶神风战机出击并预知自己会死亡的年轻队员及其死后留给母亲的形象
vehicle: 生命短暂、在黑暗中发出微光并可飞回亲人身边的萤火虫
ground: 1）飞行员短命对应萤火虫成虫生命短；2）战机夜空亮点对应虫光；3）死亡转化对应变成另一生命；4）给母亲留记忆对应黑暗中微光；5）出击飞行对应萤火虫飞翔。
