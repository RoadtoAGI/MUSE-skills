chapter: 正文
figure_type: metaphor
quote: 有一肚子的问题想问
sensory_mapping: 疑问堆进腹中、越积越满、话到出口被挡、身体带着胀意等待
context_fact: 史强父子重逢后一路交谈，罗辑观察沙尘旧城产生许多疑问，却长期没有说话机会。
image_mechanism: 尚未说出的语言被物质化并装入身体，交谈权缺失因此产生可感的积压体积。
property_alignment: 1）疑问对应腹中物；2）罗辑对应容器；3）不断观察对应持续装入；4）父子谈话对应封住出口；5）提问对应倒出；6）问题众多对应满腹。
context_alignment: 大史父子谈的是跨世纪家事，罗辑礼貌等待；口语化满腹意象准确表现旁听者信息过载而不抢话。
narrative_function: 延迟地面世界说明，让父子团聚先占据场景，同时保存读者与罗辑共同的求解欲。
transfer_rule: 未说之言作容器内容时，应写明持续装入、出口受阻和最终释放时点，使数量词具有身体压力。
failure_boundary: 疑问位于意识而非腹腔，积压不必导致生理胀痛；问题多也不表示每个都重要。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 罗辑面对地面旧城和未来生活积累了大量疑问，迫切想说却暂时插不进父子谈话
vehicle: 腹腔被许多待取出的实体塞满，因容纳过多而产生胀迫感
ground: 1）问题对应腹中物；2）数量众多对应装满；3）无法提问对应不能倒出；4）迫切感对应腹胀；5）开口询问对应取出；6）插不上话对应出口被堵。
