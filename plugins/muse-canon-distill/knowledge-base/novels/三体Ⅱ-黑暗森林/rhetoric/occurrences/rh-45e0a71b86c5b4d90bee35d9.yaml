quote: 现在就像钥匙已经在印泥上按了模
sensory_mapping: 钥匙压下、细齿留痕、模纹完整、追踪者按印定位
context_fact: 监测站用核弹制造稀薄尘埃云，原本不可见的三体探测器进入后留下尾迹，‘蓝影’号随即获得会合命令。
image_mechanism: 无光目标不必直接看见，只让周围介质替它保存接触形状；尘埃像可塑材料，把瞬时路径冻结成可读模具。
property_alignment: 1）三体探测器对应钥匙；2）尘埃介质对应印泥；3）探测器运动对应按模；4）扰动尾迹对应凹痕；5）精确轨道对应钥匙齿形；6）追踪算法对应读取印模。
context_alignment: 整个观测方案正利用介质受扰间接测物，印模类比同时解释可见性、精确度和为何目标离开后仍能追踪。
narrative_function: 把跨天文单位的复杂轨道测定转成手上拓印动作，宣告人类终于抓住探测器的可追踪轮廓。
transfer_rule: 间接探测作压模时，应有被测对象、可变介质、接触扰动、持久痕迹和由痕反推形状的完整链条。
failure_boundary: 尘埃尾迹会扩散且只记录运动路径，不保存探测器全部外形；轨道计算仍依赖模型和时滞修正。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三体探测器穿越人工尘埃云后留下可测尾迹，使其精确轨道形状和后续会合参数全部可计算
vehicle: 一把未知钥匙在柔软印泥上压出完整齿形，观察者可凭凹模精确还原钥匙轮廓
ground: 1）探测器对应钥匙；2）尘埃云对应印泥；3）穿越轨迹对应按压动作；4）尾迹对应齿形印模；5）轨道参数对应钥匙轮廓；6）会合计算对应据模配准；7）尘埃扰动对应印泥变形。
