chapter: 正文
figure_type: metaphor
quote: 你自个儿也得多长个心眼多长只眼睛
sensory_mapping: 身体多开一只眼、视野向侧后方扩张、心中添观察孔、危险提前入目
context_fact: 大史刚把罗辑扑离无人飞车撞击点，并判断这起看似普通的坠车可能是谋杀。
image_mechanism: 抽象警惕被身体化为增加感知器官，单眼视野不足对应罗辑对未来安全叙事的轻信。
property_alignment: 1）罗辑警觉性对应眼睛数量；2）推理能力对应心眼；3）袭击者对应视野外目标；4）观察环境对应转动多眼；5）积累经验对应生长；6）自保对应提前看见。
context_alignment: 刑警大史以口语化身体隐喻训诫刚获救的罗辑，声音粗粝直接，也延续他靠观察识破事故的职业特征。
narrative_function: 在动作突袭后点明罗辑的安全任务仍未结束，并重新建立大史作为警戒者的角色分工。
transfer_rule: 警觉作增生感官时，应指出现有盲区、需要覆盖的新方向和新增感知如何改变行动。
failure_boundary: 人不会真的长出器官，多观察也无法发现全部自动化攻击；警惕过度还可能造成误判。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 史强要求罗辑提升警觉，主动留意环境与隐藏危险，不再完全依赖他人救援
vehicle: 身体额外生出负责判断的心窍与扩大视野的眼睛，从更多方向发现逼近的威胁
ground: 1）警觉对应新眼；2）判断力对应心眼；3）信息盲区对应视野死角；4）主动观察对应多眼巡视；5）危险识别对应看见目标；6）经验增长对应器官长出。
