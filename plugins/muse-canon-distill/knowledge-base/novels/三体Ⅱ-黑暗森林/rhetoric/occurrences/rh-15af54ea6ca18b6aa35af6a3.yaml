chapter: 正文
figure_type: simile
quote: 像白昼的太阳和夜里的星光，已成为他的世界的一部分
sensory_mapping: 父亲的眼神升到天空、白天如日照覆盖、夜里化成星点、忽然整片熟悉光源撤去
context_fact: 章北海独自在太空醒来后第一次感到真正孤独，并确信父亲已经离世。
image_mechanism: 不可见的亲人内在目光被铺成昼夜光环境，失去父亲便不只是少一个人，而是世界背景缺了一层光。
property_alignment: 1）父亲对应日星光源；2）目光对应照射；3）章北海对应受光者；4）长期内化对应昼夜常在；5）死亡感知对应光消失。
context_alignment: 章北海身处真实星空，天体喻体直接来自环境；宏大宇宙战后转入私人丧亲，尺度自然收束。
narrative_function: 用光环境的撤空呈现他压抑已久的孤独，开启毁灭后人物内心段落。
transfer_rule: 持续精神影响作天光时，应覆盖不同时间、落实受照者生活背景，并把失去写成环境变化而非抽象悲伤。
failure_boundary: 父亲目光并非真实辐射，也不具星体公共可见性；这种恒常感仅属于章北海的内在经验。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 章北海长期感到父亲的目光持续注视、判断并陪伴自己，这种精神存在融入其日常世界
vehicle: 太阳在白昼、星光在夜晚始终占据天空，以稳定光源覆盖人的全部时间并构成世界背景
ground: 1）父亲目光对应天光；2）白昼黑夜对应全部时段；3）持续注视对应恒常照耀；4）精神环境对应天空背景；5）目光消失对应天体熄灭。
