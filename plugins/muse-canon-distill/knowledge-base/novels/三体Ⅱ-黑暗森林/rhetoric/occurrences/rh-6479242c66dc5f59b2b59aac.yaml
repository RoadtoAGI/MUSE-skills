context_fact: 泰勒主张技术会削弱大国人口资源优势，并让数百万人口国家威胁过亿人口大国。
image_mechanism: 抽象技术被铸成坚硬长杆，国家在一端施加小力，远端整颗地球发生位移。
property_alignment: 1）人口资源对应输入力；2）技术对应机械放大器；3）小国崛起对应撬动；4）世界权力结构对应重物。
context_alignment: 紧邻核技术的非对称威胁例证，阿基米德式机械图景准确概括“小输入—大后果”。
narrative_function: 一句话凝结泰勒理论核心，解释其成为面壁者的战略履历。
transfer_rule: 杠杆隐喻适合存在可辨支点、输入和放大效应的权力变化；三者应能在语境中逐一落位。
failure_boundary: 技术并非中性工具，也不会自动让小国占优；缺少组织、工业和政治条件时，机械确定性会误导。
