quote: 真的很像建造中的“唐”号，两者有着几乎一样的沧桑感
sensory_mapping: 巨型钢腹、烧灼斑色、舰体阴影、旧船沧桑
context_fact: 章北海在空天飞机阴影下仰望，想到已拆解的“唐”号，甚至猜测机壳是否用了旧钢板。
image_mechanism: 机翼与跑道轮廓向海上舰体叠合，再入灼痕变成航母经历风浪留下的旧色，两代军种由钢板想象焊接。
property_alignment: 1）空天飞机对应航母；2）机腹对应船体；3）灼痕对应风霜旧迹；4）航天历程对应海航经历。
context_alignment: 章北海由海军进入太空军，比较源自职业传承和“唐”号私人记忆，沧桑感超出单纯外形。
narrative_function: 把旧海军历史移交给新太空军，呈现章北海向更高更远军种迈步。
transfer_rule: 跨载具类比应对齐体量、表面历史痕迹和观察者职业记忆，让形似承载制度传承。
failure_boundary: 两者结构用途差异巨大，旧钢板只是想象；若空天飞机表面崭新，沧桑传承会缺物证。
