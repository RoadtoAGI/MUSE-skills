chapter: 正文
figure_type: simile
quote: 像一架巨兽的骨骼
sensory_mapping: 巨骨悬空、肋梁交错、空腔透黑、兽形未活
context_fact: 船坞未来体积可达黄河站十倍，目前处于最初施工阶段，只有框架漂浮在轨道。
image_mechanism: 工程梁架按结构关系长成肋骨与脊柱，尚未完成的空白不再只是缺件，而像巨型生命被剥去血肉。
property_alignment: 1）船坞对应巨兽；2）施工框架对应骨架；3）未来外壳设备对应血肉器官；4）巨大尺度对应兽体；5）未完工对应遗骸状态。
context_alignment: 前一比喻把小设施写成帐篷，此处用巨兽骨架拉开船坞的未来体量，同时清楚标示完成度。
narrative_function: 在同一远景中兼顾规模宏大与建设早期，让未完成工程已有压迫性轮廓。
transfer_rule: 框架作骨骼应让梁柱排列确有脊、肋或关节结构，并利用缺失外壳表达工程阶段。
failure_boundary: 船坞是正在生长的工程而非死亡遗骸，‘骨骼’可能带来衰败感；结构封闭后该比喻即失效。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 刚开建、只搭出巨大施工框架而尚无外壳和内部系统的太空船坞
vehicle: 血肉与皮肤全部消失、只剩庞大骨架轮廓的巨兽遗骸
ground: 1）船坞框架对应骨骼；2）梁柱连接对应骨架关节；3）设计体量对应巨兽；4）外壳未建对应无皮肉；5）空洞内部对应骨腔。
