chapter: 正文
figure_type: analogy
quote: 锯断了被压住的那条腿，爬上车找到医院，拯救了自己的生命
sensory_mapping: 倒木压腿、血不断流、锯刃自断、残身爬向救援
context_fact: 代表认为失去思想自由比战败更悲惨，希恩斯用独处男孩自救故事论证生死危机中必须舍弃一部分。
image_mechanism: 文明被压成一个受伤身体，抽象价值不再并列争辩，而成为可截去的肢体；死亡倒计时迫使选择获得血肉代价。
property_alignment: 1）文明整体对应身体；2）某项自由对应腿；3）外敌威胁对应压树与失血；4）技术控制对应锯断；5）生存对应获救；6）伦理创伤对应残疾。
context_alignment: 希恩斯需要把强制技术写成自愿自救，男孩孤立、紧迫且自行下锯的细节正服务他的说服目标。
narrative_function: 把自由与生存冲突转成无法回避的身体选择，迫使听证会从本能厌恶进入折中讨论。
transfer_rule: 局部牺牲类比截肢时，应明确整体、局部、致死压力、自主决策和不可逆代价，并审查是否真无替代方案。
failure_boundary: 自由思想并非可与文明主体清楚分离的肢体，思想钢印也可能改变‘谁’在生存；危机未证明只有截肢一途。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类为避免文明在三体战争中灭亡，可能需要主动牺牲自由思想等珍贵但局部的权利
vehicle: 孤立无援、腿被树压住且将失血而死的男孩锯断受困肢体，以残缺换取全身存活
ground: 1）人类文明对应男孩身体；2）自由思想权对应被压腿；3）三体危机对应失血致死；4）思想钢印对应自我截肢；5）战争胜利对应到医院获救；6）权利损失对应终身残缺。
