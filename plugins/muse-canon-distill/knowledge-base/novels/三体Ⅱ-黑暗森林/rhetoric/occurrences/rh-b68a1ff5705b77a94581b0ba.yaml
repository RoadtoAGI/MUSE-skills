quote: 和十多年前罗辑掉入冰湖那一刻一样
sensory_mapping: 寒意加深、杂音冻住、黑暗收紧、单线亮起
context_fact: 惠子即将冬眠，严寒使她突然看清思想钢印相关的关键问题，但低温已让她无法呼叫停止。
image_mechanism: 两次低温危机被叠到同一认知轨道：寒冷像滤器压掉背景噪声，让埋藏线索在身体失控前陡然显形。
property_alignment: 1）惠子进入冬眠对应罗辑坠湖；2）人工超低温对应冰水；3）纷繁意识对应被冻滤的噪声；4）关键线索对应被迫聚焦的念头；5）无法呼救对应临界失能。
context_alignment: 前一事件已建立寒冷促成异常清醒的经验，本次重演还增加无法中止的悲剧后果，人物经验与物理条件都吻合。
narrative_function: 用前作记忆预警惠子的迟到发现，并把平静冬眠转成读者已熟悉的生死临界。
transfer_rule: 复用人物经历作认知类比时，应对齐触发条件、意识变化和行动后果，并让新场景增加新的风险信息。
failure_boundary: 低温通常损害认知，不能视为可靠的洞察方法；两人的具体发现、身体状态和后果并不相同。
