review_status: reviewed
tenor: 罗辑让一段短期情爱在双方同步厌倦时干净结束
vehicle: 火箭在恰当时刻抛离已完成作用的助推器
ground: 1）情人完成短期陪伴后被舍弃，对应助推器耗尽后分离；2）双方同时进入摆脱阶段对应精确分离时机；3）结束顺畅无纠缠对应抛离不影响主体航行。
