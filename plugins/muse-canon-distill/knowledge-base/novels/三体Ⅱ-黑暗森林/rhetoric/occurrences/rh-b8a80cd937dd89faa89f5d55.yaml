quote: 分离操作就进行得这么顺利，像火箭抛掉助推器一样漂亮。
sensory_mapping: 机械动作、时机、上升运动
context_fact: 罗辑为自己能控制关系节奏得意，与女子认识一周便平静分手。
image_mechanism: 把关系结束写成航天程序，伴侣被降为阶段性推进部件，分离的冷酷因技术语言显得高效而“漂亮”。
property_alignment: 1）短期关系对应阶段助推；2）厌倦同步对应预定分离点；3）罗辑继续生活对应主箭继续飞行。
context_alignment: 罗辑以理性技巧自赏，工程式喻体符合其把亲密关系操作化的冷漠视角。
narrative_function: 暴露罗辑的自我中心，并让紧接着的交通事故把他所谓漂亮分离变成不可逆死亡。
transfer_rule: 用机械分离写关系时，应明确双方承担的阶段功能、分离时点和留下者的运动方向，同时让物化本身刻画人物。
failure_boundary: 真实伴侣不是可耗尽部件；若双方仍有依恋或分离造成长期后果，“顺利抛离”会掩盖损伤。
quality_assessment: exemplary
