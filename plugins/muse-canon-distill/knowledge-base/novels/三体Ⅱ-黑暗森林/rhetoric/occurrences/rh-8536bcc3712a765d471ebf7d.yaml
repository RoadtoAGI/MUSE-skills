chapter: 正文
figure_type: simile
quote: 形成了荧光海洋中一个台风眼般的黑斑
sensory_mapping: 荧光人海从四周翻涌合拢，罗辑脚边留下一枚黑静圆眼，跪拜者像云墙压在边缘
context_fact: 人们想挤近罗辑，又敬畏地保持一圈距离；仍有人扑入空圈吻他的脚，局面接近失控。
image_mechanism: 群体压力被气象旋涡化，中心空白不再意味着安全，而显出周围巨大能量对中心的包围。
property_alignment: 1）群众密度对应风暴云墙；2）崇拜骚动对应风力；3）敬畏空隙对应风眼；4）中心人物对应风暴轴。
context_alignment: 前文已将发光人群写成海洋，台风眼从同一流体框架长出新结构，准确标出罗辑周围的暗圈。
narrative_function: 把被崇拜的权力表现为危险风暴中心，预示群众既可跪拜也可因失望转向攻击。
transfer_rule: 群体中心作风眼时，应让外围密度、运动压力、中心空区与中心人物位置同时成立。
failure_boundary: 人群没有真实旋转或固定气压结构，空圈由敬畏自发维持；不能据此推断集体运动方向。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 发光人群环绕罗辑却因敬畏留下的一圈无人的暗色空间
vehicle: 巨大旋转风暴中心的台风眼，周围是密集翻涌云墙，中心反而相对空、暗而平静
ground: 1）发光人群对应荧光云海；2）人群合拢压力对应风暴旋转；3）中心空圈对应台风眼；4）暗色反差对应眼区清空；5）罗辑居中对应风眼中心。
