quote: 大史的眼睛闪电般地从服务员拿餐刀的手上移到对面的罗辑身上
sensory_mapping: 目光骤亮、视线横劈桌面、刀与目标瞬间连线、身体紧随电光扑出
context_fact: 机器服务员刚拿起餐刀，大史立即判断攻击目标是罗辑，并抢在刀刺中前把他拉下椅子。
image_mechanism: 不可见的注意力转移被画成一道横穿桌面的电光，视觉侦测与身体救援因同一速度连续发生。
property_alignment: 1）史强视线对应闪电；2）餐刀与罗辑对应放电两端；3）快速扫视对应瞬发；4）危险信息对应强光显形；5）扑救对应雷后冲击；6）零迟疑对应直线劈落。
context_alignment: 连续自动化袭击要求旧刑警依靠毫秒级直觉，闪电速度既可信地解释救援，也与未来设备的电子环境呼应。
narrative_function: 把静态用餐瞬间切成动作高潮，突出史强相较未来人的生存反应优势。
transfer_rule: 目光作闪电时，应让起点、终点和紧随其后的动作形成同一路径，使速度产生叙事后果。
failure_boundary: 目光没有电流、亮度和破坏力，闪电速度是感受性夸张；史强仍需身体时间完成救援。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 史强发现机器人拿刀异常后，以极快速度完成危险识别并把注意力转向需要保护的罗辑
vehicle: 闪电在极短时间内沿一道明亮路径劈过空间，几乎不给观察者反应间隔
ground: 1）目光移动对应电光路径；2）速度极快对应瞬时放电；3）餐刀到罗辑对应两端连线；4）危险觉察对应骤亮；5）动作决断对应雷击直接；6）旁人来不及对应闪电短促。
