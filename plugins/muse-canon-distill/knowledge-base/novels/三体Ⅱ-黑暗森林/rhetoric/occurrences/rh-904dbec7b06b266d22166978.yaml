tenor: 林格抬头对着天花板、意识却越过控制室去凝视已被证实的三体舰队
vehicle: 视线真正穿透实体屋顶，直接望向遥远星空和舰队尾迹
ground: 1）抬头姿势对应仰望星空；2）思绪指向观测目标对应视线穿顶；3）天花板阻隔对应天文距离阻隔；4）证据在屏幕对应脑中重建天象。
