quote: 它们只是处于文明的婴儿阶段，只要文明掌握的技术超过了某个阈值，生命在宇宙中的扩张是很恐怖的
sensory_mapping: 两个小文明像襁褓婴儿沉睡星球，技术发育越过门槛后骤然站起，把脚步伸向银河
context_fact: 罗辑提醒大史不能从人类、三体现在的规模判断所有文明，并估算现有航速下一百万年可扩遍银河。
image_mechanism: 静态力量比较被改写为生命周期，当前尺寸只是一帧；婴儿必然值得评估其增长后的活动能力。
property_alignment: 1）文明年龄对应生物年龄；2）技术水平对应发育程度；3）星际能力对应行动能力；4）潜在威胁对应成年力量。
context_alignment: 罗辑向非专业听者解释‘小为何仍危险’，婴儿经验使潜能与当前无害外表的反差立即成立。
narrative_function: 为技术爆炸和清除弱小文明的冷酷逻辑提前铺垫，阻止以当前强弱解除猜疑。
transfer_rule: 组织作生命阶段时，应对应年龄、当前能力、发育触发点和成熟后的行为范围，避免只把新事物叫婴儿。
failure_boundary: 文明没有统一生物生命周期，也可能停滞或灭亡；婴儿成长的自然必然性不能直接套给技术发展。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 人类和三体当前能力弱小只是文明发展的早期状态，技术跨过关键门槛后扩张速度会骤增
vehicle: 婴儿体形小、能力有限却蕴含成长潜力；成长跨过发育节点后，活动范围和力量迅速扩大
ground: 1）初级文明对应婴儿；2）当前弱小对应幼小体形；3）技术积累对应发育；4）关键技术对应成长阈值；5）星际扩张对应成年活动能力。
