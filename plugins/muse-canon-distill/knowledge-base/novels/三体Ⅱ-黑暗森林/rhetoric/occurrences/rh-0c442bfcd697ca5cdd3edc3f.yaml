chapter: 正文
figure_type: simile
quote: 梦呓似的说：“不用了。”
sensory_mapping: 半闭意识、低声呢喃、迟缓吐字、现实失焦
context_fact: 罗辑长久凝视画像，艰难收回目光后转向窗外雪峰，只说不用调整。
image_mechanism: 画像仍像梦境覆在现实表面，罗辑的声音从这层未散的梦里漏出，听来没有日常答话的清醒棱角。
property_alignment: 1）罗辑恍惚对应梦者半醒；2）低短回答对应梦呓碎语；3）视线滞留对应意识未归；4）画像成真对应梦境来源。
context_alignment: 他刚见到梦中人被具象化的画像，梦呓既贴合发声状态，也扣住梦想进入现实的情节。
narrative_function: 用声音证实画像命中程度，并延续魔咒式凝视后的失神。
transfer_rule: 梦呓喻适合写愿望骤然具象后的失神，句法宜短，动作宜迟，周围须有梦与现实交叠的触发物。
failure_boundary: 罗辑完全清醒且能作决定，梦呓只描摹声态；若人物正进行严密长论述，喻体便失去可信度。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 罗辑面对完美画像时恍惚、低微而缺少清醒控制的说话状态
vehicle: 睡梦中意识未醒者含混而自动地吐出短句
ground: 1）神思恍惚对应半睡意识；2）声音低缓对应梦中呢喃；3）回答极短对应无意识吐字；4）目光刚艰难移开对应初醒迟滞。
