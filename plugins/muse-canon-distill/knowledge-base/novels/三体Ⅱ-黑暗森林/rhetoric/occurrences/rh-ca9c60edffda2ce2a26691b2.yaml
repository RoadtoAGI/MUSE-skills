chapter: 正文
figure_type: metaphor
quote: 我要是像你这么历练上一遭，可能早散架了
sensory_mapping: 冲击传入机身、连接件松动、零件四散、运转声突然停止
context_fact: 史强承认自己不像罗辑那样豁达，难以承受从救世主到难民再到未来普通人的巨大身份变化。
image_mechanism: 人的承受系统被机械化，磨难不是抽象痛苦，而是反复震击结构连接，直至整个人无法保持一体。
property_alignment: 1）史强心智对应机器；2）性格稳定对应机架；3）责任压力对应负载；4）罗辑经历对应冲击；5）崩溃对应散件；6）适应未来对应维持运转。
context_alignment: 前文刚写罗辑像上发条机器被事件推动，史强顺势用‘散架’延续机械域，却从被动运行转向承载极限。
narrative_function: 让一贯强硬的大史坦陈脆弱，反向确认罗辑随遇而安是一种真实的生存能力。
transfer_rule: 人格作机器结构时，应指出承重部件、外部冲击、连接失效和停转后果，使‘散架’对应具体压力史。
failure_boundary: 精神受创不等于不可修复的机械解体，史强也只是在假设；不能由此认定他实际承受力弱。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 史强认为自己若承受罗辑成为救世主、难民并跨越时代的一连串压力，心理与生活结构可能早已崩溃
vehicle: 一台由许多零件连接成的机器受冲击过大，连接件断裂，机体解体成无法运转的散件
ground: 1）人格结构对应机架；2）心理能力对应连接件；3）连续磨难对应冲击振动；4）失去支撑对应螺栓松脱；5）精神崩溃对应整机散架；6）继续生活对应机器运转。
