tenor: 罗辑认为自己将被水滴撞死，独自驾车前往无人谷地，把这段行驶当作生命终程
vehicle: 旅人走上通向终点且没有返程的道路，路的末端同时是生命或旅途的结束
ground: 1）人生对应旅途；2）公路对应生命路径；3）驾车离开对应迈步；4）预期死亡对应终点；5）与大史告别对应不返程。
