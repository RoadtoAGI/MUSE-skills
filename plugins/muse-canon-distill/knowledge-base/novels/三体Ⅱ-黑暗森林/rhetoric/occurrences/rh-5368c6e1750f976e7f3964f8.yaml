quote: 开车踏上了最后的路程
sensory_mapping: 车灯切开暮色、道路向沙漠深处延伸、身后大史缩进后视镜、前方终点与死亡重合
context_fact: 他拒绝大史陪同，努力记住朋友影像后驾车去预计撞击区等待。
image_mechanism: 真实公路与生命路径完全重叠，物理前进每一公里都同时减少剩余生命距离。
property_alignment: 1）车辆对应生命载体；2）路线对应余生；3）目的地对应死亡点；4）后视镜对应过去；5）单向驾驶对应不可逆。
context_alignment: 场景确有道路、告别和预定终点，常规生命旅途喻体因现实路线精准贴合而获得力度。
narrative_function: 把与大史告别切到罗辑独行，并自然引出沿路回忆庄颜与一生的临终回放。
transfer_rule: 真实行程作人生终程时，应让方向、同伴离开、后视镜、目的地和时间限同时承担双义。
failure_boundary: 水滴随后转向，路程并非实际最后一程；人物预期不能当作死亡事实。
