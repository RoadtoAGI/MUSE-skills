chapter: 正文
figure_type: simile
quote: 一百艘战舰像一挂鞭炮似的在一分钟内炸完
sensory_mapping: 百艘巨舰缩成一挂爆竹、火头沿直线窜行、爆光接连跳起、整挂顷刻归零
context_fact: 水滴以每秒三十公里贯穿密集第一列，每艘战舰的聚变燃料随后爆炸。
image_mechanism: 百万吨星舰被节庆小物降格，密集编队天然成为串联结构，水滴只需点燃一端便产生视觉连锁。
property_alignment: 1）百艘战舰对应百枚爆竹；2）编队直线对应挂绳；3）水滴对应火星；4）核燃料对应火药；5）逐舰爆炸对应连响；6）队列消失对应鞭炮炸尽。
context_alignment: 不久前地球正放鞭炮庆祝胜利，同一意象被战舰毁灭夺回，欢乐爆响翻成文明葬礼。
narrative_function: 用日常速度感表达指挥官无法承受的毁灭节奏，并尖锐反转全民庆典。
transfer_rule: 线性连爆作鞭炮时，应有规则串列、单向触发、相邻接力和短时清空，最好回收先前庆典语境。
failure_boundary: 战舰并未由物理引线串联，爆炸由水滴逐舰穿透触发；鞭炮尺度会遮蔽人员伤亡。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 第一队列百艘巨舰被水滴按直线顺序贯穿，燃料舱接连核爆并在一分钟内全部毁灭
vehicle: 一挂以引线串联的鞭炮从一端点燃，爆炸沿队列快速接力，短时内逐枚炸尽
ground: 1）战舰对应鞭炮；2）队列对应一挂串联；3）水滴轨迹对应引线火头；4）依次核爆对应连响；5）一分钟全灭对应迅速炸完；6）燃料舱对应火药。
