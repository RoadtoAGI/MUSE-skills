quote: 如同一辆从城市中开出的汽车
sensory_mapping: 母舰铺成钢铁城市、小艇像车驶出阴影、尾灯微亮、庞大舰体留在身后
context_fact: 四人考察队乘穿梭艇从量子号出发，前往一千公里外已经装载水滴的螳螂号。
image_mechanism: 太空尺度被压回城市交通，母舰的巨大由可容纳‘汽车出城’获得直觉，小艇航程也显得日常无害。
property_alignment: 1）量子号对应城市；2）穿梭艇对应汽车；3）舱口对应城市出口；4）航行对应公路驶离；5）体积比例对应城车比例；6）考察队对应车内乘客。
context_alignment: 考察队正把外星接触当成普通差事，汽车出城的日常感与实际死亡航程形成反讽。
narrative_function: 明确小艇与母舰尺度，并把人物从受保护的舰队世界送入孤立近距接触。
transfer_rule: 子载具离开母体作车辆出城时，应对齐尺寸比例、出入口、航程等级和载客功能。
failure_boundary: 太空没有道路与城市边界，穿梭艇速度、风险和维生依赖远超汽车；日常感不代表安全。
