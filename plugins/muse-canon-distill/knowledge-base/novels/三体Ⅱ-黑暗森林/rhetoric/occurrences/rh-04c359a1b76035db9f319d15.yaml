chapter: 正文
figure_type: analogy
quote: 从各个点向外扩散，就像一块儿湿布被晒干那样
sensory_mapping: 湿面起斑、边缘发白、干区外扩、斑块彼此接合
context_fact: 亲历者纠正罗辑对沙漠从长城以北推进的想象，解释大低谷的‘插花式侵蚀’。
image_mechanism: 国土被铺平为含水织物，沙化不再像敌军越界，而像日照从整个表面抽走水分，许多干点同时蔓延。
property_alignment: 1）国土对应湿布；2）土壤水分与植被对应布中水；3）气候污染压力对应日晒；4）沙化区对应干斑；5）扩散过程对应水分向外消失；6）连片荒漠对应布面干透。
context_alignment: 喻体准确修正空间模型，‘各点向外’与湿布干斑的生成过程逐项吻合，比地图边界推进更贴近真实现象。
narrative_function: 让读者即时看懂插花式沙化，并把环境崩溃呈现为普遍、难以设防的面状过程。
transfer_rule: 解释多中心扩散时，应选择能同时起斑的连续介质，对齐触发、斑点边缘、扩张与合并阶段。
failure_boundary: 土地沙化受风、植被、土壤和人类活动影响，不像同材质布料均匀失水；时间与方向会高度不均。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 内地沙漠化并非从边界单向推进，而是在多处分散起点同时失水、沙化并向周边扩张
vehicle: 整块湿布受日晒时，多处水分同时蒸发，干斑从各点出现并逐渐扩大连成一片
ground: 1）湿润土地对应湿布；2）水土流失对应水分蒸发；3）沙化斑点对应干斑；4）多点发生对应各处同时晒干；5）向外侵蚀对应干区扩展；6）最终连片对应整布干透。
