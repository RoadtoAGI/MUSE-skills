tenor: 最后一艘战舰‘方舟’号在远离主残骸云的太空深处独自爆炸，火球亮数秒后熄灭
vehicle: 空旷野地里唯一一盏灯受风吹灭，微小光源短暂抵抗巨大黑暗后消失，无人相伴或救援
ground: 1）战舰火球对应灯；2）太空对应旷野；3）孤舰对应孤灯；4）火球熄灭对应风吹灯灭；5）远离舰群对应四周无人。
