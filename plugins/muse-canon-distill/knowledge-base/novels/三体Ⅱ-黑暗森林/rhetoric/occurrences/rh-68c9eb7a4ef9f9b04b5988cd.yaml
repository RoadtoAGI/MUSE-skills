figure_type: simile
quote: 像一盏消失在旷野风中的孤灯
sensory_mapping: 无边黑野只剩一点灯火、风似的无形力量掠过、孤光摇亮数秒便彻底灭去
context_fact: 冲出云团的舰船逐一被追毁，水滴在远处摧毁最后的‘方舟’号。
image_mechanism: 聚变爆炸从巨大武器事件缩为荒野微灯，距离和孤独使熄灭比爆发更成为视觉重心。
property_alignment: 1）核火球对应灯焰；2）黑暗空间对应旷野夜色；3）末舰对应独灯；4）水滴攻击对应灭灯之风。
context_alignment: 舰名‘方舟’含最后载体意味，孤灯熄灭准确封闭舰队幸存希望，语调由狂暴巨龙降为寂静哀悼。
narrative_function: 收束末日战役的动态高潮，以单点熄灭标记两千舰集体死亡完成。
transfer_rule: 末个光源作孤灯时，应配置广阔暗场、孤立距离、熄灭动作和此前群体消失，让终点获得情感重量。
failure_boundary: 太空没有风，火球是爆炸余辉而非可续燃灯焰；水滴也不是随机自然力量。
