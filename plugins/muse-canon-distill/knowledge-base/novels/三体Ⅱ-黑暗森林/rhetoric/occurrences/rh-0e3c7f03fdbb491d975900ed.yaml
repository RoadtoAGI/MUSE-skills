chapter: 正文
figure_type: metaphor
quote: 罗辑先是证实了她的感觉。然后又无情地打碎了它
sensory_mapping: 终极公正像一块透明坚硬物被罗辑举起证明，随后又从他手中摔碎，碎片反刺向相信它的人
context_fact: 主任曾因187J3X1毁灭相信罗辑代表宇宙公正，后来公众认定爆炸偶然且罗辑没有救世计划。
image_mechanism: 抽象信念获得整体性和脆性，验证与否定成为举证、撞碎两个连续动作，失望因而带施害者指向。
property_alignment: 1）完整世界观对应完整器物；2）证据支持对应确认材质；3）反证对应冲击；4）信仰瓦解对应碎片化。
context_alignment: 主任需要为自己的恼羞寻找责任对象，‘罗辑打碎’把认知变化写成他对她施加的动作，解释其无怜悯。
narrative_function: 揭示群众崇拜转仇恨的心理机制，为罗辑被驱逐、遭拒载提供社会情绪根源。
transfer_rule: 信念作脆物时，应写出谁建立或验证、冲击来自哪次事实、碎裂后如何改变持有者行为。
failure_boundary: 罗辑没有承诺宇宙公正，也未主动摧毁主任信念；施害动作是她的归因，不能当作客观责任。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 主任相信宇宙终有公正，罗辑的咒语一度验证这信念，雪地工程失败和无能表现随后摧毁了信念
vehicle: 一件脆硬物先被确认真实存在，随后遭猛烈撞击碎裂，原有整体无法继续使用或恢复
ground: 1）公正信念对应脆物；2）咒语生效对应确认其存在；3）罗辑失败对应撞击；4）信仰崩溃对应碎裂；5）恼怒对应碎片伤害。
