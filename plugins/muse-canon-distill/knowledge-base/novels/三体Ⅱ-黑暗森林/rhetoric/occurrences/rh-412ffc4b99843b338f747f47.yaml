chapter: 正文
figure_type: simile
quote: 像一株随时都会被寒风吹走的小草
sensory_mapping: 视觉、触觉、尺度、运动
context_fact: 罗辑无法控制想象，女孩仍穿白衣红巾走在无际风雪中，他第一次为她的安危心疼。
image_mechanism: 将人缩成最轻、最柔弱的植物，风雪不再只是背景，而成为随时能拔走她的持续力量。
property_alignment: 1）身材纤小对应草株；2）衣身受风对应草茎弯折；3）孤身雪原对应无遮蔽草地；4）可能消失对应被吹走。
context_alignment: 草的脆弱与女孩此前被作者操纵的无生命感不同，它会受环境、需要保护，促使罗辑产生真实关切。
narrative_function: 把虚构人物的危险变成罗辑可感的身体焦虑，推动想象转化为爱情。
transfer_rule: 表现脆弱人物时，应让体量、支撑方式、外力方向和消失风险共同对应具体生命体。
failure_boundary: 人物有坚固庇护、主动抗击能力或环境无强风时，小草会过度削弱其主体性。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 罗辑想象中独自在暴风雪里行走的娇小女孩
vehicle: 根浅茎细、随时会被大风连根卷走的小草
ground: 1）娇小身躯对应细弱草茎；2）暴风远强于她对应风力压过小草；3）独自前行缺少保护对应孤草暴露；4）身影摇摆难辨对应草随风倾伏。
