chapter: 正文
figure_type: simile
quote: 这层灰纱般的薄云
sensory_mapping: 灰白薄纱、太阳隐后、光线滤弱、天空蒙面
context_fact: 政工特遣队飞机离开后，机场处于萧瑟冬日，太阳隔着薄云只发出无力白光。
image_mechanism: 云层从气象物压成覆在天空表面的织物，纱眼仍让太阳透出，却把亮度和边缘一并磨钝。
property_alignment: 1）薄云对应灰纱；2）天空对应被覆盖的面；3）透云日光对应隔纱白光；4）冬日黯淡对应纱的灰色。
context_alignment: 送别场景需要既看得见太阳又感受不到温暖，半透明灰纱恰好同时保留光源与隔绝感。
narrative_function: 给永别后的机场罩上丧服般的视觉滤镜，把集体克制的哀伤投向天气。
transfer_rule: 用织物写云层时，应同时核对厚薄、透光率和颜色，并让被遮对象的视觉变化成为证据。
failure_boundary: 厚重雷雨云不具薄纱透明性，晴空碎云也无法形成整层遮罩；灰纱的哀悼意味属于此送别语境。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 冬日天空中颜色灰白、质地轻薄并遮弱太阳的云层
vehicle: 一层半透明、灰色且能柔化后方轮廓的薄纱
ground: 1）云层对应纱层；2）灰白颜色对应灰纱；3）薄而透光对应纱的半透明；4）太阳光被削弱对应隔纱观看。
