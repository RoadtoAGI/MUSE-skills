chapter: 正文
figure_type: metaphor
quote: 真他妈是人间地狱
sensory_mapping: 沙尘遮日、天地灼热、人群饥行、尸体转瞬被分食
context_fact: 张延亲眼见过饥饿大进军，讲到死亡者立刻被分食，至今回忆仍让人感到折寿。
image_mechanism: 宗教惩罚空间被压到现实地表，天、地、人群和尸体共同组成无需死后才进入的酷刑世界。
property_alignment: 1）大低谷平原对应地狱场域；2）酷热对应烈焰；3）饥饿死亡对应刑罚；4）逃荒者对应受难者；5）秩序崩溃对应恶鬼环境；6）无救援对应地狱封闭。
context_alignment: 粗口出自亲历者，紧接具体感官与食人细节，‘地狱’有证据支撑而非抽象夸大，也保留创伤话语的粗粝。
narrative_function: 把环境、饥荒和伦理崩溃压成一句极端判断，使桌上丰盛农餐与过去苦难形成刺痛对照。
transfer_rule: 现实作地狱时，应先给出多重、不可逃的身体折磨和秩序崩坏细节，让宗教极限词承担归纳。
failure_boundary: 大低谷仍有幸存、援助与后续复兴，地狱的永恒刑罚和超自然因果不能转移到历史事实。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 大低谷饥饿大进军中数千万人在沙尘、酷热、死亡与食人压力下逃荒的现实
vehicle: 地狱中无处逃脱的极端灼热、饥饿、死亡和道德崩坏折磨
ground: 1）热天热地对应地狱烈火；2）大规模饥饿对应无尽刑罚；3）尸体被分食对应人性崩坏；4）数千万人逃荒对应群体受难；5）沙土遮天对应封闭阴惨；6）生存无路对应无法逃离。
