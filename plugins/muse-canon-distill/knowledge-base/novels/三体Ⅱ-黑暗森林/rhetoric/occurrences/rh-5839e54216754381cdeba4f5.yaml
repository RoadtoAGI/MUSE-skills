quote: 这个不堪一击的时代，我们这些皮实的野蛮人又能派上用场了
sensory_mapping: 光洁时代像薄壳受击碎裂、旧世纪的人带着粗厚皮肤站起、在碎片间重新承担工作
context_fact: 前任市长遇难，新市长是冬眠者；现代官员大量崩溃，冬眠者官员仍保持行动能力。
image_mechanism: 心理特征被材料化为脆性与韧性，文化评价又倒置：被视为野蛮的旧人此刻成为可用的承重件。
property_alignment: 1）社会心理对应材料；2）末日消息对应冲击载荷；3）现代敏感对应脆；4）旧人麻木对应皮实；5）治理任务对应承重用途。
context_alignment: 市长以自嘲口吻压缩代际差异，符合冬眠者务实语气，也避免把接任说成个人荣耀。
narrative_function: 解释危机中权力为何向冬眠者转移，并建立市长愿意听大史的共同身份基础。
transfer_rule: 心理群体作材料时，应给出受力事件、破坏模式、韧性来源和实际用途，避免简单贬褒。
failure_boundary: 现代人并非普遍脆弱、冬眠者也非天生野蛮；麻木在其他环境可能妨碍同理与判断。
quality_assessment: exemplary
