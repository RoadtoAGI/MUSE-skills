review_status: reviewed
tenor: 未来社会心理敏感、危机承受力低，而冬眠者粗粝、耐受冲击，反而适合接管灾后治理
vehicle: 易碎器物轻击即裂，皮实材料经碰撞仍可使用；文明人精细脆弱，野蛮人粗糙却能在恶劣环境生存
ground: 1）未来时代对应易碎物；2）心理崩溃对应受击破裂；3）冬眠者对应耐磨材料/野蛮人；4）危机对应冲击；5）接管职位对应耐用品投入使用。
