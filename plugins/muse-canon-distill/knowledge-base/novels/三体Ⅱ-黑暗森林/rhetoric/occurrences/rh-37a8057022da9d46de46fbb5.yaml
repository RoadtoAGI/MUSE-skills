chapter: 正文
figure_type: metaphor
quote: 粘接他们的重力消失了
sensory_mapping: 身体贴座、无形胶层、黏性骤失、两物漂开
context_fact: 主发动机关闭后，超重巨掌松开，安全带仍在，但章北海感觉自己与飞船平行飞行。
image_mechanism: 持续下压的重力被改写成座椅与人体之间的透明胶层，发动机停机像溶剂瞬间解除黏性，身体意识随即浮离。
property_alignment: 1）章北海与飞船对应两个物体；2）重力对应胶层；3）受压贴合对应粘接；4）失重对应脱胶；5）漂浮感对应分离。
context_alignment: 前句‘巨掌松开’解释力的撤去，此句进一步解释整体感为何消失，触觉变化与轨道物理一致。
narrative_function: 把首次失重从科学状态转成身体可感的脱离，表现章北海终于成为太空中的独立飞行者。
transfer_rule: 把约束力写成胶，应交代它黏合哪些对象、何时增强或失效，以及解除后对象如何运动。
failure_boundary: 安全带仍物理连接人体与座椅，重力也不是材料黏性；在有加速度但无接触面时，胶喻不成立。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 进入轨道失重后，章北海不再被座椅压住，主观上与空天飞机失去身体整体感
vehicle: 把两个物体牢牢黏成一体、撤除后便可各自漂离的胶黏剂
ground: 1）重力对应胶；2）人体与座椅对应被粘物；3）超重压紧对应强粘接；4）失重对应胶失效；5）平行漂浮对应彼此脱开。
