chapter: 正文
figure_type: metaphor
quote: 把金辉撒向这个从毁灭中幸存的世界
sensory_mapping: 太阳露出一角，细密金粉从东方铺洒到墓地和整个世界，黑夜退去，幸存地球被重新染亮
context_fact: 三体接受威慑条件、智子球体消失后，太阳从东方露出，罗辑从墓地起身离开。
image_mechanism: 连续而不可抓握的光被颗粒化为金辉，照明动作成为从天际向幸存世界的铺撒，赋予胜利后的晨光礼物感。
property_alignment: 1）光线颜色对应黄金色；2）光束扩散对应颗粒散开；3）地面受光对应承接覆盖；4）黎明渐亮对应金层铺展。
context_alignment: 故事刚从墓穴、雨夜和毁灭倒计时转入黎明，金色撒落让物理日出承担威慑成功后的视觉转调。
narrative_function: 结束墓地高潮，把共同毁灭的黑暗切换为可见晨光，并为五年后明亮家庭场景过渡。
transfer_rule: 把光写成可撒物时，应匹配颜色、传播方向、覆盖范围和受光后的表面变化，让动作服从现场光源。
failure_boundary: 阳光没有黄金颗粒或施撒意志，‘金’只承载晨光色泽和铺展观感；阴天或无明确高位光源时对应会变弱。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 清晨太阳照亮刚刚避开黑暗森林广播与共同毁灭的地球
vehicle: 一把金色细粒从高处铺撒下来，落到广阔地面并给原本暗淡的表面镀上明亮色泽
ground: 1）阳光对应金色颗粒；2）照射对应撒落；3）东方天空对应高处施撒者；4）地球表面对应承接面；5）幸存后的明亮对应覆上一层金色。
