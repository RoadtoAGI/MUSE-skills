quote: “凡尔纳岛”呈现出完整的轮廓，仿佛是被吊在导轨下端的一个大盘子
sensory_mapping: 细线垂下、圆盘悬挂、高空俯视、盘沿完整
context_fact: 电视镜头来自运载舱底部，导轨向下变细消失，遥远下方的凡尔纳岛显出全貌。
image_mechanism: 太空电梯导轨在透视中收成一根吊线，海上钢铁城市被高度压平成盘面，地面像物件挂在天梯末端。
property_alignment: 1）凡尔纳岛对应大盘；2）太空导轨对应吊线；3）岛轮廓对应盘沿；4）上下位置对应悬吊结构。
context_alignment: 摄像机恰沿导轨俯拍，线—盘几何关系真实可见；尺度倒置又直观表现太空电梯高度。
narrative_function: 把宏大工程压缩成老人电视中可懂的日常物象，强化地面被天梯提起的奇观。
transfer_rule: 高空物体比盘应让轮廓近圆、细节因距离消失，并有线性结构提供悬吊关系。
failure_boundary: 浮岛实际浮在海上，导轨向上拉伸并非从上吊住盘子；斜视或岛形不规则时盘面感减弱。
