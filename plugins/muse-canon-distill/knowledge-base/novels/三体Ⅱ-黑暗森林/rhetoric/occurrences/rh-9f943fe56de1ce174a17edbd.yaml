context_fact: 罗辑昼夜颠倒持续思考，已知法则却要反向复原文明图景，比达尔文路径更艰难。
image_mechanism: 演绎步骤被铺成夜路，每个未知概念隆起为险坡；罗辑既能看见方向，又无法一眼确认落脚处。
property_alignment: 1）罗辑对应行者；2）推演对应行路；3）疑难对应险阻；4）宇宙真相对应终点。
context_alignment: 前文心绪沿轨道、后文思想行程共同形成移动框架，“望而生畏”准确表现方向清楚但路径艰难。
narrative_function: 把长期静态思考写成具有距离和风险的行动，为星空提供的安慰建立需求。
transfer_rule: 思想道路喻应标明起点法则、终点问题和中间具体险阻，避免把任何思考泛称旅途。
failure_boundary: 推理可跳跃和并行，不必顺序走完一条路；如果答案来自突然实验，连续跋涉结构会失配。
