chapter: 正文
figure_type: simile
quote: 那价格会飞一样向上涨
sensory_mapping: 运动、方向、速度
context_fact: 史晓明声称基金稀缺、富人众多，以保值升值劝老张立即购买。
image_mechanism: 把不可见的价格曲线变成一件骤然离地的物体，“飞”同时删除缓慢增长和回落的想象。
property_alignment: 1）数值增加对应向上；2）抢购加速对应飞升；3）错过低价对应物体离手远去。
context_alignment: 夸张速度符合推销者制造紧迫感的口吻，且与后文骗局揭露形成反讽。
narrative_function: 强化销售诱惑与时间压力，让老张的决策显得受到速度幻觉推动。
transfer_rule: 用飞升写价格时，要给出推动上升的市场力量和人物害怕错过的时间窗口。
failure_boundary: 价格可能波动或归零；没有供需证据时，“飞涨”只是推销承诺，不能当作趋势判断。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 逃亡基金公开发售后被推销者预言的价格上涨
vehicle: 脱离地面、迅速向高处飞升的物体
ground: 1）价格提高对应垂直上升；2）涨幅被说成很快对应飞行速度；3）市场抢购将其推高对应持续升力。
