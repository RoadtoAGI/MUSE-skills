quote: 这话也在所有人的心中再次掀起了波澜
sensory_mapping: 静水受击、波纹外扩、胸中起伏、表面仍强作平静
context_fact: 政工特遣队即将冬眠，送行者明知是永别；章北海罕见地遗憾无神论让死后相聚无望。
image_mechanism: 纪律压成平面的情绪水体被一句话击中，悲伤从深处涌起波形，却仍被军人藏在外表之下。
property_alignment: 1）内心对应水域；2）隐藏悸动对应水下扰动；3）告别话语对应投石；4）情绪复起对应波澜；5）多人共感对应同一水面扩散。
context_alignment: 章北海一贯冷峻，他的突然柔软足以成为扰动源；后句又明确众人把悸动隐藏，构成水面与水下反差。
narrative_function: 在最后军礼前让集体克制短暂裂开，使跨世纪出发具有真实永别重量。
transfer_rule: 用水面写群体情绪时，应先建立克制的平静，再给出明确触发物、扩散范围和重新压住的动作。
failure_boundary: 情绪并非同质水体，每个人的悲伤程度不同；波澜只说明被触动，不证明外在失控。
