chapter: 正文
figure_type: simile
quote: 一直冷若冰霜的山杉惠子的脸上掠过一丝神秘的笑容
sensory_mapping: 脸色结霜、肌肉凝住、寒意拒人、微笑如冷光一闪
context_fact: 希恩斯承认研究失败后，惠子短暂露出神秘笑容，稍后即宣布自己是他的破壁人。
image_mechanism: 人的社交温度被降到冻结点，脸成为封住情绪的霜面；一丝笑容因而像冰上短促反光，仍不带暖意。
property_alignment: 1）惠子表情对应冰霜；2）无表情对应冻结；3）拒绝交流对应低温排斥；4）秘密对应冰层覆盖；5）笑容对应表面闪光；6）即将揭露对应冰下压力。
context_alignment: 她正隐藏破壁身份，冷面既符合日本人物的克制姿态，也让这次笑意成为会场真正危险的先兆。
narrative_function: 在正式发言前给出极小的异常信号，使后续揭密既有伏笔又保持突袭感。
transfer_rule: 冷面作冰霜时，应让凝固、低温和遮蔽服务于具体秘密，并用一次微小表情变化显示冰层将破。
failure_boundary: 惠子的体温与皮肤并未结冰，冷峻也不等于没有感情；冰霜不能推出她的全部动机。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 山杉惠子此前面无表情、态度冷峻且与会场保持情感距离的面容
vehicle: 冬日冰层与霜面温度极低、颜色苍白、质地僵硬且拒绝靠近
ground: 1）表情冷淡对应低温；2）面部僵硬对应冰面凝固；3）疏离感对应触碰刺冷；4）苍白静止对应霜色；5）突然笑意对应冰面掠过裂光；6）秘密敌意对应冰下暗流。
