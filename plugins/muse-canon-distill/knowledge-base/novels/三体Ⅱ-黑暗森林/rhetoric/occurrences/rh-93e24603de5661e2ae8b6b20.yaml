chapter: 正文
figure_type: simile
quote: 看上去就像把一个大脑蒸发成气体
sensory_mapping: 脑体汽化、颗粒飞散、体积膨胀、白雾充室
context_fact: 解析摄像机保留突触联接拓扑，却为观察把神经元间距放大数万倍，使人可以漫步其间。
image_mechanism: 紧密脑组织被想象成一次相变，细胞没有消失，只像分子般彼此远离，原本掌中器官膨胀到建筑尺度。
property_alignment: 1）大脑组织对应凝聚物；2）神经元对应分子；3）尺度放大对应汽化膨胀；4）全息白雾对应气体；5）联接拓扑对应物质身份未变。
context_alignment: 周围最初就被误认作白雾，蒸发类比反向解释这一视觉结果，并准确说明显示处理只改距离、不改连接。
narrative_function: 把四至五个数量级的抽象放大转换成相变经验，让全视网的展示原理可直觉理解。
transfer_rule: 用相变解释尺度展开时，应保留组成单元，明确改变的是间距、密度和占据体积，而非结构本身消亡。
failure_boundary: 真正蒸发会破坏组织与突触，显示图却保持拓扑；不能从气态外观推断神经元失去连接。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 神经元之间距离被放大四至五个数量级后，大脑组织散布成充满建筑的全息微粒云
vehicle: 完整液态或固态物质受热蒸发，分散为疏松、充满空间的气体分子
ground: 1）完整大脑对应原物质；2）神经元对应气体分子；3）距离大幅拉开对应蒸发膨胀；4）白雾外观对应气态云；5）拓扑不变对应分子来源仍同一物质。
