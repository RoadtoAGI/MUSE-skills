chapter: 正文
figure_type: metaphor
quote: 雪地工程进行了一年半后陷入停顿
sensory_mapping: 庞大工程走了一年半后陷进泥地，船队与氢弹都停在原处，计划路线仍向前却没有牵引力
context_fact: 海王星油膜物质仅采集一百五十万吨，太阳轨道只部署一千六百一十四颗氢弹，不到计划五分之一。
image_mechanism: 组织进度被空间化为道路运动，单纯‘没有继续’获得下坠和受困阻力，显出停滞并非主动完成。
property_alignment: 1）时间推进对应路程；2）项目组织对应行者；3）物资缺口对应泥坑；4）工作停止对应车轮空转。
context_alignment: 前文反复使用‘启动、进展迟缓’，这里以‘陷入’完成由慢到停的动势收束，符合工程叙述词场。
narrative_function: 宣告公开雪地工程失败，为罗辑地位崩塌作事实节点，同时遮蔽已部署核弹的真正用途。
transfer_rule: 把项目写成行进时，应交代路线目标、减速因素、停止位置和可能脱困条件，使空间动词携带进度信息。
failure_boundary: 工程没有真实坠入地形，也并非所有工作永久终止；‘陷入’不能替代油膜、核弹和政治阻力等具体原因。
quality_assessment: conventional
confidence: 0.95
review_status: reviewed
tenor: 雪地工程因资源与政治支持不足而无法继续推进，只完成远低于计划的部署量
vehicle: 行进者或车辆跌进低洼、泥沼或障碍区，前进速度降为零且难以自行脱出
ground: 1）工程进度对应行进；2）资源不足对应下陷地面；3）部署停止对应失去位移；4）恢复工程对应脱困再上路。
