chapter: 正文
figure_type: metaphor
quote: 你就是那种习惯于把社会看成垃圾的垃圾。
sensory_mapping: 视觉污秽、价值弃置、语言回环
context_fact: 罗辑用小说中销毁救生圈的情节证明人类会阻止少数逃亡，伴侣立即反驳他的社会观。
image_mechanism: 同一个“垃圾”先压扁社会价值，再回弹到说话者身上，重复词位形成从对象到观察者的瞬时反转。
property_alignment: 1）社会被视作无价值物对应第一处垃圾；2）犬儒眼光被视作污秽对应第二处垃圾；3）弃置判断的往返对应语言反击。
context_alignment: 亲密关系已到相互摆脱阶段，简短粗口比理论辩驳更符合争执节奏；重复结构又精准命中罗辑的评价习惯。
narrative_function: 用一句对称辱骂暴露两人关系破裂，也迫使读者区分罗辑的洞见与其犬儒偏见。
transfer_rule: 回环式比喻可复用对方的评价词并改变指向，让语义反弹本身承担反驳；两次指称的依据需分别成立。
failure_boundary: “垃圾”没有具体结构对应，主要依靠价值贬斥；用于分析性叙述会过于粗糙，只适合角色冲突中的口语攻击。
quality_assessment: strained
confidence: 0.9
review_status: reviewed
tenor: 女人对罗辑犬儒社会观及其人格的双重贬斥
vehicle: 被视为无价值、肮脏并应丢弃的垃圾
ground: 1）罗辑把社会成员预设为自私恶劣对应把整体判作废物；2）女人认为这种眼光令人厌恶对应垃圾污秽；3）同词回击把评价者纳入其评价对象对应垃圾反噬。
