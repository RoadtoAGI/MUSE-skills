chapter: 正文
figure_type: simile
quote: 像一条二千公里长的血河
sensory_mapping: 太空暗下、长条暗红重新显现、百舰残液汇成河、死亡轨迹横贯黑空
context_fact: 水滴用一分钟贯穿第一队列，火球熄灭后舰体只剩正在扩散冷却的熔融金属。
image_mechanism: 分散液滴被距离整合成长河，金属红光获得血液意义，舰队名单的逐一消失在空间中留下集体伤口。
property_alignment: 1）熔金属对应血；2）队列遗迹对应河道；3）暗红对应血色；4）惯性飞散对应流动；5）二千公里对应长河；6）死亡舰员对应血河来源。
context_alignment: 前文光海与岩浆海仍偏物理奇观，血河第一次直接给景观赋予死亡伦理，完成从壮丽到惨烈的转色。
narrative_function: 为第一列全灭留下可见墓志，也把水滴的直线杀戮路径永久标在太空。
transfer_rule: 暗红液态遗迹作血河时，应有连续路径、明确死亡来源、尺度长度和由亮转暗的色彩过程。
failure_boundary: 金属液不是生物血液，也不会在真空中汇成有岸河道；视觉连续来自远观。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 第一队列百艘战舰消失后，冷却中的暗红金属液沿原编队方向绵延约二千公里并重新显光
vehicle: 一条由鲜血汇成的长河横贯黑暗地面，颜色暗红，流向标出大规模死亡路径
ground: 1）金属液带对应河流；2）暗红光对应血色；3）二千公里延伸对应河长；4）编队方向对应河道；5）百舰死亡对应血源；6）液态飞散对应流动。
