quote: 真的感觉像是战争时期了
sensory_mapping: 物资收紧、政治低压、军工轰鸣、日常蒙上战时色调
context_fact: 冬眠者向罗辑和史强讲述大低谷，三体舰队尚未到来，人类却先为末日战争透支经济社会。
image_mechanism: 尚无炮火的年代被战争的制度和情绪提前占领，前线不在眼前，匮乏与管控却已进入每户生活。
property_alignment: 1）危机社会对应战争时期；2）经济转型对应总动员；3）资源下降对应配给匮乏；4）政治空气对应戒严压力；5）三体威胁对应远方敌军。
context_alignment: 讲述者用亲历体感而非历史标签作比较，随后环保受镇压、饥荒进军等细节逐项证实战时化。
narrative_function: 为大低谷叙述提供第一层可理解框架，把技术备战与民生灾难的因果迅速连接。
transfer_rule: 和平社会类比战时，应列出资源配置、制度控制、公共情绪和日常生活的对应，而非只凭紧张气氛。
failure_boundary: 当时并无地球战场和直接炮火，具体政策与传统战争时期不同；比较不能抹去大低谷自身机制。
