tenor: 大低谷前经济转型加速、生活水平下降、政治空气紧张，民众日常被全面动员和匮乏笼罩
vehicle: 战争年代资源被军需抽走、社会管控收紧、生活恶化并普遍承受危机压力
ground: 1）太空军工转型对应战时动员；2）生活下降对应战时匮乏；3）政治紧张对应战时管制；4）社会焦虑对应敌情压力；5）长期危机对应战争状态；6）民生让位对应军需优先。
