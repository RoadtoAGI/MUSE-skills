tenor: 章北海长期承担秘密计划、父亲意志、杀人选择和两个世纪使命后，心理疲惫终于显露
vehicle: 人背负沉重实物多年，重量持续压在肩背上，使身体逐渐弯曲、步伐迟缓
ground: 1）历史责任对应重物；2）两世纪经历对应长期负重；3）心理疲惫对应弯腰；4）旧日强者对应负重行者；5）关怀对应看见伤势。
