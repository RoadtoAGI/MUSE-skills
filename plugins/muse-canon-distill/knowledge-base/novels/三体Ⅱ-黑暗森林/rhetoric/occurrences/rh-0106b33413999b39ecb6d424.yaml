chapter: 正文
figure_type: metaphor
quote: 一个被往昔的沉重岁月压弯了腰的人
sensory_mapping: 两百年岁月堆上肩头、秘密与死亡增加重量、笔直军人终于被压弯、只剩疲惫空白
context_fact: 他已完成带舰逃离并卸下最高权力，东方看到其目光中只剩疲惫与悲哀。
image_mechanism: 无形时间获得向下重量，累积经历不是从身后流逝，而是一直压在身体上并改变姿态。
property_alignment: 1）过去事件对应负载；2）责任持续对应长途背负；3）意志消耗对应肌力衰竭；4）人格变化对应腰背弯曲。
context_alignment: 章北海一向军姿笔直，‘压弯’精准表现强者姿态首次崩塌，也符合东方近距离观察。
narrative_function: 把不可见的道德代价显形，阻止人物只作为无情预见机器被理解。
transfer_rule: 岁月作重量时，应列出具体累积事件、承重部位、姿态改变和卸责时点，让压力有来源。
failure_boundary: 章北海未必真的弯腰，时间也没有重力；喻体不能断言其行动能力已永久丧失。
quality_assessment: exemplary
