review_status: reviewed
tenor: 东方与两位副舰长夹在牺牲本舰和先杀他舰之间，无论保持或选择哪边都承受强烈道德痛苦
vehicle: 人站在极薄锋利刀刃上，脚下已被割伤；向任一侧跳都会坠入看不到底的深渊
ground: 1）决策临界对应刀刃；2）当下犹豫对应站刃受割；3）两种选择对应两侧；4）自杀或杀人对应深渊；5）道德痛苦对应伤口。
