quote: 三个人此时都站在一道锋利的刀刃上正在被痛苦地切割着
sensory_mapping: 三人脚底踩住细刃、犹豫本身持续切肉、左右都是黑色无底深渊、没有安全落点
context_fact: 他们考虑自愿牺牲，但无权替两千人决定；先发攻击又意味着杀死四舰同胞。
image_mechanism: 两难不是静态岔路，角色留在中间也会被刀切，选择与不选择都产生身体伤害。
property_alignment: 1）伦理边界对应锋刃；2）拖延对应持续承压；3）两方案对应刃两边；4）死亡后果对应坠落；5）无解对应无平地。
context_alignment: 太空通常提供无限方向，此处选择空间却缩成一条刀刃，物理辽阔与伦理狭窄形成强反差。
narrative_function: 把抽象两难变成即时酷刑，说明三人为何既不能开口也不能停止推演。
transfer_rule: 两难作刀刃时，应写明中间停留的代价、两侧后果和失去的安全面，使拖延也成为选择。
failure_boundary: 现实方案不必严格二分，技术、抽签或分阶段合作可能提供第三路径；深渊感是当事人认知。
quality_assessment: exemplary
