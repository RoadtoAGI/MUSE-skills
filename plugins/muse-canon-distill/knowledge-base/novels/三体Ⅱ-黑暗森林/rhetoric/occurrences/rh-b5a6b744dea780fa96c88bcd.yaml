chapter: 正文
figure_type: simile
quote: 剩下的部分看上去像是镶嵌在地球上的一个发光体
sensory_mapping: 暗球镶座、亮片嵌入、边缘严合、内部发光
context_fact: 日落继续推进，章北海等待合影者因光线降低而调透明面罩。
image_mechanism: 天体间的前后遮挡被压成物体表面的镶嵌关系，遥远太阳像一块安在地球壳上的亮饰。
property_alignment: 1）残阳对应发光体；2）地球对应镶嵌基底；3）遮蔽边缘对应卡口；4）日光对应自亮。
context_alignment: 它承接上一行戒指而随遮挡比例更新形态，从完整光环缩成局部嵌件，观察过程具有连续性。
narrative_function: 以精细视觉计时推进伏击，让日落既是美景也是行动条件。
transfer_rule: 镶嵌类比要让两个轮廓紧密贴合且存在前后层次，可随遮挡进程改变首饰形态。
failure_boundary: 太阳没有固定在地球表面，镶嵌只是特定视角的瞬时投影；换位观察即消失。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 太阳被地球遮去三分之二后，残余亮面紧贴地球轮廓的视觉效果
vehicle: 嵌入深色球面、边界固定并从内部发亮的一块宝石或灯体
ground: 1）太阳残面对应发光嵌件；2）地球边缘对应镶座；3）相切位置对应嵌入；4）强光对应宝石自发光；5）遮挡对应只露出表面。
