chapter: 正文
figure_type: metaphor
quote: 太空舰队就要在一个错误的基础上进行建设
sensory_mapping: 地基错位、巨构上升、裂缝累积、拆楼重建
context_fact: 聚变突破后飞船研制即将启动，资源不足以同等推进两个方向，少数关键人物将决定主方案。
image_mechanism: 一项早期技术选择被沉到整座舰队最底层，后续每项成功反而增加建筑重量，使最初错误更昂贵、更难抽换。
property_alignment: 1）舰队系统对应大厦；2）核心推进对应基础；3）研发投资对应楼层；4）路线错误对应基础缺陷；5）转向对应拆建。
context_alignment: ‘一步走错’强调时间路径，本句补上依赖结构，解释为何错误会随建设扩大而不是下一步即可纠正。
narrative_function: 把少数决策者的意见放大为文明工程承重问题，强化章北海的紧迫感。
transfer_rule: 技术基础喻应列出真正依赖它的上层模块，并说明替换为何需要返工；松耦合组件不宜称地基。
failure_boundary: 推进系统只是舰队多个模块之一，部分设施可跨路线复用；错误基础也可能通过改造加固而非整体推倒。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 若以工质推进为主，之后舰船、基地和战略体系都会依赖章北海认为错误的核心技术前提
vehicle: 大型建筑立在位置或结构错误的地基上，上层越建越高越难纠正并可能整体失稳
ground: 1）太空舰队体系对应建筑；2）推进技术对应地基；3）后续工程对应上层施工；4）错误方案对应地基偏斜；5）世纪浪费对应拆除重建。
