quote: 庄颜的眼睛在说：你好像真是那么想的呀
sensory_mapping: 双眼开口、无声质问、目光穿透、句意浮现
context_fact: 罗辑刚宣扬放弃末日之战、享受五个田园世纪，随后试图称自己仍在面壁状态。
image_mechanism: 庄颜没有发声，眼神却凝成完整句子，越过面壁者语言防线，直接指向他刚泄露的真实信念。
property_alignment: 1）眼睛对应说话者；2）怀疑目光对应疑问句；3）罗辑的失言对应被指出内容；4）读懂表情对应听懂语言。
context_alignment: 二人曾在蒙娜丽莎前试验表情语言，五年相处后无声交流部分实现，使此处不是孤立拟人。
narrative_function: 证明庄颜能识破罗辑私人谎言，并推动她接受PDC安排离开。
transfer_rule: 眼神发言的延展框架要由共同交流史支撑，台词应指向对方刚暴露的具体矛盾。
failure_boundary: 句子仍是罗辑解读，可能带有愧疚投射；不能据此精确还原庄颜全部意图。
