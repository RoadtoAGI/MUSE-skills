quote: 一堆骨肉和内脏仿佛被封在晶莹的红宝石中
sensory_mapping: 舱底血泊亮成巨大红晶、碎骨内脏沉在透明深处、表面无波、惨死像被制成标本
context_fact: 球形舱人员被超重压碎，血液沉淀澄清且液面平整，残骸完全失去人体形状。
image_mechanism: 污秽惨烈的生物残骸被宝石化，透明、红色、封固三项视觉属性让美感成为恐怖容器。
property_alignment: 1）血液对应宝石材质；2）红色对应宝石色泽；3）澄清对应晶莹；4）残骸对应包裹体；5）重力静止对应封存。
context_alignment: 与水滴‘完美艺术品’并列，宝石之美再次由非人道物理过程产生，贴合本章美与毁灭互换。
narrative_function: 以凝固标本般的终局封住舰内惨象，让宏观战役留下无法抽象化的人体证据。
transfer_rule: 惨烈物作宝石封存时，应让透明度、颜色、包裹关系和静止机制都可见，并保留美丑冲突。
failure_boundary: 血泊没有结晶硬化，也不具宝石价值；残骸不会因此永久保存，审美称谓不应消解死亡。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 被压碎的人体残骸沉在澄清、稳定且颜色鲜红的血泊内部，轮廓被透明液体包围
vehicle: 杂质或标本被封入透明红宝石晶体，外层晶莹坚硬，内部物永久固定并供人观看
ground: 1）清澈血泊对应红宝石；2）血色对应宝石红；3）骨肉对应内含物；4）超重固定对应封存；5）平滑表面对应晶面。
