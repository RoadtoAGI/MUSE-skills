property_alignment: 1）榜样国家对应山巅城市；2）价值理想对应城中秩序；3）世界关注对应远望；4）效仿对应登山趋近。
context_alignment: 人物简介采用宏大政治修辞，这一典故式高度与雷迪亚兹的英雄形象相符，也预留理想可能坠落的风险。
narrative_function: 迅速建立雷迪亚兹的象征资本，解释其为何能代表第三世界进入面壁者名单。
transfer_rule: 以高城写榜样，应同时安排可见性、价值内容与追随方向，并让高度承受后续现实检验。
failure_boundary: 高处不等于制度优越，叙述中的成功带有政治评价；若无可核成果或追随者，山巅只剩颂词。
