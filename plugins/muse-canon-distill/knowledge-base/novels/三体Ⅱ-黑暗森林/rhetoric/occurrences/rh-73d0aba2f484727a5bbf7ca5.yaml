quote: 厅中的一切像是正在融化中的冰
sensory_mapping: 红热余烬、冰体软塌、边缘流动、房间失形
context_fact: 庄颜和孩子已不在，客厅只剩壁炉余烬模糊红光，外面重现初见时雨声。
image_mechanism: 余烬的微红在震惊视野里成为融冰热源，家具墙面沿边缘下淌，五年家庭空间失去固态可靠性。
property_alignment: 1）客厅事物对应冰；2）余烬对应热；3）模糊轮廓对应融化；4）家庭消失对应固态解体。
context_alignment: 它有意回响L1704爱情高潮中卢浮宫如冰消融；彼时幸福毁去世界，此刻失去幸福毁去家，语义发生反转。
narrative_function: 以复现并翻转旧意象标记爱情幻境破裂，让失去具有结构性回声。
transfer_rule: 复用既有意象应改变触发原因与叙事方向，并让读者能辨认首尾反转，而非机械重复。
failure_boundary: 室内物体没有真实融化，视觉来自余烬和眩晕；明亮稳定照明下若仍写同样融冰会缺少物理依据。
