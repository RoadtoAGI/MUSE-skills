tenor: 常伟思沉思时铅笔轻顿桌面的节律与思路推进
vehicle: 一个人在道路上以轻而规律的步伐向前行走
ground: 1）铅笔连续点桌对应脚步连续落地；2）哒哒节拍对应足音；3）思考逐步展开对应向前行走；4）停顿后回神对应旅程结束并返回现场。
