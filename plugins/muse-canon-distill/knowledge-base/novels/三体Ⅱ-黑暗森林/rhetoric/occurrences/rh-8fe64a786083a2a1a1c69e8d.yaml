quote: 就像现在‘自然选择’号的逃亡是唯一选择一样
sensory_mapping: 两次选择铺成平行岔路、其他道路都被封死、章北海先后踏上唯一尚通的窄道
context_fact: 东方试图安慰章北海，援引历史评价，认为其旧日行为和当前逃亡都有现实逼迫。
image_mechanism: 跨两个世纪的道德选择被叠成同一决策结构，‘唯一’把不同后果放在封路图上比较。
property_alignment: 1）基础物理封锁对应太阳系封锁；2）研究方向对应航向；3）推进技术未来对应文明未来；4）无替代方案对应唯一出口。
context_alignment: 由东方而非章北海提出，类比既体现她的关怀，也可能是她替英雄减轻罪责的主观解释。
narrative_function: 连接章北海两次极端选择，揭开他疲惫背后的旧道德负担并推动私人对话。
transfer_rule: 跨时选择类比应对应约束、目标、替代项和代价，并保留两案伦理差异供读者判断。
failure_boundary: 二十一世纪仍可能有其他科研路线，杀人也不同于集体逃亡；‘唯一’是东方的评价而非客观证明。
