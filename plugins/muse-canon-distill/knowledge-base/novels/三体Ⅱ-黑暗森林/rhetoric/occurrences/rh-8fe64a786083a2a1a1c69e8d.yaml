tenor: 东方延绪认为章北海在二十一世纪选择辐射驱动研究并为此杀人，是当时封锁条件下推动宇航的唯一可行路径
vehicle: 当前自然选择号面对水滴和地球末日，只能向外逃亡，任何返航或停留都会断送文明载体
ground: 1）旧科研封锁对应当前水滴封锁；2）辐射驱动路线对应星舰逃亡航向；3）杀人代价对应离乡代价；4）唯一技术路径对应唯一生存路径。
