chapter: 正文
figure_type: metaphor
quote: 地球就要变成一个氢弹生产车间
sensory_mapping: 整颗星球罩进厂房、海洋送上原料、生产线密布、核弹不断下线
context_fact: 听证会代表嘲讽雷迪亚兹至少需要一百万颗氢弹的部署方案，认为其资源要求荒谬。
image_mechanism: 行星尺度的社会被压平为一间车间，复杂生活与经济消失，只剩核材料从海洋进入流水线、炸弹从末端推出。
property_alignment: 1）全球社会对应厂房；2）资源动员对应供料；3）军工体系对应流水线；4）氢弹对应产品；5）雷迪亚兹对应车间计划者；6）民生损耗对应生产排他性。
context_alignment: 发言者用工业降格嘲讽面壁者的宇宙规模幻想，既承接‘百万颗’数量，也突出他把地球当工具的政治指控。
narrative_function: 把抽象资源争议转成窒息的单一生产景象，迅速说明代表们为何拒绝方案。
transfer_rule: 社会作车间时，应对齐原料、生产线、产品、调度者和被排挤用途，让批量化代价可见。
failure_boundary: 地球不会真的只有核弹工业，资源也可分配给多目标；讽刺图景不能替代精确产能计算。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 雷迪亚兹要求全球工业与海洋核材料几乎全部转向制造百万颗恒星型氢弹
vehicle: 一座单一用途的工厂车间，把原料、设备和劳力都组织成连续生产同一种产品的流水系统
ground: 1）地球对应车间；2）海洋同位素对应原料库；3）全球工业对应生产线；4）各国社会对应工位与劳力；5）百万氢弹对应批量产品；6）其他需求被挤出对应单一用途。
