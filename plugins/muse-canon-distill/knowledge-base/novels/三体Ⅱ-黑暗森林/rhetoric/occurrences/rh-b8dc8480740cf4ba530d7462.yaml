quote: 不是等于把弓箭射上月球吗
sensory_mapping: 一支短箭离弦、越过整片地月虚空、仍保持力量击中月面、常识射程被撕开
context_fact: 西子听懂丁仪推测后，以反问确认三体技术把短程核力用于远大于原子核的尺度。
image_mechanism: 抽象的数量级跨越被压成武器射程奇迹，弓箭与月球的时代、尺寸错位直观制造震惊。
property_alignment: 1）核力载体对应箭；2）作用范围对应箭程；3）核外尺度对应月球距离；4）跨尺度技术对应超远命中。
context_alignment: 军官用最古老武器理解最先进材料，语言简短、口语化，贴合骤然悟到技术悬殊的瞬间。
narrative_function: 替读者复述关键难点，并在丁仪确认后把和平礼物判断彻底翻转。
transfer_rule: 作用范围突破作射程奇迹时，应选择熟知短程工具和极远目标，让数量级差无需数字也能成立。
failure_boundary: 强互作用并非抛射物，延程机制未知；弓箭弹道不能说明量子尺度的相互作用。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 把只在原子核极短距离内起作用的强互作用力延伸到原子或分子间距并用于宏观材料
vehicle: 射程很短的古代弓箭越过地月距离命中月球，工具的天然作用范围被跨越多个数量级
ground: 1）强互作用力对应弓箭；2）核内有效距离对应常规射程；3）原子间距对应地月距离；4）材料固结构成对应命中月球。
