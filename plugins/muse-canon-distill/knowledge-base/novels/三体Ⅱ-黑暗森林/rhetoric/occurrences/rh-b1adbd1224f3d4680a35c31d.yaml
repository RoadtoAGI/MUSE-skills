quote: 那些大人物筑起的堤坝和挖出的河道真的决定了历史的走向
sensory_mapping: 长河、堤坝、支流改道、游泳者、下游流向
context_fact: 罗辑入场时听见邻座讨论个人对历史的作用，双方提出伟人改河道与运动员顺流两种相反模型。
image_mechanism: 同一历史河流被摆上两幅图：一幅伟人站岸上改造水系，一幅伟人在水中游得最快；争议因此落到能否改变流向。
property_alignment: 1）时代对应河水；2）伟人对应工程师或运动员；3）政治制度对应堤渠；4）名誉纪录对应游速；5）历史方向对应流向。
context_alignment: 会场即将公布依赖个人秘密拯救历史的面壁计划，这段偶闻用两种河流模型提前质疑其核心假设。
narrative_function: 把“个人能否救文明”的哲学问题置于任命前一刻，给面壁者制度加入结构反讽。
transfer_rule: 对立类比可共享同一底层场景，只改变主体位置和作用方式，让争论集中于一个可判别变量。
failure_boundary: 历史没有单一河道，伟人与群体也可能互为条件；两幅图都不能单独证明因果。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 伟人是否能改变历史总体方向，或只在既定趋势中取得个人成就
vehicle: 河流被工程堤坝与人工河道改向，或游泳者只顺流刷新纪录
ground: 1）历史进程对应长河；2）总体趋势对应水流方向；3）制度行动对应筑坝挖渠；4）改变时代对应河流改道；5）个人成就对应游泳纪录；6）不改变趋势对应运动员随流而行。
