quote: 另一半变成亮晶晶的钢水儿炸开了，像焰火似的
sensory_mapping: 钢液白亮、中心炸开、火点四射、亮迹迅灭
context_fact: 激光炮先使巨大靶船半体汽化，剩余部分成为高温钢水并爆炸，画面来自舰队演习新闻。
image_mechanism: 致命熔毁被观看距离压成节庆光效，钢水碎滴在黑暗太空中像烟花火星放射，壮丽与毁灭重叠。
property_alignment: 1）熔融钢滴对应焰火星点；2）靶船爆裂对应烟花开爆；3）太空背景对应夜空；4）高温发光对应火药亮光；5）放射飞溅对应焰火轨迹。
context_alignment: 前句冰块强调材料脆弱，本句焰火强调破坏的视觉美感，两喻分工清楚，也暴露旁观者对战争的兴奋。
narrative_function: 把武器演习塑造成壮观表演，解释公众为何把军事优势体验成不可战胜。
transfer_rule: 爆炸作焰火时，应对齐暗背景、中心爆开、亮点放射和短时消散，并警惕美感遮蔽伤害。
failure_boundary: 钢水碎片具有巨大动能和危险，焰火通常受控且尺度小；相似画面不意味着同等安全或目的。
quality_assessment: effective
