tenor: 靶船剩余半体熔成发光钢液，在激光与内压作用下向周围爆散
vehicle: 焰火在空中突然爆开，把许多明亮火点和轨迹向四周抛射
ground: 1）发光钢滴对应焰火火星；2）爆散对应烟花绽放；3）亮晶晶对应高亮光点；4）向外飞溅对应放射轨迹；5）短暂呈现对应瞬时爆花。
