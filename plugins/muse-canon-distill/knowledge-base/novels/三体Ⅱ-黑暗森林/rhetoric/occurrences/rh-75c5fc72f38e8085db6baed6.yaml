chapter: 正文
figure_type: simile
quote: 张援朝像被刺了一下似的盯着史晓明
sensory_mapping: 触觉、疼痛、瞬时动作
context_fact: 史晓明正推销逃亡基金，故意质疑老张是否重视后代，以刺激他购买。
image_mechanism: 把销售话术的心理钩子变成刺入身体的一瞬，视线和反驳像疼痛反射一样立即发生。
property_alignment: 1）冒犯的突然性对应针刺；2）自尊受损对应疼痛；3）盯视反应对应身体遇刺后的警觉。
context_alignment: 老张把传宗接代视为要紧事，推销者正精准按压这一敏感点，刺痛感有明确触发源。
narrative_function: 让读者看清骗局如何用家族焦虑操纵购买者，并加快谈话从犹豫转向防御。
transfer_rule: 写言语击中痛点时，应先建立人物珍视的具体价值，再用短促身体反射呈现打击速度和强度。
failure_boundary: 普通分歧或缓慢生气不具备猝然刺痛；该喻体只说明主观反应，不证明对方真的实施伤害。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 史晓明暗示张援朝不在意家族延续时，老张突然受到的冒犯与警觉
vehicle: 身体被尖物猝然刺中后的疼痛和回缩反应
ground: 1）话语突然命中老张最在意之处，对应尖刺骤然入体；2）他立刻盯住对方并反驳，对应受刺后的瞬时收紧；3）精神冒犯带来近似痛感，对应刺痛。
