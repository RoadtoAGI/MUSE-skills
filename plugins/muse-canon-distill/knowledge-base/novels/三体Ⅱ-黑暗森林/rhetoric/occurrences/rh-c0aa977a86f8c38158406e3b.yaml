chapter: 正文
figure_type: simile
quote: 那里的灯光像烛光
sensory_mapping: 弱金光、局部照亮、暗部吞没、烛焰色温
context_fact: 病床尽头帷帐、床单、胡须和脸庞皆白，一部分被暗处隐藏，一部分镀上弱金辉。
image_mechanism: 现代灯具的稳定白光被压低成一簇烛焰，照明边界收紧，白色物体一半沉暗、一半染金。
property_alignment: 1）山洞灯光对应烛光；2）弱亮对应小火焰；3）金辉对应暖色；4）明暗不均对应有限照射。
context_alignment: 封闭山洞、白须老人和宗教会面需要古老私密气氛，烛光为随后圣人油画图景提供照明逻辑。
narrative_function: 抹去野战医疗设备的现代感，把老人床边转成宗教图像空间。
transfer_rule: 烛光类比要用亮度、色温和照射边界三项塑造，并让它改变场景时代或仪式感。
failure_boundary: 若灯光强白均匀，烛光喻失配；这里只是观感，现场未必有真实火焰和摇曳。
quality_assessment: functional
confidence: 0.98
review_status: reviewed
tenor: 山洞病床区域微弱、暖黄且只能局部照亮白色物体的灯光
vehicle: 烛火发出的低亮度、摇曳暖金色光线
ground: 1）亮度微弱对应小烛火；2）色温偏金对应烛光暖黄；3）局部明暗对应烛照范围小；4）白色边缘隐现对应火光不均。
