chapter: 正文
figure_type: simile
quote: 像一根软软的绞索在泰勒的脖子上慢慢套紧
sensory_mapping: 软绳触颈、绳圈缩小、呼吸受限、缓慢勒紧
context_fact: 破壁人威胁公开全部证据，泰勒只得允许继续；他每次鞠躬并谦称先生。
image_mechanism: 礼貌话语被搓成柔软绳股，越体贴越贴近皮肤；每个问题把绳圈缩小一格，使对方无法以粗暴为由逃离。
property_alignment: 1）谦卑恭敬对应软绳；2）连续提问对应收紧；3）泰勒对应受刑者；4）战略证据对应绳圈约束。
context_alignment: 绞索是前后行刑框架的中段动作，“软软”精确表达体贴语气和致命后果的矛盾统一。
narrative_function: 将谈话压力物理化为呼吸危机，延长真相揭露前的折磨。
transfer_rule: 柔性威胁写成软索，应让语气越温和、选择空间越窄，并用连续步骤表现收紧。
failure_boundary: 破壁人没有物理限制泰勒，泰勒仍可中止谈话但无法阻止公开；一次直白攻击不具慢套软索机制。
quality_assessment: exemplary
