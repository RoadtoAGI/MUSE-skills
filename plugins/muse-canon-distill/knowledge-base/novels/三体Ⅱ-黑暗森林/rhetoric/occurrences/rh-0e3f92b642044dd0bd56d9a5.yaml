chapter: 正文
figure_type: simile
quote: 金字塔静静地立在如水的月光下
sensory_mapping: 银水铺地、建筑浸光、静流、清凉光泽
context_fact: U形宫殿屏蔽夜巴黎喧嚣，玻璃金字塔在庭院月光中静立。
image_mechanism: 无形月光获得水的厚度，从庭院四周漫来，把玻璃结构浸在一层安静银液中。
property_alignment: 1）月光对应水；2）光面对应水面；3）银亮对应反光；4）静谧对应平流。
context_alignment: 场景先被隔绝噪声，玻璃与月色共同制造湿润反光，水意又呼应庭院喷泉即将启动。
narrative_function: 把入口转为远离城市的静水空间，为卢浮宫苏醒制造前静。
transfer_rule: 月光如水应给出铺展、浸没或流动至少一个空间动作，并让现场材质产生反光。
failure_boundary: 月光没有重量和湿度；强烈碎裂光影或喧闹场景会削弱平水观感。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 夜间覆盖玻璃金字塔、柔和连续并隔绝喧嚣的月光氛围
vehicle: 平静流淌、铺满表面且消音的清水
ground: 1）月光连续铺展对应水面覆盖；2）银白光泽对应清水反光；3）静谧对应水流无声；4）建筑浸没感对应置于水下。
