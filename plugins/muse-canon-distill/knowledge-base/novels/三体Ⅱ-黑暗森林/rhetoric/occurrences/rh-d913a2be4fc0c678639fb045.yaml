chapter: 正文
figure_type: simile
quote: 仿佛给这颗巨行星的表面拉上一块幕布
sensory_mapping: 巨行星作舞台、黑影展开成布、幕边横扫云层、亮面暂时闭合
context_fact: 自然选择号聚变发动机形成小太阳般强光，舰体经过木卫一附近并把卫星尺度阴影投到木星。
image_mechanism: 难以把握的行星阴影被转成横跨舞台的织物，舰体运动直接成为拉幕动作，尺度由覆盖面积显现。
property_alignment: 1）木星云面对应舞台背景；2）投影对应黑幕；3）自然选择号移动对应拉幕者动作；4）木卫一掠过对应幕布经过；5）遮光对应闭幕；6）影子可容地球对应巨幕尺寸。
context_alignment: 夺舰起航像一场宏大演出的开场，却以‘拉幕’呈现，明暗反转暗合章北海离开人类舞台。
narrative_function: 用一次行星尺度的遮光显示战舰加速威力，并把叛逃从舱内事件扩展到木星系统。
transfer_rule: 移动阴影作幕布时，应写出光源、投影面、幕边方向与覆盖时长，让拉幕动作有完整光学支撑。
failure_boundary: 阴影没有织物厚度和拉力，木星也不是平面舞台；幕布意象不能说明卫星与战舰的真实轨道。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 自然选择号掠过木卫一时投向木星的巨大阴影，短时遮暗行星表面一大片区域
vehicle: 舞台工作人员把一幅面积巨大的黑幕横向拉过布景，整片可见表面随之被遮住
ground: 1）木星表面对应舞台；2）战舰阴影对应幕布；3）掠过对应拉幕；4）大面积遮光对应覆盖舞台；5）影缘移动对应幕边推进；6）短暂黑暗对应闭幕。
