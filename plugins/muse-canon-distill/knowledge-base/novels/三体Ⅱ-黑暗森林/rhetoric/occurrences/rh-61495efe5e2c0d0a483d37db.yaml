tenor: 同一半小时内全球约一万名新生儿同时发出的哭声
vehicle: 大量声部共同演唱、汇成统一宏大作品的合唱曲
ground: 1）众多婴儿对应多个声部；2）同时啼哭对应同步演唱；3）声音叠加对应合唱汇聚；4）全球新生命规模对应作品宏伟；5）各自不同却共享命运对应多声部同题。
