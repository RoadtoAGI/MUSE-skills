quote: 如果他们的哭声汇在一起，那肯定是一曲宏伟的合唱
sensory_mapping: 万声叠加、音量扩张、声部交织、全球回响
context_fact: 张援朝孙子出生的同一时段，叙述把视野扩至全球约一万名婴儿。
image_mechanism: 分散在无数产房的哭声被拉到同一舞台，各自孤立的第一声叠成时代开场曲。
property_alignment: 1）婴儿对应歌者；2）哭声对应声部；3）同时出生对应统一起拍；4）共同未来对应同一乐章。
context_alignment: 啼哭既是生命开始又带痛感，合唱的庄严与随后艰难岁月相连，比庆典乐曲保留更多复杂性。
narrative_function: 从一个家庭切换到一代人，为危机纪元的出生群体建立集体声音。
transfer_rule: 把分散声音合成音乐时，应给出共同时间、声部数量和共享主题，让“合唱”超出单纯大声。
failure_boundary: 婴儿没有协调节奏与和声，宏伟来自叙事聚合；若强调真实音响效果，合唱会美化混乱哭声。
