quote: 除了三维动画般的洁净外
sensory_mapping: 墙桌无尘、材质无瑕、光照均匀、空间似渲染
context_fact: 罗辑此前已在苏醒中心感到同样洁净，餐厅又叠加了遍布所有物品的动态显示界面。
image_mechanism: 现实被再次抽去灰尘、划痕和杂乱，只留计算机模型般纯净的表皮；重复意象将其确认为时代的普遍质感。
property_alignment: 1）餐厅对应三维场景；2）墙桌椅对应数字模型；3）无污损对应理想纹理；4）发光界面对应渲染效果；5）罗辑行走对应虚拟漫游。
context_alignment: 叙述明确称其为时代特色，并用‘除了’把旧印象带入新空间；同喻复现服务环境一致性而非扩展新机制。
narrative_function: 快速调用已建立的未来洁净印象，把描写重点让给更加突出的全表面显示系统。
transfer_rule: 重复既有喻体时，应用于稳定同一世界质感，并以新环境中的差异特征推进描写。
failure_boundary: 餐厅是真实物质空间且需要清洁维护，三维动画没有触感和卫生问题；本句只评估表面观感。
