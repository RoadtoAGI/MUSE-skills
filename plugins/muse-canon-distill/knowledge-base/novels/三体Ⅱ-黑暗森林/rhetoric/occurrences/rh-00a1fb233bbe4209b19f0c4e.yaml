quote: 上面的空气像地牢
sensory_mapping: 腐臭、湿闷、狭窄封闭、呼吸黏滞
context_fact: 丁仪从空间站返航后身体不适，泰勒问他身上的气味，他解释循环过滤器末端甚至有厕所里的东西。
image_mechanism: 高科技空间站的洁净想象被翻转成地下囚室，呼吸系统像石墙一样把人关在自己的废气中。
property_alignment: 1）空间站对应地牢；2）舱内人员对应囚徒；3）闭环空气对应不通风；4）厕所污染对应秽气。
context_alignment: 丁仪说话尖刻、厌恶浪漫化太空；地牢意象以嗅觉拆穿“上天”的崇高，也有真实封闭依据。
narrative_function: 快速交代长期在轨生活的身体代价，并保持丁仪反英雄式科学家声音。
transfer_rule: 以牢狱写密闭环境，应让通风、气味、行动限制和滞留时间至少两项可由现场事实支撑。
failure_boundary: 空间站有生命保障和自愿科研目的，不具备地牢的惩罚权力关系；类比只落在空气与封闭感。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 国际空间站内循环多次、污浊腥臭且使人感到封闭的空气
vehicle: 阴湿密闭、通风不良并混有排泄物气味的地牢空气
ground: 1）舱体封闭对应地牢无窗；2）空气循环陈旧对应通风不良；3）过滤网有厕所污物对应牢房秽臭；4）长期困在其中对应囚禁压迫。
