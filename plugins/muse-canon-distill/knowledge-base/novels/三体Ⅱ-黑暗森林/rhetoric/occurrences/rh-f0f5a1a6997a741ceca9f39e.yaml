quote: 你怎么像个不懂事的毛孩子
sensory_mapping: 行为、社会判断、情绪节奏
context_fact: 雷德尔私下批评琼斯刚才在斐兹罗面前兴奋提议照相，认为这惹恼了将军。
image_mechanism: 把一连串职业失当压缩成成年人退回幼儿状态，听者可从孩子的冒失动作反推琼斯欠缺的分寸。
property_alignment: 1）误读结果对应不懂事；2）公开兴奋对应毛孩子的外露反应；3）不识上级脸色对应社会经验不足。
context_alignment: 同僚间训斥采用口语化、带轻蔑的年龄降格，符合雷德尔此刻既提醒又嘲弄的语气。
narrative_function: 刻画值勤人员把战争前兆当新奇事件的幼稚，也交代斐兹罗对政治形象的敏感。
transfer_rule: 用年龄角色评价成年人时，应让具体言行对应认知、克制与场合意识三项缺失，避免只作泛化辱骂。
failure_boundary: 若人物已准确判断风险、只是情绪外露，“毛孩子”会把热情误写成无知；该比喻也不涉及其整体能力。
