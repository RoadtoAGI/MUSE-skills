tenor: 老人音量极弱却持续稳定、不易中断的说话声线
vehicle: 极细却具韧性、受拉后仍不断裂的蚕丝与蛛丝
ground: 1）音量微弱对应丝线纤细；2）声线连续对应长丝不断；3）生命衰弱对应游丝将绝；4）意志坚韧对应蛛丝抗拉；5）话语持续对应难以扯断。
