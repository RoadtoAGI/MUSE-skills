figure_type: simile
quote: 他的声音细若游丝，但却像蛛丝一样柔韧，难以被拉断
sensory_mapping: 细丝悬空、蛛丝受拉、纤弱不断、声线牵延
context_fact: 白须老人病重卧床、不能起身，却以礼貌而带讽刺的声音持续与泰勒对话。
image_mechanism: 声音被拉成一根几乎看不见的丝线，从病床牵到泰勒耳边；身体越衰弱，线的韧性越显突兀。
property_alignment: 1）老人声音对应丝线；2）轻细对应纤维细度；3）连续发声对应丝不折；4）意志对应蛛丝韧性。
context_alignment: 身体濒死与组织精神不屈构成“细而不断”的双重事实，游丝和蛛丝共同校准弱度与韧度。
narrative_function: 在外表衰败中保留老人的控制力，使后续拒绝泰勒计划具有力量。
transfer_rule: 丝线声喻应分别匹配粗细、张力和连续性；若强调坚韧，需要对话内容或意志提供抗拉证据。
failure_boundary: 声波没有实体张力，老人也可能随时因病中断；洪亮、爆发或断续声音不适用该喻。
quality_assessment: exemplary
