property_alignment: 1）艾伦的话对应枪击；2）雷迪亚兹对应遇袭者；3）意外性对应背后；4）回头神情对应应激反应。
context_alignment: 此前罗辑刚真实遭枪击，这里将语言冲击借同一身体记忆表现；雷迪亚兹反应强度远超普通惊讶。
narrative_function: 第一次显露太阳与死亡意象对雷迪亚兹的病理触发，转入恐日症。
