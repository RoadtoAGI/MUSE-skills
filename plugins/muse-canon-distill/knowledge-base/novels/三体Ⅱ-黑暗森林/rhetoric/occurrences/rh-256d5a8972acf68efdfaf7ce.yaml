quote: 也熄灭了人类最后的幻想
sensory_mapping: 微火残亮、证据压下、火焰熄灭、四周转暗
context_fact: 哈勃二号从尘埃尾迹数出约一千艘飞船，入侵由推测变成可观测事实，随后社会进入绝望与艰难时世。
image_mechanism: 不可证伪的侥幸先被压缩成最后一点火光，望远镜数据像突然合拢的灭火罩，使心理上的微亮当场断绝。
property_alignment: 1）人类幻想对应火焰；2）最后一点怀疑对应余火；3）哈勃证据对应灭火罩；4）绝望降临对应黑暗。
context_alignment: 前段工程师刚说想在怀疑的安慰中过完一生，此处观测结论恰好完成灭火动作，个人心理变化被扩大为全人类转折。
narrative_function: 以一个瞬时视觉动作收束舰队发现，并把篇章从侥幸期切入真正的危机生活。
transfer_rule: 写证据终结侥幸时，可先让信念具有光、热和残量，再选择能一次关闭这些属性的外力。
failure_boundary: 幻想可能被新叙事重新点燃，社会也不会同时接受证据；若争议仍有实质依据，‘熄灭’会过早宣布共识。
quality_assessment: effective
