review_status: reviewed
tenor: 哈勃观测证实三体舰队后，人类关于入侵也许并不真实的最后一线侥幸消失
vehicle: 一簇仍在发光、可被外力彻底吹灭的微弱火焰
ground: 1）残余侥幸对应余火；2）幻想提供心理亮处对应火光；3）观测证据对应灭火力量；4）确认入侵对应光焰消失。
