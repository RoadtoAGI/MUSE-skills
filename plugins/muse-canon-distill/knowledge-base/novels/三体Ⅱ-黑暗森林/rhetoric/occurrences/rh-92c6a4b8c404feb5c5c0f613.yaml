chapter: 正文
figure_type: simile
quote: 雷迪亚兹的声音像石头般坚硬冰冷
sensory_mapping: 冷石触肤、硬面不动、话音短落、空气降温
context_fact: 破壁人以体贴口吻说他不必沮丧，雷迪亚兹只用三个字否认，双方近距离对峙。
image_mechanism: 听觉被转换成触觉，短句落下像一块冷硬物体，既挡住对方安慰，也把地下室的敌意实体化。
property_alignment: 1）雷迪亚兹的声音对应石块；2）不承认脆弱对应硬度；3）情感封闭对应低温；4）简短回答对应凝固形态；5）对话阻断对应石墙阻挡。
context_alignment: 人物长期住在封闭地下室且外表粗硬，石头质感与空间和性格一致，又没有超出当下声音范围。
narrative_function: 用一句触感描写压紧破壁前的对峙，显示雷迪亚兹在心理上先筑起硬壳。
transfer_rule: 声音作材质时，应把音色、句长和互动效果分别对应硬度、温度与阻力，避免只贴情绪标签。
failure_boundary: 声音没有物理重量或温度，雷迪亚兹随后会狂笑和失控；石质不能概括他的全部情感。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 雷迪亚兹否认沮丧时，声音中拒绝沟通、毫无温度且不肯退让的质感
vehicle: 表面低温、质地坚硬、受碰撞也不轻易变形的石头
ground: 1）语气强硬对应石质坚硬；2）缺少情感温度对应石面冰冷；3）回答短促对应石块凝固；4）拒绝退让对应不易形变；5）敌意对应硌人的触感。
