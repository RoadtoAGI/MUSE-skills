quote: 似乎在精神上和一种无形的巨大力量搏斗着
sensory_mapping: 无形对手压身、面部绷紧、意志角力、身体最终败退
context_fact: 希恩斯主动重复104号实验，含水后无法咽下，恐惧、呕吐并仔细擦去鞋上水滴。
image_mechanism: 认知冲突获得两方身体，理性不是简单改变意见，而要在精神擂台上对抗技术植入的强大对手。
property_alignment: 1）希恩斯理性对应战士；2）思想钢印对应强敌；3）吞咽动作对应进攻；4）恐惧反射对应对手力量；5）吐水呕吐对应失败；6）治疗对应长期再战。
context_alignment: 外部只是一杯清水，真正冲突全部发生在意识与身体之间，‘无形’精准标出敌手不可见却能控制肌肉。
narrative_function: 让思想钢印的效力从参数变成可见肉搏，证明它能越过知识直接支配身体。
transfer_rule: 心理冲突作搏斗时，应明确两方信念、外显角力动作、力量差和胜负结果，不能只写内心纠结。
failure_boundary: 意识不是两个独立人格，钢印也没有主动攻击意志；搏斗图景不说明具体神经机制。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 希恩斯理性知道水无毒，却被思想钢印植入的确定感强迫，试图吞水时出现剧烈内在抗争
vehicle: 一个人同看不见但力量悬殊的对手近身搏斗，被压制却仍奋力反抗
ground: 1）理性判断对应搏斗者；2）钢印信念对应无形强敌；3）努力吞水对应反击；4）肌肉僵硬抽搐对应角力；5）最终吐水对应被压倒；6）巨大力量对应信念牢固。
