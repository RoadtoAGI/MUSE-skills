review_status: reviewed
tenor: 空天飞机在稀薄大气接近航空极限时持续爬升、发动机负荷沉重的声动状态
vehicle: 负重者在陡峭高峰上一步步上攀、呼吸粗重且随时可能失足
ground: 1）飞行爬高对应登山上升；2）发动机隆隆对应粗重喘息；3）空气稀薄对应高山缺氧；4）接近极限对应峰顶难段；5）可能掉高度对应失足下滑。
