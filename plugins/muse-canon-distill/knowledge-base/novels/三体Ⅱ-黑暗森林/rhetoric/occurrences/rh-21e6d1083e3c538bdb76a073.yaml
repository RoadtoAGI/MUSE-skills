chapter: 正文
figure_type: simile
quote: 航空发动机发出吃力的隆隆声，像在艰难地攀登一座高峰
sensory_mapping: 陡坡攀登、粗喘隆声、稀薄空气、沉重上移
context_fact: 高边疆号接近三万米航空飞行极限，广播预警可能急剧掉高度，但飞机仍继续爬高。
image_mechanism: 机体获得登山者四肢，发动机声变成缺氧喘息；高度曲线被竖成一面陡坡，每米上升都需抓踏。
property_alignment: 1）空天飞机对应登山者；2）高度增加对应攀登；3）发动机负荷对应体力耗竭；4）航空极限对应峰顶。
context_alignment: “爬高”本有空间双义，稀薄空气与掉高风险又精确复刻登山环境，使拟人动作有物理同构。
narrative_function: 把航空段末端的技术极限变成可感体力挣扎，为发动机脱离和火箭点火蓄势。
transfer_rule: 机器攀山喻应同时匹配上升轨迹、声响负荷、环境稀薄和失速风险，不能只因“爬升”一词。
failure_boundary: 飞机没有疲劳意志，实际推力由发动机系统决定；平飞或轻松上升时不适用艰难登峰。
quality_assessment: exemplary
