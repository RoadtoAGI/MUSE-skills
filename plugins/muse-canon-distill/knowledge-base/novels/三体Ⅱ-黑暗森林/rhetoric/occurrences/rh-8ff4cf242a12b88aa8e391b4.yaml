tenor: 太阳在地球边缘沉下一半时，仅剩弧状强光环绕球面边缘的视觉形态
vehicle: 镶在地球轮廓上的一枚圆环首饰，边缘向外闪射耀眼光芒
ground: 1）地球边缘对应手指或镶座；2）太阳残弧对应戒圈；3）强烈日光对应珠宝闪耀；4）圆形相切对应套环结构。
