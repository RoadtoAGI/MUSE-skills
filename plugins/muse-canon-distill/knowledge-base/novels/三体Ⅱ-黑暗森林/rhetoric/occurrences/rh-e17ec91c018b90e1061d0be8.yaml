chapter: 正文
figure_type: simile
quote: 这寒冷仿佛是从他的体内发源的，像光芒般扩散出去，冻结了整个世界
sensory_mapping: 体内冷光、向外辐射、世界冻结、白色覆盖
context_fact: 基因病毒使罗辑休克，潜意识刚恢复少量感觉，医疗团队正准备把他送入冬眠。
image_mechanism: 冷觉在身体中心点亮成反光源，不提供温暖，只向外投射冻结力；意识能触及的景物逐层结成白色。
property_alignment: 1）寒冷对应光芒；2）身体对应光源；3）蔓延对应辐射；4）意识世界对应受照区域；5）冻结对应冷光效果。
context_alignment: 普通寒冷来自环境向内侵入，此处病危感从体内向外，逆向光照准确表现主体世界随意识熄灭而冻结。
narrative_function: 把生理濒死转成视觉宇宙，为妻儿雪野幻象和时间银丝铺设白色背景。
transfer_rule: 内感受如光扩散应明确源点、传播方向、覆盖范围和反常作用，使抽象感觉具有场动力学。
failure_boundary: 寒冷不会像光物理辐射并冻结外界，世界变化只在罗辑意识中；真实环境降温若由外向内则方向相反。
