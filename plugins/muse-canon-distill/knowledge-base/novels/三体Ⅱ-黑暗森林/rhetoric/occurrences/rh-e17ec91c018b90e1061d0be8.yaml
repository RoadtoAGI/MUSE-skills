tenor: 罗辑濒死和冬眠前由体内病变产生、向全部意识景象蔓延的寒冷感
vehicle: 以身体为光源向四周辐射、所到之处把世界凝冻结白的光芒
ground: 1）寒冷从体内出现对应光源内生；2）感觉向外蔓延对应光线辐射；3）覆盖全部意识对应照遍世界；4）景象雪白冻结对应光的作用结果；5）扩散连续对应光传播。
