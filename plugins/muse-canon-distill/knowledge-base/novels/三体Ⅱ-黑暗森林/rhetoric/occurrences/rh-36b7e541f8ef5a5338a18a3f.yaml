figure_type: simile
quote: 再次对他露出那雪后朝阳般的微笑
sensory_mapping: 视觉、光线、温度、时间
context_fact: 罗辑刚在想象中担心她走过风雪，清晨上课又见她独坐后排微笑。
image_mechanism: 把一张面孔变成风雪结束后的第一束暖光，前夜的寒冷被明确放到时间之前，微笑承担天气转折。
property_alignment: 1）笑容亮度对应日光；2）情绪温暖对应升温；3）雪后出现对应风暴结束；4）空座背景对应开阔寒天。
context_alignment: 雪景是真实环境，朝阳也承接同一昼夜顺序；罗辑被她点燃的火意象在这里转成更稳定的日光。
narrative_function: 让女孩的再次出现兑现罗辑的情感新生，并解释他为何紧张到讲课异常投入。
transfer_rule: 用朝阳写笑容时，应落实此前黑暗或风雪、出现时点、光亮中心和受照者的温度变化。
failure_boundary: 没有经历寒冷转折的普通笑容使用“朝阳”容易泛化；喻体不能把人物简化为只提供温暖的符号。
