quote: 这忧伤就像壁炉的火光，柔和地拂照在她的美丽之上
sensory_mapping: 壁炉暖光、柔照脸庞、轮廓染色、暗处轻颤
context_fact: 罗辑回想初见庄颜时便被其目光触动，现知那是她预知离别而有的忧伤。
image_mechanism: 忧伤不再是面部阴影，而化成一层温暖火光，从侧面轻抚她的轮廓，让美丽带上可被伤害的脆弱亮度。
property_alignment: 1）忧伤对应火光；2）庄颜美丽对应受照面容；3）淡而持续对应柔光；4）保护欲对应被光吸引。
context_alignment: 二人初见时真实壁炉把庄颜从暗中显影，心理底色与当时光源重合，完成五年后的回溯解释。
narrative_function: 把罗辑最初的爱情触发重新归因于庄颜承担的忧伤，深化相遇场景。
transfer_rule: 情绪如光应交代光质、照射对象和视觉后果，并尽量回扣人物共同经历中的真实光源。
failure_boundary: 忧伤并不天然增加美，罗辑的审美化可能浪漫化庄颜痛苦；刺眼强烈悲伤不适用柔和火光。
