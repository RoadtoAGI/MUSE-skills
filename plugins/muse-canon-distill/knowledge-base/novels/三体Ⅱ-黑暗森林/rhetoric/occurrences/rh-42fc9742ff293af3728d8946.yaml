chapter: 正文
figure_type: simile
quote: 您怎么像个圣诞刚过又要礼物的孩子
sensory_mapping: 圣诞礼盒、孩子伸手、刚拆又索、急切眼神
context_fact: 斐兹罗按舰队航程当天来控制中心，却忘了事件光线还需四年抵达地球。
image_mechanism: 天文发现被包装成圣诞礼盒，将军在时间轴尚未走完前就再次伸手，科学等待露出儿童式迫切。
property_alignment: 1）斐兹罗对应孩子；2）刷状发现对应礼物；3）再次观测对应再索；4）光程等待对应圣诞间隔。
context_alignment: 林格以玩笑纠正上级，孩子喻同时表现将军真诚好奇，避免只写知识错误。
narrative_function: 轻松引出光传播延迟和光锥概念，调节硬科学说明节奏。
transfer_rule: 急切求结果写成索礼孩子，应给出前次奖励、规定等待期和被忽略的时间规则。
failure_boundary: 斐兹罗关心的是战略数据而非个人享乐，类比不表示其不专业；真正紧急实时信息不宜嘲作索礼。
