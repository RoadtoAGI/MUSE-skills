tenor: 斐兹罗忘记四年光程、在第一次发现后立刻急切期待第二次舰队尾迹的心态
vehicle: 刚收完圣诞礼物便再次伸手索要、因期待而忽略时间规则的孩子
ground: 1）首个刷子对应刚得礼物；2）第二尾迹对应再要礼物；3）迫不及待对应儿童急切；4）忘记光延迟对应忽略等待规则；5）见舰队兴奋对应拆礼期待。
