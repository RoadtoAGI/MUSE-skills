tenor: 罗辑压制思念与身体感受，以单一目标、持续高强度和近乎无情绪方式进行理论演算
vehicle: 只接收问题、按程序运转并不断输出推理结果的机器
ground: 1）压制情绪对应排除非任务输入；2）持续思考对应机器不停机；3）逻辑推演对应程序运算；4）自我控制对应切换工作模式；5）单一目标对应专用设备。
