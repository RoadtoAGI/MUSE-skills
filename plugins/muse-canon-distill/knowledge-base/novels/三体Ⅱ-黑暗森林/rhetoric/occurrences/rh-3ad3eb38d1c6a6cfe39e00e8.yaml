quote: 继续把自己变成一台思维机器
sensory_mapping: 齿轮持续转、输入输出、杂讯滤除、机器冷运行
context_fact: 庄颜眼睛的记忆令心绪偏离，罗辑随即控制自己，继续推导宇宙社会学。
image_mechanism: 他把思念从输入端拔除，血肉意识收紧为只运行一项任务的装置，情绪被当作噪声过滤。
property_alignment: 1）罗辑对应机器；2）宇宙社会问题对应输入；3）演绎思考对应运算；4）理论发现对应输出。
context_alignment: 前文已有后台程序与欧氏推演，机器喻汇合计算语言，同时显出他为责任牺牲私人感受。
narrative_function: 标记罗辑从享乐者向承担任务者的自我改造，也提示这种专注带来人性压抑。
transfer_rule: 人物如思维机器要写清输入、处理、输出和被过滤部分，才能展示效率与代价两面。
failure_boundary: 罗辑仍受爱与直觉驱动，洞见也非纯机械计算；长期把人去情感化会歪曲创造过程。
