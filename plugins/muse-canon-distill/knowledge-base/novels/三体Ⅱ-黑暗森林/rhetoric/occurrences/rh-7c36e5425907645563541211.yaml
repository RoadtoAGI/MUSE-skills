quote: 金属云成了舰队的陷阱
sensory_mapping: 膨胀碎云像网套收紧、战舰用激光挖路、速度被残骸拖慢、银色猎手在网内追逐
context_fact: 多数残舰仍在金属云中，动能弹耗尽、激光变弱，只能降速航行，已无法逃脱水滴。
image_mechanism: 无意形成的环境后果获得捕获结构，舰队毁灭产物反过来封锁幸存者，因果闭环可见。
property_alignment: 1）碎片云对应网笼；2）低速舰对应困兽；3）防御消耗对应挣扎；4）水滴对应猎手；5）云团膨胀对应困域扩大。
context_alignment: 陷阱由舰队自身残骸构成，贴合密集编队错误的自我放大，而非外敌另设机关。
narrative_function: 解释为什么残舰数量虽多却不能分散，使后续巨龙清场成为必然。
transfer_rule: 环境作陷阱时，应说明边界材料、进入过程、逃逸成本和捕获反馈，尤其指出陷阱由谁形成。
failure_boundary: 金属云没有设计意图或机关触发，少数位于外围且速度较高的战舰仍可逃出。
