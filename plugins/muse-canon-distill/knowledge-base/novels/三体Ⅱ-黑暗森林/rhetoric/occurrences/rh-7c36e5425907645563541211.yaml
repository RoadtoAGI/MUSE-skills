tenor: 舰队自身爆炸生成的密集残骸云限制剩余战舰速度、耗尽防御弹药，使其无法疏散逃脱
vehicle: 预设捕获装置把进入者围困在障碍中，越挣扎越耗费力量，出口被封而捕食者可从容追上
ground: 1）金属云对应陷阱结构；2）残舰对应猎物；3）碎片密度对应障碍；4）能量弹耗尽对应挣扎耗力；5）无法疏散对应被困。
