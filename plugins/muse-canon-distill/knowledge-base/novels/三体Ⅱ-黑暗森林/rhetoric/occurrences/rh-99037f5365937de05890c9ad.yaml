review_status: reviewed
tenor: 苗福全上楼时沉重响亮、节拍分明的脚步
vehicle: 重锤连续砸在硬面上的撞击声
ground: 1）脚步音量大对应重锤冲击；2）落脚沉重对应锤体重量；3）一阶一响的节奏对应反复落锤。
