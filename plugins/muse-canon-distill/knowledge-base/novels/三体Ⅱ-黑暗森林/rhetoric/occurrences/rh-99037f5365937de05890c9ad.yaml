chapter: 正文
figure_type: simile
quote: 刚才老张听到楼梯上那重锤般的脚步声就知道是谁来了。
sensory_mapping: 听觉、重量、节奏
context_fact: 体格粗壮、行事风格豪爽的煤老板苗福全不敲门闯入，老张仅凭楼梯声便认出他。
image_mechanism: 用重锤的重量和撞击把尚未露面的人先变成一串压向楼梯的声响，人物体量与性格提前抵达房间。
property_alignment: 1）落脚声对应锤击声；2）身体重量对应锤重；3）连续上楼对应反复砸落。
context_alignment: 苗福全紧接着不敲门进入，重锤声与他的粗豪、侵入性动作一致，也解释老张为何能辨人。
narrative_function: 在人物登场前用声音完成速写，使三位老人场景的节奏突然变重、变热闹。
transfer_rule: 声音比喻应对齐音量、冲击质感和节奏，并让声源人物随后的动作证实这一听觉轮廓。
failure_boundary: 轻快、拖沓或杂乱脚步不具备落锤节拍；重锤只描述声音与重量，不能直接判定人物暴力。
quality_assessment: effective
