tenor: 庄颜发现罗辑的反驳反而证明表情复杂性时不加掩饰的欣喜动作
vehicle: 孩子突然得到肯定或发现游戏答案后原地雀跃
ground: 1）情绪直接外露对应孩子无遮掩；2）跳起对应儿童雀跃；3）因小发现兴奋对应游戏得解；4）不顾殿堂拘谨对应孩子忘形。
