quote: 庄颜高兴得像孩子那样跳了一下
sensory_mapping: 原地一跳、轻快雀跃、笑意外露、身体上扬
context_fact: 罗辑说蒙娜丽莎微笑含义每秒变化，庄颜认为这恰好支持表情可传复杂信息。
image_mechanism: 论证成功立刻转成身体向上的弹跳，成人在艺术殿堂的克制被孩子式喜悦冲开一瞬。
property_alignment: 1）庄颜对应孩子；2）论点获证对应游戏胜利；3）高兴对应雀跃；4）跳一下对应儿童动作。
context_alignment: 她此前把表情交流当游戏，孩子喻贴合轻松试验氛围，也符合一贯天真但有洞见的性格。
narrative_function: 为表情游戏注入活力，并让理论讨论自然转入二人互动。
transfer_rule: 孩子喻喜悦应由具体小胜利触发，并用不加掩饰的身体动作支撑，避免仅以年龄贬低。
failure_boundary: 庄颜仍提出有效论证，并非思维幼稚；正式悲痛场景中跳跃式孩子喻会失调。
