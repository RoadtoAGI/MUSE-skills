chapter: 正文
figure_type: simile
quote: 眼中都透出神灵般睿智的目光
sensory_mapping: 年轻军官悬在金辉中、双眼带神谕般光、身后银色符号浮现、舱室化成神殿
context_fact: 丁仪环视量子号指挥官，发现他们年轻完美、笼罩舰队金辉，并被水滴影像衬托得空灵超脱。
image_mechanism: 制服与金光共同把普通军官抬到神像高度，睿智不再是能力判断，而是眼神散发的神性光环。
property_alignment: 1）舰队军官对应奥林匹斯神；2）年轻体态对应永生；3）眼神自信对应神知；4）舰队金辉对应圣光；5）水滴背景对应神秘符号；6）丁仪激动对应凡人敬畏。
context_alignment: 全民已把舰队与上帝合一，丁仪也短暂接受这套神化视角；它精确捕捉灾难前的人类自我崇拜。
narrative_function: 让丁仪的警觉被对年轻军官的怜爱与崇敬压下，并在他们数小时后死亡前制造悲剧神像。
transfer_rule: 群体作神祗时，应配置权力、青春、智慧姿态、照明与观者位置，并让神化影响其风险判断。
failure_boundary: 军官会犯错、会死亡且不了解水滴，金光不证明全知；神性目光只是丁仪主观投射。
quality_assessment: exemplary
