review_status: reviewed
tenor: 量子号年轻军官在金色舰队光芒中显得高贵、自信、理性且仿佛掌握超越常人的知识
vehicle: 奥林匹斯诸神长生强大、洞见凡人命运，以从容智慧俯视人间
ground: 1）军官对应神祗；2）睿智目光对应神知；3）高贵姿态对应神性；4）金色照明对应圣光；5）年轻完美对应不老；6）指挥舰队对应支配力量。
