chapter: 正文
figure_type: metaphor
quote: 光锥之内就是命运
sensory_mapping: 锥形边界、事件藏内、光信使逼近、命运覆盖
context_fact: 林格解释三体舰队穿越第二块尘埃云的信息还需四年抵达，斐兹罗感叹人类无法预先知道锥内事件。
image_mechanism: 时空图上的几何锥面从物理可达域变成命运边界，正在传播的光不只携带消息，也把既成事实一点点推向观察者。
property_alignment: 1）光锥对应命运疆域；2）锥内事件对应既定遭遇；3）光线传播对应命运到来；4）观察者对应等待者；5）锥外对应未知。
context_alignment: 下一句由林格明确称其为好比喻，且智子超越光速通信随即被说成改变命运，概念延展闭合。
narrative_function: 把相对论信息延迟升格为文明处境：毁灭性事实或已发生，人类只能等待其光抵达。
transfer_rule: 科学边界作命运时，应保留其因果可达关系，说明什么信息何时跨界，避免只借术语营造玄秘。
failure_boundary: 锥内只表示因果上可关联，不等于结果不可改变；智子获得信息也不必然有能力改写所有事件。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 已经发生并以光速传播、终将进入观察者因果可知范围的宇宙事件信息
vehicle: 一个把个体生命未来包围其中、其内事件必然抵达的命运领域
ground: 1）光锥边界对应命运边界；2）锥内事件对应将与观察者发生因果联系的遭遇；3）光速传播对应命运逼近；4）锥外无知对应尚未进入命运。
