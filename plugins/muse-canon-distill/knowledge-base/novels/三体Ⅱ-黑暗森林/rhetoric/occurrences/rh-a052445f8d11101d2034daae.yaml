property_alignment: 1）梦想描述对应童话文本；2）现实地点对应搬出布景；3）过度纯净对应理想化；4）景物齐全对应整套场景。
context_alignment: 前文刚详述罗辑口述梦境，此刻现实精确复刻，童话搬运同时表达惊喜与面壁权力的超现实效率。
narrative_function: 兑现庄园愿望，把罗辑从使命压力转入自我放逐的蜜月阶段。
transfer_rule: “从故事中搬出”适合现实与先前想象逐项复现的节点，应回扣至少两项已建立的景物或感官细节。
failure_boundary: 真实庄园有历史、产权和维护成本，并非无因生成；只写景色漂亮却没有前置想象时，童话搬运会流于套语。
