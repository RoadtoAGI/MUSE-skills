figure_type: metaphor
quote: 技术飞跃的可能性是埋藏在每个文明内部的炸药
sensory_mapping: 每个婴儿文明体内藏着炸药、外来信号点燃细线、数百年在宇宙尺度上轰然一闪、弱者跃到前方
context_fact: 罗辑以人类三百年现代技术史说明，文明在星际漫长时间内可能突然完成巨大技术飞跃。
image_mechanism: 连续发展被改写成潜能蓄积—触发—瞬时释放，‘技术爆炸’词义在具体炸药机构中展开。
property_alignment: 1）知识积累对应化学能；2）文明载体对应药包；3）外部交流对应引信；4）短期跃迁对应爆燃；5）力量逆转对应冲击波。
context_alignment: 猜疑链要求评估未来威胁，炸药意象让当前弱小不再等于安全，并解释交流为何反而危险。
narrative_function: 补齐黑暗森林第二个关键机制，使消灭婴儿文明在冷酷推理中也被视为预防。
transfer_rule: 快速发展作炸药时，应写出储能、埋藏、引信、点燃条件和爆后结构变化，区分潜力与已爆。
failure_boundary: 技术发展需制度、资源和时间，不会像炸药必然瞬发；交流也可能带来合作而非只触发竞争。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 弱小文明内部潜藏短期技术跃迁能力，一旦受交流或其他刺激便可能迅速超过强文明
vehicle: 炸药平时埋藏静止，受导火线点燃后能量在瞬间释放，造成远超原体积的爆炸变化
ground: 1）技术潜力对应炸药；2）文明内部对应埋藏处；3）交流信息对应导火线；4）发展阈值对应点燃；5）快速超越对应爆炸；6）原强弱关系对应被冲毁结构。
