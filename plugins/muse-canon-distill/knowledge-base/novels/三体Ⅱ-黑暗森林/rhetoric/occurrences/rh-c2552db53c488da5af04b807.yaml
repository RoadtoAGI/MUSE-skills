chapter: 正文
figure_type: analogy
quote: 仿佛整个餐厅就是一个大的电脑显示屏
sensory_mapping: 六面发光、窗口遍布、文字滚动、杯盒也成界面
context_fact: 未来柔性显示材料已覆盖所有光滑表面，餐厅比苏醒中心更集中地呈现这种信息环境。
image_mechanism: 原本分散在物件上的屏幕边界被抹除，房间整体翻成一块向内包围人的显示面，实体只剩承载像素的底板。
property_alignment: 1）餐厅对应显示器；2）墙地顶对应屏幕区域；3）家具和小物对应子窗口；4）动态图像对应像素内容；5）操作界面对应触控功能；6）就餐者对应屏幕前用户。
context_alignment: 类比由实物分布逐级扩展到整体，既概括纷繁华丽，也准确解释罗辑为何觉得信息界面成为建筑材料。
narrative_function: 把大量列举收束成一个空间模型，为下一句‘显示屏当砖头’的材料化推论搭桥。
transfer_rule: 空间作显示器时，应核对覆盖范围、信息输出、交互能力和界面嵌套，并从局部证据归纳整体。
failure_boundary: 餐厅仍有承重、触感、食物和人员活动，屏幕只是表层功能；不能认为所有结构由电子面板构成。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 餐厅从墙面到家具、地板、天花板乃至水杯纸盒都能显示信息和接受操作
vehicle: 一块覆盖整个视域、每个位置都能发光呈现文字图像并响应点击的电脑显示屏
ground: 1）餐厅表面对应屏幕面板；2）动态窗口对应显示内容；3）桌椅物品界面对应可操作区域；4）滚动文字对应屏幕信息；5）全空间覆盖对应巨型屏幕；6）使用者触碰对应交互输入。
