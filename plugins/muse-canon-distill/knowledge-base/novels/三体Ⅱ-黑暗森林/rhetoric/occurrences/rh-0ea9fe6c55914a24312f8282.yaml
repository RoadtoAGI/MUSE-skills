quote: 一切都湮没在爱情的创世之光中
sensory_mapping: 原初强光、万物失形、宇宙新生、中心爆亮
context_fact: 罗辑从凝视庄颜进入下坠幻觉，依次看见卢浮宫、地球和星海崩解聚拢。
image_mechanism: 所有先前图像被推入同一过曝白光，爱情从情绪变成宇宙起源能量，既毁去旧世界又宣布私人世界诞生。
property_alignment: 1）爱情对应创世光；2）幻视万物对应被照世界；3）情感爆发对应创生能量；4）现实消失对应光中湮没。
context_alignment: 幻象尺度已逐级从心灵、建筑、地球升到群星，创世光是这条升级链的逻辑终点。
narrative_function: 完成罗辑坠入爱情的主观宇宙化高潮，同时显示私人幸福吞没公共危机的危险。
transfer_rule: 创世意象应沿尺度递增铺垫到唯一光源，并明确它既生成新秩序又抹除旧边界。
failure_boundary: 爱情不能物理创造宇宙，也不能正当化现实责任的消失；若无此前逐级崩解，创世之光会显得突兀夸张。
