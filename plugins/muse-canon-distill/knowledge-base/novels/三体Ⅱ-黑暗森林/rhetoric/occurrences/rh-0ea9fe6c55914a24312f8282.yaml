tenor: 罗辑对庄颜的爱情在幻视终点压倒地球、宇宙与自我边界的绝对体验
vehicle: 宇宙诞生时充满全空间、使万物由其出现又被其强光吞没的创世光芒
ground: 1）爱情成为唯一体验对应创世光充满一切；2）现实景物消失对应强光湮没轮廓；3）新私人世界形成对应宇宙创生；4）情绪强度极端对应原初能量；5）二人关系居中心对应创世源点。
