chapter: 正文
figure_type: simile
quote: 他的心就像周围空寂的太空一般寒冷而平静
sensory_mapping: 胸中真空、低温无声、波动消失、孤点远行
context_fact: 章北海确认五人中弹后返回基地，知道杀人未必能保证技术路线，却认为自己已做完能做之事。
image_mechanism: 周围物理环境直接向内翻折，胸腔被抽成真空，情绪热量和噪声一并逸散，只留下稳定航向。
property_alignment: 1）章北海内心对应太空；2）冷酷对应低温；3）镇定对应寂静；4）独自承担对应空旷；5）无悔对应无扰动。
context_alignment: 此前他喜爱斩断与地球联系的独立感，此刻太空不只是背景，而成为其完成极端行动后的心理材质。
narrative_function: 用环境—内心同构完成章北海冷酷形象，并把读者从受害者惨状拉回行动者自我判断。
transfer_rule: 内心比环境时，应让温度、声响、密度或运动状态分别对应情绪特征，并由人物刚经历的场景提供感官残留。
failure_boundary: 平静不等于正确或无情绪，章北海可能压抑而非真正真空；太空也包含辐射与高速运动，并非绝对静止。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 完成暗杀后的章北海情绪无波、缺少悔惧并以任务逻辑维持的冷静状态
vehicle: 没有空气声响与近物扰动、低温辽阔而静止的外太空
ground: 1）情绪低温对应太空寒冷；2）无慌乱对应空间平静；3）压低同情对应真空；4）孤独决断对应空旷；5）任务完成对应轨迹稳定。
