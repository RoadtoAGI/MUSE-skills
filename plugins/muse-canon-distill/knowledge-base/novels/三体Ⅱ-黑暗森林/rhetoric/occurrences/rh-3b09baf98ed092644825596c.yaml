chapter: 正文
figure_type: metaphor
quote: 心里却没有一点阳光
sensory_mapping: 光线、温度、内外空间
context_fact: 老张本来住房、子女和退休条件都令人满足，却因三体危机从八楼望着晴朗城市发愁。
image_mechanism: 把心理状态布置成与窗外并列的室内天气：城市有太阳，光线到达窗前却无法进入心中。
property_alignment: 1）阳光亮度对应希望；2）阳光温度对应满足感；3）无光内室对应危机压住一切日常幸福。
context_alignment: 原文先写晴朗天空再转入内心，光线是现场实物；内外反差使常见光明隐喻获得具体位置。
narrative_function: 在一句中否定“第二童年”的乐观框架，显示遥远末日已经改变普通人的当下情绪。
transfer_rule: 使用光暗心理隐喻时，可让外界真实光线与内心状态相撞，以可见反差说明何种事实阻断了光的进入。
failure_boundary: 若场景本就阴雨，内外反差会消失；“无阳光”只说明此刻心境，不能推断人物长期抑郁。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 张援朝在晴日中仍完全缺少退休后的乐观与满足
vehicle: 内部没有一丝阳光照入的阴暗空间
ground: 1）乐观愉悦对应光亮与温暖；2）危机恐惧对应内部阴暗；3）外面晴朗而心中无光对应客观安稳与主观绝望反差。
