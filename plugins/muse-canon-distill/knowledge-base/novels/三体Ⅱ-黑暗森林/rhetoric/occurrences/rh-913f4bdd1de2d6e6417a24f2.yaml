chapter: 正文
figure_type: simile
quote: 行人们穿着闪亮的衣服，像发光的蚂蚁般穿行其间
sensory_mapping: 草地铺展、亮点移动、巨柱压低人形、路径交错
context_fact: 未来城市把建筑与车流悬在高空，地面回归草地树林，只剩稀疏巨柱和穿着发光服装的人。
image_mechanism: 城市尺度拉大后，人类缩成自然地表上的小型群居生物，动态图像衣物让每个移动点像带冷光的虫体。
property_alignment: 1）行人对应蚂蚁；2）闪亮衣服对应发光外壳；3）广场草地对应蚁行地面；4）步行轨迹对应蚁路；5）树形巨构对应放大环境。
context_alignment: 上方车流已如鱼群，地面行人再成蚂蚁，二者共同把无街道城市组织成分层生态，并准确呈现尺度差。
narrative_function: 一眼交代地面空间的开阔与行人比例，使罗辑对把拥挤抬到空中的设计产生直观赞叹。
transfer_rule: 把人群写成昆虫时，应由观察尺度、移动路径和明暗标识支撑，并避免把社会价值一并缩小。
failure_boundary: 行人有独立目的和复杂行为，并非蚁群协同；‘发光’来自衣物显示，不是生物发光。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 地面广阔草地树林中，穿动态图像衣服的行人显得细小、明亮并沿不同路径不断移动
vehicle: 一群体形微小的蚂蚁在辽阔自然表面忙碌穿行，甲壳或标记发出亮光
ground: 1）行人对应蚂蚁；2）巨树广场对应放大的地表；3）衣服闪光对应虫体发亮；4）分散步行对应蚁群穿行；5）人相对建筑微小对应昆虫尺度。
