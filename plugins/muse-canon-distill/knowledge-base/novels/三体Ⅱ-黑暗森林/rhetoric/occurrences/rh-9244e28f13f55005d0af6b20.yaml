chapter: 正文
figure_type: simile
quote: 人类社会的交流信息，特别是人类的文学作品，都像是曲折的迷宫
sensory_mapping: 空间路径、方向、认知搜索
context_fact: 破壁人二号刚提醒三体字幕表达应委婉，三体人回应人类思想变形使文学难以理解。
image_mechanism: 把解读过程变成行路：字句是可进入的通道，委婉造成转弯，真假意图形成岔口，理解则是找到正确出口。
property_alignment: 1）间接表达对应曲折道路；2）歧义对应岔路；3）隐藏意图对应被墙遮住的终点。
context_alignment: 喻体由一贯直显思维的三体人说出，准确体现其把人类修辞体验为导航障碍，而非审美资源。
narrative_function: 把语言差异提升为战略差异，说明文学式间接性为何成为面壁者可利用的屏障。
transfer_rule: 用迷宫解释信息时，应明确入口、岔路、遮蔽与目标分别对应文本的哪些层次，并让观察者确实处于解读困境。
failure_boundary: 结构复杂却没有隐藏目标或多解路径的文本不宜称迷宫；该喻体也不能把所有间接表达都等同欺骗。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 经过隐瞒、委婉和思想变形的人类交流与文学文本
vehicle: 道路曲折、入口与意义终点不直接相连的迷宫
ground: 1）表面措辞不直达真实思想对应道路绕行；2）隐瞒与修饰产生多种解释对应岔路；3）三体读者难找作者意图对应探索者难抵出口。
