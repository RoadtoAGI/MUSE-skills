chapter: 正文
figure_type: simile
quote: 那些白色的颗粒蠕动着，像一锅煮着的大米粥
sensory_mapping: 广场缩成一口巨锅、十万白色身体化成米粒、颗粒在稠密人潮中翻涌蠕动
context_fact: 市长展示中心广场航拍画面，超级性派对人数过十万，纪念碑和沙地已被完全覆盖。
image_mechanism: 高空视角取消人物身份和尺度，把密集肉身转成烹煮颗粒；颜色、数量、运动和容器同时吻合。
property_alignment: 1）人身对应米；2）人群间隙对应粥液；3）广场边界对应锅沿；4）躁动对应沸腾；5）无法辨人对应米粒同质。
context_alignment: 市长与冬眠者从治理视角观看，粗俗食物图像既符合旧人口吻，也表现制度面对十万个体时的去人格化。
narrative_function: 用一幅俯拍总景迅速说明城市失控规模，并让罗辑、大史在具体画面前震撼沉默。
transfer_rule: 俯瞰密集人群作食物颗粒时，应匹配颜色、容器、密度、对流运动和观察高度，同时警惕去人化。
failure_boundary: 每个人有意志与关系，不是被动米粒；场面也无液体、温度或真实沸煮。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 从百米高处俯看中心广场，十万裸体人群密集拥挤、个体缩成白点并不断缓慢移动
vehicle: 锅中大量白米粒浸在黏稠粥液里，受沸腾对流挤压、翻动和蠕动，难分单粒
ground: 1）裸体个体对应米粒；2）白色皮肤对应白米；3）广场对应锅；4）拥挤群体对应稠粥；5）集体移动对应沸煮蠕动；6）俯视对应看锅面。
