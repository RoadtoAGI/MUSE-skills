chapter: 正文
figure_type: metaphor
quote: 军人的尊严成了工作和人生中唯一的支柱
sensory_mapping: 立柱、承重、孤柱受压、坍塌风险
context_fact: 章北海称部分军人因不信胜利，只想冬眠到末战以保留战斗到底的尊严。
image_mechanism: 人生意义建成一座上重下空的建筑，所有重量集中压在“尊严”一根细柱上，任何怀疑都可能触发倒塌。
property_alignment: 1）人生对应建筑；2）尊严对应柱；3）价值压力对应荷载；4）失败主义对应地基流失。
context_alignment: 军队强调支撑与阵地，承重结构适合政工报告；“唯一”又揭示看似积极的尊严实际极不稳定。
narrative_function: 解释冬眠愿望为何仍属失败主义，并为下一类连尊严也怀疑的人作递进。
transfer_rule: 支柱写心理依靠时，应说明它承载哪些生活部分、是否有其他支点以及柱断后的具体后果。
failure_boundary: 人的意义来源会变化和增生，单柱模型不意味着当事人必然崩溃；尊严也非纯粹工具。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 想冬眠参加末战的军人维持当前工作与生活意义的唯一心理依据
vehicle: 独自承受整座建筑重量、防止其倒塌的一根承重柱
ground: 1）工作人生整体对应建筑；2）意义感对应结构稳定；3）军人尊严对应承重柱；4）只剩单一依据对应仅一根支柱；5）尊严动摇对应整体倒塌。
