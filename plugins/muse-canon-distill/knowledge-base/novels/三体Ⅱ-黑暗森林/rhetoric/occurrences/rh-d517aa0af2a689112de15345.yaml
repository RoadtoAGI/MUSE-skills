chapter: 正文
figure_type: metaphor
quote: 是庄颜生活的一层保护罩
sensory_mapping: 透明罩壳、家庭居中、危机撞击、裂口暴露
context_fact: 庄颜担忧全人类不幸福时自己的生活是否正当，罗辑用计划责任为其解释，却在谈话中承认自己只想享乐。
image_mechanism: 一句战略解释凝成透明壳，既让庄颜看见外部世界又隔开其伦理压力；罗辑失言像从内部划开罩面。
property_alignment: 1）计划说法对应保护罩；2）庄颜对应罩内者；3）罪疚与末日对应外部压力；4）相信说法对应保持密封；5）真相对应裂缝。
context_alignment: 住地本身就是受保护的封闭空间，心理罩与现实警戒层重合，使特权生活的脆弱合理化机制具体可见。
narrative_function: 揭示罗辑如何用面壁者话语维系家庭幻境，并预示庄颜离开后保护层整体消失。
transfer_rule: 谎言或解释作保护罩时，应明确它挡住哪种压力、保护谁，以及哪句事实会使罩体破裂。
failure_boundary: 庄颜并非被动封装，她可能早知并参与安排；保护罩也不能阻止实际危机，只暂时调节认知。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑声称家庭幸福属于面壁计划，借此让庄颜把享受生活视为责任并维持心理平衡
vehicle: 包在生命或设备外层、阻隔危险冲击的透明防护罩
ground: 1）善意说法对应罩体；2）庄颜日常对应罩内空间；3）严酷危机对应外部冲击；4）心理平衡对应内部稳定；5）真话泄露对应罩体破口。
