quote: 与被压成一片的身体一起构成一幅丑陋的达利风格的画
sensory_mapping: 身体被压向白壁、血色铺成放射笔触、器官失去体积、舱壁挂出畸形画
context_fact: 两位副舰长知道若拒绝进入深海状态，全舰人员将在最高加速中遭遇这一死亡过程。
image_mechanism: 超重把三维身体机械压成平面，真实生理毁坏因形变方式与超现实绘画获得可见构图。
property_alignment: 1）舱壁对应画布；2）血与器官对应颜料形块；3）120G对应作画力量；4）身体畸变对应达利式变形；5）死亡现场对应成画结果。
context_alignment: 未来技术说明需要让抽象120G立刻可怕，熟悉艺术风格把解剖后果压进一幅无法忽视的图。
narrative_function: 迫使东方服从章北海，同时让‘深海状态’安全门槛具有身体代价。
transfer_rule: 毁伤作画面时，应让受力方向、承载平面、色彩材料和具体艺术风格共同吻合。
failure_boundary: 死亡不是艺术创作，达利作品也不等同血腥残骸；类比只描述平面变形外观。
