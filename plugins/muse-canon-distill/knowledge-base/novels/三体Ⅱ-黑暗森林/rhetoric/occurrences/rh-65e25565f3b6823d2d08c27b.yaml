chapter: 正文
figure_type: simile
quote: 一知道在哪儿，世界就变得像一张地图那么小了
sensory_mapping: 广阔世界被坐标压平、山河缩进一张纸、未知远方变成指尖可点的小标记
context_fact: 罗辑在同一路上回忆想象中的爱人拒绝说目的地，提议靠迷路保持世界广阔。
image_mechanism: 认知确定性转成制图缩尺，知道越多并非世界增大，而是可能性从立体远方压到二维纸面。
property_alignment: 1）世界空间对应地图纸；2）地点对应符号；3）命名坐标对应标注；4）探索可能对应未绘区域；5）确定性对应缩尺。
context_alignment: 当前水滴与恒星坐标正决定文明生死，旧日关于地图的浪漫话语在精确坐标时代获得悲剧反响。
narrative_function: 短暂恢复庄颜的声音与爱情哲学，并与罗辑后来用坐标咒语缩小世界形成暗线。
transfer_rule: 确定性作地图缩尺时，应写清坐标、二维压缩、可掌握性与丢失的未知，让认知收益和想象损失并存。
failure_boundary: 地图不会改变真实世界尺寸，知道位置也可能拓展探索；变小只描述主观神秘感。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 庄颜认为一旦给理想目的地确定具体位置，未知世界的想象空间会被坐标和边界压缩
vehicle: 地图把辽阔三维世界缩到一张可展开纸面，地点被固定成符号，距离和神秘都变得可掌握
ground: 1）真实世界对应地图；2）具体坐标对应图上标点；3）辽阔未知对应纸外空间；4）知道位置对应绘图；5）想象收缩对应尺度变小。
