chapter: 正文
figure_type: simile
quote: 东方正在亮起的晨空，则像一只巨大的眼睛在慢慢睁开
sensory_mapping: 群星小眼合拢后，东方一只横跨地平线的巨眼掀开暗睑，亮光逐寸注视墓地
context_fact: 罗辑站在自掘墓穴旁向三体倒数，蚂蚁在墓碑上爬行，东方晨光持续增强。
image_mechanism: 连续日出获得单一器官开启动作，与上一句万眼闭合构成镜像，让光线交替成为观看权交替。
property_alignment: 1）晨空对应眼面；2）地平线对应眼睑边缘；3）日光扩张对应睁眼；4）照亮地表对应开始看见。
context_alignment: 罗辑的豪赌需要被三体与读者见证，巨眼将自然环境变成正面凝视者，同时蚂蚁保持微小旁观。
narrative_function: 把黎明和威慑揭晓同步，承接闭眼群星并为三个镜面智子球体遮住东方作视觉铺垫。
transfer_rule: 黎明作睁眼时，应确定眼睑边界、亮区扩大、观看方向，并与前一暗场动作形成时间节拍。
failure_boundary: 晨空不是生物器官，也无判断意志；若没有明确地平线和渐亮过程，睁眼动作会缺结构。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 东方天际随日出由暗转亮、亮区不断扩大并显露地面世界
vehicle: 一只尺度覆盖天空的巨眼缓慢张开眼睑，亮眼面逐渐露出并开始观看
ground: 1）东方亮区对应眼球；2）夜幕退开对应眼睑开启；3）亮度增长对应眼睛露出；4）视野展开对应晨景显现；5）巨大天空对应巨眼尺度。
