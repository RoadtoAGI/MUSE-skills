quote: 为人类文明在宇宙中保留一粒种子、一个希望
sensory_mapping: 文明收缩进一粒种子、飞船离开枯亡母土、黑暗中寻找新土、未来嫩芽尚不可见
context_fact: 章北海向舰队司令解释人类必败，夺舰是为避免全部文明与地球一同消失。
image_mechanism: 庞大文明被压缩成最小可繁殖单元，逃亡的价值不在保全当前规模，而在保存重生结构。
property_alignment: 1）自然选择号对应种子外壳；2）船员对应胚；3）文化技术对应遗传物；4）星际航行对应传播；5）宜居星系对应土壤；6）重建文明对应发芽。
context_alignment: 战舰名为‘自然选择’，种子喻体把逃亡置于生存进化框架，也准确解释章北海为何只需一舰。
narrative_function: 给夺舰行为明确的正面目的，并建立后续星舰人类线的核心价值尺度。
transfer_rule: 文明作种子时，应逐项配置载体、信息、传播、落点和萌发条件，突出最小充分保存。
failure_boundary: 一舰人口和资源未必足以维持遗传与社会多样性，宇宙也未必存在可萌芽环境。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 章北海希望至少保存一艘恒星际飞船及船员，使地球灭亡后人类文明仍可能繁衍延续
vehicle: 一粒种子携带完整生命潜能，被保存并播入远方土地后可萌芽、繁殖成新的群落
ground: 1）飞船与乘员对应种子；2）文明知识对应遗传信息；3）宇宙对应待播土地；4）逃亡对应播散；5）后代社会对应萌芽；6）地球灭亡对应母株死亡。
