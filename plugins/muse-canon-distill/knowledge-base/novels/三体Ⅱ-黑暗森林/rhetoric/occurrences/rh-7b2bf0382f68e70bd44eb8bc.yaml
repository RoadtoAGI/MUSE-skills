chapter: 正文
figure_type: metaphor
quote: 可以把氢弹作为直接的攻击武器，他把这称为太空地雷
sensory_mapping: 一枚枚包膜氢弹像雷体埋在黑暗轨道，微型发动机悄悄挪动位置，等待飞船穿入雷区
context_fact: 罗辑建议给每颗氢弹装离子发动机，以调整尘埃云密度，也设想未来直接攻击三体飞船。
image_mechanism: 分散轨道武器被地面伏击装置模型化，部署、等待、目标进入和爆炸形成完整作战链。
property_alignment: 1）氢弹对应雷体；2）轨道坐标对应埋设点；3）机动修正对应布雷调整；4）飞船航路对应道路；5）爆炸杀伤对应触雷。
context_alignment: 命名出自罗辑这个二十一世纪人，旧式军事词汇体现其时代认知，又便于向现代委员会解释附加用途。
narrative_function: 为氢弹安装机动能力提供公开理由，同时给后来精确重排核弹阵列保留技术接口。
transfer_rule: 新武器借旧兵器命名时，应匹配部署位置、等待机制、目标路径、触发方式和杀伤结果。
failure_boundary: 氢弹并非靠接触触发，真实用途后来是坐标广播；‘地雷’不能解释其最终威慑信息功能。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 装有离子发动机、预先部署在太阳轨道并可在需要时引爆的恒星型氢弹
vehicle: 埋设在交通路径、等待目标接近后爆炸的地雷，以固定或微调位置伏击经过者
ground: 1）轨道氢弹对应地雷；2）太阳轨道对应埋设区；3）离子发动机调位对应调整雷区；4）三体飞船经过对应目标踏入；5）核爆对应地雷起爆。
