tenor: 罗辑见到高度吻合想象女孩的电脑画像后无法移开目光的定身状态
vehicle: 被魔法咒语控制身体、失去自主动作的人
ground: 1）突然静止对应定身术生效；2）目光无法移开对应意志被控制；3）画像出现对应咒语触发；4）持续许久对应咒效未退；5）理想成真感对应超自然力量。
