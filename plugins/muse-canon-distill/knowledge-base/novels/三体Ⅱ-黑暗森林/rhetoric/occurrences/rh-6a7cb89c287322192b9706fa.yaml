quote: 罗辑像中了魔咒似的一动不动盯着看
sensory_mapping: 定身、凝视、时间停滞、魔法触发
context_fact: 史强带来画像，抽完一根雪茄回来时罗辑仍保持原姿势凝视屏幕。
image_mechanism: 屏幕图像成为无声咒符，光一进入眼睛便锁住肌肉和时间，让罗辑从观看者变成被画像控制者。
property_alignment: 1）画像对应咒符；2）观看对应中咒；3）静止对应定身；4）长久凝视对应受控。
context_alignment: 女孩本来就是思想造物，第一次获得可见面孔带有召唤成真的魔法感；持久静止提供可核身体证据。
narrative_function: 标记画像命中，令寻找虚构人物转为现实行动。
transfer_rule: 魔咒写吸引力时，应有明确触发物、即时身体失控和持续时间，避免只写一般喜欢。
failure_boundary: 罗辑仍能随后主动收回目光，画像没有真实超自然力量；强凝视不等于永久控制。
quality_assessment: effective
