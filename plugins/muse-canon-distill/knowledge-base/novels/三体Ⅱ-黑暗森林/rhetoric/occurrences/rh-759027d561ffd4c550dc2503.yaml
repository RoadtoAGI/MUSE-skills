tenor: 大低谷的灾难经验使人类社会形成优先保护民生、限制战争资源消耗的制度与价值防线
vehicle: 生物体遭受重病后免疫系统识别病原、形成记忆，并在再次侵袭时更快阻止同类伤害
ground: 1）人类文明对应机体；2）大低谷对应重病；3）极端战争动员对应病原；4）社会反思对应免疫识别；5）人文原则对应抗体；6）宪法资源限制对应免疫记忆；7）防止重演对应二次免疫。
