quote: 人类世界这大病一场，触发了文明机体的免疫系统
sensory_mapping: 文明发病、全身受损、免疫被唤醒、抗体守住复发入口
context_fact: 大低谷后，人类把人文原则置于文明延续之前，后来重建舰队也在宪法中限制军费不得摧毁社会生活。
image_mechanism: 庞杂社会被视为有记忆的身体，历史灾难不只留下伤疤，还训练出能识别同类政策危险的防御反应。
property_alignment: 1）文明对应身体；2）灾难性动员对应感染；3）大低谷对应疾病发作；4）公共价值转向对应免疫激活；5）法律限制对应抗体；6）后代制度记忆对应免疫记忆。
context_alignment: 邻居先列出疾病前因、发作和恢复，随后给出‘不再发生’及基础理念，医学各环节都有历史对应。
narrative_function: 解释为何复兴后的人类仍能重启备战却限制其吞噬民生，为未来社会乐观提供制度来源。
transfer_rule: 社会免疫类比应对齐损害源、识别机制、记忆载体和二次防护，同时检查谁承担‘机体’边界。
failure_boundary: 社会没有统一神经与免疫中枢，制度会遗忘、被争夺或制造新伤害；一次灾难不能保证永久免疫。
