tenor: 护士背负微型双旋翼飞行器，在巨大柱状城市结构间轻快飞远、身影缩成小点
vehicle: 一只体形细小、翅翼快速转动并能在林木空隙灵活穿行的蜻蜓
ground: 1）双旋翼对应透明振翅；2）女孩身影对应虫体；3）轻盈飞行对应蜻蜓机动；4）巨树城市对应林间；5）远去缩小对应小虫视觉尺度。
