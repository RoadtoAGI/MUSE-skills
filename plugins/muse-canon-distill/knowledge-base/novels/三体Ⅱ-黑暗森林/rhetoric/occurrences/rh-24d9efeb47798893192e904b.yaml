quote: 远远地飞过两棵巨树之间，变成了一个小小的蜻蜒
sensory_mapping: 旋翼闪动、身影轻升、林间穿越、远处化虫
context_fact: 护士把像伞的个人飞行器展开为反向旋转的双桨，从高枝平台跃入地下城市深空。
image_mechanism: 人物与飞行器在距离中合成一个昆虫轮廓，机械桨叶获得翅翼节奏，巨构城市则成为可供小虫穿行的森林。
property_alignment: 1）护士与飞行器对应蜻蜓；2）螺旋桨对应翅膀；3）城市巨柱对应树木；4）轻快轨迹对应虫飞；5）远距缩影对应微小体形。
context_alignment: 前文已把城市建立为巨型森林，蜻蜓顺着同一尺度框架出现，使个人飞行技术自然嵌入这套生态图景。
narrative_function: 用一个轻巧生命形象完成个人飞行器首次展示，把罗辑的技术震惊转成新世界的美感。
transfer_rule: 机械飞行物作昆虫时，应对齐翼部运动、体形比例、机动轨迹和所处环境尺度，让远近变化参与成像。
failure_boundary: 旋翼依靠电机和空气动力，护士不会变形为昆虫；蜻蜓也不能承载成人或执行城市通勤。
quality_assessment: exemplary
