tenor: 人类现有科学相对于更高文明所知真理的幼稚、局部和未充分探索状态
vehicle: 只在海滩捡到少量贝壳、尚未真正看见辽阔海洋的孩子
ground: 1）人类文明年轻对应孩子年幼；2）已有成果对应零散贝壳；3）研究范围局部对应只在海边；4）完整真理对应大海；5）三体高度提示未知对应尚未见海；6）把未来看死对应误把贝壳当全世界。
