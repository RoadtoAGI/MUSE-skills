tenor: 入冬后庄园绿色消失、雪地与薄冰把景物色域压缩为冷灰白的过程
vehicle: 一张彩色照片逐步抽去色彩信息、最后只剩黑白明度
ground: 1）绿色消失对应彩色通道退去；2）白雪覆盖对应画面变白；3）树地暗部对应黑灰；4）景观整体平面化对应照片；5）天气转冷对应显影退色。
