figure_type: simile
quote: 大自然像一张由彩色变成黑白的照片那样褪去了亮丽的色彩
sensory_mapping: 彩照退色、黑白灰阶、白雪覆盖、绿色抽离
context_fact: 天气迅速变冷并下雪，周围绿色消失，湖面结薄冰。
image_mechanism: 季节像暗房操作，把景物中的绿、蓝、暖色逐通道抽走，庄园最终定格成一张冷黑白照片。
property_alignment: 1）自然景观对应照片；2）夏秋色彩对应彩色影像；3）冬雪枯木对应黑白灰；4）季节变化对应退色过程。
context_alignment: 可见颜色变化完整支撑摄影过程，静止冬景又与罗辑失去家庭后的停滞感相合。
narrative_function: 把气候变化变为情绪布景，标记伊甸园从幸福画卷转入思考冬季。
transfer_rule: 彩照转黑白应列出具体消失色与保留明度，并让变化覆盖整个视野而非单一物体。
failure_boundary: 冬景仍可能有蓝天、红光等色彩，黑白是总体印象；色彩繁盛季节照搬会失实。
