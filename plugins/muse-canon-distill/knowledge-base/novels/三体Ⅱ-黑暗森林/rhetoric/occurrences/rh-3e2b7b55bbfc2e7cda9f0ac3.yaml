chapter: 正文
figure_type: simile
quote: 几个萤火虫般迷离的光点
sensory_mapping: 黄绿微光、忽明忽灭、飘忽轨迹、暗中飞点
context_fact: 罗辑实际看不见智子，只在意识警报后仿佛听见嗡声并好像看到光点。
image_mechanism: 量子尺度监听器被放大成夜色小灯，沿不规则轨迹闪烁；不可见威胁获得可跟踪却仍迷离的轮廓。
property_alignment: 1）智子对应萤火虫；2）存在提示对应发光；3）运动对应飘飞；4）难感知对应闪烁迷离。
context_alignment: “萤火虫”也回响泰勒敢死队母题，但此处颜色和运动专为智子视觉化，声光与同句嗡鸣闭合。
narrative_function: 把抽象监听压力压进罗辑眼前，促成其吞回宇宙社会学线索。
transfer_rule: 微型不可见对象用萤火虫具象时，应同时映射亮度、运动和可捕捉性，避免只借浪漫光点。
failure_boundary: 智子不会肉眼发光，光点不构成观测证据；明亮固定或成片连续的对象不适用零散萤火。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 罗辑想象中在身边飞行、微小难定却表明智子存在的几个亮点
vehicle: 黑暗中忽明忽灭、轨迹飘忽的萤火虫
ground: 1）光点微小对应虫体发光；2）明灭迷离对应萤光闪烁；3）在周围飞行对应虫子飘飞；4）难以锁定对应轨迹不定；5）数目几个对应零散虫群。
