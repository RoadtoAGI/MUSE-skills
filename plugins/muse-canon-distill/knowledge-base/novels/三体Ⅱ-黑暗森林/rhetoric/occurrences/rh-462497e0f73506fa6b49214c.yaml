chapter: 正文
figure_type: simile
quote: 飞行的车流，像海底植物间川流不息的鱼群
sensory_mapping: 车群游弋、柱林如藻、流线穿梭、光柱入水
context_fact: 地下城市建筑像巨型森林，个人飞行者成群，最显眼的是被朝阳光柱镀金的空中车流。
image_mechanism: 空气被赋予水体阻力与深度，车辆脱离道路后像有生命的群鱼绕过植物状巨构，在立体空间形成流。
property_alignment: 1）飞车对应鱼；2）行车队列对应鱼群；3）城市柱枝对应水草和珊瑚结构；4）航线对应游动通道；5）朝阳光柱对应穿水光束。
context_alignment: 没有地面道路的未来交通需要新的空间模型，海底鱼群准确表达三维穿行与群体秩序，并承接树形城市的有机意象。
narrative_function: 把陌生空中交通一次转成可理解生态，让未来北京呈现完整、繁忙而优美的立体生活。
transfer_rule: 用鱼群描述三维交通时，应对齐个体载具、群体流向、障碍绕行和介质空间，不能只取数量多。
failure_boundary: 车辆受规则、导航和动力系统控制，不会像鱼自主聚散；空气密度与海水不同，运动轨迹也受安全航道限制。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大量飞行车辆在地下城市巨柱与枝状平台之间分层、连续穿梭的交通流
vehicle: 成群鱼类在海底植物丛间沿通道持续游动、彼此避让又保持整体流向
ground: 1）车辆对应鱼；2）车流对应鱼群；3）城市巨树对应海底植物；4）空中行驶对应水中游动；5）连续交通对应川流不息；6）金色光柱对应水下光束。
