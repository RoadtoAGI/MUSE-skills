quote: 就会像一台超级发动机那样对这颗行星产生减速作用
sensory_mapping: 行星装机、岩石喷流、反冲制动、轨道下沉
context_fact: 破壁人推断雷迪亚兹用百万核弹把水星物质炸到逃逸速度，令行星减速并最终坠入太阳。
image_mechanism: 整颗行星被改装成飞行器，地层成为可抛出的推进剂；核爆并非直接推水星，而由喷出的质量把反作用力施回天体。
property_alignment: 1）水星对应飞船机体；2）核弹阵列对应发动机燃烧室；3）地层岩石对应推进剂；4）逃逸物质对应尾喷流；5）轨道减速对应反向推力。
context_alignment: 类比忠实承载动量守恒机制，并明确发动机用于制动这一反常方向，正好揭开水星核试验真正价值。
narrative_function: 把百万核弹的疯狂数量组织成一个工程装置，使同归于尽计划从猜测变成可理解的因果链首环。
transfer_rule: 把爆炸阵列类比发动机时，应明确工质、喷射方向、反作用对象和速度变化，不能只借‘动力巨大’。
failure_boundary: 核爆难以形成可控连续喷流，水星没有发动机结构，所需能量远超计划能力；类比说明原理而不证明可实施。
quality_assessment: exemplary
