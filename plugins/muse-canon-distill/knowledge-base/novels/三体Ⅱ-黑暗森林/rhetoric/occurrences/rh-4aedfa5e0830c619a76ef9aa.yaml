review_status: reviewed
tenor: 埋在水星地层中的大量恒星型氢弹定向炸飞岩石，以反冲逐步降低水星轨道速度
vehicle: 发动机高速向后喷出质量并借反作用力改变所连接载体的运动速度
ground: 1）水星对应运载器；2）氢弹群对应发动机；3）炸飞地层对应喷射工质；4）动量反冲对应推力；5）连续部署对应巨型动力系统；6）反向工作对应减速。
