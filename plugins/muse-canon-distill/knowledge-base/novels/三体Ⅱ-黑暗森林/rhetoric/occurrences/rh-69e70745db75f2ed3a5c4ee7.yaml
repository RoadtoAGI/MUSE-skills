quote: “螳螂”号仿佛是突然从太空中冒出来一样
sensory_mapping: 黑空原本空无、舰体骤然显形、轮廓瞬间放大、乘员像被迎面截住
context_fact: 穿梭艇在减速过载中靠上无人螳螂号，乘员主观上未感到漫长接近过程。
image_mechanism: 速度与过载压缩连续视变，目标从不可辨点跳成近距船体，视觉遂把靠近误写成就地生成。
property_alignment: 1）螳螂号对应冒出物；2）黑色太空对应空表面；3）接近航程对应隐蔽生长；4）突然可见对应破出；5）近距巨大对应迅速成形。
context_alignment: 考察队刚把舰队看成静态网格，目标的突然冒出打破几何稳定，为进入封闭无人舱转调。
narrative_function: 用一次视觉突现跨过对接技术细节，增强人物进入危险核心的猝然感。
transfer_rule: 快速接近写成冒出时，应有先不可见、视野骤增和中间过程被生理或叙事压缩三项依据。
failure_boundary: 螳螂号始终沿既定位置存在，没有从真空生成；突然性只属于乘员感知。
quality_assessment: effective
