review_status: reviewed
tenor: 穿梭艇快速减速并完成接近时，原本远小难见的螳螂号骤然充满乘员近距视野
vehicle: 隐藏物从空无表面突然破出或生长出来，省略了逐渐靠近的中间过程
ground: 1）远处不可见对应藏在空无；2）快速接近对应突然冒出；3）舰体放大对应物体生长；4）太空背景对应表面；5）过载遮蔽过程对应中间帧消失。
