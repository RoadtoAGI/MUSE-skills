chapter: 正文
figure_type: simile
quote: 罗辑听着却像掉进了冰窟窿
sensory_mapping: 温度、坠落、空间封闭
context_fact: 史强兴奋讲解黑白脸审讯，罗辑误以为自己将遭此控制，绝望再次抓住他。
image_mechanism: 把连续话语在某一刻打开成脚下洞口，人物从机舱的安全表面骤坠进冷暗空间，心理转折获得方向和温度。
property_alignment: 1）突然理解危险对应失足；2）绝望对应深陷；3）恐惧寒颤对应冰冷；4）无人解答对应封闭。
context_alignment: 史强讲的策略本就要制造“全世界都是狼”的孤独，冰窟把罗辑被引发的同类孤立感直接呈现。
narrative_function: 让史强停止卖弄，标出罗辑对未知任务的恐惧仍在，并推动二人转向更关键的伪装建议。
transfer_rule: 用坠入冷处写情绪时，应交代触发瞬间、下降方向、温度变化和脱困困难。
failure_boundary: 缓慢忧郁或单纯困惑不具备骤坠与冰冷；喻体不能证明实际处境已无出口。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 罗辑听审讯技巧后骤然陷入的绝望、恐惧与孤立感
vehicle: 身体突然坠入寒冷、幽暗且难以爬出的冰窟窿
ground: 1）情绪骤降对应坠落；2）恐惧带来寒意对应冰冷；3）不知使命且受控制对应被困深窟；4）与史强兴奋形成温差对应窟内外隔绝。
