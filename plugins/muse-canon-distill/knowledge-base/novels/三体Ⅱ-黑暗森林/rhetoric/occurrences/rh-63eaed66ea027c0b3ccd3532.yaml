tenor: 媒体和朝圣人群被隔离后，新生活五村表面重新安静，外部骚扰痕迹暂时消失
vehicle: 一个从未经历咒语验证、万人聚集和戒严的普通村庄，日常秩序未被打断
ground: 1）现场无媒体对应从未受访；2）人群消失对应从未朝圣；3）生活恢复对应事件前日常；4）环境安静对应无扰动状态。
