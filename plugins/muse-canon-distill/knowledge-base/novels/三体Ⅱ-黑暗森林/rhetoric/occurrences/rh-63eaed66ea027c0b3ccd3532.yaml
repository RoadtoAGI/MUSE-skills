chapter: 正文
figure_type: simile
quote: 新生活五村的一切都恢复了平静，仿佛什么都没有发生过一样
sensory_mapping: 喧闹人潮从村外抹去，道路和住宅重新安静，表面像事件从时间线上被擦除
context_fact: 罗辑要求居住区保持现状、禁止外界骚扰，新闻媒体和朝圣者随后被挡在远处。
image_mechanism: 现实中的重大事件与反事实的未发生状态叠合，安静程度由‘可否看出事件痕迹’来衡量。
property_alignment: 1）恢复日常对应未受事件打断；2）清空人群对应没有来访者；3）隔绝新闻对应事件未传播；4）平静表象对应零痕迹。
context_alignment: 咒语生效已改变全世界，村内却被行政手段封成静区；反事实语气强调平静只是局部表面。
narrative_function: 在第二次听证前制造短暂静止，并突出罗辑个人生活与全球神化之间的隔膜。
transfer_rule: 用‘仿佛未发生’写恢复时，应列出被清除的具体痕迹与重新出现的日常基线，使反事实可核验。
failure_boundary: 事件后果仍在法律、媒体和罗辑身份中持续，村庄也受外部封锁；表面安静不等于历史被撤销。
