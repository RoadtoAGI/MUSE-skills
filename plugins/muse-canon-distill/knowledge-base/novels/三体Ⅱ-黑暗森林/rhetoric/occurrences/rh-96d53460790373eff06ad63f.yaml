context_fact: 泰勒从破壁和听证会危机中赶来，进入庄园后终于在草坪白椅坐下。
image_mechanism: 维持面壁者外壳的内在绳索同时被拔出，身体沿关节一节节塌进椅子，只剩没有张力的重量。
