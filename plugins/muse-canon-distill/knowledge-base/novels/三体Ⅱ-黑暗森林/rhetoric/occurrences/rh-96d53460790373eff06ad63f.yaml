context_alignment: 他此前一直靠政治家姿态强撑，来到唯一可倾诉的同类面前才允许支撑撤除，动作与心理松脱同步。
narrative_function: 在开口前用身体显示崩溃程度，迫使罗辑重视其来意。
transfer_rule: 抽筋喻疲惫要呈现从强撑到骤塌的时点，并让身体具体失去哪种姿态控制可见。
failure_boundary: 泰勒并非生理瘫痪，随后仍能行动；渐进轻度疲劳若无突然失力不宜使用全身抽筋。
