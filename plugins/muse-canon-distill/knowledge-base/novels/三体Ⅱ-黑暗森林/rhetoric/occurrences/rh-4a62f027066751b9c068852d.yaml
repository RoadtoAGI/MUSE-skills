chapter: 正文
figure_type: simile
quote: 墙壁也在变形，像消融的冰
sensory_mapping: 硬墙软化、冰面滴融、轮廓塌陷、固体成流体
context_fact: 罗辑与庄颜凝视后感到不可制止地下坠，随即看见蒙娜丽莎和墙壁变形。
image_mechanism: 石墙的硬度被情感高温抽走，轮廓像冰边缘一样流淌，现实建筑首先从固态规则中退出。
property_alignment: 1）墙壁对应冰；2）坚固形态对应冻结；3）变形对应融化；4）崩塌对应失去固态支撑。
context_alignment: 前文心灵堤坝已崩溃、脚下如冰面下滑，冰的消融把内在失守扩展到外部建筑。
narrative_function: 启动从博物馆现实向宇宙爱情幻象的全面物性崩解。
transfer_rule: 消融喻写现实失稳应从具体硬物的轮廓和支撑变化入手，并与情绪的温度或失控方向相连。
failure_boundary: 墙壁并未真实受热融化；若场景强调爆裂、切割而非软化，冰消融的运动机制不合。
