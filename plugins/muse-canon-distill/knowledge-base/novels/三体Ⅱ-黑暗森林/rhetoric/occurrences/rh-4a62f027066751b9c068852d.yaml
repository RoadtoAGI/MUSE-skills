tenor: 罗辑坠入爱情幻视时卢浮宫坚固墙壁在感知中软化、失去固定形态
vehicle: 受热后边缘塌软、体积化水并逐渐消失的冰块
ground: 1）墙面扭曲对应冰体软化；2）建筑崩塌对应冰融失形；3）固体转流体对应现实规则瓦解；4）过程连续对应消融渐变。
