chapter: 正文
figure_type: simile
quote: 听起来仿佛外部的整个天空都在怒吼
sensory_mapping: 天空张口、四面怒吼、低频震动、机舱被声浪包围
context_fact: 倒计时归零、火箭发动机点火，乘员看不见尾焰，只听到巨响并承受超重。
image_mechanism: 机械声越过发动机局部位置，扩展为整个天穹的喉咙；飞行器像进入一张正在吼叫的巨口。
property_alignment: 1）天空对应吼叫者；2）发动机轰鸣对应怒吼；3）包围声场对应巨大口腔；4）点火对应情绪爆发。
context_alignment: 乘员无法看见发动机，只能从舱内接收全向声振，天空拟人准确表达声源失去边界。
narrative_function: 标记航空旅行转为暴烈航天发射，迅速提升感官强度。
transfer_rule: 环境怒吼要让声音覆盖全空间、具有低频振动与突然增强，并交代人物无法定位单一声源。
failure_boundary: 天空没有情绪，声音来自发动机；真空段外部不能传播声波，喻体只适用于点火时机舱感受。
