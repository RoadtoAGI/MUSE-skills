tenor: 航天发动机点火后充满机舱、似从四面外部压来的巨大持续轰鸣
vehicle: 包围飞行器的整片天空成为愤怒巨兽或神灵，张口发出全面怒吼
ground: 1）声源包围对应天空整体发声；2）音量巨大对应怒吼；3）低频持续对应巨物吼声；4）点火猛烈对应愤怒爆发；5）无法定位对应无处不在。
