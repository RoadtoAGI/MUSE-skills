chapter: 正文
figure_type: analogy
quote: 这很像二十世纪末计算机网络系统的演变
sensory_mapping: 专舱消失、界面随处唤出、权限开门、整舰成为网络终端
context_fact: 巨舰没有驾驶舱、舰长室等特定舱室，所有球形舱几乎相同，数据手套可在廊道甚至卫生间激活指挥界面。
image_mechanism: 空间布局被翻译成软件架构，房间不再承载固定功能，如同程序离开特定电脑；权限而非地点决定能做什么。
property_alignment: 1）舰船系统对应服务器；2）传统功能舱对应安装客户端的电脑；3）通用球舱对应浏览器终端；4）舰长权限对应登录凭证；5）全息界面对应网页；6）全舰网络对应互联网。
context_alignment: 章北海来自网络架构转型年代，这个类比既符合其理工知识，也精确揭示集中式战舰为何能被舰长从任何位置控制。
narrative_function: 用旧技术史解释超前指挥系统，并为章北海在普通舱室完成夺舰提供逻辑准备。
transfer_rule: 跨时代系统类比应对齐固定组件、共享后端、访问终端、权限控制和位置解耦，而非只说更联网。
failure_boundary: 战舰控制涉及实时安全、物理冗余与生命风险，远比网页访问严格；任意位置也并非任意人可用。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: ‘自然选择’号把舰长等指挥界面从固定功能舱室解耦，持权者可在舰内任何终端调出完整系统
vehicle: 网络从必须安装专用软件的客户机模式转向浏览器模式，用户凭权限可在任意联网计算机访问服务
ground: 1）固定指挥舱对应专用客户端；2）舰载核心系统对应服务器；3）任意舱室终端对应浏览器；4）系统权限对应账户授权；5）调出界面对应访问服务；6）功能脱离位置对应网络解耦。
