quote: 远处的焊花在他的眸中映出两团小小的火焰
sensory_mapping: 眸中火点、焊花闪光、热度、持续燃烧
context_fact: 章北海声明自己拥有胜利信心，随即把目光转向停工的“唐”号及其稀疏焊花。
image_mechanism: 外部几近熄灭的造船火星进入瞳孔后重新聚成两团内火，停工现实被个人信念暂时点燃。
property_alignment: 1）信念对应火；2）眼睛对应火盏；3）焊花对应引火星；4）行动意志对应热能。
context_alignment: 同一焊花在吴岳眼中意味着停工，在章北海眼中成为火焰，视觉反射直接展示两人解释现实的差异。
narrative_function: 无须心理说明便给章北海的信念一个可见标志，并过渡到吴岳的新幻象。
transfer_rule: 以眼中火写信念时，最好提供场景中的真实光源，让物理反光与心理热度叠合。
failure_boundary: 眼中亮光不能证明信念真伪，火也可能代表愤怒；需由邻近话语限定含义。
