tenor: 雪山白景触发罗辑在广阔冬日自然中想起庄颜双眼的视觉化思念
vehicle: 一幅以无边留白为主体的国画上，画中人的眼睛从纸面逐渐显影
ground: 1）雪地对应宣纸空白；2）自然景观对应画卷；3）庄颜记忆对应浮现图像；4）她的国画美学对应留白构图；5）思念占据视野对应眼睛成为焦点。
