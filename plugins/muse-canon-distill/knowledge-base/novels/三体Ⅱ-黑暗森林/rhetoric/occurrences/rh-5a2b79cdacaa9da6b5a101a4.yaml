chapter: 正文
figure_type: metaphor
quote: 在这自然画卷中的无边的空白上，庄颜的眼睛浮现出来
sensory_mapping: 无边白纸、眼睛显影、自然画轴、记忆浮图
context_fact: 雪覆盖曾如月面的黑岩带，与雪山连成一体；庄颜曾称雪山像国画留白并画过两个小人。
image_mechanism: 冬雪把实景压平成她钟爱的白纸，景物细节退去后，记忆像墨色从纸纤维中渗出，只显出一双眼睛。
property_alignment: 1）冬日自然对应画卷；2）雪景对应留白；3）庄颜眼睛对应画中显影；4）罗辑观看对应展开画轴。
context_alignment: 它延展庄颜亲自建立的国画空白框架，并把她留下的画、雪山与罗辑思念三条线合在同一图像中。
narrative_function: 让失去的庄颜仍短暂进入思考场景，维持罗辑工作动力的私人来源。
transfer_rule: 复用留白母题时应让新环境真实形成空白，并把缺席者以新的局部形象显影，推进而非复述旧映射。
failure_boundary: 庄颜并未真实出现，眼睛是记忆投射；若雪景细节繁密或人物并无共同美学史，显影会悬空。
quality_assessment: exemplary
