chapter: 正文
figure_type: simile
quote: 仿佛光环不是由水滴产生的，而是前者刚从环中钻出来一样
sensory_mapping: 蓝环在尾后张开、银滴从环心前冲、环色由蓝转红、旧环散去新环再生
context_fact: 水滴启动未知推进方式，每秒产生两三次变色扩张光环并在其推动下急剧加速。
image_mechanism: 因果方向被视觉倒置：本应由物体排出的推进现象变成生成物体的入口，陌生技术因此更显超越直觉。
property_alignment: 1）推进光环对应出口；2）水滴对应穿出者；3）尾尖对应门心；4）环外扩对应开门；5）水滴前移对应钻出；6）周期光环对应连续跨越。
context_alignment: 人类找不到发动机喷口，叙述也拒绝常规尾焰模型，用‘钻出’保留推进原理的不可理解性。
narrative_function: 标记水滴由静态艺术品切换为主动武器，并以反常运动为螳螂号爆炸的最后预告。
transfer_rule: 陌生推进写成穿环时，应精确安排物体、环心、扩张与前移的时间顺序，让因果倒置可见。
failure_boundary: 水滴没有从空间洞口生成，光环仍由推进过程产生；视觉先后不能说明真实物理机制。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 推进光环在水滴尾尖出现后迅速扩张包围，视觉上反而像水滴由环心向前穿出
vehicle: 实体从一个发光圆环或洞口中钻出，身体先露出，环口随后在身后扩张并消失
ground: 1）水滴对应钻出物；2）蓝光环对应洞口；3）尖端位置对应出口中心；4）环扩张对应洞口张开；5）水滴加速对应向外钻；6）连续新环对应反复穿门。
