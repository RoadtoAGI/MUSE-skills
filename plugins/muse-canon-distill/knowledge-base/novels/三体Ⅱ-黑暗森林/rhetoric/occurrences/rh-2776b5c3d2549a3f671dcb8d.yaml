chapter: 正文
figure_type: simile
quote: 如镜的潮面上雪山的倒影
sensory_mapping: 平滑水面、清晰倒影、冷光、上下对称
context_fact: 罗辑走到伸入湖中的栈桥尽头，在明媚阳光下看雪山倒影。
image_mechanism: 水平水面硬化成一整片抛光镜，把远山复制到脚下，庄园景观由一层变成上下两层。
property_alignment: 1）湖面对应镜面；2）雪山对应被照物；3）倒影对应镜像；4）无风对应平整。
context_alignment: 这是罗辑梦想之地首次静观时刻，稳定倒影把前文的童话整体收拢成宁静定格。
narrative_function: 建立庄园生活的视觉核心，并衬托罗辑把四百年危机抛到脑后的自足。
transfer_rule: 镜面写水景时，应给出平静度、反射对象和成像清晰度；再决定镜像如何服务人物当下心境。
failure_boundary: 有风浪、浑浊或强散射时倒影会破碎；“如镜”只写此刻表面，不说明湖水深浅。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 平静清澈、完整映出雪山的湖面
vehicle: 表面平整、能清晰反射物象的巨大镜子
ground: 1）水面平稳对应镜面平整；2）雪山倒影清楚对应镜中成像；3）湖面有光泽对应镜面反光；4）景物上下对称对应镜像翻转。
