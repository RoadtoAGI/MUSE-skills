quote: 航天系统内部也不是铁板一块
sensory_mapping: 铁板裂缝、两侧受力、关键支点、整体可撬开
context_fact: 工质与辐射驱动两派势均力敌，最终方案由三四名关键老航天决定。
image_mechanism: 看似坚固统一的机构被显影出接缝，两股力量从板内相反方向拉扯，少数人的意见成了决定倾斜的支点。
property_alignment: 1）航天系统对应铁板；2）组织统一对应整块；3）派别分化对应裂缝；4）关键人物对应受力点。
context_alignment: 丁仪用口语成语纠正章北海对机构完全封闭的想象，后续具体人数让“裂缝可撬”具有行动意义。
narrative_function: 向章北海透露路线决策可被少数人改变，直接导向其购买陨石制造子弹。
transfer_rule: 组织铁板喻应说明统一表象、内部接缝和改变平衡的受力点，不能只作泛称团结。
failure_boundary: 派别竞争不等于组织将碎裂，铁板也忽略制度协商；若意见已公开多元，“不是铁板”信息量有限。
quality_assessment: conventional
