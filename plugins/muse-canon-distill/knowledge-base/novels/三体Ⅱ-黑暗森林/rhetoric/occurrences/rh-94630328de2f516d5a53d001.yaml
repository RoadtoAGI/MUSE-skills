tenor: 航天系统对推进路线并非意见完全统一，内部存在老航天派与核聚变等新力量的竞争
vehicle: 并未焊成无缝单片、内部可分裂并被外力撬动的铁板
ground: 1）机构对应铁板；2）一致意见对应整块；3）派别分歧对应裂缝；4）新学科进入对应外力撬动；5）关键少数改变结果对应平衡可破。
