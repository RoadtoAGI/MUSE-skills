quote: 大旋涡又幻化成一条由所有星星凝成的银色的大蛇，呼啸着钻进他的大脑
sensory_mapping: 银鳞巨蛇、旋涡盘身、呼啸突进、钻入头颅
context_fact: 梦中星群先在鼓皮般振动，后聚为巨大旋涡；现实中病毒正使罗辑脑意识衰退。
image_mechanism: 分散星点被旋涡拧成一条连续蛇身，银河尺度骤然收窄为尖头，从天幕直刺大脑内部。
property_alignment: 1）银河旋涡对应蛇身；2）群星对应银鳞；3）旋转聚合对应盘绕；4）理论与病毒侵袭对应钻脑。
context_alignment: 蛇的攻击性把宇宙恐惧与体内基因武器合并，外部星空和内部病变在梦里走同一侵入路径。
narrative_function: 将梦境推至意识被吞没前高潮，连接罗辑理论身份与刺杀危机。
transfer_rule: 群体凝成巨兽应让原有排列自然提供身体形状、颜色提供表皮，并用运动方向对应威胁目标。
failure_boundary: 银河没有意识也不攻击个人，钻脑是高烧幻象；静态星图或安宁情绪不适合巨蛇突袭。
