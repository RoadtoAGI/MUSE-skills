tenor: 聚变爆炸形成的高温发光球迅速扩张，覆盖并熔毁整艘‘无限边疆’号
vehicle: 巨大生物或洪流张口吞下对象，使其完整进入内部、从外界消失并被消化破坏
ground: 1）火球对应吞食者；2）舰体对应被吞物；3）扩张覆盖对应张口包入；4）熔毁对应消化；5）舰影消失对应吞没完成。
