quote: 膨胀的核火球已经吞没了“无限边疆”号的整个舰体
sensory_mapping: 亮白火球张大、巨舰被光焰一口包住、舰影从边缘向中心消失、只余火体
context_fact: 水滴穿透燃料舱后引发聚变反应，火球扩张至覆盖整舰，随后收缩。
image_mechanism: 无主体的能量扩张获得吞食动作，覆盖速度和对象消失被压成一口完成的毁灭。
property_alignment: 1）核爆边界对应口腔边缘；2）扩张对应张口；3）舰船对应食物；4）高温熔化对应消化破坏。
context_alignment: 巨舰原是力量主体，此刻成为火球食物，主动与被动关系完全倒置。
narrative_function: 把物理爆炸写成有方向的捕食，维持水滴攻击段落的连续压迫感。
transfer_rule: 覆盖性毁灭作吞食时，应写出扩张边界、被吞对象、消失过程和内部改变。
failure_boundary: 火球没有口、意志或营养需求，舰体熔化源于热核反应而非生物消化。
