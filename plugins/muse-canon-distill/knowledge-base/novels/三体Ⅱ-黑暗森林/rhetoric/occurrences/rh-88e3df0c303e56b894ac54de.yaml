quote: 人类又种下一颗小太阳
sensory_mapping: 黑地埋种、倒计时催芽、核火破土、异星长出小日
context_fact: 水星在巨大太阳近旁只有黑金两色，人类于地下试验恒星型氢弹，火球随后掀开地层。
image_mechanism: 最暴烈的武器被放进农业生长语法，埋弹动作获得播种外形，爆炸则成为一颗人工恒星从行星土壤中出芽。
property_alignment: 1）恒星型氢弹对应太阳种子；2）水星对应田地；3）深井部署对应入土；4）引爆对应萌发；5）聚变火球对应幼小太阳；6）冲天喷发对应生长。
context_alignment: 场景同时有真太阳、黑土地与人工聚变，‘种’把三者紧密扣合，又以创造生命的动词反衬毁灭实验。
narrative_function: 用一句诗性反讽开启水星核试验，把人类工程雄心与行星暴力压进同一动作。
transfer_rule: 把人工能量源写成播种时，应对齐入土、触发、破土和成长阶段，并利用生长与毁灭的价值反差。
failure_boundary: 氢弹不会繁殖或持续生长，爆炸只维持数分钟并摧毁地层；不能转移植物的生命属性。
