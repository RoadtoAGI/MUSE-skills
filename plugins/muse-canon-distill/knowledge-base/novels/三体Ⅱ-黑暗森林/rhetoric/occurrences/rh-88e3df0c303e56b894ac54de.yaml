tenor: 人类把恒星型氢弹埋入水星地层并起爆，制造出短时发出恒星般强光热的聚变火球
vehicle: 播种者把一颗太阳种子放入黑色土地，使其从地表下萌发并长出炽亮生命
ground: 1）氢弹对应种子；2）水星地层对应土壤；3）埋设对应播种；4）核聚变点火对应萌发；5）火球对应小太阳；6）爆炸隆起对应破土生长。
