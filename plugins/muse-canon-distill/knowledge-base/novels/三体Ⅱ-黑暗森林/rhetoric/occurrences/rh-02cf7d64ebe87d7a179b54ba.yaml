chapter: 正文
figure_type: analogy
quote: 从外面看就像生产线上产出来的一样
sensory_mapping: 槽列如工位、穗体快速成形、批次下线、工厂连续收获
context_fact: 未来粮食仍由种子长出，但取消秸秆、在工厂培养槽中以强光辐射催生，地面农业几乎消失。
image_mechanism: 生物生长被重排为工业节拍，土地换成槽位、季节换成周周期，收获像产品从线端接连推出。
property_alignment: 1）粮食作物对应工业产品；2）培养槽对应流水线；3）基因改造对应产品设计；4）光照辐射对应加工步骤；5）成熟收割对应下线。
context_alignment: 大史强调‘从外面看’，保留粮食仍由种子生长的机制差异；类比准确解释罗辑为何误称合成粮食。
narrative_function: 把未来农业从神奇合成降回强化工业种植，校正罗辑对技术水平的过度想象。
transfer_rule: 将农业类比制造业时，应对齐环境控制、周期、标准化和批量产出，同时明确生命生长仍是核心过程。
failure_boundary: 作物会代谢、生长并受生物变异影响，不是被组装的无生命零件；生产线外观不能证明完全可控。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 基因改造粮食在工厂培养槽、强人造光和辐射催长下，以高度标准化、短周期方式连续收获
vehicle: 工业生产线在受控工位中快速、重复地制造规格一致的产品并批量下线
ground: 1）培养槽对应生产工位；2）种子对应原料；3）人造光辐射对应加工设备；4）一周一季对应高节拍；5）麦穗稻谷对应成品；6）标准化生长对应流水线产出。
