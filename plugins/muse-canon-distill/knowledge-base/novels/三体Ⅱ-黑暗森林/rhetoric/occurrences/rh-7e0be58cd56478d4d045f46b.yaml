chapter: 正文
figure_type: simile
quote: 那一片圆形的天空像是通向另一个云雾宇宙的时空蚀洞
sensory_mapping: 天线上方打开一枚圆洞，洞内白雾从另一个宇宙不断翻涌，越过洞缘便在晴空消失
context_fact: 风把云吹出波束后旧云消散，新云又在同一圆形范围内产生，视觉区域长期维持。
image_mechanism: 局地物理阈值被空间化为世界边界，生成—越界—消失的循环像物质穿洞，使看不见的波束范围可见。
property_alignment: 1）引力波边界对应洞缘；2）凝云对应异界物质进入；3）消云对应离开通道；4）圆形天空对应蚀洞截面。
context_alignment: 天线本身关联高维、智子与宇宙通信，时空洞喻体符合设施的科幻语境，也严格来自云的边界行为。
narrative_function: 把技术参数转成空间奇观，为孩子和家庭提供一个与战争时期不同的宇宙想象入口。
transfer_rule: 局部生成区作时空洞时，应写清洞缘、跨界前后状态、持续物质来源和观察者所见循环。
failure_boundary: 没有物质跨宇宙，云由本地水汽凝结；‘蚀洞’不能说明真实时空拓扑或传送功能。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 白云在圆形波束范围内持续生成、越界即消散，使该片天空呈现稳定边界和内部无尽云源
vehicle: 连接两个宇宙的圆形时空洞口，边界清楚，另一侧云雾物质源源不断涌入本世界
ground: 1）圆波束区对应洞口；2）边界外云消散对应界面；3）新云不断生成对应彼端涌出；4）内部白雾对应云雾宇宙；5）反常持续对应跨时空通道。
