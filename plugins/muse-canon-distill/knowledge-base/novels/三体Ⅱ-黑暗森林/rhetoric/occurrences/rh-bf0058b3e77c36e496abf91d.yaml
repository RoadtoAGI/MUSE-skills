figure_type: analogy
quote: 它让人想起几样东西：三体世界的巨摆、低维展开的智子、水滴
sensory_mapping: 一根千米镜筒悬在草地上，表面同时闪回巨摆的尺度、智子的展开镜面和水滴流过的冷光
context_fact: 天线长一千五百米、直径五十余米，整体离地悬浮，表面一半映天空、一半映华北平原。
image_mechanism: 新物体由三个既有视觉记忆叠合辨认；尺寸、悬浮和镜面分别从旧对象抽取，形成文明设计的家族相似。
property_alignment: 1）巨摆对应巨大简洁机械体；2）展开智子对应镜面与降维感；3）水滴对应无接缝高反射表面；4）三者共同对应异质技术审美。
context_alignment: 读者已在全书见过三种三体标志物，结尾用回忆式并列让人类建造的威慑天线显出技术交流后的混合血统。
narrative_function: 把尾声新设施连接到前文三体意象谱系，显示敌对技术已被改造成维持和平的工具。
transfer_rule: 用多对象类比一个新造物时，应让每个喻体独占一组可见属性，并说明叠加后形成的共同风格。
failure_boundary: 天线并非巨摆、智子或水滴的复制品，三者功能、尺度和材料不同；相似只落在外观与技术气质。
quality_assessment: effective
