review_status: reviewed
tenor: 五年后建成的巨大镜面引力波天线所呈现的三体技术外观、悬浮方式和文明气质
vehicle: 三种已知三体造物或装置：巨摆的宏大单纯几何、低维智子的展开镜面、水滴的光洁反射材质
ground: 1）天线巨大圆柱对应巨摆的宏大机械尺度；2）反重力悬浮对应巨摆或水滴脱离常规支撑；3）全镜面对应智子与水滴；4）纯几何外形对应三体设计风格。
