review_status: reviewed
tenor: 大脑全息雾气中许多神经元位置几乎同时出现、密集而短促的璀璨激活光点
vehicle: 细碎火药均匀落入火焰后，各颗粒接连骤亮并迅速爆燃
ground: 1）神经元激活对应火药燃点；2）分布广泛对应均匀撒开；3）瞬时亮起对应爆燃；4）光点密集对应火星成片；5）活动短暂对应颗粒燃尽。
