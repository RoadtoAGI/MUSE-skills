quote: 就像把一撮火药均匀地撒在火焰上
sensory_mapping: 粉末撒落、火星骤起、成片闪爆、亮点迅灭
context_fact: 显示切换到大脑动态状态，静态白雾先出现扰动，随后各处激活形成璀璨光点。
image_mechanism: 不可见电冲动获得燃烧阈值，每个被触发神经元像一粒火药触火，局部活动于是成为可见的连续爆闪。
property_alignment: 1）神经元对应火药颗粒；2）基础脑活动对应火焰；3）冲动触发对应点燃；4）全网分布对应均匀撒布；5）发光显示对应火星。
context_alignment: 静态大脑刚被写成气体云，火药撒入火焰让云中活动突然获得速度与危险亮度，适合首次展示动态思维。
narrative_function: 从静态结构切换到活体思维，用爆燃感标出信息活动的瞬息与密度。
transfer_rule: 群体激活作撒粉燃烧，应对齐单元离散、触发阈值、空间分布和短时发光，持续稳定活动不宜使用爆燃。
failure_boundary: 神经冲动不会燃烧或消耗神经元，活动也可重复发生；火药意象不能推导脑内有热爆炸。
quality_assessment: exemplary
