chapter: 正文
figure_type: simile
quote: 分子像被钉子钉死一般，自身振动都消失了
sensory_mapping: 微观粒子被一枚枚铁钉锁住、队列僵直无颤、热运动像声音般突然停掉
context_fact: 显微镜放大千万倍仍看不到粗糙，丁仪据此推测分子规则排列且相互固结。
image_mechanism: 不可见的核力约束被转成木工固定动作，‘死’强化零振动的绝对程度和不可撼动感。
property_alignment: 1）原子核间固结对应钉接；2）分子位置对应钉点；3）热振动对应松动摇摆；4）零温对应完全固定。
context_alignment: 紧接仪仗队排列卡，第二个喻体从视觉秩序推进到力学锁死，新增机制而非纯复指。
narrative_function: 让非专业角色理解绝对零度与超强材料的共同原因，推动丁仪识破水滴。
transfer_rule: 微观约束作钉接时，应指定施力者、固定点、被限制自由度和宏观后果，避免只写‘很牢’。
failure_boundary: 分子间没有实体钉子，强互作用作用方式也不同于穿刺固定；‘死’不表示粒子消失。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 水滴材料中的分子被强互作用力固定，位置几乎完全不变，热振动因而消失并呈绝对零度
vehicle: 钉子穿过物件并把它牢牢钉在基底，物件不能平移、摆动或从固定点脱离
ground: 1）分子对应被钉物；2）强互作用力对应钉子；3）晶格对应基底；4）无振动对应钉死；5）绝对零度对应静止结果。
