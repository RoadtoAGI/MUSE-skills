chapter: 正文
figure_type: metaphor
quote: 这种研究是无源之水，不可能取得成功
sensory_mapping: 泉眼被封、河床失水、细流断绝、下游土地干裂
context_fact: 惠子指出希恩斯知道思维研究必然进入量子层次，因此所谓提升智能从一开始就不可能实现。
image_mechanism: 知识依赖被转成水系上下游关系，基础学科一旦断源，应用研究即使保留河床也无法自行生水。
property_alignment: 1）量子基础研究对应泉源；2）脑科学项目对应河道；3）理论突破对应来水；4）智子封锁对应源头截流；5）技术成果对应灌溉产出；6）继续投入对应守着干河床。
context_alignment: 破壁人在揭示假目标时需要说明其必败机制，水源模型比抽象断言更直接地证明上游封锁如何决定下游停滞。
narrative_function: 一语拆掉‘思维提升’的技术外壳，把听证会注意力引向思想钢印这一真实终点。
transfer_rule: 研究链作水系时，应明确源头学科、传导河道与下游成果，只有存在刚性依赖时才可判为断源。
failure_boundary: 研究可能利用旧理论、经验方法或旁路取得局部进展，无源并不意味着所有脑科学立即停止。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 在基础物理被智子限制后，深入大脑量子机制的思维研究缺少必要理论来源，无法继续产生有效成果
vehicle: 没有泉眼、河源或持续补给的水流，很快枯竭，无法灌溉或汇成河川
ground: 1）基础物理对应水源；2）思维研究对应水流；3）新理论输入对应补水；4）智子封锁对应截断源头；5）研究成果对应下游水量；6）失败对应干涸。
