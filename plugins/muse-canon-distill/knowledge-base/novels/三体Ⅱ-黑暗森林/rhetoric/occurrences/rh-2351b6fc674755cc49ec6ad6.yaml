chapter: 正文
figure_type: metaphor
quote: 乱纪元的白昼和黑夜把世界变成一个灯光失控的空旷舞台。
sensory_mapping: 明暗、空间、节奏
context_fact: 周文王独自留在荒漠，时间加速后白昼黑夜交替，没有文明景观变化。
image_mechanism: 把整个世界框成一个演出空间，却撤去演员并破坏灯控；剩下的只有无目的亮灭，乱纪元的失序因此可见。
property_alignment: 1）骤明骤暗对应失控灯光；2）无人物建筑对应空台；3）周文王反复冻烧对应唯一演员被灯光摆布。
context_alignment: 虚拟世界本就具有场景加载感，舞台喻体贴合其人工性；“空旷”又承接周文王呼喊无人回应。
narrative_function: 把天体混沌转成戏剧装置故障，强化个体被宇宙节律任意支配的荒诞。
transfer_rule: 以舞台比拟环境时，应对应照明、场域、角色在场与控制权，尤其说明谁在操纵、谁被动承受。
failure_boundary: 人群密集、昼夜规律或角色能够控制环境时，“灯光失控的空台”都不成立；舞台也不解释三体天体力学。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 乱纪元中昼夜无规律切换、地表空无一人的三体世界
vehicle: 照明系统失控且没有演员的空舞台
ground: 1）昼夜突变对应舞台灯光乱开乱灭；2）荒原无人对应舞台空场；3）天体变化主导可见世界对应灯光控制观众所见。
