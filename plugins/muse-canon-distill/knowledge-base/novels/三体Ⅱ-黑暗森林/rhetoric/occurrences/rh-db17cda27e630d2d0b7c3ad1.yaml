chapter: 正文
figure_type: analogy
quote: 像一本放在公共场合的书，或者说是在广场上放映的电影，或者像一个全透明鱼缸里的鱼
sensory_mapping: 视觉、空间暴露、信息读取
context_fact: 伊文斯刚确认三体人的脑电波会直接向同类显示，正在向对方解释人类所谓“隐藏思想”。
image_mechanism: 连续换用三种公共观看场景，从静态内容、动态放映到活体处境逐层逼近“没有内外之分”的意识状态。
property_alignment: 1）公开书页对应记忆可查阅；2）广场电影对应思维过程实时显现；3）透明鱼缸对应主体连同活动都无处藏身。
context_alignment: 三体人不理解隐私概念，伊文斯选择无需社会心理前提、只靠可见性就能理解的物理容器和媒介。
narrative_function: 把两种文明最关键的认知差异翻译成直观空间关系，为三体世界对人类的恐惧奠基。
transfer_rule: 解释陌生抽象状态时，可用多喻体递进：每个喻体补一项前者未覆盖的属性，避免只做同义堆叠。
failure_boundary: 书和电影是被动记录，鱼是活体；三者只共同承载公开可见性，不能推导三体思维可被任意翻页、重播或物理囚禁。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三体人无法隐藏、会被同类直接接收的思维和记忆
vehicle: 公共场所摊开的书、广场放映的电影与透明鱼缸中的鱼
ground: 1）书页和银幕内容公开可读对应思想直接显示；2）广场与透明缸没有遮蔽对应无法选择私密受众；3）鱼的全部行动可观察对应内心活动持续暴露。
