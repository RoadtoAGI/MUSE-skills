quote: 整天借酒浇愁
sensory_mapping: 酒液一遍遍倒进胸中，忧愁像暗火被短暂压低，酒醒后热气又从灰下冒出
context_fact: 听证会后罗辑闭门不出，大部分时间处于醉态，出门时衣冠不整、胡子很长。
image_mechanism: 不可触的愁绪获得火的温度和蔓延性，饮酒则获得浇水动作；动作持续而效果短暂，显出依赖循环。
property_alignment: 1）精神痛苦对应火热；2）酒精摄入对应浇液；3）麻醉效果对应降温；4）醉态持续对应反复灭火。
context_alignment: 紧接‘心成灰烬’之后，浇愁沿用燃烧框架，却以日常成语呈现罗辑粗暴、自损的应对。
narrative_function: 把概括性的酗酒写成主动压制痛苦的动作，连接心理崩塌与外表潦倒。
transfer_rule: 使用‘浇愁’类成语时，应在邻近语境给出真实摄入、需要压制的具体痛点和短效反复，恢复动作因果。
failure_boundary: 酒精并不会像水灭火那样消除痛苦，长期饮酒还会加重失控；该喻体不能赋予饮酒治疗效果。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 罗辑以持续饮酒麻痹妻女被扣和威慑无路所造成的痛苦
vehicle: 用液体浇向发热或燃烧之物，试图降低温度、压住火势
ground: 1）愁苦对应灼热火势；2）酒对应浇下的液体；3）醉意对应暂时降温；4）反复饮酒对应火势复起后继续浇灌。
