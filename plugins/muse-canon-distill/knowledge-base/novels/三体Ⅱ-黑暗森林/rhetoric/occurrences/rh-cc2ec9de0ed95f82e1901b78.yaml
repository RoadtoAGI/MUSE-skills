context_fact: 破壁人指出泰勒计划先消灭地球主力舰队，再让其量子幽灵抗敌，并明确提醒这构成谋杀。
image_mechanism: 禁止杀害同胞的抽象禁令被放到社会建筑最底层，泰勒为战略需要把承重石整块移开，使计划上方的一切失去伦理支撑。
property_alignment: 1）社会秩序对应建筑；2）道德禁令对应基石；3）战略行动对应上层工程；4）抛弃禁令对应抽石；5）合法性危机对应坍塌风险。
context_alignment: 破壁人的评价位于战略揭底与‘您这是在谋杀’之间，建筑承重关系准确连接计划可行性和道德合法性。
narrative_function: 把泰勒的大胆从谋略能力转成文明底线问题，完成破壁人既钦佩又定罪的双重判断。
transfer_rule: 称原则为基石时，应说明它具体承托哪些制度或行为，以及移除后哪部分结构会失稳。
failure_boundary: 现代伦理由多条原则共同维系，单一禁令不是唯一承重点；极端战争情境中的争议也不能由建筑比喻直接裁决。
