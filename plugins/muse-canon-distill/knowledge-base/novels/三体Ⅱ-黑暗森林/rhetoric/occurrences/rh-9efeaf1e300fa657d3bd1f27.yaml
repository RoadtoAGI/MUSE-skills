quote: 已经现出雏形的光明未来
sensory_mapping: 黑暗中浮出未来轮廓、边缘被亮光勾出、梦幻城市尚未长成、人群已看见天堂
context_fact: 水滴被捕获仅一天，两个国际便组织谈判并想象三体技术与人类力量结合。
image_mechanism: 极少证据被当作实体未来的早期形态，亮度同时赋予价值判断，使推测看似已进入生长阶段。
property_alignment: 1）和平未来对应雏形；2）水滴事件对应初始结构；3）谈判机构对应成长条件；4）技术合作对应发育；5）乐观评价对应光明。
context_alignment: ‘雏形’强调证据尚少，‘光明’却提前定性，两个词并置准确暴露舆论从苗头跳到天堂。
narrative_function: 在水滴攻击前把人类误判推到规划乌托邦的顶点，扩大下一幕坍塌。
transfer_rule: 未来作雏形时，应列出已显结构与仍空白部分；光暗评价需与实际证据强度分开。
failure_boundary: 水滴不自毁不能证明和平，技术合作也未发生；所谓雏形可能只是错误投影。
