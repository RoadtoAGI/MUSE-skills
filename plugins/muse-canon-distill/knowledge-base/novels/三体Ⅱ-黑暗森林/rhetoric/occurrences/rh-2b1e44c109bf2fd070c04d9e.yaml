tenor: 泰勒听见来客自称破壁人后突遭认知重击、眩晕失稳并感到每个字威力巨大
vehicle: 闪电突然击中身体，随后连续雷霆以万钧重量轰压下来
ground: 1）身份揭示突发对应闪电骤击；2）眩晕跌坐对应电击失衡；3）每字冲击对应连续雷声；4）威胁重大对应万钧重量；5）先轻视后震惊对应晴空落雷。
