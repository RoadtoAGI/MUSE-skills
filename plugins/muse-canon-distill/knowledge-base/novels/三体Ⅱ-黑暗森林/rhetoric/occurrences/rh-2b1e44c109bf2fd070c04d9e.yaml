quote: 泰勒仿佛被一道闪电中，几乎因眩晕而跌坐在地，对于他，这句话的每一个字都雷霆万钧
sensory_mapping: 白闪击身、雷声轰压、身体失衡、字句带重量
context_fact: 泰勒刚认定来客毫无威胁并准备赶走他，来客第一句话即宣布自己是泰勒的破壁人。
image_mechanism: 羸弱声音瞬间转化为高压电弧，击穿泰勒的轻蔑判断；短短称谓随后拆成一枚枚重雷压向身体。
property_alignment: 1）“破壁人”宣告对应闪电；2）泰勒对应被击者；3）眩晕对应电击反应；4）字词对应雷霆；5）意义重量对应万钧。
context_alignment: 说话者外表、声音都极弱，雷电喻通过最大声势反差呈现信息而非音量的毁灭力。
narrative_function: 完成访客从可忽略小人物到致命对手的瞬间翻转，开启破壁对决。
transfer_rule: 信息如雷电应让前置判断处于无防备状态，并分别用突发性、身体反应和语义后果支撑声势。
failure_boundary: 现场没有真实雷电，“每字”也并非音量巨大；若消息早被预料或反应平静，雷霆强度会过度。
