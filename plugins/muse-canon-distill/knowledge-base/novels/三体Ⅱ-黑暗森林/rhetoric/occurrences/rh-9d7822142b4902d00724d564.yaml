review_status: reviewed
tenor: 熔化舰体分裂成大量暗红金属液滴，沿所有方向高速放射并充满周围太空
vehicle: 火山岩浆以炽热黏液形态流动，暴雨则由无数液滴高密度覆盖广阔区域
ground: 1）熔融舰材对应岩浆；2）液滴碎片对应雨滴；3）高温红光对应火山熔液；4）密集放射对应暴雨覆盖。
