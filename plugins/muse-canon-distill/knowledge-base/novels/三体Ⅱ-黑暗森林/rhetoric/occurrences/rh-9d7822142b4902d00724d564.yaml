quote: 形成炽热的“金属岩浆”暴雨
sensory_mapping: 百万吨舰体化成红热浆液、浆液碎为密雨、没有上下方向的火雨铺满黑空
context_fact: 首舰火球熄灭后，完全熔化的百万吨金属放射状迸射并继续无阻飞散。
image_mechanism: 太空中罕见的液态金属同时借火山触感和天气密度成像，温度与数量被一组混合景象承载。
property_alignment: 1）金属液态对应岩浆流态；2）暗红发光对应岩浆色温；3）碎滴数量对应暴雨；4）全向扩散对应无边雨幕。
context_alignment: 舰队曾是金属秩序矩阵，熔成无序天气后，材料状态本身宣告组织瓦解。
narrative_function: 连接单舰爆炸与随后覆盖舰群的碎片灾害，使毁灭产物继续参与杀戮。
transfer_rule: 熔融粒子群作岩浆暴雨时，应分别落实流态温度、颗粒密度和空间运动方向。
failure_boundary: 太空没有大气降雨或重力下落，金属液也不是硅酸盐岩浆；‘暴雨’只表密集飞散。
quality_assessment: effective
