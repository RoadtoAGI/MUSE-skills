chapter: 正文
figure_type: simile
quote: 就像是湖中的那艘落下帆的小船
sensory_mapping: 落帆、静水漂浮、无舵方向、缓慢位移
context_fact: 世界全面紧张时，罗辑独自在湖边散步泛舟，拒绝新闻和面壁工作。
image_mechanism: 人生动力被收成一面垂落的帆，庄园湖水托住他，使不作为呈现为安静漂流而非停滞。
property_alignment: 1）罗辑对应小船；2）意志对应帆；3）生活环境对应湖；4）未来对应航向；5）隐居对应漂泊。
context_alignment: 湖中确有小船，罗辑常在其中喝酒；现场物件直接成为自我状态镜像。
narrative_function: 定义隐居阶段的节奏，并为后来“失重下坠”揭露漂浮是假自由作铺垫。
transfer_rule: 船喻写无目标生活时，应明确动力是否关闭、水流由谁控制、泊点是否在意。
failure_boundary: 罗辑仍在主动消费资源和安排计划，并非完全被动；平静漂流不能抹去其责任。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑放弃目标与责任、在庄园里静止随流的生活状态
vehicle: 收起帆、不主动航行且任水流决定停泊与方向的小船
ground: 1）不设目标对应不定航向；2）停止主动行动对应落帆；3）享受闲散对应静漂；4）不关心未来对应不问泊处；5）环境优渥对应平静湖面。
