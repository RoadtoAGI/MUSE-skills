chapter: 正文
figure_type: metaphor
quote: 罗辑问，心悬了起来
sensory_mapping: 胸口提起、重物悬空、细索绷紧、落点迟迟不来
context_fact: 罗辑反复追问医生咒语恒星是否发生异常，因为该结果关系到他秘密实验是否成功。
image_mechanism: 等待中的不确定性被转成垂直失重，心理没有落点便成为胸腔里吊起的实体。
property_alignment: 1）罗辑的心绪对应重物；2）医生答复对应支点；3）追问等待对应悬吊时段；4）恐惧对应坠落可能；5）松一口气对应落地；6）秘密结果对应地面位置。
context_alignment: 咒语是罗辑真正关心却不能明说的战略核心，惯用的‘悬心’在此由连续追问和随后长出气获得完整起落。
narrative_function: 在旁人把面壁计划当笑话时保留罗辑的隐秘紧张，并用身体感标出咒语线仍未结束。
transfer_rule: 使用悬心意象时，应让问题确有两种落点，并在前后安排提起与落下的生理或动作呼应。
failure_boundary: 心脏并未发生位置移动，短暂松气也不代表恒星长期安全；此惯用语不提供医学信息。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 罗辑等待医生回答被诅咒恒星的现状时，精神高度紧张，结果未定使他无法安稳
vehicle: 一件有重量的物体被吊在空中，失去支承并随时可能坠落
ground: 1）心绪对应悬物；2）答案未定对应悬空；3）紧张对应吊索绷紧；4）无法安稳对应脚不着地；5）坏消息风险对应坠落；6）得到回答对应重新落定。
