quote: 无数星星似乎只是闪亮的尘埃，改变不了宇宙的空虚
sensory_mapping: 黑幕无边、亮尘稀撒、微点漂浮、空体未满
context_fact: 章北海独自悬浮在同步轨道，除地球与太阳外各方向皆黑，基地也只是远处一点。
image_mechanism: 恒星的宏大被观看距离压缩成尘粒，亮度只在黑暗表面打出针点，无法给无边容积增加实体感。
property_alignment: 1）群星对应亮尘；2）太空对应巨大空腔；3）遥远距离对应颗粒化；4）章北海对应空腔中的孤身观察者。
context_alignment: 场景正强调维生时间与基地距离，尘埃尺度让可见宇宙的丰富反而加重个人脆弱和空虚。
narrative_function: 建立暗杀前的冷寂心理背景，使章北海主动斩断地球联系显得既自由又危险。
transfer_rule: 远景对象作尘埃应利用尺度压缩与背景容积，让‘数量很多却填不满’成为核心反差。
failure_boundary: 恒星质量巨大且构成宇宙结构，不是无关尘埃；此喻只描述同步轨道观察者的视觉与心理感受。
