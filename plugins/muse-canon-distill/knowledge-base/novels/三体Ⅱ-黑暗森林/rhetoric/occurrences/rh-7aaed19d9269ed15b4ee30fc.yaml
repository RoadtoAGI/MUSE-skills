tenor: 章北海在广阔黑暗太空中看见无数恒星却仍感到极端空旷与孤立
vehicle: 散在巨大黑色空间里的微小发光尘粒，数量多却不足以填充容积
ground: 1）恒星对应尘埃；2）遥远尺度对应颗粒微小；3）星光对应尘粒闪亮；4）星际空间对应空房或深渊；5）数量无效对应仍填不满。
