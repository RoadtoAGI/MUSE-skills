quote: 使得后世的人类科学能够突破智子的禁锢
sensory_mapping: 牢笼、锁链、用力冲破、外部空间
context_fact: 希恩斯拟扩大脑科学研究，用一至两个世纪提升人类智力，应对基础物理被智子锁死。
image_mechanism: 技术封锁凝成围住科学的硬栏，智力不再只是知道更多，而成为能弯折栏杆的力量。
property_alignment: 1）智子对应禁锢者或锁具；2）科学对应囚徒；3）实验干扰对应围栏；4）高智力对应破锁能力；5）突破对应越狱。
context_alignment: 前文多次说物理学被智子“锁死”，禁锢延续同一束缚框架，同时让希恩斯的脑提升方案显得是解锁工具。
narrative_function: 把间接计划与最终战争目标连接，说明研究人的自身如何可能恢复科学主动权。
transfer_rule: 解禁隐喻应写明谁施加限制、限制在哪个接口、主体获得何种新能力以及突破后能做什么。
failure_boundary: 智子控制的是实验结果，不一定能靠更聪明的大脑绕过；智力提升不是已知钥匙，计划仍属假说。
quality_assessment: effective
