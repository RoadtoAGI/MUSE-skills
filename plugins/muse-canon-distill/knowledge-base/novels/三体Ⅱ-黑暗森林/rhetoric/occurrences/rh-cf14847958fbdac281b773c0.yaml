chapter: 正文
figure_type: simile
quote: 很飘渺，像蓝天上飘过的一缕洁白的轻纱
sensory_mapping: 白纱、蓝天、轻风漂移、半透明远影
context_fact: 门外声音与罗辑两年来在昼夜梦中反复听见的理想声线一致。
image_mechanism: 无形声线获得一条半透明白色轮廓，在广阔蓝天中轻轻移动；听觉的轻与远被转成视觉的薄与飘。
property_alignment: 1）女声对应轻纱；2）纯净音色对应白色；3）声波消逝对应纱飘过；4）梦中距离对应高空。
context_alignment: 庄颜的白领、纤细形象与此前百合意象相接，白纱使声音也带上同一纯净色谱。
narrative_function: 在人物露面前先视觉化其声音，维持理想形象由声到人的渐次显影。
transfer_rule: 通感式声喻要为音色分别选择颜色、材质和运动，三者共同落在具体可见物上。
failure_boundary: 轻纱只承载轻、白、远与飘，不能推出声音有布料摩擦声或说话者性格软弱。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑记忆和梦中那道轻柔、稚嫩、难以抓住的女声
vehicle: 高空蓝色背景上轻薄洁白、随风滑过的一缕纱
ground: 1）声音轻柔对应纱质轻薄；2）音色纯净对应洁白；3）出现短暂对应飘过；4）难以捕捉对应高空远离；5）听觉无形对应纱的半透明。
