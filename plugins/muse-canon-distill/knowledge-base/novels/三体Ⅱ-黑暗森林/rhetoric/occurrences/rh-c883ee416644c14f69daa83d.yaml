quote: 水星的大地上长出了一束冲天的怒发
sensory_mapping: 黑色头皮、岩土成发、巨束直冲、愤怒从地表炸起
context_fact: 地层先像巨人脊背缓慢隆起，升至三千米后整座山峰爆发，岩石泥土冲向空中。
image_mechanism: 前一句苏醒巨人继续完成身体化：隆起的背脊翻成头部，爆炸喷柱成为因疼痛或愤怒骤然竖起的长发。
property_alignment: 1）水星对应巨人；2）地面对应头皮；3）岩土喷柱对应头发；4）爆破对应发怒；5）放射碎屑对应发丝；6）冲天高度对应怒发夸张竖立。
context_alignment: 它不是对‘巨人脊背’的纯复指，而为爆发阶段新增头发、情绪和向上束形，完成由蓄力到狂怒的动态升级。
narrative_function: 在科学尺度数据之间提供行星受创的身体感，使壮丽焰火也带疼痛与暴力。
transfer_rule: 延展身体隐喻时，应让后续新部位对应新的形态阶段，并保持同一巨体的空间连续。
failure_boundary: 水星没有感受与愤怒，岩土也不会像头发保持纤维连接；意象不能把地质反应解释成生命反抗。
