chapter: 正文
figure_type: metaphor
quote: 不敢透过玻璃天花板向更高的社会阶层望上一眼
sensory_mapping: 低层房间、透明顶板、上方人影、低头退缩
context_fact: 泰勒把来客归入精神卑微的小人物：担心保不住低位、怕犯错、怕得罪任何人，也不敢向上流动。
image_mechanism: 抽象阶层被建成立体楼房，透明材质让上层始终可见，碰不穿的顶板把制度阻碍与自我压抑同时压在人物头顶。
property_alignment: 1）底层职员对应楼下者；2）高阶层对应上层空间；3）晋升障碍对应玻璃；4）机会可见对应透明；5）怯懦对应不敢仰望。
context_alignment: 人物外形像空衣架般瘦弱，空间上也被压在低处；可见而不可达准确解释其持续焦虑。
narrative_function: 把泰勒的阶级轻蔑具体化，并为卑微来客随后掌握精神优势制造垂直翻转。
transfer_rule: 玻璃天花板适合写可见机会与隐形阻隔并存的晋升困境，应点明谁在下层、何物使顶板坚硬。
failure_boundary: 来客的卑微也可能来自性格表演，文本没有证明真实制度封锁；完全不可见的排斥不具备玻璃的透明属性。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 低地位小职员被无形等级限制困住，既看见上升可能又不敢尝试越过阶层边界
vehicle: 头顶一块透明却坚硬的玻璃顶板，能望见上方空间却无法穿过
ground: 1）社会等级对应上下楼层；2）晋升边界对应玻璃顶板；3）可见上层对应透明；4）结构阻隔对应坚硬；5）内化畏惧对应不敢抬头。
