figure_type: simile
quote: 罗辑的胸口像被那个男人猛砸了一锤
sensory_mapping: 重击声势、胸骨震动、后仰、钝痛
context_fact: 罗辑走出联合国后遭枪击，防弹衣挡住弹头，但冲击使他倒地并短暂失去知觉。
image_mechanism: 看不见的高速弹头被放大成可见重锤，微小物体的动能转成读者熟悉的整块钝击。
property_alignment: 1）子弹动能对应锤力；2）防弹衣受击面对应锤头落点；3）身体后倒对应被砸退；4）胸部疼痛对应钝伤。
context_alignment: 罗辑尚未看清枪手，身体感受先抵达；锤击准确呈现防弹衣止穿透却不能消除冲量的状态。
narrative_function: 让袭击在主观感官中突然爆发，也避免先用技术说明削弱现场冲击。
transfer_rule: 用大型钝器解释小型高速撞击，应匹配受力位置、冲量结果和疼痛性质，尤其适合有防护但仍受冲击的场景。
failure_boundary: 子弹与锤子的接触面积、穿透风险不同；未有防护时只写锤击会掩盖贯穿伤。
