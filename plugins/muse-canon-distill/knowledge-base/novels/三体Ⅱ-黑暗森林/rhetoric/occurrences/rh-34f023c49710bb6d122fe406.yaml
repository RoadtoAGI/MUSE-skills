tenor: 子弹击中防弹衣时传到罗辑胸口的巨大钝性冲击
vehicle: 沉重铁锤迎面猛砸胸膛
ground: 1）冲击集中在胸口对应锤击落点；2）瞬间巨力对应猛砸；3）仰面倒地对应受锤后失衡；4）剧痛眩晕对应钝器震伤。
