tenor: 夜间地下城市由大量树形建筑、发光房屋和穿行其间的飞车光链组成的整体景观
vehicle: 无数装满彩灯与闪亮饰物的巨大圣诞树密集成林，枝叶之间缠绕连续灯串
ground: 1）树形建筑对应圣诞树；2）发光房屋对应彩灯饰物；3）飞车光链对应灯串；4）城市群对应森林；5）夜色对应展示背景；6）节庆华丽对应未来繁荣。
