quote: 夜色中的城市在他们面前展开是一片璀璨的巨型圣诞树的森林
sensory_mapping: 黑夜铺底、巨树成林、楼叶发亮、车灯串在枝间流动
context_fact: 史强把住所墙面调成透明，罗辑从树顶俯瞰夜间城市，能看到巨树建筑与飞车的连续光迹。
image_mechanism: 白日的生态城市框架被夜色重新装饰，建筑树冠挂上灯饰，交通运动则成为沿森林穿行的动态灯链。
property_alignment: 1）建筑支柱对应树干；2）悬挂房间对应树饰；3）信息灯光对应彩灯；4）飞车流对应灯串；5）城市规模对应巨型森林；6）繁荣气氛对应圣诞节庆。
context_alignment: 未来城市本就按树枝叶命名，圣诞树是既保持结构又能解释夜间发光的新变体，属于有新增映射的延展。
narrative_function: 在谋杀间隙恢复城市诱人的节庆外观，让美丽系统与暗藏病毒继续并存。
transfer_rule: 延展白昼结构到夜景时，应保留原骨架，并选择能解释新增光源、动态线路和情绪色调的次级喻体。
failure_boundary: 城市灯光服务居住交通而非节庆装饰，建筑也非植物；华丽外观不能推出欢乐或安全。
