tenor: 无人飞车穿行地下城巨树时，罗辑因回忆曾被KILLER控制车辆追杀而持续警觉、预期突然失控
vehicle: 乘客坐过山车高速穿行、陡升陡降和急转，身体受控于轨道，明知路线仍会紧张失重
