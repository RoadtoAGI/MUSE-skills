quote: 感到像坐过山车般的紧张
sensory_mapping: 飞车在巨树间像沿轨冲刺、罗辑身体记起急坠与追撞、每次转向都提前绷紧
context_fact: 两人乘无人驾驶出租车去市政厅，罗辑曾在同一城市遭受被病毒控制飞车袭击。
image_mechanism: 当前正常交通被创伤记忆套上游乐设施轨道，紧张来自无法掌控和等待下一个急变。
property_alignment: 1）出租飞车对应游乐车；2）城市路线对应轨道；3）自动控制对应被动乘坐；4）恐怖经历对应陡坡记忆；5）到站对应停车卸载。
context_alignment: 现代飞车本应平稳，罗辑却以旧事故体验它；日常交通和游乐惊险错位体现创伤残留。
narrative_function: 在市长会谈前短暂回收地下城追杀史，保持末日城市对罗辑的身体威胁感。
transfer_rule: 创伤后乘行作过山车时，应对应速度、路线控制、身体反应和旧事件触发点，避免泛指‘刺激’。
failure_boundary: 出租车没有真实陡轨或娱乐设计，且很快安全到达；紧张源于罗辑记忆而非当前驾驶风险。
