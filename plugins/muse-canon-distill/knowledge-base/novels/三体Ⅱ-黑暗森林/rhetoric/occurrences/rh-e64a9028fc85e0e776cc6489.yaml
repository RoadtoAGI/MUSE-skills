quote: 像是沉睡中的人偶尔出现的梦呓
sensory_mapping: 白色空间沉入无声睡眠、一句轻问从深处浮起、回音短暂荡开又落回沉默
context_fact: 三人已通过目光算出燃料和配件只够少数人，东方用有声语言确认共同结论。
image_mechanism: 群体默契像梦境在意识下运行，真正说出口的句子只是一小段露出表面的呓语。
property_alignment: 1）无声推演对应梦；2）东方对应梦中发声者；3）确认问句对应梦话；4）白厅寂静对应睡眠环境。
context_alignment: 与L4025东方个人梦呓形成复现，此处从心理失常推进到三人共同禁忌，使声音更失真。
narrative_function: 标出资源推演的第一个有声节点，并保持‘无人愿做第一说者’的回避。
transfer_rule: 静默后声音作梦呓时，应表现运行在下层的思考、偶发音量、语境脱节与再次沉默。
failure_boundary: 东方保持清醒且问题明确，梦呓只描述声音质感和禁忌感，不能否定她的责任意识。
