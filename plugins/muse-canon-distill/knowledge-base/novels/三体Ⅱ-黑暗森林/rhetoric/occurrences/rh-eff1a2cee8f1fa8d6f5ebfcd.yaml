chapter: 正文
figure_type: metaphor
quote: 整个宇宙中的运动都被距离抹去了
sensory_mapping: 速度轨迹从星图上被擦掉、太阳与飞船凝住、星海冻结、时间河流也似停下
context_fact: 自然选择号正以百分之一光速航行于木星土星间，但周围天体过于遥远，肉眼看不出位置变化。
image_mechanism: 空间尺度不是简单缩小运动，而是把位移降到感知阈值以下，叙述用‘抹去’把不可见变化写成主动删除。
property_alignment: 1）宇宙景象对应图画；2）物体位移对应线迹；3）巨大距离对应橡皮；4）缺少参照对应空白；5）视觉静止对应擦净结果。
context_alignment: 章北海行动后进入等待，宇宙视觉冻结让他与东方的伦理争论脱离速度感，形成漫长孤绝。
narrative_function: 解释高速航行为何显得静止，并把叛逃转折后的节奏降到沉默对峙。
transfer_rule: 距离抹运动时，应说明角位移、参照缺失和观察时长，让擦除对应感知机制。
failure_boundary: 飞船仍在高速运动，距离没有改变物理速度；长时或仪器观测能重新显出位移。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 在缺乏近距参照的星际空间，百分之一光速的自然选择号和远方天体从视觉上都显得完全静止
vehicle: 一只巨大的手或橡皮把画面中的运动痕迹擦除，只留下静态星点和不变构图
ground: 1）距离对应擦除者；2）视运动对应笔迹；3）星空对应画面；4）近参照缺失对应轨迹被抹；5）高速飞船对应静止图形；6）时间感停顿对应画面冻结。
