tenor: 联合国大会厅向前倾斜的高大黄色主席台背景墙
vehicle: 临头耸立、随时可能塌落的悬崖绝壁
ground: 1）高大陡直对应绝壁；2）向前倾斜对应欲倾倒；3）穹顶压力对应山体压顶；4）身处下方的不安对应临崖受威胁。
