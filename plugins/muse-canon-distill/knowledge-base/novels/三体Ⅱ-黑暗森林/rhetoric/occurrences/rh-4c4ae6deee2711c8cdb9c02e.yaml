figure_type: simile
quote: 像一面随时都可能倾倒的悬崖绝壁
sensory_mapping: 高度、倾角、压顶、坠落预感
context_fact: 罗辑初入大会厅，观察倾斜大壁和与其分离的星空穹顶，感到整个环境可能倾覆。
image_mechanism: 室内建筑骤变为头顶山体，静止倾角被读成下一秒的坍塌运动，身体先于思想感到历史压力。
property_alignment: 1）墙面对应岩壁；2）前倾对应将倒；3）穹顶对应上方重压；4）会众对应绝壁下的人。
context_alignment: 人类文明正面对从天外压来的毁灭，墙体本有的倾斜让危机无需脱离场景便获得物理形态。
narrative_function: 把大会厅变成人类处境模型，并让罗辑走向主席台等同走到灾难压迫的正下方。
transfer_rule: 以险地比建筑，应从真实尺度、倾角和观看位置推出潜在运动，再让该运动呼应人物所临危机。
failure_boundary: 建筑并未真的失稳；若叙事需要客观工程判断，悬崖联想会把主观压迫误作结构危险。
