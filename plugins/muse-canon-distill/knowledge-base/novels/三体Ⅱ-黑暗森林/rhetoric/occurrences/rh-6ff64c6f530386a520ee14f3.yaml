quote: 刺骨的寒冷像晶莹的闪电，瞬间击穿了他意识中的迷雾，照亮了一切
sensory_mapping: 冰冷电光、雾层击穿、瞬时全亮、身体贯穿
context_fact: 罗辑在冰面构造纯净思想平台，冰破落水时突然领悟黑暗森林真相。
image_mechanism: 冷觉沿全身神经聚成一束透明电弧，先撕开意识雾层，再以一次过曝照见此前隐藏的逻辑结构。
property_alignment: 1）寒冷对应闪电；2）刺骨感对应电击；3）认知迷茫对应雾；4）顿悟对应照明。
context_alignment: 冰水真实提供晶莹与刺骨，顿悟确在入水瞬间发生，物理冲击和认知突变在时间上严密对齐。
narrative_function: 将理论发现锚定一次生死感官事件，使抽象真相带有不可遗忘的冷与光。
transfer_rule: 顿悟如闪电应有骤然身体或外界触发、明确被击穿的认知障碍和瞬时可见的新结构。
failure_boundary: 寒冷不必然产生正确理论，洞见仍依赖此前长期思考；渐进理解不适用一次闪电全亮。
