quote: 那好像总是带着笑意的眼神中藏着一股无形的杀气
sensory_mapping: 目光锐度、隐藏空间、无形刀锋、被瞄准感
context_fact: 罗辑主动辩解车祸后，史强困倦的眼睛骤然锐利，并指出罗辑先提到案件。
image_mechanism: 眼睛成为有夹层的容器，笑意在外，职业猎手的利刃从内层突然顶出。
property_alignment: 1）笑眼对应外壳；2）杀气对应暗藏武器；3）史强审视对应瞄准；4）罗辑恐慌对应受威胁者。
context_alignment: 史强外表粗俗随和，却是经验老到的刑警；内藏锋刃准确呈现罗辑第一次看见其专业本相。
narrative_function: 扭转地下室对话的权力关系，预告史强能识破骗局、后来适合保护面壁者。
transfer_rule: “藏锋”式目光要先建立可误导的表层表情，再由具体话语或动作触发内层威胁显露。
failure_boundary: 锐利目光不证明真实杀意，此处“杀气”是罗辑的受审感；用于普通专注会过度犯罪化。
