chapter: 正文
figure_type: metaphor
quote: 罗辑就有时光倒流的感觉
sensory_mapping: 时间水流反向、旧楼从下游漂回、往日人物重新出现、观察者站回熟悉岸边
context_fact: 新生活五村由早期冬眠者居住，建筑和日常场景都近似罗辑原时代，与地下城形成强烈反差。
image_mechanism: 空间移动被改写成时间逆行，未来内部保留的旧式社区像河道回湾，让人物无需真穿越便抵达熟悉年代。
property_alignment: 1）时代推进对应水流向前；2）旧式小区对应上游景观；3）车进入绿洲对应逆流；4）冬眠者对应过去遗民；5）熟悉感对应重到旧岸；6）地下城离开对应从未来退回。
context_alignment: 人物真实经历过冬眠式单向时间旅行，此刻却在未来看见保存的过去，‘倒流’精准表达第二次方向相反的错觉。
narrative_function: 给连续未来奇观降速，建立冬眠者与现代社会之间的缓冲地带和怀旧共同体。
transfer_rule: 时光倒流应由成组旧物、旧习与空间边界共同触发，并明确观察者先经历了哪个较新的时间层。
failure_boundary: 年代没有实际逆转，居民年龄、社会制度和外部环境仍属未来；怀旧外观不能恢复逝者。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 罗辑进入地面冬眠者社区后，熟悉的六层楼、老人、母亲和儿童让他主观上仿佛回到两个世纪前的生活环境
vehicle: 时间河流或箭头反向运行，把已经过去的年代重新送回观察者眼前
ground: 1）历史时间对应流向；2）未来到旧景对应逆流；3）熟悉建筑对应回到上游地标；4）旧式生活对应过去重现；5）罗辑体验对应逆行旅人；6）冬眠者社区对应时间回湾。
