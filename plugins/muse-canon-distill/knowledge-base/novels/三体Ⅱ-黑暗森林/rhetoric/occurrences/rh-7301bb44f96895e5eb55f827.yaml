quote: 地球是人类共同的家园，我们绝不能抛弃她
sensory_mapping: 住所边界、庇护、离家动作、亲属称呼
context_fact: 中国代表支持宣布逃亡主义非法，理由是必须维护平等生存权与国际团结。
image_mechanism: 行星缩成一所共有住宅并获得女性人格，选择逃亡被重写为在灾难时遗弃家人。
property_alignment: 1）地球对应家园；2）人类对应家人；3）危机对应家庭灾难；4）逃亡对应抛弃；5）团结对应共同守家。
context_alignment: 政治发言需要把资源分配伦理转成普遍家庭义务；亲属化措辞能迅速召集忠诚，也暴露其道德施压。
narrative_function: 浓缩反逃亡主义的价值基础，让政策的平等诉求与情感强制同时显现。
transfer_rule: 家园隐喻用于共同体时，应标清成员、庇护资源、离开代价与谁有权决定去留。
failure_boundary: 家庭可以迁移，行星也未主动要求忠诚；该意象不能自动证明禁止一切逃亡在法律和分配上正当。
