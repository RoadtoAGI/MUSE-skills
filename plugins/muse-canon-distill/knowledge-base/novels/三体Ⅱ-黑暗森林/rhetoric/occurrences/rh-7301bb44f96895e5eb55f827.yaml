tenor: 全体人类共同居住且必须共同承担命运的地球
vehicle: 所有家庭成员共享、具有女性人格并不可遗弃的家与母亲般主人
ground: 1）全人类居住地对应共同住宅；2）资源与生存依赖对应家提供庇护；3）逃亡者离开对应抛家；4）代词“她”对应被珍爱且需忠诚的女性亲属。
