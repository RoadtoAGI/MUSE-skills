quote: 如果你把它类比为小木船对航母的话
sensory_mapping: 木船、巨舰阴影、水下潜伏、船底爆炸
context_fact: 吴岳以木船不能击沉航母质疑胜利信念，章北海援引历史特战并设计核弹潜水员方案回应。
image_mechanism: 四百年星际战争缩进一条近海航道，文明量级化为一小一巨两艘船，弱者通过改变接触位置绕开火力差。
property_alignment: 1）人类对应木船；2）三体舰队对应航母；3）技术差对应吨位火力差；4）非常规战略对应水下伏击；5）核武对应贴底炸弹；6）胜利对应击沉。
context_alignment: 二人都是海军军官，木船、航母和提尔匹兹案例属于共同专业经验，类比能直接检验“例外胜利”而非抽象鼓舞。
narrative_function: 显露章北海公开信念的论证方式，也保留吴岳对小概率传奇不能普适化的反驳。
transfer_rule: 弱强类比应先承认正面参数差，再设计可改变接触条件的具体路径，并分开“可能一次成功”与“通常可行”。
failure_boundary: 三体战争的传感、距离和防御机制不等于海上伏击；历史个例不能提供星际方案的概率证据。
quality_assessment: exemplary
