tenor: 技术悬殊的地球文明对抗三体文明并谋求一次例外胜利
vehicle: 小木船避开正面对决，载潜水员潜伏航道并把核弹贴到航母船底
ground: 1）地球低技术对应小木船；2）三体高技术对应航母；3）正面作战必败对应木船火力不足；4）胆略与隐蔽行动对应潜水伏击；5）一次战略奇袭对应贴底核爆；6）无需普适胜率对应一次例外即可。
