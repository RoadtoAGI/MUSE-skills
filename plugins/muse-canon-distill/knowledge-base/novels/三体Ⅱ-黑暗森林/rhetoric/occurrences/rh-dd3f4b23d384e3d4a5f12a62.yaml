chapter: 正文
figure_type: simile
quote: 就像某种因持续存在而不为人察觉的背景音消失了
sensory_mapping: 覆盖太阳系的无形嗡鸣忽然切断，罗辑耳中并未听见声响，却感觉空间像撤走一层持续震动
context_fact: 三体球体回答已让水滴停止向太阳发波，罗辑没有核实手段，且明确知道人类感觉不到电磁辐射。
image_mechanism: 不可感辐射借‘适应后的背景音’获得负感知模型：对象存在时忽略，撤除时由差值显形。
property_alignment: 1）电磁波连续性对应恒定噪声；2）感觉阈限对应习惯忽略；3）关停对应静音；4）解除压迫对应环境突静。
context_alignment: 几秒前世界刚被描述为静音，背景音消失再次用现代听觉经验表达无形信号，却保留‘也许是幻觉’的谨慎。
narrative_function: 给第一项威慑让步一个即时身体反馈，在正式观测核实前让谈判产生现实转折感。
transfer_rule: 不可感持续量作背景音时，应写出适应机制、关停时点、差值感受和无法直接核实的边界。
failure_boundary: 电磁波不是可听声，罗辑也承认可能是幻觉；该类比不能作为水滴已停发的测量证据。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴停止压制太阳后，罗辑虽不能感知电磁波，却主观觉得周围持续压力突然解除
vehicle: 长久存在的背景噪声被听觉适应而忽略，声音骤停后，听者反而从异常安静中意识到它曾存在
ground: 1）持续电磁压制对应背景音；2）人不能直接感知对应听觉适应；3）停止发射对应声音切断；4）空间微变对应静默反差；5）事后觉察对应消失才被注意。
