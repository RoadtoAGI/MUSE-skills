chapter: 正文
figure_type: simile
quote: 像一根被遗弃在那里的枯树干
sensory_mapping: 罗辑的四肢收拢成一截黑枯木，贴在闪动画面底部，双眼无光，像早被主人忘在角落
context_fact: 主任在脏衣与垃圾中才找到罗辑，他瘦得难撑体重，目光空洞，缓慢点头才证明仍活着。
image_mechanism: 身体的瘦、暗、静被木材化，‘被遗弃’再把家庭、公众和自我照料的断裂压入空间位置。
property_alignment: 1）躯干形态对应木段；2）缺乏活力对应枯死；3）皮肤暗瘦对应干木；4）独处墙角对应弃置。
context_alignment: 信息墙彩光不断变化，罗辑却像不响应画面的死木，动态背景进一步凸显他的静止。
narrative_function: 把精神崩溃推到近似生命耗尽，为两个世纪磨难‘压垮’他的结论提供肉身图像。
transfer_rule: 人物作枯木时，应匹配形态、水分或生命感、静止姿态和被放置位置，避免只因瘦而套用。
failure_boundary: 罗辑仍有意识、语言和后续行动，枯木不能说明其真实死亡或永久失去恢复能力。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 瘦弱、暗黑、木然蜷在墙角且几乎没有生命反应的罗辑身体
vehicle: 一段失去枝叶和水分的枯树干，被人丢在角落，颜色发暗、僵硬静止且无人理会
ground: 1）瘦长身体对应树干；2）面容憔悴对应枯萎；3）木然不动对应木质僵硬；4）角落孤置对应被遗弃；5）生命耗尽对应枯死。
