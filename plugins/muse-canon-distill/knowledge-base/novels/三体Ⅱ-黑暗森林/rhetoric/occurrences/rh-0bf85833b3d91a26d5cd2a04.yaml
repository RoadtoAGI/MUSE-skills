chapter: 正文
figure_type: simile
quote: 强大的重力使血泊的液面像镜面般平整和纹丝不动，像是固态
sensory_mapping: 翻涌血液骤然压平、杂质下沉、表面亮成红镜、液体仿佛凝住
context_fact: 超重使血液杂质沉淀、液面稳定，上方人员已被压成无法辨形的骨肉。
image_mechanism: 通常流动混浊的血获得光洁镜面和固体静止感，暴力越强，画面反而越整齐安静。
property_alignment: 1）血泊表面对应镜片；2）清澈对应玻璃质；3）无波纹对应固体；4）重力压平对应精密抛光。
context_alignment: 水滴的完美镜面曾被误认作善，此处同样完美由人体毁灭生成，反驳形式美等同伦理善。
narrative_function: 在碎骨声后制造令人窒息的静止画面，为红宝石封存意象提供物理表面。
transfer_rule: 液面作镜与固体时，应给出压平、澄清、止波的过程，并利用动因与结果之间的情感反差。
failure_boundary: 血仍是液体，离开持续加速度会重新流动；镜面相似只涉及平整、静止和反光。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 球形舱底部的血液在持续强加速度下快速沉淀并形成极其平坦、无波动的清澈液面
vehicle: 镜面具有绝对平整的反光表面，固体表层保持形状不出现液体波纹或晃动
ground: 1）血面对应镜面；2）平整对应抛光；3）纹丝不动对应固态定形；4）清澈反光对应镜质。
