chapter: 正文
figure_type: metaphor
quote: 女孩儿的眼睛是他的天堂
sensory_mapping: 清澈入口、安宁乐土、被接纳、痛苦消退
context_fact: 成为面壁者后所有人以怀疑目光看罗辑，庄颜却只问他是否很难。
image_mechanism: 庄颜的双眼扩展成一处可进入的无审判空间，罗辑从公共身份的压力中退入其中，短暂获得安宁。
property_alignment: 1）眼睛对应天堂入口与空间；2）清澈对应纯净；3）不怀疑对应无审判；4）关怀对应庇护。
context_alignment: 面壁者制度使目光成为监视与猜疑工具，唯独这双眼提供反向体验，因此“天堂”有明确社会压力作地狱式背景。
narrative_function: 解释罗辑为何迅速依恋庄颜，并把她确立为逃离面壁身份的私人庇护。
transfer_rule: 把人物目光写成乐土，应先建立其他目光造成的压力，再让接纳、纯净和安全共同支撑空间转换。
failure_boundary: 短暂无猜疑不等于永久庇护，庄颜也不能消除现实责任；缺少对照压力时“天堂”易成空泛赞美。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 庄颜不带审视和怀疑的清澈目光给予罗辑的安全、接纳与幸福
vehicle: 使人脱离痛苦、获得完全安宁与幸福的天堂
ground: 1）目光无怀疑对应无威胁乐土；2）第一次被关怀对应得到庇护；3）眼神清澈对应天堂纯净；4）罗辑感动落泪对应极乐慰藉。
