tenor: 在基础物理被智子封锁时发展辐射驱动飞船：目标技术极难达到，投入又可能无限吞噬时间资源
vehicle: 前方既是一座无法翻越的高峰，又是一口投入物会持续坠落、永不见底的深渊
ground: 1）技术难度对应峰高；2）研发攀登对应登山；3）物理封锁对应不可逾越；4）资源投入对应坠入深渊；5）失败无成果对应不见底；6）路线选择对应走向险地。
