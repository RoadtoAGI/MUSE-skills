quote: 一个不可逾越的技术高峰，它也是一个无底深渊
sensory_mapping: 绝壁高耸、攀登无路、黑渊张口、资源不断下坠
context_fact: 三体虚拟世界讨论是否干预章北海，主愿让人类选择辐射驱动，因为判断该路线会耗尽资源而失败。
image_mechanism: 同一技术目标同时向上拉成绝峰、向下裂成无底洞：研究者面对的是高度，投入物面对的是深度，两种垂直尺度共同表示失败陷阱。
property_alignment: 1）辐射驱动技术对应高峰；2）科研人员对应登山者；3）智子封锁对应绝壁；4）时间资源对应坠落物；5）无成果对应深渊无底。
context_alignment: 高峰解释为何主不怕突破，深渊解释为何主动允许人类投入，两个喻体分别承担难度与战略诱捕机制。
narrative_function: 揭示三体不干预章北海的理由，让他的胜利主义选择同时显出可能落入敌方陷阱的反讽。
transfer_rule: 双重地形类比应给每个方向独立任务：峰写达到难度，渊写沉没成本，不能让两个宏大意象争夺同一空泛含义。
failure_boundary: 技术路线后来可能因工程创新跨越障碍，资源投入也会产生旁支成果；ETO判断并非未来事实。
quality_assessment: exemplary
