chapter: 正文
figure_type: simile
quote: 只留下灰暗，就像雨后仍被阴云覆盖的天空
sensory_mapping: 眼里的雨像已停、灰云仍压满瞳孔、没有一缕光从云后透出
context_fact: 蓝西追问高层症候根源，东方意识到太空封闭环境会根本改变人类精神，却突然说不出具体答案。
image_mechanism: 情绪分层为天气过程：表面的忧伤可退，覆盖整个视野的阴霾仍存，显示更深层认知危机。
property_alignment: 1）眼睛对应天幕；2）泪与忧伤对应降雨；3）精神灰暗对应云层；4）希望对应阳光；5）失语对应低压停滞。
context_alignment: 前文高层眼中阳光消失、阴霾扩散，此处个人天气图把群体症候集中到舰长眼内，并新增雨后不晴的过程。
narrative_function: 让东方未说出的判断以视觉完成，推动蓝西从个体谈话转向星舰社会本质。
transfer_rule: 眼神作雨后阴天时，应区分已结束的显性事件与仍覆盖的深层状态，用光线变化呈现情绪层次。
failure_boundary: 眼睛没有真实天气，灰暗可能受照明影响；阴云意象不能替代对东方具体想法的追问。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 东方延绪谈及星舰环境改变人性时，眼中短暂忧伤褪去，留下更深、更无光的绝望
vehicle: 雨已经停下，天空却仍被厚重阴云覆盖，湿冷灰暗持续，看不到放晴迹象
ground: 1）眼神对应天空；2）忧伤泪意对应雨；3）雨停对应显性情绪消失；4）灰暗绝望对应阴云；5）无希望对应未放晴。
