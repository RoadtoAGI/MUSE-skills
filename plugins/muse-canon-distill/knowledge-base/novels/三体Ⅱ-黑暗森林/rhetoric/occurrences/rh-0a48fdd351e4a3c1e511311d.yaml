quote: 这是一句咒语
sensory_mapping: 黑点符文、太阳祭坛、咒声远传、百年后灾祸显影
context_fact: 罗辑向PDC提交三幅恒星位置图，不解释黑暗森林原理，只说作用至少五十年后发生且将是灾难性的。
image_mechanism: 数学坐标被折叠为符文，太阳成为把低声咒句放大到宇宙的施法器；真正杀伤者仍藏在黑暗中，仿佛被语言召来的力量。
property_alignment: 1）恒星构图对应咒语文本；2）罗辑对应施术者；3）太阳增益对应施法媒介；4）187J3X1对应被诅咒者；5）黑暗森林打击者对应神秘力量；6）毁灭对应咒效。
context_alignment: 罗辑尚不能向会议公开推理，且结果跨越百年、执行者不可见，‘咒语’准确保留可操作步骤与因果黑箱。
narrative_function: 为黑暗森林威慑实验提供可记忆名称，既维持悬念，又让PDC的嘲笑与三体的恐惧形成信息差。
transfer_rule: 把技术行动写成咒语，应让短信息、明确目标、隐蔽执行者和延迟后果逐项成立；已知机械因果不必神秘化。
failure_boundary: 广播本身不产生杀伤，目标是否有生命、是否被攻击都未知；将相关后果归为咒效会掩盖第三方文明的选择。
