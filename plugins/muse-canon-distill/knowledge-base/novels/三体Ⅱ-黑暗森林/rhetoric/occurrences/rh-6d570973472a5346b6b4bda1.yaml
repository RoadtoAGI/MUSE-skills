tenor: 罗辑预想黑暗森林打击将彻底毁灭地球，使自己的遗骸与整个世界同时解体
vehicle: 一场尺度扩大到整颗行星的火化，把遗体和周围一切烧散成无法辨认、无法收存的微粒
ground: 1）地球毁灭对应火化；2）世界对应被火化遗体；3）宇宙打击能量对应炉火；4）物质离散对应骨灰散开；5）文明消失对应身份不可辨认。
