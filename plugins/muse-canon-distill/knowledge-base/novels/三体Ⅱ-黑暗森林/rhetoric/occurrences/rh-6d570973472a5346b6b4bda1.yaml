quote: 他的骨灰同这个世界一起在一场更为宏大的火化中变成离散的原子
sensory_mapping: 小火化炉向行星尺度扩张，罗辑的灰与城市山海一同灼散，最后只剩漂开的原子
context_fact: 罗辑挖好浅墓后想到自己通常会被火化，又判断黑暗森林打击很可能不久便毁灭整个世界。
image_mechanism: 个人死亡仪式突然放大为全球物理过程，火化炉与行星毁灭共用高温分解和形体消失的动作链。
property_alignment: 1）个人遗体对应地球世界；2）普通炉火对应宇宙打击；3）骨灰对应离散原子；4）葬礼终结对应文明终结。
context_alignment: 意象从罗辑刚挖的墓和对火化归宿的思考自然升级，个人死与世界死在威慑前夜重合。
narrative_function: 把罗辑自杀从私人绝望提升为行星同归于尽的前奏，并为下一幕以死亡作筹码蓄势。
transfer_rule: 由个人事件放大到集体灾难时，应保持同一物理过程的输入、作用力和残留物，再改变尺度。
failure_boundary: 黑暗森林打击方式尚未知，世界未必经历真实燃烧或火化炉式过程；原子也不会等同日常骨灰。
