chapter: 正文
figure_type: simile
quote: 他们的警服像警灯那样狂闪着
sensory_mapping: 制服爆闪、亮度压场、警示节律、旁人眯眼
context_fact: 飞车坠毁后警车降落，警察拉起隔离线；周围市民服装也在显示惊恐图像，但警服更亮。
image_mechanism: 警示装置从车辆移到人体表面，制服不只代表身份，而成为全身发光的移动警灯，靠亮度夺取现场注意。
property_alignment: 1）警服对应警灯；2）动态图像纤维对应闪光灯源；3）警察移动对应警灯移动；4）狂闪对应紧急节拍；5）盖过市民衣服对应优先警示。
context_alignment: 未来所有衣服都能显示情绪，警服把同一技术制度化为现场控制信号，类比说明其功能而非只写炫目。
narrative_function: 一笔展示未来警务视觉规范，也以过强闪光延续这个时代界面无处不在的感官压力。
transfer_rule: 可穿戴设备类比信号灯时，应对齐光强、闪烁节律、识别功能和使用场景，使媒介迁移可执行。
failure_boundary: 警服是大面积柔性显示而非旋转灯具，闪光也会随现场结束而停止；不能由外观推断电路相同。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 警察到达事故现场后，警服表面以高亮、快速频闪方式发出醒目的警示信号
vehicle: 警车警灯用强烈周期闪光压过周围光线，标识紧急状态和警务边界
ground: 1）警服表面对应灯罩；2）快速变光对应警灯频闪；3）高亮度对应警示强光；4）警察身份对应警务标志；5）隔离现场对应紧急状态。
