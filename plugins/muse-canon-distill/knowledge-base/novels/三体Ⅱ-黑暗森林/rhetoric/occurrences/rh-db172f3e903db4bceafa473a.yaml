quote: 她不再是一座被废弃的古代要塞，而是一面更远古的崖壁
sensory_mapping: 巨壁、幽洞、摇曳火点、年代后退
context_fact: 航母工程将停，焊花变稀；章北海刚以木船奇袭论述低技术也可能胜利。
image_mechanism: 舰船沿文明时间轴反向退化：先是古堡，再剥去人工石块成为岩壁，剩余焊火化作穴居者火种。
property_alignment: 1）船体对应崖壁；2）舱孔对应洞穴；3）焊工对应穴居者；4）焊花对应原始火；5）停工倒退对应年代远古化。
context_alignment: “唐”号本是现代海权象征，吴岳因技术崇拜把其停工读成文明倒退；更远古意象精确加深绝望。
narrative_function: 将两位军官的思想分歧投到同一船体上，章北海见火种，吴岳见退化遗迹。
transfer_rule: 连续改写同一物体的历史身份时，应保持形体与光点等锚点不变，只改变其时代解释。
failure_boundary: 航母停工不等于文明退回史前，洞火也可象征新生；这是吴岳失败主义的主观幻象。
