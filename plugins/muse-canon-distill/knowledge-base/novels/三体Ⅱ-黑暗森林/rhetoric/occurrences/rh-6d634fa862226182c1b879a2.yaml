quote: 星舰地球成为未来文明雪球的一个内核
sensory_mapping: 五舰压成雪粒核心、沿星际坡面滚行、每到一处便裹上新层、最终长成庞大文明球体
context_fact: 公民热烈制定宪法、筹划选举，并期待舰队抵达多个行星系后扩展为新文明。
image_mechanism: 制度扩张被转换为滚动聚积，起点之小、增长过程和核心延续在一个动态物体中并存。
property_alignment: 1）五舰人口对应雪核；2）航程对应坡道；3）新资源对应附着雪；4）制度传承对应内核保留；5）规模增长对应球径扩大。
context_alignment: 比喻来自人们乐观展望，却忽略太空资源稀缺；可滚雪球的丰雪环境与真实真空形成反讽。
narrative_function: 记录星舰社会短暂的扩张想象，为燃料不足和互杀结论制造理想坍塌。
transfer_rule: 组织增长作雪球时，应交代可黏附资源、滚动环境、核心继承与增长成本，检验外部条件是否真实。
failure_boundary: 太空不会自动提供人口和工业资源，雪球增长近乎被动，文明扩张却需主动建设且可能分裂。
quality_assessment: effective
