review_status: reviewed
tenor: 人们设想五舰小社会以现有人口制度为起点，沿途吸纳资源与成员，逐步扩大为未来文明
vehicle: 小雪核沿坡滚动，周围雪不断黏附，雪球越滚越大而核心始终保留在中心
ground: 1）星舰地球对应雪核；2）初始文明对应小体量；3）经过星系对应滚动路径；4）吸纳人口资源对应黏雪；5）文明扩大对应雪球增大。
