tenor: 罗辑冬眠中残存意识停止日常体验，却仍被客观时间带向未来苏醒点的过程
vehicle: 一根横贯过去未来、空间静止的无限银丝，灵魂如珠子穿在线上匀速滑行
ground: 1）银丝延展对应时间轴；2）两个方向对应过去未来；3）灵魂穿线对应个体处于时间；4）匀速滑动对应时间均匀流逝；5）世界缩成细丝对应意识只保留时序；6）未知终点对应未来苏醒。
