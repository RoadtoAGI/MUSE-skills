quote: 这是时间之线，细丝本身是静止不动的，向两个方向无限伸延，罗辑的灵魂穿在丝上，以恒定的速度轻轻滑向不可知的未来
sensory_mapping: 极细银线、黑暗两端、灵魂穿珠、匀速滑行
context_fact: 罗辑生命垂危后被紧急冬眠，意识中的雪白世界和自我逐步消失，只余微弱时序感。
image_mechanism: 三维世界被压缩到一维银线，身体和景物全撤去；灵魂缩成线上滑件，无需行动便被恒定速度送向黑暗远端。
property_alignment: 1）时间对应银丝；2）过去未来对应两端；3）罗辑灵魂对应穿线珠；4）冬眠过程对应滑行；5）苏醒未知对应不可见终点。
context_alignment: 冬眠主观上删去空间与事件，只保留从现在到未来的迁移，一维线模型与这种体验高度贴合。
narrative_function: 用极简图像完成时代跳跃，将罗辑从危机纪年第八年送入未知未来。
transfer_rule: 时间线意象应把维度、方向、主体位置和速度逐项定义，并让叙事情境确实削弱其他感官维度。
failure_boundary: 个体冬眠中不会连续感知滑行，时间也不必是静止实体；复杂回忆或非线性叙事不适合单一匀速线。
