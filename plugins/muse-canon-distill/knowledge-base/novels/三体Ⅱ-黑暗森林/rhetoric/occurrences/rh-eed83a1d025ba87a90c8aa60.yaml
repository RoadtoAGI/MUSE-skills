chapter: 正文
figure_type: simile
quote: 发射的景象很像日出的快镜头
sensory_mapping: 黑暗突亮、红天、金色水面、上升轨迹、时间加速
context_fact: 科学家们隔湖观看深夜发射，只能看清箭尾巨焰；它照亮湖面和天空后迅速消失。
image_mechanism: 数小时的天体晨昏被剪成几十秒发射镜头，火箭烈焰临时充当太阳，随后夜色像剪辑反向吞回画面。
property_alignment: 1）火箭烈焰对应太阳；2）升空对应日出；3）照亮天地对应黎明；4）高速过程对应快镜头；5）恢复黑暗对应短暂晨光终止。
context_alignment: 观看距离抹去箭体只留下光源，湖面和薄云又提供完整日出光效；“短暂黎明”同时暗示科研希望被军事黑夜接管。
narrative_function: 把技术发射写成壮丽却转瞬即逝的希望，建立科学家喜悦与随后失落的明暗节奏。
transfer_rule: 用自然天象比人工事件时，可让光源、运动、环境反射和持续时间逐项对应，并利用时间尺度差产生新意。
failure_boundary: 火箭没有太阳的持续供能和周期必然性；若场景看得清箭体或发生于白昼，日出图像会失去物理支点。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 远处火箭升空时光芒迅速照亮又离开夜间湖区的全过程
vehicle: 把日出加速播放、黎明顷刻出现又越过画面的影像
ground: 1）烈焰从地平附近上升对应太阳升起；2）黑暗世界骤亮对应加速黎明；3）湖面金波对应日光反射；4）火箭很快消失对应快镜头压缩时间；5）短暂亮光被夜色覆盖对应黎明倒退。
