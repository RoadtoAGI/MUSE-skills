figure_type: simile
quote: 成为一个非常庞大粗陋的不规则体，但更像一个远行者了
sensory_mapping: 战舰卸下整齐军装、外壳挂满粗大行囊、载着燃料与遗物独自走入星际长夜
context_fact: 蓝色空间号回收三舰资源，因舱内放不下而增加多个外部存储舱，随后离开陵墓。
image_mechanism: 形体破坏不再表示受损，而像行李增加后的旅行准备；粗陋外观被功能目的重新赋值。
property_alignment: 1）舰体对应身体；2）存储舱对应背包；3）聚变燃料对应旅粮；4）备件对应工具；5）星际航线对应长路。
context_alignment: 它从军队编制和伊甸园共同体中脱离，‘远行者’比‘战舰’更符合单舰文明的新身份。
narrative_function: 用外观变化标记功能和社会身份变化，结束葬礼后把叙事重新推向远航。
transfer_rule: 载具作远行者时，应让外挂、资源、路程、身份转变和外形代价一一对应，功能优先于整洁。
failure_boundary: 飞船没有身体疲劳或个人意志，外挂舱是工程结构而非随身行李，旅程由全体公民操控。
quality_assessment: exemplary
