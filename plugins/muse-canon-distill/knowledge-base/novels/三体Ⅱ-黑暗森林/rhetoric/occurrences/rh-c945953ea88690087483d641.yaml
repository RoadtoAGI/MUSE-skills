tenor: 蓝色空间号把大量燃料和八倍配件装进外挂舱，外形失去军舰整洁，却具备长期独自星际旅行的物资
vehicle: 远行者把生存用品和行李挂满身体，外表笨重粗陋，但每件负载都为漫长道路服务
ground: 1）飞船对应旅人；2）外挂舱对应行囊；3）燃料配件对应路资；4）不规则外形对应负重装束；5）驶向深空对应远行；6）文明记忆对应旅人身份。
