chapter: 正文
figure_type: simile
quote: 警报声响彻飞船，如同来自黑暗太空的万鬼哭号
sensory_mapping: 寂静飞船骤被万重哭声灌满、黑太空像鬼门打开、警报从每面舱壁向章北海扑来
context_fact: 终极规律号已发射隐形次声氢弹，自然选择号只剩四秒，系统同时跳出大量来袭信息。
image_mechanism: 机器报警被人格化为尚未死去者的预先哭丧，声音数量与死亡人数、黑暗来源同时叠加。
property_alignment: 1）警报器对应群鬼；2）报警音对应哭声；3）太空方向对应冥界来处；4）导弹杀伤对应死亡召唤；5）声遍全舰对应万鬼包围。
context_alignment: 章北海刚讨论下地狱，警报立即以万鬼声回应，宗教死亡语汇在物理攻击到来时闭环。
narrative_function: 用声音骤变打断章北海操作，宣告对手已先拔枪并将读者拉入四秒终局。
transfer_rule: 灾难警报作鬼哭时，应让声源数量、音色、来向、先前死亡语境和实际威胁同步对应。
failure_boundary: 警报由程序发声，没有亡魂或情绪；‘万鬼’不代表具体死者真实存在或诅咒。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 来袭导弹突破防御后，飞船警报突然以巨大、持续且多重的尖厉声音宣告全舰将死
vehicle: 无数亡魂在黑暗中同时哭喊，声源遍布、凄厉重叠，像从死亡世界向活人索命
ground: 1）多重警报对应万鬼；2）尖厉声对应哭号；3）黑暗太空对应冥界；4）来袭导弹对应鬼魂逼近；5）全舰死亡对应索命结果。
