chapter: 正文
figure_type: simile
quote: 星星在一颗颗消失，仿佛无数只眼睛渐次闭上
sensory_mapping: 天幕上万点亮瞳从暗处逐次合上，墓地上方的宇宙见证者一双双退入晨光
context_fact: 罗辑举枪倒数、三体通过智子监听；东方天色变亮，星星因日光逐渐不可见。
image_mechanism: 天文亮度变化被转成群体眼睑动作，散点消失获得共同方向和观看结束的意味。
property_alignment: 1）星光对应眼中亮点；2）星体分布对应众眼；3）晨光遮星对应眼睑覆盖；4）消失顺序对应逐次闭合。
context_alignment: 此前窗灯、墓碑都成眼睛，此处眼睛扩展到全宇宙；威慑发生时，群星仿佛闭目却智子仍注视。
narrative_function: 为三体显形前制造宇宙见证退场感，并与下一句晨空巨眼睁开形成昼夜接力。
transfer_rule: 星点作闭眼时，应匹配点光、遮蔽顺序、天幕面孔和光源变化，并利用前后动作形成连续。
failure_boundary: 恒星没有真正消失或闭眼，只是晨光降低对比度；不能把天象写成有意回避。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 晨光增强时夜空星点按亮度先后逐颗隐没
vehicle: 分布在黑暗面孔上的无数眼睛依次合拢眼睑，亮瞳一个接一个熄灭
ground: 1）星点对应瞳光；2）天空对应巨大暗面；3）星隐对应闭眼；4）逐颗消失对应渐次合睑；5）夜结束对应停止注视。
