chapter: 正文
figure_type: analogy
quote: 也许在这两个世纪中就沉积了上面这薄薄的一层沙土；而在那漫长的没有人的地质年代里，却生成了承载墓地的这座山
sensory_mapping: 铁锹先穿过薄软沙层，随后撞上坚硬山体；指宽与山高把两个时间尺度同时摆在手下
context_fact: 罗辑为自己挖墓，表层湿土容易挖，往下却遇到石块和山体，只能不断停下休息。
image_mechanism: 无形时间被翻译成可见厚度和可触硬度；同一铁锹的两次触感让‘无力’与‘力量’形成尺度反转。
property_alignment: 1）短暂人类历史对应薄且松的表土；2）无人地质年代对应厚重山体；3）时间流逝对应持续沉积成岩；4）力量大小对应铁锹遭遇的阻力。
context_alignment: 罗辑正在墓地掘土，时间哲思从铁锹真实触感生出；两百年冬眠经历又与表层厚度发生个人尺度呼应。
narrative_function: 把个人跨越两世纪的漫长感压缩为地表薄层，扩大终局前的宇宙尺度，并让挖墓动作带出哲思。
transfer_rule: 表现时间尺度差时，可在同一地点并置两种可测沉积结果，再让人物以同一动作触及二者的厚度或硬度。
failure_boundary: 沉积和成山受气候、构造与侵蚀共同影响，厚度并非时间的均匀刻度；该并置表达尺度，不提供地质年代测量。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 时间本身没有可见力量，但不同长度的时间能积累出悬殊的物质结果，人类两百年在地质尺度前极其短暂
vehicle: 墓地剖面中两百年形成的薄沙层与漫长地质年代形成的整座山体并置，厚度直接显示持续时间
ground: 1）两个世纪对应薄沙层；2）地质年代对应整座山；3）沉积厚度对应时间积累效应；4）铲土受阻对应长时过程的坚实结果。
