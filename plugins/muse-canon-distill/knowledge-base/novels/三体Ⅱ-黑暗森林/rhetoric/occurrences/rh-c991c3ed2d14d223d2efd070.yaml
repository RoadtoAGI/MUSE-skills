quote: 只不过是章北海陪着父亲用语言散步而已
sensory_mapping: 并肩步行、缓慢路线、随意转向、陪伴距离
context_fact: 完成关键三句问答后，父子又谈家事、舰队和太空战，叙述称这些话本身意义不大。
image_mechanism: 语言铺成病房外的一条小路，父子不必离床便能并肩走一段，把临终陪伴藏进话题转换。
property_alignment: 1）两人对话对应同行；2）话题对应沿途景物；3）转题对应转弯；4）无结论对应漫步；5）陪伴对应并肩。
context_alignment: 父亲已临终，真正散步不可能；以语言代替身体同行，温和保存军人父子不直接表达的亲情。
narrative_function: 区分战略信息与情感陪伴，让临终谈话在克制中获得温度。
transfer_rule: 用散步写谈话时，应让节奏、话题迁移和共同目的都偏向陪伴，并与需要抵达结论的对话区分。
failure_boundary: 高压审问、争论或任务会议有明确目的和权力差，不适合散步模型；闲谈也不等于毫无意义。
