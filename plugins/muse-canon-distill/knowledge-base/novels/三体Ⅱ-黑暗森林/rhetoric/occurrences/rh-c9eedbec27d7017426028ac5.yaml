quote: 和雷迪亚兹害怕太阳一样，罗辑从此患上了严重的星空恐惧症
sensory_mapping: 低头避星、畏光回避、天体转危险、寒颤持续
context_fact: 雷迪亚兹此前看太阳时感到核爆与永恒压迫；罗辑刚在冰水中悟到宇宙真相。
image_mechanism: 两个理论各给熟悉天空覆上危险图层：太阳变成核火，群星变成潜伏猎手；知识迫使眼睛从光源撤开。
property_alignment: 1）罗辑对应雷迪亚兹；2）星空对应太阳；3）黑暗森林洞见对应恒星核模型；4）回避仰望对应恐惧症。
context_alignment: 类比跨两位面壁者的知识创伤，说明恐惧并非迷信，而是理解宏大杀伤机制后的感知永久改变。
narrative_function: 把罗辑的新理论与前一面壁者经验串联，并以恐惧证明洞见的可怕分量。
transfer_rule: 知识致恐类比应对齐触发理论、日常对象重估和持续回避行为，不能仅比较都害怕。
failure_boundary: 两人理论内容和对象不同，临床恐惧程度也未诊断；类比只说明认知改变后的回避结构。
