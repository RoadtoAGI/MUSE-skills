tenor: 罗辑领悟宇宙黑暗生存法则后，面对星空便感到其隐藏杀机而不敢抬头
vehicle: 雷迪亚兹由恒星级核毁灭模型联想到太阳力量后，对日光产生持续恐惧
ground: 1）理论顿悟触发对应模型触发；2）普通天体变威胁对应太阳与星空重估；3）不敢观看对应回避光源；4）身体寒颤对应恐惧反应；5）宇宙毁灭尺度对应恒星力量。
