chapter: 正文
figure_type: simile
quote: 寒冷使空气像一块凝固的水晶
sensory_mapping: 透明晶体、空气冻硬、白光封入、身体被冷壁包围
context_fact: 寒风掠过空机场，章北海等人已飞走，常伟思在生日当天感到自己与人类的尽头。
image_mechanism: 本应流动无形的空气被低温冻结成有体积的晶块，人物像被封进透明矿物，能看见远处却难以呼吸到生机。
property_alignment: 1）冷空气对应水晶；2）透明度对应晶体通透；3）萧瑟静止对应凝固；4）寒冷触感对应晶体凉硬。
context_alignment: 太阳只有无力白光、机场空无一人，水晶的透明与冷硬把视觉清晰和情感绝望叠在一起。
narrative_function: 将抽象的冬日死寂变成包围身体的坚硬介质，为‘看见尽头’制造冻结时刻。
transfer_rule: 空气凝固类比应由低温、静滞和透明三项共同支撑，并写出人物仿佛被介质封住的空间后果。
failure_boundary: 空气仍被寒风推动，并未真正成固体；湿雾、热浪或嘈杂人群会破坏水晶的清澈静止。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 严寒机场中空气显得静止、透明、坚硬而缺少流动生机的主观感受
vehicle: 一整块低温凝结、透明而坚硬的水晶
ground: 1）空气透明对应水晶通透；2）寒冷收紧感对应凝固；3）风景静滞对应晶体不流动；4）触体锐冷对应水晶硬凉。
