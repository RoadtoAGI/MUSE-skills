chapter: 正文
figure_type: simile
quote: 目光像西亚的蓝天一样清澈
sensory_mapping: 高原蓝天、无云透明、开阔穹顶、清亮瞳孔
context_fact: 返程中年轻人把步枪放在泰勒手边，听不懂他的问题，只疑问地抬头看他。
image_mechanism: 青年眼睛向上扩展成当地天空，疑问没有形成阴云，目光保持一整片无遮蔽的蓝。
property_alignment: 1）目光对应蓝天；2）清澈对应透明空气；3）稚气对应无云；4）信任开放对应辽阔。
context_alignment: 喻体取自人物所在的西亚山地上空，并与身旁武器形成清澈目光和暴力环境的反差。
narrative_function: 把年轻战士的人性与泰勒寻找的敢死武器并置，回响“萤火虫”母题。
transfer_rule: 地域天空喻眼神应使用现场可见颜色与气候，并让人物当下态度对应云量和透明度。
failure_boundary: 清澈目光不证明青年无暴力经历或政治立场；阴天、尘暴环境中仍照搬西亚蓝天会失真。
quality_assessment: effective
