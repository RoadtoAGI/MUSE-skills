tenor: 未蓄须年轻人带稚气、疑问而没有敌意的清澈眼神
vehicle: 西亚高原上透明、纯蓝、少云的天空
ground: 1）眼神透明对应空气澄澈；2）瞳色明亮对应天空蓝色；3）无敌意对应无云无霾；4）稚气开放对应天空开阔。
