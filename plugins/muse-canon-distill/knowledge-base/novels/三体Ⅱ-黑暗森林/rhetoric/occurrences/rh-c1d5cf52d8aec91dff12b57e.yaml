quote: 把自己像钟摆似的甩到地面上
sensory_mapping: 运动、几何、节奏
context_fact: 蛛网刚被花柄破坏，蜘蛛从峭壁拉丝，连续三次摆到地面重建骨架。
image_mechanism: 把蜘蛛不易看清的结网动作简化为固定支点、弧形摆动、周期往返，读者可立即预演其轨迹。
property_alignment: 1）蛛丝牵引对应摆杆约束；2）蜘蛛身体对应摆锤；3）重复甩动对应稳定周期。
context_alignment: “一万次破坏就重建一万次”的后文强调重复，钟摆的周期感正好把机械、无厌倦的生命活动呈现出来。
narrative_function: 使重建蛛网成为清晰动作，并用机械节律强化微小生命跨越亿年的重复。
transfer_rule: 写悬挂物运动时，选择喻体需对齐支点、轨迹和重复节奏，而非仅凭“摇晃”相似。
failure_boundary: 若蜘蛛沿直线下坠、主动跳跃或支点移动，钟摆的弧线和周期约束便不成立。
