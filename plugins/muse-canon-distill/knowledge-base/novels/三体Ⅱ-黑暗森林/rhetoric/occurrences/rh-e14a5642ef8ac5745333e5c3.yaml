quote: 他们的人生之路只能是这二十个世纪的漫长航程中的一段
sensory_mapping: 二十世纪铺成漫长道路、每个人只走短短一段、后代从脚印处接力、第一颗星仍只是驿站
context_fact: NH558J2距十八光年，预计两千年后抵达，多数现存公民不可能活到目的地，且那里也不宜居。
image_mechanism: 抽象世代时间被铺成可分段路程，个人有限寿命与文明超长目标在同一路线上获得比例。
property_alignment: 1）生命历程对应步行路线；2）寿命长度对应路段；3）星际历史对应全程；4）子孙对应后续行者；5）补给星对应驿站。
context_alignment: 众人刚把飞船当家园，人生道路却只能在移动航程内展开，定居语言与无尽赶路形成张力。
narrative_function: 把两千年数字转成人的代际经验，迫使会议面对目标可能永不由当代人实现。
transfer_rule: 超长计划作道路时，应标明全程、个人路段、交接者和中转节点，使时间尺度可由身体行程感知。
failure_boundary: 人生并非单向均速路线，冬眠会改变主观时间；后代也可能更改目标而不沿原路接力。
