tenor: 现有公民即使冬眠也只能参与两千年星际迁徙的一小段，抵达目标须由后代接续
vehicle: 个人沿道路行走有限路段，长途旅程跨越多个接力者；单个人在中途上下，终点远在其寿命之外
ground: 1）人生对应道路；2）寿命对应可行路段；3）两千年迁徙对应长途航程；4）代际继承对应接力；5）NH558J2对应中转站。
