chapter: 正文
figure_type: simile
quote: 密密麻麻地闪烁着，仿佛是萤火虫的海洋
sensory_mapping: 成千亮点像萤火铺满沙海，明灭随身体晃动起伏，远处边缘沉进夜色
context_fact: 罗辑从车上看到密集闪光，过了一阵才意识到每个光点来自一名城里人的衣服。
image_mechanism: ‘萤火虫’解释单点的生物闪烁，‘海洋’解释数量与范围，两级喻体合成活体光场。
property_alignment: 1）发光衣对应虫光；2）穿衣者对应萤火个体；3）身体微动对应虫群飞动；4）大面积人群对应海面。
context_alignment: 荒凉黑沙漠使生物光点异常醒目，既保留奇观美感，又暗示聚集者受同一情绪驱动。
narrative_function: 强化信徒规模和异质感，为人群整体跪倒、退潮与蚁群等后续群体意象奠基。
transfer_rule: 大规模闪光群作萤火海时，应分别对应单点闪烁与整体范围，并让观察距离解释个体消失。
failure_boundary: 衣灯受设备控制且人群站在地面，不具萤火飞行或海水连续流动；近看时这些属性不能沿用。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 沙漠上成片人群的发光服装在夜色中随身体动作密集闪烁
vehicle: 无数萤火虫聚成看不到单体边界的发光海洋，亮点忽明忽暗并产生起伏感
ground: 1）衣服亮点对应萤火；2）个体密集对应虫群；3）动作明灭对应闪烁；4）覆盖广阔对应海洋；5）群体起伏对应波动。
