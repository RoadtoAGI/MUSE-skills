chapter: 正文
figure_type: analogy
quote: 城市的建筑就像叶子似的挂在这些树枝上
sensory_mapping: 巨干直插天穹、枝桥横伸、楼叶悬挂、立体森林成片
context_fact: 地下城市以支撑穹顶的巨柱兼作建筑基柱，罗辑从高处先误认成森林，后来地址也正式使用树、枝、叶。
image_mechanism: 陌生工程被完整植入植物生长语法：承重方向变成树干，交通平台变成枝条，居住单元像叶片从骨架上长出。
property_alignment: 1）城市支柱对应树干；2）空中桥梁对应枝条；3）建筑单元对应叶片；4）分支层级对应植物拓扑；5）城市群对应森林；6）地址系统对应树枝叶命名。
context_alignment: 喻体先源于罗辑的视觉误认，随后真实功能、分布和命名逐项验证，成为未来城市可持续使用的空间认知框架。
narrative_function: 让读者随罗辑一次看懂地下立体城市，并为飞行人车如蜻蜓鱼群的生态意象搭建整体环境。
transfer_rule: 大型结构用树形类比时，应对齐主干、分支、末端单元和层级寻址，使喻体同时解释外观与组织。
failure_boundary: 城市由人工材料建造且不生长代谢，建筑可独立改造，悬空枝桥的力学也不同于树木；不能推导其为生态系统。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 地下北京以高耸支柱为核心、横向平台分叉并在平台上悬挂建筑的立体城市结构
vehicle: 巨型森林中树干向上生长、树枝横伸、叶片疏密不一地附着其上的植物结构
ground: 1）竖直基柱对应树干；2）横向平台对应树枝；3）建筑对应叶子；4）建筑疏密对应叶片分布；5）多组支柱对应森林；6）地址层级对应树枝叶系统。
