chapter: 正文
figure_type: metaphor
quote: 房间里的一切在阴暗中都像是用湿冷的灰色石头雕成的，整个房间像个墓穴。
sensory_mapping: 视觉、温度、触觉、空间
context_fact: 破壁人二号躺了数小时，阳光已变月光，随后从枕下取枪抵住太阳穴。
image_mechanism: 先让光线把所有材质统一冷却、石化，再把整间地下室封合成墓穴，人物尚未开枪便在感官上进入死亡结果。
property_alignment: 1）灰暗物件对应石雕；2）湿冷地下室对应墓穴环境；3）静止躺卧者对应已被安放的尸体。
context_alignment: 自杀动作尚未出现时，房间已替人物预演死亡；唯一月光提供石材颜色与温度，不依赖抽象悲情词。
narrative_function: 提前封死人物生路，使智子字幕出现成为从“已成墓穴”的空间中突然打入的召回。
transfer_rule: 预示人物结局时，可让光、材质、空间结构和身体姿态逐层向结果状态靠拢，再由情节打断或兑现。
failure_boundary: 明亮、温暖、有人活动的房间不具备墓穴感；若人物没有死亡意图，石化描写会错误放大环境意义。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 破壁人二号准备自杀时阴冷、静止的地下室及其中物件
vehicle: 由湿冷灰石雕成、封闭死寂的墓穴
ground: 1）月光下物件失去颜色和生气对应灰石雕物；2）地下室阴湿封闭对应墓穴；3）男人长久不动并准备死亡对应墓中死者。
