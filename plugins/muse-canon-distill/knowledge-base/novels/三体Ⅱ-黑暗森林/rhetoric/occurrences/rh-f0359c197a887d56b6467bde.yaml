tenor: 水滴及其不断延长的银亮碎片尾迹在金属云中高速转向，贯穿战舰并被爆炸和岩浆分段染色
vehicle: 一条巨大银龙以龙头领航，长身在云中上下翻飞，身上缀着亮珠，尾端被血染红
ground: 1）水滴对应龙头；2）尾迹对应龙身；3）转向轨迹对应翻飞；4）核火球对应身上太阳/明珠；5）熔融残骸对应血染龙尾。
