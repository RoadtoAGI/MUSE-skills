quote: 变成一条上万公里长的银光巨龙
sensory_mapping: 银龙从彗尾中长成、龙头钻穿巨舰、长身盘游云团、小太阳沿鳞身爆开、尾端渐染血红
context_fact: 水滴尾迹延至上万公里，在云内转向追击；被穿透战舰在尾迹中部爆炸，熔融残骸汇入尾部。
image_mechanism: 一系列分散物理事件被组织为有首尾的动物身体，路线、爆点和颜色各占身体部位并随运动连续更新。
property_alignment: 1）攻击体对应龙首；2）银色长尾迹对应龙躯；3）穿舰对应龙首冲撞；4）云内机动对应腾云；5）火球对应鳞上光点；6）红色尾迹对应染血龙尾。
context_alignment: 巨龙在中文文化中常具威势与超凡力量，水滴以压倒性技术驾驭金属云，喻体贴合尺度和文明震撼。
narrative_function: 把整个舰队毁灭合成单一神话生物的舞蹈，令攻击路线成为本节最强视觉中心。
transfer_rule: 延展动物意象应分配头、身、尾、动作与附着细节，让每次续写增加新映射而非重复称名。
failure_boundary: 水滴没有生物身体、意识或情绪，所谓龙身只是短暂碎片尾迹；核爆也非装饰性光点。
quality_assessment: exemplary
