tenor: 叶文洁迅速、笃定地提出两条宇宙社会学公理
vehicle: 动手前已在胸中备好完整竹画的人
ground: 1）回答迅速对应方案预先成形；2）措辞确定对应对整体结构已有把握；3）随后承认思考半生对应长期准备。
