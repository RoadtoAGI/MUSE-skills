chapter: 正文
figure_type: simile
quote: 您这么快就说出来，好像胸有成竹似的。
sensory_mapping: 动作准备、心理确定性、时间
context_fact: 罗辑刚听到两条公理便惊讶其坚实，叶文洁随后说明自己已思考大半辈子。
image_mechanism: 用创作前成图的熟语，把看不见的多年思考压缩为“答案已经备在胸中、此刻直接落笔”的动作。
property_alignment: 1）胸中成图对应理论框架预先形成；2）下笔不迟疑对应叶文洁回答迅速；3）竹的完整轮廓对应两条公理能统领后续体系。
context_alignment: 这是罗辑的即时口语判断，成语化表达符合师生式学术交谈，也为叶文洁的半生思考引出解释。
narrative_function: 提示这并非临时灵感，增加两条公理的分量和叶文洁托付理论的庄重感。
transfer_rule: 使用熟语比喻时，应让紧邻事实补足其准备时长、表现速度和完成程度，避免只靠成语承担信息。
failure_boundary: 若人物只是临场猜测或答案仍很零散，“胸有成竹”会夸大其准备程度；该熟语也不证明理论正确。
quality_assessment: conventional
