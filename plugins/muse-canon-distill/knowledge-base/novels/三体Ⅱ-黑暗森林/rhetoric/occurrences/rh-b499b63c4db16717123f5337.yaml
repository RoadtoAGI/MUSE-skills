chapter: 正文
figure_type: metaphor
quote: 捧着一个人类千古梦想的圣物——捧着的是永动机
sensory_mapping: 双手捧杯、圣物发热、古老愿望凝成实体、持有者心潮翻涌
context_fact: 护士说杯子永远有电，罗辑尚不知道城市使用的是外部无线供电场，便相信未来已经取得无限能源。
image_mechanism: 一个日用品被祭坛化：持续发热从工程现象升格为神迹，杯子成为承载全人类能源梦想的可触遗物。
property_alignment: 1）杯子对应圣物载体；2）无线供电对应被误认的永恒神力；3）能源理想对应宗教愿望；4）罗辑对应朝圣者；5）不肯放手对应珍藏供奉；6）相信时代安全对应信仰确认。
context_alignment: 初醒者缺少供电系统知识，惊奇与误判同时达到峰值；宗教词恰好表现他把单件器物当成文明救赎凭证。
narrative_function: 把罗辑对未来的盲目信任推至顶点，为大史稍后揭穿无线供电原理准备醒目的认知泡沫。
transfer_rule: 把技术样品写成圣物时，应交代长期愿望、可触证物、持有者仪式动作以及由局部样品跃迁到整体信念的过程。
failure_boundary: 杯子既不自生能源也不神圣，只在供电场内工作；单件设备不能证明能源无限或战争必胜。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑把能在无线供电场中持续加热的普通杯子误认成人类已经获得无限能源的决定性技术证明
vehicle: 信徒双手托住世代渴望却从未出现的神圣遗物，其存在足以证明最高愿望已经实现
ground: 1）电热杯对应圣物；2）无限供电对应神力；3）永久能源理想对应千古信仰；4）捧杯不放对应朝圣者托举；5）实物出现对应信仰获证；6）激动相信对应虔敬。
