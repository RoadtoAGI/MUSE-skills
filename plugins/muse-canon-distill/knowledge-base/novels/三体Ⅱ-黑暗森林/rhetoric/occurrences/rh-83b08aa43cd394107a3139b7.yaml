tenor: 幻视中越来越密集并向罗辑与庄颜聚集坍缩的群星运动
vehicle: 海面水量隆起、成片推进并包围岸边的潮水
ground: 1）群星增密对应水体聚集；2）向二人靠近对应潮水涌来；3）广阔星海对应海面；4）连续推进对应潮汐波前；5）宇宙包围对应海潮漫上。
