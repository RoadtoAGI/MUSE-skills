chapter: 正文
figure_type: simile
quote: 星海在变密，像涌起的海潮
sensory_mapping: 潮头隆起、银海推进、密度增加、四面包围
context_fact: 星光已织成巨毯，群星振动奏乐，随后宇宙向二人聚集坍缩。
image_mechanism: 静态星点获得水体体积，远方银光抬成潮头，一层层向中心推进，把宇宙距离压缩为涌浪。
property_alignment: 1）星海对应海洋；2）群星对应水滴浪花；3）密集对应涨潮；4）坍缩聚集对应涌向岸心。
context_alignment: 原文先称“星海”，再用海潮激活其运动；从铺毯到涌潮也让宇宙由平面覆盖转成立体压近。
narrative_function: 推动宇宙幻象达到坍缩高潮，导向一切湮没于爱情之光。
transfer_rule: 潮喻群体聚集要呈现密度、方向和波前速度，不能仅因数量多便泛称海潮。
failure_boundary: 真实恒星没有向二人潮涌，潮水周期性退去也未被映射；此处只服务瞬时坍缩幻视。
quality_assessment: effective
