chapter: 正文
figure_type: simile
quote: 百万吨发着暗红色光芒的金属液放射状地迸射，像怒放的花蕾
sensory_mapping: 暗红花蕾悬在太空、金属花瓣突然翻开、液流向四方伸展、花心迅速空掉
context_fact: 首舰核火球熄灭后，整艘战舰已化成熔融金属并在真空中无阻力飞散。
image_mechanism: 爆炸的放射几何被植物开花捕捉，毁灭在一瞬获得生命性与美感，花瓣却由百万吨岩浆构成。
property_alignment: 1）熔舰核心对应花蕾；2）金属液射流对应花瓣；3）爆发对应怒放；4）暗红热光对应花色；5）径向扩张对应花冠；6）冷却散开对应花瓣凋散。
context_alignment: ‘怒放’的力量与核爆强度相称，又把舰队曾经的壮丽转成毁灭壮丽，形成审美上的残酷连续。
narrative_function: 把首舰彻底消失的过程定格成清晰形态，并引出后方金属岩浆暴雨。
transfer_rule: 放射爆发作开花时，应对齐中心、瓣状射流、展开速度与颜色，同时保留花后消散的代价。
failure_boundary: 金属没有生长、生殖或柔软花瓣，‘怒放’不能美化一舰人员死亡；形似仅持续片刻。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 无限边疆号完全熔化后，百万吨红热金属液从爆心向所有方向高速放射展开
vehicle: 花蕾在短时内猛烈绽开，层层花瓣从紧密中心向外翻展，形成放射状花形
ground: 1）爆心对应花心；2）金属液束对应花瓣；3）放射迸射对应绽放；4）暗红光对应花色；5）由密到疏对应花蕾张开；6）球形扩散对应花冠。
