tenor: 在基础研究和关键技术尚未突破时缺少现实支撑的太空军建设
vehicle: 悬在空中、没有地基承托因而不能真正建成的楼阁
ground: 1）基础科学对应地基；2）武器与舰队体系对应楼阁；3）技术未突破对应无承重支撑；4）当前组织事务对应只画上层结构。
