context_fact: 四年前PDC嘲笑咒语，四年后三体探测器却在同日发射且再次下达诛杀令，斐兹罗反问科学家原来的判断。
image_mechanism: 罗辑复杂行动被社会压成两张戏服：先穿恋爱享乐者外套，再披伪术士长袍；三体反应迫使观众怀疑戏服下另有身份。
property_alignment: 1）罗辑对应角色扮演者；2）隐居家庭对应花花公子生活；3）咒语计划对应巫术；4）人类误判对应把角色当本人；5）三体恐惧对应戏服失效。
context_alignment: 两类称呼分别回扣前两个叙事阶段，又被舰队加速的时间证据当场反转，带有明确的认识论讽刺。
narrative_function: 浓缩人类对罗辑的连续轻视，衬出三体文明掌握的信息远多于观察者。
transfer_rule: 用连续角色标签概括误判时，应让每张戏服对应一段具体行为，并安排新证据揭示标签遮蔽了什么。
failure_boundary: 罗辑确实享受特权且主动使用‘咒语’说法，标签并非全无依据；反转也不能证明他是神或真巫师。
