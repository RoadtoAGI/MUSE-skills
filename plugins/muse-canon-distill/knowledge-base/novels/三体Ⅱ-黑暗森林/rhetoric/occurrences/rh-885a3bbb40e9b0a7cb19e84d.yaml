quote: 像看魔鬼，也像看天使，像看一枚核弹，也像看同样大的一块宝石
sensory_mapping: 凝视、宗教面容、爆炸能量、宝石光泽
context_fact: 坎特把罗辑送至联合国，握手时竭力彬彬有礼，目光却暴露此刻对其人生极重要。
image_mechanism: 四个意象从道德和物质两条轴线同时翻转，目光被拆成既欲远离又必须守护的矛盾信号。
property_alignment: 1）恶与善对应魔鬼与天使；2）威胁与珍贵对应核弹与宝石；3）无法定性对应反义项并置；4）同样巨大对应命运分量。
context_alignment: 罗辑尚不知道面壁者任命，坎特已知其既可能救人也可能毁灭；信息差使极端并列比单一表情更贴切。
narrative_function: 在揭晓前预告罗辑的新身份，把旁观者的双重评价先压进一束目光。
transfer_rule: 写难以辨认的态度，可沿两条独立评价轴各放一对反义喻体，并让四端都由情境事实支撑。
failure_boundary: 若人物只是犹豫或情绪混杂，魔鬼、核弹等级的极端物会夸大冲突；同体积宝石也只转移价值，不意味着外形相似。
