context_fact: 罗辑在雨中等待，门外传来轻柔稚嫩女声，说了谢谢和再见。
image_mechanism: 声音越过门廊像电流接上神经，听觉输入立刻改写为一次贯穿身体的抽动。
property_alignment: 1）女声对应电流；2）听见对应接触导体；3）颤抖对应肌肉收缩；4）一瞬对应短脉冲。
context_alignment: 罗辑等待的是梦中人的现实声线，强烈期待使轻柔声音产生与音量相反的电击效应。
narrative_function: 以身体反射确认来客命中其想象，并在开门前制造悬念峰值。
transfer_rule: 触电喻写惊动时应保留突然接通、短促传导和不可控肌肉反应，触发物越轻柔，反差越强。
failure_boundary: 罗辑没有受到真实电伤，反应只是一颤；持续疼痛、烧灼或昏厥不在该映射内。
