chapter: 正文
figure_type: simile
quote: 你看那雪山，像不像国画中的空白
sensory_mapping: 白纸、无墨空域、雪面消隐、边缘勾勒
context_fact: 二人乘船面对湖与雪山，庄颜正在讲国画留白比画中实景更重要。
image_mechanism: 雪山的体积与岩纹被白光擦去，剩下一块由天空和山脚围出的纸面空域，现实风景变成未落笔部分。
property_alignment: 1）雪山对应留白；2）雪色对应宣纸；3）暗色边缘对应笔墨边框；4）细节消失对应空白。
context_alignment: 喻体来自庄颜刚阐述的专业概念，且雪山的真实颜色和远观效果提供直接视觉证据。
narrative_function: 把美术理论接入眼前环境，推动后文整个雪地成为“大自然画卷”的空白。
transfer_rule: 艺术媒介类比应让现实对象在颜色、边缘和细节密度上都能对应画面技法。
failure_boundary: 近看雪山有岩石、阴影和地形，并非真正空白；阴暗多纹的山体会削弱该类比。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 远处大片洁白、细节被强光消隐的雪山景观
vehicle: 国画纸面上未经墨色占据、由周围笔墨界定的留白
ground: 1）雪色对应白纸；2）细节稀少对应未落墨；3）轮廓由暗处衬出对应留白受边框界定；4）广阔安静对应空处开放。
