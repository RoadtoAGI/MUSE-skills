chapter: 正文
figure_type: metaphor
quote: 那些空白才是国画的眼睛呢，而画中的风景只不过是那些空白的边框
sensory_mapping: 白色瞳孔、风景作框、视线汇聚、空处回望
context_fact: 庄颜对照油画满色与国画留白，认为画中风景服务于空白。
image_mechanism: 原本被看作“没有画”的白处睁开成为画的眼睛，山水退到四周成为眼眶，使缺席反过来凝视观者。
property_alignment: 1）国画空白对应眼睛；2）想象通道对应视力；3）风景对应边框；4）构图中心对应面部焦点。
context_alignment: 庄颜是国画学生，喻体精确翻转实与空的常规主次，解释她为何把雪山读成画中空白。
narrative_function: 建立贯穿雪山段落的“空白世界”框架，并揭示庄颜的审美价值。
transfer_rule: 把留白写成器官时，要说明空处如何主动组织观看，而非只称它重要；周围实景应成为其结构边界。
failure_boundary: 并非所有国画都以留白为中心，风景也有独立内容；若画面无可辨围合，眼睛—边框关系不成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 国画留白承担的观看中心、想象入口和构图主导作用
vehicle: 使生命得以观看并聚焦的眼睛，以及围绕眼睛存在的外框
ground: 1）留白吸引视线对应眼睛聚焦；2）留白容纳想象对应眼睛通向内在；3）风景围合留白对应边框围眼；4）空白主导构图对应眼睛主导面容。
