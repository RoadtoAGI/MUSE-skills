quote: 吴岳这时放下了冷漠的面具
sensory_mapping: 覆面、摘取、表情切换、正面对视
context_fact: 章北海指出吴岳失败主义后，吴岳不再冷淡，直视并质问其胜利信念来源。
image_mechanism: 情绪防御成为可拿下的硬壳，露出的并非柔弱，而是更直接的怀疑和挑战。
property_alignment: 1）冷漠表情对应面具；2）真实思想对应面后脸；3）放下对应解除遮蔽；4）质问对应真态显露。
context_alignment: 两人长期共事、彼此看透，面具只对公开会话有效；私下直视使遮蔽失去必要。
narrative_function: 把对话从疏离转入核心思想冲突，为木船—航母类比开门。
transfer_rule: 面具隐喻应区分外层姿态和内层内容，并用一次明确行为标出戴上或摘下的时刻。
failure_boundary: 冷漠也可能是真实情绪而非伪装；不能仅凭表情变化推断完整内心。
