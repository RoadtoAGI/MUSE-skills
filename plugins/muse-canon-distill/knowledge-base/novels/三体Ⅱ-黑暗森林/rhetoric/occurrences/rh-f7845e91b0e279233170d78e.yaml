chapter: 正文
figure_type: simile
quote: 母亲和孩子看他的眼光也如外面的秋雨般冰凉
sensory_mapping: 母子目光像车外秋雨落到罗辑身上，刚才的家庭暖意瞬间降温，把他推回冷夜
context_fact: 孩子认出面壁者后，父亲停车命令罗辑下去；母亲和孩子也改用冷淡目光看他。
image_mechanism: 视觉态度跨感官变成皮肤温度，车内关系的骤冷与窗外真实秋雨叠合。
property_alignment: 1）目光投向对应雨落；2）态度冷漠对应低温；3）罗辑受排斥对应被淋；4）持续注视对应连绵秋雨。
context_alignment: 外面正在下雨，喻体无需另造环境；一家三口的家庭温暖反转后，冷雨准确标记情感边界。
narrative_function: 把公众失望压进一次近距离家庭拒绝，迫使罗辑独自留在真正的雨夜。
transfer_rule: 目光作冷雨时，应让真实天气、态度温差、注视方向和受视者身体处境相互咬合。
failure_boundary: 眼光没有物理温度，母子态度也可能混含恐惧与失望；冰凉不能概括全部心理。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 一家人认出罗辑后从热情转为排斥，目光失去同情并带着责备和疏离
vehicle: 秋夜雨水低温、持续落下并使暴露在外的人感到寒冷不适
ground: 1）情感冷淡对应雨温；2）目光持续对应雨线落下；3）排斥感对应淋雨不适；4）车内外反差对应暖处变冷。
