quote: 他注定是一个向高处飞、向远方去的人
sensory_mapping: 离地升空、蓝天上攀、远方航线、身后大地缩小
context_fact: 章北海在空天飞机舷窗回忆从海军飞行训练到向往太空，眼前正第一次进入太空。
image_mechanism: 真实飞行轨迹同时成为人生坐标轴，海洋、蓝天、太空逐层升高，战略目光则沿同一航线越飞越远。
property_alignment: 1）章北海对应飞行者；2）职业跃迁对应升高；3）战略远见对应远航；4）地面常规对应身后大地；5）太空事业对应目的空域。
context_alignment: 人物此刻正在物理起飞，喻义从舷窗事实自然生长，又预示他将用极端行动替未来选择航向。
narrative_function: 一句话凝练章北海的性格动力，把本次上天写成其长期使命的可见轨迹。
transfer_rule: 以飞行概括人生应让人物确有高度层级、远距目标与离开原处的连续选择，方向词须各有对应。
failure_boundary: ‘注定’是叙述性概括，章北海仍作出可争议选择；高与远不自动等于道德或战略正确。
