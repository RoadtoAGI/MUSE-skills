context_fact: 庄颜解释自己偏爱文艺复兴画作，认为当时画家第一次发现人的美。
image_mechanism: 历史性的审美觉醒被折叠进她自己的清晨：画家眼前的人体如雪山从雨雾后显露，幸福由发现瞬间照亮。
property_alignment: 1）文艺复兴画家对应庄颜；2）人的美对应湖山美景；3）首次发现对应首次看见；4）创作幸福对应观景幸福。
context_alignment: 庄颜用亲历经验解释艺术史感受，符合非理论化、以直觉读画的人物声音，也与前文清晨场景可核对。
narrative_function: 让艺术史与二人私人乐园连接，并显出庄颜对“发现美”的核心价值。
transfer_rule: 历史体验类比应选角色真实经历中结构同构的首次发现，让对象、时点和情绪三项对位。
failure_boundary: 个人观景不能概括所有文艺复兴画家的动机，历史也并非一次同时发生的发现；此处只传达庄颜的审美理解。
