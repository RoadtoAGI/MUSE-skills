chapter: 正文
figure_type: simile
quote: 那套起皱的西装更像是空荡荡地挂在一个衣架上
sensory_mapping: 细衣架、空西装、肩线下垂、布料皱挂
context_fact: 来客面黄肌瘦、脖子细小，眼镜和礼帽相对显得沉重，穿皱巴西装。
image_mechanism: 人的血肉体积从衣内被抽空，只留一根窄架承受布料与礼帽，社会性的正式装束显得比本人更有存在感。
property_alignment: 1）瘦身对应衣架；2）西装对应挂衣；3）身体不足对应空荡；4）皱褶对应自然下垂。
context_alignment: 来客刻意穿正式却无力驾驭衣服，衣架意象同时呈现物质贫乏与被制度装束悬挂的卑微。
narrative_function: 迅速建立泰勒对来客弱小可忽略的误判，为破壁人身份反转蓄势。
transfer_rule: 衣架喻瘦人应以衣服撑不起、肩线和内部空隙为证据，并让服装的社会意义参与反差。
failure_boundary: 该喻只描摹外观，不证明人物精神空洞或无威胁；合体衣服或健壮姿态会消除衣架感。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 访客身体极瘦、撑不起宽松皱西装而显得内部空空的外观
vehicle: 没有人体穿着、只由细窄衣架勉强撑住的空西装
ground: 1）细小躯干对应衣架；2）衣服宽松对应空荡；3）肩部缺支撑对应挂衣；4）身体僵薄对应木架轮廓；5）皱褶下垂对应无人穿着。
