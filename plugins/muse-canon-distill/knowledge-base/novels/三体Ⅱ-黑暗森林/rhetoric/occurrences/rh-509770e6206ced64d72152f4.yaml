quote: 黄金时代留下来的温馨，正在被日益严酷的危机时代所磨蚀
sensory_mapping: 暖色余光、表面摩擦、颗粒剥落、缓慢变薄
context_fact: 张援朝在儿媳分娩候产室感到人情温暖，同时社会已进入逃亡主义被禁止的危机年代。
image_mechanism: 时代压力变成粗糙砂轮，对家庭生活里一层旧日暖色持续摩擦，温馨因此呈现可见损耗。
property_alignment: 1）黄金时代对应原物来源；2）温馨对应表层材质；3）危机时代对应磨蚀力；4）日益严酷对应摩擦加重。
context_alignment: 新生命诞生仍沿用和平年代仪式，外部末日政策却已逼近家庭；渐磨比骤毁更符合过渡期。
narrative_function: 将宏观时代变化落到候产室情感质地，并连接婴儿出生与艰难未来。
transfer_rule: 侵蚀隐喻写社会变化时，要确定被磨损的具体日常质地、持续外力和仍残留的部分。
failure_boundary: 温馨可能重建或转化，材料磨损的单向不可逆性不能替代真实社会机制。
