context_fact: 罗辑刚把面壁经历称为妄想，病毒却证明ETO直到百年前仍认定他重要，使被压下的战略怀疑重新出现。
image_mechanism: 思维不再是自主选择的内部活动，而成为有路径和黏附力的外来追随者，压抑表现为身体摆脱动作。
