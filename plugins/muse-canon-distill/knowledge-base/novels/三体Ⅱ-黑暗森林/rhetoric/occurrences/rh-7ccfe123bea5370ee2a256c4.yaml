context_alignment: 网络病毒刚展示跨世纪潜伏，思绪也像潜伏程序一样重新激活，心理动作与情节机制形成微型同构。
narrative_function: 提示罗辑的真正面壁线未被身份废止，同时延迟他正面承认咒语有效的时刻。
transfer_rule: 反复念头作返回者时，应给出首次离开、触发归来和人物具体抵抗，让回返具有因果而非空泛重复。
failure_boundary: 念头没有独立意志与身体，罗辑可以转移注意但未必真正消除它；返回不证明猜疑为真。
