chapter: 正文
figure_type: simile
quote: 夏虫的合唱仿佛是那些星星发出的
sensory_mapping: 虫鸣、星光闪烁、夜空高度、合唱声部
context_fact: 希恩斯夫妇决定共同推进脑科学计划后，轻风吹竹，虫鸣重新响起，星星在叶间闪动。
image_mechanism: 地面的虫声沿竹梢升入夜空，每个闪动星点仿佛张口，视觉频率与听觉节拍短暂同步。
property_alignment: 1）虫群对应星群；2）鸣叫对应发声；3）星闪对应音符起落；4）悠扬整体对应合唱。
context_alignment: 竹林谈话刚从焦虑转为共同承诺，天地合唱给私密决定一个宁静而辽阔的回声。
narrative_function: 以跨感官收束希恩斯计划场景，把两世纪未来暂时化为和谐夜景。
transfer_rule: 把声音移给发光物时，应让声部数量、明灭节奏和空间分布同步，形成可感的视听对应。
failure_boundary: 星星没有发声，风也可能改变虫鸣与闪烁的同步；缺少节律联系时只剩装饰性通感。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 竹林中恢复的虫鸣与竹叶间快速闪动的星光形成的听觉幻象
vehicle: 夜空群星共同发声、组成悠扬合唱
ground: 1）多只夏虫对应多颗星；2）此起彼伏虫鸣对应群星合唱；3）竹叶间星点闪动对应发声节拍；4）声源难辨对应声音来自高空。
