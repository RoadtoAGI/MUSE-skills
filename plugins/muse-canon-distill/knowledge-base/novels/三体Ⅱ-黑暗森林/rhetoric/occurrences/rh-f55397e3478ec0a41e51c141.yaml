quote: 它们承载着人类的全部思想和记忆，怀抱着地球所有的光荣与梦想
sensory_mapping: 两艘黑船把思想装进舱内、以舰体双臂抱住地球梦想、穿过永夜把这些无形遗产带远
context_fact: 两舰切断太阳系联系，携带幸存者、燃料和配件，独自驶向不同星座方向。
image_mechanism: 文明抽象资产同时获得重量与脆弱身体，‘承载’强调责任，‘怀抱’补入亲密保护和失乡情感。
property_alignment: 1）舰舱对应容器；2）幸存者记忆对应载荷；3）舰体包围对应双臂；4）文明理想对应怀中幼体；5）航程对应护送。
context_alignment: 飞船已被称黑暗之船，怀抱的却是地球光荣与梦想，黑色外形与内部光明遗产形成张力。
narrative_function: 避免幸存者只被定义为杀人者，保留其文明继承责任，并以挽歌语调送其进入永夜。
transfer_rule: 载体保护文明作承载与怀抱时，应分别写重量、容纳、脆弱性和保护动作，保留责任与情感双层。
failure_boundary: 两舰不可能保存人类‘全部’思想和记忆，幸存者也可能改写或遗失地球价值。
