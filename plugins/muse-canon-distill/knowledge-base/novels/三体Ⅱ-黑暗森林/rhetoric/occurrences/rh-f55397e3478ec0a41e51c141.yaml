tenor: 蓝色空间号和青铜时代号带走幸存人口、知识与历史记忆，成为地球文明在太空的残存继承者
vehicle: 载具负担珍贵货物远行，人的双臂又把易损之物抱在胸前，以身体温度保护并陪伴
ground: 1）飞船对应载体/怀抱者；2）人口知识对应货物；3）集体记忆对应随身物；4）光荣梦想对应被抱对象；5）远航对应搬运守护。
