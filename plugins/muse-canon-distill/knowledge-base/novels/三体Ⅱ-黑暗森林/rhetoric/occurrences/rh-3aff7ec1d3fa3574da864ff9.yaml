chapter: 正文
figure_type: metaphor
quote: 面前的“唐”号仿佛是一座被废弃的古代巨型要塞
sensory_mapping: 视觉、材质、时间感
context_fact: 吴岳知道舰壳污迹来自焊接，却无法把眼前唐号想象成崭新完工的航母。
image_mechanism: 把正在发生的现代建造反向推进到古代遗址：钢板变石墙、焊花变植物、施工变考古，物理细节沿同一时间倒置连续转义。
property_alignment: 1）舰壳对应城墙；2）污迹对应风化；3）脚手架焊花对应遗址植被；4）未完成的工程对应失去未来、只剩过去的废堡。
context_alignment: 喻体来自吴岳无法相信舰队未来的心理滤镜；每一项又由眼前材料触发，沧桑感因此有物理依据。
narrative_function: 让唐号尚未服役便显得属于过去，具象化吴岳信念提前衰老和航母时代被迫终止。
transfer_rule: 延展比喻要让同一框架持续接管对象的构件、材质、附着物和动作，并让转换方向服务人物此刻的时间感。
failure_boundary: 若只因物体巨大就称要塞，缺少石墙、风化、植物和考古的连续对应，便没有此处“未来被看成遗迹”的核心。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 船坞中斑驳、被脚手架包围且迟迟未完工的唐号航母
vehicle: 石墙残破、植物攀附、等待考古的废弃古代要塞
ground: 1）巨舰体量与封闭外壳对应高大要塞；2）锰钢污迹对应斑驳石墙；3）垂落焊花对应墙面植物；4）建造停滞感对应遗址被发掘。
