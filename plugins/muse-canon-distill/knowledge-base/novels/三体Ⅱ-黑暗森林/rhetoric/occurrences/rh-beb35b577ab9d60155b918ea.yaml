chapter: 正文
figure_type: metaphor
quote: 只能以行星的引力为骨架保持形状
sensory_mapping: 行星引力在透明巨膜下撑起骨架，薄膜贴着骨线保持平整；离开行星后被太阳风揉成皱团
context_fact: 罗辑曾咨询智子在太空展开；他得知二维智子若无行星引力保持形状，会在太阳风作用下失去平面形态。
image_mechanism: 不可见引力场被实体化为承重骨骼，二维结构的稳定与失稳分别成为挺立和瘫软的身体状态。
property_alignment: 1）引力约束对应骨骼支撑；2）二维智子对应附着组织；3）行星位置对应关节定位；4）平面保持对应体形稳定；5）团皱对应失去支架。
context_alignment: 长括号承担技术解释，‘骨架’用一个生物结构词迅速交代引力为何既定位又塑形，避免公式打断高潮回顾。
narrative_function: 说明智子无法主动填补尘埃间隙遮挡太阳，补上罗辑威慑方案不被反制的物理条件。
transfer_rule: 把场或约束写成骨架时，应对应承重、定位、轮廓和撤除后的失稳状态，并说明真正作用力来源。
failure_boundary: 引力场没有刚性杆件，智子也非软组织贴附骨骼；该喻体只解释约束功能，不能推导其内部材料结构。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 二维展开后的智子没有空间机动和定位能力，必须借行星引力约束其巨大平面，才能维持预定形态
vehicle: 软组织依附坚硬骨架获得支撑、定位和整体轮廓；骨架一旦撤去，组织便塌缩团皱
ground: 1）智子二维平面对应软组织；2）行星引力场对应骨架；3）维持平面对应撑住体形；4）太阳风扰动对应外力拉扯；5）折叠团皱对应失去骨架后的塌陷。
