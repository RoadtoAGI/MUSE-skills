chapter: 正文
figure_type: simile
quote: 人民的石头像雨点般飞来
sensory_mapping: 石块成幕、密集破空、接连砸落、躯体被埋
context_fact: 雷迪亚兹回到祖国呼唤人民，却因同归于尽计划遭民众围攻，前三块石头已将他击倒。
image_mechanism: 一块块有明确重量的攻击物在数量上失去边界，汇成天气般不可躲避的降落面，把个人暴力升级为群体风暴。
property_alignment: 1）人民投石对应云层降雨；2）石块对应雨滴；3）人群包围对应雨域；4）连续抛掷对应骤雨；5）石堆覆盖尸体对应积水覆盖。
context_alignment: 前文人潮已‘沸腾’并冲垮警戒线，雨点将群体运动收束到致死打击，也反转他对‘人民’的浪漫想象。
narrative_function: 迅速越过个别袭击进入无可逆转的处决，让雷迪亚兹死亡呈现群众力量的冷酷匿名性。
transfer_rule: 把群体投射物写成降水，应对齐数量、连续性、覆盖范围和躲避难度，并保留单个物体的伤害重量。
failure_boundary: 石块受人主动投掷、轨迹不垂直且足以致命，雨点没有政治意志或同等冲击力。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 愤怒人群从四面连续、密集地向雷迪亚兹投掷大量石块
vehicle: 暴雨时无数雨滴从空中接连落下、覆盖一片区域
ground: 1）石块对应雨点；2）投掷密集对应降雨稠密；3）从多方向飞来对应雨幕覆盖；4）连续不断对应骤雨持续；5）最终掩埋对应降水累积。
