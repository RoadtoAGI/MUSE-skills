quote: 两眼像金鱼般凸出
sensory_mapping: 脸色青紫、眼球外鼓、圆眼僵睁、窒息变形
context_fact: 雷迪亚兹用皮带勒住破壁人的脖子并撞击其头部，警卫拉开时他已口吐白沫、严重缺氧。
image_mechanism: 窒息造成的生理变形被一个熟悉凸眼轮廓瞬间定形，让读者无需医学参数即可看见颈部受压的程度。
property_alignment: 1）破壁人的眼球对应金鱼眼；2）勒颈内压对应天然凸出形态；3）圆睁对应鱼眼常开；4）面部比例失常对应鱼类轮廓。
context_alignment: 比喻紧贴暴力后果，只转移外形而不美化动作；人物刚被称作‘超人’，此刻降为脆弱动物形成残酷反差。
narrative_function: 以刺目的身体细节封住袭击高潮，量化雷迪亚兹几乎杀人的力度。
transfer_rule: 以动物器官写创伤时，应锁定可见形态和形成原因，避免把受害者整体动物化或制造滑稽偏差。
failure_boundary: 金鱼凸眼是物种结构，破壁人眼球突出是急性窒息伤；不能由外观相同推断生理机制相同。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 破壁人被皮带狠勒至窒息、脸色青紫时，眼球因压力而异常向外鼓起的外观
vehicle: 金鱼天然显著隆起、突出头部轮廓的圆眼
ground: 1）受压眼球对应金鱼凸眼；2）圆睁状态对应鱼眼形状；3）突出面部对应眼球外鼓；4）无法合眼对应固定睁视；5）青紫脸部对应水生异样感。
