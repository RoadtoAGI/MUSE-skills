context_fact: 章北海在全体军官悲观时独自举手并陈述信念，常伟思看见其坚定目光后在心中思量。
image_mechanism: 父亲的难解身影投到儿子身后，两代人的表面轮廓重合，常伟思的目光再次停在同一层不透明外壳。
property_alignment: 1）章北海对应其父；2）胜利信念对应父亲的精神内核；3）常伟思敬佩对应旧日敬佩；4）未知动机对应未看透。
context_alignment: 类比由常伟思与父子两代的真实交往产生，不借陌生意象，贴合高级军官凭履历识人的思维。
narrative_function: 提示章北海的公开乐观还有隐秘层次，并以父辈伏笔增加其不可读性。
transfer_rule: 以家族前例理解人物时，应明确相似行为、观察者的共同关系和仍未解开的差异，避免只凭血缘归因。
failure_boundary: 父子相似不证明信念内容相同，常伟思的未看透也不是阴谋证据；类比只建立疑问。
