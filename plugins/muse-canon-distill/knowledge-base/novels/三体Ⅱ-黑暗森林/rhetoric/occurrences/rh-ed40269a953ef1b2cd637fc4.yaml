tenor: 自适应沙发受病毒控制后在罗辑颈侧隆起两条柔性构件，持续收紧并实施勒杀
vehicle: 有生命的软体捕食者伸出成对触手缠住猎物，以肌肉收缩限制其呼吸和逃脱
ground: 1）沙发构件对应触手；2）柔性变形对应软体伸展；3）两侧隆起对应成对肢体；4）收紧对应缠杀；5）罗辑对应猎物；6）病毒控制对应捕食意志。
