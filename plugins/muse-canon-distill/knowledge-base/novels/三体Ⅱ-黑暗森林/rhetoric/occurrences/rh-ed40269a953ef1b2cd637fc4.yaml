quote: 靠背在颈部两侧的部分形成了一双触手，死死地卡住了罗辑的脖子
sensory_mapping: 靠背长出软肢、双侧合拢、颈部被缠紧、家具化成捕食者
context_fact: 罗辑躺下后，沙发本应贴合身体减压，却继续塑形并夹紧颈部，大史用刀割开构件才救出他。
image_mechanism: 为拥抱人体而设计的柔性材料越过舒适边界，局部形变被赋予捕食肢体，家具瞬间从承托面变成主动猎手。
property_alignment: 1）自适应靠背对应软体身体；2）颈侧凸起对应触手；3）持续塑形对应伸展；4）勒颈对应缠捕；5）罗辑对应猎物；6）大史持刀分开对应斩断软肢。
context_alignment: 此前沙发像软泥般温顺包裹人体，同一可塑性现在翻成触手，使舒适技术自身成为攻击机制。
narrative_function: 完成连续谋杀的最后一次升级：危险不再从外部撞来，而从最贴身、最柔软的家具内部长出。
transfer_rule: 柔性物体作触手时，应让伸展、包围、收紧和目标身体部位逐步可见，并利用其原本用途制造反转。
failure_boundary: 沙发没有动物意识，触手形状由软件和材料执行；不能据此推断设备会自主捕食。
quality_assessment: exemplary
