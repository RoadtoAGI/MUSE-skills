chapter: 正文
figure_type: simile
quote: 像地球的长牙
sensory_mapping: 白色骨质、尖锥、成排突起、巨口尺度
context_fact: 罗辑连续用两个意象描述梦想之地雪山，以便伽尔宁按图寻找。
image_mechanism: 地球获得一张隐形巨口，山脉从地壳中刺出成为牙齿，把行星本身写成有身体的巨兽。
property_alignment: 1）地表对应牙床；2）山峰对应长牙；3）雪色对应牙白；4）险峻对应咬合锋利。
context_alignment: 与“天神之剑”并列，一个人工神兵、一个行星器官，分别强化银亮和有机生长，使口头素描更鲜明。
narrative_function: 扩大理想景观尺度，也在舒适愿望边缘保存一丝原始野性。
transfer_rule: 器官比地貌时，要让生长基底、颜色、轮廓和排列都能落位，才能使大地身体化。
failure_boundary: 长牙暗含动物攻击性，原文主要取形与颜色；强调湖区宁静时不应继续扩展吞咬含义。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 从地表突起、银白尖利的同一组雪山
vehicle: 从地球巨口中长出的巨大白色獠牙
ground: 1）峰体从地面生出对应牙从牙床生出；2）积雪洁白对应牙色；3）峰尖与长脊对应獠牙锥形；4）成排山群对应口中多颗长牙。
