quote: 泰勒最后的希望破灭了
sensory_mapping: 薄壳承压、裂纹扩展、碎片落下、支点消失
context_fact: 破壁人准确指出泰勒会把敢死组织部署进地球主力舰队，泰勒已预知后面全部揭露并沉默。
image_mechanism: 无形侥幸先收束成最后一层薄壳，准确推断击中其受力点，心理防护随即裂成无法拼回的碎片。
property_alignment: 1）希望对应脆壳；2）关键推断对应撞击；3）真相显露对应裂开；4）泰勒失语对应失去支撑。
context_alignment: ‘破壁人’身份本就携带摧毁防线的动作，此处破灭让对方尚未说完便已完成心理处决。
narrative_function: 标记对话胜负已定，使后续战略全貌像既知刑罚一样展开。
transfer_rule: 写希望破灭应明确希望依赖的关键支点，以及哪条事实击断该点，避免把普通失望泛写成粉碎。
failure_boundary: 泰勒仍可质疑量子舰队可行性或调整战略，破灭的是保密希望，不等于全部行动能力当场消失。
