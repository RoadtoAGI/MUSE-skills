chapter: 正文
figure_type: simile
quote: 细雨撒在脸上，像一双冰凉的小手在轻抚
sensory_mapping: 密雨化成十指轻轻掠过罗辑脸颊，动作像庄颜的抚触，温柔形态里只有秋夜冷意
context_fact: 罗辑不取伞、避开警卫，独自穿过防护林进入沙漠，准备去墓地并计划自杀。
image_mechanism: 无主雨点被组织成双手动作，随机触感获得亲密对象的形状；冰凉又把慰藉转成死亡前寒意。
property_alignment: 1）水滴触点对应手指；2）雨势轻柔对应抚摸力度；3）雨温对应手温；4）面部受雨对应被抚者位置。
context_alignment: 罗辑刚失去妻女且孤身出走，小手意象呼应家庭亲密，却没有明确主人，贴合缺席感。
narrative_function: 在赴死路上给罗辑一个似是而非的温柔触感，使寒雨同时承担陪伴与孤独。
transfer_rule: 雨作手时，应匹配滴点数量、落点、力度、温度和人物关系语境，让触觉而非抽象情绪主导。
failure_boundary: 雨没有抚慰意图，小手也通常带体温；若雨势猛烈或人物不处于亲密缺失场景，对应会失真。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 秋夜细雨以轻、密而寒冷的触感落在独自离开小区的罗辑脸上
vehicle: 一双温柔却冰凉的小手反复轻触面颊，动作细碎、贴近且带亲密感
ground: 1）雨滴对应指尖；2）连续落下对应轻抚；3）低温对应冰凉皮肤；4）触脸位置对应手抚面；5）细雨力度对应小手轻柔。
