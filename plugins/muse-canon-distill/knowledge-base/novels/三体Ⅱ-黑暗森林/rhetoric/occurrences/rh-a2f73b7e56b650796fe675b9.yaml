chapter: 正文
figure_type: simile
quote: 她的双眼在火光中十分清澈，像在说：这有什么不对吗
sensory_mapping: 清亮双眼、无声开口、疑问语调、目光直达
context_fact: 罗辑猜中庄颜偏爱晚霞，她不明白他为何惊讶，以清澈双眼看着他。
image_mechanism: 目光越过口腔获得一句清晰台词，视觉表情被译成可听见的疑问语调。
property_alignment: 1）双眼对应说话者；2）清澈对应坦率语气；3）困惑表情对应疑问句；4）注视对应对话指向。
context_alignment: 庄颜言语朴素、戒心低，眼睛无需复杂密码便能“说”出问题，贴合罗辑眼中的天真。
narrative_function: 表现二人偏好相合时庄颜的无心与罗辑的惊喜不对称。
transfer_rule: 眼神说话喻应给出可还原的具体句意，并让眼部质感对应语气，而非泛写“会说话”。
failure_boundary: 台词是罗辑对表情的解释，不能当作庄颜真实说出的内容；模糊或回避性目光不适用如此明确的问题。
quality_assessment: effective
