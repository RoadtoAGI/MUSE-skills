tenor: 庄颜清澈目光直接传达天真困惑的表情信息
vehicle: 一个人用语言直白问出自己为何不该喜欢晚霞
ground: 1）凝视传情对应开口说话；2）清澈眼神对应问题坦率；3）困惑神色对应疑问句；4）无防备目光对应不加修饰的语气。
