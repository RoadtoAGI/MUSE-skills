quote: 这个时代，美女如水啊
sensory_mapping: 未来女性化成清水、修长身影流过舱内、阳光勾出水样侧影、沙漠时代浮现江南
context_fact: 丁仪和西子谈到已沙化的西湖，转而称未来仍像江南，并借机赞美女军官。
image_mechanism: 地理记忆从消失的西湖转移到人，水不再存在于地表，而以女性外形和气质在未来延续。
property_alignment: 1）未来美女对应江南水；2）体态曲线对应水流；3）气质温柔对应水性；4）普遍出现对应水量丰沛；5）西子侧影对应水面轮廓；6）丁仪怀旧对应临水感。
context_alignment: 丁仪以旧式风流口吻把环境灾变与眼前女性连起来，既符合人物声音，也保留冒犯性的时代差。
narrative_function: 在接触危机前制造轻松搭讪，并让丁仪由美女话题转入物理规律与旧爱。
transfer_rule: 人群作水时，应明确柔软、流动、清澈或丰沛中的具体映射，并让地理或人物语境提供水源。
failure_boundary: 女性并非同质流体，外貌和性格差异不能被‘水’抹平；比喻带有丁仪个人审美和性别凝视。
