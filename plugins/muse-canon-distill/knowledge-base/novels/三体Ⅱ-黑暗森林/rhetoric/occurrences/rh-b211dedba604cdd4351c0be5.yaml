chapter: 正文
figure_type: simile
quote: 水是比天空更深的那种蓝，像您爱人的眼睛
sensory_mapping: 深蓝至黑、湿润光泽、凝视、亲密距离
context_fact: 罗辑口述理想景观，伽尔宁指出爱人眼睛是黑色，罗辑随即把湖色修正为蓝得发黑。
image_mechanism: 广阔湖面收拢成一双亲密眼睛，地理颜色由情感关系校准，深水仿佛回望观看者。
property_alignment: 1）湖水对应瞳色；2）波光对应眼中反光；3）深度对应目光深邃；4）景观吸引对应爱人吸引。
context_alignment: 罗辑正让执行者参与想象，借对方最熟悉的眼睛填补纸上无色的湖，互动本身强化贴切度。
narrative_function: 让梦境从私人独白变为共同可视图像，并给宏大雪山配置柔和情感中心。
transfer_rule: 以眼睛定水色时，可让对话者提供真实瞳色，再对齐光泽、深度和观看关系，避免抽象套用。
failure_boundary: 眼睛面积和水域尺度悬殊，且黑眼睛并不真正呈湖蓝；该喻体服务情感色彩，不能当作准确调色标准。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 罗辑梦想湖泊中深到发暗、带亲密美感的蓝色湖水
vehicle: 伽尔宁爱人深色而可凝视的眼睛
ground: 1）湖色深邃对应深色瞳仁；2）水面可凝视对应眼睛与人对视；3）宁静温柔对应爱人目光；4）黑蓝色泽对应伽尔宁随后说明的黑眼睛。
