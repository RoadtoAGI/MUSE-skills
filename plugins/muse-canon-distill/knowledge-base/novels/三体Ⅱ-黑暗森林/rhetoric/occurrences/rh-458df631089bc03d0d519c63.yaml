figure_type: simile
quote: 云层像一大片覆盖在镜面上的粉红色羽毛
sensory_mapping: 粉羽铺展、细绒纹理、轻浮镜上、夕光染色
context_fact: 海洋已被比成蓝橘镜面，云层吸收夕阳后在其上形成粉红覆盖层。
image_mechanism: 水镜先提供硬而光滑的底材，云团再被软化成羽片铺上去，材质的软硬差让地球表面获得层次。
property_alignment: 1）云对应羽毛；2）海对应镜面；3）云丝对应羽枝；4）夕阳颜色对应粉红染料；5）高空覆盖对应铺放。
context_alignment: 喻体明确依赖同句镜面比喻，两个意象组合成完整画面，而非各自孤立的漂亮词。
narrative_function: 完成伏击前的地球肖像，以极柔软背景衬托随后真空中的枪击与冰晶。
transfer_rule: 连续材质比喻应让第二喻体与第一喻体发生位置关系，如覆盖、嵌入或反射，形成可组合画面。
failure_boundary: 厚重风暴云或灰暗云层不具羽毛轻薄与粉色；该颜色只在短暂夕照角度成立。
quality_assessment: exemplary
