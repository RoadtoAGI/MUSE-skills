chapter: 正文
figure_type: simile
quote: 蓝天空荡荡的，就像他这时的心
sensory_mapping: 空蓝穹顶、物体退场、巨大留白、视线无着
context_fact: 史强在电话中告别并称可能无法再见，通话结束后天空中的无人机也已消失。
image_mechanism: 罗辑内部被摊成头顶蓝穹，史强和无人机同时从两个空间退出，留下视线与情感都找不到落点的空域。
property_alignment: 1）罗辑内心对应天空；2）史强离去对应无人机消失；3）失落对应空荡；4）情感容量对应天空广度。
context_alignment: 人物正在仰望刚失去目标的天空，外在消失与关系告别同步，喻体由即时视觉事件精确触发。
narrative_function: 把史强离场的冲击压入短暂静默，并从私人幸福中切出死亡阴影。
transfer_rule: 以空景写失落时，应让景中某物刚刚离开，并与人物关系中的离场在时间和方向上重合。
failure_boundary: 天空的明净不等同悲伤，空心也不表示罗辑失去全部情感；若景物仍拥挤，映射会散。
quality_assessment: exemplary
