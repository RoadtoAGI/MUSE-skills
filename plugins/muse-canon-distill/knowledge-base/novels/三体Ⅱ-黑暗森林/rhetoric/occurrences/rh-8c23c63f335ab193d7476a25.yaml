tenor: 史强即将长期冬眠、可能再也不见后罗辑突然失去支点的空落心境
vehicle: 无人机消失后没有任何物体停驻的辽阔蓝天
ground: 1）友人离场对应无人机消失；2）情感失落对应天空空无；3）无法抓取回应对应无物停驻；4）空缺范围大对应天空辽阔。
