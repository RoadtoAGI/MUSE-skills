chapter: 正文
figure_type: simile
quote: 水星的大地似乎变得像绸缎般柔软
sensory_mapping: 黑地起皱、环波推开、硬面软化、绸光流动
context_fact: 恒星型氢弹在地下起爆，冲击尚未掀开地层，环形波纹先从爆心投影点向外扩散。
image_mechanism: 岩石的材料属性被视觉运动瞬间改写：冲击波像抖动一幅黑色织物，让不可能弯曲的行星表面呈现软褶。
property_alignment: 1）水星地表对应绸缎；2）地震波对应布面波纹；3）爆心对应抖动施力点；4）地层起伏对应织物弯曲；5）波向外传播对应褶皱扩散。
context_alignment: 叙述抓住核爆最初一刻的表面形态，而非声称岩石真的软化，紧接着隆山爆裂形成由柔到暴的节奏。
narrative_function: 以反常材质显出核爆力量，使行星尺度冲击先可触摸，再升级为三千米山峰。
transfer_rule: 用柔软织物表现固体波动时，应明确转移的是表面形变和波纹传播，并保留原物质仍坚硬的尺度反差。
failure_boundary: 水星岩层没有变软、产生丝滑触感或织物光泽；地下冲击后的破裂也不同于绸缎无损起伏。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 地下核爆冲击波使原本坚硬的水星地表出现一圈圈连续起伏的波纹
vehicle: 受力时表面顺滑、可弯曲并形成柔和褶皱与波浪的绸缎
ground: 1）岩地对应绸缎；2）环形地震波对应布面褶波；3）坚硬地层暂时起伏对应柔软弯曲；4）波纹外扩对应抖动传开；5）连续表面对应整幅织物。
