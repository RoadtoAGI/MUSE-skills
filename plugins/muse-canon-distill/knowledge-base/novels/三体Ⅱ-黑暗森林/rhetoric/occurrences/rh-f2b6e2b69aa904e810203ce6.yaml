chapter: 正文
figure_type: simile
quote: 每一艘被击中的战舰就像受了传染似的攻击队列中的下一艘
sensory_mapping: 舰列像人群染病、一舰发作便把病递给下一舰、红炽症状沿队伍蔓延
context_fact: 赵鑫从图像抽取速度特征，看到A击B、B又似乎击C的连续轨迹，尚未知发射体始终是同一水滴。
image_mechanism: 单一攻击者被观测误切成逐舰传播的病原，轨迹连续性转成患者之间的接力感染。
property_alignment: 1）舰体对应宿主；2）水滴对应病原；3）穿透对应接触传播；4）红炽爆炸对应发病死亡。
context_alignment: 低级军官用二十一世纪口语处理超时代战场，传染意象粗粝却迅速抓住了连锁结构。
narrative_function: 呈现正确结论诞生前的中间模型，让读者与军官一起从假象逼近单一攻击者。
transfer_rule: 连锁事件作传染时，应明确传播载体、宿主次序、重复症状和观察盲点，保留模型能解释与不能解释的部分。
failure_boundary: 战舰不会自行复制或释放水滴，真正的同一攻击体只是穿过它们；传播主体并未更换。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 水滴从一艘战舰穿出后立即飞向下一艘，视觉数据却使人误以为受创舰在临爆前发射攻击
vehicle: 传染病从一个患者接续感染邻近个体，患者获得同样症状并成为下一轮传播源
ground: 1）受创战舰对应患者；2）水滴传递对应病原传播；3）下一舰受击对应新感染；4）连锁爆炸对应症状接续。
