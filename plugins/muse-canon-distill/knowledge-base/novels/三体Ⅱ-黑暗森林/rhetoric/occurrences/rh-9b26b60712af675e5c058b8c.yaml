chapter: 正文
figure_type: simile
quote: “自然选择”号巨大的舰体像蝉翼般振动起来
sensory_mapping: 庞大钢铁舰体骤然薄成透明蝉翼、整片外壳高频颤动、无声振幅在内部转成致命低鸣
context_fact: 三枚氢弹在四十公里外爆炸，电磁脉冲与舰壳作用，将能量转为空气中的超强次声波。
image_mechanism: 巨舰尺度和钢铁重量被撤销为昆虫薄翼，高频振动的形态与声能转换因而一眼可懂。
property_alignment: 1）舰体金属壳对应翼膜；2）电磁驱动对应肌肉/气流；3）振动频率对应振翅；4）空气声波对应蝉鸣；5）血雾对应翼下生命受损。
context_alignment: 自然选择号曾是文明方舟，此刻被远距脉冲轻易拨动如虫翼，准确表现技术武器对内部生命的脆弱性利用。
narrative_function: 把不可见电磁—次声机制转成可见振翅动作，连接外部核爆与舱内瞬间死亡。
transfer_rule: 大型薄壳高频振动作昆虫翼时，应同时匹配膜性、频率、驱动力和声学后果，利用尺度反差。
failure_boundary: 舰壳仍厚重坚固，不会真正飞翔；振动频率是次声而非可听蝉鸣，形态相似不等材质相同。
quality_assessment: exemplary
