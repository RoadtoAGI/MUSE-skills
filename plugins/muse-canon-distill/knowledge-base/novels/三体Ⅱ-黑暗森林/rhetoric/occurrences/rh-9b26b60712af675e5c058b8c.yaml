review_status: reviewed
tenor: 次声波氢弹电磁脉冲使恒星级战舰金属外壳高频、细密振动，并把能量传入舱内空气
vehicle: 蝉翼极薄轻，在快速振翅或气流中以高频小幅颤动，振动可产生持续声响
ground: 1）舰壳对应蝉翼；2）金属薄壁对应翼膜；3）高频振动对应振翅；4）次声产生对应翼鸣；5）巨舰轻化对应强脉冲压倒结构。
