review_status: reviewed
tenor: 经历两个世纪后，杨冬墓碑上的刻字仍清晰新鲜，几乎看不出时间侵蚀
vehicle: 昨日刚完成的碑刻，刀痕边缘清楚、表面未风化、字形仍像新作
ground: 1）字迹清晰对应新刻刀痕；2）缺少风化对应仅隔一天；3）雨水冲洗对应新鲜表面；4）两百年距离对应被压成昨日。
