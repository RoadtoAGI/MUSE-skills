quote: 上面“杨冬之墓”四个字像是昨天才刻上去的
sensory_mapping: 雨水洗亮碑面，四个字的刻痕像刀锋昨日才离开石头，两百年在边缘上找不到痕迹
context_fact: 罗辑没看碑文就认出墓碑，猜测雨水冲洗使其未显年代，旁边叶文洁墓碑形制相同。
image_mechanism: 物理保存状态把世纪时间压缩为一天，字刻的新旧成为罗辑跨时代重返现场的可见刻度。
property_alignment: 1）保存完好对应新作；2）刻痕清楚对应刀工刚停；3）表面洁净对应未积尘；4）时间近感对应昨天。
context_alignment: 罗辑跨冬眠常把两百年感成昨日，墓字也复制同一主观折叠，使叶文洁问题仿佛仍在等答案。
narrative_function: 消除理论提出与最终验证之间的时间距离，把罗辑重新放回两百年前墓地对话的延续。
transfer_rule: 旧物作昨日新物时，应指出保存证据、时间侵蚀缺席和人物为何感到时间被压缩。
failure_boundary: 刻字实际经历了两百年，清晰可能来自石材、维护或雨洗；新刻感不证明时间未作用。
