quote: 这是用两千把宰牛刀杀一只鸡
sensory_mapping: 一只小鸡立在场中、两千把重刀同时举起、数量压满视野、围观者哄笑
context_fact: 舰队国际决定让全部恒星级战舰共同出击，以满足三大舰队参战荣誉和公众力量展示。
image_mechanism: 宇宙尺度兵力比被压进厨房屠宰场，目标尺寸和工具用途一眼显示‘过度’，却隐藏材料性能未知。
property_alignment: 1）恒星舰对应宰牛刀；2）水滴对应鸡；3）舰队数量对应刀数；4）探测器体积对应小禽；5）拦截任务对应屠宰；6）胜利预期对应一刀即成。
context_alignment: 普通冬眠者以旧俗语评论未来军力，声音贴切；随后一只‘鸡’毁灭舰队，使比值判断彻底反转。
narrative_function: 浓缩人类傲慢并为水滴以小胜大制造最清楚的前置标尺。
transfer_rule: 力量过剩类比应同时比较数量、单体能力、目标尺度和任务难度，并检查被忽略的质量维度。
failure_boundary: 水滴不是脆弱鸡只，战舰也未掌握其材料与武器能力；体积小不等于威胁低。
quality_assessment: exemplary
