tenor: 人类派出两千多艘恒星级战舰拦截一个三点五米长的三体探测器，表面兵力远超目标规模
vehicle: 为杀一只小鸡同时动用两千把足以屠牛的重刀，工具数量和能力都严重过剩
ground: 1）联合舰队对应宰牛刀；2）探测器对应鸡；3）战舰火力对应重刀锋利；4）两千艘对应两千把；5）拦截对应宰杀；6）公众嘲笑对应认为投入失衡。
