chapter: 正文
figure_type: simile
quote: 夕照下的海洋像一面光滑的镜子
sensory_mapping: 光滑镜面、蓝红对半、夕光反射、弧面无纹
context_fact: 章北海从同步轨道看地球日落，海洋与云层在低角度阳光中显出清楚色带。
image_mechanism: 数千公里海洋的波浪被距离抹平，水面收束成一整块抛光材质，夕阳在其上铺开双色反光。
property_alignment: 1）海洋对应镜子；2）水面反射对应镜光；3）远距无浪对应光滑；4）夕照色带对应镜中颜色。
context_alignment: 同步轨道尺度真实消除了细浪，使常见水镜比喻获得宏观物理依据，并与后面的羽毛云层形成材质对照。
narrative_function: 把地球背景写得宁静精美，反衬前景中正在瞄准的谋杀。
transfer_rule: 水面作镜应有平整视角、明确反光源和可见映色；风浪近景若破碎反射，应改用碎镜等形态。
failure_boundary: 海面实际有波浪且地球曲率明显，不是刚性平镜；镜喻不能用于解释海洋物理。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 斜照日光下地球海面呈平整、强反光并分成深蓝与橘红两色的远观景象
vehicle: 表面平滑、能整片反射光色的一面镜子
ground: 1）海面对应镜面；2）远观平整对应光滑；3）夕照反光对应镜面映光；4）蓝红分区对应镜中综合色；5）弧形水体对应大片镜面。
