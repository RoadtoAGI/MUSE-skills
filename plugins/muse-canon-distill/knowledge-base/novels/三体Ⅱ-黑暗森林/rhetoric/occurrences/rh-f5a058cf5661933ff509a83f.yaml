chapter: 正文
figure_type: analogy
quote: 像修改计算机程序那样修改思想
sensory_mapping: 代码打开、指令替换、计算跳过、结果固定弹出
context_fact: 希恩斯说明设备可省略判断计算直接给出结果，常伟思因此追问被修改者还是人还是自动机器。
image_mechanism: 意识过程被拆成输入、计算、输出三段，技术像程序员越过运行过程，直接改写决定输出的那行指令。
property_alignment: 1）大脑对应计算机；2）思考对应运算；3）信念对应输出；4）思想钢印对应程序修改器；5）行为者对应被编程机器。
context_alignment: 对话双方正在区分思想能力与智力，计算机类比把伦理争议定位到自主计算是否仍存在，而非抽象喊思想控制。
narrative_function: 把思想钢印的技术机制翻译成清晰操作，并引出人格与自主性的核心质问。
transfer_rule: 脑机类比应逐项区分输入、过程、输出和修改位置，才能说明技术究竟辅助还是越过主体。
failure_boundary: 人脑不是确定性程序，信念也受情感、身体与社会关系影响；修改一个判断不等于把整个人变成机器。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 思想钢印绕过自主推理，直接改变人脑对一个命题真假的判断结果
vehicle: 编辑计算机程序中的指令或固定参数，使系统此后自动输出预定结果
ground: 1）人类思维对应程序；2）命题判断对应程序输出；3）钢印干预对应改代码；4）绕过思考对应跳过计算；5）固定信念对应写死参数；6）被修改者对应自动机器。
