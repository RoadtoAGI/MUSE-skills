quote: 也像国家一样成为了联合国的成员
sensory_mapping: 舰队脱缆成国、太空划界、统帅府执政、联合国席位新增
context_fact: 两个世纪后传统国家衰落，亚洲、欧洲和北美舰队与起源地无隶属关系，实力相当于旧时代超级大国。
image_mechanism: 原本作为国家工具的军队被整体抬升到国家层级，舰船组织获得疆界、政权和席位，政治地图从地表扩展到太空。
property_alignment: 1）太空舰队对应国家；2）统帅部对应中央权力；3）太空主权范围对应国土；4）政治经济实力对应国力；5）联合国席位对应国际承认。
context_alignment: 乔纳森随后列出独立性、实力和国际制度位置，类比不是修辞夸张，而是帮助旧时代来客理解新政治实体。
narrative_function: 用罗辑熟悉的国家模型解释舰队国际，迅速建立未来太阳系的权力结构。
transfer_rule: 把组织类比国家时，应逐项核对主权、辖区、治理、资源和外部承认，并指出其领土介质的差异。
failure_boundary: 舰队以军事组织起源、人口结构和领土流动性都不同于传统国家，也很少干涉地球社会。
