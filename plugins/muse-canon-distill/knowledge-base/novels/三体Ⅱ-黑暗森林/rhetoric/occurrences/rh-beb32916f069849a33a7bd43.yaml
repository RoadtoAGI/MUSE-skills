chapter: 正文
figure_type: simile
quote: 最耐高温的材料在它面前就像蜡一般熔化
sensory_mapping: 坚材软化、边缘滴流、外壳塌陷、热源白亮
context_fact: 反应器外壳屡被烧熔，工程师只能改用电磁场约束聚变核心，而这种约束仍常失效。
image_mechanism: 被称为最耐高温的硬材料在极端尺度下突然降格成蜡，读者熟悉的低熔点质感直接显示温差悬殊。
property_alignment: 1）工程材料对应蜡；2）聚变核心对应热源；3）结构失稳对应蜡软化；4）外壳破坏对应蜡流失；5）技术差距对应相对低熔点。
context_alignment: 前一比喻把核心写成太阳，本句用蜡说明任何实体容器面对太阳级热源都会失效，因果连续。
narrative_function: 把材料科学瓶颈从参数转成可见熔毁，为智子障碍前的推进困难提供具体证据。
transfer_rule: 以蜡表现强弱反转时，应先建立对象通常坚硬耐热，再给出足以让它相对变软的极端参照。
failure_boundary: 材料熔化温度仍远高于蜡且机理不同；电磁隔离可避免直接接触，不能据此断言所有约束必败。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类最耐热材料接触失控聚变核心温度时迅速失去强度并化为液态
vehicle: 蜡受普通热源加热后轻易软化、塌陷并流淌
ground: 1）耐热材料对应蜡；2）聚变高温对应火焰；3）迅速熔毁对应蜡化；4）原有坚固失效对应软塌；5）材料上限悬殊对应低熔点错觉。
