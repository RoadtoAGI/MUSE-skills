chapter: 正文
figure_type: simile
quote: 一块圆形的雨云像晴空中的巨形飞碟般悬在天线上方
sensory_mapping: 晴空中只有一块圆云压在镜面天线上，平展边缘像巨大飞碟悬停并向下落雨
context_fact: 密集引力波使大气水汽只在半径三四公里范围聚集，局部降雨外仍能看到灿烂阳光。
image_mechanism: 自然云团因人工波束获得规则边界和悬停位置，被视觉归类为人工飞行器，突出局地天气的异常。
property_alignment: 1）云盘对应碟身；2）波束范围对应固定航位；3）孤立白云对应单一飞行物；4）落雨对应下方作用。
context_alignment: 云由外星技术启发的引力波天线制造，飞碟意象以旧式科幻形象包住真实未来奇观，带温和童话感。
narrative_function: 将威慑设施的副作用写成可观看奇观，为黑暗森林终章营造和平时代的陌生美。
transfer_rule: 云作飞碟时，应有规则轮廓、孤立晴空、相对固定位置和下方参照物，避免只因云是圆的。
failure_boundary: 雨云会被风吹散且没有刚性、动力或驾驶者；类比只描述一时外形和悬停观感。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 引力波束聚水形成、边缘近圆且局部悬在天线上空的孤立雨云
vehicle: 一艘巨大圆盘飞碟悬停在晴朗天空，轮廓规则、位置固定并与周围空域明显分离
ground: 1）圆形云区对应碟形轮廓；2）局部悬停对应飞碟停空；3）尺度巨大对应巨型载具；4）晴空孤云对应孤立物体；5）天线在下对应降临目标。
