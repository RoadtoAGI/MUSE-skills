chapter: 正文
figure_type: analogy
quote: 飞船的乘客大部分时间都是在冬眠中度过的，一百年感觉跟一天差不多
sensory_mapping: 时间、意识连续性、身体状态
context_fact: 史晓明用冬眠劝张援朝相信后代不必清醒承受漫长星际航行。
image_mechanism: 把百年日历折叠进一次睡眠的意识空白，只保留入眠与醒来两个端点，主观航程因此缩成日常单位。
property_alignment: 1）百年冬眠对应一夜睡眠的意识缺口；2）长期不活动对应一天内较少体验；3）醒来面对目的地对应一天结束后进入下一段生活。
context_alignment: 类比服务推销，准确抓住主观体验，却有意跳过身体风险、设备可靠性与世代社会成本，符合诱导性话术。
narrative_function: 把难以承受的航程包装成轻松睡眠，增强逃亡基金对普通人的诱惑并暴露其信息删减。
transfer_rule: 比较主观时长时，应说明意识是否连续、记忆是否形成、起止状态如何衔接，而非只比较钟表长度。
failure_boundary: 一天与百年的客观风险、设备依赖和外界变化完全不同；冬眠若有间歇清醒或记忆体验，主观等时关系也会失效。
