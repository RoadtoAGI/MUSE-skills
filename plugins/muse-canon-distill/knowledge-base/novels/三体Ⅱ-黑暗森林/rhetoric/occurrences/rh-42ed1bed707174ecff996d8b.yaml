confidence: 0.96
review_status: reviewed
tenor: 冬眠乘客跨越百年航程时的主观时间体验
vehicle: 清醒者度过普通一天的短暂体验
ground: 1）冬眠削弱连续意识对应一天很快过去；2）醒来前后主观间隔短对应睡醒后的时间压缩；3）漫长航程无需逐日承受对应一天的心理负担。
