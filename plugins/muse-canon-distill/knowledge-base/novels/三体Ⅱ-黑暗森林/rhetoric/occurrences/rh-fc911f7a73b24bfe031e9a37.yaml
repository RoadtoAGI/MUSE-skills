quote: 阴影却是从上层开始出现的
sensory_mapping: 星舰社会分成楼层、黑影先罩住指挥层、再沿层级向下漫延、眼睛中的光一层层熄灭
context_fact: 第二战勤部原先重点监测士兵，实际沉默、回避和阴郁最先出现在中校以上人群。
image_mechanism: 组织层级的抽象‘上层’与光学阴影叠合，危机传播同时获得垂直方向和明暗变化。
property_alignment: 1）军衔结构对应楼层；2）高层症候对应上方阴影；3）精神正常对应受光；4）扩散到下级对应影子下移。
context_alignment: 高层先掌握燃料真相，阴影由知识而生；喻体准确反转了心理部门关于下层先失控的经验。
narrative_function: 用一个方向性图像指出调查盲区，并为眼中阳光消失的群体症候串联视觉母题。
transfer_rule: 组织危机作阴影时，应利用层级方位、遮光来源、扩散路径和亮暗基准，揭示谁先知道什么。
failure_boundary: 心理危机不按光学边界传播，个体差异仍大；‘上层’军衔与物理高度只是语言重合。
