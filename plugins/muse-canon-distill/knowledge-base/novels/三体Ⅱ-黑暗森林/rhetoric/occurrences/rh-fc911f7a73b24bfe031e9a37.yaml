tenor: 资源死局引发的心理失衡首先出现在掌握更多信息、责任更重的高级军官群体
vehicle: 遮光物投下暗影，阴影从高处或上层区域扩散，逐渐覆盖下方并使亮处变暗
ground: 1）心理危机对应阴影；2）高级军官对应上层；3）症候出现对应光被遮；4）向低层蔓延对应暗区扩展；5）正常精神对应阳光。
