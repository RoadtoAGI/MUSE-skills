tenor: 文明一旦跨过技术阈值，人口和活动范围可指数扩张，在宇宙时间尺度内迅速占满银河资源
vehicle: 单个微生物按固定周期分裂，在养料充足时后代几天内由不可见增长到填满全部海洋
ground: 1）初生文明对应单细菌；2）技术复制扩张对应分裂；3）星际资源对应养料；4）百万年对应数日；5）银河占满对应海洋填满。
