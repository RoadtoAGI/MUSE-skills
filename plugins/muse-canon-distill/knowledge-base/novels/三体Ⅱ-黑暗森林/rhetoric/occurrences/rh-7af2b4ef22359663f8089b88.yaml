quote: 如果海中有一个肉眼看不到的细菌，半小时分裂一次
sensory_mapping: 微小文明像细菌藏在星海、每个周期复制新殖民点、指数后代迅速把银河水域挤满
context_fact: 罗辑指出人类和三体仍处文明婴儿期，但按当前航速一百万年即可扩展整个银河。
image_mechanism: 宇宙尺度被缩成培养环境，文明扩张获得可计算繁殖过程，‘小文明不构成威胁’的直觉被增长速度推翻。
property_alignment: 1）文明单位对应细菌；2）殖民复制对应细胞分裂；3）恒星系对应生长空间；4）物质资源对应培养基；5）技术阈值对应进入快速繁殖期。
context_alignment: 生命公理用生命自身最简复制模型说明，喻体与论题同源且容易让大史理解数量级。
narrative_function: 把有限资源冲突从遥远假设推成短暂宇宙时间内的必然压力。
transfer_rule: 文明扩张类比微生物时，应对应复制单位、周期、培养资源、边界和饱和时间，并标注抑制因素。
failure_boundary: 文明扩张不是无差别细胞分裂，会受政治、距离和技术选择影响；百万年估算也非实测预言。
