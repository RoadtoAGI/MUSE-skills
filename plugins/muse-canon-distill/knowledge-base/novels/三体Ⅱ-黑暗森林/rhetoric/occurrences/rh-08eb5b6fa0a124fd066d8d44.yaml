chapter: 正文
figure_type: metaphor
quote: 请你做自己的破壁人，找出这是为什么
sensory_mapping: 思想高墙、秘密藏后、自我持锤、裂口显现
context_fact: PDC研究未发现罗辑有超能力或学术过人之处，唯一确定事实是三体文明直接命令刺杀他。
image_mechanism: 外部敌人看见了藏在罗辑内部、连本人也不知的战略价值；萨伊把破壁人的工具转交给墙内之人，让他从两侧同时凿墙。
property_alignment: 1）罗辑内在原因对应墙后内容；2）认知盲点对应墙体；3）自我分析对应破壁行动；4）答案对应破壁后暴露的战略。
context_alignment: 此前破壁人揭穿泰勒造成死亡，此处同一角色被改写为自救任务，既承接制度术语又启动罗辑真正工作。
narrative_function: 把‘为何怕我’转成可执行的核心悬念，完成罗辑由被保护者到主动思考者的转折。
transfer_rule: 让人物成为自己的破壁人，应存在明确的内在盲区、外部异常证据和可反向追索的隐藏因果。
failure_boundary: 自省可能受同一盲点限制，答案也可能位于叶文洁提示或三体情报等外部信息中；自我破壁不保证成功。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑必须把自己当作面壁者的隐蔽对象，反向分析三体文明为何唯一害怕他
vehicle: 专门揭穿面壁者秘密战略、拆除思想之墙的破壁人
ground: 1）罗辑未知能力对应墙后秘密；2）自我认知屏障对应墙；3）反省推理对应破壁；4）罗辑兼任分析者对应自己的破壁人；5）找到恐惧原因对应墙被打开。
