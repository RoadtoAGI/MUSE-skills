tenor: 宇宙冷却后进入黑暗阶段才形成重元素、行星和生命，叙述又将黑暗环境视为新星舰文明的生成条件
vehicle: 母亲孕育并生产子女，提供形成身体的物质环境；孩子由母体而生并继承其来源标记
ground: 1）宇宙黑暗期对应母体；2）重元素沉淀对应孕育材料；3）行星生命形成对应分娩；4）黑暗新人类对应后代；5）文明延续对应母系繁衍。
