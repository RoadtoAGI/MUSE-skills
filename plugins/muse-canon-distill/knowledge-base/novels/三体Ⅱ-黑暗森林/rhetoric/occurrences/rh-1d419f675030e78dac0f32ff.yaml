quote: 黑暗是生命和文明之母
sensory_mapping: 大爆炸光焰熄成灰烬、黑暗像子宫包住重元素、行星在其中凝结、生命与文明从暗处出生
context_fact: 叙述回溯宇宙由光态冷却成灰烬、形成重元素与生命，并紧接两艘黑暗之船远航。
image_mechanism: 宇宙学因果被亲缘化，通常负面的黑暗不再只是缺光，而成为容纳物质凝聚与生命出生的生产环境。
property_alignment: 1）黑暗宇宙对应母体；2）灰烬重元素对应孕育物质；3）行星形成对应胎体成形；4）生命文明对应子女；5）星舰黑暗伦理对应新一代。
context_alignment: 黑暗战役后立即出现，既为幸存者的自我命名提供宇宙尺度正当化，也保留令人不安的价值反转。
narrative_function: 把星舰事件嵌入宇宙演化史，提出全书‘黑暗孕育文明’的核心悖论图像。
transfer_rule: 抽象条件作母亲时，应列出孕育材料、形成过程、出生对象和继承关系，并区分因果解释与价值辩护。
failure_boundary: 宇宙黑暗没有生育意志，生命形成还需恒星能量；物理起源不能证明互杀伦理正确。
quality_assessment: exemplary
