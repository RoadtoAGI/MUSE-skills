chapter: 正文
figure_type: simile
quote: 这岩浆穿过他们的身体，竟像清泉般清凉
sensory_mapping: 红浆流过、清泉凉意、身体透明、灼热反转
context_fact: 卢浮宫崩塌并化为红亮岩浆，罗辑与庄颜随建筑下坠却未受伤。
image_mechanism: 视觉仍保留岩浆红光，触觉却被爱情倒置为泉水凉意；两种互斥感官在身体穿透处叠合。
property_alignment: 1）岩浆对应清泉；2）穿体流动对应水流；3）幸福清凉对应泉温；4）不受伤对应泉水温和。
context_alignment: 整段是情感极限引发的物性反转，“竟”明确标出热与凉冲突，使通感服务超现实状态。
narrative_function: 证明罗辑已脱离生存法则，毁灭性坠落被体验为爱情恩泽。
transfer_rule: 反常感官比喻要保留对象原有危险外观，再用另一个感官通道精确翻转预期，并交代主观状态。
failure_boundary: 现实岩浆必致灼伤，清凉只存在幻视；常规写实场景若无意识改变，反转会破坏可信度。
quality_assessment: exemplary
