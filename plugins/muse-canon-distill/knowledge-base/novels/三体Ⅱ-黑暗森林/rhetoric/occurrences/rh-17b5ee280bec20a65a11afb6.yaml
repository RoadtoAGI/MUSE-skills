tenor: 爱情幻视中穿身而过的红亮岩浆给罗辑带来的反常清凉、幸福感受
vehicle: 清澈泉水流过身体时凉爽、洁净而无伤害的触感
ground: 1）流体穿过对应泉水流动；2）主观清凉对应泉水低温；3）无烧伤对应清泉温和；4）红亮危险外观对应与清凉触感反差；5）情感净化对应泉水洁净。
