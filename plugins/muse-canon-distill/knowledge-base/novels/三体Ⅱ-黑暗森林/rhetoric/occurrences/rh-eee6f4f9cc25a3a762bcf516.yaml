context_fact: 罗辑刚从休克中恢复，随即被抬上担架、围护并送入救护车。
image_mechanism: 救援流程压缩成一道亮线，多个动作不再逐步展开，只留下被击中者意识里的瞬时闪片。
property_alignment: 1）救援启动对应闪电发生；2）动作速度对应光闪；3）视觉片段对应闪光照物；4）危险氛围对应雷暴。
context_alignment: 叙事紧贴眩晕中的罗辑，他无法完整感知程序；一句短喻与急救节奏同步。
narrative_function: 加速袭击后的叙事时间，同时保持受伤者被动、失序的视角。
transfer_rule: 闪电写速度时，可让句法压缩和有限视野配合，呈现过程只剩起点、亮点与结果。
failure_boundary: 闪电只强调短促突发，不说明救援是否高效准确；用于持续运动或精细步骤会抹平过程。
