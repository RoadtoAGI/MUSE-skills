chapter: 正文
figure_type: simile
quote: 看到黑子像乌云般飘过
sensory_mapping: 金色日轮、黑团横移、亮面被压暗、云状缓飘
context_fact: 水星天空中太阳占据巨大面积，观察者可以直接分辨火海浪涌、黑子和日珥。
image_mechanism: 遥远天文黑点被拉近到天气尺度，太阳表面成为天空，暗斑获得云团的体积感与缓慢运动。
property_alignment: 1）太阳光球对应天空；2）黑子对应乌云；3）亮度降低对应遮光；4）自转位移对应飘移；5）轮廓变化对应云形变化。
context_alignment: 水星的黑金双色世界使暗斑与金色日轮形成云天式对照，贴合观察距离骤近后的视觉经验。
narrative_function: 把天文尺度的太阳活动转成可观看的天气，为紧随其后的水星核爆建立宏大背景。
transfer_rule: 把恒星表面结构写成天气时，应对齐亮暗关系、运动速度与视域尺度，避免只靠颜色命名。
failure_boundary: 黑子是较低温的磁活动区，不是遮挡光线的水汽云，也不会被大气风推动。
quality_assessment: effective
