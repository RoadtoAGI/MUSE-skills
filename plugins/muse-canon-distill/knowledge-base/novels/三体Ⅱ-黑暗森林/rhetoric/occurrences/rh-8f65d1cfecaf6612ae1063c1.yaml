tenor: 在水星近距离观看时，太阳光球表面缓慢移动的巨大暗黑斑块
vehicle: 明亮天空中成团压暗、随气流缓慢漂移的乌云
ground: 1）太阳黑子对应乌云；2）光球对应明亮天空；3）低亮暗色对应云层遮光；4）跨日面移动对应云团飘移；5）尺度庞大对应大片云块。
