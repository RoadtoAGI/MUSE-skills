quote: 每一颗星星就是一个神经元
sensory_mapping: 细胞点亮成星、银边星海包围、触须联成星网、思维化作宇宙天气
context_fact: 解析摄像机全息图从白雾逐级放大，微粒变成密集星星，惠子明确告诉希恩斯每星即一神经元。
image_mechanism: 微观脑组织通过尺度反转升格成宇宙，单细胞得到恒星亮度，有限颅腔展开为可进入的无边星海。
property_alignment: 1）神经元对应恒星；2）脑组织对应银河系；3）突触连接对应星际网络；4）电脉冲对应星光流动；5）思维模式对应星海扰动；6）观察者对应宇宙航行者。
context_alignment: 一千亿这一数字恰与银河恒星数量形成直觉呼应，显示系统又真实使用发光点，使比喻外观、数量和结构三重贴合。
narrative_function: 建立整段脑科学奇观的母体意象，后续星潮、河流与旋涡都从这座‘大脑宇宙’自然生成。
transfer_rule: 微观系统作宇宙时，应对齐单元数量、发光方式、连接尺度和观察视角，并让后续动态共享同一框架。
failure_boundary: 神经元受生物网络紧密连接，恒星间大多无直接触须；空间尺度和物理作用不可按比例转移。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 全息显示把一千亿个脑神经元放大并发光，组成可供人在其中漫步观察的三维大脑模型
vehicle: 一千亿颗相互分布于银河空间、发光并由巨大星海组织起来的恒星
ground: 1）神经元对应星星；2）细胞发光点对应星光；3）一千亿数量对应银河星数；4）大脑整体对应宇宙；5）突触对应星间触须网络；6）神经活动对应星潮星河。
