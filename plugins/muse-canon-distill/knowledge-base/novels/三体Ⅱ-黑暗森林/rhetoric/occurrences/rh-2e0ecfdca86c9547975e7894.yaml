chapter: 正文
figure_type: simile
quote: 这忧伤在五年里一直伴随着她，就像永远播放着的背景音乐
sensory_mapping: 低声循环、日常底噪、旋律渗透、前景活动覆盖
context_fact: 庄颜从初见起知道自己将来会离开，忧伤一直在目光中，却未否定真实爱情与快乐。
image_mechanism: 情绪被移到生活声场的后排，以低音量持续循环；前景笑声越丰富，耳朵越习惯而不再主动听见它。
property_alignment: 1）忧伤对应背景音乐；2）五年相伴对应循环播放；3）淡而不显对应低音量；4）生活事件对应前景声部。
context_alignment: 庄颜在卢浮宫提出表情语言，罗辑长期从目光读信息却漏掉恒常底色；音乐习惯化解释了“没掩盖却觉察不到”。
narrative_function: 重新解释五年幸福中始终存在的悲剧知情，使庄颜从被动天使变成承担秘密的人。
transfer_rule: 背景音乐喻写长期情绪要设置稳定音量、前景事件和习惯化机制，说明为何持续却被忽视。
failure_boundary: 音乐有作曲和重复结构，忧伤未必如此规则；强烈发作或明确表达时它已进入前景，不再适用背景。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 庄颜因知道家庭幸福将被中止而长期存在、低强度且不占据表面的忧伤
vehicle: 持续五年不停播放、音量不高而融入日常环境的背景音乐
ground: 1）忧伤持续对应音乐不停；2）强度淡对应音量低；3）不易察觉对应习惯化背景；4）伴随所有生活对应音乐覆盖场景；5）影响气氛对应配乐定调。
