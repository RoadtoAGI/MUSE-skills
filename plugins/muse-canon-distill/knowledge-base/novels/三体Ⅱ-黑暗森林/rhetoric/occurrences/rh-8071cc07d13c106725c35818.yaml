quote: 两个世纪前那支军队的血脉仍在太空舰队中延续
sensory_mapping: 旧军体内血流跨越年代、进入新舰队躯体、称谓唤醒家族温度
context_fact: 司令官用‘我们’和‘传统’要求章北海接受任务，使他感到旧军队的语言与伦理仍被舰队承认。
image_mechanism: 制度连续性被身体化为血液传递，抽象传统因此具有温度、亲缘和不可见却持续流动的生命感。
property_alignment: 1）旧太空军对应先辈；2）亚洲舰队对应后裔；3）军人传统对应血液；4）术语与礼仪对应遗传特征；5）组织沿革对应繁衍；6）章北海温暖对应认亲。
context_alignment: 章北海刚面对舰队已成独立国家的陌生感，血脉意象把政治断裂重新解释为军人谱系连续，贴合他的身份需求。
narrative_function: 建立章北海对新舰队的情感归属，也为他以‘保存人类火种’之名夺舰增加复杂伦理。
transfer_rule: 传统作血脉时，应提供可识别的继承特征、代际载体和认亲时刻，使连续性有文本证据。
failure_boundary: 组织传统通过教育制度传递而非生物遗传，新舰队价值也可能变化；亲缘感不能抹平政治独立。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 旧中国太空军的价值、传统、组织记忆和身份认同仍被未来亚洲舰队继承
vehicle: 家族生命通过血液和遗传关系从祖辈流向后代，使不同世代保持共同出身
ground: 1）旧军队对应祖辈；2）太空舰队对应后代；3）传统对应血脉；4）制度传承对应遗传；5）共同称谓对应家族识别；6）两世纪延续对应代际繁衍。
