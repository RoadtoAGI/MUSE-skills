quote: 那纯真的微笑像浸透阳光的露珠，轻轻地滴到他心灵中最干涸部分
sensory_mapping: 亮露珠、轻滴、干地吸水、暖光渗入
context_fact: 庄颜问“那一定很难吧”，这是罗辑成为面壁者后第一次得到关切，令他眼眶湿润。
image_mechanism: 一个表情凝成含光水滴，从她脸上落入罗辑内部最龟裂的土地；温度与水分同时进入，缓解长期缺水。
property_alignment: 1）微笑对应露珠；2）纯真对应清澈；3）关怀对应水分；4）罗辑孤独心灵对应干地；5）感动对应吸水。
context_alignment: 罗辑真实落泪提供水意，庄颜的明亮形象提供阳光，面壁者遭猜疑的长期处境解释“干涸”。
narrative_function: 把一句日常问候写成罗辑情感防线被突破的关键，深化其依赖来源。
transfer_rule: 滋润心灵的水喻要同时给出缺水史、具体水量和进入动作；小善意宜用露珠而非洪流。
failure_boundary: 一滴露珠只能带来局部短暂缓解，不能代表创伤痊愈；若关怀强烈持续，露珠尺度会偏小。
