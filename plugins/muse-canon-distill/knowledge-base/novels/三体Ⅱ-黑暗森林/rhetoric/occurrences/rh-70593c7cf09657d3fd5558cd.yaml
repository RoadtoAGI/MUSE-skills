context_fact: 史强不能陪罗辑进入大会厅，只挥手说在外等；罗辑身边其余人都隐藏信息。
image_mechanism: 陌生制度压力化成头顶重物，史强的一个挥手竖起唯一立柱；门一关，罗辑必须独自承受。
property_alignment: 1）大史对应支柱；2）罗辑内心对应建筑；3）未知压力对应荷载；4）信任对应承重连接。
context_alignment: 此前会场大壁已像将倾悬崖，支柱与真实建筑压力同域，精确补上罗辑此刻需要的稳定结构。
narrative_function: 确认二人快速形成的信任，并在罗辑独自入场前提升失去陪伴的风险。
transfer_rule: 支柱写人际依靠时，应说明被支撑的具体心理结构、外部荷载和其他支点为何缺席。
failure_boundary: 史强无法替罗辑作决定，单一依赖也可能脆弱；支柱不等于对方理解全部内心。
