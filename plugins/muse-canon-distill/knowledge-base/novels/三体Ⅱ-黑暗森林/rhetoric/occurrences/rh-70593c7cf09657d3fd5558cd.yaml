tenor: 罗辑在陌生会场和未知任命前唯一能提供心理稳定与信任的人
vehicle: 独自承住上方重量、防止结构倒塌的一根柱子
ground: 1）罗辑精神状态对应受压建筑；2）史强的熟悉与可靠对应承重柱；3）其他信息和关系缺失对应只剩一柱；4）大史离开对应支撑撤走；5）心里一热对应重新受力稳定。
