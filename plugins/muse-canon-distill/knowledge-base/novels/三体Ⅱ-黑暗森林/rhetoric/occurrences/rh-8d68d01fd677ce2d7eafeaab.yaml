quote: 那将是太阳系最壮丽的乐章，可惜人类只能欣赏最初的一个半小节
sensory_mapping: 行星依次奏响、太阳声部暴涨、毁灭交响推进、听众开场即消失
context_fact: 破壁人赞叹计划疯狂而壮观，同时指出地球会在前三颗类地行星阶段即毁灭，无法见证后续。
image_mechanism: 无声天体力学获得时间化音乐结构，每次撞击成为新声部；美感与听众死亡被并置，赞叹因此冷酷。
property_alignment: 1）太阳系灾变对应乐章；2）行星对应乐器声部；3）坠日次序对应小节推进；4）能量升级对应音量递增；5）人类对应听众；6）灭绝时点对应演出开头退场。
context_alignment: 破壁人以居高临下的审美口吻羞辱雷迪亚兹，音乐喻体既承认设计壮丽，也揭露美只能由灭绝后的空宇宙完成。
narrative_function: 把机械连锁反应升格为艺术作品，刻画破壁人的冷静残酷并刺激雷迪亚兹暴怒。
transfer_rule: 灾难作音乐时，应对齐时间序列、强度层次、参与声部和听众位置，同时显露审美化的伦理代价。
failure_boundary: 行星灾变没有作曲意图或可听旋律，人类死亡更不能被美学成就抵偿；乐章只组织叙事节奏。
