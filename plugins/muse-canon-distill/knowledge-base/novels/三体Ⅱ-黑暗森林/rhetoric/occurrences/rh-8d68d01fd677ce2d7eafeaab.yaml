tenor: 水星坠日引发各行星依次坠落、恒星喷流不断增强的连锁毁灭过程，以及人类会在早期便灭绝
vehicle: 规模宏大的交响乐按乐句逐层推进、声部增强，但听众在开头一小段后便无法继续聆听
ground: 1）连锁灾变对应乐章；2）各行星坠落对应连续音符声部；3）喷流增强对应音乐递强；4）太阳系尺度对应宏大编制；5）人类观察对应听众欣赏；6）早期灭绝对应只听一半小节。
