chapter: 正文
figure_type: simile
quote: 章北海沉稳的目光像一个强劲的力场维持着阵列的稳定
sensory_mapping: 五千人像将散开的粒子、章北海眼中放出无形场线、阵列被稳稳托住、哭意压回队形
context_fact: 官兵感到被地球抛弃、只想哭，但面对章北海仍保持方阵并接受其领导。
image_mechanism: 个人权威由话语转成遍布空间的物理作用，不需逐人安抚便同时稳定整个群体。
property_alignment: 1）章北海对应场源；2）目光覆盖对应场域；3）个体舰员对应受力点；4）情绪崩散对应粒子离位；5）军纪对应稳定构型。
context_alignment: 太空舰内的军官方阵本就像物理阵列，物理学语汇贴合环境，也承接章北海父亲目光的视觉母题。
narrative_function: 把领袖魅力的群体效应写成可见机制，解释五舰为何在崩溃时仍能完成政治起步。
transfer_rule: 人格影响作力场时，应标出场源、作用范围、受力单位、扰动和稳定后的结构。
failure_boundary: 目光不能真实施力，官兵服从还来自章北海的预见、军衔和共同危机，而非单一凝视。
quality_assessment: exemplary
