context_fact: 罗辑向临时伴侣吹嘘自己研究外星人比翻故纸堆的明星学者新鲜。
image_mechanism: 把学术对象从“旧材料”骤降为尸体，再把研究兴趣污名化为性癖，以生理厌恶代替学术评价。
property_alignment: 1）故纸中的过去文化对应死者遗体；2）持续研究对应执迷接近；3）公众厌倦对应旁观者产生厌恶。
context_alignment: 罗辑此刻夸张、自恋、急于显得新潮，粗暴隐喻符合他的炫耀语气，也暴露论断不严谨。
narrative_function: 用冒犯性机智刻画罗辑的轻浮锋利，并让“宇宙社会学”在他口中先以媒体卖点出现。
transfer_rule: 人物使用攻击性比喻时，要让喻体同时暴露说话者的价值偏见、社交目的和对对象的压缩方式。
failure_boundary: 历史文化并非无生命尸体，研究旧材料也不等于病态迷恋；脱离罗辑自夸语境使用会成为廉价人身攻击。
