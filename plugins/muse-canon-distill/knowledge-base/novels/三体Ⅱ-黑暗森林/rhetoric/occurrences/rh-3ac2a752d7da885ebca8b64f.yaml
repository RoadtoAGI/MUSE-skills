chapter: 正文
figure_type: simile
quote: 如洗的蓝天
sensory_mapping: 水洗、去尘、纯蓝表面、空无一物
context_fact: 史强告知将冬眠治病后挂断电话，罗辑抬头时警卫无人机已经消失。
image_mechanism: 天空被想象成可擦洗的蓝色平面，云尘和飞行物一并被水带走，只留下过度干净的空白。
property_alignment: 1）天空对应表面；2）云尘对应污迹；3）澄澈对应洗净；4）无人机消失对应杂物清除。
context_alignment: 雨后天气支持洗净观感，下一分句随即用空荡内心承接，常规成语在此成为情绪空白的铺垫。
narrative_function: 先清空视觉背景，再让史强离去造成的心理空缺投射其上。
transfer_rule: “如洗”应落在雨后、无尘或颜色骤明的可见状态，并服务后续构图，而非单独充当景物套语。
failure_boundary: 天空没有真实可洗表面；云层密布、灰霾或繁多物体存在时，该形容会与所见冲突。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 雨后澄澈、没有云雾与飞行物的蓝色天空
vehicle: 经水彻底洗去尘垢后干净明亮的蓝色表面
ground: 1）无云对应洗去污点；2）蓝色鲜明对应洗后显色；3）空气澄清对应表面洁净；4）无人机消失对应杂物被移除。
