figure_type: metaphor
quote: 惠子，随我一起去末日吧
sensory_mapping: 携手启程、漫长道路、远方终点、低声邀约
context_fact: 夫妻决定把脑科学做成世界工程，估计需两世纪；希恩斯随后邀请惠子同行。
image_mechanism: 抽象时间跨度折成一条可走道路，“末日”从灾难日期变成远方地名，科研婚姻成为双人远征。
property_alignment: 1）夫妻对应旅伴；2）冬眠对应交通；3）研究阶段对应路程；4）末日时代对应目的地；5）共同承诺对应同行。
context_alignment: 庄严使命被说成近乎婚姻式私语，与竹林中克制夫妻的关系相符；“有的是时间”又轻轻回应漫长路途。
narrative_function: 以一句亲密邀约完成希恩斯计划立项，把全球工程落回两个人的共同选择。
transfer_rule: 把未来事件写成目的地时，应让同行关系、交通手段、路程长度和抵达后的任务都可对应。
failure_boundary: 末日不是可安全抵达的地点，冬眠也伴随风险；旅行浪漫感不能遮蔽全球资源和伦理代价。
