tenor: 希恩斯邀请妻子共同冬眠、跨越两个世纪投入直至末日战争的研究使命
vehicle: 两名旅伴携手启程，前往名为“末日”的遥远目的地
ground: 1）冬眠跨时代对应长途旅行；2）末战时代对应目的地；3）共同研究对应结伴同行；4）两世纪计划对应漫长路程；5）接受邀请对应一起出发。
