quote: 我身上的十字架是卸不掉的
sensory_mapping: 无形十字架压在章北海背上、两百年仍未卸下、每次看见飞船便重新感到重量
context_fact: 东方以历史评价和法律时效安慰他，他回答罪责无法卸下，并说自己因此与飞船不可分。
image_mechanism: 道德记忆获得宗教刑具的重量、形状与持续接触，使抽象内疚成为人物必须身体携带的负担。
property_alignment: 1）旧日罪行对应刑架；2）自我审判对应背负；3）漫长时间对应苦路；4）飞船成果对应可能救赎；5）疲惫对应负重损耗。
context_alignment: 前句岁月压弯腰，此处交代具体重物；章北海语言少见宗教色彩，显示罪感深过理性辩护。
narrative_function: 揭示他拒绝权力、执意留舰的心理根源，让英雄选择保留不可消解的伦理代价。
transfer_rule: 罪责作十字架时，应写明罪行、背负期限、救赎目标与卸除失败，避免把普通压力随意宗教化。
failure_boundary: 章北海并非宗教受难者，其杀人对象和责任不能因‘牺牲’叙事自动获得救赎。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 章北海认为自己为推动辐射驱动而杀人的道德罪责将终身附着，历史肯定和法律时效都不能解除
vehicle: 受难者背负沉重十字架走向刑场，木架压在身体上无法卸下，同时标记罪、牺牲与救赎
ground: 1）杀人记忆对应十字架；2）终身罪责对应持续背负；3）推动宇航对应牺牲目的；4）心理疲惫对应重量；5）无法被评价解除对应卸不掉。
