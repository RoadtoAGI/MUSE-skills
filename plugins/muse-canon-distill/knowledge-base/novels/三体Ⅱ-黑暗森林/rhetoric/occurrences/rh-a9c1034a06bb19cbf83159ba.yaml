quote: 充满液体的舱室压力环境与深海类似，这种液体现在被用于作为宇宙航行超高加速中的人体保护液
sensory_mapping: 舱室灌满液体、肺部吸入深海、压力从内外合拢、飞船化成高速潜器
context_fact: 最高推进功率产生人体承受极限十倍以上超重，系统要求全员进入所谓‘深海状态’后才允许启动。
image_mechanism: 沿飞船轴向的巨大惯性负荷被重新理解为包围式水压，液体填充把太空加速舱变成深海抗压环境。
property_alignment: 1）超重对应海压；2）深海加速液对应水体；3）人体组织对应深海生物；4）体液充满对应内压；5）舱室液压对应外压；6）高加速生存对应深潜生存。
context_alignment: 技术源自超深潜设想，名称不是装饰性比喻，而由相同的压力平衡机制支撑，并连接太空舰队的海军传统。
narrative_function: 把陌生的120G防护技术转成可理解的深海机制，同时明确章北海夺舰前必须绕过的安全门槛。
transfer_rule: 跨环境工程类比应共享因果机制而非外观，此处核心是液体填充、内外压差与组织承载三者同构。
failure_boundary: 超重具有固定方向并随加速度变化，深海静水压近似各向同性；两种环境的失效模式并不完全相同。
