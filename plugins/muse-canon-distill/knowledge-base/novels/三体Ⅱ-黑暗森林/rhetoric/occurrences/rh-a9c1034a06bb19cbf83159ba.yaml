tenor: 飞船以120G加速时，用富氧液体充满舱室、肺部和脏器，使人体内外受力趋于均衡以承受超重
vehicle: 深海潜水时高压水体从各方向包围身体，体内也充满压力相当的液体，使生物组织不被压差破坏
ground: 1）120G惯性压力对应深海水压；2）加速液对应海水；3）球舱对应深海环境；4）肺与脏器充液对应深海鱼体液；5）内外平衡对应抗压；6）前进四对应下潜深度。
