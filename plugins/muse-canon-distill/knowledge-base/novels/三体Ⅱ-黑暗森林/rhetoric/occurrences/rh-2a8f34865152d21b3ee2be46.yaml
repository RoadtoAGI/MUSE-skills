quote: 发动机喷口像萤火虫般闪亮着
sensory_mapping: 黑空如夜、一点萤光离开巨舰、亮点缓缓飞远、很快融进星海
context_fact: 穿梭艇载四人从量子号阴影进入阳光，向一千公里外目标航行。
image_mechanism: 推进器的工业火光被生物化为夜虫冷光，载具和四条生命一起缩成宇宙背景中的微小闪点。
property_alignment: 1）穿梭艇对应萤火虫；2）发动机喷口对应发光腹部；3）航行对应飞行；4）太空黑暗对应夜色；5）小尺度对应虫体；6）远去光点对应虫光闪动。
context_alignment: 汽车、蜡烛、萤火虫连续缩小考察队，最后一个生命喻体使其在水滴前显得尤其易灭。
narrative_function: 以远景光点结束出发镜头，把考察队从舰队保护中视觉剥离。
transfer_rule: 远距移动尾光作萤火虫时，应对齐暗背景、冷小光点、缓慢视运动和生命脆弱感。
failure_boundary: 穿梭艇是高速机器，喷口能量远高于昆虫冷光；视尺度不能代表实际质量。
