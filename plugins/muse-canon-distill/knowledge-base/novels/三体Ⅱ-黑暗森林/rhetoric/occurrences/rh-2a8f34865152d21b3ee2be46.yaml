tenor: 穿梭艇远离母舰后，喷口在广阔黑暗中只呈一个微小、柔弱且移动的亮点
vehicle: 萤火虫在夜野中以腹部发出一点冷光，缓慢飞行，光点远小于周围暗域
ground: 1）喷口对应萤火器官；2）微光对应虫光；3）小艇移动对应飞虫；4）太空对应夜野；5）远距观测对应只见光点；6）脆弱生命对应小虫。
