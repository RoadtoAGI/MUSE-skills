quote: 罗辑的思维就堵塞在这里
sensory_mapping: 思路管道、障碍卡口、信息堆积、前方断流
context_fact: 罗辑确认宇宙社会学是刺杀原因，却无法从叶文洁的话中提炼出关键提示，随后反复拆解每个字。
image_mechanism: 连续推理被压入一条窄管，所有线索流到‘她究竟提示了什么’这一处便堆积，压力增加却没有出口。
property_alignment: 1）思维对应流体或车流；2）推理链对应通道；3）缺失概念对应障碍；4）重复分析对应堵点积压；5）洞见对应疏通。
context_alignment: 下文罗辑把话拆成念珠反复排列，正是对堵点逐件清障；最终锁定公理时流动重新开始。
narrative_function: 准确标记推理瓶颈，推动一月苦思而不需提前泄露答案。
transfer_rule: 思维堵塞喻应指出已走到哪一节点、何种信息卡住，以及后续如何疏通，不宜泛指疲劳。
failure_boundary: 推理可能方向错误而非局部堵塞，继续加压未必能通；若需换路，管道模型会诱导无效坚持。
