tenor: 水滴的驱动使其航线像被外部意志直接绘出，可无视人类动力学所规定的平滑转弯
vehicle: 全能创作者握住笔尖，在平面任意勾画折线，线条只服从作者意图而不服从画中世界规律
ground: 1）水滴对应笔尖；2）航迹对应画线；3）未知驱动对应神手；4）尖角转向对应随意折笔；5）动力学对应画内规则。
