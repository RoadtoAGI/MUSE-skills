chapter: 正文
figure_type: simile
quote: 像上帝的笔尖一样可以不理会动力学原理随意运动
sensory_mapping: 黑色宇宙成为纸面、银滴压成笔尖、折线被一笔勾出、舰队像纸上点位遭划穿
context_fact: 水滴以恒定高速在相隔数十公里的战舰间反复形成尖锐折角，普通飞行器无法做到。
image_mechanism: 把高维技术优势转成创作者与画内物的层级差，运动不是机动而像直接改写轨迹。
property_alignment: 1）太空对应画布；2）水滴对应笔尖；3）攻击折线对应笔画；4）三体技术对应执笔权；5）人类物理对应画中约束。
context_alignment: 舰队刚以宏大阵列自信亮相，神笔意象将人类从作战主体降成图纸上的可划除标记。
narrative_function: 表达技术差距不是性能差而是规则层级差，提升水滴攻击的超自然恐怖。
transfer_rule: 规则外力量作神笔时，应明确谁在画、画布为何物、笔迹如何改变对象，并让层级差落到具体动作。
failure_boundary: 水滴仍受某套更高技术物理规律控制，并非真的凭意志任意运动；宗教全能不可当机制说明。
