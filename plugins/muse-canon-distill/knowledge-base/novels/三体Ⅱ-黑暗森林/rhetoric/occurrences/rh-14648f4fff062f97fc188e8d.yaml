chapter: 正文
figure_type: simile
quote: 聚变核心像一个小太阳
sensory_mapping: 轨道小日、白热核心、强光刺夜、外壳熔退
context_fact: 核星爆发是反应器外壳被高温烧穿，聚变核心直接暴露，在地面夜空亮过金星。
image_mechanism: 工业装置的内部能量被解除外壳后升格为天体，尺寸被压小，恒星的光热机制却保留下来。
property_alignment: 1）聚变堆核心对应太阳；2）核聚变对应恒星能源；3）高温强光对应日照；4）同步轨道亮点对应小天体；5）外壳对应遮蔽层。
context_alignment: 对象确实通过核聚变发光发热，‘太阳’既是视觉尺度又是机制类比，比单说火球更贴切。
narrative_function: 解释核星名称与爆发亮度，并让反应器失控的材料难题一目了然。
transfer_rule: 人工能源作小太阳时，应同时具备聚变机制、光热强度和集中核心，不能只凭圆亮外观。
failure_boundary: 反应堆质量、引力与自持机制远非恒星，且需电磁约束；小太阳不能推导其能独立稳定燃烧。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 同步轨道聚变反应器外壳烧熔后暴露出的极亮、极热且持续释放巨大能量的核心
vehicle: 体积缩小但具有恒星级光热和聚变本质的一颗太阳
ground: 1）核心聚变反应对应太阳核聚变；2）高温对应太阳热量；3）强光对应太阳亮度；4）球状集中能量对应小型恒星；5）远地可见对应天体发光。
