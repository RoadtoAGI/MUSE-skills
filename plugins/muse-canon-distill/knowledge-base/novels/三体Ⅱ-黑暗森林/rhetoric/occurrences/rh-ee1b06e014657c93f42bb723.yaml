tenor: 罗辑被地下城投影出的纯净蓝天全面包围，戒备在美感与安全感中迅速软化
vehicle: 温暖而无边的蓝色介质伸臂环抱来者，并以热量把原本坚硬的物体融成流体
ground: 1）蓝天对应包围介质；2）视野覆盖对应拥抱；3）罗辑对应被抱者；4）心理戒备对应固体；5）美感安抚对应热量；6）信任增加对应融化。
