context_fact: 安保人员围住担架快速撤离，罗辑只能从众人的腿判断自己正被抬着移动。
image_mechanism: 站立人体合拢成垂直土壁，担架沉到坑底，移动救援因此呈现为一口会行走的坑。
property_alignment: 1）罗辑对应坑底人；2）护卫身体对应四壁；3）可见夜空对应坑口；4）视野阻断对应窄深。
context_alignment: 仰卧视角和护卫真实队形精确生成几何结构；“坑”兼具保护与禁闭感，贴合面壁者此后被安全体系围住的人生。
narrative_function: 把混乱撤离变成清晰视野构图，并预演保护即隔绝的身份悖论。
transfer_rule: 空间容器隐喻可从人物视线反推四壁、底部和开口，让周围身体或物体承担每个边界。
failure_boundary: 护卫圈会移动且以保护为目的，坑通常静止并困人；若强调主动协作或开阔视野，该喻体会失真。
