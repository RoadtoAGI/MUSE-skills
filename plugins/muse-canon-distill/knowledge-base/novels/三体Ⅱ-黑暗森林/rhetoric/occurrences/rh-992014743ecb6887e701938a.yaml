figure_type: simile
quote: 像是从那看不见的敌人的方向涌来的火海大潮
sensory_mapping: 红亮火海抬起潮墙、沿舰列平推、浪头疯狂翻卷、看不见的敌岸在其后方
context_fact: 碎片拦截在两列舰队之间形成平行焰火带，舰员仍误以为正与远方隐形力量交火。
image_mechanism: 离散爆点在视野中合成具有来向和压迫面的浪潮，使错误的敌军方位获得可见边界。
property_alignment: 1）爆裂碎片群对应海水；2）发光高温对应火海；3）平行屏障对应潮线；4）向舰队扩展对应涨潮。
context_alignment: 战场信息把水滴藏在碎片潮后，喻体准确表现舰队被宏大表象诱导、忽略微小真凶。
narrative_function: 制造一个规模符合人类预期的假敌人，让防御注意力从水滴攻击线上移开。
transfer_rule: 群体威胁作潮汐时，应给出连续前沿、明确来向、覆盖尺度和承压对象，使空间判断可视化。
failure_boundary: 碎片靠惯性三维散射而非液体重力流动，所谓敌岸也是指挥系统的错觉。
