tenor: 第二队列前方由连续爆裂的熔融碎片形成、沿战线翻滚扩张的高温发光屏障
vehicle: 由火构成的海潮从远方敌岸成片涌来，潮头平行推进、翻卷并吞没阻挡物
ground: 1）碎片屏障对应潮头；2）熔融亮光对应火海；3）平行战线对应海岸；4）持续爆发对应浪涛翻滚。
