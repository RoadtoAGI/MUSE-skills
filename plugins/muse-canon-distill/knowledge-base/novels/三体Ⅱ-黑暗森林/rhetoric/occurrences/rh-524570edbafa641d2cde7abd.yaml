quote: 斯科特仿佛置身于一个迷漫着昏暗雾霭的宇宙中
sensory_mapping: 舱壁退成宇宙深处、暗黄雾气漫过星图、斯科特面孔沉进阴影、目光躲开观察者
context_fact: 蓝西通过远程图像联系斯科特，发现其舱室刻意调暗，牧师本人疲惫且回避对视。
image_mechanism: 人工舱内布景与人物心境叠合，局部阴影扩展为包围他的整片昏暗宇宙。
property_alignment: 1）球形舱对应宇宙边界；2）星空图对应天体；3）黯淡黄光对应雾；4）斯科特心理对应迷航；5）隐藏面孔对应低能见度。
context_alignment: 星舰伊甸园正暗下来，牧师主动把外部黑暗搬进舱内，环境成为其已经接受黑暗结论的证据。
narrative_function: 在斯科特开口前先以视觉显示他无法提供明亮答案，并为伊甸园隐语营造宗教末世氛围。
transfer_rule: 室内心境作雾宇宙时，应让灯光、投影、人物位置和认知迷失一一对应，避免单靠‘暗’。
failure_boundary: 雾霭是灯光与影像效果，太空本无这种雾；斯科特仍清楚掌握资源死局，并非认知混乱。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 斯科特把球舱调成黯黄并投映星空，面孔藏在阴影里，整个人处于压抑、难以看清的心理环境
vehicle: 宇宙被昏暗雾气充满，光线散射、远近边界模糊，孤身者看不见方向也难被他人看清
ground: 1）球舱对应宇宙；2）黯黄光对应雾霭；3）星空投影对应星域；4）面孔阴影对应迷失者；5）心理混乱对应能见度下降。
