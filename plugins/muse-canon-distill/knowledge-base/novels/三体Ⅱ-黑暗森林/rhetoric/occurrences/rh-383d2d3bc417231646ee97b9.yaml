chapter: 正文
figure_type: metaphor
quote: 这是从三体势力海洋中溅出的一滴水
sensory_mapping: 浩瀚三体力量铺成深海、海面只轻溅一滴、这滴便穿透整支人类舰队、远处海洋仍未到来
context_fact: 人类预想宏大主力舰队，实际仅一个小探测器便完成屠杀，另有九个和一千艘主舰在后。
image_mechanism: ‘水滴’专名被嵌回海洋来源，单体威力与总体储量在同一比例图像中同时放大。
property_alignment: 1）三体文明总体对应海；2）单探测器对应滴；3）同类技术对应同质水；4）数量悬殊对应海滴比例；5）攻击外溢对应浪花飞溅。
context_alignment: 前文水滴名称偏向柔弱，此处名称成为力量计量单位：一滴已灭舰队，整海因此无法想象。
narrative_function: 把战术惨败提升为文明级力量判断，揭示真正主力尚未参战。
transfer_rule: 个体作整体海洋一滴时，应保证同源性、比例差、溅出路径和单滴效应都能被上下文核对。
failure_boundary: 三体力量不是均质连续体，探测器功能也不能代表全部舰队；‘溅出’不表示随机失控。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 毁灭联合舰队的探测器只是三体整体军事与技术力量中极微小、偶然先到的一部分
vehicle: 辽阔海洋中一次轻微扰动溅出单滴水，水滴与海洋同质却只占不可计量的小比例
ground: 1）三体势力对应海洋；2）探测器对应水滴；3）技术同源对应水质同源；4）体量比例对应一滴对海；5）先遣到达对应溅出。
