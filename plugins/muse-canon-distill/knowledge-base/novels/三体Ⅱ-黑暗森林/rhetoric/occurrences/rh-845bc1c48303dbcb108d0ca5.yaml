figure_type: simile
quote: 这里像一个吸毒者的地下室
sensory_mapping: 彩光下的房间沉成地下暗室，酒瓶、烟头和汗味堆积，主人蜷在最深角落
context_fact: 主任闻到酒气烟味汗味，看到满地瓶子烟头和落灰脏衣，罗辑瘦弱地缩在墙角。
image_mechanism: 零散污秽被成瘾空间模型整合，嗅觉、杂物和主人状态共同把崩溃写成长期生活系统。
property_alignment: 1）罗辑酗酒对应成瘾；2）居所封闭对应地下室；3）生活废物对应毒瘾环境；4）社交隔绝对应秘密藏身。
context_alignment: 主任从普通居住规范判断现场，吸毒者地下室是她熟悉的社会失序极端，准确传达厌恶而非同情。
narrative_function: 一眼核销罗辑从救世主到自弃者的坠落，并决定主任随后冷硬宣布驱逐。
transfer_rule: 居所作成瘾暗室时，应让气味、废弃物、光线、主人姿态和社会隔绝共同成立。
failure_boundary: 罗辑没有被写成吸毒者，房间也非真实地下室；比较只落在成瘾式失序和封闭环境。
