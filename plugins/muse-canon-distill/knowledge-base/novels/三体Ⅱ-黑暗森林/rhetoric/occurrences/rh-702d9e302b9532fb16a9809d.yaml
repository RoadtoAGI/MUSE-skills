quote: 星舰地球是宇宙文明的缩影
sensory_mapping: 整个银河缩进五个光点、资源与距离按比例压小、一次黑暗战役像模型实验显出宇宙结构
context_fact: 星舰地球因资源死局和互疑发生先发攻击，罗辑以此向大史推导全宇宙文明关系。
image_mechanism: 历史事件从个案转成模型，具体舰船关系被保留而尺度压缩，使不可观测宇宙社会获得实验窗口。
property_alignment: 1）单舰社会对应单文明；2）舰间真空对应星际空间；3）配件燃料对应物质资源；4）技术与武器对应文明能力；5）黑暗战役对应森林攻击。
context_alignment: 大史刚见证星舰互杀，缩影类比把熟悉事实作为新理论 few-shot，符合罗辑通俗讲解策略。
narrative_function: 连接星舰线和黑暗森林理论，把惨剧转化为宇宙社会学的可验证证据。
transfer_rule: 局部事件作整体缩影时，应逐项保留主体、资源、距离、信息和行动结果，并标出模型缺失因素。
failure_boundary: 五舰同属人类、距离近且共享文化，不等于异种文明；它只是支持机制可能性，不能单独证明全宇宙状态。
