tenor: 五艘资源有限、相互隔绝且形成猜疑链的战舰社会，局部重现宇宙文明之间的生存结构
vehicle: 缩小模型保留原系统关键比例、关系和机制，可在有限尺度上观察整体难以直接看到的规律
ground: 1）五舰对应多个宇宙文明；2）太空隔绝对应星际距离；3）有限燃料对应宇宙资源有限；4）互杀对应文明清除；5）猜疑链对应宇宙安全困境。
