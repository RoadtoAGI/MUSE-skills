chapter: 正文
figure_type: simile
quote: 木卫二的广阔冰原上像是撒满了燃烧的白磷
sensory_mapping: 冰原铺白、无数磷火同时点燃、惨亮刺眼、冷地表似被灼烧
context_fact: 木卫二武器基站因两千多名人质不能攻击叛舰，只能看着发动机小太阳飞过天空。
image_mechanism: 冰面的被动反光被拆成无数主动燃烧颗粒，冷与热、无力与危险在同一白色中重叠。
property_alignment: 1）冰面高亮区对应磷火；2）反射斑点对应散落颗粒；3）聚变光照对应点燃；4）广阔冰原对应撒布地面；5）白光对应白磷焰色；6）军事紧张对应燃烧危险。
context_alignment: 卫星冰原极冷，白磷却以高温燃烧，反差表现追击者看得见威胁却不能开火的焦灼。
narrative_function: 把发动机辐射对遥远卫星的影响具象化，继续放大自然选择号驶离时的光学权势。
transfer_rule: 反射地表作燃烧颗粒时，应对齐颜色、分布、亮度与触发光源，并利用环境温度制造反差。
failure_boundary: 冰原没有真实白磷、火焰或化学灼烧，亮斑会随光源离开而消失。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 自然选择号聚变发动机掠过时，强烈白光在木卫二辽阔冰面形成遍地刺亮、灼目且仿佛燃烧的反射
vehicle: 大量白磷颗粒散落地面后同时自燃，铺开密集惨白火点并释放危险高温
ground: 1）冰原反光对应白磷火；2）白色冰面对应白磷颜色；3）光点遍布对应颗粒撒满；4）发动机强光对应燃烧亮度；5）危险感对应白磷灼烧；6）短时闪耀对应同时起火。
