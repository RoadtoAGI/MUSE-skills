quote: 社会主义在南美已呈燎原之势
sensory_mapping: 火光、热浪、风向、连片燃烧
context_fact: 委内瑞拉改革被叙述为成功后，南美多个国家纷纷效仿。
image_mechanism: 政策传播被点燃，国界铺成相连草原，一国示范沿可燃地带连续扩张。
property_alignment: 1）首倡国家对应火种；2）思想政策对应火焰；3）地区社会条件对应草原；4）各国效仿对应蔓延。
context_alignment: 紧接“山巅之城”的榜样可见性，火势进一步表现模仿速度，也符合革命话语自身常用意象。
narrative_function: 交代美国感受威胁的地区背景，把政治扩散的速度和失控感同时压入一词。
transfer_rule: 火势隐喻写观念传播时，要落实火种、介质、风向和阻燃条件，才能说明扩散机制。
failure_boundary: 效仿是有意决策，火灾却暗示盲目破坏；不能用燎原一词替代各国不同政治原因。
