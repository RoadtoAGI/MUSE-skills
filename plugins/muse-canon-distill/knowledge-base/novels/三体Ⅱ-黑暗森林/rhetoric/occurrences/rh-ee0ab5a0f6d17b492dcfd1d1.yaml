tenor: 危机初生一代所处的历史节点及其未来时间
vehicle: 一条道路上身后已合拢的旧路段与面前缓慢铺开的艰难路途
ground: 1）出生时点对应站立位置；2）过去对应身后；3）未来对应前方；4）时代结束对应越过路段；5）岁月逐年到来对应道路徐徐展开。
