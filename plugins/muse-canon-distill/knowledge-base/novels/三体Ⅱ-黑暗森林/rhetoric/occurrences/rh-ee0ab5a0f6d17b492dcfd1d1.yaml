quote: 在他们后面，黄金时代刚刚结束；在他们前面，人类的艰难岁月正在徐徐展开
sensory_mapping: 前后方向、道路展开、站点、远方延伸
context_fact: 叙述在一万名婴儿出生后，概括他们出生于黄金时代终点、将成长于危机年代。
image_mechanism: 抽象时间轴铺成婴儿脚下道路，他们尚不能行走，历史却已在前方一寸寸摊开。
property_alignment: 1）婴儿一代对应旅人；2）黄金时代对应身后路程；3）危机岁月对应前路；4）成长对应向前行进。
context_alignment: “出生”天然是生命旅程起点，前后空间能同时容纳个人成长和文明时代转折。
narrative_function: 用一个方向构图把新生喜悦转成代际悲剧预告。
transfer_rule: 以路径组织时间时，应固定观察者所站节点，再将过去、未来和事件展开速度分别落到空间方向。
failure_boundary: 未来并非已铺定道路，“展开”不意味着命运不可改变；也不能把婴儿视作主动选择了这条路。
quality_assessment: exemplary
