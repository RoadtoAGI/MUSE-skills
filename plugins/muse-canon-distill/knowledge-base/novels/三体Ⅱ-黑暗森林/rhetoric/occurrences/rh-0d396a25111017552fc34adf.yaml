tenor: 章北海宣布战舰进入前进四时，冷峻沉稳的话语给全舰人员留下沉重、牢固且难以消散的命令感
vehicle: 经历岁月的铁锚竖立在寒风中，材质冰冷、重量巨大，并以抓地力量固定船只
ground: 1）字句对应铁锚；2）声音冷峻对应寒铁低温；3）命令沉重对应锚的重量；4）长久停留对应古锚不动；5）不可更改对应锚定；6）每字清晰对应一枚枚立锚。
