chapter: 正文
figure_type: simile
quote: 每一个字都长久地浮在空气中，像立在寒风中的古老铁锚
sensory_mapping: 字音凝成黑铁、寒风掠过锚身、重物立住、余声久久不散
context_fact: 章北海锁闭舱门并完成夺舰设置，命令全舰进入深海状态，以最高加速度逃离太阳系。
image_mechanism: 转瞬即逝的语音被铸成有重量的金属并固定在空气里，命令因此既压住听者，也把战舰航向锚定。
property_alignment: 1）章北海每个字对应铁锚；2）沉稳语调对应金属重量；3）冷峻对应寒风冷铁；4）命令效力对应锚抓力；5）余音对应长久竖立；6）逃亡决心对应不可拖动。
context_alignment: 海军出身人物以锚获得声音质感，古老铁器又贴合未来人称他的判断为‘古代智慧’。
narrative_function: 把夺舰宣言钉在转折点上，使随后的液体灌舱与加速成为这几个字不可撤回的物理后果。
transfer_rule: 话语作锚时，应同时写出重量、温度、固定对象和停留时长，并让命令确实改变后续运动方向。
failure_boundary: 声音不会停在空气或产生质量，铁锚通常阻止航行，而章北海的命令恰启动加速；转移的是坚定而非功能全同。
