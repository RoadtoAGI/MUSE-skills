chapter: 正文
figure_type: metaphor
quote: 这是太空为星舰地球设定的生存死局，一堵不可逾越的墙
sensory_mapping: 五艘舰落在棋盘终局、可走格子全部封死、前方黑墙横断航路、语言撞上墙面失去回声
context_fact: 燃料安全量只够一舰，人员无法集中；三人又证明即使互信假设层层增加，猜疑仍无法消除。
image_mechanism: 两种封闭模型叠加：死局强调规则内无解，高墙强调行动上不可跨越，使逻辑结论获得空间阻力。
property_alignment: 1）舰队选择对应棋步；2）燃料总量对应盘面限制；3）全体生还对应不存在的胜路；4）互疑对应墙体；5）谈判对应被阻断路径。
context_alignment: 星舰正物理穿越太空，但真正不可越的是社会推理墙，外部自由航行与内部无路形成反差。
narrative_function: 封闭讨论并推出‘只剩一个选择’，将伦理争执转为即将发生的决斗。
transfer_rule: 困境作死局与墙时，应先列规则与所有候选路径，再说明每条为何封闭，让绝境由推演而非口号成立。
failure_boundary: 结论建立在当时燃料估计和缺乏可信机制上，新资源、技术或制度承诺可能改写盘面。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 有限燃料迫使部分舰员死亡，而互不信任又使沟通不能保证合作，五舰找不到全体生还方案
vehicle: 棋局走到没有活路的终盘，同时前方竖起无法攀越、穿透或绕开的坚墙，所有路线被封死
ground: 1）生存选择对应棋局；2）资源条件对应规则；3）无全活方案对应死局；4）猜疑障碍对应高墙；5）交流对应撞墙；6）攻击对应仅余一步。
