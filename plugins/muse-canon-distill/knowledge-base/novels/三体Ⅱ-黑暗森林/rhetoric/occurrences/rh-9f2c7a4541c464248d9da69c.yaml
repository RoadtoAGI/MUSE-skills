quote: 感觉这幢房子仿佛坐落在阴暗海洋中的一座孤岛上
sensory_mapping: 暗海环绕、孤岛悬置、雨声如浪、冷屋无火
context_fact: 史强离开后罗辑独自在无火壁炉前等待，屋外第一次下雨，客厅阴冷。
image_mechanism: 雨声把陆地淹成无边暗海，只剩房屋浮在中央；空间隔离把罗辑的心理孤独变成可环视的水域。
property_alignment: 1）房屋对应孤岛；2）雨幕对应海洋；3）罗辑独处对应岛上孤身者；4）等待对应航路中断。
context_alignment: 持续雨声和阴冷客厅提供真实水声、暗色与温度，孤岛不是抽象套语，而从现场物理条件长出。
narrative_function: 把等待庄颜前的孤独压到极点，为女声抵达制造明暗和陆海反转。
transfer_rule: 孤岛喻应让环境先具备包围感，再以人物无法抵达或被抵达的处境完成隔绝映射。
failure_boundary: 房屋交通并未真实中断，罗辑也主动享受等待；若场景拥挤喧闹，孤岛图像会与物理条件冲突。
