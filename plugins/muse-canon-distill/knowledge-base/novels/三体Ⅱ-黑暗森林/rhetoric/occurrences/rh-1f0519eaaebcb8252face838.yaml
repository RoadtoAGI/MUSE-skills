chapter: 正文
figure_type: simile
quote: 这个镜面球体仿佛是上方的圆柱体某处融化后滴下的一滴
sensory_mapping: 千米镜筒像金属冰面融开一点，一滴完整镜液从头顶坠下，悬成罗辑身旁的智子球
context_fact: 智子在罗辑一家旁突然低维展开，球面镜质与上方天线一致，空间位置一上一下。
image_mechanism: 两个独立三体技术物件被熔滴过程连接，材质相似获得来源关系，智子出现显得连续而柔和。
property_alignment: 1）天线镜面对应熔融源；2）智子球对应液滴；3）上下位置对应滴落路径；4）球形对应液体收缩；5）同一审美对应同材质。
context_alignment: 水滴名称和三体镜面美学贯穿全书，尾声再次用液滴生成智子，使曾经威胁性的显形变成访客到来。
narrative_function: 无缝引入三体监听员的最后对话，把宏大设施、智子与‘水滴’意象在一个小滴中收束。
transfer_rule: 小物作大物熔滴时，应匹配材质、上下位置、成滴形态、出现动作和二者设计血缘。
failure_boundary: 天线没有真实熔化，智子也非其材料分离物；来源关系只存在于视觉连续性。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 突然出现在天线旁的低维展开智子镜面球体，与头顶同为光洁镜面的圆柱天线在材质和位置上连续
vehicle: 巨大固体表面局部受热熔化，液体聚成圆滴，从上方母体脱离并落到下方
ground: 1）同质镜面对应同一熔化材料；2）上方天线对应母体；3）下方球体对应液滴；4）突然出现对应滴落完成；5）圆润形态对应表面张力成滴。
