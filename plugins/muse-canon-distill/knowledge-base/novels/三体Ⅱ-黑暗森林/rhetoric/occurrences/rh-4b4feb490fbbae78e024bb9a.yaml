chapter: 正文
figure_type: simile
quote: 仿佛是上帝为了庄颜的到来把这个伊甸园清洗了一遍
sensory_mapping: 雨水冲洗、天光放晴、乐园洁净、神圣迎接
context_fact: 庄颜雨夜到达，次晨雨停天晴，第一次看清湖泊与雪山并因壮美而敬畏。
image_mechanism: 整夜雨水化作一双神手，擦去景物灰尘；晨光揭幕时，普通庄园被重新命名为专为庄颜开放的乐园。
property_alignment: 1）庄园对应伊甸园；2）雨对应清洗之水；3）天气转晴对应洗净完成；4）庄颜对应被迎接者。
context_alignment: 真实夜雨和封闭美丽庄园提供清洗与乐园两端的物理基础，同时暴露罗辑把她神圣化的主观视角。
narrative_function: 把初见后的世界更新为私人乐园，推进罗辑沉入幸福幻境。
transfer_rule: 神圣迎宾喻要让天气或空间确有可见更新，再把更新时点绑定人物到来，避免凭空封圣。
failure_boundary: 雨是自然天气，庄园也非无罪乐园；该喻只呈现罗辑感受，不能证明庄颜受神意眷顾。
