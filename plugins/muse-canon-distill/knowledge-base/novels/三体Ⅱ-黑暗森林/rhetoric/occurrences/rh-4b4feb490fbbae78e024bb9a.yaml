tenor: 雨后初晴的庄园在庄颜抵达次晨呈现出的洁净、明亮和理想化新鲜感
vehicle: 上帝为迎接来客亲手洗净的人间伊甸园
ground: 1）庄园美景对应伊甸园；2）夜雨洗尘对应上帝清洗；3）初晴明亮对应洗后洁净；4）庄颜到来对应神圣迎宾；5）自然壮美对应乐园完整。
