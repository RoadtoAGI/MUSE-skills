chapter: 正文
figure_type: simile
quote: 这个世界很像罗辑现在的思想：到处都是一片黑暗，只有一处无比清晰
sensory_mapping: 罗辑的意识铺成无边黑沙漠，所有远景熄灭，只剩车灯切出一条狭窄而清晰的路
context_fact: 车辆驶过无星沙漠，大史提到庄颜和孩子可能苏醒；罗辑随后决定次日去冬眠移民局。
image_mechanism: 心理结构与窗外光场逐项叠合，抽象的‘只有一个念头’获得黑暗中唯一可行道路的空间形状。
property_alignment: 1）思想总体对应夜间世界；2）绝望对应无光；3）妻女重逢对应车灯照明；4）下一步计划对应可见公路。
context_alignment: 喻体就是车中眼前实景，人物的思路也随车辆前进；内外景同步使比喻无需另起抒情。
narrative_function: 在文明绝境中收窄罗辑的私人目标，为委员会以妻女控制他和雪地工程转折作准备。
transfer_rule: 环境映照思想时，应让亮暗分区、视野边界和移动方向分别对应情绪、已知与下一行动。
failure_boundary: 车灯之外仍有真实世界，罗辑也尚存黑暗森林知识；黑暗只描述此刻主观可行性。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 罗辑在威慑失效后对未来普遍绝望，只把与庄颜和孩子重逢看成唯一清楚可行的目标
vehicle: 无星沙漠与夜空连成黑幕，车灯只照亮前方一小段公路，其他方向均不可见
ground: 1）绝望未知对应四周黑暗；2）唯一念头对应车灯亮路；3）思考范围对应视野；4）行动方向对应公路延伸。
