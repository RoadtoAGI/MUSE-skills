chapter: 正文
figure_type: simile
quote: 在夜色中像一长串发光的蚁群
sensory_mapping: 远去人群缩成一粒粒亮蚁，沿黑色公路线蜿蜒移动，长队末端消失在城市方向
context_fact: 罗辑要求所有人回家，人群由慢到快散开，车辆上高速，还有许多人沿公路步行。
image_mechanism: 崇拜者从包围个体的巨海缩成远处细小虫列，尺度变化直观显示广场清空和权力解除。
property_alignment: 1）单个人影对应蚁体；2）连续队伍对应蚁群行列；3）公路对应蚁径；4）衣服发光对应可见点；5）集体服从对应同向移动。
context_alignment: 观察距离正在拉大，罗辑留在沙漠中心；蚁群既贴合远视觉，也与此前群体的无差别整体感相连。
narrative_function: 完成聚集—跪拜—退散的群像变形，给罗辑和大史留出黑暗森林对话的空场。
transfer_rule: 远处人流作蚁群时，应落实观看距离、路径、队列长度、个体亮点和共同方向。
failure_boundary: 人群有独立意志和交通选择，并非由信息素机械控制；喻体只描述远景队形与尺度。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 奉罗辑命令离开的众多穿发光衣的人沿公路步行，队伍细长、密集而方向一致
vehicle: 夜里成列搬移的发光蚂蚁群，个体细小、数量众多，沿固定路径连成移动长线
ground: 1）步行者对应蚂蚁；2）公路队列对应蚁路；3）人数众多对应群体；4）信息服亮点对应发光虫体；5）远距离缩小对应蚁形。
