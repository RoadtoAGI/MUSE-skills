tenor: 未受深海保护的人被超重压向洁白停机坪，身体破裂后血液从多个位置向外放射扩散
vehicle: 红色花朵从花心向四周展开花瓣，多朵依次开放并在浅色地面形成鲜明图案
ground: 1）人体落点对应花心；2）血液放射对应花瓣展开；3）多个受害者对应花朵成片；4）洁白停机坪对应衬底；5）瞬间迸出对应怒放。
