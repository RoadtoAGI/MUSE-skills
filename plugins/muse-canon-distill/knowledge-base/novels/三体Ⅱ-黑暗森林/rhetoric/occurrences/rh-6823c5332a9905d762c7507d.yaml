quote: 鲜红的血花一朵朵地迸放开来
sensory_mapping: 白色广场上红点骤开、血沿身体四周铺成薄瓣、一朵接一朵连成整片红色
context_fact: ‘夏’号强行进入前进四，机库上百人被超重压在停机坪上，血液摊成薄膜并相连。
image_mechanism: 人体破裂的放射形态被花朵化，视觉美感与声音缺席共同放大远程俯拍的冷酷。
property_alignment: 1）血摊对应花瓣；2）身体中心对应花蕊；3）鲜红颜色对应花色；4）连续死亡对应群花开放；5）血膜相连对应花海。
context_alignment: 前文金属残骸已作怒放花蕾，此处同一开花结构落到人体，完成从舰体景观到生命代价的推进。
narrative_function: 在宏观战斗记录中恢复人的可见死亡，并用过度美丽的图形制造伦理震荡。
transfer_rule: 放射性液迹作花时，应固定中心、展开方向、色彩衬底和连续出现节奏，同时保留真实成因。
failure_boundary: 血花没有生长、香气或生命繁殖，‘开放’是身体破裂；美感不能遮盖受害者痛苦。
quality_assessment: exemplary
