quote: 可能早就是坏掉的‘幽灵船’了
sensory_mapping: 黑暗深空、无灯舰壳、编队脱落、空船缓慢漂来
context_fact: 熊文根据远距观测称三体舰队穿越尘埃后稀疏溃散，很多战舰停止加速，八百年也未必抵达。
image_mechanism: 无法看清内部状态的外星舰被转成海上传说，运动尚在而生命与目的消失，只剩让人轻视又不安的空壳。
property_alignment: 1）三体战舰对应幽灵船；2）太空对应黑海；3）停止推进对应失舵；4）编队掉队对应孤船漂流；5）内部未知对应幽灵传闻；6）可能损坏对应破船。
context_alignment: 说话者沉浸在人类必胜叙事中，幽灵船把敌舰贬为过时残骸，也暴露判断仅凭外观推测。
narrative_function: 以生动但不可靠的公众想象展示未来人的傲慢，为探测器仍具压倒性技术制造认知落差。
transfer_rule: 失联载具作幽灵船时，应有运动残留、内部生命未知、控制缺失和黑暗介质，并标明推断的不确定。
failure_boundary: 停止加速不等于损坏或无人，三体舰也可能按计划减速；幽灵意象不能作为战力证据。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 三体舰队中停止加速、队形脱落且可能已失去成员或功能的战舰仍在深空惯性漂行
vehicle: 船员死亡或消失后无人操纵、寂静漂泊却仍保留船壳的幽灵船
ground: 1）失控战舰对应幽灵船；2）乘员可能死亡对应船上无活人；3）停止加速对应失去操纵；4）深空漂行对应海上漂流；5）远距不可确认对应幽灵未知；6）残余轨迹对应空壳仍航行。
