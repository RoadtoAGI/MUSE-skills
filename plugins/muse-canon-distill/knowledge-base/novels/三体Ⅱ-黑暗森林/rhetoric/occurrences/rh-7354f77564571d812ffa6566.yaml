quote: 这阴郁的黄昏中仿佛出现了一道转瞬即逝的阳光
sensory_mapping: 阴云暮色、破云光束、骤亮、瞬间隐没
context_fact: 罗辑在阴冷雨夜独自等待，只隐约听到来客几句话，尚未开门确认身份。
image_mechanism: 黄昏的灰暗同时覆盖房间和心境，女声划开一道亮缝；声音停下，亮缝随即合拢。
property_alignment: 1）女声对应阳光；2）孤独对应阴郁黄昏；3）希望升起对应骤亮；4）短暂听见对应光束即逝。
context_alignment: 现场确有阴雨黄昏，光暗变化自然承接物理天气，也准确限制希望尚处一闪阶段。
narrative_function: 把女声设为拯救孤独的光源，为开门后的火光显影预奏。
transfer_rule: 光喻写希望时应让先前环境确实昏暗，并用光的持续时间对应消息的确定程度。
failure_boundary: 声音尚未证明来者身份，阳光只表示罗辑主观希望；若希望稳定兑现，就不宜仍写转瞬即逝。
