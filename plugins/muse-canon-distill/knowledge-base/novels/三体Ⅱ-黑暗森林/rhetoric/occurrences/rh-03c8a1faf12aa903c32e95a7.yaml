chapter: 正文
figure_type: simile
quote: 像是追逐一个雾中的幻影
sensory_mapping: 雾中小影、奔跑追赶、轮廓飘忽、触及成真
context_fact: 希恩斯冬眠八年后醒来，在陌生白雾建筑中第一次看见等待他的山杉惠子，并立即奔向她。
image_mechanism: 真实妻子的轮廓被雾削去细节，八年时间差又把熟人推入梦境；奔跑成为检验影像能否被身体触到的动作。
property_alignment: 1）惠子身影对应幻影；2）全息白雾对应幻境介质；3）希恩斯对应追逐者；4）久别不确定对应难以相信；5）拥抱对应幻影实体化。
context_alignment: 人物刚离开无意识冬眠，醒来后的场景本就近似梦境，而周围又是能制造全息幻象的设施，喻体贴合技术与情感。
narrative_function: 把夫妻重逢写成从虚到实的瞬间，并提前暗示此空间本身由可操控影像组成。
transfer_rule: 久别重逢作追逐幻影，应让遮蔽环境、时间断裂和触碰验证共同存在，单纯距离远不够。
failure_boundary: 惠子确实在原地等待并最终被抱住，不会像幻影逃散；该比喻只描述希恩斯初见时的主观失真。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 希恩斯在白雾中奔向分别八年的妻子时，因视线朦胧而产生她可能不真实、难以触及的感受
vehicle: 人在浓雾里追赶没有实体、随时会消散的幻影
ground: 1）山杉惠子身影对应幻影；2）白雾遮蔽对应幻境；3）久别与冬眠错时对应不真实感；4）奔跑靠近对应追逐；5）最终拥抱对应幻影获得实体。
