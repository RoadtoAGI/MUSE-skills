tenor: 体积仅三点五米的水滴正逼近第二列，具备连续杀死舰员、摧毁巨舰且不被阻挡的能力
vehicle: 掌管死亡的神祇体形可不显眼，却能决定众生命运、逐一收割且不受凡人武器伤害
ground: 1）水滴对应死神；2）攻击路线对应收割；3）舰员死亡对应夺命；4）不可摧毁对应超凡权能；5）小尺寸对应隐蔽化身。
