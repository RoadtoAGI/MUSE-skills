quote: 那个即将开始毁灭第二队列的小小的死神
sensory_mapping: 焰火屏障后藏着微小死神、它无声靠近直列、银色身影将沿队伍逐一收命
context_fact: 舰队把注意力投向假想隐形敌军，未注意已摧毁第一列的水滴正冲向第二列。
image_mechanism: 攻击者的尺寸与死亡规模被压进‘小小神祇’矛盾形体，真正威胁越小越超出监测习惯。
property_alignment: 1）探测器对应死神；2）战舰队列对应待收生命；3）穿透核爆对应收割；4）隐形雷达特征对应不可见来临。
context_alignment: 显式死神命名紧邻炫目假战场，读者被提前指向真凶，而剧中系统仍看不见它。
narrative_function: 以全知叙述标出即将重复的屠杀中心，制造读者知情、人物不知情的紧迫感。
transfer_rule: 微小杀器作死神时，应把尺寸反差、夺命方式、不可阻挡性和受害者盲区同时写实。
failure_boundary: 水滴是执行程序的探测器，不掌管死亡伦理或灵魂；其不可毁性只在现有人类技术范围内成立。
