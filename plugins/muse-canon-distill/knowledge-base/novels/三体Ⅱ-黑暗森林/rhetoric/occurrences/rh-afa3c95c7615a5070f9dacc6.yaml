chapter: 正文
figure_type: simile
quote: 这种驱动之下的水滴仿佛是一个没有质量的影子
sensory_mapping: 银色实体忽然失去重量、航迹像黑影折断重接、尖角不带减速弧线、惯性从画面中消失
context_fact: 后来的分析显示水滴每次转向都是尖角，速度保持约每秒三十公里，驱动原理超出人类理解。
image_mechanism: 以最轻最虚的视觉现象解释最坚硬实体的反惯性运动，材质重量与航迹轻逸强烈碰撞。
property_alignment: 1）水滴航迹对应影子移动；2）尖角对应投影突变；3）不减速对应无质量；4）未知驱动对应不可见光源。
context_alignment: 前文极端硬度已确立，‘影子’反而凸显驱动技术同时突破材料与动力两条常识。
narrative_function: 把难懂的运动学异常转成一眼可见的违和，为水滴任意串杀舰列赋形。
transfer_rule: 反惯性对象作影子时，应呈现无重量、瞬时改向、轨迹依附和实体反差，突出违反的物理预期。
failure_boundary: 水滴具有实体质量并能传递巨大动量；影子不能撞毁目标，也不拥有自主路径。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴高速飞行时能以尖锐折角瞬间转向，不显示普通有质量飞行器应有的惯性曲线
vehicle: 影子没有可称量实体，能随光源或投影面骤然改变位置和方向而不承受惯性
ground: 1）水滴对应影子；2）强互作用实体对应表观无质量；3）折角转向对应投影跳变；4）无惯性曲线对应影子不受力。
