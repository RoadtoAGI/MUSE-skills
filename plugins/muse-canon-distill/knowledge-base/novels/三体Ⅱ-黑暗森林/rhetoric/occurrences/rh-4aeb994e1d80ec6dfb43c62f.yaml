context_fact: 罗辑无法摆脱面壁身份，进入默思室躺上凉硬铁矿石，借物理想象使自己冷静。
image_mechanism: 躁动被液化成体内热质，皮肤与冷石一接触便沿温差流出，矿石像海绵收走其中一部分。
property_alignment: 1）狂躁对应可吸物；2）心对应容器；3）石头对应吸收体；4）接触与低温对应抽取过程。
context_alignment: 真实冷感与情绪降温同步，且默思室石块本用于沉思，物理条件自然承担心理调节。
narrative_function: 把罗辑从自杀冲动拉回可思考状态，使他转而利用面壁权力。
