chapter: 正文
figure_type: simile
quote: 像浮在水上的油渍，转瞬即逝
sensory_mapping: 水面薄膜、彩色反光、漂移、油腻污感
context_fact: 凶手看穿罗辑装病后笑了一下并道歉，叙述区分这次短笑与他恒在的淡笑。
image_mechanism: 脸被当成水面，固定笑意成为底层，瞬时反应化成一层不相融的油膜滑过。
property_alignment: 1）常驻笑容对应水体底面；2）短笑对应油膜；3）叠加对应浮在其上；4）消退对应漂散。
context_alignment: 油渍的污浊感与刺杀者礼貌道歉的虚假形成价值贴合，同时精确区分同一面孔的两层表情。
narrative_function: 细分凶手的表情层次，让其礼貌与杀意的不相容成为可见界面。
transfer_rule: 写叠加表情可选不相溶材质，分别指定底层、浮层、持续时间和二者的价值色彩。
failure_boundary: 油渍会留下物理污染，短笑未必留下痕迹；若两种情绪真正交融，油水分层模型就不适用。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 凶手说抱歉时叠加在固定淡笑上的一瞬新笑意
vehicle: 浮于水面、薄薄铺开又很快漂散的油渍
ground: 1）新笑覆盖底层表情对应油浮水面；2）两种笑不相融对应油水分层；3）短暂出现对应油膜漂散；4）表面礼貌带污感对应油渍污染。
