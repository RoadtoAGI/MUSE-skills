chapter: 正文
figure_type: metaphor
quote: 这五年来，他沉浸在幸福的海洋中
sensory_mapping: 暖海包围、身体下沉、岸线远去、视野被水充满
context_fact: 孩子出生后，罗辑把对妻女的爱融在一起，在与世隔绝住地中不再关注外部世界。
image_mechanism: 家庭幸福从内心感受涨成无边水体，包住人物全部感官；外部危机被推到看不见的岸外。
property_alignment: 1）家庭之爱对应海水；2）情感强度对应水量；3）罗辑对应沉浸者；4）外部社会对应远岸；5）忽略危机对应潜入水下。
context_alignment: ‘沉浸’随后发展为温柔之乡和伊甸园，空间隔绝与实际隐居相互支撑，并为外界突然闯入制造落差。
narrative_function: 概括五年私人生活对罗辑的包围，解释泰勒事件为何像异物刺破幸福环境。
transfer_rule: 情绪作海洋应表现包围范围、深度和岸外事物的不可见，单纯短暂愉悦不具备海量。
failure_boundary: 罗辑仍能接触工作人员和有限信息，并非完全与现实隔绝；海洋意象也会弱化幸福建立在特权资源上的事实。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 罗辑长期被家庭爱情的强烈满足完全包围，以至忽略外部危机
vehicle: 身体浸没在广阔海水中，四周只接触同一种介质并与岸上隔绝
ground: 1）幸福对应海水；2）罗辑对应浸水者；3）情感充盈对应海洋广阔；4）忘却外界对应与岸隔绝；5）五年持续对应长时间浸泡。
