quote: 我很快会和它们在没有黑暗的地方相会。
sensory_mapping: 空间方位、光暗、意识状态
context_fact: 他在阴冷地下室举枪自杀，误以为金鱼仍活着，字幕告知金鱼已经被他意外毒死。
image_mechanism: 把死亡从一个终止动作铺成可抵达的明亮地点，枪口前的绝望被改写成越界和会面，从而显露其自我安慰。
property_alignment: 1）死亡边界对应“那边”；2）永久无意识对应无梦；3）离开墓穴般房间对应无黑暗；4）共同死亡对应重逢。
context_alignment: 房间刚被写成墓穴，他用“没有黑暗”反向美化死亡；金鱼的死讯又让会面说法既凄凉又具体。
narrative_function: 呈现自杀者如何把死亡包装成解脱，并让三体人的召回与金鱼真相打碎这一空间幻觉。
transfer_rule: 写人物对死亡的自我解释时，可建立彼岸地点的光线、意识和会面规则，同时用现场事实显示这种想象为何有诱惑力。
failure_boundary: “没有黑暗”是人物信念而非可证事实；不能把其彼岸图景当作小说世界已经确认的死后设定。
