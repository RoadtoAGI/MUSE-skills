quote: 褐蚁和几百个同族带着幸存的蚁后向着太阳落下的方向走了一段路，建立了新的帝国。
sensory_mapping: 社会层级、迁徙、空间疆域
context_fact: 原蚁穴因人类掘墓被毁，幸存蚁后带着群蚁离开故地，随后在别处建立群落。
image_mechanism: 把群居昆虫的迁巢放大为文明迁徙与复国，蚁后、群体和领地分别获得政治角色。
property_alignment: 1）蚁后对应统治中心；2）工蚁群体对应协作人口；3）新蚁穴对应新国土；4）灾后迁徙对应帝国覆灭后的重建。
context_alignment: 序章正把蚂蚁与人类文明放在亿年尺度并观，“帝国”使微小群落也成为生存、扩张的文明模型。
narrative_function: 提前在蚁群层面缩演文明的毁灭与重建，让随后提出的宇宙社会学公理获得生命底图。
transfer_rule: 以政治组织比拟动物群体时，要分别找到权力中心、协作成员、领地变化和延续机制，避免只因数量多就称帝国。
failure_boundary: 蚁群没有人类帝国的法律、意识形态与个人服从选择；喻体只适用于层级、群体协作和领地重建。
