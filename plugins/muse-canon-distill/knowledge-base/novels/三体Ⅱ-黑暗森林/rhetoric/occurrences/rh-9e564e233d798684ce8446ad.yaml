review_status: reviewed
tenor: 井上拒绝恢复神风特攻队建议时克制、疏离且令泰勒受挫的话语
vehicle: 落在皮肤上、持续降温并渗入衣服的冷雨
ground: 1）语气无温情对应雨水低温；2）拒绝直落对应雨滴落身；3）谈话发生在雨中对应感官同场；4）泰勒受挫对应被淋透寒意。
