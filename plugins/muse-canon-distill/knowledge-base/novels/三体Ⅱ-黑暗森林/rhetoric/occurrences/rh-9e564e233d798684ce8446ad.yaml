chapter: 正文
figure_type: simile
quote: 井上宏一的话像雨水一般冰冷
sensory_mapping: 冷雨、皮肤降温、湿透、平直落下
context_fact: 两人站在鹿儿岛细雨中的神风纪念馆，井上劝泰勒不要公开谈恢复特攻队。
image_mechanism: 话音从井上口中落成雨滴，与真实雨幕叠合，泰勒同时承受天气和道德拒绝的低温。
property_alignment: 1）话语对应雨水；2）冷漠对应冰冷；3）连续劝阻对应降雨；4）听者对应淋雨者。
context_alignment: 真实细雨为通感提供即时触觉，且井上刻意保持身体和思想距离，冷感准确。
narrative_function: 把谈判僵局融入天气，并推动泰勒愤然离去。
transfer_rule: 把话语比作天气时，应利用同场物理感受，让语气强度、持续方式和听者反应同步。
failure_boundary: 井上的拒绝也含伦理原则，不只是冷漠；以低温概括可能忽略其道德关切。
quality_assessment: exemplary
