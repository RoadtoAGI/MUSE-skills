quote: 人类还得继续改进航天石器时代的石斧和棍棒：化学推进火箭
sensory_mapping: 粗石斧刃、木棍握柄、反复打磨、原始工具库
context_fact: 太空电梯未成、常规发射不足，泰勒的太空实验仍依赖化学推进；全书又以恒星际战争衡量这一技术。
image_mechanism: 宏大的太空工业突然缩回史前工具台，火箭的金属复杂性被剥去，只剩一件必须继续磨却无法跨代的旧器物。
property_alignment: 1）化学火箭对应石斧棍棒；2）当代航天对应石器阶段；3）增量优化对应磨刃；4）推进极限对应原始材质极限；5）三体战争对应未来战场。
context_alignment: 前一喻体把常规发射写成独木桥，此处进一步给桥上工具标出文明代差，符合智子锁死基础物理后的技术困局。
narrative_function: 用时代错位制造讽刺，凸显人类拿近地航天技术准备星际战争的悬殊。
transfer_rule: 旧时代工具类比应落实代际位置、可改良处和不可突破的材料上限，使‘落后’成为结构判断。
failure_boundary: 化学火箭仍能可靠入轨并非无用棍棒；若任务只是近地运输而非星际作战，石器时代评价会失准。
