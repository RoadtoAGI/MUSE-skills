quote: “审判日”号的雪白的航迹延伸到迷蒙的夜幕中，像流逝的时间。
sensory_mapping: 视觉、方向、时间
context_fact: 三体字幕永久中断，伊文斯站在船尾看最后一次对话后的航迹。
image_mechanism: 用船尾视角把时间画成一条从脚下生成、向黑暗退去的白线，结束的通信因而获得不可逆的空间方向。
property_alignment: 1）白迹连续延长对应时间持续流逝；2）夜幕吞没远迹对应记忆和机会远去；3）向后观看对应回望已经结束的交流。
context_alignment: 这是伊文斯最后收到的信息，船尾、退去的航迹和夜幕共同把“最后一次”固定为现场物理事实。
narrative_function: 为审判日号与三体世界的通信作静默收束，并预告伊文斯所剩时间和道路都已有限。
transfer_rule: 写时间不可逆时，可选择由移动主体留下且逐渐消散的痕迹，让生成点、消失方向和观察姿态都服务于时态。
failure_boundary: 可循环返回、能被完整保存的轨迹不适合承载不可逆时间；缺少终结语境时，这一比喻容易落入泛抒情。
quality_assessment: exemplary
