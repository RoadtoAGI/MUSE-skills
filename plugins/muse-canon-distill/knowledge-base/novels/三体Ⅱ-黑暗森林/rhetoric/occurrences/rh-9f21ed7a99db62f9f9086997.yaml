review_status: reviewed
tenor: 船后不断延长并消失在夜色中的白色航迹
vehicle: 从当下向身后流去、不可追回的时间
ground: 1）航迹由船的当前位置持续生成对应时间由当下推进；2）远端没入夜幕对应过去淡出可见范围；3）船不能收回航迹对应时间不可逆。
