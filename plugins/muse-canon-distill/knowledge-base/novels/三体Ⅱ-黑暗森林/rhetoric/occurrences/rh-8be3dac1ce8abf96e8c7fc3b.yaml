tenor: 密集星光在罗辑幻视中连接成覆盖广阔宇宙的连续银亮图景
vehicle: 以银色晶亮丝线交错编织、面积巨大的毯子
ground: 1）星光对应银线；2）星辰排列对应织点；3）光线交错对应编织；4）星空铺展对应巨毯覆盖；5）晶莹色泽对应银丝反光。
