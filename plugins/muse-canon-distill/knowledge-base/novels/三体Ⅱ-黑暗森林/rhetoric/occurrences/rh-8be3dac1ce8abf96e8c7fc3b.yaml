chapter: 正文
figure_type: metaphor
quote: 星辰用晶莹的光芒织成银色的巨毯
sensory_mapping: 银线穿梭、星点成结、巨毯铺开、晶光纹理
context_fact: 空间透明后星辰全部显现，群星振动奏乐，随后星海变密并坍缩。
image_mechanism: 分散星点各自抽出一根亮丝，光线在透明空间里纵横穿梭，空旷宇宙被织成可铺展的银毯。
property_alignment: 1）星辰对应织点；2）光芒对应银线；3）星空对应巨毯；4）星群连接对应编织。
context_alignment: “晶莹”延续水晶空间，银毯把离散星点转为连续包围物，为宇宙向二人聚集提供形态。
narrative_function: 把遥远群星变成亲密可触的覆盖物，使爱情幻视收拢整个宇宙。
transfer_rule: 星空织物喻应说明光是线、星是结、天空是铺展面，并让密度变化支持织成过程。
failure_boundary: 星辰实际相距遥远且无光线互织；稀疏暗空若没有连接感，巨毯会显得强加。
