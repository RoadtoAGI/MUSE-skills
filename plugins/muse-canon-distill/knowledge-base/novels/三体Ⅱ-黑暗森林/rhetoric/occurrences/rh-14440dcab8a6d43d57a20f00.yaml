chapter: 正文
figure_type: simile
quote: 很快变成了全反射的镜面，像水滴表面那样
sensory_mapping: 黑石碑抹去字迹，表面冷亮成水滴镜壳，只映空白雪原，轮廓逐渐从世界中退去
context_fact: 罗辑梦见墓碑镜面不映自己和庄颜，只保留脚印；镜外脚印随后也完全消失。
image_mechanism: 水滴的反射属性侵入死亡纪念物，擦掉姓名、人物和痕迹，使黑暗森林威胁从武器转成抹除存在。
property_alignment: 1）全反射材质对应镜壳；2）碑文信息对应被抹纹理；3）环境倒影对应水滴映星；4）物体难辨对应镜面隐身。
context_alignment: 水滴刚封死太阳却未撞地，梦把它的视觉材质移到墓碑，表现罗辑意识到真正毁灭来自更深规则。
narrative_function: 把水滴、墓碑和文明消失三重意象叠合，为醒后智子镜球出现及威慑对话作视觉预演。
transfer_rule: 镜面武器材质迁移到另一物时，应说明被抹去的信息、反射内容、边界消退与叙事上的侵入关系。
failure_boundary: 梦中墓碑没有真实材料变化，水滴也不负责即将到来的黑暗森林打击；相似承载心理联结。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 梦中叶文洁与杨冬墓碑表面变得光滑全反射，碑文和自身视觉特征消失
vehicle: 三体水滴无缝、全反射的镜面外壳，忠实映出周围景象并因反射而近乎隐形
ground: 1）墓碑镜面对应水滴表面；2）碑文消失对应无纹理；3）雪原倒影对应环境映射；4）自身隐形对应边界消退；5）冰冷光滑对应水滴触感想象。
