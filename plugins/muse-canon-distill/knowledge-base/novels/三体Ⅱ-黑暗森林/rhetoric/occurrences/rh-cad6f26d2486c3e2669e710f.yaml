chapter: 正文
figure_type: simile
quote: 在事实面前我要受到地狱般的折磨
sensory_mapping: 事实化成刑具、信念被反复灼烧、人困在封闭刑场、痛楚没有出口
context_fact: 希恩斯举例说自己曾被钢印强迫相信水有剧毒，同时身体经验又迫使他接触水，由此经历过同类冲突。
image_mechanism: 两个互不相容的认知系统被装成封闭刑场，事实每次出现都执行一次酷刑，而钢印保证受刑者无法通过改信止痛。
property_alignment: 1）希恩斯对应受刑者；2）现实反证对应刑具；3）固化信念对应牢门；4）认知撕裂对应灼烧；5）命题不可逆对应永久刑期；6）水实验对应第一次受刑。
context_alignment: 他刚宣称自己是不会忏悔的上帝，随即又成为地狱囚徒，两个宗教意象揭示绝对权威与绝对痛苦的一体两面。
narrative_function: 防止人物的自我神化显得轻松，具体呈现思想钢印把信念稳定性转成持续酷刑的代价。
transfer_rule: 认知冲突作酷刑时，应写清不可退出的约束、反复触发的事实以及痛苦为何无法靠更新判断终止。
failure_boundary: 精神冲突没有地狱的物理火刑，强度因人而异；该比喻也不能证明钢印绝对不可逆。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 希恩斯被思想钢印迫使确信自己正确，却同时看见现实证据可能彻底反驳这一信念，从而承受无法调和的精神痛苦
vehicle: 地狱中的受刑者持续遭受烈火、撕裂和无从逃脱的极端折磨
ground: 1）认知冲突对应刑罚；2）事实反证对应行刑力量；3）钢印不可改对应无法逃脱；4）痛苦强烈对应地狱酷刑；5）持续确信对应刑期不止；6）自我分裂对应反复受创。
