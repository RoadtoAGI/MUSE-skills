chapter: 正文
figure_type: metaphor
quote: 产生了与其他人一样的印象：一滴水银
sensory_mapping: 银色液滴悬在黑空、头部圆润、尾尖收束、银河沿镜面流成光纹
context_fact: 跟踪飞船从五百米拍到长三点五米的探测器，人类尚无法探知其内部结构，只看到完美镜面外形。
image_mechanism: 固态机器的接缝、结构和功能全部被曲面抹除，表面反光把星空变成流纹，使静止物体获得液态滴落感。
property_alignment: 1）探测器对应水银滴；2）镜面材料对应金属液光泽；3）流线曲面对应表面张力；4）尖尾对应液滴下坠形变；5）无结构痕迹对应液态整体；6）映出银河对应水银反射。
context_alignment: 人类期待复杂星际机器，却只见纯净液滴，喻体准确造成美感，也正因过度无害而触发丁仪警惕。
narrative_function: 建立全书后续反复使用的‘水滴’核心意象，以极致柔美遮蔽强相互作用材料的毁灭力量。
transfer_rule: 固体作液滴时，应由轮廓、连续曲率、反光、无接缝和运动错觉共同支撑，并利用软外观与真实性能的反差。
failure_boundary: 探测器是低温固体且内部性质未知，不会流动、分裂或受普通表面张力支配；水银的脆弱感是错误推断。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三体探测器以浑圆头部、尖细尾端和全反射光滑曲面呈现出的完整外观与动态错觉
vehicle: 一滴悬浮水银由表面张力形成流畅液滴，银亮镜面映照周围，形体纯净而似乎随时流动滴落
ground: 1）探测器水滴形对应液滴；2）全反射表面对应水银银亮；3）无接缝对应液体连续；4）浑圆头部对应表面张力；5）尖尾对应滴落拉伸；6）银河反光对应水银镜面。
