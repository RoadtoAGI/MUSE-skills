chapter: 正文
figure_type: simile
quote: 水滴就像一枚死神的绣花针
sensory_mapping: 银针在黑布上翻飞、针尖每落一次便爆出火团、一条折线把百艘巨舰缝成死亡针脚
context_fact: 水滴在第三队列舰间每秒转向两三次，依次击穿一百艘战舰且速度不减。
image_mechanism: 尺寸极小的攻击者获得手工针刺的精确与节奏，‘贯穿起来’把分散死亡组织成一件冷酷针线活。
property_alignment: 1）探测器对应绣针；2）高速转向对应针手翻飞；3）舰队排列对应布面点位；4）攻击路线对应绣线；5）核爆对应致命针孔。
context_alignment: ‘绣花’的精细轻巧贴合水滴光洁外形，却由死神执针，准确容纳美与杀戮的同体。
narrative_function: 将百舰毁灭凝成一个可追踪动作，突出水滴的精确、轻松与施害者冷漠。
transfer_rule: 连续穿刺作针线时，应匹配器物尺度、点位次序、折返轨迹与串联结果，并给操作者明确价值色彩。
failure_boundary: 战舰没有被实体线缝在一起，水滴形体也没有针孔或尖端；绣花的温柔不可移给攻击伦理。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 小型水滴在舰群间高频转向，以细窄航迹连续穿透一百艘巨舰并把它们串在毁灭折线上
vehicle: 死神持一枚细小绣花针灵巧上下翻飞，针尖刺穿材料并以线把多个对象逐一串起
ground: 1）水滴对应针；2）小尺寸尖锐冲击对应针尖；3）折线航迹对应针脚；4）战舰对应被刺材料；5）连续贯穿对应串缝；6）死亡结果对应死神。
