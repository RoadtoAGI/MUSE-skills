quote: 这些恒星在这片三维空间的相对排列在宇宙中几乎是独一无二的，像指纹一样
sensory_mapping: 星点纹路、指纹旋涡、特征匹配、唯一身份标记
context_fact: 人类无法发出恒星级灯塔，却可广播目标星与周围约三十颗星的位置图。
image_mechanism: 三维星点被压印成一枚宇宙指纹，每颗星是纹路节点；高级接收者把它按到银河数据库上完成匹配。
property_alignment: 1）恒星群对应指纹；2）星间距离对应纹线间距；3）星图数据库对应指纹库；4）空间定位对应身份识别。
context_alignment: 类比精确解释“不是单点而是关系唯一”，并自然导向数据库检索，具有完整技术机制。
narrative_function: 提供罗辑广播他星坐标的可行编码，为黑暗森林咒语奠定工程方法。
transfer_rule: 唯一模式类比指纹应对齐特征点、相对关系、数据库和匹配结果，不能只借“独特”一词。
failure_boundary: 恒星持续运动且观测有误差，指纹图需时间模型校正；少量星点或高重复构图可能误匹配。
quality_assessment: exemplary
