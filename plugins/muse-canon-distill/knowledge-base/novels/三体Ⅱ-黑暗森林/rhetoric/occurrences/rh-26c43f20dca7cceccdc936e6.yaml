review_status: reviewed
tenor: 几十颗邻近恒星的三维相对位置构图可唯一识别一片银河区域的定位功能
vehicle: 由多条脊线相对排列形成、几乎人人不同并可数据库匹配身份的指纹
ground: 1）恒星对应纹线特征点；2）相对位置对应纹路排列；3）构图独一无二对应指纹唯一；4）与星图比对对应指纹检索；5）锁定恒星对应确认身份。
