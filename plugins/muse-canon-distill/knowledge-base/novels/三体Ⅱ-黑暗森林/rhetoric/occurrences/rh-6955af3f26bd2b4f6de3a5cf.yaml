chapter: 正文
figure_type: metaphor
quote: 向哪个方向转向都是死路
sensory_mapping: 三体舰队悬在宇宙岔口，返乡和远航两条路都没入荒凉黑暗，生命补给在终点前耗尽
context_fact: 三体说明舰队已无法在奥尔特云外停下；若转向掠过太阳系，返航或寻找其他星系所需时间都超过生态循环寿命。
image_mechanism: 复杂轨道、距离与寿命约束被压成岔路图，路线仍可运动但每条都在生命意义上封闭。
property_alignment: 1）宇宙航线对应道路；2）航向选择对应转弯；3）补给时限对应路程耐力；4）生态崩溃对应路断人亡。
context_alignment: 罗辑正在逐项下令舰队转向，‘死路’以驾驶口语回应航向问题，也使三体让步的代价直观。
narrative_function: 揭示威慑成功并未给远征军即时生路，迫使罗辑提出未来救援，把胜负转向共存。
transfer_rule: 把战略选项写成道路时，应为每条路标明目的地、可用资源、最大里程和封闭原因。
failure_boundary: 舰队仍可能获未来人类或三体飞船救援，‘死路’是按当前能力计算的判断，不是宇宙中物理道路消失。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 三体舰队偏离太阳系后，无论选择返航还是寻找其他星系，生态系统都无法维持到抵达，生存方案均告失败
vehicle: 岔路口的每条道路都在前方封死或通向死亡，行者虽能转弯却没有一条可抵达安全地点
ground: 1）舰队航向对应道路；2）转向选择对应岔路选择；3）生态维持期限对应可走距离；4）无可居星系对应道路封闭；5）舰队死亡对应死路终点。
