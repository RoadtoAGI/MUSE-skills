chapter: 正文
figure_type: simile
quote: 像你的眼睛
sensory_mapping: 透明湖水、清亮瞳孔、水面微光、相互映照
context_fact: 庄颜把手伸入湖中并赞叹水很清，罗辑没有说出口，只在心里把水与她的眼睛相比。
image_mechanism: 湖水的透明度被缩入两枚瞳孔，水面的清光转到庄颜脸上，让自然景物成为罗辑凝视她的替身。
property_alignment: 1）湖水对应双眼；2）透明对应清澈；3）水光对应眼神；4）无污染对应罗辑认定的纯真。
context_alignment: 比较由庄颜当场强调“清”触发，又承接此前清澈目光母题，符合罗辑不断把风景人格化为她的视角。
narrative_function: 将庄颜与湖山美景继续重叠，显示罗辑理想化凝视已渗入环境。
transfer_rule: 眼睛喻水应落实透明、反光或深度中的两项，并由人物当下观看动作触发。
failure_boundary: 湖水之清不能证明庄颜内心透明，且罗辑的判断带有投射；浑浊或无反光水体不适用。
