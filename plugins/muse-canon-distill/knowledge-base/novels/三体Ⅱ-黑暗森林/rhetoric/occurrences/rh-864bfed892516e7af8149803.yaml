tenor: 希恩斯站在由一千亿发光神经元微粒构成、密度极高的全息图像内部的视觉体验
vehicle: 观察者身处恒星最密集、星光几乎填满黑暗的银河系核心
ground: 1）发光神经元对应恒星；2）一千亿数量对应银河星数；3）微粒密集对应核心星密度；4）步入显示器对应置身星域；5）银光包围对应星海浸没。
