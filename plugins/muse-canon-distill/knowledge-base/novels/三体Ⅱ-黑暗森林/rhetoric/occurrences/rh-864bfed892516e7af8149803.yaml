figure_type: simile
quote: 他仿佛置身于银河系的核心
sensory_mapping: 亿万星点、核心密集、黑隙消失、身体被星海包围
context_fact: 全息白雾逐级放大为闪亮微粒，微粒自身发光并最终成为密密麻麻的星星。
image_mechanism: 大脑尺度向外爆炸成天文空间，每个微粒升格为恒星，显示器不再位于眼前，而把观察者整个吞进星系中心。
property_alignment: 1）神经元微粒对应星星；2）大脑网络对应银河系；3）高密度对应银心；4）希恩斯对应星际观察者；5）全息空间对应宇宙空间。
context_alignment: 一千亿与银河恒星数量形成刻意同构，人物又能在三维显示中行走，‘置身’比屏幕观看更贴合。
narrative_function: 把不可想象的神经元数量转成宇宙尺度，并建立贯穿后文的‘大脑宇宙’框架。
transfer_rule: 微观系统作宇宙应在单元数量、空间拓扑和观察尺度上同时扩张，让观察者的位置也随比喻改变。
failure_boundary: 神经元有突触、功能和生物结构，恒星没有同类连接；银河核心类比只承载数量密度与视觉包围。
