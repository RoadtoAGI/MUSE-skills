chapter: 正文
figure_type: metaphor
quote: 罗辑仿佛看见一堆草丛中的露珠
sensory_mapping: 视觉、光学、液体运动、时间
context_fact: 罗辑认可白蓉文笔优美，却认为小说人物全天恋爱、没有现实生活与谋生逻辑。
image_mechanism: 把人物缩成一粒粒水珠，让其个性、关系和命运都由反射、融合、坠落、蒸发这些液体过程完成。
property_alignment: 1）透明露珠对应人物单纯同质；2）折射颜色对应借文笔与环境显个性；3）相遇融合对应恋爱；4）失意坠落、日升蒸发对应关系与人物迅速消散。
context_alignment: 罗辑以审美敏锐又刻薄的读者视角评价青春小说，露珠同时保留文笔之美和内容之轻。
narrative_function: 刻画罗辑的文学判断力，并为白蓉要求他创造有完整生命史的人物提出反面样本。
transfer_rule: 用自然微物评价人物群时，应让材质、显色机制、相互作用和寿命分别对应角色塑造的不同层面。
failure_boundary: 露珠人物缺少持久性和主体性；若小说详细呈现劳动、社会关系与长期成长，这一评价就会失准。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 白蓉青春小说中单纯、同质、只围绕恋爱聚散的人物群
vehicle: 草叶上透明滚动、借环境折射显色并很快蒸发的露珠群
ground: 1）人物本身单纯透明对应露珠无固有色；2）个性依赖周围五光十色对应折射环境；3）相恋分离对应露珠融合坠落；4）缺少生活基础、短暂存在对应日升即消失。
