chapter: 正文
figure_type: simile
quote: 像坐在村头晒太阳的老头儿们
sensory_mapping: 群山收拢成一排灰衣老人，枯草像斑白须发，安静坐看华北平原的城市生灭
context_fact: 罗辑在两百年后重返旧地，平原已成沙漠，山形、岩缝枯草和荆条却几乎没有变化。
image_mechanism: 地质静止获得老人坐姿和观看时间，人类两百年由此缩成老人晒太阳时眼前的一小会儿。
property_alignment: 1）山体轮廓对应佝偻坐姿；2）岩石古老对应老人高龄；3）缓慢风化对应久坐；4）山临平原对应老人坐在村口。
context_alignment: 比喻出自庄颜曾说的话，朴素乡村人物与眼前荒山相配，也让她的温柔视角短暂陪伴临终罗辑。
narrative_function: 把山提升为跨文明兴亡的旁观者，校准人类时间尺度，并延续罗辑对庄颜的记忆。
transfer_rule: 地貌作老人时，应让姿态、年龄、观察位置和变化速度同时对应，并从场景当地生活取人物喻体。
failure_boundary: 山没有意识、疲劳或观看能力；‘老头’只承载形状与时间感，不能推导自然对人类的态度。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 暮色中几亿年几乎不变、轮廓低缓平淡的岩山
vehicle: 在村头坐定晒太阳的老人，身体弯曲安稳，见过漫长世事却不急于移动
ground: 1）横卧山势对应老人坐卧姿态；2）亿年岩龄对应老人年岁；3）地貌缓变对应久坐不动；4）俯看平原对应村头旁观。
