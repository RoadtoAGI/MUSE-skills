chapter: 正文
figure_type: simile
quote: 欺骗和诡计是一门艺术，就像蛇身上的花纹一样。
sensory_mapping: 视觉纹样、审美、威胁
context_fact: 三体人继续研读《三国演义》，并因人类思维不透明而决定阻止人类逃亡。
image_mechanism: 把抽象计谋铺成可观赏纹样，再把纹样固定在令人恐惧的动物身体上，使“精美”与“危险”同步增强。
property_alignment: 1）策略层次对应纹样层次；2）技巧吸引力对应花纹美感；3）隐藏伤害对应蛇体威胁；4）越精巧越畏惧对应越美越可怕。
context_alignment: 蛇意象承接此前三体人对欺骗的恐惧，但此处新增“美丽程度与危险程度同增”的映射，准确反映其读《三国》的学习结果。
narrative_function: 把三体人从不理解欺骗推进到能审美却更恐惧欺骗，并为围堵人类逃亡提供心理动因。
transfer_rule: 表现危险技巧的吸引力时，可选择美感与威胁共处、且强度能同步变化的载体，让读者同时感到赞叹与戒备。
failure_boundary: 普通无毒蛇纹或纯装饰图案不能承载危险；该比喻也不能推出所有美丽策略必然恶意。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类欺骗与计谋的精巧形式及其对三体人的威胁感
vehicle: 越美丽越让观察者害怕的蛇身花纹
ground: 1）计谋结构精巧对应花纹美丽；2）美感包裹危险对应花纹附着于有威胁的蛇；3）技巧越高越难防范对应花纹越美整体越可怕。
