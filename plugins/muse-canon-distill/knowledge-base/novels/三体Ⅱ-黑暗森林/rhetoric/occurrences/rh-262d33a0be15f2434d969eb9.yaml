chapter: 正文
figure_type: simile
quote: 发光的人群像从沙滩上退去的海浪般低了下去
sensory_mapping: 近处一排亮人先伏下，低落动作像退浪沿人海扩散，整片光面从高到低沉向沙地
context_fact: 人群靠近罗辑后在两三米外停下，前排阻住后方推进并跪地，后面的人随即相继跪下。
image_mechanism: 数千个离散屈膝动作被组织成一条连续退浪，方向、传播和高度变化同时进入视觉。
property_alignment: 1）个体队列对应水体横带；2）跪下高度差对应浪头下落；3）连锁模仿对应波动传播；4）衣光对应浪光。
context_alignment: 人群刚被写成萤火海洋，退浪继续同一大尺度水域框架，并准确捕捉集体跪拜的顺序。
narrative_function: 让宗教式臣服成为压倒性的群体景观，显出罗辑面对的权力和危险都已超出个人。
transfer_rule: 集体动作作浪时，应标出动作起点、传播方向、共同高度变化与表面连续性，不能只因人数多就称海。
failure_boundary: 每个人是自主行动者，跪下并非受液体物理波推动；比喻不能抹去人群内部差异和责任。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 前排开始跪下后，后排依次跟随，整片发光人群由近及远连续降低高度
vehicle: 海浪退离沙滩时，原本隆起的发亮水面沿宽阔前缘逐层伏低并向远处传开
ground: 1）人群起伏对应浪面；2）相继跪下对应退潮逐层降低；3）发光衣对应水面反光；4）横向队列对应浪线；5）动作传播对应退浪推进。
