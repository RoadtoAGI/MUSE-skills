tenor: 相爱者凭共同经验构成只对彼此有效的意义系统，在其中愿望、记忆与对方价值被理想化到近乎无限
vehicle: 一个由玫瑰色光线构筑的独立世界，居民拥有上帝般全知全能，可数尽沙粒并把星辰制成赠给爱人的项链
ground: 1）爱情关系对应独立世界；2）温柔理想化对应玫瑰色；3）私密语义对应世界内词物对应；4）相爱者对应创世上帝；5）无限理解对应数尽沙粒；6）赠予愿望对应串星为项链。
