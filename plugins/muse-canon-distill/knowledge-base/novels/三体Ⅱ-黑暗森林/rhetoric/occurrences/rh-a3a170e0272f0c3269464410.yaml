quote: 只有在那个玫瑰色的世界中，这种语言的所有词汇才能找到对应物。那个世界中的每一个人都是上帝
sensory_mapping: 两道目光围成玫瑰色宇宙，恋人能叫出每粒沙、摘下星辰串成项链，所有词只在其中显形
context_fact: 罗辑和庄颜认为目光语言不属于公共世界，只有相爱者共享的世界能承载其全部意义。
image_mechanism: 私人语境被世界化，词义依赖关系变成物体只能在特定宇宙存在；夸张神力显示爱对价值尺度的重写。
property_alignment: 1）共同记忆对应世界法则；2）情感滤镜对应玫瑰色；3）双方理解对应词物配对；4）愿望实现感对应神力；5）珍视对方对应以星辰赠礼。
context_alignment: 两人正站在沙漠绿洲和星空设施下，沙、星、玫瑰色晚霞都可见，宏大意象由家庭现场取材。
narrative_function: 把爱设为黑暗森林之外的另一套局部宇宙法则，并引出三体监听员询问‘这就是爱吗’。
transfer_rule: 关系作独立世界时，应定义颜色气候、语言规则、居民能力和外部世界无法承载之物，让世界由关系机制生成。
failure_boundary: 爱情不会赋予全知全能，也不能让公共语言失效；玫瑰世界只描述相爱者的主观共享语境。
