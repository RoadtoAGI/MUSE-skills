quote: 已经成年的人类社会不可能退回到童年
sensory_mapping: 社会身体成长、成年站立、童年远去、时间单向
context_fact: 泰勒希望用四百年让社会从个人主义回到集体英雄主义，章北海认为只能坚定向前。
image_mechanism: 四百年历史被压成一条人的成长线，制度和价值像骨骼成熟；要求回到过去等于让成人缩回儿童身体。
property_alignment: 1）人类社会对应人；2）现代阶段对应成年；3）古代英雄主义对应童年；4）历史演化对应成长；5）复古对应返龄。
context_alignment: 泰勒先以同样四百年提出逆向演化，章北海沿时间尺度回应，用生物成长强调方向不可复制。
narrative_function: 拒绝复古建军方案，把太空军精神建设的方向从恢复过去转向创造未来。
transfer_rule: 历史阶段类比人生年龄应对齐积累、不可逆变化和能力差异，并避免把“童年”自动判为低劣。
failure_boundary: 社会制度可复兴旧传统，历史并非生物年龄般绝对单向；类比只反对整体退回，不排除选择性继承。
