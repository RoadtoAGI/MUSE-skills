chapter: 正文
figure_type: simile
quote: 那台电脑薄得像一张纸
sensory_mapping: 薄机展开、侧面成线、平面轻巧、旧物形态压扁
context_fact: 警方切断房屋与超级信息世界连接，拿出罗辑熟悉的笔记本电脑形态，但未来制造使其异常轻薄。
image_mechanism: 复杂计算设备的体积被压到最普通平面材料，旧时代熟悉物只在轮廓上保留，厚重内部仿佛被全部挤走。
property_alignment: 1）电脑机身对应纸张；2）显示面对应纸面；3）极薄边缘对应纸边；4）便携性对应纸片轻便；5）折叠形态对应纸页开合。
context_alignment: 周围显示全部熄灭后，纸薄电脑成为少数可见技术物，既久违又用一个尺寸差异标记两个世纪。
narrative_function: 用简洁尺度对比展示离线警务设备，避免在紧张调查中插入冗长技术说明。
transfer_rule: 以纸写设备轻薄时，应限定厚度、平整度和侧面轮廓，避免把可折、易撕等纸性一并转移。
failure_boundary: 电脑有刚性、电子结构和一定重量，不会像纸一样折皱撕裂；‘一张纸’是视觉厚度近似。
quality_assessment: conventional
confidence: 0.99
review_status: reviewed
tenor: 未来警察为隔绝网络而使用的独立笔记本电脑机身极薄、近乎没有传统设备厚度
vehicle: 单张纸片厚度极小、平整轻薄且从侧面几乎只剩一条线
ground: 1）机身厚度对应纸厚；2）平整外形对应纸面；3）侧视轮廓对应细线；4）轻便对应纸张可携；5）与旧电脑反差对应实体体积被压缩。
