review_status: reviewed
tenor: 罗辑第一次切身意识到不可见智子正贴近监听、因而主动截断谈话的监视压迫感
vehicle: 看不见的小飞虫在耳边环绕飞行、持续发出近距离嗡鸣
ground: 1）智子环绕监听对应飞虫盘旋；2）不可见却可感对应只闻嗡声；3）持续监视对应嗡鸣不停；4）信息干扰对应声音侵耳；5）迫使停话对应虫声提醒。
