figure_type: simile
quote: 他还仿佛听到了另一个并不存在的声音，那是在周围飞行的智子的嗡嗡声
sensory_mapping: 耳边嗡鸣、微小飞行物、环绕监听、近距振翅
context_fact: 罗辑将要说出叶文洁与宇宙社会学关联时，意识到自己是面壁者，把话咽回去。
image_mechanism: 无形量子监视器获得昆虫翅膀和声带，在耳边绕圈；技术性的“被观察”转为无法忽略的听觉骚扰。
property_alignment: 1）智子对应飞虫；2）运动监听对应盘旋；3）监视存在对应嗡鸣；4）罗辑警觉对应听见。
context_alignment: 下一形象直接出现萤火虫光点，昆虫声光共同把不可感知的智子暂时具象化，贴合瞬间警觉而非物理事实。
narrative_function: 标记罗辑第一次真正进入面壁者思维，停止向外界泄露关键线索。
transfer_rule: 不可见监视写成虫鸣，应让监视器具有微小、环绕、持续三项特征，并用人物言语中断显示作用。
failure_boundary: 智子不发声也非昆虫，嗡鸣是罗辑想象；若监视遥远间歇或人物毫不察觉，该声像不成立。
quality_assessment: effective
