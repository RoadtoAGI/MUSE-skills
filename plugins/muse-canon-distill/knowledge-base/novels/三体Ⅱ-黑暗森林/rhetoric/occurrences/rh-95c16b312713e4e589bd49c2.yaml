chapter: 正文
figure_type: metaphor
quote: 不像是已经走到生命尽头的人
sensory_mapping: 道路、步行、终点线、落日照面
context_fact: 章北海探望病危父亲，夕阳给其脸映出血色，使他看起来比预想好。
image_mechanism: 生命被拉成有终点的道路，夕阳短暂照亮终点前的旅人，外观与实际里程出现错位。
property_alignment: 1）父亲对应旅人；2）岁月对应路程；3）死亡对应尽头；4）病危对应接近终点。
context_alignment: 病房随后与夕阳和最后余晖相连，旅程终点与日落共同收束父亲生命。
narrative_function: 在不直说死亡的情况下建立告别时限，也衬托父亲仍保持军人姿态。
transfer_rule: 生命旅途写临终时，应给出所处路段、接近终点的证据和仍在行走的部分，避免只用空泛“走到”。
failure_boundary: 死亡时间并不可见，外表改善也不能判断距离；道路终点的确定性不应替代医学事实。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 病危父亲已接近死亡的人生阶段
vehicle: 旅人沿道路走到再无前路的终点
ground: 1）一生经历对应行程；2）时间推进对应步行；3）临终对应抵达尽头；4）外表尚有血色对应看起来还未到终点。
