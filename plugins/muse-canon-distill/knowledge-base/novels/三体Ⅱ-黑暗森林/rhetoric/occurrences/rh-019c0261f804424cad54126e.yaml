quote: 静静地享受着海的拥抱，在短暂而残缺的生涯中
sensory_mapping: 水体包裹、漂浮、缓行、临终拥抱
context_fact: “唐”号为腾船坞提前下水，随后将由拖轮送去拆毁；这是它唯一一次与海接触。
image_mechanism: 海面长出双臂托住钢铁躯体，拖往拆毁的技术过程被改写成夭折者临终前终于回到应属怀抱。
property_alignment: 1）航母对应短命者；2）海对应拥抱者和归宿；3）下水对应相拥；4）拆毁对应生命终止；5）未服役对应生涯残缺。
context_alignment: 紧接吴岳“未起航就结束”的人生类比，航母生命化使人舰两条失败命运互相哀悼。
narrative_function: 给予停工巨舰最后尊严，并以温柔海拥反衬制度性拆毁。
transfer_rule: 载具生命化要让设计用途成为其“天性”，首次实现用途成为生命节点，终止原因决定悲剧形态。
failure_boundary: 海水并不关爱舰船，下水只是搬运步骤；若忽略工程资源与决策，把项目浪漫化会遮蔽现实代价。
quality_assessment: exemplary
