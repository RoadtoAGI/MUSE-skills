review_status: reviewed
tenor: 停工航母首次下水、短暂漂行后即将被拖去拆毁的经历
vehicle: 一个生命在夭折前终于被母亲或恋人拥抱，并短暂享有本应属于它的世界
ground: 1）海水包围船体对应双臂环抱；2）舰船为海而造对应生命归属；3）首次接触海对应初次被拥抱；4）未服役即拆毁对应短暂残缺生涯；5）缓慢漂行对应安静享受。
