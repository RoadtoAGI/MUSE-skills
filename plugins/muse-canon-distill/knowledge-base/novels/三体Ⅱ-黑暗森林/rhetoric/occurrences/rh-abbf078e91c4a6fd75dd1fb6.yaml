chapter: 正文
figure_type: analogy
quote: 地球就是一块大陨石
sensory_mapping: 行星缩成巨石、脚下岩层成标本、茶杯举起、收藏柜失去稀奇
context_fact: 章北海购买铁陨石，收藏者强调其来自尘世之外；他用物质来源连续扩大‘陨石’定义来砍价和调侃。
image_mechanism: 视角骤然从收藏柜拉到宇宙，整颗地球被从行星类别移进陨石柜；再缩回手中茶杯，宏观改名制造逻辑喜剧。
property_alignment: 1）地球对应大陨石；2）地表石头对应陨石碎块；3）彗星水对应陨石成分；4）茶杯对应地球材料制品；5）收藏者对应被反分类者。
context_alignment: 类比建立在真实宇宙成分连续性上，又故意忽略分类尺度，符合章北海掩饰杀人用途时冷静幽默的谈判方式。
narrative_function: 松弛暗杀准备的表面气氛，同时把普通物质与天外物质的界线打散，为陨石子弹伪装铺垫。
transfer_rule: 用尺度重分类制造机智时，应保留真实共同属性，再有意跨越学科分类边界，让夸张可被识别。
failure_boundary: 行星与陨石在轨道、尺度和定义上不同，茶杯也不是陨石；共同来源不能推出类别完全等同。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 收藏者把陨石视为珍稀天外之物时，章北海强调地球、石头乃至水同样由星际物质构成
vehicle: 一块由星际物质聚合、在宇宙中运行的超大陨石，其碎片和所盛之水也可沿来源被称为陨石
ground: 1）地球物质对应陨石材料；2）行星形成对应星际物质汇聚；3）地上石头对应大陨石局部；4）彗星来水对应陨石来源；5）茶杯与茶对应重新分类的样品。
