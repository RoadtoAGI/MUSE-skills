image_mechanism: 展厅从建筑通道拉成长时间隧道，古物成为过去路标；二人的目光越过脚下年代，投向尚未到来的灰色出口。
property_alignment: 1）展厅对应时间道路；2）文物对应过去；3）穿行对应历史旅行；4）末日文化对应灰暗未来。
