narrative_function: 将参观节奏从恋爱陶醉转入文明存亡，使艺术馆成为跨时代审判空间。
transfer_rule: 在过去中行走应由按年代或文明陈列的真实空间支撑，并让未来想象从当前物件问题自然延伸。
failure_boundary: 人物并未穿越时间，展品也不能代表完整过去；乐观未来或明亮展厅若无忧虑，灰暗色调会强加。
