quote: 这是一种宗教，所信仰的就是思想钢印所固化的信念，入教的仪式就是自愿在自己的思想中打上钢印
sensory_mapping: 隐秘教团守护器物、新成员走入仪式、命题刻进头脑、信众代代接续
context_fact: 惠子推测四台思想钢印可轮流使用两个世纪，使最初数千名钢印族不断为自愿者植入同一信念。
image_mechanism: 技术设备被放入教团结构，软件操作获得仪式性，机器写入的命题则成为无需证据更新的教义。
property_alignment: 1）钢印组织对应宗教；2）失败主义命题对应信条；3）设备对应圣器；4）技术人员对应仪式主持者；5）自愿植入对应皈依；6）代际延续对应教团传承；7）绝对信念对应不可怀疑。
context_alignment: 思想钢印把‘相信’从心理活动变成不可逆身份，宗教类比同时解释自愿、仪式、组织和长时延续，比单说秘密设备更完整。
narrative_function: 把孤立技术犯罪扩大为可能潜伏两个世纪的社会结构，显著提升钢印族威胁。
transfer_rule: 把组织类比为宗教时，应逐项配置教义、信徒、入教仪式、权威载体与传承方式，避免只凭狂热程度命名。
failure_boundary: 钢印信念由神经技术强制固定，成员未必具有神学、崇拜或道德体系；宗教类比不能证明组织真实存续。
