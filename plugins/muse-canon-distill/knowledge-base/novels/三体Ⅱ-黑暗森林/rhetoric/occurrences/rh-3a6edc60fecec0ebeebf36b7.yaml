chapter: 正文
figure_type: metaphor
quote: 一丝笑意在他那苍白的脸上荡漾开来
sensory_mapping: 苍白水面、细纹初起、圈圈外扩、骤成大浪
context_fact: 泰勒在公众与罗辑都无法相信其坦白后情绪失衡，先露微笑，随即爆发狂笑并质问处境。
image_mechanism: 脸部静止被铺成无风水面，最小的嘴角变化像水纹先出现，再以连续波动占据整张脸。
property_alignment: 1）脸对应水面；2）微笑对应波纹；3）表情发展对应扩散；4）歇斯底里对应波动增强。
context_alignment: ‘荡漾—发展—狂笑’给出了清楚的幅度变化，柔和水纹与精神崩溃形成反常张力。
narrative_function: 为泰勒从僵硬绝望到失控狂笑提供渐进的可视过渡。
transfer_rule: 用水波写表情，应从局部触点、扩散路径和幅度变化呈现情绪升级。
failure_boundary: 笑容没有规则同心扩散，面部肌肉也不是平面；突然爆笑而无渐变时，荡漾会拖慢节奏。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 泰勒脸上极淡的笑容逐步扩展并转成歇斯底里的狂笑
vehicle: 平静水面由一条细波纹向四周扩散、振幅不断增大的涟漪
ground: 1）苍白面孔对应水面；2）一丝笑意对应初波；3）表情扩展对应涟漪外荡；4）狂笑形成对应波幅增大。
