chapter: 正文
figure_type: simile
quote: 巨大的圆柱体从他们头顶向前方伸延，像是从两侧向上卷曲的天空
sensory_mapping: 头顶镜面把蓝天折回，两侧天幕沿圆弧向上卷，三人像站在一条由天空卷成的隧道下
context_fact: 天线长一千五百米、直径五十多米，反重力悬浮；底面半径大，映像没有明显失真。
image_mechanism: 镜面上的天空倒影与真实天空视觉连续，圆柱曲率不再属于机器，而像天幕自身被卷出几何形。
property_alignment: 1）天线反射面对应天空；2）圆柱两侧对应卷边；3）长轴对应向前延展；4）悬浮高度对应天幕压低。
context_alignment: 三体镜面观念强调映射宇宙以隐藏自我，天线此刻确实用天空倒影消隐自身，喻体落实该哲学。
narrative_function: 让庞大武备从压顶机器转成可进入的天空景观，为家庭触摸天线营造和解感。
transfer_rule: 镜面建筑作卷曲天空时，应让倒影连续、曲率、观看位置与延伸方向共同制造天幕错觉。
failure_boundary: 圆柱仍是实体天线并会遮挡天空，倒影不等于天幕本体；视角改变后连续感可能消失。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 三人站在巨大镜面圆柱天线下，仰视其低曲率底面向前延伸并反映周围天空
vehicle: 原本平展的天空从左右两边向上卷起，形成包住观察者头顶的弧形长廊
ground: 1）镜面倒影对应天空本身；2）圆柱弧面对应两侧卷曲；3）巨大尺度对应天幕覆盖；4）向前延伸对应天空长廊；5）低弧度对应近似平天。
