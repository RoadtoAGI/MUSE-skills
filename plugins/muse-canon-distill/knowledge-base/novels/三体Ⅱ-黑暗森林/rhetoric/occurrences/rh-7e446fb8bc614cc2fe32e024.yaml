quote: 他仿佛悬浮于飞船外的太空中
sensory_mapping: 白舱转黑、标线消失、群星包围、人物与一块界面孤悬
context_fact: 章北海取得舰长权限后独自在舱内停留过久，并已暗中设定逃亡航向和最高推进准备。
image_mechanism: 全息界面抹掉舱壁的视觉支架，把室内人物直接剪贴到真实星空尺度，孤立姿态提前显出他与舰队决裂。
property_alignment: 1）黑舱对应外太空；2）星图对应星空；3）无标度对应无上下远近；4）章北海对应舱外航天者；5）操作界面对应随身控制器。
context_alignment: 前一场东方延绪曾让舱壁消失以体验宇宙独存，章北海此刻主动复现同类视觉，却把它用于真实出逃。
narrative_function: 在命令揭露前用画面暗示章北海已把自己放到舰队之外，并聚焦那块决定战舰命运的界面。
transfer_rule: 室内作外太空时，应撤去尺度与边界参照，只保留星点、孤立人物和一件近距物体，使视觉失重承担情节预告。
failure_boundary: 章北海仍在气密舱内并受飞船维生保护，全息星空没有真实真空、距离与辐射风险。
quality_assessment: effective
