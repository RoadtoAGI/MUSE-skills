tenor: 章北海站在屏蔽标度线、只显示星空的黑色球舱内，从舱门外看已失去实体环境参照
vehicle: 一个人脱离飞船外壳与舱室保护，独自无重力地悬在黑暗宇宙和群星之间
ground: 1）黑色舱室对应太空暗域；2）全息星点对应真实群星；3）球舱失去标线对应无空间参照；4）章北海站位对应悬浮人体；5）发光界面对应太空中唯一近物。
