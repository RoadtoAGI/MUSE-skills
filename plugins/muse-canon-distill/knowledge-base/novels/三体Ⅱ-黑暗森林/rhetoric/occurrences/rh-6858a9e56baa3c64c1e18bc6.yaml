quote: 回忆过去和展望未来对他们而言都是一种负担
sensory_mapping: 肩背旧包、前路重箱、步伐变慢、暂时卸下
context_fact: 三人年过七十，经历过配给年代，又看到粮票回归和末日危机，选择什么都不想地安度晚年。
image_mechanism: 时间的两端各变成一件行李：过去装着艰苦经验，未来装着文明灾难；老人夹在中间，同时被前后重量拉住。
property_alignment: 1）回忆和展望对应行李；2）心理压力对应重量；3）老人对应负重者；4）现实无力对应无法搬动；5）不去想对应暂放重物。
context_alignment: 下一场粮票把过去实体带回，宇宙葬又把未来送到眼前，说明两只心理行李不断被现实重新塞满。
narrative_function: 简洁建立老人视角，使宏大科技突破与普通人的疲惫日常并置。
transfer_rule: 时间作负担应分别说明过去和未来装着什么，以及人物为何无法处理而只能减轻认知负重。
failure_boundary: 回忆也能提供经验，展望也能支持行动；三位老人态度不同，统一写成负担会抹平差异。
