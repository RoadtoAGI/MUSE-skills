context_fact: 女孩拒绝‘死去太阳’，说明自己更喜欢晚霞，因为晚霞后能看星。
image_mechanism: 把散布天空的暮色收成可对视的红眼，再把消逝后的星夜纳入眨眼过程。
property_alignment: 1）深红对应霞光；2）晶莹液面对应眼睛湿亮；3）瓶中凝聚对应瞳仁；4）酒尽对应晚霞退场。
context_alignment: 女孩偏爱晚霞、星空与梦境，眼睛意象符合其角色声音，也反射罗辑凝视。
narrative_function: 给酒命名并固定为二人共同记忆。
transfer_rule: 景象写成眼睛时，应匹配颜色、聚光、凝视关系与消逝动作。
failure_boundary: 酒无真实视线，晚霞也无单一眼形；缺少对视和消逝会沦为漂亮标签。
