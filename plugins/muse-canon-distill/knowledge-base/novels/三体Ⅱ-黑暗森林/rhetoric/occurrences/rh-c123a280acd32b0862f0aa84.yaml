quote: 不像刷子，而是像漆黑的太空深渊上刚刚萌发的一丛小草，这上千株小草每天都以肉眼能够觉察到的速度生长
sensory_mapping: 黑土深渊、细草破面、千茎成丛、逐日拔高
context_fact: 哈勃二号持续监测，刚捕捉到舰队穿越第二片尘埃云，尾迹比九年前更清晰。
image_mechanism: 旧“刷毛”的器物质地被换成生命过程：暗背景化作土面，每条冲击迹从一点抽芽，长度随日历可见增长。
property_alignment: 1）航迹对应草茎；2）尘埃区对应土层；3）刚出现对应萌发；4）尾迹延长对应生长；5）舰队群对应草丛。
context_alignment: 这次观测重点是尾迹随时间增长而非静态外形，小草比刷子更能承载连续速度和十条异常加速。
narrative_function: 更新航迹识别框架，使探测器加速从“长得更快的草”中显形。
transfer_rule: 同一对象换喻体应由观测重点变化驱动；强调时间增长时选择有萌发与伸长阶段的生命物。
failure_boundary: 尾迹由尘埃冲击扩散而非生物生长，方向也不受向光性；成熟静止航迹再称嫩草会失时态。
