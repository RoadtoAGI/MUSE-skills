quote: 将在地球国际和舰队国际中掀起巨大波澜
sensory_mapping: 消息砸入平水、巨浪突然抬高、波纹扩向两片水域、机构随浪摇晃
context_fact: 监测站丢失正在接近太阳系的三体探测器，而三大舰队此前因争夺拦截权撤回近距跟踪飞船。
image_mechanism: 信息的政治影响获得流体传播形态，一点突发事件通过媒体和机构传导，迅速把整个国际系统从静态推入起伏。
property_alignment: 1）地球与舰队国际对应水域；2）熄火消息对应冲击物；3）媒体报道对应波传播；4）公众震惊对应浪高；5）舰队争责对应乱流；6）政策反应对应受浪摆动。
context_alignment: 两套国际共同面对同一外部目标，波纹能跨边界传递；‘巨大’与探测器战略重要性相称。
narrative_function: 在切换到监测站时立刻标出事件级别，把一次技术跟踪失败提升为政治危机。
transfer_rule: 消息作波澜时，应说明冲击点、传播介质、受影响范围和浪高依据，并让后续争议体现水面动荡。
failure_boundary: 政治反应由机构选择和媒体叙事产生，不会像水波按固定物理规律衰减；影响程度尚未实际发生。
