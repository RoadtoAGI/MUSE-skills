chapter: 正文
figure_type: simile
quote: 永远年轻，就像我们记忆中的爱人
sensory_mapping: 银河外规律化成人影、岁月从旁流过、记忆容颜不老、探索者远远凝望
context_fact: 丁仪引用歌德‘我爱你，与你何干’，劝自己把物理规律当作不因探索者而改变的独立存在。
image_mechanism: 科学对象被人格化为旧爱，规律恒定获得记忆定格的青春外观，单向探索也转成不求回应的爱。
property_alignment: 1）物理规律对应爱人；2）科学家对应追慕者；3）规律恒定对应容颜不老；4）探索对应思念；5）无法改变规律对应对方独立；6）银河指示对应远方所在。
context_alignment: 丁仪从美女话题自然滑向旧爱，再滑向规律；轻佻开端最终显露他被智子遮眼的终身遗憾。
narrative_function: 用私人爱情容纳科学家的失败与豁达，使其临死前最后一次物理独白获得温柔收束。
transfer_rule: 恒定对象作记忆爱人时，应建立单向爱、时间冻结、对象独立和追求者不能占有四层关系。
failure_boundary: 规律没有人格、青春或情感，科学探索仍可获得可验证知识；记忆中的爱人也会被回忆改变。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 物理规律不随文明发现、利用乃至改造现实而衰老或改变，始终保持唯一稳定形态
vehicle: 记忆中的爱人被定格在相爱时的年轻面貌，不受现实岁月、分离和死亡侵蚀
ground: 1）规律对应爱人；2）不变对应永远年轻；3）探索者对应恋人；4）认知记忆对应心中形象；5）现实变迁对应岁月；6）不可占有对应爱与对方无关。
