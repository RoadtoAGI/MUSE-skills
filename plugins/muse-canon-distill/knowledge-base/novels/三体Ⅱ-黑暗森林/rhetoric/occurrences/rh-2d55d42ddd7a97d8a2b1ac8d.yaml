chapter: 正文
figure_type: metaphor
quote: 大部分窗子不是被封死就是成了一个没有玻璃的黑洞
sensory_mapping: 沙墙排列暗孔、光线到口边消失、屋内深不可见、旧城像布满空洞
context_fact: 罗辑首次到地面，看见沙土覆盖的旧楼，大部分窗户封闭或破空，仅少数房间仍有人居住。
image_mechanism: 普通窗户原本负责透光与展示生活，此刻功能反转为吸光空口，城市人口流失被浓缩成一排排视觉缺失。
property_alignment: 1）破窗对应黑洞；2）无光房间对应吸光内部；3）玻璃缺失对应洞口开放；4）人口稀少对应内部空无；5）沙尘遮蔽对应边界模糊；6）罗辑凝望对应站在洞外。
context_alignment: 地下城处处发光显示，地面旧城却以黑洞窗格出现，光密度反差直接呈现繁荣与遗弃的空间分层。
narrative_function: 让大低谷后的旧世界以缺光身体出现，并为冬眠者居住区的怀旧生活设置荒凉外围。
transfer_rule: 窗作黑洞时，应利用无返光、内部不可见和周边明暗反差，让建筑衰败通过原采光口的反功能显现。
failure_boundary: 窗洞不会产生宇宙引力或吞噬物质，部分屋内仍有人居住；黑暗只能说明照明与视角。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 旧城楼房大量窗户失去玻璃、室内无光，从沙尘中的外部看只剩深暗空口
vehicle: 吞没光线、内部不可见且边界通向未知深处的黑色洞穴或宇宙黑洞
ground: 1）无玻璃窗洞对应洞口；2）室内黑暗对应不返光；3）看不见内部对应未知深处；4）空置楼房对应吞没人迹；5）黑色形状对应黑洞外观；6）破败感对应危险空腔。
