quote: 像是银子做的
sensory_mapping: 银质表面、冷亮反射、整体现色、金属实体
context_fact: 夜间玻璃金字塔未亮内灯，只受月光照射，静立于卢浮宫庭院。
image_mechanism: 透明玻璃失去透视深度，被月光镀成连续金属皮肤，整座建筑像一次银铸成型。
property_alignment: 1）玻璃金字塔对应银制品；2）月色对应银色；3）反光对应金属亮泽；4）统一外观对应整铸。
context_alignment: 内灯亮起前建筑确为冷银色，下一刻变金碧辉煌，银材质喻为色彩变换建立清晰起点。
narrative_function: 突出玻璃建筑的异质、天外感，也准备从银冷到金暖的“苏醒”。
transfer_rule: 材质比拟要锁定颜色、反光和表面连续性，并让光源变化能解释材质错觉。
failure_boundary: 建筑仍由玻璃构成且可透光；日间透明或内部灯亮时，整银观感即不成立。
