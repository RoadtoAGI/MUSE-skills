quote: 这好像是火箭燃料
sensory_mapping: 液体入口、喉咙灼烧、化学气味、面部皱缩
context_fact: 罗辑在接连遭遇自动设备谋杀后饮酒压惊，未来酒的味道使他立刻咧嘴皱眉。
image_mechanism: 饮料从餐桌被移到发动机，味觉的热、冲和化学感被放大成点火前的推进剂，让一口酒像吞入工业能量。
property_alignment: 1）烈酒对应火箭燃料；2）酒精度对应能量密度；3）入口刺激对应化学腐蚀感；4）喉咙发热对应燃烧；5）不可口对应非食品用途。
context_alignment: 说话人来自航天尚未普及的时代，却用最强工业液体命名陌生酒，符合他的旧词汇与当下未来环境。
narrative_function: 以粗粝味觉给连续惊险一个黑色幽默停顿，也保持罗辑与大史的市井对话声调。
transfer_rule: 烈饮作燃料时，应落到气味、灼烧、浓度和身体反应，并从人物可调用的技术经验选喻体。
failure_boundary: 酒可安全少量饮用且成分与推进剂不同，实际火箭燃料往往有毒；不能据此判断饮品危险等级。
quality_assessment: effective
