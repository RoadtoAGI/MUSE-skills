review_status: reviewed
tenor: 未来餐厅烈酒入口时极度辛辣、刺激、灼烧，味道强硬到令罗辑咧嘴皱眉
vehicle: 供火箭燃烧推进的高能化学燃料，气味刺鼻、不可饮用并带有强烈灼蚀危险
ground: 1）酒精刺激对应燃料刺鼻；2）喉口灼烧对应高能燃烧；3）难以下咽对应不可饮用；4）强烈味道对应化学浓度；5）未来酒对应推进时代的工业液体。
