chapter: 正文
figure_type: simile
quote: 暴雨像众神的帷幔悬挂在天海之间
sensory_mapping: 视觉、空间、尺度、遮蔽
context_fact: 驱逐舰在黑云、暴雨与巨浪中航行，只有闪电间歇照亮海面。
image_mechanism: 把无数雨线合成一面自天而下的厚布，海与天空被封成舞台内外，风暴尺度由“众神”抬高。
property_alignment: 1）雨幕连续性对应布幔；2）垂直方向对应悬挂；3）能见度降低对应遮幕；4）海天跨度对应神力尺度。
context_alignment: 这段记忆具有英雄史诗色彩，众神帷幔与随后大鹏巨翅保持同一宏阔语域。
narrative_function: 封闭战舰周围空间，为闪电、金光和冲浪动作制造巨型舞台。
transfer_rule: 把天气写成幕布时，应对应连续面、悬挂方向和遮蔽作用，并让场景确有舞台式开合。
failure_boundary: 零散阵雨或斜飞雨丝难以形成帷幔；“众神”只标定尺度与庄严，不说明超自然力量介入。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 风暴中从低云垂落、遮蔽海天的密集雨幕
vehicle: 由众神从天空悬下、隔开两个世界的巨大帷幔
ground: 1）密雨形成连续竖面对应帷幔布面；2）从云层垂到海面对应悬挂；3）遮住远景对应帷幔隔断视线；4）尺度超常对应众神之物。
