quote: 让NMD的眼睛朝上看
sensory_mapping: 视觉、方向、身体动作
context_fact: 原本防御地球洲际导弹的NMD几乎不改硬件，只把拦截与监测方向转向太空。
image_mechanism: 把复杂防御系统收束成一个可转动目光的身体器官，“朝上”用最小动作说明任务方向改变而硬件大体不变。
property_alignment: 1）传感器对应眼睛；2）目标甄别对应辨认；3）扫描方向改变对应抬头；4）系统警戒对应持续注视。
context_alignment: 值勤人员正嘲讽军方把方向切换包装成新系统，口语化身体动作突出改造之轻与宣传之重。
narrative_function: 快速解释NMD改造原理，并加强对“第一部分已建成”这一政绩说法的讽刺。
transfer_rule: 将技术系统器官化时，应选择功能真正同构的部件，并用一个方向或姿态变化概括系统配置变化。
failure_boundary: NMD还包含计算、决策和武器发射，眼睛只承载探测与指向；不能把整个系统能力缩减为被动观看。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: NMD系统被改为监测和拦截近地太空目标的传感能力
vehicle: 从地面转头、把视线抬向天空的眼睛
ground: 1）雷达传感器探测对应眼睛观看；2）拦截方向由地面转向太空对应抬眼；3）系统依赖识别目标对应视觉辨认对象。
