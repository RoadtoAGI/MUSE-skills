quote: 沙漠变成了一张璀璨的光毯
sensory_mapping: 荒沙被一整幅光织物覆盖，无数衣灯像发亮纱线密密交错，随人群微动闪烁
context_fact: 车从高路基拐下，罗辑先见晃动光晕，靠近后才认出沙漠上聚集的是城市人群。
image_mechanism: 离散人灯在远视中被织成连续表面，人数规模、密度和地面覆盖范围同时可见。
property_alignment: 1）人体点阵对应织物经纬点；2）信息服亮光对应璀璨纤维；3）沙漠平面对应铺毯地面；4）群体边界对应毯缘。
context_alignment: 罗辑尚未辨认人群，俯视条件先提供几何整体；光毯既壮观又掩盖其后宗教狂热。
narrative_function: 延迟人群身份揭示，把公众崇拜先作为非人尺度景观压到罗辑面前。
transfer_rule: 点状群体作织物时，应交代观察高度、点密度、覆盖平面和共同亮色，使‘毯’来自视觉整合。
failure_boundary: 人群会移动且个体有间隙，不是真正连续织物；近距离描写人物时毯面对应即告失效。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 大量穿发光信息服的人密集铺在新生活五村与公路之间的沙地上
vehicle: 一张平铺地面的璀璨织毯，由无数细小亮点组成连续、低伏而有边界的发光表面
ground: 1）人群覆盖沙地对应毯面铺地；2）个体衣光对应发亮织点；3）密集排列对应织纹连续；4）俯视低平对应平铺形态。
