chapter: 正文
figure_type: metaphor
quote: 在原来峡谷的尽头出现了一座黑色的孤峰。
sensory_mapping: 尺度、视觉、触觉、空间地貌
context_fact: 褐蚁在墓地觅食，沿墓碑表面和刻字沟槽攀爬，却不理解墓碑、姓名与葬礼。
image_mechanism: 视点缩到蚂蚁触须高度后，日常墓碑自动扩张成完整地貌；碑面、刻痕和人物依次被重新命名为峭壁、峡谷和巨大存在。
property_alignment: 1）碑体竖直高耸对应孤峰；2）碑面坚硬光滑对应峭壁岩面；3）刻字深槽对应峡谷路径；4）人类蹲下仍与碑同高对应巨型生物临峰。
context_alignment: 蚂蚁只能凭尺度、材质和触感分类，山地词汇严格服从它的知觉；读者逐步反推出杨冬墓碑，形成双重观看。
narrative_function: 陌生化墓地并把人类死亡放入非人尺度，使宇宙社会学公理的诞生与微小生命的无知见证并置。
transfer_rule: 采用微观视角时，按观察者的身体比例依次重命名整体、表面和细部，并让其行动验证每一层空间映射。
failure_boundary: 若观察者拥有对象概念或能俯瞰全貌，持续称墓碑为山峰会显得刻意；柔软、低矮物体也不具备峭壁地貌。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 杨冬墓地中竖立的黑色墓碑及其刻槽
vehicle: 从蚂蚁疆域拔起、带峭壁峡谷的黑色孤峰
ground: 1）墓碑相对蚂蚁的高度对应顶天立地的山峰；2）坚硬光滑碑面对应峭壁；3）刻字凹槽对应可进入的峡谷与路线。
