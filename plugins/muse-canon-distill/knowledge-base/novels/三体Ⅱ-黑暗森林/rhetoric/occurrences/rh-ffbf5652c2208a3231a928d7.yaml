quote: 太阳将变成银河系中的一座灯塔，把这咒语发送出去
sensory_mapping: 太阳在银河黑海中化为巨灯，三千多片尘云控制明灭，把坐标节奏射向各个方向
context_fact: 罗辑说明核弹位置经过编码，爆炸后形成尘埃云，使太阳闪烁成三张可组合的恒星位置图。
image_mechanism: 复杂的恒星级光学编码被航海信号系统化，光源、遮光、节奏、方位与接收者形成完整通讯链。
property_alignment: 1）恒星强光对应灯塔灯；2）星际空间对应夜海；3）闪烁编码对应航标节奏；4）坐标警示对应位置标记；5）观测文明对应航行者。
context_alignment: 黑暗森林以隐藏和射击为核心，灯塔却主动暴露位置；熟悉航标让罗辑的同归于尽威慑一听即懂。
narrative_function: 揭晓雪地工程真正用途，将尘埃预警方案反转成黑暗森林坐标广播装置。
transfer_rule: 远距广播作灯塔时，应对应光源、遮光节奏、编码内容、传播环境和接收者定位能力。
failure_boundary: 灯塔通常保护航行者且标自己位置，这里闪烁标示另一恒星组并可能引来毁灭；功能伦理相反。
