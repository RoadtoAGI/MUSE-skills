tenor: 飞机卧室内无所不在、仿佛来自舱外远处的低沉引擎嗡鸣
vehicle: 辽阔夜空以低声、持续而难辨词义的声音吟唱
ground: 1）声音包围房间对应夜空包围飞机；2）低频持续对应低吟；3）声源难定位对应天空整体发声；4）远距感对应无边空间传来。
