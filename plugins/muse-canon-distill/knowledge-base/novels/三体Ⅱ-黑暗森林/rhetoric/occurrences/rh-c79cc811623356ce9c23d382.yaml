quote: 无边的夜空在低吟
sensory_mapping: 低频听觉、环绕声场、暗色空间、远方回响
context_fact: 关灯后只剩红灯，背景引擎声凸显；罗辑觉得其中一部分来自舱外很远处。
image_mechanism: 机械振动穿过舱壁后失去发动机轮廓，扩散到整片黑空，宇宙由真空获得低沉喉音。
property_alignment: 1）引擎声对应吟声；2）夜空对应发声者；3）机舱对应听者所在室；4）持续嗡鸣对应拖长音。
context_alignment: 罗辑正处于未知航程，不能看见目的地；让夜空低吟把机械护送改写为宇宙尺度的不祥催眠。
narrative_function: 在开窗看到护航战机前建立听觉悬念，并强化个体被黑夜包围的孤独。
transfer_rule: 把环境写成发声者时，应让真实声源在传播中与该环境共享方向、音色和覆盖范围。
failure_boundary: 声音实际来自引擎，不是外空；真空不能传声，科幻场景若强调物理事实需保留主观听感限定。
