chapter: 正文
figure_type: metaphor
quote: 仇恨，这比黄金和钻石都宝贵的财富
sensory_mapping: 珍宝库存、财富耗尽、无法购买、组织失去资本
context_fact: 共同的三体敌人消解了组织对西方的仇恨，老人说组织因失去仇恨将随自己死亡。
image_mechanism: 情绪被装入组织金库并标价，黄金钻石退成次等资产；仇恨库存归零时，机构像失去资本的实体停转。
property_alignment: 1）仇恨对应财富；2）组织凝聚力对应购买力；3）敌人对应财富来源；4）仇恨消退对应破产。
context_alignment: 说话者故意以价值倒置震动国防部长，宝贵并非赞美善，而准确指出暴力组织赖以生存的稀缺资源。
narrative_function: 揭示泰勒无法用物资复制敢死精神的根本原因，宣告其招募方案失败。
transfer_rule: 把情绪写成财富时，应交代谁持有、它购买什么行动、如何增减以及耗尽后的制度后果。
failure_boundary: 仇恨对社会整体具有破坏性，“宝贵”只限该组织维存视角；不能据此把珠宝价值或情感伦理等同。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 维系老人组织存在、招募献身并赋予共同目标的仇恨情绪
vehicle: 比黄金钻石更稀有、更能支撑组织生存的核心财富
ground: 1）仇恨驱动成员对应资本提供动力；2）共同敌人凝聚组织对应财富维持机构；3）当前消退对应资产耗尽；4）泰勒无法提供对应不可购买；5）稀缺性对应高于珠宝。
