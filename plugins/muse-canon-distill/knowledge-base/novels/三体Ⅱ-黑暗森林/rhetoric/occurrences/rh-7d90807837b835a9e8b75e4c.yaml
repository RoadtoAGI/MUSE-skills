context_fact: 希恩斯向常伟思解释思想钢印能影响判断回路，让大脑不经思维就相信一个信息为真。
image_mechanism: 连续心理过程被拆成机器流水线，技术找到中段旁路，越过计算直接把末端指示灯固定为‘真’。
property_alignment: 1）大脑对应计算机；2）感知对应输入端；3）思考对应运算程序；4）信念对应输出；5）钢印刺激对应改写控制流；6）不经思维对应跳步。
context_alignment: 听者是军人且对脑科学陌生，三段计算流程既通俗又精确定位技术介入点，为伦理争议提供共同模型。
narrative_function: 把思想钢印从神秘控制变成可理解操作，直接引出‘被修改者还是不是人’的质问。
transfer_rule: 认知过程类比计算机时，应逐项区分输入、处理、输出和干预位置，并说明被省略步骤的主体价值。
failure_boundary: 人脑判断受情感、身体和社会关系影响，不是确定性程序；同一输入也不保证固定输出。
