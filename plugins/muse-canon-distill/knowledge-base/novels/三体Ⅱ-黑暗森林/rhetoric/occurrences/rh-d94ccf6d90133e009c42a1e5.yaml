chapter: 正文
figure_type: simile
quote: 像一座座被遗弃的太空城
sensory_mapping: 巨城悬在黑空、灯火全灭、街道般舰面无声、成片废墟静候
context_fact: 联合舰队与水滴同步后关闭大部分发动机，一百二十万人屏息等待螳螂号接触。
image_mechanism: 战舰的生命迹象随尾焰消失，庞大结构只剩城市尺度外壳；临战寂静被提前写成战后遗弃。
property_alignment: 1）恒星战舰对应城市；2）舰内一千多人对应市民；3）关闭尾焰对应熄灯；4）无线电安静对应无声；5）舰体规模对应城区；6）编队漂浮对应废城群。
context_alignment: 舰内明明有人，‘被遗弃’却预示他们即将死亡，喻体的时间错位产生强烈不祥。
narrative_function: 把威严舰队转成无生命遗迹，为水滴一分钟摧舰群提前铺设死亡视觉。
transfer_rule: 大型载具作弃城时，应让动力、通讯、人员可见性与照明同时降到近零，并利用空壳体量制造预兆。
failure_boundary: 舰内仍有一百二十万人且系统正常，战舰并未真正废弃；静默只是接触行动的暂态。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 关闭发动机后静止漂浮、体量庞大、表面只有微弱反光的两千艘战舰
vehicle: 人口撤空的城市保留巨大建筑轮廓，却没有灯火、交通与生活声息，孤独废置
ground: 1）单舰对应城市；2）巨大舰体对应建筑群；3）发动机熄火对应断电；4）人员不可见对应空城；5）静止漂浮对应遗弃；6）微弱阳光对应残余天光。
