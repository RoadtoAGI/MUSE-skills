context_fact: 罗辑曾以为女友死于意外车祸，萨伊告知这是三体世界唯一一次直接刺杀令。
image_mechanism: 谋杀者把意图藏进交通因果链，让每次碰撞都像随机物理作用；目标事件落入城市事故表格后失去人为轮廓。
property_alignment: 1）刺杀对应意外事故；2）策划碰撞对应随机连撞；3）目标死亡对应交通死亡；4）隐蔽要求对应不受注意。
context_alignment: 罗辑无保护时本可直接杀害，额外复杂性只为伪装，事故模型因此准确解释策略而非装饰。
narrative_function: 证明三体文明既惧怕罗辑又不愿暴露这种恐惧，建立他寻找原因的核心谜题。
transfer_rule: 伪装类比要逐项说明真实事件如何复刻掩护事件的因果链、统计背景和可见痕迹。
failure_boundary: 事故外观并不保证取证无法揭穿，且女友成为误中者；不能由单次伪装推断所有事故皆人为。
