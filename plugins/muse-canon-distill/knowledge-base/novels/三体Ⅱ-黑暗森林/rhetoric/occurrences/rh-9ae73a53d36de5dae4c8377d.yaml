chapter: 正文
figure_type: simile
quote: 像一滴圣母的眼泪
sensory_mapping: 银泪悬在粗糙舱内、柔光包住液滴、观者眼睛湿润、敌意仿佛被洗去
context_fact: 四人近距面对水滴，西子因其美感产生跨文明认同，话语随后令全球几十亿人热泪盈眶。
image_mechanism: 水滴的形状被宗教情感填满，未知机器从无害艺术品进一步升为为人类流泪的慈爱主体。
property_alignment: 1）水滴对应泪珠；2）三体文明对应圣母主体；3）镜面无瑕对应圣洁；4）柔和色彩对应温柔；5）跨文明爱对应悲悯；6）西子泪湿对应泪的情绪传染。
context_alignment: 人类已将美等同善，西子的宗教喻体是这种投射顶点；三小时后的全球共鸣显示修辞直接塑造判断。
narrative_function: 给水滴的伪装完成最后神圣化，使其发动攻击时从慈爱眼泪翻成坚不可摧的子弹。
transfer_rule: 未知液滴作神圣眼泪时，应配置流泪主体、悲悯对象、纯洁光泽和受感召者，并让投射承担后果。
failure_boundary: 水滴没有情感、宗教身份或慈爱意图，外形似泪不能推导三体善意；它随后立即杀死考察队。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴在粗陋机械与岩石背景中显得黯淡柔和、纯净、悲悯且带宗教神圣感
vehicle: 圣母为众生苦难流下一滴晶莹泪珠，纯洁、温柔、悲伤并承载无条件慈爱
ground: 1）探测器对应眼泪；2）液滴外形对应泪珠；3）镜面纯净对应圣洁；4）柔和光泽对应悲悯；5）孤悬对应一滴落泪；6）人类认同愿望对应被慈爱感召。
