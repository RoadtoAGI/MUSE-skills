tenor: 水滴沿第一列依次贯穿相邻战舰，各舰被高温加热至红炽，按攻击顺序逐艘发亮
vehicle: 一排大型灯具沿线路被依次通电点亮，亮点按固定方向迅速推进
ground: 1）战舰对应巨灯；2）红炽舰体对应灯亮；3）水滴轨迹对应电路；4）逐舰穿透对应依次通电；5）第一队列对应灯列；6）三秒五舰对应点亮速度。
