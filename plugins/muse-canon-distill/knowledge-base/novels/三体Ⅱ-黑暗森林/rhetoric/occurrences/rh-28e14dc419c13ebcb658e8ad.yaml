figure_type: simile
quote: 像是舰队第一队列中按顺序亮起的一排巨灯
sensory_mapping: 黑空排着巨灯、第一盏骤亮、红光沿直线接力、整列按序点燃
context_fact: 水滴三秒飞过九十公里，连续穿透无限边疆、远方、雾角、南极洲和极限号。
image_mechanism: 舰毁的时间序列被转成电灯控制序列，攻击路径不需解释，只看红光如何一盏盏亮起。
property_alignment: 1）单舰对应灯；2）受热红光对应点亮；3）阵列对应灯排；4）水滴经过对应开关触发；5）攻击方向对应点灯方向；6）毁灭持续对应灯光保持。
context_alignment: 人类曾用两千太阳照亮木星展示力量，如今自己的舰船被敌方按序点成灯，意象完成反向回收。
narrative_function: 让高速连杀获得一眼可读的空间顺序，并显示密集编队如何替水滴排好目标。
transfer_rule: 连锁毁坏作点灯时，应让对象预先成列、亮起可观察、触发顺序与攻击轨迹一致。
failure_boundary: 红光来自熔化而非正常供电，亮起意味着死亡而非工作；各舰爆炸过程并不完全同步。
quality_assessment: exemplary
