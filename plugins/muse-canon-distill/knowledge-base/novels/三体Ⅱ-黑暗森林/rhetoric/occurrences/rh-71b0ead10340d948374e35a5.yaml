quote: 就像我看不出那十根长出来的刷子毛一样，你们也没看到一个至关重要的事实
sensory_mapping: 屏幕细毛、视线遗漏、日期连线、盲区互换
context_fact: 科学家指出十个探测器及发射日期，斐兹罗发现日期正是罗辑发咒语和三体再下诛杀令之日。
image_mechanism: 两类证据摆成两张图：将军在天文图上漏掉长毛，科学家在政治时间图上漏掉关键交点；盲区镜像交换。
property_alignment: 1）斐兹罗对应天文外行；2）科学家对应政治外行；3）十根航迹对应日期关联；4）视觉发现对应政治推断。
context_alignment: 类比承认双方各自专业边界而非贬低科学，精确说明事实早已在桌面却需要跨域阅读。
narrative_function: 将探测器发射解释为三体对罗辑的恐惧反应，抬高咒语可信度。
transfer_rule: 专业盲点类比应对称交换两方看不见的对象，并让各自通过对方提供的数据完成发现。
failure_boundary: 政治关联仍是推断而非直接证据，日期相同可能有其他解释；看出模式不保证因果成立。
