tenor: 科学家能辨认尾迹形态却未把探测器发射日期与罗辑咒语、三体恐惧联系起来的政治盲点
vehicle: 斐兹罗没有专业视力、无法从星图中看出十根异常伸长刷毛的天文盲点
ground: 1）将军缺天文训练对应科学家缺政治训练；2）看不出刷毛对应看不出日期意义；3）图像特征需专业解读对应事件联系需政治解读；4）彼此提示对应互补观察；5）小异常对应重大事实入口。
