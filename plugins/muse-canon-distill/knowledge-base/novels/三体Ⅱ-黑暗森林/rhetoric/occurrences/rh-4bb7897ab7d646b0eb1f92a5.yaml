chapter: 正文
figure_type: analogy
quote: 宇宙文明的资源分配可能分成相互平行的很多层次
sensory_mapping: 碳基、硅基、恒星和电磁生命各铺成透明平层，多数错开，若干资源区却上下叠在同一点
context_fact: 括号说明不同生命需要的资源不同，从碳基到电磁生命的资源合计覆盖宇宙各种物质，且层间有重叠。
image_mechanism: 不可见的生态位关系被几何分层，独立与竞争分别由平行和重叠两个空间关系表示。
property_alignment: 1）资源生态位对应平面层；2）生命类别对应层中主体；3）需求隔离对应层距；4）资源竞争对应交叠区。
context_alignment: 罗辑正建立最简宇宙模型，层状图像能在不展开各类生物学的情况下保留资源差异这一修正项。
narrative_function: 补强‘资源有限’公理，说明异质文明不能因需求不同就完全避开生存竞争。
transfer_rule: 复杂分类作平行层时，应定义每层主体、独占资源、层间距离和交叠区，避免把层只当目录编号。
failure_boundary: 资源关系可能是网络而非整齐平层，各类文明也可改变需求；图像只供概念分组，不是宇宙真实几何。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 不同物质形态的生命需要不同资源集合，各文明生态位大体互不干扰，但部分需求会交叠竞争
vehicle: 多层平行结构各自沿独立平面延展，层内共享同类空间，层间多数分离却可在局部交叠
ground: 1）生命类型对应层；2）专属资源对应各层平面；3）互不干扰对应平行分离；4）共同资源对应局部重叠；5）宇宙物质形态对应层集合。
