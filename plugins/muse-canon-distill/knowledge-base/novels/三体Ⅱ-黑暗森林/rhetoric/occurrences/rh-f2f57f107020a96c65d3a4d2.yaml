chapter: 正文
figure_type: metaphor
quote: 你们躺在现代文明的温床中安于享乐
sensory_mapping: 文明铺成暖床、整代人安睡其中、低级技术像被褥包裹、远方危险逼近
context_fact: 司令以百分之十五光速证明强盛，章北海反驳应用指标不能弥补基础物理被智子锁死。
image_mechanism: 繁荣从力量证据翻成使人昏睡的照护环境，舒适越强，精神失备越深。
property_alignment: 1）现代文明对应床；2）技术成果对应温度与软垫；3）公众对应熟睡者；4）胜利主义对应安全梦；5）战略准备对应起身；6）三体技术差对应床外寒冷。
context_alignment: 章北海来自坎坷年代，以苦难经验批评舒适后代；‘温床’准确呈现双方判断基准差。
narrative_function: 把未来繁荣重新解释为战略弱点，巩固章北海拒绝减速的理由。
transfer_rule: 舒适作温床时，应说明谁提供照护、哪种能力因安睡退化，以及床外有何具体威胁。
failure_boundary: 舒适生活不必导致无知，未来舰队也进行训练与监测；苦难经验不自动保证判断正确。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 未来人被应用技术繁荣和舒适生活包围，因安全感而失去对基础理论差距与灭绝战争的警惕
vehicle: 婴儿躺在温暖柔软的床上被照料，身体舒适、无需行动，也看不到床外危险
ground: 1）未来社会对应温床；2）未来人对应婴儿；3）技术便利对应保暖软垫；4）享乐对应安睡；5）缺乏准备对应未起身；6）敌情对应床外威胁。
