tenor: 将计算机直接连接大脑以增强人的推理、计算或思考能力
vehicle: 把微弱输入成比例放大、输出更强信号或力量的放大器
ground: 1）人脑原有能力对应输入信号；2）计算机算力对应增益部件；3）脑机连接对应接入电路；4）增强认知对应放大输出；5）原思维仍提供方向对应输入决定信号内容。
