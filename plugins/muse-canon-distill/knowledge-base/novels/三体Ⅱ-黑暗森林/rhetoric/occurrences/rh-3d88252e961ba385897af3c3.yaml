quote: 使后者的计算能力成为人类的智力放大器
sensory_mapping: 电路接入、信号增益、旋钮、强输出
context_fact: 希恩斯列举提升智力的初步途径之一，承认尚无具体方案。
image_mechanism: 抽象算力被装成大脑外接电路，人的念头进入后提高幅度再返回意识，智力成为可调信号强度。
property_alignment: 1）大脑对应信号源；2）计算机对应放大器；3）脑机接口对应连线；4）增强能力对应增益；5）思考结果对应输出。
context_alignment: 脑科学家用设备功能描述技术路径，机械模型简明、可操作，同时保留这只是“也许”的设想。
narrative_function: 把宏观提升人类具体化为第一条工程候选路线。
transfer_rule: 放大器写能力增强时，应区分原始输入、外接增益、输出指标和放大同时可能增加的噪声。
failure_boundary: 算力增加不等于想象力、常识或价值判断提高；接口还可能放大错误和偏见。
quality_assessment: effective
