tenor: 五舰人员突然与地球文明断绝返航和依赖关系，组成尚未成熟、缺少保障的独立星舰社会
vehicle: 婴儿刚剪断母体脐带，失去持续供养与包裹，被抛入深渊而本能哭泣、需要父亲保护
