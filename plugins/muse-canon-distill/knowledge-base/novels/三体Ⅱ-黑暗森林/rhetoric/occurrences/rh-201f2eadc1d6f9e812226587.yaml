quote: 这五千五百人就像刚刚割断脐带的婴儿，被残酷地抛向宇宙的深渊
sensory_mapping: 五千人从地球母体脱落、脐带在太阳系边缘割断、幼小群体坠向黑暗深渊、齐声想哭
context_fact: 水滴封锁太阳系，五舰只能远航并立即建立独立社会，官兵听到‘回不去了’后情绪濒临失控。
image_mechanism: 政治独立被身体出生化，切断、供养停止、脆弱与坠落组成不可逆的离母过程。
property_alignment: 1）星舰地球对应新生儿；2）地球世界对应母体；3）通信与资源依赖对应脐带；4）断航对应剪断；5）太空黑暗对应深渊。
context_alignment: 章北海刚有私人‘新生’感，集体也被迫出生；个人主动解脱与群体被残酷抛出形成对照。
narrative_function: 把制度独立的宏观议题还原为依附骤断的身体恐惧，并自然引出父亲型领袖需求。
transfer_rule: 共同体独立作出生时，应落实母体、脐带、供养中断、新环境和照护需求，呈现成长代价。
failure_boundary: 五千多人是受训成年人并拥有成熟飞船，能自主决策；地球也并非主动完成安全分娩。
