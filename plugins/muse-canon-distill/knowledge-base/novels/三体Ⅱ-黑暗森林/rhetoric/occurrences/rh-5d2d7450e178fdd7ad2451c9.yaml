quote: 你们就沐浴在这个时代的阳光中
sensory_mapping: 制度化成日光、冬眠者全身受照、阴影与歧视退去、时代保持温暖白昼
context_fact: 阳光计划支持者以冬眠者获得平等公民地位为例，论证人类也应尊重三体文明生存权。
image_mechanism: 抽象制度从条文变成日常气候，受益者不是偶尔获得帮助，而是长期生活在覆盖性光照中。
property_alignment: 1）人文主义对应太阳；2）平等法律对应光线；3）现代社会对应晴天；4）冬眠者对应沐浴者；5）无歧视对应无阴影。
context_alignment: 计划本身名为‘阳光’，演说者把名称扩展成道德环境，用受众自身经验照亮对三体人的类推。
narrative_function: 为东郭族立场提供最有感染力的道德图景，也暴露以温暖感代替敌情证据的倾向。
transfer_rule: 制度作阳光时，应落实光源、覆盖范围、受益身体和阴影对象，并注意普照是否真实。
failure_boundary: 法律仍可能执行不均，人文原则也不能直接判断外星战略意图；温暖不等于安全。
