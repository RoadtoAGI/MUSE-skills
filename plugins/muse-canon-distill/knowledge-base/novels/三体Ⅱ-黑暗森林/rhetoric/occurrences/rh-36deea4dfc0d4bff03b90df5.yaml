context_fact: 庄颜解释自己曾想象并画过许多美好地方，而眼前湖山已包含那些想象。
image_mechanism: 画笔代替脚步在虚构山水里走过，纸面观看沉积成旅行记忆，使未到之地获得到访后的熟悉。
property_alignment: 1）作画对应旅行；2）画笔对应脚步；3）构图细察对应沿途观察；4）完成画面对应抵达记忆。
context_alignment: 说话者是国画专业学生，绘画本就是她进入风景的主要方式，类比来自职业经验。
narrative_function: 解释庄颜为何面对现实美景反而失去作画冲动，并塑造其想象力。
transfer_rule: 把创作比作亲历时，应指出创作过程中的观察、移动或记忆环节如何替代身体经验。
failure_boundary: 绘画不能提供真实旅途的温度、阻力和偶发事件；缺少细致观察的随手画也难产生到访感。
