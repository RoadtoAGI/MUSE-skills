tenor: 资源和力量有限的人类试图用百万核弹改变水星轨道并摧毁整个太阳系，以此威慑三体文明
vehicle: 体形细小的蛇企图吞下远大于自身、无法容纳消化的大象
ground: 1）人类能力对应小蛇；2）太阳系级目标对应大象；3）百万氢弹对应吞咽手段；4）工业产能不足对应口径过小；5）轨道能量缺口对应无法消化；6）计划失败对应吞噬不成。
