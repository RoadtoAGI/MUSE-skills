quote: 这是一个蛇吞象的计划
sensory_mapping: 小蛇张口、巨象压前、吞咽尺度失衡、身体无法容纳
context_fact: 破壁人测算人类连所需氢弹十分之一都未必造得出，即使有百万颗也不足以使水星坠日。
image_mechanism: 复杂能量与产能差被压成两个动物体量，计划的野心是一口吞下目标，而执行者的身体从一开始就装不下。
property_alignment: 1）人类工业对应蛇；2）太阳系毁灭任务对应象；3）核弹生产对应张口吞咽；4）能量不足对应口小；5）推进计划对应勉强下咽；6）不可实现对应消化失败。
context_alignment: 破壁人刚称计划壮丽，转而用俗语揭示其粗鲁尺度错配，符合他对雷迪亚兹‘武夫’本质的评价。
narrative_function: 用极简比例图结束长篇破壁，说明计划虽美却在第一道产能条件上已经失败。
transfer_rule: 宏大计划作蛇吞象时，应量化执行者资源、目标尺度和关键缺口，确保夸张由可核数据支撑。
failure_boundary: 工程可通过协作、时间与技术改变能力尺度，蛇象体量是静态的；此喻只适用于当前估算。
