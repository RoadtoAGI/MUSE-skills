quote: 两腿虚软，仿佛在飘行
sensory_mapping: 脚底离地、身体失重、缓慢漂移、方向摇晃
context_fact: 罗辑拿着庄颜留下的画从育儿室走向空客厅，正努力说服自己早有准备。
image_mechanism: 震惊切断双脚与地板的触感，身体像轻物被眩晕气流推过走廊，每一步都没有可靠着力点。
property_alignment: 1）罗辑身体对应漂浮物；2）虚软双腿对应失去支撑；3）行走对应飘移；4）眩晕对应重力感混乱。
context_alignment: 心理现实已从美梦骤然坍塌，失重步态让认知断裂落到腿部，连接后面房间物性融化。
narrative_function: 延缓罗辑抵达客厅的动作，具体呈现震惊而非直接概述悲伤。
transfer_rule: 飘行喻写震惊应给出脚底失触、腿部无力或方向感丧失，避免只用“飘”表达轻快。
failure_boundary: 罗辑仍在地面行走且能拿画打电话；奔跑、强力跺步时不适用失重漂移。
