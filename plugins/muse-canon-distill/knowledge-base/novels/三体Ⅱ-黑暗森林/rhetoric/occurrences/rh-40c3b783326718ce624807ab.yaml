quote: 这有点儿像阻力
sensory_mapping: 高速小点撞进厚层、穿出时略慢、空程重新提速、下一层再次削去速度
context_fact: 李维比较连续速度数据，发现每次攻击前后都有相同的降速再加速模式，由此判断发射体是同一个。
image_mechanism: 看似多次发射的离散事件被阻力曲线串为一条连续运动，速度损失成为穿透证据。
property_alignment: 1）水滴对应运动体；2）舰体材料对应阻力区；3）入舰碰撞对应受阻；4）出舰降速对应能量损失；5）推进对应再加速。
context_alignment: 军官不用复杂系统，只凭基础力学直觉解释异常速度，符合冬眠者旧知识反而不受现代先验束缚的情节。
narrative_function: 完成从‘舰舰互击’到‘单一物体贯穿’的关键推理，首次逼近水滴真相。
transfer_rule: 用日常物理类比识别隐蔽主体时，应找可重复的输入—损耗—恢复曲线，让同一性由过程留下痕迹。
failure_boundary: 这里的阻力只是观测模型，强互作用材料与舰体碰撞的真实能量交换机制未知。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 同一小型发射体每次穿过战舰后速度略降，再在飞向下一目标途中恢复到高速
vehicle: 运动物穿过介质时受阻力损失动能而减速，离开阻碍后可在持续动力下重新加速
ground: 1）战舰对应阻碍介质；2）穿透对应通过介质；3）速度下降对应阻力耗能；4）航段加速对应动力恢复。
