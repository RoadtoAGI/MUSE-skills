quote: 这里将是一个比三体世界更严酷的地狱
sensory_mapping: 行星燃烧坠落、火海扩张、外域冻结、文明无处逃离
context_fact: 破壁人推演水星坠日会让类地行星、木星乃至天王海王星相继失速坠落，太阳状态最终不可预测。
image_mechanism: 复杂天体灾变被收束成一个所有区域都施加刑罚的世界，冷热两端与无出口共同构成宇宙地狱。
property_alignment: 1）毁坏太阳系对应地狱；2）太阳火海对应火刑；3）外行星严寒对应寒狱；4）轨道崩溃对应秩序消失；5）人类三体灭绝对应受难者无存。
context_alignment: ‘地狱’不是泛指可怕，前文已逐层给出火、寒、坠落和无逃生地，喻体对灾变链有多项支撑。
narrative_function: 在长篇物理推演末端给出伦理和感官总括，使同归于尽的真实含义一锤定音。
transfer_rule: 场景作地狱时，应以多种具体、不可逃的折磨和封闭结果支撑，再用极限词收束机制链。
failure_boundary: 地狱含超自然审判与永恒意识受刑，太阳系灾变是无意志物理过程且生命会迅速灭绝。
