tenor: 连锁坠日完成后的太阳系将极寒、灼热、轨道崩溃且不可能容纳任何生命文明
vehicle: 惩罚永续、环境极端、遍布痛苦而没有逃生出口的地狱世界
ground: 1）太阳系对应地狱场域；2）行星坠落对应毁灭刑罚；3）岩浆火海对应地狱烈焰；4）外行星严寒对应极端折磨；5）生命灭绝对应无生路；6）三体也无法移民对应封闭无出口。
