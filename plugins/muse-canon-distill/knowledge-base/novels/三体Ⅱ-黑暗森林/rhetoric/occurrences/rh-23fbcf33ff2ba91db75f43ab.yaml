chapter: 正文
figure_type: simile
quote: 星空下的太平洋像一块黑色的巨缎在下面滑过。
sensory_mapping: 视觉、材质、运动
context_fact: 伊文斯深夜站在船首，船在星空下穿越太平洋，并等待视网膜字幕。
image_mechanism: 将难辨边界的夜海变成有柔顺质地和流光的布面，再用“滑过”把船的前进转换成背景运动。
property_alignment: 1）暗色海面对应黑缎底色；2）星光下波纹对应缎面光泽；3）船首视角中的海流对应布幅滑移。
context_alignment: 夜色消去海浪细节，只留下黑面与光泽，缎子比白昼海景更贴合；平滑画面也衬托即将显露的交流裂痕。
narrative_function: 建立静美、幽暗的对话舞台，使远方字幕在黑色背景上获得视觉焦点。
transfer_rule: 表现大面积流动物时，可选同时具备连续表面、可变光泽和滑移动势的材质，并让观察点决定运动方向。
failure_boundary: 风暴海面、碎浪密集或日光强烈时，绸缎的平滑连续性会失真；该喻体也不承载海洋深度与力量。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 审判日号夜航时船下无边起伏的太平洋
vehicle: 在下方缓缓滑动的巨大黑色绸缎
ground: 1）夜海的深黑连续表面对应黑缎；2）波面反光对应绸缎流动光泽；3）航船前进造成海面后移错觉对应缎面滑过。
