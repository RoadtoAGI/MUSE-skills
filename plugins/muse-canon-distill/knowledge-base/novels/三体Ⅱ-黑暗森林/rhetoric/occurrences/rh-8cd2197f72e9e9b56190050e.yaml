tenor: 危机时代电视中仍残存的、与时局和时代无关的娱乐内容
vehicle: 主浪过去后仍向岸边传来、逐渐衰弱的剩余波纹
ground: 1）黄金时代结束对应主浪已过；2）旧娱乐节目存续对应余波仍到；3）内容越来越少对应波幅衰减；4）危机媒体环境对应新水域覆盖；5）罗辑还能找到对应余波尚未消失。
