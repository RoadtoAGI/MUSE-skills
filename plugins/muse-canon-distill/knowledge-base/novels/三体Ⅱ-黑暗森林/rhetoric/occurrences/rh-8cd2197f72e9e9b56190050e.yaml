quote: 作为黄金时代的余波
sensory_mapping: 退去大浪、残余涟漪、逐渐变弱、岸边触及
context_fact: 罗辑隐居后跳过时事新闻，只看无关时代的节目，但这类内容已越来越少。
image_mechanism: 旧日生活化成一场已经远去的大浪，电视屏幕偶尔仍接到它留下的小波纹，让罗辑躲进过去片刻。
property_alignment: 1）黄金时代对应主波；2）娱乐内容对应余波；3）时代转型对应浪过；4）节目减少对应衰减；5）观众对应岸边接收者。
context_alignment: 罗辑的庄园生活刻意拒绝危机，余波准确说明他享用的是旧时代残存资源而非真正脱离历史。
narrative_function: 为悠闲生活标出期限与寄生性，预示外部危机终会穿透隐居。
transfer_rule: 余波写文化残留时，应给出原始事件、传播介质、衰减趋势和最后仍触及的人群。
failure_boundary: 文化内容会再生产并改变，不只是被动衰减波；黄金时代评价也来自特定人物立场。
