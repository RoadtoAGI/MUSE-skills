quote: 技术是加速发展的，就是说发展起来会越来越快
sensory_mapping: 运动、速度、时间
context_fact: 史晓明从清代进京耗时与现代登月耗时的变化，推销一百二十年内造出逃亡飞船的可能。
image_mechanism: 把多领域技术史压成一辆越跑越快的运动体，过去的时间差被直接当作未来还能继续提速的证据。
property_alignment: 1）创新频率对应运动速度；2）知识累积对应加速动力；3）一百二十年跨度对应可继续前进的时间段。
context_alignment: 喻体简洁、乐观、适合销售人员说服外行；它也暴露论证把复杂技术瓶颈简化为单一速度曲线。
narrative_function: 为逃亡基金制造技术必然性，同时让读者看见骗局如何借进步叙事跨越不确定性。
transfer_rule: 使用发展加速隐喻时，应指定衡量速度的成果单位、加速来源和可能出现的瓶颈，避免只凭两个历史节点外推。
failure_boundary: 不同技术领域速率不一，基础物理、资源与工程可靠性可能造成减速；交通史不能直接证明世代飞船按同曲线成熟。
