tenor: 史晓明所宣称的未来一百二十年技术进步速度
vehicle: 运动物体不断提高速度的加速过程
ground: 1）单位时间成果增加对应速度上升；2）既有技术促进后续研究对应持续加速；3）用过去交通跨越推算未来飞船对应由当前速度外推路程。
