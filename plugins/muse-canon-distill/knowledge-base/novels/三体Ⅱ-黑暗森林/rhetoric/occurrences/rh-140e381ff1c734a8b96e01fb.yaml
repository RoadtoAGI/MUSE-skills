chapter: 正文
figure_type: simile
quote: 死一般的寂静笼罩了会场
sensory_mapping: 会场声息断绝、众人凝住、空气压低、死寂覆盖
context_fact: 惠子揭示思想钢印用一个负号把胜利信念反转为失败主义，可能影响延续至今的太空军钢印族。
image_mechanism: 声音不是渐弱而是像生命被瞬间抽走，会场作为整体进入无呼吸状态，信息的潜在死亡后果提前侵入现场。
property_alignment: 1）会场群体对应生命体；2）震惊沉默对应死亡无声；3）动作停止对应生命活动终止；4）灾难信息对应致死冲击；5）笼罩感对应死亡阴影。
context_alignment: 叙述主动回忆雷迪亚兹‘摇篮’威胁时同样的沉默，两次都关乎大规模死亡且由隐蔽机制突然显形。
narrative_function: 为负号真相留出无台词的冲击空间，并把两个世纪前后的制度恐惧并置。
transfer_rule: 以死亡写群体静默时，应有足以中止所有反应的具体信息，并让无声、静止和危险后果同时成立。
failure_boundary: 与会者仍有意识并很快继续质问，寂静只是短暂反应；不能据此推断现场有人生理死亡。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 代表们得知思想钢印全部被反向设置后，因震惊和恐惧完全停止交谈、动作与即时反应
vehicle: 死亡状态下生命活动、呼吸和声音彻底消失所形成的绝对静止
ground: 1）无人出声对应生命声息消失；2）动作凝滞对应尸体不动；3）气氛冰冷对应死亡临近；4）突然覆盖对应死亡阴影降下；5）公共反应中断对应群体失去活力。
