figure_type: simile
quote: 她的身体落到车后的路边，像一个没有骨骼的布娃娃。
sensory_mapping: 视觉、重量、肢体运动
context_fact: POLO车冲向二人，罗辑摔倒躲过，女子被撞飞越过车顶。
image_mechanism: 瞬间抽掉人体的骨骼和意志，只留下被惯性操纵的软物，撞击对生命控制力的剥夺直接可见。
property_alignment: 1）失去肌肉控制对应无骨；2）飞落轨迹对应玩偶被掷；3）姿态松散对应布料柔软。
context_alignment: 罗辑没有听见撞击，只从车尾看见身体落下，布娃娃准确来自纯视觉、无声的恐怖。
narrative_function: 避免解释伤势而直接呈现死亡冲击，彻底打碎前一刻被电影化的轻浮美感。
transfer_rule: 描写高速冲击后的身体时，可选择能匹配控制丧失、肢体形态和受力轨迹的物体。
failure_boundary: 人物仍能主动护身或落地后立即行动时，无骨娃娃会误写伤势；喻体不提供医学结论。
quality_assessment: exemplary
