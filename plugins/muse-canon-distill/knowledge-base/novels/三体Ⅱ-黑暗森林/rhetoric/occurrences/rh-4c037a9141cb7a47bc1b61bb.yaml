tenor: 女子遭高速汽车撞飞后失去控制、坠落路边的身体
vehicle: 内部无骨架、四肢松软任人抛落的布娃娃
ground: 1）身体完全失去主动控制对应娃娃被动；2）四肢松垂扭折对应无骨柔软；3）被抛飞落地对应玩偶受外力投掷。
