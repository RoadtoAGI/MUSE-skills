tenor: 水滴用持续宽频电磁干扰永久阻止人类借太阳放大广播宇宙坐标信息
vehicle: 把门窗、出口或发声孔完全封闭并固定，使内部无法再通过该开口通行或传声
ground: 1）太阳放大通道对应出口；2）水滴干扰对应封堵材料；3）人类广播对应通过；4）覆盖全频对应封严；5）长期驻轨对应固定封口。
