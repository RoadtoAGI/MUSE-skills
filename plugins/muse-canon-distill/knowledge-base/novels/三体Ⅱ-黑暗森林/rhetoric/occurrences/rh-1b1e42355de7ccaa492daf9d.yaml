quote: 水滴是来封死太阳的
sensory_mapping: 太阳像巨大出口被银滴堵住、所有可用波段一层层封严、地球声音撞在封口内侧
context_fact: 水滴进入太阳同步轨道并持续发射超过放大阈值的全波段电磁波。
image_mechanism: 持续信号压制被压成一个空间封口动作，‘死’强调无缝、长期和无法绕过的程度。
property_alignment: 1）太阳对应通信门；2）可放大频段对应门缝；3）干扰波对应封条；4）水滴驻留对应看守；5）银河广播对应出门。
context_alignment: 上一句‘超级天线’提供设备模型，本句改成被封出口，罗辑从技术判断落到彻底绝望。
narrative_function: 以六字完成水滴战略目的命名，终结黑暗森林咒语再发的可能。
transfer_rule: 通道被禁制作封死时，应说明开口、封堵介质、缝隙覆盖和维持者，让绝对词有技术证据。
failure_boundary: 太阳仍正常发光和辐射，封锁只针对人类利用的调制放大频道，并非恒星物理死亡。
