chapter: 正文
figure_type: analogy
quote: 就像太阳有光和空气中有氧一样
sensory_mapping: 抬头见日光、呼吸得氧气、端水即见毒性、常识层锁定
context_fact: 受试者生理与其他精神状态正常，却拒绝饮水；他把错误命题视为最显然的事实，随后又被身体含水这一事实折磨。
image_mechanism: 被植入的判断被抬到自然底层，与光和氧并排成为世界出厂属性；错误因此不再像意见，而像睁眼呼吸即可证实。
property_alignment: 1）钢印信念对应自然定律；2）水对应太阳与空气；3）有毒属性对应光与氧；4）主观确信对应日常必然性；5）质疑者对应否认常识者。
context_alignment: 类比出自受试者本人，语气平静、逻辑完整，恰好显示思想钢印改变的是确定感而非一般推理能力。
narrative_function: 让读者从内部感受错误信念的牢固，为希恩斯亲身复现实验提供可信恐怖。
transfer_rule: 表现不可动摇的错信念时，可让人物把它并列到最基础的感官常识，并保留现实反证造成的痛苦裂缝。
failure_boundary: 太阳发光和空气含氧有经验与科学证据，水有毒没有；类比只说明确信强度，不能转移真实性。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 受思想钢印影响的104号把‘水有毒’体验为无需论证、与世界基本属性同等确定的常识
vehicle: 太阳必然发光、空气天然含氧这两项稳定且可反复验证的自然事实
ground: 1）水有毒信念对应自然常识；2）不可怀疑感对应太阳必有光；3）普遍存在感对应空气含氧；4）无需推理对应日常直接接受；5）反驳困难对应基础事实确定性。
