chapter: 正文
figure_type: analogy
quote: 强互作用力构成的材料与普通物质在强度上的差别，就如同固体与液体的差别一样
sensory_mapping: 水滴像硬核穿行、万吨舰壳失去固态尊严、钢铁在它前方仿佛液面分开
context_fact: 舰载激光无法损伤水滴，水滴穿透战舰后仍完好无损并继续高速攻击。
image_mechanism: 两种都属固体的材料被重新分配为固—液相态差，使数量级强度差获得日常触觉尺度。
property_alignment: 1）水滴表层对应固体；2）舰壳对应液体；3）水滴不变形对应保持形状；4）舰体被穿透对应流体让路。
context_alignment: 类比紧接激光拦截失败，为前文不可思议结果提供读者能握住的材料学直觉。
narrative_function: 将技术代差从抽象数量级改写为物态差，宣布人类武器体系整体失效。
transfer_rule: 巨大强度差作相态差时，应让受力响应、形变方式和碰撞结果逐项对应，清楚标明尺度近似。
failure_boundary: 普通战舰仍是固体，强互作用材料也非宏观意义的普通固体；类比不能给出实际强度比。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴强互作用材料相对于人类普通材料具有跨层级强度优势，碰撞时后者几乎无法保持结构
vehicle: 固体保持稳定形状并抵抗剪切，液体受力即流动变形，二者相撞时液体绕开固体而难以损伤它
ground: 1）强互作用材料对应固体；2）普通物质对应液体；3）结构保持对应固态强度；4）舰体熔裂对应液体让路。
