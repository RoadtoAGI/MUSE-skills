chapter: 正文
figure_type: analogy
quote: 如果这时一条蛇爬到你面前，对你说它是为你服务的，你能因此不害怕和厌恶它吗？
sensory_mapping: 视觉接近、身体威胁、恐惧记忆
context_fact: 三体人因发现人类能撒谎而抛弃ETO；破壁人二号试图说服主重新接受组织服务。
image_mechanism: 把不可见的意图风险变成一条正在缩短距离的危险动物，口头承诺与身体威胁同时出现，信任难题因此成为本能退缩。
property_alignment: 1）隐藏思想对应蛇无法读懂的意图；2）服务承诺对应蛇开口保证；3）此前信息失误对应被咬经历；4）持续恐惧对应看见蛇即戒备。
context_alignment: 蛇来自三体人刚研究的《圣经》材料，也符合其初学人类欺骗时用具体危险动物理解抽象信任。
narrative_function: 解释三体文明为何既需要ETO又厌恶ETO，并建立贯穿后文的蛇—欺骗意象框架。
transfer_rule: 表现信任中的能力风险时，可选择同时具备用途承诺、难读意图和可重复伤害的生物情境，并纳入既往受害记忆。
failure_boundary: 蛇的恐惧带有物种本能，而政治信任可经制度与证据调整；不能由类比推出人类欺骗必然用于背叛。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三体文明面对声称效忠、却掌握欺骗与计谋的人类ETO成员
vehicle: 曾带来危险、如今爬近并宣称服务于人的蛇
ground: 1）人类思维不透明对应蛇意图难判断；2）ETO宣称效忠对应蛇声称服务；3）欺骗经验造成戒惧对应被蛇咬后持续怕蛇；4）能力可用于服务也可反噬对应蛇靠近仍有毒牙。
