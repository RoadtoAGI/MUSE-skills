chapter: 正文
figure_type: simile
quote: 舱壁是雪白的，像没有瞳仁的眼球
sensory_mapping: 一排白色球体在廊道两边睁开、中心没有黑瞳、空眼随章北海移动而向后滑去
context_fact: 章北海离开睡眠舱，发现走廊无人、所有同形球舱门都开启，信息系统似乎刚初始化。
image_mechanism: 建筑几何被身体化为残缺感官，圆形、白色和空心共同把洁净空间变成无回应的凝视。
property_alignment: 1）球形空间对应眼球弧面；2）白色材料对应巩膜；3）开口对应眼裂；4）空白中心对应瞳仁缺失。
context_alignment: 章北海刚失去父亲目光，眼前遍布不能观看的空眼，环境与内心的‘目光消失’紧密呼应。
narrative_function: 把无人舰内的洁净转成轻微诡异感，引出魔方世界与全息重复的自由联想。
transfer_rule: 球形空间作眼睛时，应匹配球面、色块、中心结构和观看功能的有无，使形态与情绪同时成立。
failure_boundary: 舱室没有生物组织或视觉能力，开门也不等于睁眼；相似只基于形状、颜色与空洞感。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 廊道两侧敞开的球形舱室通体雪白、内部空无一人，也没有开启的信息界面
vehicle: 失去瞳仁的眼球只剩白色球体，空洞地朝外敞开却不能聚焦、观看或回应
ground: 1）球舱对应眼球；2）雪白舱壁对应眼白；3）无信息窗口对应无瞳仁；4）空室对应失去视觉；5）排列舱门对应多眼凝视。
