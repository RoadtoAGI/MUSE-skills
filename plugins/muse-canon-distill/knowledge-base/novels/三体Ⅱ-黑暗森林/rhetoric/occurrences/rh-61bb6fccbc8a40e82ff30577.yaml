chapter: 正文
figure_type: analogy
quote: 感到自己是飞行在层峦叠障的群山之上，每一道山脉就是一艘停泊的太空战舰
sensory_mapping: 钢铁峰峦铺满下方、艇从山脊上飞过、群山在月光中沉睡、引擎白日升起
context_fact: 亚洲舰队大部战舰集中木星背阴面，两艘入港军舰的聚变发动机先后照亮整个港区。
image_mechanism: 舰艇尺度超出熟悉物件后被地形化，静泊编队成为地貌；随后发动机白光又把入港动作改写成两次日出。
property_alignment: 1）恒星战舰对应山脉；2）军港编队对应群山；3）舰体轮廓对应山峰山脊；4）停泊对应沉睡；5）木星背阴面对应夜山；6）聚变尾焰对应日轮；7）舰队阴影对应群山投影。
context_alignment: 章北海第一次近看梦想中的舰队，只有地理尺度能承载其震撼；引擎真能发出太阳级强光，使延展毫不松脱。
narrative_function: 把军港写成可敬畏的钢铁自然，为‘自然选择’号成为精神家园和逃亡载体建立体量。
transfer_rule: 巨型载具群作地貌时，应同时利用尺度、排列、静止与光影，并让后续运动生成地貌框架内的新现象。
failure_boundary: 战舰可机动且由人工系统组成，不具有山脉地质连续性；静止雄伟也不能代表战力不可摧毁。
