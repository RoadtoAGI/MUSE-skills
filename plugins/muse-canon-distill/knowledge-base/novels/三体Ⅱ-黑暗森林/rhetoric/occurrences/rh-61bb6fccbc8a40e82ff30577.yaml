tenor: 交通艇从高处掠过木星军港中密集排列、体积庞大且彼此绵延的四百多艘恒星战舰
vehicle: 飞行器越过连绵群山，每条山脉巨大、静止、层层遮叠，在日出前沉睡于暗色地表
ground: 1）单艘战舰对应山脉；2）舰体巨大对应山体；3）密集泊位对应层峦；4）钢铁外壳对应岩峰；5）待命静止对应沉睡；6）引擎入港光对应群山日出；7）交通艇对应高空飞行者。
