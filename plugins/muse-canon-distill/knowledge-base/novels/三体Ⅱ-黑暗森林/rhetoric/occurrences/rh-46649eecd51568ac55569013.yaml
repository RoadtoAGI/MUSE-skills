chapter: 正文
figure_type: simile
quote: 那笑容像是长在他脸上似的，从不消退
sensory_mapping: 面部附着、组织生长、静止弧线、不可摘除
context_fact: 凶手被押进病房面对刚遭他枪击的罗辑，仍保持淡淡微笑。
image_mechanism: 本应短暂的肌肉表情获得根系和组织，固定在脸上，礼貌面具因此显得比皮肤更难剥离。
property_alignment: 1）恒常笑意对应多年生长物；2）面孔对应生长基底；3）不可消退对应扎根；4）人格特征对应器官。
context_alignment: 刺杀者在受押和道歉时都不撤笑，生长意象准确表现其信仰化、非情境性的平静。
narrative_function: 给凶手建立令人不安的视觉标记，并为“对面壁者的笑”母题准备第一种形态。
transfer_rule: 把表情写成生长物时，应由持续时间、附着位置和对环境反应迟钝共同支撑，而非只因表情明显。
failure_boundary: 笑容仍是主动或训练出的表情，不是真正生理器官；若人物情绪变化频繁，“长在脸上”会抹去细微变化。
quality_assessment: exemplary
