chapter: 正文
figure_type: simile
quote: 他能够像鱼一样自由呼吸了
sensory_mapping: 清凉液体灌肺、身体悬浮、呼吸从气态切成液态、人化作舱中游鱼
context_fact: 自然选择号进入前进四前全舱灌入深海加速液，章北海克服咳嗽反射并确认自己仍能呼吸。
image_mechanism: 最反常的液体入肺被水生动物经验正常化，人体在一口成功呼吸后短暂跨入鱼类生存方式。
property_alignment: 1）章北海对应鱼；2）舱内液体对应水域；3）富氧液对应溶氧水；4）液体呼吸对应鱼类取氧；5）失重悬浮对应游动；6）耐高压对应水生适应。
context_alignment: 他刚回忆海军深潜并称海洋是太空缩影，鱼类喻体把旧海洋经验自然接入星舰加速技术。
narrative_function: 把可能引发窒息恐惧的灌液过程转成适应性奇观，并确认战舰已越过最后的加速门槛。
transfer_rule: 人在异介质中作鱼时，应落实供氧方式、身体悬浮和介质适应，先写本能排斥再写功能建立。
failure_boundary: 人仍靠技术液体和循环系统供氧，没有鳃也不能在普通水中呼吸；自由只限受控舱室。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 章北海的肺和脏器充满富氧深海加速液后，可以在液体中持续获得氧气而不再窒息
vehicle: 鱼用适应水环境的呼吸系统从周围液体取得氧，在水中长期活动而无需浮出水面
ground: 1）章北海对应鱼；2）加速液对应水；3）液体供氧对应水中取氧；4）肺部充液对应水生呼吸；5）无窒息对应鱼不需空气；6）悬浮姿态对应游鱼。
