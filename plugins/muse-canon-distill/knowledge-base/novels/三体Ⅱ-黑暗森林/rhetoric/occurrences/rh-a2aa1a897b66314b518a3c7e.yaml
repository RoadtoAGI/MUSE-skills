tenor: 只有三十一人、尚无舰队可指挥的初创太空军
vehicle: 以建构理论、组织学者和基础研究为首务的军事科学院
ground: 1）成员当前不执行实战对应研究机构；2）首要任务是创立战争理论对应学术建制；3）下一步吸纳学者研究人员对应科学院扩编。
