quote: 初级阶段的太空军更像一个军事科学院
sensory_mapping: 组织结构、任务流程、人员构成
context_fact: 关键航天技术由其他学科研究，太空军此时要从零建立太空战争理论体系。
image_mechanism: 把名义上的军种从舰队画面中抽离，重新摆进研究院的桌面、人员与知识生产流程，校准听众对当前职责的想象。
property_alignment: 1）无现役装备对应无实战单位；2）理论体系建设对应科研任务；3）招募学者对应科学院人员结构。
context_alignment: 军官们刚因军种比例困惑，常伟思用熟悉机构解释“现在要做什么”，直接服务组织动员。
narrative_function: 把太空军的起点定位为知识生产，凸显战争准备跨越数代、创始者看不到舰队的悲剧。
transfer_rule: 说明机构过渡期时，可用任务、产出和人员三项都相似的成熟机构校准身份，而非只比较名称。
failure_boundary: 太空军最终承担作战与指挥，科学院只适用于无装备的初级阶段；不能据此弱化其军事权力与目标。
