chapter: 正文
figure_type: simile
quote: 每幢建筑上只零星地亮着几点灯火，像一只只孤独的眼睛
sensory_mapping: 高楼沉成黑色巨脸，几扇窗像稀疏眼睛悬在雨里，远远看着独行的罗辑
context_fact: 罗辑被汽车赶下后抵达旧城边缘，夜雨中的高层建筑大多熄灯，仅有少量灯火。
image_mechanism: 建筑窗格被器官化，少量光点获得观看方向；城市人口稀疏转成眼睛之间的情感距离。
property_alignment: 1）窗形光点对应眼；2）外墙对应面部；3）亮灯对应睁眼；4）空楼间距对应孤独隔离。
context_alignment: 罗辑正遭所有人拒绝，旧城灯窗也显得各自孤立；拟眼视角让环境成为无言见证者。
narrative_function: 把城市衰败与罗辑孤独叠加，延续全书眼睛意象并引向墓碑眸光和晨空巨眼。
transfer_rule: 窗作眼时，应匹配点位、明暗、朝向和建筑整体面孔，并让疏密服务具体社会状态。
failure_boundary: 亮窗内未必有人观看，楼也没有孤独感；情绪来自罗辑在雨夜的投射。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 旧城边缘黑暗高楼上稀少、彼此隔绝的亮窗
vehicle: 黑暗面孔中分散睁着的眼睛，各自发亮、朝向雨夜，却没有同伴回应
ground: 1）亮窗对应眼睛；2）楼体黑面对应脸或暗躯；3）零星分布对应彼此孤立；4）向外发光对应凝望；5）旧城寂静对应孤独。
