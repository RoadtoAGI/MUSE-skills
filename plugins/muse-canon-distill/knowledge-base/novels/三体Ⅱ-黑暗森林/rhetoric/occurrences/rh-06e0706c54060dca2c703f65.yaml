chapter: 正文
figure_type: metaphor
quote: 这是思想者的乐园，逻辑的乐园
sensory_mapping: 清澈星点园地、复杂退场、逻辑自由行走、思想安居
context_fact: 罗辑夜间仰望星空，认为距离过滤恒星个体结构，世界比达尔文面对的生命更简洁。
image_mechanism: 黑色空间被整理成只有点与关系的园地，混沌杂草全部剪除，思想可以不被绊住地沿几何结构行走。
property_alignment: 1）星空对应乐园；2）星点数学构形对应园中秩序；3）思想者对应居者；4）复杂滤除对应无障碍。
context_alignment: 庄园伊甸园已失去灵气，罗辑转而在星空建立冷逻辑乐园，私人幸福空间被思想空间替代。
narrative_function: 标记罗辑价值中心由家庭乐园转向理论宇宙，并为发现黑暗本质制造反讽。
transfer_rule: 认知对象称乐园时，应说明它移除了哪些阻力、提供何种活动自由，并与角色先前乐园经验形成关系。
failure_boundary: 星空实际隐藏巨大未知，清晰只是远距简化；很快银河被认作荒漠和黑暗森林，乐园判断会反转。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 远距星空把文明复杂性压成参数点、因而适合进行清晰数学推演的认知对象
vehicle: 没有混沌障碍、能让思想与逻辑自由活动并获得满足的理想乐园
ground: 1）星点结构清晰对应环境整洁；2）个体复杂被滤去对应无障碍；3）可数学处理对应逻辑自由；4）罗辑获安慰对应身处乐园；5）与尘世复杂隔开对应乐园边界。
