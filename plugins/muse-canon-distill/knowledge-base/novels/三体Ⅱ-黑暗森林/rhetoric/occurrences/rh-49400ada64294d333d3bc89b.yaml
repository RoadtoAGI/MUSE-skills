quote: 按当时的趋势，未来的前景是很黑暗的
sensory_mapping: 前路熄灯、远景被黑幕吞没、方向消失、家庭站在亮处劝阻
context_fact: 章北海的妻女认为他参加增援未来特遣队等于抛下家庭，且当时普遍相信末日战争前景悲观。
image_mechanism: 时间被空间化到人物前方，预测中的失败抽走照明，使离家决定像独自走入不可见夜路。
property_alignment: 1）未来年代对应前方地带；2）胜利希望对应灯光；3）三体威胁对应黑夜；4）章北海出发对应摸黑前行；5）妻女忧虑对应看不见归路；6）信息不足对应视野受限。
context_alignment: 他正在星海全景中回忆冬夜离家，现实星光与记忆中‘黑暗前景’叠合，情感和战略语义同时成立。
narrative_function: 在章北海夺舰前补足家庭代价，说明他为何把个人归宿全部押给文明逃亡。
transfer_rule: 未来作明暗前景时，应指出照明来自何种证据、谁在前行、看不见什么，以及人物为何仍选择进入。
failure_boundary: 未来并非光学黑暗，悲观预测后来也部分改变；无光感不能证明失败必然发生。
