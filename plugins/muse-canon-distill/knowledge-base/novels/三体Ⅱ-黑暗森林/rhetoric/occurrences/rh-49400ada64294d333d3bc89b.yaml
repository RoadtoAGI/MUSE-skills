tenor: 章北海出发时，人类预期三体战争将失败，个人和文明未来缺少希望与可见出路
vehicle: 前方景物沉入无光黑夜，行路者看不见道路、目的地和潜在危险
ground: 1）未来对应前景；2）希望对应光；3）失败预期对应黑暗；4）行动路线对应道路；5）结果未知对应不可见；6）家人反对对应不愿入夜。
