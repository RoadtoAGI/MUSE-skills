chapter: 正文
figure_type: simile
quote: 这像空气中正在充满的某种刺鼻的味道一样使他难受
sensory_mapping: 嗅觉、空气浓度、刺痛、扩散
context_fact: 林格因望远镜被军方接管而幸灾乐祸，现场恰有风从发射架带来难闻气味。
image_mechanism: 表情里的敌意混入真实空气，心理判断获得浓度和刺痛，读者难以分清哪种气味更令人难受。
property_alignment: 1）恶意对应臭味；2）察觉表情对应闻到；3）气氛加重对应浓度上升；4）斐兹罗反感对应鼻腔不适。
context_alignment: 现场已有来源不明的焦味，通感不需凭空造景；它也把科学共同体内部裂痕写成共同呼吸的污染。
narrative_function: 把人物对立渗入发射环境，让壮丽场面迅速染上腐败气息。
transfer_rule: 情绪转嗅觉时，最好让场景中存在真实气味作桥，并让扩散速度或浓度对应关系恶化。
failure_boundary: 表情并不真的污染空气；没有共享空间或真实嗅觉线索时，“刺鼻”容易成为泛化厌恶词。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 斐兹罗从林格幸灾乐祸表情中感到的恶意与不适
vehicle: 随空气扩散、刺入鼻腔并令人无法回避的难闻气味
ground: 1）恶意虽无形却可察觉对应气味不可见可闻；2）情绪向周围扩散对应气体充满空间；3）令人本能排斥对应刺鼻；4）现实焦味同时存在对应心理感受借物理嗅觉落地。
