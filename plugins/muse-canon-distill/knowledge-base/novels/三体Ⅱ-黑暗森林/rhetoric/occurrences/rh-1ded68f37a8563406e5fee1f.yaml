quote: 死亡击鼓传花
sensory_mapping: 看不见的鼓点急响、银色‘花’沿舰列飞递、每个接到者立刻化成火球
context_fact: 军官在战场图像中看到小型高速发射体依次命中燃料箱，数十艘舰在谈话间被毁。
image_mechanism: 儿童游戏的轮转规则被保留，失败惩罚从表演变为死亡，使屠杀显得机械、荒诞且高速。
property_alignment: 1）舰群对应围坐人群；2）攻击体对应花；3）传递路线对应逐舰命中；4）鼓点对应爆炸节奏；5）淘汰对应舰毁。
context_alignment: 赵鑫的爆粗与俗语保持冬眠者口吻，日常游戏比现代军语更快揭示轨迹规律。
narrative_function: 用一句口语化命名锁定连锁结构，强化普通军官比高级系统更先看清战场。
transfer_rule: 循环接力作传花时，应映射传递物、参与者、节奏与落点代价，并利用游戏轻松感制造价值反差。
failure_boundary: 水滴主动选择最优目标，没有随机停鼓；战舰也不自愿参与或主动递交攻击物。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 致命攻击沿舰队队列快速从一舰转向下一舰，受击对象依次爆炸且没有时间阻断
vehicle: 击鼓传花游戏中花随鼓点在人群间快速递送，鼓声停止时持花者承受惩罚
ground: 1）水滴对应花；2）战舰对应参与者；3）高速转移对应传花；4）连续爆炸对应死亡惩罚；5）攻击节奏对应鼓点。
