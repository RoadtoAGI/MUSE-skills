context_alignment: 章北海曾建设唐号航母，眼前工地若被他看见会形成旧建设梦想与黑暗生存拆卸的悲剧对照。
narrative_function: 从互杀切换到资源回收，说明蓝色空间号如何获得八倍配件并继续远航。
transfer_rule: 大规模修拆作工地时，应配齐结构、人员、工具、材料流与施工目的，并保留原场所的伦理残留。
failure_boundary: 这里没有新建筑落成，工料来自同胞死亡舰船；工地的生产乐观不能抹去掠夺与葬礼。
