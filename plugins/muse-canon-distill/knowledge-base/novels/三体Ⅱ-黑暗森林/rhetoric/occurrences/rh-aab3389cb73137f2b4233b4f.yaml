chapter: 正文
figure_type: metaphor
quote: 在这种终极灾难面前，它就是一个陷阱
sensory_mapping: 空间深度、坠落、受困动作
context_fact: 破壁人二号向三体人解释逃亡最大障碍是“谁走谁留”，而非技术或国家争端。
image_mechanism: 让一套历史上正面的价值观在条件改变后翻转成地面机关：人类沿它前进，却在资源只能救少数时集体坠入。
property_alignment: 1）平时促进进步对应安全入口；2）末日选择触发矛盾对应机关启动；3）价值冲突难解对应深坑；4）无法形成合法名单对应跳不出去。
context_alignment: 三体人不理解人类平等观，陷阱图景用结果和动作说明“好原则为何在此造成坏结局”，符合破壁人的冷峻解释。
narrative_function: 提出逃亡主义冲突的核心模型，随后基金骗局和三位老人争吵以日常情节验证它。
transfer_rule: 把制度原则写成陷阱时，要说明原先为何有效、什么条件触发反转、困住各方的具体约束和无法退出的原因。
failure_boundary: 价值冲突并不证明平等原则本身有害；若资源可扩充或有被普遍接受的程序，陷阱的“无人能出”结论会改变。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人人平等、生命等价等价值观在决定谁能逃亡时造成的集体行动困局
vehicle: 入口由正确道路伪装、内部很深且无人能跳出的陷阱
ground: 1）价值观平时推动进步对应诱使人沿正确道路进入；2）末日名额稀缺使原则互相冲突对应机关闭合；3）无人能接受不平等选择对应所有人被困；4）多数尚未察觉对应陷阱隐蔽。
