context_fact: 破壁人已完整说出同归于尽计划，继而近距离列举雷迪亚兹利用背景、试验安排和资源估算的得失。
image_mechanism: 生死战略被降格成课堂作业，揭密者占据阅卷位置；‘娓娓’的平稳节奏反衬被评者权威被剥夺。
property_alignment: 1）破壁人对应教师；2）面壁者对应学生；3）秘密战略对应提交作业；4）破解过程对应阅卷；5）最终不可行对应作业错误。
context_alignment: 两人年龄与身份并不形成师生关系，正因破壁成功带来的知识不对称，临时角色倒置才具有羞辱力。
narrative_function: 把战略揭露转成居高临下的批改，持续刺激雷迪亚兹并为随后的暴力爆发积压屈辱。
transfer_rule: 以师生讲评表现权力反转时，应让一方掌握答案和评价标准，另一方只能听取自己作品的判决。
failure_boundary: 破壁人没有正式权威，战略也不是可凭标准答案评分的作业；雷迪亚兹仍掌握现实暴力和政治权力。
