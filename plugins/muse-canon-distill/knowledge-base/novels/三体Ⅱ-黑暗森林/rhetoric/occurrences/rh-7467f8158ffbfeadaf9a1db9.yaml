quote: 海洋是太空在地球上的缩影
sensory_mapping: 深海失去阳光、身体悬在黑水、上下边界消失、地球内部展开一片小宇宙
context_fact: 深海液灌满自然选择号后，章北海回忆海军深潜，并开始在液体中呼吸。
image_mechanism: 两个极端环境以身体经验对齐，海洋不靠外观像太空，而靠悬浮、黑暗和压力成为可训练模型。
property_alignment: 1）海洋对应太空；2）深潜对应航行；3）水中悬浮对应失重；4）海底黑暗对应星际暗域；5）承压训练对应前进四保护。
context_alignment: 章北海的海军过去、太空现在和深海加速技术在此汇合，使跨时代人物仍能用旧经验适应新装置。
narrative_function: 把夺舰技术转成章北海熟悉的海洋经验，并强化太空舰队的海军血统。
transfer_rule: 环境类比应优先共享身体机制与方向感，再补尺度关系；‘缩影’须说明哪些结构被保留。
failure_boundary: 海水有阻力和压强，太空是真空；深海与失重的受力、呼吸和温度均不相同。
quality_assessment: exemplary
