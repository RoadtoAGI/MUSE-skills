tenor: 罗辑在未主动察觉时持续处理宇宙社会学问题、显意识开始后发现思考已进行一半
vehicle: 不占据前台界面、持续消耗资源并在后台自动运行的计算机程序
ground: 1）无意识对应后台不可见；2）思考持续对应程序常驻；3）成为面壁者时启动对应任务触发；4）中途发现成果对应切回前台；5）材料反复处理对应持续运算。
