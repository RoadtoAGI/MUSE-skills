quote: 很像电脑中后台执行的程序
sensory_mapping: 后台进程、隐藏窗口、持续运算、切前台见进度
context_fact: 罗辑想起考试时先看作文题、答其他题期间会下意识构思，意识到自己九年来从未停止思考。
image_mechanism: 问题在意识界面最小化后没有关闭，而像进程驻留脑内，悄悄迭代；显意识点击窗口时进度条已走到中途。
property_alignment: 1）潜意识思考对应后台程序；2）大脑对应计算机；3）问题对应任务；4）思考成果对应运行输出。
context_alignment: 说话者以学者和当代技术经验理解心智，程序机制精确解释“未感觉却已推进”，胜过泛称酝酿。
narrative_function: 合理化罗辑从享乐骤然进入有效推演，为短期形成黑暗森林理论提供时间基础。
transfer_rule: 后台程序喻潜意识应指定启动事件、持续输入和前台唤回时的可见结果，避免只说大脑像电脑。
failure_boundary: 人脑思考不是确定性算法，后台过程可能受情绪改写且无精确进度；不能据此把灵感等同计算。
