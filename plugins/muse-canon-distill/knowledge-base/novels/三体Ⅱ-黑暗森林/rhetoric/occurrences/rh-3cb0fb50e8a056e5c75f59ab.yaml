chapter: 正文
figure_type: simile
quote: 东方接下来的话像是在梦呓
sensory_mapping: 东方声音从清醒对话滑入梦层、句子在空白眼神后断续浮出、预言般低语落到蓝西耳边
context_fact: 她刚说太空会把人变成非人，目光封闭，随后只让蓝西尽力并说很快轮到他。
image_mechanism: 清醒警告被降到睡眠语域，内容因此同时显得不受理性过滤、含混又带预兆感。
property_alignment: 1）精神失衡对应入梦；2）破碎句法对应呓语；3）内隐真相对应梦内容；4）微弱声音对应睡中低语。
context_alignment: 白色舰舱极度清醒洁净，梦呓声音制造心理现实脱轨，贴合高层从正常人向‘非人’滑移。
narrative_function: 结束咨询对话并把心理症候传染性投向蓝西，为他随后吃下‘智慧果’预告。
transfer_rule: 清醒话语作梦呓时，应落实音量、句法、意识控制和听者理解障碍，让朦胧有可听特征。
failure_boundary: 东方并未睡眠，她的话包含明确意图；梦呓相似只涉及状态与声音，不能否定其警告有效性。
quality_assessment: effective
