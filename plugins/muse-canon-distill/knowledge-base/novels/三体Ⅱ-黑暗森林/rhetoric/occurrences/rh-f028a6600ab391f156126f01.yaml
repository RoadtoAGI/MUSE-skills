chapter: 正文
figure_type: analogy
quote: 每艘都像一座小城市，而且是一个完整的生态圈，就是说像一个小地球
sensory_mapping: 尺度、空间组织、生态循环
context_fact: 史晓明向张援朝兜售逃亡基金，纠正他用神舟飞船和空间站想象未来飞船的尺度。
image_mechanism: 先把飞船从舱室放大到城市人口尺度，再从城市推进到地球生态尺度，逐层补足居住与自给两类直觉。
property_alignment: 1）飞船人口和设施对应小城市；2）封闭生态系统对应小地球；3）世代繁衍对应稳定社会与生物循环。
context_alignment: 说话对象是缺乏航天知识的退休工人，城市和地球提供直接生活经验；夸张的完整性也符合销售话术。
narrative_function: 把逃亡计划转成可购买的家园图景，同时暴露骗局如何用具体未来生活压过技术不确定性。
transfer_rule: 解释陌生载具时，可用相邻尺度递进：先对应社会组织，再对应维持生命的物质循环，并分别给出可核对条件。
failure_boundary: 城市依赖外部资源，地球也并非真正封闭；若飞船缺少长期生态循环，“小地球”会把技术愿景误说成既成事实。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 能够长期独立承载人口的逃亡世代飞船
vehicle: 设施齐全的小城市与物质循环自足的小地球
ground: 1）大量居民与分工设施对应城市；2）封闭空气、水和食物循环对应完整生态圈；3）无需外界供给、生生不息对应地球式自持生命环境。
