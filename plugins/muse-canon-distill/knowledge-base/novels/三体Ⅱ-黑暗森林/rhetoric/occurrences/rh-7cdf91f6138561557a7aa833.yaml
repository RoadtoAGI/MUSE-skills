tenor: 现代社会通过广告与文化影响思想，却以思想控制为由谴责思想钢印，希恩斯认为双方只有程度差异
vehicle: 战场上逃跑五十步的人嘲笑逃跑一百步的人胆怯，行为性质相同而距离不同
ground: 1）日常文化影响对应逃五十步；2）思想钢印对应逃百步；3）思想控制性质对应都在逃跑；4）强度差异对应步数差；5）代表谴责对应前者嘲笑后者；6）自我豁免对应忽略同类行为。
