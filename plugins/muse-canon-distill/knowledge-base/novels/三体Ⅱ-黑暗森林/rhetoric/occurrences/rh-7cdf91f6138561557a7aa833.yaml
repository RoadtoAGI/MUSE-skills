quote: 不过是五十步笑百步而已
sensory_mapping: 两人同向逃跑、距离一短一长、近者回头嘲笑、战场性质未变
context_fact: 各国代表要求封杀思想钢印，希恩斯反驳商业广告和好莱坞文化也一直影响思想。
image_mechanism: 抽象伦理双标被放回一条可量距离，双方站在同一行为轴上，只因走得远近不同而互相评判。
property_alignment: 1）广告文化对应五十步逃兵；2）思想钢印对应百步逃兵；3）控制思想对应逃跑；4）影响强度对应步数；5）道德指控对应嘲笑。
context_alignment: 希恩斯正在为强技术寻找日常先例，典故符合辩论语气，也暴露他故意压低非自愿程度差异的策略。
narrative_function: 把会场从绝对善恶拉到程度连续谱，帮助他争取自愿使用的折中方案。
transfer_rule: 用五十步百步处理双标时，应先证明两行为共享核心性质，再明确程度差是否足以改变伦理类别。
failure_boundary: 广告影响与直接绕过思考的神经干预在自主性、可逆性和强度上可能是类别差异，不能仅按步数折算。
