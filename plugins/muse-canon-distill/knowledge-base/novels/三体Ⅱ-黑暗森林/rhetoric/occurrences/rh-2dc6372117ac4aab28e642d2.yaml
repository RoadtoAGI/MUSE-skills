sensory_mapping: 刽子手温声、软索套颈、石像候刑、屠刀落下
context_fact: 破壁人从公开战略讲到真实攻击地球舰队，泰勒沉默等待；叙述最终称屠刀落下、他精神上身首异处。
image_mechanism: 对话室被改造成刑场，每一层证据把软绳收紧；最后一句揭示目标时，语言刀刃切断泰勒的面壁者身份。
property_alignment: 1）破壁人对应刽子手；2）战略分析对应行刑程序；3）泰勒沉默对应死囚待刑；4）真相揭露对应斩首；5）人格崩溃对应死亡。
context_alignment: 破壁人的旧式礼貌与残酷信息并存，恰似职业刽子手的体贴；后文连续绞索、石像、屠刀词汇完成闭环。
narrative_function: 把抽象战略识破解成持续加压的处决，展示破壁对面壁者身份和意志的毁灭。
transfer_rule: 行刑延展喻须依次安排角色、约束工具、等待姿态和终结动作，每次复现都推进阶段。
failure_boundary: 泰勒身体未被处决且仍能决定放人，死亡只指战略人格崩溃；缺少最终揭示时不可提前写“落刀”。
