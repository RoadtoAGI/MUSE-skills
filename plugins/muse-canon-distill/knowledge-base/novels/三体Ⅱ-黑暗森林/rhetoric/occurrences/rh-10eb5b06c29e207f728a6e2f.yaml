context_fact: 观测证实入侵后出现新一轮绝望、恐慌和迷茫，五年间制度与日常逐渐围绕危机重组。
image_mechanism: 抽象年代被装上承重巨轮，集体震荡成为转弯时车身的摇晃；路线一旦对准，社会又被惯性带向漫长未来。
property_alignment: 1）人类社会对应车辆；2）年代推进对应车轮转动；3）危机冲击对应颠簸；4）新秩序对应新轨道；5）不可停顿对应惯性。
context_alignment: 句子紧跟‘艰难时世开始了’，把一次消息造成的混乱写成路线切换，又以次行五年流逝证明车轮已稳定前行。
narrative_function: 压缩五年历史跃迁，使叙事从舰队确认顺畅跨到危机纪年第八年。
transfer_rule: 历史行车喻应明确旧路线、转折冲击与新路线的方向，颠簸必须对应具体制度或心理震荡。
failure_boundary: 历史没有单一驾驶者和预设轨道，不同群体可能朝相反方向运动；用车轮容易掩盖可逆选择。
