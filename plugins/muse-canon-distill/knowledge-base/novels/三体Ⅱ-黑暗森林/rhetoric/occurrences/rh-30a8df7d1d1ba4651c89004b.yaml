chapter: 正文
figure_type: simile
quote: 这笑容仿佛是从画中的奥林匹斯山投向尘世的一束光芒
sensory_mapping: 神山高处、光束下投、尘世受照、回眸骤亮
context_fact: 庄颜长时间凝神看画，几乎忘记罗辑，忽然回头向远处的他笑了一下。
image_mechanism: 空间距离被抬升为神界与尘世的高度差，笑容脱离面部成为一道下行光束，准确击中仰望者。
property_alignment: 1）庄颜对应奥林匹斯神者；2）画廊对应神山；3）罗辑对应尘世凡人；4）笑容对应投射光。
context_alignment: 四周正是希腊众神画作，罗辑又把庄颜艺术品化，奥林匹斯来自现场图像而非外加典故。
narrative_function: 强化罗辑崇拜式爱恋与双方观看距离，推动他承诺陪看一年。
transfer_rule: 神光喻笑容应建立高低位置、投射方向和被照者反应，并让神话来源存在于场景。
failure_boundary: 庄颜只是回眸示意，神圣等级完全来自罗辑投射；平等日常互动若频繁神化会削弱人物真实。
