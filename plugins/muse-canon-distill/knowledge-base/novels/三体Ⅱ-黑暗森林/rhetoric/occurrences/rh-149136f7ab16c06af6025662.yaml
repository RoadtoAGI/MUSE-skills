chapter: 正文
figure_type: simile
quote: 身后悬浮着水滴的影像，像一个超自然的银色符号
sensory_mapping: 银色水滴悬成徽记、金光人物列于前方、黑空托底、符号无声发出神秘意味
context_fact: 量子号军官在会议后仍观看水滴影像，丁仪从它映出的舰队光点转而观察舱内年轻人。
image_mechanism: 探测器被二维化为意义载体，实际功能空白使观者把未知主动填成超自然信息，而非技术威胁。
property_alignment: 1）水滴对应银符；2）镜面颜色对应银；3）水滴轮廓对应图形；4）全息悬浮对应神迹；5）技术未知对应符义未知；6）置于人物身后对应徽记/光环。
context_alignment: 段落已把军官看成神祗，水滴随之成为神殿符号；视觉构图完整暴露人类把敌方物体纳入自身神话。
narrative_function: 将探测器的无功能外观进一步神圣化，使危险从技术对象变成接受崇拜的标志。
transfer_rule: 未知物作符号时，应让外形足够简洁、语义留白、位置具有仪式性，并写出观者如何误填意义。
failure_boundary: 水滴不是超自然符号，而是有具体材料与任务的机器；银色外观不传达善恶信息。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 悬在军官身后的水滴全息像以纯银、极简、不可解释的形态支配整个舱室构图
vehicle: 宗教或神秘体系中的银色符号悬空显现，超越日常文字并暗示不可知力量与启示
ground: 1）水滴影像对应符号；2）银色镜面对应银质；3）简洁轮廓对应象形符号；4）悬浮对应超自然显现；5）意义未知对应神秘性；6）军官金辉对应仪式背景。
