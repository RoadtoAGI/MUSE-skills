tenor: 黑暗中由两点烟火代表两个文明、正在推演彼此选择的罗辑和史强
vehicle: 置身极简宇宙之外并俯察其规则的两位创造者，能让世界在思想中生成并决定其中角色行动
ground: 1）两人对应两位上帝；2）烟头模型对应被创造宇宙；3）推演规则对应制定法则；4）深思对应俯察世界；5）明灭面孔对应神在黑暗中显现。
