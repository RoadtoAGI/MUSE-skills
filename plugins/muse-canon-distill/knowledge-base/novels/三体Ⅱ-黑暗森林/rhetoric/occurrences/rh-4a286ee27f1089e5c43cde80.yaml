tenor: 破壁人贴耳低语时毫无温度、令泰勒感到死亡逼近的呼气与话语
vehicle: 没有体温的幽灵从坟墓深处吹出带腐土气息的阴风
ground: 1）呼气无热对应幽灵无体温；2）话语宣告死亡计划对应坟墓；3）贴耳风感对应阴风吹来；4）泰勒恐惧对应遇鬼寒意；5）精神处刑对应死亡来源。
