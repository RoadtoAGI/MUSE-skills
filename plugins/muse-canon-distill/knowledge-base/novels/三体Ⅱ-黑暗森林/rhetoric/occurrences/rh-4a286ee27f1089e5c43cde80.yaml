quote: 像是从幽灵那里吹来的，带着一股坟墓的味道
sensory_mapping: 冷气贴耳、墓土气味、幽灵吐息、寒意入体
context_fact: 破壁人贴近泰勒耳边揭示其舰队真正目标是地球主力舰队，泰勒已知希望破灭。
image_mechanism: 活人口中的呼吸被抽走体温，沿耳廓变成墓穴风；战略真相携带死亡气味先进入泰勒身体。
property_alignment: 1）破壁人对应幽灵；2）无热呼吸对应鬼气；3）秘密话语对应墓风；4）泰勒寒惧对应被阴气侵入。
context_alignment: 真实贴耳呼气提供触觉，谈话内容涉及杀死舰队并制造量子幽灵，幽灵喻与战略术语形成黑暗呼应。
narrative_function: 把破壁人的信息优势升级为死亡气息，为泰勒精神处决完成最后逼近。
transfer_rule: 幽灵气息喻要同时有低温触觉、死亡内容和近距离侵入，不能只靠恐怖名词。
failure_boundary: 气味与低温是泰勒主观感受，破壁人仍是活人；温暖公开讲话或无死亡关联时该喻失效。
