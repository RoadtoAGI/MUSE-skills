quote: 宇宙就是一座黑暗森林，每个文明都是带枪的猎人，像幽灵般潜行于林间
sensory_mapping: 亿万文明化作持枪影子，在无边密林屏息拨枝；坐标一亮如猎物现身，暗处枪口立即转向
context_fact: 罗辑从生存公理、有限资源、猜疑链和技术爆炸推导文明选择，并用该图景解释费米悖论与187J3X1被毁。
image_mechanism: 抽象博弈为每个条件分配可行动森林部件，隐藏、侦听、暴露、瞄准、开枪形成稳定因果场景。
property_alignment: 1）星际距离对应林间遮蔽；2）文明主体对应猎人；3）通讯信号对应脚步呼吸；4）坐标对应位置痕迹；5）光粒打击对应子弹；6）文明毁灭对应猎物被射杀。
context_alignment: 二人正坐在无光沙漠，以烟火代表星球；史强的生存经验需要可操作图景，现场黑暗直接成为理论舞台。
narrative_function: 统摄宇宙社会学推导、解释费米悖论，并生成后续坐标广播、威慑与文明隐藏的叙事规则。
transfer_rule: 延展战略喻体应为主体、环境、信息、武器、动作和后果建立固定映射，并能用这些映射推演新事件。
failure_boundary: 森林图景依赖生存公理、技术爆炸与猜疑链假设，不能单凭意象证明所有文明必然敌对；真实宇宙也可能存在合作机制。
