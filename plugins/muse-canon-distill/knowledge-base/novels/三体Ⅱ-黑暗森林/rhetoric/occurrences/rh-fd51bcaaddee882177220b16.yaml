tenor: 信息迟滞、猜疑链和技术爆炸条件下，宇宙文明隐藏自身、侦察他者并倾向先发摧毁暴露目标的生存关系
vehicle: 无光森林中彼此看不清意图的武装猎人，压低声音像幽灵潜行，一旦发现陌生生命便先开枪消除威胁
