tenor: 罗辑在大批安保人员严密包围下移动到秘书长办公室的状态
vehicle: 被锁进坚固、封闭且能够整体移动的保险箱
ground: 1）多层护卫对应坚硬箱壁；2）外人无法接近对应保险锁闭；3）罗辑是重点保护对象对应箱内贵重物；4）队伍随他移动对应活动箱体；5）视线和行动受限对应封闭。
