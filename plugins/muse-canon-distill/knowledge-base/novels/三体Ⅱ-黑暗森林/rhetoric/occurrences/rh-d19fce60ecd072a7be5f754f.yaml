chapter: 正文
figure_type: simile
quote: 简直像被装在一个活动的保险箱中
sensory_mapping: 金属壁、锁具、狭窄内腔、整体搬运
context_fact: 枪击后罗辑一路处于严密保护，前往联合国秘书长三十四层办公室。
image_mechanism: 人墙硬化成金属六面体，把罗辑从行动主体变为随箱搬运的贵重物件。
property_alignment: 1）安保人员对应箱壁和锁；2）罗辑对应保管物；3）保护等级对应防盗强度；4）行进对应箱体移动。
context_alignment: 此前担架队形已像窄坑，此处恢复行动后保护仍未松开；保险箱突出安全与失去自由同时发生。
narrative_function: 把面壁者特权的代价具体化：世界把他视为无价资产，也开始取消其普通人的空间。
transfer_rule: 容器比喻写保护时，应同时呈现壁、锁、被保护物和移动权，让安全与自主性的交换可见。
failure_boundary: 保险箱内物体没有意志，罗辑仍能说话选择；若只强调关押而忽略真实刺杀风险，会失衡。
quality_assessment: exemplary
