chapter: 正文
figure_type: simile
quote: 庄颜的长发和白裙在金色的阳光中飘动，像一个从天空俯视地面的天使
sensory_mapping: 庄颜的白裙和长发在头顶金光里展开，镜像脱离地面，像天使从卷起的天空回望罗辑
context_fact: 夕阳照进天线下方，镜面不失真地映出庄颜；她与罗辑带孩子在草地上触摸天线。
image_mechanism: 反重力镜面改变影像方位，把地面妻子抬到天空；服色、飘动和金光顺势完成天使化。
property_alignment: 1）庄颜镜像对应天使形体；2）白裙对应羽衣；3）镜面上方对应天界；4）夕照对应光环；5）俯映视角对应向下凝望。
context_alignment: 罗辑初见想象中的庄颜时也带理想化色彩，尾声天使意象由真实光学条件生成，显示她已从想象回到家庭。
narrative_function: 在全书结束前给庄颜最后一幅高位肖像，把爱情、天空镜面和和平设施合并。
transfer_rule: 人物作天使时，应让服色、悬空位置、光线、姿态和观看方向共同成立，并由场景装置提供高位。
failure_boundary: 庄颜是站在地面的普通人，天使位置来自镜像；喻体不赋予超自然身份或道德完美。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 镜面天线上方映出的庄颜，白裙长发在夕阳中飘动，影像位于罗辑头顶并向下朝地面
vehicle: 身着白衣、悬在金色天光中的天使，从天空高处温柔俯望人间
ground: 1）白裙对应天使白衣；2）长发飘动对应悬空飞行；3）镜中高位对应天空；4）金色夕阳对应神圣光晕；5）向下影像对应俯视。
