chapter: 正文
figure_type: simile
quote: 人们同时紧张起来，像中了魔咒似的僵在那里，只有他们的眼睛越来越亮
sensory_mapping: 群体定格、身体冻结、亮眼、无声咒效
context_fact: 专家排除镜面划痕后，懒散疲惫的人们围住屏幕，突然紧张并沉默。
image_mechanism: 屏幕上的暗痕成为无声咒符，信息在同一秒锁住所有人的肌肉，只允许认知兴奋从眼睛透光。
property_alignment: 1）图像异常对应魔咒；2）工作人员对应中咒者；3）僵立对应定身；4）亮眼对应咒下意识活跃。
context_alignment: 集体由懒散到静止的同步性超出普通专注，魔咒准确命名无法解释但已被证据吸住的状态。
narrative_function: 标记发现从仪器瑕疵转为重大天文证据，暂停动作以积蓄确认爆发。
transfer_rule: 群体魔咒喻要有同一触发物、同步身体停止和仍活动的单一感官，三者共同呈现控制力。
failure_boundary: 众人自愿专注且很快兴奋行动，没有超自然控制；若反应各异或持续交谈，“同中魔咒”不成立。
