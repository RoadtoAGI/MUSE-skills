tenor: 控制室众人意识到异常图像可能是舰队尾迹后集体停止动作、凝视而兴奋的状态
vehicle: 被同一道定身魔咒击中、身体冻结但意识被点亮的一群人
ground: 1）多人同时停住对应群体中咒；2）身体僵硬对应定身；3）异常图像对应咒语触发；4）眼睛变亮对应意识兴奋；5）沉默对应发不出声音。
