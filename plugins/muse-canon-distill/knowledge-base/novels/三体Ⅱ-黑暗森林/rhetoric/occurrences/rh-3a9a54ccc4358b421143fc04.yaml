tenor: 沿井上宏一面颊流下的雨水及其呈现的悲痛外观
vehicle: 因哀伤从眼中流下、沿脸颊成线的眼泪
ground: 1）液体沿脸流对应泪痕；2）头发和面颊湿透对应哭泣外观；3）反对必死使命的痛苦对应泪水情绪；4）本人克制无哭声对应雨替他流泪。
