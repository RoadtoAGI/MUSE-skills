chapter: 正文
figure_type: simile
quote: 雨水在他的脸上像泪水似的
sensory_mapping: 面颊水线、湿发、冷雨、无声哭泣
context_fact: 井上首次正面面对泰勒，引用人的权利高于国家兴亡，拒绝政府要求必死使命。
image_mechanism: 天空把他压住的悲痛外化，雨从眼侧借道流下，使未哭的人拥有泪脸。
property_alignment: 1）雨滴对应眼泪；2）脸颊对应泪道；3）伦理悲痛对应哭因；4）沉默克制对应无声泪。
context_alignment: 日本官员站在特攻队纪念馆拒绝复活牺牲制度，环境水迹与历史哀悼自然重合。
narrative_function: 避免直接写人物哭泣仍传达沉痛，使其拒绝不显得纯粹冷酷。
transfer_rule: 雨作泪应让水迹路径、人物压抑情绪和场所记忆同时支持，保留“像”以免越权断言。
failure_boundary: 井上可能只是淋雨，文本未确认真实哭泣；不能据此推断其私人创伤。
quality_assessment: exemplary
