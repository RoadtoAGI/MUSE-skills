quote: 直线排列的战舰队列就像一根被点燃的长达二千公里的导火索
sensory_mapping: 两千公里舰列缩成细索、亮点沿索疾走、巨舰逐段燃起、身后留下暗红灰线
context_fact: 水滴十秒内连续击穿十二舰，并继续沿第二队列攻击，受创战舰先红炽再爆炸。
image_mechanism: 宏大舰阵被降维为一条可燃细线，水滴运动与延迟爆炸组成清晰的点火—燃烧—灰烬链。
property_alignment: 1）队列轴线对应索线；2）燃料舱对应可燃药芯；3）穿透时刻对应点火；4）爆炸传播对应火头推进；5）熔融残骸对应灰。
context_alignment: 直线密集阵形曾象征力量，此刻正好满足导火索结构，战术秩序转成自毁条件。
narrative_function: 用单向燃烧图像压缩十二次爆炸，显出水滴把舰队编组反用于屠杀。
transfer_rule: 连锁毁灭作导火索时，应让对象串联、触发沿线推进、反应有延迟并留下连续残迹。
failure_boundary: 战舰间没有物质引线，爆炸不会自动相传；真正触发者是逐舰转向穿透的水滴。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴沿直线依次穿透第二队列，战舰的核聚变爆炸紧随其轨迹连续发生并留下暗红残骸带
vehicle: 一根极长导火索从点火端向前燃烧，火头沿线快速推进，经过处只剩发暗灰烬
ground: 1）战舰直列对应导火索；2）水滴前进对应火头；3）逐舰核爆对应连续燃烧；4）残骸带对应灰烬。
