quote: 就像坐一趟长途卧铺车似的
sensory_mapping: 卧铺车厢、平稳长途、窗外标度后退、躺卧等待
context_fact: 老人观看太空电梯试运行，讨论太空旅行即将平民化并考虑宇宙葬。
image_mechanism: 垂直天梯被横放成铁路，运载舱变成长途车厢；宏大升空取消火箭冲击，只剩旅客在铺位上等待到站。
property_alignment: 1）运载舱对应卧铺车；2）导轨对应铁路；3）上轨旅行对应长途行车；4）低加速对应乘坐平稳。
context_alignment: 发言者用本代老人熟悉的旅行方式消解太空神秘感，恰好服务“平民化”主题。
narrative_function: 把航天从英雄冒险降为日常交通，衔接老人规划死后宇宙旅行的生活化谈话。
transfer_rule: 新交通类比旧交通应对齐时长、加速度、舱内姿态和轨道约束，让陌生体验可预演。
failure_boundary: 太空电梯仍有密闭、辐射和高度风险，不能等同普通铁路安全；高速火箭段不适用卧铺平稳感。
