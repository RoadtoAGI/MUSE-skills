tenor: 星舰社会刚脱离地球建立，制度、伦理和历史记录都处于尚未定型的最初阶段
vehicle: 太阳将升未升的清晨，黑夜开始退去，微光预告全新一天却尚不能照清世界
ground: 1）第二文明对应新一天；2）创立时刻对应拂晓；3）旧地球文明对应前夜；4）初步制度对应微光；5）未来历史对应白昼。
