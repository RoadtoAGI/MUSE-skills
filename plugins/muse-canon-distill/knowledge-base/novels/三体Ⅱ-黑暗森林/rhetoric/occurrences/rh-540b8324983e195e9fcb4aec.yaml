quote: 无际的太空就这样在它黑暗的怀抱中哺育出了黑暗的新人类
sensory_mapping: 黑暗宇宙张开巨大怀抱、五舰像幼体被包在其中、冷酷规则一口口喂入、幸存者长成同色新人类
context_fact: 星舰地球与青铜时代两组飞船几乎同时互杀，只有先发或防御成功的舰只存活。
image_mechanism: 环境选择从外部压力转为母性养育，‘黑暗’既是可见背景又成为伦理营养和后代属性。
property_alignment: 1）宇宙空间对应母体；2）持续包围对应怀抱；3）生存规则对应养分；4）舰员对应婴儿；5）黑暗伦理对应继承特征。
context_alignment: 承接阵痛、出生、婴儿期框架，同时把母体从地球换成太空，标志精神脐带真正改接。
narrative_function: 以一句总结两地同步黑暗战役，将个别选择提升为环境塑造的人类新阶段。
transfer_rule: 环境塑造群体作母体哺育时，应明确怀抱范围、所喂规则、成长阶段和继承属性，并警惕自然化责任。
failure_boundary: 太空没有意志或养育目的，互杀由具体人物与制度选择完成；‘新人类’仍保留旧道德记忆。
