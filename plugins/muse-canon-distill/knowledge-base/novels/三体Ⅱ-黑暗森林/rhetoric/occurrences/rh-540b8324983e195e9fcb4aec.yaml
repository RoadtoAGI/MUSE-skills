tenor: 与地球断联、资源稀缺且互相猜疑的太空环境迫使幸存舰员形成接受先发互杀的新伦理
vehicle: 黑暗母体以怀抱包围幼体，用乳汁和环境养育，使新生命获得与母体相同的气质并成长
ground: 1）太空对应母亲；2）无际包围对应怀抱；3）资源与猜疑规则对应乳汁/教养；4）星舰幸存者对应孩子；5）新伦理对应被养成的黑暗性。
