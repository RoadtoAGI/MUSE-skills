quote: 几乎相当于以同样的速度撞上一堵铁墙
sensory_mapping: 高速物体撞上无形铁墙、航线骤折、内部金属被冲击压平、计算机因而把实体判成幻影
context_fact: 水滴在距舰阵一角处以31.7公里每秒锐转且不减速，监测系统认为有质量物体不可能做到。
image_mechanism: 连续转向被重写为一次碰墙，使难以感知的过载获得撞击触觉，并暴露计算机错误先验。
property_alignment: 1）转向惯性对应前冲；2）未知驱动力对应铁墙反力；3）航迹折角对应碰撞后改向；4）内部载荷对应被压物。
context_alignment: 舰队刚把水滴当碎片，铁墙类比准确说明为何系统宁愿否定实体，也不接受超技术驱动。
narrative_function: 解释警报被降级的技术逻辑，让算法失误来自合理物理模型而非简单愚蠢。
transfer_rule: 极端转向作撞墙时，应给出速度、改向时间、承压部件和模型判据，使类比承担因果推理。
failure_boundary: 水滴没有真的接触墙体，驱动可能以不同方式作用于整体；普通航行器损毁结论不能套给它。
