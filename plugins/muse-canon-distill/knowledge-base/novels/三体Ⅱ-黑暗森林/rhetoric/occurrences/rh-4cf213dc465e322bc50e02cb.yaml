tenor: 有质量航行器以两倍第三宇宙速度不减速完成三十度锐角转向，承受极端横向加速度
vehicle: 高速物体正面撞上刚性铁墙，速度方向在极短时间被强制改变，产生毁灭性冲击
ground: 1）锐角改向对应撞墙折返；2）极短转向时间对应瞬时碰撞；3）横向过载对应冲击力；4）航行器损毁对应撞击压扁。
