chapter: 正文
figure_type: metaphor
quote: 一根无形的弦在悄悄绷紧，已经到了断裂的边缘
sensory_mapping: 五艘舰之间牵起看不见的细弦、猜疑从两端持续拉扯、弦音升高、纤维只差一线便崩断
context_fact: 高层已逐渐意识到燃料不足和互杀选择，终极规律号舰长两天后自杀，决斗即将爆发。
image_mechanism: 分散心理压力被集中为单一承力物，时间推进对应张力增加，爆发阈值因此可感。
property_alignment: 1）舰队互信对应弦完整；2）双方恐惧对应反向拉力；3）时间流逝对应持续加张；4）临界猜疑对应断裂极限；5）开火对应断裂。
context_alignment: 后文直接复指‘那根弦’，本处是框架首现；先建卡能把决斗段的倒计时结构统一起来。
narrative_function: 把尚未说出口的黑暗决策转成临界物理状态，为两天后的先发攻击建立必然压力。
transfer_rule: 冲突作绷弦时，应明确两端力量、材料极限、增长节奏和断裂后的具体释放，首处覆盖后续复指。
failure_boundary: 舰间关系没有单一机械阈值，沟通或资源发现可能缓解张力；冲突也非必然同时爆发。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 五舰间因资源不足和互不信任形成的紧张持续积累，任何一方行动都可能触发互相攻击
vehicle: 弦被两端不断拉紧，张力接近材料极限，外表细微变化却可能在瞬间断裂并释放能量
ground: 1）舰间关系对应弦；2）猜疑对应拉力；3）资源死局对应固定两端；4）紧张累积对应绷紧；5）先发攻击对应断弦；6）冲突爆发对应能量释放。
