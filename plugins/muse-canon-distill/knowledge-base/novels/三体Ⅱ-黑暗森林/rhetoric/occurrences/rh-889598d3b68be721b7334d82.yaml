context_fact: 惠子比冬眠中的希恩斯多经历八年后重新观察他，又回想首批钢印者的眼睛，最终识破负向思想钢印战略。
image_mechanism: 非语言表情被编码为可阅读文本，成长提供解码能力，一次眼神识别便使多年零散观察连成完整答案。
property_alignment: 1）眼睛表现对应字形；2）失败信念对应文本含义；3）惠子观察对应阅读；4）八年成长对应学习语言；5）相似目光对应重复词句；6）战略真相对应全文主旨。
context_alignment: 思想钢印本就把命题写入大脑，‘读懂目光’让机器写入的信息从眼睛泄露，技术主题与人物观察紧密扣合。
narrative_function: 压缩破壁人的漫长推理过程，证明她的突破来自跨时经验差而非突然获得外部情报。
transfer_rule: 把表情写成文本时，应交代可重复的视觉符号、解码经验和读出内容，避免仅把直觉称为阅读。
failure_boundary: 目光没有固定语法，同一神情可由多种情绪造成；惠子的解释仍需技术事实验证。
