context_fact: 二人第二次尝试用表情传意，长久相互凝视，罗辑从克制笑意转入情感失控。
image_mechanism: 目光获得一根伸入胸腔的手指，轻触早已绷紧的情感弦线；一次视觉接触转成持续听觉共振。
property_alignment: 1）庄颜目光对应拨弦手指；2）罗辑心灵对应琴体；3）情感敏感点对应琴弦；4）爱情激荡对应共鸣。
context_alignment: 二人正在验证无声表情语言，视觉目光转成听觉音乐，证明非言语信息确能在罗辑内部产生复杂响应。
narrative_function: 从游戏笑场切换到爱情高潮，并为后续堤坝破裂提供最初微小触发。
transfer_rule: 心弦喻应明确谁拨、哪种刺激触弦、振动如何扩展，并让后续情绪形成可感共鸣。
failure_boundary: 目光不会直接操控他人情绪，罗辑的反应受自身投射影响；麻木或敌意凝视不适用悦耳拨弦。
