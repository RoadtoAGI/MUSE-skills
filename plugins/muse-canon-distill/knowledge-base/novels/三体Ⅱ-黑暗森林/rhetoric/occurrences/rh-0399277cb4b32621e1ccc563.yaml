quote: 光柱中有无数亮点在舞蹈
sensory_mapping: 光束舞台、亮点浮身、缓慢旋转、群舞闪烁
context_fact: 阳光射入刚进入轨道的空天飞机，尘埃因失重升起，章北海第一次观察这种舱内景象。
image_mechanism: 狭长阳光划出一方舞台，平时落地的灰尘获得身体与失重自由，在黑暗背景前以闪点群舞。
property_alignment: 1）尘粒对应舞者；2）阳光对应聚光灯；3）漂浮轨迹对应舞步；4）失重对应舞台规则改变。
context_alignment: 前文宏原子也跳永恒之舞，此处舞者换成最普通尘埃，显示太空环境把日常物质重新编排。
narrative_function: 在发动机轰鸣后插入轻盈静景，让首次入轨的陌生感以细小视觉奇观落地。
transfer_rule: 微粒作舞者应有可见光源、连续轨迹和姿态变化；仅静止闪亮的尘点缺少舞步。
failure_boundary: 尘埃运动由惯性和气流驱动，没有节拍或意图；污染严重到遮光时，美化为舞蹈会失真。
