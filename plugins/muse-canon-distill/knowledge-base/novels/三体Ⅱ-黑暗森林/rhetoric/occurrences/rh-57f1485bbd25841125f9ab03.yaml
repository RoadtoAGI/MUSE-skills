chapter: 正文
figure_type: metaphor
quote: 一知道在哪儿，世界好像就变小了
sensory_mapping: 地图收拢、边界逼近、远方缩短、空间压缩
context_fact: 庄颜从机场一路因雾和夜看不清位置，罗辑要打电话查询，她却愿意保持不知道。
image_mechanism: 一个地名像手掌合拢地图，把雾后可能延伸的无数远方挤进可标记的一点，认知限定呈现为空间压缩。
property_alignment: 1）未知环境对应大世界；2）地名对应收缩力；3）想象可能性对应空间尺度；4）答案确定对应边界闭合。
context_alignment: 雾、夜与陌生路程真实遮蔽地理坐标，庄颜的孩子气和审美敏感使保留辽阔想象符合人物声音。
narrative_function: 显出庄颜珍视未知与想象的性格，也加深罗辑对她符合幻想的确认。
transfer_rule: “世界缩小”要绑定一项具体知识如何关闭多种可能，写清认知边界与空间尺寸的对应。
failure_boundary: 地理世界并未改变，获得定位也可能扩大行动范围；对务实、急需导航的人物，这一表达会显得矫饰。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 地点一旦被命名后，庄颜对周围未知空间的想象余地骤然缩减
vehicle: 原本辽阔无边的物理世界被压缩成一个尺寸较小的空间
ground: 1）未知带来无限可能对应世界辽阔；2）地名确定边界对应空间收缩；3）神秘感下降对应远方消失；4）认知范围变窄对应尺寸变小。
