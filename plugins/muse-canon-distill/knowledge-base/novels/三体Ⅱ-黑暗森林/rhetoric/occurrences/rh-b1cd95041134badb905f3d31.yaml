chapter: 正文
figure_type: metaphor
quote: 人类铁了心地沿着这条舒服道儿走下去，再也不打算回头了
sensory_mapping: 心脏硬化成铁、脚下铺出坦途、群体一路前行、背后的苦路被抛远
context_fact: 第二次启蒙和革命后，各国中止太空战略、恢复粮食与生活水平，公众不愿重返大低谷式动员。
image_mechanism: 复杂发展战略被空间化为道路选择，舒适度对应民生体验；心的材质变化保证旅人不受旧目标召回。
property_alignment: 1）全球社会对应行路者；2）发展模式对应道路；3）民生改善对应平坦舒适；4）政治决心对应铁心；5）二十多年恢复对应持续行进；6）旧太空战略对应回头路。
context_alignment: 讲述者以冬眠者口语概括宏观史，‘舒服道儿’平实而带轻微自嘲，符合普通幸存者对政策的身体判断。
narrative_function: 把文明从生存危机转向人文原则的制度转弯写得可走可感，并为后来重新建舰留下反转空间。
transfer_rule: 政策作道路时，应标明路面体验、转向节点、群体行者和回头代价；决心材质应与持续时间相称。
failure_boundary: 社会内部并非所有人同行，政策可再次转向；舒服不等于长期正确，铁心也可能形成僵化。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 大低谷后各国坚定选择民生优先、限制太空战略消耗的发展路线，并准备长期维持
vehicle: 旅人把心变得如铁般坚硬，踏上一条平坦舒适道路持续前行，拒绝掉头返回艰苦旧路
ground: 1）政策选择对应道路；2）民生优先对应舒服路面；3）人类社会对应旅人；4）坚定决策对应铁心；5）持续执行对应向前走；6）拒绝军国化对应不回头。
