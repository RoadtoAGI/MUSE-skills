tenor: 庄颜没有世故遮蔽、能坦率接收外界并以纯真方式表达问题的心性
vehicle: 内部无杂质的透明晶体，让入射光完整穿过并折出晶莹光线
ground: 1）心性纯真对应材质无杂质；2）外界信息对应入射阳光；3）坦率理解对应透过；4）个人感受回应对应折射；5）问题自然流出对应光路无阻。
