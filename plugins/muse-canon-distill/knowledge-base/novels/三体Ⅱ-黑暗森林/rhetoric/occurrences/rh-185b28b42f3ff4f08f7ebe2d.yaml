quote: 是梦之海中跃出的一只镜面海豚
sensory_mapping: 黑色梦海裂开、银色海豚跃起、光沿无缝身体滑过、动作凝在空中
context_fact: 全球观众试图描述水滴超出所有人工曲面的美，逐步把它从机器升为自然与爱的象征。
image_mechanism: 静止探测器借海豚跃姿获得生命、智能和友善联想，镜面反光则把动物皮肤理想化为无瑕银面。
property_alignment: 1）探测器对应海豚；2）曲面对应流线躯体；3）尖尾对应尾部；4）银光对应湿皮反光；5）悬浮对应跃起定格；6）宇宙对应梦海。
context_alignment: 水滴名称已提供水域，海豚又是人类文化中友善聪慧动物，恰好暴露人类把美与善绑定的投射。
narrative_function: 给直接接触欲望增加生物亲和力，使军事警惕进一步被审美取消。
transfer_rule: 机器作海豚时，应对齐具体流线、反光、姿态与文化情感，并检查友善属性是否有证据。
failure_boundary: 水滴没有生命、情绪或亲和行为，不会游泳跃海；海豚善意不能转移给探测器。
