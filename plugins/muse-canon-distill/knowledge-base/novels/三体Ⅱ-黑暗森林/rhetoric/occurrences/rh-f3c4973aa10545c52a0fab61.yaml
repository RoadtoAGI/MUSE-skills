tenor: 庄颜在空旷展厅中落脚极轻、几乎不发出回声的行走方式
vehicle: 猫用肉垫谨慎落地、悄无声息穿过室内
ground: 1）轻步对应肉垫落地；2）无回声对应猫行无声；3）谨慎动作对应潜行；4）身体柔和对应猫的轻捷。
