chapter: 正文
figure_type: simile
quote: 庄颜在轻轻地走路，猫一样无声
sensory_mapping: 肉垫落地、无声潜行、轻捷步态、回声消失
context_fact: 二百米长展厅空旷，罗辑只听见自己的脚步声，庄颜担心惊动沉睡之物。
image_mechanism: 她的鞋底被换成柔软肉垫，脚步声在触地前被吸收，使长厅只回放罗辑一人的响动。
property_alignment: 1）庄颜对应猫；2）鞋底对应肉垫；3）轻走对应潜行；4）无回声对应猫步无声。
context_alignment: 空旷空间会放大任何声响，因此她竟无声的反差可核；猫的谨慎又贴合她对艺术殿堂的敬畏。
narrative_function: 刻画庄颜进入卢浮宫后的虔敬，并让罗辑在声音上与她拉开距离。
transfer_rule: 猫步喻应让环境本来容易出声，再以落脚、姿态和目的解释人物为何静默。
failure_boundary: 无声不代表庄颜狡猾或捕猎；急跑、重鞋或拥挤环境不适用肉垫式动作。
