tenor: 智子对每个人最私密日常也能持续监视并传回信息的事实
vehicle: 对他人隐私抱着浓厚兴趣、细细欣赏并做记录的窥视者
ground: 1）智子持续观测对应窥视；2）性爱场面对应隐私对象；3）信息传回对应记录；4）无孔不入对应贴身旁观；5）“津津有味”对应把冷监控人格化为享受。
