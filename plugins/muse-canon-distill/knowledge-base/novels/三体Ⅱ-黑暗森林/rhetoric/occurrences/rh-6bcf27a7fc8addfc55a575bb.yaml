context_fact: 航天指令长要求丁仪保留太空旅行尊严，丁仪以智子连性生活都能看见反驳全人类已无尊严。
image_mechanism: 微观监视粒子坐上观众席，原本无情的数据采集长出窥私欲，把看不见的暴露变成有人盯着欣赏。
property_alignment: 1）智子对应窥视者；2）人类私生活对应节目；3）探测对应观看；4）数据保存对应记录；5）全面暴露对应无帘舞台。
context_alignment: 丁仪惯用尖刻冒犯拆穿宏大词汇，“津津有味”故意把敌方技术降成猥亵观看，符合其声音。
narrative_function: 用最私人例子重申智子监控，使抽象文明危机落到身体羞耻与尊严。
transfer_rule: 监控人格化时，应选一个具体隐私场景，并区分系统确能采集的信息与说话者赋予它的恶意兴趣。
failure_boundary: 三体人未必对人类性爱感兴趣，“津津有味”是丁仪讽刺；不能据此推断敌方心理。
