quote: 世界确实已经面目全非了
sensory_mapping: 熟悉面孔转过来、五官移位、表情陌生、旧识者辨认失败
context_fact: 罗辑只听到少量国界变化便质疑世界并未大变，乔纳森强调真正变化在国家之外崛起的独立太空舰队。
image_mechanism: 庞杂制度被收束成可辨识的脸，深层结构变化于是表现为旧人迎面相见却认不出。
property_alignment: 1）全球秩序对应脸；2）国家体系对应原五官；3）舰队国际对应新五官；4）社会价值对应神态；5）二百年演变对应改貌过程；6）罗辑惊讶对应辨认受阻。
context_alignment: 同一成语由罗辑泛说、乔纳森重说，后者把表面国界与真正权力重排区分开，重复获得校正意味。
narrative_function: 用熟悉成语制造认知争夺，推动乔纳森揭示地球国际与舰队国际的双重政治格局。
transfer_rule: 整体系统作面孔时，应把可见表层与决定身份的结构特征分开，让‘认不出’对应具体制度变化。
failure_boundary: 世界没有单一面孔，许多国家制度仍延续；成语不能说明哪些变化更重要或价值更好。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 两个世纪后的世界在国家权力结构、社会制度和生活形态上发生了根本变化，已难凭旧经验识别
vehicle: 一个人的整张面孔被彻底改变，原有五官和表情不复可认
ground: 1）世界整体对应面孔；2）制度结构对应五官；3）社会气质对应表情；4）历史变化对应毁容改貌；5）旧时代观察者对应辨认者；6）无法理解对应认不出脸。
