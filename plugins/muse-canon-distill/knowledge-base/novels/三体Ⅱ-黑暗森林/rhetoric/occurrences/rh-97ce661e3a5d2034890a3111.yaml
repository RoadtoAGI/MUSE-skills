chapter: 正文
figure_type: metaphor
quote: 时间，它像一把利刃，无声地切开了坚硬和柔软的一切
sensory_mapping: 无声刀锋、直线推进、万物裂开、切口留在身后
context_fact: 雷迪亚兹死后，叙述跨越近两个世纪，依次交代黄金时代众人的衰老、死亡、冬眠和历史消散。
image_mechanism: 无形时间被压成只有运动和刃口的工具，它不轰鸣却在每次推进后留下生死、代际与时代的清楚断面。
property_alignment: 1）时间对应利刃；2）持续流逝对应恒定挥切；3）人物和制度对应被切材料；4）死亡与变迁对应切口；5）不可逆对应刀锋只向前。
context_alignment: 本句正位于叙事大跨度转场，随后每一人物结局都成为刀锋留下的切面，图像承担结构而非单纯感叹。
narrative_function: 用一次锋利动作开启时间蒙太奇，把众多人生结局统一到不可逆的世纪推进中。
transfer_rule: 以刀锋写时间，应让前进方向、切割对象和不可复原后果对应具体叙事转场，避免只借‘残酷’情绪。
failure_boundary: 时间没有主体意志，也并非所有变化都是破坏或瞬间断裂；利刃不能说明演化的渐进与新生。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 时间不受任何个体和制度阻挡，持续推进并使人物、时代与事物发生不可逆变化
vehicle: 刀口锋利、前进时连续剖开所遇材料而自身不因软硬差异停顿的利刃
ground: 1）时间推进对应刀刃前行；2）年代分界对应切口；3）万物改变对应材料被剖开；4）不可阻挡对应锋刃不钝；5）无声流逝对应静默切割；6）软硬皆受影响对应对象普遍性。
