quote: 细若游丝的电波穿过夜中的群山，维系着他们最后的联系
sensory_mapping: 夜山、微细亮丝、两端拉系、骤然断裂
context_fact: 罗辑在太行山篝火旁与白蓉通话，承认爱上想象女孩；白蓉说再见后挂断。
image_mechanism: 不可见电磁波被抽成一根跨山丝线，技术连接与爱情连接重合；按下挂断键时，丝在黑夜中同时断掉。
property_alignment: 1）电波对应游丝；2）手机两端对应线端；3）通话对应维系；4）情感疏离对应细弱；5）挂断对应断线。
context_alignment: 真实电波确实跨越山地，物理通信为关系隐喻提供精确载体；“最后”使线路终止与分手同步。
narrative_function: 用单一可见动作结束现实恋情，让火边幻爱与山外真人之间的距离定形。
transfer_rule: 以通信链路写关系时，应让信号路径、两端人物、链路强度和中断事件逐项同步。
failure_boundary: 无线电并非一根固定丝，挂断也不必然终结全部关系；若双方仍有多种联系渠道，单线会过度简化。
