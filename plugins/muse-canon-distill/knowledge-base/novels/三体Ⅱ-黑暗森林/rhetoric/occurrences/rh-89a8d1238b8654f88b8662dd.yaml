context_fact: 雷迪亚兹在波利瓦尔广场亲吻祖国土地、呼唤人民，却因企图毁灭太阳系即将被群众石刑。
image_mechanism: 空间位置把政治人物与头顶铜像叠成同一轮廓，活人短暂穿上民族英雄身份，随后人民的石头立刻撕破它。
property_alignment: 1）雷迪亚兹对应活波利瓦尔；2）铜像基座对应英雄舞台；3）祖国叙事对应解放事业；4）民众聚集对应人民拥戴；5）自我陶醉对应英雄身份；6）石刑对应神话反转。
context_alignment: 喻称紧邻真实波利瓦尔铜像并置于雷迪亚兹视角的欢迎幻觉中，引号保存叙述距离与反讽。
narrative_function: 把雷迪亚兹自我神话推到顶点，再用第一块石头瞬间翻转为民众审判。
transfer_rule: 人物借历史英雄身份时，应有现场位置、公共叙事和群众动作支撑，并用语气标记认同或反讽。
failure_boundary: 雷迪亚兹的政治目标与波利瓦尔不同，群众靠近也不是拥戴；称号只呈现错觉和形象叠合。
