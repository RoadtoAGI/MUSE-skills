tenor: 根据子弹弹道快速反推射手位置的精密雷达系统
vehicle: 蛇在身体低伏时仍能敏锐锁定猎物方位的眼睛
ground: 1）雷达探测对应眼睛观察；2）迅速定位射手对应蛇锁定猎物；3）装置隐蔽布设对应蛇伏藏；4）狭窄弹道信息对应敏锐感知微小运动。
