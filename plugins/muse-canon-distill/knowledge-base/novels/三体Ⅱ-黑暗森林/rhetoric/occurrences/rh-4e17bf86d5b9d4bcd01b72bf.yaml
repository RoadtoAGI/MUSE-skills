chapter: 正文
figure_type: metaphor
quote: 幸亏我们在你后面布置了蛇眼
sensory_mapping: 低伏蛇首、锐眼、弹道视线、瞬时锁定
context_fact: 罗辑遭枪击后问凶手如何落网，史强解释安保在其后部署了这种雷达。
image_mechanism: 冷硬雷达获得伏击动物的眼睛，子弹一飞过便沿轨迹反向凝视发射者，使隐藏枪手暴露。
property_alignment: 1）雷达对应蛇眼；2）子弹轨迹对应猎物运动线；3）射手对应被锁目标；4）布设对应潜伏。
context_alignment: “蛇眼”是安保人员口中的设备昵称，短促具象，符合史强不展开技术参数而先解释救命机制的语气。
narrative_function: 说明保护体系并非全然被动，也为史强团队的专业能力提供技术支点。
transfer_rule: 动物器官命名设备时，应让感知对象、反应速度、部署姿态与器官特性至少两项对应。
failure_boundary: 雷达依据弹道计算而非视觉，蛇眼的生物视野也未必是关键机制；昵称不能代替技术说明。
quality_assessment: functional
