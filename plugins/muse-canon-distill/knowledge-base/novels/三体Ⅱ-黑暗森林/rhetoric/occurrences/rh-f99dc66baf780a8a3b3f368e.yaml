figure_type: simile
quote: 将光芒像金色的大网般撒向世界
sensory_mapping: 金色网线、从高处抛撒、铺展、世界被罩
context_fact: 白沙靶场日出，叙述把同一太阳连接到红岸、首颗原子弹和远古生命。
image_mechanism: 太阳成为撒网者，放射线在空中交织成金色网面，瞬间捕获不同时代的世界。
property_alignment: 1）太阳对应撒网者；2）光束对应网线；3）地球对应被罩水域；4）日出对应抛网展开。
context_alignment: 后文跨越亿年列举所有见过该太阳的生命，大网的覆盖性把时空共同包入一张光网。
narrative_function: 放大太阳的统摄尺度，为其随后宣告一切短暂建立视觉权威。
transfer_rule: 网喻写光时，应对应射线结构、展开动作、覆盖边界及被网住对象。
failure_boundary: 光不会束缚或捕获世界，网的控制含义只服务太阳庄严；阴影区仍在网外。
