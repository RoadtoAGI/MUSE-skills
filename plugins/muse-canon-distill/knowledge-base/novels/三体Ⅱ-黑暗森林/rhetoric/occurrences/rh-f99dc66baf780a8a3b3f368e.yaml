tenor: 迅速扩大的朝阳把成束金光覆盖到广阔大地
vehicle: 一张巨大金色网被从高处抛撒、铺罩整个世界
ground: 1）放射光束对应网线；2）光覆盖地表对应网面罩下；3）太阳抛光对应撒网动作；4）金色光泽对应金网；5）范围扩张对应网张开。
