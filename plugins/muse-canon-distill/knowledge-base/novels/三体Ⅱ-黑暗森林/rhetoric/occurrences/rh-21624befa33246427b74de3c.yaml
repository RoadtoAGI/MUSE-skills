tenor: 吴岳在战争尚未开始前便失去信念、退出海军的人生与军旅
vehicle: 尚未完成便停工、首次下水就是被拖去拆毁的“唐”号航母
ground: 1）吴岳未参战对应航母未起航；2）退役对应工程终止；3）能力和生涯被弃置对应舰体拆毁；4）共同与胜利未来失联对应都在出发前结束。
