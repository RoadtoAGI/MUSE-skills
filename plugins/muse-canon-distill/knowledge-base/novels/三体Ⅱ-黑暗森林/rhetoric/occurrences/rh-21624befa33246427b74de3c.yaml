quote: 像它一样，还没起航就结束了
sensory_mapping: 停熄焊花、未启航船体、拖行、提前终点
context_fact: 父亲葬礼后，吴岳与章北海站在停工的“唐”号前；吴岳已提交退役申请并称一生结束。
image_mechanism: 人的时间线与船的航程重合，尚未驶出的港口直接变成终点，个人失败主义获得庞大船体。
property_alignment: 1）吴岳对应“唐”号；2）军旅使命对应远航；3）退役对应停工拆毁；4）未经历战争对应未出海作战。
context_alignment: 吴岳曾是舰长候选，“唐”号本应由他指挥；人物与舰体的共同夭折具有传记层面的直接对应。
narrative_function: 把个人精神崩溃与国家海军项目停摆合成一个哀悼画面，并衬托章北海仍坚持出航。
transfer_rule: 人物—载具类比要让职业关系、预定旅程、停止原因和命运结果同时对应，载具才会成为人物外化生命。
failure_boundary: 吴岳仍活着且可重建生活，“唐”号却将被物理拆毁；“一生结束”是绝望感受，不是事实结局。
quality_assessment: exemplary
