quote: 真理总沾着灰尘
sensory_mapping: 视觉、触觉、污渍
context_fact: 被骂犬儒后，罗辑以经济学的唯利是图公理辩称社会学真理可能更黑暗。
image_mechanism: 把抽象命题放进脏环境中，让发现真理成为伸手取物并沾灰的动作，以触觉不适为犬儒结论辩护。
property_alignment: 1）阴暗事实对应灰尘；2）认知不适对应被弄脏；3）事实仍坚硬存在对应灰下物体未消失。
context_alignment: 罗辑正把自己的悲观包装成敢碰脏真相，简短格言式隐喻符合其卖弄聪明、自我辩护的口吻。
narrative_function: 浓缩罗辑早期的认识论姿态：把冷酷等同深刻，为他后来发现黑暗森林既作性格准备也保留反讽。
transfer_rule: 用污渍比拟不悦真相时，应区分事实本体与附着的不适感，并说明谁因接触它付出何种心理代价。
failure_boundary: 令人不适的判断不因此自动成为真理；灰尘意象不能替代证据，也不能把反对者都归为害怕弄脏。
