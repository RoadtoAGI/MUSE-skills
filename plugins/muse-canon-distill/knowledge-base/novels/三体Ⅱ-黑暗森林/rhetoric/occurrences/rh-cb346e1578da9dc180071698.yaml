tenor: 罗辑认为令人不快、来自现实阴暗面的社会规律
vehicle: 从脏乱现场取出、表面附着灰尘的真实物件
ground: 1）真相来自不体面的行为对应物件出自尘土；2）认识真相伴随厌恶感对应触摸灰尘会弄脏；3）灰尘附着却不改变物体存在对应难听不等于不真。
