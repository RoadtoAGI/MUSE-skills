chapter: 正文
figure_type: simile
quote: 这艘巨舰仿佛是刚刚从煅炉中取出的一个大铁块
sensory_mapping: 巨舰整段由黑转红、像铁坯离炉、热色沿舰体蔓延、轮廓开始软塌
context_fact: 水滴穿舰形成圆洞后，附近舰壳因高速碰撞和推进光环高温熔化，红炽覆盖一半舰体。
image_mechanism: 复杂战舰被去设施化成单一铁坯，红热蔓延使其从机器退回原材料，毁灭成为逆向制造。
property_alignment: 1）巨舰对应铁坯；2）推进热对应炉火；3）红炽区对应高温铁面；4）舰体熔化对应可锻软化；5）太空对应炉外；6）水滴撞击对应加热过程。
context_alignment: 未来技术已把舰体造到极致，水滴却在瞬间把它还原为一块待熔金属，文明层级逆转清晰。
narrative_function: 把不可见材料失效转成锻造场景，为随后的燃料舱核爆提供颜色和温度过渡。
transfer_rule: 大型机器作炉中铁块时，应让功能结构消失、材质颜色统一、热源明确并出现软化后果。
failure_boundary: 舰体由多种材料和舱室组成，不是均质铁块；红炽也不等于传统锻造可控。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 无限边疆号被贯穿后，撞击热和推进高温迅速把半艘舰体加热至均匀红炽状态
vehicle: 整块铁在高温锻炉中烧透后刚被夹出，表里通红、边缘发亮且即将软化变形
ground: 1）战舰对应铁块；2）红炽舰壳对应烧红铁；3）撞击热对应锻炉；4）大面积升温对应烧透；5）结构软化对应可锻；6）太空黑背景对应炉外暗处。
