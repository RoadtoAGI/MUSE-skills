chapter: 正文
figure_type: simile
quote: 像在掐灭自己的后半生
sensory_mapping: 红色火星、手指碾压、烟灭、余热消失
context_fact: 史强拒绝替儿子脱罪，要求各自承担行为后果；史晓明含泪低头。
image_mechanism: 短烟头被拉长成人生时间线，床沿每一次碾压都让未来的火光缩小直至黑掉。
property_alignment: 1）烟火对应生命活力；2）剩余烟段对应后半生；3）碾灭对应刑期毁掉未来；4）烟灰对应失去的可能。
context_alignment: 父子共同抽烟却无法和解，日常动作无声承担史晓明说不出的自毁感。
narrative_function: 把判刑恐惧集中到一个手部细节，为父亲苍老离去的画面增添终结感。
transfer_rule: 以熄火写未来断裂时，应让燃料剩余量、熄灭动作和人物将失去的具体人生阶段对应。
failure_boundary: 服刑不等于人生终结，后半生仍可能重建；比喻呈现当事人绝望而非客观判决。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 史晓明面对长期刑期时反复碾灭烟头的绝望感
vehicle: 用手指压灭仍可燃烧、象征余下生命的火头
ground: 1）烟头余火对应尚未度过的后半生；2）碾压动作对应主动终止；3）入狱前景对应光亮熄灭；4）反复用力对应绝望确认。
