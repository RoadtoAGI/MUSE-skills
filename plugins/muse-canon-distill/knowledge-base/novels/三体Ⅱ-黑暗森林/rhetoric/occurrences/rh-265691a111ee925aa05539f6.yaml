chapter: 正文
figure_type: simile
quote: 目光宁静如水
sensory_mapping: 波纹止息、清水铺平、眼中杂色退去、表面沉静
context_fact: 思想钢印操作后，四名军官从门厅返回，惠子明确看见他们眼中的忧郁和迷茫消失。
image_mechanism: 不可量化的信念效果落到眼睛表面，原先扰动视线的心理波纹被抚平，剩下一层无风水面般的静定。
property_alignment: 1）目光对应水面；2）忧郁迷茫对应波纹和浑浊；3）钢印后的确定感对应平水；4）观察到的眼神变化对应水面状态变化。
context_alignment: 前后对照集中在眼睛，水面只转移可见的平静和清澈，准确承接操作前后的同一观察指标。
narrative_function: 以最短图像证明思想钢印已经改变内心，也让这种技术效果显得安宁而令人不安。
transfer_rule: 用静水写眼神，应让前态存在扰动或浑浊，再以无波、澄定表现情绪被压平的结果。
failure_boundary: 平静眼神不能证明信念真实、人格完整或长期稳定；水的柔和也不能消除强制改写思想的危险。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 四名军官接受胜利信念后，眼中忧郁迷茫消退而呈现的平静与确定
vehicle: 无风时不泛波澜、表面平缓澄定的一泓水
ground: 1）情绪平静对应水面无波；2）眼神澄定对应水体澄清；3）迷茫消失对应浑浊沉降；4）持续安定对应水面稳定。
