chapter: 正文
figure_type: metaphor
quote: 我的最大愿望就是尽快摆脱这一切
sensory_mapping: 两个世纪的责任像绳索缠在罗辑身上，威慑成立后他只想解开结扣，把沉重装置交出去
context_fact: 罗辑拒绝继续主导谈判，只提供广播系统建议，并说回去后会立刻移交摇篮系统。
image_mechanism: 抽象职责获得可触束缚和附着重量，结束公共角色成为从身体上解除连接的动作。
property_alignment: 1）公共使命对应绳索或负重；2）长期承担对应持续捆缚；3）制度移交对应解扣；4）私人愿望对应脱身后的自由。
context_alignment: 他刚把手枪移开并坐下，身体紧张解除与责任‘摆脱’同步，使惯用词仍有现场动作支撑。
narrative_function: 收束面壁者弧线，拒绝把成功后的罗辑继续塑成权力中心，并引向五年后的家庭尾声。
transfer_rule: 把责任写成束缚时，应写清它如何附着、限制什么动作、由哪次移交解开，以及人物脱身后的去向。
failure_boundary: 罗辑的生命仍关系威慑，移交也需制度完成；愿望中的‘摆脱’不等于责任即时物理脱落。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 罗辑完成威慑后希望卸下文明责任、谈判事务和面壁者身份，回到私人生活
vehicle: 被绳索、负重或纠缠物束住的人挣脱束缚，把附着物甩开后恢复自由行动
ground: 1）面壁责任对应束缚物；2）两文明事务对应缠绕；3）移交系统对应解开连接；4）回归家庭对应恢复自由。
