chapter: 正文
figure_type: simile
quote: 仍像一尊冰冷的塑像般面无表情
sensory_mapping: 人物凝固、面孔定格、冷材无温、目光撞上硬壳
context_fact: 破壁人直视并声称长期观察雷迪亚兹，后者仍不回应，迫使对方继续展开破壁陈述。
image_mechanism: 活人暂时被抽走细微动作与体温，留下一个供对手观察却无法读取内部的冷硬外壳。
property_alignment: 1）雷迪亚兹对应塑像；2）固定姿态对应静止雕塑；3）无表情对应不变面部；4）情绪不外露对应冰冷材质；5）破壁人的凝视对应观众审视。
context_alignment: 紧接前句困兽的运动形象，本句突然凝固，准确呈现他从焦躁独处切换到敌前自控的反差。
narrative_function: 延迟雷迪亚兹的反应，让破壁人的长篇揭示在一堵不可读的脸前持续积压。
transfer_rule: 人物作塑像时，应由可观察的静止、表情冻结和互动沉默支撑，并限定在特定对峙时刻。
failure_boundary: 雷迪亚兹内部仍在判断且稍后剧烈行动；塑像意象不能说明他无情感或无意识。
quality_assessment: effective
