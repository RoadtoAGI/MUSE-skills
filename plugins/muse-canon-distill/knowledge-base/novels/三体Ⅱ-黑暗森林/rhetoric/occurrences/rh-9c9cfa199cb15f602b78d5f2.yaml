review_status: reviewed
tenor: 雷迪亚兹面对破壁人直视与言语刺激时，身体静止、脸上不显任何情绪的外观
vehicle: 由冷硬材料雕成、姿态固定且面部表情永远不变的一尊塑像
ground: 1）身体静止对应雕像固定；2）面无表情对应雕刻面孔；3）情感封闭对应材质冰冷；4）承受凝视对应被观看的展品；5）不回应对应无生命沉默。
