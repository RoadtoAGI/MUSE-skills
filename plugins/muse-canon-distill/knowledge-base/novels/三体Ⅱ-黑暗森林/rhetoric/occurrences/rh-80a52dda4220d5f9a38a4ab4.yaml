chapter: 正文
figure_type: metaphor
quote: 这个从他梦中走来的天使
sensory_mapping: 梦门开启、天使步入晨光、白色身影、由虚到实
context_fact: 罗辑先虚构女孩，史强按描述找到庄颜；相处后她的声音、外貌和审美继续符合想象。
image_mechanism: 梦境边界被开成一道门，原先只在脑内的白色人物获得脚步，走进朝阳照亮的现实庄园。
property_alignment: 1）庄颜对应天使；2）想象世界对应天界或梦境；3）来到庄园对应降临；4）纯洁形象对应神圣性。
context_alignment: 此前百合、白纱、阳光和伊甸园已经组成圣洁意象链，“天使”在此汇拢而非孤立赞美。
narrative_function: 集中表现罗辑对庄颜的理想化投射，并为其幸福达到顶点定调。
transfer_rule: 天使喻要由先行的纯净色彩、救助作用或超常来历支撑，并让“降临”对应明确进入时刻。
failure_boundary: 庄颜是受安排而来的普通人，具有独立人格和未知动机；把她完全等同天使会遮蔽现实复杂性。
quality_assessment: effective
