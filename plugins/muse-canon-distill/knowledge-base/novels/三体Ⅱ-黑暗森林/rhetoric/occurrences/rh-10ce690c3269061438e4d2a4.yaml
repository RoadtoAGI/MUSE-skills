review_status: reviewed
tenor: 油画创作中稀少白色区域的使用价值与节制原则
vehicle: 昂贵稀缺、使用时需慎重权衡的黄金
ground: 1）白色在油画中稀少对应黄金稀缺；2）留白影响画面对应黄金价值高；3）不可滥用对应珍藏节制；4）关键处使用对应贵金属精准配置。
