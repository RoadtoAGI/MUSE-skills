chapter: 正文
figure_type: simile
quote: 对白色要像黄金那样珍惜
sensory_mapping: 少量白色、金块珍藏、谨慎取用、价值聚焦
context_fact: 庄颜向罗辑解释油画以浓色填满，引用大师关于白色使用的看法。
image_mechanism: 画布上的白色颜料被铸成有限金块，画家每落一笔都像从珍藏中支取贵重材料。
property_alignment: 1）白色颜料对应黄金；2）有限用量对应稀缺；3）构图作用对应价值；4）慎用原则对应珍藏。
context_alignment: 油画满色的媒介特性先建立稀缺条件，黄金不只表示美，而具体解释使用纪律。
narrative_function: 为国画大量留白的反向美学铺垫，显出庄颜的专业眼光。
transfer_rule: 珍宝喻写创作资源时，应先交代它为何稀缺，再说明一次使用会改变整体结构。
failure_boundary: 白色颜料本身并不昂贵，价值来自构图语境；在以白色为底的媒介中，黄金喻会失效。
quality_assessment: effective
