chapter: 正文
figure_type: simile
quote: 冷凝成雪花状的冰晶
sensory_mapping: 红液喷出、瞬间结晶、细片飞散、真空落雪
context_fact: 陨石弹穿透航天服，血随泄漏气体喷到外面，在太空环境中快速冷凝。
image_mechanism: 血液的颜色和生命属性被极寒迅速夺走，喷射碎滴重组成雪花外形，在无空气太空制造一场微小降雪。
property_alignment: 1）血滴冰晶对应雪花；2）真空低温对应冬空；3）泄漏气流对应飘落路径；4）结晶纹理对应雪花形状。
context_alignment: 前景暴力与地球背景粉云、镜海形成冷美学连续，雪花形态尤其把死亡伪装成自然景观。
narrative_function: 以精确而冷静的物态变化呈现中弹后果，强化章北海观察方式的非情感化。
transfer_rule: 形态比拟应抓轮廓、材质和运动至少两项，并让环境解释为何生成该形态。
failure_boundary: 血液冰晶成分、颜色和规则性与真正雪花不同；‘雪花状’只描述外观，不代表相同生成机制。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 从破损航天服喷出的血液在真空低温中迅速冻结后形成的细碎晶体形态
vehicle: 具有分枝或片状轮廓、轻小飞散的雪花
ground: 1）冻结血滴对应雪花；2）晶体分枝对应雪花纹理；3）白汽中飘散对应降雪；4）极低温对应成雪条件。
