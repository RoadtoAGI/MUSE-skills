chapter: 正文
figure_type: simile
quote: 它们的光芒使他的满头白发像燃烧起来似的
sensory_mapping: 两千太阳照来、白发边缘起焰、细光跳动、老科学家仿佛头顶燃火
context_fact: 丁仪在量子号舷窗前观看两千艘战舰的矩形编队，虽已熟悉仍被壮丽景象震慑。
image_mechanism: 外部舰队火光沿人物最易反光的白发附着，宏大能量缩到头部成为可见燃烧，也预示即将发生的毁灭。
property_alignment: 1）白发对应白焰；2）聚变光对应火源；3）反光对应燃烧亮度；4）发丝对应火舌；5）光的动态对应焰动；6）丁仪被震慑对应受热包围。
context_alignment: 舰队被称为两千小太阳，丁仪的头发像被其点燃，人物与即将检验的力量体系在同一火光中相连。
narrative_function: 以近景人物反光承接舰队远景，并在水滴灾难前给丁仪套上一圈脆弱、短暂的烈焰。
transfer_rule: 强光使毛发作燃烧时，应对齐纤维形状、焰色、边缘闪动与真实光源，并让火意象服务场景风险。
failure_boundary: 头发没有升温、烟雾或燃烧损伤，亮度完全来自外部照明；不能推断丁仪处于火场。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 联合舰队聚变发动机强光照到丁仪白发上，使发丝边缘高亮、闪动并呈现火焰般亮度
vehicle: 一头白色纤维被点燃，细长火舌沿发丝跳动并向外放射亮光
ground: 1）白发对应火焰丝；2）发动机照明对应点火；3）高亮发梢对应火舌；4）光线闪动对应燃烧跳跃；5）白色对应高温焰色；6）人物激动对应内火外显。
