chapter: 正文
figure_type: simile
quote: 我每拿到一块陨石，就像去了一个新的外星世界一样
sensory_mapping: 掌中星球、显微地貌、跨空抵达、陌生矿物
context_fact: 收藏者在南极找陨石后迷上收藏，把老宅布置为地质博物馆并珍藏火星样品。
image_mechanism: 陨石不再是从远方脱落的碎片，而展开成完整世界；放大镜下的小坑扩成地貌，手指触石等于落脚异星。
property_alignment: 1）陨石对应外星世界；2）获得样品对应抵达；3）观察表面对应勘探；4）矿物差异对应星球环境差异。
context_alignment: 说话者无法实际星际旅行，实体天外物质是最接近抵达的渠道，贴合收藏行为的情感动力。
narrative_function: 赋予陨石个人价值，与章北海只看比重和加工性的工具视角形成反差。
transfer_rule: 碎片如世界应让局部材料确实携带来源地信息，并通过观察尺度放大形成旅行体验。
failure_boundary: 一块陨石只代表来源天体的极小局部，不能还原完整生态与地貌；无明确来源时“新世界”更多是想象。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 收藏者获得并研究一块来源不同的陨石时产生的探索、抵达与新奇体验
vehicle: 亲身旅行到一颗此前未到过的外星世界，接触其独特地貌与物质
ground: 1）陨石来源天外对应外星地点；2）新样品对应新世界；3）观察矿物对应勘察地貌；4）触摸实物对应踏足当地；5）每块差异对应不同星球。
