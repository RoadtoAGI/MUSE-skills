tenor: 舰队残骸最终被太阳引力拉成长带，长期环绕太阳系外围，保存百万死者的物质痕迹
vehicle: 遭遇惨死而无法安息的亡魂脱离身体，在寒冷空寂处永远漂泊，不能归家或被埋葬
ground: 1）金属残骸对应灵魂；2）百万舰员对应百万亡魂；3）环日漂浮对应游荡；4）无法聚拢归葬对应不能安息；5）冷暗外围对应冥境。
