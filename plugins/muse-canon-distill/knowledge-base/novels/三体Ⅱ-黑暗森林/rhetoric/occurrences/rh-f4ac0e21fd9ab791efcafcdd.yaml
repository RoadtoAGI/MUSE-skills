figure_type: simile
quote: 就像那百万个不能安息的灵魂一样，永远飘浮在太阳系冷寂的外围空间
sensory_mapping: 金属云冷却成灰带、百万无形身影附着其上、长带绕日漂泊、没有坟墓也没有归途
context_fact: 舰队毁灭后金属云先膨胀再受太阳引力拉长，最终形成稀薄环日金属带。
image_mechanism: 轨道残骸获得死者精神身份，天体力学的永久运行转成无法完成葬礼的永恒漂泊。
property_alignment: 1）碎片粒子对应个体亡魂；2）金属带对应幽灵队列；3）轨道循环对应不得安息；4）太阳系外围对应冷寂冥野。
context_alignment: 前段一直以光焰美化毁灭，结尾让冷暗残骸重新指向人，完成从景观到悼亡的伦理回收。
narrative_function: 为末日之战立下太阳系尺度的墓碑，把瞬时屠杀延伸为漫长历史痕迹。
transfer_rule: 残骸作亡魂时，应连接物质数量、死者数量、持续运动和未完成仪式，使哀悼建立在可验证后果上。
failure_boundary: 金属碎片没有意识或痛苦，数量也不能逐片对应某个死者；轨道稳定不等于灵魂真实存在。
