quote: 在您布下的迷宫中挣扎，一度几乎绝望
sensory_mapping: 高墙分岔、路线回绕、探索者碰壁、中心长期隐藏
context_fact: 破壁人近十年被超级核弹表象迷惑，后来绕到雷迪亚兹任面壁者前的资料才发现科兹莫线索。
image_mechanism: 策略欺骗被转成可行走空间，面壁者不直接封门，而用大量看似合理的岔道消耗追踪者时间。
property_alignment: 1）战略伪装对应迷宫；2）表面计划对应假路；3）秘密会见资料对应隐藏通道；4）破壁调查对应寻路；5）识破计划对应抵达中心；6）多年失败对应绕行。
context_alignment: 破壁人正以教师口吻复盘自己的求解历程，迷宫既承认对手设计能力，也为‘突破口’等后续空间词提供框架。
narrative_function: 把十年信息战压缩成有方向感的困局，抬高最终破壁的难度与羞辱力度。
transfer_rule: 复杂欺骗作迷宫时，应区分设计者、假路、线索节点、死路和出口，让调查过程可追踪。
failure_boundary: 战略信息会动态变化且可多源推断，不是固定墙道；找到一条线索也未必唯一证明中心答案。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 破壁人长期被雷迪亚兹以核弹偏执和假战略方向误导，无法找到通往真实同归于尽计划的线索
vehicle: 探索者被困在设计者布置的复杂迷宫，反复走入死路、失去方向并难以抵达中心
ground: 1）虚假战略对应岔路；2）真实意图对应迷宫中心或出口；3）雷迪亚兹对应布置者；4）破壁人对应寻路者；5）十年调查对应反复摸索；6）绝望对应困在死路。
