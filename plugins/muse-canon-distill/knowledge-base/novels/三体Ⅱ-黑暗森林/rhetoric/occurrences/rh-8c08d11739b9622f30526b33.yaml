quote: 你会像雷迪亚兹那样被人群用石头砸死，然后世界会立法绝对禁止别人再有这方面的考虑
sensory_mapping: 罗辑若举起坐标威胁，历史场景会重演：群众围拢、石块落下、战略随身体一起被法律埋葬
context_fact: 史强讨论太阳未被封锁的反事实；暴露三体大致也会暴露太阳系，因此威胁等于让两个世界同归于尽。
image_mechanism: 未来政治反应借已经发生的面壁者结局展开，两个策略在手段、公众承受风险和处决后果上逐项对齐。
property_alignment: 1）广播坐标对应引爆水星链；2）太阳系风险对应共同毁灭；3）罗辑孤身决策对应雷迪亚兹独断；4）公众处决对应投石重演。
context_alignment: 大史亲历面壁者历史，直接调用雷迪亚兹比抽象谈‘政治不可接受’更符合其刑警式案例推断。
narrative_function: 说明技术上可行的广播威慑为何在人类社会中迈不出去，为罗辑后来秘密部署、个人触发提供必要条件。
transfer_rule: 用历史人物类比未来决策时，应对应策略结构、利益受损者、社会反应和制度后果，而非只因结局相似。
failure_boundary: 罗辑的坐标广播与雷迪亚兹核爆链技术不同，公众反应也属史强预测；历史类比不能保证事件必然逐字重演。
