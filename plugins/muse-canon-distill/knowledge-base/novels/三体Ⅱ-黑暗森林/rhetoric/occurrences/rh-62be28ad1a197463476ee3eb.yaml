quote: 每个人都想挤到前面来离他近些，像寒冷中渴望得到阳光一样
sensory_mapping: 冰冷人群朝罗辑这轮暖阳收拢，身体争向光热，却在中心前停出一圈敬畏空隙
context_fact: 人群得知187J3X1被摧毁，跪称罗辑为神、正义天使或超级文明代言人，并争相靠近吻脚。
image_mechanism: 公众的抽象求救被体温需求化，罗辑从个人变成唯一热源；靠近动作因此具有生理迫切感。
property_alignment: 1）恐惧无望对应低温；2）救世承诺对应日光热量；3）身体拥挤对应向阳移动；4）心理安慰对应取暖。
context_alignment: 咒语刚以恒星毁灭被证实，公众又在漆黑沙漠穿发光衣，阳光喻体与恒星、明暗现场共同贴合。
narrative_function: 把崇拜的动力写成求生本能，同时显示罗辑瞬间获得的中心地位和群众压力。
transfer_rule: 把领袖写成寒中阳光时，应交代环境冷源、趋近动作、所得热量和不敢越过的距离。
failure_boundary: 罗辑不能像太阳稳定供能，也无法单独救人；公众把希望投射给他，喻体不证明其神性或能力。
