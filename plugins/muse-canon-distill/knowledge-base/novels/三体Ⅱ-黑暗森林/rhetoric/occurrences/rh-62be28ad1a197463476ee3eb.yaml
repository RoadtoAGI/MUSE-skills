tenor: 咒语生效后，绝望公众把罗辑当作救赎来源，强烈希望靠近他以获得安全和希望
vehicle: 受冻者本能地追逐阳光，靠近光热以恢复体温、生命力和安全感
ground: 1）文明绝望对应寒冷；2）罗辑与咒语对应阳光；3）挤近对应趋光取暖；4）获救期待对应恢复体温；5）敬畏距离对应不敢直触强光。
