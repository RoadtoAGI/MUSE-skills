tenor: KILLER病毒一旦获得目标身份，便能借遍布社会的联网硬件持续追杀，使受害者难以逃脱
vehicle: 施咒者只需念出或写下对象特征，诅咒便跨越距离驱使周围事物伤害目标并持续生效
ground: 1）病毒程序对应魔咒；2）输入身份对应念名施咒；3）网络传播对应法力越距；4）联网硬件对应被驱使物；5）自动谋杀对应诅咒发作；6）长期潜伏对应咒力未解。
