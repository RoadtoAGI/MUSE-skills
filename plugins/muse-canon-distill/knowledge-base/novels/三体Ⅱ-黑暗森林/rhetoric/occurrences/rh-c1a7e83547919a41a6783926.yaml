quote: 当时有人把这东西叫现代魔咒
sensory_mapping: 名字写入咒文、无形力量入网、日常器物接连变凶、目标走到哪里都被追上
context_fact: 郭警官解释一个世纪前的专用病毒今天首次激活，先后操纵飞车、井盖、机器人、药物配送和沙发攻击罗辑。
image_mechanism: 软件的分布式自动执行被装进巫术因果：创造者早已死亡，名字仍在系统中唤醒环境，完成延迟百年的杀意。
property_alignment: 1）KILLER代码对应咒文；2）罗辑身份特征对应真名；3）网络对应魔力介质；4）城市硬件对应受控器物；5）多次未遂对应连续发作；6）ETO程序员对应施咒者。
context_alignment: 罗辑曾向恒星发出‘咒语’，如今旧敌也以现代魔咒追杀他；同词把宇宙战略与网络病毒构成反向照应。
narrative_function: 一词解释六次看似世界敌意的共同来源，并把已灭亡ETO的意志保存在自动系统中。
transfer_rule: 自动攻击作魔咒时，应有身份触发、远程介质、被驱使对象、持续效力和施术者缺席五个环节。
failure_boundary: 病毒依赖兼容系统、联网设备和目标识别，可以被防火墙清除；它没有超自然全知与必然命中。
