quote: 那东西呈灰色，半透明，分量很轻，像手指甲盖
sensory_mapping: 薄甲片、半透明、指尖尺度、轻质硬片
context_fact: 杨晋文拿出烟盒大小的薄片给老人看，称其为太空电梯材料。
image_mechanism: 陌生战略材料被缩到身体熟悉尺度，工业薄片叠到指尖甲面，厚度、透光和重量立刻可想。
property_alignment: 1）材料片对应指甲盖；2）厚度对应角质薄层；3）半透明对应透光；4）轻重对应小甲片。
context_alignment: 面对新材料，老人首先凭手中视觉和触觉判断；指甲盖是随身可比尺度，语言自然朴实。
narrative_function: 让太空电梯材料从宏大工程回到日常桌面，为普通人理解技术突破提供触点。
transfer_rule: 身体部位作尺度喻应同时对齐尺寸、厚度和材质观感，并限于近距离观察。
failure_boundary: 样片烟盒大小可能大于单个指甲，比较更侧重质地和薄度；不能据此推断材料生物成分或强度。
