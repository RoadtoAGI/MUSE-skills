chapter: 正文
figure_type: simile
quote: 飞机在前方的跑道上投下了长长的影子，像一个大惊叹号。
sensory_mapping: 视觉、图形、标点语气
context_fact: 罗辑发现军用机场、战斗机与武装警戒圈，仍不知道自己为何受到如此高级保护。
image_mechanism: 夕阳把立体专机压成地面标点，影子不仅呈形，还替无法理解局势的罗辑对这一异常安排发出惊叹。
property_alignment: 1）长影对应竖画；2）影端分隔对应点；3）护送规模的异常对应惊叹语气。
context_alignment: 场景充满未解问题，跑道标点将视觉轮廓与叙事疑问、震惊合一。
narrative_function: 在登机前以图形收束警戒场面，强调罗辑命运即将发生巨大转折。
transfer_rule: 把影子写成标点时，应同时匹配轮廓组成与场景语气，让形似承担叙事判断。
failure_boundary: 若影子没有点画分离结构，惊叹号只是语气贴标签；正午短影也无法形成纵长形。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 专机机身与其在夕阳跑道上拖出的长影构成的轮廓
vehicle: 写在地面上的巨大惊叹号
ground: 1）机身形成粗短主体对应惊叹号竖画；2）分离的影端或机轮形点对应句点；3）异常庞大护送阵势对应惊叹语气的强烈。
