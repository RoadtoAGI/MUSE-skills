chapter: 正文
figure_type: metaphor
quote: 我知道你一直戴着面具，我对面具下的你一无所知
sensory_mapping: 固定假面、真脸遮蔽、双眼窥探、时间令边缘松动
context_fact: 希恩斯连最亲密的妻子也不透露战略；惠子多观察八年，而冬眠后的希恩斯保持原态，年龄差最终暴露伪装。
image_mechanism: 复杂的自我伪装凝成一层可佩戴表面，它遮住思想面孔，却会因时间错位让边缘与真实状态不再贴合。
property_alignment: 1）希恩斯的外在表现对应面具；2）真实思想对应面下脸；3）面壁职责对应固定面具的系带；4）惠子观察对应辨认面孔；5）八年成长差对应伪装破绽。
context_alignment: ‘面壁者’的制度本就要求欺骗，面具把公共职责落进夫妻对视，并为惠子最后通过眼睛看穿他形成视觉闭环。
narrative_function: 概括希恩斯最高明的防守方式，也把破壁成功表现为亲密关系中终于认出真脸。
transfer_rule: 人格作面具时，应指出它遮盖的具体内容、维持方式和暴露破绽，避免泛指虚伪。
failure_boundary: 希恩斯的爱与痛苦未必全是假面，隐藏战略也不等于没有真实外在情感；喻体不能把人格简单分成真假两层。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 希恩斯长期展示经过控制的思想与情感外表，把真实失败主义和逃亡目标隐藏在妻子面前
vehicle: 人以面具覆盖真实面孔，只让观察者看见固定、伪造的外表
ground: 1）公开人格对应面具；2）真实世界观对应面孔；3）自我控制对应佩戴；4）惠子无法识别对应看不见面下；5）长期欺骗对应持续不摘；6）苏醒后露馅对应面具错位。
