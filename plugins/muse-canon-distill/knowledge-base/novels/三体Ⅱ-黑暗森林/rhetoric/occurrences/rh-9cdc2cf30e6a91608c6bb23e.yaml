chapter: 正文
figure_type: simile
quote: 她的红围巾像一束火苗
sensory_mapping: 白雪吞没四周，庄颜颈边一缕红布像火焰跳动，成为罗辑视野唯一暖色
context_fact: 高烧中的罗辑梦见庄颜抱孩子站在雪原，自己无声警告她们逃离即将囊括一切的毁灭。
image_mechanism: 围巾的颜色和运动被点燃，人物情感温度由背景色差显现；火苗同时脆弱、可熄灭。
property_alignment: 1）围巾红色对应火光；2）飘摆对应燃动；3）庄颜对应暖源；4）毁灭逼近对应火苗易灭。
context_alignment: 罗辑正因雨夜高烧却身体寒冷，火苗把妻女写成最后温暖，也与稍后油尽灯芯形成生命火框架。
narrative_function: 锁定梦中庄颜并提高失去风险，让她远去时暖色也从空白世界撤离。
transfer_rule: 红布作火苗时，应匹配色、动态、冷背景与其保护对象，并保留火焰易灭的脆弱性。
failure_boundary: 围巾不发热也不燃烧；若背景不冷白、布料不动，火苗映射只剩颜色单点。
