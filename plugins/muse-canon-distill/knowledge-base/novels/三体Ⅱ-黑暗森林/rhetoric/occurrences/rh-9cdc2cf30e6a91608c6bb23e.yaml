tenor: 雪原梦中庄颜颈间鲜红、随行动飘动的围巾
vehicle: 白冷环境中一束鲜亮火焰，形状柔动、颜色炽红，并集中提供温暖与生命感
ground: 1）红色对应火色；2）布料飘动对应焰舌摇曳；3）雪原寒白对应冷背景；4）庄颜生命与爱对应热源。
