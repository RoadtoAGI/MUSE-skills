quote: 却携带了人类文明的全部希望
sensory_mapping: 五艘小舰像容器驶离、无形希望被装进舱内、与地球拉开距离、等待在远星展开
context_fact: 星舰国际只有五千多人却独立于地球与舰队国际，五舰保存了太阳系外延续文明的可能。
image_mechanism: 情绪与可能性被物化为可装载之物，舰船有限空间因承载‘全部’而获得文明重量。
property_alignment: 1）飞船对应运输容器；2）人口知识对应所载实物；3）希望对应价值总和；4）星际航行对应搬运保存。
context_alignment: 紧接三国际体量悬殊，‘携带’把五千人的少量人数与全部希望的巨大重量并置。
narrative_function: 确立星舰国际的象征地位，为制度选择增加超出个体生存的文明压力。
transfer_rule: 群体承载希望时，应交代可实际保存的人、知识与资源，让抽象价值有物质托底。
failure_boundary: 希望不是可封装货物，五舰也未携带地球全部文化和基因多样性，未来仍高度不确定。
