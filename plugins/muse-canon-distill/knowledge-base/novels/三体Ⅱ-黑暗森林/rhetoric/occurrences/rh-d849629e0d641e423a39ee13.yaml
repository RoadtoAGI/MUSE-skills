tenor: 仅五千多人的星舰国际保存技术、人口与继续繁衍的可能，被地球视为文明未来的唯一外逃支点
vehicle: 容器或旅人把珍贵物装在内部随身运走，使其避开原地毁灭并在远方重新取出使用
ground: 1）星舰国际对应载体；2）文明希望对应珍贵货物；3）人员信息对应容纳内容；4）远航对应运输；5）地球危机对应原地损毁。
