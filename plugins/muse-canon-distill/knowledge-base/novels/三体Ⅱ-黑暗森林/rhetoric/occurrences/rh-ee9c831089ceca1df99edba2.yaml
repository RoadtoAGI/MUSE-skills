quote: 他就像一块磁铁，走到哪里都把他们吸在周围
sensory_mapping: 磁场、吸附、环绕排列、移动牵引
context_fact: 罗辑离开秘书长办公室走到广场，数名保卫人员一路簇拥；他几次推开也无法摆脱。
image_mechanism: 制度保护化成看不见的磁场，罗辑的身体成为场源，周围人被无声拉回固定半径。
property_alignment: 1）罗辑对应磁铁；2）警卫对应铁屑；3）保护命令对应磁力；4）随行包围对应吸附排列。
context_alignment: 紧接“不可穿透屏障”和活动保险箱，磁铁补出隔离如何随人移动；真实推开动作又让吸回感可触。
narrative_function: 把面壁者无法恢复普通独行的处境写成物理定律，延续特权即束缚的主题。
transfer_rule: 磁力写关系黏附时，应落实中心、受力对象、作用距离和被推开后的回返，而非泛指吸引力。
failure_boundary: 警卫服从命令而非失去意志，磁铁也无法表达他们保护罗辑的专业判断；主动追随不宜机械化。
quality_assessment: exemplary
