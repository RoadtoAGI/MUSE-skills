review_status: reviewed
tenor: 罗辑无论怎样推拒都始终被安保人员紧密跟随的状态
vehicle: 移动时持续吸附铁件、使其围绕自身排列的磁铁
ground: 1）罗辑是队形中心对应磁极中心；2）安保人员自动贴近对应铁件受吸引；3）他移动队形随行对应磁铁带动附着物；4）推开后又围上对应磁力持续恢复。
