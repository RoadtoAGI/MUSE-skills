review_status: reviewed
tenor: 在三体必将占领地球的悲观判断下，人们认为保护生态只能为入侵者留下优美、宜居的行星
vehicle: 园丁整理土地、保护植物并维持景观，最终把精心照料的花园交给后来占有者享用
ground: 1）地球生态对应花园；2）环境保护对应园艺照料；3）人类对应园丁；4）清洁宜居对应花木繁盛；5）三体入侵者对应新主人；6）环保成果被夺对应花园转交。
