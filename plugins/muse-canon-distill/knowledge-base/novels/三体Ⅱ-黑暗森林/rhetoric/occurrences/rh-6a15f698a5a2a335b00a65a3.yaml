quote: 就算把地球保成一个花园儿，还不是留给三体人
sensory_mapping: 整颗地球被修成绿园、人类修枝浇水、花木成熟、陌生主人接管
context_fact: 大低谷前悲观主义盛行，环保组织被视为ETO分支，重污染太空军工因而失去制约。
image_mechanism: 行星尺度生态被缩成可维护的私人园地，环保劳动具有明确受益者；对未来所有权的悲观推断遂把照料翻成资敌。
property_alignment: 1）地球对应花园；2）生态系统对应花木；3）环保法规对应园艺规则；4）人类社会对应园丁；5）三体占领对应换主人；6）宜居环境对应园艺成果。
context_alignment: 说话者复述当时人的功利逻辑，花园通常象征文明成果，此处却因所有权预期变成停止环保的理由，反讽清晰。
narrative_function: 用一句家庭尺度的产权算计解释全球生态政策崩溃，为沙化华北和大低谷灾难提供心理因果。
transfer_rule: 环境作花园时，应写清谁照料、谁拥有、谁享用以及所有权预期如何改变维护意愿。
failure_boundary: 地球生态远比人工花园复杂，人类也无法确认三体必然占有；未来受益者变化不等于环保当下无价值。
quality_assessment: exemplary
