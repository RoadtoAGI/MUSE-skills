tenor: 罗辑早年连续生活已大多遗忘，只剩少数彼此断裂、保有细节却失去情感的记忆片段
vehicle: 河水退尽后连续流动消失，干河床中仅散落石块，石块标记旧水道却不能恢复水流生命
ground: 1）连续经历对应河水；2）时间流动对应河流；3）遗忘对应干涸；4）记忆片段对应砾石；5）感觉消失对应无生气；6）回忆搜寻对应沿河床捡石。
