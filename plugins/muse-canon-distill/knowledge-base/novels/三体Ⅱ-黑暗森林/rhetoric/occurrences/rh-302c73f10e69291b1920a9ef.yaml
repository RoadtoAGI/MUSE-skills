quote: 记忆是一条早已干涸的河流，只在毫无生气的河床中剩下零落的砾石
sensory_mapping: 记忆之海退成干河、生命水流早已消失、罗辑在河床弯腰捡起几颗带清晰划痕的石头
context_fact: 他努力回想面壁前人生，只能找到少数细节清楚、情感已消失的片段。
image_mechanism: 记忆的连续性与离散内容分配给水和石，干涸解释为何事实残留而体验流动已死。
property_alignment: 1）人生过程对应流水；2）记忆系统对应河道；3）遗忘对应蒸发断流；4）清晰事件对应砾石；5）情感活力对应水中生命。
context_alignment: 罗辑坐在沙地回忆最早河滩，现实沙、童年河和记忆干河三层叠合，意象由场景生长。
narrative_function: 为记忆衰减提供总框架，并引导叙事从零落石块寻找最终童年河月。
transfer_rule: 记忆作干河时，应区分连续体验之水、事实碎片之石、河床结构与干涸原因。
failure_boundary: 记忆可被线索重新激活，并非永久无水；碎片也会失真，不是稳定客观石块。
