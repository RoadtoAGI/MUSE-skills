chapter: 正文
figure_type: simile
quote: 在雪地上留下的一串脚印，像国画中一道淡淡的墨迹
sensory_mapping: 白雪铺成无边纸面，脚印化作一线淡墨向远方收细，庄颜的人影成为末端黑点
context_fact: 梦中庄颜在雪原远离，脚印是空白世界中仅存的地面证据，随后镜中外的脚印也消失。
image_mechanism: 三维雪地被压平为国画，离散足迹串成笔线；极少墨迹反向定义大片留白和人物距离。
property_alignment: 1）白雪对应白纸；2）足迹点列对应墨线；3）人物远离对应线条收束；4）空无景物对应留白；5）脚印消失对应墨迹被抹除。
context_alignment: 它延续庄颜国画空白框架，梦中视角直接采用她的审美语言，使夫妻关系通过同一画面重合。
narrative_function: 把庄颜离去写成画面中最后一笔的消退，为世界与自我从镜面完全消失推向极致。
transfer_rule: 足迹作墨迹时，应对应底色、点线结构、远近浓淡和它对空间边界的定义。
failure_boundary: 脚印有真实凹陷和三维尺度，墨迹是颜料；若地面杂乱或足迹不成线，国画留白结构便不成立。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 庄颜抱孩子远去时在一片白雪上留下的细长、逐渐变淡的脚印轨迹
vehicle: 大片宣纸留白上唯一一道淡墨，线迹细、疏且向远处延伸，靠它才显出纸面空间
ground: 1）雪原对应宣纸；2）脚印对应墨点线；3）远去变淡对应淡墨渐隐；4）空旷无物对应留白；5）轨迹标地对应墨迹建构空间。
