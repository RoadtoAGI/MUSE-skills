tenor: 罗辑眼前与庄颜同游的晨雾森林，同两年前独自想象旅行之间的遥远、不真实差异感
vehicle: 两个分属不同人生或不同世界、彼此无法直接连续的时代
ground: 1）两年间身份巨变对应跨过一生；2）想象变现实对应跨世界；3）景观差异对应两世环境；4）庄颜真实在侧对应旧梦已成前世；5）难以置信对应记忆失真。
