chapter: 正文
figure_type: simile
quote: 周围的一切与那时的冬雪后的华北平原和太行山已恍若隔世
sensory_mapping: 前世雪原、今生森林、世界断层、记忆远退
context_fact: 罗辑与现实庄颜驱车穿过森林，晨雾阳光触发他回忆两年前想象中的冬日旅行。
image_mechanism: 时间没有只后退两年，而在两段风景间裂成世界断层；旧雪原被推入前世，今晨现实像另一次生命。
property_alignment: 1）旧旅程对应前世；2）当前同游对应今生；3）身份变化对应转世；4）环境差异对应两个世界。
context_alignment: 想象与现实却又“无缝连接”，隔世感和连续感同句并存，准确呈现理想成真的认知悖论。
narrative_function: 强调两年间罗辑人生尺度的改变，并继续模糊庄颜究竟来自梦还是现实。
transfer_rule: 隔世喻应由身份、环境和现实层级至少两项巨大变化支撑，并可与细节连续形成张力。
failure_boundary: 客观只过去两年且记忆清晰，并非真的转世；普通搬家或短别若无人生断层会显夸张。
quality_assessment: effective
