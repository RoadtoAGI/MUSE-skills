chapter: 正文
figure_type: metaphor
quote: 孤独感从四面八方的白色中涌出来，淹没了她
sensory_mapping: 白色空间化成潮面、孤独从每面舱壁涌出、东方被无声水层包住、黑色人影消失后再无岸边
context_fact: 章北海的疲惫身影缩成黑点并消失在白色舱室，东方目送后产生前所未有的孤独。
image_mechanism: 单色空白由视觉背景转成流体来源，情绪不是内心萌生，而像环境整体向人物压来。
property_alignment: 1）白舱空间对应水域；2）孤独强度对应水压；3）四面包围对应全向涌水；4）情绪失控对应淹没。
context_alignment: 星舰社会正失去地球这一岸，白舱却极洁净安全，洪水感凸显心理危险来自内部而非物理环境。
narrative_function: 从章北海私人负担转向东方和高层的群体心理阴影，开启星舰黑暗战役的内因。
transfer_rule: 情绪作洪水时，应确定涌出位置、增长方向、受淹身体和失去的支点，使环境参与心理变化。
failure_boundary: 舱内没有液体或呼吸危险，东方仍能行动与决策；淹没只表示一时情绪压倒。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 章北海离去后，东方独处巨大空白球舱，突然被强烈、全方位且无法抵挡的孤独占据
vehicle: 水从四周同时涌入低处，迅速升高并没过人的身体，使其失去立足、呼吸与逃离方向
ground: 1）孤独对应洪水；2）白色舱壁对应水源四周；3）情绪增强对应水位上升；4）东方对应被淹者；5）无依托对应失去落脚点。
