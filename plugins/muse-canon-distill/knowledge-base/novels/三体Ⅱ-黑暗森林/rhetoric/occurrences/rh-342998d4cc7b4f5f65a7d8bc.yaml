chapter: 正文
figure_type: simile
quote: 那高挑苗条的身材像飘浮在空间中的一个飘逸的音符
sensory_mapping: 白色虚空、修长人形、轻盈滑移、发梢如余拍跳动
context_fact: 章北海在失重舱内检阅两千人方阵，年轻舰长东方延绪从队前借磁力腰带轻盈移来。
image_mechanism: 人体重量被失重拿走后只剩一条有节奏的线，移动轨迹不像步行，更像音乐符号在空白中落位并发声。
property_alignment: 1）东方延绪对应音符；2）苗条轮廓对应符干；3）空间漂浮对应谱面悬置；4）轻盈移动对应旋律推进；5）停下对应音符落拍；6）活力对应明亮音色。
context_alignment: 太空新人类的身体与动作不同于地球人，音符既抓住失重姿态，又避免把她写成普通飞鸟或舞者。
narrative_function: 以听觉图形刻画东方延绪的未来人气质，建立章北海对她的即时信任与审美注意。
transfer_rule: 人物作音符时，应对齐轮廓、空间落点、运动节奏和整体环境的‘谱面’，让听觉与视觉互换。
failure_boundary: 人有体积、意志和复杂行动，音符只是抽象符号；美感不能证明她的政治立场或非钢印身份。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 东方延绪修长轻盈的身体在失重方阵前平滑移动、停驻，姿态富有节奏与活力
vehicle: 写在空白乐谱空间中、形体纤长并承载轻快节奏与旋律的单个音符
ground: 1）修长身体对应音符笔形；2）失重漂移对应音符悬浮；3）轻盈动作对应旋律流动；4）白色空间对应乐谱留白；5）停驻位置对应音符落点；6）秀发弹动对应余韵。
