quote: 每一个舱就是“自然选择”号的全部，所以，“自然选择”号是全息的
sensory_mapping: 一间白球舱展开整艘战舰、无数相同舱室各自藏着全体、局部镜片反复显出完整舰影
context_fact: 章北海看到重复球舱，想到每个舱在信息系统上都能完成对全舰的全部控制。
image_mechanism: 控制权限的冗余分布被转换成全息成像，‘部分含全部’由技术事实扩展为文明和宇宙设想。
property_alignment: 1）舱室对应全息局部；2）控制接口对应编码信息；3）自然选择号对应整体图像；4）重复舱室对应多片冗余。
context_alignment: 球舱视觉重复与信息权限事实共同支撑联想，使哲学跳跃从舰船设计起步而非凭空出现。
narrative_function: 建立‘部分包含全部’母题，为飞船种子、人类文明与宇宙全息的连续类推提供第一环。
transfer_rule: 技术系统类比全息时，应先证明局部确含整体信息，再标明从功能冗余向哲学整体的推演层级。
failure_boundary: 每舱只能在系统完好时控制全舰，并未包含舰体物质与全部人员；这不是严格物理全息证明。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 从信息控制角度，每个球形舱都能调用并操纵整艘战舰，局部节点保存全舰功能映射
vehicle: 全息图的每一局部都编码整体图像，即便截取一小片仍能重建全部，只是细节可能变化
ground: 1）球舱对应全息片段；2）全舰控制信息对应整体图像；3）任一舱可操纵对应局部含全体；4）舰体对应完整全息图。
