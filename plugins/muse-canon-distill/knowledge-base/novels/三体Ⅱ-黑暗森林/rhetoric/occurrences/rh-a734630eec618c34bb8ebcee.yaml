figure_type: simile
quote: 有一段路，他们仿佛行驶在月球表面
sensory_mapping: 裸岩荒地、无植被、孤车行进、异星表面
context_fact: 公路随海拔上升穿出草原，植被逐渐稀疏，露出大片黑色岩石，随后才进入雪线。
image_mechanism: 道路两侧的绿色被逐层剥掉，车辆失去地球生命参照，黑岩在车窗外铺成异星地表。
property_alignment: 1）高山裸地对应月面；2）黑岩对应月壤岩石；3）无植被对应无生命；4）汽车对应月面车。
context_alignment: 比较发生在植被消失与雪线出现之间的短暂黑岩地带，范围限定“有一段路”使物理贴合准确。
narrative_function: 制造从绿色世界到纯白世界的过渡，并短暂引入宇宙尺度。
transfer_rule: 异星地貌喻要指定局部路段，并用植被、岩色和孤绝感共同去除熟悉地球标志。
failure_boundary: 当地仍有空气、道路和汽车，不具月球真空与低重力；进入白雪后黑色月面对应即结束。
