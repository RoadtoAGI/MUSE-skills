chapter: 正文
figure_type: metaphor
quote: 那无数湮没于时间长河中的同时代人
sensory_mapping: 长河奔行、人影沉没、旧岸远去、幸存者抵达下游
context_fact: 罗辑看到新一届文职主席想起伽尔宁，意识到旧时代绝大多数人已死，而自己因冬眠仍在场。
image_mechanism: 均匀流逝的年月汇成携带万物的河，普通生命承受不住两世纪水势而沉没，冬眠者则像被封存后投送到下游。
property_alignment: 1）时间对应长河；2）同时代人对应河中身影；3）死亡对应湮没；4）历史遗忘对应水面合拢；5）未来对应下游；6）罗辑苏醒对应跨流抵达。
context_alignment: 前文已用利刃开启世纪蒙太奇，此处从幸存者视角换成河流，强调数量、距离和个人幸运，不重复切割动作。
narrative_function: 让会场一个面孔触发两世纪死亡的整体重量，压低罗辑刚见未来时的轻快。
transfer_rule: 用长河写历史时，应明确水流方向、人物所处位置和沉没所代表的具体后果，避免只作为时间套语。
failure_boundary: 逝者并非都被遗忘，历史也可保存和重释他们；冬眠不是主动渡河，时间没有真实水势。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 罗辑同时代的无数人随近两个世纪过去而死亡、被遗忘，无法抵达当前时代
vehicle: 个体落入一条不断向前奔流的漫长河流，被水势淹没并带离可见处
ground: 1）时间推进对应河水奔流；2）人生对应河中个体；3）死亡遗忘对应沉没；4）世纪跨度对应长河距离；5）罗辑冬眠幸存对应越过水流；6）古人与当下分隔对应上下游。
