quote: 与大低谷相比那是天堂了
sensory_mapping: 地狱般饥荒铺底、旧年代被抬到光明高处、食物与秩序显得如福地
context_fact: 罗辑猜大低谷只是生活水平倒退百年，史晓明以八十三亿人口和后续灾难纠正其低估。
image_mechanism: 并不美好的历史年代被相对位置抬升为极乐世界，夸张不赞美三十年代本身，只测量大低谷向下坠落的深度。
property_alignment: 1）二十世纪三十年代对应天堂；2）大低谷对应苦难世界；3）相对供给对应丰裕；4）较低死亡规模对应免灾；5）罗辑预期对应地面基准；6）真实灾难对应深渊基准。
context_alignment: 口语‘您做梦吧’后立刻出现天堂，先击破温和倒退想象，再为张延的‘人间地狱’证言铺设两极标尺。
narrative_function: 迅速校准灾难量级，让随后八十三亿降至三十五亿的人口数字具有情感尺度。
transfer_rule: 相对天堂写法应明确比较基准，选择本身并不理想却因另一端更惨而被抬升的对象，形成反向量尺。
failure_boundary: 三十年代并非真正无苦难的乐园，天堂评价只在与大低谷的特定生存指标比较时成立。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 二十世纪三十年代虽有战争、贫困与动荡，但相较大低谷的全球饥荒和人口锐减仍显得极其安稳富足
vehicle: 没有饥饿、死亡和苦难的极乐天堂，与凡世灾难彻底隔绝
ground: 1）三十年代对应天堂；2）大低谷对应地狱性凡世；3）较少饥荒对应丰足；4）较高存活率对应免死；5）社会秩序对应安宁；6）比较反差对应地狱仰望天堂。
