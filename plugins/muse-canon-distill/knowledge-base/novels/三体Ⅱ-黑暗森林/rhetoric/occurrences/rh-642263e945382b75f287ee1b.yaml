chapter: 正文
figure_type: metaphor
quote: 像一枚半埋在地下的大蛋
sensory_mapping: 视觉、形状、出生动作
context_fact: 扁角鹿先看到雪原上的银白半球裂开，随后浓烟、烈火与导弹从地下出现。
image_mechanism: 从动物视角把机械发射重组为生命出生：半球先成为蛋，开启成为裂壳，导弹升空成为孵化，动作顺序完整复现。
property_alignment: 1）银白半球对应半埋蛋壳；2）开启缝隙对应裂蛋；3）导弹钻出对应孵化物离壳。
context_alignment: 观察者是不了解武器的扁角鹿，“蛋”来自其可理解的自然类别；生命意象与核导弹的毁灭属性形成潜在反差。
narrative_function: 以陌生化方式呈现首次太空拦截发射，使军事设施在动物眼中获得完整而危险的生命过程。
transfer_rule: 用生命过程比拟机械启动时，应按外壳、开启、内部物出现的先后建立动作链，并服从观察者知识边界。
failure_boundary: 若装置无壳体、没有从内部钻出的动作，或视角人物熟知发射流程，“孵化”会成为故作天真的装饰。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 雪地下银白半球形的导弹发射井及从中升起的导弹
vehicle: 裂开外壳并孵出幼体的巨大蛋
ground: 1）半球外罩对应露出地面的蛋壳；2）罩体裂开对应蛋壳破裂；3）圆柱导弹从中升起对应幼体孵化钻出。
