chapter: 正文
figure_type: simile
quote: 像砸在玉石构成的大地上
sensory_mapping: 锤头落下、玉石大地发出清鸣、振动沿整片表面传开、镜面毫无裂痕
context_fact: 显微镜看不见水滴缺陷后，丁仪用地质锤直接敲击，镜面仍无任何变化。
image_mechanism: 三米物体在触觉上突然扩展成大地，声音的均匀与深沉暗示材料内部像地层般整体固结。
property_alignment: 1）水滴对应玉地；2）镜面对应抛光玉面；3）地质锤对应勘探锤；4）清响对应玉鸣；5）无凹痕对应地面坚固；6）振动回传对应连续大块。
context_alignment: 丁仪拿的是地质锤，喻体自然从样品跳到大地；‘玉’又保留水滴美感，同时把脆弱改写为坚硬。
narrative_function: 用听觉第一次给水滴完美外观补上异常强度，为强相互作用材料判断提供感官证据。
transfer_rule: 敲击声作材质类比时，应对齐音色、传振范围、硬度和损伤结果，并让工具与喻体领域相接。
failure_boundary: 水滴并非玉石或地壳，真空中声音只经人体传来；清脆声本身不能定量证明强度。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 地质锤击中水滴镜面后传回清脆悠扬、坚实均匀且尺度感异常巨大的振动声
vehicle: 锤子敲击整片由致密玉石构成的地面，声音清亮而深厚，坚硬材质向广阔整体传振
ground: 1）水滴表面对应玉石地面；2）高硬度对应玉质；3）清脆声对应敲玉；4）整体传振对应大地连续；5）无损伤对应坚实；6）悠长回响对应广阔体量。
