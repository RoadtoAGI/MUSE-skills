figure_type: simile
quote: 眼镜就像砖头那么沉地压在鼻粱上
sensory_mapping: 方砖下压、鼻梁受重、硬边硌骨、头部被按
context_fact: 丁仪回忆第一次乘空天飞机时未摘眼镜，在超重阶段感到极端压迫。
image_mechanism: 轻薄镜架在加速度中骤然增密成砖，全部重量集中到鼻梁一条窄线，日常小物变成刑具。
property_alignment: 1）眼镜对应砖头；2）超重对应质量感放大；3）鼻梁对应承重支点；4）压痛对应硬砖下压。
context_alignment: 超重确会增加表观重量，砖头在物理机制和触觉后果上均贴合，口语夸张符合丁仪直率。
narrative_function: 以幽默身体经验预告乘员即将承受的超重，缓解技术对话。
transfer_rule: 小物变重的夸张应由明确加速度或疲劳机制支撑，并把重量集中到具体身体接触点。
failure_boundary: 眼镜实际质量未变为砖头，失重阶段反会飘走；平稳一倍重力环境照搬会失真。
