tenor: 航天加速超重时眼镜重量成倍增加、强压丁仪鼻梁的不适
vehicle: 一块沉重方砖直接搁压在鼻梁上
ground: 1）增重眼镜对应砖块重量；2）镜框硬压对应砖面压迫；3）受力集中鼻梁对应砖落窄支点；4）无法轻易抬动对应沉重；5）疼痛对应硬物压骨。
