quote: 这种像梦的生活怎么可能永远延续
sensory_mapping: 美梦包裹、醒来空床、人物入梦离梦、现实雨声渗入
context_fact: 罗辑醒来发现妻儿不在，只留“末日等你”的画；五年前庄颜也在雨夜来到庄园。
image_mechanism: 五年生活被收拢成一层可醒的梦膜，雨声从外界刺穿它；庄颜沿最初出现的方向退回梦内，带走孩子。
property_alignment: 1）家庭生活对应梦；2）庄园隔绝对应梦境边界；3）庄颜到来对应入梦显形；4）被带走对应梦醒人物消失。
context_alignment: 女孩本由罗辑想象而来，初见与离开都发生在雨声中，梦的出入口具有严格场景回环。
narrative_function: 把私人乐园彻底反转为临时幻境，迫使罗辑重新进入面壁现实。
transfer_rule: 人生如梦的延展喻要安排明确入梦、梦中规则和醒来触发，并让首尾感官线索回环。
failure_boundary: 五年爱情和孩子都真实存在，不因结束而虚假；把关系只当梦会抹去庄颜的独立选择。
