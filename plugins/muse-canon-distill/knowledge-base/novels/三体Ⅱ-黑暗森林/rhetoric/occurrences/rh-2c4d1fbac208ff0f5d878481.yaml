quote: 仿佛被来自宇宙深处的雷霆所震慑
sensory_mapping: 无声太空忽然炸出巨雷、三道目光被震散、心灵像身体般在雷压下颤动
context_fact: 燃料、配件和载员方案逐项排除后，三人共同得出‘一部分人死，或者所有人死’。
image_mechanism: 逻辑结论从思想内容变成外界冲击波，认知的突然性、宏大来源和身体后果同时被听觉化。
property_alignment: 1）生存结论对应雷声；2）推演完成对应雷击时刻；3）三人对应受震者；4）恐惧对应余震；5）宇宙环境对应风暴深处。
context_alignment: 太空本无空气雷声，正因物理寂静，‘宇宙深处雷霆’更准确表现法则在心中爆响。
narrative_function: 给无声目光推演制造高潮，分隔资源计算与道德抵抗两个阶段。
transfer_rule: 认知冲击作雷霆时，应标出积云般前置压力、爆发瞬间、声源尺度与身体余震。
failure_boundary: 没有真实声波或外部意志，结论由三人计算产生；雷霆不能证明选择唯一正确。
