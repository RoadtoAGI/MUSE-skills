chapter: 正文
figure_type: metaphor
quote: 那是自己的上古时代
sensory_mapping: 一生展开为漫长历史、童年退到无文字上古、月夜沙坑成为仅存遗址、再往前尽是空白
context_fact: 临近预期死亡，罗辑回放一生，只能找到河边沙滩挖坑映月这一最早画面。
image_mechanism: 个人记忆尺度被扩成文明年代，信息缺失由史前空白表达，使普通童年具有起源遗址感。
property_alignment: 1）生命阶段对应历史时期；2）童年早期对应上古；3）记忆片段对应文物；4）遗忘对应无记载；5）当前自我对应后世文明。
context_alignment: 他刚以宇宙尺度验证文明法则，临终回望时同样以历史尺度看个人，宏观思维落回童年。
narrative_function: 把支离记忆收束到最早沙滩，并与当下电视光照沙地形成首尾重叠。
transfer_rule: 童年作个人上古时，应利用史料稀缺、起源遗迹和后世回望，选择一件具体记忆作证物。
failure_boundary: 童年并非独立文明，记忆缺失也不等于事件未发生；上古只表示认知距离。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑能追溯到的最早童年记忆极其遥远、零碎，位于个人有连续叙事之前
vehicle: 文明上古时期远离现代、史料稀少，只有神话、遗迹与片段可供重建起源
ground: 1）个人一生对应文明史；2）幼年对应上古；3）记忆空白对应无史料；4）河滩月影对应遗迹；5）自我形成对应文明起源。
