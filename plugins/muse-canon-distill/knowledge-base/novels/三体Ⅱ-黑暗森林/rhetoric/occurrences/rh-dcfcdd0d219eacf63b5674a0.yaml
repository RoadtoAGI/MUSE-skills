chapter: 正文
figure_type: metaphor
quote: 他的内心世界对吴岳一直是一片深不见底的灰色
sensory_mapping: 视觉、深度、色彩、空间
context_fact: 章北海工作坦诚、判断正确，却从不显露判断背后的真实想法；吴岳认为自己反而完全透明。
image_mechanism: 把关系中的认知不对称拉成垂直深度：吴岳暴露在明处，章北海的思想则向灰色深处无限退去。
property_alignment: 1）灰色低可见度对应真实动机模糊；2）无底深度对应探究没有结果；3）表面坦诚对应深水表面可见、内部仍隐藏。
context_alignment: 两人是需彼此了解思维方式的战舰指挥搭档，深度与透明度直接回应协同风险，而非泛写神秘。
narrative_function: 建立章北海最关键的隐藏能力，并让吴岳对这一能力的焦虑成为后来分岔的预警。
transfer_rule: 表现不可知人物时，可把信息可见度和探究深度分开对应：表层事实清楚，动机纵深仍无底。
failure_boundary: “深”不等于高尚或复杂，灰色也不等于邪恶；若人物只是少言却行为动机明确，该喻体会制造虚假神秘。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 吴岳无法理解章北海真实思想的长期感受
vehicle: 灰暗、没有可见底部的深水或深渊
ground: 1）思想内容不可见对应灰色遮蔽；2）越探究越无终点对应深不见底；3）章北海能看透别人而自己不透明对应单向可见的深域。
