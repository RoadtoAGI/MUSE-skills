quote: 如果离开了太空电梯这条脐带，也生存不了太长的时间
sensory_mapping: 基地胎体、长带连母、物资血流、断带窒息
context_fact: 基地距章北海八十公里，周围小设施的供给完全来自电梯，航天服维生也只能维持十二小时。
image_mechanism: 庞大空间站被还原成尚不能独立存活的胎体，电梯长索从地球母体延伸入轨，物流变成持续供血。
property_alignment: 1）空间基地对应胎儿；2）地球对应母体；3）电梯对应脐带；4）补给对应血氧营养；5）独立生存对应出生后自主维持。
context_alignment: 章北海此刻追求不依附任何世界的感觉，脐带事实紧邻这种主观独立，形成有力反讽。
narrative_function: 提醒早期太空文明仍依附地球，并深化章北海切断联系的心理主题。
transfer_rule: 基础设施作脐带应具备单向关键供给、生命依赖和明确母体端，普通便利连接不够强。
failure_boundary: 基地可能有储备和多条补给路径，也能逐步自治；电梯承担交通而非全部生理交换。
