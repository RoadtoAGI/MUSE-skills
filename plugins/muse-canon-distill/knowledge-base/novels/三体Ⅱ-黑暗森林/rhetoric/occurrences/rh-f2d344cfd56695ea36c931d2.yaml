tenor: 面壁者任何表态都被视为欺骗、因此无法证明真意或退出角色的自我封闭逻辑
vehicle: 由坚硬铁材制成、锁住身体且难以挣脱的枷具
ground: 1）逻辑悖论对应枷锁束缚；2）任何行动被重新解释对应挣扎越紧；3）无法退出对应无钥匙；4）制度强制对应铁质坚硬；5）思想行动受限对应肢体被锁。
