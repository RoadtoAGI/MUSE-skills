chapter: 正文
figure_type: simile
quote: 这铁一般的逻辑枷锁
sensory_mapping: 铁枷扣合、关节受限、无钥匙、挣扎碰响
context_fact: 泰勒公开承认计划仍无人相信，最终以自杀跳出面壁者怪圈；罗辑思考自己能否脱身。
image_mechanism: 抽象解释规则锻造成一套铁环，扣住面壁者的每句话和行动；越试图澄清，链条越把解释拉回欺骗。
property_alignment: 1）自证困境对应枷锁；2）面壁者对应囚徒；3）制度解释对应铁链；4）自杀对应极端脱身。
context_alignment: 泰勒刚用生命突破怪圈，铁枷将这种制度性不可逃物理化，并使罗辑突然意识到自身危险。
narrative_function: 把外部世界重新压回罗辑私人乐园，触发他寻找泰勒并发现自杀。
transfer_rule: 逻辑枷锁喻应说明规则如何限制每一种出口，并用角色具体失败尝试证明硬度。
failure_boundary: 制度仍可被集体决议修改，并非自然铁律；若存在可信申诉渠道，绝对无钥匙的枷锁会夸大。
quality_assessment: effective
