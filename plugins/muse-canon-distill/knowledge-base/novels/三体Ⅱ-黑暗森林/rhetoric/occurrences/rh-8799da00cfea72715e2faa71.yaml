quote: 他的心再次在剧痛中撕裂
sensory_mapping: 毁灭认知像双手从胸中扯开连接妻女的组织，疼痛沿裂口爆开，罗辑徒手抓向空处
context_fact: 梦中罗辑突然明白毁灭与水滴无关、将覆盖一切，随即在空中徒劳抓取庄颜远去身影。
image_mechanism: 关系失去被肉体撕裂化，认知瞬间成为外力，随后抓取动作证明他试图挽回断开的连接。
property_alignment: 1）亲情联结对应组织连接；2）终极失去对应撕裂；3）心理痛对应伤口痛；4）徒劳伸手对应试图拉回断面。
context_alignment: 罗辑高烧且胸中真实痛苦，生理感与梦中情感合流；撕裂比一般‘心痛’更贴近突悟时刻。
narrative_function: 把私人爱与行星毁灭重新绑在一起，促使醒后的罗辑以生命建立最后威慑。
transfer_rule: 心作被撕组织时，应明确撕扯来源、原连接对象、疼痛爆发时点和人物随后的身体反应。
failure_boundary: 原文描述主观剧痛，不证明心脏组织真实撕裂；医疗意义与情感意义不可混用。
