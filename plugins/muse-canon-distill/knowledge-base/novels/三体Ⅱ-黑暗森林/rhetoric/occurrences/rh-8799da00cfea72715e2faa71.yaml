review_status: reviewed
tenor: 罗辑意识到庄颜和孩子无论逃多远也会被黑暗森林打击囊括，重新遭受强烈悲痛
vehicle: 原本连在一起的柔软组织遭外力扯开，裂口突然产生尖锐疼痛并失去完整
ground: 1）情感完整对应心体完整；2）毁灭领悟对应撕扯力；3）悲痛骤发对应裂开剧痛；4）妻女远去对应连接断裂。
