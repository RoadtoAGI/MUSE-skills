quote: 他(她)有可能成为犹大，也有可能成为耶稣
sensory_mapping: 一句话同时分出两条圣经道路、开口者一面可能戴背叛者之名、一面可能走向受难救赎
context_fact: 三人知道燃料只够少数飞船，却不能确定先发攻击或自我牺牲在新文明中将如何评价。
image_mechanism: 尚无道德词汇的新处境借原文明最强的罪—救赎人物轴定位，责任两极在同一人身上重叠。
property_alignment: 1）伤害同胞对应犹大背叛；2）承担毁灭对应耶稣受难；3）文明幸存对应救赎结果；4）第一提出对应历史首吻。
context_alignment: 东方仍带地球宗教伦理进入太空，引用显示新人类尚未诞生，她无法用旧角色判断新死局。
narrative_function: 具体化首发言者的两种历史命运，并为章北海后来‘去地狱’承担罪名建立神学语境。
transfer_rule: 人物作典故两极时，应分别对应行为、代价、受益者和后世判断，保留同一行动的道德歧义。
failure_boundary: 舰队资源选择不同于圣经事件，犹大和耶稣也非简单罪人与英雄二分，类比不能替代伦理分析。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 首个提出牺牲部分人保全文明者，可能被后世视为背叛同胞的罪人，也可能被视为承担死亡、拯救众人的牺牲者
vehicle: 《圣经》中犹大以吻完成背叛，耶稣则承受死亡完成救赎，两者分别代表极端罪责与极端牺牲
ground: 1）首谈者对应犹大/耶稣；2）选择他人死对应背叛；3）自愿承担罪名对应受难；4）保存文明对应救赎；5）第一行动对应犹大首吻。
