tenor: 远处雪峰狭锐、陡直并在侧光中显出硬边的轮廓
vehicle: 薄而锋利、边缘笔直锐利的刀锋
ground: 1）峰脊狭窄对应刀刃薄；2）坡面陡峭对应刃面急落；3）轮廓锐利对应刀口；4）银光反射对应金属寒光。
