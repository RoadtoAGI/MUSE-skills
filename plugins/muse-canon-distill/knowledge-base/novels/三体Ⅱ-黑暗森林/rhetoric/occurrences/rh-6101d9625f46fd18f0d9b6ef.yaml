chapter: 正文
figure_type: simile
quote: 远方如刀锋般陡峭的雪峰
sensory_mapping: 锐刃轮廓、陡直刃面、银色寒光、尖峰切空
context_fact: 太阳西斜，近处雪坡在阴影中，远峰仍受阳光照射并向四方反射银光。
image_mechanism: 山体厚重体积被侧光削成一条薄刃，峰脊像刀口切开天空，银光进一步赋予金属质地。
property_alignment: 1）雪峰对应刀锋；2）峰脊对应刀口；3）陡坡对应刃面；4）反光对应金属寒光。
context_alignment: 低角度阳光强化边缘与银色，刀锋同时传达高山的险峻和寒冷，贴合可见轮廓。
narrative_function: 在纯净空白中加入危险锐度，为雪崩警告和庄严光源增添张力。
transfer_rule: 刀锋喻山峰应同时具备薄脊、陡坡和冷反光，至少两种视觉证据支撑“锋利”。
failure_boundary: 圆缓宽厚的山体不适用刀锋；该喻不表示雪峰真的能切割或由金属构成。
quality_assessment: effective
