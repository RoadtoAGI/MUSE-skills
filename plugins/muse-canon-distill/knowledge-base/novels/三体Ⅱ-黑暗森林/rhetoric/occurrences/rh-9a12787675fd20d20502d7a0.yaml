quote: 战舰发动机的光芒黯然失色，像一片惊恐的萤火虫
sensory_mapping: 黑空中微光四散、巨火球不断亮起、虫群般舰影慌忙逃窜、点点尾焰随时熄灭
context_fact: 矩形阵列已完全打乱，各舰启动发动机逃离，但水滴仍令每刻三至五舰爆炸。
image_mechanism: 恒星级巨舰被尺度压缩为虫光，发动机这一力量标志反成暴露惊惧与脆弱的闪烁。
property_alignment: 1）舰体对应虫体；2）推进尾焰对应荧光；3）逃逸方向分散对应受惊乱飞；4）聚变爆炸对应威胁光源。
context_alignment: 前文舰队如星海般壮阔，此处同一光群降为萤火虫，完成力量神话的视觉坍缩。
narrative_function: 在宏观战场上显示人类战舰相对水滴的弱小，并把集体溃逃写出动物性恐慌。
transfer_rule: 发光群体作萤火虫时，应匹配点光尺度、无序运动、强光压制与脆弱处境，使降格有参照。
failure_boundary: 战舰是大型机械且由人控制，萤火虫没有战略意图；‘惊恐’来自舰员而非发动机。
