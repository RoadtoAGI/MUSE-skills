tenor: 疏散中的大量战舰以微弱发动机光散乱移动，其亮度被周围持续出现的聚变火球压倒
vehicle: 一群受惊萤火虫在强光与威胁中慌乱飞逃，各自发出细小闪光且无法组成防御
