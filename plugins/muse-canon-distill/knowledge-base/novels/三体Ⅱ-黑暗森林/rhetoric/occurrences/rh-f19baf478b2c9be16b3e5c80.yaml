chapter: 正文
figure_type: metaphor
quote: 我们真的都是摩登原始人
sensory_mapping: 现代衣冠包住史前头脑、城市先进、内核古老、时代错层叠身
context_fact: 常伟思指出大脑明显进化需两万至二十万年，而文明仅五千年，因此现人仍用原始脑处理终极战争。
image_mechanism: 漫长进化差异被压进一个矛盾人物：外表属于现代都市，颅内却住着史前祖先，时间错层同时可见。
property_alignment: 1）现代人对应摩登原始人；2）技术文化对应时髦装束；3）生物大脑对应原始内核；4）文明速度对应快速换衣；5）进化速度对应身体未变。
context_alignment: 希恩斯用轻松自嘲回应严肃脑科学判断，矛盾称谓符合他将技术干预思想视为必要的立场。
narrative_function: 一句概括思维研究的前提，也把人类失败主义从道德缺陷转成进化时间差问题。
transfer_rule: 用矛盾身份表现时代错层时，应把外部能力与内部机制分开，并给出两者不同时间尺度。
failure_boundary: 现代人的认知受文化教育深刻塑造，不能等同史前人；生物结构相近也不意味着思维能力完全相同。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 现代人拥有高度文明和技术外壳，思维器官却仍是数万年前进化形成、未适应当前复杂危机的大脑
vehicle: 原始人穿着现代生活与技术的装束进入当代，外部环境先进而认知底层古老
ground: 1）现代文明对应摩登外表；2）人脑结构对应原始人；3）五千年文明对应短暂换装；4）漫长脑进化对应内核未变；5）高技术战争对应原始脑面对新环境；6）认知局限对应旧工具。
