chapter: 正文
figure_type: simile
quote: 仿佛要把自己的心撕开让大史看似的
sensory_mapping: 撕裂、胸腔打开、内部显露、他人凝视
context_fact: 罗辑反复尝试描述女孩却觉得所有措辞都不能表现心中形象。
image_mechanism: 表达障碍变成肉身屏障，他想绕过语言，直接把心打开成展示柜，让史强看原件。
property_alignment: 1）心灵对应容器；2）女孩形象对应内藏物；3）描述对应展示窗口；4）撕开对应强行公开。
context_alignment: 前文面壁者以心为最后秘密，此刻罗辑却主动想让史强看见，反差显示其信任和欲望强度。
narrative_function: 把语言无力推到身体化极端，随后由史强改用经历细节而非抽象形容解决。
transfer_rule: 剖开心灵写表达冲动时，应明确要展示的具体内容、语言为何失效以及暴露代价。
failure_boundary: 心内没有可直接观看的完整图像，激烈撕裂也可能显得表演化；轻微误解不宜使用。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 罗辑急于把无法用语言描述的内心女孩形象直接展示给史强
vehicle: 撕开胸腔或心的外壳，让别人肉眼看见内部内容
ground: 1）内心形象对应藏在心内物；2）语言失败对应外壳遮挡；3）急躁表达对应用力撕开；4）史强理解对应直接观看；5）暴露私密对应身体敞开。
