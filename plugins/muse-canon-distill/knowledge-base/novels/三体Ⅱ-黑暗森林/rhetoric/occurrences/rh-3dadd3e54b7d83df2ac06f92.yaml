chapter: 正文
figure_type: simile
quote: 每一次回荡都像是什么东西远去了
sensory_mapping: 脚步回荡、声源退远、长廊拉长、最后消音
context_fact: 罗辑梦见自己独行无尽卢浮宫，五年孤独重新出现，醒来后发现庄颜和孩子已被带走。
image_mechanism: 本应返回耳边的回声改向远处移动，每一次反射都带走一点陪伴，长廊由声音衰减不断延伸。
property_alignment: 1）回声对应远去者脚步；2）衰减对应距离增加；3）无尽厅堂对应分离空间；4）停止迈步对应阻止离去。
context_alignment: 卢浮宫曾是爱情开始处，梦中脚步只剩罗辑一人，回声把幸福回忆反转成离别预警。
narrative_function: 在醒来前用听觉预演家庭消失，使“梦境变成现实”具有连续过渡。
transfer_rule: 回声写离去时应利用每次反射更弱、更迟的物理特征，并让人物对继续发声产生恐惧。
failure_boundary: 回声来自自己的脚步，并无实体离者；繁杂混响或逐渐增强的回声不支持单向远去。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑梦中孤独脚步的回声逐次衰减时带来的失去妻儿预感
vehicle: 某个重要存在沿空旷厅堂越走越远、声音和距离不断拉开
ground: 1）回声渐弱对应离者远去；2）每次重复对应连续脚步；3）空厅无人对应关系离场；4）不敢再迈步对应害怕继续失去；5）梦后妻儿不在对应预感成真。
