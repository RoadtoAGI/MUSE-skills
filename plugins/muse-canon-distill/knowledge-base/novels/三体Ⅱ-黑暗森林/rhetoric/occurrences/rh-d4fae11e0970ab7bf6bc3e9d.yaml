tenor: 高烧、颤抖、体力耗尽的罗辑正以最后生命维持即将启动的威慑行动
vehicle: 油已烧尽的灯芯失去外部燃料，只能焦灼自身纤维，火光短暂维持后必然熄灭
ground: 1）生命体力对应灯油；2）身体对应灯芯；3）高烧对应燃烧；4）自我消耗对应烧芯；5）死亡临近对应油尽灯灭。
