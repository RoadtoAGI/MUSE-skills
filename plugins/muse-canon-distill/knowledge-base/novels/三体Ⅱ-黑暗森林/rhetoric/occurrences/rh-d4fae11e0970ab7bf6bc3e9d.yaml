quote: 他的身体像一根油尽的灯芯，在自己燃烧自己了
sensory_mapping: 罗辑的体力像灯油耗空，高烧火焰贴着最后一截灯芯啃噬，颤抖中只剩一点将熄的光
context_fact: 他淋雨一夜并发高烧，牙齿剧烈打颤，知道该用生命监测器向三体发出最后通牒。
image_mechanism: 生命余额被分成燃料和载体；油尽后继续行动不再消耗储备，而是直接烧毁身体本身。
property_alignment: 1）储存体力对应灯油；2）肉身对应灯芯；3）发热对应火焰；4）最后行动对应余燃；5）预期自杀对应熄灭。
context_alignment: 此前红围巾像火苗、世界将被火化，灯芯把宏大火意象收回罗辑身体，精确标出他的剩余时间。
narrative_function: 将身体虚弱转成可计时的最后燃烧，为他以心跳倒数和死亡触发威慑提供生命倒计时。
transfer_rule: 人物作油尽灯芯时，应分别对应燃料储备、承载身体、燃烧症状和熄灭条件，突出余燃的自损。
failure_boundary: 高烧不是实际燃烧，休息救治可能恢复；灯芯的必然熄灭不能当作罗辑医学预后。
