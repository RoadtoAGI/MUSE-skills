chapter: 正文
figure_type: metaphor
quote: 空气凝固了，会场上除雷迪亚兹之外的所有人都呆若木鸡
sensory_mapping: 空气结晶、所有身形定格、木眼僵看、独一人仍在微笑
context_fact: 雷迪亚兹突然透露维持信号发往纽约某处，代表不知道断信号会引爆什么或杀多少人。
image_mechanism: 恐惧同时夺走介质流动和人的生命感，会场像被瞬间制成冻结标本，雷迪亚兹因此显得掌握时间开关。
property_alignment: 1）空气对应可凝固液体；2）会场动作对应流动；3）震惊对应降温；4）代表对应木鸡；5）静默僵直对应雕件状态；6）威胁者对应未被冻结者。
context_alignment: 消息是突然且无法验证的即时死亡威胁，身体先于讨论停止；复合图景准确表现群体震慑而不需心理说明。
narrative_function: 给骗局制造真实恐怖效力，让雷迪亚兹只凭一句话便取得会场控制权。
transfer_rule: 群体震惊作冻结定格时，应设置突发触发、全场同步停顿和一个仍可行动的控制中心。
failure_boundary: 空气物态没有改变，代表仍在呼吸思考并很快发问；木鸡只描写短暂姿态。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 得知手表信号正发向纽约后，与会者因可能立即发生大规模爆炸而瞬间停止动作和语言
vehicle: 一个流动空间骤然冻结成固体，其中活人也变成僵直、无反应的木制鸡形摆件
ground: 1）会场气氛对应空气介质；2）恐惧骤发对应冻结；3）众人静止对应木雕不动；4）表情僵硬对应木鸡呆滞；5）雷迪亚兹仍行动对应冻结画面中唯一活物；6）时间仿佛停顿对应凝固。
