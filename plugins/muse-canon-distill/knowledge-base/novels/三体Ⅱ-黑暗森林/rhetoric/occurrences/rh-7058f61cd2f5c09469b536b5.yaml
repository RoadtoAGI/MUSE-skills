quote: 中国的高储蓄率是一颗大地雷
sensory_mapping: 爆炸、潜伏、触发过程
context_fact: 银行冻结存款后多地挤兑并发生踩踏，杨晋文把原因归结为居民高度依赖储蓄。
image_mechanism: 把宏观金融结构埋进社会地面，平时不可见，一旦危机踩中便把个体取款动作连成突然爆发的公共灾害。
property_alignment: 1）长期结构性风险对应埋雷；2）政策与恐慌对应踩中引信；3）群体挤兑对应爆炸；4）波及无辜对应地雷范围伤害。
context_alignment: 三位老人正谈自己被冻结的存款，地雷把抽象经济机制连接到战争时期的危险词汇，也符合老杨爱谈宏观问题的声音。
narrative_function: 用民间可懂的风险模型解释挤兑，把末日危机如何引爆既有社会脆弱点具体化。
transfer_rule: 用爆炸物写系统风险时，应明确风险如何潜伏、何事触发、能量怎样扩散到群体结果。
failure_boundary: 储蓄本身并非必然有害，只有低保障、信心崩塌和集中挤兑共同出现时地雷机制才成立。
