chapter: 正文
figure_type: analogy
quote: 战舰就像是舰长身体的一部分
sensory_mapping: 舰长发念、系统传导、巨舰举动、武器如肢体伸展
context_fact: 钢印族审查重点是179艘集中型战舰，其舰长可单独起航、改向并使用武器，失败主义者可能直接逃亡。
image_mechanism: 复杂组织链被缩短成神经反射，千人巨舰不再是需协调的机构，而像舰长意志可直接驱动的一副外扩身体。
property_alignment: 1）舰长意识对应大脑意志；2）中央计算机对应神经网络；3）推进器对应腿脚；4）武器对应手臂；5）舰体对应躯干；6）自动执行对应反射动作。
context_alignment: 类比精确解释同一思想钢印为何在集中型系统更危险：一个人的信念可以像抬手一样直接改变全舰命运。
narrative_function: 把制度权限风险转成身体直觉，为章北海随后夺舰逃亡建立技术可信度。
transfer_rule: 组织或机器作身体延伸时，应对齐决策中枢、传导通道、执行器和反馈，并检查是否真的绕过多人制衡。
failure_boundary: 战舰仍由大量乘员维护，舰长也受程序与制度限制；机器故障和通信延迟不同于健康身体。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 集中型指挥战舰把起航、航向、速度和大量武器直接交给舰长个人控制，命令几乎无需经他人执行
vehicle: 人的肢体器官由神经系统直接支配，意念可迅速变成动作并与主体承担共同后果
ground: 1）舰长对应大脑；2）计算机指挥系统对应神经；3）战舰对应身体；4）引擎武器对应肢体器官；5）命令自动执行对应神经冲动直达；6）单人权限对应身体自主控制。
