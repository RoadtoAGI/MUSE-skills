context_fact: 车驶出森林进入草原雪山地带，庄颜想到美丽世界未来无人观看而流露忧郁。
image_mechanism: 地景删去森林的繁复线条，只留两块干净色面；这些色面拼成庄颜的气质肖像，远山阴影成为她眼里的忧色。
property_alignment: 1）自然景色对应庄颜；2）银白嫩绿对应清纯；3）简洁构图对应单纯性情；4）阴影静寂对应忧郁。
context_alignment: 比较紧扣道路上连续发生的景观简化与庄颜表情变化，体现罗辑用艺术构图观看爱人的主观习惯。
narrative_function: 把庄颜与其珍爱的自然合一，为她提出共存愿望和雪地告白准备纯净背景。
transfer_rule: 环境像人物的类比要列出色彩、结构和情绪气候的多重对应，并承认其来自特定观察者。
failure_boundary: 自然景观远比单个人复杂，忧郁只是一瞬；若缺少罗辑主观限定，类比会把人物本质化。
