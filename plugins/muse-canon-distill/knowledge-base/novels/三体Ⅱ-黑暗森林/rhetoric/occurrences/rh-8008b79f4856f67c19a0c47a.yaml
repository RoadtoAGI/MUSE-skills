tenor: 罗辑成为面壁者后的两百年含冬眠与少量关键事件，主观记忆压缩成短暂连续的一段
vehicle: 昨天的一天时间短、事件仍近且边界清楚，可迅速从早到晚整体回想
ground: 1）两百年经历对应一天；2）冬眠空白对应夜间跳过；3）关键事件密集对应日程紧凑；4）记忆接近对应昨天；5）快速倒放对应回忆一日。
