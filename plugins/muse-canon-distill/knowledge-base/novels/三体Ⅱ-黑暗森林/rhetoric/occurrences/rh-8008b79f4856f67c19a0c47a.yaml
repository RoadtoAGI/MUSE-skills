chapter: 正文
figure_type: simile
quote: 这部分人生虽然跨越了两个世纪，但在感觉上紧凑而致密，像是昨天的一天
sensory_mapping: 两百年时间被折叠进昨日、冬眠空段消失、爱情与危机像一天内连续发生、回忆一翻即过
context_fact: 等待预期死亡时，罗辑回放人生，把成为面壁者后的部分迅速倒过。
image_mechanism: 客观世纪尺度与主观记忆密度发生压缩，‘昨天’同时表达短和近，解释跨时人生为何不像漫长历史。
property_alignment: 1）世纪时长对应一日；2）事件密度对应紧凑日程；3）记忆鲜明对应昨日感；4）冬眠对应被删时段。
context_alignment: 罗辑正重新走过两百年前公路，空间未变使世纪像昨日；时间折叠贴合冬眠者体验。
narrative_function: 快速跳过面壁人生，为更早的普通人生记忆空白和童年沙滩留出焦点。
transfer_rule: 漫长人生作一日时，应解释哪些空档被删除、哪些事件压密、为何仍有昨日亲近感。
failure_boundary: 两百年对世界历史仍产生巨大变化，亲友也真实衰老死亡；主观一天感不能抹去外部时间。
