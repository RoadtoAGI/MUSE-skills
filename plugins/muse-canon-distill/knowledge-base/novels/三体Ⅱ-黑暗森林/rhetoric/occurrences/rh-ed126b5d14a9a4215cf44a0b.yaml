chapter: 正文
figure_type: simile
quote: 就如同枪口顶着目标开枪一样
sensory_mapping: 枪口贴面、零距击发、弹速未减、瞬间贯穿
context_fact: 太空无空气阻力且几乎无重力干扰，章北海使用普通手枪远距离射击，子弹飞行约十秒。
image_mechanism: 十公里距离在速度维度被折叠为零，弹头虽然长途飞行，抵达时仍像刚离开贴在目标身边的枪口。
property_alignment: 1）太空远射对应贴身射击；2）零阻力对应零距离；3）末速度对应初速度；4）航天服目标对应枪口前目标。
context_alignment: 类比直接解释反常物理：距离极远却不削弱杀伤，并与前文枪械太空射击说明闭合。
narrative_function: 让读者理解普通手枪为何能完成十公里暗杀，为随后航天服破裂提供因果支撑。
transfer_rule: 远程效果作零距离，应明确哪种损耗变量被环境取消，并只迁移与该变量有关的效果。
failure_boundary: 瞄准误差、目标漂移和弹头稳定仍随距离累积，远射并不在所有方面等同枪口顶射。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 陨石子弹在真空中飞行十公里仍保持枪口初速度，击中目标时具有近距离射击的动能效果
vehicle: 枪口直接抵住人体开火，弹丸未经空气减速便立刻撞击目标
ground: 1）真空零阻力对应无飞行损耗；2）十公里末速度对应枪口初速；3）目标中弹对应贴身命中；4）杀伤力保持对应近射冲击。
