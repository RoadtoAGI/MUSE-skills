chapter: 正文
figure_type: metaphor
quote: 才把自己那比金子还贵重的悲哀给了她一点儿
sensory_mapping: 金色重量、小份切取、掌中占有、吝啬递出
context_fact: 确认车祸与女伴无关后，罗辑才真正悲伤，并痛骂自己此前只顾恐惧和开脱。
image_mechanism: 情感被铸成私人金块，罗辑像守财者衡量成本，死者只获一小屑；自责因此具备可见吝啬。
property_alignment: 1）悲哀对应黄金；2）情感能力对应财富；3）给予哀悼对应支付；4）一点儿对应碎金。
context_alignment: 这是罗辑自我谴责的内心话，夸张贵价精准刺中其自私：他把最低限度同情也当成昂贵支出。
narrative_function: 揭露罗辑玩世不恭背后的情感贫乏，为随后唯一一次“金色爱情”作反向铺垫。
transfer_rule: 用财富写情感分配时，应明确稀缺观念、持有者、接受者和给付比例，让价值判断落到关系行为。
failure_boundary: 悲哀不能用市场价格衡量，情感少也不总源于吝啬；若人物麻木来自创伤，金钱框架会苛刻失真。
quality_assessment: exemplary
