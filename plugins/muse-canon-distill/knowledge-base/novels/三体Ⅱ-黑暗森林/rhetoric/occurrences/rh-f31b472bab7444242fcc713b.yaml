tenor: 罗辑迟到、稀少且被他吝啬分配给死去女伴的悲哀
vehicle: 价值昂贵、总量有限并由持有者按份额给出的黄金
ground: 1）悲哀稀少对应贵金属稀缺；2）罗辑珍惜自我情绪对应给黄金般吝啬；3）只给一点对应小额分配；4）死亡本应获更多对应价值交换失衡。
