chapter: 正文
figure_type: metaphor
quote: 人类的面壁计划将建立起一个或几个对你们来说极其诡异和险恶的迷宫
sensory_mapping: 空间路径、方向、遮蔽、威胁
context_fact: 三体人能用智子看到外部行动，却无法读取人类思想；ETO提出担任破壁人帮助识破计划。
image_mechanism: 将战略推断变成空间导航：每项可见行动都是通道，假象产生岔口，藏在脑中的真实意图占据看不见的出口。
property_alignment: 1）行动线索对应通道；2）欺骗与伪装对应假路；3）最终战略对应出口；4）破壁分析对应绘制路线。
context_alignment: “迷宫”紧接蛇意象后出现，把三体人的恐惧从单个危险对象扩展为无法导航的人类思维结构。
narrative_function: 用一幅可操作图景定义面壁与破壁的对抗方式，为后续四组战略悬念建立阅读模型。
transfer_rule: 用迷宫表示策略时，应明确可见线索、误导分支、隐藏目标与解谜者的动作，让意象能够预测后续对抗。
failure_boundary: 若计划只是保密而没有多重误导路径，迷宫会夸大复杂度；迷宫结构也不能保证唯一正确出口存在。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 面壁者把真实战略隐藏在思想中、让三体人难以识破的计划结构
vehicle: 入口可见、路线曲折且出口被遮蔽的险恶迷宫
ground: 1）公开行动可能通向多种意图对应岔路；2）真实目标藏在思想中对应出口不可见；3）三体人需逐步推断对应在迷宫寻路；4）走错解释会导致战略失败对应险路后果。
