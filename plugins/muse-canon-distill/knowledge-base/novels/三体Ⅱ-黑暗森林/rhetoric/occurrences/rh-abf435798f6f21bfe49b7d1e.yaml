chapter: 正文
figure_type: metaphor
quote: 你是个风清云淡的女孩儿
sensory_mapping: 清风、淡云、开阔晴空、轻柔流动
context_fact: 罗辑追问庄颜的梦想，列举个人画展和爱情，她说画只给自己看，也不认为自己追逐过什么。
image_mechanism: 人物内在被铺成一片低压消散的天空，欲望没有聚成乌云，情绪只以清风薄云轻轻经过。
property_alignment: 1）庄颜对应天气；2）低欲望对应云淡；3）平静对应风清；4）纯真对应晴朗；5）不追逐对应云不凝聚。
context_alignment: 庄颜持续用自然与国画理解世界，风云词汇符合雪山场景和罗辑眼中的含蓄审美。
narrative_function: 用一句天气速写概括她与罗辑资源逻辑的错位，并解释她为何难以提出享乐需求。
transfer_rule: 以天气写性格应分别选择风力、云量和能见度对应欲望、情绪与可读性，避免只借雅词。
failure_boundary: 庄颜长期忧伤且作出艰难选择，并非始终无风无云；该判断主要来自罗辑有限观察。
quality_assessment: effective
