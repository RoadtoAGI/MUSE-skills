tenor: 庄颜欲望少、不追逐名利、情绪与生活姿态轻盈平静的性格
vehicle: 清风徐来、薄云轻过而没有风暴压迫的晴朗天气
ground: 1）欲望少对应天空少云；2）情绪平和对应风势轻；3）不执著名利对应浮云不驻；4）气质纯净对应天色清；5）生活负担轻对应云层淡。
