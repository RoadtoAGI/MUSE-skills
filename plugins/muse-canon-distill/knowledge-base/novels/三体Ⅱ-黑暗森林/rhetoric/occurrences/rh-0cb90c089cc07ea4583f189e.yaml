tenor: 水滴减速发亮后以极快角速度从罗辑视野穿过夜空
vehicle: 流星短暂发光、迅速划出可追踪轨迹并在天际消失
ground: 1）推进亮光对应流星发光；2）高速横越对应划空；3）可见时间短对应瞬逝；4）消失在西天对应流星没入夜幕。
