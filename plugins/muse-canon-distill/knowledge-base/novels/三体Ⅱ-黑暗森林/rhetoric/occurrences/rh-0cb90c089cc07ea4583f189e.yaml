chapter: 正文
figure_type: simile
quote: 它像流星般划过夜空
sensory_mapping: 黑夜中一个亮点拖着速度感横切天幕，眼睛刚锁定便已滑入西方消失
context_fact: 记者提醒北半球水滴减速增亮，罗辑抬头后能凭其极快速度从暗空分辨目标。
image_mechanism: 陌生探测器的可见运动借熟悉天象获得轨迹、时长与亮度，使观测瞬间可预演。
property_alignment: 1）水滴亮点对应流星头部；2）视野位移对应流星划过；3）短时显现对应流星寿命；4）西天消失对应坠出视域。
context_alignment: 罗辑正以肉眼而非仪器观测，流星是普通观察者最直接的高速夜空经验，简洁服务紧张等待。
narrative_function: 把水滴由屏幕数据带入罗辑头顶真实天空，开启它封锁太阳的最后动作。
transfer_rule: 高速天体作流星时，应核对亮点、角速度、可见时长和消失方向，避免只借‘快’一项。
failure_boundary: 水滴受控减速并进入同步轨道，流星通常是大气烧蚀；类比不说明发光机理或最终坠落。
quality_assessment: effective
