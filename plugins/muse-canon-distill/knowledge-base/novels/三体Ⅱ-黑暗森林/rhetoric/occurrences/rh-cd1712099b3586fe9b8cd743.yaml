tenor: 三体游戏管理员没有可见身体、均匀覆盖虚拟世界的播报声
vehicle: 从整个天穹同时降下、没有单一点源的全域声音
ground: 1）声源不可见对应天空无具体嘴部；2）声音覆盖所有玩家对应天幕笼罩全地；3）方向难辨对应从四面上方传来；4）系统权限高于场景角色对应天空般全局层级。
