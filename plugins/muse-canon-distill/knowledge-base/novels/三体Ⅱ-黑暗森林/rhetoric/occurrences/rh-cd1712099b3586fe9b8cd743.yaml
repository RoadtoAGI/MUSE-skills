chapter: 正文
figure_type: simile
quote: 管理员的声音仿佛来自整个天空
sensory_mapping: 环绕声、天幕高度、无源回响、全域覆盖
context_fact: 虚拟三体世界一片漆黑，玩家要求管理员调出恒纪元，管理员以系统身份回答。
image_mechanism: 界面外的系统声铺展成整个穹顶，听者被包在声音之下，技术控制层由空间高度显现。
property_alignment: 1）管理员系统对应天空；2）播报对应天声；3）玩家对应地面听者；4）全局控制对应笼罩。
context_alignment: 三体游戏中太阳和时间都可由系统推进，管理员声音来自天空符合其对世界参数的上层位置。
narrative_function: 在黑暗中交代虚拟空间尺度，并区分管理员与扮演历史人物的普通玩家。
transfer_rule: 全域声音可用天穹承载，但要由无可见声源、环绕传播和说话者的系统层级共同支持。
failure_boundary: 录音扩声不等于超越场景的权威；有明确扬声器位置时，“整个天空”只会夸大声场。
quality_assessment: effective
