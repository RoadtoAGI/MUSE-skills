quote: 这个世界的一切都像一本摊开的书那样随时可供阅读
sensory_mapping: 摊页、文字、俯视阅读
context_fact: 联合国秘书长说明更多智子持续进入太阳系，三体世界能够观察地球的一切。
image_mechanism: 把全球活动压平为公开页面，秘密的空间深度消失，敌人的观察成为从容读字。
property_alignment: 1）世界信息对应文本；2）暴露对应摊开；3）三体人对应读者；4）实时监控对应随时翻阅。
context_alignment: 面壁计划正因透明监控而提出，书页意象直接解释为何只有不落文字的内心仍可藏匿。
narrative_function: 用日常阅读动作交代复杂监视设定，为“面壁”把秘密退守大脑建立逻辑起点。
transfer_rule: 以书比信息系统时，要明确谁写成内容、谁拥有阅读权、页面怎样开放以及尚有哪些内容不可见。
failure_boundary: 书页暗示稳定线性记录，智子监控却是动态且未必能理解所有行为；不能由可观察推出可准确解释。
