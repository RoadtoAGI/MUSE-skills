quote: 真是一群孩子
sensory_mapping: 成年人群体缩成绝望幼童、地球变成被噩梦包围的幼儿园、哭声笑声在城市蔓延
context_fact: 舰队毁灭影像传回后，现代官员哭泣、大笑、咆哮，各地群体精神崩溃迅速扩散。
image_mechanism: 技术成熟的人类被心理年龄降格，个人脆弱与世界空间在后文扩成同一幼儿园框架。
property_alignment: 1）公众对应幼儿；2）心理承受力对应儿童调节能力；3）地球社会对应园舍；4）战败记忆对应噩梦；5）失控传播对应集体哭闹。
context_alignment: 希恩斯先说‘孩子’，两行后叙述将其扩展为幼儿园，首处建卡并吸收延展，避免后文复指重复。
narrative_function: 解释未来人面对失败为何整体崩溃，并突出冬眠者的粗粝心理在危机中成为治理资源。
transfer_rule: 群体作幼儿园时，应从个体调节能力扩展到共同空间、触发噩梦和照护角色，形成连续框架。
failure_boundary: 现代人拥有成年知识和政治能力，崩溃是特定灾变反应；儿童化称谓可能遮蔽真实创伤。
quality_assessment: exemplary
