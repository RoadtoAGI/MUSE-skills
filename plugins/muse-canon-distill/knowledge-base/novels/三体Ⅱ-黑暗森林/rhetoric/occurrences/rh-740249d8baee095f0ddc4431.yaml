chapter: 正文
figure_type: simile
quote: 战舰仿佛顶着一个灿烂的华盖在飞行
sensory_mapping: 舰首撑起发亮圆盖、碎片在盖面连续开花、巨舰顶着华光穿过金属云
context_fact: 战舰高速飞行时防御系统拦截前方碎片，激光与碰撞光形成随舰移动的弧面。
image_mechanism: 功能性拦截屏被礼仪器物化，几何弧面与相对位置使防护同时显得华美和脆弱。
property_alignment: 1）防御火力弧面对应盖顶；2）舰体对应受盖者；3）爆闪对应装饰光；4）舰首固定距离对应伞架。
context_alignment: ‘华盖’通常标记尊贵，此处盖面不断漏过致命残骸，盛大舰队仅余徒具仪仗的防护。
narrative_function: 描绘高速碎片战的外观，并在下一句穿透事故前制造短暂、虚假的庇护感。
transfer_rule: 移动防护弧作华盖时，应匹配曲面、覆盖关系、同步运动和表面亮点，并揭示保护是否有效。
failure_boundary: 弧面由瞬时爆光构成，没有实体伞布；华盖不应被理解为战舰拥有礼仪身份或可靠遮蔽。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 高速逃逸战舰的前方防御系统不断击碎迎面残骸，形成贴着舰首移动的弧形光焰面
vehicle: 华丽仪仗伞盖架在人物头顶，弧面覆盖上方并随被护送者一起移动，表面装饰灿烂
ground: 1）弧形拦截面对应伞盖；2）战舰对应盖下人物；3）碎片光焰对应华饰；4）同步前进对应顶盖移动。
