chapter: 正文
figure_type: simile
quote: 那笑容已经留在记忆中，像冰上的水渍，永远擦不掉了。
sensory_mapping: 视觉、温度、表面痕迹
context_fact: 罗辑没有安排角色微笑，她却在想象中自行抬头对他笑，使他第一次感到角色脱离控制。
image_mechanism: 把瞬间表情滴到冰冷记忆表面，水随即冻结并成为表面的一部分，“留住”由主动保存变成不可逆相变。
property_alignment: 1）笑容瞬现对应水滴落下；2）记忆凝固对应结冰；3）无法忘记对应冻渍擦不掉。
context_alignment: 后文风雪、冰、火意象即将展开，这处冰渍既承接寒冷，也标出女孩从创作对象变成情感存在的转折。
narrative_function: 宣告虚构人物获得自主生命，并使罗辑对她的爱情从一次不可擦除的微小表情开始。
transfer_rule: 写记忆固着时，可选择包含“接触—相变—难以清除”过程的痕迹，而不只说印象深。
failure_boundary: 现实冰面上的水可再融化或刮除，“永远”是心理强度；若记忆后来轻易淡忘，相变机制会被破坏。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 虚构女孩第一次自行微笑后在罗辑意识中留下的牢固记忆
vehicle: 冻结在冰面、与冰结合而无法擦除的水渍
ground: 1）笑容突然附着记忆对应水落冰面；2）同为水质却界面难分对应想象与意识融为一体；3）冻结后不能擦去对应记忆永久固着。
