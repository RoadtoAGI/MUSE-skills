chapter: 正文
figure_type: simile
quote: 像是在遥望横亘在前面的漫漫岁月
sensory_mapping: 两千年时光铺成地平线、东方目光越过舱壁、漫长岁月像荒原横在航向前方
context_fact: 章北海拒绝四舰靠近以节省燃料，强调必须从长远考虑，东方重复其话并陷入茫然。
image_mechanism: 时间获得横向长度与阻挡感，‘考虑’变成眼睛试图穿越视距，未来的不可穷尽可被直观看见。
property_alignment: 1）时间跨度对应地形长度；2）舰队当下对应观察位置；3）历史不确定性对应远处朦胧；4）长期决策对应眺望。
context_alignment: 众人正朝未知恒星飞行，航向视觉与历史时间重合，符合星舰文明以距离计算未来的处境。
narrative_function: 从一次节省燃料的决定打开千年生存尺度，预示制度与代际问题即将压来。
transfer_rule: 时间作横亘景观时，应配置观察点、视距、路径阻力和未知远端，让角色目光承担规划动作。
failure_boundary: 岁月没有空间宽度或固定地形，未来也可能因决策改变，并非已经铺好的道路。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 东方延绪意识到星舰地球必须按千年尺度规划，茫然设想面前无法亲历尽头的漫长未来
vehicle: 旅人站在原地眺望一条横陈前方、延伸到视野之外的广阔地带或漫长道路
ground: 1）未来岁月对应横亘地形；2）当下对应眺望点；3）长期规划对应远望；4）未知历史对应视野尽头；5）茫然目光对应看不清远景。
