chapter: 正文
figure_type: simile
quote: 心中的幸福像湖面上的那片广阔的粼粼波光荡漾着
sensory_mapping: 广湖铺光、银点闪烁、水面起伏、亮纹扩散
context_fact: 罗辑与庄颜在雨后朝阳中眺望湖山，认定现实已找到想象中的美。
image_mechanism: 抽象幸福摊开成眼前整片湖面，心绪每一次起伏都折出新光点，亮纹向四周不停扩散。
property_alignment: 1）幸福对应波光；2）心境对应湖面；3）喜悦起伏对应水波；4）满足广度对应辽阔水域。
context_alignment: 人物正站在湖畔朝阳中，喻体可即时看见；外景亮度与内心强度同场重合，避免悬空抒情。
narrative_function: 把罗辑的私人幸福推至饱和，并与人类危机背景形成尖锐叙事张力。
transfer_rule: 水面喻写情绪应选定面积、明暗和波动各自对应的心理维度，并尽量取自角色眼前环境。
failure_boundary: 波光表现明亮扩散而非幸福的伦理正当性；若情绪沉静或痛苦，粼粼亮光会失配。
quality_assessment: exemplary
