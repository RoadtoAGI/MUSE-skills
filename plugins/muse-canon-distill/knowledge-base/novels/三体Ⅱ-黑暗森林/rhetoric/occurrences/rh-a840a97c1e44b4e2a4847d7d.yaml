quote: 它看上去像自己来自的那个时代孩子们玩的玻璃弹球
sensory_mapping: 巨型轨道武器缩成掌中透明弹珠，内部核弹像彩芯，球面转动着一粒小太阳
context_fact: 居委会主任来自二十一世纪，在墙上最大画面中第一次近看包膜氢弹的透明球体。
image_mechanism: 陌生未来武器被缩尺到童年手物，透明材质、内核和转动高光使识别不依赖技术知识。
property_alignment: 1）油膜球对应玻璃球壳；2）恒星氢弹对应弹珠内芯；3）太阳倒影对应亮斑；4）太空旋转对应手中滚动。
context_alignment: 喻体来自主任自己的时代记忆而非专家术语，符合非技术人物观看，并以童真反衬武器毁灭性。
narrative_function: 从普通居民视角重现雪地工程造物，给即将揭晓的威慑装置保留无害玩具外观。
transfer_rule: 复杂器物作童年玩具时，应对应轮廓、透明度、内部结构和运动高光，并让喻体属于观察者经历。
failure_boundary: 氢弹球体尺寸、功能和能量远超玻璃弹球；喻体不能弱化其危险或说明真实材料是玻璃。
quality_assessment: exemplary
