tenor: 包裹透明油膜物质、内部可见氢弹且缓慢旋转的球形太空武器
vehicle: 二十一世纪儿童手中的玻璃弹球，球面光滑透明，内部花纹可见，并在转动时映出小亮点
ground: 1）球体外形对应弹球；2）透明油膜对应玻璃；3）内部氢弹对应球内花纹；4）缓慢转动对应玩具滚转；5）小太阳反光对应玻璃高光。
