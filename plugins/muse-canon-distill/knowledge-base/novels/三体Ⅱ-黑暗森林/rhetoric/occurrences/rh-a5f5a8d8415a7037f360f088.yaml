quote: 感觉单人床是一条漂浮在玫瑰色海洋上的小船。
sensory_mapping: 运动、色彩、空间、触觉
context_fact: 罗辑彻夜经历想象中的风雪相会后睡得很好，清晨感到获得新生。
image_mechanism: 床从固定家具脱离地面，进入被暖色液体托举的缓慢漂浮，睡眠的安稳和爱情的包围同时成为身体感觉。
property_alignment: 1）床面对应用船体；2）安睡对应平稳漂浮；3）爱情氛围对应玫瑰色；4）私人梦境对应独航海域。
context_alignment: 前夜是白色风雪与火光，玫瑰色海洋把危险冷景转成温暖、无边的内在世界，准确表现情绪反转。
narrative_function: 为一夜心理转化提供晨间余韵，并与“尘封蜡烛被点燃”的觉醒形成柔与亮两种结果。
transfer_rule: 把床写成舟时，应由睡眠的承托、轻微运动和周围情绪介质共同组成，不只借“躺着”形似。
failure_boundary: 焦躁失眠、剧烈颠簸或现实海险不具备温柔漂浮感；玫瑰色是情绪染色，不代表真实环境。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 罗辑在爱情想象形成后安睡于单人床的轻盈、温暖与被包围感
vehicle: 漂浮在玫瑰色温柔海面上的一叶小船
ground: 1）床承托身体对应船承载乘客；2）睡眠轻柔起伏感对应漂浮；3）爱情使环境染上暖色对应玫瑰色海洋；4）单人私密空间对应独乘小船。
