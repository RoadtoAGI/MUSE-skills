chapter: 正文
figure_type: metaphor
quote: 任何时代，军人都需要忍辱负重
sensory_mapping: 羞辱刺身、责任压肩、背脊承重、脚步仍向前
context_fact: 东方延绪因自己作为舰长遭审查而打算辞职，章北海劝她把接受审查看作军人职责。
image_mechanism: 伦理压力获得身体重量，忍耐不是静态态度，而是带伤扛住负荷继续前进的动作。
property_alignment: 1）舰长职责对应重担；2）东方延绪对应负重军人；3）不被信任对应受辱；4）继续任职对应行路；5）自尊对应受压部位；6）军人传统对应耐力训练。
context_alignment: 章北海正要利用她留下并交权，庄重成语既符合旧军官声音，也带有策略性劝诱的双重含义。
narrative_function: 缩短两代军人的价值距离，促使东方继续履职，也展示章北海如何用共同传统取得信任。
transfer_rule: 责任作重担时，应把具体屈辱、承载者、行进目标和放下后果写清，避免只用重量泛指困难。
failure_boundary: 接受审查不必等同人格受辱，负重也不能要求个人无限忍受不公；章北海的劝说带有自身目的。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 军人面对审查、误解和不公时仍需克制个人感受，继续承担任务与组织责任
vehicle: 行路者忍受伤痛与羞辱，同时把沉重货物压在肩背上，坚持走完路程
ground: 1）职责对应重物；2）军人对应负重者；3）审查屈辱对应疼痛；4）服从克制对应忍耐；5）持续履职对应负重前行；6）辞职对应放下货物离路。
