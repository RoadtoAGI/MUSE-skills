tenor: 未来应用工程高度先进，但人工智能和基础科学仍没有跨过智子封锁，旧式身份识别继续存在
vehicle: 一层华丽遮盖物试图盖住下面静止、陈旧或受损的底层，却因裂缝和轮廓仍让真相显露
ground: 1）应用技术对应遮盖层；2）基础理论对应底层；3）技术奇观对应华丽表面；4）理论停滞对应未动旧物；5）旧身份识别对应裂缝；6）观察发现对应看穿遮盖。
