chapter: 正文
figure_type: simile
quote: 人类武器对水滴的攻击，如同海浪冲击礁石
sensory_mapping: 光束化成浪墙扑来、碰上银色礁石便碎散、攻击一波波退去、目标仍冷硬前行
context_fact: 多道伽马激光照亮水滴却未造成损伤，水滴随后完好穿透‘纳尔逊’号。
image_mechanism: 武器的高能威势被液化成自毁浪花，防御者与目标的强弱关系随碰撞结果翻转。
property_alignment: 1）激光齐射对应浪群；2）水滴材料对应岩体；3）反射光对应浪花飞溅；4）无结构损伤对应礁石稳定。
context_alignment: 水滴名含水，却在类比中占据礁石位置，人类武器反而成为水，词义倒置强化代差。
narrative_function: 用熟悉的无效冲击宣判所有现有武器失效，终止‘加强火力即可防御’的希望。
transfer_rule: 无效攻击作浪击礁时，应表现攻击反复、能量在接触面散失、目标稳定及角色位置的反转可能。
failure_boundary: 长期海蚀能改变礁石，武器也非柔软液体；此战时间短且材料差远大于自然岩水。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 激光、电磁炮等人类舰载武器持续击中水滴，却不能改变其结构、轨迹或攻击能力
vehicle: 海浪反复拍击坚硬礁石，水体撞散成泡沫并退去，礁石在短时尺度上岿然不动
ground: 1）武器能量对应海浪；2）水滴对应礁石；3）连续轰击对应拍岸；4）攻击消散对应浪花破碎；5）目标无损对应礁石不动。
