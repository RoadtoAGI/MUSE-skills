narrative_function: 显示三体人正在学习人类策略却仍有巨大短板，为破壁人组织留下暂时价值。
transfer_rule: 用年龄标定能力时，应列出该阶段已经掌握、仍无法完成和需要何种指导三项具体表现。
failure_boundary: 文明学习并不遵循儿童发育顺序；“五岁”只是技能成熟度刻度，不能推断三体人整体智力幼稚。
