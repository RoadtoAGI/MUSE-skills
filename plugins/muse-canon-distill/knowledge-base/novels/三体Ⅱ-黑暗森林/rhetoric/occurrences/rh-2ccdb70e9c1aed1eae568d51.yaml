tenor: 名义上的太阳系舰队联席会议位居最高层，却无法直接支配三大舰队，只能居中协调
vehicle: 传统联合国由主权成员组成，具有议事与协调平台地位，却缺少凌驾成员国的实权
ground: 1）三大舰队对应成员国；2）联席会议对应联合国；3）名义最高机构对应国际平台；4）统帅部掌权对应国家保留主权；5）协调功能对应议事协商；6）无实际权力对应不能强制执行。
