quote: 与联合国的情况一样，它只有协调功能，没有实际权力
sensory_mapping: 圆桌居中、成员各掌兵权、议案协调、权力停在席位之外
context_fact: 三大舰队组成名义太阳系舰队，但实际太空武装权力由各自统帅部掌握，联席会议承继PDC。
image_mechanism: 新制度被套入旧国际组织的权力骨架：上层名称宏大，真正命令仍停留在成员实体手中。
property_alignment: 1）舰队联席会议对应联合国；2）三大统帅部对应主权国家政府；3）联合决议对应国际协商；4）军事控制权对应国家主权；5）最高称号对应名义权威。
context_alignment: 听者熟悉联合国和PDC，类比以制度功能而非外观对应，立即澄清‘最高指挥机构’为何并不真正指挥。
narrative_function: 消除未来政治称谓造成的误读，为随后听证会中各舰队代表的自主立场提供制度背景。
transfer_rule: 制度类比应对齐成员结构、授权边界、决策方式和执行能力，尤其解释名义层级与实权位置的分离。
failure_boundary: 舰队联席会议仍可能拥有特定军事协调权限，历史联合国机构也并非完全无权；类比是概括。
