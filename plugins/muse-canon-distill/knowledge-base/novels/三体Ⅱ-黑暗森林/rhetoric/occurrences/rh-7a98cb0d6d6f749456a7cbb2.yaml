chapter: 正文
figure_type: simile
quote: 黑暗在寂静中变得如沥青般黏稠，把夜空和沙漠糊成一体
sensory_mapping: 黑暗从空气凝成温厚沥青，缓慢漫过地平线，把天空与沙粒粘成一块不透光黑面
context_fact: 猜疑链推演已逼出唯一选择，两颗烟火熄灭，无风黑夜中史强沉默很久才说出一个字。
image_mechanism: 视觉缺光跨感官转成触觉黏度，沉默时间仿佛让空气凝固，抽象结论的压迫成为身体难以移动。
property_alignment: 1）黑夜对应黑色材料；2）寂静停顿对应流动缓慢；3）天地暗合对应涂糊粘连；4）心理压迫对应黏身阻力。
context_alignment: 二人坐在真实沙地且烟火刚灭，沥青的工业黑与黏性比诗性夜色更符合史强即将爆粗的沉重语气。
narrative_function: 把推理结论凝成感官环境，在‘操’字出现前制造全书最黏重的停顿，并为黑暗森林命名蓄势。
transfer_rule: 黑暗作黏稠物时，应同时匹配颜色、流动性、覆盖边界和身体阻力，让通感服务节奏。
failure_boundary: 空气没有沥青黏度，天地也未物理粘合；若场景仍有快速动作或清晰光线，此喻会与感知冲突。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 两支烟熄灭后无光无风的沙漠夜色浓重到边界消失，并承载黑暗森林结论前的窒息停顿
vehicle: 黑色沥青浓厚、黏滞且能涂糊表面，把原本分开的物体粘连成不透光整体
ground: 1）夜色黑度对应沥青颜色；2）沉静阻滞对应黏稠；3）天地点线消失对应糊合；4）难以脱身的压迫对应黏附。
