chapter: 正文
figure_type: simile
quote: 白色的球形舱壁像蜡一样消融了
sensory_mapping: 白壁软退、边缘化开、球壳消失、星空从后方显现
context_fact: 东方延绪打开舱室全景影像，‘自然选择’号在视觉上消失，两人仿佛直接悬浮于银河星海。
image_mechanism: 数字透明不是硬切换，墙体像白蜡从视野中渐融，实体阻隔被连续相变抹除，后方宇宙随之渗入。
property_alignment: 1）白色舱壁对应蜡；2）全景显示启动对应加热；3）不透明表面对应固态；4）透明化对应融化；5）舱界消失对应蜡体流失；6）太空画面对应被遮背景。
context_alignment: 前文把球舱比作白乒乓球，本句让这一白壳以同色材料融掉，视觉转换连贯且具有触感。
narrative_function: 把技术界面切换写成物质相变，使两人从封闭舱室进入宇宙独存感的过渡柔和而震撼。
transfer_rule: 界面边界作融化时，应描述颜色、形状、消失顺序和后景显露，让视觉状态变化具有连续过程。
failure_boundary: 舱壁仍物理存在且维持气密，只是显示覆盖；没有热、液滴或结构强度下降。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 球舱启动全景显示后，原本连续洁白的实体边界由局部到整体变透明、退出视野
vehicle: 蜡受热后从固态边缘软化、流失并逐渐不再保持原有形体
ground: 1）舱壁对应蜡体；2）显示渐开对应受热；3）白色材质对应白蜡；4）边界消失对应蜡融化；5）球舱形状退去对应固体失形；6）太空显露对应蜡后景物露出。
