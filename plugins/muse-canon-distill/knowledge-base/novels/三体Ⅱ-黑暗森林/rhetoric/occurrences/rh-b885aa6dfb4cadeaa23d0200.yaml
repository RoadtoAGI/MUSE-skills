quote: 罗辑像要给史强跪下似的
sensory_mapping: 屈膝、俯身、仰望、礼拜
context_fact: 史强准确推断女孩家庭、衣着和身材，罗辑连连确认并称其福尔摩斯再世。
image_mechanism: 心理佩服向下压低罗辑身体，双方普通坐谈瞬间变成弟子拜见神探。
property_alignment: 1）罗辑对应跪拜者；2）史强对应高人；3）佩服对应俯身；4）推断命中对应受礼依据。
context_alignment: 罗辑情绪已高度亢奋，夸张姿态与口语“五体投地”相互强化，符合其失控兴奋。
narrative_function: 确认史强已赢得寻找任务的绝对信任，推动画像生成。
transfer_rule: 跪拜喻用于折服时，应由连续命中或重大帮助支撑，并让人物语言或姿态已有下沉趋势。
failure_boundary: 罗辑并未真的跪下，崇拜也不证明史强判断全部正确；正式关系中使用会显得谄媚。
