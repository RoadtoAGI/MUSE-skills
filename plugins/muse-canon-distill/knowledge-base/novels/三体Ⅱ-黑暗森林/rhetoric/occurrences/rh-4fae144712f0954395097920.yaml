chapter: 正文
figure_type: simile
quote: 就像在等着他们一样
sensory_mapping: 科研道路、前方守敌、先行者受阻、后来者逼近
context_fact: 量子、生物分子和非冯计算路线先后失败；希恩斯认为量子层面的思维研究也离不开被锁死的物理。
image_mechanism: 不可见的实验限制获得位置和意志，智子不必追赶科学家，只需站在所有前沿道路尽头逐一等人撞上。
property_alignment: 1）智子对应守候者；2）研究者对应行路者；3）学科前沿对应道路前方；4）理论极限对应相遇点；5）项目失败对应被截停。
context_alignment: 常伟思刚说智子挡在所有路上，希恩斯顺着同一空间框架把自己的未来也纳入，形成自觉而无奈的角色语气。
narrative_function: 说明主计划的上限，并把思想钢印定位为抵达物理墙前意外获得的副产品。
transfer_rule: 障碍作守候者时，应让多条进程共享前方节点，并通过先行者遭遇证明后来者的预期。
failure_boundary: 智子并无逐个等待的心理动作，不同研究路线也可能绕开基础物理；比喻表达预判而非必然结局。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 希恩斯预见自己的脑科学研究继续深入后，也会遭遇智子对基础物理的封锁
vehicle: 智子像守在道路前方的拦截者，已经等候并阻断先到的研究者，也等待他抵达
ground: 1）研究进程对应行路；2）希恩斯对应后来行者；3）其他项目对应先到者；4）智子障碍对应前方拦截者；5）遭遇封锁对应走到等待点。
