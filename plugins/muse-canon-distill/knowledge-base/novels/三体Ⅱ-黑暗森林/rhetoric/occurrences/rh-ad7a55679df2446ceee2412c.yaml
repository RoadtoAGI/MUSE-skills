chapter: 正文
figure_type: simile
quote: 这楼上怎么空荡荡的，像个……陵园似的。
sensory_mapping: 听觉、空间空缺、死亡氛围
context_fact: 张援朝退休第一天留在家中，邻居解释其他住户仍在上班。
image_mechanism: 把普通的白日空楼瞬间降到生命缺席的极端空间，“陵园”让无声与无人同时带上退休后的被遗弃感。
property_alignment: 1）空楼无住户对应陵园无活人；2）楼道静默对应墓园肃静；3）封闭住户门对应一排不可交流的墓位。
context_alignment: 话从刚退休、又受末日消息冲击的老人嘴里说出，停顿号显示他也意识到这个联想过重，却正符合此刻死亡意识。
narrative_function: 把退休孤独与人类灭绝恐惧叠合，使宏大危机进入住宅楼的日常声场。
transfer_rule: 用场所比拟场所时，应让声音密度、人员活动和人物处境同时变化，才能超出单纯“很安静”。
failure_boundary: 仅在短暂无人的普通楼道里使用陵园容易过度；缺少老人、退休或死亡焦虑语境时会显得矫饰。
