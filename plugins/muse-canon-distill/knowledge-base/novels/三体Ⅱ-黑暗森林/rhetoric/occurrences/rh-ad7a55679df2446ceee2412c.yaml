tenor: 工作日白天住户离开后空荡安静的住宅楼层
vehicle: 少见活人、以死者位置为主体的陵园
ground: 1）楼道无人对应陵园少有活动者；2）空荡安静对应墓地寂静；3）张援朝退休后被留在空楼对应与日常社会暂时脱离。
