chapter: 正文
figure_type: simile
quote: 面对着银河系迷雾般的星海
sensory_mapping: 星点聚雾、光带弥散、深处模糊、宇宙如雾海包围
context_fact: 舱壁视觉消失后，章北海和东方延绪直接面对全景银河，四周没有任何飞船结构可见。
image_mechanism: 离散星点在巨大数量和距离中失去颗粒边界，聚成可包围人的光雾；宇宙空旷反而呈现介质般浓度。
property_alignment: 1）恒星对应雾滴；2）银河光带对应雾层；3）空间深度对应雾中纵深；4）远星模糊对应散射；5）全景星空对应雾海环境。
context_alignment: 人物失去舱壁参照后需要一种包围性介质，迷雾既描摹银河外观，也加强方向与归属消失的体验。
narrative_function: 把无际真空写成有质感的朦胧背景，为两个人独立存在的哲学感受提供视觉场。
transfer_rule: 密集星域作雾时，应对齐微小单元聚集、边界弥散、深度遮蔽和包围感，而非只借‘朦胧’一词。
failure_boundary: 星际空间极度稀薄，恒星彼此遥远且不会像雾滴散射近处光；这是远观视觉整合。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 全景显示中银河密集星光汇成边界朦胧、层次深远的巨大光带与星域
vehicle: 大范围雾气由无数细小水滴聚成，轮廓弥散、遮蔽深处并在光中呈现层层明暗
ground: 1）无数恒星对应雾滴；2）密集星光对应雾的连续亮面；3）银河边缘朦胧对应雾界弥散；4）深度难辨对应雾中遮蔽；5）广阔星域对应雾海。
