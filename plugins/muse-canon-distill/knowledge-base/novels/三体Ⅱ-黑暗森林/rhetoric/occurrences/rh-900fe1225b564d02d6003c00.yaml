context_fact: ETO得知主第二次要求消灭罗辑，却不知道理由；爱因斯坦据其普通身份推测真正威胁来自他所代表之物。
image_mechanism: 罗辑个人被移到前台，背后空白处竖起不可见强者；三体的瞄准线穿过代理人，指向尚未被命名的宇宙力量。
property_alignment: 1）罗辑对应代言人；2）黑暗森林规律对应幕后力量；3）宇宙社会学思考对应传话行动；4）诛杀令对应对代表的打击。
context_alignment: 萨伊此前也要求罗辑寻找三体恐惧的原因，这个猜测用代理关系解释普通人为何承载超出个人能力的威胁。
narrative_function: 从ETO一侧加强罗辑秘密的重要性，同时保持幕后真相未揭的悬念。
transfer_rule: 人物作力量代言人时，应区分个人能力与背后机制，并给出敌手为何通过代表感知幕后者的证据。
failure_boundary: 罗辑并未受某个有意志实体委托，黑暗森林规律也不会发言；把自然规律人格化可能误导因果。
