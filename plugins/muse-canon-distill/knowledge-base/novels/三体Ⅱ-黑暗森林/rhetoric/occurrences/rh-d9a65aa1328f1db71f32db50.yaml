chapter: 正文
figure_type: simile
quote: 太空中飞散着暴雨般的爆炸碎片
sensory_mapping: 百万吨熔液碎成雨点、红热暴雨横扫黑空、传感器视野被雨幕填满、真正水滴隐入其中
context_fact: 每艘战舰熔化后产生巨量液态碎片，许多大小形状与水滴相当，图像系统因而无法识别攻击者。
image_mechanism: 爆炸碎片从离散弹道融合成雨幕，水滴这一专名也获得伪装机制：真正的‘一滴’藏进金属暴雨。
property_alignment: 1）熔融碎片对应雨滴；2）战舰爆炸对应雨云；3）飞散轨迹对应降雨；4）密集数量对应暴雨；5）监测图像对应雨中视野；6）探测器对应难辨的一滴。
context_alignment: 喻体既描写景象又解释系统失败，且与攻击者‘水滴’形成词义套叠，机制与命名高度贴合。
narrative_function: 说明水滴为何能在可见光监测中继续隐形，使屠杀从材料优势扩展为信息优势。
transfer_rule: 碎片群作暴雨时，应让粒子数量、速度、视线遮蔽和目标混入同时成立，使景象承担因果解释。
failure_boundary: 太空碎片沿三维惯性方向飞散，没有重力统一向下；金属液滴温度与破坏力远超雨水。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大量战舰爆炸后，数量巨大的熔融金属液滴从各个爆点高速密集飞过战场空间
vehicle: 暴雨由无数水滴密集、连续、从广阔天空高速落下，遮蔽视线并淹没单个目标
ground: 1）金属液滴对应雨滴；2）碎片数量对应暴雨密度；3）高速飞散对应急落；4）多爆点对应广阔雨云；5）传感器难辨对应雨幕遮挡；6）水滴混入对应一滴藏雨。
