tenor: 智子封锁基础物理实验，使人类沿既有科学发展方向无法继续突破
vehicle: 横截道路、由敌手竖立且无法直接穿越的实体高墙
ground: 1）科学发展对应道路；2）研究者对应行路者；3）智子干扰对应筑墙；4）基础物理封锁对应墙体阻断；5）技术极限对应抵达墙脚。
