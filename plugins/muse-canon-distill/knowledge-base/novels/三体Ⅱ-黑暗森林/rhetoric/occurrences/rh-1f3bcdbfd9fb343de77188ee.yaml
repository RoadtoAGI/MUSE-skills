chapter: 正文
figure_type: metaphor
quote: 罗辑的心被金色的爱情完全占据
sensory_mapping: 金光、室内充盈、空间占领、明亮覆盖
context_fact: 罗辑自问一生是否真正在乎过谁，随后回忆因白蓉要求而创造的想象女孩。
image_mechanism: 内心变成空室，爱情以金色洪流占领每个角落，把此前吝啬的“黄金悲哀”扩张成全域亮光。
property_alignment: 1）心灵对应领地；2）爱情对应占领者；3）完全投入对应全境占据；4）美好价值对应金色。
context_alignment: “金色”承接上一行自责中的贵金属价值，却从一点悲哀转为满心爱情，形成数量与色彩反差。
narrative_function: 给长回忆设定峰值，提示这段虚构爱情是罗辑生命中唯一一次情感全占。
transfer_rule: 占据隐喻写强情感时，应规定心理空间边界、进入方式、排除的其他内容和色彩价值。
failure_boundary: 爱情不应永久排除主体其他关系与责任；“占据”也可能暗含强迫，不能自动等同健康亲密。
