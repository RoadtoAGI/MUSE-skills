tenor: 罗辑曾有一次充满全部内心空间、被美化为珍贵明亮的爱情体验
vehicle: 金色物质或光芒进入并填满一座封闭空间
ground: 1）心对应可占据空间；2）爱情对应金色物质；3）投入彻底对应完全填满；4）珍贵理想化对应黄金色；5）其他关注退出对应空间被独占。
