chapter: 正文
figure_type: simile
quote: 就像毫无阻力地穿过一个影子
sensory_mapping: 银滴直入巨舰、钢铁忽然失去实体感、两枚圆洞贯通、水滴速度不变飞出
context_fact: 水滴离开螳螂号后攻击联合舰队第一艘战舰，在舰体留下直径与自身相当的贯穿孔。
image_mechanism: 强度差取消了百万吨舰体的物质性，‘影子’不是写水滴穿透艰难，而是写对手几乎不存在。
property_alignment: 1）无限边疆号对应影子；2）舰壳厚度对应无厚度暗形；3）水滴对应实物；4）高速轨迹对应穿过；5）零减速对应无阻；6）水滴无损对应影子不反作用。
context_alignment: 它兑现丁仪‘子弹穿奶酪’判断并进一步把舰船降到无物质影子，符合攻击的绝对不对称。
narrative_function: 以最简洁的阻力归零图像宣告战舰防御无意义，开启一分钟屠杀。
transfer_rule: 穿透作穿影时，应有可核验的零减速、零偏转、攻击者无损和被穿物完全失效。
failure_boundary: 巨舰有巨大质量并产生高温与爆炸，水滴仍发生物理相互作用；影子只描述相对阻力。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴以每秒三十公里撞入无限边疆号并贯穿百万吨舰体，自身速度和表面几乎不受影响
vehicle: 实体穿过没有质量、厚度和阻力的影子，轨迹不偏、速度不降，也不会被影子损伤
ground: 1）巨舰对应影子；2）水滴对应穿行实体；3）舰体阻力近零对应影子无质量；4）直线贯穿对应穿影；5）水滴无损对应不接触；6）舰体熔毁对应影子无法阻挡。
