chapter: 正文
figure_type: metaphor
quote: 她的眼睛充满清澈的阳光和活力
sensory_mapping: 双眼盛满日光、内部通透无影、明亮向外照射、青春生机被点亮
context_fact: 章北海首次见到‘自然选择’号年轻女舰长，她主动交枪并表示若有逃亡企图可被处决。
image_mechanism: 眼睛从反光器官变成盛光容器，内在性格因清澈光线看似完全可见，观察者也因此放下怀疑。
property_alignment: 1）东方延绪眼睛对应容器/窗口；2）坦荡对应清澈；3）活力对应日光热能；4）年轻气质对应晴日；5）没有失败主义对应无暗影；6）章北海信任对应看清内部。
context_alignment: 未来社会此前多次用阳光表现自信，这里阳光进入具体舰长眼睛，既延续时代气质，也暴露章北海以目光判断钢印族的局限。
narrative_function: 迅速建立东方延绪可信、明快的第一印象，为章北海稍后夺走她的战舰增加背叛重量。
transfer_rule: 眼睛盛光时，应把亮度、透明度、温度分别对应具体性格，并交代观察者为何由此做出判断。
failure_boundary: 目光清澈不能可靠证明政治信念或排除欺骗，阳光也不等于人格毫无阴影。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 东方延绪的目光显得坦率、明亮、年轻而富有生命力，使章北海直觉她没有隐藏失败主义
vehicle: 无云天空下清澈日光充满一个透明空间，照亮内部并滋养蓬勃生命
ground: 1）眼睛对应透明容器；2）目光明亮对应阳光；3）坦率对应清澈；4）生命力对应日照滋养；5）无隐藏对应无云无影；6）信任感对应受光看清。
