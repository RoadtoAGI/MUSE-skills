quote: 寒冷使他的思想锐利起来
sensory_mapping: 冷石磨刃、金属收紧、锋口发亮、切面清楚
context_fact: 罗辑在彻底入冬后仍长时间绕湖思考，逐渐从叶文洁的大段话中筛出两条公理。
image_mechanism: 低温不只作用皮肤，还像磨石贴住思维边缘，磨掉模糊毛刺，使概念获得能分割线索的锋口。
property_alignment: 1）罗辑思想对应刀具；2）寒冷对应磨石；3）杂乱话语对应材料；4）筛选公理对应切割；5）理解精度对应锋利度。
context_alignment: 自然寒冷与后文冰面、冰冷星点共同构成思考环境，‘锐利’解释他为何能从反复咀嚼进入结构识别。
narrative_function: 把身体不适转化为认知工具，推动苦思从停滞到接近突破。
transfer_rule: 思维作刃应说明它要区分或切开什么，环境刺激必须具体提高分辨率，而非笼统说人更聪明。
failure_boundary: 过度寒冷会降低认知并危及生命，罗辑后来落水即证明其危险；清醒感不保证结论正确。
