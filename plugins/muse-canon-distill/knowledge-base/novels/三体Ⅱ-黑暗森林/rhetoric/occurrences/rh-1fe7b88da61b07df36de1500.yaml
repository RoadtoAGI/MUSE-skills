tenor: 航母大小的金属靶船被激光短暂扫过后，半个船体迅速汽化消失
vehicle: 冰块受强热后轻易融化并蒸发，坚硬体积在短时间内缩去一半
ground: 1）钢铁靶船对应冰块；2）激光热量对应高温环境；3）金属汽化对应冰蒸发；4）半体消失对应冰块缩减；5）坚固感崩塌对应易融材料。
