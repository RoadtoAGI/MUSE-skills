chapter: 正文
figure_type: simile
quote: 那个大铁家伙就像冰块儿似的给蒸发了一半
sensory_mapping: 巨铁软退、半体化气、边缘白亮、体积骤失
context_fact: 亚洲舰队演习中，激光炮只扫一下航母大小靶船，就使一半蒸发、另一半化为钢水爆开。
image_mechanism: 庞大钢舰在武器尺度下被降格成低熔点冰块，材料强度的常识反转直接显示激光能量密度。
property_alignment: 1）金属舰体对应冰块；2）激光束对应热源；3）熔化汽化对应融冰蒸散；4）巨大尺寸对应大冰块；5）短时损毁对应易受热。
context_alignment: 大史以生活口吻复述电视画面，冰块让抽象激光参数变成厨房式相变，也保留他夸耀技术的粗朴声音。
narrative_function: 把未来武器威力转为人人可见的材质反转，强化人类必胜的错觉。
transfer_rule: 用易融材料写强材毁坏时，应先建立常规硬度，再由明确能量源造成相变，并描述体积损失。
failure_boundary: 钢铁汽化所需温度远高于水冰，过程伴随等离子体和爆炸；冰块不能说明激光作用细节。
