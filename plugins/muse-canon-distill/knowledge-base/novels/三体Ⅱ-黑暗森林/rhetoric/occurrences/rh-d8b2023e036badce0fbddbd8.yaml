quote: 被智子蒙住了眼腈
sensory_mapping: 智子像黑布覆上科学之眼、规律仍立在远处、实验视野全暗、物理学家伸手摸索
context_fact: 丁仪感叹智子让物理探索停滞，并尝试以规律永恒、无需被人知晓来宽慰自己。
image_mechanism: 知识封锁从制度与实验限制转为感官剥夺，‘看不见’把科学家的挫败落到身体经验。
property_alignment: 1）实验能力对应视觉；2）物理学家对应观看者；3）智子干扰对应遮眼物；4）未知规律对应遮挡后的景物。
context_alignment: 丁仪刚要近距离观察水滴，旧有‘蒙眼’将在显微镜前短暂揭开，时点形成反讽。
narrative_function: 交代他面对规律的私人伤口，并解释为何发现强互作用材料时反应最迅速也最绝望。
transfer_rule: 认知封锁作蒙眼时，应明确感官渠道、遮挡者、仍存在的对象和受阻后的行动后果。
failure_boundary: 智子没有阻断所有视觉或知识，人类仍可观察宏观现象；蒙眼不可等同科学完全停止。
