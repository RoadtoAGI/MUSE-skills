tenor: 智子封锁基础物理实验，使丁仪与人类科学无法观察更深层规律并继续验证理论
vehicle: 外力用布遮住人的双眼，视觉入口被封闭，眼前世界仍在却无法看见与辨路
ground: 1）科学观测对应眼睛；2）智子封锁对应蒙眼；3）自然规律对应可见景物；4）理论停滞对应失明迷路。
