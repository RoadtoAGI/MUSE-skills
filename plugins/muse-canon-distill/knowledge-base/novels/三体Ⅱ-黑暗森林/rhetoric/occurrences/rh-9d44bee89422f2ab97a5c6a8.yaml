chapter: 正文
figure_type: simile
quote: 只是很淡，隐隐约约，像过去的记忆
sensory_mapping: 空烟斗贴近鼻端、一丝旧味若有若无、记忆随气息浮起、转瞬散掉
context_fact: 未来已找不到烟斗烟丝，丁仪只能叼着从旧时代带来的空烟斗观看联合舰队。
image_mechanism: 记忆通常借气味被唤醒，此句反向让气味本身取得记忆的模糊度和时间损耗，两种残留互为尺度。
property_alignment: 1）残余烟味对应旧记忆；2）挥发变淡对应遗忘；3）偶尔闻见对应片段浮现；4）烟斗对应记忆载体；5）无烟丝对应无法重演；6）丁仪嗅闻对应回望过去。
context_alignment: 丁仪是旧时代遗民，即将在未来舰队中死亡；微弱烟味把个人过去置于两千太阳的刺眼现在旁，格外脆弱。
narrative_function: 在宏大编队描写中插入私人时间痕迹，使水滴接触前的丁仪带着可感的旧世界余味。
transfer_rule: 气味作记忆时，应利用挥发、残留、触发与不可复原四个性质，并让承载物确有时间跨度。
failure_boundary: 烟味是物质分子，记忆是心理活动；淡味不代表丁仪所有过去都模糊，也不能恢复具体事件。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 丁仪旧烟斗在两个世纪后仍残留极微弱、时有时无且难以抓住的烟草气味
vehicle: 久远经历在意识中只剩模糊碎片，偶尔浮现又迅速淡去，不能完整复原
ground: 1）淡烟味对应模糊记忆；2）两个世纪挥发对应年代消磨；3）隐约闻到对应偶然想起；4）气味残留对应记忆痕迹；5）无法补充烟丝对应过去不可复得；6）嗅觉触发对应回忆唤醒。
