quote: 自己所陷入的逻辑陷阱
sensory_mapping: 暗坑或夹具、落入、挣扎收紧、无法自拔
context_fact: 萨伊解释面壁者逻辑后，罗辑在默思室再次确认自己无论怎样都无法取消身份。
image_mechanism: 一条抽象推理链铺成伪装地面，身份一落脚机关便闭合；每次反证都被结构吞回成为新锁扣。
property_alignment: 1）面壁逻辑对应陷阱机关；2）罗辑对应落入者；3）拒绝对应挣扎；4）解释闭环对应收紧；5）退出对应自拔。
context_alignment: 他先称铁环和魔咒，此处“陷阱”突出进入前不可见、进入后才理解的认知时序。
narrative_function: 确认罗辑已停止幻想退出，推动其把注意力转向可滥用的权力。
transfer_rule: 陷阱写逻辑困境时，应说明诱发入口、自动机关、挣扎为何反增束缚以及可能的外部解除者。
failure_boundary: 法律制度仍可被集体修订，并非自然机关；“无法”是当前规则与信任结构下的判断。
quality_assessment: effective
