review_status: reviewed
tenor: 面壁者任何拒绝行为都会被解释为计划、因而无法退出的自证规则
vehicle: 脚一踏入便被机构夹住或困住、越挣扎越难脱身的陷阱
ground: 1）接受任命对应踏入；2）规则自动生效对应机关触发；3）拒绝被再解释对应挣扎收紧；4）不能自拔对应无法爬出；5）他人解释权对应布置陷阱者。
