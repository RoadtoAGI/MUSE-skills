chapter: 正文
figure_type: simile
quote: 置身其中仿佛处于一个大乒乓球里
sensory_mapping: 白色圆壳、弧壁包围、室内空无、方向感消失
context_fact: 现代巨舰取消固定功能舱，普通舱室都是规则球形；加速时任何一处舱壁才会变形为座椅。
image_mechanism: 复杂军舰房间被剥到最简单几何体，只剩一层白色薄壳包围人物，乒乓球的日常尺度被巨幅放大。
property_alignment: 1）舰舱对应乒乓球内部；2）白舱壁对应球壳；3）球面曲率对应圆球；4）无固定设施对应空白表面；5）无上下方位对应球体对称。
context_alignment: 喻体准确解释为何舱室没有传统前后上下，也与可在任意壁面生成座椅的功能设计相合。
narrative_function: 用一个极简日常物体迅速建立未来舰舱空间，让后续墙壁消融与全息太空效果更鲜明。
transfer_rule: 球形空间作球壳时，应对齐颜色、曲率、表面空白和方向对称，并通过尺度转换安置观察者。
failure_boundary: 舰舱壁厚、强度、设备和接口远超乒乓球，也不会脆裂弹跳；类比只覆盖内部观感。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 没有仪表家具、四壁连续洁白且呈规则球面的普通舰舱内部
vehicle: 一个放大到可容人的乒乓球空壳，内壁纯白、光滑、弧面连续且没有方向标志
ground: 1）球形舱对应乒乓球；2）白色舱壁对应白色球壳；3）内壁光滑对应球面平整；4）无仪表对应表面空白；5）尺度放大对应人处球内；6）失重无上下对应球体各向一致。
