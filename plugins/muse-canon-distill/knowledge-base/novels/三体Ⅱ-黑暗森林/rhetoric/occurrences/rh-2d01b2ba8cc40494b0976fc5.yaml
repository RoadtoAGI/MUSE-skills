chapter: 正文
figure_type: metaphor
quote: 寂静中仿佛能听到时间流过太空的声音
sensory_mapping: 所有声音停下、无形时间化成细流、流声穿过黑空、亿万人侧耳等待
context_fact: 机械臂用半小时收回水滴，舱门闭合后是目标最可能自毁的时刻，全世界保持静默。
image_mechanism: 等待把抽象时间放大到听觉阈值，寂静不再是无声，而成为让时间本身摩擦宇宙的收音环境。
property_alignment: 1）时间进展对应水流；2）太空对应流经空间；3）漫长半小时对应河程；4）集体寂静对应低噪；5）紧张感对应听觉放大；6）事件未发生对应只有流声。
context_alignment: 真空本不能传声，偏偏用‘听到’表现全球远距同步等待，使三个小时信息时滞下的共同紧张更超现实。
narrative_function: 把动作暂停转成可感的时间压力，在水滴暂时无事后延长灾难前最后一刻。
transfer_rule: 时间作可听流体时，应先建立极端静默和高敏等待，再让持续、不可停的微声承载秒数推进。
failure_boundary: 太空真空不传声，时间也不是物质流；听觉只是紧张者对静默的主观放大。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴被收入螳螂号后，舰队与地球在极长等待中完全安静，对每一秒经过都异常敏感
vehicle: 时间像有形河流穿过宇宙介质，流动摩擦产生细微而持续、平常被噪声遮住的声音
ground: 1）时间对应流水；2）等待进程对应流过；3）太空对应河道；4）绝对寂静对应能听微声；5）秒数推进对应水流连续；6）紧张专注对应倾听。
