quote: 其过程与小小的油滴在水面扩散成大片分子厚度的油膜相似
sensory_mapping: 一滴物质落下、薄层飞快铺开、面积成倍扩张、厚度降到几乎不可见
context_fact: 监测站计划用恒星型氢弹蒸发油膜矿，在探测器路径上造出直径二百万公里的人造尘埃云。
image_mechanism: 难以想象的真空扩散借厨房尺度的界面现象缩小，体积少而面积大的反常比例从一滴油的铺展中获得直觉。
property_alignment: 1）油膜矿对应油滴；2）爆炸加热对应滴入触发；3）真空扩散对应水面铺展；4）尘埃云对应油膜；5）纳米颗粒层对应分子薄层；6）大直径对应扩展面积。
context_alignment: 物质名称正来自这一机制类比，随后造云计划依赖它的高扩散性，喻体同时承担命名与工程解释。
narrative_function: 用熟悉小尺度现象解释为何四个球体能制造比太阳还大的云，为追踪方案建立可信物理直觉。
transfer_rule: 尺度扩散类比应保持质量少、覆盖大、厚度薄三项比例关系，并说明承载界面的差异。
failure_boundary: 太空没有液态水面，尘埃在三维真空扩散而油膜主要二维铺展；稳定机制也不完全相同。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 少量海王星油膜物质受热汽化后在真空中迅速扩散，并冷凝成覆盖极大范围的稀薄纳米尘埃
vehicle: 一小滴油落在水面后沿二维界面摊开，形成面积巨大而厚度接近单分子的薄膜
ground: 1）少量矿物对应油滴；2）太空对应水面；3）汽化扩散对应油摊开；4）大覆盖面积对应大片油膜；5）纳米尘埃稀薄对应分子级厚度；6）持续不散对应油膜稳定。
