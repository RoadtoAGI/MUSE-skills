quote: 加入某种介质形成冲击波，就像在手雷中放钢珠一样
sensory_mapping: 爆炸、钢珠飞散、高速撞击、径向冲击
context_fact: 艾伦指出真空核爆没有空气冲击波，雷迪亚兹提出给巨型核弹加入可被爆炸推动的介质。
image_mechanism: 看不见的辐射能先抓住一批有质量颗粒，再像手雷把钢珠喷出那样把能量变成密集撞击。
property_alignment: 1）核装置对应手雷；2）介质对应钢珠；3）核爆对应炸药爆炸；4）太空目标对应破片目标；5）力学打击对应钢珠撞击。
context_alignment: 雷迪亚兹是核能专业出身，工程类比直接针对“真空无冲击波”的机制缺口，符合其行动型思维。
narrative_function: 展示他并非只迷恋大当量，也能用简明机械模型提出具体武器改进。
transfer_rule: 工程类比应把能量源、耦合介质、运动方式和目标效应逐项对应，并用它提出可检验设计假说。
failure_boundary: 核爆尺度、介质质量和太空扩散远复杂于手雷，钢珠模型不证明方案可制造或有效；仍需计算耦合效率。
