chapter: 正文
figure_type: metaphor
quote: 把我的注意力牢牢拴往
sensory_mapping: 绳索、系结、拉力、活动半径
context_fact: 史强一路用谈话影响罗辑，罗辑指出其使命是防止自己乱想并顺利护送。
image_mechanism: 抽象注意力长出身体和逃逸方向，一条任务绳索骤然收紧，把它限制在安全半径。
property_alignment: 1）注意力对应被系物；2）话题对应绳；3）任务目标对应桩；4）分心对应挣脱。
context_alignment: 安保行动本就在控制罗辑的物理移动，拴注意力把同一控制延伸到心理层，符合他对史强意图的冷静识破。
narrative_function: 展示罗辑的洞察力，也说明护送者同时管理信息与情绪。
transfer_rule: 束缚隐喻写专注时，应标出注意力原本会去哪里、用什么内容系住、谁控制绳端以及允许多大活动范围。
failure_boundary: 注意力不是被动动物，强制聚焦可能引发反效果；正常兴趣驱动不宜写成拴缚。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 史强试图让罗辑持续关注某件事、停止向危险方向猜测
vehicle: 用绳索把会移动的动物或物件系在固定桩上
ground: 1）注意力会游移对应可移动对象；2）特定事项对应系绳桩；3）持续聚焦对应拴住不走；4）史强引导对应持绳人。
