tenor: 虚拟三体世界中连地平线都不可见的浓重夜色
vehicle: 浓黑不透光、会把放入其中的物体完全染没的墨汁
ground: 1）黑暗色泽对应墨黑；2）天地轮廓消失对应物体沉入液体；3）光线无法穿透对应墨汁不透明；4）荒原天空融为一体对应同液浸染。
