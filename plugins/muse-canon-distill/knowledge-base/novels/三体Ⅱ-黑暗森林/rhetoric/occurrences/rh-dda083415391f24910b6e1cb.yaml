quote: 一切都沉浸在墨汁般的黑暗里
sensory_mapping: 浓黑液体、浸没、边界消失、黏稠视觉
context_fact: ETO在三体游戏中开会，世界尚处乱纪元深夜，只见稀疏星光。
image_mechanism: 空气被灌成一缸墨，荒原与天空同时下沉，黑色从背景变成有体积的包围介质。
property_alignment: 1）夜色对应墨汁；2）世界万物对应浸入物；3）轮廓消失对应染没；4）星光稀疏对应墨面微小亮点。
context_alignment: 虚拟环境可以随系统切换昼夜，墨汁般全黑为随后管理员快速调出太阳提供强烈明暗底板。
narrative_function: 迅速建立匿名密会的隐蔽感，并让玩家声音先于身体出现。
transfer_rule: 液体写黑暗时，应有浸没对象、边界消失和透光受阻，避免只靠颜色单点相似。
failure_boundary: 黑暗没有液体阻力与染色残留；人物行动仍可发生，不能延伸为真实溺水。
quality_assessment: effective
