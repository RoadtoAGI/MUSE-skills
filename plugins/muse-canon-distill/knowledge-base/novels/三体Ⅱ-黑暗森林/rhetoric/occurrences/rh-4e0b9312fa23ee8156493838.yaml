context_fact: 章北海父亲葬礼后，他与吴岳来到已完全停工、即将被拆的航母船坞。
image_mechanism: 在建航母从工业项目变成巨兽尸身，焊花曾是脉搏与体温，停工后只剩没有呼吸的钢壳。
property_alignment: 1）舰体对应身体；2）施工对应生长；3）焊花对应生命迹象；4）停工对应死亡；5）拆毁对应尸体处理。
context_alignment: 人物刚办完父亲葬礼，“它也死了”把家庭死亡与国家工程夭折并置，吴岳又将自身人生投射其上。
narrative_function: 把战略调整的抽象损失转成第三场死亡，联结父亲、航母与吴岳的终结感。
transfer_rule: 机械体生命化应持续对应生长、脉搏、死亡与遗体去向，并让场景中的真实运动或火光承担生命迹象。
failure_boundary: 工程可以重启或材料再利用，航母没有主观生命；死亡语言表达人物哀悼，不是项目状态的技术定义。
