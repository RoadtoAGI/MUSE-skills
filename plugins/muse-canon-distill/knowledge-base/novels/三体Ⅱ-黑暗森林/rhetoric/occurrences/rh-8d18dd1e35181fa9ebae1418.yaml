chapter: 正文
figure_type: metaphor
quote: 一扇对外界紧闭的心灵之窗
sensory_mapping: 眼睛像窗框面向蓝西、窗扇紧闭、室内思想退入黑暗、外界目光撞在窗面上
context_fact: 东方说人会变成‘非人’后目光空白，蓝西无法再从她眼中获得信息。
image_mechanism: 常规‘眼为心窗’在这里加入关闭动作，交流能力从透明通道变为封闭边界。
property_alignment: 1）瞳孔对应窗面；2）内心思想对应室内景物；3）对视对应向内观看；4）心理防御对应闭窗。
context_alignment: 前段眼神曾是高速信息通道，当前窗户紧闭，正好标记从无声共识到相互隔绝的转折。
narrative_function: 以一个静态边界结束心理咨询，显示蓝西的专业通道已被彻底切断。
transfer_rule: 眼睛作心窗时，应具体写透明度、开合、内外观察和关闭原因，让陈旧喻体获得情节动作。
failure_boundary: 眼神不能完整暴露思想，窗户关闭也不等同人格消失；东方仍主动提供有限警告。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 东方延绪的眼睛空白、不再回避也不透露内心判断，蓝西无法通过目光与她交流
vehicle: 窗户原可让室内外彼此看见、采光和通气，紧闭并加遮挡后外人无法窥见内部
ground: 1）眼睛对应窗；2）心灵对应室内；3）目光交流对应透视采光；4）空白眼神对应窗面遮蔽；5）拒绝透露对应关闭。
