chapter: 正文
figure_type: metaphor
quote: 第一个谈这件事情的人将是第二文明史上的一个里程碑
sensory_mapping: 星舰历史铺成新路、第一句残酷建议竖成石碑、后来世代都将在此读到转向刻度
context_fact: 东方与两位副舰长都已想到燃料问题，却没人愿意先用语言提出互杀选择。
image_mechanism: 瞬时发言被固化为道路永久标记，说话者从私人决策者变成后世必须经过的历史坐标。
property_alignment: 1）时间推进对应行路；2）首次言说对应立石；3）道德变化对应路段切换；4）历史记忆对应碑文。
context_alignment: 与‘第一吻的犹大’并置，里程碑强调第一步不可匿名，贴合东方对首责而非结论本身的恐惧。
narrative_function: 把沉默的成本和开口的责任同时放大，促使她选择用目光交流绕开命名者身份。
transfer_rule: 历史行为作里程碑时，应明确道路、转折、后世读者和第一性的不可替代，避免只写‘很重要’。
failure_boundary: 发言未必真正决定后续历史，且第一人可能被记录遗漏；石碑稳定性不等于评价固定。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 首个公开提出牺牲部分飞船以保全其余者的人，将永久标记星舰文明伦理转折
vehicle: 道路旁固定石碑标出关键距离或地界，后来行者以它判断已经走过和即将进入的路段
ground: 1）文明史对应道路；2）首谈行为对应立碑；3）伦理转折对应路界；4）后世评价对应后来行者辨认；5）不可撤回对应石碑固定。
