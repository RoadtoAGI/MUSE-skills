quote: 为人类开启了一扇通向黑暗的大门
sensory_mapping: 门锁开启、门缝透黑、通道向内延伸、文明站在门槛前
context_fact: 听证会代表认为思想钢印即使出于胜利目的，也会威胁自由思想权利和现代社会基础。
image_mechanism: 尚未发生的制度后果被放在可跨越的空间后方，科学家完成的不是终点恶行，而是首次打开进入恶行的通道。
property_alignment: 1）思想钢印发明对应钥匙开门；2）应用许可对应跨门；3）思想控制对应黑暗；4）社会伦理边界对应门槛；5）扩散滥用对应向深处行走。
context_alignment: 代表评价既承认科研才华又指控后果，‘开门’准确区分发明者提供可能性与社会是否继续进入。
narrative_function: 用清晰边界聚合会场恐惧，并为后文‘走到黑暗门槛’的延展争论建立母体意象。
transfer_rule: 新技术作开门时，应说明此前障壁、门后领域、跨越主体和继续深入条件，避免把可能性直接当必然。
failure_boundary: 技术也可能在监督下服务治疗或自愿选择，门后并非只有一种结局；黑暗评价需要独立伦理论证。
