tenor: 思想钢印使技术性思想控制成为可实施路径，可能逐步剥夺自由判断并改变社会基础
vehicle: 有人打开一扇原本关闭的门，使众人得以进入光明之外、危险未知的黑暗空间
ground: 1）脑科学突破对应开门；2）思想控制未来对应门后黑暗；3）技术可行性对应通道形成；4）人类社会对应入门者；5）自由思想丧失对应失去光；6）后续滥用对应深入门内。
