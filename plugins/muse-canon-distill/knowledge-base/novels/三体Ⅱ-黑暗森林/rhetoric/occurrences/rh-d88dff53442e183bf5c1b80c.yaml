tenor: 外表坚硬的智能沙发在罗辑坐下后迅速贴合全身、下沉包裹并均匀承托的触感
vehicle: 身体压入柔软泥块，材料随轮廓让开并从四周贴附包围
ground: 1）座垫下沉对应泥面凹陷；2）自动塑形对应泥随身体变形；3）全身贴合对应泥包裹；4）压力分散对应软质承托；5）与硬外观反差对应硬壳下软体。
