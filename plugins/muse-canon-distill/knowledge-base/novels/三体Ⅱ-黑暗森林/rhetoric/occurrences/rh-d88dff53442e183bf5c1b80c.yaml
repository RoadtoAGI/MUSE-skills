quote: 感觉却像陷到一块软泥里
sensory_mapping: 坐面塌下、身体缓陷、材料贴肤、压强被摊平
context_fact: 罗辑先摸到沙发表面像大理石般坚硬，坐下后座垫与靠背却自动形成与身体完全贴合的模子。
image_mechanism: 外观的石质判断被触觉瞬间翻转，座面不以弹簧回弹，而像无固定形状的泥接受并保存身体压痕。
property_alignment: 1）智能座垫对应软泥；2）人体重量对应按压；3）自适应形变对应泥体让位；4）贴合模子对应泥中凹模；5）最小压强对应大面积包裹。
context_alignment: 喻体准确抓住未来材料先硬后软的惊奇，且泥的可塑性直接解释座垫为何能为每个人即时成模。
narrative_function: 通过一次坐下展示自适应材料，把技术说明嵌入身体反应并为随后杀人沙发制造可信前提。
transfer_rule: 柔性材料作软泥时，应对齐受力形变、轮廓贴合和压力分散，并说明它是否会主动恢复。
failure_boundary: 沙发材料清洁、可控且能恢复，软泥会沾污、流动并保留压痕；不能转移其黏性。
quality_assessment: exemplary
