tenor: 隔着巨大星际距离所能观测和研究的复杂外星文明
vehicle: 复杂内部被省略、只保留若干参数的数学点
ground: 1）距离使内部细节不可见对应点没有可见内部；2）可测性质被压成少数参数对应参数化坐标；3）多个文明可统一处理对应点集可进入数学模型。
