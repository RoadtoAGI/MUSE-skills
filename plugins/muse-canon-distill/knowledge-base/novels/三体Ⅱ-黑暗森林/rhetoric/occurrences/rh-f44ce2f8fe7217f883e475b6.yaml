quote: 那些文明在我们看来就是一个个拥有参数的点
sensory_mapping: 视觉缩放、数学抽象、信息过滤
context_fact: 叶文洁说明宇宙社会学虽研究复杂社会，却因文明间距离巨大而呈现清晰数学结构。
image_mechanism: 让星际距离充当滤镜，逐层抹去社会内部的人与混沌，只在黑暗中留下带标签的亮点，复杂对象因此可计算。
property_alignment: 1）文明远景对应点状星光；2）内部随机性被距离滤去对应点无内部结构；3）剩余可观测量对应点的参数。
context_alignment: 叶文洁正指着稀疏星点说话，数学抽象与现场视觉形状重合，理论不是脱离场景的术语。
narrative_function: 为宇宙社会学可建模性提供关键桥梁，也暗示远观会牺牲文明内部的个体复杂性。
transfer_rule: 用点模型压缩复杂系统时，应说明哪些细节由观察尺度滤去、哪些参数仍保留，以及这种简化为何足够回答当前问题。
failure_boundary: 近距离互动、内部政治与快速变化无法由参数点表达；若把模型简化当成文明本体，会丢失决定行为的复杂因素。
