quote: 里面是个犯罪培训班
sensory_mapping: 教室、课程传授、同学交流、结业技能
context_fact: 史强送儿子入看守所，直说别指望改造，只要求他别被同化并学会自保。
image_mechanism: 本应矫正犯罪的机构翻面成为教授犯罪的学校，惩罚时间被改写为技能训练课时。
property_alignment: 1）看守所对应培训班；2）犯人对应学员；3）犯罪经验对应教材；4）同化对应学习；5）刑满对应结业。
context_alignment: 出自办案多年又对儿子有愧的史强，冷硬职业判断比空泛劝善更符合他在告别时的有限关怀。
narrative_function: 揭示其对刑罚改造的悲观，也压缩父亲无法替儿子承担后果的无力。
transfer_rule: 机构反功能隐喻应对齐场所、参与者、实际传授内容和与名义目标相反的产出。
failure_boundary: 看守所并非必然使所有人犯罪升级，也有隔离与教育功能；“培训班”是史强经验性警告。
