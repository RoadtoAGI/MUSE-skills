tenor: 希恩斯的失败主义长期形成、深入世界观核心，外部成功信息也难以改变
vehicle: 多年生植物把根系扎入深层土壤并牢固抓住地面，难以拔除或移栽
ground: 1）失败主义对应植物；2）世界观对应土壤；3）长期形成对应深扎；4）信念牢固对应根系抓地；5）表面伪装对应地上部分被遮；6）改变困难对应难以拔除。
