quote: 一个根深蒂固的失败主义者
sensory_mapping: 观念生根、根须下钻、土层紧抱、外力难拔
context_fact: 惠子在多年观察后判断，希恩斯从成为面壁者前起就坚定支持失败主义和逃亡主义。
image_mechanism: 抽象立场获得地下根系，隐藏不等于不存在，时间越久反而扎得越深、越难从人格土壤中分离。
property_alignment: 1）失败信念对应根株；2）希恩斯人格对应土壤；3）早期形成对应生根；4）多年隐瞒对应地下延伸；5）坚定不改对应抓地；6）破壁揭露对应挖出根系。
context_alignment: 惠子强调自己多年只见伪装表面，根系意象正好说明真实世界观始终藏在可见行为之下。
narrative_function: 用惯用但准确的深度模型概括希恩斯计划的稳定动机，并连接思想钢印的固化主题。
transfer_rule: 观念作根系时，应说明植入时间、承载土壤、地下遮蔽与拔除难度，使‘深’有可核对的历史。
failure_boundary: 信念可因证据和经历改变，并不像植物根系只能物理拔除；深固程度也无法由单一句话测量。
quality_assessment: conventional
confidence: 0.97
