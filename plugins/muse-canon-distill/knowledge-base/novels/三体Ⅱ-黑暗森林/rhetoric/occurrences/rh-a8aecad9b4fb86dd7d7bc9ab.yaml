tenor: 火球间歇熄灭时，残骸云被熔融舰体的暗红光从内部染亮，形成广阔红色薄层
vehicle: 日落晚霞以铺展云层承接暗红天光，颜色像血并在黑夜到来前短暂燃亮天空
ground: 1）金属云对应霞云；2）岩浆红光对应夕照；3）广阔铺展对应天幕；4）暗红对应血色；5）短暂发亮对应暮光。
