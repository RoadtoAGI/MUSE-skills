chapter: 正文
figure_type: simile
quote: 金属岩浆的光芒则使云团变成如血的晚霞
sensory_mapping: 十万公里碎云铺成暮天、岩浆从内部染红云层、血色霞光在宇宙黑夜前浮现
context_fact: 云中核火球间歇出现，火球暗下时，熔融金属残骸仍发出暗红光。
image_mechanism: 战舰材料发出的余光被天象化，‘晚’同时标记光线阶段和联合舰队时代的终暮。
property_alignment: 1）残骸云对应晚霞云层；2）金属岩浆对应落日光源；3）红色对应血；4）宇宙黑暗对应夜幕。
context_alignment: 血色来自真实人员与舰体毁灭，晚霞又天然通向黑夜，景物颜色与文明转折精确重合。
narrative_function: 把局部爆炸扩展为时代落日，为人类舰队彻底熄灭提供宏观挽歌。
transfer_rule: 灾难余光作晚霞时，应连接铺展介质、染色光源、时间趋暗和事件阶段，令天象承担结构意义。
failure_boundary: 太空没有大气散射或真实日落，云团由金属而非水汽组成；血色不表示全部残骸含血。
