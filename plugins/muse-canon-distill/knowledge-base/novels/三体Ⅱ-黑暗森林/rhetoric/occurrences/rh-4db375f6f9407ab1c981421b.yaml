context_fact: 罗辑只把坐标广播称为会产生灾难的咒语，拒绝说明机制；美国、英国、日本代表接连以神和巫师讥讽。
image_mechanism: 面壁者的制度权力被抬到神格，又被住所位置立即压入地窖；崇高与卑小在同一句垂直碰撞，神秘感转成荒谬感。
property_alignment: 1）罗辑对应神或巫师；2）面壁权力对应神权；3）恒星广播对应咒术；4）地下基地对应地窖；5）未知后果对应神罚。
context_alignment: 这组称呼直接回应罗辑自称咒语，会议缺少黑暗森林信息，只能把不可理解计划归入超自然并用反差嘲笑。
narrative_function: 呈现人类机构对关键战略的轻蔑，为四年后探测器加速与罗辑重要性反转蓄力。
transfer_rule: 讽刺性神格化应同时给人物一项超常权能和一项削弱神性的具体处境，让褒义升格自行坍缩。
failure_boundary: 罗辑的计划有可推导的宇宙社会学机制，且地下藏身是安全需要；神巫称呼代表与会者无知，不是可靠评价。
