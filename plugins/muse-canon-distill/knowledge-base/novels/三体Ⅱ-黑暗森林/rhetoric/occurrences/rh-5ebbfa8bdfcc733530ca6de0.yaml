chapter: 正文
figure_type: metaphor
quote: 绿色就埋在这田地里
sensory_mapping: 褐土覆盖、地下绿色、破土、色彩铺展
context_fact: 两人在残雪田野中讨论没有绿色的大地，女孩提醒冬小麦会在仍冷的早春出苗。
image_mechanism: 季节颜色被当成可储存物，冬天把绿色压进土层，春天再让它成片冒出。
property_alignment: 1）麦苗颜色对应绿色物；2）土壤对应埋藏层；3）越冬对应暂存；4）萌发对应出土。
context_alignment: 女孩倾向从衰败景象中看见潜在生命，埋藏意象既承认眼前灰褐，也保存她的温柔乐观。
narrative_function: 给冬日旅行加入未来生长感，与罗辑只欣赏当下荒凉形成轻微差异。
transfer_rule: 把季节属性写成埋藏物时，应有真实载体、暂时不可见状态和明确再现条件。
failure_boundary: 绿色不是独立物质，作物也可能因冻害不出苗；“埋着”不能保证春季结果。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 冬季土中尚未出苗、将在早春显现的冬小麦生命与绿色
vehicle: 暂时埋藏地下、到时可被挖出或重新显露的绿色物件
ground: 1）麦苗尚在土下对应物件被埋；2）绿色目前不可见对应地下遮蔽；3）早春出苗对应重现地表；4）大片田地将变绿对应埋藏量广。
