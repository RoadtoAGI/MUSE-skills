chapter: 正文
figure_type: simile
quote: 看上去像是这个迷离世界的一只没有瞳仁的巨眼
sensory_mapping: 橘色巨面、椭圆眼斑、中心空缺、无瞳凝视
context_fact: 舰队司令部绕木星运行，行星迅速占满窗户，大红斑这一可容纳两个地球的风暴随后进入视野。
image_mechanism: 行星气象结构被组织成人脸器官，旋风椭圆成为眼眶，却缺少瞳仁，使壮丽景观带上非人的空洞凝视。
property_alignment: 1）木星对应巨脸；2）大红斑对应眼睛；3）风暴椭圆对应眼眶；4）旋涡纹理对应虹膜；5）无暗中心对应无瞳；6）视窗移动对应眼睛出现。
context_alignment: 木星已被写成梦幻迷离的氢氦海洋，无瞳巨眼既精确抓外形，也保持这一世界不可读、非人化的气质。
narrative_function: 给基地天体一个压倒性的观看姿态，使舰队谈话始终处于巨行星的沉默尺度之下。
transfer_rule: 天体斑纹作眼睛时，应对齐轮廓、内部层次、所在‘面部’和凝视效果，并利用缺失部件制造特定情绪。
failure_boundary: 大红斑是高速风暴，没有视觉功能或注视意图；木星表面也没有固定面孔结构。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 木星大红斑在橘黄、纹理繁复的巨大行星表面上呈椭圆形缓慢移入视窗的外观
vehicle: 嵌在庞大面孔中的巨型眼睛，只有彩色眼白或虹膜而没有黑色瞳仁，空洞地注视
ground: 1）大红斑对应眼球；2）椭圆轮廓对应眼形；3）周围条纹对应面部纹理；4）无中心黑点对应无瞳仁；5）木星巨大尺度对应巨眼；6）缓慢移入视野对应转眼注视。
