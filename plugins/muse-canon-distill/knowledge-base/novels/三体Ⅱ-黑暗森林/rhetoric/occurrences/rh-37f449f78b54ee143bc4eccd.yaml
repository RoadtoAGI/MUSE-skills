chapter: 正文
figure_type: metaphor
quote: 黯淡的双眸中突然涌出无尽的忧伤
sensory_mapping: 黯淡眼底裂开泉口、悲伤水流突然上涌、未落成泪却充满整个目光
context_fact: 蓝西询问她的状态，东方从沉默转而说五舰已经与地球精神断线。
image_mechanism: 情绪不靠面部动作说明，而像蓄积液体突破眼睛出口，显示此前沉默下的巨大储量。
property_alignment: 1）内心悲伤对应水体；2）双眸对应出口；3）克制对应蓄水；4）话题触发对应压力释放。
context_alignment: 前文孤独淹没东方，此处同一流体由她眼中反向涌出，表明环境压力已经内化。
narrative_function: 在她说出风筝断线前先提供非语言强度，促使蓝西认真接受陌生心理环境。
transfer_rule: 情绪作涌水时，应交代蓄积位置、触发点、出口和是否形成泪水，让突然性有来源。
failure_boundary: 忧伤不是液体，‘无尽’为主观强度；眼神显露也无法量化其全部情绪。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 东方延绪提到人类首次真正进入太空时，压抑的悲伤在眼神中骤然强烈显露
vehicle: 大量水从深处突然向外涌出，源头持续供应，迅速充满低处并越过原有边界
ground: 1）忧伤对应水；2）眼睛对应泉口；3）压抑情绪对应地下水；4）突然显露对应涌出；5）无尽对应持续水源。
