chapter: 正文
figure_type: simile
quote: 像不时浮出黑色海面的金光四射的鲸背
sensory_mapping: 黑海、金色弧背、浮潜、明暗闪变
context_fact: 管理员加速三体游戏时间寻找稳定白昼，太阳沿地平线数次起落，使世界时明时暗。
image_mechanism: 天与地翻转为海面，太阳从天体变成在边界下游动的巨兽，每次露背便泼出一片金光。
property_alignment: 1）地平线对应水线；2）日轮弧顶对应鲸背；3）出没对应浮潜；4）日光对应反光水珠；5）黑暗对应深海。
context_alignment: 虚拟世界的异常天体运动本就违反日常经验，鲸的有机起伏为机械快进提供连续可视轨迹。
narrative_function: 在讨论罗辑威胁的停顿中制造不稳定明暗，给秘密增添巨物潜伏的视觉压力。
transfer_rule: 以水生动物比边界出没物，应让遮挡线承担水面、露出轮廓承担背脊、周期运动承担浮潜。
failure_boundary: 太阳没有动物意志，且运动由游戏加速造成；只适合表现局部弧面和起落，不能延伸出捕食行为。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三体游戏中沿地平线反复升沉、只露出部分的高速太阳
vehicle: 在漆黑海面间歇拱出、湿亮反光后又潜没的巨大鲸背
ground: 1）地平线对应黑色海面；2）半露太阳弧面对应鲸背；3）反复升落对应鲸浮潜；4）强烈金光对应湿背反射；5）巨大缓弧对应鲸体尺度。
