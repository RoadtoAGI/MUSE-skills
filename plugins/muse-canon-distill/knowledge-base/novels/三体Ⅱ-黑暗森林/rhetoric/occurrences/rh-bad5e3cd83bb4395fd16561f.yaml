figure_type: analogy
quote: 人类用计谋把导弹操作员都从导弹旁边骗开，再用弓箭把它们干掉
sensory_mapping: 弓弦、导弹阵地、人员被诱离、弱武器近距破坏
context_fact: 泰勒的物理学家认为宏原子技术在三体人面前是班门弄斧，他回应人类的计谋优势可抵消科技差距。
image_mechanism: 两种文明的技术量级缩成弓箭与导弹，再把另一条相反的不对称轴插入画面：聪明的弓手不硬碰弹体，而先搬走控制它的人。
property_alignment: 1）人类对应弓手；2）宏原子武器对应弓箭；3）三体武器对应导弹；4）三体人对应操作员；5）战略欺骗对应诱离；6）逆转胜负对应低级武器破坏失能高级武器。
context_alignment: 面壁计划本就以不透明思想对抗智子，泰勒把制度核心转译成战术小剧场，符合他寻找非常规太空力量的论证。
narrative_function: 首次清楚呈现泰勒战略的信心来源：把人类计谋差距当作科技差距的反向杠杆。
transfer_rule: 双重不对称类比可把两方各自优势放在相交轴上，并设计一个改变交战条件的动作，显示弱项如何绕开强项。
failure_boundary: 三体武器未必依赖可被“骗开”的操作员，思维透明也不等于缺乏战略学习；小剧场只证明逻辑可能，不证明计划可行。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 技术远逊三体的人类可能凭战略欺骗，使宏原子武器击败更高技术敌人的设想
vehicle: 持弓箭的原始人骗走导弹操作员后，用低级武器摧毁无人操纵的导弹
ground: 1）人类宏原子技术对应弓箭；2）三体微观技术对应导弹；3）人类计谋优势对应骗走操作员；4）三体思维透明对应易受欺骗；5）低技术在条件改变后取胜对应弓箭毁掉失去人的导弹。
