chapter: 正文
figure_type: metaphor
quote: 这是人类不可能迈出的一步
sensory_mapping: 威慑道路只差一步、人类站在悬崖边抬不起脚、对面是可能胜机、脚下却是太阳系暴露
context_fact: 太阳系与三体相对位置已公开，广播三体精确坐标几乎等于广播自身坐标；雷迪亚兹式威胁会遭公众杀死。
image_mechanism: 技术上简单的发信动作获得身体跨界难度，‘晚一步’从时间失误转为伦理上无法完成的步幅。
property_alignment: 1）广播操作对应一步；2）威慑成功对应到达彼岸；3）自我暴露对应踏空；4）公众阻止对应身体僵住；5）水滴封锁对应路被撤走。
context_alignment: 大史说人类只晚一步，罗辑把其改写为迈不出的步，准确收窄失败原因而非归咎时机偶然。
narrative_function: 解释即使太阳未封锁，罗辑当时也难建立威慑，为后续孤独承担同归于尽选择奠基。
transfer_rule: 集体无法执行的决策作迈步时，应写明目标、落脚风险、身体阻力和错过后的道路变化。
failure_boundary: ‘不可能’是当时政治心理判断，未来制度可能赋予单人按钮；人类并非物理不能广播。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 以广播三体坐标进行威慑也会暴露太阳系，意味着主动接受同归于尽，人类政治和心理无法实施
vehicle: 行者面前只有一步可通向目标，但落脚处越过安全边界或坠崖，因此身体无法把脚踏出去
ground: 1）战略实施对应迈步；2）广播坐标对应落脚；3）人类伦理心理对应腿力/边界；4）同归于尽对应悬崖；5）理论可行对应看见路径。
