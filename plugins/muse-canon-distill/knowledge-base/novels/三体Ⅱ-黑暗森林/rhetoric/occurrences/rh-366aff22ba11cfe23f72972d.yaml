tenor: 钢印族同时被植入绝对失败信念、又面对人类明显胜利景象，两套不能相容的判断在心中持续冲突
vehicle: 竞技场内两名武装角斗士近身搏杀，双方都要消灭对手且不能和平共存
ground: 1）失败信念对应一名斗士；2）现实胜利证据对应另一名斗士；3）意识对应竞技场；4）认知冲突对应厮杀；5）不可调和对应生死对决；6）精神痛苦对应受创观众与场地。
