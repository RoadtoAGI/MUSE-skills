quote: 意识中像有两个角斗士在厮杀
sensory_mapping: 头脑化成斗兽场、两名斗士持械冲撞、每次证据都引发新一轮搏杀、意识震荡
context_fact: 一名钢印族冬眠者在全民庆祝探测器拦截前自杀，并说明自己既为胜利高兴又无法相信胜利。
image_mechanism: 认知失调被拆成人格内部两个有身体的敌手，钢印保证一方不退，现实又不断武装另一方，痛苦遂成为无休止近战。
property_alignment: 1）固化失败主义对应旧角斗士；2）胜利事实对应新角斗士；3）意识空间对应竞技场；4）证据冲突对应搏杀；5）信念不可改对应拒绝投降；6）自杀冲动对应战场摧毁容器。
context_alignment: 前文希恩斯称这种冲突为地狱折磨，此处钢印族用更具体的竞技场画面说明痛苦如何在意识内部发生。
narrative_function: 让全民胜利狂欢出现一道私人裂缝，并具体呈现思想钢印延续两世纪的心理代价。
transfer_rule: 内在冲突作角斗时，应分别命名双方信念、提供持续补给和不可退场机制，并写出战场承受的损伤。
failure_boundary: 信念没有独立身体，认知也可能整合而非一方杀死另一方；角斗不能说明自杀是唯一结局。
quality_assessment: exemplary
