chapter: 正文
figure_type: simile
quote: 打在玻璃上的雪花像沙粒般啪啪作响
sensory_mapping: 听觉、触觉、颗粒质地
context_fact: 夜间风雪交加，狂风盖住城市声音，窗外只见雪尘。
image_mechanism: 把通常轻柔无声的雪转成干硬颗粒，听觉先让室内人物感到窗外风力与寒冷的攻击性。
property_alignment: 1）雪花结团硬化对应沙粒；2）风吹撞窗对应扬沙击面；3）细密声响对应颗粒雨。
context_alignment: 后文女孩将在风雪中显得极脆弱，沙粒化的雪先把环境从浪漫雪景改成有伤害力的介质。
narrative_function: 建立风雪的强度和听觉压迫，为罗辑第一次心疼想象人物提供可信物理威胁。
transfer_rule: 改变常见天气意象时，应从具体声响和触感选择反常材质，使危险程度可被身体估量。
failure_boundary: 大片柔雪无风落下不会发出沙粒撞击声；比喻只适用于被强风驱动、碰撞玻璃的瞬间。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 狂风中密集撞击宿舍窗玻璃的硬雪花
vehicle: 一把把沙粒连续打在硬面上的细碎撞击
ground: 1）雪粒被风压实对应沙粒硬颗粒；2）密集敲玻璃对应沙粒连续撞击；3）啪啪声对应颗粒碰撞的干脆声响。
