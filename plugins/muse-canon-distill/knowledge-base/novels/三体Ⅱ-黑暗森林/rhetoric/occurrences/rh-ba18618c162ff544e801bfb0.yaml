chapter: 正文
figure_type: simile
quote: 他的脸像那兽皮一样脏和皱
sensory_mapping: 视觉、纹理、触觉
context_fact: 周文王披破长袍和肮脏兽皮，从荒漠天边步行而来，双眼仍有神。
image_mechanism: 让人物脸部直接继承紧邻衣料的污色和粗糙纹理，视线从兽皮移到脸时无需更换感官尺度。
property_alignment: 1）皮面污渍对应脸上泥垢；2）皮革皱褶对应面部皱纹；3）旧皮磨损对应人物跋涉后的风霜。
context_alignment: 喻体就在人物身上，符合荒原装束与古代角色造型；眼睛有神又从相似中保留生命差异。
narrative_function: 用一笔建立周文王的衰败外形，同时让有神双眼成为画面中唯一活跃焦点。
transfer_rule: 外貌比喻可从人物随身材质取样，让颜色、纹理和磨损程度连续对应，并保留一处反差避免人物物化到底。
failure_boundary: “兽皮”只承载表面脏皱，不能推及人物野蛮或非人；皮料若光洁平整，相似即失效。
