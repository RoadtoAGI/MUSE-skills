tenor: 周文王布满污垢和皱纹的脸
vehicle: 裹在身上的肮脏、褶皱兽皮
ground: 1）脸上污垢对应兽皮肮脏表面；2）面部皱纹对应兽皮褶皱；3）风霜老态对应破旧皮料的磨损感。
