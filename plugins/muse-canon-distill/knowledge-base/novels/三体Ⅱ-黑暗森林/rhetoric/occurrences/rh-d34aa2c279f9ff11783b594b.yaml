quote: 在地狱般的生活中目睹世界的最后毁灭
sensory_mapping: 战火灼烧、哀号压迫、无路逃脱、末日降临
context_fact: 罗辑提出与妻女一同冬眠，萨伊提醒他届时已失去面壁权力，不能保护她们，只能共同面对末日战火。
image_mechanism: 尚未发生的四世纪后生活被压缩成一处惩罚空间，战火、失序和无力保护共同赋予它地狱的热度与封闭。
property_alignment: 1）末日生活对应地狱；2）战争灾难对应刑罚；3）罗辑一家对应受难者；4）无法保护对应无出口。
context_alignment: 萨伊正在用妻女未来的具体痛苦迫使罗辑工作，极端宗教空间把抽象人类责任转成他最怕看见的家庭后果。
narrative_function: 加强劝迫力度，使罗辑无法把直达末日理解成团聚捷径。
transfer_rule: 地狱类比应落实痛苦来源、持续时间和逃生条件；普通艰苦若缺少极端受难，不足以支撑该强度。
failure_boundary: 未来社会形态尚未知，战争也未必让全部生活等同地狱；该图景服务于萨伊的说服，含策略性夸大。
