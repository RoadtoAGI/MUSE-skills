quote: 罗辑像被抽去了什么，软瘫地躺到沙地上
sensory_mapping: 一股看不见的力量从罗辑体内抽空支架，四肢和躯干随即像空袋落在温沙上
context_fact: 罗辑刚确认水滴持续发波封死太阳，人类再也无法借太阳向宇宙广播，他随即软瘫。
image_mechanism: 心理希望被实体化为维持身体形状的内部物，失望发生时的瞬间抽空直接驱动姿态坍塌。
property_alignment: 1）威慑可能对应内撑；2）确认失败对应抽走；3）意志消失对应内部空洞；4）软瘫对应失压变形。
context_alignment: 他本在沙地坐等撞击，身体真实倒向沙面；抽空意象准确连接战略信息与即时肌肉反应。
narrative_function: 让太阳封锁从技术新闻落到罗辑肉身，完成一次假处决后的彻底精神崩塌。
transfer_rule: 写突然失去支撑时，应让抽走物对应明确希望，并用紧随其后的姿态变化验证抽空效果。
failure_boundary: 原文没有指明被抽去的具体物质，罗辑也未失去全部生命功能；不能将空壳理解为生理休克诊断。
