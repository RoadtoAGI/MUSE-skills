tenor: 太阳被封锁后罗辑最后的威慑希望突然消失，身体和精神支撑同步垮下
vehicle: 一个充气、填充或由内架撑起的物体被抽走内部物质，外壳随即失去形态瘫软倒地
ground: 1）希望与意志对应内部填充；2）水滴封锁对应抽取动作；3）精神失力对应失去支撑；4）躺倒对应外壳塌软。
