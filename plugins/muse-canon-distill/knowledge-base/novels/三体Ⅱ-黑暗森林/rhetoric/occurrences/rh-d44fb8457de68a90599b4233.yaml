quote: 技术差距，相当于手动黑白胶片照相机与现代高分辨率数字摄像机的差距
sensory_mapping: 手摇胶片机、高清数字影像、静帧到视频、颗粒到像素
context_fact: 顾问团认为解析摄像机理论可行，但当代计算能力与数据处理远不能支持。
image_mechanism: 难以想象的脑扫描差距被摆成两台熟悉设备：一边手动拍单张灰片，另一边实时生成高清数字流。
property_alignment: 1）现代CT对应胶片相机；2）解析摄像机对应数字摄像机；3）断层静态对应单帧；4）动态全脑模型对应高清视频。
context_alignment: 拟议设备本就名为摄像机，影像技术代际对照让非专家能沿同一功能轴理解，而非随意跨域。
narrative_function: 量化希恩斯计划的工程距离，合理化其选择冬眠等待计算机进步。
transfer_rule: 技术鸿沟类比应选功能相同的两代设备，并逐项对齐分辨率、速度、自动化和数据量。
failure_boundary: 真实脑扫描困难还涉及传感、辐射和建模，未必按相机演进速度缩小；类比只说明量级。
