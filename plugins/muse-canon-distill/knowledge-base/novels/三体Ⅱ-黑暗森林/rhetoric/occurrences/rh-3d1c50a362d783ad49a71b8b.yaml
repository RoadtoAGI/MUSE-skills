chapter: 正文
figure_type: analogy
quote: 下面沙漠中的一粒沙子冲您大声喊‘我在这儿’
sensory_mapping: 万里沙海、微粒喊声、高空俯视、无从落点
context_fact: 罗辑询问地球是否因三体通讯暴露，林格又说明定位需恒星构图和包含全银河恒星运动的数据库。
image_mechanism: 恒星尺度被压成沙粒，观察距离被抬到飞机高度；听觉确认‘有东西在喊’却无法在视觉上锁定某粒，直观分开存在探测与位置识别。
property_alignment: 1）银河系对应撒哈拉；2）恒星对应沙粒；3）电波对应喊声；4）接收者对应飞行者；5）坐标数据库对应沙粒地图；6）恒星运动对应流沙位移。
context_alignment: 林格随后沿同一沙漠框架说明必须记录每粒沙的相对位置及运动，类比可持续承载定位算法而非一次装饰。
narrative_function: 让读者理解广播坐标为何困难，为罗辑用恒星排列发送‘咒语’建立技术前提。
transfer_rule: 用沙海解释大规模定位，应分别映射对象数量、观察尺度、信号可闻与坐标不可得，并允许后续加入地标或数据库。
failure_boundary: 恒星可由光谱、亮度和相对构图区分，沙粒通常更同质；先进观察者拥有银河模型后可突破类比中的无解。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 第三方只收到一颗恒星发出的低频信号，却无法据此在银河系亿万恒星中确定其精确位置
vehicle: 飞越撒哈拉的乘客听见地面一粒沙呼喊，却没有地标可把声音对应到具体沙粒
ground: 1）银河系对应沙漠；2）近两千亿颗恒星对应沙粒；3）发信恒星对应喊话沙粒；4）第三方观察者对应飞机乘客；5）信号内容对应喊声；6）三维星图对应每粒沙的位置数据库。
