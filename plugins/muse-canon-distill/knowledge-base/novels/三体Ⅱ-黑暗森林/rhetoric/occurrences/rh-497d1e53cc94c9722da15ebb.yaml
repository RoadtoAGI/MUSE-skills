tenor: 吴岳得知海军将转入跨世纪太空任务后突然失去的信念与期待
vehicle: 双眼中原本燃烧、此刻灭掉的一点光或火
ground: 1）希望使眼神有活力对应火光发亮；2）打击到来后目光失神对应火熄灭变暗；3）章北海从眼睛察觉变化对应光亮变化可见。
