quote: 舰长那平视前方的双眼中，有什么东西熄灭了。
sensory_mapping: 视觉、光暗、熄灭动作
context_fact: 常伟思解释太空军以海军为基础，吴岳笔直坐着不动，章北海敏锐观察他的眼神。
image_mechanism: 不命名具体情绪，只让眼内光源停止燃烧；一个瞬间动作同时表现信念失去能量和观察者捕捉到变化。
property_alignment: 1）眼神活力对应火光；2）信念受挫对应燃料断绝；3）表情变暗对应熄灭后的黑暗。
context_alignment: 吴岳努力保持军姿，身体没有外露变化，只有最难控制的眼睛泄露崩塌，符合军人克制。
narrative_function: 在正式宣告漫长使命前预示吴岳精神失守，并与章北海隐蔽而坚定的状态形成对照。
transfer_rule: 写克制人物的突变时，可让一个局部感官信号完成“有光—失去能量—变暗”的短动作，代替情绪说明。
failure_boundary: 疲劳、转移视线也会让眼神变暗；若语境没有明确打击，“熄灭”不能独立证明信念崩溃。
quality_assessment: effective
