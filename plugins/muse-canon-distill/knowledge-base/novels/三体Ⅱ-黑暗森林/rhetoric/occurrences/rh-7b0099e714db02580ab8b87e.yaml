quote: 我手里有人类胜利的钥匙
sensory_mapping: 无形理论凝成一把钥匙落入罗辑掌心、三体危机像锁闭大门、只待找到锁孔转动
context_fact: 罗辑得知两组星舰在隔绝环境中独立发生互杀，确认自己两个世纪前的宇宙社会学推论。
image_mechanism: 理论从解释工具变成可操作小物，知识的价值由‘正确’转为能否打开战争封锁。
property_alignment: 1）理论结构对应齿形；2）三体威胁对应锁具；3）广播威慑对应插钥转动；4）生存机会对应门开启；5）罗辑责任对应持有保管。
context_alignment: 他刚从普通人恢复面壁者身份，‘手里’强调重新获得行动权，但随后进城受阻显示尚未找到锁孔。
narrative_function: 将星舰线的惨剧转化为罗辑线的突破，启动最后一次向权力中心传递理论的行动。
transfer_rule: 关键知识作钥匙时，应明确对应的锁、齿形匹配、开锁动作与门后结果，并写出持钥不等于已开门。
failure_boundary: 理论仍需验证、传播装置与政治授权，不能自动保证胜利；错误使用也可能引来共同毁灭。
