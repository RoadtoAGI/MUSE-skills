tenor: 罗辑从星舰互杀中验证黑暗森林猜想，认为自己掌握可用来威慑三体、改变战争结局的关键知识
vehicle: 钥匙由持有者掌握，能插入匹配锁孔打开原本封闭的大门，让人进入通向目标的空间
ground: 1）黑暗森林理论对应钥匙；2）战争困局对应锁；3）罗辑对应持钥者；4）威慑方法对应开锁动作；5）人类胜利对应门后道路。
