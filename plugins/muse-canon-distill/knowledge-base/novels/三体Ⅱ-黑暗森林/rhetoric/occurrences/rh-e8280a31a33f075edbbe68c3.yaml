quote: 它是组织的空气和血液，没有它，组织将立刻消亡
sensory_mapping: 空气吸入、血流循环、组织身体、断供死亡
context_fact: 共同三体敌人消解了组织对西方的仇恨，老人判断组织将随自己很快死去。
image_mechanism: 组织被塑成一具集体身体，仇恨同时充满其外部呼吸环境和内部血管；情绪一撤，身体既窒息又失血。
property_alignment: 1）组织对应生命体；2）仇恨对应空气与血液；3）成员网络对应血管；4）仇恨消退对应断气失血；5）组织解体对应死亡。
context_alignment: 泰勒试图用金钱武器延续组织，老人以生理必需品指出物资无法替代的内在驱动力，紧接财富和武器比喻。
narrative_function: 给组织消亡建立清晰机制，否定泰勒把敢死精神外接到太空军的方案。
transfer_rule: 组织生命体喻应把外部条件与内部循环分开对应，并说明断供后哪些功能立即停止。
failure_boundary: 组织可改变目标、制度化或转型，不会像生物瞬间死亡；仇恨也不是唯一可能的凝聚资源。
