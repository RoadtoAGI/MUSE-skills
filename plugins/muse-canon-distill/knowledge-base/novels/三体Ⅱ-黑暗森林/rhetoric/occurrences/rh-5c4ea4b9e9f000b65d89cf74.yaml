quote: 建立起一个扑朔迷离的巨大的假象迷宫
sensory_mapping: 高墙、岔道、死路、中心秘密、迷失方向
context_fact: 秘书长解释面壁者必须欺骗敌我整个世界，以拖延三体判断其真实战略意图。
image_mechanism: 一连串公开命令砌成墙和岔道，敌人的推理每前进一步都可能进入由面壁者预设的死路。
property_alignment: 1）面壁者对应迷宫建造者；2）假行为对应墙路；3）真实意图对应出口或中心；4）三体分析对应寻路；5）误判对应迷失。
context_alignment: “面壁”已把秘密与墙相连，迷宫把单面遮挡扩展成可主动操纵对手路径的战略结构。
narrative_function: 明确面壁者权力为何需要行为不可理解，也为破壁人的“破解”角色预设空间。
transfer_rule: 迷宫写计谋时，应能列出入口信息、岔路选择、死路反馈和被保护的中心，避免只用“复杂”代替结构。
failure_boundary: 真实行为会影响己方资源与生命，不是可任意重置的迷宫墙；敌人也可能绕过或不进入。
