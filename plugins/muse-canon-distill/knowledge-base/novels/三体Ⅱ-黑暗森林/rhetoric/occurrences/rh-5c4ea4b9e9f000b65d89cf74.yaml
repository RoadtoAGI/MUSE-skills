tenor: 面壁者用伪装、误导和欺骗组成的复杂公开行为体系
vehicle: 岔路众多、墙面遮挡并让闯入者失去方向的巨大迷宫
ground: 1）多层假象对应岔路；2）真实战略对应隐藏出口；3）敌人分析对应入迷宫寻路；4）误导对应死路；5）延迟识破对应长时间绕行；6）面壁者设计对应建造迷宫。
