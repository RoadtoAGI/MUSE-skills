figure_type: simile
quote: “高边疆”号仿佛飘浮在稀薄的晚霞中
sensory_mapping: 薄红霞层、机体悬浮、隐形火源、轻柔包围
context_fact: 火箭点火造成巨响和超重，窗外看不到发动机火焰，只见稀薄天空被映红大片。
image_mechanism: 暴烈尾焰退到视野之外，只留下柔红色扩散层；重压中的飞船在视觉上反而被霞光托成轻飘物。
property_alignment: 1）映红天空对应晚霞；2）空天飞机对应漂浮物；3）稀薄大气对应霞层；4）相对稳定对应飘浮。
context_alignment: 触觉极重与视觉极轻并置，准确表现舱内外感受分裂，晚霞色又由真实尾焰照明产生。
narrative_function: 在发射暴力中插入宁静画面，扩大首次航天体验的感官复杂度。
transfer_rule: 飞行器浮霞喻应让色层真实包围视野，并可用内外感官反差增加力度。
failure_boundary: 飞船正在强力加速并非无动力漂浮，红光来自尾焰；若视野显示清晰火焰和高速参照，轻浮错觉减弱。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 高空稀薄大气被尾焰映红后，空天飞机在红色光层中的悬浮视觉
vehicle: 轻物无重量地浮在一层稀薄、柔红的傍晚云霞里
ground: 1）天空泛红对应晚霞色；2）空气稀薄对应霞层轻薄；3）窗外不见尾焰对应光源隐去；4）飞行器被红色包围对应浮在霞中；5）相对视野稳定对应悬浮。
