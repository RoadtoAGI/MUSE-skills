tenor: 三名舰长意识到自己正考虑用次声波氢弹先杀死其他四舰人员、夺取资源，因此自认突破旧人类道德底线
vehicle: 魔鬼主动诱惑、伤害和夺取无辜生命，与善良人类相对，接受邪恶目的和手段
