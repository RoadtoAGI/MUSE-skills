context_fact: 他们无声推演出燃料只够一舰，并想到隐形导弹与次声波氢弹可杀人而保留设施。
image_mechanism: 尚未执行的选择先改写身份，伦理越界从行动评价变为整个人格物种的骤变。
property_alignment: 1）杀死同胞对应恶行；2）资源欲望对应诱惑；3）预谋武器对应魔鬼手段；4）旧道德失效对应从人变魔。
context_alignment: ‘新人’是否‘非人’的争论在此获得最恐惧答案，符合三人仍保留旧道德、因而痛苦自责的阶段。
narrative_function: 把技术方案转成身份危机，迫使三人继续处理彼此猜疑而非轻易接受功利结论。
transfer_rule: 人物自称魔鬼时，应落实具体越界行为、旧身份标准和自我判断时点，使强烈称谓承担伦理冲突。
failure_boundary: 思考极端方案不等于已实施恶行，魔鬼二分也会遮蔽资源死局和集体责任的复杂性。
