chapter: 正文
figure_type: metaphor
quote: 两排冬天的白杨静静地倾听着他们心中的交谈
sensory_mapping: 树列、人形站立、静默听觉、雪地脚步
context_fact: 罗辑与想象女孩并肩走在冬日林荫道，只听见靴子踩雪声，随后开始对话。
image_mechanism: 白杨从景物变成两排克制旁听者，人物未出口的心声仿佛穿过寒冷空气被整条道路听见。
property_alignment: 1）白杨对应听众；2）道路对应交谈空间；3）静立对应倾听；4）内心交流对应无声话语。
context_alignment: 女孩只存在罗辑心中，树木成为唯一“旁证”，既浪漫又暗示这场交往没有真人观察者。
narrative_function: 把内心恋爱外化到环境中，强化甜美同时保留孤独底色。
transfer_rule: 让植物倾听时，应利用站位、静止和人物未说出口的信息，并考虑环境见证对真实与幻觉的双重作用。
failure_boundary: 树木没有听觉，也不能证明关系被世界认可；在写实视角中延伸回应会破坏主观边界。
