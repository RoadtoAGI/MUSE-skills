chapter: 正文
figure_type: simile
quote: 尾迹最初像一颗怒发冲冠的彗星
sensory_mapping: 银亮头部疾冲、碎片尾发向后炸开、整颗人造彗星带着怒容划过金属云
context_fact: 水滴以约每秒一百七十公里撞击沿途碎片，碎片二次熔化飞溅并形成亮尾。
image_mechanism: 碰撞残迹先借彗星解释头尾结构，再以竖发给无生命轨迹增加狂怒方向感。
property_alignment: 1）探测器对应彗星核；2）发亮碎片对应彗发彗尾；3）飞行方向对应尾巴后曳；4）放射形态对应冲冠怒发。
context_alignment: 水滴本体仍冷静光滑，怒意只存在于被撞碎的物质尾迹，映出人类对其杀戮的情感投射。
narrative_function: 在延展巨龙意象成形前给出尾迹初态，使尺度膨胀具有可视演化过程。
transfer_rule: 高速尾迹作彗星时，应匹配核、尾、方向与物质来源；情绪拟态要落在具体形状上。
failure_boundary: 水滴不是天体，尾迹由撞击碎片而非太阳风产生；‘愤怒’不代表探测器情绪。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 水滴高速撞熔碎片后拖出短而灿烂、从头部向后放射扩散的银色尾迹
vehicle: 彗星以明亮彗核领头，长发状彗尾向后张开；‘怒发冲冠’又赋予毛发竖起的暴怒姿态
ground: 1）水滴对应彗核；2）熔融碎片对应彗尾；3）高速飞行对应掠空；4）尾迹放射对应怒发；5）攻击状态对应暴怒。
