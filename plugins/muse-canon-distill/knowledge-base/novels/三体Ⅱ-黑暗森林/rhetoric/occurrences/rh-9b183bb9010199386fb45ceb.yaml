chapter: 正文
figure_type: metaphor
quote: 水滴在太阳系如入无人之境
sensory_mapping: 银滴独自行走在空旷疆域、舰队像不存在、所有关隘敞开、路线任其选择
context_fact: 水滴已摧毁数百舰，激光拦截无效，叙述判断太阳系没有可毁伤它的东西。
image_mechanism: ‘无人’抹去两千艘舰的存在感，敌人不是击败守军而是技术上看不见守军。
property_alignment: 1）水滴对应强行者；2）舰队对应失效守卫；3）行星空间对应疆域；4）不可摧毁对应无拦截者。
context_alignment: 成语常用于军队突进，此处由三米探测器对整个人类文明使用，尺度反转格外残酷。
narrative_function: 把局部舰战失败扩大为太阳系级防御真空，确立水滴之后的战略统治力。
transfer_rule: 绝对优势作无人之境时，应写明守军为何等同不存在、行动边界多大及优势依赖的具体条件。
failure_boundary: 太阳系实际有人且有舰队，‘无人’只表示现有抵抗手段无效；水滴仍可能受任务和能源限制。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 太阳系内现存的人类舰队与武器均无法拦截或摧毁水滴，它可以自由选择路线和目标
vehicle: 武装强者闯入没有守军和抵抗者的区域，行动不受阻拦，所到之处可任意支配
ground: 1）太阳系对应无守卫之地；2）水滴对应闯入者；3）人类防御无效对应无人阻挡；4）自由攻击对应长驱直入。
