quote: 我正变成死亡，世界的毁灭者
sensory_mapping: 人影化作死亡、世界崩毁、身份变形、核火照亮
context_fact: 超级核弹专家在白沙靶场日出时引用奥本海默见首颗原子弹后的《薄伽梵歌》语句。
image_mechanism: 科学家与自己制造的武器轮廓重叠，人的职业身份被核火烧掉，剩下一个以世界为作用对象的死亡主体。
property_alignment: 1）奥本海默对应毁灭者；2）核武器对应死亡力量；3）研发成功对应变身；4）全球杀伤对应毁灭世界。
context_alignment: 引用发生在首颗核弹爆心标志旁，雷迪亚兹正建立“小太阳”模型，历史核火与未来恒星级爆炸同场。
narrative_function: 把技术成就的伦理负重召回现场，触发雷迪亚兹对太阳与核毁灭的身体恐惧。
transfer_rule: 人物化身抽象力量时，应由其亲手启动的具体机制和规模后果支撑，并呈现身份不可逆转的时点。
failure_boundary: 奥本海默并非死亡本体，也不能单独控制世界毁灭；引文表达道德震动，不是责任归属的完整判断。
