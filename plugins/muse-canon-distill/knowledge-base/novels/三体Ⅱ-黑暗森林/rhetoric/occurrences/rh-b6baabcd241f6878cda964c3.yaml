chapter: 正文
figure_type: metaphor
quote: 这艘飞船本身则像一粒金属的种子
sensory_mapping: 金属舰体缩成种粒、文明信息包在硬壳内、种子穿越黑土般宇宙、在远星破壳长出城市
context_fact: 章北海原计划带舰逃离太阳系保存文明，但被追击舰队截住，以为自己没能把种子撒出。
image_mechanism: 有限载具与完整文明之间的容量矛盾由种子解决：物质少量、信息完整、结果依赖外部环境与时间。
property_alignment: 1）舰壳对应种皮；2）人员知识对应胚与遗传码；3）星际远航对应播撒；4）宜居世界对应土壤；5）后代文明对应植株。
context_alignment: ‘部分含全部’的全息思路在种子生物学中获得可执行过程，也呼应后来星舰地球承担文明延续。
narrative_function: 将章北海的逃亡从军事叛逃重新定义为文明播种，并显出他自认失败时的遗憾。
transfer_rule: 文明载体作种子时，应完整映射外壳、信息、播撒环境、发芽条件和成长周期，保留失败可能。
failure_boundary: 飞船不能自动复制或从环境吸收一切资源，文明重建需人口、能源、制度与宜居条件，远比发芽复杂。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 自然选择号携带人类人口、技术与文明信息，若抵达合适环境便可能繁衍并重建完整文明
vehicle: 一粒种子体积小却封存整株生命的遗传信息，被播撒到适宜土壤后发芽、成长并繁殖
ground: 1）飞船对应种子；2）文明信息对应遗传信息；3）宇宙对应可播撒土地；4）抵达宜居地对应发芽；5）人口扩展对应成长；6）重建文明对应成株。
