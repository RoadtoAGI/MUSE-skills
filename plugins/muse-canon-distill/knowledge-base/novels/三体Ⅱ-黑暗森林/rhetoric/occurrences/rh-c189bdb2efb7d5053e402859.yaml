chapter: 正文
figure_type: simile
quote: 包括那铭心刻骨的爱情，都像一场转瞬即逝的梦
sensory_mapping: 庄颜与孩子从记忆中像梦景亮起、爱情刻得深却一醒即散、罗辑伸手只能碰到空白
context_fact: 罗辑不敢继续想爱人与孩子，认为面壁后人生不像自己的，并快速倒过该段记忆。
image_mechanism: 深刻与短暂的矛盾由梦承载：感官强度不保证时间与现实可持续，醒后空失成为核心。
property_alignment: 1）相爱时期对应做梦；2）冬眠苏醒对应醒来；3）记忆鲜明对应梦景；4）现实分离对应梦散；5）不可重返对应无法续梦。
context_alignment: 他即将面对死亡，真实与想象中的庄颜本就长期交叠，梦喻体准确保留爱情的生成方式和失去感。
narrative_function: 在临终回放中把最珍贵经历转成最不可把握之物，加重下一段记忆流失主题。
transfer_rule: 逝去关系作梦时，应同时匹配亲历真实感、短时、醒后消散和不可返回，避免仅以‘美’入梦。
failure_boundary: 庄颜与孩子真实存在，爱情也产生持续人生后果；梦境相似不表示经历虚假。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑与庄颜的爱情虽然强烈真实，却因冬眠、分离与回忆压缩而显得短暂、难握且仿佛不属于当前人生
vehicle: 梦境在睡眠中鲜明动人，醒后迅速消散，内容像亲历却无法返回或确认其持续存在
ground: 1）爱情经历对应梦境；2）强烈感受对应梦中真实；3）时间短对应转瞬；4）庄颜缺席对应醒后消散；5）不像自己人生对应梦的异己感。
