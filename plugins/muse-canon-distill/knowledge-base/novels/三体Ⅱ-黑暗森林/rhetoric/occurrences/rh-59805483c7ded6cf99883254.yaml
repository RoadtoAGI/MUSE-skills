quote: 工质推进飞船不过是个大火箭
sensory_mapping: 巨型燃料箱、喷射工质、载荷被挤压、基地补给
context_fact: 航天系统偏好技术稳妥的工质推进，章北海坚持辐射驱动才能恒星际远航。
image_mechanism: 核聚变的新技术外壳被剥下，飞船内部露出传统火箭的巨大燃料箱；尺寸扩大却未改变被工质绑住的结构。
property_alignment: 1）工质飞船对应大火箭；2）推进剂对应火箭燃料；3）运载能力占用对应质量比；4）行星基地对应发射补给场。
context_alignment: 类比针对推进架构而非外形，准确指出“安全的新方案”延续旧航天限制，符合技术争论。
narrative_function: 把路线之争压缩为真正星际飞船与放大旧火箭的选择，为章北海激进行动提供动机。
transfer_rule: 新技术写成放大旧物，应指出哪些核心约束未变，避免仅凭形状或代际偏见贬低。
failure_boundary: 核聚变工质推进性能仍远超化学火箭且可能改进，类比不能证明其毫无创新或军事价值。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 依赖携带并快速消耗大量推进工质、难以脱离行星基地的核聚变飞船方案
vehicle: 把传统化学火箭按尺寸放大、仍受燃料负担和航程限制的运载器
ground: 1）携带工质对应自带燃料；2）三分之二载力供工质对应火箭质量比；3）快速耗尽对应一次性推进；4）依赖基地对应需补给发射场；5）太阳系内航行对应有限航程。
