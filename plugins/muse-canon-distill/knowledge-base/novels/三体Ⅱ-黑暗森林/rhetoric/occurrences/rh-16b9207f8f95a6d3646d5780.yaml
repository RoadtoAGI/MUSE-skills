chapter: 正文
figure_type: simile
quote: 沙漠和天空都在暮色中迷蒙一片，像国画中的空白
sensory_mapping: 暮色把沙天洗成一张淡白画纸，景物边线退尽，只等一个背包人影落在空处
context_fact: 罗辑想象在这片空白中加入自己的人影，认为那会成为庄颜最后留下的一幅画。
image_mechanism: 自然空间被二维画纸化，环境信息的消失不只是模糊，而成为主动留出的构图位置。
property_alignment: 1）天地平面对应画纸；2）雨暮朦胧对应淡墨缺席；3）地平线消失对应留白连通；4）人物行走对应画中落笔。
context_alignment: 庄颜本是画家且曾以国画式空白理解世界，罗辑在赴墓途中借她的视觉词库观看自己。
narrative_function: 把现实出走改写成庄颜画中的最后人影，连接爱情记忆、死亡意图与稍后的雪原梦。
transfer_rule: 景观作国画留白时，应有细节消隐、二维构图、少量落墨主体和与视角人物相关的绘画经验。
failure_boundary: 沙漠与天空并非真正空白，雨夜仍有地形与道路；留白表达主观构图，不可当作环境信息全无。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 暮色和细雨抹去沙漠、天空的细节与分界，只留下罗辑将要走入的大片朦胧空间
vehicle: 中国画未着墨的留白，纸面空阔、边界淡化，等待少量人物或墨迹赋予构图意义
ground: 1）迷蒙天地对应未着墨纸面；2）细节消失对应留白；3）沙天相连对应空白连续；4）罗辑人影对应待添主体；5）庄颜画作对应国画构图。
