tenor: 八百公里外两千艘战舰缩成规则排列的小点，其矩形秩序覆盖在混沌繁星背景之前
vehicle: 一张横竖间距均匀的透明坐标网铺在无规则图景上，把背景切成规整方格
ground: 1）战舰行列对应网线交点；2）矩形编队对应网格；3）银河对应底图；4）规则间距对应等距格；5）远距缩小对应细线；6）覆盖视野对应罩上。
