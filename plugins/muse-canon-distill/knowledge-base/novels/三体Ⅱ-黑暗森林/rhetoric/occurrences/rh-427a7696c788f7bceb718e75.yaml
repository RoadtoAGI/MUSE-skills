quote: 整个矩形阵列仿佛是罩在银河系前的一张网格
sensory_mapping: 群舰缩成点阵、横纵线在眼中连起、规整网罩住星海、混沌被切格
context_fact: 穿梭艇前往螳螂号时从舰队正前方回望，单舰已难辨，只能由排列识别整体。
image_mechanism: 距离抹去舰体却保留位置关系，观察者在点间补出横纵线，使舰队由机器群转成覆盖宇宙的几何图层。
property_alignment: 1）单舰对应网格节点；2）百乘二十阵列对应矩形格；3）统一舰距对应格距；4）银河星海对应被罩底面；5）远观轮廓对应细网；6）人类规律对应人工几何。
context_alignment: 它紧接丁仪把舰队想成矩阵，数学概念获得可见网格，规则与星海混沌的对比也回应物理规律独立存在。
narrative_function: 以优美几何固定毁灭前最后一幅完整舰队图像，并突出密集规则将如何帮助水滴连杀。
transfer_rule: 点阵作网格时，应让单体在远距消失而规则间距仍可见，并给网格配置明确底图与覆盖方向。
failure_boundary: 战舰间没有实体网线，银河也未被遮挡；规则阵列不代表系统坚固或可抵抗攻击。
quality_assessment: exemplary
