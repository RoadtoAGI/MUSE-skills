quote: 更像实际意义上的面壁者，他所面对的墙壁就是大屏幕上三体世界方向的星空照片
sensory_mapping: 黑色墙面、星点微痕、长久凝视、墙后敌影
context_fact: 斐兹罗反复观察三体方向照片，熟记星位，五年等待第二次舰队尘埃尾迹。
image_mechanism: 大屏幕的黑底竖起成为真正墙面，星光只是墙上针孔；将军用持续凝视试图穿过它，看见四光年后的行动。
property_alignment: 1）斐兹罗对应面壁者；2）星空照片对应墙；3）三体舰队对应墙后秘密；4）观测等待对应面壁思考。
context_alignment: “面壁者”政治称号在此还原为字面姿态，却反向指向公开科学观察，兼具形象与制度讽刺。
narrative_function: 把配角长期观测提升为与面壁计划同构的等待，重申信息壁垒是危机核心。
transfer_rule: 称号字面化应让角色动作、对象形态和信息阻隔三项吻合，并借差异产生新认识。
failure_boundary: 斐兹罗没有面壁者权力或秘密战略，照片也提供真实数据而非完全封闭；类比只限工作姿态。
