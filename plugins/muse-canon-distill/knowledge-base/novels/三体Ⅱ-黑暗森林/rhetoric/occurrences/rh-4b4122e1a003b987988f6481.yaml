chapter: 正文
figure_type: simile
quote: 像山顶上镶嵌着的一块光灿灿的宝石
sensory_mapping: 太阳沉到山后，只留一角金亮晶体卡在山巅，像黑色冠座上最后一颗宝石
context_fact: 罗辑刚说希望阳光照进黑暗森林，现场太阳却正在落下，孩子在金色晚霞草地上跑远。
image_mechanism: 巨大太阳被遮挡缩成可嵌小物，地平线的遮蔽关系直接变成宝石与镶座结构。
property_alignment: 1）太阳余部对应宝石表面；2）山峰轮廓对应托座；3）遮挡对应嵌入深度；4）晚霞亮度对应珠光。
context_alignment: 前句理想阳光宏大抽象，宝石将现实余晖收成珍贵小点，既承认落日又保留可携带的光。
narrative_function: 以克制亮点结束黑暗森林愿景，让希望呈现为尚未消失、也尚未照遍森林的一小块光。
transfer_rule: 残日作镶嵌宝石时，应让遮挡形成嵌入、山形充当托座，并控制光点尺度与色泽。
failure_boundary: 太阳没有缩小或固定在山体，光点随观察位置和落日继续消失；喻体只描述瞬时构图。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 落日只剩顶端一点露在远山之上，形成小而集中、明亮的金色光点
vehicle: 一块被嵌进山冠的发光宝石，体积小、边界清楚、颜色璀璨，并在暗色基座上闪耀
ground: 1）残日光点对应宝石；2）山顶对应镶座；3）局部露出对应嵌入；4）金亮色对应珠宝光泽；5）远景静止对应固定饰物。
