chapter: 正文
figure_type: metaphor
quote: 使房间变成了一个光怪陆离的大盒子
sensory_mapping: 墙壁折成巨大盒面，数据光从六面同时闪入，家具和罗辑在彩色影像中融化失去边线
context_fact: 房间未开灯，所有墙壁都改成信息墙，大量数据、曲线和氢弹画面成为唯一照明。
image_mechanism: 普通居室被几何封装为盛装影像的容器，六面光源让居住功能退去，只剩信息把人包在内部。
property_alignment: 1）墙体对应盒壁；2）室内对应盒腔；3）画面对应包装图纹；4）人物家具对应被装内容；5）彩光对应内壁反射。
context_alignment: 主任推门进入而非技术观看，‘大盒子’以日常空间词概括未来信息墙，同时呈现罗辑自我封闭。
narrative_function: 把雪地工程数据对生活空间的占领可视化，并衬出角落里几乎被影像吞没的罗辑。
transfer_rule: 房间作盒时，应让各壁、内部内容、封闭入口与光照方式逐项对应，说明盒子装住了什么。
failure_boundary: 房间仍有门、家具与居住功能，不是可携带容器；盒状只表达封闭几何和信息包围。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 四壁信息画面同时闪烁、彩光充满且实体和影像难分的罗辑房间
vehicle: 封闭盒体的每个内壁都贴满活动发光图案，内部物件被彩色反光吞没、边界混杂
ground: 1）房间四壁对应盒面；2）墙幕对应发光内衬；3）封闭空间对应盒腔；4）彩光包围对应盒内光场；5）实体难辨对应内容混杂。
