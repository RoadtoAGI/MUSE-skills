quote: 使她看上去像是映在窗帘上的一个曼妙的剪影。这真的像一部老黑白电影里的情景
sensory_mapping: 视觉、明暗、媒介距离
context_fact: 罗辑与刚认识一周的女子准备分手，他甚至想不起她的名字，只记得眼前姿态。
image_mechanism: 晨光先把活人压成无细节轮廓，再用电影画框将亲密现场变成可旁观、可遗忘的旧镜头。
property_alignment: 1）逆光人形对应剪影；2）褪色情感对应黑白影像；3）短暂关系对应一段即将结束的镜头。
context_alignment: 罗辑习惯把情人当可替换形象，电影化观看准确暴露其审美兴趣强于真实关心。
narrative_function: 以漂亮画面反写关系空洞，并为女子随后被撞、罗辑才想起名字制造残酷反差。
transfer_rule: 用电影比拟现实片刻时，应让光线、取景和人物的情感距离都具备媒介化特征。
failure_boundary: 有充分互动、色彩细节和深厚记忆的亲密场景不宜写成无名旧片；剪影也不能说明女子真实面貌。
