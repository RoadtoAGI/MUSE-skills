context_fact: 罗辑指控联合国未经同意带走孩子违法，萨伊以他取得特权资源同样超越现行规则回应。
image_mechanism: 抽象法条被组装成一只可见外框，行为只有放进框内才易于判断；危机时代的双方行动都伸到旧边界之外。
property_alignment: 1）法律体系对应框架；2）适用范围对应框内面积；3）面壁特权与强制措施对应框外部分；4）危机解释对应调整边界。
context_alignment: 争论焦点正是既有法律能否容纳危机行为，空间边界让双方共同越界的对称性清晰显现。
narrative_function: 削弱罗辑单向指控的立足点，并显示危机制度正以例外重塑合法性。
transfer_rule: 法律框架喻应点出框内规则、越界行为和可能扩框机制，不能只把‘依法’换成空洞空间词。
failure_boundary: 法律并非固定几何边框，解释与权利冲突有层级和程序；超出旧条文不自动取得正当性。
