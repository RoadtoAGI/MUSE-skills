tenor: 相对地球生命、文明与核历史都恒久存在的太阳
vehicle: 永恒君王宣告其他万物只是从门隙前一闪而过的白马
ground: 1）太阳跨亿年持续对应宣告者长存；2）文明生命短暂对应白马瞬逝；3）日出庄严对应君王发言；4）光照万物对应面向世界；5）历代共同见证对应时间对照。
