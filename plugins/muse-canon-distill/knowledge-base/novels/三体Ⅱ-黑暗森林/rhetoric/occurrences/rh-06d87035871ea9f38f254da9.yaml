quote: 仿佛在向世界宣布，除了我，一切都是过隙的白驹
sensory_mapping: 庄严升起、宏声宣告、门隙闪影、白马疾驰
context_fact: 叙述刚列出红岸、核爆、古猿、恐龙和初始细胞都曾见同一太阳。
image_mechanism: 太阳升到讲坛，以恒星寿命为尺度开口；亿万年生命史在它面前压成门缝中一匹马的白色闪影。
property_alignment: 1）太阳对应长存宣告者；2）众生文明对应白驹；3）历史时长对应过隙瞬间；4）日出对应发言登场。
context_alignment: 时间列举已经建立太阳的超长参照系，古典成语让宏大天文尺度落为一瞬可见速度。
narrative_function: 把太阳从核聚变模型提升为雷迪亚兹无法承受的毁灭与永恒象征。
transfer_rule: 永恒—瞬逝对比要先建立长尺度观察者，再把短暂对象压进一个明确快速动作。
failure_boundary: 太阳也有寿命并非绝对永恒；白驹只表达相对短暂，不能否定个体价值。
