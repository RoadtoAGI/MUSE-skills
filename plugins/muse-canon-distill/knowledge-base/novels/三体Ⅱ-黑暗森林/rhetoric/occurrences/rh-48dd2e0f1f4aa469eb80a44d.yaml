tenor: 罗辑在庄颜目光吸引下由克制滑向不可逆爱情、同时体验幸福与恐惧的精神坠落
vehicle: 人站万仞悬崖顶，在光滑冰面上失足加速，最终坠入云海覆盖的彩色深渊
ground: 1）庄颜眼睛对应深渊入口；2）爱情吸引对应向下重力；3）自控失败对应冰面无抓踏处；4）情绪加深对应滑行加速；5）完全投入对应坠落；6）幸福眩晕对应彩色云海。
