quote: 少女的眼睛就是悬崖下广阔的深渊
sensory_mapping: 万仞崖顶、彩云深渊、冰面下滑、失重坠落
context_fact: 心灵堤坝已不可避免崩溃，罗辑慌乱试图控制四肢，幸福在坠落中达到痛苦极限。
image_mechanism: 一双眼睛向下扩张成整个地形，虹彩美感覆盖危险深度；罗辑脚下的心理立足点结冰，任何挣扎都只让速度增加。
property_alignment: 1）庄颜目光对应深渊；2）罗辑对应崖顶失足者；3）自制力对应抓踏点；4）爱情深化对应下滑坠落；5）幸福对应彩云阳光；6）恐惧对应万仞高度。
context_alignment: 前文反复写爱情为深渊与被拉近，此处以完整空间和动力学兑现母题，并紧接世界熔化的宇宙幻视。
narrative_function: 把恋爱接受写成既灿烂又失控的越界，为罗辑此后以私人幸福吞没世界责任奠基。
transfer_rule: 坠落式爱情应同时保留吸引美感、危险深度、立足点丧失和速度反馈，避免把单纯幸福泛写为深渊。
failure_boundary: 罗辑仍有选择且庄颜没有主动诱坠；深渊模型容易把爱情污名为灾害，也不能证明关系必然痛苦。
