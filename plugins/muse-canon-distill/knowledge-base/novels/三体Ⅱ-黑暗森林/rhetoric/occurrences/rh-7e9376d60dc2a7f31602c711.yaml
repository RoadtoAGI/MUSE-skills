quote: 它那黯淡的光亮好似山谷中的烛光
sensory_mapping: 夜谷般陵墓中亮起微烛、一圈暖弱光晕贴上黑崖、死者姓名从钛壁中显出
context_fact: 幸存者在残舰陵墓中点亮可自动换灯泡、由核电池维持数万年的五十瓦长明灯。
image_mechanism: 高技术核供电装置被缩回古老烛火，功率微小与持续万年并置，使纪念依靠持久而非亮度。
property_alignment: 1）灯泡对应烛芯；2）核电池对应持续蜡源；3）光圈对应烛晕；4）残舰高壁对应峡谷崖；5）铭名处对应祭位。
context_alignment: 延展前一山谷框架但新增祭祀光源与时间维度，因此不是纯复指；现代技术服务最古老悼亡动作。
narrative_function: 把四千死者从数字收束到可被照见的名字，并给无人陵墓留下跨万年的记忆核心。
transfer_rule: 纪念灯作烛光时，应匹配暗场、照明范围、守夜时间和被照对象，让微光的价值来自持续。
failure_boundary: 灯泡没有火焰、蜡和温度，备用机制也不同于蜡烛；山谷空间仍是人工残骸。
