tenor: 引火物上刚燃起并沿柴堆扩张的火焰形态和动作
vehicle: 苏醒后舒展肢体、占据空间并自行生长的生命体
ground: 1）火舌摆动对应肢体伸展；2）火势扩大对应生物生长；3）自主蔓延对应活物行动；4）由小到大对应苏醒展开。
