chapter: 正文
figure_type: simile
quote: 火焰像一个活物般伸展开来
sensory_mapping: 火舌如肢、舒展、苏醒、向外生长
context_fact: 罗辑划火柴点燃果木下的引火物，庄颜在逐渐增强的金色火光中显出面容。
image_mechanism: 火舌获得肌肉和四肢，从柴堆底部醒来并舒展身体；增长的光同时把庄颜从暗影中托出。
property_alignment: 1）火焰对应活物；2）火舌对应肢体；3）蔓延对应伸展；4）点燃对应苏醒。
context_alignment: 火势确有连续扩张动作，活物意象又与庄颜由暗到明的“显影”同步，使房间像被唤醒。
narrative_function: 为庄颜首次显影提供动态光源，并把现实相遇写成生命诞生的瞬间。
transfer_rule: 活物喻写火焰应抓住某个可见动作，如伸、扑、舔或蜷缩，并让火势阶段与动作阶段吻合。
failure_boundary: 火焰没有意志和器官；静止灯光或将熄余烬若写成伸展活物，会违背运动形态。
quality_assessment: effective
