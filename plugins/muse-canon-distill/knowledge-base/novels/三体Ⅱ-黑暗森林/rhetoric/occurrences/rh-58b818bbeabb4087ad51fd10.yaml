chapter: 正文
figure_type: simile
quote: 这孩子像一个美丽的干细胞，是所有美的萌芽状态
sensory_mapping: 透明幼细胞、萌芽分化、生命起点、多向生长
context_fact: 泰勒走近后被一岁孩子的可爱吸引，认为其处于所有美尚未展开的萌芽阶段。
image_mechanism: 孩子完整身体被缩回一枚未分化细胞，尚未固定的五官和性格成为等待展开的多条生长路径。
property_alignment: 1）孩子对应干细胞；2）幼年对应未分化；3）成长可能对应分化潜能；4）美的萌芽对应组织生成。
context_alignment: 现代生物学喻体与科幻语境自然相合，也比花苞更精确表达“尚未决定将长成哪一种美”。
narrative_function: 把孩子塑造成未来本身，增加泰勒对自己虚度人生的刺痛，也抬高之后被带走的情感代价。
transfer_rule: 干细胞喻写幼小潜能时，应强调未分化、多路径和成长条件，不能只把它当“很小”的代称。
failure_boundary: 人的美不由单一生物分化决定，孩子也不承载所有美；技术化观察若缺少生命初始语境会显冷硬。
quality_assessment: exemplary
