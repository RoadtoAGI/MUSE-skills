quote: 如同在浩淼的大洋中寻找一个小小的旋涡
sensory_mapping: 无边海面、暗流翻动、小涡旋起、转瞬消散
context_fact: 大脑中的位置构图并非静态，只能依靠数学特征识别，所需计算量比恒星定位高几个数量级。
image_mechanism: 一千亿节点的动态噪声被连续化成海水，目标模式不是固定浮标，而是一团只靠旋转规律暂时维持形状的局部水流。
property_alignment: 1）神经网络对应大洋；2）思维模式对应旋涡；3）神经冲动对应海流；4）数学特征对应旋转形态；5）超级计算对应搜索船与仪器。
context_alignment: 上一类比解决静态构图，此处主动更换为流体，准确补上大脑模式会运动、变形的关键差异。
narrative_function: 直观呈现计算难度升级，并说明新超级计算机为何成为研究的必要条件。
transfer_rule: 动态目标作旋涡时，应让其由背景介质自身形成、靠关系而非物质身份识别，并具有短暂性。
failure_boundary: 脑模式可能跨多个区域并非局部圆涡，且数学识别不依赖肉眼搜海；喻体不说明具体算法。
