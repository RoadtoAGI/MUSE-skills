quote: 这是太空新人类诞生前的阵痛
sensory_mapping: 旧文明身体在刀刃上阵痛、黑暗战役像血腥分娩、幸存者从残骸中出生、葬礼后婴儿期结束
context_fact: 三人挣扎于杀人与牺牲，终极规律号先开火；蓝色空间号幸存并在葬礼后被称已度过婴儿期。
image_mechanism: 制度与伦理突变获得不可逆生物过程，痛苦、出血、幸存和成长被组织成出生阶段。
property_alignment: 1）地球伦理对应母体环境；2）选择痛苦对应宫缩；3）舰战死亡对应分娩风险；4）幸存共同体对应婴儿；5）接受黑暗法则对应成长。
context_alignment: 前文星舰成员已如割脐婴儿，此处新增阵痛与婴儿期，框架从空间独立推进到伦理物种化。
narrative_function: 把黑暗战役解释为人类形态转折，而非孤立兵变，并为‘黑暗新人类’命名提供过程。
transfer_rule: 社会转型作出生时，应按阵痛、分娩、断联、婴儿期和成长排列事件，每阶段新增可核对映射。
failure_boundary: 互杀不是生物学必需产程，将其自然化可能掩盖可选择责任；幸存者仍是原有人类。
