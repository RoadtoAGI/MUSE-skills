tenor: 星舰成员在资源死局中形成不同于地球的人性与道德，互杀战役成为这种新人类出现的暴力过渡
vehicle: 新生命出生前母体发生阵痛，胎儿经过危险产程脱离旧环境；出生后还需度过脆弱婴儿期
ground: 1）旧人类社会对应母体；2）伦理冲突对应阵痛；3）黑暗战役对应分娩；4）太空新人类对应新生儿；5）战后平静对应度过婴儿期。
