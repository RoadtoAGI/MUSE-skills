quote: 必须终身记住的东西不多，都被基因刻在被称做本能的那部分存贮区了。
sensory_mapping: 信息空间、刻写动作、容量
context_fact: 褐蚁为记住新的汉字形状不断忘掉此前形状，只有本能被终身保留。
image_mechanism: 把记忆选择改写为存储管理：新图形占空间、旧图形被清空、遗传本能被刻入不可擦除区域。
property_alignment: 1）短时形状记忆对应可覆盖数据；2）遗忘对应释放容量；3）基因本能对应永久刻录；4）神经容量对应存储上限。
context_alignment: “神经网络、存贮量、清空”形成连续技术词汇，适合解释蚂蚁为何无法保留墓碑全文，也呼应小说的信息主题。
narrative_function: 使蚂蚁忘记“杨冬之墓”成为认知容量的结果，并对照人类文明试图跨代保存信息。
transfer_rule: 借存储系统解释记忆时，要分别对应容量、写入、删除和不可改写内容，并由具体遗忘动作证明。
failure_boundary: 生物记忆不是按文件整齐分区，基因也不直接储存个体经历；该类比只说明容量竞争与遗传稳定性。
