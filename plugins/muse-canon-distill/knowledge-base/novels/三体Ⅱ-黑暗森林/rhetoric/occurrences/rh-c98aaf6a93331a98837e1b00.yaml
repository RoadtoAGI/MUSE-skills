tenor: 庄颜以清纯外形和专注姿态自然融入卢浮宫艺术环境的视觉效果
vehicle: 庭院中晶莹、异质却已成为宫殿不可缺少部分的玻璃金字塔
ground: 1）东方少女置于西方艺术对应现代金字塔置于古宫；2）外表晶莹对应玻璃质感；3）起初异质对应风格差异；4）迅速和谐对应建筑融入；5）缺少便不完整对应成为构图中心。
