quote: 她就像庭院中那座晶莹的金字塔，很快融为这艺术圣境中的一部分
sensory_mapping: 晶莹几何体、异质嵌入、光线融合、圣境构图补全
context_fact: 庄颜在欧洲古典画展厅专注观看，罗辑认为众神、天使和圣母也在看她。
image_mechanism: 她的身影被抽象成一枚透明发光几何体，嵌入古典画廊；风格差异没有排斥，反而补上构图缺口。
property_alignment: 1）庄颜对应玻璃金字塔；2）展厅对应卢浮宫庭院；3）东方身份对应现代异质建筑；4）融入艺术对应建筑融入宫殿。
context_alignment: 二人刚讨论金字塔由别扭到不可缺少，罗辑把同一观察即时迁移到庄颜，形成明确回环。
narrative_function: 表现罗辑将庄颜艺术品化的凝视，并把入口建筑母题带入展厅。
transfer_rule: 人物与建筑类比应对齐外观、文化位置和融入过程，且最好由场景中先前真实观察触发。
failure_boundary: 庄颜是行动主体而非构图配件；晶莹和不可缺少是罗辑主观理想化，不能推出她与所有艺术传统一致。
