chapter: 正文
figure_type: simile
quote: 太空军竟像一个空谈的学院了
sensory_mapping: 会议课堂、纸上谈兵、讲台空谈、太空在窗外
context_fact: 空天飞机使进入太空成本下降，常伟思认为战略研究人员应通过飞行建立太空意识。
image_mechanism: 军种的舰船、操演和战场被从画面抽走，只剩一间不断讨论太空的教室；制服军官坐成没有实验的学者。
property_alignment: 1）太空军对应学院；2）战略会议对应课堂；3）未入太空对应无实践；4）太空意识不足对应空谈。
context_alignment: 说话者以军事实践标准批评研究机构，且眼前空天飞机正提供走出教室的具体通道。
narrative_function: 合理化首批太空军军官登轨体验，突出新军种身份与能力尚未匹配。
transfer_rule: 机构像空谈学院应列出其缺失的现场、行动和反馈，而非借“学院”泛贬知识工作。
failure_boundary: 学院也可有实验和实践，战略理论并非无价值；已有大量实地训练的机构不适用此批评。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 成立多年却少有人进入太空、战略研究脱离实际体验的太空军机构
vehicle: 只在课堂和会议中讨论理论、成员缺少现场实践的空谈学院
ground: 1）军官未上太空对应教师未实践；2）战略只在纸面对应空谈；3）缺少具体任务对应无实作；4）机构名称宏大对应学院议论宏大；5）体验需求对应实地训练缺口。
