chapter: 正文
figure_type: metaphor
quote: 语言只是沉默的标点符号
sensory_mapping: 纸面空白、稀疏符号、停顿、句段结构
context_fact: 章北海告诉父亲加入太空军，父亲只点头；叙述说明父亲一直用沉默教育儿子。
image_mechanism: 通常被视为空白的沉默翻成真正文本，出声的话反而缩成几个小符号，只负责标出巨大无言内容的边界。
property_alignment: 1）沉默对应正文；2）语言对应标点；3）父子默契对应阅读能力；4）短句提示对应断句。
context_alignment: 父子都以军人式克制交流，三句问答承载三十年经验；形式倒置准确表达少言为何比长谈更重。
narrative_function: 定义章北海的交流方式，为后文“要多想”三句成为行动密码奠基。
transfer_rule: 主次倒置隐喻应让通常的载体成为内容、通常的内容成为结构标记，并由人物长期沟通习惯证明这种倒置。
failure_boundary: 沉默也可能来自隔阂、恐惧或信息缺失，不能普遍假定比语言更丰富；只有共享经历足够深时才成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 章氏父子关系中少量说出的话及其相对于长期沉默的作用
vehicle: 依附在主体文本上、划分停顿与结构却不承载全部内容的标点符号
ground: 1）长期沉默对应正文主体；2）偶尔语言对应稀少标点；3）短句划定意义节点对应标点分节；4）核心信息在未说处对应意义主要来自正文；5）父子能读懂停顿对应读者借标点理解结构。
