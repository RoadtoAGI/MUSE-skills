chapter: 正文
figure_type: analogy
quote: 地上的水洼映着正在亮起来的天空，像一片片镜子，这给人一个错觉：似乎地球就是一个镜面球体
sensory_mapping: 一片片水洼像镜壳破口反照晨天，大地仿佛只是镜球上的薄尘，雨正在逐块洗出光滑本体
context_fact: 罗辑在墓碑旁发出最后通牒前，凌晨雨停，地面水洼开始映出逐渐明亮的天空。
image_mechanism: 先由真实小镜面建立局部证据，再把这些斑块外推成行星整体材质；尺度递进使错觉有生成过程。
property_alignment: 1）水面平滑对应镜面；2）倒映天空对应全反射；3）斑块露出对应表层剥落；4）地球曲面对应球体外壳。
context_alignment: 罗辑刚梦见水滴镜面墓碑，稍后智子也以镜球出现；真实水洼把梦、三体材质和地球命运接到同一视觉链。
narrative_function: 在威慑对决前把整个地球暂时水滴化、镜面化，预示三个智子球体的突然降临。
transfer_rule: 从局部反光推整体材质时，应给出可见斑块、遮盖层、揭露动作和尺度外推的明确顺序。
failure_boundary: 水洼只在局部反射，地球表面并非镜壳，大地也不是可被雨冲走的薄膜；文本明确称其为错觉。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 雨后墓地水洼分块反射晨空，使局部地面显出光滑镜面，并诱发整个地球外壳正在露出的视觉错觉
vehicle: 一个被薄层覆盖的巨大镜面球体，雨水冲去表层后先露出若干光亮镜片，最终可显现完整球面
ground: 1）水洼对应镜片；2）天空倒影对应镜面反射；3）地球对应镜球；4）大地世界对应薄附着层；5）雨水冲刷对应揭露表面。
