quote: 自己的前半生恍若隔世
sensory_mapping: 时空断层、远景回望、陌生旧我、两个世界
context_fact: 罗辑入住庄园仅数日，却与外界无联系并沉浸于全新贵族生活。
image_mechanism: 几天被拉成一道时代裂缝，旧人生退到裂缝另一岸，记忆像来自前世而非上周。
property_alignment: 1）庄园前后对应两世；2）入住对应跨界；3）旧生活对应前世；4）疏离感对应隔绝。
context_alignment: 面壁权力确实瞬间改造其阶层、空间和日常，主观“隔世”有密集现实差异支撑。
narrative_function: 显示特权对身份连续性的侵蚀，强化罗辑正从普通社会脱离。
transfer_rule: 隔世感应由多个生活维度同步突变支撑，并指出跨界节点与被切断的旧联系。
failure_boundary: 时间只过数日，旧关系和责任仍存在；主观陌生不等于人生真正重启。
