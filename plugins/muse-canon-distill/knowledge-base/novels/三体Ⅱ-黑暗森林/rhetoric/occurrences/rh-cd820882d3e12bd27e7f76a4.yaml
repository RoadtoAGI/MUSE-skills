tenor: 短暂庄园生活使罗辑感觉此前人生遥远而陌生
vehicle: 发生在另一个时代或世界、与当下主体隔绝的一生
ground: 1）生活环境骤变对应跨越世界；2）旧关系中断对应时空隔绝；3）记忆仍在却缺乏现实感对应遥望前世；4）短时间主观拉长对应仿佛跨世。
