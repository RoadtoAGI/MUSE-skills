chapter: 正文
figure_type: simile
quote: 仿佛每时每刻都在宇宙之夜中没有尽头地滴落着
sensory_mapping: 银滴从黑夜落下、尾尖被拉长、星光沿表面流动、坠落永不着地
context_fact: 人类首次看到探测器影像，被其超出所有已知封闭曲面的完美造型吸引，因而急于直接接触。
image_mechanism: 静态几何通过液滴形成瞬间获得时间轴，尖尾保存下坠速度，宇宙无地面则把一瞬拉成永恒。
property_alignment: 1）水滴外形对应落液；2）浑圆头部对应液滴主体；3）尖尾对应拉伸；4）镜面光纹对应流动；5）黑色太空对应夜空；6）悬停对应无终点坠落。
context_alignment: 它承接‘一滴水银’核心框架并新增永恒运动映射，使人类把静止探测器感成柔美、无目的的自然现象。
narrative_function: 把水滴美感推至催眠程度，解释全世界为何越过谨慎程序，把探测器当成善的化身。
transfer_rule: 静物获得运动感时，应从轮廓保存的受力瞬间出发，再用环境取消终点，使瞬间动作持续化。
failure_boundary: 探测器并未自由落体或变形，宇宙也无绝对向下；滴落的柔软不能转移到强相互作用材料。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 水滴探测器虽静止悬浮，其头圆尾尖的连续曲面仍给人永恒向下运动、尚未完成成形的动态感
vehicle: 一滴液体在无边黑夜中持续下坠，被速度拉出尖尾，却永远不到达地面也不结束滴落
ground: 1）探测器对应液滴；2）尖尾对应下坠拉伸；3）飘逸曲面对应流动；4）太空黑暗对应夜；5）悬浮对应无尽坠落；6）无终点对应宇宙无底。
