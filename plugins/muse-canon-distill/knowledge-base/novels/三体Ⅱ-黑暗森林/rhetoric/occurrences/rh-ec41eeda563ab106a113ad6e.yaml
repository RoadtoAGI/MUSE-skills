chapter: 正文
figure_type: analogy
quote: 我们属于大地和海洋，你们属于星空
sensory_mapping: 旧人脚踏大地航行海面、新人轻悬星海、两代隔着栖息介质相望
context_fact: 东方延绪在无舱壁全景中像羽毛般悬浮，章北海则回忆地球家庭并感到她属于星空。
image_mechanism: 文化与身体代差被重写成栖息地分化，‘属于’把训练偏好提升为物种般的自然归属。
property_alignment: 1）章北海一代对应大地海洋居民；2）东方一代对应星空居民；3）重力身体对应陆地适应；4）海军源流对应海洋；5）修长轻灵体态对应失重适应；6）价值距离对应生态边界。
context_alignment: 二人正悬在模拟星海，东方享受无依附状态，章北海却以地球家庭记忆回应；现场姿态直接验证归属差。
narrative_function: 温柔概括两代人的不可互换性，为章北海即将以旧人类生存逻辑夺取新人类战舰制造悲剧张力。
transfer_rule: 代际差作栖息域时，应同时对齐身体适应、职业传统、审美偏好和价值来源，避免只按年龄分区。
failure_boundary: 两代都依赖地球文明且能学习彼此技能，归属不是生物决定；章北海也深度向往星空。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 章北海认为旧时代军人仍以地球、陆海经验和家园伦理为根，而东方延绪等太空新人类已把失重宇宙当作自然归属
vehicle: 不同物种或族群各自属于陆地、海洋或星空栖息域，在适合自己的介质中行动并形成不同身体与感知
ground: 1）旧人类对应陆海生物；2）太空新人类对应星空生物；3）地球重力对应大地；4）海军传统对应海洋；5）失重适应对应星空栖息；6）代际差异对应不同生态归属。
