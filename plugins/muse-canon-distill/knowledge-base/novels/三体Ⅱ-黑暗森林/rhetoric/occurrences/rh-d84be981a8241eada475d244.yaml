quote: 六十岁和十六岁一样是人生最美好的年龄
sensory_mapping: 人生阶段、负担重量、时间窗口
context_fact: 老杨用“第二童年”劝刚退休的张援朝享受生活，并具体说明负担已卸、迟缓病痛未至。
image_mechanism: 把线性衰老折回青春节点，让六十岁的退休从“接近终点”改写为两个重压之间的重新出发。
property_alignment: 1）卸下四五十岁负担对应摆脱童年管束；2）病痛未至对应成人重压尚未完全到来；3）退休新生活对应青春新阶段。
context_alignment: 这是退休教师老杨的劝慰性概括，紧跟生活条件解释；随后张援朝“没有阳光”又反衬危机如何击碎这套乐观类比。
narrative_function: 先建立平民晚年的可期待秩序，再让三体危机侵入，显示宏大灾难怎样改变日常时间感。
transfer_rule: 比较人生阶段时，应找出两端共同的前置负担、暂时自由和即将到来的限制，并由情境检验这种乐观是否成立。
failure_boundary: 十六岁与六十岁的身体、社会权利和未来长度不同；若人物仍负担沉重或已受疾病限制，“第二青春”会显得强行安慰。
