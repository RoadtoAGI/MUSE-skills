quote: 智子的眼睛无处不在
sensory_mapping: 微小眼球、全向凝视、无死角、被观看感
context_fact: 秘书长说明主流防御计划从总体战略到硬盘信息都会即时暴露给四光年外敌人。
image_mechanism: 不可见粒子获得眼球形态，嵌进房间、文件柜和计算机，任何动作都在无数瞳孔中同时成像。
property_alignment: 1）智子对应眼睛；2）地球空间对应视野；3）行动信息对应影像；4）三体统帅部对应观看大脑。
context_alignment: 复杂监控原理需在公开讲话中迅速可懂，“眼睛”把技术能力转成每个人熟悉的被盯视感。
narrative_function: 建立面壁计划的基本压力：外部世界全可见，秘密只能退入大脑。
transfer_rule: 眼睛写监控时，应标明感知对象、覆盖范围、观看者和从观察到理解之间仍存在的距离。
failure_boundary: 智子并非人眼，也不一定正确解释全部行为；无处不在的观察不能等同全知。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 智子遍布地球并能持续观察所有公开信息与行动的监视能力
vehicle: 数量众多、散布每个角落且始终睁开的眼睛
ground: 1）智子感知对应眼睛观看；2）覆盖会议室与设备对应眼睛遍布；3）持续监控对应不闭眼；4）信息传回三体对应视觉信号送往观察者。
