chapter: 正文
figure_type: metaphor
quote: 这个仍未醒来的世界，不知道自己已被当做一场豪赌的筹码，放到了宇宙的赌桌上
sensory_mapping: 沉睡地球被缩成一枚重筹码，罗辑在墓碑旁把它推入漆黑宇宙的桌心，对手必须跟注或退让
context_fact: 清晨大多数人尚未醒来；罗辑的生命监测器一旦停信号，核弹阵列便会同时暴露三体和太阳系坐标。
image_mechanism: 无法感知的文明级概率风险被桌面化为可见下注，‘筹码’同时显出价值、被动性和可能一次清零。
property_alignment: 1）地球生命总量对应赌注价值；2）罗辑触发权对应推筹动作；3）未知外星打击对应随机牌面；4）三体回应对应对手决策；5）共同灭亡对应输光。
context_alignment: 罗辑站在自掘墓穴旁以命下注，个人赌命与世界赌命同构；世界沉睡又强调被代表者毫不知情。
narrative_function: 凝练黑暗森林威慑的伦理代价，把英雄行动同时定性为孤独、有效而可怕的赌博。
transfer_rule: 风险决策作赌博时，应明确下注者、筹码所有者、对手、未知结果和输掉后果，尤其区分谁决定与谁承担。
failure_boundary: 威慑不是纯随机游戏，核弹布局、三体判断和打击概率都有因果结构；称豪赌不能免除罗辑对他人生命的责任。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 罗辑在世人不知情时把地球和三体的共同毁灭风险押进威慑，以全部生命迫使三体让步
vehicle: 赌徒把价值最大的筹码推上赌桌，在结果揭晓前承担全部输掉的风险，并以赌注迫使对手决断
ground: 1）两个世界的生存对应筹码；2）黑暗森林宇宙对应赌桌；3）罗辑对应下注者；4）三体对应对手；5）坐标广播对应押注动作；6）威慑成败对应输赢。
