chapter: 正文
figure_type: simile
quote: 面部像石像般坚硬
sensory_mapping: 石质面孔、肌肉冻结、固定表情、无生命静止
context_fact: 破壁人已说出真实战略关键，泰勒最后希望破灭，选择沉默等候最终揭示。
image_mechanism: 血肉表面迅速矿化，所有可泄露恐惧的肌肉被封进石层，只留下一个等待落刀的固定轮廓。
property_alignment: 1）泰勒面部对应石像；2）僵硬肌肉对应石材；3）无反应对应雕像静止；4）压抑情绪对应石层封闭。
context_alignment: 行刑框架需要受刑者静止待刀，石像既写政治家最后控制，也显出精神已经失去活性。
narrative_function: 暂停泰勒外部反应，让破壁人的最终陈述占满场景并放大心理死亡。
transfer_rule: 石像脸喻要有表情冻结、身体静止和情绪封闭三层证据，适合强压而非单纯冷静。
failure_boundary: 泰勒内心并不冷硬，随后仍说话行动；面无表情也可能源于镇定，不能自动推断精神死亡。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 泰勒在秘密即将被完全揭开时强行冻结表情、拒绝回应的僵硬面容
vehicle: 由石头雕成、肌理坚硬且永不改变表情的雕像脸部
ground: 1）面肌僵住对应石材硬；2）无表情对应雕像固定；3）沉默不动对应无生命；4）等待打击对应刑场塑像；5）情绪封闭对应石面不透。
