chapter: 正文
figure_type: metaphor
quote: 夕阳正在从雪峰上收回它的光芒
sensory_mapping: 光束回撤、雪峰暗下、夕阳离场、眼眸失亮
context_fact: 庄颜刚否认能主动寻找爱情，夕阳离开雪峰，她的眸子随之暗一些、目光柔和。
image_mechanism: 太阳获得一双远伸的手，先把银光铺在峰顶，再随谈话转暗将手臂一点点收回；外景退光同步进入眼睛。
property_alignment: 1）夕阳对应撤离者；2）光芒对应伸出的手或赠物；3）雪峰对应受照者；4）日落对应收回动作。
context_alignment: 光线变化真实可见且直接改变庄颜瞳孔，拟人动作把情绪转折与日落时点缝在一起。
narrative_function: 让关于爱情的谈话从兴奋转为低柔，并为庄颜含蓄回应留下暗场。
transfer_rule: 光源拟人化应依据亮区实际移动方向选择伸、收、追或退，并让人物或物体状态随光变化。
failure_boundary: 太阳没有意志，光也不是可收回物；云层遮挡或人工关灯若原因不同，不宜沿用夕阳撤手。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 日落时雪峰受照区域逐渐缩小、庄颜眼中亮度随之变暗的自然过程
vehicle: 有意志的照明者把先前伸向山峰的光束或手臂缓缓撤回
ground: 1）亮区缩小对应光被收回；2）太阳下落对应照明者离场；3）过程渐进对应缓慢撤手；4）眸子暗下对应受赠光消失；5）雪峰先发亮对应曾被光覆盖。
