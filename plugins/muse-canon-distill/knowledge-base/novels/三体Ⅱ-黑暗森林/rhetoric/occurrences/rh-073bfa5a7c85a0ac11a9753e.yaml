chapter: 正文
figure_type: metaphor
quote: 仿佛下面的雪原就是一个大白线团，一只看不见的巨手从线团中抽出一根线拉向太空。
sensory_mapping: 视觉、线形、向上运动
context_fact: 导弹离开发射井后，近地烈焰已远去，只剩一条白色尾迹在高空延长。
image_mechanism: 把暴烈发射冷却成纺线动作：大地收缩为线团，尾迹成为从地表抽出的细线，运动方向由无形手持续牵引。
property_alignment: 1）雪原白面对应白线团；2）凝结尾迹对应单根线；3）导弹上升对应抽线动作。
context_alignment: 扁角鹿先受爆炸惊吓，随后见远处景象转为平和；柔缓抽线图像准确承接由近及远的感官变化。
narrative_function: 完成同一发射由恐怖到宁静的视觉变调，同时清楚标出导弹通向太空的路径。
transfer_rule: 描写远去物体时，可把背景、轨迹和驱动力组成一个日常动作，让轨迹从环境中“生长”出来。
failure_boundary: 黑色尾烟、折断轨迹或横向乱飞不具备白线从白地连续抽出的形色关系，不能套用线团图景。
