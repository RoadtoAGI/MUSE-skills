tenor: 白色雪原与导弹升空后留下的长白尾迹
vehicle: 巨大的白线团及把线抽向高处的无形手
ground: 1）雪原的整片白色对应线团本体；2）细长白尾迹对应被抽出的线；3）尾迹持续向上延长对应手把线不断拉向太空。
