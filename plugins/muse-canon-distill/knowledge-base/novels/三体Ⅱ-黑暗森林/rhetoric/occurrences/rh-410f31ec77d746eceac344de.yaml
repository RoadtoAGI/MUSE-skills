review_status: reviewed
tenor: 一次次翻土、填沟之后突然出现的黑色墓碑
vehicle: 给每场灾变盖下的醒目记号
ground: 1）墓碑总在地貌被翻动后出现，对应事件结束后留下标记；2）黑色孤峰在平地上突兀可见，对应记号的醒目；3）孤峰长期留存，对应标记保存灾变痕迹。
