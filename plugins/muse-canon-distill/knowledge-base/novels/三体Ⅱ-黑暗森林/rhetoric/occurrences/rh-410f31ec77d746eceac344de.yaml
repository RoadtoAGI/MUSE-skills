chapter: 正文
figure_type: simile
quote: 好像是给每次灾变打上一个醒目的标记。
sensory_mapping: 视觉、空间、时间
context_fact: 褐蚁记得泥土与峡谷反复出现、消失，随后一座黑色孤峰留在原处。
image_mechanism: 把蚂蚁无法理解的人类埋葬活动压缩成“灾变—盖章”的动作链，让静止墓碑带上事件留下痕迹的动态来历。
property_alignment: 1）灾变后的孤峰对应事件后的记号；2）黑峰的颜色与高度对应记号的可辨识性；3）反复出现的孤峰对应一次次被登记的灾变。
context_alignment: 蚂蚁只掌握地表扰动和新障碍物，无法识别墓碑；“标记”既符合其有限认知，也让读者看见人类死亡在微观尺度留下的痕迹。
narrative_function: 以蚁视角遮蔽墓地真相，同时把个体葬礼放进亿年尺度的反复灾变中。
transfer_rule: 写陌生视角时，可让观察者把未知造物理解为自己能辨认的“事件痕迹”，并让出现时序、显眼程度、留存时间同时对应。
failure_boundary: 若物体并非在扰动后出现，或没有突兀、留存的特征，“标记”只会成为作者替观察者强加的抽象判断。
quality_assessment: effective
