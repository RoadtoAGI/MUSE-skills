chapter: 正文
figure_type: simile
quote: 他像一个仆役般站在泰勒身后
sensory_mapping: 低后站位、礼帽在手、鞠躬、慢声侍候
context_fact: 破壁人已表明身份，却仍为自己来晚道歉，以极恭敬姿态准备揭露泰勒。
image_mechanism: 对手关系在身体位置上伪装成主仆关系，破壁人把自己压到身后低处，却由这个服侍位置控制谈话节奏。
property_alignment: 1）破壁人对应仆役；2）泰勒对应主人；3）身后侍立对应候命；4）谦卑话语对应服侍礼仪。
context_alignment: 他的外表本就像旧式小职员，仆役姿态延续伪弱形象，同时与实际掌握生杀信息的权力形成反差。
narrative_function: 让破壁过程带上礼貌凌迟感，凸显真实权力与表面等级倒置。
transfer_rule: 仆役喻对手应通过站位、称谓和动作建成表面服从，再用信息控制显示反向权力。
failure_boundary: 破壁人并不服从泰勒，谦卑是策略与性格表演；真正服务关系若无权力反差，就没有讽刺。
