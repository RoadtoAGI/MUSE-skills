tenor: 破壁人站位低后、姿态恭敬并以谦卑慢语服侍般对待泰勒的外在表现
vehicle: 侍立主人身后、随时听命且压低自身地位的仆役
ground: 1）站在身后对应仆役位置；2）连连鞠躬对应服侍礼节；3）说话谦卑对应下人语气；4）称先生对应主仆称谓；5）慢而体贴对应侍奉。
