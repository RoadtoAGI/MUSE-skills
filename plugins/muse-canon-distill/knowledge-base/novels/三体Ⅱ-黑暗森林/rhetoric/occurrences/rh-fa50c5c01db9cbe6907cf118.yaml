quote: 这是美感的原始单细胞态
sensory_mapping: 生命形态、复杂度、成长过程
context_fact: 褐蚁喜欢“9”的平滑形状，却受神经网络容量限制，随后忘掉这些感受。
image_mechanism: 把不可见的最低限度审美变成一枚微小活细胞：它已经活着，却没有器官、语言和继续生长的条件。
property_alignment: 1）模糊愉悦对应最低复杂度生命；2）美感萌动对应细胞初生；3）记忆被清空对应进化链被截断。
context_alignment: 蚂蚁段落持续以生命尺度观察文明，单细胞术语既符合生物对象，也与人类复杂审美形成尺度反差。
narrative_function: 承认非人生命具有审美种子，同时强调认知容量如何限制经验保存与文化生成。
transfer_rule: 表现意识萌芽时，可用生命复杂度映射感受的结构、持续性和发展潜力，并交代它为何不能继续演化。
failure_boundary: 单细胞只是复杂度喻体，不能推断审美真的遵循生物进化阶段；若感受已能语言化和积累，该喻体会低估它。
