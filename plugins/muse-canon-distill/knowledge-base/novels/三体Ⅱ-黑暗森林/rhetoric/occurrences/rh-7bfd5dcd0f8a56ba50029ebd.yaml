quote: 舰队和地球的神经已经够紧张了
sensory_mapping: 两个世界连成一具身体、通信线变作神经、焦虑把神经拉紧、闲谈试图松开一线
context_fact: 考察队对接前，西子提醒外部频道开启，丁仪说闲谈可让紧张的人群转移注意。
image_mechanism: 分布在广阔空间的群体情绪被整合成一个可拉紧的感知系统，通信使共同紧张具有生理触感。
property_alignment: 1）实时通信对应神经连接；2）公众情绪对应神经兴奋；3）持续关注对应紧绷；4）幽默转移对应舒缓。
context_alignment: 水滴信号正被全人类同步观看，‘神经’准确涵盖传导网络和情绪反应两层。
narrative_function: 以轻松口吻标出集体心理已到临界点，为稍后的狂喜与崩溃做生理伏笔。
transfer_rule: 联网群体作神经系统时，应同时映射传导线路、刺激来源、紧张程度和可能失控的反应。
failure_boundary: 舰队和地球没有单一中枢或统一感觉，个体反应差异不能由一条神经概括。
