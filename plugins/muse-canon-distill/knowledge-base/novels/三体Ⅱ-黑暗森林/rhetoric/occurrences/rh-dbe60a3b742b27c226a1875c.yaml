quote: 一个外形像体育馆的建筑物
sensory_mapping: 宽大馆体、高穹隐雾、入口开阔、室内空场
context_fact: 希恩斯刚苏醒便进入该建筑，内部白雾积聚在高处，以全息方式显示一千亿神经元。
image_mechanism: 陌生科研设施先借熟悉公共建筑确定轮廓与尺度，随后内部的雾和星海再打破体育馆预期。
property_alignment: 1）计算设施建筑对应体育馆；2）建筑宽度对应场馆跨度；3）看不见的穹顶对应高顶；4）容纳巨型显示对应容纳大型活动。
context_alignment: 刚从冬眠醒来的希恩斯需要用旧时代熟悉形态辨认新设施，功能未知时先按外形判断符合视角。
narrative_function: 快速校准空间尺寸，为一千亿神经元被具象成可步入环境预留舞台。
transfer_rule: 建筑外形类比应选择读者熟悉且在跨度、穹顶和入口尺度上可核对的类型，避免把功能也强行等同。
failure_boundary: 建筑并非体育赛事场所，内部布局与声学可能完全不同；类比只承载外部轮廓和大尺度。
