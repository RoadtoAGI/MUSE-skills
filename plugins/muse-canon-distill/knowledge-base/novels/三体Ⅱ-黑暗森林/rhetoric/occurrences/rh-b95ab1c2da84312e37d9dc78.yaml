tenor: 星舰地球被想象为文明新起源的纯洁乐园，随后因资源有限和猜疑出现互杀选择，成员获得残酷生存认知
vehicle: 《圣经》伊甸园中人类起初无忧，毒蛇引诱食下智慧果、获得禁忌知识，继而面临罪与被逐出乐园
ground: 1）五舰社会对应伊甸园；2）公民对应亚当夏娃；3）资源死局对应毒蛇；4）黑暗认知对应智慧果；5）互杀与淘汰对应逐出；6）人性转变对应知善恶。
