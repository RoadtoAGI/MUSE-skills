quote: 越来越多的人把星舰地球称为第二个伊甸园
sensory_mapping: 五舰围成第二花园、冰冷毒蛇爬入意识、舰员摘下生存智慧果、阳光熄灭、有人将被赶出园门
context_fact: 星舰成员先热议民主新世界，随后高层意识到燃料只够一舰，伊甸园、毒蛇、智慧果和逐出意象反复展开。
image_mechanism: 一整套创世神话为社会转变提供阶段：无知幸福—诱惑认知—获得智慧—失去乐园，心理黑化因此具叙事骨架。
property_alignment: 1）新文明起点对应创世花园；2）短暂和谐对应无罪状态；3）资源计算对应蛇语；4）黑暗森林结论对应智慧果；5）杀死他舰对应驱逐；6）新人类对应知罪后的成人。
context_alignment: 人物自己使用宗教词汇讨论极端选择，牧师斯科特又延展毒蛇与果实，符合角色背景并保持框架连续。
narrative_function: 把难以直说的互杀计划编码进共同神话，使三人和蓝西能以隐语交流并逐步承认选择。
transfer_rule: 延展典故应按原型事件顺序分配现实节点，每次复现新增映射，首处卡吸收完整发展并标出偏离。
failure_boundary: 资源危机不是超自然诱惑，智慧果也不等同杀人真理；原典由神驱逐，而星舰成员彼此淘汰。
