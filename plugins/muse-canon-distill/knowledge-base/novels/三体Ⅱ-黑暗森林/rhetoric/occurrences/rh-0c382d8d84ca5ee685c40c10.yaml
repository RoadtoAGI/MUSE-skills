quote: 只有我们这两个历史的垃圾能互相理解
sensory_mapping: 历史车轮后留下废物堆、两名旧人被扔在边缘、狂欢人群从旁经过、废物彼此认出
context_fact: 全球庆祝人类胜利，希恩斯却因失败主义钢印痛苦，惠子已自杀，面壁计划也被废止。
image_mechanism: 历史评价被物质化为使用与抛弃，人物自我价值从救世主直落到需要清除的残余物。
property_alignment: 1）希恩斯罗辑对应废物；2）面壁使命对应旧用途；3）两个世纪对应使用期；4）计划终止对应丢弃；5）公众遗忘对应远离垃圾。
context_alignment: 希恩斯在狂欢光海边苍白发颤，自贬语气符合其绝望，也把罗辑从普通人安逸中拉回共同过去。
narrative_function: 在集体神化中放入被历史抛弃者视角，揭示胜利叙事对失败信念者的残酷。
transfer_rule: 过时人物作垃圾时，应写明原用途、判废者、丢弃位置和残余价值，保留说话者的自我伤害。
failure_boundary: 两人仍有经验与行动价值，历史评价也会改变；‘垃圾’是希恩斯情绪判断。
