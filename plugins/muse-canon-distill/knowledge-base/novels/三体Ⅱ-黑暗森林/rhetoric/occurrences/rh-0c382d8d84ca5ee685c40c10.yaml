tenor: 希恩斯认为自己和罗辑都是被新时代判定失败、过时且不再有公共价值的旧面壁者
vehicle: 完成使用后被社会丢弃的废物，占地方、令人厌弃，只有同堆废物彼此相邻
ground: 1）两名面壁者对应垃圾；2）旧计划对应废弃物；3）新时代轻视对应丢弃；4）身份失效对应失去用途；5）彼此理解对应同处废物堆。
