chapter: 正文
figure_type: simile
quote: 丰富的涵义从目光中涌出，就像引力波束形成的云之井中涌出的白云一般，无休无止
sensory_mapping: 两人的目光像相连云井，未说出口的意思化为白云一团团涌出，在彼此之间无尽展开
context_fact: 天线上方正有云在波束中不断产生；罗辑与庄颜重续两百年前的对视，称相爱者早有目光语言。
image_mechanism: 抽象语义获得现场云的生成过程，目光不是容器而是持续源头，信息丰度由可见物质不断涌出表现。
property_alignment: 1）视线通道对应波束井；2）语义单位对应云团；3）交流持续对应凝云不止；4）私密世界对应有限生成区。
context_alignment: 喻体就在一家人头顶真实发生，庄颜曾设想目光语言，未来技术奇观如今为她的旧想法提供感官模型。
narrative_function: 将爱情从罗辑单方面想象确认为双向语言，并把宇宙通信技术转成亲密交流意象。
transfer_rule: 无言交流作涌云时，应设置固定源、可分辨的含义团、持续生成机制和只对特定接收者成立的边界。
failure_boundary: 目光不能传输无限精确信息，理解依赖共同经历；云的无休止生成不证明交流无误或无终点。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 罗辑与庄颜对视时，无需语言便持续交换大量只有相爱者能理解的含义
vehicle: 引力波形成的圆形云井不断从固定区域生成白云，旧云吹散后新云仍无休止涌出
ground: 1）目光对应云井；2）丰富含义对应白云；3）持续表达对应不断生成；4）外人难进入对应局地边界；5）含义展开对应云朵涌散。
