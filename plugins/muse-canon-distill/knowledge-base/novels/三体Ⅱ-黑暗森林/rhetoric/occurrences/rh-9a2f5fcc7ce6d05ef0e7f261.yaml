context_fact: 第一队列爆炸产生的固液混合碎片飞到第二队列，防御系统用激光与电磁炮拦截。
image_mechanism: 高危残骸被转换成节庆焰火的爆开轨迹，灿烂视觉与实际杀伤形成刺痛反差。
property_alignment: 1）硬壳碎片对应焰火外壳；2）内部熔液对应火药火星；3）拦截命中对应引爆；4）四散弹道对应焰火放射。
context_alignment: 舰队刚从庆典进入屠杀，焰火意象让胜利庆祝的亮色被战舰残骸接管。
narrative_function: 把次生碎片的物理状态和迷惑性美感同时显影，铺垫第二队列受创。
transfer_rule: 爆裂物作焰火时，要落实触发点、发光材料、放射轨迹和亮后衰减，并让美感服务场景反差。
failure_boundary: 这些碎片没有预设烟花图案，且喷射物是能击穿舰壳的熔融金属，观赏属性不可外推。
