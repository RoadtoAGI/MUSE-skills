chapter: 正文
figure_type: analogy
quote: 二十公里的舰距，几乎相当于海洋中的贴舷航行
sensory_mapping: 巨舰并肩挤近、船舷几乎相擦、整片编队同步前行、转向空间被压空
context_fact: 正常太空巡航舰距应为三百到五百公里，但为保证三大舰队都有参战荣誉，联合舰队压缩到二十公里。
image_mechanism: 真空中的二十公里对读者仍显宽阔，海上贴舷把尺度按舰体与介质重新标定，立刻显出危险拥挤。
property_alignment: 1）太空战舰对应海舰；2）二十公里对应海上贴舷；3）尾焰辐射对应尾流与碰撞；4）编队平面对应并排船列；5）转向困难对应舷侧受限；6）荣誉竞争对应抢占近位。
context_alignment: 舰队源自海军且丁仪位于量子号，专业类比用旧航海常识揭穿未来军官被政治荣誉压缩的安全边界。
narrative_function: 在水滴攻击前明确舰队为何会产生灾难性连锁，并把密集队形的战略愚蠢变得可感。
transfer_rule: 跨尺度间距类比应按对象尺寸与机动余量归一化，选择同类载具的危险相邻状态，而非只比较绝对数字。
failure_boundary: 太空没有水阻与海浪，二十公里也不是真正船舷接触；聚变辐射和高速碰撞风险需另行计算。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 体积超过航母的恒星战舰彼此仅隔二十公里组成超密集矩形编队，安全余量远低于正常太空巡航
vehicle: 多艘海船几乎让船舷贴近并排行驶，彼此机动空间极小，任何偏航都可能碰撞或相互干扰
ground: 1）恒星战舰对应海船；2）二十公里间距对应贴舷距离；3）矩形平推对应并排航行；4）辐射影响对应船体碰撞风险；5）缺少机动余量对应不能转向；6）检阅队形对应海上密集展示。
