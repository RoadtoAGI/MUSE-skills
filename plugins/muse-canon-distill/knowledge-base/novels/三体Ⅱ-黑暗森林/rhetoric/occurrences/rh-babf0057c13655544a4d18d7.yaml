quote: 眼神仿佛在说：那我该怎么办呢
sensory_mapping: 双眼无声开口、疑问句浮现、目光求助、转身续看
context_fact: 罗辑说专业看完藏品需一年，庄颜只答“我知道”，眼下长时间才看第五幅。
image_mechanism: 被省略的问句从嘴边移入眼睛，目光替她完成言语，把时间焦虑静静递给罗辑。
property_alignment: 1）眼神对应说话；2）无奈对应疑问语气；3）注视罗辑对应对话指向；4）继续看画对应问题背景。
context_alignment: 庄颜不愿离开画作，简洁台词与丰富眼神形成她含蓄的交流方式，也承接二人之后讨论表情语言。
narrative_function: 给罗辑“陪你看一年”的承诺留出情感入口，并提前示范表情传意。
transfer_rule: 眼神台词要由前一信息制造明确问题，再让人物省略口头表达，读者才能可靠还原句意。
failure_boundary: 问句是罗辑的解释，并非庄颜正式请求；表情信息在陌生关系中可能被误读。
