review_status: reviewed
tenor: 庄颜面对一年才能看完全部藏品时流露的无奈、焦急而专注的目光
vehicle: 用语言直接询问如何解决时间不够问题的人
ground: 1）目光转向罗辑对应发问对象；2）无奈神色对应疑问语气；3）随即继续看画对应问题未解仍行动；4）简短回答对应把更多意思留给眼神。
