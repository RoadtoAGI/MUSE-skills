chapter: 正文
figure_type: simile
quote: 在屏幕上变得像乱石滩一样粗糙
sensory_mapping: 光洁面罩被放大成地貌、凸点化作石块、裂隙纵横、镜头在石滩上俯视
context_fact: 西子用显微镜对照水滴与面罩；面罩放大后粗糙如石滩，水滴放大后仍是无瑕镜面。
image_mechanism: 纳米尺度起伏被地形化，微小加工误差突然膨胀成可行走的乱石滩，直观暴露人类材料极限。
property_alignment: 1）面罩微粒对应石块；2）表面凹凸对应滩地起伏；3）随机缺陷对应乱石无序；4）显微屏对应俯视窗口；5）触觉粗糙对应行走硌脚。
context_alignment: 它与水滴镜面在同一显微倍率直接并置，喻体不是泛说粗糙，而是给技术差距提供地貌尺度。
narrative_function: 以可视对照证明水滴表面异常，推动丁仪从不安转向材料本质猜测。
transfer_rule: 微观粗糙作地貌时，应把凸起、凹陷、排列和观察倍率逐项对应，并设置同倍率参照物。
failure_boundary: 面罩缺陷远小于真实石块且不会形成宏观地形，乱石触感仅来自尺度放大。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 肉眼光洁的航天服面罩放大一千倍后显露大量微观凹凸、划痕和不规则颗粒
vehicle: 乱石滩由大小不一、棱角杂乱的石块密集铺成，表面高低不平且没有连续光滑面
ground: 1）微观凸起对应乱石；2）凹坑对应石间缝隙；3）无序纹理对应杂乱堆积；4）面罩表面对应滩地；5）放大视野对应俯瞰地貌；6）粗糙度对应硌触感。
