tenor: 罗辑压制对庄颜爱情的心理防线从轻微松动到不可逆崩溃的渐进过程
vehicle: 蓄水堤坝先渗细流，水持续冲刷裂缝，流量加大并最终决堤
ground: 1）自我克制对应堤坝；2）爱情压力对应坝后水体；3）目光触发对应初渗；4）情绪外泄对应细流；5）防线弱点对应裂隙；6）失控加速对应湍流与崩溃。
