quote: 罗辑心灵的堤坝上渗出了涓涓细流，这细流冲刷着堤坝，微小的裂隙渐渐扩大，细流也在变得湍急
sensory_mapping: 坝体渗水、裂缝扩大、水流转急、决堤前震动
context_fact: 罗辑与庄颜长久凝视，最初能抑制笑与情绪，随后感到恐惧并努力弥合却做不到。
image_mechanism: 长期压住的爱情积成坝后水压，一个眼神打开针孔；水沿孔道磨走材料，泄漏本身又加速更大泄漏。
property_alignment: 1）心理克制对应堤坝；2）积蓄爱情对应库水；3）微小动情对应渗流；4）裂隙对应防线弱点；5）崩溃对应决堤。
context_alignment: 意象具有明确反馈机制，准确解释为何轻微心动不是稳定释放而会自我放大，衔接下一段不可制止下坠。
narrative_function: 把情感转折展开为连续物理灾变，使爱情高潮具有必然性和危险性。
transfer_rule: 防线决堤喻应依次写压力来源、首个渗点、冲刷反馈和最终失守，避免直接从克制跳到洪水。
failure_boundary: 爱情不是必须压制的灾水，罗辑也主动投入；若情绪缓慢可控或防线主动开放，决堤模型会误写主体性。
