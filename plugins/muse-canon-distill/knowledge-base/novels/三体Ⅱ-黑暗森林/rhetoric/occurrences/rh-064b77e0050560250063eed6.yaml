chapter: 正文
figure_type: simile
quote: 沙原在橙红的夕阳下显得如奶油般柔软细腻
sensory_mapping: 夕阳把沙地染暖、细砂化成绵密奶油、地表棱角软下、光沿表面滑过
context_fact: 社区因即将拦截三体探测器而全天庆祝，黄昏时人群仍在醉意狂欢中观看沙原。
image_mechanism: 坚硬干燥的荒漠被夕阳从视觉转换成甜软食品，颜色与细密纹理诱发触觉和味觉，危险环境暂成享乐背景。
property_alignment: 1）沙原对应奶油；2）细颗粒对应绵密乳脂；3）连绵表面对应抹平奶油；4）夕阳色对应暖黄；5）远景柔焦对应柔软；6）庆典情绪对应甜味联想。
context_alignment: 醉意、宴席与胜利狂欢使食品喻体自然出现，原本象征大低谷创伤的沙漠被乐观情绪短暂甜化。
narrative_function: 为黄昏庆典提供感官丰饶，同时把人类过度自信写进对荒漠的审美改造。
transfer_rule: 景观作柔软食品时，应由颜色、颗粒尺度、表面曲线和现场饮食情绪共同触发，并保留材质反差。
failure_boundary: 沙原干燥粗粝且不可食用，近看不具奶油湿润触感；柔软感依赖远距夕照。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 夕阳中的沙原颜色温暖、明暗过渡平滑，表面细密且从远处显得没有坚硬棱角
vehicle: 经过搅打的奶油呈暖白或淡黄，质地柔软顺滑、颗粒细腻并有绵密起伏
ground: 1）沙面对应奶油表面；2）细沙对应细腻质地；3）柔和曲线对应绵软；4）橙红光对应暖色奶油；5）无硬边对应顺滑；6）远观触觉错觉对应可涂抹感。
