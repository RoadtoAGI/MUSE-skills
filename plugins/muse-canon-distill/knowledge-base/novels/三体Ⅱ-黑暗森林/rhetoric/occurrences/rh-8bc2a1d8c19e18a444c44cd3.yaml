chapter: 正文
figure_type: simile
quote: 他的人生就像狗熊掰玉米，得到的同时也在丢弃
sensory_mapping: 罗辑沿人生田垄前行、一穗穗收下新日子、腋下旧经历随动作掉落、回头田间散满失忆
context_fact: 他从现在向童年回溯，发现越早记忆越稀少，最终只剩一个月夜河滩片段。
image_mechanism: 有限记忆容量由笨拙携带动作表现，获得与丢失同帧发生，纠正‘经历越多拥有越多’直觉。
property_alignment: 1）经验对应玉米穗；2）大脑容量对应夹持能力；3）新记忆编码对应掰取；4）旧记忆衰退对应滑落；5）人生终点对应走出田地。
context_alignment: 口语俗谚降低前两张诗性意象，符合罗辑自嘲式总结，也让临终哲思保留普通人质地。
narrative_function: 以幽默而凄凉的民间模型收束记忆比喻群，导向仅存最早记忆。
transfer_rule: 有限容量作边取边丢时，应选明确携带限制、重复动作和终点盘点，呈现收益与损耗同步。
failure_boundary: 大脑并非固定双臂容量，新旧记忆也不必一换一；遗忘受情感、重复和生理多因素影响。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑随着人生向前不断获得新经历，却同步遗忘旧经历，最终能保留的总量很少
vehicle: 俗语中的狗熊一路掰下玉米夹在腋下，每拿一穗便掉落上一穗，忙到终点只留下少量
ground: 1）人生行进对应穿过玉米地；2）新经历对应新玉米；3）记忆容量对应双臂；4）遗忘旧事对应掉落；5）持续获得对应不断掰取；6）晚年余忆对应最后所剩。
