quote: 好像不用再谈那一段历史让他如释重负似的
sensory_mapping: 肩上重物落地、胸腔松开、长气呼出、身体暂得轻缓
context_fact: 张延刚讲完饥饿大进军和食人惨状，随后转向大低谷后社会重新重视当下生活。
image_mechanism: 不可见的历史记忆获得压在身体上的重量，谈述是再次负重，停谈的一刻则由呼气把重量放下。
property_alignment: 1）大低谷回忆对应重物；2）张延对应负重者；3）叙述过程对应扛载；4）结束话题对应卸下；5）叹气对应卸重后的松弛。
context_alignment: 外显动作只有一口长气，‘如释重负’把它与前文创伤密度相连，解释轻松来自暂时停止回忆而非历史已解决。
narrative_function: 在沉重见证后给讲述者一个身体出口，并自然转入文明价值观改变的后半段。
transfer_rule: 心理压力作负重时，应呈现负担来源、承载过程和解除动作，并说明缓解是暂时还是永久。
failure_boundary: 记忆并未被真正卸除，转移话题也不等于创伤治愈；重量只描述压迫感。
