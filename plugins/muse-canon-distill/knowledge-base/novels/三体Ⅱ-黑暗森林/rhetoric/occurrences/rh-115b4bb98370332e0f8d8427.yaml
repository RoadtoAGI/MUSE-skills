chapter: 正文
figure_type: metaphor
quote: 这个世界，好像就是用显示屏当砖头建起来的
sensory_mapping: 屏幕成砖、像素砌墙、界面铺满器物、世界整体发光
context_fact: 罗辑看到餐厅墙地顶、桌椅和小物全有动态图像，随后连廉价烟盒也能显示并联网。
image_mechanism: ‘屏幕’从附加设备降到建筑材料层，显示功能不再占据某个终端，而像砖一样成为环境最小构件。
property_alignment: 1）柔性显示材料对应砖；2）建筑和物品对应砌体；3）信息界面对应砖面；4）无处不在对应材料标准化；5）整个社会空间对应由砖构成的世界。
context_alignment: 这是旧时代来客对连续观察的归纳，夸张集中在材料普及度，紧接大史‘光滑处都能点亮’给予事实支持。
narrative_function: 用一句材料隐喻命名未来的信息景观，使后续烟盒联网既合理又带轻微窒息感。
transfer_rule: 把技术界面写成建材时，应证明它像基础材料一样普及、可组合并参与空间功能，而非仅有几块大屏。
failure_boundary: 承重结构仍由真实工程材料组成，许多表面只是贴附显示层；屏幕不能替代砖的全部力学功能。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 未来城市几乎每个建筑与物品表面都能发光显示、联网和交互，信息媒介已渗入物质环境
vehicle: 建筑把一块块电脑显示屏当作基本砖材，层层砌合成墙壁、家具乃至整个世界
ground: 1）显示材料对应砖头；2）信息窗口对应砖面功能；3）遍布所有表面对应砖材普及；4）城市空间对应建筑整体；5）联网交互对应新型材料属性；6）单个界面对应砌筑单元。
