tenor: 访客在泰勒判断中社会地位低、精神卑微、谨慎怕错且被琐事耗尽的一类小人物
vehicle: 果戈理作品中受官僚秩序压抑、怯懦自卑并困于微末事务的小职员形象
ground: 1）低社会等级对应小官职；2）怕失去位置对应依附等级；3）繁杂琐事对应文书工作；4）对上畏惧对应官僚压迫；5）精神耗损对应文学人物悲剧。
