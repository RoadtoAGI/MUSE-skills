quote: 就像果戈理笔下的那些小职员
sensory_mapping: 皱西装小职员、低头鞠躬、文牍堆积、玻璃天花板
context_fact: 来客穿不合身正式服、进门连连鞠躬，泰勒据此外观把他归为最可怜且可有可无的人。
image_mechanism: 现实访客被塞进俄国官僚小说的旧制服，客厅门槛变成等级制度柜台，他的谨慎动作被读成文学类型的重复。
property_alignment: 1）访客对应果戈理小职员；2）社会阶层对应低级官位；3）谨慎怕错对应官僚怯懦；4）琐事耗损对应文牍生活。
context_alignment: 典故来自泰勒作为政治家的阶层化观察，也暴露他用文学模板快速贬低陌生人的傲慢。
narrative_function: 把来客压到最低威胁值，使下一句“破壁人”的雷霆反转更猛烈。
transfer_rule: 文学人物类比应列明制度处境、行为习惯和情绪结构，并允许类比同时揭示观察者偏见。
failure_boundary: 来客只是外表扮演卑微，真实身份和能力未必符合小职员；不能由服装姿态推断一生。
