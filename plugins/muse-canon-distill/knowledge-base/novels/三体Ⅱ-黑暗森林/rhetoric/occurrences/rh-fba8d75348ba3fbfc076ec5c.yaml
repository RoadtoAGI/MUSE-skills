chapter: 正文
figure_type: simile
quote: 交错的目光像高速信息通道，把三个心灵联结起来
sensory_mapping: 三束视线在白厅交叉成数据线、念头沿线高速流动、三个封闭心灵短暂连成同一网络
context_fact: 东方拒绝先说出互杀问题，三人改以目光交流，正文用短句展示相同念头在三者间流动。
image_mechanism: 非语言默契被工程化，目光不只传递情绪，而像带宽足以承载完整逻辑推演的链路。
property_alignment: 1）三人对应通信节点；2）对视对应连接；3）重复词句对应同步数据；4）沉默对应无声协议；5）目光离散对应网络不稳。
context_alignment: 人物是未来舰队军官，信息通道语汇自然；封闭舰内高度联网，却只能靠眼睛传递禁忌，形成反差。
narrative_function: 允许叙述呈现三人共同思想而不指定第一发言者，并把猜疑危机写成连接质量变化。
transfer_rule: 目光作信息通道时，应给出节点、带宽、传输内容、连接中断和同步结果，使技术喻体参与叙事形式。
failure_boundary: 对视无法逐字传递复杂计算，三人共识部分依赖共同背景与叙述压缩，不是心灵感应。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三名舰长通过持续对视、不用语言便快速交换关于燃料、配件、牺牲与武器的共同推理
vehicle: 高带宽通信链路连接多个终端，信息高速双向传输，减少编码延迟并同步内部状态
ground: 1）眼睛对应终端；2）目光交错对应链路；3）心灵对应节点；4）无声意念对应数据；5）快速共识对应高速传输；6）移开目光对应断线。
