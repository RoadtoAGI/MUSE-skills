chapter: 正文
figure_type: metaphor
quote: 指数是数学中的魔鬼
sensory_mapping: 一个小数字藏着魔鬼、每次翻倍便扩大身形、几天内冲出公式填满海洋与银河
context_fact: 罗辑用半小时分裂一次的细菌说明，只要养料足够，后代数日即可填满地球海洋。
image_mechanism: 抽象函数获得潜伏者性格，增长曲线后段的突变被体验为魔鬼突然显形。
property_alignment: 1）数学指数对应潜在恶魔；2）连续倍增对应力量膨胀；3）有限资源对应可吞噬世界；4）人类直觉对应受诱骗者。
context_alignment: 罗辑向非专业的大史解释资源死局，用‘魔鬼’预警直觉会低估文明扩张，语言粗直有效。
narrative_function: 为‘宇宙很大但生命更大’提供增长机制，支撑全宇宙资源仍可能饱和。
transfer_rule: 指数作魔鬼时，应给出初始量、倍增周期、资源上限和爆发时刻，用数字过程约束人格化。
failure_boundary: 指数没有意志或道德，真实增长会受资源、技术与反馈限制，不可能无限保持理想曲线。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 指数增长在初期不显眼，却会在短时间内使生命或文明数量突破任何有限资源规模
vehicle: 魔鬼潜伏、诱惑且释放超出控制的毁灭力量，外表初时微小，后果突然席卷世界
ground: 1）指数规律对应魔鬼；2）低初值对应潜伏；3）倍增对应力量繁殖；4）资源耗尽对应毁灭；5）直觉低估对应受骗。
