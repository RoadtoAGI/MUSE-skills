tenor: 雷迪亚兹的反触发系统持续发送安全信号，一旦本人异常或信号中断，水星氢弹便自动引爆
vehicle: 摇篮持续摆动让婴儿安睡，一旦停止晃动，婴儿立即醒来并产生动静
ground: 1）反触发装置对应摇篮；2）维持信号对应摇动；3）氢弹系统对应婴儿；4）待机对应睡眠；5）信号中断对应停摇；6）核爆对应婴儿醒来；7）雷迪亚兹对应摇篮维持者。
