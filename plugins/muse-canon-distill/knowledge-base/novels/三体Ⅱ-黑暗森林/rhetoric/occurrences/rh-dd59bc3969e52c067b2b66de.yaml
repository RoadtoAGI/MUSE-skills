quote: 意思是摇篮停止摇动婴儿就会醒
sensory_mapping: 摇篮规律摆动、婴儿沉睡、摆动骤停、核火随苏醒爆发
context_fact: 雷迪亚兹声称把百万氢弹接入手表生命监测，正常时发送不引爆信号，异常时自动触发。
image_mechanism: 末日武器被缩成睡婴，危险不靠发出命令启动，而靠照护动作停止；温柔育儿场景包住反常的毁灭逻辑。
property_alignment: 1）氢弹对应婴儿；2）安全待机对应睡着；3）连续电磁信号对应摇动；4）雷迪亚兹生命对应照护者动作；5）信号断开对应摇篮停；6）爆炸对应醒来。
context_alignment: 代号由雷迪亚兹亲自解释，温柔喻体与杀戮规模的反差符合他粗俗又戏剧化的威慑方式，并便于代表理解反触发。
narrative_function: 把复杂死手系统变成一眼可懂的动作规则，也让会场意识到保持雷迪亚兹平安等于继续摇篮。
transfer_rule: 反触发机制类比摇篮时，应对齐维持动作、默认状态、中断条件和自动后果，尤其突出‘不动作即触发’。
failure_boundary: 婴儿醒来通常无害且可再次哄睡，氢弹引爆不可逆；系统也不具生命与需求。
