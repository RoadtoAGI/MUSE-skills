chapter: 正文
figure_type: metaphor
quote: 通过忠实地映射宇宙来隐藏自我，是融入永恒的唯一途径
sensory_mapping: 天线抹去自身颜色，只留下天空和平原的倒影；镜面边界在景物中变淡，庞然物仿佛沉进宇宙表面
context_fact: 引力波天线表面光洁如镜，一半映天空、一半映平原；叙述把这种外观联系到三体文明观念。
image_mechanism: 抽象的自我消隐和永恒归属被镜面光学过程实体化：先复制环境，再让自身纹理缺席，最后视觉边界趋于消失。
property_alignment: 1）主体身份对应表面固有图案；2）忠实认知对应镜面映射；3）自我隐藏对应不显本色；4）归入永恒对应与宇宙景象连续。
context_alignment: 名言紧贴天线实物出现，天空与平原正在其表面真实映现，哲学判断因此由可见材质而非空泛宣言生出。
narrative_function: 为三体造物反复出现的镜面美学提供文化解释，并在结尾暗示两文明从对抗走向互相映照。
transfer_rule: 把观念绑定材质时，应让材质的光学或力学过程逐步执行观念：保留什么、抹去什么、最终与何物连续。
failure_boundary: 镜面仍有轮廓、质量和遮挡，不会真的融入宇宙或获得永恒；反射外界也不等于主体完全放弃身份。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 三体镜面造物以完全反射周围环境削弱自身视觉特征，并借这种自我消隐表达对宇宙秩序的归属观
vehicle: 个体撤去自己的颜色和边界，成为周围世界的镜像，最终像水滴汇入大水体般不再与永恒整体分离
ground: 1）镜面反射对应忠实映射宇宙；2）缺少自身纹理对应隐藏自我；3）边界视觉消退对应融入；4）持续映照外界对应依附永恒整体。
