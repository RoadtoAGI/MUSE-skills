chapter: 正文
figure_type: simile
quote: 目光中的某种坚如磐石的东西消失了
sensory_mapping: 眼神深处原有一块坚岩、岁月重压曾未使它动摇、此刻岩石忽然撤空只剩疲惫
context_fact: 东方延绪问起章北海旧事时，发现他不再像此前那样冷静强硬，而显得悲哀疲倦。
image_mechanism: 抽象意志沉积为眼中硬物，其消失不是软化描写，而是视觉空间突然失去承重核心。
property_alignment: 1）坚定信念对应岩石硬度；2）长期坚持对应磐石耐久；3）外部质疑对应冲击；4）目光变化对应岩石消失。
context_alignment: 章北海曾以力场目光稳定众人，角色视线母题在此从坚固场源转为空白，标记使命后的崩解。
narrative_function: 让东方首次看见英雄人格的支撑物撤去，为她的怜悯和后续心理危机埋下依据。
transfer_rule: 意志作磐石时，应给出长期承压记录、可见承重点和撤去后的结构变化，使坚硬不是空泛赞词。
failure_boundary: 意志没有物质硬度，目光变化也不证明信念完全消失；疲惫可能是暂时状态。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 章北海长期显露的意志坚定、判断稳定与行动果断在完成使命后从眼神中退去
vehicle: 巨大岩石质地坚硬、重量稳定，长期承压仍不变形或移动，给人不可撼动的依靠
ground: 1）意志对应磐石；2）稳定判断对应不移动；3）外部压力对应风雨荷载；4）果断对应硬度；5）消失对应岩基撤走。
