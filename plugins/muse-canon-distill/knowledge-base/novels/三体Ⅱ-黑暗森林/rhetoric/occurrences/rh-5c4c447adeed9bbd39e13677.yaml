chapter: 正文
figure_type: simile
quote: 它看起来像个无害的艺术品
sensory_mapping: 银色水滴静置展台、曲面无缝、观者围看、危险被美感遮没
context_fact: 舰队军官观看五百米处影像时普遍陶醉，只有丁仪因探测器与预期机器形态相差过远而不安。
image_mechanism: 工程物的功能线索被曲面彻底删除，视觉分类从机器滑向展品，观者随之把性能未知误读为无害。
property_alignment: 1）水滴对应雕塑；2）全反射面对应抛光材质；3）流线轮廓对应艺术造型；4）悬浮静止对应陈列；5）无可见机构对应非功能性；6）军官欣赏对应观展。
context_alignment: 说话者是胜利主义舰队军官，艺术品喻体符合他们把接触视为庆典礼物的心理，也准确暴露美善联结偏误。
narrative_function: 把水滴的视觉诱惑明确转成战略误判，为丁仪的反常警觉和随后突袭建立反差。
transfer_rule: 危险物作艺术品时，应写清哪些功能痕迹被抹去、观察者如何由审美推到安全，并安排性能反证。
failure_boundary: 外形没有攻击结构不等于无武器功能，艺术美也不携带善意；水滴的材料和推进机制均未知。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三体探测器的纯净水滴曲面没有喷口、武器、接缝或其他工业功能痕迹，给军官以安全错觉
vehicle: 只供审美观看、不承担攻击功能的精致雕塑或现代艺术品，外形完整且不会主动伤人
ground: 1）探测器对应艺术品；2）完美曲面对应雕塑造型；3）无结构痕迹对应非工具；4）静止对应陈列；5）唯美对应审美价值；6）看似无害对应不具武器性。
