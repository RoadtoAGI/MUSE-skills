chapter: 正文
figure_type: simile
quote: 只在西天有极淡的两抹，像是谁不经意涂上去的
sensory_mapping: 纯蓝铺底、两笔淡白、边缘轻散、手势随意
context_fact: 罗辑初见未来地下城的天空投影，觉得蓝色比旧时代更纯净，西边只保留两抹薄云。
image_mechanism: 巨大的天幕被压成一幅刚完成的蓝画，云不再是气象体，而是画面上克制、偶然的两道手迹。
property_alignment: 1）投影天空对应蓝色画布；2）淡云对应浅白颜料；3）云形不规则对应随手笔触；4）稀疏分布对应只涂两笔；5）人工天幕对应被绘图像。
context_alignment: 这片天空本来就是高空拍摄后放映的图像，绘画喻体既贴合云的外观，也暗示眼前自然经过人工选择。
narrative_function: 用轻笔触放大蓝天的纯净与宁静，同时为下一刻揭示地下投影留下人工感。
transfer_rule: 把云写成笔触时，应让天空成为明确底色，并对齐云的数量、浓淡、边缘与落笔姿态。
failure_boundary: 云有真实或影像中的体积和气象来源，不受画者当场涂抹；‘不经意’只是视觉印象。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 地下城市投影蓝天西侧仅有的两条极淡、边缘松散的白云
vehicle: 画者随手在纯蓝画面上轻轻抹过两笔浅色颜料
ground: 1）白云对应浅色笔触；2）蓝天对应画布；3）云层稀薄对应颜料极淡；4）形状随意对应不经意涂抹；5）只有两抹对应有限笔数。
