quote: 来到早晨阳光的怀抱中
sensory_mapping: 皮肤暖意、环绕光线、身体包裹、走入动作
context_fact: 两人结束最后一顿饭走出酒店，即将握手分别，外面空气清新微甜。
image_mechanism: 无形光线获得手臂和胸膛，街道入口变成可踏入的怀抱，把关系结束前的片刻温暖交给环境。
property_alignment: 1）太阳对应拥抱者；2）光束对应手臂；3）受光身体对应被抱者；4）暖意对应体温。
context_alignment: 人物之间已经疏离，晨光替他们完成未有的亲密动作；下一刻事故更使这种日常安全显得短暂。
narrative_function: 给告别场景镀上安宁表层，为随即发生的车祸制造感官落差。
transfer_rule: 以怀抱写环境时，应让光、热或空间边界从多向包围人物，并在关系情境中解释这份包裹由谁替代。
failure_boundary: 阳光没有主动保护能力，紧接的事故证明温暖不等于安全；阴冷、刺目或单向强光中不宜套用。
