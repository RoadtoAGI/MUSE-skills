tenor: 罗辑以自身生命联结坐标广播系统，迫使三体文明在接受威慑或同归于尽之间作出最终选择
vehicle: 两名对手进入最后一轮决斗，胜负由近距离相持、最后武器和有限反应时间决定
ground: 1）地球与三体对应决斗双方；2）坐标广播对应致命武器；3）三十秒对应决斗时限；4）答应条件对应让步；5）自杀触发对应同时开火。
