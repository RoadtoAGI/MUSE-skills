quote: 开始了地球文明和三体文明的最后对决
sensory_mapping: 晨光中两种文明隔空站定，罗辑举枪抵住心脏，倒计时像决斗口令逼近最后一发
context_fact: 罗辑发高烧、扶墓站立，拿出手枪并宣布对三体说话；其死亡会触发核弹阵列广播三体坐标。
image_mechanism: 跨光年战略博弈被压成面对面的决斗时刻，罗辑持枪的现场动作让文明级武器获得身体焦点。
property_alignment: 1）两文明意志对应两名决斗者；2）威慑装置对应手中武器；3）智子监听对应彼此注视；4）有限倒计时对应开火窗口。
context_alignment: 场景只有罗辑一人和一支真实手枪，‘对决’把孤身病人连接到整个地球，同时符合威慑的相互毁灭结构。
narrative_function: 以极短宣告把两百年的战争收束到一个可表演的选择点，启动全书战略高潮。
transfer_rule: 把宏观博弈写成决斗时，应确定双方、各自武器、开火条件和时间窗口，并让现场动作承载模型。
failure_boundary: 两文明并未公平同地交手，罗辑也没有常规胜利选项；‘对决’不能掩盖其筹码是共同毁灭。
