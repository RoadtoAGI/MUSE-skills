chapter: 正文
figure_type: metaphor
quote: 整个银河系，却是一片如此空旷的荒漠
sensory_mapping: 无边荒沙、稀疏绿洲、静默地平线、孤独行者
context_fact: 最近恒星已有三体文明，但按银河年龄与尺度，早生文明应早已遍及各星球，现实沉默构成费米悖论。
image_mechanism: 密布恒星的星海被抽去生命活动，只留下辽阔地表般的空白；数量众多的星点反而像不能解除孤独的沙粒。
property_alignment: 1）银河系对应荒漠；2）恒星对应沙粒；3）智慧文明对应绿洲；4）人类对应孤独观察者；5）费米沉默对应无人迹。
context_alignment: 前文刚把银河系称为恒星沙漠来解释定位，此处同一荒漠从数量问题转为文明沉默，成为罗辑进入黑暗森林推理的切口。
narrative_function: 以空间空旷感呈现费米悖论，把抽象统计矛盾变成需要解释的诡异景观。
transfer_rule: 荒漠喻应区分‘物质很多而生命踪迹少’，让沙粒、绿洲和旅行者分别对应背景对象、文明与观察者。
failure_boundary: 未观测到不等于不存在，文明可能低可见或距离遥远；荒漠意象会把信息缺失误感为真实空无。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 理论上应遍布扩张文明的银河系在人类观测中却显得沉寂、没有任何外星来访迹象
vehicle: 范围辽阔、生命与聚落稀少、旅行者看不到同类踪迹的荒漠
ground: 1）银河系对应荒漠；2）恒星对应沙粒或地貌；3）文明对应绿洲聚落；4）观测沉默对应无人迹；5）巨大尺度对应辽阔空旷。
