chapter: 正文
figure_type: simile
quote: 从战场信息系统潮水般汹涌而来的信息
sensory_mapping: 警报化成潮头、数据浪墙冲入界面、指挥官被信息淹没、视线被推向错误远方
context_fact: 指挥官陷入震颤麻木，依赖计算机寻找不存在的隐形舰队，忽略眼前仍在攻击的水滴。
image_mechanism: 信息丰富不再等于认知增强，数量和速度变成水压，系统输出越多越把人从真正目标旁冲走。
property_alignment: 1）战场数据对应潮水；2）多源传感器对应支流；3）高速刷新对应潮涌；4）军官对应岸上人；5）认知容量对应堤坝；6）错误判断对应被浪推离目标。
context_alignment: 前段海洋意象写物质毁灭，此处潮水进入指挥系统，外部灾难与内部认知失控在同一流体框架中同步。
narrative_function: 解释舰队为何拥有先进监测仍持续误判，把技术失败定位为注意与假设被信息量淹没。
transfer_rule: 信息作潮水时，应说明流量、速度、承载通道、处理上限和被冲偏的具体判断。
failure_boundary: 数据可被筛选、压缩和回放，不像潮水必然造成物理淹没；过载也与错误先验有关。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 战舰接连被毁时，监测、警报、推测和决策数据以超出指挥官处理能力的数量与速度涌入
vehicle: 涨潮海水以巨大体量连续冲来，迅速淹没低处、推倒阻挡者且难以逐滴分辨
ground: 1）数据对应海水；2）高速输入对应汹涌；3）信息量对应潮量；4）指挥系统对应海岸通道；5）认知过载对应被淹；6）无法筛选对应不能分滴。
