chapter: 正文
figure_type: metaphor
quote: 罗辑像一个时间之上的创造者，同时在她生命中的不同时空编织着她的人生
sensory_mapping: 时间空间、手工编织、全景视角
context_fact: 白蓉要求他先想象人物完整人生，正文连续列出童年、上学、爱好和日常细节。
image_mechanism: 把分散时间点摆到同一张织机上，罗辑跨越年代牵线，人物性格从许多细小经历的交叉处生成。
property_alignment: 1）人生事件对应经纬线；2）跨年龄想象对应时间上方视点；3）细节关联对应线的交织；4）完整人物对应织成的整体。
context_alignment: 这段创作实践本就跨越多个时空，“编织”说明细节不是清单，而需相互作用形成生命连续性。
narrative_function: 展示罗辑强大的心智建模能力，并为想象人物后来取得自主性及面壁能力埋下根源。
transfer_rule: 写人物生命史时，可把不同时期事件当经纬线，明确哪些经历交叉生成当前习惯、欲望和声音。
failure_boundary: 编织强调作者统摄，仍不能把人物写成任意可控造物；若细节彼此无因果，只是堆列，织物不会成形。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑脱离小说当下情节，想象女主人公从婴儿到成人的全部生命细节
vehicle: 站在时间之外、同时穿梭各时空并把人生编织成整体的创造者
ground: 1）可同时观察各年龄对应站在时间之上；2）决定无数生活细节对应创造世界；3）不同经历互相形成性格对应线索编织成布；4）成品人物获得整体生命对应织物成形。
