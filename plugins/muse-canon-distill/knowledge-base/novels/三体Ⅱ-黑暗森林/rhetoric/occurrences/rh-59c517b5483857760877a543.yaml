tenor: 罗辑在妻女仍被扣留、咒语又无法广播后，情感和斗志已经耗尽，连愤怒也不能产生
vehicle: 可燃物经历烈火后只剩一堆冷灰，原有形体、热量和继续燃烧的能力都已消失
ground: 1）情感生命对应可燃物；2）长期打击对应燃烧；3）精神耗竭对应灰烬；4）愤怒冲动对应余火；5）懒散无力对应冷却后的静止。
