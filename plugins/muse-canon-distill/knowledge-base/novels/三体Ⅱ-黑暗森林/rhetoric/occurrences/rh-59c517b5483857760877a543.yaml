quote: 我的心已是一堆燃烧过后的灰烬
sensory_mapping: 胸中的情感被烈火烧尽、热力退去、只剩松散冷灰，连愤怒的火星也无法重新点起
context_fact: 委员会原以为罗辑会愤怒，罗辑却靠在沙发上懒洋洋地回答，妻女苏醒仍被冻结且太阳广播受压制。
image_mechanism: 心理耗竭被压缩成燃烧后的物质状态；灰烬的低温、松散和不可复燃同时解释他的麻木。
property_alignment: 1）过去的希望与愤怒对应燃料；2）两个世纪的打击对应火焰消耗；3）当前麻木对应冷灰；4）无法发怒对应没有可燃物与余火。
context_alignment: 主席先点明‘愤怒’，罗辑用灰烬回答该情绪为何已经不存在；末日后的语境也使焚毁意象贴近文明处境。
narrative_function: 一句话交代罗辑由反抗转入自毁式麻木，为酗酒、敷衍工程和后来走向墓地建立心理起点。
transfer_rule: 写情绪耗尽时，可选择一种完成态物质，并让此前过程、当前触感和失去的能力逐项对应人物变化。
failure_boundary: 罗辑仍能策划雪地威慑并重新行动，灰烬只描述当时可见的情感状态；不能据此断定其思考能力或全部意志永久消失。
