tenor: 驱逐舰撞穿浪墙后向两侧高高腾起、吸满夕阳金光的浪沫
vehicle: 大鹏突然展开两扇巨大、金光四射的翅膀
ground: 1）浪沫从舰首向两侧展开对应双翼张开；2）喷起高度与宽度对应巨翅；3）浪沫吸收夕阳对应羽翼放金光；4）舰船前冲对应大鹏破空。
