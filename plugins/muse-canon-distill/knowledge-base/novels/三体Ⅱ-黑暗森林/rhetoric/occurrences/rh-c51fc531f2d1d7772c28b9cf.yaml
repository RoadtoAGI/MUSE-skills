quote: 像一只大鹏展开了金光四射的巨翅
sensory_mapping: 视觉、运动、形状、光线
context_fact: 驱逐舰从浪谷抬首撞穿浪墙，夕阳只照亮局部海面与腾起浪沫。
image_mechanism: 让舰首撞浪的一次爆发长出双翼，散乱水滴被金光组织成对称巨形，笨重军舰瞬间获得飞翔力量。
property_alignment: 1）两侧浪墙对应翼展；2）金色浪沫对应发光羽毛；3）舰首上抬对应鸟身腾起；4）破浪前行对应展翅冲行。
context_alignment: 父亲的海军记忆需要力量与超越，大鹏既来自中国文化想象，也与章北海即将投身太空的飞升方向暗合。
narrative_function: 把风暴航行推至壮丽顶点，以父辈海军精神为章北海的隐秘决心赋形。
transfer_rule: 动作比喻应抓住爆发时的整体轮廓、对称方向、光线变化和主体推进，使静态形似转成动力同构。
failure_boundary: 浪沫单侧、低矮或无逆光时不会形成巨翼；该喻体不能推断舰船实际离水飞行。
quality_assessment: exemplary
