chapter: 正文
figure_type: simile
quote: 像墙角的扫把一样可有可无
sensory_mapping: 视觉边缘、空间位置、日常物件
context_fact: 史强教罗辑隐藏城府，让别人轻视并忽略他，直到行动最后一刻。
image_mechanism: 把危险人物主动移到房间视觉死角并套上廉价家什外形，注意力从他身上自然滑开。
property_alignment: 1）墙角对应社会边缘；2）扫把普通对应随和俗气外表；3）无人关注对应战略隐身；4）工具功能对应隐藏行动能力。
context_alignment: 喻体粗俗、家常、可立即执行，完全符合史强的实战口吻，也精准预示面壁者罗辑的伪装方式。
narrative_function: 用最卑微物件传授高级战略原则，为罗辑后来以玩世不恭掩护威慑构想埋下方法伏笔。
transfer_rule: 塑造“被忽略的强者”时，应设计其所处边缘位置、低价值外观、他人注意习惯和最终可启动的真实功能。
failure_boundary: 扫把仍是被动工具；若人物需要公开权威、频繁指挥或外表本就醒目，这种隐身策略无法成立。
