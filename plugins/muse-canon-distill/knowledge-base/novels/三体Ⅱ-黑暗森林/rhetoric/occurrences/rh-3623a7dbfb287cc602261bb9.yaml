tenor: 真正老谋深算者刻意营造的不起眼、无威胁社会形象
vehicle: 长期放在墙角、人人熟悉却很少注意的扫把
ground: 1）位置边缘对应不进入权力视线；2）日常普通对应不引发戒备；3）看似可有可无对应被低估；4）实际可在需要时发挥作用对应暗藏能力。
