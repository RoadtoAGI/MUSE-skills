chapter: 正文
figure_type: simile
quote: 机械臂的钢爪抓着水滴，如同一只古猿的毛手抓着一颗珍珠
sensory_mapping: 粗毛巨手伸来、钢指合拢、银珠被握住、精致与蛮力贴在一起
context_fact: 螳螂号伸出只重功能的机械臂回收水滴，全球观众担心精美目标被粗糙设备损坏。
image_mechanism: 两种技术文明被压进手与珠的触觉对比，人类复杂机械反而像原始肢体，水滴则像自然完成的珍宝。
property_alignment: 1）人类机械臂对应古猿手；2）液压钢骨对应毛手粗节；3）水滴对应珍珠；4）全反射表面对应珠光；5）抓取动作对应握珠；6）文明差距对应原始者接触珍宝。
context_alignment: 人类自认技术巅峰，丁仪视角却把其机械臂降为古猿，直觉性地预告双方材料技术的巨大代差。
narrative_function: 在水滴真实性能揭晓前先颠倒文明等级，并以脆弱珍珠错觉把危险反差推至最大。
transfer_rule: 技术代差作手与珍宝时，应对齐加工粗细、表面质感、抓取动作和观察者的价值误判。
failure_boundary: 机械臂并非生物毛手，水滴也不脆弱珍贵于三体；珍珠属性恰会误导强度判断。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 结构外露、粗笨的工业机械臂以钢爪夹住曲面完美、银亮精致的水滴探测器
vehicle: 原始古猿长满粗毛的手掌笨拙抓住一颗圆润洁白、细小珍贵且易碎的珍珠
ground: 1）机械臂对应古猿毛手；2）外露钢骨对应粗毛骨节；3）水滴对应珍珠；4）镜面圆润对应珠光；5）技术粗陋对应原始；6）夹持对应抓握；7）尺度反差对应大手小珠。
