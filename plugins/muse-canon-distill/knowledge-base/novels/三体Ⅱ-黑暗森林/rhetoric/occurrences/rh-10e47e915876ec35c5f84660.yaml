tenor: 暮色中近乎无星的苍穹及随后稀疏出现的星点
vehicle: 没有瞳仁、随后被点上瞳仁的巨大石雕眼睛
ground: 1）无星天空的蓝色空面对应无瞳眼睑的空白；2）稀疏星点对应被谨慎点上的瞳仁；3）宇宙由空到可视对应眼睛获得视觉。
