quote: 那蓝色的虚空透出一片广阔的茫然，仿佛是大理石雕像那没有瞳仁的眼睑。
sensory_mapping: 视觉、尺度、材质
context_fact: 叶文洁指着暮空向罗辑谈宇宙社会学，天空中星星少而空间巨大。
image_mechanism: 先以无瞳石眼制造冷硬、失明的空面，再让星点进入“瞳仁”位置，天空由背景转成一个正在观看又惧怕观看的巨大器官。
property_alignment: 1）蓝色虚空对应石雕眼部的光滑空面；2）星点对应瞳仁的聚焦点；3）空间与星点的尺寸悬殊对应巨大眼眶中谨慎的小瞳仁。
context_alignment: 叶文洁正把遥远文明抽象成星点，现场星空为理论提供视觉底座；石雕的冷感也符合她平静而不祥的临终谈话。
narrative_function: 把宇宙社会学的抽象开端变成带有注视与恐惧的宇宙图像，预置文明暴露的危险。
transfer_rule: 让环境意象参与论证时，应使现场物理细节逐项进入喻体，并让喻体动作预示主题中的行为关系。
failure_boundary: 满天繁星或温暖活泼的场景会破坏“无瞳石眼”的空冷感；若后文没有视觉与谨慎主题，雕刻者想象会显得过度拟神。
