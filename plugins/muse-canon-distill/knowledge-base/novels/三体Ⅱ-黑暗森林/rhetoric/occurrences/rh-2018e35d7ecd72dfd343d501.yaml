figure_type: analogy
quote: 毕业后走向社会，就像鱼儿游进了大海，可大海很浑，我什么都看不清，总想游到一处清清的海
sensory_mapping: 小鱼入海、浑水遮眼、持续摆尾、远寻清水
context_fact: 庄颜刚提出愿与三体人共存，随后坦言自己毕业入世艰难，罗辑在心里愿帮她找到清海。
image_mechanism: 抽象社会展开为巨大水体，庄颜的身体缩成靠摆尾前行的鱼；制度与人情的混杂变为阻光浑水，每次选择都成摸索游动。
property_alignment: 1）庄颜对应鱼儿；2）社会对应大海；3）复杂险恶对应浑水；4）方向感对应水下视野；5）理想环境对应清澈海域。
context_alignment: 庄颜语气朴素且珍视纯净，鱼与清水延续她对自然美和善意的价值表达；罗辑的内心回应自然延展同一海域。
narrative_function: 首次显出庄颜天真之外的现实困境，也给罗辑的保护欲提供可执行想象。
transfer_rule: 人生航游类比应让环境清浊、视野、体力和目的地分别对应制度复杂度、判断、消耗与价值归属。
failure_boundary: 庄颜并非完全被动的小鱼，社会也不存在绝对清澈海域；把一切复杂性写成污染会简化真实关系。
