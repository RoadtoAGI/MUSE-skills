tenor: 庄颜毕业进入复杂社会后辨不清方向、寻找纯净适居环境而疲惫的处境
vehicle: 小鱼离开熟悉水域游入浑浊大海，因视野受阻不断寻找清澈海域
ground: 1）毕业生对应小鱼；2）进入社会对应游入大海；3）社会复杂对应海水浑浊；4）判断困难对应看不清；5）寻找善良环境对应游向清海；6）心理疲惫对应长途游累。
