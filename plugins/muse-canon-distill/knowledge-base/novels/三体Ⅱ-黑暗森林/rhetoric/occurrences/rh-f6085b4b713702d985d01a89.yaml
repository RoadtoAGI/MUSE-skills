quote: 每艘战舰都是一座小城市大小的死亡堡垒
sensory_mapping: 敌舰膨胀成移动城市、厚壁封闭天空、武器孔如城垛排列、整座堡垒驶来投下死亡
context_fact: 两个世纪的太空战略研究始终预设敌人宏大，重点构想三体主力舰队及极端武器。
image_mechanism: 抽象敌军威胁被建筑化和城市化，体量、防御、人口与火力压在同一封闭物上。
property_alignment: 1）舰壳对应城墙；2）舰载火力对应守城武器；3）内部系统对应城市设施；4）移动攻击对应航行堡垒。
context_alignment: 宏大堡垒恰是人类心理期待，下一句用三点五米水滴击碎尺度先验，形成认知落差。
narrative_function: 先把旧战争想象推到最大，再显示真正敌人小得无法进入这套识别框架。
transfer_rule: 大型武装载体作堡垒城市时，应分别映射体量、内部生态、防护与火力，并安排与现实威胁的尺度关系。
failure_boundary: 假想敌舰并未真实出现，城市居民性与固定地理也不适用于机动战舰。
