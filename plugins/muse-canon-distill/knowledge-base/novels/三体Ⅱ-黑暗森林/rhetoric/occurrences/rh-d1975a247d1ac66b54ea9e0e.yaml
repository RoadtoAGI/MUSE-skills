chapter: 正文
figure_type: simile
quote: 清泉般的微笑
sensory_mapping: 透明泉水、清凉流动、疲惫得润、笑意清亮
context_fact: 泰勒刚从破壁失败的外界来到庄园，庄颜以略吃力的英语真诚欢迎他。
image_mechanism: 微笑从面部流成一道清水，经过语言的迟涩仍保持透明，先洗去来客身上的疲惫尘埃。
property_alignment: 1）微笑对应清泉；2）纯真对应透明；3）柔美对应缓流；4）慰藉对应解渴。
context_alignment: 庄园有湖泊自然水景，泰勒又像长途旅人，清泉使微笑与其疲惫需求直接相接。
narrative_function: 让庄颜无意间触及泰勒精神创伤，为他随后软瘫倾诉创造安全感。
transfer_rule: 清泉喻笑容应让接受者处于疲惫、燥热或污染感中，并以清、凉、流三项选择性对应。
failure_boundary: 微笑无法真正解除泰勒危机，清泉也不代表庄颜了解其痛苦；强烈热情或复杂笑意会超出该喻。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 庄颜欢迎泰勒时清澈、柔和而使人感到洁净舒缓的微笑
vehicle: 从山石间涌出、透明清凉且能解渴的泉水
ground: 1）笑容纯净对应泉水透明；2）神情柔和对应水流轻缓；3）给疲惫者慰藉对应泉水解渴；4）稚气新鲜对应泉源清新。
