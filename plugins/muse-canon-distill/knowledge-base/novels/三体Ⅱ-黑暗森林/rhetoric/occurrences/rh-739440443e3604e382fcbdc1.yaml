review_status: reviewed
tenor: 哈勃二号照片中三体三星因距离和成像限制呈现的三团模糊光斑
vehicle: 隔着浓雾在夜里远望、边缘扩散成光晕的街灯
ground: 1）恒星光斑对应街灯；2）边缘模糊对应雾散射；3）黑色宇宙背景对应夜色；4）三团分离对应街灯排列；5）只能见光不见实体对应雾中灯体隐藏。
