chapter: 正文
figure_type: simile
quote: 三团光晕，很模糊，像雾夜中的街灯
sensory_mapping: 黑夜、雾晕、远街灯、模糊光团
context_fact: 第一张三体世界观测图像处理完成，斐兹罗只见黑背景上三团光晕，看不到行星细节。
image_mechanism: 四光年距离化为眼前浓雾，恒星尺度被压成街灯，亮芯周围扩散出朦胧光圈。
property_alignment: 1）三颗恒星对应三盏街灯；2）太空对应雾夜；3）成像模糊对应雾晕；4）遥远对应隔街观看。
context_alignment: 照片的黑底和散焦光晕与雾夜街灯形态高度同构，同时以日常尺度反衬决定文明命运的遥远恒星。
narrative_function: 先以平凡模糊画面压低期待，为旁侧不起眼的舰队尾迹发现蓄力。
transfer_rule: 遥远光源类比应对齐背景、边缘散射和可见细节，并可用尺度反差强化信息落差。
failure_boundary: 恒星远比街灯巨大且模糊来自成像系统而非真实雾；清晰分辨恒星表面时喻体失效。
quality_assessment: exemplary
