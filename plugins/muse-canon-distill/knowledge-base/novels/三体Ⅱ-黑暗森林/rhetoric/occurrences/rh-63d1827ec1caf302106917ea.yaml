quote: 地球在周围爆发开来，变成宇宙间绚烂的焰火
sensory_mapping: 球体爆开、彩光放射、宇宙夜幕、亮迹熄灭
context_fact: 二人随卢浮宫穿过熔化大陆和地心，地球随即在四周爆发。
image_mechanism: 行星尺度被缩成一枚升空火弹，在黑暗宇宙中开花；文明毁灭被观看成一瞬绚丽庆典。
property_alignment: 1）地球对应焰火弹；2）宇宙对应夜空；3）爆裂碎片对应火星；4）毁灭瞬间对应燃放。
context_alignment: 爱情幻视已把痛苦推到幸福极限，焰火把行星毁灭审美化，贴合主观陶醉也留下不安。
narrative_function: 把私人爱情扩张到吞没地球的规模，完成现实责任被幸福覆盖的极端展示。
transfer_rule: 灾难写成焰火时应对齐爆发形态、背景和持续时间，并让叙事视角的狂喜或异化支撑价值倒置。
failure_boundary: 焰火的庆典意味不能淡化真实毁灭；离开罗辑幻觉视角，这种美化会造成伦理失衡。
