chapter: 正文
figure_type: simile
quote: 生命世界，纷繁复杂，渺如烟海
sensory_mapping: 无边烟海、雾层重叠、视线迷失、生命密布
context_fact: 罗辑由两条简单宇宙公理想到，地球复杂生命也统一运行在“适者生存”这一简单法则下。
image_mechanism: 无数生命与关系铺成一片看不到岸的海，层层烟雾遮住局部路径；单一法则像海下共同水体维持整体。
property_alignment: 1）生命总体对应烟海；2）物种数量对应水域广度；3）关系复杂对应烟雾层次；4）认知困难对应看不清岸。
context_alignment: 烟海的不可穷尽与下一句简单法则形成尺度反差，服务“复杂表象可由简单原则运行”的论证。
narrative_function: 用地球生命作可知参照，帮助罗辑相信宇宙文明也能从少数法则复原。
transfer_rule: 烟海喻复杂总体应让数量、覆盖范围和认知遮蔽分别对应海、烟与远岸。
failure_boundary: 生命系统并非同质水体，适者生存也不足以解释全部现象；泛用“烟海”易成为陈套。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 地球海陆空生命种类、关系和变化规模巨大而难以穷尽的复杂整体
vehicle: 烟雾弥漫、海面无边、视线无法穿透或抵达尽头的广阔景象
ground: 1）物种数量巨大对应海面无边；2）关系交织对应烟雾弥漫；3）难以把握对应视线受阻；4）海陆空覆盖对应空间辽阔；5）个体细小对应烟海中微点。
