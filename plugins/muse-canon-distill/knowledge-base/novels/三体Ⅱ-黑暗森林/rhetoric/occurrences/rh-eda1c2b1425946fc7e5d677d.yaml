chapter: 正文
figure_type: simile
quote: 星环很细，在强烈的阳光中闪耀，像是对这颗行星的一个圈注
sensory_mapping: 黑色行星、亮环勾边、细线闭合、天体被标记
context_fact: 地下核爆把部分岩石送入第一宇宙速度，它们成为卫星并沿轨道散开，使水星首次拥有行星环。
image_mechanism: 三维轨道被压到书页平面，环不再只是物质带，而像有人给遭受试验的水星画下醒目标记。
property_alignment: 1）水星对应文字或图像对象；2）星环对应圈注线；3）太阳照亮对应墨迹显眼；4）完整闭合轨道对应环形标记；5）试验事件对应注释内容。
context_alignment: 星环确由核试验新添，‘圈注’既吻合细环形态，也暗示这一暴力实验在行星历史上留下可见备注。
narrative_function: 把复杂轨道结果收束成一个清晰标记，为破壁人后来利用试验数据识破计划埋下视觉证据。
transfer_rule: 把环状结构写成标点或批注时，应让线形、附着对象和提示功能同时对应，并说明它标出了何种事件。
failure_boundary: 星环具有厚度、运动和物质组成，不是静止二维线条；‘圈注’也没有实际文字解释。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 核爆抛出的岩石沿水星轨道散开，形成一圈细而明亮的新星环
vehicle: 编辑者用细线把正文中的对象圈起并加以标示的圈注符号
ground: 1）水星对应被标注对象；2）环形岩石带对应圈线；3）星环细窄对应笔画纤细；4）阳光闪耀对应标记醒目；5）核爆结果对应附加说明。
