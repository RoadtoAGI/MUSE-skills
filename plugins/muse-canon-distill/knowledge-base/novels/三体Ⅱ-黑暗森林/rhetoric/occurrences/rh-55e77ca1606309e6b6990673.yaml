chapter: 正文
figure_type: simile
quote: 像错综管网里流淌着的闪光珍珠
sensory_mapping: 细管交织、光珠疾行、路径分叉、网络闪烁
context_fact: 图像从星空模式放大到网络模式，观察者能看见神经信号沿纤细突触繁忙传递。
image_mechanism: 无形电脉冲被压成有颗粒感的亮珠，突触纤维中空成管道；连续传导由一串可追踪光点显示路径。
property_alignment: 1）神经信号对应闪光珍珠；2）突触纤维对应管道；3）传输方向对应管内流向；4）多连接对应错综管网；5）高频活动对应繁忙珠流。
context_alignment: 显示目的正是让研究者定位动态传输结构，管网与亮珠提供比星海更适合跟踪单条路径的中尺度图像。
narrative_function: 完成从整体脑宇宙到局部信号路线的尺度下降，使思维活动既壮阔又可分析。
transfer_rule: 网络信号作管中颗粒时，应分别映射节点连线、离散脉冲和传播方向，并让喻体服务追踪任务。
failure_boundary: 突触不是封闭管道，电化学信号也不是实体珠子；并行激活不能被误解为同一物沿管搬运。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大量神经冲动沿复杂突触连接快速、离散地传递的全息可视化效果
vehicle: 一颗颗发光珍珠沿纵横交织的透明管道连续流动
ground: 1）神经冲动对应珍珠；2）信号亮点对应珍珠闪光；3）突触对应管网；4）冲动传递对应管内流动；5）网络复杂对应管线错综。
