chapter: 正文
figure_type: analogy
quote: 正像格利弗眼中的巨人美女的脸
sensory_mapping: 观者缩成格列佛、光洁表面化成巨脸、微孔膨大、远景美感崩解
context_fact: 面罩放大千倍已如乱石滩，而水滴表面在同样倍率下仍与肉眼所见完全一致。
image_mechanism: 观察者相对尺度骤缩，材料表面像巨人皮肤般把不可见缺陷放大，审美落差转成技术精度落差。
property_alignment: 1）材料表面对应皮肤；2）微观缺陷对应毛孔；3）显微放大对应巨人化；4）观察员对应格列佛；5）肉眼光洁对应远观美貌；6）屏幕粗糙对应近看惊骇。
context_alignment: 文学典故恰好解释尺度改变如何摧毁‘完美’印象，并反衬水滴经巨人视角仍无毛孔。
narrative_function: 将显微比较提升为认识论原则：人类完美依赖尺度，而水滴完美超出这一规律。
transfer_rule: 尺度祛魅类比应有远观评价、观察者缩放、缺陷放大和参照对象四步，突出完美的条件性。
failure_boundary: 材料缺陷与皮肤毛孔成因不同，人物美貌评价也带主观偏见；典故只解释可见尺度。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类加工表面在正常尺度显得完美，放大后却暴露毛孔般的巨大缺陷与粗糙
vehicle: 格列佛近看巨人美女时，远观美貌被放大的皮肤毛孔、斑点与纹理破坏
ground: 1）人类光洁面对应美女脸；2）显微镜对应格列佛近距视角；3）加工缺陷对应毛孔斑点；4）放大倍率对应巨人尺度；5）肉眼完美对应远观美；6）粗糙显露对应近看祛魅。
