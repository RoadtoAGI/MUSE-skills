chapter: 正文
figure_type: metaphor
quote: 人类文明的航船已经孤独地驶到了茫茫的大洋中
sensory_mapping: 金岸退远、烟波遮没、孤船入海、四面恶浪、彼岸不见
context_fact: 黄金时代老人陆续死亡，后代只能怀疑那段幸福是否真实；叙事随即跨入危机纪年205年。
image_mechanism: 整个人类历史被放进一次远航，记忆中的安全陆地随见证者消失，当前文明只剩一只船承受开放海面的不确定。
property_alignment: 1）文明共同体对应船；2）旧时代对应出发海岸；3）代际更替对应离岸；4）危机进程对应航程；5）战争风险对应风浪；6）幸存结局对应彼岸；7）无人知未来对应海图缺失。
context_alignment: 本段是两世纪时间蒙太奇的收束，海岸远去与叙事离开上部同步，完整框架承担结构转场。
narrative_function: 把个人死亡列表提升为文明整体处境，并以未知彼岸为下部虚假繁荣与真正危机预留悬念。
transfer_rule: 文明作航船时，应配置出发岸、航行介质、风险波浪、目标彼岸和导航不确定性，让时间转场成为空间运动。
failure_boundary: 文明不是单一船体，内部群体可走不同路线；黄金时代也非纯安全海岸，未来并非只有一个彼岸。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 黄金时代亲历者全部离世后，人类文明离开和平繁荣的历史阶段，独自面对危机未来且不知道能否存续
vehicle: 一艘船告别金色海岸驶入无边险海，四周恶浪翻涌，前方彼岸是否存在无人知晓
ground: 1）人类文明对应航船；2）黄金时代对应海岸；3）历史推进对应离岸航行；4）三体危机对应险恶海洋；5）战争灾难对应波涛；6）胜利未来对应彼岸；7）老人离世对应海岸从视野消失。
