quote: 这目光立刻使东方想起了太空军的军徽，星星和剑在其中都有
sensory_mapping: 双眼中同时亮起星光与剑锋、视线笔直抵达舰长、军徽从布面移入人脸
context_fact: 章北海锁死舱门并要求全舰进入深海状态，东方延绪必须决定是否服从以避免全舰被超重杀死。
image_mechanism: 眼神被拆成军徽的两种几何要素，亮度承载理想，直线与锋芒承载强制力量。
property_alignment: 1）章北海眼光对应军徽；2）理想对应星；3）杀伤决心对应剑；4）凝视方向对应剑指；5）军职伦理对应徽章归属。
context_alignment: 东方是舰长，军徽是她最熟悉的价值符号；同一目光既取得她的职业认同，也传达杀人警告。
narrative_function: 让东方在数秒内读懂章北海的责任与危险并发布深海命令。
transfer_rule: 用徽记解读目光时，应把徽记各元素分别对应人物当下的价值与行动能力，而非只借庄严气氛。
failure_boundary: 眼睛没有真实星剑，军徽也不能证明章北海代表舰队合法意志；联想属于东方的判断。
