quote: 把空间图想成科普画那样，几个台球大小的彩色行星围着太阳的大火球转动
sensory_mapping: 彩色台球、中央火球、紧凑轨道、黑幕模型
context_fact: 一比一亿真实比例图上只有太阳小亮斑，军官们连本国航行尺度不到一个像素，因而失去信心。
image_mechanism: 真实太阳系被错误地收纳成桌面玩具：行星膨成球、轨道缩短、太阳变火球；新图随后把玩具比例猛然拆散。
property_alignment: 1）行星对应台球；2）太阳对应火球；3）轨道距离对应桌面间距；4）科普认知对应简化模型。
context_alignment: 类比直接解释为何真实比例黑屏冲击军官心理，具体指出公共图像如何训练错误尺度感。
narrative_function: 把抽象尺度误差变成可见认知模型，为章北海讨论未来失败主义提供心理原因。
transfer_rule: 揭示错误心智模型时，应画出它如何系统改变尺寸、距离、颜色和可见性，再与真实数据显示对照。
failure_boundary: 科普图是教学示意而非欺骗，专业人员也未必真信台球比例；类比解释直觉落差，不等于知识缺失。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 军官们会前对太阳系尺寸、亮度和行星可见度的失真直觉模型
vehicle: 科普插图中为便于观看而把行星画成彩色台球、太阳画成邻近大火球的紧凑模型
ground: 1）行星被放大对应台球大小；2）真实暗淡被改成彩色对应科普着色；3）距离被压缩对应围近火球；4）太阳图标对应大火球；5）易于识别对应教学画目的。
