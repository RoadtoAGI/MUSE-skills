chapter: 正文
figure_type: simile
quote: 这类信念一旦由思想钢印建立，就坚如磐石
sensory_mapping: 巨石压地、表面坚硬、撞击不裂、位置不移
context_fact: 水有毒这一明确伪命题尚需两个月治疗；上帝存在或战争胜利没有明确答案，植入后更难被现实推翻。
image_mechanism: 原本只在选择间微倾的判断被瞬间矿化，柔软可修正的认知变成压在意识地基上的整块岩体。
property_alignment: 1）钢印信念对应磐石；2）意识对应承载地面；3）质疑与经验对应撞击；4）无法推翻对应石体不动；5）技术固化对应凝结成岩。
context_alignment: 设备名本就含‘钢印’，磐石继续强化硬度，却把伦理危险从工具落到意识内部的不可移动结果。
narrative_function: 解释思想钢印为何远超宣传或教育，也为各国代表的恐惧提供机制依据。
transfer_rule: 信念作磐石应交代它如何形成、何种反证撞击以及为何没有可验证答案会使其更难移动。
failure_boundary: 心理治疗已证明钢印信念并非绝对不可变，制度环境也会影响它；磐石不能被理解为神经结构永久损坏。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 思想钢印植入、又缺少明确外部判据的信念具有极高稳定性，几乎无法被后续思考推翻
vehicle: 体量巨大、质地坚硬且难以移动或击碎的磐石
ground: 1）信念稳定对应岩石坚固；2）反证冲击对应外力撞击；3）不易改变对应难以搬动；4）钢印固化对应石化成形；5）长期留存对应岩体耐久。
