review_status: reviewed
tenor: 面壁者无论承认、否认还是表演都被外界解释为欺骗，从而无法证明真实意图的自证困境
vehicle: 会把行走者不断带回原处、没有出口且难以逃离的怪异环形路径
ground: 1）解释规则对应环路；2）每种言行对应向前迈步；3）结论总回到欺骗对应返回原点；4）无法自证对应无出口；5）困境持续对应永远循环。
