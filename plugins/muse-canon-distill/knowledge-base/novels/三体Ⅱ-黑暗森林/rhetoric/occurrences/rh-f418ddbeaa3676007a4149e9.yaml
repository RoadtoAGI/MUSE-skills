tenor: 太空军港内大量宏原子聚变同时爆发所产生的极端蓝色光亮和能量规模
vehicle: 无数颗太阳在同一空间同时点亮并释放恒星级辐射
ground: 1）聚变反应对应太阳能源；2）光强极高对应多日同辉；3）爆点众多对应无数恒星；4）舰队被蒸灭对应恒星能量；5）蓝色光芒对应高温光源。
