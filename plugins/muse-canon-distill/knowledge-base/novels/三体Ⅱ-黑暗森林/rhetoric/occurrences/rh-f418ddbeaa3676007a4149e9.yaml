chapter: 正文
figure_type: simile
quote: 其聚变能量之高，看上去像无数个太阳
sensory_mapping: 蓝色群日、军港过曝、聚变爆亮、舰影蒸发
context_fact: 破壁人描述泰勒计划突袭地球主力舰队，使其量子化后再抵抗三体舰队。
image_mechanism: 军港中每个爆点膨胀成一颗蓝太阳，普通空间被群恒星塞满，舰船轮廓在过量光能中消失。
property_alignment: 1）宏原子聚变对应恒星聚变；2）爆点对应太阳；3）高能量对应恒星辐射；4）舰队毁灭对应强光吞没。
context_alignment: 武器机制本就与聚变相连，太阳喻既具科学同源性又让无法直观的能量级别立刻可见。
narrative_function: 把泰勒秘密战略的屠杀规模推到视觉高潮，强化其反人类性质。
transfer_rule: 能量比作多颗太阳时，应让物理过程确与恒星机制或光热量级相联，并交代被照物后果。
failure_boundary: 爆炸并非真正恒星且持续极短，数量“无数”是视觉夸张；低能单点爆发不宜使用群日尺度。
