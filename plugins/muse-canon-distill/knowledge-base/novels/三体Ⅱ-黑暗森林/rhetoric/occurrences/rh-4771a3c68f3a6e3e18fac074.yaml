tenor: 信念碑与联合国大厦玻璃幕墙被夕阳同时照亮、通体泛出强烈红金光的景象
vehicle: 建筑表面被明火成片包围，火焰在暮色中明亮跃动
ground: 1）夕阳反光对应火焰亮色；2）连片玻璃与碑面对应燃烧表面；3）红金光芒对应火色；4）日落背景对应火焰在暗处凸显。
