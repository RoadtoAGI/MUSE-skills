chapter: 正文
figure_type: simile
quote: 信念碑和远处联合国大厦的玻璃幕墙反射着即将落下的夕阳光芒，像着了火似的
sensory_mapping: 暮色压低、碑墙泛红、玻璃闪金、整片似燃
context_fact: 吴岳因不能获得宗教信仰离开信念中心，希恩斯在门外夕照中叫住他，坦白自己曾想植入‘上帝死了’。
image_mechanism: 静止的反光建筑被赋予燃烧状态，低落的太阳把玻璃与碑面连成一片亮焰，庄严设施突然显出灼人的冲突感。
property_alignment: 1）玻璃幕墙和碑面对应可燃平面；2）夕阳反射对应火光；3）红金色对应焰色；4）光区连片对应火势蔓延。
context_alignment: 这片‘火’正夹在两种相反宗教欲望的交锋处，又来自真实夕照，既贴合视觉也烘托希恩斯的激烈否定。
narrative_function: 用一瞬的高温色彩把平静告别推向信仰冲突，并为‘上帝死了’的粗暴宣言造势。
transfer_rule: 把夕照写成燃烧时，应让红金色、连片高亮和渐暗背景共同成立，并让火的情绪温度服务当场冲突。
failure_boundary: 建筑没有烟、热量或物质燃烧，光随日落即逝；不能据此推断信念中心遭到破坏。
