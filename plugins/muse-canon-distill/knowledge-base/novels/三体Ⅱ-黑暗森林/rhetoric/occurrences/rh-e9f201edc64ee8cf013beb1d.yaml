review_status: reviewed
tenor: 五舰人员以后只能在封闭战舰中世代生活、死亡，无法预期返回地球或抵达宜居行星
vehicle: 家园提供长期居住、身份归属与代际延续，归宿则是旅程终点和最终安葬之处
ground: 1）飞船对应住宅国土；2）舰员对应居民；3）代际生活对应定居；4）太空航行对应终身旅途；5）死亡于宇宙对应最终归宿。
