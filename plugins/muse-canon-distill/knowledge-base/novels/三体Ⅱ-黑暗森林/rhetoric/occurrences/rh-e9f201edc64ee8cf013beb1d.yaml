quote: 飞船将是他们永远的家园，太空将是他们最后的归宿
sensory_mapping: 五艘舰封成移动家园、舱室取代土地、航线没有返程、黑暗太空延展成最终墓地
context_fact: 五舰确认不能回太阳系，只能持续向远方飞行并承担延续文明的责任。
image_mechanism: 交通工具被永久住宅化，原本经过的空间被终点化，迁徙与定居两个相反状态叠合。
property_alignment: 1）舰体对应房屋与国土；2）生命维持系统对应家园资源；3）长期航行对应居住；4）宇宙对应墓地/终点。
context_alignment: 星舰社会刚被命名，家园词把军事资产转为政治共同体，也保留永远漂泊的悲凉。
narrative_function: 确定星舰地球的存在条件，为接下来的命名、公民大会与制度争论建立空间前提。
transfer_rule: 载具作家园时，应交代居住期限、资源闭环、身份归属和死亡位置，使转换不仅停在称谓。
failure_boundary: 飞船空间有限且依赖燃料，不能提供行星生态与土地；‘永远’是人物当下判断，仍可能找到行星。
quality_assessment: effective
