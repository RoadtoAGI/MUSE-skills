chapter: 正文
figure_type: simile
quote: 她好像是一个提线木偶，每个动作和每一句话都来自于我的设想
sensory_mapping: 动作、控制关系、视觉机械性
context_fact: 罗辑先设计容貌环境再让人物活动，很快因角色毫无生命感而失去兴趣。
image_mechanism: 把作者意图变成一根根可见控制线，角色每动一下都暴露上方拉力，创作失败从抽象“假”变成机械表演。
property_alignment: 1）作者设想对应提线；2）人物动作对应木偶肢体；3）台词受控对应操纵表演；4）无自主意外对应无生命。
context_alignment: 白蓉随后要求罗辑想象人物完整人生，正是要剪断这些显眼控制线，喻体直接诊断创作方法。
narrative_function: 提出人物塑造的核心问题，并推动罗辑从编排情节转向构造生命史。
transfer_rule: 诊断受控角色时，应指出控制者、控制线、被操纵动作和缺失的自发性，再通过背景经历赋予可预测却非逐句操控的行为。
failure_boundary: 所有虚构角色都由作者创造，木偶只适用于因果单薄、每步显露作者指令的文本，不能要求角色真正脱离创作者。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑按外貌、衣着和情节指令操纵的初版虚构女主人公
vehicle: 每个动作都由操纵者拉线决定的提线木偶
ground: 1）角色没有自发行为对应木偶无自主运动；2）作者逐句设想对应操纵者拉线；3）动作与语言机械执行对应木偶按指令表演；4）缺少生命感对应无生命材质。
