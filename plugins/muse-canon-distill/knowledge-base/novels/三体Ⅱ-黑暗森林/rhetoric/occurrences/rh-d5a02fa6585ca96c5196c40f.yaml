chapter: 正文
figure_type: simile
quote: 从远处看去像一片黑色的枯树林
sensory_mapping: 方形沙漠、黑柱成林、枝叶全无、轮廓枯瘦
context_fact: 罗辑与史强为躲飞车冲入纪念雕塑，近看才发现黑柱其实是无数皮包骨头、向天扭曲的手臂。
image_mechanism: 远距先把人形痛苦抽象成荒死植物，黑柱以共同垂直节奏组成林；走近后树干才还原为饥饿手臂。
property_alignment: 1）瘦手臂对应枯树干；2）雕塑群对应树林；3）黑色材质对应死亡木色；4）沙地对应旱地；5）无叶轮廓对应被剥夺生命。
context_alignment: 大低谷包含饥荒与生态崩溃，枯林既准确制造远观误认，又在揭示手臂后把自然死亡转为人的群体苦难。
narrative_function: 设置由景观到身体的二次识别，使纪念碑在避难场景中突然释放历史恐怖。
transfer_rule: 群体雕塑作树林时，应由数量、垂直轮廓、材质色彩和环境共同支撑，并让近观揭示产生语义增量。
failure_boundary: 雕塑并非植物，顶端手掌具有树冠没有的解剖形态；远观相似不能抹去其纪念的具体人类灾难。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大低谷纪念碑沙地中密集竖立、两三米高且形体细瘦扭曲的黑色柱状雕塑群
vehicle: 一片树木死亡后只剩乌黑、无叶、枝干僵直而稀疏的枯树林
ground: 1）柱状雕塑对应树干；2）黑色对应枯焦木色；3）密集成群对应树林；4）细瘦轮廓对应干枯；5）向上伸展对应树木直立；6）沙地对应荒芜环境。
