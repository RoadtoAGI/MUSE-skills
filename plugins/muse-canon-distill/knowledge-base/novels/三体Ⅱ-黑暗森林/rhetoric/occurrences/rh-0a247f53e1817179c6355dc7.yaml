chapter: 正文
figure_type: metaphor
quote: 战舰对他们是一个黑箱状态
sensory_mapping: 庞大战舰缩成封闭暗盒、命令从一端投入、内部无声处理、结果从另一端出现
context_fact: 司令官回应章北海的技术代差疑虑，说明执行舰长只传达和判断宏观命令，战舰停泊期间不需直接驾驶。
image_mechanism: 复杂恒星战舰被认知性地缩小并封壳，海量内部技术从指挥者视野消失，只留下可学习的输入输出界面。
property_alignment: 1）战舰对应黑箱；2）内部技术对应盒内装置；3）舰长口令对应输入端；4）计算机执行对应隐蔽变换；5）航行武器动作对应输出端；6）宏观控制对应外部操作。
context_alignment: 集中型指挥系统恰把大量操作自动化，黑箱既解释旧军官为何可用，也暗示单人权限隐藏的巨大风险。
narrative_function: 解除章北海推辞的表层障碍，并把夺舰所需操作压缩到少数命令，为后续逃亡提供技术条件。
transfer_rule: 系统作黑箱时，应明确输入、输出、被隐藏的内部层以及使用者为何无需打开它，同时指出失控代价。
failure_boundary: 舰长仍需理解战略后果、故障与权限边界，战舰并非真正不可分析；黑箱化也不等于操作天然安全。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 未来舰长只需发出宏观命令，无须理解战舰内部技术细节和自动执行过程
vehicle: 外壳封闭、内部结构不可见的黑色盒子，使用者只观察输入与输出即可操作
ground: 1）战舰内部系统对应盒内机构；2）技术不可见对应黑色封闭；3）舰长命令对应输入；4）自动执行对应盒内运算；5）战舰行动对应输出；6）无需细节对应只用接口。
