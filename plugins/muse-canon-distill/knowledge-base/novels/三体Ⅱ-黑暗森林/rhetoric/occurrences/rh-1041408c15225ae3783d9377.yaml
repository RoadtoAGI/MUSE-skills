chapter: 正文
figure_type: simile
quote: 一颗灿烂的亮星从木星分离出来，仿佛是它的灵魂脱离了躯体
sensory_mapping: 巨行星作身体、亮星从体内抽离、光魂缓缓远去、躯壳恢复暗色
context_fact: 两千艘战舰同时从木星基地起航，四十五分钟后其聚变发动机光在地球夜空中成为从木星分出的亮星。
image_mechanism: 无法分辨的舰队群被压成一颗灵魂之光，木星亮度先叠加再分离，使出航获得清晰的离体动作。
property_alignment: 1）木星对应身体；2）联合舰队对应灵魂；3）发动机光对应灵魂光辉；4）离港对应出窍；5）木星变暗对应身体失去灵光；6）外太空航程对应灵魂远行。
context_alignment: 人类把舰队视为文明精神与尊严的载体，灵魂喻体不只解释光学分离，也符合全民赋予舰队的精神地位。
narrative_function: 把遥远出航变成地球肉眼可见的神圣仪式，为随后两千太阳的宗教化狂热蓄势。
transfer_rule: 亮点离开母体作灵魂出窍时，应让附加亮度、分离路径、母体复原与精神象征同时成立。
failure_boundary: 舰队是独立物体而非木星生命，木星没有灵魂；亮度变化来自距离与发动机，不代表行星死亡。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 联合舰队发动机的合成亮点从木星旁边逐渐移开，而木星本体随即恢复原有亮度
vehicle: 发光灵魂从庞大身体中升起并离开，肉身失去额外光辉后留在原处
ground: 1）木星对应躯体；2）舰队亮星对应灵魂；3）舰队起航对应离体；4）亮度分离对应灵魂发光；5）木星复原对应肉身留下；6）距离拉大对应灵魂远去。
