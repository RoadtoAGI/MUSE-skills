chapter: 正文
figure_type: simile
quote: 木星的这一片区域像滴落着荧光雨点的池塘
sensory_mapping: 暗色大气铺成水面、荧光雨点散落、圆晕一闪即灭、新光在远处滴下
context_fact: 司令在停止旋转的舰队司令部注视木星黑夜面，远距只能看见闪电照亮周围大气的短暂光晕。
image_mechanism: 行星级电离现象缩为俯视池面，分散闪电按雨滴的点状节奏出现，光晕则天然获得水波圆形。
property_alignment: 1）木星黑夜面对应暗池；2）闪电对应荧光雨；3）大气光晕对应水波；4）瞬时消失对应雨点入水；5）位置随机对应散落；6）辐射触发对应降雨来源。
context_alignment: 叛逃后宏大军事行动被司令沉默观看，池塘意象反而安静优美，强化其无力感与尺度错位。
narrative_function: 以柔和近景收束木星追击部署，把战舰远去留下的辐射痕迹转成忧郁余波。
transfer_rule: 分散瞬时光斑作雨池时，应让点状出现、圆晕扩散、短时消失和暗色底面四项共同成立。
failure_boundary: 木星没有液态池面，闪电由电离而非雨滴产生，光晕也不形成真实水波。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 自然选择号及追击舰发动机辐射使木星大气不同位置接连电离闪电，只见一个个短暂发亮的光晕
vehicle: 夜色池塘承接发光雨滴，每滴落水瞬间亮起圆形涟漪，随后熄灭并被别处新雨替代
ground: 1）木星大气对应池塘；2）闪电光晕对应荧光雨点；3）不同位置出现对应雨滴散落；4）转瞬即逝对应入水消隐；5）圆形亮区对应涟漪；6）连续触发对应阵雨。
