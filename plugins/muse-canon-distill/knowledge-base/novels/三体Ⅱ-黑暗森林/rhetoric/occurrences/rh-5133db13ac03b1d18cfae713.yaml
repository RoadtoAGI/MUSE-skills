quote: 已经成为他意识桌面上的壁纸，每时每刻都在显现
sensory_mapping: 心智化成屏幕、妻女影像铺满底层、事务窗口来去、背景始终透出
context_fact: 未来护士说家庭制度已经消失，罗辑强烈思念冬眠中的妻女，却因身份与情况不明不敢询问。
image_mechanism: 无形思念被装入当时读者熟悉的图形界面：它不抢占每个前台动作，却作为底图渗入所有观看。
property_alignment: 1）罗辑意识对应桌面系统；2）庄颜母女记忆对应壁纸图像；3）每时每刻想起对应持续显示；4）当前交谈对应前台程序；5）暂不打听对应窗口遮挡；6）思念煎熬对应背景无法退出。
context_alignment: 罗辑正进入一个墙面皆为显示屏的未来，旧时代‘桌面壁纸’反而成为他保存家庭的私密界面，技术词与现场形成时代错位。
narrative_function: 用一个轻巧而精准的常驻机制证明庄颜母女没有被新世界奇观替代，并维持人物情感连续性。
transfer_rule: 把反复意识写成界面背景时，应区分前台任务与底层常驻图像，说明它如何被遮住却从未退出。
failure_boundary: 记忆会变化、侵入并引发痛苦，不受桌面设置控制；壁纸的静态与可替换性不能转移给亲情。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 庄颜和孩子的形象持续占据罗辑意识背景，无论他处理什么现实信息都无法真正离开
vehicle: 电脑桌面的背景壁纸常驻屏幕后层，在打开和切换任务时仍不断显现
ground: 1）意识对应电脑桌面；2）妻女形象对应壁纸；3）持续思念对应常驻显示；4）现实事务对应前台窗口；5）压抑询问对应不打开文件；6）无法离开对应壁纸不能关闭。
