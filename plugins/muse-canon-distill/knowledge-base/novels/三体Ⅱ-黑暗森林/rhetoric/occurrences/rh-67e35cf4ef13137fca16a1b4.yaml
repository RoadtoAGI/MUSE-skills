quote: 两个世纪的磨难这时已经在他身上聚集起来，把他完全压垮了
sensory_mapping: 两百年的损失像石块从时间各处汇到罗辑肩背，重量层层叠高，最后把瘦弱身体压折在墙角
context_fact: 罗辑失去实际权力、雪地工程受阻、妻女仍被冻结，居室和身体均呈现长期自弃状态。
image_mechanism: 不同时点的心理伤害被聚成同处重量，延迟崩溃因负载累计超过极限而获得因果形状。
property_alignment: 1）精神打击对应重量；2）时间累计对应堆叠；3）承受力对应结构强度；4）失去功能对应坍塌。
context_alignment: 主任眼前看到他身体似乎撑不起自身重量，叙述顺势把心理压力接到真实承重姿态。
narrative_function: 汇总罗辑跨世纪代价，把此前分散苦难收束成离家赴墓前的崩塌节点。
transfer_rule: 苦难作荷载时，应列出重物来源、聚集时间、承重点和超过极限后的具体功能损失。
failure_boundary: 压力不是可加总的物理重量，罗辑也仍保留秘密计划与行动能力；压垮描述外显状态而非战略意志归零。
