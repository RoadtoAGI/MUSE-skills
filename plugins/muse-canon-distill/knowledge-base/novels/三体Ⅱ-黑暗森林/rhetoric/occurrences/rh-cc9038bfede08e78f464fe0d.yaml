chapter: 正文
figure_type: metaphor
quote: 关掉了罗辑长达两个世纪的噩梦
sensory_mapping: 影像熄灭、恶梦截断、房间复原、醒者松脱
context_fact: 联席会议全票中止面壁计划，乔纳森关闭五面墙的全息会场，罗辑恢复普通公民身份。
image_mechanism: 一个按钮同时作用于屏幕和人生，墙上会议消失的物理动作把两世纪制度压力也切断，外部关机成为内部醒梦。
property_alignment: 1）面壁计划对应噩梦；2）罗辑对应做梦者；3）全息会场对应梦境画面；4）乔纳森关机对应唤醒；5）身份废除对应梦结束；6）普通生活对应清醒现实。
context_alignment: 罗辑此前不断称过去像梦，会议关闭真正完成这一反复框架；‘关掉’又精准依附全息设备动作。
narrative_function: 用双关式关机为面壁时代划下短促终止点，释放人物并暂时让读者相信危机已经过去。
transfer_rule: 把人生阶段写成可关掉的梦时，应寻找同步发生的具体关闭动作，并让梦的恐惧来源在情节中充分累积。
failure_boundary: 三体危机和咒语后果并未结束，过去也不会因身份取消而消失；关机只提供罗辑此刻的解脱感。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 面壁计划被正式废除、全息会议关闭后，罗辑持续两百年的特殊身份、追杀恐惧和救世压力终于结束
vehicle: 睡梦中的可怖场景随醒来或切断影像而停止，不再困住做梦者
ground: 1）面壁经历对应噩梦；2）法律特权与责任对应梦境束缚；3）长期冬眠跨度对应长梦；4）会议终止对应醒来；5）关闭全息图像对应关掉梦景；6）恢复普通人对应回到现实。
