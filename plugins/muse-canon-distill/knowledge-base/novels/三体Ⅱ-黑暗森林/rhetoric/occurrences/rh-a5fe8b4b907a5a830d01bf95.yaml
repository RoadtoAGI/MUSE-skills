context_fact: 章北海在空旷重复球舱中产生全息联想，觉得局部与整体的关系可能延伸到文明和宇宙。
image_mechanism: 实体巨舰被降维为意义标记，尺寸仍巨大、形式却极简，由此把工程对象推向哲学阅读。
property_alignment: 1）舰体几何对应字形；2）重复舱室对应构字单元；3）控制关系对应符号语法；4）深层规律对应符号含义。
context_alignment: 章北海刚获得思想散步的自由，符号喻体符合他从眼前结构向抽象规律跳跃的心理时点。
narrative_function: 把舰船种子和全息文明类推前置为一次‘读符号’动作，打开宇宙尺度思考。
transfer_rule: 复杂实体作符号时，应明确可见形式、被压缩内容、解码者与所指规律，避免空泛写成‘有意义’。
failure_boundary: 战舰仍是物质系统，不由单一约定语法生成；所谓深层规律只是章北海的错觉和联想。
