quote: 他们将肩负着这伟大的使命孤独地走过漫长的岁月
sensory_mapping: 肩负重物、长路、孤身背影、远方终点
context_fact: 秘书长在公布名单前向面壁者致敬，说明他们必须对世界关闭心灵，只能依靠自己。
image_mechanism: 跨世纪制度时间铺成荒长道路，秘密装上肩背；身边即使有人，心灵道路上仍只剩一道人影。
property_alignment: 1）面壁者对应独行者；2）使命对应行囊；3）岁月对应路程；4）决战对应终点；5）保密对应无人同行。
context_alignment: 公开致辞需要庄严概括使命，负重远行既保留英雄感，也准确呈现此制度造成的孤独代价。
narrative_function: 先把面壁者塑成受敬仰的悲剧旅人，再用罗辑的童年退行拆解英雄外观。
transfer_rule: 使命旅途要落实负载、路长、同行限制和终点，使“肩负”“走过”组成同一动作链。
failure_boundary: 面壁者拥有庞大团队与资源，并非现实独行；旅途只描述秘密与心理责任，不应抹去集体劳动。
