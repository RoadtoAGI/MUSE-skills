quote: 像美国西部开发初期大草原上的游牧帐篷
sensory_mapping: 无边草原、零散帐篷、远距营火、前沿营地
context_fact: 黄河站是最大设施，其他站点和材料在周围广阔轨道上稀疏散落，人类刚开始大规模进入太空。
image_mechanism: 黑色轨道空间被铺成地平线辽阔的草原，孤立空间站缩成远处帐篷；开发史让技术开端获得拓荒时间感。
property_alignment: 1）近地轨道对应草原；2）空间设施对应帐篷；3）黄河站对应中心营地；4）太空开发对应西部拓荒；5）设施稀少对应营帐零落。
context_alignment: 真实设施分布、尺度差与开发阶段均与喻体对齐，且为下一段城市—村庄交通类比预先建立聚落系统。
narrative_function: 给读者一幅可俯瞰的近地开发地图，表现人类太空文明仍像稀疏前哨。
transfer_rule: 前沿设施作拓荒营帐时，应对齐空间密度、中心与边缘层级及建设阶段，避免只借异域色彩。
failure_boundary: 空间站固定于轨道且技术复杂，不像可随意迁徙的帐篷；美国西部拓荒历史也包含被意象遮蔽的殖民暴力。
