tenor: 病重老人枯瘦、缺少肌肉与水分的手
vehicle: 失去水分、细硬轻脆的干燥柴枝
ground: 1）手指细长对应柴枝；2）皮肉干瘪对应木材脱水；3）骨节突出对应枝节；4）动作吃力对应枯脆无力。
