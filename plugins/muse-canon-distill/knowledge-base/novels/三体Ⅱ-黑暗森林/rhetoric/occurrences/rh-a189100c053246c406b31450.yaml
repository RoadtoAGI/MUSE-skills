figure_type: simile
quote: 瘦如干柴的手
sensory_mapping: 枯枝、凸节、干皮、细硬轮廓
context_fact: 老人卧床病重，用这只手吃力地从泰勒带来的精装书中抽出一本。
image_mechanism: 手掌的血肉感被抽走，只剩覆盖薄皮的骨性枝条；抽书动作仿佛枯枝艰难撬动物体。
property_alignment: 1）手对应干柴；2）手指对应枝条；3）干瘦皮肤对应脱水木皮；4）骨节对应柴节。
context_alignment: 紧接声音细韧的描写，干柴进一步强化身体将尽，而拿书动作又证明其仍有意志。
narrative_function: 具体化老人的病危状态，提升泰勒与濒死敌手谈长期计划的荒诞感。
transfer_rule: 枯柴喻写肢体应落在干、细、硬和凸节等可见特征，并配合力量衰减动作。
failure_boundary: 该喻不能说明疾病种类或生命力全失；丰润柔软的手与干柴质感相反。
