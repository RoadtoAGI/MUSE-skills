chapter: 正文
figure_type: simile
quote: 超重像一个巨掌把一切渐渐攥紧
sensory_mapping: 巨掌包覆、手指合拢、身体压陷、空间收紧
context_fact: 火箭发动机点火后章北海吃力转头，身体被压入座椅，直到主发动机关闭。
image_mechanism: 不可见惯性力获得手掌轮廓，从舱外包住所有人和设备；推力上升时五指逐节闭合，把身体嵌进椅背。
property_alignment: 1）超重对应巨掌；2）乘员与物体对应掌中物；3）加速度增强对应攥紧；4）座椅压陷对应被握住。
context_alignment: 超重是全身、全舱同步受力，巨掌比单一重物更能表现包围与渐增；L2022发动机停机时“巨掌松开”完成闭环。
narrative_function: 把抽象加速度变成清晰触觉过程，并为失重骤临制造松手反转。
transfer_rule: 力场写成手掌应对齐作用范围、方向与随时间变化，后续最好安排松开或换握完成动力阶段。
failure_boundary: 实际受力主要来自座椅支撑而非外掌，人体并未被捏合；瞬时冲击不适合“渐渐攥紧”。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 持续加速度把乘员和舱内物体越来越强地压向座椅、限制动作的超重感
vehicle: 一只尺度巨大的手掌缓慢合拢手指，把掌中所有事物越握越紧
ground: 1）加速度增大对应手指合拢；2）全身受压对应被掌握住；3）动作困难对应握力限制；4）所有物体同向受力对应一掌攥住一切；5）渐进加压对应慢慢收紧。
