figure_type: simile
quote: 像是来自宇宙边缘的穿透一切的射线
sensory_mapping: 宇宙边缘亮起细线、射线穿过黑暗与舰壳、最终落到章北海身上、父亲注视重新显影
context_fact: 星舰地球历史开始后，章北海意识到使命没有结束，在心中回应不能安息的父亲。
image_mechanism: 内化的父亲权威被物理化为跨宇宙辐射，距离越远反而越证明其不可阻挡和持续。
property_alignment: 1）父亲精神对应发射源；2）目光对应射线；3）时空阻隔对应穿透介质；4）章北海意识对应探测目标；5）责任延续对应照射不断。
context_alignment: 前文父亲目光如日星，此处新增‘边缘射线’映射，适应章北海已离开太阳系、责任扩至宇宙的阶段。
narrative_function: 收回短暂自由，把父亲目光转成新使命启动信号，预示章北海仍无法真正卸责。
transfer_rule: 跨代影响作射线时，应明确源、传播距离、穿透障碍、接收者和抵达后的行动变化。
failure_boundary: 父亲已无法真实发射信号，穿透一切是章北海的心理体验；其思想也可能被儿子重新解释。
