tenor: 章北海重新感到已故父亲的目光跨越死亡与距离注视自己，要求他继续未完使命
vehicle: 从宇宙最远边界发出的高能射线沿直线穿越所有障碍与空间，抵达目标且不可遮蔽
ground: 1）父亲目光对应射线；2）死亡与时间距离对应宇宙尺度；3）持续影响对应穿透；4）章北海对应被照目标；5）使命召唤对应能量抵达。
