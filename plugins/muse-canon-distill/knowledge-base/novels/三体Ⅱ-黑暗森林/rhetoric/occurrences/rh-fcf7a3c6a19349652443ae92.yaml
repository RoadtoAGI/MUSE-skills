tenor: 罗辑躺在黎明墓地，从低视角看到周围一圈圈高大、沉默的墓碑
vehicle: 史前巨石阵中成列竖立的巨大石块，古老、仪式化地围住中央观察者
ground: 1）墓碑对应立石；2）成排分布对应石阵；3）躺卧低视角对应巨物压高；4）墓地仪式性对应祭祀遗址；5）晨曦寂静对应远古氛围。
