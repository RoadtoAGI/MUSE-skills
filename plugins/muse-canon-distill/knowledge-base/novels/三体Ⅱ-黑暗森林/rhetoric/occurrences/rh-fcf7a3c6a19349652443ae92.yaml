chapter: 正文
figure_type: simile
quote: 罗辑感到自己仿佛置身于上古的巨石阵中
sensory_mapping: 罗辑从地面仰看，墓碑拔高成史前立石，一圈沉默石块在曙光中围住他和自挖墓穴
context_fact: 他在叶文洁墓旁睡了一夜，醒来时发高烧、身体剧烈颤抖，周围墓场在晨曦中清晰。
image_mechanism: 低机位放大普通墓碑，排列和材质把现代墓地转成远古仪式空间，使即将发生的文明对决获得祭坛感。
property_alignment: 1）墓石材质对应巨石；2）碑列对应阵列；3）罗辑中心位置对应祭仪中心；4）死亡纪念对应古老祭祀。
context_alignment: 叶文洁理论跨越两百年、蚂蚁跨越一亿年，巨石阵进一步把现场时间推向人类文明之前。
narrative_function: 把普通墓地升格为威慑仪式舞台，让孤身罗辑面对两个文明时具有原始庄严。
transfer_rule: 墓碑作巨石阵时，应利用低视角、排列、石材、中心位置和仪式动作共同放大空间。
failure_boundary: 墓碑尺寸和建造年代不同于史前巨石，现场也无真实祭祀功能；宏大感来自视角与心理。
quality_assessment: effective
