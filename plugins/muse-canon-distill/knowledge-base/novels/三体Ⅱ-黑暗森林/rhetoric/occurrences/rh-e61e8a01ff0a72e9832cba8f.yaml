quote: 太空电梯与周围太空设施的关系就像大城市与周围的村庄
sensory_mapping: 中心城廓、外围村点、交通线辐射、物资源源外送
context_fact: 黄河站与电梯规模最大，半径五百公里内小设施众多，后者供给完全来自电梯且人员频繁飞行。
image_mechanism: 看不见的补给依赖被绘成聚落地图，电梯占据城市中心，航线像道路向小站辐射，漂浮物也融入交通背景。
property_alignment: 1）电梯终点对应城市；2）小站对应村庄；3）补给流对应城乡物流；4）航天服通勤对应交通；5）设施密度对应聚落分布。
context_alignment: 类比紧接监测系统为何不注意单个航天员，繁忙城乡交通准确解释章北海如何混入背景。
narrative_function: 用社会空间说明轨道基础设施生态，同时为暗杀者隐蔽接近提供可信条件。
transfer_rule: 中心—边缘类比应具体对齐规模、供给依赖和交通流，只有大小差而无网络关系不足以称城乡。
failure_boundary: 周边站点具有高度专业功能且可能比村庄更自主，电梯也非政治经济意义上的城市。
