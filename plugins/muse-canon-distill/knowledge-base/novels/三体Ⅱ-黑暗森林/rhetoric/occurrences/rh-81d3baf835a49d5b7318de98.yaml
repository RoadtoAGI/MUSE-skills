chapter: 正文
figure_type: analogy
quote: 所有物质在它面前都像纸片般脆弱，它可以像子弹穿透奶酪那样穿过地球
sensory_mapping: 太阳系万物薄成纸、地球软成奶酪、银色子弹直穿、身后留下圆孔与碎屑
context_fact: 丁仪判断水滴材料强度比太阳系最坚固物质高百倍，随即要求舰队疏散。
image_mechanism: 天体与舰船被强度比重新缩放，巨大的地球失去坚实感，水滴则从眼泪翻成高速弹丸。
property_alignment: 1）水滴对应子弹；2）地球物质对应奶酪；3）舰体对应纸；4）强作用力对应弹体硬度；5）运动轨迹对应射击；6）穿透孔对应弹孔；7）无表面损伤对应弹头不变。
context_alignment: 它直接反转‘圣母眼泪’与‘暖瓶胆’，用最日常的脆弱材料校准看似巨大坚固的人类世界。
narrative_function: 在攻击前一句揭示水滴真正战力，让读者先于舰队看懂即将到来的绝对毁灭。
transfer_rule: 极端材料差作弹丸穿软物时，应给出相对硬度、速度、贯穿路径和双方损伤不对称，避免只说坚硬。
failure_boundary: 地球不是均质奶酪，实际贯穿涉及高温、引力与冲击；丁仪的百倍强度仍属推测。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 强相互作用材料水滴相对普通太阳系物质拥有压倒性硬度，能高速贯穿行星而自身不受损
vehicle: 硬弹丸轻易穿破柔软奶酪，周围纸片也会在接触中撕裂，而弹体保持完整
ground: 1）水滴对应子弹；2）地球对应奶酪；3）普通物质对应纸片；4）材料代差对应硬软差；5）高速贯穿对应弹道；6）水滴无损对应弹丸完整；7）地壳破坏对应奶酪孔道。
