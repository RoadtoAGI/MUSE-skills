chapter: 正文
figure_type: simile
quote: 那些战舰发动起来像天上的小太阳
sensory_mapping: 舰尾骤亮、白热光核、远空刺目、群日点燃
context_fact: 大史向罗辑证明未来军事技术强大，列举战舰、激光炮和电磁炮的演习效果。
image_mechanism: 推进器的工业火光升格为天体，尺寸缩小而亮度与聚变联想保留，让战舰启动获得恒星级能量感。
property_alignment: 1）战舰引擎对应太阳；2）推进光焰对应日光；3）聚变动力对应恒星能源；4）远空位置对应天空天体；5）刺目程度对应不可直视。
context_alignment: 未来已掌握可控核聚变，‘太阳’同时有视觉和能源机制支撑，也延续前文核星与小太阳的技术意象。
narrative_function: 以最醒目的光强开启武器清单，建立人类对三体舰队过度自信的感官依据。
transfer_rule: 把引擎作小太阳时，应兼有极端亮度、集中核心、远距可见和恒星能源关联，避免只因发光套用。
failure_boundary: 战舰引擎质量、引力和自持反应远不及恒星，光焰方向性也强；不能由亮度推断战力等于天体。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 未来太空战舰启动高功率推进器时发出极强、远距离可见的集中光焰
vehicle: 天空中体量虽小于真实日轮却具有刺目亮度、持续放射光热的太阳
ground: 1）推进焰对应日光；2）高亮核心对应日轮；3）远距可见对应天体发光；4）聚变能源对应恒星核能；5）多艘战舰对应多个小太阳。
