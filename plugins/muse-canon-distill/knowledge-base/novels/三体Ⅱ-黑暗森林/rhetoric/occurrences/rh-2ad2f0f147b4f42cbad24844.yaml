review_status: reviewed
tenor: 在人类文明与技术快速发展后仍保持生物进化旧结构的现代人脑
vehicle: 尚未经历现代文明训练、认知能力停留早期阶段的原始人大脑
ground: 1）大脑自然进化缓慢对应生物结构古老；2）现代文明仅二百年对应来不及遗传改变；3）科学问题高度复杂对应原始工具面对现代任务；4）希恩斯欲技术加速进化对应升级旧硬件。
