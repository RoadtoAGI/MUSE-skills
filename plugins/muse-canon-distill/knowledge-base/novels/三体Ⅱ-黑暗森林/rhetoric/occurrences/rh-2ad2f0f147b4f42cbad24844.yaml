quote: 现在研究现代科学的，只是原始人的大脑
sensory_mapping: 原始人头骨、现代实验室、旧器官、新任务错位
context_fact: 希恩斯比较自然进化需至少两万年与现代技术文明仅二百年，提出提升后代智力。
image_mechanism: 现代科学家外表和仪器被剥去，只剩一颗从史前直接搬进实验室的旧脑，在新问题前暴露代际错配。
property_alignment: 1）现代人脑对应原始硬件；2）科学研究对应现代任务；3）文明加速对应环境突变；4）脑提升计划对应人工进化。
context_alignment: 脑科学家以生物时间尺度解释智力瓶颈，原始—现代错位能把两万年与二百年的数量差变成一幅图。
narrative_function: 为希恩斯计划提供核心问题定义：不是直接破智子，而是升级产生科学的主体。
transfer_rule: 时代错置类比应由明确时间尺度和功能不匹配支撑，并区分结构古老与能力低下两种判断。
failure_boundary: 现代人大脑经过文化、教育和工具扩展，不能等同原始人；生物结构古老也不证明需或能定向提升智力。
quality_assessment: effective
