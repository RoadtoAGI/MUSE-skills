chapter: 正文
figure_type: analogy
quote: 他就像一个上了发条的机器，一直被推着走
sensory_mapping: 发条拧紧、齿轮连转、机体被推、停顿终于出现
context_fact: 从醒来到餐厅，罗辑接连适应未来、参加身份听证、遭飞车袭击，直到等菜才问起史强生活并感到愧疚。
image_mechanism: 一天的事件被收进机械传动链，罗辑不是主动安排行程的人，而是被储能与外力沿齿轮一站站推送。
property_alignment: 1）罗辑对应发条机器；2）突发事件对应上弦；3）他人安排对应传动机构；4）持续应对对应机器运行；5）无暇反思对应不能自主停机；6）等待上菜对应动力间隙。
context_alignment: 冬眠者刚从技术系统中醒来又被界面和程序包围，机器喻体也呼应他在未来社会中的被动位置。
narrative_function: 为迟问朋友生活提供具体心理理由，并短暂放慢连续奇观与险情的叙事速度。
transfer_rule: 人物作发条机器时，应明确谁在上弦、何种事件构成传动、为何不能停下，以及何处出现停机窗口。
failure_boundary: 罗辑仍在主动判断和选择，并非无意识自动装置；‘发条’不能免除他忽略朋友的责任。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 罗辑苏醒后被医疗、听证、未来见闻和连续危险驱动，几乎没有自主停顿与关心他人的余地
vehicle: 机械装置被拧紧发条后按预设方向持续运转，直到动力耗尽才能停下
ground: 1）外部安排对应发条动力；2）罗辑行动对应机器运转；3）连续行程对应齿轮不停；4）缺少自主选择对应预设轨道；5）终于空闲对应发条暂歇；6）身心紧绷对应弹簧上紧。
