chapter: 正文
figure_type: simile
quote: 那很像映在海洋瞳孔上的字幕。
sensory_mapping: 视觉、形状、时间节奏
context_fact: 三体字幕停顿二十分钟，伊文斯沿船踱步，看见鱼群跃海，随后视网膜字幕重新出现。
image_mechanism: 先把海面收束成一只巨眼，再让跃鱼形成发光文字；自然运动与视网膜通信在同一视觉结构中重合。
property_alignment: 1）海面暗而反光对应瞳孔；2）鱼群银弧对应文字笔画；3）海上弧线与眼内字幕同时出现对应两层“书写”。
context_alignment: 伊文斯正等待写在自己眼睛里的信息，因而把海上动态也读成字幕；海洋现场使“瞳孔”并非任意装饰。
narrative_function: 把漫长通信停顿变成可见等待，并让遥远文明的文字与地球生命短暂交叠。
transfer_rule: 在等待或联想场景中，可让外部景物复现人物当前感官界面的形状、亮度和出现节奏，使心理聚焦自然投射到环境。
failure_boundary: 鱼群若散乱、海面明亮或人物并未等待视觉文字，“字幕”与“瞳孔”的双层对应都会松脱。
