tenor: 鱼群跃出海面时在星光中排出的银亮弧线
vehicle: 映在巨大眼睛瞳孔上的一行字幕
ground: 1）深色海面对应黑亮瞳孔；2）连续跃鱼的银弧对应发光字列；3）鱼群短暂显现对应字幕出现后消失。
