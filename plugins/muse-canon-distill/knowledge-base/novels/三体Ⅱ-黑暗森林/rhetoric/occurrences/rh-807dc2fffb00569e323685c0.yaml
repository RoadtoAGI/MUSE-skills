chapter: 正文
figure_type: simile
quote: 像一张挂在星光下的黑色剪纸画
sensory_mapping: 黑色平面、锐利轮廓、星点透光、悬挂静止
context_fact: 惠子深夜走入无月竹林，只能看见丈夫和竹子的暗影，二者都失去立体感。
image_mechanism: 夜色抽走明暗层次，把真实院落压成一片薄纸，再由星点从背后照出竹与人的边缘。
property_alignment: 1）黑暗竹林对应黑纸；2）人物轮廓对应剪出人形；3）星星对应背光孔点；4）无纵深对应纸面；5）静立对应悬挂。
context_alignment: 日本竹林与剪纸都强调简净轮廓，适合夫妻克制、相敬如宾的深夜谈话，也为宏大计划保留私人静寂。
narrative_function: 把场景压成舞台剪影，让对话和叹息成为画面中唯一运动。
transfer_rule: 剪纸比夜景时，要先让光线消除体积，再选可辨轮廓和背后光点，形成真实平面化过程。
failure_boundary: 近距离仍有质感与深度，剪纸只代表惠子在无月光下的远观；有侧光或快速动作时会失准。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 无月夜里失去立体感的竹林与希恩斯身影
vehicle: 以黑纸剪出人物和竹枝轮廓、悬挂在点点星光前的平面画
ground: 1）前景全黑对应黑纸；2）只有轮廓可见对应剪影；3）深度消失对应平面纸画；4）星空作背景对应画被挂在星光下；5）竹叶与人形细边对应剪纸镂空线条。
