chapter: 正文
figure_type: simile
quote: 在白雾里如水的月光中
sensory_mapping: 月白水光、雾中流淌、身影浸没、清冷柔亮
context_fact: 建筑内的光来自无数发光微粒，白雾被照亮；惠子站在其中，使希恩斯想起日本庭院竹林之夜。
image_mechanism: 光线失去直射棱角，铺成可流动介质，把雾、人物和记忆一同浸入清冷月色。
property_alignment: 1）全息柔光对应水；2）白雾空间对应容器；3）光的漫射对应水的铺展；4）苍白色温对应清冷水感。
context_alignment: 竹林月夜是夫妻共同记忆，水样月光把新技术空间重新染成旧日私人场景，符合希恩斯刚醒的感官过渡。
narrative_function: 柔化巨型科研建筑，让夫妻重逢暂时回到亲密记忆，再转入八年研究困境。
transfer_rule: 光作水应落实流动方向、覆盖范围或浸没效果，并让色温与人物感受支持液态触觉。
failure_boundary: 全息微粒实际自发光而非液体流动；强烈聚光、闪烁激光或暖色火光不适合水样月光。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 全息微粒在白雾中发出的苍白、柔和且漫布空间的光亮
vehicle: 月夜中像水一样清冷、柔软并均匀流淌的光
ground: 1）柔光对应水的平顺；2）苍白月色对应清水颜色；3）光充满雾气对应水浸空间；4）人物显得柔弱对应水光轻抚轮廓。
