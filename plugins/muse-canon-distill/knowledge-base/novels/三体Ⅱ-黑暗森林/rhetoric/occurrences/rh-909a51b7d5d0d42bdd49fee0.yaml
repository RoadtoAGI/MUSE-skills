tenor: 太空军部分军官面对技术远胜人类的三体舰队时的强烈畏惧
vehicle: 人在近距离面对猛虎时的本能恐惧
ground: 1）敌方压倒性力量对应虎的捕食优势；2）军官未战先惧对应见虎退缩；3）对未来缺乏信心对应认为自己难以逃脱虎口。
