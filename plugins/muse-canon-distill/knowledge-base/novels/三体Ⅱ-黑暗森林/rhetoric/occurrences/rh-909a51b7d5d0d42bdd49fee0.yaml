quote: 畏敌如虎
sensory_mapping: 视觉威胁、身体恐惧、力量差
context_fact: 章北海汇报失败主义普遍蔓延，指战员因敌我技术悬殊而失去胜利信心。
image_mechanism: 把四百年后的抽象技术差拉近成眼前猛兽，军人的战略判断被还原为身体面对捕食者的退缩。
property_alignment: 1）三体优势对应猛虎力量；2）人类弱势对应猎物处境；3）失败主义对应见敌即惧。
context_alignment: 这是政治工作汇报中的成语化概括，简短有动员力度，也符合章北海刻意把会场从困倦中刺醒。
narrative_function: 浓缩失败主义症状，便于将其设定为太空军当前首要内部敌人。
transfer_rule: 用猛兽标定敌我差距时，应说明力量优势、接近方式和主体的反应，不让成语替代战略分析。
failure_boundary: 技术优势不等于猛兽必胜，且军队可用组织和策略改变力量关系；该比喻只呈现恐惧心态。
