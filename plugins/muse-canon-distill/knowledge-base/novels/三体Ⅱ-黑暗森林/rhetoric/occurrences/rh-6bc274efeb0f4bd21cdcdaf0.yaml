quote: 就像欧氏几何一样，先设定几条简单的不证自明的公理，再在这些公理的基础上推导出整个理论体系。
sensory_mapping: 结构、逻辑层级、生成过程
context_fact: 罗辑质疑宇宙社会学没有调查和实验资料，叶文洁回答应从两条公理开始。
image_mechanism: 把一门尚不存在的学科搭成读者熟悉的“公理—推论—体系”阶梯，抽象研究路线因此具有可追随的施工顺序。
property_alignment: 1）文明生存与扩张公理对应几何基本公设；2）宇宙社会图景对应由公理推出的定理体系；3）纯理论方法对应欧氏几何的演绎性。
context_alignment: 叶文洁面对跨专业的罗辑，用基础数学范式说明研究方法，既符合两人的学术身份，也直接回答“没有资料怎么办”。
narrative_function: 为黑暗森林理论规定生成方式，使此刻的闲谈获得后来可兑现的理论骨架。
transfer_rule: 解释新理论时，可选一个在起点、推导操作、终点结构上都同构的成熟学科，而非只借其权威名称。
failure_boundary: 宇宙社会行为包含经验不确定性，不能因为借用欧氏几何就把公理视为数学意义上的绝对真理。
