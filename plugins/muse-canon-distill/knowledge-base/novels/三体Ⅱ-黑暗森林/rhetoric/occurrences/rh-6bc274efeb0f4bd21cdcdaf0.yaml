tenor: 尚无观测资料的宇宙社会学理论建构
vehicle: 由公理演绎整个体系的欧氏几何
ground: 1）两者都从少量不证自明的前提起步；2）都依靠逻辑推导扩展体系；3）都能在缺少逐项经验调查时先形成形式结构。
