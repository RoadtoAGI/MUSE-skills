tenor: 大脑云图以红光、星海和动态网络呈现思维点，画面壮观易看却对实际分析并非必要
vehicle: 宴席摆满丰富可口菜肴，为观看和享受者提供强烈、连续的感官满足
ground: 1）绚丽图像对应菜肴；2）观看对应品尝；3）丰富变化对应席面丰盛；4）感官愉悦对应味觉享受；5）科研实用性低对应宴席不等于营养分析。
