quote: 从传统电子和计算机技术这两颗柠檬中挤出最后几滴水
sensory_mapping: 干瘪柠檬、手掌挤压、零星滴液、果肉耗尽
context_fact: 量子计算机被智子锁死，两位面壁者所需算力只能寄望传统计算机在二三十年内达到最后顶峰。
image_mechanism: 庞大计算产业缩成掌中两颗将干果实，研究投入成为持续加压；产出从指数增长降成可数的几滴。
property_alignment: 1）传统电子与架构对应柠檬；2）技术潜力对应汁液；3）研发优化对应挤压；4）性能提升对应滴液；5）发展终点对应榨干。
context_alignment: 首席科学家在谈摩尔定律失效，‘最后几滴’把增速放缓和资源耗费同时显形，也解释为何计划必须冬眠等待。
narrative_function: 用厨房尺度讲清技术天花板，让计算能力危机从抽象指数转成资源将尽的直觉。
transfer_rule: 资源榨取类比应对应总存量、边际产出和施力成本；仍处快速增长期的技术不宜写成干柠檬。
failure_boundary: 技术进步可由新材料、架构或算法创造新空间，并非固定汁量；比喻会低估路线内部的非连续突破。
