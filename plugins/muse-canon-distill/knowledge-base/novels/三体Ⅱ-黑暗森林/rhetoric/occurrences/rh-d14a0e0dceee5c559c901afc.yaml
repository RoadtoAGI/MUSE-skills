context_fact: 自然选择号加速至百分之一光速后停止，追击舰队尚在后方，章北海计划保存文明火种。
image_mechanism: 恒星级巨舰在宇宙尺度被缩成一叶舟，返回能力的计算结果转成失去岸线的孤独处境。
property_alignment: 1）自然选择号对应舟；2）太阳系对应故港；3）星际空间对应海；4）聚变燃料对应航粮；5）全舰两千人对应孤舟乘员；6）逃亡航向对应漂泊路线。
context_alignment: 海军人物夺取太空舰，舟喻体延续职业语言；‘孤’同时表达战术隔绝与文明种子唯一性。
narrative_function: 确认夺舰已跨过可逆点，把政治叛逃转成无法回头的文明远航。
