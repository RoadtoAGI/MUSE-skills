tenor: 各国太空军虽新建，却保留本国既有军队的制度习惯、价值观和行为方式
vehicle: 物体表面被高温印具永久压出来源标记
ground: 1）旧军队传统对应烙铁图案；2）太空军文化对应受印表面；3）来源可辨对应印记识别；4）影响持久对应烙痕难消；5）建军过程对应压印时点。
