quote: 在军事文化上也都打上了各自军队的烙印
sensory_mapping: 烙铁下压、表面留痕、来源标记、痕迹固着
context_fact: 章北海不同意陆军单独充当灵魂，认为各军种精神相通且各国太空军带有本国军队特点。
image_mechanism: 无形制度传统被烧成一枚印章，在新军种尚软的文化表面压下；组织虽换名称，纹路仍暴露出处。
property_alignment: 1）本国军队传统对应烙印；2）太空军对应受印物；3）建制传承对应压印；4）文化特征对应留下纹路。
context_alignment: “新生”太空军强调其可塑阶段，烙印准确说明继承既有体系并非自零开始，语气符合军官抽象讨论。
narrative_function: 把军事文化传承具体化，为未来太空军信念危机与政工建设建立历史约束。
transfer_rule: 传统如烙印应明确施印者、承印阶段、可辨纹路和持久性，也可显示继承的难以摆脱。
failure_boundary: 文化会学习、混合和改变，并非永久烙痕；新组织成员来源多元时不能归为单一印章。
