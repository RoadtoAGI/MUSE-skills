chapter: 正文
figure_type: metaphor
quote: 人类不可能通过太阳这个超级天线向宇宙中发送任何信息了
sensory_mapping: 太阳伸展成宇宙天线、地球信号借其放大远播、水滴用噪声塞满所有频段、天线被迫沉默
context_fact: 水滴停在日地之间，向太阳发出覆盖全部可放大波段的强电磁波，阻断罗辑咒语广播。
image_mechanism: 恒星天体被设备化，复杂物理放大机制获得输入、增益、发射与干扰四个熟悉环节。
property_alignment: 1）太阳电磁响应对应天线增益；2）地球编码对应馈源；3）恒星辐射对应广播；4）水滴噪声对应堵频；5）宇宙文明对应远端接收者。
context_alignment: 罗辑曾把太阳当广播工具，‘超级天线’不是纯装饰而是整个威慑方案的工程支点。
narrative_function: 让罗辑瞬间理解水滴真正使命：三体并非杀他，而是拆除他唯一可用的开锁工具。
transfer_rule: 自然放大器作天线时，应逐项映射信号源、增益介质、频段、接收范围和干扰方式。
failure_boundary: 太阳不是人工定向天线，放大机制有特定触发条件；封锁当前通道不等于宇宙中绝无其他广播手段。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 人类原可用太阳电磁波放大效应把编码信号广播到银河系，水滴持续干扰后该通道失效
vehicle: 巨型天线把微弱电信号转换、放大并向远方辐射；遭强干扰占满频段后无法发送有效内容
ground: 1）太阳对应天线；2）放大效应对应增益；3）人类信号对应输入；4）银河系对应覆盖区；5）水滴宽频波对应干扰堵塞。
