quote: 他把它想象成一个正在思维的大脑。
sensory_mapping: 视觉运动、尺度、内部活动
context_fact: 伊文斯正在思考三体人与人类大脑交流的差异，离开船首沿太平洋甲板漫步。
image_mechanism: 人物当前问题覆盖眼前海景，波峰不再只是水动，而成为看不见思想在巨大器官表面留下的活动迹象。
property_alignment: 1）海浪起伏对应思维波动；2）海洋广度对应脑内网络规模；3）夜色遮蔽深处对应思想内容不可见。
context_alignment: 他正围绕“想与说”思考，脑的喻体由对话主题自然投到海洋；无声海面又对照三体思维可外显。
narrative_function: 把思考停顿变成环境图像，并为随后揭示思想透明与隐藏的文明分歧蓄势。
transfer_rule: 让环境承接人物思维时，可选与问题具有同类动态和层次的景物，使外部运动成为内部过程的可见投影。
failure_boundary: 海浪不对应具体神经机制，不能据此把海洋写成有意识主体；若人物主题与思维无关，脑意象会显得强贴。
