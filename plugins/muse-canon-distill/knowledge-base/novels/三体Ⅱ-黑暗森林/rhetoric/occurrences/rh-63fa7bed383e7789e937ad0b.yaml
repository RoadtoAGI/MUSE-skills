quote: 整个舰队阵列也像被点燃了一般熠熠闪耀，成为一片光的海洋
sensory_mapping: 舰队平面化成光海、十颗小太阳燃烧、舰壳波光闪耀、火线在海面推进
context_fact: 水滴持续沿直线攻击，身后始终有约十艘战舰处于核爆燃烧阶段，更多舰船被强光照亮。
image_mechanism: 离散舰船与火球在远景中融合成连续发光介质，编队的平面几何变成承载火浪的海面。
property_alignment: 1）舰队阵列对应海；2）单舰对应波面亮点；3）火球对应燃烧浪头；4）尾焰与熔液对应光水；5）攻击路径对应火线；6）整体闪耀对应海面反光。
context_alignment: 章北海曾把海洋视作太空缩影，此处海洋返回为舰队葬场；人类海军源流被真正的火海吞没。
narrative_function: 从单舰花蕾拉远到整阵光海，让毁灭规模在一分钟内由点扩成面。
transfer_rule: 阵列作海洋时，应利用平面覆盖、连续反光、波状扩散与多点火源，说明离散单元为何视觉融合。
failure_boundary: 舰队之间仍是真空，没有连续液体或海浪；光海只在远景和强照明下成立。
