chapter: 正文
figure_type: metaphor
quote: 浸透了烛光的葡萄酒
sensory_mapping: 透光液体、浸润、深红染色、晶莹内光
context_fact: 想象女孩让罗辑从蜡烛对面观看酒瓶，酒因此显出梦境般深红。
image_mechanism: 无形光变成第二种液体，从酒瓶一侧灌入并浸满原有酒液，两种流体在视觉中融合。
property_alignment: 1）烛光对应浸液；2）葡萄酒对应被浸材料；3）透射对应渗透；4）深红光泽对应染色结果。
context_alignment: 场景核心是酒、烛与想象恋人，液体动词把两种物质自然接合，为随后“死去的太阳”“晚霞的眼睛”准备颜色。
narrative_function: 把普通酒瓶提升为共同命名的梦境物，启动两人关于晚霞与现实的对话。
transfer_rule: 用浸润写光时，应有半透明介质、可见的内部变色和明确光源方向。
failure_boundary: 光不会像液体永久滞留，移开蜡烛效果即消失；不透明物体只能被照亮，不能写成浸透。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 被对面蜡烛照亮、通体呈晶莹深红的瓶中葡萄酒
vehicle: 被液体或染料从表面到内部完全浸湿渗透的材料
ground: 1）烛光进入酒体对应液体渗入材料；2）整瓶颜色改变对应浸透；3）酒本身透明可传光对应可吸收介质；4）光与酒混成深红对应染色完成。
