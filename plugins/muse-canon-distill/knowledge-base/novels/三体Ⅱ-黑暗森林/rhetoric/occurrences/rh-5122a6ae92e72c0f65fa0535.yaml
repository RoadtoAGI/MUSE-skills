review_status: reviewed
tenor: 罗辑高度专注时把星空抽象成静止点阵、暂时屏蔽所有复杂运动的主观认知状态
vehicle: 严寒将宇宙整体冻成凝固介质，恒星和原子都停在冰中等待解冻
ground: 1）注意力定格对应冻结；2）运动被忽略对应冰封静止；3）星点冰冷对应冻入冰面的颗粒；4）尚未获得洞见对应等待觉醒；5）顿悟临近对应可能解冻。
