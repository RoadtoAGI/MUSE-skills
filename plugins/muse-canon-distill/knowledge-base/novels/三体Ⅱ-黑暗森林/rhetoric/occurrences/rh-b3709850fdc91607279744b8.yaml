quote: 目光又变得飘忽不定了，像三支在风中摇曳的烛火
sensory_mapping: 白厅中三点目光化成小火、无形风持续吹摆、火焰短暂靠拢又散开、黑暗逼近灯芯
context_fact: 他们想到用隐形次声氢弹杀人后精神到崩溃边缘，休息再对视时仍无法稳定。
image_mechanism: 目光的微小移动获得火焰形态，心理不确定被转成风压下的亮度与方向波动。
property_alignment: 1）眼神亮点对应火焰；2）三人对应三烛；3）恐惧对应风；4）决心对应持续燃烧；5）回避对视对应火光分离。
context_alignment: 此前眼中阳光消失，这里只剩三支脆弱烛火，光源尺度下降准确表现心理防线衰弱。
narrative_function: 在武器方案与魔鬼自认之间显示意志临界，让选择过程保留真实犹豫。
transfer_rule: 目光作风中烛火时，应让数量、微光、风源、摇摆方向和熄灭风险都对应人物状态。
failure_boundary: 眼睛不会燃烧，三人的思想也并非被动受风；他们仍能重新稳定目光并继续选择。
