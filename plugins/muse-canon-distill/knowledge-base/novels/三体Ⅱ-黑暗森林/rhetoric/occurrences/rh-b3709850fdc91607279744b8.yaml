tenor: 三人短暂休息后重新对视，但精神接近崩溃，意志和共同决断反复动摇、随时可能中断
vehicle: 三支微弱蜡烛受风吹动，火焰方向和亮度不停摆动，既互相照见又可能随时熄灭
ground: 1）三道目光对应三支烛火；2）心理压力对应风；3）意志不稳对应摇曳；4）无声交流对应微光相照；5）崩溃对应熄灭。
