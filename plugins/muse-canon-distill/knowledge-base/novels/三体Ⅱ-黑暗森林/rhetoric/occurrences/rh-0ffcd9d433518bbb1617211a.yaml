context_fact: 研究发现判断思维不在固定脑区，只能凭动态神经冲动模式识别；林格曾用恒星相对排列为罗辑编码坐标。
image_mechanism: 大脑全息图已视觉化为星海，识别任务沿同一图景推进：不盯住单颗星，而在亿万点中寻找一组独特关系。
property_alignment: 1）神经元网络对应银河星群；2）判断模式对应特定星区；3）突触活动构图对应恒星排列；4）超级计算机对应银河数据库；5）定位结果对应找到目标。
context_alignment: 前文展示系统已把神经元直接画成一千亿颗星，调用刚发生过的恒星定位方法既符合人物知识又避免另起喻体。
narrative_function: 解释思维模式为何无固定位置却仍可识别，并把宇宙尺度的计算困难移入大脑。
transfer_rule: 跨领域检索类比应对齐数据单元、唯一特征、搜索空间和匹配工具，视觉相似只能作为入口。
failure_boundary: 恒星构图相对稳定，神经模式高速变化且受状态影响；静态星图算法不能直接替代脑活动识别。
