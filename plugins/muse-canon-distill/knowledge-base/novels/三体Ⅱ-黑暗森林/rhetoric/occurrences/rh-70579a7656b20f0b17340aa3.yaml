chapter: 正文
figure_type: simile
quote: 飞散的碎片如冰雹般密集
sensory_mapping: 硬质金属粒铺满视野、成阵敲向舰壳、拦截火力像薄伞漏雹、警报接连响起
context_fact: 防御系统无法拦住全部固液混合碎片，部分残片击穿第二队列战舰并触发减压警报。
image_mechanism: 太空三维弹流被压成天气式颗粒袭击，‘密集’从统计数量转为身体可感的连续敲击。
property_alignment: 1）冷凝外壳对应冰粒硬度；2）碎片群对应雹阵；3）舰体对应受灾地面；4）穿透拦截对应雹粒漏过遮蔽。
context_alignment: 冰雹的冷硬外观贴合太空冷却外壳，内部炽热则反向增加陌生感和破坏力。
narrative_function: 具体化次生灾害的密度，说明即使水滴暂未抵达，舰列也已被前列残骸削弱。
transfer_rule: 颗粒攻击作冰雹时，应同时匹配硬度、密度、持续撞击和防护漏失，别只借‘很多’一项。
failure_boundary: 碎片不从天空垂直下落，内部常为熔融态，动能与尺寸也远超自然冰雹。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 大量冷凝或半熔的金属残片以很小间距高速撞向第二队列，超过防御系统拦截能力
vehicle: 暴风云落下的冰雹颗粒坚硬、密集、连续撞击地面，常有颗粒穿过遮挡造成损坏
ground: 1）金属残片对应雹粒；2）数量众多对应密集降雹；3）高速撞击对应砸落；4）舰壳损伤对应雹害。
