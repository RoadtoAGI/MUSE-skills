chapter: 正文
figure_type: simile
quote: 在两千个太阳的照耀下，木星和它的卫星都像在燃烧
sensory_mapping: 两千太阳排开、巨行星表面骤亮、闪电织火、卫星在黑空中灼烧
context_fact: 联合舰队采用矩形阵列同时启动聚变发动机，实况图像到达地球后引发全民胜利狂热。
image_mechanism: 反射与电离造成的行星亮度被火焰化，静态天体因此像被人类舰队点燃，展示能量覆盖尺度。
property_alignment: 1）木星与卫星对应燃烧物；2）舰队尾焰对应点火源；3）辐射照明对应火光；4）大气闪电对应火舌；5）光度上升对应燃烧增强；6）宇宙黑夜对应火场背景。
context_alignment: 段落把舰队称为两千太阳并援引创世之光，行星燃烧是这套神化修辞的直接视觉证据。
narrative_function: 把编队出航提升为重塑天体的神迹，精准表现人类胜利主义达到傲慢峰值。
transfer_rule: 受强光天体作燃烧时，应提供外部火源、表面动态光纹和亮度突变，并让燃烧服务人物的力量判断。
failure_boundary: 木星和卫星没有真实起火，闪电是大气电离；强光也不能证明舰队能抵抗三体探测器。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 两千艘战舰的聚变发动机以极强辐射照亮木星及卫星，使其表面亮度暴涨并出现电离闪电
vehicle: 巨大物体被火焰全面包围，表面发出强光、热色和不断跳动的燃烧纹理
ground: 1）发动机辐射对应火源；2）行星高亮对应燃烧发光；3）电离闪电对应火焰跳动；4）半球照亮对应火势覆盖；5）强辐射对应高热感；6）黑夜被驱散对应火光。
