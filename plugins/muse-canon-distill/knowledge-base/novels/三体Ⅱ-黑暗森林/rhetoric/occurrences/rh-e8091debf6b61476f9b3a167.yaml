tenor: 罗辑把两个相隔百光年、信息不对称的文明简化成双节点模型，用来逐步推演善意、暴露和猜疑
vehicle: 黑暗中相隔数米的两点烟火分别充当星球，周围沙漠被删去为真空，吸烟者扮演文明决策者
ground: 1）烟头火星对应文明星球；2）两名吸烟者对应文明主体；3）三四米间距对应百光年；4）黑暗沙漠对应宇宙；5）说话选择对应星际信号。
