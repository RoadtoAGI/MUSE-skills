quote: 这两个火星就代表两个文明星球
sensory_mapping: 周围世界被想象删除、两粒红火悬在黑暗宇宙、罗辑与大史各守一颗文明点、推理沿两点展开
context_fact: 两人在无灯沙漠拉开距离、各点一支烟，罗辑明确指定火星代表两个文明星球。
image_mechanism: 宏大不可实验的宇宙社会被桌面模型化，真实黑暗、距离和点光让抽象设定直接占据现场。
property_alignment: 1）火星亮点对应星球；2）沙漠黑暗对应深空；3）人间距离对应星际隔绝；4）对话对应通信；5）点烟熄灭对应文明暴露与沉默。
context_alignment: 大史要求通俗，身边仅有两支烟；罗辑就地取材，让听者身体参与模型而非接受长篇定义。
narrative_function: 建立全段推演舞台，使后续猜疑链、技术爆炸和黑暗森林从两个可见点逐层生成。
transfer_rule: 现场物件作思想实验时，应明确缩放比例、角色分配、删除条件和每个动作的模型含义。
failure_boundary: 两人可即时交流、同属人类且相隔很近，真实文明不存在共同语言和现场主持者；模型主动忽略这些差异。
