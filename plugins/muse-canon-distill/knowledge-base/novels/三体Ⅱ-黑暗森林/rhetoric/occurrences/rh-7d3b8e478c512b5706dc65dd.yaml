quote: 现在还在用纸质文件，就像乔纳森的衣服一样，这应该也是一种庄重的表示
sensory_mapping: 纸页铺桌、静态西装、柔光会场、旧制仪式复现
context_fact: 全息会议大厅努力复制旧联合国风格，乔纳森的西装和桌上纸质文件都与日常动态图像技术相反。
image_mechanism: 两种不同物件被放进同一礼仪语法：衣服通过不闪烁显得正式，文件通过不数字化获得同样的历史重量。
property_alignment: 1）纸张对应西装；2）纸质媒介对应静态面料；3）保存旧制对应复古设计；4）程序权威对应庄重外观；5）异常技术选择对应礼仪标识。
context_alignment: 未来日常界面无处不在，纸与静态服装的共同反常使‘庄重’推断有具体对照，并强化会场怀旧设计。
narrative_function: 说明先进社会仍借旧媒介制造权威感，也让面壁计划的终结带上历史仪式色彩。
transfer_rule: 跨物件的功能类比应指出它们共同偏离何种常态、服务何种社会信号，而非只因都‘旧’就并列。
failure_boundary: 纸张承担记录和签署，西装承担身体呈现，两者功能和使用风险不同；庄重只是罗辑推测。
