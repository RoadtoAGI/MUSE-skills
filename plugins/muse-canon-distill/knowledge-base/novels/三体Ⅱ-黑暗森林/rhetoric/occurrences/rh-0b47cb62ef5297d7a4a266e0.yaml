quote: 是你们打开瓶盖儿放出了他
sensory_mapping: 瓶塞拔开、黑暗魔物冲出、释放者后退、危险无法收回
context_fact: 雷迪亚兹用虚构纽约炸弹反触发系统胁迫整个听证会放他回国，美国代表失控痛骂。
image_mechanism: 制度授权被缩成一次不可逆开盖，长期政治选择变为释放危险实体的单一动作，责任对象因此清晰。
property_alignment: 1）联合国对应持瓶者；2）法律限制对应瓶盖；3）雷迪亚兹对应被封魔物；4）面壁权对应开口通道；5）恐怖威胁对应魔鬼作乱；6）无法制约对应收不回瓶中。
context_alignment: 发言者前句直接称雷迪亚兹魔鬼，瓶子框架让辱骂获得因果结构，并把怒火从个人扩展到制度设计者。
narrative_function: 把面壁制度风险具象成释放灾难的原罪，为后续终止雷迪亚兹资格制造政治压力。
transfer_rule: 制度放权作开瓶时，应明确原先封印、释放动作、获释力量和不可回收后果，同时区分责任层级。
failure_boundary: 雷迪亚兹原本就是政治行动者，不是无责任魔物；联合国并未创造其思想，且法律仍可限制计划。
quality_assessment: effective
