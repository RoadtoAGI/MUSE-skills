quote: 让你感觉全世界除了想吃你的狼就再没别的了
sensory_mapping: 狼群环围、牙齿、孤身、逼近
context_fact: 史强向罗辑讲黑白脸审讯术，说明黑脸先制造恐惧与孤独，再由白脸扮演保护者。
image_mechanism: 审讯室扩张成荒野，所有人先长出狼牙，把受审者逼到情感绝境，白脸的普通人形因此显得唯一可亲。
property_alignment: 1）黑脸对应狼；2）受审者对应猎物；3）恐吓对应围猎；4）孤独对应无同类；5）白脸对应假救援者。
context_alignment: 史强用街头化语言讲心理操控，狼群比术语更能让罗辑预感被全世界敌视的身体恐惧。
narrative_function: 解释黑白脸技术的情感机制，也预演面壁者被全世界隔绝后对唯一理解者的依赖。
transfer_rule: 捕食群体写社会孤立时，应指出围堵者、被猎者、具体威胁与随后出现的假安全出口。
failure_boundary: 审讯者未必真要伤害或吞噬对象，狼化会遮蔽法律程序；只适用于被操控者的主观体验。
