chapter: 正文
figure_type: simile
quote: 如同在岩浆的海洋中投入了一块块巨石
sensory_mapping: 红热海面铺开、巨石接连坠入、黏稠浪墙向外推、波涛互相撞合
context_fact: 火球队列后方的战舰相继熔化迸射，金属液在真空中无阻扩散。
image_mechanism: 没有介质的太空被百万吨熔液临时填成岩浆海，爆炸不是海中结果而被写成投石的重复触发。
property_alignment: 1）熔融舰材对应岩浆；2）舰队空间对应海盆；3）战舰爆炸对应巨石落下；4）冲击波对应液浪；5）高温红光对应火山色；6）连续爆炸对应连续投石。
context_alignment: 前句光海偏远景美感，本句用岩浆和巨石补回物质重量与高温，延展框架有明确增量。
narrative_function: 让连锁核爆具有可追踪波动，表现毁灭不只沿水滴轨迹，还向编队四周扩散。
transfer_rule: 连续爆炸作投石入液时，应对齐落点、介质、波形、温度和多次扰动叠加。
failure_boundary: 真空没有岩浆海承载波浪，金属液滴各自惯性飞行；水波模型不能替代弹道计算。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 熔化战舰依次爆裂，把炽热金属液大规模推向周围真空，形成一圈圈相互叠加的放射波
vehicle: 巨石连续砸入黏稠岩浆海，每次撞击都掀起高温液体波涛并向外扩散
ground: 1）金属液场对应岩浆海；2）爆炸战舰对应投入巨石；3）爆发冲击对应落石；4）径向射流对应波涛；5）连续毁舰对应多石入海；6）高温对应岩浆。
