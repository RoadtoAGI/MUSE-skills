chapter: 正文
figure_type: simile
quote: 群星在纷乱地舞动着，像振动着的鼓皮上的沙粒
sensory_mapping: 鼓膜震颤、沙粒跳舞、密集颗粒、整体联动
context_fact: 基因病毒使罗辑高烧昏睡，他梦见银河系全部恒星进行二千亿体运动。
image_mechanism: 银河引力空间被绷成一张巨大鼓皮，每颗恒星缩成其上的亮沙；不可见引力振动一到，星粒成片跳起。
property_alignment: 1）群星对应沙粒；2）引力网络对应鼓皮；3）多体运动对应膜面振动；4）星群纷乱对应颗粒跳跃。
context_alignment: 喻体既呈现个体杂乱又保留共同底层联系，准确服务“意识到星球间引力联系”的梦中认知。
narrative_function: 把黑暗森林理论压力和高烧神经躁动合成银河级梦魇，为银蛇侵脑升级。
transfer_rule: 群体粒子类比应指出共同承载面与驱动力，使“乱动”仍有系统机制。
failure_boundary: 恒星不在二维膜面上，也没有单一鼓手；真实多体运动时间尺度远慢于沙粒振动。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 罗辑高烧梦中受银河引力牵连、以复杂模式剧烈抖动的两千亿颗恒星
vehicle: 撒在绷紧鼓皮上、随鼓面连续振动而跳跃换位的大量沙粒
ground: 1）恒星对应沙粒；2）引力场对应鼓皮；3）群星振动对应沙粒跳动；4）数量庞大对应满布颗粒；5）联动运动对应共同受膜面驱动。
