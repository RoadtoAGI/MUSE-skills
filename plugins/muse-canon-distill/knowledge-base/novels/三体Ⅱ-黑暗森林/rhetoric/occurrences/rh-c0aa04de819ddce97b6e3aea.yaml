quote: 像来自天空般空灵
sensory_mapping: 听觉回响、高度、空旷、轻质空气
context_fact: 散会后大厅只剩罗辑与远处秘书长，她开口询问他的问题。
image_mechanism: 地面人物的声音脱离身体升到穹顶，再从巨大会场上方缓缓落下，使制度发言带上无处可逃的天启感。
property_alignment: 1）回声对应天空扩散；2）轻柔对应空灵；3）远距对应高远；4）秘书长权威对应自上而下。
context_alignment: 星空状穹顶和空场提供真实声学与视觉条件；罗辑刚被赋予不可理解使命，声音像来自另一个秩序。
narrative_function: 延长任命后的失真感，并把萨伊塑成既温和又代表庞大制度的声音。
transfer_rule: 以天空写声音时，应利用实际回声、空间高度和说话者权力位置，让“空灵”具有可听结构。
failure_boundary: 轻声不必然神圣或权威；在狭小吸音空间中使用天空喻体会失去声学依据。
