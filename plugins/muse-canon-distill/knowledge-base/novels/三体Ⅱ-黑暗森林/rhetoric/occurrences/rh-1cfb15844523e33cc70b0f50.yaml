chapter: 正文
figure_type: metaphor
quote: 真正写成文字的，只是冰山的一角
sensory_mapping: 海面、冰尖、水下巨体、比例悬殊
context_fact: 白蓉纠正罗辑直接操纵人物的方法，要求他先想象人物完整一生，再只写情节所需部分。
image_mechanism: 人物设定沉入水下形成巨大冰体，正文只允许一小角穿出水面；隐藏重量决定露出形状。
property_alignment: 1）完整生命对应冰山主体；2）正文行为对应冰角；3）省略对应水面遮蔽；4）人物厚度对应水下体积。
context_alignment: 这是作家向初学者解释创作方法，比例和承托关系都可执行，直接引出罗辑随后想象整个人生。
narrative_function: 提供创造想象女孩的技术转折，也成为作品可迁移的角色塑造原则。
transfer_rule: 冰山法应先建设隐藏经历，再选择能被其因果支撑的少量外显动作；隐藏内容必须实际改变冰角形状。
failure_boundary: 无限背景不保证人物鲜活，若水下设定从不影响正文，只是作者自娱；信息不足也会让读者无法理解。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 小说中实际呈现的人物言行相对于作者想象的完整生命经历
vehicle: 海面只露出尖角、绝大体积隐藏水下的冰山
ground: 1）可见文字对应露出水面的尖角；2）未写人生对应水下巨大主体；3）可见部分由隐藏整体支撑对应人物行为由十年经历生成；4）读者只能见少量对应海面遮蔽。
