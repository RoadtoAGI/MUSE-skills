chapter: 正文
figure_type: metaphor
quote: 似乎这个世界已经被静音了，一切都处于绝对的死寂中
sensory_mapping: 雪原像仍在播放的无声屏幕，人物张口奔跑，所有呼喊却被一枚看不见的按键切断
context_fact: 罗辑在梦中拼命喊庄颜远离水滴，但声带发不出声音；庄颜和孩子只作无声呼唤。
image_mechanism: 梦境被媒体界面化，局部失声扩大为世界音轨关闭，沟通绝望由单一控制动作完成。
property_alignment: 1）现实景象对应画面；2）声音环境对应音轨；3）失声对应静音指令；4）继续动作对应无声播放。
context_alignment: 未来世界充满信息墙和屏幕，‘静音’是罗辑熟悉的现代操作词，也准确描述梦中视觉在而听觉断。
narrative_function: 使警告无法传达，迫使庄颜继续走向空白，并把罗辑面对毁灭的无力感绝对化。
transfer_rule: 世界作静音媒体时，应保留可见动作、明确失去声道、设置无效发声者和沟通后果。
failure_boundary: 世界没有统一音量控制，失声来自梦境与高烧；静音不能解释真实物理声音为何消失。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 梦中罗辑无法发声、庄颜呼唤也无声，整个雪原失去一切可听信号和回应
vehicle: 播放中的影音设备被按下静音键，画面继续运动，声音通道却被外力一次性关闭
ground: 1）雪原画面对应影像；2）人仍动作对应画面播放；3）声带无声对应音轨关闭；4）全域寂静对应总静音；5）无法沟通对应声音通道断开。
