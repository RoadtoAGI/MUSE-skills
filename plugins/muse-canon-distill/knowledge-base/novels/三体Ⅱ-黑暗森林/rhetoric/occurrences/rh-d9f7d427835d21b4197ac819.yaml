quote: 随后又立刻触电似的离开
sensory_mapping: 后背刚触、全身猛弹、接触瞬断、手脚悬空
context_fact: KILLER病毒刚操纵沙发收紧险些勒死罗辑，警察离开后他又遭玻璃杯爆炸，已连续第六次遇险。
image_mechanism: 真实电流并不存在，恐惧记忆却把沙发表面变成带电体；接触与逃离之间几乎没有思考间隔。
property_alignment: 1）沙发对应带电物；2）罗辑后背对应触电部位；3）创伤警觉对应电刺激；4）猛离对应电击反射；5）持续戒备对应避免再次接触。
context_alignment: 同一房间的普通物件刚成为杀人工具，触电动作准确表现罗辑的身体已先于理智把所有接触判为危险。
narrative_function: 用短促动作显示连续谋杀造成的创伤反应，使解除病毒后的安全仍无法立即恢复。
transfer_rule: 惊跳作触电时，应有明确接触点、瞬发反射和已建立的危险记忆，动作速度是核心对应。
failure_boundary: 罗辑没有遭受电流、麻痹或灼伤，离开由心理恐惧触发；不能据此判断沙发仍通电。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 罗辑呕吐后刚无力靠上曾试图勒死他的智能沙发，身体立即惊跳并迅速避开
vehicle: 身体接触带电物体后肌肉骤然收缩，本能弹开以切断电流
ground: 1）碰到沙发对应接触电源；2）死亡记忆对应电击疼痛；3）立刻离开对应反射弹开；4）全身紧张对应肌肉收缩；5）双手无处安放对应持续防触。
