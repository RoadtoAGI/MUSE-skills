quote: 主席的话让罗辑的眼睛亮了起来
sensory_mapping: 麻木的双眼像熄灭灯面忽然通电，亮点升起，身体也从沙发里直起
context_fact: 罗辑此前醉酒、拒绝工作；主席说条件改变后，他立即坐正并追问新条件。
image_mechanism: 内在希望借眼部明暗外显，抽象注意转为瞬间可见的光变，并与坐姿变化形成同一节拍。
property_alignment: 1）希望恢复对应亮度增加；2）注意聚焦对应光集中在眼睛；3）麻木结束对应暗处被照开；4）坐正追问对应光起后的行动。
context_alignment: 视频听证只能读取表情与姿态，眼睛亮起让远端代表和读者同时捕捉妻女对罗辑的唯一驱动力。
narrative_function: 在委员会提出雪地工程前暴露控制杠杆，使罗辑随后接受无意义任务具有清楚动机。
transfer_rule: 用眼睛明暗写希望时，应让光变紧贴一条具体消息，并安排同步的身体动作证明注意真的改变。
failure_boundary: 这里的‘亮’主要是神情判断，未记录眼球物理发光；若人物没有随后的专注动作，明暗喻会退化为套语。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 罗辑听见委员会改变妻女苏醒条件后突然恢复注意和期待
vehicle: 原本暗淡的灯或反光面突然获得光源，亮度升高并把观察者的视线吸引过去
ground: 1）低落神情对应暗面；2）希望出现对应光源接通；3）目光专注对应亮点聚集；4）随即坐正对应照明带来的活跃。
