quote: 您是他的正义天使；对于无神论者，您是银河系正义的超级文明的代言人
sensory_mapping: 罗辑被推到凡人与银河权威之间、一侧长出天使身份、一侧拿到文明话筒、跪拜者向他请求传达
context_fact: 187J3X1按罗辑坐标广播后被光粒摧毁，面壁计划恢复，公众在沙漠跪拜并称他为神使。
image_mechanism: 不可解释的因果链用中介角色补全，罗辑的知识被误认成来自更高主体的授权与道德力量。
property_alignment: 1）理论发现者对应神使；2）宇宙攻击者对应神/上级文明；3）广播坐标对应传令；4）毁星对应裁决；5）公众祈求对应请愿。
context_alignment: 同一结构分别提供宗教与世俗版本，显示不同信仰群体都用人格化正义填补黑暗森林的无意攻击。
narrative_function: 呈现公众对咒语的错误解释，并将罗辑重新抬上面壁者位置，为其后讲述真实黑暗图景蓄反差。
transfer_rule: 知识者作权威中介时，应明确上级、授权证据、传递内容、受众和误读环节，允许多套文化车辆并置。
failure_boundary: 毁星文明并不认识罗辑或主持正义，攻击源于黑暗森林安全策略；罗辑也未获其授权。
