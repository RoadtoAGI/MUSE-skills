quote: 那是四圈死亡的绞索
sensory_mapping: 四个红圈从界面套住四点、光点像脖颈被绳环扣住、只待操作者拉紧
context_fact: 列文打开武器界面时，发现另外四舰已被章北海预先锁定，三人均未授权此操作。
image_mechanism: 抽象瞄准标记被刑具化，几何套合直接成为生命控制关系，预谋状态因此像已行刑一半。
property_alignment: 1）瞄准环对应绞索环；2）战舰标记对应受刑者；3）锁定完成对应套索就位；4）导弹发射对应收紧；5）次声杀伤对应窒息死亡。
context_alignment: 界面本来是冷静技术图形，三人刚讨论邪恶身份，绞索意象让操作伦理从符号后显露。
narrative_function: 揭示章北海早已看见死局并准备行动，把三人的犹豫转为争夺最后几秒。
transfer_rule: 目标环作绞索时，应匹配环形、套合、执行者和致死触发，使界面符号承担现实后果。
failure_boundary: 锁定不等于必然发射，红环不会物理束缚战舰；目标仍可能防御、机动或被解除锁定。
