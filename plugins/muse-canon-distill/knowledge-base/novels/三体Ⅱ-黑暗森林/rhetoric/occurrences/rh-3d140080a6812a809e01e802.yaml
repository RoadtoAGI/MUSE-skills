tenor: 武器界面用四个红色锁定环套住另外四舰光点，表示导弹已能对其人员实施致命攻击
vehicle: 绞刑绳圈套住受刑者颈部，收紧后阻断生命；圈一旦定位，死亡程序已进入执行阶段
ground: 1）红色光环对应绳圈；2）目标光点对应颈部；3）锁定对应套住；4）发射权限对应收绳；5）舰员死亡对应绞刑。
