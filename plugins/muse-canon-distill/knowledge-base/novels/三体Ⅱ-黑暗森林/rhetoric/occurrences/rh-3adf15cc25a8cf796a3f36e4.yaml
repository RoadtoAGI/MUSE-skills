quote: 悄悄渗入到他的潜意识之中，一步步把他拉向爱情的深渊
sensory_mapping: 液体渗入、暗手牵拉、脚步逼近、深渊下坠
context_fact: 罗辑起初只觉庄颜需要保护，五年后才理解目光中忧伤持续进入潜意识并塑造爱情。
image_mechanism: 低声背景情绪先像水穿过意识缝隙，再凝成一只看不见的手；每次保护冲动都让脚步靠近悬崖一格。
property_alignment: 1）忧伤对应渗液与拉力；2）潜意识对应内部缝隙；3）爱情深化对应走近边缘；4）罗辑对应被拖者。
context_alignment: 卢浮宫爱情高潮已有悬崖、滑冰和下坠框架，此处追溯此前看不见的牵引力，补足坠落起因。
narrative_function: 把庄颜忧伤、罗辑保护欲与爱情失控连成因果链，同时显出其爱含有投射。
transfer_rule: 深渊牵引喻应铺出渗入、靠近、失足三个阶段，并指出具体情绪如何提供持续拉力。
failure_boundary: 爱情并非纯被动陷落，罗辑也主动选择关系；将庄颜忧伤视为诱引会误置责任。
