quote: 历史的车轮已经被我们推动，我们到未来去等着历史吧
sensory_mapping: 双手推轮、巨车启动、道路延向未来、推动者先去前方等候
context_fact: 一百多名军人已接受思想钢印，夫妇认为当前能做的已完成，准备冬眠至探测器时代。
image_mechanism: 难以直接观察的长期因果被装进滚动车轮，发明者只需给初始推力，制度便在他们沉睡时沿历史惯性继续运行。
property_alignment: 1）思想钢印事件对应历史车辆；2）推广首批用户对应起步；3）希恩斯夫妇对应推车者；4）一百八十五年发展对应滚行路程；5）冬眠对应越过路程；6）醒来观察对应前方等待。
context_alignment: 两人即将用冬眠实际跳到未来，空间上的‘前方等车’与时间操作精准重合，也暗含他们误以为能控制车向。
narrative_function: 给上部思想钢印线一个主动启动姿态，并为惠子在冬眠前发现失控真相制造反讽。
transfer_rule: 历史作车轮时，应指出初始推动、后续惯性、路线和观察者位置，尤其保留进程可能偏航的风险。
failure_boundary: 历史由多方行动共同塑造，不会按单一车辆惯性发展；推动者也无法站在未来外部等待并掌控结果。
