tenor: 希恩斯夫妇已让思想钢印投入使用，决定冬眠到三体探测器抵达的年代，等待其社会后果成熟
vehicle: 一辆沿时间道路前行的巨车被两人推动车轮后继续自行滚动，他们提前到前方等待车辆抵达
ground: 1）历史进程对应车；2）制度变化对应车轮转动；3）夫妇发明推广对应推车；4）后续传播对应惯性滚行；5）冬眠跨时对应赶到前方；6）未来结果对应车辆抵达。
