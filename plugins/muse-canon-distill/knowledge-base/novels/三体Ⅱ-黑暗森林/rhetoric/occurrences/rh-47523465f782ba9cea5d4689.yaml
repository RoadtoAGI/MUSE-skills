quote: 落叶归根，我还是埋在地球的黄土里吧
sensory_mapping: 秋叶脱枝、缓缓落地、根旁黄土、远风拒绝
context_fact: 杨晋文计划宇宙葬以逃离可能被三体占领的地球，张援朝坚持埋在地球黄土中。
image_mechanism: 人的一生被置入树木循环，死亡不是向外逃逸，而是叶片下落、贴回孕育自己的根部土壤。
property_alignment: 1）张援朝对应落叶；2）地球对应树根；3）生命结束对应凋落；4）土葬对应归根；5）离开太阳系对应飘离根系。
context_alignment: 老人讨论骨灰的空间去向，叶片的两种运动恰好区分宇宙漫游和故土安葬，传统成语获得星际尺度反差。
narrative_function: 以熟悉乡土意象回应宇宙葬，表现危机时代普通人的故土伦理。
transfer_rule: 落叶归根适合写生命终点与出生地的回归，应让人物确有地域归属，并设置可能被带离的对照方向。
failure_boundary: 人并非植物器官，故乡也未必是唯一归宿；迁徙者或主动选择宇宙葬者不共享这一价值。
