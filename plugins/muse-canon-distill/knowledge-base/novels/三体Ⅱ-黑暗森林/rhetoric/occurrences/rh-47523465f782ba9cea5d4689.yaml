tenor: 张援朝希望死后遗体留在故乡地球，而非把骨灰发射到太阳系外
vehicle: 树叶凋落后回到生长它的树根周围，重新归入故土
ground: 1）人对应树叶；2）地球故乡对应树根；3）死亡对应叶落；4）安葬故土对应归根；5）宇宙葬对应叶被风带离。
