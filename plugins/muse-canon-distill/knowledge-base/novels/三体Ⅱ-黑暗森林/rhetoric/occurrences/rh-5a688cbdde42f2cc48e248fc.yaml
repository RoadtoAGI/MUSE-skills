chapter: 正文
figure_type: simile
quote: 只有前方舰艇留下的航迹在交错中不安地躁动着，恰似他的心绪。
sensory_mapping: 视觉、运动、空间空缺
context_fact: 编队训练缺少真正的航母，吴岳反复凝视本应由唐号占据的空海。
image_mechanism: 把心中难以分辨的焦虑外化成空位周围被舰船搅乱的白色轨迹，使心理扰动附着于他正在看的具体水面。
property_alignment: 1）交叉航迹对应杂乱念头；2）水面不安对应情绪不安；3）轨迹围绕空白对应忧虑围绕缺席的唐号。
context_alignment: 喻体就在舰长视野和职业环境中，既符合吴岳的海军经验，也由“航母空位”直接触发。
narrative_function: 把装备延期与人物信念动摇绑定，为他后来对太空军漫长前景的崩溃作心理铺垫。
transfer_rule: 写职业人物心理时，可从他当下观察的工作对象中取动态结构，并让环境中的空缺也对应其核心忧虑。
failure_boundary: 若水面平静、轨迹整齐，或人物忧虑与航母空位无关，“躁动航迹”便无法精确承载心绪。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 吴岳对尚未完工的唐号和自身前途的焦灼心绪
vehicle: 空海上交错、翻动而没有稳定方向的舰艇航迹
ground: 1）航迹相互交错对应想法彼此冲突；2）水纹持续躁动对应焦虑不能平息；3）航母位置空缺对应吴岳对未来落空的担忧。
