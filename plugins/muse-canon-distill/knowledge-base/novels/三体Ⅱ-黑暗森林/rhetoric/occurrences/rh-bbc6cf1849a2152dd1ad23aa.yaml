chapter: 正文
figure_type: simile
quote: 广阔而坚硬的荒原延伸开去，像一大块冰冷的金属。
sensory_mapping: 触觉、温度、视觉尺度
context_fact: 虚拟三体世界刚在互联网隐蔽角落复活，黎明中旧地标全部消失，只剩荒原。
image_mechanism: 消去土地应有的松软、颜色和生命，把地面铸成一整块冷硬材料，荒凉因而从视觉空旷扩展到身体触感。
property_alignment: 1）硬地对应金属硬度；2）严寒对应金属冷感；3）无植物起伏对应金属板的单一表面。
context_alignment: 这是计算生成且反复毁灭的世界，金属的无机、恒定质感贴合虚拟环境和乱纪元的冷酷。
narrative_function: 迅速重建三体游戏的非人环境，并为周文王的声音被吞没及反复冻烧提供材质底色。
transfer_rule: 用材质比拟景观时，应同时匹配硬度、温度、表面连续性，并让材质回应世界的生命状态。
failure_boundary: 起伏松软、植被丰富或温暖的荒原不适合金属板；该比喻不说明地面真的具有金属成分。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 三体游戏中寒冷、坚硬、空无一物的荒原
vehicle: 向四周铺展的巨大冰冷金属板
ground: 1）荒原坚硬表面对应金属质地；2）低温对应金属触感冰冷；3）空旷连续平面对应整块无接缝金属。
