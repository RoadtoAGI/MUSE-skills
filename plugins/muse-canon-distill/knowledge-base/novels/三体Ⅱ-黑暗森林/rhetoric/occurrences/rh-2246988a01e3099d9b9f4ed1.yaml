chapter: 正文
figure_type: analogy
quote: 这东西的分子，像仪仗队那样整齐地排列着
sensory_mapping: 微观分子列成方阵、间距绝对一致、巨钉逐一落下、整队冻结无一颤动
context_fact: 水滴表面放大仍绝对光滑，地质锤也无法留下痕迹，丁仪据此猜测其由强相互作用材料构成。
image_mechanism: 不可见晶格先军事化为可阅队列，再用钉死动作解释超常结合力；有序与牢固分两步建立。
property_alignment: 1）分子对应仪仗兵；2）晶格序列对应方阵；3）原子间距对应队距；4）强力键合对应钢钉；5）热振动消失对应队员不动；6）表面平滑对应队列边缘齐整。
context_alignment: 水滴正面对联合舰队，微观‘仪仗队’反向比人类舰队更严整坚固，暗含两种阵列的力量倒置。
narrative_function: 把强相互作用材料的猜测转成两幅可视机制图，并让三名军官立即理解舰队危险。
transfer_rule: 微观有序作队列时，应分别映射排列规则与结合机制；若强调锁定，可增加具体固定动作和运动后果。
failure_boundary: 分子没有军人意志或钉子，强相互作用材料的结构也不能仅由表面光滑确定。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 丁仪推测水滴分子排列达到绝对有序并被强相互作用牢固锁定，连自身热振动都消失
vehicle: 仪仗队员按精确间距列阵后，又被钉子逐个固定在地面，任何人都不能偏位或颤动
ground: 1）分子对应队员；2）晶格对应仪仗队列；3）整齐排列对应等距站位；4）强相互作用对应钉子；5）无振动对应身体钉死；6）材料整体对应固定方阵。
