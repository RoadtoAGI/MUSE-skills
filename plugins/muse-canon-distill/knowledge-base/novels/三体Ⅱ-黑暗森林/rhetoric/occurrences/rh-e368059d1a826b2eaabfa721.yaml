chapter: 正文
figure_type: metaphor
quote: 阳光正在从他们的眼睛中消失，他们的目光都变得阴沉起来
sensory_mapping: 一双双眼睛失去亮点、日光从瞳孔后退、灰云在目光中聚积、人与人之间逐渐入夜
context_fact: 高层军官减少交流、拒绝咨询并害怕对视，症候正向低层人群扩散。
image_mechanism: 内在价值状态被布置成眼内天气，光线退场的渐变提供了心理恶化的可观察时间轴。
property_alignment: 1）眼神亮度对应日光；2）开放信任对应晴朗；3）资源死局对应乌云来源；4）沉默戒备对应阴天；5）症候传播对应天色扩展。
context_alignment: 星舰被称伊甸园，乐园暗下来的宏观框架落到每个人眼中，使群体与个体的黑暗同步。
narrative_function: 给心理危机提供视觉诊断标志，也让后文‘心灵最后一缕阳光消失’成为递进而非突变。
transfer_rule: 希望作眼中阳光时，应写出退光过程、阴影来源、互动后果和可观察症候，建立连续变化。
failure_boundary: 眼部亮度受生理与照明影响，不能单独诊断心理；阴沉也不证明某人已决定互杀。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 高级军官逐渐失去希望、开放与信任，眼神显出压抑、戒备和不愿交流的心理状态
vehicle: 晴朗天空的日光逐渐退去，阴云覆盖视野，环境由明亮温暖转为灰暗低沉
ground: 1）希望对应阳光；2）眼睛对应天空；3）心理恶化对应日光消退；4）猜疑对应阴霾；5）回避对视对应关闭采光。
