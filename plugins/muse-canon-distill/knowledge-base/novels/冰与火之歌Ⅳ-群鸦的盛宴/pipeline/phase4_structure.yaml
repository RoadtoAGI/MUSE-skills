# Phase 4: 结构（序列展开） — 《冰与火之歌Ⅳ-群鸦的盛宴》
# 逆向分析：逐 Arc 展开为序列，标注多线叙事交织模式
#
# 注：本书多POV交替，同一个Arc内多条叙事线并行推进。
# 序列按叙事线组织，标注它们在Arc内的位置关系。

arc_expansions:
  # ════════════════════════════════════
  # ARC-1: 群鸦降临（第231-250章）
  # ════════════════════════════════════
  - arc_id: ARC-1
    sequences:
      - seq_id: ARC1-SEQ1
        name: "权力真空——各方就位"
        core_conflict: 泰温死后谁来统治？各方势力的第一次抢位
        escalation_direction: >
          从单纯的权力交接（瑟曦接管）到多方同时行动
          （铁群岛选王、多恩压制沙蛇、布蕾妮出发、艾莉亚渡海）
        sequence_climax: >
          瑟曦在泰温葬礼上遭凯冯拒绝合作（第238章），
          同时詹姆拒绝做她的首相（第239章）——
          她想要的"兰尼斯特团结"在第一时间就碎了。
        closed: 瑟曦认清无法依靠家族，决定独立行事
        opened: 她将如何在没有家族支持的情况下巩固权力？
        chapters: "231-240"
        primary_threads: [瑟曦线, 詹姆线, 布蕾妮线, 铁群岛线, 多恩线, 艾莉亚线, 山姆线]

      - seq_id: ARC1-SEQ2
        name: "王冠与铁拳——两个不配的统治者同时登顶"
        core_conflict: >
          君临：瑟曦vs提利尔家族争夺对托曼的影响力
          铁群岛：三方（攸伦/维克塔利昂/阿莎）争夺浮木王冠
        escalation_direction: >
          瑟曦在君临布局（婚礼、焚烧首相塔、安插间谍）同时
          铁群岛的选王会从造势到投票的全过程
        sequence_climax: >
          攸伦以龙之号角赢得浮木王冠（第250章）——
          一个危险的疯子获得了铁舰队的指挥权
        closed: 铁群岛王位之争结束，攸伦称王
        opened: >
          攸伦将把铁民带向何方？
          他的"龙"野心将如何影响大局？
        chapters: "241-250"
        primary_threads: [瑟曦线, 铁群岛线, 珊莎线, 布蕾妮线, 多恩线]

    arc_progression_note: >
      ARC-1 的两个序列构成"建置→确认"的节奏：
      SEQ1 展示权力真空，SEQ2 展示真空被错误的人填充。
      瑟曦和攸伦分别在两个地理空间完成了对权力的攫取，
      为ARC-2的灾难性后果埋下种子。

  # ════════════════════════════════════
  # ARC-2: 盛宴之巅（第251-263章）
  # ════════════════════════════════════
  - arc_id: ARC-2
    sequences:
      - seq_id: ARC2-SEQ1
        name: "行动与挫败——各线的第一次碰壁"
        core_conflict: >
          多条线同时推进但都遭遇阻力：
          亚莲恩的加冕计划被截、布蕾妮的线索断裂、
          艾莉亚的身份训练、珊莎的政治生存
        escalation_direction: >
          从各方主动出击到被现实打脸——
          亚莲恩最激进（秘密加冕弥赛菈），也最先失败
        sequence_climax: >
          亚莲恩的加冕计划在绿血河边被何塔拦截，
          奥克赫特战死（第252章）——
          多恩线的"年轻一代冲动"与"老一代隐忍"的对比确立
        closed: 多恩的公开反叛路线被封死
        opened: 道朗的真正计划是什么？（直到第271章才揭晓）
        chapters: "251-257"
        primary_threads: [布蕾妮线, 多恩线, 艾莉亚线, 珊莎线, 山姆线]

      - seq_id: ARC2-SEQ2
        name: "致命的交易——瑟曦的自毁按钮"
        core_conflict: >
          瑟曦认为自己需要更多权力工具来对抗提利尔，
          而现有的工具（情报网、御林铁卫）都不够可靠
        escalation_direction: >
          从派詹姆去奔流城（第255章，去除身边最后的制衡）
          到与大麻雀谈判（第259章，获得教会武装）
          到铁民攻陷盾牌列岛（第260/263章，借危机清除洛拉斯）
        sequence_climax: >
          瑟曦同意重建教会武装"战士之子"和"穷人集会"（第259章）——
          全书的无归点。她以为自己在利用教会，
          实际上是把一把利剑交到了无法控制的人手中。
        closed: 瑟曦获得了她认为的"完美武器"
        opened: 这把武器什么时候转向她自己？
        chapters: "255-263"
        primary_threads: [瑟曦线, 詹姆线, 铁群岛线]

    arc_progression_note: >
      ARC-2 的核心张力在于"看似成功实则灾难"：
      瑟曦在SEQ2中完成的每项操作（清除詹姆、武装教会、借机除洛拉斯）
      表面上都在增强她的权力，实际上每一步都在拆除安全网。
      与SEQ1中亚莲恩的"明面失败"形成对比：
      明面失败可以被父亲收拾，暗面成功却无人能救。

  # ════════════════════════════════════
  # ARC-3: 筵席崩塌（第264-276章）
  # ════════════════════════════════════
  - arc_id: ARC-3
    sequences:
      - seq_id: ARC3-SEQ1
        name: "绞索收紧——詹姆的独立与瑟曦的布局"
        core_conflict: >
          詹姆在奔流城完成军事任务的同时完成内心蜕变；
          瑟曦在君临编织陷害玛格丽的大网
        escalation_direction: >
          詹姆：从逼降奔流城（第269章）到在雪中独处
          瑟曦：从掌握月茶证据（第267章）到全面布局伪证（第270章）
          布蕾妮：从十字路口血战（第268章）到被俘
        sequence_climax: >
          詹姆以"投石机"威胁逼艾德慕献城（第269章）——
          他用泰温式的手段赢得了胜利，
          但随即意识到这不是他想成为的人
        closed: 奔流城投降，詹姆的军事任务完成
        opened: 詹姆已经不再需要瑟曦，但她还不知道
        chapters: "264-270"
        primary_threads: [詹姆线, 瑟曦线, 布蕾妮线, 艾莉亚线, 山姆线]

      - seq_id: ARC3-SEQ2
        name: "真相揭露——所有面具同时脱落"
        core_conflict: >
          多条线的真相同时揭露：
          道朗的真实计划、小指头的终极棋局、
          瑟曦阴谋的反噬、石心夫人的身份
        escalation_direction: >
          从道朗的"血与火"（第271章）到珊莎的婚约（第272章），
          再到布蕾妮遇石心夫人（第273章）——层层加码的惊天转折
        sequence_climax: >
          三重高潮连击：
          1. 瑟曦被捕（第274章）——全书主脊椎的崩塌
          2. 詹姆烧信（第275章）——情感脊椎的断裂
          3. 山姆到达学城，马尔温赴奴隶湾（第276章）——新世界的开启
        closed: >
          瑟曦的权力游戏结束（至少在本卷中），
          詹姆与瑟曦的关系不可逆地断裂
        opened: >
          所有线以悬念结尾——审判、东征、布蕾妮的选择、
          学城的暗流……全部指向下一卷
        chapters: "271-276"
        primary_threads: [多恩线, 珊莎线, 布蕾妮线, 瑟曦线, 詹姆线, 山姆线]

    arc_progression_note: >
      ARC-3 是全书的收束Arc，其独特之处在于：
      1. 多条线的高潮几乎同时爆发，形成"多米诺效应"的阅读体验
      2. 最震撼的时刻都是"安静"的——烧信、一个喊出的词、一枚棋子
      3. 没有解决，只有转折——每个结局都是新的开始

# ══════════════════════════════════════
# 因果链
# ══════════════════════════════════════

causal_chain: >
  泰温之死 →（权力真空）
  → 瑟曦独揽大权、排斥凯冯和詹姆 →（孤立无援）
  → 需要新工具对抗提利尔 →（武装教会）
  → 大麻雀获得合法暴力 →（陷害玛格丽需要教会配合）
  → 奥斯尼在教会酷刑下翻供 →（瑟曦被捕）
  → 瑟曦求救詹姆 →（但詹姆已在奔流城完成蜕变）
  → 詹姆烧信 →（决裂不可逆）

# ══════════════════════════════════════
# Arc 间递进关系
# ══════════════════════════════════════

arc_progression:
  impact_escalation: >
    ARC-1 高潮（攸伦称王）：地方性的权力更迭，冲击力局限于铁群岛
    ARC-2 高潮（教会武装重建）：制度性的权力转移，冲击力波及整个王国
    ARC-3 高潮（瑟曦被捕+詹姆烧信）：个人命运的崩塌+情感纽带的断裂，
    冲击力直抵读者内心——从政治层面升级到存在层面
  causal_chain: >
    ARC-1（各方就位）→ 瑟曦掌权但根基脆弱
    → ARC-2（瑟曦为巩固权力做出致命交易）
    → ARC-3（交易的后果降临，所有虚假的秩序同时瓦解）

# ══════════════════════════════════════
# 多线叙事
# ══════════════════════════════════════

narrative_threads:
  - name: "权力线（瑟曦）"
    description: >
      全书主线。瑟曦从夺权到入狱的完整弧线，
      是主控思想的主要载体。
    primary_arcs: [ARC-1, ARC-2, ARC-3]

  - name: "救赎线（詹姆）"
    description: >
      詹姆从瑟曦的附属品成长为独立个体，
      是主控思想的正面变奏——放弃权力纽带获得自由。
    primary_arcs: [ARC-1, ARC-3]

  - name: "誓言线（布蕾妮）"
    description: >
      布蕾妮寻找珊莎的旅途，是"荣誉在无序世界中的价值"的具象化。
      她的路线横跨战后废墟，见证底层苦难。
    primary_arcs: [ARC-1, ARC-2, ARC-3]

  - name: "身份线（艾莉亚+珊莎）"
    description: >
      两个史塔克女孩在不同地点面对相同主题：
      身份的丧失与重建。艾莉亚主动放弃，珊莎被迫伪装。
    primary_arcs: [ARC-1, ARC-2, ARC-3]
    presence: 间歇——穿插于主线之间

  - name: "扩张线（铁群岛）"
    description: >
      从王位争夺到跨大陆远征，是全书地理格局最大的线。
      攸伦代表一种与瑟曦不同但同样危险的权力欲。
    primary_arcs: [ARC-1, ARC-2]

  - name: "复仇暗线（多恩+石心夫人）"
    description: >
      两种复仇模式的对比：道朗的长期棋局 vs 石心夫人的无差别绞杀。
      贯穿全书但只在关键节点浮现。
    primary_arcs: [ARC-1, ARC-3]
    presence: 间歇——序幕+中段+结尾

  - name: "知识线（山姆+学城）"
    description: >
      从长城到旧镇的旅途，串联了龙、异鬼、预言等宏观信息。
      序幕的贾昆渗透与末章的马尔温出发首尾呼应。
    primary_arcs: [ARC-1, ARC-2, ARC-3]
    presence: 间歇——提供呼吸节奏
