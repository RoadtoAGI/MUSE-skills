# Phase 3: 脊椎 + Arc 框架 — 《冰与火之歌Ⅳ-群鸦的盛宴》
# 逆向分析：从结局回溯激励事件、脊椎与故事高潮
#
# 注：本书为多POV散点叙事，没有单一主角。
# 以瑟曦线为主脊椎（章节最多、结构最完整），
# 其他POV线作为平行脊椎/主题变奏处理。

# ══════════════════════════════════════
# 主脊椎：瑟曦·兰尼斯特
# ══════════════════════════════════════

inciting_incident:
  description: >
    泰温·兰尼斯特被提利昂用弩弓射杀于厕所（前作结尾，本作起点）。
    泰温之死在本作第234章瑟曦首个POV中作为既定事实呈现。
  type: accident  # 对瑟曦而言是外部事件
  timing: 前作结尾 / 本作第234章确认
  balance_before: >
    泰温以铁腕维持七国秩序——他是真正的统治者，
    瑟曦虽为太后但被边缘化，詹姆听命，凯冯辅佐。
  balance_after: >
    权力真空骤然出现——摄政权、首相位、情报网全部空悬。
    瑟曦第一次有机会独揽大权，也第一次暴露在没有保护的权力场中。
  impact_on_protagonist: >
    瑟曦从"被父亲压制的女儿"变为"自认为是父亲继承者的摄政太后"。
    她的自我认知发生根本转变：我终于可以证明我比泰温更强。

desire_object:
  conscious: >
    绝对的权力——瑟曦要独揽朝政，消灭所有威胁（提利尔家族、
    弟弟提利昂、任何可能取代她的人），将托曼塑造成自己的傀儡。
  unconscious: >
    被认可——她真正需要的是证明自己配得上父亲的地位，
    证明女人可以像男人一样（甚至更好地）统治。
    但她对权力的理解仅限于恐惧和操控，与泰温的战略眼光相去甚远。
  tension: >
    她越是追求绝对控制，就越暴露出自己的无能——
    她的每个"聪明"决策（安插无能亲信、重建教会武装、陷害玛格丽）
    都在削弱自己的根基。追求权力的方式恰恰证明她不配拥有权力。

spine_statement: >
  瑟曦在泰温死后抓住权力，以越来越极端的手段排除异己，
  最终被自己一手创造的武器（教会武装）吞噬。
spine_type: conscious  # 她非常清楚自己想要权力

dramatic_question:
  question: >
    瑟曦能否成功巩固权力，成为她自认为有资格成为的铁腕统治者？
  obligatory_scene: >
    瑟曦必须面对自己谋略的最终后果——
    第274章她被自己重建的教会武装逮捕入狱，
    被迫认识到（或拒绝认识到）自己不是泰温。

opposing_forces:
  internal: >
    巫魔女的童年预言——"一个更年轻、更美丽的王后"将取代她。
    这个预言驱动了她对玛格丽的病态敌意和所有过度反应。
    加上酗酒和偏执，导致判断力持续下降。
  personal: >
    提利尔家族（玛格丽、奥莲娜）——通过联姻渗透王室；
    凯冯·兰尼斯特——拒绝合作并暗示知晓乱伦秘密；
    詹姆——拒绝做她的工具，最终烧掉她的求救信。
  external: >
    大麻雀与信仰运动——战后民众愤怒的化身，
    瑟曦以为可以利用的工具，实际上是独立的政治力量；
    铁民入侵——削弱提利尔的军事存在，
    使瑟曦误以为自己可以不依赖盟友；
    提利昂在逃——瑟曦的偏执幻想，但也是真实的外部威胁。

# ══════════════════════════════════════
# 平行脊椎（主题变奏）
# ══════════════════════════════════════

parallel_spines:
  - character: 詹姆·兰尼斯特
    spine: >
      詹姆在离开君临执行军事任务的过程中，
      逐步从瑟曦的附属品成长为独立的道德个体。
    inciting_incident: 拒绝瑟曦出任首相的请求（第239章）
    climax: 烧掉瑟曦的求救信（第275章）
    value_change: 依附 → 独立 / 道德模糊 → 道德清醒

  - character: 布蕾妮
    spine: >
      布蕾妮遵守寻找珊莎的誓言，在一路追踪中不断面对
      "誓言在无序世界中还有意义吗"的考验。
    inciting_incident: 离开君临开始寻找（前作/第235章延续）
    climax: 石心夫人逼她在杀詹姆和死之间选择（第273章）
    value_change: 信念坚定 → 信念面临终极考验（开放式悬念）

  - character: 艾莉亚·史塔克
    spine: >
      艾莉亚进入黑白之院学习"成为无人"，
      但始终无法放弃"艾莉亚·史塔克"的身份。
    inciting_incident: 进入黑白之院（第237章）
    climax: 杀死逃兵戴利恩后被夺去视力（第265章）
    value_change: 有身份的复仇者 → 失去视力的无名学徒

  - character: 珊莎·史塔克/阿莲
    spine: >
      珊莎以伪装身份在小指头身边学习权力的游戏，
      从被操控的棋子逐渐获得自主意识。
    inciting_incident: 以阿莲身份在谷地生活（第241章）
    climax: 小指头揭示婚约计划（第272章）
    value_change: 被动棋子 → 开始理解棋局（但仍在小指头掌控中）

  - character: 铁群岛（攸伦/维克塔利昂/阿莎）
    spine: >
      铁群岛通过选王会选出新王，
      攸伦的野心将铁民推向前所未有的征途。
    inciting_incident: 巴隆·葛雷乔伊坠桥身亡（第232章）
    climax: 维克塔利昂受命东征奴隶湾但暗生叛心（第260章）
    value_change: 地方割据 → 跨大陆扩张（从盗匪到帝国野心）

  - character: 多恩（道朗/亚莲恩）
    spine: >
      表面隐忍的道朗亲王其实在执行长达十年的复仇棋局，
      女儿亚莲恩的莽撞行动只是棋局中的一个小插曲。
    inciting_incident: 奥柏伦之死（前作）
    climax: 道朗向亚莲恩揭示"血与火"（第271章）
    value_change: 隐忍 → 隐忍的真相是更深的谋划

# ══════════════════════════════════════
# 幕/Arc 框架
# ══════════════════════════════════════

arcs:
  - arc_id: ARC-1
    name: "群鸦降临——权力真空中的抢夺"
    value_at_start: "脆弱的战后秩序（泰温维持的最后平衡）"
    value_at_end: "各方势力完成初步站位，虚假的新秩序形成"
    climax_event: >
      攸伦以龙之号角在选王会上当选铁群岛国王（第250章），
      同时瑟曦在君临完成权力巩固——两个不配统治的人同时登顶。
    function_note: >
      建置性Arc——所有棋子就位：瑟曦掌权、攸伦称王、
      布蕾妮和艾莉亚踏上各自的旅途。
      多条线独立铺设，为后续的交汇与碰撞做准备。
    chapters: "231-250"

  - arc_id: ARC-2
    name: "盛宴之巅——权力膨胀与致命错误"
    value_at_start: "瑟曦自信掌控一切，各线推进"
    value_at_end: "所有POV线的潜在危机已经形成，但尚未爆发"
    climax_event: >
      瑟曦同意重建教会武装"战士之子"和"穷人集会"（第259章）——
      这是全书的无归点（point of no return），
      她亲手创造了最终将她吞噬的力量。
    function_note: >
      升级性Arc——瑟曦的自信达到顶峰，
      同时她的每个决策都在挖掘自己的坟墓。
      布蕾妮、詹姆、艾莉亚各自深入困境。
      维克塔利昂攻陷盾牌列岛后受命东征。
    chapters: "251-263"

  - arc_id: ARC-3
    name: "筵席崩塌——后果降临"
    value_at_start: "表面的控制，暗流涌动"
    value_at_end: >
      瑟曦入狱、詹姆决裂、布蕾妮面对不可能的选择——
      所有虚假的秩序同时瓦解
    climax_event: >
      双高潮：
      1. 瑟曦被自己重建的教会武装逮捕（第274章）
      2. 詹姆烧掉瑟曦的求救信（第275章）
      两者构成反讽对位——一个被权力吞噬，一个通过放弃权力纽带获得自由。
    function_note: >
      高潮性Arc——所有前两个Arc埋下的种子同时爆发。
      这个Arc的独特之处在于"安静的高潮"：
      全书最震撼的时刻不是战斗，而是一封被烧掉的信和一声被绞住的呐喊。
    chapters: "264-276"

# ══════════════════════════════════════
# 故事高潮设计
# ══════════════════════════════════════

story_climax_design:
  crisis:
    dilemma: >
      （瑟曦线）瑟曦在第274章面对的并非选择——而是自食恶果。
      但全书真正的危机（crisis）在布蕾妮身上：
      石心夫人逼她在"用守誓剑杀詹姆"和"被绞死"之间选择。
      这是全书最纯粹的两难困境。
    option_a: 杀死詹姆——背叛自己对詹姆的誓言和情感
    option_b: 拒绝并死——守住誓言但放弃所有她能保护的人
    character_revelation: >
      布蕾妮最终喊出一个词（暗示是"剑"，即接受任务），
      揭示她选择活着——不是为了背叛誓言，
      而是为了寻找一条在不可能中保全所有誓言的路。
      这个选择同时揭示了她的核心：不是教条式的荣誉，而是永不放弃。

  climax:
    action: >
      瑟曦被捕（第274章）+ 詹姆烧信（第275章）。
      这两个事件构成全书的对位高潮：
      瑟曦的权力大厦轰然倒塌——她布下的陷阱（奥斯尼）在酷刑下翻供指控她自己；
      詹姆收到求救信后沉默良久，然后命人烧掉。
    value_change:
      from: "权力幻觉——瑟曦自以为是最聪明的操纵者"
      to: "权力崩塌——她是自己阴谋的最终受害者"
    controlling_idea_expression: >
      瑟曦重建教会武装→利用教会拘押玛格丽→奥斯尼翻供→自己被捕。
      因果链完美闭合：她的每一步"精明"操作都在收紧绞索。
      詹姆的烧信则从另一个角度确认主控思想：
      放弃权力纽带的人获得了道德自由。

  resolution:
    new_balance: >
      没有新平衡——这是系列小说，所有线以悬念结尾：
      瑟曦等待审判，詹姆去向不明，布蕾妮被迫执行任务，
      艾莉亚失明，珊莎面临新棋局，维克塔利昂东征中。
      唯一接近"解决"的是山姆安全到达学城。
    lingering_feeling: >
      "盛宴结束了，但寒冬才刚开始。"
      读者被留在多重悬念中，但最强烈的余味来自两个画面：
      1. 詹姆看着雪花落在信纸上，然后说"把它烧了吧"——安静、决绝、不可逆。
      2. 布蕾妮在绞绳收紧时喊出的那个词——读者不知道那是什么，但知道命运已变。
