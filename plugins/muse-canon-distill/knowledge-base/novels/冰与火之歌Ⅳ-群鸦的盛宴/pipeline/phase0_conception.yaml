# Phase 0: 构想 — 《冰与火之歌Ⅳ-群鸦的盛宴》
# 逆向分析：从结局回溯前提与主控思想

premise: >
  如果一个铁腕统治者突然死去，在战后废墟中争夺权力的继承者们——
  每个人都深信自己最有资格统治——将会怎样自我毁灭？

core_value:
  positive: 明智的治理（自知之明、自我克制、真正的力量）
  negative: 暴政与混乱（无能的统治、肆意的残酷）
  spectrum:
    contradictory: 权力的幻觉——自以为掌控一切，实则已被架空（瑟曦的核心状态）
    contrary: 对权力的放弃或漠然——选择誓言而非权位（布蕾妮、山姆）
    negation_of_negation: >
      以治理之名行自毁之实——最"精明"的谋略恰恰成为自我囚禁的工具。
      瑟曦重建教会武装是为了扳倒提利尔，结果这把武器反过来吞噬了她自己。

controlling_idea:
  value: 权力摧毁那些不理解它本质的人
  cause: >
    因为真正的治理需要自知之明与对他人的理解，
    而仅凭猜忌与操控攫取的权力，终将以自身的逻辑反噬其主人
  full_statement: >
    当权力落入那些只渴望权力而不理解权力本质的人手中时，
    他们的每一步谋算都在构筑自己的牢狱——
    而那些放弃权力追求的人，反而获得了道德上的自由。
  type: ironic
  # 反讽型：瑟曦是负面主控思想的载体（权力→自毁），
  # 而詹姆的烧信则是正面变奏（放弃权力纽带→获得道德清醒）。
  # 两条线在第274-275章对位，构成全书的反讽双螺旋。

genre:
  primary: 史诗奇幻（Epic Fantasy）
  secondary: 政治权谋（Political Thriller）
  conventions:
    - setting: >
        中世纪封建社会，多个王国/领地并立，
        魔法元素低调存在但正在回归（龙、玻璃蜡烛、复活术）
    - characters: >
        没有传统英雄——每个POV角色都有道德灰区；
        权力中心人物（瑟曦）同时是最不可靠的叙述者
    - events: >
        政治阴谋、战争余波、权力更迭、身份伪装；
        暴力后果被完整展现而非美化
    - values: >
        荣誉 vs 生存、权力 vs 正义、身份 vs 自由、
        誓言的束缚与解放

originality_statement:
  unique_angle: >
    系列中最反传统的一卷：没有统一主角，没有战争高潮，
    而是通过10个散点POV展现战后的权力真空——
    标题"群鸦的盛宴"本身就是对这一结构的隐喻：
    不是一只鹰的翱翔，而是一群乌鸦在尸体上争食。
    最大的创新在于将最多篇幅（10章）给了反派视角（瑟曦），
    让读者从内部目睹一个自以为是的统治者如何一步步走向毁灭，
    形成持续全书的戏剧反讽。
  cliches_to_avoid:
    - 权力争夺者最终获胜的"爽文"模式——本书中没有赢家
    - 单一英雄拯救世界——布蕾妮的骑士精神在现实面前屡屡碰壁
    - 聪明人总能看穿阴谋——瑟曦自认为最聪明却是最蠢的
    - 复仇带来满足——多恩的复仇计划层层嵌套却至本卷结束仍无结果

style_directives:
  - 多POV交替叙事，每章以角色名（或别名）为标题
  - 不可靠叙述者（尤其瑟曦POV：她的自我认知与客观现实存在系统性偏差）
  - 主题回声式结构（不同POV在不同地点面对相同主题的变奏）
  - 大量内心独白，角色的思维模式即性格标识
  - 战争后果的写实描写（梅里巴德修士的逃兵演说是典范）
  - 悬念式章末——几乎所有POV线以未解决的悬念结尾

word_count: 550000
