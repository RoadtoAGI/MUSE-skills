# 关系网
# ══════════════════════════════════════

relationships:
  power_dynamics:
    - pair: [瑟曦, 大麻雀]
      dynamic: >
        瑟曦以为自己在施恩（免债、授权），大麻雀以为自己在伸张正义。
        真正的权力关系在第274章反转——
        拥有合法暴力的教会不需要太后的施恩。
    - pair: [小指头, 珊莎]
      dynamic: >
        完全不对称——小指头掌控信息、资源和计划，
        珊莎是执行者也是棋子。
        但第272章暗示珊莎开始理解棋局——潜在的权力转移。
    - pair: [瑟曦, 詹姆]
      dynamic: >
        从相互依赖到单方面依赖——
        瑟曦需要詹姆（作为武器和救命稻草），
        詹姆不再需要瑟曦（他在奔流城找到了独立的道德立场）。
        权力关系在第275章彻底倾覆。
    - pair: [攸伦, 维克塔利昂]
      dynamic: >
        君臣关系掩盖下的兄弟敌意——
        维克塔利昂表面服从但内心计划夺取龙女为己有。
        与瑟曦-詹姆关系的镜像：两对兄弟/姐弟关系同时走向断裂。
    - pair: [道朗, 亚莲恩]
      dynamic: >
        父亲的策略vs女儿的冲动——
        道朗始终掌控全局（即使亚莲恩叛逆也在他预计范围内），
        第271章的揭示重建了父女之间的信任。

  key_tensions:
    - 瑟曦vs提利尔家族：婆媳/政治联盟的权力争夺，贯穿全书瑟曦线
    - 布蕾妮的誓言vs现实：誓言在无序世界中不断被碾压，直到石心夫人的终极考验
    - 艾莉亚的"无人"训练vs史塔克身份：缝衣针是她无法放弃的最后锚点
    - 山姆的誓言vs人性需求：与吉莉的关系打破了守夜人的禁欲戒律
    - 詹姆对瑟曦的依恋vs对荣誉的渴望：全书追踪这条张力线直到烧信

  potential_shifts:
    - >
      珊莎从棋子到棋手——第272章小指头的婚约计划可能是她开始主动布局的起点。
      如果她理解了小指头的方法，她可能成为比小指头更危险的玩家。
    - >
      维克塔利昂的叛心——他计划夺龙女为己有，
      这将在下一卷引发铁群岛内部的二次分裂。
    - >
      布蕾妮接受"任务"后——她将把詹姆带到石心夫人面前，
      这意味着詹姆和布蕾妮两条线将在下一卷交汇，
      而他们各自的道德选择将面临终极考验。
    - >
      学城的暗流——序幕中贾昆潜入+末章山姆到达，
      两条线将在学城交汇，加上马尔温出发、玻璃蜡烛燃起，
      暗示学城将成为下一阶段的关键战场。
