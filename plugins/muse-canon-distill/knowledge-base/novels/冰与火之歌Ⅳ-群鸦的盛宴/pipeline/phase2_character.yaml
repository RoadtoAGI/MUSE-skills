# 对比轴
# ══════════════════════════════════════

contrast_axes:
  - axis: "权力的使用"
    characters: [瑟曦, 道朗, 小指头, 攸伦]
    description: >
      四种权力模式的对比——
      瑟曦：直接、粗暴、自以为精明（操控→自毁）
      道朗：隐忍、长期、真正的战略家（隐忍→尚未揭晓）
      小指头：间接、利用他人、永不亲自出手（操控→持续获利）
      攸伦：暴力+神秘主义、不按规则出牌（震慑→扩张）

  - axis: "面对身份危机的策略"
    characters: [艾莉亚, 珊莎, 詹姆, 瑟曦]
    description: >
      艾莉亚：主动放弃身份（"成为无人"）→ 但本能抵抗（藏缝衣针）
      珊莎：被迫伪装身份（"成为阿莲"）→ 在伪装中学会生存
      詹姆：试图重新定义身份（从"弑君者"到"真正的骑士"）→ 通过行动而非言语
      瑟曦：坚持虚假的自我认知（"我是女版泰温"）→ 拒绝面对真相

  - axis: "誓言/责任的态度"
    characters: [布蕾妮, 詹姆, 山姆威尔, 奥克赫特]
    description: >
      布蕾妮：誓言高于一切包括生命——终极坚守者
      詹姆：曾经违背誓言（弑君），现在通过新的行动重建荣誉
      山姆：打破守夜人誓言（与吉莉发生关系），在自我谴责中前行
      奥克赫特：为情欲背叛御林铁卫誓言——誓言的脆弱性

  - axis: "男性权威世界中的女性策略"
    characters: [瑟曦, 阿莎, 布蕾妮, 珊莎]
    description: >
      瑟曦：模仿男性权力模式（"如果我是男人"）→ 越学越走形
      阿莎：在铁群岛男权社会中以实力说话→ 被性别偏见击败
      布蕾妮：穿上盔甲成为骑士→ 到处被嘲笑但绝不退让
      珊莎：利用"柔弱女性"的外壳保护真实自我→ 最狡猾的生存策略

  - axis: "父亲的遗产"
    characters: [瑟曦, 詹姆, 山姆, 亚莲恩]
    description: >
      瑟曦：渴望成为泰温但不具备泰温的能力→ 父亲的遗产是诅咒
      詹姆：试图摆脱泰温的阴影→ 吉娜姑妈说"提利昂才是泰温真正的儿子"
      山姆：逃离蓝道·塔利的暴力期望→ 以自己的方式（学识而非武力）成长
      亚莲恩：误解父亲的沉默为软弱→ "血与火"揭示父亲比她想象的强大

