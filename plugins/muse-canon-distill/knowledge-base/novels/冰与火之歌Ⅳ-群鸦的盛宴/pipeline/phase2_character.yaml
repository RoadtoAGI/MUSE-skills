# Phase 2: 角色系统设计图 — 《冰与火之歌Ⅳ-群鸦的盛宴》
# 只记角色之间的关系、功能分配、对比轴
# 不含：声音细节、对白原文、个体弧光叙述（→ characters/*.md）

cast_overview:
  protagonist: >
    无单一主角。六个主要POV角色构成散点叙事群像：
    瑟曦（权力线主角，10章）、詹姆（救赎线主角，7章）、
    布蕾妮（誓言线主角，8章）、山姆威尔（知识线主角，5章）、
    艾莉亚（身份线主角A，3章）、珊莎/阿莲（身份线主角B，3章）。
    瑟曦是事实上的"第一主角"——章节最多、因果链最完整、
    其高潮（被捕）是全书主脊椎的终结点。
  antagonist: >
    无单一对手。对抗力量按层级分布：
    - 结构性对手：大麻雀（信仰运动的化身，最终吞噬瑟曦）
    - 操控型对手：培提尔·贝里席/小指头（珊莎线，始终在幕后）
    - 扩张型对手：攸伦·葛雷乔伊/鸦眼（铁群岛线，代表外部威胁）
    - 复仇型对手：石心夫人/凯特琳复活体（布蕾妮线，全书最大转折）
    - 自我对手：瑟曦自己（她是自己最大的敌人——偏执、傲慢、判断力低下）
  supporting_cast:
    - name: 凯冯·兰尼斯特
      function: >
        镜像角色——泰温合格的继承人（与瑟曦对比）。
        他的拒绝合作确立了瑟曦必须独自面对的困境。
    - name: 维克塔利昂·葛雷乔伊
      function: >
        铁群岛线执行者——攸伦的暴力工具，但有自己的欲望。
        与詹姆形成跨线对比：同为"弟弟"被兄长驱使，
        但维克塔利昂选择暗中叛逆而非公开决裂。
    - name: 阿莎·葛雷乔伊
      function: >
        性别政治的镜像——与瑟曦面对相同的性别壁垒，
        但采取截然不同的应对策略（务实vs偏执）。
    - name: 道朗·马泰尔亲王
      function: >
        耐心的棋手——与瑟曦的冲动形成极端对比。
        他的"血与火"揭示比所有人想象的更深远的布局。
    - name: 亚莲恩·马泰尔
      function: >
        冲动的年轻一代——其加冕弥赛菈的失败
        是"不理解大局就贸然行动"的负面案例。
        与瑟曦的类比：都以为自己在操控，都被更老练的棋手包围。
    - name: 梅里巴德修士
      function: >
        主题承载者——他的"逃兵演说"是全书战争主题的哲学总结。
        叙事功能上是布蕾妮线的精神导师。
    - name: 波德瑞克·派恩
      function: >
        忠诚的具象化——布蕾妮线的情感锚点。
        他被石心夫人绞吊的场景是逼迫布蕾妮做选择的催化剂。
    - name: 伊蒙学士
      function: >
        逝去秩序的象征——他的海上死亡标志着旧世界最后的智慧熄灭。
        同时是山姆线的情感核心和主题推进器（龙的预言、血脉秘密）。
    - name: 马尔温博士
      function: >
        新力量的使者——学城中唯一相信魔法正在回归的人。
        他决定亲赴奴隶湾是山姆线的终点和下一卷的起点。

