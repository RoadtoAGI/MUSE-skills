# Phase 5: 关键场景 — 《冰与火之歌Ⅳ-群鸦的盛宴》
# 逆向分析：提取结构转折点、高潮和关键建置场景
# 不逐章列举——只提取价值转变明确的关键场景节点

sequence_expansions:

  # ════════ ARC-1 ════════

  - seq_id: ARC1-SEQ1
    scenes:
      - scene_id: S01
        arc_id: ARC-1
        location: 旧镇，学城，"羽笔酒樽"酒馆
        time: 故事开始前夜
        participants: [佩特, 炼金术士/贾昆, 拉蕾萨, 莫兰德, 里奥]
        pov: 佩特
        conflict: 佩特在爱情（萝希）和忠诚（学城秘密）之间的挣扎
        value_start: 无知的安全（佩特的日常生活）
        value_end: 死亡——佩特被毒杀，贾昆取而代之
        must_include: >
          龙的讨论引出玻璃蜡烛燃烧的消息；
          炼金术士"黑铁换黄金"的交易；
          佩特的死亡与身份被盗
        handoff: 贾昆以佩特身份潜入学城——直到第276章山姆遇见"雀斑佩特"时呼应
        beat_direction: >
          从日常学徒生活的温暖（爱情、友谊、酒馆闲谈）
          逐步滑入不祥的暗流——
          最后一个节拍是无声的谋杀，优美而残忍
        source_chapter: 第231章

      - scene_id: S02
        arc_id: ARC-1
        location: 君临，红堡
        time: 泰温葬礼期间
        participants: [瑟曦, 凯冯, 詹姆]
        pov: 瑟曦 + 詹姆（跨章）
        conflict: 瑟曦试图重建兰尼斯特权力核心但遭到家族成员的拒绝
        value_start: 脆弱的家族团结（泰温的遗产）
        value_end: 家族彻底分裂——凯冯离开，詹姆拒绝
        must_include: >
          凯冯暗示知晓乱伦秘密的致命台词；
          詹姆拒绝首相之位并建议另外的人选；
          兄妹关系的裂痕首次公开
        handoff: 瑟曦被迫独自掌权，开始寻找家族外的工具
        source_chapter: 第238-239章

      - scene_id: S03
        arc_id: ARC-1
        location: 铁群岛，老威克岛，海王大殿
        time: 选王会
        participants: [攸伦, 维克塔利昂, 阿莎, 湿发伊伦, 各铁岛头领]
        pov: 淹人（伊伦）
        conflict: 三方候选人的演说对决——传统vs军事vs野心
        value_start: 铁群岛处于"等待领袖"的混乱状态
        value_end: 攸伦以龙之号角赢得王冠——最危险的选项获胜
        must_include: >
          阿莎的嘲讽（鹅卵石+芜菁=北境战果）；
          攸伦登场——龙之号角的戏剧性展示；
          伊伦的恐惧——"生锈铁门链的尖叫"
        handoff: 攸伦掌权后将命令铁舰队东征
        beat_direction: >
          从多声部的政治演说到攸伦的压倒性登场——
          节奏如潮水：先退（各候选人的平庸），后涌（攸伦的恐怖魅力）
        source_chapter: 第250章

  - seq_id: ARC1-SEQ2
    scenes:
      - scene_id: S04
        arc_id: ARC-1
        location: 谷地，鹰巢城
        time: 莱莎死后不久
        participants: [珊莎/阿莲, 培提尔/小指头, 奈斯特·罗伊斯]
        pov: 珊莎
        conflict: 珊莎必须在小指头的引导下撒谎保命
        value_start: 身份不安——珊莎在"阿莲"和"珊莎"之间摇摆
        value_end: 身份认同——"我是阿莲，父亲"
        must_include: >
          向奈斯特的谎言（马瑞里安推莱莎下月门）；
          小指头以月门堡收买奈斯特；
          珊莎主动以"阿莲"自称——身份伪装从被动变为主动
        handoff: 珊莎开始学习权力游戏的规则
        source_chapter: 第241章

  # ════════ ARC-2 ════════

  - seq_id: ARC2-SEQ1
    scenes:
      - scene_id: S05
        arc_id: ARC-2
        location: 多恩，绿血河畔
        time: 亚莲恩行动之夜
        participants: [亚莲恩, 弥赛菈, 阿利欧·何塔, 亚历斯·奥克赫特]
        pov: 拥女王者（奥克赫特视角回溯至亚莲恩视角）
        conflict: 年轻一代的冲动反叛 vs 老一代的战略耐心
        value_start: 反叛的希望（亚莲恩以为计划完美）
        value_end: 彻底失败——奥克赫特死，亚莲恩被捕，弥赛菈受伤
        must_include: >
          何塔的拦截——不是敌人，而是父亲的侍卫长；
          奥克赫特的战死——誓言的代价；
          亚莲恩意识到自己从未离开父亲的棋盘
        handoff: 亚莲恩被囚——直到第271章道朗揭示真相
        beat_direction: >
          从紧张的夜间逃亡到突然的暴力拦截——
          节奏模式是"加速-急停"，不是渐进式升级
        source_chapter: 第252章

      - scene_id: S06
        arc_id: ARC-2
        location: 三河流域，通往盐场镇的道路
        time: 旅途中
        participants: [布蕾妮, 梅里巴德修士, 波德瑞克, 海尔]
        pov: 布蕾妮
        conflict: 表面无冲突——但修士的演说是对全书"战争后果"主题的核心阐述
        value_start: 战争是荣耀和冒险（骑士的幻想）
        value_end: 战争是把好人变成怪物的机器
        must_include: >
          梅里巴德关于逃兵的长篇演说——
          "几乎每个领主手下的人都是那个男孩"；
          修士自述曾是逃兵的坦白
        handoff: 布蕾妮对自己寻找之旅的意义产生更深的理解
        beat_direction: >
          这是一个"反场景"——没有冲突递进，
          而是通过一段独白重新定义读者对整部小说中所有暴力的理解。
          节奏缓慢、沉重、不可打断。
        source_chapter: 第256章

      - scene_id: S07
        arc_id: ARC-2
        location: 布拉佛斯，黑白之院 + 街头
        time: 训练期间
        participants: [艾莉亚/猫儿, 慈祥的人]
        pov: 艾莉亚
        conflict: 艾莉亚在"成为无人"和"保留自我"之间的张力
        value_start: 有身份的学徒（秘藏缝衣针）
        value_end: 失去视力——"成为无人"的代价开始显现
        must_include: >
          艾莉亚藏起缝衣针的细节（身份的最后锚点）；
          杀死逃兵戴利恩——她的第一次"自主"杀人；
          慈祥的人的"奖赏"：失明
        handoff: 艾莉亚的训练进入更严苛的阶段
        source_chapter: 第253章 + 第265章

  - seq_id: ARC2-SEQ2
    scenes:
      - scene_id: S08
        arc_id: ARC-2
        location: 君临，贝勒大圣堂
        time: 瑟曦拜访大麻雀
        participants: [瑟曦, 大麻雀]
        pov: 瑟曦
        conflict: 瑟曦以为自己在谈判（免债换祝福），实际是在递刀
        value_start: 瑟曦自信掌控局势
        value_end: >
          教会武装重建——瑟曦以为获得了工具，
          实际上是给了大麻雀合法的暴力垄断
        must_include: >
          大麻雀的赤脚形象与瑟曦的华服对比；
          "免除教会债务"交易的表面对等；
          瑟曦内心独白中的轻蔑——她完全低估了对手
        handoff: 教会武装重建——直接导致第274章的逮捕
        beat_direction: >
          戏剧反讽场景——读者看得见瑟曦看不见的危险。
          每一个瑟曦"赢了"的节拍都在加深读者的恐惧。
        source_chapter: 第259章

      - scene_id: S09
        arc_id: ARC-2
        location: 盾牌列岛 → 铁群岛盛宴
        time: 攻陷后
        participants: [维克塔利昂, 攸伦]
        pov: 维克塔利昂（掠夺者）
        conflict: 维克塔利昂期待战功受封，却被攸伦派去东征
        value_start: 铁民的传统劫掠式征服
        value_end: 攸伦的跨大陆帝国野心——铁民被推向未知
        must_include: >
          攸伦将盾牌列岛封给他人而非维克塔利昂；
          命令"迎娶银发龙女"——这是命令而非请求；
          维克塔利昂的内心叛意——"我自己要那个女人"
        handoff: 铁舰队东征——直接衔接第五卷
        source_chapter: 第260章

  # ════════ ARC-3 ════════

  - seq_id: ARC3-SEQ1
    scenes:
      - scene_id: S10
        arc_id: ARC-3
        location: 寂静岛修道院
        time: 布蕾妮到达岛上
        participants: [布蕾妮, 长老, 梅里巴德修士]
        pov: 布蕾妮
        conflict: 布蕾妮得知猎狗已死，她追踪的目标一直搞错了
        value_start: 有明确目标的追踪者
        value_end: 目标消失——但誓言仍在
        must_include: >
          长老的叙述——他亲手埋葬了桑铎·克里冈；
          "猎狗死了"——但名字和头盔仍在被他人使用；
          布蕾妮拒绝放弃——她追踪的不是猎狗，是誓言本身
        handoff: 布蕾妮继续寻找，直到在十字路口客栈遭遇暴力
        source_chapter: 第262章

      - scene_id: S11
        arc_id: ARC-3
        location: 奔流城，吊桥 + 营地
        time: 围城末期
        participants: [詹姆, 艾德慕·徒利, 伊林·派恩]
        pov: 詹姆
        conflict: 詹姆必须不流血拿下奔流城——用泰温的方式还是自己的方式？
        value_start: 詹姆作为兰尼斯特的将领执行任务
        value_end: >
          任务完成但道德代价沉重——
          他用了泰温式的威胁（投石机射婴儿），赢了但不舒服
        must_include: >
          与黑鱼在吊桥上的谈判破裂；
          逼艾德慕的关键台词——"不信可以去问卡斯特梅的人"；
          《卡斯特梅的雨季》作为心理战武器
        handoff: 黑鱼游水逃脱，詹姆留在奔流城处理善后
        beat_direction: >
          全章的张力在于詹姆的内在分裂：
          他用泰温的残忍赢了，但意识到自己不想做泰温。
          最后的节拍是他在夜间与伊林练剑——
          用身体动作消化内心的矛盾。
        source_chapter: 第269章

      - scene_id: S12
        arc_id: ARC-3
        location: 十字路口客栈
        time: 夜间
        participants: [布蕾妮, 波德瑞克, 海尔, 詹德利, 歹徒]
        pov: 布蕾妮
        conflict: 布蕾妮独战七名歹徒保护客栈孤儿
        value_start: 疲惫但安全的暂歇
        value_end: 重伤昏迷——尖牙咬下她的脸
        must_include: >
          认出詹德利的拜拉席恩血统；
          戴猎狗头盔的罗尔杰——"猎狗"的名号已成为暴力的符号；
          布蕾妮在绝对劣势下的战斗意志
        handoff: 布蕾妮被闪电大王残部俘虏
        source_chapter: 第268章

  - seq_id: ARC3-SEQ2
    scenes:
      - scene_id: S13
        arc_id: ARC-3
        location: 多恩，长矛塔 → 道朗书房
        time: 亚莲恩被囚后
        participants: [亚莲恩, 道朗亲王]
        pov: 亚莲恩
        conflict: 女儿对父亲"软弱"的愤怒 vs 父亲隐藏的真相
        value_start: 亚莲恩鄙视父亲的隐忍
        value_end: "血与火"——道朗的隐忍是更深的谋划
        must_include: >
          道朗的龙棋子和低语："渴望——复仇——正义——血与火"；
          昆廷已秘密出海的揭示；
          亚莲恩的世界观被彻底重构
        handoff: 多恩线的所有伏笔收束为一个巨大的待揭悬念
        source_chapter: 第271章

      - scene_id: S14
        arc_id: ARC-3
        location: 三河流域，山洞
        time: 布蕾妮被俘后
        participants: [布蕾妮, 石心夫人/凯特琳, 索罗斯, 波德瑞克]
        pov: 布蕾妮
        conflict: 布蕾妮被逼在杀詹姆和被绞死之间选择
        value_start: 受伤但仍有尊严的囚犯
        value_end: 被绞绳勒住——喊出一个不可逆的词
        must_include: >
          石心夫人的揭露——腐烂的凯特琳面容是全书最恐怖的画面；
          守誓剑的讽刺——用兰尼斯特的钢铸的剑被要求杀兰尼斯特人；
          布蕾妮拒绝选择→绞绳收紧→她看到波德瑞克也被吊→
          最后喊出一个词（暗示"剑"）
        handoff: 布蕾妮接受了"任务"——下一卷她将带詹姆前来
        beat_direction: >
          恐怖-逼迫-拒绝-更大的逼迫（波德瑞克被绞）-屈服。
          最后的节拍是一个被截断的词——
          作者选择不告诉读者那个词是什么，这个"省略"比任何文字都有力。
        source_chapter: 第273章

      - scene_id: S15
        arc_id: ARC-3
        location: 君临，贝勒大圣堂
        time: 瑟曦去"安抚"被捕的玛格丽之后
        participants: [瑟曦, 大麻雀, 奥斯尼·凯特布莱克]
        pov: 瑟曦
        conflict: 瑟曦以为自己在收割胜利，实则正走入陷阱
        value_start: 权力的顶峰——玛格丽被捕，计划完美执行
        value_end: 权力的崩塌——奥斯尼翻供，瑟曦被捕
        must_include: >
          瑟曦在玛格丽面前的虚伪安慰；
          大麻雀揭示奥斯尼在酷刑下的供词——指控瑟曦谋杀和通奸；
          瑟曦被当场逮捕的震惊——她完全没预见到这种可能
        handoff: 瑟曦从牢中写信求救詹姆
        beat_direction: >
          全书最强的戏剧反讽场景——
          瑟曦的每个"赢"的节拍（我赢了，她输了，我太聪明了）
          在大麻雀开口的那一刻全部反转。
          节奏模式：升-升-升-断崖式跌落。
        source_chapter: 第274章

      - scene_id: S16
        arc_id: ARC-3
        location: 奔流城，卧室
        time: 初雪之晨
        participants: [詹姆, 韦曼学士, 小派]
        pov: 詹姆
        conflict: 詹姆收到瑟曦的求救信——回去还是不回去？
        value_start: 完成任务后的平静，还在思考未来
        value_end: 做出不可逆的选择——烧掉信，与瑟曦永别
        must_include: >
          雪夜梦中的灰衣女人（暗示母亲乔安娜）——
          "泰温梦想他儿子能成为伟大的骑士"；
          读信时的沉默——"科本的字句言简意赅，瑟曦的感情澎湃激昂"；
          "把它烧了吧"——全书最安静、最震撼的五个字
        handoff: 詹姆的命运彻底脱离瑟曦的轨道
        beat_direction: >
          梦→醒→雪→信→沉默→决定。
          六个节拍，最后一个只有五个字。
          这是用"最少的文字"表达"最大的转折"的典范——
          作者选择不写詹姆的任何内心独白，只写行动。
        source_chapter: 第275章

# ══════════════════════════════════════
# 张力曲线
# ══════════════════════════════════════

tension_curve:
  description: >
    全书张力曲线为"缓升-缓升-急升-连续爆发"型：
    前三分之二是多线并行的缓慢铺垫（ARC-1和ARC-2），
    读者通过瑟曦的戏剧反讽获得持续的紧张感但没有爆发点；
    最后三分之一（ARC-3）连续五个章节（271-275）
    密集投放多线高潮，形成"多米诺骨牌"效应。
    这种结构与传统的单峰高潮不同——
    它更像交响曲的终章：多个主题同时回归并叠加。
  peaks:
    - S03  # 选王会——铁群岛线高潮
    - S08  # 教会武装重建——全书无归点
    - S14  # 石心夫人——全书最大惊天转折
    - S15  # 瑟曦被捕——主脊椎高潮
    - S16  # 詹姆烧信——情感线高潮
  valleys:
    - S06  # 梅里巴德修士演说——张力最低但主题最深
    - S04  # 珊莎在谷地——相对平静的政治课

# ══════════════════════════════════════
# 因果链
# ══════════════════════════════════════

causal_chain: >
  S01（学城渗透铺垫）→ S02（兰尼斯特分裂，瑟曦孤立）
  →（因为瑟曦需要新盟友）→ S08（武装教会——致命交易）
  →（因为有了合法暴力工具）→ S15（利用教会逮捕玛格丽→反噬→自己被捕）
  →（因为瑟曦被捕写信求救）→ S16（詹姆烧信——不可逆的决裂）。
  同时，S03（攸伦称王）→ S09（东征令）铺设宏观格局；
  S05（亚莲恩失败）→ S13（道朗揭示真相）提供多恩线闭环；
  S06（修士演说）+ S10（寂静岛）→ S12（客栈血战）→ S14（石心夫人）
  构成布蕾妮线的因果递进。
