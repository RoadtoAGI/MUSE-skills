# Phase 1: 世界 — 《冰与火之歌Ⅳ-群鸦的盛宴》
# 逆向分析：从原文提取世界规则与叙事限制

setting:
  era: >
    中世纪封建社会末期——五王之战刚结束，
    大量军队解散、领地易主、社会秩序崩溃。
    相当于"百年战争"后英国的混乱局面。
  duration: >
    约数月（泰温葬礼到第一场雪），
    与第三卷后半部分平行推进（部分POV时间线重叠）
  location: >
    维斯特洛大陆多地散点分布：
    君临（瑟曦线）、三河流域（詹姆/布蕾妮线）、
    铁群岛（攸伦/维克塔利昂线）、多恩（亚莲恩线）、
    布拉佛斯（艾莉亚/山姆线）、谷地（珊莎线）、
    旧镇/学城（山姆线/序幕）。
    地理分散是本书叙事分散的物质基础。
  conflict_levels:
    internal: >
      身份危机——"我是谁？"贯穿多个POV：
      艾莉亚试图"成为无人"却无法放弃缝衣针；
      珊莎被迫成为"阿莲"却在身份中迷失；
      詹姆在"弑君者"与"真正的骑士"之间挣扎；
      瑟曦幻想自己是"女版泰温"实则走向疯王。
    personal: >
      家族裂痕——兰尼斯特家族在泰温死后彻底分裂：
      詹姆拒绝瑟曦、凯冯拒绝合作、提利昂已叛逃。
      佛雷家族内部兄弟夺嫡；
      葛雷乔伊家族三方争位。
    external: >
      多重权力真空——铁王座摄政权、铁群岛王位、
      三河流域控制权、北境统治权同时悬空。
      教会势力崛起填补精神/道德权威的空白。
      铁民入侵河湾地，威胁旧镇。

world_rules:
  physical:
    - 冬天正式降临——第275章第一场雪落在奔流城，粮食危机迫在眉睫
    - 魔法正在苏醒——玻璃蜡烛在学城燃起（序幕），龙的存在已非传说
    - 复活术存在但有代价——贝里·唐德利恩将生命力转移给凯特琳，创造了石心夫人
    - 野火仍存于君临地下——瑟曦用它焚烧首相塔，暗示更大隐患
  social:
    - 封建等级制——贵族的姓氏决定命运，私生子（如詹德利）被排斥
    - 骑士誓言体系——御林铁卫终身效忠，但本书反复展示誓言的脆弱（奥克赫特叛誓）
    - 教会与王权的张力——大麻雀代表底层民众对贵族的愤怒，武装信仰是一把双刃剑
    - 性别压制——瑟曦多次内心独白"如果我是男人"；布蕾妮到处受辱；阿莎在选王会上败给性别偏见
    - 铁群岛的选王会传统——"淹神之子"通过呼声选举国王，是维斯特洛唯一的"民主"
  psychological:
    - 恐惧驱动决策——瑟曦的所有决策都由对失去权力的恐惧驱动（童年巫魔女预言是根源）
    - 誓言的心理重量——布蕾妮宁死不背叛誓言，詹姆通过重新定义誓言来获得自由
    - 战争创伤无处不在——梅里巴德修士的逃兵演说揭示：每个老兵都是受害者
    - 身份表演——珊莎/阿莲、艾莉亚/猫儿/无人、贾昆/佩特——伪装身份是生存技能

genre_conventions:
  primary_genre: 史诗奇幻
  secondary_genre: 政治权谋
  conventions:
    - convention: 传统奇幻的善恶对立
      planned_subversion: >
        完全取消善恶二分——瑟曦从自己的视角是正当的摄政太后保护儿子，
        石心夫人从自己的视角是复仇的母亲，
        读者同情的詹姆曾经推小男孩下窗。
    - convention: 英雄旅程的单一主角
      planned_subversion: >
        10个POV散点叙事，没有"主角"。
        最多篇幅给了传统意义上的"反派"（瑟曦），
        且她的POV以失败告终。
    - convention: 战争场面作为高潮
      planned_subversion: >
        全书没有大型战役（盾牌列岛之战在POV之外发生）。
        最"战斗性"的场景是布蕾妮在客栈的肉搏，
        而全书的高潮是一封被烧掉的信。
    - convention: 魔法系统的炫目展示
      planned_subversion: >
        魔法始终处于边缘——玻璃蜡烛、石心夫人的复活、
        艾莉亚的失明——从不正面展示，而是通过暗示和后果呈现。
    - convention: 权力争夺者最终登上王座
      planned_subversion: >
        没有赢家——瑟曦入狱，攸伦称王但远征未知，
        小指头的棋局尚未收网，多恩的复仇计划仍在暗处。

daily_life:
  - dimension: 战后经济
    findings:
      - detail: 粮食短缺——冬天来临但谷仓半空，战争毁了最后一次收获
        story_implication: 底层民众的绝望是大麻雀崛起的经济基础
      - detail: 铁王座欠铁金库和教会巨额债务
        story_implication: 瑟曦用免债换取教会支持——短期收益，长期灾难
  - dimension: 信仰生活
    findings:
      - detail: 战争难民涌入君临，大麻雀带领穷人们组成信仰运动
        story_implication: 信仰不再是贵族的装饰，成为有组织的政治力量
      - detail: 沉默岛修道院收容战争中的破碎灵魂（包括疑似桑铎·克里冈）
        story_implication: 与暴力对立的"另一种生活"的可能性
  - dimension: 旅行与通讯
    findings:
      - detail: 道路不安全——土匪横行，布蕾妮一路遭遇各种危险
        story_implication: 中央权威崩溃后的地方失序是POV角色旅途的基本背景
      - detail: 渡鸦通信系统依赖学城，学城内部有渗透（贾昆）
        story_implication: 信息传递的不可靠性驱动了多处情节（瑟曦的信到达詹姆时已太晚）

creative_constraints:
  - constraint: 与第五卷的时间线拆分——本书只包含部分POV角色（丹妮莉丝、提利昂等在第五卷）
    narrative_function: >
      迫使本书聚焦于维斯特洛本土的政治内斗，
      而非跨大陆的史诗格局，反而强化了"群鸦争食"的主题
  - constraint: 多POV但各线极少交汇
    narrative_function: >
      强化"分裂的世界"主题——没有人知道全貌，
      包括读者也只能通过碎片拼凑。
      唯一的交汇点（山姆在布拉佛斯遇见猫儿/艾莉亚）反而因两人互不相识而令人心酸。
  - constraint: 瑟曦作为不可靠叙述者——她的判断几乎总是错的
    narrative_function: >
      读者获得"全知"的优越感（知道瑟曦在犯错），
      但这种优越感本身也是反讽——读者同样无法预见石心夫人等惊天转折。
