novel: 冰与火之歌Ⅳ-群鸦的盛宴
author: 乔治·R·R·马丁
lang: zh
translator: ''
narration_voice: 多POV限知轮替，叙述被视角人物偏见染色
diction: 译腔白话为底，混贵族礼语、粗骂和宗教军政词
rhetoric_density: medium
dialogue_mode: 对白承担权谋攻防，常以短句反击或沉默收口
pacing: 长段铺陈制度与景物，转折处骤然压缩成反噬
signature_moves:
- POV滤镜持续误读现实，让读者先看见人物盲点
- 权力谈判写成礼貌句式下的威胁与勒索
- 仪式、地理、家族名号先铺密，再以暴力或真相击穿
- 章末用死亡、拒信、被捕等低解释动作落锤
- 译文用中世纪器物名和现代粗口并置制造硬质感
anti_signature:
- 全知旁白替人物解释局势或提前判明对错
- 对白只寒暄抒情，不携带权力、身份或试探
- 把暴力写成英雄爽感，削弱代价和身体疼痛
author_cross_ref: 与《权力的游戏》同样限知多POV，本册更偏政治反噬、宗教审判和战后疲惫。
style_card_by: Codex (executor)
