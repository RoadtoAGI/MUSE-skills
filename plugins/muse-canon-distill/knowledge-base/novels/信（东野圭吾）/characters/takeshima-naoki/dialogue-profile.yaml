baseline_voice:
  observed_summary: '直贵的对白以**克制、短句、复述式回问**为底色。受到突然信息时常常把对方关键词原样反弹回去——"啤酒？"（被点酒时）/ "试一试？试什么？"（被朝美质问时）/ "管理层的最里面那间……"（平野自报家门时）/
    "三层……是吗？"——这一复述既是反应迟疑也是争取思考时间的本能。日常话语极少修饰，几乎不使用比喻 / 反讽 / 双关；称呼系统稳定——"哥哥"永远是"哥哥"，"由实子"永远是"由实子"，"社长"永远是"社长"。


    情绪到达临界点时他的语言**不会上升到激烈**，而是**反向收缩到陈述句的冷硬**——"盗窃杀人。"（向朝美承认哥哥罪名时，无任何修饰）/ "钱还给您，我不能接受"（拒绝中条父亲）/ "今天能不能就到这儿"（请客人离开餐厅时）。爆发性话语极少，整本书有限的几次都是对哥哥说的——"哥哥是傻瓜！干了那么傻的事！"（拘留所首次面会）。


    内心独白与对白构成强烈反差——他对自己永远比对别人锋利，常用自我厌恶的句式："我逃跑了，像逃兵一样" / "放弃，对于自己已经习惯了，今后一定还会继续，如此循环往复，这就是自己的人生" / "只是得到了本应得到的结果"。叙述者描写他的情绪时镜头常锁在**身体反应**而非心理活动——"嘴里干渴"
    / "牙齿咬紧" / "舔了一下嘴唇" / "深深地吸了口气" / "全身麻木到不能活动，只能勉强地呼吸"。


    唯一例外是**书信文体**——平日的口语短句被替换为完整的论证段落。断绝信中他第一次以完整的、锋利的、组织严密的语言能力说出自己的处境与决定——"被贴上标签的人，只能被动接受自己应得的人生" / "是因为让你了解我们的这些痛苦，也是你应该接受的惩罚。要是不知道这些事情，你的刑期是不会结束的"——这种语言能力在他平日的口语中从未出现。


    最终极的声音状态是**失语**——尾声面对忏悔颤抖的哥哥，他张嘴却"发不出声音来。怎么也发不出声音"。所有的语言策略最终归零。


    佐证：scenes/scene_S04.md:L43-L43 （"哥哥是傻瓜！干了那么傻的事！"——少有的爆发式语言，且只对哥哥）；scenes/scene_S13.md:L173-L173 （"盗窃杀人。"——向朝美承认哥哥罪名时的最冷硬陈述）；scenes/scene_S14.md:L147-L147
    （"只是得到了本应得到的结果"——内心独白的自我厌恶范式）；scenes/scene_S20.md:L85-L101 （断绝信的完整论证语言能力——平日口语从未出现）；scenes/scene_S22.md:L125-L129 （"直贵终于张开嘴，准备唱。可是，发不出声音来。怎么也发不出声音"——声音框架的终极归零）'
