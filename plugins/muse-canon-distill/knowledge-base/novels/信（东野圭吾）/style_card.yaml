novel: 信
author: 东野圭吾
lang: zh
translator: ''
narration_voice: 限知贴身跟随受压者，少直评，用反应显判断
diction: 译文口语平实，生活物件、机构流程和家庭称谓密集
rhetoric_density: low
dialogue_mode: 对白多为试探、拒绝和说明，话外压力重于机锋
pacing: 日常慢铺，关键拒绝或揭示处用短句收紧
signature_moves:
- 用一次社会性拒绝复制前一次创伤，形成同形剥夺
- 先铺具体生活细节，再让制度或舆论突然闯入
- 让善意人物也说出排斥逻辑，避免单纯反派化
- 把主题论辩放进职场、家庭、探视等现实场景
- 用信件或转述在末段翻开隐藏情感线
anti_signature:
- 不要用华丽比喻或大段抒情替代现实细节
- 不要把歧视写成单一恶人迫害
- 不要让人物一次性说透全部情绪
author_cross_ref: ''
style_card_by: Codex (executor)
