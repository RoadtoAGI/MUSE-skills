# Phase 0: 构想 — 《信》东野圭吾（2003）
# 从结局回溯：尾声直贵在监狱演出唱不出《想象》→ 反推主控思想与前提

premise: |
  如果一个人犯下杀人罪，他实际上夺走的不只是受害者的生命，
  也夺走了无辜亲属在社会中存在的位置——那么这位亲属该如何活下去？

core_value:
  positive: 社会接纳（归属、与他人建立联系的权利、在社会中存在的位置）
  negative: 标签化的排斥（歧视、被剥夺存在位置、社会性死亡）
  spectrum:
    contradictory: 直接歧视（明示拒绝、白眼相待、不予录用）
    contrary: 反向歧视（过度客气、不自然地小心翼翼地接触，使自身成为环境的负担）
    negation_of_negation: |
      以"堂堂正正接受身份"为名的逃避——
      表面"不再逃避"但实则把更大的痛苦转嫁给周围所有人，
      并要求他们承担与"杀人犯亲属"建立关系的心理代价。
      （这是社长平野第二次谈话中批评直贵夫妇的核心）

controlling_idea:
  value: |
    一个人若要在被标签化后重建社会位置，必须放弃"堂堂正正"的自我满足，
    选择更艰难的、独自承担所有秘密的、为保护新家人而牺牲血亲连接的道路；
    但这种"救赎"本身是有代价的，并不能消除内心的兄弟之爱与负罪感。
  cause: |
    因为社会对犯罪者亲属的歧视并非偏见而是自我保护本能，
    犯罪者的真正惩罚是让无辜亲人也承担社会性死亡——
    这一事实只有当受害者与加害者双方都承认它，才有可能"结束"。
  full_statement: |
    社会接纳通过"承认歧视必然存在并独自承担断绝血亲的代价"
    而（以残缺的、伴随哀伤的方式）实现——
    因为"堂堂正正面对世界"只是把负担转嫁给他人的自我满足，
    真正的赎罪是犯罪者意识到自己让亲人付出的代价，
    而亲人意识到割断关系是自己应得人生的一部分。
  type: ironic
  type_note: |
    既不是理想主义（直贵没能"战胜"歧视、不能与哥哥团圆），
    也不是悲观主义（直贵保住了妻女、找到了立足之地、与哥哥在最后一次精神交汇中达成了无言的理解）。
    结局是含泪的承认而非凯旋的胜利——典型的讽刺型主控思想。

genre:
  primary: 社会派写实小说
  secondary: 家族悲剧 / 教养小说（成长小说变体）
  conventions:
    setting: |
      当代日本城市底层与中产边缘（江东区、新座、葛西、田园调布对比）；
      废品回收公司、外国特色餐厅、酒吧、电器量贩店、公司宿舍——
      非英雄式日常职场空间。
    characters: |
      "受灾者"主角（直贵）+ 不在场的核心导火索（狱中的刚志）+
      关键启示者（社长平野）+ 救赎/同盟（白石由实子）+
      多个同形阻力者（同学江上、店长、寺尾乐队的根津、中条父女、町谷夫妇）。
    events: |
      同形剥夺事件的多次变奏：身份被察觉 → 周围气氛改变 → 主角被迫退出某个领域。
      最终累积到主角的主动断绝行动。
    values: |
      聚焦"被剥夺的存在位置"与"重建社会连接"的辩证——
      不解决犯罪本身的悬念，而探讨犯罪的次生伤害如何分摊。

originality_statement:
  unique_angle: |
    把"罪犯家属"作为主角，而非把罪犯本身作为反派或受害者作为悲剧主角；
    用"信"作为唯一的兄弟脐带与最终被切断的载体，让结构与道具合一；
    让"歧视"由小说中位置最高、最温和、最值得尊敬的角色（社长平野）说出"是必然的、是需要的"——
    彻底打破了"歧视是少数恶人的错"的安慰性叙事。
  cliches_to_avoid:
    - 罪犯家属在好心人的帮助下战胜歧视（rejected）
    - 罪犯家属被歧视到自杀的悲情结局（rejected）
    - 通过破案 / 证明清白来洗刷标签（rejected——刚志真的有罪，标签真实成立）
    - 兄弟重逢的温情和解（rejected——尾声只能失语，没有拥抱）

style_directives:
  - 零度叙事 / 冷静节制
  - 紧贴直贵 POV 的第三人称（间或刚志信件的第一人称插入）
  - 同形事件的主题变奏曲式结构（井上梦人解说语）
  - 关键象征贯穿全篇（信 / 想象 / 糖炒栗子 / 樱花印章）
  - 重要议论由角色之口说出（社长平野的两次谈话承担"主题宣讲"职能）

word_count: 215000  # 译者后记标注 215 千字
