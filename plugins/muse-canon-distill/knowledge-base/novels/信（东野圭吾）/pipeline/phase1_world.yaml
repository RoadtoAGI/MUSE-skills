# Phase 1: 世界 — 《信》东野圭吾
# 关注限制即叙事资源——本作的"世界"几乎完全由"歧视的社会运行机制"构成

setting:
  era: 当代日本（1990 年代末至 2000 年代初，平成中期）
  duration: 约 10 年（从刚志入狱到尾声慰问演出）
  location: |
    东京及其周边——江东区木场（绪方家、案发现场）/ 直贵的多次搬家点
    （高中时的公寓 → 废品回收公司宿舍（汽车厂季节工宿舍）→ 由实子的公寓
    → 新座的廉价公寓 → 葛西阳光住宅（新星电机公司宿舍）→ 末段的搬家）；
    狭谷一带（外国特色餐厅）/ 麻布警察署附近（酒吧 BJ）/ 涩谷（音乐场所）/
    田园调布（中条家——上流社会的对比点）/ 千叶监狱（哥哥的所在）。
  conflict_levels:
    internal: |
      直贵的内心冲突——
      对哥哥的爱与对哥哥拖累自己人生的怨恨；
      想"堂堂正正"的自尊与想隐姓埋名生存的现实主义；
      想保护新家人的责任感与背弃血亲的负罪感。
    personal: |
      直贵 vs 周围社会主体——
      房地产公司、班主任、外国餐厅同学、乐队伙伴 + 经纪人根津、中条家、
      新星电机人事部、町谷夫妇、幼儿园同学家长——
      每一次都是直贵与某个具体的"他人"在身份揭示后的接触瞬间。
    external: |
      整个日本社会的"标签机制"——
      雇主对员工亲属的调查、邻居间的口耳传播、媒体对犯罪事件的姓名公开、
      监狱通信检查（樱花印章）、户籍与身份验证体系——
      这些不属于任何具体反派，而是社会运行的客观规则。

world_rules:
  physical:
    - 监狱通信受检查：信纸上盖樱花印章作为已审阅标志（成为身份败露的物证）
    - 服刑者通信对象必须预先报请监狱审批，亲属变动需要办理手续
    - 服刑者每月可寄出 1 封信，可收多封；探视有时长（30 分钟）与申请限制
    - 抢包犯人留下指纹被锁定（与序中刚志摘手套留指纹的呼应）
  social:
    - 雇主对员工进行家庭背景调查是合法且通行的（特别是大公司、需要内部信任的岗位）
    - 房屋租赁时事故 / 犯罪相关的房屋会贬值或难租出（绪方家事件后空置三年）
    - 媒体公开犯罪嫌疑人姓名与家庭关系（弟弟、同一所高中等信息）
    - 监护人栏空缺、亲属服刑这些信息会在求职简历审查中暴露
    - 公司宿舍规则限制配偶子女以外的人同住（直贵被警告不准让哥哥同住）
    - 教师对学生亲属犯罪的"非正式劝退"——以"对学校名声"为顾虑
  psychological:
    - 「直接歧视」与「反向歧视」共存——前者是明示拒绝，后者是过度小心的疏远
    - 「不愿与犯罪者亲属有任何关系」是大多数普通人的本能反应，不需被解释
    - 「自我保护本能」可以正当化对无辜亲属的排斥（社长平野的核心论点）
    - 即使是善意的人，也会"垒一堵墙"，只是厚薄不同（直贵的内心比喻）
    - 知情者的"反向歧视"会让所有客人感到不适，进而集体回避——形成结构性后果
    - 父辈的犯罪 / 破产会让下一代背负相同的耻感（白石由实子的父亲赌博自破）

genre_conventions:
  primary_genre: 社会派写实小说
  secondary_genre: 家族悲剧 / 通信体小说变体
  conventions:
    - convention: 主角通过外部障碍逐步成长 / 战胜困境
      planned_subversion: |
        本作反其道——直贵每一次"获得"都立即被剥夺，没有线性成长；
        所谓"成长"是放弃成长、接受被剥夺的现实、转而保护更小范围的人。
    - convention: 通信体小说通过书信交换推动关系
      planned_subversion: |
        哥哥的信从未真正"被回复"——
        第三章起直贵停止回信，第四章起信被由实子代笔回复（哥哥不知），
        第五章末直贵主动写"最后一封信"宣告断绝，
        刚志读后也写自己的"最后一封信"给绪方——
        通信的终结而非交流构成了书信的真正功能。
    - convention: 悲剧主角因抗争而毁灭，或经磨难得救赎
      planned_subversion: |
        直贵既未毁灭也未得救赎——
        他活下来了、有了家庭、找到了工作，
        但代价是断绝兄长 + 隐姓搬家 + 最后一刻仍唱不出歌。
        作者拒绝给出明确的好坏判决。
    - convention: 反派提供阻力以推动主角成长
      planned_subversion: |
        没有传统反派——
        最像反派的孝文是为了保护表妹，最像反派的根津是市场理性的执行者，
        最像反派的中条父亲最后伏地恳求，最让人愤怒的町谷夫妇也只是普通邻居；
        真正的"反派"是社会本身的运行规则，不属于任何具体的人。

daily_life:
  - dimension: 工作场所（直贵历经的多种）
    findings:
      - detail: |
          搬家公司临时工 → 废品回收公司（汽车工厂的边角料分类、用手拆电机铜线）
          → 外国特色餐厅（点单、上菜、被同班醉酒同学说破身世）
          → 调味料公司宿舍 → 酒吧 BJ（夜班、调酒见习、夜里 4 点关店）
          → 新星电机电脑卖场（销售）→ 物流仓库（搬运、安全帽）→ 池袋电器店
        story_implication: |
          每一次"被剥夺"都伴随工作场所的具体降级或转移——
          工作场所的物理空间（明亮卖场 / 阴暗仓库、繁华涩谷 / 边缘新座）
          直接映射主角的社会位置变化。
      - detail: 公司宿舍是一种特殊的社会单位——既是同事又是邻居，传闻传播极快
        story_implication: |
          第五章町谷夫妇搬入葛西阳光住宅就足以摧毁直贵一家的邻里关系——
          因为公司同事和宿舍邻居重叠，传闻一旦扩散无处可逃。
  - dimension: 通信与身份验证
    findings:
      - detail: |
          监狱信件的樱花印章 / 寄信地址（千叶监狱）是身份的硬标识；
          公司面试要求填写监护人 / 亲属服刑情况；
          履历中的"空白"会引起人事部门追问。
        story_implication: |
          直贵的伪装永远是脆弱的——一张樱花印章的明信片就能让中条孝文识破。
          身份验证体系即叙事陷阱的引爆机制。
  - dimension: 阶层对比
    findings:
      - detail: |
          中条家在田园调布（旧富人聚居区）；西式洋房 + 别墅 + 大理石茶几 + 表兄孝文（外甥即未来女婿）；
          母亲做"非自家做"的高级便当（不愿动手）；父亲的高尔夫练习场 + 大型医疗仪器公司董事 + 蓝色宝马 + 西服。
          武岛兄弟来自江东区平民区 / 母亲过劳死 / 父亲死于工伤未获赔偿。
        story_implication: |
          阶层差被作者刻意放到极端——
          让"歧视"不只是道德问题而是经济阶层利益的合理保护，
          强化"中条家拒绝是可预见的、几乎是理性的"这一论点。

creative_constraints:
  - constraint: 一切信息流必须通过具体物（信件 / 樱花印章 / 履历表 / 公司通知）传递
    narrative_function: |
      让"歧视"具有可被识别、可被追溯的物理载体——
      使主题不仅是抽象的"社会不公"而是可被叙事化的、可指认的事件链条。
  - constraint: 主角不能拥有"超出常人的能力"或"重大反击的资源"
    narrative_function: |
      直贵唯一的"才能"——音乐 / 学习 / 销售——
      都被设计成会被剥夺的、依赖社会环境的能力。
      这迫使主题向"接受现实"而非"战胜现实"演化。
  - constraint: 哥哥刚志大部分时间不在场（只通过信件登场）
    narrative_function: |
      让"哥哥"成为一个抽象的负担符号而非具体的反派或同盟——
      读者像直贵一样无法对"哥哥"产生直接的善恶判断，
      只能体验"血亲"这一概念本身的重量。
      尾声哥哥的实体出现（合掌颤抖）因此成为巨大的情感释放点。
