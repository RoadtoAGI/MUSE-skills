# Phase 4: 结构 — 《信》东野圭吾
# 接收 Phase 3 的 5 个 Arc，逐 Arc 展开为序列

arc_expansions:
  # ============ ARC-1：失工 / 失家 / 失大学梦 ============
  - arc_id: ARC-1
    sequences:
      - seq_id: ARC1-SEQ1
        name: "案件爆发与媒体围攻"
        core_conflict: "直贵 vs 突如其来的现实——哥哥成为杀人犯这一事实"
        escalation_direction: "从'不能相信是真的'到'必须开始处理后果'"
        sequence_climax: "电视播放哥哥的黑白照片标'嫌疑犯武岛刚志'——直贵被迫面对现实"
        closed: "对哥哥未犯罪的最后幻想被切断"
        opened: "如何作为'杀人犯弟弟'生存下去的问题"

      - seq_id: ARC1-SEQ2
        name: "失家失校失大学梦"
        core_conflict: "直贵 vs 社会机构（房地产、学校、媒体）的逐级压力"
        escalation_direction: "从对单一压力的抵抗到接受系统性退场"
        sequence_climax: "校长 / 主任 / 梅村三人 + 房地产公司双重压迫 → 直贵宣告放弃大学"
        closed: "高中生身份的稳定性被剥夺"
        opened: "如何在没有亲属、没有大学、没有住所的状态下找工作"

      - seq_id: ARC1-SEQ3
        name: "首次警署面会与谢罪未遂"
        core_conflict: "直贵 vs 自身的负罪意识与道德责任"
        escalation_direction: "从'我只是受害者'到'我也是负有责任的一方'"
        sequence_climax: "去绪方家门口看见死者儿子带女儿出门 → 直贵逃走 → 怨恨自己'像逃兵'"
        closed: "直贵自我认知中'纯受害者'位置的失稳"
        opened: "永久的'未谢罪'负债 → 第五章末再次回归此地"

      - seq_id: ARC1-SEQ4
        name: "废品回收 + 外国餐厅 + 第一次身份败露"
        core_conflict: "直贵 vs '是否说出哥哥的事'这一选择"
        escalation_direction: |
          从被动接受梅村'有些事还是隐藏起来好'的建议 →
          为隐藏付出努力 → 在意外场合被同班同学醉酒说破 →
          被迫辞职
        sequence_climax: |
          餐厅同学 6 人来店 + 醉后大声说出'谁叫他哥是杀人犯呢' +
          店里所有客人沉默 + 店长沉默地擦桌子
        closed: "'隐瞒'作为单一策略的失败 + 第一份工作的失去"
        opened: |
          '反向歧视也会逼走客人' 作为更深结构的揭示 +
          '只能寻找更偏远的工作'

      - seq_id: ARC1-SEQ5
        name: "首次拘留所探视"
        core_conflict: "直贵 vs 兄长——是否还能称呼他为'哥哥'"
        escalation_direction: "从拒绝面会到主动面会 → 看见哥哥的憔悴 → 想恨却恨不出"
        sequence_climax: "栗子的对话——直贵纠正：'喜欢吃糖炒栗子的是妈妈，是想看到妈妈高兴的脸'"
        closed: "兄长记忆的可靠性被打破"
        opened: |
          '哥哥的爱建立在错误记忆上' —— 哥哥从未真正了解弟弟 —— 这一深层裂缝
          会在尾声扩大为最终的失语
    arc_progression_note: |
      ARC-1 的序列遵循"事件爆发 → 制度性退场 → 自我谢罪未遂 →
      首次身份败露 → 与兄长的第一次重逢"——
      最后一个序列以"兄弟关系的根本不对称"作为悬念交给下一个 Arc。

  # ============ ARC-2：音乐梦想 ============
  - arc_id: ARC-2
    sequences:
      - seq_id: ARC2-SEQ1
        name: "宿舍同伴仓田与函授大学路径的打开"
        core_conflict: "直贵 vs 自我放弃——还能不能再有梦想"
        escalation_direction: "从对宿舍粗鄙者的反感 → 同样有过案底的仓田反而成为启示者"
        sequence_climax: "仓田离开后留下的高中参考书堆中夹着帝都大学函授教育部《部报》"
        closed: "'我没有任何路'这一封闭判断"
        opened: "通过函授教育重新进入主流社会的可能性"

      - seq_id: ARC2-SEQ2
        name: "结识寺尾 + 加入乐队 + 第一次卡拉 OK 唱《想象》"
        core_conflict: "直贵 vs 自我评价——'我能否被人需要'"
        escalation_direction: "从拒绝交友 → 被寺尾发现声音 → 加入'宇宙光'乐队 → 第一次现场演出"
        sequence_climax: "演奏会后台寺尾说'好好想象，没有歧视和偏见的世界' → 直贵几乎流泪"
        closed: "孤立无援的状态"
        opened: "第一次拥有可以失去的归属"

      - seq_id: ARC2-SEQ3
        name: "演奏会成功 + 经纪人根津的出现 + 调查的开始"
        core_conflict: "直贵 vs 即将到来的暴露 —— 不知道但读者已预见"
        escalation_direction: "从演出成功的兴奋 → 商业机会到来 → 经纪人调查所有成员背景"
        sequence_climax: |
          幸田 / 敦志 / 健一三人来直贵宿舍 →
          告知"根津调查到了你哥哥的事，要求你退出"
        closed: "'梦想可以靠才能实现'的天真信念"
        opened: |
          '才能即使被欣赏也不能改变身份的命运' —— 商业理性必定胜过个人友谊

      - seq_id: ARC2-SEQ4
        name: "退出乐队 + 跟寺尾决裂"
        core_conflict: "直贵 vs 寺尾——能否说出真实理由"
        escalation_direction: "从默默接受退出 → 被迫编造理由 → 寺尾识破 → 直贵跪求"
        sequence_climax: |
          寺尾"以前我从没憎恨过你哥哥，可今天我从心底里生气，要是他在这儿，我肯定要狠狠揍他" +
          直贵"是啊，要是行的话，我也想那么做"
        closed: "音乐梦想 + 与寺尾的友情（暂时）"
        opened: |
          '即使最理解的朋友也会对我哥哥产生愤怒' ——
          兄弟之间的连带罪责被外部所有人共同确认。
          但寺尾这条线在第五章末作为"慰问演出"邀请回归。
    arc_progression_note: |
      ARC-2 通过"重燃梦想 → 实现部分梦想 → 在最接近实现时被剥夺"
      建立"被剥夺的痛苦与获得感成正比"的递进逻辑——
      为后面 3 个 Arc 的递增痛感铺路。

  # ============ ARC-3：上升婚恋 ============
  - arc_id: ARC-3
    sequences:
      - seq_id: ARC3-SEQ1
        name: "转正规课程 + 联谊会 + 偶遇朝美"
        core_conflict: "直贵 vs 自我设定的'不能再有爱情'禁令"
        escalation_direction: |
          从拒绝联谊 → 在联谊会上被中条朝美的特殊气质吸引 →
          帮她找回钱包 → 提议喝茶 → 交换手机号
        sequence_climax: "BJ 酒吧朝美用直贵在场壮胆与前男友分手"
        closed: "'我不配有爱情'的自我判断"
        opened: "与上流千金的不般配恋爱"

      - seq_id: ARC3-SEQ2
        name: "甜蜜恋爱与拜访中条家"
        core_conflict: |
          直贵 vs 中条家的多层防线（母亲套话 / 父亲沉默 / 表兄孝文登场）
        escalation_direction: |
          从被母亲盘问的紧张 → 父亲的冷淡 → 孝文作为"早已订好的未婚夫"登场
          → 孝文开车送直贵时直接威胁"对她死心"
        sequence_climax: |
          孝文车上："她也是我将来结婚的对象。
          舅舅、舅妈都赞成。与其说赞成，不如说就是他们定的"
        closed: "'两人感情就够了'的理想"
        opened: "需要用某种'既成事实'打破阶层封锁"

      - seq_id: ARC3-SEQ3
        name: "由实子的'既成事实'方案 + 安全套针孔"
        core_conflict: "直贵 vs 自己的道德底线"
        escalation_direction: |
          由实子提议怀孕方案 → 直贵犹豫 →
          立野告知有人在调查 → 时间不够 → 直贵决定执行
        sequence_climax: "做日式煎饼日 + 直贵扎好安全套针孔 + 准备制造怀孕"
        closed: "直贵作为'被歧视者'的纯粹性"
        opened: |
          '我也开始做卑鄙之事' —— 歧视的伤害变成了双向的、传染的、
          会让被歧视者也卑微的力量

      - seq_id: ARC3-SEQ4
        name: "孝文识破 + 朝美知情 + 中条父亲登门"
        core_conflict: "直贵 vs 完整的中条家的最后压力"
        escalation_direction: |
          孝文意外造访目击樱花印章明信片 → 识破身份 → 朝美得知 →
          直贵失败的强暴尝试 + 朝美发现安全套针孔 → 朝美愤然离开 →
          中条父亲登门递信封"接受这个"
        sequence_climax: |
          直贵戏弄式回答"会到处传播作为反击" →
          看见中条父亲表情扭曲 + 重新说"开玩笑，我不会那样做的" → 拒绝钱
        closed: "上升通道的最后可能性"
        opened: "需要主动让朝美死心——叫由实子假扮自己女友"

      - seq_id: ARC3-SEQ5
        name: "朝美追到由实子住处 + 直贵冷漠拒绝"
        core_conflict: "直贵 vs 自己内心仍残留的对朝美的爱"
        escalation_direction: |
          躲藏 → 朝美识破假局 → 朝美愿意接受'怀孕方案' →
          直贵冷漠地说'太麻烦了，怎么都行'
        sequence_climax: "朝美'我从中条家里出来的话，你就没有兴趣了？' / 直贵'最终还是会那样啊！'"
        closed: "与朝美的所有可能性 + 与上升阶层连接的所有可能性"
        opened: |
          '我已经不是过去的我了' —— 直贵进入了主动放弃 + 主动伤人的新人格阶段。
          这一改变会被由实子在第四章看出来并指认。
    arc_progression_note: |
      ARC-3 与 ARC-2 的关键区别：
      ARC-2 直贵是被动退出，ARC-3 他主动做了卑鄙之事；
      此 Arc 让"歧视的双向伤害"主题清晰化——
      为社长平野的"歧视必然论"演讲（ARC-4）做了情绪铺垫。

  # ============ ARC-4：职业重建与新家庭的形成 ============
  - arc_id: ARC-4
    sequences:
      - seq_id: ARC4-SEQ1
        name: "求职面试 + 入职新星电机 + 与哥哥的关系'断绝'尝试"
        core_conflict: "直贵 vs 雇主背景调查的潜在威胁"
        escalation_direction: |
          多次求职被拒 → 撒谎说哥哥在美国学打击乐 → 入新星电机 →
          搬家不告诉哥哥新住址 → 停止读哥哥来信
        sequence_climax: "毕业典礼当天读哥哥来信 → 信中明显知道公司名 + 入职细节 → 由实子代笔"
        closed: "'物理切断信件就能切断兄长'的天真"
        opened: "由实子作为代笔者承担了兄长连接 → 第四 / 第五章揭示的双线"

      - seq_id: ARC4-SEQ2
        name: "游戏机被盗事件 + 古川刑警的指纹采集"
        core_conflict: "直贵 vs 警察调查机制"
        escalation_direction: |
          被盗 → 全员指纹采集 → 古川刑警单独找直贵 →
          履历上'哥哥在美国'的谎言被揭穿
        sequence_climax: "古川'你哥哥在什么地方' / 直贵'在监狱里'"
        closed: "撒谎策略的失败"
        opened: "公司方面将进行正式调查 → 调动到仓库"

      - seq_id: ARC4-SEQ3
        name: "反向歧视 + 调动到仓库"
        core_conflict: "直贵 vs 公司的'软驱逐'机制"
        escalation_direction: |
          人事部正式确认哥哥情况 → 同事变得'比以前更客气' →
          无关由人事部突然调动到仓库 → 直贵抗议失败
        sequence_climax: "人事部长'理由只有一个，因为你是公司职员'"
        closed: "'凭工作能力可以撑下去'的信念"
        opened: "如何在物流仓库的灰暗位置上继续生存的问题"

      - seq_id: ARC4-SEQ4
        name: "社长平野的第一次演讲（仓库谈话）"
        core_conflict: "直贵 vs 自己对'歧视'的旧理解"
        escalation_direction: |
          社长突然出现 → 直接讨论歧视的合理性 →
          展示了一封不肯让看的信 → 离去
        sequence_climax: |
          平野"有歧视是当然的事情。大多数人都想置身于远离犯罪的地方……
          排斥犯罪者或者其亲人……是非常正当的行为，也可以说是人的自我保护的本能。
          所以，犯罪者也应该醒悟，不是自己蹲监狱就完事了……
          你哥哥可以说像是自杀一样，他选择了社会性的死亡。
          但是，他没有考虑留下来的你会因此多么痛苦……
          可是，和真正的死亡不同，社会性的死亡是可以生还的。"
        closed: |
          直贵原有的"被歧视是周围人的不对"这一道德优越感
        opened: |
          '需要主动孜孜不倦增加与他人联系的线' 的新生存论
          + '是谁写的那封信' 的悬念

      - seq_id: ARC4-SEQ5
        name: "回家发现由实子代笔 + 由实子袒露父亲赌博破产"
        core_conflict: "直贵 vs 由实子——为什么她要替我维系兄长关系"
        escalation_direction: |
          直贵原想去感谢由实子 → 发现信件 → 愤怒 →
          由实子坦白长期代笔 + 父亲赌博破产经历 →
          直贵被打动"是因为她也不愿逃避"
        sequence_climax: "由实子'我讨厌逃避了，看到别人逃避也讨厌。所以不希望直贵君逃避'"
        closed: "直贵的'孤立无援'状态"
        opened: |
          与由实子的结合 + 共同决心'不再逃避，堂堂正正活下去' ——
          这一决心将在 ARC-5 被社长平野第二次谈话否定
    arc_progression_note: |
      ARC-4 的关键转折：
      引入"社长平野"作为主题宣讲者 + 引入"由实子"作为伴侣 ——
      二者构成接下来 ARC-5 的双线张力：
      由实子的'堂堂正正不逃避' vs 平野的'独自承担秘密'。

  # ============ ARC-5：家庭被侵蚀 → 主动断绝 ============
  - arc_id: ARC-5
    sequences:
      - seq_id: ARC5-SEQ1
        name: "葛西阳光住宅小家 + 町谷夫妇搬入 + 纸箱事件"
        core_conflict: "直贵 vs 来自过去的具体见证人"
        escalation_direction: |
          搬入公司宿舍 → 邻里关系良好 → 町谷夫妇（电脑卖场前同事）搬入 →
          直贵提醒其纸箱问题 → 町谷怀恨
        sequence_climax: "纸箱事件——町谷'真烦人！知道啦'"
        closed: "无人知道身世的避风港"
        opened: "町谷将传播秘密的预感"

      - seq_id: ARC5-SEQ2
        name: "邻里冷淡 + 公园排斥 + 直贵想搬家被由实子拒绝"
        core_conflict: "直贵的'再搬家'本能 vs 由实子的'不再逃避'信念"
        escalation_direction: |
          纸尿裤被退回 → 公园其他孩子被家长拉走 → 直贵想搬家 →
          由实子坚决"不再逃避，保护实纪，让她不要有自卑感"
        sequence_climax: "由实子'我来守护着实纪，绝不让她受欺负，而且我也不想让孩子有自卑感'"
        closed: "搬家逃避作为选项"
        opened: "用'堂堂正正承担'来对抗排斥的尝试 → 注定会失败"

      - seq_id: ARC5-SEQ3
        name: "幼儿园园长谈话 + '哥哥出狱传闻'"
        core_conflict: "直贵 vs 标签向下一代的渗透"
        escalation_direction: |
          实纪没朋友 → 看动画片度日 → 园长建议换幼儿园 →
          直贵动摇'要不就换个幼儿园'
        sequence_climax: "直贵看着实纪沉浸动画'她大概是为了忍受孤独，才迷上动画片的吧'"
        closed: "'我可以独自承担歧视'的自我安慰"
        opened: "女儿的人生也将被侵蚀的未来 → 必须做更激进的选择"

      - seq_id: ARC5-SEQ4
        name: "社长平野的第二次演讲（视察仓库）"
        core_conflict: "直贵 vs 自己一直引以为豪的'堂堂正正'"
        escalation_direction: |
          社长视察时未理会直贵 → 直贵失望 →
          被叫到会议室单独谈话 → 直贵抱怨女儿被歧视 →
          社长否定'堂堂正正'为'容易选择的路'
        sequence_climax: |
          平野"堂堂正正，这是你们夫妇的关键字……
          要说不管什么时候，不管怎样的场合，都保持堂堂正正，
          对你们来说大概是艰难的选择，我却不那么看，
          只觉得你们是走了一条容易理解、容易选择的道路"
        closed: "由实子'不再逃避'的信念作为唯一答案的位置"
        opened: |
          '更难的选择是什么？' 的悬念 ——
          被即将到来的实纪受伤事件强行回答

      - seq_id: ARC5-SEQ5
        name: "实纪被抢包犯撞伤 + 前山夫妇上门道歉"
        core_conflict: "直贵 vs 自己未尽的道歉（对绪方家）"
        escalation_direction: |
          被抢包犯前山繁和撞倒 → 实纪头部受伤留疤 → 前山夫妇上门跪谢 →
          直贵看见受害者家属面对自己时的负担 →
          意识到'他们做得到去受害者家里，我从未做到过'
        sequence_climax: "直贵'当晚写了封信'——给哥哥的断绝信"
        closed: |
          '物理隔离但保留关系名义'的中间状态
        opened: "正式宣告断绝 + 必须为新家人做出主动选择的阶段"

      - seq_id: ARC5-SEQ6
        name: "辞职 + 社长第三次谈话 + 搬家 + 寺尾电话邀慰问演出"
        core_conflict: "直贵 vs '断绝之后的人生应该如何'"
        escalation_direction: |
          辞职手续 → 社长第三次出现"你选择的道路不是简单的道路" →
          搬家到池袋 → 寺尾来电邀千叶监狱慰问演出 → 直贵拒绝
        sequence_climax: |
          寺尾"不会因此就心情舒畅了吧" / 直贵"虽说唱歌……我还是喜欢"
        closed: "断绝信 = 一切都已结束的简单认知"
        opened: "断绝之后仍有未尽事项的预感"

      - seq_id: ARC5-SEQ7
        name: "去绪方家烧香被拒 + 读到哥哥写给绪方的多年赔罪信"
        core_conflict: "直贵 vs 关于哥哥的完整真相"
        escalation_direction: |
          去绪方家烧香 → 被拒"杀我母亲的不是你" →
          绪方拿出一束哥哥多年赔罪信 → 拒绝烧香的真正原因揭示 →
          绪方给直贵刚志的"最后一封信"
        sequence_climax: |
          绪方"我想，就这样吧，就在这儿结束吧，一切" +
          直贵两手拿着信封"没有勇气取出信纸"
        closed: |
          '我以为我了解哥哥' '我以为我做了一切该做的' '我以为这事可以了结'
          ——三重认知都被打破
        opened: |
          慰问演出作为最后一次精神相会的可能性 → 决定接受寺尾的邀请
    arc_progression_note: |
      ARC-5 通过 7 个序列推进，是全书序列密度最高的 Arc——
      从"小家的稳定 → 被侵蚀 → 主动割断 → 重新发现真相"的完整轨迹，
      并通过引入'受害者一方'（前山 / 绪方）作为镜像让直贵看清自己。

  # ============ 尾声 ============
  - arc_id: ARC-EPILOGUE
    sequences:
      - seq_id: EPILOGUE-SEQ1
        name: "千叶监狱舞台 + 失语"
        core_conflict: "直贵 vs 自己内心从未真正断绝的兄长之爱"
        escalation_direction: |
          准备演唱 → 上台 → 看见哥哥合掌颤抖 →
          钢琴前奏开始 → 张嘴却发不出声音
        sequence_climax: "直贵'怎么也发不出声音' —— 故事终结"
        closed: "'断绝信'作为最终答案的有效性"
        opened: |
          故事在悬置中结束 ——
          作者拒绝告诉读者"之后怎么办"，
          让读者自行承担直贵的失语 → 解说环节井上梦人把这镜子转向读者。

causal_chain: |
  ARC1-SEQ1（案件爆发）→（媒体公开 + 房地产逼迁 + 校长劝退）
  → ARC1-SEQ2-3-4-5（接受退场 + 谢罪未遂 + 第一次身份败露 + 与哥哥的认知裂缝）
  →（带着裂缝进入新阶段，但抱持'仍可以靠才能重建'的希望）
  → ARC2-SEQ1（仓田路径）→ ARC2-SEQ2-3-4（音乐梦的兴起与崩塌）
  →（梦想被剥夺让直贵开始接受'身份永远在'的现实）
  → ARC3-SEQ1（与朝美相爱）→（一种新的逃离可能性出现）
  → ARC3-SEQ2-3-4-5（爱情被中条家用钱中止 + 直贵自己也变卑鄙）
  →（直贵进入'主动放弃 + 主动伤人'的新人格阶段）
  → ARC4-SEQ1-2-3（撒谎进新星电机 → 被识破 → 调入仓库）
  → ARC4-SEQ4（社长第一次演讲 → '歧视必然论'）
  → ARC4-SEQ5（发现由实子代笔 → 与她结合 → '不再逃避'决心）
  →（由实子的决心暂时压过平野的'独自承担'论）
  → ARC5-SEQ1-2-3（小家被侵蚀 + 女儿被排斥 + '堂堂正正'的限度暴露）
  → ARC5-SEQ4（社长第二次演讲 → 否定'堂堂正正'）
  → ARC5-SEQ5（实纪受伤 + 前山夫妇上门 → 直贵被触动写断绝信）
  → ARC5-SEQ6-7（辞职 + 搬家 + 绪方家烧香被拒 + 读哥哥赔罪信）
  →（积累了 5 个 Arc 的剥夺 + 自身的断绝 + 真相的重新发现）
  → EPILOGUE-SEQ1（监狱舞台失语 = 最终答案）

# ── 全篇递进关系 ──

arc_progression:
  impact_escalation: |
    Arc 间冲击力递增的方向是：
    1. 被剥夺的领域更深入 ——
       同学 → 朋友 → 爱人 → 同事 → 子女
    2. 直贵自身的"主动性"程度递增 ——
       被动失去（ARC1）→ 被胁迫退出（ARC2）→ 自己做卑鄙之事（ARC3）→
       接受异常调动（ARC4）→ 主动断绝兄长（ARC5）→ 主动接受演出但失语（尾声）
    3. 主题宣讲的精度递增 ——
       直贵自己的反思（ARC1-3）→ 社长第一次演讲（ARC4 中段）→
       社长第二次演讲（ARC5 中段）→ 哥哥最后一封信（ARC5 末）→
       直贵的失语作为终极陈述（尾声）
    4. 与"受害者一方"的距离递减 ——
       完全回避（ARC1 起）→ 想去未去（ARC1-SEQ3）→
       完全无视（ARC2-4）→ 通过前山夫妇看见受害者家属（ARC5-SEQ5）→
       亲自去绪方家（ARC5-SEQ7）→ 在哥哥面前演出（尾声）
  causal_chain: |
    ARC1 高潮（外国餐厅身份败露）
    → 触发直贵的 '隐瞒 + 退场' 行为模式
    → ARC2 高潮（乐队退出）
    → 强化直贵的 '不能依赖才能 + 主流社会不接纳' 的判断
    → ARC3 高潮（中条家拒绝 + 自己做卑鄙事）
    → 触发直贵的 '主动伤人 + 自我厌恶' 的新人格
    → ARC4 高潮（社长第一次演讲 + 由实子结合）
    → 给直贵 '独自承担' 与 '堂堂正正' 两条对立的路径
    → ARC5 高潮（社长第二次演讲否定'堂堂正正' + 实纪受伤 + 断绝信）
    → 直贵最终选择'独自承担'路径
    → EPILOGUE 高潮（监狱舞台失语）
    → 揭示'独自承担'也无法真正切断血亲之爱

# ── 多线叙事 ──

narrative_threads:
  - name: "明线：直贵的人生轨迹"
    description: |
      第三人称紧贴直贵 POV，时间线性推进，覆盖约 10 年。
      每个 Arc 内由"获得 → 暴露 → 失去"组成同形结构。
    primary_arcs: [ARC-1, ARC-2, ARC-3, ARC-4, ARC-5, ARC-EPILOGUE]

  - name: "暗线：刚志的狱中信"
    description: |
      每章开头或中段穿插一封刚志的手写信（直接引用全文），
      用监狱内的小事（金属雕刻 / 樱花 / 同房间者 / 花粉症 / 服刑生活）
      与直贵的现实形成强烈反差。
      信中刚志的语气始终是温和的、关心的、自责的，
      不知道弟弟在受怎样的苦。
      这条线在 ARC-4 末由实子的代笔揭示时第一次出现"作者干预"的转折，
      在 ARC-5 末与第三线（绪方家信件）汇合。
    presence: 贯穿（每章 1-2 封信）

  - name: "隐藏的第三线：刚志写给绪方家的赔罪信"
    description: |
      读者直到 ARC5-SEQ7 才知道这条线存在 ——
      刚志从入狱第一天起就每月给绪方家寄赔罪信，从未间断。
      绪方先生收下却从未回复，最终在直贵到访时拿出全部信件，
      并交给直贵刚志的"最后一封信"
      （写于读到直贵的断绝信之后）。
      这条线让读者重新理解刚志这个角色——
      他不是直贵想象中"无忧无虑写无关紧要日常"的哥哥，
      而是一个每天都在赔罪、每天都在意弟弟的人。
      此线为尾声的失语提供了最深的情感推动力。
    presence: 仅在 ARC-5 末 + 尾声出现（揭示性的延迟披露）
