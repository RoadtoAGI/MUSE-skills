# Phase 2: 人物系统 — 《信》东野圭吾
# 只记录系统级信息（功能分配 / 对比轴 / 关系网 / 权力动态）
# 不含声音细节、对白原文、个体弧光叙述——那些归入个体画像（按需）

cast_overview:
  protagonist: 武岛直贵   # 全篇 POV、约 22 岁→32 岁的成长轨迹
  antagonist: |
    抽象对抗力量——"日本社会的标签机制"
    （媒体 / 户籍调查 / 雇主审查 / 邻里口耳 / 公司宿舍同事邻居重叠 / 监狱通信检查）
    具象代理者按 Arc 轮换：
      ARC-1：江上等同班同学 + 校长 + 房地产公司
      ARC-2：经纪人根津（不亲自上场，通过乐队三人传话）
      ARC-3：中条父亲 + 嘉岛孝文（双面攻击）
      ARC-4：古川刑警 + 人事部长（程序性对抗）
      ARC-5：町谷夫妇（邻居层）+ 幼儿园其他家长（家庭层）
    本作有意不让任何一个具象代理者承担"反派"重任 ——
    每个人都有自己的合理立场，没有一个人是恶意的；
    这是 controlling idea 中"歧视是自我保护本能"的人物化表达。

  supporting_cast:
    # ── 真正承担叙事功能的配角 ──
    - name: 武岛刚志
      function: |
        激励事件的执行者 + 全篇隐性 deuteragonist。
        几乎全程不在场（仅序+第一章首次面会+第一章首次拘留所探视+尾声合掌身影）；
        通过狱中信件（每章 1-2 封）持续在场 + 通过对绪方家的赔罪信（隐藏线索）承担情感升华。
        功能：是"哥哥"这一血缘负担的人格化 + 是直贵的镜像（同样希望兄弟好）。
    - name: 武岛加津子（母）
      function: |
        前史角色（已去世，通过回忆出现）。
        承担"过劳死的母亲 / '没有学历不行'的执念 / 兄弟之间记忆错位的核心物件持有者（糖炒栗子）"功能。
        她的死决定了刚志辍学谋生 + 兄弟相依为命的前提结构。
    - name: 白石由实子
      function: |
        从配角升格为最终伴侣 + 主题对位发声者。
        引入：ARC-1 末巴士上递苹果 → ARC-2 圣诞贺卡 → ARC-3 在 BJ 出现并提出"既成事实"方案 →
        ARC-4 被发现长期代笔回复哥哥 + 结合 → ARC-5 妻子身份贯穿始终。
        功能：a) 直贵之外唯一不离开的人；
              b) "不再逃避"信念的代表（与社长的"独自承担"形成对位）；
              c) 直贵能从底层重新进入主流社会的情感锚点；
              d) 隐性维系兄弟通信的桥梁——即使在直贵宣告断绝之前也代他回信。
    - name: 武岛实纪
      function: |
        最高 stakes 的代表（女儿的童年与未来）。
        实质性出场仅在 ARC-5（约 3 岁起），但她的存在让直贵被迫从"自己能否承受歧视"
        升级到"我能否让女儿不必承受这一切"——
        她的头部受伤 + 留疤是 ARC-5 直贵决定写断绝信的直接触发器。
        功能：让"歧视的代际传递"具象化。
    - name: 平野（新星电机社长）
      function: |
        主题宣讲者 / 父辈智者 / 全篇唯一的"理性他者"。
        三次登场（仓库初次谈话 / 视察会议室二次谈话 / 辞职日仓库三次告别），
        三次都承担主题推进职能：
          第一次：宣讲"歧视必然论 + 蜘蛛网式恢复"；
          第二次：否定"堂堂正正"为"容易选择的路"；
          第三次：肯定"独自承担秘密的道路不简单但是你做出的选择"。
        功能：让主题以"非教条 / 非说教"的方式被听见——
        因为他是位置最高的人 + 最温和 + 没有恶意 + 真心想帮直贵。
    - name: 寺尾祐辅
      function: |
        音乐知己 + 第二条社会接纳尝试的伙伴 + 尾声的同台演出者。
        ARC-2 中段加入 → ARC-2 末跪别决裂 → ARC-5 末电话邀慰问演出 →
        尾声同台演出（"想象"二人组）。
        功能：a) 让"无歧视世界"的乌托邦最早被说出（"想象一下没有歧视和偏见的世界"）；
              b) 多年后以行动证明这个乌托邦在他个人内心仍然成立——
                 慰问演出本身就是这一乌托邦在监狱场域的实践；
              c) 成为尾声让直贵走上舞台见到哥哥的"渡桥人"。
    - name: 仓田
      function: |
        过路天使 / 启示者（仅 ARC-2 短暂出现）。
        曾在千叶监狱服过刑 + 现在为养家而自学大检 + 主动跟直贵分享自己的故事 +
        离开宿舍时"忘了"留下高中参考书堆 + 帝都大学函授教育部小册子。
        功能：让"从底层重新进入主流社会"的可能性以最不可能的方式（前科者赠送）实现——
        显示帮助者可能来自任何地方。
    - name: 嘉岛孝文（朝美的表兄）
      function: |
        ARC-3 的家族内部攻击者。
        作为"已被安排的未婚夫" + "外甥即未来女婿" + 父亲公司的下属——
        将中条家的拒绝从"含蓄的态度"升级为"直接的威胁与识破"。
        功能：a) 把"阶层封锁"具象化（蓝色宝马 / 西服领带 / 旧金山出差谈资）；
              b) 通过樱花印章识破刚志身份 → 触发 ARC-3 高潮；
              c) 作为"中条家选定的男人"与直贵形成阶层差与命运对比镜。
    - name: 中条朝美
      function: |
        ARC-3 的爱情对象 / 上升通道。
        哲学系 / 留过级 / 黑色长发 / "自带阴影"的高冷千金。
        功能：a) 让"上升婚恋"成为直贵最接近实现也最被剥夺的梦想；
              b) 通过她的"对逆境的幻想"显示中产女性的安全脆弱性——
                 她可以"想象"反叛父母但终究无法承担反叛的后果；
              c) 她的"父母也是亲戚"细节 + 中条家阶层封闭的描绘
                 让阶层差不仅是经济差而是社会结构差。
    - name: 中条父亲
      function: |
        ARC-3 高潮的主要对手。
        伏地恳求 + 信封交易 + 但仍要求"封口"——
        显示"上流社会"在被歧视的伦理面前会舍弃所有体面以保护家族。
        功能：把"自我保护本能"在父辈层面具象化——
        与平野社长的"理性宣讲歧视"形成两种"歧视的合理化"方式。
    - name: 町谷夫妇
      function: |
        ARC-5 的关键触发器。
        丈夫町谷是直贵在新星电机电脑卖场时的同事（短暂在场知道哥哥事），
        妻子是"看起来稳重的世田谷千金"——
        以礼貌姿态搬入葛西阳光住宅 → 因纸箱事件结怨 →
        妻子在公园里向其他妈妈传播秘密 → 整个公司宿舍的歧视雪崩开始。
        功能：让"歧视的传播者"也具象化为"普通好人 + 小气量 + 阶层差"——
        而非传统反派形象。
    - name: 绪方先生（绪方敏江之子）
      function: |
        受害者一方的代表 + 隐藏第三线的揭示者。
        ARC-1 短暂远景出现（带女儿出门，直贵逃走）→ ARC-5 末实体出现（拒绝烧香 + 拿出哥哥多年赔罪信）。
        功能：a) 让受害者一方人性化——他既不是复仇执念也不是宽容圣者，而是被加害者长期赔罪消耗的疲惫家属；
              b) 揭示哥哥"另一条赔罪线"的存在——重写读者对哥哥的整个理解；
              c) 通过"杀我母亲的不是你"否定直贵"代哥哥赎罪"的自以为正确——
                 给直贵下一阶段的演出旅程提供新的精神准备。
    - name: 前山夫妇
      function: |
        ARC-5 中段的镜像启示者。
        儿子前山繁和是抢包犯，撞伤实纪。
        上门跪谢 + 带高级水果 + 父亲"你打也好骂也好"姿态——
        让直贵第一次从"受害者家属"角度看见自己原本的位置——
        让"我从未去过绪方家"的负罪被唤醒 → 直接触发当晚的断绝信。
        功能：与绪方先生（ARC-5 末）形成"加害者父母 / 受害者家属"的两个镜像。
    - name: 班主任梅村老师
      function: |
        ARC-1 的"半 helpful 中介者"。
        介绍外国餐厅工作 + 告知直贵搬家地址给刚志（间接触发"切断关系"的失败）+
        介绍废品回收公司 + 在直贵升大学决定时帮忙。
        功能：a) 让读者看见"善意的成年人"也无法解决标签问题；
              b) "有些事还是隐藏起来不说为好"的建议作为整本书的"隐瞒策略"母题被他率先说出。
    - name: 立野
      function: |
        ARC-1 + ARC-2 + ARC-3 的旁观式叙述者。
        废品回收公司同事 + 曾任民谣歌手 + 没出息的底层老人。
        ARC-3 中段告知直贵"有人在调查你"——
        触发直贵决定执行"既成事实"方案。
        功能：a) 让"底层互助"具有功利色彩——立野透露信息也是因为想得到酬谢；
              b) 显示底层社会的敏感嗅觉——
                 "好像只要是在这坎坷人生的小道上走过来的人，
                  就都具有常人所不具备的敏锐嗅觉"。
    - name: 福本（废品回收公司社长）
      function: |
        ARC-2 的非典型职场长者。
        在直贵跟仓田打架后没有解雇他，反而劝他"在我们这样的地方猫着，能有什么出息"——
        是第一个直接对直贵说"你应该追求更高"的成年人，
        与后来社长平野的"独自承担秘密"路径形成对照——
        福本的建议是"上升"，平野的建议是"隐姓"。
    - name: 江上
      function: |
        ARC-1 早期同班同学，象征"善意的疏远"。
        是直贵高中时代最要好的朋友（橄榄球队员）。
        案件后第一个跟直贵说话："心情好点儿了吗？"
        但马上"沉默着离开" + 后续课堂中再无主动交流。
        功能：让"反向歧视"在最不应该出现的关系（最好的朋友）中第一次出现——
        让读者意识到"歧视"不需要恶意，只需要"自我保护本能"。
    - name: 外国特色餐厅店长（大胡子）
      function: |
        ARC-1 末"反向歧视"的代表。
        善良地隐藏直贵的身份 + 同班同学说破后表面犹豫但实质压力——
        是后来 BJ 老板的前奏 + 几年后被新雇主电话调查时仍说"他是个老实孩子"。
        功能：让"善意的人"也成为歧视体系的一部分——
        但同时让读者保持对这些人的最低限度的善意理解。
    - name: 古川刑警
      function: |
        ARC-4 高潮的执行者。
        通过"特殊直觉" + "排除法采集指纹"的程序性调查
        把直贵"哥哥在美国"的谎言识破。
        功能：让"程序"本身成为歧视的具体形态——
        古川个人没有恶意（事后"这件事，我们不会向公司方面泄露的"）
        但他的工作必然让真相被公司知道。
    - name: 经纪人根津
      function: |
        ARC-2 高潮的不在场对手。
        作为 Ricardo 公司企划总部代表挑选乐队——
        通过 3 人转告"不要让祐辅察觉，去说服直贵"——
        本人从未与直贵正面对话。
        功能：让"商业理性"作为不可对话的歧视代理者——
        因为不在场所以无法被诉求 / 不能被改变。

contrast_axes:
  - axis_name: "兄弟二人对'同一事件'的认知差异"
    axis_description: |
      直贵与刚志在同一童年事件（妈妈赏花 + 糖炒栗子 + 小猫）上的记忆完全错位 ——
      刚志记得"直贵最喜欢吃糖炒栗子"，实际上是妈妈爱吃 + 兄弟两人给妈妈剥皮；
      刚志在赏花信中没提小猫的死，实际上两兄弟都去看过那只猫的尸体。
      这一对比轴贯穿全书：
      - 兄弟看起来相依为命，实际上从未真正了解对方；
      - "血亲"作为一个抽象概念在小说中比"血亲作为实际关系"更重要；
      - 刚志的爱建立在错误记忆上，但这一错误并不让爱不真实。
    responders:
      - 武岛直贵：在第一章末的拘留所首次发现错位 + 在第三章对哥哥来信的反感
        (作为想忘掉过去的弟弟形象)
      - 武岛刚志：从未意识到错位 + 在赔罪信中持续表达对弟弟的关心
        (作为持续保留'相依为命'幻觉的哥哥形象)
      - 共同的归宿：尾声直贵的内心独白"我们在一起交谈，就像我们两个给妈妈剥栗子时那样" ——
        糖炒栗子被直贵在最后重写为"两人一起的童年" ——
        承认了哥哥的爱即使建立在错误记忆上也是真实的。

  - axis_name: "'堂堂正正接受身份' vs '独自承担秘密'"
    axis_description: |
      由实子代表的"不再逃避"路径 vs 社长平野代表的"独自承担"路径——
      两者在 ARC-4 末以"由实子代笔被发现 + 两人结合"的方式合二为一，
      在 ARC-5 中段以"社长第二次否定堂堂正正"的方式被分割，
      最终在 ARC-5 末直贵选择"独自承担"路径（写断绝信 + 搬家隐姓）。
    responders:
      - 武岛直贵：先尝试"堂堂正正"（ARC-4 末-ARC-5 初）→ 后接受"独自承担"（ARC-5 末）
      - 白石由实子：始终坚持"堂堂正正" + 父亲赌博破产的家庭背景作为其信念来源
        (即使直贵宣告断绝兄长，她仍替哥哥说话："罪的大小不一样啊")
      - 社长平野：始终主张"独自承担" + 用"蜘蛛网式恢复"作为操作方法
      - 这一对比轴的重要性：
        作者拒绝告诉读者哪个对哪个错——
        两条路径都有各自的代价；
        直贵最终选择的"独自承担"在尾声证明是失败的（仍然失语 / 仍然没有真正切断）。

  - axis_name: "受害者亲属 vs 加害者亲属的姿态"
    axis_description: |
      绪方先生 vs 直贵 + 前山夫妇 vs 武岛兄弟——两个对比组：
      a) 绪方先生 vs 直贵：
         绪方先生默默收下哥哥多年赔罪信不回复；
         直贵从未去绪方家烧香——
         显示受害者亲属比加害者亲属更有伦理姿态。
      b) 前山夫妇 vs 武岛兄弟：
         前山夫妇上门跪谢 + 父亲"你打也好骂也好"的姿态；
         武岛刚志只能通过信件赔罪，且赔罪信被弟弟一直当作"扯后腿"——
         显示当事人的犯罪是否在监狱中、加害者亲属是否能行动、
         直接影响赔罪是否成为可能的"完成性事件"。
    responders:
      - 绪方先生：在被加害者长期赔罪消耗后选择"让事情结束"
      - 前山夫妇：以行动展示理想的受害者赔罪姿态
      - 武岛直贵：在 ARC-5 中段被前山夫妇触动后才意识到自己的失职
      - 武岛刚志：在 ARC-5 末读到弟弟的断绝信后才意识到自己让弟弟受了多少苦

  - axis_name: "阶层视角下的'歧视的合理化'"
    axis_description: |
      上流（中条家）vs 中产（新星电机平野社长）vs 底层（葛西阳光住宅町谷夫妇）vs 边缘（外国餐厅店长 / 立野）
      ——四个阶层都在以各自的方式合理化对"杀人犯弟弟"的排斥：
      - 上流：用钱断绝 + 要求封口（"这是交易吗"）
      - 中产：用程序调动 + 提供"理论"（平野的歧视必然论）
      - 底层：用口耳传播 + 同情的同时疏远（町谷妻子在公园里告诉其他妈妈）
      - 边缘：用更小心的接触（外国餐厅店长 / 反向歧视）
      这一对比轴的功能：
      让"歧视"不是某个阶层的恶习而是全社会共同的运行机制——
      作者拒绝把任何一个阶层塑造为"开明的庇护者"。

  - axis_name: "兄弟之间 vs 朋友之间的连带责任"
    axis_description: |
      武岛兄弟（血缘连带）vs 寺尾乐队 4 人（朋友连带）vs 由实子（伴侣连带）
      ——三种关系下"连带责任"如何分配：
      - 血缘：直贵不能选择是否承担哥哥的污名，但他可以选择是否切断
      - 朋友：寺尾"以前我从没憎恨过你哥哥，可今天我从心底里生气，要是他在这儿，我肯定要狠狠揍他"——
        显示连带责任在朋友层最容易被引发愤怒
      - 伴侣：由实子选择和直贵共同承担连带，且替他维系兄长通信
      这一轴的功能：
      让读者思考"我们为他人的罪行能 / 必须 / 应该承担多少"这一道德问题。

relationships:
  power_dynamics: |
    本作的权力动态有三层：

    第一层（直贵 vs 哥哥）：
    哥哥犯罪后失去自由，但通过狱中信件持续地"占据"直贵的精神空间——
    每月一封信、每次新工作 / 新住所 / 新关系都被信件追上、
    每个安静下来的时刻都被刚志的存在打破。
    直贵的反抗：停止读信（ARC-3）→ 不告知新地址（ARC-4 起）→
    宣告断绝（ARC-5 末）。
    但权力不对称的根本来源：刚志的犯罪不可改变 + 直贵的血缘不可选择。

    第二层（直贵 vs 各种社会力量）：
    每个 Arc 直贵都从"想被接受"开始，到"被拒绝"结束——
    雇主 > 直贵（招聘审查 / 调动权 / 信任程度）
    恋人家长 > 直贵（财力 / 阶层地位 / 备选女婿）
    邻居 > 直贵（人多势众 / 口耳传播 / 默契排斥）
    幼儿园其他家长 > 直贵（保护自己孩子的合理性）
    在每一对关系中直贵都处于权力弱者位置。

    第三层（同盟 vs 直贵）：
    直贵从未真正被同盟"控制"——
    寺尾的善意 / 仓田的指引 / 由实子的代笔 / 平野的演讲 ——
    这些都是"无权力的同情"，不能改变直贵被排斥的结构性事实。
    例外是由实子——通过婚姻 + 共同子女把直贵嵌入新的家庭结构——
    但这也带来新的连带（实纪的歧视）。

  key_tensions:
    - tension_name: "兄弟之爱 vs 兄弟之恨"
      description: |
        直贵对哥哥的感情终生在两极间摆动——
        被哥哥牺牲（替自己筹学费）的感激 vs 被哥哥拖累（一辈子背负标签）的怨恨。
        每个 Arc 这一张力都被推到不同点位：
        ARC-1 末："你才应该去死"的真心愤怒（在母亲死时）；
        ARC-2 末："要是行的话，我也想揍他"（与寺尾一起）；
        ARC-3 全：完全不读哥哥来信 / 撕碎 / 想忘掉；
        ARC-4 中：发现由实子代笔后部分软化；
        ARC-5 末：写断绝信宣告"你需要接受这一惩罚"；
        尾声：失语 = 承认这一恨意从未真正成立。

    - tension_name: "自我保护 vs 道德正确"
      description: |
        直贵的所有重大选择都是在两者间走钢丝——
        撒谎说哥哥在美国（自我保护）vs 一直没去绪方家（道德失职）；
        扎安全套针孔（自我保护）vs 卑鄙程度的承认（道德崩塌）；
        写断绝信（自我保护）vs 兄弟之爱（道德上不能完全断绝）。
        作者拒绝告诉读者哪个对——
        让两种压力以平衡的方式贯穿全书。

    - tension_name: "由实子的'不再逃避' vs 平野的'独自承担'"
      description: |
        ARC-4 末两个路径合一（由实子的代笔 + 平野的演讲都在帮直贵）；
        ARC-5 中段两个路径分裂（平野第二次否定"堂堂正正"）；
        ARC-5 末直贵选择平野路径（写断绝信 + 搬家隐姓）。
        但由实子在 ARC-5 末仍然说："罪的大小不一样啊"——
        显示她从未真正接受"独自承担"路径。
        这一张力在故事结束时未被解决——
        是夫妻间未来潜在的张力源。

    - tension_name: "想保护实纪 vs 想保留兄弟连接"
      description: |
        在 ARC-5 中段被前山夫妇触发后清晰化——
        '为了保护自己的家人' 成为断绝信的唯一理由。
        但这一保护本身让直贵失去最后一个可以坦白的关系——
        哥哥本来是唯一不会因身份而疏远直贵的人，
        现在连这一关系也被切断。

    - tension_name: "受害者一方 vs 加害者一方"
      description: |
        这一张力的核心：
        加害者亲属即使想赔罪也往往无法找到合适的方式（武岛兄弟）；
        受害者亲属即使收下赔罪也仍然被消耗（绪方先生）；
        而绪方家的拒绝烧香不是出于恨意——
        '杀我母亲的不是你' ——
        反而让赎罪的姿态被进一步取消。
        这一张力的功能：
        让"赎罪"作为一个伦理范畴在本作中无法被完成。

  potential_shifts:
    - shift_name: "兄弟关系的最终重构"
      description: |
        ARC-5 末的双向断绝信（直贵给哥哥 + 哥哥给绪方）让兄弟关系在物理层面终结。
        但尾声的失语证明这一终结只是物理的——
        兄弟之爱在最后被以"不能命名 / 不能宣告 / 不能歌唱"的方式重新确立。
        这一重构是悄无声息的，没有团聚也没有和解——
        但它是真实的、不可逆的、也无法被语言化的。
    - shift_name: "由实子从'同盟'到'妻子'到'未来的潜在反对者'"
      description: |
        ARC-1 末以路人接近直贵 → ARC-2-3 反复出现但未被认真对待 →
        ARC-3 末成为关键策略提供者 → ARC-4 末以代笔者身份升格为伴侣 →
        ARC-5 全程为妻子 → ARC-5 末她未必同意直贵的断绝决定。
        作者把她的潜在反对悬置——
        让读者意识到家庭内部张力仍未解决。
    - shift_name: "受害者绪方家与加害者武岛家的最终隔绝"
      description: |
        ARC-5 末绪方先生'让事情结束吧，一切'——
        显示连受害者也希望这一切被结束。
        而哥哥的'最后一封信'也是最终的告别——
        把两家从'加害者长期赔罪 → 受害者长期收信'的关系中解放出来。
        但这一解放伴随着哥哥意识到自己'让弟弟受了多少苦'的痛悔——
        是真正的'结束'而非真正的'和解'。
    - shift_name: "直贵作为'被歧视者'到'被歧视者也是观察者'的视角转换"
      description: |
        ARC-1 中直贵是纯粹的受害者；
        ARC-3 中开始做卑鄙之事（针孔安全套）= 第一次成为'歧视的执行者'；
        ARC-4 中接受社长'歧视必然论' = 接受自己是观察者；
        ARC-5 中通过前山夫妇看见受害者亲属一面 = 把自己同时定位为受害者 + 加害者亲属；
        尾声中在监狱舞台上意识到自己是镜中的人 ——
        完成从"被歧视的受害者"到"歧视体系中的人之一"的视角转换。
