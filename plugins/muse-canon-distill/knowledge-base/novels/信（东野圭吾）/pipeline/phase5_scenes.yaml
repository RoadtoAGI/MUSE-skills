# Phase 5: 关键场景 — 《信》东野圭吾
# 不逐章列举——只提取结构转折点、高潮、关键建置场景；每个场景必须有明确价值转变

sequence_expansions:
  # ============ 序 ============
  - seq_id: PROLOGUE
    scenes:
      - scene_id: "S01"
        arc_id: ARC-INCITING
        location: 江东区木场 / 绪方家（独居老人豪宅）
        time: 案件当日午后（11 月某日，下午 3 点左右）
        participants: [武岛刚志, 绪方敏江]
        pov: 武岛刚志（全篇唯一以哥哥为 POV 的部分）
        conflict: |
          外部冲突——刚志想偷钱却被老太太撞见 / 刚志想阻止老太太报警；
          内心冲突——'我只是想偷钱，不想伤她' vs '不能让她报警否则会被抓'
        value_start: |
          贫困但仍是清白之人 + 兄弟有未来 +
          老太太对刚志的'你年纪轻轻真了不起'记忆温暖
        value_end: |
          杀人犯 + 兄弟有未来这件事被自己亲手切断 +
          老太太被自己刺杀身亡
        scene_tasks: |
          1. 建立案件的所有事实细节（地点 / 凶器 / 动机 / 失误经过）；
          2. 引入糖炒栗子意象（刚志为弟弟拿栗子返回客厅时遭遇老太太——
             这一'多此一举'让他被抓 + 'spent 在弟弟身上'的兄弟之爱被打上悲剧的烙印）；
          3. 引入大白熊犬死亡的细节（在搬家时还活着 / 一年后犬已死 →
             生命被剥夺早已开始 / 与本作主题'剥夺'呼应）；
          4. 老太太的两次描写形成强烈反差——
             第一次刚志记忆中她'每一道皱纹都透着慈祥' /
             杀她时'嘴还是大声叫喊时的样子，表情也停留在那时的状态'。
        handoff: |
          从刚志的 POV 切到弟弟直贵的 POV（第一章开始），
          通过狱中第一封信无缝衔接。
        beat_direction: |
          作者选择把刚志的犯罪以纯粹经验式细节呈现，不做任何道德评论——
          让读者既看到刚志的可怜（想给弟弟带栗子）也看到刚志的可怕（用螺丝刀刺喉咙）。
          这是后续所有歧视主题的事实基础。
        source_chapter: 序

  # ============ ARC-1 关键场景 ============
  - seq_id: ARC1
    scenes:
      - scene_id: "S02"
        arc_id: ARC-1
        location: 直贵的公寓 → 电话 → 学校
        time: 案件后第二天
        participants: [武岛直贵, 班主任梅村, 电话中的媒体记者]
        pov: 武岛直贵
        conflict: |
          直贵想隔绝外界 vs 外界（媒体 / 班主任）必须强行进入
        value_start: 不能相信 / 不愿面对 / 全身缩成一团
        value_end: |
          '是我哥哥'已被坦白说出 + 接到无数媒体电话 +
          班主任的迟疑暗示直贵的人生已开始改变
        scene_tasks: |
          1. 让直贵第一次被迫说出"是我哥哥"；
          2. 通过梅村'看了早晨的报纸……那事，那个……'的吞吐姿态，
             让读者直接看见'反向歧视'的雏形；
          3. 引入电视画面——刚志的黑白照标'嫌疑犯武岛刚志' →
             从纯私人事件转为公共标签。
        handoff: 直贵决心去学校 → 进入下一场景（学校的疏远）
        source_chapter: 第一章 §1-2

      - scene_id: "S03"
        arc_id: ARC-1
        location: 学校学生指导室 → 直贵的公寓
        time: 案件后约一周
        participants: [武岛直贵, 校长, 年级主任, 班主任梅村, 房地产公司人员]
        pov: 武岛直贵
        conflict: |
          直贵想保留高中生与未来大学生身份 vs
          学校希望他离开 + 房地产公司要他搬走
        value_start: '我不会退学'的坚持
        value_end: |
          '大学就放弃了'的接受 + '今后就你一个人了'的孤独承认
        scene_tasks: |
          1. 校长 / 主任 / 梅村三人之间的微妙立场差异——
             校长想赶他走、梅村想留他、年级主任中立；
          2. 让直贵首次说出'除了暑假和寒假，其他时间不能打工……是吗？' →
             显示制度规则在被歧视者身上的不平等适用；
          3. 房地产公司人员的'温柔但话里藏话'示范了
             '直接歧视'与'反向歧视'的并存；
          4. 结尾直贵的'今后就你一个人了……一个人住这儿过于大了，
             而且过于痛苦'——价值转折确立。
        handoff: |
          直贵接受去东京拘留所首次面会哥哥的通知 →
          下一场景。
        source_chapter: 第一章 §3

      - scene_id: "S04"
        arc_id: ARC-1
        location: 深川警察署讯问室 → 绪方家门口
        time: 案件后第十天
        participants: [武岛直贵, 武岛刚志, 看守警察, 绪方家儿子与孙女（远景）]
        pov: 武岛直贵
        conflict: |
          直贵想质问哥哥'为什么' vs 哥哥无言以对 / 只能哭泣
          + 直贵想去绪方家谢罪 vs 见到死者家属时的本能逃避
        value_start: '哪儿搞错了'的最后一丝幻想
        value_end: |
          直贵向哥哥说'注意身体' +
          意识到自己'像逃兵一样'从绪方家门口逃走
        scene_tasks: |
          1. 兄弟首次面会的失语 ——
             '我干了什么！我，干了些什么！' 与直贵'哥哥是傻瓜！'
             形成第一次情感共振；
          2. 引入'去绪方家谢罪'的悬念 ——
             此线一直拖到 ARC5-SEQ7 才被兑现；
          3. 直贵看见死者儿子与孙女出门的'笑容像因意外灾害失去亲人的人特有的'——
             第一次让读者看见受害者一方的实体面孔；
          4. 'I 逃跑了，像逃兵一样'的自我怨恨——
             为 ARC-5 末的'反正一切都不该被遗忘'埋下种子。
        handoff: |
          直贵决心找工作 →
          通过新工作（废品回收 / 外国餐厅）进入下一阶段。
        source_chapter: 第一章 §4

      - scene_id: "S05"
        arc_id: ARC-1
        location: 外国特色料理店
        time: 直贵在该店工作约 4-5 个月后（2 月底）
        participants: [武岛直贵, 6 名高中同班同学, 店长（大胡子）, 其他客人]
        pov: 武岛直贵
        conflict: |
          直贵努力维持假身份 vs 醉酒同班同学说破真身
        value_start: |
          '可以这样工作下去' + '梅村介绍的工作可信赖' +
          'BJ 之前唯一让我有归属感的工作'
        value_end: |
          身份已被全店听见 + 店长以'信赖关系破裂'为由距离化 +
          常客流失 / 反向歧视让店里气氛改变 → 直贵主动辞职
        scene_tasks: |
          1. 建立同形剥夺事件的第一个完整模板 ——
             '获得 → 被知晓 → 周围气氛改变 → 主动退场'；
          2. 让'反向歧视'第一次清晰展示 ——
             店长不是恶意而是'在经营者立场与一个人正义感之间动摇'；
             客人 A 想说杀人事件被客人 B 制止；
          3. '即便不跟"他"说话会让人觉得奇怪'——
             直贵自己的内心独白把'反向歧视的结构性破坏'语言化；
          4. 直贵主动辞职 + 不要任何挽留 ——
             已开始 internalize 这一退场模式。
        handoff: |
          直贵转去废品回收公司 + 进入宿舍生活 →
          下一阶段（与刚志的拘留所对话 + 与白石由实子的首次接触）。
        beat_direction: |
          这一场景作者全程克制 ——
          不直接评判任何人 / 不渲染直贵的悲愤；
          让结构本身（醉酒说破 + 全店沉默 + 店长沉默地擦桌子）
          成为最锐利的批判。
          这一克制将成为全书的叙述基调。
        source_chapter: 第一章 §6

      - scene_id: "S06"
        arc_id: ARC-1
        location: 东京拘留所探视室
        time: 高中毕业后（3 月底某日大雪天）
        participants: [武岛直贵, 武岛刚志, 看守]
        pov: 武岛直贵
        conflict: |
          直贵想维持'关心哥哥'的姿态 vs
          通过糖炒栗子的对话发现兄弟根本不了解彼此
        value_start: '哥哥是我唯一的亲人' + 想给哥哥带去关心
        value_end: |
          发现哥哥的爱建立在错误记忆上 + 兄弟亲密度的根本不对称 +
          '那样的事情……忘掉了不就好了'的眼泪
        scene_tasks: |
          1. 引入糖炒栗子的回声 ——
             刚志'你最喜欢吃糖炒栗子' / 直贵'错了，喜欢吃的是妈妈，
             我们两人剥皮递给妈妈是想看到妈妈高兴的脸'；
          2. 让兄弟之间的'血缘连接但内心隔绝'第一次被命名 ——
             之前看起来如此相依为命的兄弟，
             竟然不知道对方真正喜欢什么、记得什么；
          3. 30 分钟时长的设计 ——
             '三十分钟对我们来说到底还是有些长'——
             加深兄弟间情感稀薄的痛苦；
          4. 看守在旁记录但'手没怎么动'的细节——
             连第三方都看出对话乏味的尴尬。
        handoff: |
          直贵带着对哥哥关系的根本动摇进入下一个 Arc ——
          这条裂缝会贯穿全书。
        source_chapter: 第一章 §8

  # ============ ARC-2 关键场景 ============
  - seq_id: ARC2
    scenes:
      - scene_id: "S07"
        arc_id: ARC-2
        location: 废品回收公司宿舍 / 仓田的房间
        time: 直贵在废品回收公司约 5-6 个月后
        participants: [武岛直贵, 仓田]
        pov: 武岛直贵
        conflict: |
          直贵的'我已无路'封闭 vs 仓田作为'从下层尝试上升者'的存在示范
        value_start: 对宿舍粗鄙者的厌恶 + 自我封闭
        value_end: |
          意外接受'读书还可以再上一次大学'的可能性 +
          仓田离开后留下高中参考书 + 帝都大学函授小册子
        scene_tasks: |
          1. 让仓田的'我也写过信，给当时交往的女人'与刚志的处境呼应 ——
             同一种孤独 / 同一种被切断的关系；
          2. '别嫌我啰唆，那里面真是寂寞呀，简直要逼人发疯' ——
             代刚志说出无法说出的内心；
          3. 仓田的'帝都大学函授教育部'小册子作为埋伏的礼物——
             让'重新进入主流社会'的可能性以最不可能的方式（一个前科者赠送）实现；
          4. 直贵的'你知道什么？！'的内心反驳 vs 'I 还是把书拿起来' 的行动 ——
             显示自我封闭与希望的角力。
        handoff: |
          直贵报名函授教育部 → 第二章后续（结识寺尾 + 加入乐队）
        source_chapter: 第二章 §2-3

      - scene_id: "S08"
        arc_id: ARC-2
        location: 寺尾约去的卡拉 OK 店
        time: 入学函授教育部 + 加入乐队前的某夜
        participants: [武岛直贵, 寺尾祐辅, 其他乐队成员 3 人, 3 名女粉丝]
        pov: 武岛直贵
        conflict: |
          直贵的'我不能再有梦想'自禁 vs
          唱了一首《想象》后被发现具有声音才华
        value_start: '我没什么可表演的' + 'I 是个被剥夺的人'
        value_end: |
          '下次能来录音室吗？' 的邀请 +
          '没有歧视和偏见的世界'第一次被作为兄弟（乐队）连接的座右铭
        scene_tasks: |
          1. 直贵的选歌 ——
             '过去的老歌也可以吗？而且是外国的' / '约翰·列侬的《想象》' ——
             这首歌成为全书最重要的象征；
          2. 寺尾的态度——发现直贵后即刻邀其加入 ——
             这是直贵首次在主流社会内被'纯凭才能'欢迎；
          3. '陶醉了'——其他成员的反应 ——
             显示直贵真有声音才华，这让后面的剥夺更痛苦；
          4. 第一次以'梦想'作为价值起点 ——
             之前的所有 Arc 都是'生计'层面，
             此处升级到'自我实现'层面，
             为后续剥夺梦想做更高基准。
        handoff: 直贵加入乐队 → 几次成功演奏会 → 经纪人根津出现
        source_chapter: 第二章 §6-7

      - scene_id: "S09"
        arc_id: ARC-2
        location: 直贵的废品回收公司宿舍
        time: 经纪人根津出现后约 1-2 周
        participants: [武岛直贵, 幸田, 敦志, 健一]
        pov: 武岛直贵
        conflict: |
          直贵想留在乐队 vs 三人代根津传达"必须退出"的硬现实
        value_start: |
          '马上就要正式登台演出了' + 与三个伙伴的兄弟情谊 +
          '能开始作为专业的乐队登台'的最高梦想接近兑现
        value_end: |
          '我退出'的接受 + 没有大人物对抗 + 三个伙伴都是低头 +
          直贵明白'连乐队也无法接纳我'
        scene_tasks: |
          1. 让根津的不在场具有更大压迫感 ——
             '根津先生说，不要让祐辅察觉，去说服直贵' ——
             商业理性比直贵想象的还更冷酷；
          2. 三人低头但仍坚持要直贵退出的姿态 ——
             '直贵，原谅我们！'/ '我们都想登台演出啊！' ——
             让读者第一次看见'好人也会因为利益做出排斥'；
          3. 直贵的'这就是成年人干的事吗？！成年人真是不可思议的生物，
             有时候说不能有歧视，有时候又巧妙地推崇歧视'内心独白 ——
             直贵第一次以系统性方式 conceptualize 歧视；
          4. 直贵的'好吧，我明白了……我退出'——
             开始 internalize 退场模式 +
             甚至要替三人编理由对寺尾说。
        handoff: 直贵跟寺尾说退出 → 下一场景
        source_chapter: 第二章 §9

      - scene_id: "S10"
        arc_id: ARC-2
        location: 涩谷某录音室外的街道
        time: 紧接 S09
        participants: [武岛直贵, 寺尾祐辅, 远景的幸田 / 敦志 / 健一]
        pov: 武岛直贵
        conflict: |
          直贵编造退出理由 vs 寺尾的强烈愤怒 + 直贵的良知折磨
        value_start: |
          '只要骗过寺尾就可以' + 把责任由自己承担
        value_end: |
          寺尾愤怒"以前我从没憎恨过你哥哥，可今天我从心底里生气" +
          直贵下跪 + 与音乐生涯 / 与最知心朋友决裂
        scene_tasks: |
          1. 让寺尾爆发地说出"我从心底里生气，要是他在这儿，我肯定要狠狠揍他" ——
             第一次让一个真正理解直贵的人对刚志产生愤怒 ——
             显示'连血缘上的恨意也是被歧视体系强加给亲友的'；
          2. 直贵的"是啊，要是行的话，我也想那么做" ——
             直贵第一次在外人面前承认自己也恨哥哥 ——
             与他后来一直坚持的"哥哥也很辛苦"形成对照；
          3. 跪下的姿态 ——
             与第三章末中条父亲伏地恳求形成对位 ——
             直贵此处的跪是为了让朋友走自己的路而牺牲自尊。
        handoff: |
          直贵转身离开 + 感觉到寺尾的视线但不能回头 →
          进入"独自一人"的下一阶段（第三章开头转入正规课程 + BJ 工作）
        beat_direction: |
          作者让两人在街道而非室内告别 ——
          冷风、距离、彼此的背影 ——
          视觉化他们之间从此横亘的、永远不会愈合的裂缝。
          但此线在第五章末以寺尾邀请慰问演出的方式重新连接 ——
          为尾声的失语提供条件。
        source_chapter: 第二章 §10

  # ============ ARC-3 关键场景 ============
  - seq_id: ARC3
    scenes:
      - scene_id: "S11"
        arc_id: ARC-3
        location: 涩谷餐厅 → 涩谷街道 → 咖啡店
        time: 直贵转正规课程约 6 个月后
        participants: [武岛直贵, 中条朝美, 西冈, 其他参加联谊会的男女学生]
        pov: 武岛直贵
        conflict: |
          直贵的'我不配恋爱'自禁 vs 朝美'我比大家大一岁……一年级几乎没去学校'
          的独特气质对他的吸引
        value_start: '我不会跟联谊会上的女生有任何关系'的封闭
        value_end: |
          直贵主动邀朝美喝茶 + 朝美给手机号 +
          '不过，关于她的记忆，并没有像他期待的那样简单地消失'
        scene_tasks: |
          1. 让中条朝美与之前的女性（白石由实子）形成强对比 ——
             朝美是'看起来另类 / 自带阴影 / 留过级'的'高冷感'女生 ——
             而非由实子那种'阳光主动地关怀型'；
          2. 朝美主动暴露'留级 / 不去学校'的自我贬损 ——
             让直贵感觉'她也是某种程度上的局外人' →
             错觉式地认为'她能接纳我'；
          3. 帮朝美找回钱包的小事 ——
             一个偶然让两人有了多走一段路的理由；
          4. 直贵'要是她拒绝了，就这样分手吧，也没什么遗憾' ——
             保持'我可以随时被抛弃'的低期待 ——
             让后面 ARC3 末的崩塌更具刺痛感。
        handoff: |
          十天后朝美带新前男友来 BJ → 与之分手 →
          两人正式约会开始
        source_chapter: 第三章 §3-4

      - scene_id: "S12"
        arc_id: ARC-3
        location: 田园调布 / 中条家
        time: 与朝美交往约 3-4 个月后（情人节后某周末）
        participants: [武岛直贵, 中条朝美, 中条父亲, 中条京子（母）, 嘉岛孝文]
        pov: 武岛直贵
        conflict: |
          直贵想'被中条家接受' vs 中条家事先安排好的'否定剧本'
        value_start: |
          细致整理头发 / 穿藏青夹克 / 在镜前练习微笑 ——
          '决心被接受'的高紧张
        value_end: |
          饭桌上孝文作为'订婚对象'登场 + 直贵被冷落 +
          孝文车上明示'她是我未来妻子，对她死心吧'
        scene_tasks: |
          1. 通过物质细节展示阶层差 ——
             田园调布的瓷砖围墙 / 二十张榻榻米客厅 + 大理石茶几 +
             皮制沙发 + 母亲淡紫色对襟毛衣 + 父亲银发 + 高尔夫练习 +
             外卖松花堂便当（"不愿动手") / 孝文的蓝色宝马；
          2. 不通过明示而通过细节展示拒绝 ——
             母亲只对孝文的下酒菜热情 / 父亲一开始连头都不抬 /
             京子从一开始就不愿让孩子去朝美房间；
          3. 孝文作为'家族内部解决方案' ——
             '舅舅、舅妈都赞成。与其说赞成，不如说就是他们定的' ——
             显示中条家从未真正考虑过直贵；
          4. 直贵临走时'请替我问朝美好！我再给你电话'被孝文'急加速'打断 ——
             物理动作映射心理状态。
        handoff: |
          直贵跟朝美袒露孝文威胁 →
          决定用'既成事实'方案对抗 →
          下一场景的安全套针孔。
        source_chapter: 第三章 §6

      - scene_id: "S13"
        arc_id: ARC-3
        location: 直贵的公寓
        time: 上次拜访中条家后约 1-2 周（某周日下午）
        participants: [武岛直贵, 中条朝美, 嘉岛孝文]
        pov: 武岛直贵
        conflict: |
          直贵的'让朝美怀孕'阴谋 vs 朝美的'安全套必须用'坚持 +
          孝文意外造访 + 樱花印章明信片识破身份
        value_start: |
          '只要朝美怀孕，中条家就只能接受我' 的算计 +
          扎好安全套针孔的卑鄙
        value_end: |
          强暴尝试失败 + 朝美耳光 + 孝文识破身份 +
          朝美发现安全套针孔 + 朝美愤然离开 +
          直贵被指认为'差劲'
        scene_tasks: |
          1. 让'广岛风味煎饼'的家常场景作为陷阱的伪装 ——
             朝美的'激动 / 撒娇' vs 直贵的算计 + 已扎好的安全套；
          2. 孝文恰恰在直贵手刚伸到朝美裙下时按门铃 ——
             戏剧上的'最不应该的时机'；
          3. 樱花印章作为铁证 ——
             '那个樱花印章，是为了检查用的，是表示已经过审阅的标志' ——
             孝文的医疗器械工作背景为这一识别提供合理性；
          4. 朝美发现安全套针孔的瞬间 ——
             '骗人！是你扎的吧？干吗要那样……'
             '你说啊！让我怀孕，是什么打算？' ——
             直贵被她正面指认；
          5. 朝美的'真差劲儿！'+ '你把我想成什么了' ——
             直贵第一次被自己心爱的女人贴上道德标签 ——
             歧视的伤害已经蔓延到他自己的人格。
        handoff: |
          朝美离开 → 几小时后中条父亲登门 → 下一场景。
        source_chapter: 第三章 §7-8

      - scene_id: "S14"
        arc_id: ARC-3
        location: 直贵的公寓
        time: 紧接 S13（朝美离开后约 2 小时）
        participants: [武岛直贵, 中条父亲（中条）]
        pov: 武岛直贵
        conflict: |
          直贵的尊严（拒绝钱）vs 中条家的彻底封锁（要分手 + 要封口）
        value_start: 直贵的虚脱 / 准备接受被赶走
        value_end: |
          中条伏地恳求 + 信封被退回 + 直贵假装要"四处去散布" +
          见中条扭曲的表情后说"开玩笑" + 接受分手但留下了不归还钱的尊严
        scene_tasks: |
          1. 中条父亲的两面性 ——
             先是威严姿态（'你哥哥的事情以后，你幸福吗？'）+
             后是伏地恳求（'拜托了！请务必听取我们的意见'）——
             显示富人在情势所迫时也能舍弃自尊；
          2. 信封作为本场景的物质核心 ——
             一沓一万日元纸币（应有数十万至上百万），
             直贵从未见过的金额 ——
             用钱补偿羞辱的非常具体化；
          3. 直贵的两次表态反转 ——
             先答应不要钱不分手（中条满意），
             再加'我会四处散布作为反击'（中条扭曲），
             最后'开玩笑，我不会那么做的'（中条迷茫） ——
             直贵把握住短暂的道德主动权后又自己放弃；
          4. '只是得到了本应得到的结果'——
             直贵的自我封闭进一步加深。
        handoff: |
          直贵叫由实子假扮女友躲避朝美 →
          朝美追到由实子住处 → 直贵冷漠拒绝 → 进入第四章。
        beat_direction: |
          作者在两人来回三轮交锋后让直贵主动放弃武器 ——
          这一'主动放弃'本身就是被歧视后的人格弱化的展示。
          直贵此时已经不会再为自己的利益而战 ——
          这一精神状态会延续到第四章。
        source_chapter: 第三章 §8

  # ============ ARC-4 关键场景 ============
  - seq_id: ARC4
    scenes:
      - scene_id: "S15"
        arc_id: ARC-4
        location: 新星电机西葛西分店 / 五层办公室帷幕隔开的空间
        time: 游戏机被盗事件后约 1 个月
        participants: [武岛直贵, 古川刑警, 另一刑警, 总务课长（短暂在场）]
        pov: 武岛直贵
        conflict: |
          直贵想维持'哥哥在美国'的谎言 vs 古川刑警的直觉与压力
        value_start: |
          '这家公司也许能让我撑下去' +
          'I 已经成功隐瞒了' 的自信
        value_end: |
          直贵直说'在监狱里。盗窃杀人罪' +
          意识到'恐怕不能在这家公司继续干下去了'
        scene_tasks: |
          1. 古川刑警的'特殊直觉' ——
             '一开始看你的履历书的时候，不知为什么就感觉不对' ——
             显示职业调查者的本能远超一般人；
          2. 'I 离开吧'的总务课长姿态 ——
             '你怎么想是你的自由。只是希望你记住，
             对于公司职员来说，想回避公司的调动工作是行不通的' ——
             表面民主实则压力；
          3. 直贵的清醒 ——
             '同时，他意识到，他今后恐怕不能在这家公司继续干下去了' ——
             从未天真地以为公司会保护他；
          4. 古川的'这件事，我们不会向公司方面泄露的' /
             直贵的'已经晚了吧'——
             刑警的善意已经无法逆转后果。
        handoff: |
          公司人事部进行调查 → 同事变得反向歧视 →
          直贵被调到仓库 → 社长第一次出现。
        source_chapter: 第四章 §2-3

      - scene_id: "S16"
        arc_id: ARC-4
        location: 新星电机西葛西分店 / 仓库
        time: 直贵调入仓库约 1 周后
        participants: [武岛直贵, 社长平野]
        pov: 武岛直贵
        conflict: |
          直贵的'歧视是不对的'立场 vs
          社长的'歧视是必然的、是需要的'立场
        value_start: '我受到了不公平对待，希望有人为我说话'
        value_end: |
          接受'我哥哥选择了社会性的死亡' +
          接受'蜘蛛网式增加联系'的新生存论 +
          '有抓住别人的心的能力'的肯定
        scene_tasks: |
          1. 社长以最温和姿态说出最锋利的话 ——
             '有歧视是当然的事情。大多数人都想置身于远离犯罪的地方' +
             '排斥犯罪者或者其亲人……可以说是人的自我保护的本能';
          2. 引入"社会性死亡"概念 ——
             '你哥哥可以说像是自杀一样，他选择了社会性的死亡。
             但是，他没有考虑留下来的你会因此多么痛苦' ——
             把哥哥从'纯粹的可怜人'重新定位为'选择了让弟弟受苦的人';
          3. 引入"蜘蛛网式恢复"的解决方案 ——
             '方法只有一个，孜孜不倦地一点一点恢复他与社会的相容性' ——
             这一方案直贵会通过婚姻 / 家庭尝试到 ARC-5 才发现不够;
          4. 引入'写信的人' 悬念 ——
             '不能给你看……写这封信的人拜托我无论如何不能让你知道' ——
             为下一场景揭示由实子代笔做铺垫。
        handoff: |
          直贵感谢由实子的下班路上 → 到她公寓 → 发现信件 → 下一场景。
        beat_direction: |
          这是全书第一次主题被清晰宣讲 ——
          作者借助平野这个温和而智慧的形象 ——
          让一个 dispass 的发言不会被读者直觉地拒绝。
          这一'温和宣讲'手法让歧视必然论比情绪化辩论更难驳倒。
        source_chapter: 第四章 §4

      - scene_id: "S17"
        arc_id: ARC-4
        location: 白石由实子的公寓
        time: 紧接 S16（同一天傍晚）
        participants: [武岛直贵, 白石由实子]
        pov: 武岛直贵
        conflict: |
          直贵的愤怒（由实子背着他通信）vs
          由实子的辩护（'不能给哥哥写信吗？'）+ 父亲赌博破产的自白
        value_start: |
          '我以为我已经成功切断了哥哥' +
          '我以为由实子只是个简单的关心者'
        value_end: |
          由实子'我也讨厌逃避'被听见 + 直贵跪到她面前道歉 +
          兄弟关系实际上一直被由实子维持着 +
          两人关系的实质性深化
        scene_tasks: |
          1. 桌上的'便宜的文字处理机'作为伪装的工具 ——
             由实子小心避免笔迹被识破；
          2. 由实子的'我什么也不写就是会让你哥伤心' ——
             显示她比直贵更懂'兄弟关系是双方的事'；
          3. 由实子的父亲赌博破产 + 逃跑 + 母亲做钟点工 + 自己被寄养 ——
             第一次让由实子的过去也成为 stake；
          4. '我们一直过着东躲西藏的生活，我讨厌逃避了' ——
             由实子的'不再逃避'信念第一次出现 ——
             与社长的'独自承担'路径形成微妙对立 ——
             两人合而为一会在 ARC-5 暴露其内在张力；
          5. 直贵跪下 + 由实子用双手包住他的手 ——
             情感与生理上的结合时刻。
        handoff: |
          直贵与由实子开始同居 →
          由实子怀孕 → 入籍 → 申请公司宿舍 → 进入 ARC-5。
        source_chapter: 第四章 §5-6

  # ============ ARC-5 关键场景 ============
  - seq_id: ARC5
    scenes:
      - scene_id: "S18"
        arc_id: ARC-5
        location: 葛西阳光住宅附近的公园
        time: 直贵一家搬入公司宿舍约 6-8 个月后
        participants: [武岛直贵, 白石由实子, 武岛实纪, 远景的惠美与其母亲]
        pov: 武岛直贵
        conflict: |
          直贵的'我可以独自承担歧视' vs 实纪也被歧视的现实
        value_start: |
          '由实子和我都决定不再逃避' + '小家是稳定的'
        value_end: |
          直贵亲眼看见实纪的朋友被家长拉走 +
          实纪一个人在沙坑做着什么 + '由实子不告诉我是怕我在意'
        scene_tasks: |
          1. 通过'实纪要去公园'的小事让真相浮出 ——
             实纪坚持'要去之前的公园'； 直贵决心带她去；
          2. 让直贵躲在树丛后窥视的视点 ——
             第一次让读者从"被歧视者的子女"角度看见歧视；
          3. '惠美的母亲朝着由实子低头致意后，
             拉着女孩子的手朝相反方向走去' ——
             一个完整的微观社交动作映射宏观结构；
          4. 由实子的'我来守护着实纪，绝不让她受欺负，
             而且我也不想让孩子有自卑感' ——
             重申'堂堂正正'信念 ——
             为社长第二次谈话的否定埋下对位。
        handoff: |
          幼儿园问题继续恶化 → 园长建议换幼儿园 →
          社长视察 + 第二次谈话 → 下一场景。
        source_chapter: 第五章 §2

      - scene_id: "S19"
        arc_id: ARC-5
        location: 新星电机仓库 / 会议室
        time: 公园场景后约 2-3 个月（社长视察当天）
        participants: [武岛直贵, 社长平野（前段）+ 物流课长 / 抢包犯被害的相关人员（后段）]
        pov: 武岛直贵
        conflict: |
          直贵的'我已经做对了所有事' vs 社长'你们走的是容易选择的路'
          + 实纪受伤的突发危机
        value_start: |
          '我有理由抗议' + 期待社长再次肯定自己
        value_end: |
          被否定'堂堂正正' + 实纪受伤的紧急通知 +
          连'独自承担秘密'的方案也被现实击穿
        scene_tasks: |
          1. 社长视察时'笔直走过没看直贵'的细节 ——
             与上次温暖谈话形成强烈反差，让读者也跟直贵一起失望；
          2. 又被叫到会议室 ——
             '怎么啦？表情有些不大高兴似的，是不是有什么话要说呀？' ——
             社长仍然敏锐；
          3. 社长的否定 ——
             '堂堂正正……对你们来说大概是艰难的选择，我却不那么看，
             只觉得你们是走了一条容易理解、容易选择的道路' ——
             把直贵夫妇的策略 demote 为'自我满足';
          4. 直贵刚消化完这一冲击，物流课长跑来说妻子受伤 ——
             理论冲击与现实危机的同时降临 ——
             让直贵无法停下思考来辩驳；
          5. 实纪头部撞伤 + 留疤的不可逆 ——
             第一次让 stakes 上升到'女儿的身体'层面。
        handoff: |
          抢包犯被捕 → 前山夫妇上门道歉 → 直贵触动 → 写断绝信。
        source_chapter: 第五章 §4-5

      - scene_id: "S20"
        arc_id: ARC-5
        location: 直贵家
        time: 实纪受伤后约 1-2 周（抢包犯前山繁和被捕后某晚）
        participants: [武岛直贵, 白石由实子, 武岛实纪（旁边房间）, 前山夫妇]
        pov: 武岛直贵
        conflict: |
          直贵的'歧视是必然的' vs
          前山夫妇'做我没做到的事' （亲自向受害者道歉）的镜像
        value_start: |
          '我们是受害者一方' + '继续按现在方式生活'的接受
        value_end: |
          被前山夫妇触动 + 认识到'我从未去过受害者家'的负罪 +
          当晚写信宣告与哥哥断绝关系
        scene_tasks: |
          1. 前山夫妇带高级水果 + 跪在榻榻米上 + 父亲'你打也好骂也好'的姿态 ——
             把'罪犯亲属如何赔罪'具体化；
          2. 直贵的两点观察 ——
             '至少我做不到。应该说，没做到。我到底一次也没去（绪方家）' /
             '只要自己堂堂正正地做就可以了，这种想法是不对的。
             那只不过是让自己能接受的做法，实际上我们应当选择更为艰难的道路';
          3. 由实子的反应 ——
             '因为，那是……罪的大小不一样啊' ——
             由实子仍然替哥哥辩护 ——
             显示'断绝'是直贵单方面的选择，由实子仍维持'不逃避'信念;
          4. 当晚写断绝信 ——
             信的全文被作者插入引用 ——
             '要说理由，只有一条，为了保护自己的家人' /
             '让你了解我们的这些痛苦，也是你应该接受的惩罚。
             要是不知道这些事情，你的刑期是不会结束的' ——
             这封信是直贵情感最锐利的表达，也是他对哥哥最重的指控。
        handoff: |
          辞职 + 社长第三次谈话 + 搬家 → 寺尾邀慰问演出 →
          直贵去绪方家 → 下一场景。
        beat_direction: |
          作者把'前山夫妇上门 + 直贵写断绝信'放在同一夜 ——
          让读者意识到这一断绝不是冷静的决断而是被另一对父母的姿态触发的情感反应。
          这一'被触发'让断绝行为既有道义重量也有情感真实。
        source_chapter: 第五章 §6

      - scene_id: "S21"
        arc_id: ARC-5
        location: 木场 / 绪方家
        time: 搬家 + 寺尾邀演后约 1-2 周（某周六下午）
        participants: [武岛直贵, 绪方先生（绪方敏江之子）]
        pov: 武岛直贵
        conflict: |
          直贵的'我来烧香完成最后赎罪' vs
          绪方的'我让你看一束信，让你明白真正的赎罪从未开始'
        value_start: |
          '我应该烧炷香表示哀悼' + '完成自己的责任就可以结束这一切'
        value_end: |
          被拒绝烧香 + 读哥哥多年赔罪信 + 收到哥哥最后一封信 +
          意识到'兄弟之爱以另一种方式从未停过'
        scene_tasks: |
          1. 绪方家已改建 ——
             '一直到三年前，我们都住在别的地方' ——
             显示案件的次生伤害绵延 10 年；
          2. 绪方拒绝烧香的理由 ——
             '不要误解，那不是因为恨你，倒不如说是相反。
             你跟那件事没有任何关系，杀我母亲的不是你' ——
             受害者一方的智慧 ——
             否定了直贵之前所有'代哥哥赎罪'的自以为正确；
          3. 揭示哥哥的赔罪信 ——
             '从进监狱之后每个月，大概从没有间断过' ——
             读者第一次知道刚志一直在赔罪 + 这条线之前完全隐藏；
          4. 绪方的内心独白 ——
             '这对他来说，就像是《般若心经》一样，只要我这边不叫停，
             他就会永远继续下去' ——
             受害者也被加害者的赔罪长期消耗；
          5. 拿出'最后一封信' ——
             '这是他的最后一封信。看了这封信，我下了决心，该让事情结束了' ——
             这封信在尾声才被直贵读出全文。
        handoff: |
          直贵带着哥哥的最后一封信回家 →
          决定接受寺尾的慰问演出邀请 →
          尾声场景。
        beat_direction: |
          作者把绪方家这一场景放在断绝信之后 ——
          让直贵以为'已经结束了'的状态被打破 ——
          让读者明白'断绝'本身并不等于'结束'。
          为尾声的失语提供最深的内在准备。
        source_chapter: 第五章 §9

  # ============ 尾声 ============
  - seq_id: EPILOGUE
    scenes:
      - scene_id: "S22"
        arc_id: ARC-EPILOGUE
        location: 千叶监狱 / 体育馆舞台
        time: 去绪方家约 1 个月后
        participants: [武岛直贵, 寺尾祐辅, 警官, 武岛刚志（观众席中合掌的身影）, 大批服刑者]
        pov: 武岛直贵
        conflict: |
          直贵的'唱完这首歌作为对哥哥的告别' vs
          看见哥哥忏悔颤抖时身体的失语反应
        value_start: |
          '让哥哥看见弟弟的样子，这是最后一次了'的决心 +
          已经接受'独自承担秘密'的生存论
        value_end: |
          张嘴却发不出声音 + '怎么也发不出声音' +
          '没有歧视和偏见的世界'终究只是《想象》
        scene_tasks: |
          1. 寺尾的现实主义提醒 ——
             '今天不许让观众情绪过于高涨，关键是唱的歌要能唱进对方的心里' ——
             与第二章寺尾'好好想象一下，没有歧视和偏见的世界'形成对照 ——
             寺尾自己也成熟了；
          2. 监狱体育馆的'鸦雀无声' ——
             与一般演奏会的嘈杂形成质感上的对比 ——
             让读者感到这不是普通演出而是接近宗教仪式的事件；
          3. 服刑者们'目光中充满了期待和好奇 / 闪烁着羡慕，
             甚至接近妒忌的光芒' ——
             显示监狱里的人也有完整的人格——
             重新人性化加害者一方；
          4. 直贵环视座席找哥哥 ——
             '同样的服装、同样的发型，很难一下子找到' ——
             加害者们的均质化与去个性化；
          5. 找到哥哥的瞬间 ——
             '把两个手掌合在胸前，像是在忏悔，又像是在祈祷，
             甚至能感觉到他在微微地颤抖' ——
             哥哥最后一次实体出现，且不通过对话而通过姿态；
          6. 内心独白 ——
             '哥哥，我们为什么要生到这个世上来呢？
             哥哥，我们会有幸福的那一天吗？
             我们在一起交谈，就像我们两个给妈妈剥栗子时那样——' ——
             糖炒栗子意象在最后一次回声中重写为'两人一起的童年';
          7. 失语 ——
             '直贵终于张开嘴，准备唱。可是，发不出声音来。
             怎么也发不出声音' ——
             整本书以这两句结束 ——
             不解释、不解决、不给出未来。
        handoff: |
          无 handoff —— 故事终结。
          井上梦人解说将"镜子"转向读者：
          "几乎所有的人，都认为自己和歧视什么的无关……
          那么，这个镜子里映出来的，究竟是谁呀？"
        beat_direction: |
          这是全书最关键的写作决策 ——
          作者拒绝以任何"动作"结尾 ——
          不让直贵唱完歌 / 不让兄弟见面拥抱 / 不让审判 / 不让和解。
          只有"发不出声音"——
          一种最非戏剧的结尾，却是最戏剧的内心爆发。
          技术上：用钢琴前奏的"反复弹奏"作为时间停滞的工具 ——
          让读者也跟直贵一起停在那个瞬间。
        source_chapter: 尾声

tension_curve:
  description: |
    全书张力曲线呈"5 个波峰递增 + 1 个终极静止波"模式 ——
    每个 Arc 都是一个独立波峰，且波高递增；
    最终在尾声以"非动作"的方式完成最大张力释放（失语）。

    详细：
    序：S01 案件爆发 = 中等高度波（突发但被作者克制）
    ARC-1：S02-S06 = 低 → 中波（适应期，主要建立模板）
    ARC-2：S07-S10 = 中 → 高波（梦想被剥夺，第一次高峰）
    ARC-3：S11-S14 = 高波（爱情 + 上升梦想被剥夺 + 自己变卑鄙）
    ARC-4：S15-S17 = 高 → 中波（被歧视论收编 + 由实子结合带来希望）
    ARC-5：S18-S21 = 高 → 极高波（家庭被侵蚀 + 实纪受伤 + 绪方家真相）
    尾声：S22 = 张力突然变为"内向" + 时间停滞 = 非剧烈但极深的最终波

  peaks:
    - S05  # ARC-1 高潮：餐厅同学说破身世
    - S10  # ARC-2 高潮：跟寺尾跪别
    - S13  # ARC-3 关键转折：孝文识破 + 朝美发现安全套针孔
    - S16  # ARC-4 第一主题宣讲：社长仓库谈话
    - S20  # ARC-5 高潮：前山夫妇上门 + 直贵写断绝信
    - S21  # ARC-5 终幕：绪方家拿出哥哥的赔罪信
    - S22  # 尾声 / 全书终极高潮：失语
  valleys:
    - S07  # 仓田留小册子（短暂希望低谷）
    - S08  # 第一次唱《想象》（短暂幸福低谷）
    - S11  # 联谊会遇朝美（短暂期待低谷）
    - S17  # 由实子代笔被发现 + 结合（情感低谷意义上的温暖时刻）

