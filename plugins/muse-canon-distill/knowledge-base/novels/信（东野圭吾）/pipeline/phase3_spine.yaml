# Phase 3: 脊椎 — 《信》东野圭吾
# 从高潮回溯：尾声唱不出《想象》的失语 → 反推欲望、戏剧问题、Arc 框架

inciting_incident:
  description: |
    序中刚志入室盗窃绪方家被老太太当场撞见，因腰痛跑不动，
    用螺丝刀刺死绪方敏江，逃出公园被警察捕获——
    武岛直贵的人生在这一刻被永久打上「杀人犯弟弟」的标签。
  type: accident   # 刚志本不打算杀人；属于事故型而非主角的决定
  timing: 故事开篇即发生（序，行 60-260）；占全书约 3% 的篇幅
  balance_before: |
    武岛兄弟相依为命——母亲过劳死后，哥哥刚志当体力劳动者养弟弟，
    弟弟直贵考入竞争率最高的公立高中，正在准备升大学。
    两人贫困但有彼此、有未来。
  balance_after: |
    哥哥成为「盗窃杀人犯」并被判 15 年监禁，
    弟弟成为「盗窃杀人犯的弟弟」——
    这一身份将贯穿弟弟的一生，并通过媒体公开、户籍、雇主调查、
    邻居耳口传播等社会机制反复在新环境中暴露。
  impact_on_protagonist: |
    直贵从"贫穷但有未来的高中生"变成"被房地产公司逼迁、
    被学校劝转学、找不到正规工作、必须放弃大学梦想、
    必须撒谎或承担标签的下层青年"。
    更深远的影响是：他每一次重新建立社会位置（朋友 / 工作 / 爱情 / 婚姻 / 家庭）
    都将被这一标签再次摧毁。

desire_object:
  conscious: |
    在一个没有人知道自己是"杀人犯弟弟"的社会位置里堂堂正正地活下去——
    上大学、有正式工作、有爱情、有家庭、有体面的邻里关系。
  unconscious: |
    既被血亲所爱又被社会接纳，让哥哥的牺牲不白费、
    让自己不必在"血亲"与"社会"之间二选一——
    即"既不背叛哥哥也不被社会排斥"的两全状态。
  tension: |
    意识层的"堂堂正正活下去"在反复挫败后趋向"隐姓躲避"，
    但潜意识的"两全愿望"使他无法真正断绝兄长——
    最终他主动断绝了通信，但尾声证明他从未在心里断绝。
    这一意识 / 潜意识的撕裂是本作的核心情感引擎。

spine_statement: |
  武岛直贵在哥哥成为杀人犯之后，反复尝试重建社会位置都被剥夺，
  最终选择主动断绝兄弟关系并隐姓搬家以保护新家人；
  但在与哥哥最后一次精神相会的舞台上，他失语——
  「没有歧视和偏见的世界」终究只是《想象》。

spine_type: conscious
spine_type_note: |
  直贵的欲望（重建社会位置）是自觉的、明确的、可被语言化的；
  虽然主控思想最终揭示的是潜意识层（兄弟之爱无法真正断绝），
  但脊椎本身是由意识层的欲望驱动——
  每个 Arc 直贵都明确知道自己在追求什么（上大学 / 加入乐队 / 与朝美在一起 / 在新星电机站稳脚 / 保护妻女）。

dramatic_question:
  question: |
    武岛直贵能否在"杀人犯弟弟"的标签下，
    重建一个被社会接纳、不被剥夺、可堂堂正正活下去的人生？
  obligatory_scene: |
    必须出现的回答场景是「直贵在大众面前 / 关键社会成员面前
    直面"杀人犯弟弟"身份的瞬间」——
    本作以 5 次同形剥夺事件作为这一必须场景的反复变奏，
    最终在尾声以"在哥哥面前的舞台上失语"作为最终回答：
    无法。但失语本身也是一种回答。

opposing_forces:
  internal: |
    1. 对哥哥的血缘感情与负罪感——刚志的犯罪是为了筹直贵的学费，
       直贵深知这一点，所以无法纯粹地恨哥哥；
    2. 对"堂堂正正"的自尊——使他在前 4 个 Arc 拒绝彻底躲藏；
    3. 对家庭责任的最终优先——第 5 个 Arc 让他终于压过自尊去断绝。
  personal: |
    1. 直接歧视者：江上等高中同学（小心翼翼地疏远）、中条父亲（用钱断绝）、
       中条孝文（看破并威胁）、新星电机刑警与人事部（履历审查）、
       町谷夫妇（搬入并传播）、幼儿园其他家长（不让孩子接近实纪）。
    2. 反向歧视者：外国餐厅店长（"有些事还是隐藏起来好"）、
       新星电机野田 / 河村（更客气但不再亲近）、
       新星电机社长平野（公开论证"歧视是必然的"）。
    3. 同盟与启示者：班主任梅村（半 helpful）、宿舍仓田（留下大学函授小册子）、
       寺尾祐辅（音乐知己 + 最后邀慰问演出）、白石由实子（同盟 + 妻子）、
       平野社长（"独自承担秘密"的另一种道路）。
    4. 不在场的核心角色：哥哥刚志（信件 + 尾声短暂出现）、
       受害者绪方家（绪方先生在第五章末出现 + 一束哥哥写给他的赔罪信）。
  external: |
    日本社会的标签机制——
    媒体公开姓名 / 户籍验证 / 雇主背景调查 / 监狱通信检查（樱花印章）/
    邻居耳口传播 / 公司宿舍同事邻居重叠 /
    "亲属犯罪 → 影响个人形象 → 不该录用"的普遍社会共识。
    这些不是任何具体反派而是社会运行的客观规则。

# ── 幕/Arc 框架（从高潮回溯：故事需要几个重大逆转？）──

arcs:
  - arc_id: ARC-1
    name: "失工 / 失家 / 失大学梦"
    value_at_start: "贫困但有母亲遗愿支撑、即将上大学的高中生 + 有兄长"
    value_at_end: "高中毕业、住单身宿舍、放弃大学、做废品回收工 + 兄长在狱"
    climax_event: "外国餐厅醉酒同学说出'他哥是杀人犯' → 店里气氛改变 → 直贵被迫辞职"
    function_note: |
      建立"同形剥夺"模板——
      获得某个社会位置 → 哥哥身份意外暴露 → 周围气氛改变 → 被迫退出。
      这是后续 4 个 Arc 都将复制的结构。

  - arc_id: ARC-2
    name: "音乐梦想的崛起与崩塌"
    value_at_start: "考入帝都大学函授教育部 + 偶然加入乐队'宇宙光' + 在录音室找到归属"
    value_at_end: "退出乐队 + 失去音乐人生路 + 与最知心朋友寺尾决裂"
    climax_event: |
      经纪人根津调查到直贵哥哥身份 →
      乐队三人来宿舍要求直贵主动退出 → 直贵跟寺尾摊牌跪别
    function_note: |
      第一次显示：连"创造性"的、艺术性的、主流社会之外的领域
      也同样遵循歧视的法则——商业利益必定优先于个人友谊。
      梦想被剥夺比生计被剥夺更深一层。

  - arc_id: ARC-3
    name: "上升婚恋的诱惑与终结"
    value_at_start: "转入大学正规课程 + 与中条朝美（上流千金）相爱 + 在 BJ 酒吧工作"
    value_at_end: "被中条父亲付钱中止 + 主动叫由实子假扮女友隔绝朝美 + 重新陷入孤独"
    climax_event: |
      中条孝文从樱花印章识破哥哥身份 → 中条父亲登门递信封"接受这个" →
      直贵接受分手但拒绝钱 → 朝美再来求结合时直贵冷漠拒绝
    function_note: |
      第一次让直贵自己也成为"做卑鄙之事的人"——
      他扎安全套针孔欲让朝美怀孕造既成事实，
      这一行为揭示他已经被歧视腐蚀到自己也无底线。
      此 Arc 让"歧视的伤害是双向的"主题得以建立。

  - arc_id: ARC-4
    name: "职业重建与新家庭的形成"
    value_at_start: "进新星电机西葛西分店 + 电脑卖场 + 表面正常的公司职员生活"
    value_at_end: "被调入仓库 + 接受社长'歧视必然论' + 与白石由实子结合并组建家庭"
    climax_event: |
      游戏机被盗事件 → 古川刑警查到哥哥身份 → 公司调查 → 调动到仓库 →
      社长平野到仓库与直贵长谈"歧视是当然的、要重新增加与他人联系的线" →
      直贵回到由实子处发现她长期代笔回复哥哥来信
    function_note: |
      给主角第一个真正的"出路理论"——社长的演讲是全书主题第一次清晰化。
      同时由实子的代笔揭示"还有人在替你维护那份血亲连接"，
      为最终的"断绝信"反衬出更大的痛感。

  - arc_id: ARC-5
    name: "家庭被侵蚀 → 主动断绝"
    value_at_start: "公司宿舍葛西阳光住宅 + 与由实子婚姻 + 女儿实纪 + 平稳生活"
    value_at_end: "辞职 + 搬家隐姓 + 写信宣告与哥哥断绝兄弟关系"
    climax_event: |
      实纪在幼儿园被排斥 + 由实子带实纪骑车被抢包犯撞伤实纪头部 +
      抢包犯父母上门道歉 → 直贵被触动"他们做得到向受害者道歉，我从未做到过" →
      第二次社长平野谈话否定"堂堂正正" →
      直贵当晚写信宣告与哥哥断绝
    function_note: |
      最终的不可逆逆转——
      不再是被动失去，而是主动割断；
      并通过去绪方家烧香 + 读哥哥写给绪方的"最后一封信"
      达成与"受害者一方 + 加害者一方"的双重交代。
      Arc 内嵌的高潮：抢包犯父母上门成为直贵自身的镜子。

story_climax_design:
  crisis:
    dilemma: |
      在监狱舞台上面对忏悔颤抖的哥哥，应该唱出这首两人共同的《想象》
      （"没有歧视和偏见的世界"）作为对哥哥的最后告别 ——
      还是承认自己从未真正在心里断绝兄长、
      承认"没有歧视的世界"只是想象、自己仍困在血缘的负重里？
    option_a: |
      唱出《想象》——
      把"想象的世界"献给哥哥，作为兄弟之间的最后默契；
      象征"我已经在新的人生里活下去了，你的牺牲没有白费"。
    option_b: |
      唱不出来——
      承认这首歌的所有词都是谎，自己从未离开兄长、
      自己的"断绝"是被现实逼出的妥协而非真正的解脱。
    character_revelation: |
      直贵选择了 option B（被身体选择，而非主观决定）——
      失语揭示他真实的人物性格：
      他一生反复声称的"理性接受"其实从未到达心底，
      他始终是那个想给妈妈剥栗子的小弟弟。
      血亲的爱与社会的隔绝在他身上从未真正调和。

  climax:
    action: |
      直贵张嘴想唱，但发不出声音；
      眼里看见哥哥在观众席合掌颤抖；
      钢琴前奏反复，直贵僵在麦克风前。
    value_change:
      from: "通过主动断绝实现的（残缺的）社会接纳"
      to: "被无言哀伤击穿的、不能宣告完成的、永远悬置的两难"
    controlling_idea_expression: |
      主控思想通过"失语"得到表达：
      犯罪带来的代价是无法在歌声中宣告"完成"的，
      "歧视是必然的"这一接受不能让人内心真正脱罪，
      只有在哥哥与弟弟双方都意识到这一现实并各自承担时，
      才能在悲剧的余味中找到一种残缺的、不能命名为"救赎"的安息。
      ——讽刺型 controlling idea 的典型呈现。

  resolution:
    new_balance: |
      没有传统的"new balance"——
      故事在直贵失语的瞬间结束，没有展示他之后如何回到家庭、
      没有展示哥哥之后如何回应，
      留下一个悬置的、未完成的状态作为终点。
    lingering_feeling: |
      悲伤、无言、被理解的孤独、对自身道德选择的不确定、
      对"没有歧视和偏见的世界"这一可能性本身的悼念。
      并伴随作者通过井上梦人解说传达的更深余味：
      作为读者的我们也是这镜子里的人——
      我们日常生活中也在做与中条家、町谷夫妇、新星电机人事部
      相同的选择，只是我们从未意识到。
