# 《白鹿原》Phase 2: 人物系统设计图
# 只记角色之间的关系，不记个体画像（个体画像在 characters/*.md）

cast_overview:
  protagonist: 白嘉轩  # 双主角之一：传统秩序的维护者
  antagonist: >
    鹿子霖（双主角之二/直接对手）+ 时代变迁（终极对抗力量）。
    鹿子霖是人格化的对手，时代是不可人格化的碾压力。
  supporting_cast:
    - name: 朱先生
      function: 精神灯塔——传统儒学的化身，白鹿原的道德坐标。每次出场都是精神维度的锚点
    - name: 黑娃（鹿兆谦）
      function: >
        全书最完整的个人弧光载体——从长工之子到革命者到土匪到儒生到冤死，
        他的命运是全书主控思想的注脚：学好了也不一定被容得
    - name: 田小娥
      function: >
        欲望暗线的承载者 / 传统秩序的受害者与解构者。
        活着时是各方势力的工具，死后是秩序的复仇者
    - name: 白孝文
      function: >
        投机者原型——从族长继承人到堕落者到新政权掌权者，
        他的成功是对"仁义"的终极反讽
    - name: 白灵
      function: >
        女性反叛者——对传统秩序的正面否定。
        她的被活埋证明革命也吞噬自己的儿女
    - name: 鹿兆鹏
      function: 革命线的推进者——地下共产党员，串联白鹿原与外部革命世界的纽带
    - name: 鹿兆海
      function: 理想主义的牺牲品——国民党军人，死于内战而非抗日，揭开政治谎言
    - name: 鹿三
      function: >
        传统秩序的底层执行者——以长工身份忠于白家，
        杀田小娥是底层对秩序的暴力维护，精神崩溃是维护的代价
    - name: 冷先生
      function: 中间人/调和者——白鹿两家的桥梁，每次危机中的技术性解决者
    - name: 吴仙草
      function: 传统贤妻的化身——沉默、坚韧、不争，她的死标志白嘉轩失去最后的情感支撑
    - name: 田福贤
      function: 国家暴力在乡村的代理人——每次政治清洗都由他执行
    - name: 白赵氏
      function: 家族母权的执行者——从催婚到借种求子，维护白家血脉延续的隐形力量
    - name: 朱白氏
      function: >
        圣人遗产的守护者——朱先生辞世后唯一能执行遗嘱、
        抵挡所有吊孝者的人。她对丈夫的理解深度超过所有人
    - name: 高玉凤
      function: >
        黑娃"学好"的证据与延续——秀才之女嫁给前土匪，
        黑娃死后接受"寻兆鹏"遗嘱，承接最后的希望

# ── 对比轴 ──
contrast_axes:
  - axis: 仁义 vs 权谋
    characters: [白嘉轩, 鹿子霖]
    description: >
      面对同一挑战（土地、面子、后代），白嘉轩选择制度化的道德路径（祠堂、乡约），
      鹿子霖选择人情化的权谋路径（贿赂、色诱、间接操控）。
      两条路都有代价——白嘉轩终于残破但精神完整，鹿子霖终于疯死

  - axis: 坚守 vs 投机
    characters: [白嘉轩, 白孝文]
    description: >
      父子对比——父亲一生坚守仁义，儿子从堕落到投机都选择利益最大化。
      最终投机者坐在主席台上，坚守者在台下失去左眼

  - axis: 反叛的不同道路
    characters: [黑娃, 白灵, 鹿兆鹏]
    description: >
      三个年轻人都反叛了白鹿原的传统秩序，走上了三条不同的路：
      黑娃（本能/暴力/最终回归），白灵（信仰/献身/被活埋），
      鹿兆鹏（理性/组织/幸存但下落不明）

  - axis: 秩序的维护者 vs 秩序的受害者
    characters: [鹿三, 田小娥]
    description: >
      公公与儿媳——鹿三以传统道德的名义杀死田小娥，
      但杀人后精神崩溃，田小娥鬼魂反噬；
      维护者与受害者互相摧毁

  - axis: 精神与世俗
    characters: [朱先生, 白嘉轩]
    description: >
      朱先生是纯粹的精神权威（不掌实权），白嘉轩是世俗权威（族长）。
      朱先生可以超然辞世，白嘉轩必须在废墟中继续活着

  - axis: 冷热之间
    characters: [冷先生, 鹿子霖]
    description: >
      两个看似面冷/面热的人：冷先生面冷心热（倾家荡产救女婿），
      鹿子霖面热心冷（以关切之名占有小娥）。"热"与"冷"的真假错位

  - axis: 女性的沉默与声音
    characters: [吴仙草, 田小娥, 朱白氏]
    description: >
      三种女性沉默：仙草以行动替代语言（沉默的贤妻），
      小娥活着时被剥夺声音（死后才借鬼魂控诉），
      朱白氏选择性沉默（平日嗔怪，危机时刻一句话定乾坤）

# ── 关系网 ──
relationships:
  power_dynamics: >
    白嘉轩（族长/道德权威）与鹿子霖（乡约/实权人物）形成表面合作、
    暗中博弈的权力双头结构。朱先生是超然的精神仲裁者，
    冷先生是技术性中间人。田福贤/岳维山代表外部国家权力的渗入。
    解放后权力结构彻底翻转——白孝文（投机者）取代了一切旧权威

  key_tensions:
    - 白嘉轩 vs 鹿子霖：百年家族恩怨（始于换地原罪）
    - 白嘉轩 vs 白孝文：仁义秩序 vs 投机主义（父子间无法调和）
    - 白嘉轩 vs 白灵：传统父权 vs 女性觉醒（以决裂告终）
    - 黑娃 vs 鹿三：反叛之子 vs 忠诚之父（田小娥之死将两者彻底撕裂）
    - 鹿子霖 vs 鹿兆鹏：权谋之父 vs 革命之子（永不相容的价值观）
    - 白灵 vs 鹿兆海：国共阵营的爱情悲剧（以铜元定各自政党）

  potential_shifts:
    - 白孝文从堕落者到掌权者（全书最大的人物位置逆转）
    - 黑娃从反叛者到回归者到被冤杀者（最完整的弧光也是最讽刺的结局）
    - 鹿三从忠诚长工到弑媳者到精神崩溃者（维护秩序的极端代价）
    - 田小娥从活人到鬼魂（权力关系在死后反转——她终于有了声音）
