# 《白鹿原》Phase 0: 构想
# 逆向分析 — 从结局回溯前提与主控思想

premise: >
  如果一个传统宗族的族长穷其一生维护"仁义"秩序，却在半个世纪的革命与动荡中
  目睹这一秩序被自己的后代、仇敌和时代本身反复碾碎，将会发生什么？

core_value:
  positive: 仁义（宗法道德秩序、传统伦理的尊严与庇护）
  negative: 权欲（背叛、投机、以暴力和诡计攫取利益）
  spectrum:
    contradictory: 虚伪的仁义（以仁义为面具行私利，如白嘉轩换地、白孝文投机）
    contrary: 冷漠（对他人命运的无动于衷，如白孝文坐视黑娃被杀）
    negation_of_negation: >
      以仁义之名行毁灭——白嘉轩用族规惩罚孝文是维护秩序，
      鹿三杀田小娥是维护道德，但每一次"正义"的行使都在制造新的悲剧

controlling_idea:
  value: >
    仁义秩序终究无法抵抗历史的碾压，但坚守者本身获得了某种超越时间的尊严
  cause: >
    因为传统秩序建立在封闭的宗法社会之上，当革命浪潮一轮又一轮地冲击，
    秩序的维护者（白嘉轩）只能在废墟中向对手认罪，而秩序的投机者（白孝文）
    反而成为新时代的掌权者
  full_statement: >
    当以"仁义"为核心的传统秩序遭遇现代革命的反复碾压，
    坚守者虽能保全精神尊严，却无法阻止自己亲手建造的一切化为齑粉——
    因为历史不以个人道德为转移，而道德本身也并非无瑕。
  type: ironic  # 白嘉轩既是仁义的化身也是原罪的制造者（换地），结局既有尊严又有惨败

genre:
  primary: 家族史诗（编年体）
  secondary: 现实主义 / 魔幻现实主义
  conventions:
    - setting: 封闭的乡村社会，跨越多个历史时期
    - characters: 族长、地主、长工、革命者、知识分子——多代际多阵营
    - events: 家族兴衰、政治运动、战争、饥荒、瘟疫
    - values: 土地/血脉/宗族荣誉 vs 革命/个体解放/权力更迭

originality_statement:
  unique_angle: >
    以两个家族的百年恩怨为经、以半个世纪中国革命史为纬，
    在"白鹿原"这一封闭空间内浓缩整个民族的命运——
    不站在任何一方（传统/革命/国/共），让每条道路都走到自身的逻辑终点
  cliches_to_avoid:
    - 避免了将传统简单丑化或美化——白嘉轩既高大又有原罪
    - 避免了革命叙事的二元对立——国共双方的人物都有完整的弧光和悲剧
    - 避免了"大团圆"或"正义终将胜利"——结局是两败俱伤的苍凉

style_directives:
  - 全知叙事，但保持冷峻克制，不做道德判断
  - 关中方言大量入文，角色声音高度辨识
  - 魔幻元素（白鹿意象、鬼魂附身、预言）自然嵌入现实
  - 性描写直接坦率，用于揭示权力关系和人物本质
  - 时间跨度大但节奏密集——每章都有至少一个重大事件

word_count: 460000
