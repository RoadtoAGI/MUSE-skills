# 《白鹿原》Phase 3: 故事脊椎 + Arc 框架
# 逆向分析 — 从高潮回溯激励事件与因果链

# ── 激励事件 ──
inciting_incident:
  description: >
    白嘉轩在雪地偶见白鹿精灵的幻象，由此确信风水宝地在鹿家慢坡地中，
    遂以"苦肉计"骗鹿子霖之父以好地换坏地，将父坟迁至其上（第2-3章）
  type: decision  # 白嘉轩主动谋划的欺骗行为
  timing: 第2-3章，故事开头约5%处
  balance_before: >
    白鹿两家世代为邻，虽有竞争但大体和平共处；
    白嘉轩连死六妻，家道暗淡
  balance_after: >
    白家从此"时来运转"（七房仙草活下来、子嗣兴旺、族长权威确立），
    但原罪已种——白嘉轩心知他一生最见不得人的事就是这桩换地
  impact_on_protagonist: >
    白嘉轩获得了族长权威的物质基础（风水庇佑），
    但也背负了一生的道德债务——这个秘密直到结局才向痴呆的鹿子霖坦白

# ── 欲望对象 ──
desire_object:
  conscious: >
    维护白鹿原的"仁义"秩序——兴建祠堂、推行乡约、惩恶扬善、
    让白鹿村成为道德楷模
  unconscious: >
    赎偿换地的原罪——白嘉轩一生的仁义行为，
    在某种程度上是对自己最初不仁不义的补偿
  tension: >
    越是坚守仁义，换地的原罪就越沉重；
    越是维护秩序，时代的冲击就越显出秩序的脆弱

# ── 故事脊椎 ──
spine_statement: >
  白嘉轩竭尽一生维护白鹿原的传统宗法秩序，
  但历史的洪流一轮又一轮地冲刷，直到他独眼面对废墟
spine_type: unconscious  # 他自觉追求"仁义"，不自觉地在赎罪

# ── 戏剧问题 ──
dramatic_question:
  question: >
    白嘉轩能否守住白鹿原的"仁义"秩序？
    这个秩序本身是否值得守护？
  obligatory_scene: >
    白嘉轩必须在"仁义"秩序彻底崩塌的时刻做出最终选择——
    结局中他独眼面对痴呆的鹿子霖，坦白换地原罪："我对不住你"

# ── 对抗力量 ──
opposing_forces:
  internal: >
    换地原罪带来的道德负担；
    对"面子"和族长权威的执念使他无法真正放手
  personal: >
    鹿子霖的报复（借田小娥毁掉白孝文）；
    白孝文的堕落与后来的投机背叛；
    白灵的出走与牺牲
  external: >
    辛亥革命、军阀混战、国共分裂与清党、土匪劫掠、
    抗日战争、解放战争、土地改革——
    每一次政治地震都在瓦解传统秩序的根基

# ── 幕/Arc 框架（由重大价值逆转定义）──
arcs:
  - arc_id: ARC-1
    name: 秩序的建立
    value_at_start: 混乱/衰微（白嘉轩六妻皆死，家道暗淡）
    value_at_end: 秩序/权威（祠堂建成，乡约推行，"仁义白鹿村"）
    climax_event: >
      朱先生孤身劝退清军二十万，辛亥反正后将《乡约》交给白嘉轩，
      白鹿原传统秩序达到最高点（第6章）
    function_note: >
      建置弧——确立白嘉轩的权威、朱先生的精神地位、白鹿两家的基本格局

  - arc_id: ARC-2
    name: 革命的冲击
    value_at_start: 秩序/安宁（乡约治理下的白鹿村）
    value_at_end: 翻天覆地/暴力（清党屠杀，秩序第一次被外力粉碎）
    climax_event: >
      田福贤回原清党，在戏楼上"耍猴"蹾杀农协骨干，
      贺老大咬断舌头以身殉道；白嘉轩关门入祠堂代族人跪保（第14章）
    function_note: >
      第一次价值大逆转——革命浪潮（农协→清党）第一次冲破白鹿原的封闭

  - arc_id: ARC-3
    name: 传统秩序的反扑与代价
    value_at_start: 动荡后的脆弱平衡（清党后白嘉轩重新控制局面）
    value_at_end: 秩序内部坍塌（白孝文堕落、田小娥被杀、鹿三精神崩溃）
    climax_event: >
      鹿三亲手用梭镖刺杀田小娥，随后精神分裂；
      黑娃与父断绝关系（第20章）
    function_note: >
      传统秩序以暴力维护自身——鹿三杀"淫妇"是族规的极端执行，
      但代价是杀人者的精神崩溃和父子关系的彻底断裂

  - arc_id: ARC-4
    name: 历史的碾压
    value_at_start: 各自为战的分裂状态（黑娃为匪，兆鹏地下，白灵革命）
    value_at_end: 理想主义的全面破灭（白灵被活埋，兆海死于内战，朱先生失志）
    climax_event: >
      白灵在根据地肃反中被活埋，朱先生与白嘉轩同夜梦见白鹿哭泣（第28章）；
      随后鹿兆海阵亡的真相揭开——死于内战而非抗日（第29章）
    function_note: >
      最惨烈的Arc——革命吞噬自己的儿女，国共双方的理想主义者都成为牺牲品

  - arc_id: ARC-5
    name: 精神灯塔的熄灭
    value_at_start: 衰败中的最后坚守（朱先生完成县志，黑娃学为好人）
    value_at_end: 精神权威消亡（朱先生辞世，白鹿原失去最后的道德坐标）
    climax_event: >
      朱先生拒绝岳维山五百大洋买反共声明，完成县志后安然辞世；
      墓砖内刻"折腾到何日为止"（第32章）
    function_note: >
      朱先生之死是全书精神高峰——君子谢世，预言跨越时空

  - arc_id: ARC-6
    name: 终局——废墟上的认罪
    value_at_start: 表面和解（黑娃归正、祭祖、鹿三辞世，似乎走向安宁）
    value_at_end: 全面崩塌（黑娃冤死、鹿子霖疯死、白嘉轩独眼认罪）
    climax_event: >
      白孝文主持处决黑娃，白嘉轩闻枪声昏厥失左眼；
      最终独眼面对痴呆的鹿子霖："我对不住你"（第34章）
    function_note: >
      故事总高潮——投机者得胜，坚守者残破，忏悔对象已无法理解忏悔

# ── 故事高潮设计 ──
story_climax_design:
  crisis:
    dilemma: >
      白嘉轩是否要为黑娃出面担保——
      面对的是自己亲生儿子（白孝文）主导的"人民审判"
    option_a: 出面担保黑娃，公开对抗儿子和新政权
    option_b: 沉默接受，保全白家在新时代的地位
    character_revelation: >
      白嘉轩选择了出面担保——说明他的"仁义"不是虚伪的，
      他确实认为"黑娃学好了就该容得"；
      但他的坚持毫无用处——新的权力秩序不认他的道德权威
  climax:
    action: >
      白嘉轩参加行刑集会，与黑娃最后对视——黑娃垂头落泪，
      白嘉轩转身离开；枪声响起，白嘉轩栽倒，左眼气血蒙目
    value_change:
      from: 仁义秩序（即使残破）仍有最后一丝权威
      to: 仁义秩序彻底失效——坚守者被自己的儿子架空，好人被冤杀
    controlling_idea_expression: >
      投机者（白孝文）坐在主席台上，坚守者（白嘉轩）在台下失去左眼——
      道德秩序在权力面前的彻底失败；
      但白嘉轩随后向痴呆的鹿子霖认错，完成了精神上的自我赎罪——
      尊严在废墟中依然存在，虽然已无人能领受
  resolution:
    new_balance: >
      白嘉轩独眼、驼背、拄拐——三重残破——但"气色滋润柔和"，
      成为"世事洞达者"；鹿子霖疯死柴房；白孝文成为县长。
      白鹿原的旧秩序彻底消亡，新秩序与道德无关。
    lingering_feeling: >
      苍凉——白嘉轩对痴呆的鹿子霖说"我对不住你"，
      鹿子霖递过一颗羊奶奶："给你吃，咱俩好！"
      百年恩怨在一方已无知觉、另一方终于坦诚的时刻消散。
      朱先生墓砖"折腾到何日为止"回响不绝。
