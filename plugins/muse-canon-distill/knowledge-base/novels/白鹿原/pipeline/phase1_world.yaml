# 《白鹿原》Phase 1: 世界构建
# 逆向分析 — 从原文提取世界规则与限制

setting:
  era: >
    清末至1949年解放初期（约1900年代—1949年）；
    附录延伸至文化大革命时期（1960-1970年代）
  duration: 约五十年（白嘉轩青年至老年），加上文革尾声段落
  location: >
    陕西省关中平原白鹿原——滋水县白鹿村及周边（白鹿镇、白鹿书院、滋水县城）。
    原上是一个半封闭的台塬地貌，俯瞰滋水河川，南望秦岭。
    地理封闭性决定了信息传播滞后、外部力量进入的延迟和冲击的剧烈。
  conflict_levels:
    internal: >
      传统道德内化形成的自我压抑——白嘉轩的"仁义"面具下隐藏着换地原罪，
      鹿三杀媳后的精神崩溃，白孝文在道德沦丧后的自我放弃
    personal: >
      白/鹿两大家族的世代恩怨——土地、权力、面子的争夺；
      父子冲突（白嘉轩vs白孝文、鹿子霖vs鹿兆鹏）；
      道德审判（鹿三杀田小娥、白嘉轩惩孝文）
    external: >
      辛亥革命、军阀割据、国共合作与分裂、土匪劫掠、
      抗日战争、解放战争——每一次政治变局都像洪水冲过白鹿原

world_rules:
  physical:
    - 黄土高原台塬地貌——"原"的封闭性使村庄自成世界，进出需下坡过河
    - 农业社会——土地是唯一真实的财富，换地/卖地/分地贯穿全书
    - 干旱与瘟疫是周期性天灾——第18章大旱饥馑、第25章大瘟疫直接改变人物命运
    - 罂粟种植（第4章）——外来经济作物打破传统农业秩序的第一道裂缝
  social:
    - 宗法制度——族长拥有祠堂惩罚权（刺刷、跪罚），可决定族人婚丧嫁娶
    - 乡约制度（朱子《乡约》第6章推行）——道德自治的理想化尝试
    - 土地即阶级——地主/佃农/长工的身份决定社会地位，土改后翻转
    - 保甲制/联保制——国家权力通过田福贤、岳维山等中间人延伸到乡村
    - 婚姻即政治——冷先生做媒联姻白鹿两家（第8章），婚姻是家族结盟工具
  psychological:
    - "面子"高于一切——白嘉轩宁可驼背也不弯腰，鹿子霖的一切行为驱动力是"弄过白家"
    - 女性被物化——田小娥作为"淫妇"被全村道德审判，白灵的反抗被父亲视为"死了"
    - 鬼神信仰与儒家理性并行——朱先生是儒学化身，但白鹿意象、鬼魂附身、棒槌会等民间信仰同样真实
    - 忍耐/隐忍是最高美德——鹿马勺祖先"卧薪尝胆"，白嘉轩"笔直的腰杆"是精神硬度的物化

genre_conventions:
  primary_genre: 家族史诗
  secondary_genre: 现实主义 / 魔幻现实主义
  conventions:
    - convention: 家族史诗通常有明确的兴衰弧——从创建到毁灭
      planned_subversion: >
        白鹿原不是单一家族兴衰，而是两个家族互为镜像——
        白家衰于道德（孝文堕落），鹿家衰于权欲（子霖疯死），
        最终胜利者恰恰是两家中最不道德的人（白孝文）
    - convention: 乡村文学通常将传统理想化或将革命理想化
      planned_subversion: >
        陈忠实两者都不美化——传统秩序有原罪（换地），
        革命运动有暴力（农协铡人、肃反活埋白灵），
        每条路都有代价，没有"正确答案"
    - convention: 族长角色通常是正面或反面的清晰定位
      planned_subversion: >
        白嘉轩是全书最复杂的角色——既是仁义的化身，
        又是原罪的制造者；既坚韧不屈，又无力回天；
        最终独眼向痴呆的对手认错，尊严与悲哀并存

daily_life:
  - dimension: 饮食
    findings:
      - detail: 晚饭称"喝汤"（关中方言），主食为小米干饭、锅盔、油泼面
        story_implication: 饮食极度质朴，饥馑时的反差更触目——孝文媳妇饿死，鹿子霖疯后挖羊奶奶吃
  - dimension: 宗族仪式
    findings:
      - detail: 祠堂是权力中心——族规惩罚（刺刷）、续修族谱、祭祖均在祠堂进行
        story_implication: 祠堂场景反复出现，是传统秩序最集中的物理空间
  - dimension: 民间信仰
    findings:
      - detail: 棒槌会（求子）、发马角（求雨）、鬼魂附身、白鹿传说——民间信仰深入日常
        story_implication: 魔幻元素不是外加装饰，而是人物世界观的自然组成部分
  - dimension: 婚丧嫁娶
    findings:
      - detail: 婚事由父母/媒人决定，聘礼以土地和银元计；丧事的隆重程度标志社会地位
        story_implication: 白嘉轩七娶、冷先生做媒、朱先生遗嘱拒绝隆重葬礼——每次婚丧都是叙事转折

creative_constraints:
  - constraint: 白鹿原的封闭地理——外部事件必须"传入"而非直接发生
    narrative_function: >
      政治变局（辛亥、清党、解放）每次到达原上都有延迟，
      制造了信息差和误判，增强了历史碾压感
  - constraint: 半个世纪的时间跨度——角色从青年到老年
    narrative_function: >
      时间本身成为最大的对抗力量——无论白嘉轩多坚韧，
      时间和历史终将磨平一切
  - constraint: 双家族并行——叙事必须在白/鹿之间反复切换
    narrative_function: >
      形成对位结构——白家重道德，鹿家重权力；
      白家败在道德的脆弱性，鹿家败在权力的腐蚀性
