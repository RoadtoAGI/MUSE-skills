novel: 白鹿原
author: 陈忠实
lang: zh
translator: ''
narration_voice: 全知说书统摄家族村社，近身人物时仍保留历史俯瞰
diction: 关中土语、礼法文词、政治套语和器物名词并置
rhetoric_density: medium
dialogue_mode: 大事用宣讲争辩，小事用短硬土话和沉默动作
pacing: 仪式与物件慢铺，暴力和命运转折突然落槌
signature_moves:
- 把私德、族规、国变压进同一个村社场面
- 用祠堂、碑刻、文房、雪原等物件承载价值更替
- 让人物在公开仪式中暴露权力和羞辱关系
- 以粗粝身体反应收束宏大历史判断
- 神异意象不解释真伪，只作为命运回声
anti_signature:
- 只写心理独白而不写村社制度和公开场面
- 把关中口语洗成现代书面腔
- 让政治事件脱离家族伦理后果
author_cross_ref: ''
style_card_by: Codex (executor)
