# 《绍宋》Phase 0: 构想逆向分析
# 来源章节标注于各字段末尾

premise: "如果一个毫无准备的现代大学生穿越成了南宋初年正在逃亡的赵构，在无兵无钱无人心、金军十万搜山检海的绝境中，他将如何挽救这个即将灭亡的王朝？"
# 来源：第一卷第1章（穿越事件）、内容简介（"朕要抗金！可朕的心腹都在何处？！"）

core_value:
  positive: 担当（以天下为己任，不退不避）
  negative: 苟安（偏安求和，抛弃责任）
  spectrum:
    contradictory: 犹豫（想担当但缺乏勇气和能力，在进退之间反复摇摆）
    # 来源：第一卷第27章（赵玖被迫渡淮）、第二卷第4章（韩世忠劝阻冒进后赵玖反省"虚妄"）
    contrary: 冷漠（既不主动苟安也不积极担当，随波逐流等待命运安排）
    # 来源：历史赵构登基初期的实际表现——满朝文武"统一思想"南下扬州
    negation_of_negation: 以担当之名行专制（打着抗金旗号独揽大权、不容异议，将个人意志凌驾于制度之上）
    # 来源：第三卷第5-6章（罪己诏风波，赵玖试图借抗金清算旧账被吕好问以死相谏）
    # 来源：第五卷第27-28章（赵官家坚持要杀勾龙如渊，宰执无力劝阻）
    # 来源：第六卷第23章（胡寅以"官家文"讽谏赵玖不可学赵匡胤猜忌功臣）

controlling_idea:
  value: 担当（正面价值最终胜出）
  cause: >
    因为主角以真诚（而非权术）赢得了文武百官的信任，以制度创新（而非个人英雄主义）
    建立了可持续的国家能力，并在每一个关键选择中都选择了更难但正确的路——
    不逃、不和、不退，最终将一个濒临灭亡的偏安小朝廷导向了中兴。
  full_statement: >
    担当能够战胜苟安，当一个领袖以真诚赢得信任、以制度取代人治、
    在每一个两难困境中都选择不回避的那条路时，即便起点是最绝望的亡国边缘，
    也能将一个时代导向新生。
  type: idealistic
  # 来源：全书结局——赵玖回到明道宫（穿越起点），完成首尾闭环，
  # 金国灭亡、燕云光复、战后秩序确立（卷六第32-35章）
  # 作者后记："最后大决战打完，金国灭亡，赵玖回到明道宫，一斧头抡上去，心里彻底通透了"

genre:
  primary: 历史穿越（架空历史）
  secondary: 军事政治
  conventions:
    - setting: >
        以真实历史事件（靖康之变、南宋初年）为基底，穿越者以历史知识为"金手指"，
        但受限于时代条件，无法直接复制现代科技
    - characters: >
        历史真实人物为主（岳飞、韩世忠、秦桧、完颜兀术等），穿越者需要在历史人物的
        真实性格和利益诉求中周旋，而非简单收服
    - events: >
        以大型战役为叙事节点（淮上之战→南阳守城→鄢陵大捷→尧山之战→获鹿决战），
        穿插政治博弈、制度改革、外交纵横
    - values: >
        家国情怀与个人成长交织；穿越者从"想回家吃雪糕"的普通人，
        成长为"挥刀下令'压过去'"的战时天子

originality_statement:
  unique_angle: >
    与大多数历史穿越小说不同，本作的穿越者赵玖并非全知全能的"系统流"或"金手指流"，
    而是一个真实的、会犯错的、有心理创伤的普通人。他的历史知识有限（"历史盲"），
    穿越者优势主要体现在：(1) 现代人的价值观和制度思维（配重投石车、印花税、公司制）；
    (2) 不受赵宋祖训束缚的行动自由（亲手杀刘光世、废三衙归御营）；
    (3) 对历史人物性格的大致了解（知道岳飞可信、秦桧不可信）。
    故事的核心张力不在于"穿越者如何碾压古人"，而在于"一个普通人被迫承担天下重任时，
    如何在每一个两难选择中做出不完美但足够勇敢的决定"。
  cliches_to_avoid:
    - 穿越者凭现代知识轻松碾压古人（本作中赵玖多次犯错、被劝阻、被打脸）
    - 后宫为主线（本作后宫戏极少，核心关系是君臣而非男女）
    - 种田/系统/签到等网文套路（本作无任何超自然系统，穿越者唯一的"金手指"是现代常识）
    - 主角无敌（赵玖多次陷入真正的生死危机，且全书存在"以担当之名行专制"的深层反思）

style_directives:
  - 政论与叙事交融：大量朝堂辩论、军事分析、制度设计穿插于叙事之中
  - 多视角切换：主角视角为主，但金国内部（兀术/秦桧）、文臣（张浚/胡寅）、武将（岳飞/韩世忠）视角交替出现
  - 章节标题暗含情感：如"官家走投无路了！"系列、"崩摧"三连章
  - 历史考据与架空并行：大量使用真实历史细节（官职、地名、军制），但在关键节点做出不同选择
  - 结构对称：首尾明道宫闭环，每卷一次大战作为叙事节点

word_count: 约270万字（7.77MB）
