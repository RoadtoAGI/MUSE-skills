    name: "明道宫——从穿越到淮上大捷"
    value_at_start: "绝望/无力——穿越者被困在亡国边缘，无兵无钱无人心"
    value_at_end: "初生的希望——首次战略级胜利，大将归心，政权初步稳固"
    climax_event: "韩世忠淮上伏击战歼灭金军蒲卢浑部（卷一第78-80章）"
    function_note: "建置Arc——确立穿越者的铁血形象与以身涉险的领导模式"

  - arc_id: ARC-2
    name: "南阳建政——从陪都到御营体制"
