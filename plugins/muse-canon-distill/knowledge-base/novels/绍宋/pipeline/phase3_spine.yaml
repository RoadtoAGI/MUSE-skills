# ── 故事高潮设计（从结局回溯）──

story_climax_design:
  crisis:
    dilemma: >
      获鹿决战前夕（卷六第5章），赵官家面对的不是"打不打"的问题，
      而是一个更深层的困境："胜了之后怎么办？"——
      功臣如何安置？二十万大军如何裁撤？穿越者的铁血手段在和平时期还能继续吗？
    option_a: "以战时体制的惯性继续集权——效率最高但必然走向专制"
    option_b: "以十年共患难的信任为基础'赤诚待人'——风险更大但合乎穿越者的现代价值观"
    character_revelation: >
      赵玖在吕颐浩"赤诚待人"之论中选择了后者：不靠权术、不靠铁血、
      靠十年积累的真诚信任。这揭示了他从穿越者到真正领袖的最终转变。
  climax:
    action: >
      获鹿决战中赵玖亲率龙纛登高地制高点，在拔离速最后骑兵冲锋失败后，
      挥刀下令"压过去"——两万四千长斧重步如铁幕般压向金军。
      一个曾经"想吃雪糕"的大学生挥刀下令全军出击——以行动表达主控思想。
    value_change:
      from: "亡国边缘的穿越者——无兵无钱无人心，连身边人的名字都不认识"
      to: "中兴圣主——二十万铁甲听令，金国灭亡，燕云光复，东亚新秩序确立"
    controlling_idea_expression: >
      担当战胜了苟安。一个普通人，只要在每一个两难选择中都选择不回避的那条路，
      就能将最绝望的局面导向新生。
  resolution:
    new_balance: >
      金国灭亡，燕云光复，菊花岛敕约确立东亚新秩序。
      赵玖回到明道宫——十年前穿越的起点——大封功臣，全书首尾闭环。
    lingering_feeling: >
      赵玖在菊花岛"终未吟出'换了人间'"——他不是圣人，只是一个做了正确事的普通人。
      明道宫大醉酩酊的他，大概终于可以不再想"回家"了——因为这里就是家。
      余韵是温暖释然的，但带着一丝惆怅：那个想吃雪糕的大学生，永远留在了九龙井另一边。
