# 《绍宋》Phase 3: 故事脊椎逆向分析

inciting_incident:
  description: >
    现代大学生赵玖在亳州明道宫的九龙井中穿越，夺舍赵构之身，
    醒来后发现自己身处南宋初年——大宋亡国在即，金军十万南侵，
    满朝文武要么投降要么逃跑，身边的内侍康履和军官杨沂中
    正在软性监控他这个"行为异常"的官家。
  type: accident
  # 穿越是意外，非赵玖主动选择
  timing: "第一卷第1章，故事开篇第一段"
  balance_before: >
    赵玖是一个普通的现代大学生，大学毕业回家办户口，
    顺便去老子庙中游玩——生活平静无忧，最大的烦恼是入职问题。
    # 来源：卷一第1章第57行
  balance_after: >
    赵玖被困在一个正在逃亡的中古王朝中，没有回去的路
    （跳井尝试失败，卷一第1章第72行），身边全是不认识的人，
    唯一确定的信息是金兀术带着十万大军正在搜山检海寻找他。
    回不去现代，又无法以普通人身份隐姓埋名——因为他是皇帝，
    逃都没有地方逃。
  impact_on_protagonist: >
    赵玖被迫从"想回家吃雪糕"的普通人状态，转入"必须以赵构的身份
    活下去"的生存模式。穿越剥夺了他的一切——身份、亲人、时代、
    甚至连名字都不是自己的。唯一留给他的只有一具年轻健壮的身体
    和一个无法拒绝的头衔：大宋天子。

desire_object:
  conscious: >
    抗金——击败金国，收复失地，让大宋存活下去。
    这是赵玖从内容简介就喊出的明确目标（"朕要抗金！"），
    也是他穿越后唯一能找到的行动方向：既然回不去，那就把这个
    该死的时代给扳正了。从最初的"不让金兀术抓住自己"到
    最终的"灭金、建秩序、回明道宫"，抗金是贯穿全书的自觉欲望。
    # 来源：内容简介、卷一第86行
  unconscious: >
    找到存在的意义——一个被迫来到异世的普通人，需要证明自己
    活在这个时代不是毫无价值的。赵玖真正需要的不是军事胜利，
    而是内心的安宁：我不是赵构那个懦夫，我用十年时间做了
    正确的事，现在我可以心安理得地活在这个身份里了。
    这个不自觉欲望在全书最后一章才完全浮现——赵玖回到明道宫，
    "一斧头抡上去，心里彻底通透了"（作者后记），但始终不说出
    "换了人间"（卷六第34章："终未吟出'换了人间'"）——
    因为他知道改变的不是人间，而是他自己。
    # 来源：卷六第34-35章、作者后记
  tension: >
    自觉欲望（抗金）提供了行动的方向和紧迫感——每一卷都有一场
    必须打赢的大战。但不自觉欲望（寻找意义）提供了更深的情感张力：
    赵玖在胜利之后反而更加焦虑（卷六第5章的"忧惧"），因为
    抗金只是手段，真正的问题是"我到底是谁"——这个问题在
    回到明道宫（穿越起点）时才最终得到回答。

spine_statement: >
  一个被迫成为亡国之君的现代普通人，在十年间通过一次次不退缩的选择，
  将一个濒临灭亡的王朝导向中兴，并在这个过程中完成了从"穿越者"到
  "赵官家"的身份认同。

spine_type: unconscious
# 故事脊椎是不自觉的：抗金（自觉欲望）驱动情节，
# 但身份认同（不自觉欲望）驱动弧光。
# 证据：全书高潮不是获鹿决战（军事胜利），而是回明道宫（身份回归）。

dramatic_question:
  question: >
    这个毫无准备的穿越者能否挽救大宋、击败金国，
    并在这个过程中找到自己在这个时代存在的意义？
  obligatory_scene: >
    赵玖必须回到明道宫——穿越的起点——来回答这个问题。
    如果他以征服者的姿态回来，说明他只完成了自觉欲望（抗金）；
    如果他以释然的心态回来，说明他完成了不自觉欲望（身份认同）。
    实际结局：赵玖回到明道宫大醉酩酊（卷六第35章），
    没有说出"换了人间"但"心里彻底通透了"——
    这是一个不完美但真实的回答：他不是圣人，只是一个做了正确事的普通人。
    # 来源：卷六第34-35章

opposing_forces:
  internal: >
    穿越者的心理创伤（想回家、自我怀疑、对权力的不适）、
    "以担当之名行专制"的道德焦虑（罪己诏风波、杀勾龙如渊）、
    "胜了又如何"的战后恐惧（获鹿决战前的忧惧）
  personal: >
    康履/黄潜善的初始隔绝（卷一第1-8章）、
    吕好问以死相谏纲常底线（卷三第5-6章）、
    李纲的政治对抗（卷五第12章弹劾张浚）、
    胡寅以"官家文"讽谏（卷六第23章）——
    即便是忠臣也会构成阻力，因为穿越者的价值观与这个时代有根本性冲突。
  external: >
    金国军事压力（全书六次大战）、伪齐政权、洞庭湖叛乱、
    西夏威胁、蒙古崛起、南方形势户抵抗新政——
    外部敌人的层次在不断变化，但"更强大的对抗力量"始终存在。

# ── 幕/Arc 框架（从高潮回溯：故事需要几个重大逆转？）──

arcs:
