    value_at_end: "稳固/有序——陪都建立，御营整编，第二次大战胜利"
    climax_event: "鄢陵-长社大捷——岳飞声东击西直扑挞懒本阵（卷二第66-70章）"
    function_note: "建置Arc——制度根基确立，配重投石车改变战争形态"

  - arc_id: ARC-3
    name: "东京称雄——从还都到攻守逆转"
    value_at_start: "脆弱的恢复——还都东京但国力空虚，外镇帅臣尚未完全归心"
    value_at_end: "底气初具——外镇归心，恩科充实文官，小吴埽夺制河权，攻守形势逆转"
