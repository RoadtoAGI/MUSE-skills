# 《绍宋》Phase 1: 世界构建逆向分析

setting:
  era: >
    南宋初年（建炎元年—建炎十年，公元1127—1137年）。靖康之变刚结束，
    北宋灭亡，二圣（徽宗、钦宗）被俘北上，大宋朝廷名存实亡，
    赵构（皇九子）在商丘登基称帝，但实际上处于逃亡状态。
    # 来源：卷一第1章开头、内容简介
  duration: >
    约十年（建炎元年秋至建炎十年秋）。从穿越者赵玖在明道宫坠井（1127年秋），
    到金国灭亡后赵玖回到明道宫（约1137年秋），形成完整的十年弧光。
    # 来源：卷一第1章→卷六第35章，首尾明道宫闭环
  location: >
    故事空间随主角的军事-政治扩张逐步展开：
    亳州明道宫（起点）→ 淮河八公山/下蔡城（第一战场）→ 南阳（陪都）→
    东京汴梁/开封（旧都，还都后的大本营）→ 关西/陕西 → 京东/山东 →
    西夏兴庆府 → 金河泊（会盟）→ 河东/太原 → 获鹿/真定 →
    燕京 → 菊花岛/辽东 → 回明道宫。
    地理扩张本身即故事的价值可视化——从一座破败行宫到整个东亚大陆。
    # 来源：全书主线时间轴
  conflict_levels:
    internal: >
      穿越者的身份认同危机：赵玖既非赵构亦非真正的天子，他是一个"想吃雪糕"
      的现代大学生被迫套上了九五至尊的壳。全书前期核心内心冲突是"我凭什么
      要为这个时代拼命"（卷一第1章：想回家、跳九龙井试图返回）；中期转化为
      "以担当之名行专制"的道德焦虑（卷三第5-6章：罪己诏风波）；后期升华为
      "胜了又如何"的战后恐惧（卷六第5章：对人心离散、裁军难题的深层忧惧）。
    personal: >
      君臣信任的反复建立与考验。赵玖与每一位核心角色的关系都需要通过具体行动
      而非身份来赢得：韩世忠靠"单骑赴叛"和"扶腰系带"（卷一第17-19章）；
      张俊靠"荣辱共担"和"雪渡入城"（卷一第23章、36-38章）；
      岳飞靠"进士出身"和"军权移交"的政治信任（卷三第32章、卷五第6章）；
      吕好问靠"罪己诏风波"中的底线试探（卷三第5-6章）。
      此外，穿越者与赵宋皇族的根本性矛盾（"天子与百姓共天下"vs"与士大夫治天下"，
      卷三第17-18章少林寺摊牌）贯穿全书。
    external: >
      金国的军事入侵是最表层也最紧迫的外部冲突——金军十万搜山检海，
      宋军只有万余残兵。但外部冲突的真正复杂性在于多线并行：
      金国内部的权力斗争（粘罕vs兀术vs挞懒）、伪齐刘豫的存在、
      洞庭湖钟相/杨幺叛乱、西夏的威胁、蒙古的崛起——
      赵玖必须在所有这些外部压力之间寻找战略空间。

world_rules:
  physical:
    - >
      穿越无"金手指"：赵玖没有系统、没有空间、没有记忆融合，
      只有一具年轻健壮（能拉石五弓）的赵构身体和有限的历史常识。
      所有科技创新（配重投石车、半球实验、热气球）都需要在当时的
      工匠条件下从零实现，且受限于材料和人才。
      # 来源：卷一第1章（"历史盲的无知"）、卷二第42章（铸造投石车）
    - >
      军事受地理和季节约束：淮河冬季结冰可渡、黄河汛期不可战、
      关西山区地形利守不利攻、获鹿平原适合骑兵决战。
      战争节奏严格遵循真实的中古军事逻辑（后勤、兵站、行军速度）。
    - >
      通信速度限制：快马急递是最快通信方式，信息延迟是战略决策的核心约束。
      "藏报"（卷三第64章）本身就是战术手段。
  social:
    - >
      赵宋祖训的束缚："不杀大臣"是未成文但根深蒂固的政治传统。
      赵玖亲手杀刘光世（卷一第30章）和活埋范琼（卷二第22章）是
      对这一传统的根本性突破，由此确立了穿越者"非赵构"的政治身份。
      # 来源：卷一第30章（"朕宁亡国也要亲手杀此人"）
    - >
      文武分制：宋代文臣压制武将的传统极其强大。赵玖的核心政治工程之一
      就是打破这一传统——让岳飞获进士出身（卷三第32章）、
      废三衙归御营（卷二第12章）、文武同律（卷五第2章）。
    - >
      士大夫政治的惯性：即便在亡国边缘，朝臣仍执著于党争（新旧党争、
      道学vs新学）、祖制（不可改年号、不可废三衙）和纲常（二圣问题）。
      赵玖必须在不彻底撕裂这个群体的前提下推动变革。
    - >
      皇权的双刃性：天子身份既是赵玖最大的资源（一言可调二十万兵），
      也是最大的枷锁（不能御驾亲征则不能鼓舞士气，御驾亲征则全军命悬一线）。
  psychological:
    - >
      穿越者的"上帝视角"既是优势也是陷阱：赵玖知道岳飞可信，
      但不知道具体战术；知道秦桧是奸臣，但不知道此时秦桧已成为金国高层。
      更危险的是，"知道结局"可能导致虚妄的自信——韩世忠专门劝阻过
      这种冒进心态（卷二第4章"虚妄"）。
    - >
      "明道宫失忆"是穿越者的保护色和政治工具：所有人都"知道"
      官家落井后失忆了，这既解释了赵玖的异常行为，也给了他
      不受旧有人际关系束缚的自由。但这个谎言本身也是一种负担——
      吕颐浩最终看穿了这一点（卷六第5章："官家根本没有失忆"）。
    - >
      "公私一体"的心理机制：张浚观察到赵玖的核心心理特征是
      将个人生死与国家命运绑定（"公私一体"），这既是力量来源
      也是潜在弱点——一旦国家安全，穿越者的驱动力可能消散。
      # 来源：卷二第6章

genre_conventions:
  primary_genre: 历史穿越
  secondary_genre: 军事政治
  conventions:
    - convention: 穿越者凭历史知识获得信息优势
      planned_subversion: >
        赵玖自称"历史盲"，对宋初政治人物几乎一无所知（不认识黄潜善、
        汪伯彦、王渊），唯一的知识是"岳飞忠臣、秦桧奸臣"这种大众常识。
        信息优势被严格限制在"知道大势"而非"预知细节"的层面。
        # 来源：卷一第1章、第77行（"他是一个都不认识！听都没听过那种！"）
    - convention: 穿越者引入现代科技碾压古人
      planned_subversion: >
        所有科技引入都受限于当时条件：配重投石车需要工匠从零铸造（卷二第42章），
        半球实验需要找到合适的材料（卷四第15章），热气球只能做展示飞行（卷五第23章），
        印花税需要宰执讨论可行性（卷五第14章）。科技是辅助而非决定性因素。
    - convention: 穿越者轻松收服历史名将
      planned_subversion: >
        每一位将领的收服都付出了真实的政治代价和信任投资：
        韩世忠需要"单骑赴叛+扶腰系带"；张俊需要"雪渡入城+翁婿之约"；
        岳飞需要"进士出身+明留暗去"的长期经营；曲端则经历了"下狱→杀威鞭→
        副都统→骑军都统"的完整驯服过程。没有任何将领是靠"主角光环"收服的。
    - convention: 穿越者面对外敌以军事胜利为主线
      planned_subversion: >
        军事线只是故事的一半——另一半是政治制度建设（废三衙、四省合一、
        原学确立、恩科殿试、秘密建储、赋税改革）和外交纵横
        （对金、对伪齐、对西夏、对蒙古/契丹/高丽的多层博弈）。
        最终全书收束于"不战而屈人之兵"的外交阳谋（大理分裂归附），
        而非又一场军事胜利。

daily_life:
  - dimension: 军队日常
    findings:
      - detail: >
          赵玖从穿越第一天起就与班直士卒同餐（"随手放下陶碗，毫无风度的抹了一下嘴"），
          这一习惯从明道宫保持到全书结尾，成为穿越者身份的标志性行为。
        story_implication: >
          与士卒同餐既是收买人心的手段，也是穿越者无法适应皇帝排场的真实反应，
          二者合一使其成为了赵玖最可信的"人设"——康履抱怨"不成体统"恰恰证明其有效性。
        # 来源：卷一第2章、卷二第24章
      - detail: >
          宋军军饷长期拖欠，赵玖亲自补发军饷（卷二第13章）；
          军人经商是普遍现象，张俊"连摆七日宴席"试探圣心（卷四第17章）。
        story_implication: 军队腐败是战斗力低下的核心原因，也是赵玖军制改革的出发点。
  - dimension: 朝堂仪式
    findings:
      - detail: >
          文德殿大朝议的混乱（卷三第5章"秩序混乱"）与方城山大朝会的庄严
          （卷二第11章）形成鲜明对比——前者是旧制下的无效议政，
          后者是赵玖主导下的高效决策。
        story_implication: 朝堂仪式的变化可视化了权力结构的转移。
  - dimension: 经济与货币
    findings:
      - detail: >
          赵玖发行"冬日专项国债"引发抢购（卷四第7章），
          推行印押税/北伐彩票/海贸公司制等现代财政工具（卷五第14章），
          岁入从不足3800万缗逐步增长到支撑三十万大军北伐。
        story_implication: >
          财政是战争的基础，穿越者的真正优势不在军事而在制度设计——
          这些超越时代的金融创新才是赵玖"穿越者知识"最有效的转化。

creative_constraints:
  - constraint: 穿越者不能暴露身份
    narrative_function: >
      "明道宫失忆"是一个永远不会被揭穿的秘密，因为没有人有动机去揭穿它——
      文臣需要一个"虽失忆但英明"的官家，武将需要一个"不按常理出牌"的天子。
      这个设定使穿越者可以自由地做出反常规决策，同时避免了"解释穿越"的叙事负担。
  - constraint: 历史人物性格不可任意篡改
    narrative_function: >
      岳飞依然忠义但倔强、韩世忠依然勇猛但粗率、张俊依然贪财但识时务、
      秦桧依然阴险但有才——穿越者改变的是他们的命运选择，而非他们的本性。
      这使故事的"架空"建立在可信的人性基础上。
  - constraint: 赵宋皇权的制度性弱点
    narrative_function: >
      赵玖不能像汉唐天子那样随意杀伐——杀刘光世已经是"宁亡国"的豪赌，
      杀勾龙如渊需要借军法曲折执行。皇权与士大夫政治的博弈是贯穿全书的
      制度性张力，赵玖的每一次"越界"都付出了政治代价。
