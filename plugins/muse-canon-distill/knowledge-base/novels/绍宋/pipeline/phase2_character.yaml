# 《绍宋》Phase 2: 角色系统设计图
# 只记角色之间的关系，不记个体画像。个体画像见 characters/{角色名}.md

cast_overview:
  protagonist: 赵玖（赵官家）
  antagonist: 完颜兀术（金国四太子→魏王）——军事线终极对手
  supporting_cast:
    # ── 宋朝文臣 ──
    - name: 吕好问
      function: 道德线锚点——政治合法性基石，原学创始人
    - name: 张浚
      function: 政治线第一推手——木党领袖，北伐方案操盘手
    - name: 赵鼎
      function: 制度线稳定器——"公道自在人心"型首相，文武间的调和者
    - name: 李纲
      function: 精神线旗帜——主战派象征，退休后仍以道德权威影响朝局
    - name: 胡寅
      function: 制度线刹车——理想主义诤臣，以"官家文"讽谏防止主角走向独裁
    - name: 林景默
      function: 执行线暗手——主角最信任的实务派心腹，承担最危险的秘密任务
    - name: 万俟卨
      function: 舆论线操盘手——"莫须有何以服天下"的创造者，御史系统的代表
    - name: 吕颐浩
      function: 战略线支柱——从枢相到河北大都督，决战前以"赤诚待人"打消主角忧惧
    - name: 陈规
      function: 技术线专家——守城理论家，东京堡垒化/南阳城防的设计者
    - name: 虞允文
      function: 新生代代表——太学进士，小吴埽献策者，外交使节，年轻文臣的可能性象征
    # ── 宋朝武将（五帅）──
    - name: 韩世忠
      function: 军事线第一支柱——帅臣之首，"官家的腰胆"
    - name: 岳飞
      function: 军事线攻击核心——最锋利的剑，"文武合一"理想的象征
    - name: 张俊
      function: 军事线利益绑定范例——识时务的贪将，说明"恰当的私心可以被公用"
    - name: 李彦仙
      function: 军事线孤胆英雄——陕州起家的草根名将，中军都统
    - name: 吴玠
      function: 军事线西路战神——关西防线/河东攻势的中坚，获鹿决战的战术设计者
    # ── 宋朝武将（其他）──
    - name: 杨沂中
      function: 禁中线沉默之剑——杨业后裔，用拔刀和举旗"说话"的人
    - name: 王德
      function: 军事线猛将——"王夜叉"，先锋冲阵的符号化存在
    - name: 曲端
      function: 军事线驯服弧——从桀骜跋扈到御营骑军都统的完整转变
    - name: 王彦
      function: 军事线八字军象征——太行义军→御营总都统，获鹿决战统领长斧重步
    - name: 张荣
      function: 军事线草莽归顺——梁山泊势力纳入朝廷体系的代表
    # ── 金国阵营 ──
    - name: 秦桧
      function: 暗线文化符号——穿越者与历史记忆的对位角色，"缺席者的压迫感"
    - name: 完颜粘罕
      function: 金国内部对抗线——兀术的主要权力对手，被杀后引发金国政治格局剧变

contrast_axes:
  core_test: "面对不可能的选择"时的反应模式
  contrasts:
    - 赵玖 vs 兀术: >
        同为最高决策者，判断来源根本相反——穿越者知识 vs 军事直觉。
        这种底层不对称构成全书核心博弈：一方"知道结局但不知细节"，一方"精通细节但误判大势"。
    - 韩世忠 vs 岳飞: >
        同为顶级名将，韩世忠毫不犹豫直接行动（一刀平叛），
        岳飞在极痛苦的内心挣扎后以"军中下令的语调"给出违反直觉的正确选择（一炷香沉默）。
        前者是本能型天才，后者是成长型天才。
    - 张浚 vs 吕好问: >
        同为核心文臣，张浚用逻辑链条将人引向预设结论（进攻式谋略家），
        吕好问在沉默中承受一切、只在底线处爆发（防守式道德家）。
        赵玖需要两者的平衡。
    - 张俊 vs 曲端: >
        同为有"毛病"的将领，张俊的毛病是贪（可被利益收编），
        曲端的毛病是骄（需要被武力驯服）。两条驯服弧展示了赵玖的不同手段。
    - 林景默 vs 胡寅: >
        同为赵玖信任的文臣，林景默是"判断归判断，恶心归恶心"的冷静实务派，
        胡寅是"原则性极强但容易被激怒"的理想主义者。
        前者执行命令，后者监督命令。

relationships:
  power_dynamics: >
    赵玖的权力建立在"个人行动的信用积累"上而非制度性权威——
    每一次以身涉险（单骑赴叛、雪渡下蔡、亲守南阳、御驾获鹿）
    都在增加他的政治资本。但这种权力模式内含危险：
    一旦停止涉险，信用就可能衰减（卷六第23章胡寅"官家文"讽谏正是此忧）。
  key_tensions:
    - 穿越者价值观 vs 赵宋祖训（贯穿全书，以杀刘光世、罪己诏、少林寺摊牌为节点）
    - 战时专制 vs 制度化治理（中期开始显现，以"相忍为国"为妥协方式）
    - 军事线的激进 vs 政治线的保守（张浚推北伐 vs 李纲求稳，赵鼎居中调和）
    - 穿越者的"上帝视角" vs 古人的经验智慧（韩世忠"虚妄"劝阻是典型案例）
    - 五帅之间的微妙竞争（韩岳为尊、张俊识趣让权、吴玠独守西路、曲端从骑军切入）
  potential_shifts:
    - 战后裁军问题（获鹿决战前赵玖已感忧惧，全书结束时仅以大封功臣暂时处理）
    - 穿越者后继无人（秘密建储解决继承权问题，但"穿越者视角"不可传承）
    - 文武关系的长期张力（进士入军是临时措施还是制度性变革，全书未给定论）
