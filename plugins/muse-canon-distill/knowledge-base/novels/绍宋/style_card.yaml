novel: 绍宋
author: 榴弹怕水
lang: zh
translator: ''
narration_voice: 全知史官式铺局，贴关键人物补心理直评
diction: 官制地名密集，文白底色夹现代反讽口吻
rhetoric_density: medium
dialogue_mode: 朝会奏答与军令喊话并重，对白常作决策拐点
pacing: 长段制度推演蓄压，短句命令或玩笑转折
signature_moves:
- 先用地理官制搭建局势，再让人物一句话改写判断
- 把宏大战役拆成旗号、道路、补给、军心等可执行环节
- 在严肃历史语境中插入现代常识和自嘲，制造错位反讽
- 用朝会群辩呈现制度选择，让人物立场从发言顺序显形
- 大战高潮后转入个人沉默或回望，把胜负落到身份承担
anti_signature:
- 只写热血冲杀不写制度、后勤、官僚反应
- 全篇古雅无现代旁白反讽
- 人物只靠豪言立住，不经过具体政军事务检验
