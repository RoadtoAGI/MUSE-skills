analysis_meta:
  novel: "云天明的童话"
  source_text: "source_manifest.yaml 所列三个连续童话"
  source_form: "嵌套中篇 / 三联童话 / 科幻隐写文本"
  evidence_note: "本文件只记录人物系统、对比轴与关系结构；个体声音和弧光见 characters/。"

cast_overview:
  protagonist: "露珠公主（选择主角）；长帆（行动搭档）"
  antagonist: "冰沙王子主导的篡位秩序；针眼画师是其远程清洗武器"
  supporting_cast:
    - name: "宽姨"
      function: "照料者与生活知识保存者；把香皂和黑曜石熨斗带入行动链"
    - name: "空灵画师"
      function: "规则揭示者与牺牲者；交付黑伞、敌情和深水解法"
    - name: "深水王子"
      function: "合法性与武力的复位支点；反透视性质构成科技含义坐标"
    - name: "国王与王后"
      function: "清洗的首批受害者；把继承冲突转成不可逆政变"
    - name: "暗林监护官与广田老师"
      function: "保存旧王室程序，在墓岛验证身份并重建合法性"
    - name: "禁卫军"
      function: "制度摆锤；在篡位者的既成王权与合法继承之间等待可承认的结果"

contrast_axes:
  - axis: "王位与自由"
    responses:
      露珠公主: "获得登基资格后主动远航"
      冰沙王子: "用亲族清洗夺取王位"
      深水王子: "具备统治能力并承担王位"
  - axis: "知识的用途"
    responses:
      针眼画师: "把技艺变成可批量执行的暗杀武器"
      空灵画师: "用规则知识保护公主并承担传艺责任"
      长帆: "把物性、航海经验和现场观察组合成渡海方案"
      宽姨: "用生活经验保存稀缺材料"
  - axis: "观看与被观看"
    responses:
      针眼画师: "看一眼即可捕获并消灭对象"
      深水王子: "改变观看尺度，使透视体系失效"
      露珠公主: "从被宫廷凝视的美人转为主动观看海、土地和远方的人"
  - axis: "故事观"
    responses:
      王国居民: "把无变化视为幸福"
      露珠公主: "选择去有故事的地方"
      长帆: "保存外部故事并成为远航伙伴"

relationships:
  power_dynamics: "冰沙借针眼的远程杀伤把继承劣势转成既成王权；露珠一方把黑伞、香皂、王室血缘、禁卫军观望和深水的反透视优势逐步组合，夺回行动权。"
  key_tensions:
    - "露珠公主 vs 冰沙王子：合法继承与暴力夺位"
    - "针眼画师 vs 空灵画师：技艺武器化与传艺责任"
    - "长帆 vs 封海规则：局部生活知识能否突破系统性隔绝"
    - "露珠公主 vs 预定王位：公共责任与个人自由"
  potential_shifts:
    - "露珠与长帆：君臣关系转为互相选择的远航伴侣"
    - "露珠与深水：被救者与救援者转为主动让位者与治理承担者"
    - "禁卫军与冰沙：形式服从转为等待合法性重建"

system_design_note: "人物名兼具叙事功能与编码指针：露珠指向易逝，长帆指向航行，深水承担距离不改变量，冰沙标记冷酷停滞，针眼连接微小画面与降维杀伤。"
