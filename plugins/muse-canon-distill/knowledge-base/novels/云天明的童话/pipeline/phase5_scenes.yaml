        participants: ["露珠公主", "宽姨", "长帆", "空灵画师"]
        pov: "全知，重心随露珠一方"
        conflict: "空灵试图压平纸反制针眼 vs 时间不足"
        value_start: "露珠不知父母已死，也没有保护"
