tension_curve:
  description: "第一篇快速建立画杀倒计时；第二篇降速，以探索、物性和夜谈维持潜在死亡；第三篇从偶然发现连续加速至复位，再在合伞处形成真正人物高潮，最后以双结局降落。"
  peaks: ["F02", "F03", "F08", "F10", "F11"]
  valleys: ["F04", "F06", "F12"]

causal_chain: "F01继承决定暴露清洗名单 → F02王室消失迫使反制 → F03黑伞与逃亡目标交付 → F04露珠形成外部世界欲望 → F05海禁与香皂物性同场建立 → F06封闭史和守护关系完成装配 → F07泡沫事故产生渡海方案 → F08接回深水并确认反透视 → F09军队与画技动摇 → F10冰沙和针眼终结 → F11烧画、合伞与远航选择 → F12个人开放、王国封闭"
