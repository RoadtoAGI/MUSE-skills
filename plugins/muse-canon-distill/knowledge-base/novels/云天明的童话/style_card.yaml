work: "云天明的童话"
author: "刘慈欣"
medium: "小说中的三联童话"
language: "zh"

narrative_voice:
  mode: "全知说书体"
  distance: "以童话叙述者概括人物善恶，在关键动作处贴近露珠、长帆、针眼或冰沙"
  signature: "用程式句、预告语和寓言式判断建立古老口传感"

diction:
  base: "现代白话中的童话词汇、宫廷敬语、物性名词"
  contrast: "明亮自然意象与冷酷死亡并置"
  technical_disguise: "把转速、曲率、质量、透视、泡沫扩散等可测性质写成魔法规则"

syntax_and_rhythm:
  sentence_pattern: "叙景长句扩展奇观；行动与决断用短句收紧"
  repetition:
    - "平行复句记录名单和规则"
    - "同一意象跨篇复现并改变价值"
    - "名字与道具高频出现，形成编码记忆点"
  pacing: "第一篇快清洗，第二篇慢装配，第三篇连续回收并加速"

image_system:
  painting: "死亡、世界生成、二维化"
  umbrella: "保护、恒速控制、持续照料"
  soap_and_foam: "稀缺能源、推进、航迹、舒适诱导"
  sea: "边界、黑域、自由可能"
  white_sail: "人物自由与曲率航行的共同终局图像"

craft_principles:
  - "先让隐喻物完成表层剧情任务，再让物性承担科技映射。"
  - "规则讲解嵌入告别、照料、实验和逃亡压力。"
  - "解决方案由前篇旧零件重组，维持惊讶与必然并存。"
  - "暴力过程多被省略，余温、空床、脚步和画像承担恐怖。"
  - "华彩意象同时是可解码信息，修辞与功能同载。"

evidence:
  - "sources/01_王国的新画师.md:L19-L60"
  - "sources/02_饕餮海.md:L3-L27"
  - "sources/03_深水王子.md:L20-L45"
  - "sources/03_深水王子.md:L111-L135"
