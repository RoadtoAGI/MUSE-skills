# Phase 2: 角色系统设计图 — 《冰与火之歌Ⅱ·列王的纷争》
# 只记角色之间的关系、功能分配和对比轴。个体画像见 characters/*.md

cast_overview:
  protagonist: |
    无单一主角——9个POV角色构成群像叙事。
    按章节数加权的主线角色：提利昂(13章) > 艾莉亚(10章) > 琼恩(8章)
  antagonist: |
    无单一对手——每条线有各自的对抗力量：
    - 提利昂线：瑟曦（内部对手）+ 史坦尼斯（外部对手）
    - 布兰线：席恩（背叛者）→ 拉姆斯（毁灭者）
    - 琼恩线：野人/异鬼（外部）+ 誓言困境（内部）
    - 丹妮线：魁尔斯政客/术士（外部）+ 自身政治幼稚（内部）
    - 珊莎线：乔佛里/瑟曦（压迫系统）
    - 艾莉亚线：格雷果/战争机器（外部暴力）
    全书层面的终极对手是"混乱本身"——五王纷争制造的系统性崩溃。
  supporting_cast:
    - name: 波隆
      function: "提利昂的暴力代理人——他完成提利昂无法亲手做的事，是智谋与武力的接口"
    - name: 瓦里斯
      function: "信息掮客——多条线的情报节点，也是提利昂唯一真正的智识对手"
    - name: 贾昆·赫加尔
      function: "艾莉亚线的'超自然工具'——三条命许诺让艾莉亚从受害者升级为有限度的行动者"
    - name: 布蕾妮
      function: "凯特琳线的忠诚镜像——她对蓝礼的骑士之爱转化为对凯特琳的誓言"
    - name: 桑铎·克里冈（猎狗）
      function: "珊莎线的保护者/威胁二合一——他的暴力与柔情共存是珊莎认知世界的关键教材"
    - name: 断掌科林
      function: "琼恩线的使命传递者——他的牺牲完成了琼恩从'规则遵守者'到'使命理解者'的蜕变"
    - name: 耶哥蕊特
      function: "琼恩线的道德考验具象化——他对她的仁慈证明了守夜人誓言可以有比杀戮更深的含义"
    - name: 唐托斯
      function: "珊莎线的虚假希望——看似拯救者，实际被更大势力操控的棋子"
    - name: 玖健·黎德
      function: "布兰线的导师——引导布兰觉醒超自然天赋，同时以预言制造叙事悬念"
    - name: 梅丽珊卓
      function: "史坦尼斯阵营的实际驱动力——她不是配角，是超自然力量入侵世俗政治的化身"
    - name: 泰温·兰尼斯特
      function: "提利昂线的终极否定力量——他的到来将提利昂所有功绩归零"

contrast_axes: |
  本书角色系统建立在多组对比轴上，同一情境下不同角色的选择构成核心张力：

  1. 【身份认同轴】席恩 vs 琼恩
     - 相同情境：都是寄养他家的孩子，面临"我是谁"的问题
     - 席恩选择：用征服（攻占临冬城）来证明自己是葛雷乔伊 → 毁灭
     - 琼恩选择：用牺牲（杀死科林）来证明自己忠于誓言 → 存续
     - 对比本质：外在行动证明身份 vs 内在坚守定义身份

  2. 【生存策略轴】珊莎 vs 艾莉亚
     - 相同情境：都是被困在敌人控制区的史塔克女儿
     - 珊莎选择：以礼仪为盾牌，隐藏真实自我，等待机会 → 保全但不自由
     - 艾莉亚选择：以暴力为工具，主动出击，付出人性代价 → 自由但在失去自我
     - 对比本质：在压迫中保存自我 vs 在反抗中改变自我

  3. 【权力代价轴】提利昂 vs 瑟曦
     - 相同情境：都在为兰尼斯特家族争夺/保卫权力
     - 提利昂方式：智谋+联盟+让步 → 守住了城，失去了一切
     - 瑟曦方式：控制+暗杀+情绪化 → 派刺客杀弟弟却最终需要父亲来救
     - 对比本质：有能力无地位 vs 有地位无能力

  4. 【忠诚本质轴】戴佛斯 vs 梅丽珊卓
     - 相同情境：都服务于史坦尼斯
     - 戴佛斯忠诚：基于公正的世俗交换——"他的惩罚很公正，所以赢得了我的忠诚"
     - 梅丽珊卓忠诚：基于神启的绝对信仰——不容置疑，不惜代价
     - 对比本质：有限的人间忠诚 vs 无限的神圣忠诚

  5. 【领导力轴】丹妮 vs 罗柏（非POV对照）
     - 相同情境：都是年轻的领袖，都在建立新秩序
     - 丹妮：在绝境中靠个人意志维持团队，学会独立判断 → 弧光上升
     - 罗柏：在胜仗中渐渐失控（后方被席恩偷袭），依赖母亲和封臣 → 弧光下降
     - 对比本质：逆境中成长 vs 顺境中丧失

relationships:
  power_dynamics: |
    本书的权力动态呈三层结构：

    表层：五王之争（军事/政治）
    - 乔佛里（兰尼斯特）← 提利昂代理 → 瑟曦制衡
    - 史坦尼斯 ← 梅丽珊卓驱动 → 戴佛斯怀疑
    - 蓝礼 ← 提利尔支持 → 被影子杀死
    - 罗柏 ← 凯特琳辅佐 → 后方被席恩偷袭
    - 巴隆 ← 铁群岛传统 → 席恩执行

    中层：家族内部权力角力
    - 提利昂 vs 瑟曦（兰尼斯特姐弟互相制衡）
    - 席恩 vs 阿莎（葛雷乔伊继承权之争）
    - 泰温凌驾于所有兰尼斯特子女之上

    深层：超自然力量的渗透
    - 梅丽珊卓 → 影子刺客 → 改变战争规则
    - 三眼乌鸦 → 通过玖健 → 引导布兰觉醒
    - 不朽者 → 预言 → 框定丹妮的命运轨迹

  key_tensions:
    - "提利昂-瑟曦：兄妹权力博弈，从冷战升级到暗杀"
    - "席恩-史塔克家：养子的背叛——他最了解临冬城，因此最能伤害它"
    - "琼恩-守夜人誓言：外在背叛以完成内在忠诚的悖论"
    - "戴佛斯-梅丽珊卓：围绕史坦尼斯灵魂的争夺战"
    - "珊莎-猎狗：保护者/威胁者的不稳定二元——他可以救她也可以杀她"
    - "丹妮-魁尔斯诸势力：龙母被各方视为可利用的棋子而非独立力量"

  potential_shifts:
    - "提利昂被泰温取代后，权力结构从姐弟博弈变为父子控制"
    - "蓝礼死后提利尔家族从敌对变为盟友（联姻乔佛里-玛格丽）"
    - "琼恩混入野人后，从守护者变为间谍——身份的根本性重定义"
    - "布兰逃出临冬城后，从代理领主变为流亡者——北方权力中心消失"
