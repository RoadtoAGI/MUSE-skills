premise: "如果一个王国同时被五位国王争夺，而旧秩序的守护者一个个死去或背叛——留下来的，究竟是强者的法则，还是废墟中不肯熄灭的意志？"

core_value:
  positive: 秩序（合法统治、家园安全、忠诚誓言）
  negative: 混乱（僭主争位、家园毁灭、背叛成性）
  spectrum:
    contradictory: 不忠（对秩序的冷漠——既不维护也不破坏，如小指头式的机会主义）
    contrary: 暴政（以秩序之名行压迫——乔佛里的合法王座服务于暴虐）
    negation_of_negation: 以正义之名行混乱（史坦尼斯以最正当的法统继承权为名，借魔法影子暗杀亲兄弟、焚烧七神——用合法性包装的极端手段制造了更深的混乱）

controlling_idea:
  value: 存续的意志
  cause: 因为当所有外在秩序（法统、城堡、军队、盟约）被系统性摧毁后，唯有根植于身份认同和记忆中的内在意志不可焚毁
  full_statement: "当权力的争夺毁灭了所有外在秩序——城堡、盟约、法统——之后，人的意志在废墟中存续下来，因为真正的力量不在于占有，而在于记得自己是谁。"
  type: ironic  # 外部全面负面（五王纷争无一真正胜利者），但内部保留了微弱的正面希望

genre:
  primary: 史诗奇幻
  secondary: 政治权谋 / 战争小说
  conventions:
    - setting: "中世纪架空大陆，多王国并立，魔法复苏"
    - characters: "灰色道德角色群像——没有绝对英雄或反派"
    - events: "王位争夺、攻城战、宫廷阴谋、刺杀与背叛"
    - values: "权力与代价——每一次胜利都伴随等量或更大的失去"

originality_statement:
  unique_angle: |
    多POV叙事的「视角相对主义」：同一颗彗星在不同角色眼中有不同意义（乔佛里的吉兆、丹妮的指路星、多斯拉克的恶兆），同一场战争的胜负取决于你站在哪条叙事线上。没有全知叙事者，读者必须从碎片中拼合真相。

    「弄臣歌谣」式的结构预言：补丁脸的疯话"影子来跳舞啊大人"实际上是全书最精确的情节预言（影子刺客杀蓝礼）。将预言隐藏在最不可信的叙事声音中——疯子说的是真话，理性者（克礼森）反而误判。

    开篇与结尾的学士对称死亡：序幕克礼森之死（理性对抗魔法失败）与终章鲁温之死（旧秩序最后的守护者陨落）形成镜像，两位老学士代表的理性世界在魔法时代全面败退。
  cliches_to_avoid:
    - "主角光环——提利昂守城成功却被亲姐派人刺杀并剥夺权力"
    - "正义必胜——法统最正的史坦尼斯用最邪恶的手段（影子暗杀），仍然输掉最终战役"
    - "家园不可侵犯——临冬城被昔日养子攻陷，又被名义援军焚毁"

style_directives:
  - "多POV轮转：9条主线交织推进，同一事件从多视角呈现（黑水河之战 = 提利昂+珊莎+戴佛斯三重视角）"
  - "零度情感处理：高情感密度时刻用最小的话（断掌科林死前只说'锋利'，布兰回望废墟时心想'它没有死，只是残破，和我一样'）"
  - "动物视角过渡：布兰以冰原狼夏天的视角开场，用兽的感知（烤肉气味令狼垂涎——那是人类尸体）制造残酷的认知落差"
  - "信息差驱动张力：布兰瑞肯的'死亡'是假消息，但读者先于角色知道真相"

word_count: 600000
