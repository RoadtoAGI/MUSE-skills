# Phase 3: 脊椎 — 《冰与火之歌Ⅱ·列王的纷争》
# 注意：本书是多POV史诗，没有单一主角。脊椎以全书主题驱动力为核心，各线共享"争夺与失去"的张力。

inciting_incident:
  description: |
    劳勃·拜拉席恩之死（第一部结尾）引发的权力真空在本书开篇全面爆发：
    史坦尼斯公开宣称乔佛里是私生子（第92章），焚烧七神拔出光明使者（第87章），
    巴隆·葛雷乔伊自立为铁群岛之王（第88章）——加上已在位的乔佛里和已称王的罗柏，
    五王同时争夺铁王座。与此同时，龙石岛上理性学士克礼森试图毒杀红袍女却反被杀（第77章序幕），
    标志理性秩序对抗超自然力量的第一次败退。
  type: accident  # 五王纷争是劳勃之死的连锁反应，非单一角色的决定
  timing: "第77-88章（前15%），多线同时引爆"
  balance_before: |
    第一部结尾的脆弱平衡：乔佛里坐上铁王座但法统存疑，罗柏在北方称王但未与南方全面开战，
    丹妮孵化了龙但远在东方，守夜人尚在运转。
  balance_after: |
    五王同时宣称主权，没有任何一方拥有压倒性优势。史坦尼斯借红袍女的魔力、
    蓝礼靠提利尔家的兵力、巴隆靠铁群岛的舰队、罗柏靠北方的忠诚、乔佛里靠既有王座。
    唯一确定的是——旧秩序已彻底崩塌。
  impact_on_protagonist: |
    对各POV角色的影响：
    - 提利昂：被派去当代理首相，必须以一人之力守住君临
    - 席恩：被罗柏派回铁群岛结盟，却面临父亲的拒绝和身份撕裂
    - 凯特琳：必须在各方势力间周旋谈判以保罗柏后方
    - 丹妮：劳勃之死消除了最大威胁，但她远离战场且实力最弱
    - 琼恩：长城以北野人集结，守夜人力量严重不足
    - 布兰：代理临冬城，却无法阻止即将到来的背叛
    - 珊莎/艾莉亚：作为史塔克家的女儿困在敌方控制区

desire_object:
  conscious: "各方势力争夺铁王座/领土/生存——提利昂要守住君临，席恩要证明自己是葛雷乔伊，罗柏要打败兰尼斯特，丹妮要回到维斯特洛"
  unconscious: "在混乱中保持身份的完整——谁是我？我效忠于谁？我的誓言还有意义吗？"
  tension: "外在目标（权力/胜利）与内在需要（身份/忠诚）的冲突：席恩为了证明自己是葛雷乔伊而背叛了真正待他如兄弟的史塔克家；提利昂为了保卫一个不值得保卫的国王而险些丧命；琼恩为了完成使命而亲手杀死了自己的导师"

spine_statement: "五王之争是外壳，每个角色真正在争的是：在旧秩序崩塌后，我是谁？"
spine_type: unconscious  # 多数角色的自觉追求（权力/胜利/生存）与真正的主题线（身份认同）并不一致

dramatic_question:
  question: "当所有外在秩序——法统、城堡、盟约、誓言——被逐一摧毁后，还有什么能存续？"
  obligatory_scene: "布兰在临冬城废墟中回望被焚的家园，心想'它没有死，只是残破，和我一样'——回答：存续的是根植于记忆与认同中的意志"

opposing_forces:
  internal: "身份撕裂——席恩（葛雷乔伊还是史塔克养子？）、琼恩（守夜人还是间谍？）、提利昂（兰尼斯特还是自己？）"
  personal: "血亲对抗——瑟曦暗杀提利昂、史坦尼斯影子杀蓝礼、巴隆拒绝席恩、凯特琳与罗柏的路线分歧"
  external: "五王之战的军事压力、长城以北的异鬼/野人威胁、魁尔斯术士的阴谋"

# ── 幕/Arc 框架 ──
arcs:
  - arc_id: ARC-1
    name: "棋盘布局——五王就位"
    value_at_start: "脆弱的后劳勃平衡（各方尚未正面碰撞）"
    value_at_end: "各方完成站位，阵线清晰但尚未决战（提利昂掌权、席恩返乡、蓝礼集结、丹妮入荒原）"
    climax_event: "卡斯特将男婴献给异鬼被揭露（第100章），暗示五王争的只是表面，真正的威胁在长城以北"
    function_note: "建置弧——所有线索和角色到位"

  - arc_id: ARC-2
    name: "影子与背叛——超自然力量打破战争规则"
    value_at_start: "蓝礼-史坦尼斯形成南方两强对峙"
    value_at_end: "蓝礼死于影子，史坦尼斯独吞南境军力，准备进攻君临"
    climax_event: "影子刺客杀死蓝礼（第110章）——魔法首次决定性地改变政治格局"
    function_note: "规则颠覆弧——告诉读者：战争不再仅由兵力决定"

  - arc_id: ARC-3
    name: "北方沦陷——家园毁灭"
    value_at_start: "临冬城安全，布兰代理领主，北方后方稳固"
    value_at_end: "临冬城被攻陷→被焚毁，布兰瑞肯逃亡，北方根基彻底丧失"
    climax_event: "席恩攻占临冬城（第123章）→拉姆斯·波顿焚毁临冬城（第143章）——双重背叛完成对家园的系统性毁灭"
    function_note: "情感核心弧——临冬城作为'家'和'秩序'的象征被摧毁"

  - arc_id: ARC-4
    name: "黑水之火——君临保卫战"
    value_at_start: "史坦尼斯舰队逼近，君临兵力不足"
    value_at_end: "君临保住了，但提利昂被刺伤残、权力被泰温接管，胜利属于迟到的父亲"
    climax_event: "黑水河野火大爆炸+提利昂被曼登·穆尔刺杀（第135-138章）——全书最壮观的战斗与最讽刺的结局"
    function_note: "全书高潮弧——也是本书主控思想的集中体现：赢了战争输了一切"

  - arc_id: ARC-5
    name: "身份锻造——从灰烬中重生"
    value_at_start: "各线角色失去了几乎所有外在支撑"
    value_at_end: "在废墟中确认了内在身份——布兰'只是残破'、琼恩卧底野人但'心里记得誓言'、丹妮获船西归"
    climax_event: "断掌科林命琼恩杀死自己完成卧底使命（第145章）——最极端的忠诚考验"
    function_note: "收束弧——回答戏剧问题：在毁灭中存续的是意志和身份"

story_climax_design:
  crisis:
    dilemma: "全书没有单一crisis——各线在同一时间段各自到达最高张力点"
    option_a: "提利昂线：出城迎战（可能死）vs 退守城墙（可能破城）"
    option_b: "琼恩线：假装叛变（背弃誓言的外形）vs 拒绝卧底（使命失败、科林白死）"
    character_revelation: |
      提利昂选择出城——揭示他不是只会耍嘴皮的侏儒，而是愿意用身体扛住的人
      琼恩选择杀死科林——揭示他能在道德困境中做出最痛苦但必要的选择
  climax:
    action: |
      并行高潮：
      1. 黑水河之战——野火点燃河面，提利昂率队出击，被曼登刺杀但被波德救下（第135-138章）
      2. 临冬城被焚——拉姆斯以援军身份偷袭后焚城（第143章）
      3. 科林之死——琼恩杀死科林后被野人接纳为"叛逃者"（第145章）
    value_change:
      from: "各线角色拥有的外在秩序（城市、城堡、同伴、身体完整性）"
      to: "全面失去——但内在意志被锻造出来"
    controlling_idea_expression: |
      布兰在废墟中的最后独白体现主控思想：
      "它没有死，只是残破，和我一样。我也没有死。"
      ——外在可以被摧毁，但记得自己是谁的人不会真正死去
  resolution:
    new_balance: |
      政治：泰温·兰尼斯特成为真正掌权者，兰尼斯特-提利尔联姻确立新秩序
      北方：临冬城废墟，布兰北行寻找三眼乌鸦，瑞肯与欧莎南下
      长城：琼恩卧底野人阵营，野人大军南下逼近长城
      东方：丹妮获三艘船离开魁尔斯，以征服者三龙为船命名
    lingering_feeling: "苦涩的存续感——所有人都活了下来，但代价是失去了几乎一切外在的东西。希望非常微弱，但确实存在。"
