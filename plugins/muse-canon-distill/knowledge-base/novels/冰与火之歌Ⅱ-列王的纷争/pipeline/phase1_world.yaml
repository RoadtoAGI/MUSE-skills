setting:
  era: "维斯特洛大陆·五王之战时期——劳勃·拜拉席恩死后、坦格利安龙族复兴前夜"
  duration: "约一年（从夏末白鸦到来至入秋），多线并行时间略有错位"
  location: |
    维斯特洛大陆（主战场）：
    - 君临（铁王座所在地，提利昂/珊莎线）
    - 龙石岛（史坦尼斯/梅丽珊卓据点）
    - 临冬城（北境核心，布兰/席恩线）
    - 奔流城/河间地（凯特琳/罗柏线）
    - 铁群岛·派克城（席恩线开篇）
    - 长城以北·霜雪之牙（琼恩线）
    厄斯索斯大陆（东方）：
    - 红土荒原→魁尔斯（丹妮线）
  conflict_levels:
    internal: "身份认同危机——席恩在葛雷乔伊与史塔克之间撕裂；琼恩在守夜人誓言与生存之间；提利昂在家族忠诚与个人尊严之间"
    personal: "血亲对抗——瑟曦vs提利昂争权并暗杀；史坦尼斯vs蓝礼兄弟相残；凯特琳与罗柏的母子张力"
    external: "五王之战——乔佛里/史坦尼斯/蓝礼/罗柏/巴隆同时争夺铁王座；长城以北野人大军集结"

world_rules:
  physical:
    - "季节不规则：长夏可达十年，随后冬季同样漫长。白鸦从旧镇学城发出，标志季节转换"
    - "魔法复苏：龙的孵化引发全球魔法回潮——火法师力量增强（魁尔斯），影子刺客可被生出（龙石岛），绿先知预言更清晰（临冬城）"
    - "瓦雷利亚钢：古老锻造术已失传的超级武器，如琼恩的长爪、少数家族传承宝剑"
    - "野火：炼金术士公会制造的液态火，遇水不灭，久存后愈发不稳定（储存数千罐于君临地下）"
  social:
    - "封建效忠体系：领主-封臣关系是政治基础，但双向义务——养子/人质制度（席恩）是维稳手段也是定时炸弹"
    - "继承法则争议：长子继承为惯例，但可被推翻（史坦尼斯法统最正却无人拥戴；乔佛里实为私生子但坐在王座上）"
    - "守夜人誓言：终身不娶不封不生，一旦宣誓便脱离世俗政治——但实际上被当作流放地和刑罚"
    - "学士制度：旧镇学城培养，颈戴锁链，服务于领主——代表理性与学问的秩序力量"
    - "铁群岛文化：'强取胜于花钱'——完全基于掠夺的价值观，与大陆骑士文化对立"
  psychological:
    - "预兆文化：彗星被所有派系按自己的利益解读——相同的天象产生完全相反的意义"
    - "灰色道德：没有角色是纯粹的善或恶——乔佛里残暴但是个孩子；席恩背叛但出于身份撕裂；提利昂聪明仁慈但也享受权力"
    - "誓言的相对性：守夜人誓言、骑士誓言、效忠誓言在压力下都可能被重新解释或打破——断掌科林命琼恩'背叛'誓言以完成使命"
    - "记忆与身份：在所有外在标识被剥夺后（城堡、头衔、军队），角色靠'记得自己是谁'来维持存在——布兰在废墟中'我没有死，只是残破'"

genre_conventions:
  primary_genre: 史诗奇幻
  secondary_genre: 政治权谋
  conventions:
    - convention: "善恶对立、正邪分明的传统奇幻框架"
      planned_subversion: "完全消解善恶二元——法统最正的人（史坦尼斯）用最邪恶的手段（影子暗杀）；最无辜的人（布兰）被最亲近的人（席恩）出卖"
    - convention: "英雄守城必获荣耀"
      planned_subversion: "提利昂守住了黑水湾，但功劳被父亲泰温接收，本人被亲姐暗杀，伤残后被遗忘在小房间里"
    - convention: "家园是安全的避风港"
      planned_subversion: "临冬城被攻陷不是一次而是两次——先被席恩从内部攻破，再被名义援军拉姆斯焚毁。双重背叛比敌人正面进攻更具毁灭性"
    - convention: "预言指引英雄完成使命"
      planned_subversion: "丹妮的三重预言（三次背叛、三团火焰、三匹坐骑）并非路线图而是诅咒——预言确认痛苦不可避免，且无法被理解或规避"

daily_life:
  - dimension: "宫廷礼仪与暴力并存"
    findings:
      - detail: "御林铁卫骑士受命殴打珊莎，但必须按照正式命令执行——暴力被仪式化"
        story_implication: "制度化的暴力比个人暴力更可怕——珊莎的处境不是遇到了一个暴君，而是整个系统都为暴虐服务"
  - dimension: "信鸦通讯系统"
    findings:
      - detail: "信鸦由学士管理，连接各城堡——信息延迟和截取是政治博弈的关键工具"
        story_implication: "提利昂拦截罗柏的和谈条件；布兰瑞肯'已死'的假消息传遍全国——信息不对称驱动大量剧情"

creative_constraints:
  - constraint: "多POV视角不设全知叙事者"
    narrative_function: "读者必须从碎片中拼合真相，产生对'客观现实'的不信任——与主题（权力叙事的建构性）完美契合"
  - constraint: "每条线的时间不完全同步"
    narrative_function: "允许同一事件在不同线中产生时间差效果（如临冬城陷落的消息在不同线中以不同速度传播）"
  - constraint: "魔法有代价且不可控"
    narrative_function: "影子刺客需要国王之血；野火久存后不稳定；龙虽然孵化但无法驾驭——超自然力量不是解决问题的捷径"
