novel: 冰与火之歌Ⅱ-列王的纷争
author: 乔治·R·R·马丁
lang: zh
translator: ''
narration_voice: 多POV限知第三人称，叙述贴合身份与误判
diction: 译笔文白相济，贵族礼语、军务词与粗口分层
rhetoric_density: medium
dialogue_mode: 对白承担权谋试探，短句互刺后由内心补判
pacing: 铺陈地貌仪式后骤入暴力，章末留悬或反讽
signature_moves:
- 每章锁定单一POV，让同一战争被不同偏见折射
- 用衣甲、旗帜、地貌、气味先压实势力空间
- 权谋场以礼貌称谓包裹威胁，关键句短促落槌
- 战斗场从宏观火海切到血泥、缺氧、失衡的身体感
- 反复以宗教意象和家族纹章制造命运回声
anti_signature:
- 全知解释各方动机而不让POV误判
- 对白只传递信息，缺少身份口吻和暗中试探
- 战场只写胜负概况，不落到身体细节
author_cross_ref: 延续前作多POV限知、仪式工笔与对白机锋，本作战争场面更密，译文军务词和宗教词更突出
style_card_by: Codex (executor)
