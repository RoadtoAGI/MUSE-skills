novel: I Am Legend
author: Richard Matheson
lang: en
translator: ''
narration_voice: 限知贴身，理性自控不断被恐惧刺穿
diction: 冷硬口语、医学词、身体痛感词交替使用
rhetoric_density: medium
dialogue_mode: 对白少而断裂，追问、喊话、书信承担转折
pacing: 动作短拍加压，静止段落延长心理窒息
signature_moves:
- 用具体身体反应替代情绪命名
- 让科学解释与孤独崩溃互相打断
- 以夜间外部声响逼出室内心理失控
- 在动作高潮后插入道德认知反转
- 用书信或遗言一次性改写前文立场
anti_signature:
- 不要写成宏大灾难全景旁白
- 不要让对白连续解释世界观
- 不要用华丽长喻冲淡生理压迫
