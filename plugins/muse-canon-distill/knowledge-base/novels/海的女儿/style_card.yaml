novel: 海的女儿
author: 汉斯·克里斯蒂安·安徒生
lang: zh
translator: ''
narration_voice: 全知童话说书，贴近小人鱼后转神圣训诫
diction: 白话译腔，海底物象、宗教词、痛感词并置
rhetoric_density: high
dialogue_mode: 对白少而寓言化，规则问答与临终催促最密
pacing: 景观慢铺，契约和牺牲处以倒计时收紧
signature_moves:
- 用奇异景观先建立童话可信度，再把欲望嵌入规则
- 以失声、刀刃、泡沫等具体代价承载精神升华
- 让误认结构持续压迫沉默者，亲密越近越无解
- 在结尾用超自然解释把悲剧转为伦理考验
anti_signature:
- 不要写成现实主义心理剖白或讽刺口吻
- 不要让主角用长篇自辩取代沉默承受
- 不要削弱代价规则与宗教升华的硬度
author_cross_ref: ''
style_card_by: Codex (executor)
