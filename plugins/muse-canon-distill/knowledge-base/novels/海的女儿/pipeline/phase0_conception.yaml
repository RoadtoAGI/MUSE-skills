analysis_meta:
  novel: "海的女儿"
  author: "汉斯·克里斯蒂安·安徒生"
  source_text: "full_text.md"
  source_form: "单篇童话，无章节标题"
  evidence_note: "原文为一整行，来源以情节段落描述标注。"

premise: "如果一个没有不灭灵魂的人鱼爱上人类，并愿意牺牲声音、家园乃至生命去追求爱与灵魂，会发生什么？"

core_value:
  positive: "慈悲性的自我超越"
  negative: "占有性的自我保存"
  spectrum:
    contradictory: "被爱但不被真正理解"
    contrary: "放弃追求、退回安全的海底生活、接受无灵魂的消散"
    negation_of_negation: "以爱与灵魂为名杀死所爱之人来保存自己"

controlling_idea:
  value: "慈悲与善行开启灵魂的可能"
  cause: "小人鱼在最终危机中拒绝用谋杀换取自救，把爱情从占有转化为放手与祝福。"
  full_statement: "真正通向灵魂的不是被凡人占有式地爱上，而是在绝境中仍选择不伤害所爱，并把痛苦转化为善行。"
  type: idealistic

genre:
  primary: "文学童话"
  secondary: "宗教寓言 / 奇幻爱情 / 成长悲剧"
  conventions:
    - setting: "海底王国与人间王国相互隔绝，奇幻规则清晰限定跨界代价。"
    - characters: "天真而执着的异界公主、不可完全理解她的王子、提出代价契约的巫婆、保守但慈爱的家族。"
    - events: "成年浮上海面、救助落难王子、以身体/声音交换跨界资格、婚礼前夜的致命选择。"
    - values: "爱情、灵魂、牺牲、善行与救赎。"

originality_statement:
  unique_angle: "把童话爱情的愿望结构反转为灵魂寓言：王子的爱情不是终点，拒绝谋杀才是人物真正的高潮行动。"
  cliches_to_avoid:
    - "不让牺牲自动换来爱情回报。"
    - "不让反派巫婆承担最终道德选择，真正的危机留给主角。"
    - "不把结局处理成单纯悲剧，而转入带条件的精神升华。"

style_directives:
  - "高密度感官铺陈，先用景物建立欲望对象。"
  - "重复镜像结构：船宴、舞蹈、海面、晨曦在开端与终局互相照应。"
  - "用外部动作承载内心痛苦：失声、流血跳舞、扔刀、跃海。"
  - "叙述语气保持童话式清澈，残酷代价不以心理独白过度解释。"

word_count: 16250

source_evidence:
  - "开场至姐妹陆续浮上海面：建立海底世界、十五岁规则和小人鱼对人间的持续渴望。"
  - "风暴救王子至神庙女子出现：爱情欲望与误认结构同时成立。"
  - "祖母讲述人鱼无灵魂与婚姻规则：把爱情目标升级为灵魂目标。"
  - "巫婆交易与失声变人：把欲望落实为不可逆代价。"
  - "婚礼夜姐妹递刀至小人鱼投海：以不杀所爱完成主控思想表达。"
