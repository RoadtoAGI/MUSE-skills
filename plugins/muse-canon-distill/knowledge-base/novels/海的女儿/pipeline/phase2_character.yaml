analysis_meta:
  novel: "海的女儿"
  author: "汉斯·克里斯蒂安·安徒生"
  source_text: "full_text.md"
  source_form: "单篇童话，无章节标题"
  evidence_note: "原文为一整行，来源以情节段落描述标注。本文件只记角色系统级关系，不复述个体画像。"

cast_overview:
  protagonist: "小人鱼（最小的公主）"

  # 没有传统意义上的反派——对抗力量是复合的：
  # 王子的认知盲点 + 灵魂规则 + 婚姻制度 + 巫婆契约 + 邻国公主作为误认结构的填位者。
  # 这种复合对手系统本身就是本作的题材选择：童话表层的"坏巫婆"被降格为执行者，
  # 真正的对抗力量是世界规则与认知差。
  antagonist:
    type: "复合对抗系统"
    components:
      - role: "王子"
        function: "爱情通道的占有者；唯一能通过婚姻给予灵魂的人，却永远把救命真相错认到他人身上。"
      - role: "邻国公主（神庙女子）"
        function: "误认结构的填位者；与主角形似但占据真相位置，使爱情零和地翻向她。"
      - role: "海的巫婆"
        function: "契约的不可逆执行者；提供跨界路径的唯一人，但所有条款都向失败倾斜。"
      - role: "世界规则本身"
        function: "人鱼无灵魂 / 婚姻是灵魂唯一通道 / 黎明死期 / 物种隔绝——主角无法谈判的硬约束。"

  supporting_cast:
    - name: "海王祖母"
      function: "规则告知者 / 价值校准点。把童话爱情升级为存在论命题（灵魂规则），并代表'安全长寿优先'的保守一极。"
    - name: "五个姐姐（集体角色）"
      function: "欲望阶梯 + 终局亲情诱惑。前段用五段见闻铺出五种'人间可能性'对照主角的独特渴望；终局献发换刀，把家庭爱以致命形式回返。"
    - name: "海王"
      function: "缺席的父权。只远远伸手而不游近，象征旧秩序对主角越界的无声悲悯但无力挽留。"
    - name: "天空的女儿（集体角色）"
      function: "开放式救赎的接引者。在主角预期灭亡时出现，把'牺牲换爱情'的失败重新框架为'善行换灵魂'的长期任务。"
    - name: "神庙女子（出场即邻国公主）"
      function: "在第一次救命场景以匿名身份出现，承接误认；最终以邻国公主身份回归，闭合误认。同一人物在主角认知中被切成两段。"

# ── 对比轴：主角与其他角色在相同情境下的反应差异 ──
contrast_axes:
  - axis: "对'人间/海面'的反应方式"
    description: "首次浮上海面后的处理方式。"
    responses:
      sisters: "把人间当奇观——城市灯光、夕阳、河流、海面、冰山——回海底后觉得家里更舒服。"
      protagonist: "把人间转化为身份越界的目标——为它放弃声音、家园、人鱼形态。"
    narrative_function: "用旅行式好奇衬出主角的不可逆奉献，让她的选择不显得普遍化。"

  - axis: "对'跨界手段'的态度"
    description: "面对跨界代价的态度。"
    responses:
      witch: "明码标价、不带感情地说出失声 / 剧痛 / 不可逆 / 死期，从契约中获利。"
      protagonist: "明知代价仍主动签约，把'我可以忍受'当作爱的证据。"
    narrative_function: "把跨界从奇幻冒险还原为道德交易，并预先定性主角的牺牲不是被骗而是被见证。"

  - axis: "在王子面前的位置"
    description: "两位女子分别占据'救命真相'与'社会性新娘'的位置。"
    responses:
      neighboring_princess: "外貌相似 + 神庙身份正当 + 第一目击者位置——被王子授予救命恩人称号与新娘位置。"
      protagonist: "真正救命人 + 失声不能解释 + 没有社会身份——被王子授予'亲密孤儿'位置。"
    narrative_function: "误认结构的核心机器：真相和位置完全错配，且错配本身不被任何角色识破。"

  - axis: "对'救命真相'的承担"
    description: "知情与被认领之间的不对称。"
    responses:
      prince: "依赖视觉相似和救命记忆判断爱情；无法识别沉默见证者的功劳。"
      protagonist: "拥有真相却失去说出它的能力，只能眼看真相被指派给他人。"
    narrative_function: "把'救命之恩→爱情回报'的童话惯例反向打碎；功绩与回报被认知盲点切断。"

  - axis: "在终局危机的选择路径"
    description: "刀被递到主角手里时的可能反应。"
    responses:
      sisters: "亲情逻辑——剪发换刀，认为生命延续高于他人无辜。"
      protagonist: "慈悲逻辑——把刀扔进海里，承担自我消散。"
    narrative_function: "用亲情诱惑的真实重量（不是反派提议，是亲姐姐用头发换来的），证明主角的拒绝是对最重诱惑的拒绝。"

# ── 关系网：权力动态、关键张力、潜在转变 ──
relationships:
  power_dynamics: >
    主角在故事大部分时间处于权力最下风：失声、被误认、契约不可逆、黎明死期、物种与制度的双重隔绝。
    所有其他角色（王子 / 巫婆 / 邻国公主 / 祖母 / 姐姐们）都在某个维度上对她拥有否决权。
    唯一一次权力反转发生在终局——刀到她手里的几分钟内，她对王子拥有生杀决定权。
    故事的整个结构都是为了把这个唯一的权力时刻准备出来：她对最大无力的回应是主动放弃唯一的力。

  key_tensions:
    - between: ["小人鱼", "王子"]
      tension: "救命真相 vs 表达能力的不对称——她拥有真相但失声，他拥有判断权但缺信息。亲密程度越深，错位越疼。"
    - between: ["小人鱼", "海的巫婆"]
      tension: "愿望的不可撤销——巫婆条款一旦签订就把所有可能性压缩到二选一：王子的爱情 or 黎明死亡。"
    - between: ["小人鱼", "邻国公主"]
      tension: "零和的误认位置——后者无辜地占据救命人位置，主角无法不嫉妒她、也无法责怪她。"
    - between: ["小人鱼", "姐姐们"]
      tension: "亲情召唤 vs 越界承诺——剪发换刀是终局最致命的诱惑，因为它来自爱而不是恶意。"
    - between: ["小人鱼", "海王祖母"]
      tension: "保守长寿主义 vs 灵魂渴望——祖母解释规则但反对越界，把'不灭灵魂'明确说成不可得。"
    - between: ["王子", "邻国公主"]
      tension: "误认带来的甜蜜结合——他们的婚姻建立在一个真相错位上，但两人都不知道，使悲剧无法归咎于任何人的恶意。"

  potential_shifts:
    - shift: "王子识破真相，转向小人鱼。"
      blocked_by: "主角失声 + 神庙女子→邻国公主的视觉证据闭环。"
      result: "全程被阻断，从未发生。"
    - shift: "小人鱼放弃跨界，回到海底。"
      blocked_by: "巫婆契约的不可逆条款。"
      result: "选项被剥夺，连退路都没有。"
    - shift: "小人鱼杀王子自救。"
      blocked_by: "主角自身的慈悲选择。"
      result: "唯一的真实主动权——被主动拒绝。这是 controlling idea 的载体。"
    - shift: "牺牲被天空女儿改写为善行考验。"
      blocked_by: "无——这是唯一发生的存在形态转变。"
      result: "把封闭的悲剧改写为开放的精神考验。"

# ── 群像设计的功能性切分 ──
ensemble_design:
  family_cluster:
    members: ["海王祖母", "五个姐姐", "海王"]
    collective_function: "持续代表'回到旧生命'的诱惑，在不同阶段以不同形式给出——祖母给规则、姐姐们给见闻、海王给悲悯远望、姐姐们最终给刀。"
    note: "家庭从来不是反派，而是被主角越界行为反衬出脆弱的一极。这让主角的牺牲更难，因为没有可恨的家。"

  misrecognition_cluster:
    members: ["王子", "邻国公主（神庙女子）"]
    collective_function: "构成爱情线的'真相被错认'结构。前者拥有授权但没信息，后者拥有位置但没功绩。"
    note: "本作把'救命→爱情'的童话惯例分两步拆解：先用神庙女子接走功劳，再用邻国公主验证误认——主角永远站在真相端但永远不被看见。"

  contract_cluster:
    members: ["海的巫婆"]
    collective_function: "单人节点。把愿望兑换为不可逆条款，并预先说明所有可能结局——故事没有任何'其实可以撤销'的退路。"

  redemption_cluster:
    members: ["天空的女儿"]
    collective_function: "结尾才出现的开放式救赎节点。把'牺牲换爱情'的失败重新框架为'善行换灵魂'，并把善行的判定权交给孩子（每个好孩子缩短一年、每个坏孩子加一天）——把救赎从英雄叙事降级为日常伦理。"

source_evidence:
  - "小人鱼在花园中种太阳花、与人类石像相伴：与五个姐姐爱好的对比建置。"
  - "祖母讲十五岁规则与灵魂规则：祖母作为规则告知者的功能与保守一极的态度。"
  - "巫婆条款段落：契约执行者的功能与不可逆代价。"
  - "神庙女子在岸边发现王子并接受微笑：误认结构的种下。"
  - "邻国公主出现 + '就是你！'：误认闭合。"
  - "姐姐们用剪发换刀的对白：家庭线在终局的转向，亲情诱惑的具体载体。"
  - "扔刀跃海后泡沫上升、天空女儿声音解释三百年善行：救赎被开放式改写。"
