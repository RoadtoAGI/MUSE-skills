analysis_meta:
  novel: "海的女儿"
  source_text: "full_text.md"
  source_form: "单篇童话，无章节标题"
  evidence_note: "原文为一整行，来源以情节段落描述标注。"

inciting_incident:
  description: "小人鱼十五岁初次浮上海面，遇见王子的生日船宴；风暴毁船后，她选择救起王子并把他送到神庙岸边。"
  type: accident
  timing: "单篇原文前段约三分之一处，完成海底等待和姐妹上浮铺垫之后。"
  balance_before: "她只是向往人间，仍被海底家族、十五岁规则和想象中的上层世界保护。"
  balance_after: "她把人间愿望具体投射到王子身上，并因救命事实被误认而进入无法言说的爱情缺口。"
  impact_on_protagonist: "王子从审美对象变成灵魂与爱情的唯一通道，她开始频繁浮上海面并最终询问人类灵魂规则。"

desire_object:
  conscious: "变成人、得到王子的爱情，并借由婚姻获得不灭灵魂。"
  unconscious: "证明自己的爱不以占有和回报为条件，找到不依赖王子承认的灵魂道路。"
  tension: "她以为灵魂必须由王子的爱情赋予，但高潮迫使她在失去王子时仍决定自己成为什么样的存在。"

spine_statement: "小人鱼从向往人间开始，因救王子而把爱与灵魂绑定，付出声音和家园进入人间，最终在可以杀死王子自救时选择放手，转入以善行创造灵魂的道路。"
spine_type: conscious

dramatic_question:
  question: "小人鱼能否获得王子的全心之爱，并由此获得不灭灵魂？"
  obligatory_scene: "王子婚礼后黎明前，姐姐们递来刀子，小人鱼必须决定杀王子恢复人鱼生命，还是自己化为泡沫。"

opposing_forces:
  internal: "沉默、痛苦、对王子的执念、对灵魂灭失的恐惧，以及不愿伤害所爱之人的善。"
  personal: "王子误认神庙女子为救命恩人；姐姐和祖母的亲情把她拉回生存本能。"
  external: "物种隔绝、巫婆契约、王室婚姻、黎明死亡期限和人鱼无灵魂规则。"

arcs:
  - arc_id: ARC-1
    name: "向上世界的召唤"
    value_at_start: "安全、富足、但被海底边界限制的童年想象。"
    value_at_end: "爱与灵魂愿望被点燃，安全家园开始变得不足。"
    climax_event: "祖母说明人鱼没有不灭灵魂后，小人鱼决定去找海的巫婆。"
    function_note: "把审美好奇转化为不可回头的存在论欲望。"
  - arc_id: ARC-2
    name: "交易与失声"
    value_at_start: "她仍拥有声音、家庭和人鱼身份。"
    value_at_end: "她获得人形，却失去声音、回家的可能和无痛行动能力。"
    climax_event: "小人鱼喝下药剂，在王子宫殿台阶上醒来。"
    function_note: "把愿望兑现为身体代价，并设置表达失败。"
  - arc_id: ARC-3
    name: "近身陪伴与误认"
    value_at_start: "她以为陪伴、舞蹈和善良能让王子爱上她。"
    value_at_end: "王子认定邻国公主才是救命恩人和唯一爱人。"
    climax_event: "邻国公主出现，王子认出她并宣布自己的幸福。"
    function_note: "彻底否定爱情回报路径，逼近最终危机。"
  - arc_id: ARC-4
    name: "刀、泡沫与天空"
    value_at_start: "王子成婚，小人鱼将在黎明灭亡。"
    value_at_end: "她拒绝杀王子，失去旧身体，却获得成为天空女儿、通过善行创造灵魂的可能。"
    climax_event: "她把刀扔进海里，跳入海中化为泡沫又升为空中精灵。"
    function_note: "用最终行动表达主控思想。"

story_climax_design:
  crisis:
    dilemma: "黎明前杀死王子恢复人鱼生命，或不杀王子并承受自己化为泡沫。"
    option_a: "刺死王子，让他的血使双脚重新合成鱼尾，回到海底活满三百年。"
    option_b: "放过王子和新娘，接受自己灭亡。"
    character_revelation: "小人鱼真正的爱不是占有和索取灵魂，而是在被彻底辜负时仍不把痛苦转嫁给无辜者。"
  climax:
    action: "她亲吻王子，确认他梦中念着新娘，然后把刀远远扔进海里并跳入海中。"
    value_change:
      from: "以王子爱情为条件的灵魂希望 / 将要泡沫化的绝望"
      to: "以自我慈悲和善行为基础的灵魂可能"
    controlling_idea_expression: "她没有获得王子，却因拒绝谋杀而获得比王子爱情更高层次的救赎路径。"
  resolution:
    new_balance: "小人鱼成为天空的女儿之一，需以三百年的善行创造不灭灵魂。"
    lingering_feeling: "悲伤中带有宗教式慰藉；童话没有取消痛苦，而是把痛苦升格为精神劳动。"

source_evidence:
  - "十五岁浮上海面、船宴、风暴救王子：激励事件和爱情对象具体化。"
  - "祖母解释人鱼无灵魂：欲望从爱情升级为灵魂追求。"
  - "巫婆交易：不可逆代价和死亡期限。"
  - "邻国公主被王子认作救命恩人：Arc 3 逆转。"
  - "姐姐递刀、小人鱼扔刀、升入天空女儿：最终危机、高潮和结局。"
