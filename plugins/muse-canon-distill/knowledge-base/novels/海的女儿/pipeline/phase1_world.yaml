analysis_meta:
  novel: "海的女儿"
  source_text: "full_text.md"
  source_form: "单篇童话，无章节标题"
  evidence_note: "原文为一整行，来源以情节段落描述标注。"

setting:
  era: "无明确历史年代的童话王国时代"
  duration: "从小人鱼十五岁前的长期等待，到王子婚礼后翌晨；核心行动集中在初次浮上海面后的数月。"
  location: "海王宫殿、海面与风暴、神庙海岸、王子宫殿、邻国皇城、返航婚船。"
  conflict_levels:
    internal: "小人鱼在安全家园、爱情渴望、灵魂渴望和自我牺牲之间持续撕裂。"
    personal: "小人鱼爱王子但不能说出救命真相；王子把她当亲密孤女而非新娘；姐姐们以亲情要求她杀王子自救。"
    external: "人鱼与人类世界物种隔绝，灵魂规则、身体形态、婚姻制度和巫婆契约共同限制主角行动。"

world_rules:
  physical:
    - "海底存在宫殿、花园、舞厅和王族秩序，人鱼能在水下长期生活并歌唱。"
    - "人鱼十五岁后才被允许浮上海面，每位姐姐的首次上浮展示不同的人间/海面景观。"
    - "人鱼没有腿，变成人必须通过巫婆药剂，过程伴随割裂身体般的剧痛。"
    - "变成人后每一步都像踩在刀刃上，且不能再回到海底形态。"
    - "人鱼没有眼泪，无法以哭泣宣泄情感；眼泪是人类与精灵的能力。"
    - "黎明是生死边界：王子若另娶，小人鱼在婚后第一个早晨会化为泡沫。"
  social:
    - "海底王国由海王、老祖母与公主群构成，等级以牡蛎装饰等童话礼制外化。"
    - "人间王国以王族婚姻、宫廷礼仪、神庙教育和教会婚礼构成权力秩序。"
    - "王子的婚姻受父母和邻国关系影响，个人情感必须进入王室联盟逻辑。"
    - "巫婆掌握跨界技术，但所有帮助都以不可逆损失为价格。"
  psychological:
    - "海底亲族默认长寿和安全优先，把人间和灵魂追求视为危险妄想。"
    - "小人鱼以审美和想象先爱上人间，再把王子投射为灵魂通道。"
    - "王子依赖视觉相似和救命记忆判断爱情，无法识别沉默者的真实功劳。"
    - "童话宇宙把善行视为可以累积并转化灵魂资格的精神劳动。"

genre_conventions:
  primary_genre: "文学童话"
  secondary_genre: "宗教救赎寓言"
  conventions:
    - convention: "跨界愿望通过魔法交易实现。"
      planned_subversion: "交易不给主角语言优势，反而夺走她最能表达爱的能力，使欲望执行天然失败。"
    - convention: "救命之恩应当带来爱情回报。"
      planned_subversion: "救命事实被误认转移给神庙女子，主角无法通过功绩获得爱情。"
    - convention: "童话婚礼是圆满结局。"
      planned_subversion: "婚礼属于王子与他人，主角的真正高潮发生在婚礼之后的谋杀/自灭选择中。"
    - convention: "牺牲换奖赏。"
      planned_subversion: "牺牲没有换来王子爱情，只换来继续行善、三百年后可能获得灵魂的开放式救赎。"

daily_life:
  - dimension: "海底日常"
    findings:
      - detail: "公主们拥有各自花坛，用沉船遗物装饰花园。"
        story_implication: "小人鱼以太阳花和人类石像区别于姐姐，早早显出向上世界的欲望。"
      - detail: "海底舞会以歌声、贝壳灯火和激流舞蹈构成。"
        story_implication: "她放弃的不只是家庭，而是一套完整且美丽的生活秩序。"
  - dimension: "人间宫廷"
    findings:
      - detail: "宫殿、骑马、宴会、舞会和婚礼组成王子的日常环境。"
        story_implication: "小人鱼进入人间后仍处于观看者和陪伴者位置，缺少可改变制度的语言与身份。"
  - dimension: "宗教/灵魂观"
    findings:
      - detail: "人类有不灭灵魂，人鱼长寿但死后化为泡沫。"
        story_implication: "故事冲突从爱情不成升级为存在论危机。"

creative_constraints:
  - constraint: "主角失声。"
    narrative_function: "阻断解释救命真相的捷径，使所有情感表达只能通过身体、眼睛、舞蹈和行动完成。"
  - constraint: "变人后每步疼痛。"
    narrative_function: "把留在人间的每一天都变成可见代价，避免愿望实现显得轻易。"
  - constraint: "人鱼没有眼泪。"
    narrative_function: "剥夺常规情感宣泄渠道，使悲伤更难以承受；并在结尾'第一次感到要流出眼泪'形成回收闭环——眼泪标记她已超越人鱼形态、成为天空女儿。"
  - constraint: "王子必须以婚姻形式全心爱她，灵魂规则才成立。"
    narrative_function: "把私人爱情绑定到社会制度，制造主角无法绕开的终局条件。"
  - constraint: "杀王子可以恢复人鱼生命。"
    narrative_function: "把最终危机压缩为纯粹道德选择：自救还是慈悲。"

source_evidence:
  - "海底宫殿、花园、祖母讲十五岁规则：物理与社会秩序的建置段。"
  - "祖母解释人鱼寿命、泡沫和人类灵魂：灵魂规则的直接来源。"
  - "巫婆交易条款：跨界代价、失声、疼痛和死亡期限的直接来源。"
  - "王子赴邻国看公主与教堂婚礼：人间婚姻制度对结局的约束。"
