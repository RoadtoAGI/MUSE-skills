novel: 流浪地球
author: 刘慈欣
lang: zh
translator: ''
narration_voice: 第一人称生命回忆，个人遭遇总被文明尺度覆盖
diction: 白话叙述嵌精确工程词，数字量级和灾变词密集
rhetoric_density: high
dialogue_mode: 对白多为论证、宣言或价值转折，少寒暄
pacing: 长段奇观压迫推进，关键判断用短句骤停
signature_moves:
- 用儿童或普通人视角仰望行星级工程，让无知感放大尺度
- 把爱情、亲情、婚育写入制度和灾难，私人情感被时代吞没
- 先给科学机制和数字，再用可见景观把机制变成恐惧
- 让希望反复借蓝光、星光、歌声等物象回到叙述中
- 在群体狂热或群体泪水中完成价值反转
anti_signature:
- 把末日写成纯心理独白而缺少工程机制和量级
- 让人物长时间闲聊日常，脱离生存选择和文明命题
- 用细腻文艺腔替代冷硬数字、灾变景观和短句反转
author_cross_ref: 同样依赖问答释设定、奇观慢摇和冷句收束；本作更集中于第一人称代际见证，少多线史料结构。
style_card_by: Codex (executor)
