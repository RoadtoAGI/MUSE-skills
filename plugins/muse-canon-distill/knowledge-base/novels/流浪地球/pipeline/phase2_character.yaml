# Phase 2: 人物系统 —— 《流浪地球》逆向分析
# 本文件只记角色之间的关系（系统层），个体画像见 characters/*.md

# ── 设计特征 ──
# 《流浪地球》是典型的"观念驱动"而非"人物驱动"小说。
# 角色的功能不是展开个人弧光，而是作为"时代样本"——
# 每个角色代表人类面对末日的一种精神姿态。
# 刘慈欣有意弱化个体性格（主角甚至没有名字），
# 强化"个体被时代碾过"的渺小感，这本身就是一种人物设计策略。

cast_overview:
  protagonist: 叙述者（无名）
  antagonist: >
    没有个体对手。对抗力量是"集体恐惧与怀疑"——
    它在不同阶段化身为不同形态：
    早期是对太阳的恐惧，中期是自然灾难，后期是叛军。
    最终的对手是人类自己的理性局限：
    "永远保持理智确实是一个奢求"。
  supporting_cast:
    - name: 父亲
      function: 信念传递者——"希望是这个时代的黄金和宝石"是全篇道德核心；同时是"牺牲"的具象化（死于清除小行星）
    - name: 小星老师（黎星）
      function: 知识与温暖的载体——引导儿童认识世界的"摆渡人"；生态球论证奠定了"地球派"的叙事合理性；后来与父亲的关系暗示情感在这个时代的流动性
    - name: 加代子（山彬加代子）
      function: 叙述者的"对立镜像"——同一段经历、同样的苦难，但最终走向叛军。夫妻分裂映射人类分裂
    - name: 灵儿
      function: 虚无主义的出口——代表"拥抱毁灭"的精神姿态，与叙述者"忍耐前行"形成对比。消失即其命运
    - name: 母亲
      function: 情感麻木的时代缩影——对丈夫出轨无感、几天忘记情人名字。她的死（岩浆灾难中排在最后）体现了危急法的残酷理性
    - name: 爷爷
      function: "流浪地球"回响句的起源——"啊，地球，我的流浪地球啊"从爷爷传到叙述者，贯穿全篇
    - name: 最高执政官
      function: 信念殉道的终极象征——他的演说是全篇的道德高潮："是我们把信念坚持到了最后"
    - name: 阿东
      function: 飞船派代表——童年时的对手，其生态球的死亡反证了地球派的合理性

contrast_axes:
  # 所有角色都面对同一个问题："在绝望中如何活下去？"
  # 对比轴就是他们各自不同的回答
  primary_axis:
    dimension: 面对末日的精神姿态
    spectrum:
      - pole_a: 坚守信念（父亲、最高执政官）
        description: "拥有希望，做高贵的人"——即使看不到结果
      - pole_b: 拥抱虚无（灵儿）
        description: "地球就是宇宙中的一个小水泡，啪一下"——接受毁灭
      - middle: 忍耐与随波逐流（叙述者、母亲）
        description: 不确信但也不放弃，在恐惧与希望之间摇摆
      - reversal: 以"理性"反叛（加代子、叛军）
        description: 声称基于证据推翻信念，实际是恐惧的另一种出口
  secondary_axis:
    dimension: 个体vs集体
    spectrum:
      - pole_a: 为集体牺牲个人（父亲——死于任务、最高执政官——坦然赴死）
      - pole_b: 为个人否定集体（叛军——声称集体决策是骗局）

relationships:
  power_dynamics: >
    联合政府统治全球，但其权力基础是一个不可证伪的科学预测。
    当"证据"（太阳没变化）动摇预测时，权力在瞬间崩溃。
    这是一个关于"知识-权力"关系的极端寓言：
    当真理无法在当下证实，权力就只能靠信念维系。
  key_tensions:
    - 叙述者vs加代子：相同经历→对立选择（忠诚vs反叛），核心张力在于"同一份苦难可以导向相反的结论"
    - 父亲vs母亲：父亲拥有信念（"做高贵的人"），母亲已情感麻木——但两人都在这个时代"活下来了"
    - 小星老师vs灵儿：同为叙述者童年的引路人，一个引向知识和希望，一个引向虚无和消失
    - 最高执政官vs叛军领袖：信念vs"证据"的终极对决，以殉道vs胜利的反讽收场
  potential_shifts:
    - 叙述者在高潮时实际上已倒向叛军心理——"想像中的感觉变成一种快感"——氦闪迫使他重新面对自己
    - 加代子从"爱人"到"敌人"的转变不是渐进的，而是突然的——她"默默地"接过枪，"没有回头"
