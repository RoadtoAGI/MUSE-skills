# Phase 0: 构想 —— 《流浪地球》逆向分析
# 刘慈欣 | 中篇科幻小说 | 约 2.3 万字

premise: "如果太阳即将毁灭，人类决定带着整个地球逃亡到最近的恒星系——这段跨越一百代人的旅程中，人类精神将经历什么？"

core_value:
  positive: 希望（信念、理性坚守）
  negative: 绝望（怀疑、背弃真理）
  spectrum:
    contradictory: 麻木——对生死已无感，"用余光瞥一下"爱情等非生存议题
    contrary: 恐惧——害怕但仍行动，如每次近日点的"宇宙俄罗斯轮盘赌"
    negation_of_negation: 以理性之名扼杀希望——叛军声称太阳不会爆发、联合政府是骗局，处死坚守者，恰在氦闪发生之时

controlling_idea:
  value: 希望
  cause: 即使真理在当下不可证实，坚持理性判断和集体信念的勇气终将被证明是正确的
  full_statement: "当人类以信念坚守希望——即使付出生命代价——生存终将被证明是值得的，因为真理不会因多数人的怀疑而改变。"
  type: idealistic  # 但带有强烈反讽色彩：真理的证实伴随着坚守者的死亡

genre:
  primary: 科幻（硬科幻）
  secondary: 史诗（跨越百代人的文明迁徙）
  conventions:
    - setting: 末日逃亡——面对天文灾难的全人类动员
    - characters: 普通人视角而非英雄视角
    - events: 灾难、技术奇迹、社会崩溃与重建
    - values: 生存 vs 尊严，集体 vs 个体

originality_statement:
  unique_angle: "带着地球流浪"——不是造飞船逃亡，而是将家园本身变为诺亚方舟，赋予"故土"物理实体性。用编年体+第一人称亲历呈现宏大时间尺度，将宇宙级事件压缩为个人生命史
  cliches_to_avoid:
    - 避免了太空歌剧的英雄叙事——没有个体英雄拯救人类，只有集体决策和普通人的见证
    - 避免了末日叙事中的绝望美学——始终维持希望的暗线，即使在最黑暗时刻
    - 避免了科幻中技术凌驾于人的问题——技术是背景板，核心是人类精神状态的演变

style_directives:
  - 第一人称编年体叙事，以个人生命史丈量文明旅程
  - 宏大场景的"微观视角"——个人眼中的宇宙级事件
  - 冷静克制的情感表达，诗意集中爆发于关键节点（如星空下看比邻星、飞机中的蓝光、结尾之歌）
  - 科学细节嵌入叙事而非独立展示，服务于崇高感的营造

word_count: 约23000字
