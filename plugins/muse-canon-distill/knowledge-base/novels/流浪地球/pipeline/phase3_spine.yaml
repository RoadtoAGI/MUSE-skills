# Phase 3: 脊椎 + 幕/Arc 框架 —— 《流浪地球》逆向分析

inciting_incident:
  description: >
    天体物理学家发现太阳内部氢转化为氦的速度突然加快，计算预测太阳将在400年内发生氦闪——
    人类启动"流浪地球"计划，地球停转并安装12000台行星发动机。
    这一事件发生在叙述者出生前约380年，但其后果构成了叙述者整个生命的存在条件。
  type: accident  # 自然灾难的发现，非人为决策
  timing: 故事时间轴起点前约380年；叙事中通过背景交代（上篇第37-41行）
  balance_before: 人类在太阳系安居，正常的文明生活——"前太阳时代，那真是个让人神往的黄金时代"
  balance_after: >
    地球停转（42年刹车）、12000台行星发动机安装、人类迁入地下城、
    社会结构全面重组（联合政府、危急法、生育管控）、所有生活围绕逃亡展开
  impact_on_protagonist: >
    叙述者从出生起就活在这个失衡的世界中——"我没见过黑夜，我没见过星星，我没见过春天、秋天和冬天"。
    生存恐惧是他的基本存在条件，而非后天遭遇。

desire_object:
  conscious: >
    生存——个人层面：活过这段旅程；集体层面：地球安全抵达比邻星。
    "那是黑夜大海狂浪中远方陆地的灯塔"——比邻星是具象化的希望。
  unconscious: >
    在苦难中保持为人的尊严和信念——父亲说的"做高贵的人"。
    不仅要活着，更要值得活着。信念本身比生存更重要。
  tension: >
    生存的渴望可能导致放弃信念——叛军正是因为"想活"才否认太阳会爆发。
    选择"生存"（回归太阳）还是"信念"（继续流浪）构成故事的核心张力。
    叙述者最终选择了信念（加入政府军），而妻子选择了"生存"（加入叛军）。

spine_statement: >
  在跨越百代人的流浪旅程中，人类面临的终极考验不是物理灾难，
  而是能否在绝望中坚守对真理和希望的信念——即使这信念在当下不可证实。

spine_type: unconscious
  # 表层故事是物理逃亡（conscious：到达比邻星），
  # 但真正的脊椎是精神考验（unconscious：坚守信念）。

dramatic_question:
  question: >
    人类能否在这段看似不可能的旅程中坚持到底，
    而不因恐惧和怀疑自我毁灭？
  obligatory_scene: >
    太阳氦闪的实际发生——在叛军处死最后的坚守者时，太阳爆发了，
    以最残酷的方式证明了信念的正确。

opposing_forces:
  internal: 每个人内心的恐惧和怀疑——连叙述者自己也不完全确信联合政府是对的
  personal: 家庭的持续破碎（母亲遇难、父亲牺牲、妻子成为敌人）消磨着坚持的意志
  external: 自然灾害（岩浆、小行星、木星引力）+ 社会危机（叛乱）从两个方向夹击

# ── 幕/Arc 框架 ──

arcs:
  - arc_id: ARC-1
    name: "认知与启航"
    value_at_start: 懵懂——生于末世而不自知，"这一切都很自然"
    value_at_end: 希望确立但离别已开始——比邻星是灯塔，爷爷去世
    climax_event: 星空下看到比邻星/地球启航/爷爷去世（上篇第68-73行）
    function_note: 建置世界观、植入核心论点（生态球）、锚定希望象征

  - arc_id: ARC-2
    name: "逃亡与丧失"
    value_at_start: 希望与恐惧交替——"宇宙俄罗斯轮盘赌"
    value_at_end: 物理逃亡成功但精神代价惨重——失去所有亲人，地球面目全非
    climax_event: 木星引力弹弓，地球达到逃逸速度（中篇第206-211行）
    function_note: 通过递进灾难消耗叙述者的一切羁绊；中点反转——物理成功催生精神危机

  - arc_id: ARC-3
    name: "信念审判"
    value_at_start: 从恐惧解脱——但怀疑蔓延，"太阳没有任何变化"
    value_at_end: 真理被证实——但代价是5000名坚守者的生命
    climax_event: 冻刑+太阳氦闪爆发（下篇第243-260行）
    function_note: 故事核心——从外部威胁转为内部信念危机，以宇宙级反讽收束

# ── 全篇高潮设计 ──

story_climax_design:
  crisis:
    dilemma: >
      当所有民间观测显示太阳"同四个世纪前相比没有任何变化"时——
      是坚守流浪计划（可能已被骗了四百年），
      还是推翻计划把地球开回太阳轨道（可能让人类回到毁灭之路）？
    option_a: 坚守流浪计划——继续在寒冷外太空流浪2000年，可能是一场骗局
    option_b: 推翻联合政府——把地球开回太阳，可能让全人类走向毁灭
    character_revelation: >
      叙述者选择忠于联合政府——不是因为确信，而是因为"三代前辈种下的忠诚的种子"。
      但在高潮时刻他的忠诚已被侵蚀——看坚守者被冻死时"快感传遍全身"。
      这揭示了：即使选择了"正确"一方的人，也无法真正坚守信念到最后。
  climax:
    action: >
      联合政府投降，5000名地球派被冻刑处死。
      就在岸上十几万人唱着《我的太阳》庆祝时——太阳氦闪爆发。
    value_change:
      from: 绝望/怀疑胜利——叛军控制地球，坚守者被处死
      to: 希望/信念被证实——但代价是坚守者的生命，"幸运的是，还有人活着"
    controlling_idea_expression: >
      宇宙级反讽：真理不因多数人的否定而消失——即使所有人都不信太阳会爆发，它还是爆发了。
      坚守者以生命殉道，"这颗叫地球的行星，就是我们永恒的纪念碑"。
  resolution:
    new_balance: >
      地球航出太阳系，进入漫长的流浪时代。50年后叙述者已老，
      大气冻结、地表荒芜，但地球发动机仍在运行。
    lingering_feeling: >
      苦涩的希望——真理被证实了，但坚守者已死；旅程还有2000多年；
      "啊，地球，我的流浪地球……"——回响句从爷爷传到叙述者，绵延不绝。
