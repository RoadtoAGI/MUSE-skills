# Phase 1: 世界 —— 《流浪地球》逆向分析

setting:
  era: 未来，从"刹车时代"到"流浪时代"——约跨越500年（叙述者亲历约70-80年）
  duration: 叙述者一生，覆盖刹车时代末期 → 逃逸时代 → 叛乱 → 流浪时代初期
  location: 地球（地表 + 地下城500米深处）、冰封的太平洋、木星近距离、太阳系外太空
  conflict_levels:
    internal: 个体在绝望与希望之间的持续摇摆——"我们来不及"vs"要做高贵的人"
    personal: 家庭关系在生存压力下的系统性异化——父亲出轨被平静接受、妻子加入叛军、母亲在灾难中遇难
    external: 太阳氦闪威胁（自然）、岩浆灾难/小行星撞击（物理灾害）、飞船派vs地球派的持续冲突 → 最终叛乱（社会）

world_rules:
  physical:
    - 太阳将在400年内发生氦闪（氦元素聚变传遍太阳内部），届时地球将被汽化  # 上篇第37-40行
    - 地球发动机（重元素聚变）12000台，安装在亚洲和美洲大陆板块上，可推动整颗行星  # 上篇第12行
    - 地球自转已停止——一面永昼一面永夜，近地球发动机区域酷热（70-80°C）  # 上篇第9-14行
    - 逃逸需绕太阳15圈变轨加速，最终借木星引力弹弓达到逃逸速度  # 中篇第206行
    - 远离太阳后大气冻结为固态氧氮，海洋冰封  # 流浪时代第264行
  social:
    - 联合政府统治全球，制定"流浪地球"五步计划（刹车→逃逸→流浪Ⅰ→流浪Ⅱ→新太阳）  # 上篇第66行
    - 危急法：灾难撤离按年龄排序，幼者优先，老者殿后  # 中篇第134-136行
    - 生育权管控：每三对新婚配偶抽签一对获得生育权  # 中篇第152行
    - 教育全面转向理工科，艺术哲学压缩到最少  # 中篇第87行
    - 记忆遗传技术普及，使幼儿即具备专业知识  # 中篇第85行
    - 宗教一夜之间消亡——"人们终于明白，就算真有上帝，他也是个王八蛋"  # 中篇第87行
  psychological:
    - 死亡恐惧压倒一切情感——爱情被"用余光瞥一下"，如赌徒盯轮盘间隙喝口水  # 中篇第95行
    - 希望成为"这个时代的黄金和宝石"——最稀缺的精神资源  # 中篇第110行
    - 每次近日点引发集体恐惧周期——"宇宙俄罗斯轮盘赌"  # 中篇第128行
    - 人类可以忍受物质匮乏和物理灾难，却在信念危机前崩溃——叛乱的根源

genre_conventions:
  primary_genre: 硬科幻（末日逃亡）
  secondary_genre: 史诗
  conventions:
    - convention: 末日逃亡叙事通常以建造飞船为核心方案
      planned_subversion: 用地球本身作为逃亡载体——小星老师的生态球论证提供了叙事合理性："小的生态系统经不起时间的风浪"
    - convention: 科幻通常设置个体英雄驱动情节
      planned_subversion: 没有英雄——叙述者是普通人/见证者，重大决策来自集体（联合政府/航行委员会），个人只是时代洪流中的一粒沙
    - convention: 灾难叙事通常聚焦于灾难本身的恐怖
      planned_subversion: 最大的灾难不是太阳爆发或小行星撞击，而是人类对真理的集体背弃——叛乱比任何自然灾害都更致命
    - convention: 科幻中爱情通常是核心情感线
      planned_subversion: 爱情被系统性边缘化——父亲出轨/回归被视为寻常事，叙述者与加代子的婚姻淹没在生存危机中，最终妻子成为敌人

daily_life:
  - dimension: 居住
    findings:
      - detail: 人类居住在地下500米的城市中，地面高温/严寒不适宜生存
        story_implication: 地下城既是庇护所也是牢笼，"原始人就住洞里，我们又住洞里了"——文明的循环感
      - detail: 全息投影提供虚拟天空和森林，但人们看腻了也不会调
        story_implication: 对生活品质的漠视，暗示精神层面的萎缩
  - dimension: 情感关系
    findings:
      - detail: 婚恋关系极度淡化——离婚/再婚被平静接受，妈妈几天就忘记丈夫情人的名字
        story_implication: 生存压力系统性地压缩了所有非生存情感，为后文"信念"的稀缺性做铺垫
  - dimension: 教育
    findings:
      - detail: 环球体验课让儿童亲历世界——地球发动机、日出、星空
        story_implication: 教育即世界观植入，"第一次看日出"成为恐惧社会化的仪式
  - dimension: 节日
    findings:
      - detail: 远日点成为节日——人们在冰封海面上狂欢、放焰火、喝醉打滚
        story_implication: 虚幻的安全感催生了疯狂的庆祝，暗示人类精神的极端脆弱

creative_constraints:
  - constraint: 旅程需2500年/100代人——任何个体都看不到终点
    narrative_function: 使"希望"成为纯粹的信念行为而非理性计算，放大了坚守的崇高感
  - constraint: 地球停转后不可能有季节和昼夜交替
    narrative_function: "最后一次日出""最长的一夜"等成为不可逆的告别仪式，强化离别的永恒感
  - constraint: 联合政府的决策无法在当下被证实（太阳是否真会爆发）
    narrative_function: 直接催生叛乱——核心冲突建立在"不可证伪"的信念之上
