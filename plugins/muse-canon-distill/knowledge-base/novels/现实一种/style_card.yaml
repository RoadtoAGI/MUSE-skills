novel: 现实一种
author: 余华
lang: zh
translator: ''
narration_voice: 全知冷叙频繁贴身，暴力不作道德解释
diction: 日常口语、身体腐坏词、医学术语并置
rhetoric_density: medium
dialogue_mode: 短句逼问和哄劝制造反讽，叙述接管后果
pacing: 家常动作慢铺，暴力骤发后细部拖长
signature_moves:
- 用儿童或病态感官替代伦理判断
- 把死亡写成吃饭、赶路、办手续般的日常事
- 用反复问答把家庭关系推成刑讯结构
- 让残酷动作披上温和照料或职业流程
- 在暴力后插入器物、天气、身体幻觉延迟情绪
anti_signature:
- 直接抒情控诉人物罪恶
- 把暴力写成英雄式决斗
- 用心理解释替代可见动作
