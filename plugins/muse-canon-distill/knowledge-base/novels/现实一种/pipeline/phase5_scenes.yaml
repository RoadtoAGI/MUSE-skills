# Phase 5: 关键场景 — 《现实一种》余华
# 逆向分析产出
# 场景按 sequence_expansions 组织，嵌套在序列下

sequence_expansions:

  # ═══ ARC-1: 暴力萌芽 ═══

  - seq_id: ARC1-SEQ1
    scenes:
      - scene_id: "S01"
        arc_id: ARC-1
        location: 家中——餐桌、各房间
        time: 雨天早晨
        participants: [山岗, 山峰, 母亲, 两个妻子, 皮皮, 堂弟]
        pov: 全知视角，依次掠过每个家庭成员
        conflict: 无显性冲突；母亲的喋喋不休 vs 所有人的无视
        value_start: 麻木的平衡
        value_end: 麻木的平衡（尚未打破）
        must_include: >
          米粥油条的早饭仪式、母亲"骨头发霉"的抱怨、兄弟俩同时说"讨厌"、
          妻子们"脸上的神色像泥土"、皮皮偷吃咸菜引发祖母哭泣
        handoff: 大人离家上班，皮皮和堂弟被留在家中（进入无人监管状态）
        source_chapter: 第4-10行

      - scene_id: "S02"
        arc_id: ARC-1
        location: 家中——摇篮旁、窗前
        time: 上午，大人上班后
        participants: [皮皮, 堂弟]
        pov: 皮皮的感知视角（第三人称）
        conflict: 皮皮追求感官刺激 vs 堂弟的无助
        value_start: 无聊（皮皮百无聊赖）
        value_end: 兴奋→索然无味（暴力快感的回报递减）
        must_include: >
          "现在正下着四场雨"——皮皮的诗意感知；
          拧脸→打耳光→卡喉管的暴力升级（模仿"父亲经常这样揍母亲"）；
          堂弟"灿烂地哭了起来"——暴力被描写为审美体验
        handoff: 皮皮对暴力失去兴趣，走到窗前，天晴了→决定带堂弟去看太阳
        source_chapter: 第11-16行

      - scene_id: "S03"
        arc_id: ARC-1
        location: 屋外水泥地
        time: 上午，天晴后
        participants: [皮皮, 堂弟]
        pov: 皮皮的视角——他不理解发生了什么
        conflict: 皮皮的力不从心 vs 堂弟的重量
        value_start: 天真的欢愉（阳光、树叶、麻雀）
        value_end: 死亡（堂弟血流在水泥地上"像一朵花"）
        must_include: >
          "他感到越来越沉重"→松手→"两种声音，一种沉闷一种清脆"；
          蚂蚁爬向血迹、一只蚂蚁"爬进了堂弟的脑袋"；
          皮皮走回屋告诉祖母"弟弟睡着了"——对死亡的完全无知
        handoff: 皮皮在厨房睡着，祖母看到血但没有认出孙儿→堂弟母亲提前下班
        beat_direction: "天真→死亡：暴力以最无意的形式完成最不可逆的后果"
        source_chapter: 第17-20行

  - seq_id: ARC1-SEQ2
    scenes:
      - scene_id: "S04"
        arc_id: ARC-1
        location: 街上→家中
        time: 中午前后
        participants: [山峰, 山峰妻子]
        pov: 交替：妻子在街上的恍惚→山峰回家后的暴怒
        conflict: 山峰的丧子之痛 vs 妻子的恍惚无力
        value_start: 恐惧（妻子"响亮地哭了起来"）
        value_end: 暴力爆发（山峰殴打妻子——暴力的第一次转嫁）
        must_include: >
          妻子在胡同里"横冲直撞"、张嘴说不出话；
          山峰命令妻子哭——"你可以哭了""最好再来点声音"；
          拳打→头撞墙→"为什么死的不是你"
        handoff: 山峰走出卧室追问母亲"是谁抱出去的"→引出皮皮的答案
        source_chapter: 第21-54行

      - scene_id: "S05"
        arc_id: ARC-1
        location: 家中外间
        time: 午饭时间
        participants: [山峰, 山岗, 皮皮, 母亲, 山岗妻子]
        pov: 山岗为主
        conflict: 山峰要皮皮偿命 vs 山岗保护儿子
        value_start: 山峰的暴怒对准了目标（皮皮）
        value_end: 暴力被暂时遏制（皮皮被带入卧室）
        must_include: >
          皮皮用比山峰"还要响亮的声音"回答"我抱的"——天真与暴怒的碰撞；
          山岗说"他还是孩子"、承受两拳"歪一下头却没有倒下"；
          皮皮"兴致勃勃地欣赏着山峰的拳头"
        handoff: 山岗开始用金钱谈判→被拒→将皮皮交给山峰
        beat_direction: "保护→妥协：山岗的每一步退让都关闭了一种较温和的选项"
        source_chapter: 第55-76行

  - seq_id: ARC1-SEQ3
    scenes:
      - scene_id: "S06"
        arc_id: ARC-1
        location: 家中外间→卧室门前
        time: 午后
        participants: [山岗, 山峰, 山岗妻子]
        pov: 山岗
        conflict: 金钱赎罪 vs 以命偿命
        value_start: 山岗仍在尝试理性解决
        value_end: 山岗主动交出皮皮——理性手段全部耗尽
        must_include: >
          "这里是五千元，这事就这样结束吧"→"不行"；
          山岗妻子"不能这样，他会打死他的""我求你了"；
          山岗把皮皮推上去——"把他交给你了"
        handoff: 山峰提出舔血条件→进入舔血场景
        source_chapter: 第81-97行

  # ═══ ARC-2: 报复循环 ═══

  - seq_id: ARC2-SEQ1
    scenes:
      - scene_id: "S07"
        arc_id: ARC-2
        location: 屋外水泥地（血迹处）
        time: 午后
        participants: [山峰, 皮皮, 山岗妻子, 山峰妻子]
        pov: 山岗从窗后观看（旁观者视角）
        conflict: 山峰的报复欲 vs 皮皮的无知
        value_start: 屈辱的妥协（皮皮被迫舔血）
        value_end: 死亡（山峰一脚踢死皮皮）——中点反转
        must_include: >
          山岗妻子先代舔被踢开，"跪起来拼命地呕吐"；
          皮皮舔血——"一种崭新的滋味油然而生"（血被当成果浆）；
          山峰飞起一脚，皮皮"身体腾空而起，随即脑袋朝下撞在了水泥地上"；
          山岗目睹后的解离——"杂草丛生，除此以外还有一口绿得发亮的井"
        handoff: 山岗从窗后走出→处理儿子尸体→对妻子说"已经死了"
        beat_direction: "仪式→爆发：舔血本应是闭合，但反而引爆了更大的暴力"
        source_chapter: 第99-110行

  - seq_id: ARC2-SEQ2
    scenes:
      - scene_id: "S08"
        arc_id: ARC-2
        location: 家中——卧室、外间
        time: 午后至翌日清晨
        participants: [山岗, 山岗妻子, 山峰]
        pov: 山岗
        conflict: 山岗的"冷静"（压抑）vs 妻子的复仇驱动
        value_start: 山岗表面平静——"把他葬了吧""你看，他睡着了"
        value_end: 复仇计划成熟——山岗带着绳子走向山峰
        must_include: >
          山岗将儿子盖上毯子说"你看，他睡着了"；
          妻子反复说"你是胆小鬼""你起码也得揍他一拳"；
          山峰递来两把菜刀，山岗拒绝——"我不需要"；
          "我宁愿你死去，也不愿看你这样活着"；
          山岗外出带回肉骨头和小狗；
          翌日清晨山岗对狗说"待会儿就得请你帮忙了"——"山峰完全垮了"
        handoff: 山岗推门走入山峰卧室，开始"谈判"
        source_chapter: 第111-154行

  - seq_id: ARC2-SEQ3
    scenes:
      - scene_id: "S09"
        arc_id: ARC-2
        location: 屋外——树下
        time: 翌日清晨（约七点半至八点半）
        participants: [山岗, 山峰, 小狗, 两个妻子]
        pov: 交替：山峰的混沌感知 + 山岗的"亲切"操控
        conflict: 山岗的精密计划 vs 山峰的精神崩溃
        value_start: 山峰虚弱绝望（"我觉得自己快要死了"）
        value_end: 山峰被笑死——暴力以最荒诞的形式完成
        must_include: >
          "把你妻子交给我"→"还是绑我吧"——山峰的自愿投降；
          "等一下你会哈哈乱笑"；按摩太阳穴→涂肉骨头→狗舔脚底；
          "像两张铝片刮出来一样"的笑声→打嗝→窒息；
          山岗全程"亲切"——"你可真高兴呵""什么事这么高兴"；
          山峰想起真相喊"你放开我"→但已无力反抗；
          最后笑声"像爆炸似的疯狂响起来"→戛然而止→死亡
        handoff: 山岗确认死亡→吃早饭→山峰妻子指控
        beat_direction: "亲切→窒息：每一个'关怀'动作都在推向死亡"
        source_chapter: 第154-214行

  # ═══ ARC-3: 制度暴力 ═══

  - seq_id: ARC3-SEQ1
    scenes:
      - scene_id: "S10"
        arc_id: ARC-3
        location: 家中→街上→未竣工建筑
        time: 同日上午
        participants: [山岗, 山峰妻子, 山岗妻子]
        pov: 交替：山峰妻子→山岗妻子→山岗
        conflict: 山峰妻子的控诉 vs 山岗的否认与精神解体
        value_start: 山岗在早餐桌旁，假装什么都没发生
        value_end: 山岗被捕——作为自由人的存在终结
        must_include: >
          山峰妻子三次递进："你把我丈夫杀了"→"杀害了"→"你杀害了我的丈夫"；
          山岗"不是我，是那条狗"；
          山岗妻子递行李——"你该逃走了"；
          山岗精神恍惚游荡：渔行说"腥味真受不了"、与鞋匠讨论皮质、
          "原来我不是来撒尿的"、露出生殖器在街上引路人大笑
        handoff: 山岗在建筑中被武警发现→一个月后枪决
        source_chapter: 第215-233行

  - seq_id: ARC3-SEQ2
    scenes:
      - scene_id: "S11"
        arc_id: ARC-3
        location: 郊外刑场
        time: 一个月后
        participants: [山岗, 武警, 围观人群]
        pov: 山岗
        conflict: 山岗最后的求生本能 vs 不可逆的刑罚
        value_start: 山岗被押上卡车——"请手脚干净点"
        value_end: 山岗被三枪打死
        must_include: >
          山岗想起自己以前常来这里看枪毙——围观者变承受者；
          要求撒尿→"就尿在裤子里"→尿不出来；
          第一枪打掉耳朵→翻筋斗站起来问"我死了没有"→众人哈哈大笑；
          第二枪第三枪→彻底死亡
        handoff: 转入山岗妻子的梦→山峰妻子的最终行动
        beat_direction: "荒诞的求生→荒诞的死亡：国家暴力需要三次才能完成"
        source_chapter: 第234-249行

      - scene_id: "S12"
        arc_id: ARC-3
        location: 家中→街上
        time: 枪决当天早晨
        participants: [山岗妻子, 山峰妻子, 母亲（已死）]
        pov: 交替：山岗妻子的晨间→山峰妻子的计划
        conflict: 两个寡妇的不同回应——默然 vs 行动
        value_start: 两个寡妇在同一屋檐下默默吃早饭
        value_end: 山峰妻子以捐献遗体完成最后的报复
        must_include: >
          山岗妻子的梦——半个脑袋的山岗说"我被释放了"；
          老太太的死——死亡"像冰雪一样无声无息"蔓延，最后微笑固定如相片；
          山峰妻子自称"山岗的妻子"——身份偷换无人察觉；
          "她愿将山岗的尸体献给国家"→"嘴角始终挂着微笑"
        handoff: 救护车将山岗的尸体送往解剖地点
        source_chapter: 第250-262行

      - scene_id: "S13"
        arc_id: ARC-3
        location: 即将拆除的房屋中（临时解剖室）
        time: 枪决当天
        participants: [山岗（尸体）, 医生们]
        pov: 全知视角，聚焦于医生们的职业动作和闲聊
        conflict: 无传统冲突；医生们的职业乐趣 vs 读者的不安
        value_start: 山岗是一具"赤裸裸的身体"在灯光下"闪闪烁烁"
        value_end: 山岗被还原为器官、骨骼、皮肤碎片，分散各处
        must_include: >
          女医生从胸骨到腹下"一刀切得笔直"→"我在中学学几何时从不用尺划线"；
          脂肪"像棉花一样微微鼓起"→"像泥浆一样四散开去"→"阳光下的菜花地"；
          口腔科医生"为什么不把眼睛打坏"；
          胸外科医生"我觉得自己是在挥霍"；
          尿医生"你们可别把我的睾丸搞坏了"；
          山岗的睾丸使另一个年轻人生了儿子——"山岗后继有人了"；
          取骨骼的医生对山岗说"你就会显得弱不禁风"——全篇最后一句
        handoff: 无——故事在此终结
        beat_direction: "职业日常→人的彻底物化：解剖被写成欢快的工作叙事"
        source_chapter: 第261-270行

tension_curve:
  description: >
    张力呈三个高峰，对应三个 Arc 的高潮：
    ARC-1 高峰在 S05-S06（兄弟对峙/交出皮皮），
    ARC-2 高峰在 S07 和 S09（皮皮之死 + 山峰笑死），
    ARC-3 高峰在 S11 和 S13（枪决 + 解剖）。
    每个峰值都比前一个更冷酷、更"文明"——暴力的形态从冲动到精密到制度化。
    最终高峰（S13 解剖）不是传统的紧张感，而是持续的、无处可逃的不适。
  peaks: ["S07", "S09", "S11", "S13"]
  valleys: ["S01", "S08", "S10"]

causal_chain: >
  S01（冷漠日常）→ S02（皮皮对堂弟施暴，因为模仿父亲打人）→
  S03（松手，堂弟摔死——因为力气不够）→
  S04（山峰暴怒打妻——因为丧子之痛无处释放）→
  S05（兄弟对峙——因为皮皮暴露身份）→
  S06（金钱赎罪失败→交出皮皮——因为生命无法用金钱量化）→
  S07（舔血→山峰踢死皮皮——因为仪式无法平息怒火）→
  S08（山岗内部转变→准备复仇——因为丧子之痛+妻子施压）→
  S09（绑树酷刑→山峰笑死——因为冷静计划替代冲动报复）→
  S10（山岗精神瓦解→被捕——因为杀人后的精神崩溃）→
  S11（三枪枪决——因为国家司法的以命偿命）→
  S12（山峰妻子捐献遗体——因为要确保山岗死后不得安宁）→
  S13（医生解剖→器官延续——因为医学将人体视为资源；
  山岗的睾丸使人生子——因果链以最荒诞的方式延续）
