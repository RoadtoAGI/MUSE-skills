# Phase 4: 序列展开 — 《现实一种》余华
# 逆向分析产出
# 接收 Phase 3 的 3 个 Arc，逐 Arc 展开为序列

arc_expansions:
  - arc_id: ARC-1
    sequences:
      - seq_id: ARC1-SEQ1
        name: "冷漠日常与暴力萌芽"
        core_conflict: "封闭家庭中压抑的冷漠 vs 无人监管的孩童"
        escalation_direction: >
          从家庭成员的集体麻木 → 皮皮独处的无聊 → 对堂弟施暴的感官刺激追求
        sequence_climax: "皮皮松手，堂弟摔死在水泥地上（第18行）"
        closed: "家庭的虚假平衡——堂弟之死使其不可恢复"
        opened: "谁要为这个死亡负责？暴力的因果追溯开始"

      - seq_id: ARC1-SEQ2
        name: "丧子暴怒与暴力转嫁"
        core_conflict: "山峰的丧子之痛无处释放 vs 妻子/母亲的无力回应"
        escalation_direction: >
          从妻子的恍惚 → 山峰确认死亡 → 暴打妻子（暴力转嫁） →
          逼问母亲 → 皮皮得意地喊出"我抱的"
        sequence_climax: "皮皮高声回答'我抱的'，山峰扑向皮皮（第65行）"
        closed: "凶手身份的悬念——皮皮自己揭露"
        opened: "山峰要皮皮偿命，山岗必须做出选择"

      - seq_id: ARC1-SEQ3
        name: "兄弟对峙与和解失败"
        core_conflict: "山峰的偿命诉求 vs 山岗的保护/调解"
        escalation_direction: >
          从身体挡住 → 承受拳打 → 五千元赎罪被拒 → 主动交出皮皮
        sequence_climax: "山岗将皮皮推到山峰面前——'把他交给你了'（第97行）"
        closed: "和平解决的可能性——金钱无法偿还生命"
        opened: "皮皮的命运交到了山峰手中；舔血仪式能否平息怒火？"

    arc_progression_note: >
      三个序列的冲突层级递进：无冲突的日常 → 家庭内部的暴力转嫁 →
      兄弟之间的正面对峙。每个序列的结局都关闭了一种"较温和的解决方案"，
      迫使下一个序列的冲突更加激烈。

  - arc_id: ARC-2
    sequences:
      - seq_id: ARC2-SEQ1
        name: "舔血仪式与第二次死亡"
        core_conflict: "山峰的报复仪式 vs 皮皮的天真无知"
        escalation_direction: >
          从山岗妻子代舔被踢开 → 皮皮舔血（"一种崭新的滋味"） →
          山峰妻子扑向皮皮 → 山峰飞起一脚踢死皮皮
        sequence_climax: "皮皮身体腾空而起，脑袋朝下撞在水泥地上（第103行）——中点反转"
        closed: "山峰的复仇——但代价是创造了新的受害者和新的复仇者"
        opened: "山岗从调解者变为丧子父亲；他将如何回应？"

      - seq_id: ARC2-SEQ2
        name: "山岗的内部转变"
        core_conflict: "山岗的理性压制 vs 妻子的复仇驱动 + 丧子之痛"
        escalation_direction: >
          从"把他葬了吧"的解离 → 妻子反复施压"你是胆小鬼" →
          山峰递来菜刀（冲动型决斗被拒绝） → "我宁愿你死去" →
          山岗外出买肉骨头、捡小狗——复仇计划在沉默中成形
        sequence_climax: "山岗带肉骨头和小狗回家，对狗说'待会儿就得请你帮忙了'（第153行）"
        closed: "山岗的'调解者'身份——从此刻起他是复仇者"
        opened: "复仇将以什么形式实施？（答案出人意料地不是菜刀）"

      - seq_id: ARC2-SEQ3
        name: "亲切的酷刑"
        core_conflict: "山岗的精密计划 vs 山峰的精神崩溃（几乎无抵抗）"
        escalation_direction: >
          从"把你妻子交给我"的伪装谈判 → 山峰自愿被绑 →
          按摩太阳穴的伪装关怀 → 涂肉骨头 → 狗舔脚底 →
          笑声从"铝片刮出来"到"打嗝"到"爆炸"到戛然而止
        sequence_climax: "山峰的脑袋猛然摔了下去——笑死（第213行）"
        closed: "兄弟之间的暴力循环——以最荒诞的形式闭合"
        opened: "杀人之后呢？山峰妻子、国家、社会将如何回应？"

    arc_progression_note: >
      三个序列展示了暴力形态的升级：冲动型（山峰踢人）→ 压力累积型（山岗妻子驱动）→
      计划型（山岗的精密装置）。每个序列的施暴者和受害者都在翻转——
      SEQ1 的施暴者（山峰）在 SEQ3 变成了受害者。

  - arc_id: ARC-3
    sequences:
      - seq_id: ARC3-SEQ1
        name: "指控与瓦解"
        core_conflict: "山峰妻子的控诉 vs 山岗的否认与精神解体"
        escalation_direction: >
          从山峰妻子三次递进的指控 → 山岗妻子递行李让他逃 →
          山岗精神恍惚游荡街头 → 露出生殖器不自知 → 被捕
        sequence_climax: "山岗在未竣工建筑中被武警叫醒（第233行）"
        closed: "山岗作为自由人的存在"
        opened: "国家将如何处置他？"

      - seq_id: ARC3-SEQ2
        name: "国家暴力与遗体处置"
        core_conflict: "山岗最后的求生本能 vs 不可逆的国家刑罚；山峰妻子的制度化复仇"
        escalation_direction: >
          从押上卡车 → 刑场上想撒尿 → 第一枪打掉耳朵（"我死了没有"） →
          第二枪第三枪 → 山峰妻子冒充身份捐献遗体 → 医生们瓜分山岗的身体
        sequence_climax: "取骨骼的医生对山岗说'你就会显得弱不禁风'（第270行）——全篇最后一句"
        closed: "山岗作为'人'的存在——被还原为器官、骨骼和皮肤"
        opened: "山岗的睾丸使另一个男人生了儿子——暴力的基因以最荒诞的方式延续"

    arc_progression_note: >
      暴力在这个 Arc 中完成了从个人到制度的跃迁：
      家庭暴力（私刑）→ 国家暴力（枪决）→ 科学暴力（解剖）。
      每一层都比上一层更"合法"、更"文明"、更不可质疑。

causal_chain: >
  ARC1-SEQ1（日常冷漠→皮皮无人管→堂弟摔死）
  →（因为堂弟死亡需要追责）ARC1-SEQ2（山峰暴怒→暴力转嫁→皮皮暴露）
  →（因为山峰要偿命）ARC1-SEQ3（兄弟对峙→金钱赎罪失败→山岗交出皮皮）
  →（因为舔血仪式无法平息怒火）ARC2-SEQ1（皮皮舔血→山峰踢死皮皮）
  →（因为山岗丧子+妻子施压）ARC2-SEQ2（山岗内部转变→买肉骨头准备复仇）
  →（因为复仇计划成熟+山峰精神崩溃）ARC2-SEQ3（绑树酷刑→山峰笑死）
  →（因为山峰妻子报警）ARC3-SEQ1（指控→山岗精神瓦解→被捕）
  →（因为国家司法+山峰妻子的制度化复仇）ARC3-SEQ2（枪决→遗体捐献→解剖→器官延续）
