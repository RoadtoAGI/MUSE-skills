# Phase 1: 世界 — 《现实一种》余华
# 逆向分析产出

setting:
  era: 1980年代中国南方小镇（未明确标注年代，从细节推断：童车厂、中学教师、煤气灶、搪瓷杯、粮票、劳动车、武警）
  duration: 约一个月（从"那天早晨"到山岗被枪决，中间"一个月以后"山岗被押上卡车）
  location: 南方小镇——胡同、院落、中学、医院、天宁寺附近拘留所、郊外刑场、乡间解剖房
  conflict_levels:
    internal: >
      暴力冲动与理性克制的拉锯。山岗前半段极力压制（"别这样""他还是孩子"），
      后半段彻底释放（绑树酷刑）；山峰则是瞬间爆发、无法自控。
    personal: >
      兄弟之间的血债——皮皮摔死山峰之子→山峰踢死皮皮→山岗杀死山峰。
      夫妻之间的权力碾压——山峰殴打妻子、山岗妻子逼迫山岗报复。
      妯娌之间的冷漠与对抗——共处一室却形同陌路。
    external: >
      国家暴力机器：法院审判→武警押送→刑场枪决。
      医学制度：合法化的遗体处置，将人体拆解为器官、骨骼、皮肤。

world_rules:
  physical:
    - 封闭的院落空间——暴力发生在家门之内，水泥地上的血迹成为反复出现的物质标记
    - 身体的脆弱性被反复强调——孩子"像一块布飘起来"、头颅撞击水泥的声响、血"像花一样慢吞吞开放"
    - 季节从雨天转为晴天，阳光不是希望的象征而是暴力的照明灯——血迹在阳光下"闪闪发亮"
  social:
    - 家庭内部等级：兄长山岗有隐性权威，山峰是弟弟、情绪更外露
    - 以命偿命的朴素正义观被所有人默认——山峰要皮皮"偿命"，山岗妻子要山岗"去找山峰算帐"
    - 国家司法以暴制暴——枪决是公开的、围观的、娱乐化的
    - 医学对遗体的处置被视为"献给国家"的正当行为
  psychological:
    - 暴力具有传染性：皮皮打堂弟是模仿"父亲经常这样揍母亲"（第15行）
    - 情感表达被压抑或扭曲——山峰命令妻子哭、山岗妻子命令丈夫报复
    - 人对暴力的感知会迅速钝化——山岗看到儿子被踢死后"杂草丛生，还有一口井"（解离状态）
    - 老太太的身体妄想（骨头折断、肠子腐烂）是家庭暴力环境的躯体化反应

genre_conventions:
  primary_genre: 先锋小说
  secondary_genre: 家庭悲剧
  conventions:
    - convention: 先锋小说的实验性叙事——打破因果逻辑的线性叙述
      planned_subversion: >
        余华反而保持了严格的因果链条（A杀B→C杀A→D杀C→国家杀D→医学分解D），
        用最"现实主义"的因果逻辑服务于最荒诞的暴力寓言。"先锋"不在结构实验，
        而在叙事态度——零度情感的语调本身就是对传统叙事伦理的颠覆。
    - convention: 家庭悲剧中的道德清算——善恶有报、苦难引发同情
      planned_subversion: >
        没有善恶之分，没有值得同情的人物。每个人都是暴力链条上的一环，
        包括孩子（皮皮的施暴出于好奇而非恶意，但后果同样致命）。
        最终的"清算"是山岗被解剖——不是道德清算，而是物质层面的彻底拆解。
    - convention: 暴力叙事中的情感高潮——读者应在暴力场景中体验恐惧或悲伤
      planned_subversion: >
        零度叙事剥夺了读者的情感出口。山峰被笑死、山岗被枪决、遗体被解剖——
        每个场景都被写成近乎日常的职业操作，恐惧被转化为不安的荒诞感。

daily_life:
  - dimension: 饮食
    findings:
      - detail: 早饭由米粥和油条组成，老太太吃素配自制咸菜
        story_implication: 日常细节建立了暴力发生前的"正常"基准线，也在结尾呼应（山峰妻子和山岗妻子仍在吃早饭）
  - dimension: 职业
    findings:
      - detail: 兄弟俩是中学教师，妻子们也有各自工作（童车厂会计等）
        story_implication: 普通的职业身份强化了"这可以是任何家庭"的普遍性
  - dimension: 居住
    findings:
      - detail: 大家庭共居一院，各有卧室但共用外间和厨房
        story_implication: 物理空间的紧密强制了家庭成员之间的互动，也使暴力无处可逃

creative_constraints:
  - constraint: 叙事空间几乎完全局限于这个院落
    narrative_function: 封闭空间放大了暴力的回响——每一声哭喊、每一摊血迹都在所有人的感知范围内
  - constraint: 时间高度压缩——核心暴力事件发生在一天之内（从早晨到翌日清晨）
    narrative_function: 暴力的因果链在极短时间内完成全部升级，营造出不可阻挡的加速感
