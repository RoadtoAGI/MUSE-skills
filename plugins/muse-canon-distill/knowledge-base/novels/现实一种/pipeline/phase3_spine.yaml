# Phase 3: 脊椎 + Arc 框架 — 《现实一种》余华
# 逆向分析产出
#
# 注：本作没有传统意义上的单一主角。山岗是最接近主角的人物——
# 故事的因果链最终收束在他身上（他的儿子引发悲剧，他完成报复，他承受后果）。
# 但暴力循环本身才是真正的"主角"。

inciting_incident:
  description: >
    四岁的皮皮将婴儿堂弟从屋外抱起后松手，堂弟头部撞击水泥地，
    血从脑袋里流出"像一朵花似地在慢吞吞开放着"（第19行）。
    堂弟死亡。
  type: accident  # 皮皮没有杀人意图，是好奇心和力量不足导致的意外
  timing: 故事约10%处（第14-19行），发生在故事开始的同一个早晨
  balance_before: >
    一个压抑但勉强运转的大家庭：兄弟俩默默无语地走去上班、妻子们面无表情、
    母亲喋喋不休地抱怨身体——所有人相互冷漠但没有公开冲突。
    暴力以微小形式存在（山岗揍妻子被皮皮模仿，第15行），但尚未失控。
  balance_after: >
    一个孩子的死彻底撕裂了家庭的虚假平衡。山峰丧子的暴怒、
    山岗被迫在"保护儿子"与"面对弟弟的丧子之痛"之间抉择——
    从此所有行动都指向不可逆的报复与反报复。
  impact_on_protagonist: >
    对山岗的直接影响是延迟的：他最初并不在场，回家后才逐步卷入。
    但皮皮是他的儿子——他注定被拖入这条因果链。
    他的第一反应是试图用金钱解决（"这里是五千元，这事就这样结束吧"，第90行），
    这揭示了他最初的克制和理性。

desire_object:
  conscious: >
    山岗自觉的追求在故事前半段和后半段截然不同——
    前半段：维持家庭的平衡，阻止暴力升级（挡在皮皮面前、用钱了结、说"他还是孩子"）
    后半段（皮皮死后）：对山峰实施精确的、仪式化的报复
  unconscious: >
    山岗真正需要的——也是他永远无法获得的——是从这个暴力家庭中解脱。
    他的"冷静"不是真正的超越，而是另一种形式的暴力压抑。
    当他终于动手时，酷刑的精心设计（肉骨头、狗、绑树、按摩太阳穴的"亲切"）
    揭示了深埋的施虐本性——他不是被迫复仇，而是享受复仇的过程。
  tension: >
    表面的理性克制 vs 深层的暴力本性。这条张力线贯穿全篇：
    山岗越是表现得"文明"（微笑、亲切、讲道理），他最终释放的暴力就越令人毛骨悚然。
    "你可真高兴呵"——他对正在被笑死的弟弟说（第210行）。

spine_statement: >
  一个被暴力吞噬的家庭中，每一次"以牙还牙"的正义都将暴力推向
  更极端的形态，直到所有人——施暴者、受害者、旁观者——都被彻底消耗，
  而暴力本身继续以新的面目（国家刑罚、医学解剖）延续下去。
spine_type: unconscious
  # 没有任何角色意识到自己在推动暴力循环；
  # 每个人都认为自己在寻求"公正"，实际上都在喂养暴力本身。

dramatic_question:
  question: >
    这条以牙还牙的暴力链将在何处、以何种方式终结——还是说它根本不会终结？
  obligatory_scene: >
    山岗对山峰的报复场景（绑树酷刑，第168-214行）——
    这是戏剧问题的核心回答：暴力不会因"公正的报复"而终结，
    反而以更精致、更残忍的形式重生。
    而故事没有在此停下，继续延伸到枪决和解剖——
    暴力从家庭扩展到国家和科学领域，回答了"根本不会终结"。

opposing_forces:
  internal: 山岗内心的理性克制 vs 暴力冲动（前半段压制，后半段释放）
  personal: >
    山峰的丧子之怒、山岗妻子的复仇驱动（"你是胆小鬼""我宁愿你死去"）、
    山峰妻子最终的法律报复
  external: >
    国家司法系统（审判、枪决）、医学制度（遗体捐献与器官分配）

# ── 幕/Arc 框架 ──
arcs:
  - arc_id: ARC-1
    name: "暴力萌芽：从冷漠日常到兄弟对峙"
    value_at_start: "麻木的家庭平衡——冷漠但无公开冲突"
    value_at_end: "暴力爆发但被暂时遏制——山岗用身体和金钱试图封堵裂口"
    climax_event: "山岗将皮皮交给山峰，试图用'交换'终结冲突（第95-97行）"
    function_note: "建置暴力的种子和家庭生态；展示山岗'调解者'面具"

  - arc_id: ARC-2
    name: "报复循环：从皮皮之死到山峰之死"
    value_at_start: "暴力失控——皮皮被踢死，第二个孩子死亡"
    value_at_end: "暴力'文明化'——山岗以亲切的伪装完成最残忍的杀戮"
    climax_event: "山峰在狗舔脚底引发的笑声中窒息死亡（第213行）"
    function_note: "核心 Arc。山岗从调解者到施虐者的弧光在此完成；暴力的形态从冲动升级为精密"

  - arc_id: ARC-3
    name: "制度暴力：从指控到物化"
    value_at_start: "个人暴力的后果——山岗被指控、被捕"
    value_at_end: "人的彻底物化——山岗被还原为器官、骨骼和皮肤碎片"
    climax_event: "医生们解剖山岗的遗体，将其拆分为可移植的零件（第261-270行）"
    function_note: "延伸 Arc。将暴力从家庭领域推至国家和科学领域，证明暴力永不终结、只换面目"

# ── 全篇危机/高潮/结局 ──
story_climax_design:
  crisis:
    dilemma: >
      皮皮被踢死后，山岗面临选择——
      接受现实（"把他葬了吧"）还是以牙还牙？
    option_a: >
      放下——山岗最初的反应就是这样："把他葬了吧"（第111行）。
      他将儿子放在床上盖上毯子，说"你看，他睡着了"（第114行）。
      这条路意味着继续压抑，继续当那个"冷静的人"。
    option_b: >
      报复——山岗妻子持续推动（"你是胆小鬼""去找山峰算帐"），
      山峰递来菜刀挑衅，外部压力不断叠加。
      但山岗选择的不是冲动式的以暴制暴，而是精心策划的酷刑。
    character_revelation: >
      危机揭示了山岗的真实本性：他不是一个被迫复仇的悲伤父亲，
      而是一个将暴力精心包装为"亲切"的施虐者。
      山岗的"理性"从来不是人性的胜利，而是暴力的更高级形态。
  climax:
    action: >
      山岗用麻绳将精神崩溃的山峰绑在树上，用木板固定双腿使之无法弯曲，
      脱掉袜子，将烧烂的肉骨头涂在脚底和太阳穴上，
      让一条小狗舔食。山峰被无法控制的痒逼到窒息性笑，
      最终"脑袋猛然摔了下去，摔在胸前像是挂在了那里"（第213行）。
    value_change:
      from: "冷漠（家庭成员之间的压抑共处）"
      to: "彻底的兽性（暴力以'亲切'的面貌完成了最残忍的杀戮）"
    controlling_idea_expression: >
      高潮场景完美体现了主控思想："以正义之名行残忍"。
      山岗的每一个动作——按摩太阳穴、涂"清凉油"、说"你会哈哈乱笑"——
      都披着关怀的外衣。当山岗对妻子说"高兴得都有点让我妒嫉了"时，
      暴力与文明之间的界限彻底消失。
  resolution:
    new_balance: >
      没有新的平衡——暴力继续以新的形式延续：
      山峰妻子的法律报复 → 国家的枪决 → 医学的遗体解剖。
      最后的"平衡"是山岗被还原为零件（皮肤、器官、骨骼），
      分散在不同的医院和展览中。
      山岗的睾丸甚至使另一个男人生了儿子——"山岗后继有人了"。
    lingering_feeling: >
      彻骨的荒凉与不安。故事没有提供任何道德出口：
      没有悔恨、没有反思、没有救赎。最后一个画面是
      取骨骼的医生对着一具被掏空的尸体说"你就会显得弱不禁风"——
      人已经彻底变成了物。
