# Phase 2: 人物系统设计图 — 《现实一种》余华
# 逆向分析产出
#
# 本文件只记角色之间的关系（系统层）。
# 个体画像（声音、对白、弧光）见 characters/*.md。

cast_overview:
  protagonist: 山岗
    # 注：本作没有传统意义上的"英雄"主角。山岗是因果链的最终承受者，
    # 也是暴力循环中完成最精密一环的人。他最接近"主角"的定义——
    # 故事围绕他的选择（保护→妥协→酷刑→死亡）展开。
  antagonist: 暴力本身
    # 山峰不是传统对手——他是暴力链条上的另一个环节。
    # 真正的对抗力量是暴力循环的自我增殖机制：
    # 每一次"正义的报复"都喂养了暴力本身。
  supporting_cast:
    - name: 山峰
      function: >
        暴力链的中间环——丧子后成为施暴者，又成为山岗复仇的对象。
        他的角色功能是展示"冲动型暴力"与山岗"计划型暴力"的对比。
    - name: 山岗妻子
      function: >
        复仇的催化剂——持续施压推动山岗从旁观者转为施暴者。
        她的功能是揭示"不动手的人如何成为暴力的共谋者"。
    - name: 山峰妻子
      function: >
        暴力的最终执行者——通过法律手段和遗体捐献完成复仇链的最后一环。
        她的功能是展示暴力如何被制度化和"文明化"。
    - name: 皮皮
      function: >
        激励事件的触发者——四岁孩子的好奇心引发整条暴力链。
        他的功能是展示暴力的"无辜起源"和代际传递（模仿父亲打人）。
    - name: 母亲（老太太）
      function: >
        家庭衰败的躯体化象征——她的身体妄想（骨头折断、肠子腐烂）
        是整个家庭暴力生态的隐喻投射。她的存在对情节无推动作用，
        但提供了背景性的不安氛围。
    - name: 堂弟（山峰之子）
      function: >
        纯粹的受害者——一个尚不能行走的婴儿，是暴力链的第一个牺牲品。
        他的"两只玻璃球一样的眼睛"反复出现，象征无辜的注视。
    - name: 医生们
      function: >
        暴力的终极执行者——他们以职业之名将人体拆解为零件。
        集体角色，无个体性格，功能是完成"人→物"的最终转化。

contrast_axes: >
  本作最核心的对比轴是**山岗 vs 山峰**——面对同等的丧子之痛，两人的反应揭示了
  暴力的两种形态：

  | 维度 | 山峰 | 山岗 |
  |------|------|------|
  | 暴力类型 | 冲动型（当场爆发） | 计划型（隔夜谋划） |
  | 情绪表现 | 外露（吼叫、打砸、踢门） | 压制（微笑、"亲切"、说道理） |
  | 暴力手段 | 直接肉搏（拳头、脚踢） | 精密装置（绑树+肉骨头+狗） |
  | 对暴力的态度 | 事后恐惧（"最害怕的时候是递给你菜刀"） | 事后从容（吃早饭，坐够一分钟） |
  | 道德自觉 | 有——害怕自己做的事 | 无——将酷刑包装为"关怀" |

  第二条对比轴是**两个妻子**：
  - 山岗妻子：在家庭内部施压，用语言暴力（"胆小鬼"）驱动丈夫
  - 山峰妻子：通过外部制度（法律、遗体捐献）完成报复

  第三条对比轴是**皮皮 vs 医生们**：
  - 皮皮出于好奇施暴，不理解后果——暴力的"天真"形态
  - 医生们出于职业习惯分解尸体，不关心来源——暴力的"专业"形态
  - 两者共同点：施暴者对暴力本身没有道德感知

relationships:
  power_dynamics: >
    家庭内部权力在故事中经历了戏剧性翻转：
    - 开局：山岗是隐性权威（兄长、更冷静、做决定的人），山峰是弟弟
    - 中段：山峰因丧子之怒获得暂时的暴力优势，山岗退让
    - 后段：山峰精神崩溃，山岗以绝对的心理优势碾压——
      "山峰完全垮了"（第154行）是权力翻转的关键判断
    - 终局：权力转移到制度层面——法院、武警、医生，个体完全丧失主体性

    夫妻关系中：
    - 山峰对妻子是公开的肉体暴力（打、踢、头撞墙）
    - 山岗妻子对山岗是语言暴力和道德绑架（"胆小鬼""我宁愿你死去"）
    - 两种暴力一样有效——前者制造恐惧，后者制造行动

  key_tensions:
    - 兄弟之间：血亲 vs 血仇——同一屋檐下长大的兄弟，因各自孩子的死变成杀手与猎物
    - 山岗内部：冷静面具 vs 施虐本性——他的"文明"不是暴力的对立面，而是暴力的伪装
    - 山岗妻子：爱 vs 控制——她为丈夫准备逃跑行李（关心），同时逼丈夫杀人（控制）
    - 山峰妻子：受害者 vs 复仇者——从被山峰殴打的受害者，变为对山岗实施最终制裁的复仇者

  potential_shifts:
    - 山岗从调解者到施虐者的转变是故事的核心弧光
    - 山峰从暴怒的施暴者到虚弱的受害者的转变
    - 山峰妻子从家庭暴力的沉默受害者到利用制度复仇的行动者
    - 暴力本身从个人层面（家庭）扩展到制度层面（国家、医学）
