# Phase 0: 构想 — 《现实一种》余华
# 逆向分析产出

premise: "如果一个家庭中孩子的无意之恶引发了成人之间以牙还牙的暴力报复，这条因果链将把每个人推向何方？"

core_value:
  positive: 人性（compassion / 怜悯与克制）
  negative: 兽性（cruelty / 残忍与暴力）
  spectrum:
    contradictory: 冷漠——对暴力不作为，既不施暴也不阻止（山岗前半段的状态）
    contrary: 麻木——对痛苦和死亡失去感知能力（老太太、两个媳妇日常状态）
    negation_of_negation: 以正义之名行残忍——用"公平交换"的逻辑将酷刑合理化（山岗绑树杀弟、山峰妻子捐献遗体）

controlling_idea:
  value: 暴力（兽性的胜利）
  cause: 当人将他人视为可交换、可处置的物体时，暴力就成为唯一的"现实"——从孩子的好奇、成人的报复、国家的刑罚到医学的解剖，暴力以不同形式贯穿始终，无人幸免
  full_statement: "暴力是人类关系的底层现实：它从孩童无邪的好奇中萌生，在亲人之间以正义之名升级，经由国家机器合法化，最终在医学解剖台上完成对人的彻底物化——人不过是一堆可拆卸的器官和骨骼。"
  type: pessimistic

genre:
  primary: 先锋小说（avant-garde fiction）
  secondary: 家庭悲剧 / 寓言体
  conventions:
    - setting: 普通中国家庭，封闭的生活空间（胡同、院落），日常化的场景
    - characters: 家庭成员——无显著社会身份，以家庭角色（兄弟、妻子、母亲、孩子）定义
    - events: 暴力事件层层递进，从意外到蓄意到制度化
    - values: 血亲复仇、以命偿命的朴素正义观

originality_statement:
  unique_angle: >
    以"零度叙事"（冷漠的第三人称全知视角）描写极端暴力，叙述者对暴行
    不做任何道德评判，使读者被迫直视暴力本身。暴力不是情节的高潮手段，
    而是故事的"日常质地"。最后一章将人体解剖写成几乎欢快的职业叙事，
    完成了从"人"到"物"的最终转化。
  cliches_to_avoid:
    - 避免了传统家庭悲剧中的道德审判和情感宣泄
    - 避免了暴力叙事中的英雄化或受害者化
    - 避免了结尾的救赎或和解——暴力链没有终点，只是更换了形式

style_directives:
  - 零度叙事：叙述者不介入情感判断，暴力与日常动作用同等语调描写
  - 感官物质化：将抽象情感转化为具体的身体感知（"骨头折断的声音"、"肠子腐烂的气息"）
  - 儿童视角穿插：通过皮皮的天真感知反衬暴力的荒诞（"四场雨"、把血当果浆舔）
  - 黑色幽默：山岗杀弟时的"亲切"语调、刑场上的撒尿闹剧、医生们的职业玩笑
  - 循环结构：开头（早晨、雨、米粥油条）与结尾（早晨、阳光、吃早饭）形成呼应

word_count: 28000
