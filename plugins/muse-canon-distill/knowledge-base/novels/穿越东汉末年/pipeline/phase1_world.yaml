analysis_meta:
  novel: 穿越东汉末年
  source_text: navigation.md
  source_form: 中篇连载历史穿越演义
  evidence_note: "以期数和导航锚点标注来源；第一轮未做逐场景行号切分"

setting:
  era: 183-207 年东汉末年架空时间线
  duration: 约二十四年，从黄巾前夕到刘官章称帝后完成制度重构。
  location: 益州安汉/巴郡为起点，扩展至益州、汉中、荆州、关中、凉州、江东、河北、中原、并州北部与交州海贸方向。
  conflict_levels:
    internal: 主角在“个人求生、救民、扩张、杀伐、改朝换代”之间不断校准边界，始终面对理想目标与残酷手段的冲突。
    personal: 主角与妻儿、早期部曲、降将、士族、历史名人和代理人之间的信任、利益、继承和控制问题。
    external: 东汉末年的饥荒瘟疫、征发兵灾、世家兼并、交通阻隔、华北平原压力、骑兵威胁、水军短板、小冰期和多方合法性竞争。

world_rules:
  physical:
    - 疾病、饮水、尸体处理和瘟疫风险直接影响统治稳定；开水房、墓地集中、蒸馏酒消毒等卫生措施具有战略价值。
    - 粮食、道路和运粮损耗决定军队能否扩张；金牛道、陈仓道、褒斜道、长江水路、黄河水运和海运都比单场战斗更重要。
    - 小冰期使北方冻灾、旱灾、马匹上膘、幽州农业和胡部南迁成为长期压力。
    - 钢、铁、铜、木材、硝石、硫磺、船材、马匹、煤铁复合体等材料限制技术应用速度。
    - 技术扩散有时间差；灌钢法、马镫、水排、三脚耧车、纸甲、火药和火炮都需要工匠、保密和产业链。
  social:
    - 世家通过土地、隐户、粮仓、私兵、婚姻和地方吏治控制基层，官府账本与真实人口土地长期脱节。
    - 汉室名分仍有约束力；天子诏书、宗室身份、周公/汉中王封号、九鼎、迁都和退位都能改变出兵合法性。
    - 士族投降不是道德选择，而是利益计算；分地比例、保留私兵、是否有未来军功和家族仕途决定合作程度。
    - 军队战斗力来自甲率、训练、军校、百夫长体系、后勤、士兵识字和奖惩，而非单个猛将。
    - 主角势力内部也有巴郡嫡系、东州降将、益州旧族、荆州旧部、江东士族、淮泗派和胡部代理人的利益分层。
  psychological:
    - 底层百姓首先追随能给饭、给地、给安全的人，政治名义必须落到实际活路上。
    - 士族和军阀普遍“谁赢帮谁”，但会在生存空间、土地和前途被威胁时激烈反抗。
    - 历史名人并非自动归心；诸葛亮、贾诩、周瑜、马超、刘备等人都需要通过安全、利益、名分或战略局势被纳入体系。
    - 主角长期压制炫技冲动，凡技术都先问“会不会被当妖人”“守不守得住”“生产力能否消化”。
    - 统治者个人威望可以快速扩张，但也会引发继承焦虑，因此结局必须转向制度下限。

genre_conventions:
  primary_genre: 历史穿越经营
  secondary_genre: 架空争霸
  conventions:
    - convention: 穿越者利用现代知识改造古代。
      planned_subversion: 现代知识被压进基层可执行细节，先从识字、堆肥、仓储、喝开水和户籍做起，而非一开始火药横扫。
    - convention: 汉末争霸围绕名将名臣和大型战役展开。
      planned_subversion: 战役胜负常由粮路、税率、隐户、军工分工、水军造船、世家土地谈判和出兵名分决定。
    - convention: 主角收集历史名人。
      planned_subversion: 名人的归附需要利益与制度位置，例如贾诩要私下安全感，周瑜要淮泗派保留前途，马超要骑兵利益和名分，诸葛亮要看见百姓不流离。
    - convention: 统一天下是终点。
      planned_subversion: 统一后才进入真正高潮，主角要废旧制、分权、重划州郡、清查人口和建立继承秩序。

daily_life:
  - dimension: 饮食与卫生
    findings:
      - detail: 底层开局以草、树皮、少量粮食维生，夜盲和坏血病常态化。
        story_implication: 让“活下去”成为所有政治价值之前的第一价值。
      - detail: 公共开水房、集中墓地、蒸馏酒消毒和公共厕所被制度化。
        story_implication: 现代卫生知识以民俗包装进入基层，减少瘟疫并增强统治黏性。
  - dimension: 农业与土地
    findings:
      - detail: 堆肥、轮种、选种、起垄挖沟、梯田、耧车、水车和土地禁买卖持续出现。
        story_implication: 农业不是背景板，而是军粮、民心和削弱兼并的核心系统。
      - detail: 给佃客、流民、山越、迁民分地并限制税率。
        story_implication: 主角用利益结构取代空洞仁义，使百姓和降族有可计算的合作理由。
  - dimension: 军工与技术
    findings:
      - detail: 灌钢法、纸甲、马镫、高桥马鞍、火药罐、铜炮、海船、望远镜等技术逐步升级。
        story_implication: 每一次技术释放都绑定具体战役窗口和保密成本。
      - detail: 军械司实行分工生产和良家子工人筛选。
        story_implication: 技术优势从个人知识转化为组织能力。
  - dimension: 交通与通信
    findings:
      - detail: 金牛道、陈仓道、褒斜道、驰道、驿站、长江水路、黄河水运和海运决定战略半径。
        story_implication: 地理和运输成本构成世界硬规则，限制主角不能随意平推。
      - detail: 结尾提出电报构想但被铜线、绝缘材料和覆盖范围限制。
        story_implication: 继续强调技术不是无成本奇迹。
  - dimension: 合法性与文化
    findings:
      - detail: 诏书、九鼎、周公、汉中王、蔡琰归汉、刘协退位和兰台修书共同构成正统工程。
        story_implication: 武力必须被解释为秩序恢复，文化解释权是后期国家建设关键。

creative_constraints:
  - constraint: 主角不能公开暴露过强的异类性。
    narrative_function: 迫使早期优势从识字、账本、农具和仓储开始，避免一穿越即神化。
  - constraint: 任何扩张都受粮食、道路、船只、马匹和甲胄限制。
    narrative_function: 让剧情以战略窗口和后勤能力递进，而非靠主角意志随时开战。
  - constraint: 世家不能被一次性消灭，必须在合作、分地、保留前途和定向清洗之间选择。
    narrative_function: 维持政治复杂性，并让每个新地区都有不同整合策略。
  - constraint: 汉室名分仍然有用但不能解决民生。
    narrative_function: 使刘协、曹操、袁绍、九鼎和退位成为长期政治压力，而非装饰。
  - constraint: 主角个人能力终有寿命边界。
    narrative_function: 把终局推向制度设计和继承体系，而不是停在个人胜利。
