analysis_meta:
  novel: 穿越东汉末年
  source_text: navigation.md
  source_form: 中篇连载历史穿越演义
  evidence_note: "以期数和导航锚点标注来源；第一轮未做逐场景行号切分"

premise: "如果一个掌握现代基层治理、生产力常识和历史走向的人，魂穿到东汉末年的贫弱平民身上，他能否不用神迹式金手指，而靠粮食、户籍、军工、交通和制度设计，让乱世百姓重新活下去？"

core_value:
  positive: 生民安堵的秩序
  negative: 乱世流离与吃人秩序
  spectrum:
    contradictory: 表面安稳但依附世家、随时可被抛弃的苟活
    contrary: 军阀争霸中只保强者利益的冷漠统治
    negation_of_negation: 以救民和正统之名重新制造压迫、兼并与权臣独裁

controlling_idea:
  value: 秩序、活路与制度化延续
  cause: 主角把现代知识降维为当时可执行的基层治理、生产力改良、军事后勤、合法性经营和分权制度，并愿意用冷酷手段压碎阻断活路的旧结构。
  full_statement: "在东汉末年的饥荒、兵灾和世家兼并中，真正能终结乱世的不是先知式炫技，而是把粮食、军队、道路、教育和权力制衡组织成可继承制度的长期建设。"
  type: ironic

genre:
  primary: 历史穿越经营
  secondary: 架空争霸、制度建设、技术种田
  conventions:
    - setting: 东汉末年黄巾之后的州郡、世家、军阀、流民和多民族边疆格局。
    - characters: 现代意识主角、汉末诸侯、历史名臣武将、地方豪强、士族和底层百姓。
    - events: 黄巾乱、刘焉入蜀、益州夺取、汉中争夺、荆州/江东/河北战役、挟天子合法性、改朝换代。
    - values: 生存、秩序、正统、技术、粮食、民心、合法性和制度下限。

originality_statement:
  unique_angle: "把穿越爽点从单件发明和战场胜利转为一整套‘基层账本式国家建设’：识字、税册、粮仓、堆肥、道路、盐铁酒糖专卖、军校、官学、人口清查、州郡重划与三省六部，层层构成主角的真正武器。"
  cliches_to_avoid:
    - 一穿越就凭诗词、火药或个人武力立刻封侯拜相。
    - 把历史名人简单收集成卡牌，而不处理粮草、名分和利益分配。
    - 把统一天下作为终点，不追问继承人和制度下限。
    - 把现代技术当成无成本奇迹，忽略材料、工匠、保密和物流。

style_directives:
  - 第一人称攻略式推演
  - 账本化历史叙事
  - 口语化吐槽与硬核制度细节并行
  - 用具体数字替代空泛宏大叙述
  - 战略选择常以“能不能活”“粮从哪里来”“谁愿意合作”落地

word_count: 157246

evidence:
  premise_sources:
    - 第1期：贫弱平民开局、三天口粮、识字成为第一跃迁资本。
    - 第2期：乡佐身份在乱世中仍无法保命，逃入大巴山。
    - 第3期：从个人逃生转为带领乡民自保、分粮分地。
    - 第20期：江东饥荒成为“救百姓于水火”的政治名分。
    - 第25-26期：刘协退位后没有停在称帝，而是进入制度重构。
  controlling_idea_sources:
    - 第8-9期：益州、汉中不是靠单场奇袭，而是靠粮食、军制、道路和派系整合拿下。
    - 第13-15期：火炮、盐糖、货币、防疫、造船和情报系统从技术变成国力。
    - 第21-24期：壶关、河北、幽州和青州战役都围绕补给、人口、世家土地条件和多线牵制展开。
    - 第26期：以分权制度和中央枢密军政院处理“主角死后怎么办”。
