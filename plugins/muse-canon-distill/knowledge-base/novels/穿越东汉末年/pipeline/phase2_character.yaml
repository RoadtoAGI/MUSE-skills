system_design_note: "本作的人物系统不是传统单一反派结构，而是‘主角组织能力’与多个旧秩序节点的连续对照：底层百姓证明价值目标，亲兵证明创业信用，谋臣证明制度能力，降将证明整合能力，儿子证明继承风险，天子和诸侯证明合法性压力。"
