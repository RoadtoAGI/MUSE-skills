analysis_meta:
  novel: 穿越东汉末年
  source_text: navigation.md
  source_form: 中篇连载历史穿越演义
  evidence_note: "以期数和导航锚点标注来源；第一轮未做逐场景行号切分"

inciting_incident:
  description: 黄巾和张修乱局摧毁安汉基层秩序，刘官章发现乡佐身份、坞堡和世家保护都无法保证生存；回乡后，幸存百姓请求他带大家找活路。
  type: accident
  timing: 第2-3期，约故事 8% 处
  balance_before: 刘官章虽贫弱出身，但已凭识字、做账和农技改良成为乡佐，拥有一定收入、民望和上升路径。
  balance_after: 官府、世家和坞堡在乱世中失效，刘官章从基层小吏被迫成为武装共同体领袖。
  impact_on_protagonist: 主角的目标从“自己活下去、继续进步”升级为“带乡人活下去，并建立一套不再任人宰割的秩序”。

desire_object:
  conscious: 在乱世中保住自身、家人和追随者，并逐步扩大地盘、钱粮、军队和合法性。
  unconscious: 找到一种个人死后仍能让百姓有活路、让国家有下限的制度化秩序。
  tension: 眼前每一步都要求算计、杀伐、妥协和利用旧势力；真正目标却要求主角不被军阀逻辑吞没，最终把个人威望交给制度。

spine_statement: "刘官章从益州贫民和乡佐起步，借现代基层知识、生产力改良、军事后勤、合法性经营和制度重构，在汉末乱世中把一片片求生共同体组织成可继承的新国家。"
spine_type: conscious

dramatic_question:
  question: 刘官章能否在不被世家、军阀、天子名分和自身权力欲反噬的情况下，把东汉末年的流离乱世改造成能让百姓长期活下去的秩序？
  obligatory_scene: 第25-26期，刘协退位后，刘官章不止称帝，而是重构一院三司三省六部、中央枢密军政院和地方军区，回答“统一之后靠什么维持下去”。

opposing_forces:
  internal: 对死亡、失控、继承失败和“自己也变成新压迫者”的焦虑；在仁政目标与残酷手段之间反复越界。
  personal: 妻儿继承线、早期功臣、降将、刘备集团、马超、周瑜、贾诩、诸葛亮、士族与胡部代理人的忠诚和利益管理。
  external: 饥荒、瘟疫、小冰期、道路险阻、世家兼并、汉室名分、曹袁孙刘等诸侯、骑兵威胁、水军短板和技术材料限制。

arcs:
  - arc_id: ARC-1
    name: 生存者变成乡土领袖
    value_at_start: 贫弱平民只能依附世家换饭吃。
    value_at_end: 刘官章拥有乡民、武装、粮食和事实自治权。
    climax_event: 第3期，刘官章演讲聚拢幸存者，武装乡民、剿地主、分粮分地。
    function_note: 建立主角价值根基：先让人活下去，再谈秩序。
  - arc_id: ARC-2
    name: 安汉豪强到巴郡支柱
    value_at_start: 万安乡只是乱后幸存的小共同体。
    value_at_end: 刘官章拥有安汉官方身份、巴郡北部资源、甘宁和严颜等关键军事/地方力量。
    climax_event: 第6期，刘官章夺荡渠、阆中、汉昌并迫使严颜归附。
    function_note: 把基层自治升级成区域政治力量。
  - arc_id: ARC-3
    name: 益州汉中与全国棋局
    value_at_start: 刘官章仍是益州乱局中的地方军阀。
    value_at_end: 他取得益州、汉中、成都和南中，拥有进入天下格局的钱粮、道路和名位。
    climax_event: 第9期，刘官章攻灭张鲁取得汉中，并转向修路、外交和马超布局。
    function_note: 完成从地方生存到全国战略的门槛跨越。
  - arc_id: ARC-4
    name: 关中受阻后的荆州转向
    value_at_start: 刘官章计划出汉中直取关中。
    value_at_end: 他因曹操焚长安和马超坐大而放弃西进，转向荆北并吞并荆州。
    climax_event: 第13期，铜炮震慑夺襄阳、迫江陵降服。
    function_note: 证明主角不靠单一路线，而能在失败后重构战略。
  - arc_id: ARC-5
    name: 关中江东与合法性跃迁
    value_at_start: 刘官章拥有荆益梁凉但仍受曹袁孙与天子名分牵制。
    value_at_end: 他接手关中、吞并江东、封周公，完成南方和政治位格跃迁。
    climax_event: 第20期，甘宁以救饥民之名破江东，九鼎现世推动刘官章受封周公。
    function_note: 把“救民”转化为可公开宣称的出兵名分，把军事实力转成合法性。
  - arc_id: ARC-6
    name: 河北中原与旧秩序退场
    value_at_start: 河北袁尚、曹操、刘协、颍川集团仍能互相牵制主角。
    value_at_end: 河北归刘、曹操退场、刘协入长安，旧汉末权力结构失去支撑。
    climax_event: 第24-25期，刘登、周瑜、马岱三线攻略河北，曹操求谈退场，刘协被迎入长安。
    function_note: 让下一步问题从“能否胜利”变成“胜利后如何安排天下”。
  - arc_id: ARC-7
    name: 从个人威望到制度国家
    value_at_start: 刘官章拥有天下和帝位，但国家仍依赖他的个人威望。
    value_at_end: 新朝通过一院三司三省六部、中央枢密军政院、十二军区、州郡重划和太子册立进入制度化状态。
    climax_event: 第26期，刘官章废三公九卿，建立新政治和军事结构。
    function_note: 回答全篇主控思想：制度下限才是乱世之后真正的胜利。

story_climax_design:
  crisis:
    dilemma: 天下大体已定后，刘官章必须在“继续维持权臣式个人统治”与“承担改朝换代并重构制度”之间选择。
    option_a: 保留汉室外壳，继续以周公、汉中王、大将军身份实际执政，短期阻力小但继承和权臣问题不解决。
    option_b: 让刘协退位，自己称帝，并趁威望最高时废旧制、分散相权、重构军政，承担篡位和改革反弹的风险。
    character_revelation: 刘官章最终关心的不是名位本身，而是自己死后国家还能不能运转、百姓还能不能安堵。
  climax:
    action: 刘官章接受刘协退位并称帝，随后建立一院三司三省六部制、中央枢密军政院和十二军区，重划州郡，清查人口，册立刘登为太子。
    value_change:
      from: 靠穿越者个人判断、军功和威望维系的战时秩序
      to: 以行政分权、司法监察、军政分离、基层识字和继承线支撑的制度化新秩序
    controlling_idea_expression: 作品用制度设计而非登基仪式作为最后动作，表达“真正终结乱世的是可继承的组织能力”。
  resolution:
    new_balance: 刘官章为皇帝兼中央枢密大将军，刘登为太子，三省三司与军政院分担治理，地方州郡重划后围绕司隶流动资源。
    lingering_feeling: 胜利带来安定，也留下对继承人水平、士族再生、边疆小冰期和制度长期韧性的现实忧虑。
