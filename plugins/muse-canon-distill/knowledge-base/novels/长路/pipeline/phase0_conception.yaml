# Phase 0: 构想 — 《长路》(The Road) by Cormac McCarthy
# 逆向分析：从结局回溯，高潮处确认的价值 → 反推前提和主控思想

premise: "如果文明在一夜之间被彻底摧毁，一个父亲带着幼子在遍地食人族的废土上徒步求生，人类的善良还能以什么形式存续？"

core_value:
  positive: 善良 / 人性之光（"火炬"）
  negative: 野蛮 / 人性泯灭（食人、奴役、掠夺）
  spectrum:
    contradictory: 冷漠（不帮助他人，但也不伤害他人——如父亲对被雷击者、对老人艾利的本能态度）
    contrary: 自保式残忍（如父亲剥光窃贼衣物——以正义之名施以等同于谋杀的惩罚）
    negation_of_negation: 以保护之名行毁灭（母亲主张杀死全家以"保护"他们免受更惨的命运；父亲教孩子用枪自杀以"保护"他）

controlling_idea:
  value: 善良（人性之火）可以在最极端的黑暗中存续并传递
  cause: 因为它不依赖文明、秩序或希望，而是依赖一个人对另一个人无条件的爱——父亲用生命守护孩子的肉身，更守护他灵魂中的善，使孩子成为"火炬"的承载者
  full_statement: "善良得以在绝对的黑暗中存续，因为它被一个甘愿为之赴死的人，通过爱与牺牲，传递给了下一个生命。"
  type: ironic
  # ironic 因为：故事在最绝望的背景下肯定了希望——父亲死了，但火炬传递了；
  # 世界毁灭了，但善良存续了。肯定与否定并存。

genre:
  primary: 后末日文学（Post-Apocalyptic Literary Fiction）
  secondary: 公路小说（Road Novel）/ 寓言
  conventions:
    - setting: "文明崩溃后的荒废大地，极端恶劣的生存环境"
    - characters: "幸存者分为掠食者（坏人）与被猎者（好人），道德选择成为核心考验"
    - events: "持续的资源搜寻、与敌对势力的遭遇、同伴的丧失"
    - values: "生存 vs 人性，希望 vs 绝望"

originality_statement:
  unique_angle: >
    拒绝解释灾难成因，也拒绝提供任何重建文明的可能——将后末日类型
    从"如何重建"的工程叙事，彻底转向"在不可逆的毁灭中，人之为人
    的最低限度是什么"的存在主义追问。全篇无章节划分、极少标点的
    连续意识流式散文体，将小说本身也推向了语言的"末日"。
  cliches_to_avoid:
    - "灾难起因的科学解释"    # 全书从未说明灾难是什么
    - "英雄式主角力挽狂澜"   # 父亲自始至终只是个病弱的普通人
    - "发现安全区/重建文明"   # 海岸并非救赎，父亲死在路上
    - "感官刺激式的暴力场景"  # 最恐怖的场景（地窖囚人、烤婴）用极度克制的笔触一笔带过

style_directives:
  - "零度叙事：以极简、冷峻的白描覆盖极端的情感内容"
  - "无章节划分，段落以空行间隔，形成连续的意识流"
  - "对白无引号标记，直接嵌入叙述体"
  - "大量使用短句和并列结构，形成经文/祷词般的节奏"
  - "父子无名——'男人'和'孩子'——普遍化为寓言符号"
  - "回忆与梦境以斜体（原文）/无过渡切入，过去与现在在叙述中无缝交融"
  - "物质细节极度精确（机油品脱数、弹壳口径），精神世界极度模糊"

word_count: 74000  # 中文译本约7.4万字
