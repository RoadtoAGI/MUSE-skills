# Phase 2: 人物系统设计图 — 《长路》(The Road)
# 只记角色之间的关系，不记个体画像（个体画像在 characters/*.md）

cast_overview:
  protagonist: "男人（父亲）——无名，全书称'他'或'男人'"
  antagonist: >
    没有单一人格化对手。对抗力量是三重的：
    (1) 食人族团伙——外部致命威胁的具象化
    (2) 环境——持续恶化的自然条件
    (3) 绝望本身——以母亲的声音内化在父亲心中
  supporting_cast:
    - name: "孩子（儿子）"
      function: "道德镜像与火炬承载者——他不是被保护的客体，而是故事真正的精神主角。随叙事推进，他从被动的受保护者成长为主动的善良守护者，最终在道德判断上超越父亲"
    - name: "母亲（妻子）"
      function: "反面论证的声音——她的自杀和临别遗言是父亲内心最强大的反面力量。她代表'面对现实'的另一种理性：既然一切无望，放弃才是真正的清醒"
    - name: "艾利（老人）"
      function: "哲学回音壁——全书唯一有名字的角色（虽是假名），提供外部视角。他的存在验证了孩子的特殊性（'见到那孩子我还以为自己死了'），同时否定了任何超自然解释（'没有上帝'）"
    - name: "带枪的男人（结局）"
      function: "传承的接收端——证明'好人'确实存在。他的出现回答了全书的戏剧问题，但不是作为巧合的救赎，而是作为孩子主动选择信任的对象"

contrast_axes: >
  全书最核心的对比轴是**父亲 vs 孩子的道德直觉**——
  面对同一个处境（被雷击者、老人艾利、小男孩、窃贼），
  父亲的本能是拒绝帮助（生存逻辑），孩子的本能是伸出援手（善良逻辑）。
  这条对比轴随叙事推进发生反转：到窃贼事件时，孩子已经成为
  道德权威（'就是我的事，我一定要管'），父亲则成为被纠正的一方。

  第二条隐性对比轴是**母亲 vs 父亲对末世的回应**——
  母亲选择了死亡（'死神就是情夫'），父亲选择了活着。
  两者都不是非理性的——母亲的论证在逻辑上无可辩驳，
  父亲的坚持在逻辑上无法证成。区别在于：父亲有孩子，
  而孩子的存在本身就是反驳绝望的唯一论据。

  第三条对比轴是**好人 vs 坏人**——这是全书的伦理坐标系。
  "好人"不吃人肉、互相帮助、"拿着火炬"；
  "坏人"食人、掠夺、奴役。这个二元划分是孩子的世界观，
  也是全书的道德框架——虽然简单，但在极端处境下，
  这种简单恰恰是最有力的。

relationships:
  power_dynamics: >
    父子之间的权力关系经历了完整的反转弧线——
    起初，父亲是绝对的保护者/决策者，孩子完全依附于他；
    到中段（地窖宝藏后），孩子开始在道德问题上拥有话语权；
    到后段（窃贼事件），孩子在道德判断上已经超越父亲；
    到终局，父亲将一切——包括火炬本身——交给孩子。
    这不是父权的瓦解，而是传承的完成。

  key_tensions:
    - "父亲的生存主义 vs 孩子的道德主义——每次遇到他人都会爆发"
    - "父亲对旧世界的记忆 vs 孩子对旧世界的无知——两人生活在不同的时间里"
    - "父亲的身体衰败 vs 孩子对他存活的依赖——不可解的结构性焦虑"
    - "母亲的遗言 vs 父亲的坚持——内化的、永远无法回应的辩论"

  potential_shifts:
    - "道德权威从父亲转移到孩子——在窃贼事件中完成"
    - "父亲从保护者变为被照护者——在最后的旅程中逆转"
    - "孩子从依附者变为独立决策者——在结局中实现"
