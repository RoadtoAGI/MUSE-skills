# Phase 1: 世界 — 《长路》(The Road)
# 逆向分析：识别对角色行为构成限制的世界规则——限制即叙事资源

setting:
  era: "不明确的近未来，某次未命名的大灾难后数年（可能7-10年）"
  duration: "约数月（秋末至隆冬再到次年），横跨从美国东南部山区到墨西哥湾沿海的徒步旅程"
  location: "美国东南部——从阿巴拉契亚山脉纵贯至墨西哥湾海岸的公路系统"
  conflict_levels:
    internal: >
      父亲：在保护孩子与保全人性之间的撕裂——每一次暴力自卫都在侵蚀
      他试图传递给孩子的善良信念。母亲自杀的记忆持续拷问他"活着是否值得"。
      身体的衰败（咳血、虚弱）使他不断逼近"无法再保护孩子"的终极恐惧。
    personal: >
      父子之间的道德张力：孩子天然的善良不断挑战父亲的生存主义逻辑
      （帮助被雷击者、喂食老人艾利、为窃贼求情）。父亲在"教孩子生存"
      与"不毁坏孩子的善"之间反复拉扯。
    external: >
      全面崩溃的自然环境（无阳光、无植被、持续降温）使食物和温暖成为
      终极稀缺资源。流窜的食人族团伙构成持续的致命威胁——他们代表
      人类在极端匮乏下的最坏可能。

world_rules:
  physical:
    - "太阳被遮蔽，天空永远灰蒙——光合作用停止，生态系统彻底崩溃"
    - "持续降温，冬季严寒可致命——积雪、冻雨是常态"
    - "空气中弥漫灰烬和烟尘，需佩戴口罩——呼吸本身是对健康的侵蚀"
    - "没有动物、鸟类、鱼类存活（极罕见例外）——食物链已断裂"
    - "森林大火仍在零星燃烧——大地在缓慢焚毁"
    - "地震偶发——地质活动仍在继续"
    - "海洋变灰，无海鸟，鱼骸铺满海岸——海洋生态同样死亡"
  social:
    - "没有政府、法律、货币——所有社会组织已消亡"
    - "人类分为两类：'好人'（不吃人肉、互相帮助者）和'坏人'（食人族、掠夺者）"
    - "食人族形成武装团伙，拥有卡车、武器、奴隶——他们是废土上唯一的'组织'"
    - "好人互相躲避——信任本身就是致命风险"
    - "物资（食物、衣物、燃料、弹药）是唯一的'货币'和权力来源"
    - "道路是唯一的移动通道，但也是最危险的暴露空间"
  psychological:
    - "梦见美好的旧世界 = 危险信号——意味着放弃求生意志（父亲反复警告）"
    - "记忆是双刃剑：维系人性，但也拖人入'死亡的召唤'"
    - "孩子从未见过旧世界——他的善良不是记忆，而是天性"
    - "'火炬'（carrying the fire）是父子间的信仰符号——善良的隐喻，无需神学背书"
    - "母亲的自杀是心理创伤的核心——'你就是不肯面对现实'的论断始终回响"

genre_conventions:
  primary_genre: 后末日文学
  secondary_genre: 公路小说 / 圣经寓言体
  conventions:
    - convention: "灾难有明确成因和科学解释"
      planned_subversion: "全书从未解释灾难是什么——唯一线索是'凌晨1:17的闪光'，但这不是答案，而是对'追问原因毫无意义'的宣告"
    - convention: "幸存者社区/安全区作为叙事目标"
      planned_subversion: "海岸（名义上的目的地）到达后并非救赎——同样荒凉、灰冷。'南方会好一些'自始至终是一个未被证实的信念"
    - convention: "主角团队逐步壮大、建立新秩序"
      planned_subversion: "父子始终只有两人，拒绝一切加入（老人艾利、小男孩）。团队不是答案，传递火炬才是"
    - convention: "暴力场景作为类型快感来源"
      planned_subversion: "最恐怖的暴力（地窖中被截肢进食的活人、串烤的婴儿）以极度克制的白描一笔带过，恐怖来自读者的想象填充而非作者的描写"
    - convention: "末日后出现变异生物/新物种"
      planned_subversion: "没有任何变异——只有缓慢的、不可逆的灭绝。世界不是在变异，是在死去"

daily_life:
  - dimension: "饮食"
    findings:
      - detail: "罐头食品是最高级的食物——发现一罐可乐是震撼性的事件"
        story_implication: "每一次进食都是叙事节拍——发现食物 = 希望上升，耗尽食物 = 绝望加深"
      - detail: "食人族将活人关在地窖中'养殖'，按需截肢食用"
        story_implication: "人类食物链的终极倒错——'坏人'的本质定义"
  - dimension: "行走与交通"
    findings:
      - detail: "购物车是核心装备——家当、食物、毛毯全靠它运载"
        story_implication: "购物车的得失直接影响生死：丢失 = 濒临死亡，重获 = 重启旅程"
      - detail: "大路是唯一的行进路线，但也是最大的暴露风险"
        story_implication: "所有遭遇（好人坏人）都发生在路上——'长路'既是物理空间也是命运隐喻"
  - dimension: "取暖与火"
    findings:
      - detail: "能否生火决定是否能活过一夜——打火机是关键物资，丢失打火机是重大危机"
        story_implication: "物理的火与精神的'火炬'形成双层隐喻"
  - dimension: "人际关系"
    findings:
      - detail: "遇见任何人都默认为致命威胁——父子间的对话占据全书90%以上的对白"
        story_implication: "人类社会已退化到'遇人即危'的状态，信任成为最奢侈的行为"

creative_constraints:
  - constraint: "持续恶化的环境——不会好转，只会更冷、更暗、食物更少"
    narrative_function: "制造不可逆的递增压力，驱动'必须继续南行'的叙事脊椎"
  - constraint: "父亲的身体在不可逆地衰败（咳血加重）"
    narrative_function: "内置了故事的终点——不是'能否到达海岸'，而是'在父亲死前能走多远'"
  - constraint: "手枪只剩一发真子弹（后来找到闪光弹枪）"
    narrative_function: "每次冲突都是生死赌博——无法通过武力优势解决问题，只能靠虚张声势和逃跑"
