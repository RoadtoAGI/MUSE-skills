# Phase 3: 脊椎 — 《长路》(The Road)
# 逆向分析：从结局回溯，找到打破平衡的激励事件，追溯因果链

inciting_incident:
  description: >
    并非故事开篇那一刻，而是更早——灾难发生后妻子选择自杀离去
    （回忆段落，约全书28%处集中展现）。这一事件真正打破了父亲
    的心理平衡：他失去了唯一的成年同伴和精神支柱，独自承担保护
    孩子的全部责任。灾难摧毁了世界，妻子的离去摧毁了他的内心。
  type: decision  # 妻子主动选择离去
  timing: "灾难后数年，故事开篇之前（通过回忆呈现，集中在全书约28%处）"
  balance_before: >
    灾难后的最初几年，夫妻二人带着新生儿勉强维持。妻子虽然绝望，
    但仍在——父亲有一个可以对话的成年人，有一个共同承担恐惧的伙伴。
  balance_after: >
    妻子消失在黑夜中（"她走了，遗下的淡漠是最后的赠礼"），
    父亲独自面对孩子和死亡——既是保护者也是可能的杀手（妻子指控
    他"保护不了我们"），而他必须证明活下去有意义。
  impact_on_protagonist: >
    父亲从此背负三重负担：(1)保护孩子的肉身存活，(2)维持孩子
    灵魂中的善良不被摧毁，(3)对抗妻子遗言中"你就是不肯面对
    现实"的拷问——证明活着本身就是答案。

desire_object:
  conscious: "带孩子到南方海岸——相信那里更温暖、更安全"
  unconscious: "将'火炬'（善良/人性之光）完整地传递给孩子，使他在父亲死后仍能作为'好人'活下去"
  tension: >
    南行的地理目标不断被证伪（海岸到了也同样灰冷荒凉），
    但精神传递的目标在父亲不自知中逐步达成——孩子已经成长
    为比父亲更善良、更坚定的"火炬承载者"。父亲追求的是
    可见的安全，真正完成的是不可见的传承。

spine_statement: >
  一个垂死的父亲带着幼子穿越废土南行，在生存的极限压力下，
  他不自觉地将自己灵魂中最好的部分传递给了孩子——他以为
  自己在寻找安全，实际上他在完成传承。

spine_type: unconscious  # 父亲的自觉目标（南行）是表层，真正的脊椎（传递火炬）是不自觉的

dramatic_question:
  question: "在绝对的黑暗中，善良能否存续并被传递？"
  obligatory_scene: >
    父亲死后，孩子独自面对陌生人——他必须做出父亲无法替他做的
    选择：信任还是恐惧？（全书末段，孩子选择跟随带枪的陌生男人，
    这个选择回答了戏剧问题：火炬传递成功了。）

opposing_forces:
  internal: >
    父亲的绝望——他多次暗示想死（"但愿我心如铁石"、"我要死了，
    告诉我怎么了断"），妻子的论证（"你就是不肯面对现实"）
    始终在他内心回响。身体的衰败（咳血日益加重）使他不断逼近
    "无法再保护孩子"的终极恐惧。
  personal: >
    孩子的善良对父亲形成道德压力：孩子要帮助每一个遇到的人
    （被雷击者、老人艾利、小男孩、窃贼），父亲的本能是拒绝——
    每次帮助都意味着分出有限的食物和暴露风险。但孩子的坚持
    不断迫使父亲面对"我们是不是好人"这个问题。
  external: >
    (1) 食人族团伙——武装、有组织、随时致命
    (2) 自然环境——持续降温、缺食、缺水
    (3) 路上的其他生存者——即便不是食人族，也可能因绝望而危险
    （如拿弓箭射伤父亲的人、偷走购物车的窃贼）

# ── 幕/Arc 框架 ──
arcs:
  - arc_id: ARC-1
    name: "山地求生：建立法则"
    value_at_start: "脆弱的生存平衡——有购物车、有少量食物、父子同行"
    value_at_end: "第一次生死威胁后的法则确立——'我们是好人，我们有火炬'"
    climax_event: "父亲射杀持刀劫持孩子的恶棍，用最后的真子弹（约全书18%处）"
    function_note: "确立核心冲突规则：暴力自卫是允许的，但代价是巨大的（枪里只剩一发子弹，孩子遭受心理创伤）"

  - arc_id: ARC-2
    name: "深入黑暗：道德的考验"
    value_at_start: "父子在路上艰难前行，枪里只剩一发真子弹"
    value_at_end: "经历最恐怖的人性深渊后，'好人/坏人'的信念受到终极考验"
    climax_event: "发现大屋地窖中被囚禁、截肢食用的活人——父子仓皇逃离，几乎被追上（约全书31%处）"
    function_note: "将'坏人'的含义从抽象提升到具象的恐怖——这不只是抢劫，是系统性的人类畜牧。孩子的'我们还是好人吗'不再是修辞，而是真实的追问"

  - arc_id: ARC-3
    name: "从绝境到恩赐：信仰的奖赏"
    value_at_start: "连续五天无食，濒临饿死"
    value_at_end: "发现地窖宝藏——暂时的丰饶，以及'好人储备物资给好人'的信念"
    climax_event: "在庭院草皮下发现地窖，内藏大量食物、水和生活用品（约全书39%处）"
    function_note: "全书唯一的重大正向逆转。关键不是物质救赎，而是孩子的祷词——'亲爱的人，感谢你们留下食物'——证明善良作为信仰在运作"

  - arc_id: ARC-4
    name: "抵达海岸：希望的落空"
    value_at_start: "携带充足补给南行，距海岸不远"
    value_at_end: "海岸到了，但同样灰冷荒凉——地理上的目标被证伪"
    climax_event: "父子伫立灰色海岸——'抱歉不是蓝色'（约全书72%处）"
    function_note: "自觉欲望（到达南方）被否定，迫使故事转向不自觉的真正主题：不是到达某处，而是成为某种人"

  - arc_id: ARC-5
    name: "最后的旅程：火炬的传递"
    value_at_start: "父亲身体加速衰败，孩子独立性增强"
    value_at_end: "父亲死去，孩子独自做出选择——信任陌生人，加入新家庭"
    climax_event: "父亲临终与孩子告别——'火炬在你心里，它一直在那里。我能看见。'孩子选择跟随带枪的陌生男人。（约全书97-99%处）"
    function_note: "故事的真正高潮不是父亲的死（那是必然），而是孩子在父亲死后三天独自做出的选择——信任一个陌生人，证明火炬已被传递"

story_climax_design:
  crisis:
    dilemma: "孩子独自站在路上，一个带枪的陌生男人走来——跟他走（可能被杀/被吃），还是独自留下（必定饿死冻死）"
    option_a: "跟随陌生人——冒信任的风险"
    option_b: "留下守着父亲的遗体——在确定性的死亡中保持安全感"
    character_revelation: >
      孩子选择了信任——他问'你是好人吗？''你有火炬吗？'
      这些问题本身就证明了父亲的传承成功：孩子不是盲目信任，
      而是用'火炬'作为判断标准。他完成了父亲做不到的事——
      信任另一个人。
  climax:
    action: "孩子说'那好吧'——跟随陌生男人走向新的家庭"
    value_change:
      from: "孤独、绝望、死亡的阴影"
      to: "信任、联结、善良的延续"
    controlling_idea_expression: >
      善良不是通过力量传递的，而是通过爱与牺牲——父亲用一生的
      守护教会孩子：真正的勇敢不是持枪对抗，而是在最脆弱的时候
      选择信任。女人'张开双臂拥揽他'是全书唯一的温暖拥抱，
      呼应了父亲一路上无数次抱紧孩子的动作。
  resolution:
    new_balance: >
      孩子加入一个有父母、有其他孩子的家庭。女人对他阐说上帝，
      但他最美妙的对话仍是与死去的父亲——'他对父亲说话，从不曾
      忘记'。火炬没有熄灭。
    lingering_feeling: >
      哀伤中的希望。最后一段突然跳出叙事，以近乎散文诗的笔触
      描写'深山溪谷间的河鳟'——这是全书唯一的自然生命画面，
      像一个遥远的、也许永远无法抵达的承诺。
