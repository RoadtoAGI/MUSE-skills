novel: 长路
author: 科马克·麦卡锡
lang: zh
translator: ''
narration_voice: 限知贴父亲行动，伦理与神圣都不直说
diction: 译文白话冷硬，精确物名混圣经典故
rhetoric_density: medium
dialogue_mode: 短问短答为骨，关键处让独白压场
pacing: 搜寻细密铺陈，暴力急坠后留长静默
signature_moves:
- 先列废墟器物，再让人物从物中显露处境
- 用孩子短问逼出父亲的生存逻辑与漏洞
- 把食物、水、火写成近似仪式的具体动作
- 暴力发生时冷述动作，余波才展开创伤
- 灰、冷、焦、盐等感官词反复压低世界
anti_signature:
- 不要用全知解释灾难原因或道德结论
- 不要把对白写成长篇抒情互诉
- 不要用鲜亮景观冲淡灰冷物质感
