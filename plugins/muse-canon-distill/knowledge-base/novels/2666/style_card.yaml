novel: '2666'
author: 罗贝托·波拉尼奥
lang: zh
translator: ''
narration_voice: 全知冷叙与贴身限知交替，拒绝解释裁决
diction: 学术、档案、粗口和日常物件并列
rhetoric_density: medium
dialogue_mode: 对白常作证词或独白，叙述承担推进
pacing: 长句累积事实，关键处用短句断开
signature_moves:
- 用名单、数字、履历累积出制度性压迫
- 把文学术语和暴力现场放在同一语气里
- 用旁枝轶事延宕主线，再突然落到恐惧
- 让缺席人物通过传闻、照片、手稿显形
- 以冷静档案口吻反复记录不可承受之事
anti_signature:
- 不要用抒情解释替代事实堆叠
- 不要让对白过度戏剧化或金句化
- 不要把善恶判断提前说破
