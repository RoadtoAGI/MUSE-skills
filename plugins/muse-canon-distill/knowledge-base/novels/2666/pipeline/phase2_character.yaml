# Phase 2: 人物系统 — 《2666》逆向分析
# 本文件只记角色之间的关系（系统层），不记个体画像
# 个体画像见 characters/*.md

# ── 特殊说明 ──
# 《2666》是多主角星形结构小说。没有单一主角贯穿全书。
# 阿琴波尔迪是"缺席的轴心"——前四部分的引力中心，第五部分的传记主体。
# 对抗力量不是某个具体人物，而是系统性的恶（圣特莱莎谋杀、二战暴行、体制腐败）。

cast_overview:
  protagonist: "多主角结构 — 每个部分有独立主角，阿琴波尔迪是缺席的全书轴心"
  antagonist: "系统性的恶 — 圣特莱莎的妇女连环谋杀、二战大屠杀、体制性腐败与冷漠。没有单一反派"
  supporting_cast:
    # ── 第一部分：评论家群像 ──
    - name: 让-克劳德·贝耶迪
      function: "Part 1 主角之一。知识分子面对恶时'理性逃避'的代表——用阅读替代行动"
    - name: 曼努埃尔·埃斯皮诺萨
      function: "Part 1 主角之一。知识分子面对恶时'感性逃避'的代表——用爱情替代行动"
    - name: 丽兹·诺顿
      function: "Part 1 催化剂。三角关系的焦点，也是第一个因直觉而崩溃的人——她的大哭是知识分子群体中最诚实的反应"
    - name: 皮埃罗·莫里尼
      function: "Part 1 观察者/先知。轮椅上的旁观者，最早感知到危险，最终与丽兹相恋——身体的残缺映射精神的清醒"

    # ── 第二部分：流亡者 ──
    - name: 阿玛尔菲塔诺
      function: "Part 2 主角，Part 1/3 的枢纽人物。长期暴露在恶中的知识分子——从理性到疯狂的连续体"

    # ── 第三部分：外来者 ──
    - name: 奥斯卡·法特（昆西·威廉）
      function: "Part 3 主角。外来的见证者——唯一采取行动的人（带罗莎逃离），但行动本质仍是逃跑"
    - name: 罗莎·阿玛尔菲塔诺
      function: "Part 2/3 被保护者。年轻、脆弱、被危险环境包围——她是阿玛尔菲塔诺和法特行动的触发器"

    # ── 第四部分：集体叙事 ──
    # 无单一人物——受害者群像本身是'角色'

    # ── 第五部分：作家的一生 ──
    - name: 汉斯·赖特尔 / 阿琴波尔迪
      function: "Part 5 主角，全书轴心。从海藻少年到战争幸存者到隐居作家——唯一最终主动走向恶的人"
    - name: 布比斯夫人（冯·聪佩女男爵）
      function: "Part 5 守护者/情人。阿琴波尔迪的出版商之妻，知晓秘密的贵族女性——连接文学世界与现实世界的桥梁"
    - name: 洛特
      function: "Part 4/5 连接者。阿琴波尔迪的妹妹，克劳斯的母亲——她的存在将家族线与圣特莱莎罪行线焊接在一起"

# ── 对比轴 ──
# 《2666》的角色系统围绕一个核心问题构建：面对恶，你怎么办？
# 每个主要角色对这个问题给出了不同的回答

contrast_axes:
  primary_axis: "面对恶的反应光谱"
  spectrum:
    - position: "理性逃避"
      characters: [让-克劳德]
      description: "用阅读、学术工作替代面对——'阿琴波尔迪就在这里'是一种自我安慰式的顿悟"
    - position: "感性逃避"
      characters: [曼努埃尔]
      description: "用爱情、身体接触替代面对——与地毯女贩利百加的短暂恋情是最典型的逃避"
    - position: "直觉性崩溃"
      characters: [丽兹]
      description: "无法理性化处理——回伦敦后崩溃大哭，是四位评论家中最诚实的反应"
    - position: "旁观者的清醒"
      characters: [莫里尼]
      description: "身体的束缚（轮椅）反而保持了精神的距离——他从未去圣特莱莎，反而看得最清"
    - position: "长期侵蚀→疯狂"
      characters: [阿玛尔菲塔诺]
      description: "不逃离也不行动，而是被恶慢慢浸透——从幻听到精神崩溃"
    - position: "行动式逃跑"
      characters: [法特]
      description: "唯一做了'某件事'的人（带罗莎逃离），但本质是逃跑而非面对"
    - position: "主动走向恶"
      characters: [阿琴波尔迪]
      description: "全书唯一真正面对恶的行动——走出公园，去了墨西哥。结局未知"

  secondary_axis: "知识/文化修养 vs 行动能力"
  description: "文化修养越高的角色，面对恶时越无力。评论家们是全书最博学的人，也是最无力的。阿琴波尔迪是最伟大的作家，但他的行动不是因为文化修养，而是因为血缘（外甥）和战争记忆"

  tertiary_axis: "Part 4 受害者 vs 其他所有角色"
  description: "受害者没有名字、没有声音、没有选择——她们的'角色功能'是沉默的控诉。其他所有角色（知识分子、记者、作家）都拥有选择权，这使得他们的逃避更加不可原谅"

# ── 关系网络 ──
relationships:
  power_dynamics: |
    全书的权力结构呈倒置金字塔：
    - 知识分子拥有最多的文化资本和行动自由，但面对恶时最无力
    - 底层女性（加工出口区女工）毫无权力，承受最大的暴力
    - 体制（警察、政客、毒贩）掌握实际权力，维持暴力的运转
    - 阿琴波尔迪游离于所有权力结构之外——他是隐居者，既不属于学术界也不属于体制

  key_tensions:
    - "让-克劳德 vs 曼努埃尔：学术同盟 + 情敌——共同追求丽兹却未被撕裂，因为恶的存在让他们的竞争显得微不足道"
    - "阿玛尔菲塔诺 vs 圣特莱莎：流亡者 vs 暴力之城——他无法离开（女儿在这里），也无法面对（精神在崩溃）"
    - "法特 vs 他的报道：记者应该揭露真相，但法特最终选择逃跑——他从未写出关于圣特莱莎的报道"
    - "阿琴波尔迪 vs 他的隐居：写作是一种面对（记录恶），但也是一种逃避（隐居不出面）。直到家族线把他拉回现实"
    - "Part 4 受害者 vs 所有其他角色：沉默的死者 vs 有声的生者——全书最大的张力"

  potential_shifts:
    - "阿琴波尔迪从隐居到行动——全书唯一完成的价值转变"
    - "丽兹从三角关系到与莫里尼相恋——从追寻到安定，但也可能是另一种逃避"
    - "法特从记者到逃亡者——职业身份的崩塌与人性本能的觉醒并存"
