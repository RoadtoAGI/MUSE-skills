# Phase 3: 脊椎 + Arc 框架 — 《2666》逆向分析
# 注：《2666》是多主角小说，传统的单一脊椎不完全适用。
# 但全书有一个统一的宏观脊椎：追寻阿琴波尔迪 → 面对圣特莱莎之恶

# ── 特殊说明 ──
# 《2666》没有单一主角。五个部分各有主角，但阿琴波尔迪是贯穿全书的"缺席主角"。
# 脊椎分析从全书层面和各部分层面双重展开。

# ── 全书层面的脊椎 ──
inciting_incident:
  description: "让-克劳德1980年圣诞节阅读阿琴波尔迪的《达松法尔》——一次阅读行为开启了长达二十年的追寻。但更深层的激励事件是圣特莱莎1993年开始的妇女谋杀——它打破了'文明世界'的平衡，将所有人物拉入同一个黑洞"
  type: accident  # 偶然的阅读行为；偶然的犯罪升级
  timing: "第一部分开篇（行19）/ 第四部分开篇（行4065）— 双重激励事件"
  balance_before: "知识分子在欧洲的学术象牙塔中安全生活；圣特莱莎作为边境城市的日常暴力尚未达到系统性规模"
  balance_after: "对阿琴波尔迪的追寻将评论家们从象牙塔拉入现实世界的深渊；妇女谋杀的系统性升级将城市变成'恐怖的绿洲'"
  impact_on_protagonist: "每个'主角'都被拉向圣特莱莎：评论家因追踪作家而来，法特因报道拳击赛而来，阿琴波尔迪因妹妹的儿子而来——不同的原因，相同的终点"

desire_object:
  conscious: "找到阿琴波尔迪（评论家）/ 完成报道任务（法特）/ 理解圣特莱莎的恶（全书）"
  unconscious: "理解人类暴力的本质——为什么文明无法阻止恶？为什么所有人都成为同谋？"
  tension: "意识层面的追寻（找人/写稿/调查）与无意识层面的逃避（不想真正面对恶的深渊）之间的张力——所有人都被恶吸引，但除了阿琴波尔迪，没人真正走进去"

spine_statement: "追寻一位缺席的作家，最终发现他的缺席指向的不是文学的神秘，而是人类暴力的深渊——而这个深渊就在圣特莱莎，就在所有人眼前"
spine_type: unconscious  # 表层是追寻作家，深层是面对恶

dramatic_question:
  question: "人类（知识分子、艺术家、普通人）能否面对系统性的恶而不逃避？"
  obligatory_scene: "阿琴波尔迪决定前往墨西哥——这是全书唯一一个主动走向恶的行动（而非逃离）。这个行动回答了戏剧问题：是的，面对恶是可能的，但代价和结局未知"

opposing_forces:
  internal: "恐惧、自我保护本能、对舒适生活的依恋（评论家们宁可回欧洲也不愿直面罪行）"
  personal: "爱情纠葛分散了注意力（三角恋）、人际关系的脆弱性（阿玛尔菲塔诺的孤立）"
  external: "体制性暴力——警察腐败、政治保护伞、全球化的结构性不平等——个人无法对抗系统"

# ── Arc 框架 ──
# 《2666》的五个部分自然形成五个 Arc，每个 Arc 有独立的价值转变

arcs:
  - arc_id: ARC-1
    name: "追寻的幻灭（第一部分：文学评论家）"
    value_at_start: "学术热情 + 爱情期待 → 知识分子的自信与优越感"
    value_at_end: "追寻失败 + 面对恶的初步震撼 → 知识分子的无力与逃避"
    climax_event: "评论家们在圣特莱莎得知'两百多妇女被害'，但选择各自离开——丽兹飞回伦敦崩溃大哭，曼努埃尔与地毯女贩恋爱，让-克劳德埋头读书"
    function_note: "建立'知识分子面对恶时的无能'这一母题，为后续部分设定基调"

  - arc_id: ARC-2
    name: "精神的崩塌（第二部分：阿玛尔菲塔诺）"
    value_at_start: "流亡者的勉强维持 → 在异国他乡保持理智的努力"
    value_at_end: "精神崩溃 → 幻听、恐惧、将几何学书挂在晒衣绳上的疯狂行为"
    climax_event: "阿玛尔菲塔诺开始听到声音（自称是他的祖先），他的理性彻底动摇——住在圣特莱莎这座'罪行之城'正在从内部侵蚀他"
    function_note: "展示长期暴露在恶的环境中对个体精神的侵蚀——不是直接暴力，而是恐惧的弥漫"

  - arc_id: ARC-3
    name: "外来者的觉醒与逃离（第三部分：法特）"
    value_at_start: "职业记者的冷静 → 以旁观者身份到达圣特莱莎"
    value_at_end: "震惊与恐惧 → 带着罗莎逃离圣特莱莎——行动了，但只是逃跑"
    climax_event: "法特在监狱探访杀人嫌疑犯（金发巨人），随后被警察追踪。阿玛尔菲塔诺恳求他带女儿逃离——'人人都卷进去了！'"
    function_note: "法特是唯一采取了某种行动的人（带罗莎逃离），但这仍然是逃避而非面对——他没有写出揭露罪行的报道"

  - arc_id: ARC-4
    name: "罪行的编年（第四部分：罪行）"
    value_at_start: "1993年第一具女尸 → 零星的暴力事件"
    value_at_end: "近两百起案件的系统性累积 → 恶的不可逆膨胀，体制彻底失败"
    climax_event: "没有单一高潮——每一个案件都是一次微型高潮。累积效果本身就是高潮：读者在第N个案件后从震惊转向麻木，正如圣特莱莎的居民一样"
    function_note: "这是全书的'有形中心'——前三部分的所有线索都在此汇聚，所有的'暗示'在此变成赤裸的现实"

  - arc_id: ARC-5
    name: "作家的一生与最终行动（第五部分：阿琴波尔迪）"
    value_at_start: "普鲁士海边的天真少年 → 与世无争的'海藻'般的存在"
    value_at_end: "走向墨西哥 → 直面深渊的决定——全书唯一主动面对恶的行动"
    climax_event: "阿琴波尔迪得知外甥可能是圣特莱莎杀人案嫌疑犯，决定前往墨西哥——'很快，他就走出了公园。第二天去了墨西哥。'"
    function_note: "用一个人的一生（从一战前到世纪末）串联20世纪的暴力史——童年的天真、战争的暴行、战后的写作、晚年面对恶的最终抉择。这是全书唯一的正面价值表达：面对恶，哪怕结局未知"

story_climax_design:
  crisis:
    dilemma: "阿琴波尔迪得知外甥克劳斯（洛特之子）可能是圣特莱莎的杀人嫌疑犯——他必须选择：继续隐居（安全但成为同谋）还是前往墨西哥（面对恶但结局未知）"
    option_a: "继续隐居生活，像其他知识分子一样对圣特莱莎的恶视而不见"
    option_b: "前往墨西哥——一个年迈的德国作家独自走进暴力的深渊"
    character_revelation: "阿琴波尔迪选择了行动——这与前四部分中所有人的逃避形成了最强烈的对比。经历了二战暴行的他明白：沉默就是共谋。只有他真正理解了老人（出租打字机者）的话：'纯洁和意志是阴阳怪气'"
  climax:
    action: "阿琴波尔迪走出公园，第二天去了墨西哥——简洁、决断、不可逆"
    value_change: { from: "逃避/隐居", to: "面对/行动" }
    controlling_idea_expression: "全书在这个行动中表达了其反讽式的主控思想：知识和艺术无法拯救世界，但直面深渊是唯一有尊严的选择——即使你是一个老人，即使结局未知"
  resolution:
    new_balance: "开放式结局——阿琴波尔迪到达墨西哥后会发生什么？小说没有告诉我们。这个不完整本身就是一种平衡：恶的问题没有解决，面对恶的行动也没有完成，但行动本身已经足够"
    lingering_feeling: "一种悬而未决的沉重——混合着对人性之恶的绝望和对个体勇气的微弱希望。波德莱尔的引文回响：在文明的沙漠里，暴力是'恐怖的绿洲'，而我们所有人都是这片沙漠的居民"
