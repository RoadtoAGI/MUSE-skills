# Phase 0: 构想 — 《2666》逆向分析
# 来源：波拉尼奥《2666》（赵德明中译本）
# 分析方法：从结局回溯——阿琴波尔迪走向墨西哥，走向罪行的深渊

premise: "如果一群知识分子追踪一位隐居作家的下落，而这条线索把他们引向一个系统性谋杀妇女的边境城市——那么知识、艺术和文明在面对极端之恶时将会怎样？"

core_value:
  positive: 正义 / 真相 / 面对恶的勇气
  negative: 冷漠 / 逃避 / 对恶的同谋性沉默
  spectrum:
    contradictory: 不公正（犯罪存在但无人追究）
    contrary: 冷漠（知道罪行存在但选择不作为）
    negation_of_negation: 以文明之名行逃避之实（知识分子以学术、爱情、个人生活为借口回避面前的恶）

controlling_idea:
  value: 人性之恶无法被知识、艺术或文明所遏制
  cause: 因为即使最聪明、最有文化修养的人，在面对系统性暴力时也选择了逃避——不是因为无知，而是因为恐惧和自我保护的本能
  full_statement: "当人性之恶以系统性暴力的形式膨胀时，知识分子、艺术家、记者、警察——所有人——都成为同谋，因为他们有能力看见却选择转身离去；惟有直面深渊的行动（如阿琴波尔迪最终走向墨西哥）才是对这种共谋的唯一回应，尽管结局未知。"
  type: ironic  # 反讽式：知识不能拯救世界，但沉默即是罪行；行动的结局未知，但不行动已是确定的失败

genre:
  primary: 社会现实主义 / 后现代主义
  secondary: 犯罪纪实 / 战争文学 / 知识分子小说
  conventions:
    - setting: "美墨边境城市（影射华雷斯城）——全球化阴影下的暴力地带"
    - characters: "知识分子群像——学者、记者、作家——面对暴力时的无能"
    - events: "追踪、揭露、逃离——但无人能真正改变现状"
    - values: "文明 vs 野蛮、知识 vs 行动、个体 vs 系统"

originality_statement:
  unique_angle: "以一位缺席的作家为轴心，用五个独立又交汇的视角呈现一幅20世纪人类暴力的全景图——从二战大屠杀到世纪末的系统性女性谋杀，揭示暴力的连续性和文明的无力"
  cliches_to_avoid:
    - "避免了犯罪小说的侦探叙事——没有英雄破案，罪行悬而未决"
    - "避免了战争文学的英雄主义——战争只是暴力链条中的一环"
    - "避免了知识分子小说的自我感伤——用讽刺而非同情呈现学术界的虚荣"
    - "避免了第四部分的愤怒叙述——用冷峻的编年体替代情感宣泄，效果更为震撼"

style_directives:
  - "零度叙事（第四部分）：法医报告式的冷静记录，不加评论"
  - "多声部叙事：五个部分各有独立的叙事声音和节奏"
  - "离题与漫游：大量看似无关的插叙、轶事和对话，构建一种百科全书式的叙事织体"
  - "讽刺与反讽：知识分子的学术热情与面对暴力时的无能形成尖锐对比"
  - "开放式结局：故事未完成——这既是作者早逝的结果，也是刻意的美学选择"

word_count: 590000
