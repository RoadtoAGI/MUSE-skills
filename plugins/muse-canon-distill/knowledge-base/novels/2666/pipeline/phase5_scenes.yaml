tension_curve:
  description: "全书的张力曲线并非简单递增，而是呈现'波浪-阶梯'形态。每个部分内部有各自的张力弧线（Part 1讽刺→沉重、Part 3冷静→紧张→逃亡），但部分之间的张力在Part 4达到绝对顶点（通过累积而非单一高潮）。Part 5则以时间的纵深回应前四部分的横向张力——不是更紧张，而是更深沉"
  peaks: [S03, S06, S07, S08, S11, S12]
  valleys: [S05, S10, S21]

causal_chain: "S01（学术联盟形成）→ S22（出版社拜访——机构层级的壁垒）→ S02（布比斯夫人的启示——追寻的虚无）→ S19（诺贝尔提名——学派和解的权力交换→落选）→ S03（发现恶的存在）→ S04（放弃追寻）→ S05（恶对旁观者的侵蚀）→ S06（直面嫌疑犯）→ S07（逃离）→ S08（恶的系统性呈现）→ S09（个体的愤怒被淹没）→ S10（天真的起源）→ S11（身份重生）→ S21（文学的残酷现实——350/205/96册）→ S20（布比斯的权力游说——饭局博弈）→ S12（最终行动——走向深渊）"
