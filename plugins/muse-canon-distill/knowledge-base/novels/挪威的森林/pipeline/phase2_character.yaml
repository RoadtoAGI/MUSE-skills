# Phase 2: 人物系统设计图 —— 《挪威的森林》逆向分析
# 只记角色之间的关系，不记个体画像（个体画像在 characters/*.md）

cast_overview:
  protagonist: 渡边彻
  antagonist: >
    没有具象化的对手。对抗力量是"死亡"本身——
    它以木月的自杀为起点，通过直子的精神疾病持续施压，
    最终以直子的自缢达到顶峰。
    死亡不是某个角色，而是渗透在所有关系中的引力场。
  supporting_cast:
    - name: 直子
      function: >
        死亡世界的化身与牵引者。她是渡边与死者世界（木月）的最后联结，
        也是渡边必须"放手"才能存活的人。叙事功能上是渡边的"考验"——
        他对直子的责任感是阻止他选择生的最大内在阻力。
    - name: 小林绿子
      function: >
        生命世界的化身与召唤者。她代表混乱的、不完美的、
        但不可遏制的生命力。叙事功能上是渡边的"出路"——
        她使渡边有了"活着的理由"。
    - name: 木月
      function: >
        缺席的中心。死者，但其影响力贯穿全书。
        他曾是三人世界的枢纽/主持人，他的消失造成了一切失衡。
        叙事功能上是"激励事件的制造者"和"死亡引力的源头"。
    - name: 玲子（石田玲子）
      function: >
        中介者/引路人。她是渡边与直子之间的桥梁，
        也是阿美寮世界的翻译官。最终她又成为渡边告别直子的仪式主持人
        （51 首曲子的葬礼）。她自身的悲剧提供了"被毁掉的人如何继续活着"的参照。
    - name: 永泽
      function: >
        道德镜像/精英对照。他是渡边的反面——
        拥有一切外在资源但无法真心爱人。
        他对渡边的诊断（"不能打心眼里爱上某个人"）
        是全书对渡边性格最精准的外部评价。
    - name: 初美
      function: >
        等待者的悲剧样本。她对永泽的无条件等待最终导致自杀，
        构成直子命运的镜像预言——等待不一定有好结局。
        她的死是渡边多年后才能理解的"被辜负之人"的典型。
    - name: 敢死队
      function: >
        喜剧调节 + 纯真参照。他的存在为沉重的叙事提供喘息空间，
        同时他"可怜巴巴的人生中可怜巴巴的追求（绘地图）"
        反衬了渡边等人面对的存在困境。

contrast_axes: >
  核心对比轴是"生 vs 死"，通过两组镜像关系展开：

  1. 直子 vs 绿子（核心对比）
     - 直子：安静 / 内省 / 语言障碍 / 被死亡纠缠 / 身体不回应爱的人
     - 绿子：喧闹 / 外向 / 语言过剩 / 被生活磨砺但不屈服 / 身体和情感一致
     - 直子穿驼绒大衣，绿子穿运动衫；直子在阿美寮的山中，绿子在东京的街市
     - 两人从未见面，但通过渡边的书信"认识"了对方

  2. 永泽 vs 渡边（次要对比）
     - 永泽：主动 / 有能力 / 冷酷 / "做应做之事"
     - 渡边：被动 / 普通 / 温厚 / "不知道该做什么"
     - 永泽可以随意获得女人但不珍惜，渡边被两个女人牵挂但无法行动

  3. 初美 vs 直子（隐含对比）
     - 都是"等待者"——初美等永泽，直子让渡边等自己
     - 都以自杀收场
     - 差异：初美的等待是出于爱的选择，直子的等待是出于疾病的无奈

  4. 木月 vs 渡边（前史对比）
     - 木月：魅力四射但内心黑暗，最终被死亡俘获
     - 渡边：平凡但有韧性，最终从死亡边缘脱身
     - 关键问题：直子的身体为什么回应渡边而不回应木月？
       这暗示渡边身上有某种"活着的力量"是木月所缺乏的

relationships:
  power_dynamics: >
    渡边在所有关系中都处于"被动方"——
    直子需要他等待，绿子需要他回应，永泽需要他当陪客，
    玲子需要他当倾听者。他是所有人的"锚"，
    但自己却没有锚。这种被动性既是他的弱点（无法主动选择），
    也是他的力量（所有人都信任他，因为他不会主动伤害任何人）。
  key_tensions:
    - >
      直子-渡边-绿子三角：不是传统的"争夺"，
      而是两种存在方式对渡边的牵引。
      直子从不要求渡边"选她"，绿子也说"要我时就只要我"。
      张力不在人与人之间，而在渡边内心的生死选择中。
    - >
      永泽-初美：永泽明知初美是最好的人但无法忠诚，
      初美明知永泽不会改变但无法离开。
      两人的关系是"清醒的互相毁灭"。
    - >
      木月-直子：死者与生者的不对等关系——
      木月已死，但直子仍被他的死牢牢束缚。
      她的身体不回应木月，暗示她在无意识层面
      已经知道木月属于死亡的世界。
  potential_shifts:
    - >
      渡边从"被动承受者"到"主动选择者"的转变
      在全书最后才勉强完成——打电话给绿子
    - >
      玲子从"患者/中介"到"独立行动者"的转变——
      离开阿美寮，去旭川重新开始
