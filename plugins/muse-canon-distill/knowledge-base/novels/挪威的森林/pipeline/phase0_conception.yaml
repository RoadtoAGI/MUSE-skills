# Phase 0: 构想 —— 《挪威的森林》逆向分析
# 从结局回溯：高潮处确认了什么价值？这个价值通过什么因果链实现？

premise: >
  如果一个年轻人在最好的朋友自杀后，爱上了朋友留下的恋人，
  而这个被死亡纠缠的女孩正在精神崩溃的边缘——
  他能否在死亡的引力与生命的召唤之间找到自己的位置？

core_value:
  positive: 生（选择活下去、接纳不完美的生）
  negative: 死（被死亡吞噬、与死者一同沉没）
  spectrum:
    contradictory: 麻木（既非活着也非死去的行尸走肉状态——渡边在东京街头的游荡）
    contrary: 逃避（不正面面对生死，维持安全距离——渡边对一切"不想得过于深刻"的策略）
    negation_of_negation: >
      以爱之名殉死（直子最终的选择——她爱木月至深，
      但身体只回应渡边，这个矛盾成为摧毁她的力量。
      表面上是"为爱而活"，实质是被死亡的引力彻底俘获）

controlling_idea:
  value: >
    生——不完美的、带着创痛和迷失的生，但终究是活着
  cause: >
    当一个人经历了所爱之人的死亡后，唯有承认自己对生的渴望
    （而非出于愧疚留在死者的世界），才能重新找到活下去的理由
  full_statement: >
    当我们接受死亡是生命不可分割的一部分，而非生的对立面，
    并鼓起勇气选择活着的那个人——即使这选择充满愧疚与迷失——
    生命才得以在失去中延续。
  type: ironic
  # 反讽型：渡边选择了生（绿子），但最终电话中不知自己身在何处。
  # 他"活了下来"，但代价是永远的迷失和创痛。
  # 这既非纯粹乐观（他毕竟选择了生），也非纯粹悲观（直子死了，初美死了），
  # 而是"生存本身就包含着无法治愈的伤痕"的反讽。

genre:
  primary: 成长小说（Bildungsroman）
  secondary: 爱情小说
  conventions:
    - setting: >
        1960 年代末日本学运时期的东京与京都，
        大学校园、学生宿舍、疗养院构成三重空间
    - characters: >
        迷茫的年轻叙述者、两个截然不同的女性（一个代表死亡/内省，
        一个代表生命/行动）、导师型配角（永泽、玲子）
    - events: >
        亲密之人的死亡、初次性经验、孤独的城市漫游、
        在两段感情之间的抉择
    - values: >
        生vs死、记忆vs遗忘、孤独vs连接、
        精神之爱vs身体之爱

originality_statement:
  unique_angle: >
    村上将"死亡"从事件降格为"状态"——死不是突然发生的事，
    而是一直潜伏在生的内部。木月的死只是显影剂，
    让渡边看见了死亡早已存在于一切关系中。
    独特之处在于：叙述者并不试图战胜死亡或超越死亡，
    而只是学会与它共存——带着伤痕活下去。
  cliches_to_avoid:
    - 避免了"用新爱情治愈旧伤痛"的套路——结尾渡边仍然迷失
    - 避免了"自杀者被浪漫化"——直子的死被处理得冷静而残酷
    - 避免了"选择困难"的戏剧化——渡边的选择不是在两个女人之间，
      而是在生与死两种世界之间
    - 避免了成长小说的"顿悟时刻"——没有一个清晰的领悟，
      只有反复的沉思和永久的不确定

style_directives:
  - 第一人称回忆视角，37 岁回望 18-20 岁
  - 节制的情感表达——通过物件（萤火虫、黄瓜、水仙花）和行为（无尽散步）传递
  - 精确的感官细节（食物、音乐、天气、衣物质感）
  - 对话节奏松弛，允许大段沉默
  - 零度叙事与抒情并存——在不动声色中突然刺入深处

word_count: 约 200000
