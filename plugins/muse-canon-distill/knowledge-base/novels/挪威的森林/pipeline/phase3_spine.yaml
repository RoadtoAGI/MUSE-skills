# Phase 3: 脊椎 + Arc 框架 —— 《挪威的森林》逆向分析

inciting_incident:
  description: >
    木月在高二五月的一个下午与渡边打完桌球后，当晚在自家车库用汽车排气管自杀身亡。
    没有遗书、没有征兆、没有可推想的动机。（第 2 章回溯）
  type: accident  # 从渡边视角看完全是意外——"根本没有那种前兆"
  timing: >
    故事时间线之前（高二），但在叙事中于第 2 章中段揭示。
    作为叙事的核心前史，其影响贯穿全书。
  balance_before: >
    木月-渡边-直子三人世界的稳定平衡：木月是中心/主持人，
    渡边是观众/客串演员，直子是助手。三人在一起"其乐融融"。
  balance_after: >
    中心塌陷。渡边失去唯一的朋友，直子失去青梅竹马的恋人。
    两人被留在一个没有连接点的世界——木月在时他们无话不谈，
    木月不在他们"一句话也说不上"。
  impact_on_protagonist: >
    渡边感悟"死并非生的对立面，而作为生的一部分永存"。
    他开始对一切保持冷淡距离——"对任何事物都不想得过于深刻"，
    但这个策略注定失败，因为死亡已经内化为他存在的一部分。

desire_object:
  conscious: >
    渡边想要拯救直子——理解她、等待她康复、与她建立真正的关系。
    "如果你给我时间，我会竭尽全力，我们也许会相互加深了解。"
  unconscious: >
    渡边真正需要的是从死者的世界中挣脱出来，
    选择活着的世界——不是出于愧疚地陪伴死亡，
    而是出于本能地拥抱生命。绿子是这个需要的具象化。
  tension: >
    意识层面的追求（拯救直子）与无意识的需要（选择生/绿子）
    构成尖锐矛盾。每次与绿子在一起产生的温暖和幸福感，
    都伴随着对直子的愧疚。每次探访直子后回到东京，
    都觉得现实世界不再真实。他在两个世界之间往返，
    却不属于任何一个。

spine_statement: >
  一个被朋友之死标记的年轻人，在守护濒临崩溃的爱人与
  拥抱充满生命力的新爱之间，寻找活下去的方式。

spine_type: unconscious
  # 渡边意识层面追求的是"拯救直子/等待直子"，
  # 但故事真正推动他前进的力量是无意识的——对生的渴望。
  # 他直到第 10 章才在电车上意识到"我确实爱绿子"，
  # 而这个认知已经晚了很久。

dramatic_question:
  question: >
    渡边能否在死亡的引力场中存活下来，选择活着？
  obligatory_scene: >
    直子之死——只有当死亡的引力不再是"等待中的可能"而变成"已完成的事实"，
    渡边才被迫正面回答这个问题。他的回答是：
    打电话给绿子，说"整个世界上除了她别无他求"。

opposing_forces:
  internal: >
    渡边"始终保持清醒"的性格特质（永泽的诊断）——
    他无法全身心投入任何事，总有一部分在旁观。
    这使他既无法完全进入直子的世界，也无法痛快地选择绿子。
  personal: >
    直子——不是"对手"，而是死亡世界对渡边的牵引力。
    她的存在（尤其是她的精神疾病和对渡边的依赖）
    使渡边无法心安理得地选择绿子。
    木月——已死之人，但其死亡的阴影从未消散。
  external: >
    死亡本身作为力量——木月、直子姐姐、直子叔叔、
    最终直子自己——构成一条不可逆的因果链。
    这个家族/群体的命运模式暗示死亡具有某种传染性或遗传性。

# ── 幕/Arc 框架 ──

arcs:
  - arc_id: ARC-1
    name: "木月之死与重逢"
    value_at_start: "平衡的三人世界（生：从属/安全）"
    value_at_end: "失衡——渡边与直子单独连接，但不知如何相处（生：迷失/寂寞）"
    climax_event: >
      直子 20 岁生日夜崩溃大哭后与渡边发生性关系，
      次日消失。（第 3 章末）
    function_note: >
      建立基础情境：死亡已经发生，渡边和直子在其余波中漂流。
      性关系的发生打破了"朋友的遗物"的安全距离。

  - arc_id: ARC-2
    name: "两个世界的打开"
    value_at_start: "空洞——直子消失，渡边在宿舍里独饮威士忌（生：空虚/麻木）"
    value_at_end: "两个牵引力同时出现——直子在阿美寮等他，绿子在东京吸引他（生：被牵引/困惑）"
    climax_event: >
      渡边第一次探访阿美寮，直子深夜无意识裸体展示，
      直子坦白家族自杀史和与木月的性问题。（第 6 章）
    function_note: >
      全书的信息密度高峰。两个世界同时展开：
      阿美寮（死亡/内省）和绿子的世界（生命/活力）。
      渡边在两者之间的撕裂正式开始。

  - arc_id: ARC-3
    name: "纠缠与抉择"
    value_at_start: "两个世界的拉锯——渡边在东京与绿子越来越近，同时给直子写信维持联系（生：摇摆/愧疚）"
    value_at_end: "绿子表白、直子恶化——渡边在对直子的责任与对绿子的爱之间陷入绝境（生：两难/痛苦）"
    climax_event: >
      绿子在雨中表白"我喜欢你超过喜欢他"，
      渡边在电车上意识到"我确实爱绿子"，
      但此时直子已转入专科医院。（第 10 章）
    function_note: >
      核心张力的顶峰。渡边的意识终于追上了无意识的需要——
      他知道自己爱绿子了，但"知道"并不等于"可以选择"。

  - arc_id: ARC-4
    name: "死亡与重生"
    value_at_start: "悬而未决的等待（生：焦虑/无力）"
    value_at_end: "直子之死 → 渡边崩溃 → 最终选择绿子（生：带着创痛的重新开始）"
    climax_event: >
      直子自缢身亡。渡边流浪一个月后返回东京，
      打电话给绿子说"除了她别无他求"，
      但不知自己身在何处。（第 11 章）
    function_note: >
      故事高潮。直子的死不是"事件"而是"答案"——
      她用死亡替渡边做出了选择。
      渡边被迫面对戏剧问题的终极回答：选择活着。

story_climax_design:
  crisis:
    dilemma: >
      渡边面对的两难：是继续等待直子（可能永远等不到的康复），
      还是接受对绿子的爱（这意味着"放弃"直子）？
    option_a: >
      等待直子——忠于记忆和责任，但可能失去绿子，
      并且直子的康复希望渺茫
    option_b: >
      选择绿子——选择生和爱，但代价是对直子的愧疚
      以及"背叛死者"的道德重压
    character_revelation: >
      渡边最终没有主动"选择"——是直子的死替他做出了选择。
      这揭示了渡边性格中最核心的特质：他不是行动者，而是承受者。
      永泽说他"不能打心眼里爱上某个人，总有个地方保持清醒"，
      这种"清醒"使他在两难中无法行动，直到外力打破僵局。
  climax:
    action: >
      渡边在经历一个月的崩溃式流浪后，返回东京，
      拿起电话拨给绿子，说出"整个世界上除了她别无他求"。
    value_change:
      from: "在生与死之间悬浮——既不完全活着也不完全死去"
      to: "选择了生——不完美的、带着创痛的、不知身在何处的生"
    controlling_idea_expression: >
      "你现在哪里？"——绿子的最后一个问题，
      渡边无法回答。他选择了生，但生并不意味着找到了方向。
      这正是反讽型主控思想的最终表达：
      活着本身就是全部，即使你不知道自己在哪里。
  resolution:
    new_balance: >
      一个开放的、不确定的新平衡——渡边"活了下来"，
      选择了绿子，但直子的死将作为永久的创痛存在。
      生活将继续，但不会回到"正常"。
    lingering_feeling: >
      苍凉的希望——像萤火虫在黑暗中消失后
      光的轨迹仍久久印在脑际。
      失去是永恒的，但活着也是。
