novel: 挪威的森林
author: 村上春树
lang: zh
translator: ''
narration_voice: 成年第一人称回望青春，冷静承认不理解
diction: 译文白话清澈，物件名与抽象句并置
rhetoric_density: medium
dialogue_mode: 日常对白先行，关键处转沉默或长坦白
pacing: 慢景物与快对白交替，结尾常留悬空
signature_moves:
- 用歌名、食物、衣物等物件钉住年代感
- 把死亡写成日常事件后的迟发余震
- 让人物用琐碎闲谈绕开真正痛点
- 以自然意象承接无法说明的情绪
- 在亲密场面保留第一人称的迟疑
anti_signature:
- 不要用全知口吻解释人物心理
- 不要把痛苦写成高声控诉
- 不要让象征脱离具体物件
author_cross_ref: ''
style_card_by: Codex (executor)
