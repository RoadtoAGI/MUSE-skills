# Phase 1: 世界 — 《冰与火之歌Ⅴ·魔龙的狂舞》
# 逆向分析：世界规则如何限制角色行为

setting:
  era: >
    "五王之战"后期的维斯特洛七国 + 厄斯索斯东方大陆。
    封建中世纪文明，但魔法正在复苏——龙重生、绿先知觉醒、异鬼南侵。
    相当于欧洲中世纪晚期与内战后的权力真空期。
  duration: >
    约数月（与前作《群鸦的盛宴》部分时间重叠，后半部超出），
    从秋末到冬季来临。学城白鸦飞出——冬天正式到来。
  location: >
    三大空间并行：
    1. 长城及以北（黑城堡、艰难屯）——琼恩线
    2. 弥林及奴隶湾（厄斯索斯东部）——丹妮/提利昂/巴利斯坦线
    3. 北境（临冬城、白港）——席恩/戴佛斯线
    + 次要空间：君临（瑟曦/凯冯）、布拉佛斯（艾莉亚）、风暴地（伊耿）
  conflict_levels:
    internal: >
      身份危机：席恩在"臭佬"与"葛雷乔伊"之间撕裂；
      琼恩在守夜人誓言与史塔克血脉之间；丹妮在征服者与和平者之间。
      每个POV角色都面临"我到底是谁"的内在冲突。
    personal: >
      背叛与忠诚的博弈：琼恩与波文·马尔锡的路线之争；
      丹妮与西茨达拉的政治联姻vs.与达里奥的真心；
      席恩与拉姆斯的施虐-受虐关系。
    external: >
      多重外部威胁同时逼近：
      异鬼大军从北方南侵、渊凯奴隶主围攻弥林、
      伊耿与黄金团入侵维斯特洛、铁王座内部崩溃。

world_rules:
  physical:
    - >
      龙是真实存在的终极武器，但无法完全驯服——
      卓耿吞食儿童、烧伤驯龙者，龙的力量既是权力也是诅咒
    - >
      冬天正在到来：暴雪封路、河流冻结、食物短缺——
      天气本身成为杀手（史坦尼斯军在暴雪中困馁）
    - >
      异鬼能将死者变为尸鬼——长城以北的每一个死人都可能成为敌人的士兵
    - >
      变身术（skinchanging）真实存在——布兰可以入驻动物和人体，
      序章中瓦拉米尔死后灵魂入驻狼群
  social:
    - >
      封建等级制度：领主对封臣有义务，守夜人有誓言约束，
      打破这些契约的代价是致命的（琼恩收容野人违背传统→被刺）
    - >
      奴隶制在厄斯索斯根深蒂固——丹妮的废奴改革触动了
      整个奴隶湾的经济基础，招致渊凯等城邦联合围攻
    - >
      血统决定继承权，但血统可以伪造——
      假艾莉亚（珍妮·普尔）、伊耿身份存疑、王血格里克，
      "身份"是可以被政治操纵的工具
    - >
      守夜人"不参与王国事务"的誓言在实践中不可能遵守——
      琼恩不得不与史坦尼斯、铁金库、野人打交道
  psychological:
    - >
      恐惧比忠诚更可靠——拉姆斯通过极端暴力（剥皮、断指）
      制造的心理控制比任何誓言都牢固（席恩/臭佬线）
    - >
      "没有人是在真空中做决定的"——每个角色的选择都受到
      过去创伤、家族期望、文化偏见的深层影响
    - >
      信仰的力量可以被政治利用——梅丽珊卓的红神、
      "大麻雀"的教会武装、渊凯的吉斯旧神，宗教是权力工具
    - >
      妥协是一种慢性毒药——丹妮为和平重开格斗场、嫁给贵族，
      每次妥协都让她离自己的本质更远

genre_conventions:
  primary_genre: 史诗奇幻
  secondary_genre: 政治权谋 / 灰色道德群像小说
  conventions:
    - convention: >
        传统奇幻中英雄集结力量对抗终极邪恶
      planned_subversion: >
        面对异鬼这个终极威胁，人类不但没有团结，反而加速内斗——
        琼恩是唯一认真对待异鬼威胁的人，结果被自己的兄弟杀了
    - convention: >
        龙骑士是征服与胜利的象征
      planned_subversion: >
        丹妮驯龙不是为了征服，而是为了逃命；
        昆廷试图驯龙被活活烧死——龙是不可控的力量
    - convention: >
        流亡王子历经磨难最终夺回王位
      planned_subversion: >
        提利昂的"英雄旅程"不断被打断（被俘、沦为奴隶、做佣兵），
        昆廷的求婚叙事以惨死收场，伊耿的合法性始终存疑
    - convention: >
        善有善报：做正确的事最终会获得回报
      planned_subversion: >
        本书系统性颠覆这一预期：
        琼恩做正确的事→被杀；戴佛斯忠诚→被派去送死；
        凯冯修复秩序→被暗杀正因为他"太有效"

creative_constraints:
  - constraint: >
      多POV轮转导致任何单一角色的故事线都不连续
    narrative_function: >
      制造"时间差"和信息不对称——读者知道的永远比任何单个角色多，
      这种全知视角与角色有限视角的张力产生持续的悬念和反讽
  - constraint: >
      作为系列第五卷，必须承接前四卷的庞大世界而不能重新解释
    narrative_function: >
      利用读者的系列记忆制造期待颠覆——读者"以为"知道规则，
      但本书系统性打破这些规则（主角可以死、英雄可以失败）
  - constraint: >
      冬季来临使物理世界本身成为对抗力量
    narrative_function: >
      暴雪同时瘫痪了多条线的行动能力——
      史坦尼斯军冻馁、临冬城封城、长城更加孤立
