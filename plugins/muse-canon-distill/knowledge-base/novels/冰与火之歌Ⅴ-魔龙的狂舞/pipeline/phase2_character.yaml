# Phase 2: 人物系统设计图 — 《冰与火之歌Ⅴ·魔龙的狂舞》
# 只记角色之间的关系，不记个体画像（个体画像在 characters/*.md）

# ═══════════════════════════════════════════════
#  角色阵列概览
# ═══════════════════════════════════════════════

cast_overview:
  # 本书无单一主角，三位核心POV共享主题脊椎
  protagonist:
    - 琼恩·雪诺  # 权力线-北方
    - 丹妮莉丝·坦格利安  # 权力线-东方
    - 提利昂·兰尼斯特  # 流亡线-东方→全局

  antagonist: >
    无统一对手。每条线有各自的对抗力量：
    琼恩线：波文·马尔锡（内部）+ 异鬼（外部）
    丹妮线：鹰身女妖之子（内部）+ 渊凯奴隶主（外部）
    席恩线：拉姆斯·波顿（直接施虐者）
    全局暗线：瓦里斯（操盘手，到终章才暴露）

  supporting_cast:
    # ── 权力线核心配角 ──
    - name: 巴利斯坦·赛尔弥
      function: >
        女王护卫→弥林代理统治者。当丹妮飞走后，他是唯一的道德支柱——
        用骑士荣誉感在混乱中维持最低限度的秩序
    - name: 梅丽珊卓
      function: >
        超自然顾问/不可靠预言者。唯一POV章揭示她的力量有限且常误读，
        为琼恩线增加了"命运是否可信"的不确定性
    - name: 西茨达拉·佐·洛拉克
      function: >
        丹妮的政治丈夫/旧秩序代言人。他代表了丹妮试图通过妥协维持的平衡——
        当卓耿降临时，这个平衡被彻底否定

    # ── 身份线核心配角 ──
    - name: 席恩·葛雷乔伊
      function: >
        身份重建的极端案例——从完全丧失自我到重获名字。
        他的弧光是全书最纯粹的"人之为人"的探讨
    - name: 伊耿·坦格利安（"小格里芬"）
      function: >
        隐藏的第三方——提利昂+瓦里斯线的终极棋子。
        身份真伪存疑本身就是叙事功能：不确定性即权力
    - name: 乔恩·康宁顿
      function: >
        流亡骑士/伊耿的保护者。与巴利斯坦形成镜像——
        两个老骑士各自守护一个年轻的"坦格利安"统治者

    # ── 悲剧线核心配角 ──
    - name: 昆廷·马泰尔
      function: >
        反英雄叙事的载体——按童话逻辑行动却遭遇现实世界的残酷。
        他的死是丹妮线的因果催化剂（龙出笼）
    - name: 阿莎·葛雷乔伊
      function: >
        北征线的旁观者/困兽。作为俘虏她无法行动，
        但她的POV提供了对史坦尼斯军崩溃的外部视角

    # ── 政治线核心配角 ──
    - name: 凯冯·兰尼斯特
      function: >
        "太能干的摄政"——他的能力本身就是他的死因。
        终章POV，为全书主控思想提供最集中的表达
    - name: 瓦里斯
      function: >
        全局操盘手。贯穿全书但只在终章暴露完整动机——
        所有看似独立的事件（提利昂流亡、伊耿登陆、凯冯之死）
        都服务于他的长期布局
    - name: 戴佛斯·席渥斯
      function: >
        忠诚的普通人视角。他在白港的外交线揭示了北境暗流——
        "北方人没有忘记"

    # ── 对抗力量 ──
    - name: 拉姆斯·波顿
      function: >
        纯粹的施虐者——不通过POV呈现，只通过受害者（席恩）的眼睛看到。
        这种"间接在场"的设计让恐惧始终弥漫而不被稀释
    - name: 波文·马尔锡
      function: >
        内部反对派领袖——含泪刺杀琼恩。不是恶人，
        而是"正常人在极端情境下做出的正常反应"，
        这正是他比任何反派都可怕的原因

# ═══════════════════════════════════════════════
#  对比轴
# ═══════════════════════════════════════════════

contrast_axes:
  # 核心三角：三种"掌权方式"
  power_triangle:
    description: >
      琼恩、丹妮、凯冯代表了三种截然不同的统治哲学，
      但在本书中全部失败——形成主控思想的三重论证
    axes:
      - axis: "原则型统治（琼恩）vs. 妥协型统治（丹妮）vs. 修复型统治（凯冯）"
        jon: 坚持原则不妥协（收容野人因为这在战略上正确）→ 被杀
        dany: 为和平不断妥协（联姻、重开格斗场）→ 失去自我，最终逃离
        kevan: 务实修补（修复瑟曦的破坏）→ 恰因能力被暗杀

  # 镜像对照
  mirror_pairs:
    - pair: "丹妮 ↔ 昆廷"
      axis: 驯龙
      contrast: >
        同样的场景（面对龙、用鞭子、喊命令），完全相反的结果。
        丹妮是"火做的"，昆廷是"肉做的"。
        差异不在勇气（昆廷同样勇敢），而在本质——你不能成为你不是的东西。

    - pair: "琼恩 ↔ 丹妮"
      axis: 理想主义的代价
      contrast: >
        两人在各自的领地做了同构的事（接纳敌人/解放奴隶），
        遭遇了同构的结果（被自己人背叛/被迫逃离）。
        琼恩更冷静克制，丹妮更直觉冲动，但结果一样糟糕。

    - pair: "提利昂 ↔ 席恩"
      axis: 身份归零后的重建
      contrast: >
        两人都经历了"失去一切身份"的极端体验（奴隶/臭佬），
        但重建路径不同：提利昂靠才智重新入局（政治人），
        席恩靠行动重获人格（道德人）。

    - pair: "巴利斯坦 ↔ 乔恩·康宁顿"
      axis: 老骑士的最后使命
      contrast: >
        两个老人各守护一个年轻的坦格利安统治者——
        巴利斯坦用荣誉感维持秩序（正面），
        康宁顿用灰鳞病的紧迫感推进征服（负面）。
        两人都知道自己时日无多，但应对方式截然不同。

    - pair: "瑟曦 ↔ 丹妮"
      axis: 女性与权力
      contrast: >
        两个女王的平行坠落：瑟曦被剥去衣服走过街道，
        丹妮被剥去政治身份流落荒野。
        但指向不同：瑟曦的堕落源于自身的愚蠢和残暴，
        丹妮的"堕落"实际上是回归本质。

  # 章节标题作为身份刻度尺
  title_as_identity_axis:
    description: >
      席恩线的章节标题追踪了他的身份变化：
      "臭佬"→"临冬城亲王"→"变色龙"→"临冬城的鬼魂"→"席恩"
      每个标题都不是名字，而是他在那一刻的社会角色/心理状态——
      直到最后一章他重新获得真名。
      类似手法也用于昆廷（"商人的仆从"→"风吹团员"→"被拒的求婚者"→"驯龙者"）
      和巴利斯坦（"女王铁卫"→"免职的骑士"→"废王者"→"女王之手"）。

# ═══════════════════════════════════════════════
#  关系网
# ═══════════════════════════════════════════════

relationships:
  power_dynamics:
    # 长城权力结构
    wall: >
      琼恩（总司令）→ 波文·马尔锡（首席事务官/反对派）
      琼恩 ↔ 史坦尼斯（不平等的合作：琼恩需要资源，史坦尼斯需要合法性）
      琼恩 ↔ 梅丽珊卓（不信任的利用：她有预言能力，但琼恩不信红神）
      琼恩 ↔ 托蒙德（跨族信任：全书中琼恩唯一真正的盟友）

    # 弥林权力结构
    meereen: >
      丹妮 → 巴利斯坦（绝对忠诚，但丹妮飞走后他被迫独立决策）
      丹妮 ↔ 西茨达拉（政治婚姻：无爱的权力交换）
      丹妮 ↔ 达里奥（真心/肉欲：她真正想要的，但在政治上不可能选择）
      巴利斯坦 ↔ 斯卡拉茨（密谋同盟：一个守荣誉，一个务实，互补但脆弱）

    # 临冬城权力结构
    winterfell: >
      卢斯·波顿（名义统治者）→ 拉姆斯（暴力执行者）→ 席恩（工具/囚奴）
      暗中：曼德勒 / 北境封臣 ⇋ 史塔克记忆（"北方人的记忆是长久的"）

    # 全局暗线
    global: >
      瓦里斯 + 伊利里欧（操盘手）→ 伊耿 + 康宁顿（棋子/执行者）
      提利昂（意外的催化剂：他的一句建议改变了伊耿的战略方向）

  key_tensions:
    - "琼恩 vs. 波文·马尔锡——路线之争，最终以暴力解决"
    - "丹妮 vs. 她自己的本质——妥协政治 vs. '血与火'"
    - "提利昂 vs. 自我毁灭——才智 vs. 酗酒/虚无"
    - "席恩 vs. 拉姆斯的心理控制——名字 vs. 恐惧"
    - "巴利斯坦 vs. 荣誉在乱世中的可行性"
    - "昆廷 vs. 命运——他不是英雄，但坚持按英雄剧本行动"
    - "瓦里斯 vs. 所有试图维持现状的人"

  potential_shifts:
    - "琼恩之死→长城权力真空→异鬼威胁无人应对"
    - "丹妮出走→弥林权力真空→巴利斯坦被迫从骑士变为政治家"
    - "凯冯之死→铁王座权力真空→伊耿获得战略窗口"
    - "席恩逃脱→可能落入史坦尼斯手中→北境暗战的新变数"
    - "两龙出笼→弥林大战的天平倾斜→维克塔利昂的龙号角"
