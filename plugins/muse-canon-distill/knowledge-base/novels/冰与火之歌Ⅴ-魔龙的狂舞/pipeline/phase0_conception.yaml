# Phase 0: 构想 — 《冰与火之歌Ⅴ·魔龙的狂舞》
# 逆向分析：从结局回溯提取

premise: >
  如果在一个弱肉强食的世界里，三位掌权者（守夜人总司令、弥林女王、流亡矮人）
  各自试图以理想主义的方式行使或追逐权力——收容敌人、解放奴隶、寻找新的归属——
  他们将付出什么代价？

core_value:
  positive: 正义/责任（为他人利益而行使权力）
  negative: 暴政/自利（为个人利益而行使权力）
  spectrum:
    contradictory: 冷漠/不作为（拒绝承担权力的责任）
    contrary: 妥协（为维持权力而放弃原则）
    negation_of_negation: 以正义之名行暴政——或被自己试图保护的人所背叛

controlling_idea:
  value: 毁灭/背叛（负面结局）
  cause: >
    当理想主义的统治者在一个不信任理想的世界中强行推行变革时，
    他们自身的盟友与臣民反而成为最致命的敌人
  full_statement: >
    试图以善意改变世界的统治者终将被自己的人民所背叛，
    因为在权力的游戏中，善意本身就是一种无法被信任的东西——
    琼恩被守夜人兄弟刺杀，丹妮被迫骑龙逃离自己的城市，
    凯冯被瓦里斯暗杀恰恰因为他"太能干"。
  type: ironic  # 反讽型：每条线都是"好的意图→坏的结果"

genre:
  primary: 史诗奇幻（Epic Fantasy）
  secondary: 政治权谋小说（Political Thriller）
  conventions:
    - setting: >
        中世纪风格的多大陆世界，魔法正在复苏（龙、绿先知、异鬼），
        但政治博弈仍是叙事核心驱动力
    - characters: >
        无绝对英雄/反派，每个POV角色都有道德灰度；
        传统奇幻"天选之人"被解构（琼恩被自己人杀、丹妮困在泥沼中）
    - events: >
        颠覆类型预期：英雄不会在关键时刻胜利，求婚者被龙烧死，
        最正直的统治者遭遇最惨烈的背叛
    - values: >
        权力 vs. 责任、身份 vs. 真相、秩序 vs. 变革

originality_statement:
  unique_angle: >
    本书的核心创新是"反高潮群像"结构——所有主线在结尾同时崩塌而非收束。
    传统多线叙事在终幕汇聚解决，本书则让每条线各自悬崖式断裂：
    琼恩被刺（悬念）、丹妮流落荒野（悬念）、弥林大战未打完（悬念）、
    昆廷被烧死（唯一确定结局，且是最惨烈的失败）。
    这不是叙事失败，而是刻意的设计——主控思想要求每条线的理想主义都遭遇同构的崩塌。
  cliches_to_avoid:
    - "天选之人在危机时刻觉醒力量"——琼恩在危机时刻被自己人杀
    - "龙骑士征服一切"——丹妮驯龙后不是征服而是逃亡
    - "流亡王子凯旋"——昆廷的英雄叙事以被龙烧死收场
    - "邪恶势力团结正义阵营"——守夜人面对异鬼威胁仍优先内斗

style_directives:
  - 多POV轮转叙事，章节标题即POV角色名（部分用绰号暗示身份变化）
  - 零度叙事基调：不做道德判断，让读者自行评价角色选择
  - 感官细节密集：气味、寒冷、饥饿等身体体验构建沉浸感
  - 反讽式章节编排：相邻章节的POV角色常形成主题对照
  - 悬崖式结尾：几乎所有主线以未解悬念收束

word_count: 616000  # 中文字数约61.6万
