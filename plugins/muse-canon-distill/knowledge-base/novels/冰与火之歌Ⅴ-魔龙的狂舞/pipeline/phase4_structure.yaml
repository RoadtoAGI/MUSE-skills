# Phase 4: 结构（序列展开） — 《冰与火之歌Ⅴ·魔龙的狂舞》
# 逐 Arc 展开为序列，分析多线交织

# ═══════════════════════════════════════════════
#  Arc 展开
# ═══════════════════════════════════════════════

arc_expansions:

  # ────────────────────────────────────
  #  琼恩线 (ARC-JON)
  # ────────────────────────────────────
  - arc_id: ARC-JON
    sequences:
      - seq_id: JON-SEQ1
        name: "立威：铁腕总司令"
        core_conflict: 琼恩需要在守夜人和史坦尼斯之间建立自己的权威
        escalation_direction: >
          从与史坦尼斯争论要塞控制权 → 安排山姆离开 → 斩杀史林特
        sequence_climax: >
          第286章：琼恩当众斩杀拒令的杰诺斯·史林特，一刀确立权威
        closed: 琼恩的领导合法性问题
        opened: 守夜人内部的不满开始积累

      - seq_id: JON-SEQ2
        name: "打破传统：收容野人"
        core_conflict: 琼恩决定让野人通过长城，黑衣兄弟激烈反对
        escalation_direction: >
          火刑曼斯（幻术）→ 野人入境 → 征召野人士兵 → 兄弟公开抵制
        sequence_climax: >
          第296章：琼恩宣布征召野人守长城，面对黑衣兄弟的愤怒
        closed: 野人入境的执行问题
        opened: 守夜人内部的路线分裂加深——波文·马尔锡成为反对派核心

      - seq_id: JON-SEQ3
        name: "外交突围：借力制衡"
        core_conflict: 琼恩需要在不违背誓言的前提下获取外部支持
        escalation_direction: >
          接收赛丽丝王后 → 与铁金库谈判借贷 → 安排政治联姻 →
          收到卡史塔克背叛密报
        sequence_climax: >
          第323章：琼恩与铁金库使节达成贷款和借船协议，
          同时得知阿尔夫·卡史塔克的背叛
        closed: 艰难屯救援的资源问题
        opened: 史坦尼斯的北征前景暗淡，琼恩越来越孤立

      - seq_id: JON-SEQ4
        name: "历史性行动与覆灭"
        core_conflict: 琼恩主持自由民穿越长城 → 收到拉姆斯挑衅信 → 决定率军南下
        escalation_direction: >
          三千自由民穿越长城 → 艰难屯噩耗 → 拉姆斯信件 →
          琼恩宣布率军南下 → 旺旺杀死骑士引发混乱
        sequence_climax: >
          第348章：守夜人兄弟连续刺杀琼恩，"为了守夜人"。
          "他没感觉到第四刀。只有冷……"
        closed: 琼恩的统治——以最暴烈的方式终结
        opened: 长城进入权力真空，异鬼威胁无人应对

    arc_progression_note: >
      琼恩线的四个序列呈现清晰的"信用透支"模式：
      每个正确决定（SEQ1立威→SEQ2收容→SEQ3外交→SEQ4行动）
      都消耗了一层政治资本，直到账户透支——覆灭。

  # ────────────────────────────────────
  #  丹妮线 (ARC-DANY)
  # ────────────────────────────────────
  - arc_id: ARC-DANY
    sequences:
      - seq_id: DANY-SEQ1
        name: "困兽：弥林的泥沼"
        core_conflict: 丹妮面对内忧（鹰身女妖之子）外患（渊凯围城）和道德困境（龙杀人）
        escalation_direction: >
          无垢者遭暗杀 → 焦骨申诉（龙吞食儿童）→ 两龙被囚 →
          卓耿出走 → 血瘟蔓延
        sequence_climax: >
          第290章：丹妮探视被锁的两龙后意识到失去卓耿的严重后果——
          她最大的力量已不在掌控中
        closed: 龙的威胁暂时被控制（两龙被锁）
        opened: 丹妮失去了核心军事力量，必须依靠政治手段

      - seq_id: DANY-SEQ2
        name: "妥协：联姻的代价"
        core_conflict: 丹妮为和平不断妥协——重开格斗场、嫁给西茨达拉
        escalation_direction: >
          棕人本叛变 → 关闭城门 → 接受联姻 → 婉拒昆廷 →
          与西茨达拉完婚
        sequence_climax: >
          第322章：丹妮婉拒昆廷的婚约后与西茨达拉完婚——
          选择政治正确而非个人意愿
        closed: 弥林的和平（暂时）
        opened: 丹妮远离了自己的"血与火"本质，为龙的回归埋下伏笔

      - seq_id: DANY-SEQ3
        name: "龙的回归：竞技场高潮"
        core_conflict: 妥协带来的虚假和平在竞技场上被龙的回归彻底打碎
        escalation_direction: >
          被迫接受渊凯和平条件 → 重开竞技场 →
          卓耿突降焚烧 → 丹妮冲入场中
        sequence_climax: >
          第331章：丹妮用鞭子驯服卓耿，骑龙飞离弥林。
          "龙的血肉由火构成，她心想，我也一样。"
        closed: 弥林妥协路线——丹妮以肉身否定了政治联姻的逻辑
        opened: 弥林陷入权力真空，两条龙被释放，丹妮流落荒野

    arc_progression_note: >
      丹妮线的三个序列构成"否定之否定"结构：
      SEQ1（龙的力量→失控）→ SEQ2（政治妥协→失去自我）→
      SEQ3（龙的回归→找回本质但失去一切政治成就）。
      最终她回到起点：一个人，一条龙，在荒野中。

  # ────────────────────────────────────
  #  提利昂线 (ARC-TYRION)
  # ────────────────────────────────────
  - arc_id: ARC-TYRION
    sequences:
      - seq_id: TYR-SEQ1
        name: "流亡：弑亲者的东渡"
        core_conflict: 提利昂在自我毁灭中被推上前往弥林的旅途
        escalation_direction: >
          潘托斯醉生梦死 → 得知伊耿存在 → 与伊耿同船 →
          说服伊耿直接进军维斯特洛
        sequence_climax: >
          第303章：提利昂说服伊耿放弃去弥林投靠丹妮，
          直接率军进攻维斯特洛——提利昂的政治才能重新闪现
        closed: 伊耿的战略方向
        opened: 提利昂与伊耿分道扬镳，自己的命运仍不确定

      - seq_id: TYR-SEQ2
        name: "沉沦：从自由人到奴隶"
        core_conflict: 提利昂被俘、被卖、沦为奴隶——跌入人生最低谷
        escalation_direction: >
          被乔拉俘获 → 穿越瓦兰提斯 → 风暴中落水 →
          被奴隶贩救起 → 被卖为奴
        sequence_climax: >
          第326章：提利昂被渊凯贵族亚赞买下为奴——
          一个兰尼斯特竟成了奴隶，身份彻底归零
        closed: 提利昂的旧身份
        opened: 从零开始，他必须用纯粹的才智重新立足

      - seq_id: TYR-SEQ3
        name: "重生：从奴隶到佣兵"
        core_conflict: 提利昂利用才智从奴隶营逃脱，加入次子团
        escalation_direction: >
          在奴隶营观察局势 → 主人染病 → 趁乱逃脱 →
          说服棕人本收留 → 在次子团中证明文书价值
        sequence_climax: >
          第336-345章：提利昂成功加入次子团，
          为即将到来的弥林大战布局——他重新找到了用武之地
        closed: 提利昂的生存问题
        opened: 弥林大战即将爆发，提利昂将扮演什么角色？

    arc_progression_note: >
      提利昂线是唯一的上升弧线（虽然中间经历极深的低谷）。
      三个序列构成 V 字形：SEQ1（下降开始）→ SEQ2（触底）→ SEQ3（上升）。

  # ────────────────────────────────────
  #  席恩线 (ARC-THEON)
  # ────────────────────────────────────
  - arc_id: ARC-THEON
    sequences:
      - seq_id: THEON-SEQ1
        name: "臭佬：心理奴役的深渊"
        core_conflict: 席恩的人格被拉姆斯彻底摧毁，以"臭佬"苟活
        escalation_direction: >
          从黑牢被召出 → 被命令扮演"西翁" →
          参加假艾莉亚的婚礼 → 被迫送假新娘入洞房
        sequence_climax: >
          第316章：席恩在神木林被迫将假艾莉亚交给拉姆斯——
          他看着珍妮哭泣，却无力反抗
        closed: 席恩作为"工具"的使用价值——婚礼完成
        opened: 内心深处自我意识的微弱火苗

      - seq_id: THEON-SEQ2
        name: "觉醒：名字的力量"
        core_conflict: 临冬城的封锁、神秘凶杀和心树祈祷逐渐唤醒席恩的自我
        escalation_direction: >
          暴雪封城 → 神秘凶手 → 心树前祈祷 →
          芭芭蕾·达斯丁带他进墓窖 → 听到"席恩"的声音
        sequence_climax: >
          第330章：席恩记起自己的名字，协助洗衣妇救出珍妮，
          在城墙上跳下——"我的名字是席恩"
        closed: "臭佬"这个身份——席恩选择了行动
        opened: 逃亡后的命运未知（落入史坦尼斯手中？）

    arc_progression_note: >
      席恩线的两个序列构成最纯粹的"沉沦→救赎"结构。
      章节标题即是弧光的刻度尺：臭佬→临冬城亲王→变色龙→临冬城的鬼魂→席恩。

  # ────────────────────────────────────
  #  伊耿/康宁顿线 (ARC-AEGON)
  # ────────────────────────────────────
  - arc_id: ARC-AEGON
    sequences:
      - seq_id: AEGON-SEQ1
        name: "隐龙：伊耿的秘密旅途"
        core_conflict: 伊耿在隐匿中接受教育，等待时机
        escalation_direction: >
          在船上伪装 → 提利昂认出身份 → 提利昂建议直接进军
        sequence_climax: >
          第303章：伊耿接受提利昂的建议，决定不去弥林而直接进军维斯特洛
        closed: 伊耿的战略方向
        opened: 没有丹妮和龙的支持，他能成功吗？

      - seq_id: AEGON-SEQ2
        name: "登陆：黄金团的入侵"
        core_conflict: 在缺乏龙支援的情况下，黄金团强行入侵维斯特洛
        escalation_direction: >
          分批登陆 → 攻占鹫巢堡 → 康宁顿回到故土
        sequence_climax: >
          第340章：黄金团以奇袭攻占鹫巢堡，伊耿正式亮明旗号
        closed: 伊耿的入侵可行性——证明了可以在无龙的情况下夺取据点
        opened: 维斯特洛将如何回应这个"失而复得"的坦格利安？

    arc_progression_note: >
      伊耿线在本书中仅有两个序列，但其战略意义巨大——
      终章中瓦里斯杀死凯冯的动机正是为伊耿扫清障碍。

  # ────────────────────────────────────
  #  昆廷线 (ARC-QUENTYN)
  # ────────────────────────────────────
  - arc_id: ARC-QUENTYN
    sequences:
      - seq_id: QUEN-SEQ1
        name: "求婚者：千里迢迢的使命"
        core_conflict: 昆廷带着父亲的婚约穿越大陆寻找丹妮
        escalation_direction: >
          乔装仆从 → 加入风吹团 → 抵达弥林 →
          向丹妮献上婚约 → 被婉拒
        sequence_climax: >
          第322章：丹妮婉拒昆廷的求婚——使命失败
        closed: 求婚使命的官方回答
        opened: 昆廷拒绝接受失败，萌生驯龙的疯狂念头

      - seq_id: QUEN-SEQ2
        name: "驯龙者：英雄叙事的毁灭"
        core_conflict: 昆廷试图驯龙以证明自己配得上坦格利安的血统
        escalation_direction: >
          招揽佣兵 → 闯入龙穴 → 面对韦赛利昂 → 用鞭子驯龙
        sequence_climax: >
          第347章：昆廷被雷哥喷火全身烧伤。
          "他举起鞭子，却发现鞭子烧着了，手也烧着了。"
          第349章：苟延三日后死亡。
        closed: 昆廷的生命和他代表的英雄叙事
        opened: 两条龙飞出龙穴，弥林局势彻底失控

    arc_progression_note: >
      昆廷线是全书对"英雄叙事"最残酷的解构。
      他的内心独白"英雄不会死"直接与结局形成最大反讽。

  # ────────────────────────────────────
  #  君临线 (ARC-KINGSLANDING)
  # ────────────────────────────────────
  - arc_id: ARC-KINGSLANDING
    sequences:
      - seq_id: KL-SEQ1
        name: "赎罪：瑟曦的裸行"
        core_conflict: 瑟曦为获得自由被迫接受教会的公开羞辱
        escalation_direction: >
          囚禁 → 忏悔 → 裸行赎罪 → 精神崩溃 → 被"沉默巨人"抱入红堡
        sequence_climax: >
          第344章：瑟曦赤身裸体走过君临街道，承受万民唾骂
        closed: 瑟曦的自由（暂时）
        opened: 瑟曦的审判仍未结束，"沉默巨人"暗示复仇

      - seq_id: KL-SEQ2
        name: "崩塌：凯冯之死"
        core_conflict: 凯冯试图修复秩序，却成为瓦里斯阴谋的最后障碍
        escalation_direction: >
          凯冯处理朝政 → 斥责瑟曦 → 被引到派席尔处 → 发现派席尔已死
        sequence_climax: >
          第351章：瓦里斯射杀凯冯，宣布伊耿尚在人间——
          兰尼斯特政权的最后支柱倒塌
        closed: 铁王座的有效统治
        opened: 维斯特洛进入彻底的权力真空

    arc_progression_note: >
      君临线在本书中篇幅最短但冲击力极大。
      两个序列分别击碎了兰尼斯特家族的两根支柱——
      瑟曦的权威（通过羞辱）和凯冯的能力（通过暗杀）。

# ═══════════════════════════════════════════════
#  全篇递进关系
# ═══════════════════════════════════════════════

arc_progression:
  impact_escalation: >
    各线高潮按时间和冲击力排列：
    1. 席恩跳城墙（第330章）— 个人救赎，感动
    2. 丹妮骑龙飞离（第331章）— 壮观但反讽
    3. 伊耿登陆（第340章）— 战略震撼
    4. 瑟曦裸行（第344章）— 残酷的公正
    5. 昆廷被烧（第347章）— 英雄叙事的毁灭
    6. 琼恩被刺（第348章）— 最大的背叛
    7. 凯冯被杀（第351章）— 全局棋盘重置
    冲击力从个人→政治→文明级逐层递增。

  causal_chain: >
    各线看似独立，但存在深层因果：
    丹妮困守弥林 → 昆廷求婚失败 → 昆廷驯龙被烧 → 龙出笼 → 弥林大战
    提利昂建议伊耿直接进军 → 伊耿登陆 → 瓦里斯杀凯冯为伊耿扫路
    琼恩收容野人 → 守夜人不满 → 琼恩被刺 → 长城防线崩溃
    三条线最终指向同一个方向：所有旧秩序都在崩塌，为"凛冬"做准备。

# ═══════════════════════════════════════════════
#  多线叙事
# ═══════════════════════════════════════════════

narrative_threads:
  - name: "权力线"
    description: >
      关于"如何统治"的探讨——琼恩/丹妮/凯冯各自尝试不同的统治方式
    primary_arcs: [ARC-JON, ARC-DANY, ARC-KINGSLANDING]

  - name: "身份线"
    description: >
      关于"我是谁"的追问——席恩重获名字、提利昂寻找意义、
      伊耿的身份真伪、假艾莉亚的冒充
    primary_arcs: [ARC-THEON, ARC-TYRION, ARC-AEGON]

  - name: "龙与魔法线"
    description: >
      魔法力量的复苏与不可控——龙的驯服/失控、绿先知觉醒、
      异鬼南侵、红神预言
    primary_arcs: [ARC-DANY, ARC-QUENTYN]
    presence: 贯穿，但在丹妮线和布兰线中最集中

  - name: "北境暗战线"
    description: >
      临冬城内部的权力博弈——波顿/佛雷 vs. 暗中反抗的北境封臣
    primary_arcs: [ARC-THEON]
    presence: 集中于中后段（第311-341章）

  - name: "瓦里斯暗线"
    description: >
      贯穿全书但直到终章才完全暴露的长期阴谋——
      瓦里斯-伊利里欧操盘伊耿复辟
    primary_arcs: [ARC-AEGON, ARC-KINGSLANDING]
    presence: >
      间歇——第280章（提利昂在潘托斯）暗示、第287章（伊耿登场）推进、
      第340章（登陆）执行、第351章（凯冯之死）完全揭示
