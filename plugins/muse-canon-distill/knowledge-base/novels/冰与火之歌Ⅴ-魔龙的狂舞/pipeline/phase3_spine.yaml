# Phase 3: 脊椎 + Arc 框架 — 《冰与火之歌Ⅴ·魔龙的狂舞》
# 多POV结构：无单一主角，以主题脊椎统合多线

# ═══════════════════════════════════════════════
#  全书主题脊椎（跨POV统合）
# ═══════════════════════════════════════════════

inciting_incident:
  description: >
    多重激励事件同时发生（多POV结构的特征）：
    1. 琼恩就任守夜人总司令，面对收容野人的决定（第282章）
    2. 卓耿吞食儿童→两龙被囚→卓耿出走，丹妮失去核心力量（第281-290章）
    3. 提利昂弑父后流亡，在潘托斯得知龙女王与伊耿（第280章）
    三条线的激励事件共享同一模式：掌权/追求权力→发现权力的代价
  type: decision  # 三位主角都面临是否承担权力/责任的选择
  timing: 第280-282章 / 故事前5%
  balance_before: >
    琼恩刚当选总司令、丹妮初步控制弥林、提利昂在维斯特洛有身份——
    三人各自拥有某种形式的"权力"或"安全"
  balance_after: >
    琼恩必须做出违背传统的决定、丹妮发现自己的龙在杀人、
    提利昂失去一切身份开始流亡——"权力"显示出其毒性面
  impact_on_protagonist: >
    三位主角同时被推入"权力的困境"——
    拥有权力就意味着必须做出没人能接受的选择

desire_object:
  conscious: >
    琼恩：守住长城、对抗异鬼
    丹妮：统治弥林、终结奴隶制
    提利昂：找到新的归属和目的
  unconscious: >
    琼恩：需要接受自己不仅是守夜人，还是史塔克
    丹妮：需要接受"龙"不是可以驯服的工具，而是她的本质
    提利昂：需要停止自我毁灭，找到超越复仇的人生意义
  tension: >
    三条线的张力同构：意识到的追求（维持秩序）vs.
    不自觉的需要（接受自己的真实本质）。
    每个角色都在试图做"正确的事"，但"正确"本身就是陷阱——
    琼恩的正确导致背叛，丹妮的正确导致妥协，提利昂的正确仍在路上。

spine_statement: >
  在一个权力即生存的世界里，三个试图以善意行使权力的人
  各自发现：他们最大的敌人不是外部威胁，而是自己阵营内部
  对变革的恐惧与抗拒。

spine_type: unconscious  # 角色意识到的追求与故事真正讲述的故事不同

dramatic_question:
  question: >
    理想主义的统治者能在一个残酷的世界中生存吗？
    ——更深层的问题：权力能否被用于善？
  obligatory_scene: >
    必须出现每位统治者面临"放弃原则还是被毁灭"的两难场景：
    琼恩在被刺前的最后一章、丹妮在竞技场面对卓耿、
    凯冯被瓦里斯杀死"因为你太能干了"——
    三个场景回答同一个问题：不能，至少在这个世界不能。

opposing_forces:
  internal: >
    琼恩：史塔克血脉的牵绊（想救"妹妹"）vs. 守夜人誓言
    丹妮：征服者本能（"血与火"）vs. 和平治国的理想
    提利昂：自毁倾向与酗酒 vs. 天生的政治才能
  personal: >
    琼恩：波文·马尔锡及守夜人保守派——视野人为敌人
    丹妮：西茨达拉代表的弥林旧贵族——利用婚姻控制她
    席恩：拉姆斯·波顿——通过极端暴力摧毁人格
    提利昂：乔拉·莫尔蒙——将他视为筹码而非人
  external: >
    北方：异鬼大军 + 暴雪封锁 + 波顿占据临冬城
    东方：渊凯奴隶主围攻 + 血瘟 + 鹰身女妖之子
    南方：伊耿入侵 + 教会武装 + 兰尼斯特内部瓦解

# ═══════════════════════════════════════════════
#  Arc 框架（按叙事线组织，每条线自成 Arc 序列）
# ═══════════════════════════════════════════════
#
# 本书的多POV结构不适合统一的"幕"划分。
# 改为按叙事线识别 Arc，然后在 Phase 4 中分析线与线的交织。

arcs:
  # ── 琼恩线：从掌权到覆灭 ──
  - arc_id: ARC-JON
    name: "长城之主：琼恩·雪诺的统治与覆灭"
    value_at_start: "权威/希望（新任总司令，有史坦尼斯支持）"
    value_at_end: "背叛/死亡？（被自己的兄弟刺杀）"
    climax_event: >
      第348章：琼恩在处理巨人旺旺杀死骑士的混乱中，
      被波文·马尔锡等守夜人连刺数刀，"为了守夜人"。
      最后的意识是呼唤白灵，"只有冷……"
    function_note: >
      全书最大的悬崖式高潮。琼恩线的悲剧在于他做的每一件事
      在战略上都是正确的（收容野人 = 减少异鬼军队），
      但在政治上完全失败——他没有争取到足够的人心。

  # ── 丹妮线：困兽的挣扎与龙的觉醒 ──
  - arc_id: ARC-DANY
    name: "弥林女王：丹妮莉丝的统治困局与龙的回归"
    value_at_start: "权力/统治（弥林的解放者和女王）"
    value_at_end: "自由/孤独（骑龙逃离，流落荒野）"
    climax_event: >
      第331章：竞技场上卓耿突降，丹妮冲入场中用鞭子驯服黑龙，
      骑龙飞离弥林。"龙的血肉由火构成，她心想，我也一样。"
    function_note: >
      全书最壮观的高潮。但这是一个反讽式的"胜利"——
      丹妮驯服了龙，却失去了她的城市、她的丈夫、她的政治成就。
      驯龙不是征服的开始，而是对妥协政治的彻底否定。

  # ── 提利昂线：堕落与重建 ──
  - arc_id: ARC-TYRION
    name: "弑亲者的东渡：提利昂的堕落与重生"
    value_at_start: "堕落/虚无（弑父后的酗酒自毁）"
    value_at_end: "目标/行动（加入次子团，为弥林之战布局）"
    climax_event: >
      第336章：提利昂带分妮和乔拉逃离奴隶营，
      说服棕人本·普棱收留他们加入次子团——
      提利昂终于重新找到了运用才智的舞台
    function_note: >
      唯一上升弧线。提利昂从自我毁灭的深渊缓慢爬出，
      但到书末仍未抵达真正的高潮——他的完整弧光延续到下一卷。

  # ── 席恩线：从非人到重获自我 ──
  - arc_id: ARC-THEON
    name: "臭佬的觉醒：席恩·葛雷乔伊的身份重建"
    value_at_start: "非人/奴役（'臭佬'，心理完全被摧毁）"
    value_at_end: "人/行动（记起自己的名字，跳城墙逃脱）"
    climax_event: >
      第330章：席恩协助洗衣妇救出珍妮·普尔，
      在混乱中记起"我的名字是席恩"，与珍妮一同跳下城墙。
    function_note: >
      全书最感人的弧线。从章节标题的变化就能追踪弧光：
      "臭佬"→"临冬城亲王"→"变色龙"→"临冬城的鬼魂"→"席恩"。
      他重获名字的那一刻，是全书最纯粹的救赎时刻。

  # ── 伊耿/康宁顿线：隐龙现身 ──
  - arc_id: ARC-AEGON
    name: "隐龙登场：伊耿的维斯特洛入侵"
    value_at_start: "隐藏/准备（伪装身份在船上接受教育）"
    value_at_end: "公开/征服（黄金团攻占鹫巢堡，亮明旗号）"
    climax_event: >
      第340章：乔恩·康宁顿率黄金团夺回鹫巢堡，
      伊耿·坦格利安正式登陆维斯特洛，开启复辟战争
    function_note: >
      这条线是全书的"隐藏炸弹"——在其他线都在消耗中时，
      伊耿在几乎无人注意的角落悄然积蓄力量。
      瓦里斯终章的台词为这条线提供了完整的意义揭示。

  # ── 昆廷线：反英雄叙事 ──
  - arc_id: ARC-QUENTYN
    name: "被拒的求婚者：昆廷·马泰尔的悲剧"
    value_at_start: "使命/希望（父亲交付的求婚使命）"
    value_at_end: "死亡（被龙烧死，苟延三日后去世）"
    climax_event: >
      第347章：昆廷闯入龙穴试图驯龙证明自己，
      被雷哥喷火全身烧伤。"他举起鞭子，却发现鞭子烧着了，
      手也烧着了。他全身、全身都烧着了。"
    function_note: >
      对"英雄叙事"的残酷解构。昆廷按照童话逻辑行动——
      "王子历经磨难，驯服巨龙，赢得公主"——
      但在马丁的世界里，这个叙事逻辑导致了最惨烈的死亡。
      他的内心独白"英雄不会死"是全书最具反讽的一句话。

  # ── 君临线：秩序的瓦解 ──
  - arc_id: ARC-KINGSLANDING
    name: "君临的冬天：兰尼斯特政权的最终崩溃"
    value_at_start: "脆弱的秩序（凯冯试图修复瑟曦的破坏）"
    value_at_end: "彻底崩溃（凯冯被杀、瑟曦受辱、铁王座无人执政）"
    climax_event: >
      第351章终章：瓦里斯用十字弓射杀凯冯，宣布伊耿尚在人间。
      "您确实是个威胁——您企图颠覆太后陛下干的好事。"
    function_note: >
      终章是全书主控思想的最集中表达：
      凯冯被杀不是因为他做错了，而恰恰因为他做对了——
      一个能干的摄政会稳固铁王座，而瓦里斯需要它崩溃。

# ═══════════════════════════════════════════════
#  故事高潮设计
# ═══════════════════════════════════════════════

story_climax_design:
  # 注：本书无统一高潮——每条线各有高潮，共同构成"多声部崩塌"
  crisis:
    dilemma: >
      全书最集中的两难在琼恩线最终章（第348章）：
      琼恩收到拉姆斯的挑衅信后，必须选择——
      遵守守夜人誓言不干涉王国事务，还是率军南下迎战拉姆斯？
    option_a: 坚守誓言，放弃妹妹，维持长城的脆弱和平
    option_b: 率军南下，打破誓言，成为守夜人历史上的叛徒
    character_revelation: >
      琼恩选择了B——证明他在骨子里仍是史塔克家的人，
      守夜人誓言无法压过血脉的呼唤。这个选择直接导致他的死亡。
  climax:
    action: >
      多线同步高潮：
      琼恩被刺（第348章）→ 丹妮骑龙飞离（第331章）→
      昆廷被烧死（第347章）→ 凯冯被暗杀（第351章）
    value_change:
      from: "各方势力维持脆弱平衡"
      to: "所有平衡同时崩塌——长城无人指挥、弥林无女王、
           铁王座无摄政、两条龙飞出牢笼"
    controlling_idea_expression: >
      四个高潮共同表达主控思想：
      在权力的游戏中，试图建立秩序的人恰恰是秩序最大的威胁——
      因为他们的存在阻碍了更强大的力量（瓦里斯的阴谋、
      守夜人的恐惧、龙的本能、命运的残酷）达成目的。
  resolution:
    new_balance: >
      没有新平衡——这正是本书的设计意图。
      所有线都以开放式悬念收束，指向下一卷《凛冬的寒风》。
      唯一确定的"解决"是最惨烈的：昆廷死了，梦想碎了。
    lingering_feeling: >
      深刻的不安与期待交织——读者被迫面对一个问题：
      在这样一个世界里，还有谁能把事情做对？
      答案可能是：没有人。
