novel: 冰与火之歌Ⅴ·魔龙的狂舞
author: 乔治·R·R·马丁
lang: zh
translator: ''
narration_voice: 多视角限知贴身，权力判断贴着身体反应走
diction: 译文用冷硬名物、粗口和宫廷称号并置
rhetoric_density: medium
dialogue_mode: 对白多为试探、命令、交易和身份逼问
pacing: 先铺制度与感官细节，再用短句制造断裂
signature_moves:
- 让政治抉择落到饥饿、寒冷、疼痛等身体经验
- 用称号、誓言、礼仪反衬真实权力关系
- 关键转折前先堆叠程序、空间和旁观者反应
- 把人物自我辩解写成反复内问和短句否认
- 以实物证据替代长篇解释触发道德困境
anti_signature:
- 不要用全知旁白直接裁判人物善恶
- 不要把冲突写成纯心理独白而无制度压力
- 不要让转折脱离身体代价和具体物件
author_cross_ref: 延续系列的多视角权力叙事，本卷更偏失败、囚禁和身份剥落。
style_card_by: Codex (executor)
