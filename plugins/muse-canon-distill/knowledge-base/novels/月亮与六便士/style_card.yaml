novel: 月亮与六便士
author: 毛姆
lang: zh
translator: ''
narration_voice: 第一人称旁观兼剖析，先见证再冷讽判断
diction: 译文白话平直，夹社会讽刺与抽象议论
rhetoric_density: medium
dialogue_mode: 对白短促点破，叙述负责铺垫与反讽
pacing: 长段心理社会分析后，以短句落锤
signature_moves:
- 用旁观者自嘲降低姿态，再转入尖锐人性剖析
- 让客厅、酒馆、病房等静态场所承载价值冲突
- 用短促冷答击碎旁人的道德叙事
- 先以平实细节描摹人物外貌，再抽象出社会类型
- 在异域景物或艺术对象前突然升高为精神震动
anti_signature:
- 连续抒情而缺少冷讽旁白
- 让对白承担全部解释而不留叙述判断
- 把人物写成单一善恶标签
