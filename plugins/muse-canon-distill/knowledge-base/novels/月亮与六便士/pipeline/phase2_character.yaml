# Phase 2: 角色系统设计图
# 只记角色之间的关系与功能分配，不记个体画像（个体画像见 characters/*.md）

cast_overview:
  protagonist: "查尔斯·史特利克兰"
  antagonist: >
    无单一对手。对抗力量是多层的：
    1. 世俗社会的规范体系（通过艾美、麦克安德鲁夫妇体现）
    2. 人际纽带的牵引（通过施特洛夫的善良、勃朗什的情欲体现）
    3. 肉体的局限（疾病、失明——最终的对手）
    史特利克兰从不主动对抗任何人，他只是无视——
    真正的"对手"是他自己无法表达内心所见的挫败感。
  supporting_cast:
    - name: "叙述者"
      function: >
        认知窗口与道德试纸——读者通过他观察史特利克兰，
        他的困惑、偏见和逐步的理解构成了阅读体验的骨架。
        他同时是"普通人的代言人"，用常识去丈量天才，
        然后发现常识不够用。
    - name: "艾美·史特利克兰"
      function: >
        世俗价值的化身——体面、名声、社会认同。
        她的存在定义了史特利克兰"抛弃了什么"。
        尾声中她以"天才的妻子"自居，完成了世俗世界收编天才的反讽闭环。
    - name: "德尔克·施特洛夫"
      function: >
        善良庸人的极端标本——对艺术有最精准的判断力，
        自己却只能画最平庸的画。他的悲剧回答了一个核心问题：
        善良在天才面前是否有价值？（答案是矛盾的——他被毁灭了，
        但他对天才的辨识比任何人都准确。）
    - name: "勃朗什·施特洛夫"
      function: >
        原始欲望的牺牲品——她的存在揭示了史特利克兰的"非人性吸引力"，
        同时展示了体面外表下被压抑的欲望一旦释放的毁灭性力量。
        她是ARC-2的核心燃料。
    - name: "艾塔"
      function: >
        原始忠诚的化身——与艾美形成终极对比。
        她不理解艺术，不要求解释，只提供无条件的陪伴。
        她是史特利克兰唯一需要的那种人际关系：不打扰、不索取、绝对忠诚。
    - name: "库特拉斯医生"
      function: >
        终极见证者——他是唯一亲眼看到壁画的叙述者，
        他的震惊替代了读者的直接体验，是毛姆"有意空白"策略的执行者。
    - name: "布吕诺船长"
      function: >
        正面对照——另一种"追求美"的人生。
        他通过建设（把荒岛变花园）而非毁灭来追求美，
        证明"做自己想做的事"不必然导向冷酷和孤独。
    - name: "蒂娅蕾·约翰逊"
      function: >
        塔希提世界的入口与解说员——她的热情、粗犷和生命力
        代表了南太平洋对一切欧洲流浪者的接纳。
        她为史特利克兰做媒，是他从孤独到安宁的桥梁。
    - name: "尼柯尔斯船长"
      function: >
        喜剧性陪衬——一个被妻子管束的流浪汉，
        与史特利克兰的绝对自由形成反差。
        证明并非所有"非常规"的人都有勇气和能力挣脱束缚。

# ── 对比轴：角色在相同情境下的对比 ──

contrast_axes:
  - axis: "面对艺术的态度"
    poles:
      - "史特利克兰：艺术是不可抗拒的使命，值得为之抛弃一切"
      - "施特洛夫：艺术是真诚的热爱，但创作能力与鉴赏能力严重脱节"
      - "艾美：艺术是社交资本——结交作家和画家来提升地位"
      - "艾塔：对艺术毫无理解，但不干涉——这恰恰是史特利克兰需要的"

  - axis: "面对爱情/人际关系的态度"
    poles:
      - "史特利克兰：爱情是疾病，女人是工具，任何纽带都是障碍"
      - "施特洛夫：爱到自我毁灭——'我爱她远远超过了爱我自己'"
      - "勃朗什：表面忠贞→被原始欲望彻底吞噬→毁灭"
      - "艾塔：'你是我的男人，我是你的女人'——本能的、无条件的归属"
      - "艾美：爱情 = 社会契约，丈夫出走 = 违约——她的痛苦是体面被破坏"

  - axis: "面对天才的反应"
    poles:
      - "施特洛夫：崇拜到丧失自我——明知会被伤害仍无法远离"
      - "叙述者：困惑→愤怒→同情→敬畏，始终保持距离"
      - "艾美：从无视到否认到利用（尾声中以'天才的妻子'自居）"
      - "勃朗什：从厌恶到被原始吸引力吞噬——她对天才的反应是毁灭性的"
      - "库特拉斯医生：不懂艺术但被壁画的力量震撼——'我的上帝，这是个天才'"

  - axis: "面对社会规范的态度"
    poles:
      - "史特利克兰：根本不承认社会规范的存在——不反叛，只是无视"
      - "艾美：社会规范是生存的基础——她编造'舞蹈演员私奔'故事来维护体面"
      - "施特洛夫：遵守社会规范但被同行利用——善良在没有力量保护时被践踏"
      - "叙述者：理解社会规范但能跳出来审视——他是规范的分析者而非盲从者"

# ── 关系网 ──

relationships:
  power_dynamics: >
    史特利克兰对所有人拥有绝对的精神权力——不是因为他刻意控制，
    而是因为他的彻底漠视让所有试图影响他的人都无处着力。
    "他就像一个身上涂满了油的摔跤手，你根本抓不住他。"
    施特洛夫对他的崇拜让权力失衡达到极端——
    崇拜者主动放弃了所有谈判筹码。

  key_tensions:
    - "史特利克兰 ↔ 施特洛夫：蔑视与崇拜的不对等关系——施特洛夫的善良被反复消耗却始终回来"
    - "史特利克兰 ↔ 勃朗什：原始吸引力——她的恐惧本身就是被吸引的证据"
    - "史特利克兰 ↔ 叙述者：好奇与厌恶的拉扯——叙述者无法远离也无法靠近"
    - "施特洛夫 ↔ 勃朗什：丈夫的无条件爱 vs. 妻子被压抑的不满——'被动的感情'"
    - "艾美 ↔ 史特利克兰（缺席）：体面世界 vs. 不在场的反叛者——她的愤怒没有对象"
    - "艾塔 ↔ 史特利克兰：唯一不构成张力的关系——因为艾塔从不索取"

  potential_shifts:
    - "施特洛夫从崇拜者到受害者：善良被利用→婚姻被毁→但仍无法否认天才（裸体画场景）"
    - "勃朗什从厌恶到被吸引到毁灭：'讨厌'是欲望的伪装→日夜照料病人触发身体接触→堕落→被抛弃→自杀"
    - "艾美从被抛弃者到'天才的妻子'：从受害者叙事到利益收割——全书最精妙的反讽之一"
    - "叙述者从道德审判者到理解者：从'你是天底下最混账的人'到'他是个很讨厌的人，但我认为他是伟大的'"

# ── 角色系统的整体设计逻辑 ──

system_design_note: >
  毛姆的角色系统围绕一个核心问题展开：天才的存在如何影响周围的普通人？

  史特利克兰本人几乎不变化（他从出走起就已经"完成"了），
  真正的弧光发生在围绕他的人身上：
  - 施特洛夫：善良被毁灭但信念不灭
  - 勃朗什：压抑被释放然后自我毁灭
  - 艾美：受害转为利用
  - 叙述者：困惑走向理解

  这是一个"恒星与行星"的系统——
  史特利克兰是不动的中心（引力源），其他角色围绕他运转并被其引力改变轨道。

  塔希提部分的角色（艾塔、蒂娅蕾、布吕诺、库特拉斯）
  提供了完全不同的参照系——他们不被史特利克兰的引力扭曲，
  因为他们本身就生活在一个不以欧洲社会规范为中心的世界里。
  艾塔的"不被扭曲"恰恰是她能与史特利克兰共存的原因。
