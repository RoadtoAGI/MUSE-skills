inciting_incident:
  description: >
    查尔斯·史特利克兰——伦敦的证券经纪人、两个孩子的父亲——在妻子和孩子度假归来前
    留下一封简短的信宣布永远离开，独自去了巴黎。信中没有任何解释或歉意。
    叙述者受托去巴黎劝回他，却发现他不是为了另一个女人，而是——"我要画画。"
  type: decision  # 蓄谋已久的决定，而非偶然事件——他用一年时间慢慢收摊生意、秘密上夜校
  timing: "第7—12章（叙事时间约故事15%处，但作为回溯讲述）"
  balance_before: >
    十七年稳定的中产阶级婚姻，体面的社交生活，两个上学的孩子。
    史特利克兰看起来是一个'无聊的好人'——叙述者第一次见他时甚至没有留下任何印象。
  balance_after: >
    妻子陷入经济困境和社会耻辱，孩子由亲戚收养。
    史特利克兰住在巴黎最破败的旅馆里，身无分文，但'神态非常自在'。
    伦敦的体面世界被彻底抛弃——不是因为它崩塌了，而是因为他不再认为它存在。
  impact_on_protagonist: >
    从外部看——他从受人尊敬的中产阶级变成了被唾弃的抛妻者。
    从内部看——他获得了绝对的自由，开始了真正的生活。
    "一个人要是落了水，他游泳游得好不好无关紧要，反正他得从水里挣扎出来，不然就得淹死。"

desire_object:
  conscious: "画画——用画笔表达他内心看到的某种东西，尽管他自己也说不清那是什么"
  unconscious: >
    找到灵魂的真正归宿，完成一次超越人类经验的创造——
    他不自觉地需要的不仅是"画画"，而是创造一个世界并确认它是美好的，
    然后以最高的蔑视毁灭它，证明创造本身（而非作品）才是目的。
  tension: >
    他的自觉追求（画画/学画）在前二十年里只是手段，
    真正的需要（完成创造使命）直到塔希提的壁画才完全实现。
    中间的一切——巴黎的贫困、施特洛夫夫妇的毁灭、马赛的流浪——
    都是他在寻找"那座可能不存在的神庙"过程中的代价。

spine_statement: >
  一个被不可抗拒的创作欲望附体的人，抛弃一切去追求艺术的绝对真理，
  最终在南太平洋的荒野中完成了超越人类经验的创造，然后命令毁灭它。

spine_type: unconscious  # 他意识到的追求是"画画"，但真正驱动他的是更深的创造使命

dramatic_question:
  question: "史特利克兰能否找到他灵魂深处追求的那种表达？代价是什么？"
  obligatory_scene: >
    他必须在某个时刻完成一件让所有人——甚至嘲笑他的人——
    都不得不承认其伟大的作品。这件作品必须证明他抛弃一切的决定不是疯狂，
    而是回应了某种高于人间道德的召唤。
    （实现为：第56章失明中完成的壁画——"我的上帝，这是个天才。"）

opposing_forces:
  internal: >
    肉体与精神的对立——他不时纵情于最粗野的肉欲，事后又感到需要净化。
    叙述者描述他的灵与肉的矛盾："他的灵魂被一种无法控制的渴望所征服，
    然后厌恶地回看自己的肉身。"另一层内在阻力是他的表达能力：
    他看到了什么但画不出来——"像一个朝圣者永远在寻找一座可能不存在的神庙。"
  personal: >
    妻子艾美要求他回归家庭，施特洛夫用善良和崇拜缠住他，
    勃朗什用情欲纠缠他，叙述者用道德审判质问他。
    所有人都试图用人际关系拉住他——他一一挣脱，代价是勃朗什的死和施特洛夫的毁灭。
  external: >
    维多利亚时代社会对"体面"的要求，画商对"卖不出去的画"的拒绝，
    物质上的赤贫（百余英镑度过数年），巴黎画室大师对他作品的沉默否定，
    最后是麻风病和失明——肉体对创作意志的终极对抗。

# ── 幕/Arc 框架 ──

arcs:
  - arc_id: ARC-1
    name: "出走——从体面到自由"
    value_at_start: "体面的束缚（十七年稳定婚姻、受人尊敬的职业、社交网络）"
    value_at_end: "贫困的自由（巴黎破旧旅馆、身无分文、但'神态非常自在'）"
    climax_event: "叙述者在巴黎发现史特利克兰不是因为女人而是要画画——'我必须画画'（第12章）"
    function_note: "建立核心冲突（灵魂自由 vs. 世俗束缚），定义主角的不可逆决定"

  - arc_id: ARC-2
    name: "巴黎——天才与庸人的碰撞"
    value_at_start: "孤立的修行（五年独自学画，没有卖出一幅画，被所有人嘲笑）"
    value_at_end: "毁灭性的代价（施特洛夫的善良被践踏，勃朗什自杀，施特洛夫精神崩溃回荷兰）"
    climax_event: "勃朗什服草酸自杀——史特利克兰对此毫无悔意（第34—36章）"
    function_note: >
      揭示天才追求的道德代价：史特利克兰的存在像一颗陨石，
      撞碎了施特洛夫夫妇看似完美的田园牧歌。
      此 Arc 回答了一个关键问题——天才可以冷酷到什么程度？

  - arc_id: ARC-3
    name: "流浪——寻找归宿"
    value_at_start: "漂泊无根（离开巴黎后在马赛流浪，住收容所、排队领面包）"
    value_at_end: "找到精神故乡（第一次看到塔希提岛——'这就是我一生在寻找的地方'）"
    climax_event: "史特利克兰搭上开往南太平洋的轮船，以死去司炉的身份离开马赛（第47章）"
    function_note: >
      过渡性 Arc，将主角从欧洲文明世界彻底移至原始世界。
      尼柯尔斯船长的喜剧性陪衬和亚伯拉罕医生的平行故事
      强化了核心价值辩证——"做自己想做的事就是糟蹋生活吗？"

  - arc_id: ARC-4
    name: "塔希提——创造与毁灭"
    value_at_start: "安宁的创作（与艾塔的原始婚姻，山谷中的木屋，三年最幸福的时光）"
    value_at_end: "超越性的完成与终极蔑视（失明中完成壁画，命令烧毁，死亡）"
    climax_event: >
      库特拉斯医生走进黑暗恶臭的屋子，发现四面墙壁从地板到天花板覆满旷世壁画——
      "我的上帝，这是个天才。"而史特利克兰已经死了，且双目失明将近一年。
      （第56章）
    function_note: >
      全书的终极高潮。创造使命完成→壁画烧毁→叙述者的领悟：
      "他创造了一个世界，也看到了自己的创造是美好的。
      然后，他怀着骄傲和轻蔑的心情，把它毁掉了。"

# ── 故事高潮设计 ──

story_climax_design:
  crisis:
    dilemma: >
      史特利克兰在患上麻风病、逐渐失明的过程中，面临终极选择：
      停止绘画保存体力延长生命，还是在黑暗中继续创作直到死亡？
    option_a: "接受命运，停止绘画，在艾塔的照料中安静地死去"
    option_b: "在失明和腐烂的肉体中继续画，直到完成内心看到的最终景象"
    character_revelation: >
      他选择了后者——揭示了他的本质不是"想画画的人"，
      而是一个被创造使命控制到超越肉体极限的存在。
      他用瞎了的眼睛"看见"并画出了别人用明亮的眼睛也看不到的东西。
  climax:
    action: >
      在完全失明的状态下，用将近一年的时间，
      在四面墙壁上从地板到天花板画出了一幅表现"混沌初开般的伊甸园"的巨型壁画——
      大自然的崇高与冷漠、美丽与残忍，让人产生对宇宙之初的敬畏。
    value_change:
      from: "未完成的创作使命（一生的挣扎、所有人的质疑）"
      to: "绝对的创造完成（连不懂艺术的医生都被震撼——'我的上帝，这是个天才'）"
    controlling_idea_expression: >
      壁画的完成证明了他抛弃一切的决定不是疯狂——
      他听从的召唤确实通向了超越人类经验的创造。
      而命令烧毁壁画则表达了主控思想的最后一层：
      创造本身就是目的，世界不配拥有它，也不需要拥有它。
  resolution:
    new_balance: >
      史特利克兰死去，壁画化为灰烬。
      叙述者回到伦敦，发现艾美以"天才的妻子"自居，
      客厅装饰着源自史特利克兰艺术革命的流行色彩——她一无所知。
      史特利克兰与艾塔的儿子在南太平洋的大帆船上无忧无虑地跳舞。
      世俗世界用六便士的尺度衡量月亮，真正的继承者在大洋上自由地活着。
    lingering_feeling: >
      一种深沉的反讽和无法解答的不安：
      天才的伟大是否值得它造成的毁灭？创造的价值是否超越了道德？
      没有答案——毛姆刻意留下了这个空白，
      让每个读者用自己的人生经验去填充。
