premise: "如果一个四十岁的伦敦证券经纪人突然被不可抗拒的创作欲望所控制，抛弃妻子、孩子、事业和一切社会关系去追求绘画，将会发生什么？"

core_value:
  positive: 灵魂自由（忠于内心召唤，追求艺术的绝对真理）
  negative: 世俗束缚（体面、名声、社会责任、道德义务）
  spectrum:
    contradictory: 庸碌安逸（既非真正自由也未被真正束缚的惰性状态——史特利克兰出走前十七年的生活）
    contrary: 舒适的妥协（为维持体面而压抑内心渴望——施特洛夫明知自己画得平庸却安于现状）
    negation_of_negation: 以自由之名行毁灭（为追求绝对的灵魂自由而摧毁他人的生活甚至生命——勃朗什之死）

controlling_idea:
  value: 灵魂自由 / 创造使命的绝对优先
  cause: 因为创作者将艺术使命置于一切人间价值（道德、爱情、生命）之上，且创造本身——而非作品被世界看到——就是最终目的
  full_statement: "当一个人听从灵魂深处不可抗拒的召唤，将艺术使命置于道德、爱情和生命之上时，他可以达到超越人类经验的创造高度；但创造完成后他有权蔑视并毁灭自己的成就，因为创造本身就是目的——而世俗世界永远只能通过六便士的尺度去衡量月亮的价值。"
  type: ironic  # 既肯定艺术追求的伟大，又揭示其代价的残酷；既讽刺世俗对天才的无知，又不回避天才对他人的冷酷

genre:
  primary: 艺术家小说（Künstlerroman）
  secondary: 人物传记体小说
  conventions:
    - setting: 欧洲都市（伦敦/巴黎）→ 异域（南太平洋）的空间迁移
    - characters: 天才艺术家、被抛弃的妻子、善良的庸人（施特洛夫）、忠诚的原始女性（艾塔）
    - events: 出走、贫困、疾病、创作高峰、死后成名
    - values: 艺术与生活的对立、文明与原始的张力、天才与道德的冲突

originality_statement:
  unique_angle: >
    以旁观者第一人称叙述，刻意保持对天才内心世界的"不可知"——叙述者坦承自己永远无法理解史特利克兰，
    读者也被设计成永远无法完全进入主角的内心。这种"有意的空白"是毛姆最独特的叙事策略：
    不写天才在想什么，而是写天才的存在如何震荡周围的普通人。
    主角几乎从不解释自己——他最有力的自白只有五个字："我必须画画。"
  cliches_to_avoid:
    - 避免了"天才必有戏剧性童年"的俗套——史特利克兰的前四十年完全平庸
    - 避免了"艺术家浪漫化的贫困"——史特利克兰的贫困是真实的、肮脏的、毫无诗意的
    - 避免了"天才晚年被世界认可"的温情结局——他在失明中完成杰作，然后命令烧毁
    - 避免了"叙述者完全理解主角"的全知视角——叙述者反复承认自己不懂、在猜测

style_directives:
  - 旁观者第一人称叙事（叙述者 = 观察者，非当事人）
  - 冷静的讽刺笔调，对人性弱点不加掩饰也不刻意批判
  - 大段议论穿插叙事——毛姆式的格言体散文
  - 多声部转述：不同角色（施特洛夫、尼柯尔斯、蒂娅蕾、库特拉斯医生、布吕诺船长）各自讲述片段，拼贴出主角全貌
  - 情感克制：关键时刻用行为和沉默替代内心描写

word_count: 120000  # 约12万字（中文译本）
