# Phase 5: 关键场景（只提取结构转折点、高潮、关键建置场景）

sequence_expansions:

  # ── ARC-1: 出走 ──

  - seq_id: ARC1-SEQ1
    scenes:
      - scene_id: S01
        arc_id: ARC-1
        location: "伦敦，史特利克兰太太家中"
        time: "某个晚宴之夜"
        participants: [叙述者, 艾美·史特利克兰, 查尔斯·史特利克兰, 其他宾客]
        pov: 叙述者
        conflict: "叙述者对史特利克兰毫无印象——这个人完全没有存在感"
        value_start: "平庸的社交常态"
        value_end: "一个'无聊的好人'的基线被建立——为后续反转蓄势"
        must_include: "叙述者对史特利克兰的'零印象'——这个空白本身就是叙事设计"
        handoff: "若干月后麦克安德鲁上校带来出走消息"
        source_chapter: "第1—8章（建置部分）"

  - seq_id: ARC1-SEQ2
    scenes:
      - scene_id: S02
        arc_id: ARC-1
        location: "伦敦街头 → 史特利克兰太太家中"
        time: "出走消息传来后"
        participants: [叙述者, 艾美·史特利克兰, 麦克安德鲁上校]
        pov: 叙述者
        conflict: "艾美要求叙述者去巴黎追回丈夫——她确信是另一个女人"
        value_start: "震惊与困惑——一个体面男人为何出走？"
        value_end: "叙述者接受使命——但已暗暗怀疑'另一个女人'的解释"
        must_include: "史特利克兰的离别信——极度简短、零感情、不可逆"
        handoff: "叙述者前往巴黎"
        source_chapter: "第9—10章"

      - scene_id: S03
        arc_id: ARC-1
        location: "巴黎，破旧的比利时酒店六楼32号房"
        time: "傍晚"
        participants: [叙述者, 查尔斯·史特利克兰]
        pov: 叙述者
        conflict: "叙述者的道德规劝 vs. 史特利克兰的绝对冷漠"
        value_start: "叙述者满怀义愤准备说服一个'浪子回头'"
        value_end: "所有规劝武器全部失效——对方对每一项指控都说'是的'"
        must_include: "核心反转——'你到底是为了什么？''我要画画。'"
        handoff: "叙述者返回伦敦汇报"
        beat_direction: >
          节奏从叙述者的道德攻势层层递进（妻子、孩子、金钱、名声），
          每一层都被史特利克兰的一个字'是'化解，直到最终一击——'我要画画'——
          完全颠覆了整场对话的性质。沉默比雄辩更有力。
        source_chapter: "第11—12章"

      - scene_id: S03b
        arc_id: ARC-1
        location: "巴黎→返回伦敦途中"
        time: "对质后当晚及归途"
        participants: [叙述者, 查尔斯·史特利克兰]
        pov: 叙述者
        conflict: "叙述者试图用理性框架理解一个超越理性的行为"
        value_start: "困惑——'我要画画'是认真的吗？"
        value_end: "初步假说——创作欲望如癌细胞，如杜鹃，如涂油摔跤手"
        must_include: >
          三个反浪漫比喻系统：癌细胞（内在不可逆生长）→杜鹃（寄生毁灭宿主）→涂油摔跤手（社会规范无法着力）。
          叙述者第一次承认：道德框架在史特利克兰面前完全失效——"他就像一个身上涂满了油的摔跤手，你根本抓不住他。"
        handoff: "叙述者带着未解之谜返回伦敦——技艺能否匹配志向仍是悬念"
        source_chapter: "第13—14章"

  - seq_id: ARC1-SEQ3
    scenes:
      - scene_id: S04
        arc_id: ARC-1
        location: "伦敦，史特利克兰太太家中"
        time: "叙述者从巴黎返回后"
        participants: [叙述者, 艾美·史特利克兰, 麦克安德鲁上校夫妇]
        pov: 叙述者
        conflict: "真相（为了画画）vs. 所有人的预设（为了女人）"
        value_start: "艾美预期能用'情敌'叙事来处理这件事"
        value_end: "艾美的关键反转——'他要是为了女人我能原谅，为了理想我不能原谅'"
        must_include: >
          艾美这句话的深刻含义：你可以打败一个女人，但你打不败一个人灵魂深处的召唤。
          这是全书对世俗世界心理的最精准剖析。
        handoff: "五年时间跳跃——叙述者移居巴黎"
        beat_direction: >
          艾美的反应分三层：震惊→否认→愤怒。最后一层的愤怒比丈夫为女人出走时更深，
          因为她意识到自己面对的对手不是一个可以打败的女人，而是一个不可战胜的灵魂。
        source_chapter: "第15章"

  # ── ARC-2: 巴黎的施特洛夫悲剧 ──

  - seq_id: ARC2-SEQ1
    scenes:
      - scene_id: S05
        arc_id: ARC-2
        location: "巴黎，施特洛夫画室"
        time: "叙述者移居巴黎后"
        participants: [叙述者, 德尔克·施特洛夫, 勃朗什·施特洛夫]
        pov: 叙述者
        conflict: "施特洛夫对天才的崇拜 vs. 勃朗什对史特利克兰的厌恶"
        value_start: "温馨的田园牧歌——一对善良夫妇的完美小家"
        value_end: "天才的阴影已经投入：施特洛夫宣称史特利克兰是伟大画家"
        must_include: "'如果一百年后还有人记得你和我，那就是因为我们认识查尔斯·史特利克兰。'"
        handoff: "施特洛夫带叙述者去见史特利克兰"
        source_chapter: "第19章"

  - seq_id: ARC2-SEQ2
    scenes:
      - scene_id: S06
        arc_id: ARC-2
        location: "巴黎，史特利克兰的阁楼"
        time: "圣诞节前夕"
        participants: [叙述者, 德尔克·施特洛夫, 查尔斯·史特利克兰]
        pov: 叙述者
        conflict: "施特洛夫的善良 vs. 史特利克兰的冷漠——生死关头的碰撞"
        value_start: "史特利克兰病入膏肓，独自躺在黑暗的阁楼里高烧不退"
        value_end: "施特洛夫不顾一切地决定照料他——'该死的傻瓜'（被骂者和骂人者都适用）"
        must_include: "施特洛夫的善良在极端情境下的展现——无条件奔赴一个蔑视他的人"
        handoff: "施特洛夫回家说服妻子接纳史特利克兰"
        source_chapter: "第24章"

      - scene_id: S07
        arc_id: ARC-2
        location: "巴黎，施特洛夫家中"
        time: "紧接S06之后"
        participants: [德尔克·施特洛夫, 勃朗什·施特洛夫]
        pov: 叙述者（转述）
        conflict: "勃朗什的本能恐惧 vs. 施特洛夫的道德压力"
        value_start: "勃朗什的自我保护本能——'让他去死'"
        value_end: "被道德绑架后屈服——'你自己不是也有一次被人伸出援手拉了一把吗？'"
        must_include: >
          勃朗什的预言——'他身上有一种东西让我很害怕。他会给我们带来祸害。'
          她的恐惧不是对史特利克兰的，而是对自己内心潜藏欲望的恐惧。
        handoff: "史特利克兰搬入施特洛夫家养病"
        beat_direction: >
          全书最重要的预示场景。勃朗什的身体语言（浑身颤抖、脸色煞白）
          比她的话语更有力地揭示了即将到来的灾难。施特洛夫的善良在此变成了毁灭性的力量。
        source_chapter: "第25章"

  - seq_id: ARC2-SEQ3
    scenes:
      - scene_id: S08
        arc_id: ARC-2
        location: "巴黎，施特洛夫家/画室"
        time: "史特利克兰康复后数周"
        participants: [德尔克·施特洛夫, 勃朗什·施特洛夫, 查尔斯·史特利克兰]
        pov: 叙述者（直接观察+事后转述）
        conflict: "施特洛夫的盲目信任 vs. 勃朗什内心正在发生的不可逆裂变"
        value_start: "表面的病后恢复和感恩——实际上暗流涌动"
        value_end: "勃朗什宣布离开丈夫跟随史特利克兰——施特洛夫跪地哀求被摔倒"
        must_include: >
          施特洛夫的惊人决定：他自己离开，把画室、钱和家都留给妻子和情人——
          '想到你要去生活在那样一个不见天日的肮脏小阁楼里，我受不了。'
          这是善良的自我毁灭——超越了占有的爱。
        handoff: "施特洛夫流落街头"
        beat_direction: >
          场景从施特洛夫要求史特利克兰搬走（以为能解决问题）开始，
          经过勃朗什的冰冷宣言（'我要跟史特利克兰一起走'）达到顶峰，
          以施特洛夫主动放弃一切的反直觉行为结束。
          节奏关键：史特利克兰在这场爆发中几乎沉默——毁灭是自动发生的。
        source_chapter: "第28章"

  - seq_id: ARC2-SEQ4
    scenes:
      - scene_id: S09
        arc_id: ARC-2
        location: "巴黎，医院"
        time: "勃朗什被抛弃后"
        participants: [叙述者, 德尔克·施特洛夫, 勃朗什（垂死）]
        pov: 叙述者
        conflict: "施特洛夫的绝望拯救 vs. 勃朗什的绝对拒绝"
        value_start: "勃朗什服草酸自杀被送医"
        value_end: "勃朗什死去——'她死得非常平静'"
        must_include: >
          勃朗什至死拒绝见施特洛夫——'不要，不要，不要'。
          她的沉默和拒绝是对施特洛夫的最后一击——连被原谅的机会都不给他。
        handoff: "葬礼，然后施特洛夫面对遗物"
        source_chapter: "第34—36章"

  - seq_id: ARC2-SEQ5
    scenes:
      - scene_id: S10
        arc_id: ARC-2
        location: "巴黎，施特洛夫画室"
        time: "勃朗什葬礼后"
        participants: [德尔克·施特洛夫]
        pov: 叙述者（事后转述）
        conflict: "仇恨 vs. 对艺术之美的不可抗拒的敬畏"
        value_start: "施特洛夫回到画室，发现史特利克兰画的勃朗什裸体画"
        value_end: "他举刀要毁画——却在最后一刻被画作的伟大所震慑，放下了手"
        must_include: >
          这是全书最凝练的价值冲突瞬间：
          私人仇恨（妻子被夺走并逼死）vs. 艺术的绝对价值（这幅画是伟大的）。
          善良的庸人在被天才毁灭后，仍然无法否认天才的价值。
        handoff: "施特洛夫回荷兰，史特利克兰去马赛"
        beat_direction: >
          场景的节拍：进入空荡的画室→看到勃朗什一丝不苟洗好的餐具（死前的秩序感）→
          发现裸体画→举起刮刀→手停在空中→放下。
          厨房的整洁与画作的冲击力构成了两种女性形象的终极对比——
          家庭主妇勃朗什 vs. 画布上被欲望解放的勃朗什。
        source_chapter: "第39章"

  # ── ARC-3: 流浪 ──

  - seq_id: ARC3-SEQ1
    scenes:
      - scene_id: S11
        arc_id: ARC-3
        location: "巴黎，史特利克兰的住所"
        time: "施特洛夫离开后不久"
        participants: [叙述者, 查尔斯·史特利克兰]
        pov: 叙述者
        conflict: "叙述者的道德审判 vs. 对史特利克兰艺术的隐约敬畏"
        value_start: "叙述者对勃朗什之死充满愤怒"
        value_end: "看到约三十幅画后被深深震动——'朝圣者永远在寻找一座可能不存在的神庙'"
        must_include: "叙述者第一次直面史特利克兰的艺术——困惑但无法否认其力量"
        handoff: "史特利克兰去马赛，二人从此永别"
        source_chapter: "第41—42章"

  - seq_id: ARC3-SEQ3
    scenes:
      - scene_id: S12
        arc_id: ARC-3
        location: "叙述者的哲学反思空间"
        time: "塔希提部分之前的间奏"
        participants: [叙述者, 亚伯拉罕医生（转述）]
        pov: 叙述者
        conflict: "世俗成功 vs. 内心安宁"
        value_start: "一个才华横溢的外科医生放弃大好前程留在亚历山大港"
        value_end: "叙述者质问——'做自己想做的事、享受内心宁静，这就是糟蹋生活吗？'"
        must_include: "亚伯拉罕的'一声惊雷'——与史特利克兰的'我必须画画'构成互文"
        handoff: "进入塔希提部分"
        source_chapter: "第50章"

  # ── ARC-4: 塔希提——创造与毁灭 ──

  - seq_id: ARC4-SEQ1
    scenes:
      - scene_id: S13
        arc_id: ARC-4
        location: "塔希提，塔拉瓦奥山谷"
        time: "史特利克兰与艾塔婚后三年"
        participants: [布吕诺船长, 查尔斯·史特利克兰, 艾塔]
        pov: 叙述者（转述布吕诺船长的叙述）
        conflict: "文明世界的好奇 vs. 史特利克兰的绝对安宁"
        value_start: "布吕诺好奇地探访这个传说中的怪人"
        value_end: "'你离开欧洲从来没有后悔过吗？''我会在这里一直住到我死。'"
        must_include: "全书唯一一段史特利克兰的安宁描写——他终于找到了精神故乡"
        handoff: "时间跳跃到麻风病确诊"
        source_chapter: "第53章"

  - seq_id: ARC4-SEQ2
    scenes:
      - scene_id: S14
        arc_id: ARC-4
        location: "塔希提，塔拉瓦奥山谷木屋"
        time: "布吕诺探访后数年"
        participants: [库特拉斯医生, 查尔斯·史特利克兰, 艾塔]
        pov: 叙述者（转述库特拉斯医生的叙述）
        conflict: "死亡宣判 vs. 肉体之外的坚定"
        value_start: "医生发现史特利克兰的麻风病——'从镜子里就可以看出来'"
        value_end: "艾塔的誓言——'你是我的男人。你去哪儿我也去哪儿。'史特利克兰全书唯一一次流泪"
        must_include: >
          泪水出现后立刻被讥诮覆盖——'女人都是奇怪的小动物'。
          这是人性的最后闪现：即使是史特利克兰也无法在绝对忠诚面前完全冷漠。
        handoff: "逐渐失明，所有人逃离"
        beat_direction: >
          医生的客观诊断（冷静、专业）与艾塔的原始忠诚（本能、绝对）构成了两种面对死亡的方式。
          史特利克兰的泪水是全书人性的缝隙——一个裂缝，然后迅速关闭。
        source_chapter: "第55章"

  - seq_id: ARC4-SEQ3
    scenes:
      - scene_id: S15
        arc_id: ARC-4
        location: "塔希提，塔拉瓦奥山谷木屋内部"
        time: "史特利克兰死后不久"
        participants: [库特拉斯医生, 艾塔]
        pov: 叙述者（转述库特拉斯医生的叙述）
        conflict: "毁灭 vs. 不朽——创造的最终命运"
        value_start: "医生走进黑暗恶臭的屋子"
        value_end: "四面墙壁从地板到天花板覆满旷世壁画——'我的上帝，这是个天才。'史特利克兰已死，且失明将近一年"
        must_include: >
          这是全书的终极高潮。壁画的内容（混沌初开般的原始森林/伊甸园）
          是史特利克兰一生追求的视觉实现——他终于画出了内心看到的那个世界。
          而他是在看不见的情况下完成的——这意味着他画的不是眼前的世界，而是灵魂中的世界。
        handoff: "遗嘱揭示——烧毁房子"
        beat_direction: >
          场景的核心节拍：黑暗→恶臭→恍惚中以为走进原始森林→看清是壁画→震惊→
          发现史特利克兰已死→追溯失明的事实→壁画的意义被彻底重写。
          叙事上：读者和叙述者都不在现场，壁画的伟大只能通过医生的反应去感知——
          这是"有意的空白"的终极运用。
        source_chapter: "第56章"

  - seq_id: ARC4-SEQ4
    scenes:
      - scene_id: S16
        arc_id: ARC-4
        location: "塔希提 → 伦敦"
        time: "壁画发现后 → 叙述者回伦敦"
        participants: [库特拉斯医生, 艾塔, 叙述者, 艾美·史特利克兰, 罗伯特]
        pov: 叙述者
        conflict: "天才的真实遗产 vs. 世俗世界的收编"
        value_start: "壁画被烧毁——创造本身就是目的"
        value_end: >
          艾美以'天才的妻子'自居，客厅挂着复制画，家中装饰来自她丈夫艺术革命的流行色彩——
          她一无所知。史特利克兰与艾塔的儿子在南太平洋大帆船上自由地跳舞。
        must_include: >
          罗伯特引用"上帝的磨盘转得很慢，却磨得很细"——以为出自《圣经》。
          最后一个画面：南太平洋上自由的年轻人 vs. 伦敦客厅里的体面遗孀。
          月亮与六便士的终极对位。
        handoff: "全书结束"
        source_chapter: "第57—58章"

# ── 张力曲线 ──

tension_curve:
  description: >
    全书的张力曲线呈现"双峰"结构：
    第一个高峰在 ARC-2（施特洛夫悲剧，勃朗什之死），这是人际/道德层面的高潮；
    第二个高峰在 ARC-4（壁画的发现与毁灭），这是存在/艺术层面的高潮。
    两个高峰之间是 ARC-3 的低谷——流浪、反思、多角色转述——让读者喘息并思考。
    尾声（第58章）的张力不来自事件而来自反讽——世俗世界对天才的无知。
  peaks: [S03, S08, S09, S10, S14, S15]
  valleys: [S01, S12, S13]

# ── 因果链 ──

causal_chain: >
  S01（无聊的初印象）→ S02（出走震惊）→ S03（'我要画画'——因果链起点）→
  S03b（叙述者的理解尝试——癌细胞/杜鹃/涂油摔跤手三比喻）→
  S04（艾美的绝望反应——不可逆）→ [五年空白] → S05（施特洛夫崇拜天才）→
  S06（天才病重）→ S07（勃朗什被迫接纳——因为善良的道德绑架）→
  S08（勃朗什堕落——因为被迫接纳后的日夜接触）→ S09（勃朗什之死——因为被史特利克兰抛弃）→
  S10（裸体画——善良庸人被天才毁灭后仍无法否认天才）→
  S11（叙述者看画——认知转折）→ S12（亚伯拉罕故事——价值辩证）→
  S13（塔希提安宁——精神归宿）→ S14（麻风病+失明——肉体终极对抗）→
  S15（壁画——创造使命完成）→ S16（烧毁+尾声——终极蔑视与反讽）
