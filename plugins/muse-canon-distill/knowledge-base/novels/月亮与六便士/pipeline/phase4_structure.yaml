# Phase 4: 结构（逐 Arc 展开为序列）

arc_expansions:

  # ═══════════════════════════════════════════════
  # ARC-1: 出走——从体面到自由（第1—16章）
  # ═══════════════════════════════════════════════
  - arc_id: ARC-1
    sequences:
      - seq_id: ARC1-SEQ1
        name: "伦敦社交圈的表面平静"
        core_conflict: "叙述者对史特利克兰的无感 vs. 即将到来的震撼"
        escalation_direction: "从平庸的初印象递进到出走消息的爆炸"
        sequence_climax: "麦克安德鲁上校告知叙述者：史特利克兰抛妻去了巴黎（第9章）"
        closed: "伦敦体面生活的假象被打破"
        opened: "他为什么走？是另一个女人吗？"

      - seq_id: ARC1-SEQ2
        name: "巴黎追踪——期待与现实的反转"
        core_conflict: "叙述者预设的'私奔叙事' vs. 史特利克兰的真实动机"
        escalation_direction: "从'豪华酒店找情妇'的想象递进到破旧旅馆的现实"
        sequence_climax: "'我要画画。'——史特利克兰揭示出走的真正原因（第12章）"
        closed: "'另一个女人'的假设被彻底否定"
        opened: "一个四十岁的证券经纪人能成为画家吗？他是疯了还是天才？"

      - seq_id: ARC1-SEQ3
        name: "回伦敦汇报——世俗世界的反应"
        core_conflict: "史特利克兰太太的体面需求 vs. 丈夫出走的真相"
        escalation_direction: "从期待坏消息到无法接受真相"
        sequence_climax: "艾美的关键反转——'他要是为了女人我能原谅，为了理想我不能原谅'（第15章）"
        closed: "ARC-1 的核心价值逆转完成：出走不可挽回"
        opened: "史特利克兰能否真的成为画家？他的艺术追求会带来什么后果？"

    arc_progression_note: >
      ARC-1 的三个序列构成了经典的"期待—反转—余波"结构：
      SEQ1 建立期待（私奔？），SEQ2 反转（画画！），SEQ3 展示反转的余波。
      艾美的反应是全书最精妙的洞察之一——一个女人可以原谅情敌，但不能原谅理想，
      因为你可以打败女人，却打不败一个人灵魂深处的召唤。

  # ═══════════════════════════════════════════════
  # ARC-2: 巴黎——天才与庸人的碰撞（第17—39章）
  # ═══════════════════════════════════════════════
  - arc_id: ARC-2
    sequences:
      - seq_id: ARC2-SEQ1
        name: "施特洛夫——善良庸人的登场"
        core_conflict: "施特洛夫对史特利克兰天才的崇拜 vs. 妻子勃朗什的厌恶"
        escalation_direction: "从介绍施特洛夫的喜剧性格递进到他对史特利克兰天才的严肃判断"
        sequence_climax: "'他是个伟大的画家。如果一百年后还有人记得你和我，那就是因为我们认识他。'（第19章）"
        closed: "天才被一个庸人率先认出——这本身就是对'庸人'定义的挑战"
        opened: "施特洛夫会为这个崇拜付出什么代价？"

      - seq_id: ARC2-SEQ2
        name: "救治与入侵——善意的陷阱"
        core_conflict: "施特洛夫的无条件善良 vs. 勃朗什的本能恐惧"
        escalation_direction: "从史特利克兰病重到施特洛夫执意将他接入家中"
        sequence_climax: "勃朗什的预言——'他身上有一种东西让我很害怕。他会给我们带来祸害。'（第25章）"
        closed: "勃朗什被迫同意——'你自己不是也有一次被人伸出援手拉了一把吗？'（道德绑架）"
        opened: "勃朗什的恐惧到底指向什么？是对史特利克兰的还是对自己内心的？"

      - seq_id: ARC2-SEQ3
        name: "毁灭——三角关系的爆发"
        core_conflict: "施特洛夫的盲目信任 vs. 勃朗什不可抗拒的堕落"
        escalation_direction: >
          从史特利克兰霸占画室（第27章）→施特洛夫隐约察觉（第27章）→
          勃朗什公开宣布离开丈夫（第28章）
        sequence_climax: "施特洛夫跪地哀求，被史特利克兰摔倒——'你这个小丑'。施特洛夫做出惊人决定：他自己离开，把画室和钱都留给妻子和情人（第28章）"
        closed: "施特洛夫的婚姻彻底毁灭"
        opened: "勃朗什与史特利克兰的关系能持续吗？"

      - seq_id: ARC2-SEQ4
        name: "勃朗什之死——道德代价的清算"
        core_conflict: "史特利克兰对女人的彻底漠视 vs. 勃朗什的绝望"
        escalation_direction: "从勃朗什跟随史特利克兰到被抛弃到服酸自杀"
        sequence_climax: "勃朗什服草酸自杀，拒绝见施特洛夫——'不要，不要，不要'（第34章）"
        closed: "勃朗什之死标志着天才追求的道德代价被彻底揭示"
        opened: "施特洛夫如何面对？史特利克兰是否有丝毫悔意？"

      - seq_id: ARC2-SEQ5
        name: "余波——裸体画与告别"
        core_conflict: "施特洛夫的仇恨 vs. 他对艺术之美不可抗拒的敬畏"
        escalation_direction: "从施特洛夫举刀要毁掉裸体画到被画作的伟大所震慑放下手"
        sequence_climax: "施特洛夫放下刮刀，把裸体画带走——艺术的力量压倒了私人仇恨（第39章）"
        closed: "施特洛夫告别巴黎——'让我们保持沉默，安心生活在属于我们的小小角落里'"
        opened: "史特利克兰离开巴黎，他的旅程将通向何方？"

    arc_progression_note: >
      ARC-2 是全书最戏剧化的部分，冲击力远超 ARC-1。
      五个序列构成了一条清晰的毁灭链：
      善良（崇拜天才）→ 善意（救治病人）→ 入侵（天才进入家庭）→ 毁灭（婚姻爆炸）→ 死亡（勃朗什自杀）。
      施特洛夫在第39章放下刮刀的瞬间是全书最精妙的设计之一——
      善良的人被天才毁灭后，仍然无法否认天才的价值。

  # ═══════════════════════════════════════════════
  # ARC-3: 流浪——寻找归宿（第40—50章）
  # ═══════════════════════════════════════════════
  - arc_id: ARC-3
    sequences:
      - seq_id: ARC3-SEQ1
        name: "叙述者的最后审判与告别"
        core_conflict: "叙述者的道德义愤 vs. 对史特利克兰艺术的隐约敬畏"
        escalation_direction: "从叙述者拒绝来往到被史特利克兰的坦率吸引，到看画后'深深的同情'"
        sequence_climax: "叙述者第一次看史特利克兰的画——困惑但被深深震动：'我看你就像一个朝圣者永远在寻找一座可以朝拜的神庙'（第42章）"
        closed: "叙述者与史特利克兰在欧洲的最后告别——此后他们永不再见"
        opened: "他的朝圣之路通向何方？"

      - seq_id: ARC3-SEQ2
        name: "马赛的底层流浪"
        core_conflict: "赤贫 vs. 精神的绝对自由"
        escalation_direction: "从夜宿收容所排队领面包到酒馆混战到搭船离开"
        sequence_climax: "史特利克兰以死去司炉的身份搭上开往南太平洋的轮船（第47章）"
        closed: "彻底离开欧洲文明世界"
        opened: "南太平洋能给他什么？"

      - seq_id: ARC3-SEQ3
        name: "塔希提初到——精神故乡的发现"
        core_conflict: "外在的穷困潦倒 vs. 内心的'终于到家'"
        escalation_direction: "从岛上流浪到蒂娅蕾的接纳"
        sequence_climax: "'我第一次看到这个岛就知道，这就是我一生在寻找的地方。'（第50章）"
        closed: "精神归宿找到"
        opened: "他能在这里完成他的创造使命吗？"

    arc_progression_note: >
      ARC-3 是过渡性 Arc，叙事节奏明显放缓。
      毛姆在此引入多个平行故事（亚伯拉罕医生、尼柯尔斯船长、布吕诺船长），
      用来从不同角度照亮核心价值辩证：什么是真正的成功？
      叙事视角也从叙述者的直接观察转为多人转述——
      塔希提部分完全依赖第三方叙述者，主角变得更加遥远和神秘。

  # ═══════════════════════════════════════════════
  # ARC-4: 塔希提——创造与毁灭（第51—58章）
  # ═══════════════════════════════════════════════
  - arc_id: ARC-4
    sequences:
      - seq_id: ARC4-SEQ1
        name: "原始婚姻与安宁创作"
        core_conflict: "人际关系的最简化 vs. 创作的最大化"
        escalation_direction: "从蒂娅蕾做媒到三年山谷生活的田园牧歌"
        sequence_climax: "布吕诺船长探访——史特利克兰说'我会在这里一直住到我死'（第53章）"
        closed: "他找到了理想的创作条件——不被打扰的原始安宁"
        opened: "命运是否允许这种安宁持续？"

      - seq_id: ARC4-SEQ2
        name: "麻风病——肉体对创作意志的终极对抗"
        core_conflict: "腐烂的肉体 vs. 不屈的创造意志"
        escalation_direction: "从确诊麻风病→逐渐失明→所有人逃离→只剩艾塔"
        sequence_climax: "艾塔的誓言——'你去哪儿我也去哪儿。如果你离开我，我就吊死在屋后的树上。'史特利克兰全书唯一一次流泪（第55章）"
        closed: "人性的最后闪现——然后立刻被讥诮覆盖：'女人都是奇怪的小动物'"
        opened: "失明的他还能画吗？"

      - seq_id: ARC4-SEQ3
        name: "壁画——终极创造"
        core_conflict: "失明/死亡 vs. 创造使命的完成"
        escalation_direction: "从'他在墙上画'的暗示到库特拉斯医生最终走进那间屋子"
        sequence_climax: >
          医生走进黑暗恶臭的屋子，恍惚间以为走进一片原始森林——
          四面墙壁从地板到天花板覆满旷世壁画。
          "我的上帝，这是个天才。"
          史特利克兰已经死了。他的眼睛已经瞎了将近一年。
          （第56章——全书高潮）
        closed: "创造使命完成"
        opened: "这幅杰作将留存于世吗？"

      - seq_id: ARC4-SEQ4
        name: "烧毁——终极蔑视"
        core_conflict: "艺术的永恒价值 vs. 创作者对作品的绝对主权"
        escalation_direction: "从壁画的发现到遗嘱的揭示"
        sequence_climax: "艾塔信守承诺，浇上煤油点火烧毁整所房子——壁画灰飞烟灭（第57章）"
        closed: "史特利克兰的人生圆满了——他创造了一个世界，确认它是美好的，然后毁灭了它"
        opened: "尾声——世俗世界如何消化这一切？"

    arc_progression_note: >
      ARC-4 的四个序列构成了全书的终极递进：安宁→疾病→创造→毁灭。
      关键设计：壁画的存在和毁灭都是通过第三方（医生）转述的——
      叙述者和读者都没有亲眼看到壁画，只能通过医生的震惊去想象它的伟大。
      这是毛姆"有意的空白"在全书最高潮处的应用——
      天才的最高成就永远不可知，正如天才的内心永远不可知。

# ── 全篇递进关系 ──

arc_progression:
  impact_escalation: >
    ARC-1（出走）：个人层面的震动——一个男人抛弃家庭。
    ARC-2（巴黎）：人际层面的毁灭——善良的施特洛夫被摧毁，勃朗什死亡。
    ARC-3（流浪）：存在层面的探寻——什么是值得过的人生？
    ARC-4（塔希提）：超越性层面的完成与毁灭——失明中完成杰作，然后烧毁。
    冲击力从个人事件递增到存在意义的终极追问。
  causal_chain: >
    ARC-1 高潮（"我必须画画"）→ 解放了他，但技艺不成熟 →
    ARC-2 的修行与代价（施特洛夫悲剧）→ 让他认清爱情/人际关系是障碍 →
    ARC-3 的流浪（彻底离开文明世界）→ 到达塔希提找到精神归宿 →
    ARC-4 的创造（在原始环境中完成毕生杰作）→ 命令毁灭 →
    尾声：世俗世界将天才收编为客厅装饰，真正的继承者在大洋上自由活着。

# ── 多线叙事 ──

narrative_threads:
  - name: "史特利克兰的艺术之路"
    description: "主线——从伦敦证券经纪人到塔希提壁画的完成与毁灭"
    primary_arcs: [ARC-1, ARC-2, ARC-3, ARC-4]

  - name: "叙述者的认知之旅"
    description: "暗线——叙述者对人性、艺术、道德的理解如何被史特利克兰的存在所改变"
    presence: "贯穿全书，但以议论/反思段落呈现，非独立情节线"

  - name: "世俗世界的对照"
    description: >
      通过多个平行角色（艾美的体面生存、施特洛夫的善良毁灭、
      亚伯拉罕医生的平静选择、布吕诺船长的建设性美）
      构建对核心价值辩证的多角度回应
    presence: "间歇出现，分布于各 Arc"
