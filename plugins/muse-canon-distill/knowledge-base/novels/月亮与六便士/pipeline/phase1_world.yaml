setting:
  era: "19世纪末至20世纪初（约1897年—1910年代），维多利亚-爱德华时代的英国与法国第三共和国时期"
  duration: "约15—20年（从叙述者初识史特利克兰到其死后叙述者重访伦敦）"
  location: "伦敦（中产阶级社交圈）→ 巴黎（波希米亚艺术区/蒙马特）→ 马赛（流浪底层）→ 塔希提岛（南太平洋殖民地）"
  conflict_levels:
    internal: >
      创作欲望 vs. 人性：史特利克兰内心被不可抗拒的创作冲动控制，
      这股力量要求他抛弃一切人际纽带——妻子、孩子、朋友、道德义务——
      他的内在冲突不在于"要不要画"（从无犹豫），而在于创作本身的挣扎：
      他看到了某种东西但无法表达，"像一个朝圣者永远在寻找一座可能不存在的神庙"。
    personal: >
      艺术家的绝对自我与周围人的情感需求之间的碰撞：
      妻子艾美要求忠诚与回归，施特洛夫给予无条件的善意却被践踏，
      勃朗什被原始吸引力摧毁，艾塔以原始的忠诚填补了所有人无法承受的位置。
    external: >
      维多利亚时代中产阶级社会的体面规范（名声、责任、良知）
      与艺术家对这一切的彻底蔑视之间的结构性对抗。
      史特利克兰不反叛社会——他根本不在乎社会的存在。

world_rules:
  physical:
    - "伦敦：工业化都市，中产阶级生活物质充裕但精神死气沉沉——'有轨电车沿着轨道从起点站到终点站往返行驶'"
    - "巴黎蒙马特：破旧旅馆、廉价餐馆、咖啡馆，波希米亚艺术家的贫困是真实的——没有暖气、没有干净衣服、高烧时无人照料"
    - "马赛：底层流浪社会，夜宿收容所排队领面包和稀汤，水手酒馆里随时可能发生斗殴"
    - "塔希提：热带原始环境，椰子和香蕉触手可得，不需要金钱也能生存——物质匮乏的代价被自然的丰饶抵消"
  social:
    - "伦敦中产阶级社会对'体面'的绝对要求：一个男人抛妻弃子，唯一可以被理解的原因是另一个女人——为了理想离开反而不可原谅"
    - "'良知是社会植入个人心中的暗探'——叙述者的核心哲学论断，揭示社会控制机制"
    - "巴黎艺术社区的潜规则：才华被承认需要时间，但商业价值由市场（画商/收藏家）裁定，不由才华决定"
    - "塔希提殖民地社会：欧洲人与原住民之间存在但松散的等级秩序，白人可以娶土著女人而不被过分非议"
  psychological:
    - "世俗之人渴望得到别人的认同是'文明人类最根深蒂固的一种天性'——这条规则适用于几乎所有角色，唯独史特利克兰例外"
    - "女性的自我价值建立在社会认同之上：艾美在乎流言甚于丈夫出走本身，甚至编造'舞蹈演员私奔'故事来维护面子"
    - "天才的创作驱力如同魔鬼附体——不受意志控制，也不可被道德约束"
    - "善良如果没有力量保护自己就会被践踏——施特洛夫的命运法则"
    - "原始社会中的爱更接近本能：艾塔的忠诚不基于理解或道德，而是基于归属（'你是我的男人'）"

genre_conventions:
  primary_genre: 艺术家小说（Künstlerroman）
  secondary_genre: 人物传记体小说
  conventions:
    - convention: "天才艺术家生前不被理解、死后成名"
      planned_subversion: >
        毛姆将这一惯例推到极端——史特利克兰不仅不被理解，他自己也不在乎被理解；
        更重要的是他命令毁掉自己最伟大的作品，彻底否定了"留名后世"的意义。
        他不是悲剧性地被忽视，而是主动地蔑视世界对他的评判。
    - convention: "艺术家与资产阶级社会的对抗"
      planned_subversion: >
        史特利克兰不"对抗"社会——他根本不承认社会的存在。
        他不是愤怒的反叛者（如波德莱尔），而是冷漠的超越者。
        对他而言，社会规范不值得反对，只是不相干。
    - convention: "叙述者崇拜天才并试图理解天才"
      planned_subversion: >
        叙述者反复承认自己不理解史特利克兰，且坦言掺杂了个人偏见。
        他既被天才震撼，又对天才的冷酷感到愤怒，立场始终摇摆。
        读者被迫在叙述者的不确定中自行判断——这是有意的认知空白。
    - convention: "美丽的异域（南太平洋）作为艺术家的精神归宿"
      planned_subversion: >
        塔希提确实给了史特利克兰精神的安宁，但这种安宁的结局是麻风病、失明和死亡。
        毛姆拒绝将"回归原始"浪漫化——原始的代价同样残酷。

daily_life:
  - dimension: "伦敦中产阶级社交"
    findings:
      - detail: "艾美·史特利克兰定期举办文学沙龙，招待作家和艺术家，以此提升社会地位"
        story_implication: "建立了史特利克兰'体面生活'的基线，使他的出走更加震撼"
      - detail: "查理每周三四个晚上'去俱乐部打桥牌'——实际上在夜校学画"
        story_implication: "说谎不是出于愧疚，而是'不想让她知道'——他的秘密生活在出走前就已存在"
  - dimension: "巴黎波希米亚画家生活"
    findings:
      - detail: "克里希大道咖啡馆是画家们的固定社交场所，下棋、喝苦艾酒"
        story_implication: "史特利克兰五年后仍在同一家咖啡馆——他对外部世界毫无兴趣"
      - detail: "画家之间的经济互助：借钱、推荐画商、收留生病的同行"
        story_implication: "施特洛夫的善良在这个环境中显得既合理又过度——他是互助文化的极端版本"
  - dimension: "塔希提殖民地日常"
    findings:
      - detail: "欧洲人在岛上可以靠极少的钱生活——椰子干可以换取一切生活必需品"
        story_implication: "消除了经济压力，让史特利克兰可以完全投入创作——物质极简是精神自由的物质条件"
      - detail: "蒂娅蕾旅馆是各色流浪者的集散地——尼柯尔斯船长、画家、水手"
        story_implication: "塔希提接纳一切不被文明社会接受的人——这是史特利克兰的归宿而非伦敦"

creative_constraints:
  - constraint: "第一人称旁观者叙事——叙述者不能进入主角内心"
    narrative_function: >
      这是毛姆最核心的叙事限制：天才的内心永远是不可知的。
      读者像叙述者一样只能从外部行为去猜测——这种结构性无知产生了持久的张力，
      也避免了将天才内心庸俗化的风险。
  - constraint: "多段时间跳跃——叙述者与主角多年不见，信息靠转述拼凑"
    narrative_function: >
      时间空白让不同证人（施特洛夫、尼柯尔斯、蒂娅蕾、库特拉斯医生、布吕诺船长）
      各自讲述史特利克兰生命的不同片段——拼贴式叙事既增加了真实感，也保持了主角的神秘性。
  - constraint: "叙述者的自我意识——他反复承认自己的偏见和局限"
    narrative_function: >
      通过让叙述者'不可靠'（承认自己可能误判），毛姆反而增强了叙事的可信度——
      一个声称完全理解天才的叙述者反而不可信。
