# Phase 2: 人物系统 — 《三体Ⅰ·地球往事》逆向分析
# 系统级设计图。个体档案见 characters/*.md
# 本文件只记角色之间的关系，不记个体画像（声音、弧光、欲望等见 md）

cast_overview:
  protagonist:
    structure: dual
    # 汪淼 = 现在时视角，读者经由他进入故事
    # 叶文洁 = 过去时因果源头，读者经由闪回理解"为什么"
    # 两线在第22章交汇（叶文洁在汪淼面前现身为统帅）
    names:
      - name: 叶文洁
        role: 因果源头——她的选择链从文革创伤延伸到宇宙尺度
      - name: 汪淼
        role: 读者入口——通过他的恐惧和发现经历全书情感旅程

  antagonist:
    layers:
      - level: 文明级
        name: 三体文明
        relationship: 生存竞争——入侵动机是生存需要而非恶意，与叶文洁的绝望形成结构对称
      - level: 组织级
        name: 地球三体组织（ETO）
        relationship: 内部分裂（降临派/拯救派/幸存派），组织本身源于人类文明对自身成员的伤害
      - level: 个体级
        name: 叶文洁（隐性对手）
        relationship: 以汪淼视角看，她是一切恐惧的根源；第22章前是友善长者

  supporting_cast:
    - name: 史强（大史）
      function: 锚点人物 + 主控思想载体，两次将汪淼从崩溃中拉回
    - name: 丁仪
      function: 科学危机的代言人，将抽象危机翻译为可感知的恐惧
    - name: 常伟思
      function: 军方线决策者，推动汪淼介入调查的直接力量
    - name: 杨冬
      function: "缺席的在场"——近因触发器，自杀和遗书引发科学家自杀潮
    - name: 1379号监听员
      function: "三体世界的叶文洁"——结构对称，方向相反的选择

contrast_axes:
  central_question: 面对"人类可能是虫子"这一事实时，不同角色如何回应？
  responses:
    叶文洁: 提前几十年得出结论并据此行动（引入外星力量）
    伊文斯: 走得更远——人类不配存在
    丁仪/汪淼: 得知真相瞬间崩溃（最怕的不是虫子身份而是科学终结）
    史强: 接受虫子身份但从中提取希望
    1379号监听员: 从三体视角验证"虫子也值得被拯救"
  design_insight: 每种回应都合理，没有一个可以被简单否定

relationships:
  power_dynamics: >
    军方（常伟思）→ 大史 → 汪淼：层层指派的调查链。
    叶文洁 → ETO → 三体文明：信仰链，但伊文斯实际截留了通讯权。
    三体文明 → 智子 → 人类科学界：单向技术压制。
  key_tensions:
    - 叶文洁 vs 伊文斯：同一组织内拯救派与降临派的路线斗争
    - 汪淼 vs 叶文洁：调查者与被调查者，但真相揭示前关系是友善的
    - 大史 vs 所有科学家：认知方式的根本对立（直觉 vs 理性）
    - 1379号监听员 vs 叶文洁：结构对称的两个叛徒，善意方向相反
  potential_shifts:
    - 叶文洁的统帅身份在第22章揭示，从友善长者变为隐性对手
    - 大史从被汪淼反感的粗人变为精神支柱（第11章 + 第35章）
