# Phase 3: 脊椎 — 《三体Ⅰ·地球往事》逆向分析
#
# 说明：本书有双主角双脊椎结构：
#   汪淼线 = 读者跟随的现在时叙事脊椎（调查悬疑）
#   叶文洁线 = 闪回中逐步揭示的深层脊椎（创伤→背叛→后果）
# 以下以汪淼线为主脊椎分析，叶文洁线作为深层脊椎对照。

inciting_incident:
  description: >
    汪淼在自己拍摄的每一张照片上发现幽灵倒计时（从1200小时开始），
    且证实这组数字只针对他本人——妻子和儿子用同一台相机拍摄则不会出现。
    随后倒计时侵入他的视觉（睁眼闭眼都能看到）。
    他向申玉菲求助，对方只说"把纳米研究停下来"，当他停机后倒计时消失；
    但他决定重启，申玉菲警告："整个宇宙将为你闪烁。"（第3章）
  type: accident
  # 对汪淼而言是意外——他并非主动卷入，而是被"选中"作为恐吓对象
  timing: "第3章，约故事进程 8%"
  balance_before: >
    汪淼是成功的纳米材料学家，生活稳定，最大烦恼是周末拍摄的构图。
    物理学的世界秩序井然，科学信念完好无损。
  balance_after: >
    汪淼的现实被超自然力量入侵——拍照、视觉、甚至宇宙背景辐射
    都不再可信。科学理性无法解释眼前的一切。
    他被拖入了一场他不理解的博弈。
  impact_on_protagonist: >
    科学家的核心身份认同（理性、可验证、可解释）被动摇。
    从第3章起汪淼不再是旁观者而是被直接针对的目标，
    恐惧成为推动他行动的驱动力。

  # 叶文洁线的深层激励事件
  deep_inciting_incident:
    description: >
      叶哲泰在批斗会上被红卫兵活活打死，妻子绍琳被迫上台揭发，
      叶文洁在台下亲眼目睹父亲惨死。（第7章）
    type: accident
    timing: "第7章闪回，叶文洁线的起点"
    balance_before: 叶文洁是物理学教授的女儿，生活在学术家庭中
    balance_after: >
      信任的根基被彻底摧毁——父亲被杀、母亲背叛、
      随后的每一次人际接触（白沐霖出卖、程丽华欺骗、无人忏悔）
      都在加固"人类之恶不可自救"的信念
    impact_on_protagonist: >
      这一创伤链最终导致叶文洁在第24章做出
      "人类文明的命运系于纤细两指之上"的抉择——
      按下发射键，邀请三体文明入侵地球

desire_object:
  conscious: >
    【汪淼】查明谁在恐吓科学家、制造超自然现象，
    发现幽灵倒计时和宇宙闪烁背后的真相
  unconscious: >
    【汪淼】恢复对科学和宇宙秩序的信念——
    证明物理学是可信的、世界是可理解的
  tension: >
    调查越深入，真相越令人绝望：
    不仅有人在搞鬼（ETO组织），而且搞鬼的手段来自一个远超人类的外星文明，
    最终发现科学本身已被智子锁死——汪淼追求真相的结果
    恰恰摧毁了他"恢复科学信念"的深层需要。
    希望的回归不来自科学验证，而来自一个非科学的比喻（"虫子"）。

spine_statement: >
  纳米学家汪淼在调查科学界怪象的过程中，
  层层揭开一个从文革创伤延伸到宇宙深处的文明阴谋，
  最终面对人类科学被锁死的绝望真相，
  在"虫子从未被真正战胜过"的启示中重建存续意志。

spine_type: conscious
# 汪淼的调查（意识层的求索）驱动全书情节推进

dramatic_question:
  question: >
    面对一个技术远超人类的外星文明的入侵
    和基础科学被彻底锁死的事实，
    人类文明是否还有存续的希望？
  obligatory_scene: >
    智子封锁的全部真相必须被揭示（第34章），
    主角必须直面"一切都完了"的绝望（第35章前半），
    然后在绝望的最深处找到或未能找到希望——
    这个回答就是全书的主控思想。

opposing_forces:
  internal: >
    汪淼的科学理性与超自然体验的冲突——
    他的世界观在每次揭示中都被进一步粉碎
    （台球实验→幽灵倒计时→宇宙闪烁→智子封锁）
  personal: >
    ETO组织（尤其降临派）对调查的阻挠，
    申玉菲的暧昧引导，潘寒的极端行为，
    叶文洁作为最高统帅的身份反转
  external: >
    三体文明的智子——全知全能的监控与干扰，
    以十分之一光速逼近的三体舰队，
    450年的倒计时

# ── 幕/Arc 框架（从高潮回溯：故事需要几个重大逆转？）──

arcs:
  - arc_id: ARC-1
    name: "科学恐吓"
    value_at_start: "科学信念完好，世界秩序井然"
    value_at_end: "科学信念严重动摇，但确认存在一个可追踪的敌人"
    climax_event: "宇宙背景辐射闪烁被多源证实，汪淼亲眼目睹（第10章）"
    function_note: "establishing — 将主角从日常拉入冲突，建立恐惧基调"

  - arc_id: ARC-2
    name: "三体世界揭示"
    value_at_start: "三体只是一个奇怪的VR游戏"
    value_at_end: "三体世界真实存在，其舰队正飞向地球，且有人类在为其效力"
    climax_event: "三体游戏终章：舰队启航远征太阳系，邀请加入ETO（第21章）"
    function_note: "escalating — 从个人恐惧升级到宇宙级发现"

  - arc_id: ARC-3
    name: "叶文洁的真相"
    value_at_start: "谁在背后操控一切？——敌人身份不明"
    value_at_end: "一切根源是一个被文明深深伤害的杰出女性的抉择"
    climax_event: "叶文洁收到'不要回答'警告后毫不犹豫按下发射键（第24章）"
    function_note: "climactic — 全书最具冲击力的单一动作，揭示一切的因"

  - arc_id: ARC-4
    name: "人类的困境"
    value_at_start: "两个质子是什么？有什么意义？"
    value_at_end: "科学被锁死、入侵不可避免——但人类选择继续抗争"
    climax_event: "大史带汪淼和丁仪看蝗灾：'虫子从未被真正战胜过'（第35章）"
    function_note: "climactic — 全书终极高潮：从绝望深渊中提取希望"

# ── 全篇高潮设计 ──

story_climax_design:
  crisis:
    dilemma: >
      智子已锁死人类基础科学，三体舰队450年后到达，
      技术差距不可弥合——是接受"虫子"的宿命放弃抗争，
      还是在看不到希望的情况下继续工作？
    option_a: 接受宿命——人类科技被锁死，450年后必然灭亡，抗争无意义
    option_b: 继续抗争——即使是虫子，也要活下去
    character_revelation: >
      选择继续抗争的不是最聪明的科学家（他们先崩溃），
      而是最朴素的人（大史）。
      存续意志不依赖于理性计算，而根植于生命本能的倔强。
  climax:
    action: >
      大史带汪淼和丁仪到华北平原看蝗虫——
      "虫子从未被真正战胜过。"
      两位科学家将酒洒在大地上敬虫子，决定回去继续工作。
    value_change:
      from: "绝望/放弃（'一切都无所谓了'、'末日万岁'）"
      to: "卑微但坚定的希望（'我们快回去吧，有好多工作要做呢'）"
    controlling_idea_expression: >
      存续希望不取决于技术等级（人类远不如三体文明），
      而在于"从未被真正战胜过"的倔强意志。
      最反讽的是：这个洞见来自一个刑警，不是科学家。
  resolution:
    new_balance: >
      人类已知三体入侵不可避免、科学被锁死，
      但选择继续抗争而非放弃。
      叶文洁——一切的起因——在红岸遗址说出"这是人类的落日"后死去，
      形成悲剧性的闭环。
      全书结束于一种"张弓"状态：箭已在弦上，但人类尚未射出。
    lingering_feeling: >
      卑微但坚韧的希望，伴随着深沉的悲哀。
      "这是人类的落日"与"虫子从未被真正战胜过"
      两句话的张力将长久回荡——
      它们不矛盾，它们是同一枚硬币的两面：
      落日确实在沉没，但夜行的虫子不需要太阳。
