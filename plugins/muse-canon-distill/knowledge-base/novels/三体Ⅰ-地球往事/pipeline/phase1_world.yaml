# Phase 1: 世界构建 — 《三体Ⅰ·地球往事》逆向分析

setting:
  era: >
    双重时代：
    1) 历史线 — 1967年文革至1980年代末（红岸基地时期）
    2) 现代线 — 约2007年前后的当代中国
    3) 三体线 — 无明确纪年，跨越200余轮文明兴灭
  duration: >
    故事实际跨度约40年（叶文洁线1967→2007）。
    若含三体世界历史，则跨越数千至数万年。
    三体舰队到达太阳系还需约450年（未来线索，指向续集）。
  location:
    - 北京及周边（汪淼的日常、作战中心、叶文洁晚年住所）
    - 大兴安岭雷达峰（红岸基地，历史线核心场所）
    - 内蒙古建设兵团（叶文洁被迫害的经历）
    - 密云射电天文基地（宇宙闪烁验证）
    - 河北华北平原（"虫子"场景）
    - 巴拿马运河（古筝行动）
    - 大西洋（"审判日"号 / 第二红岸基地）
    - 三体世界 / 半人马座三星系统（VR游戏叙事 + 第33-34章直接描写）
  conflict_levels:
    internal: >
      叶文洁：对人类的绝望 vs 科学家身份的理性残余，
      最终绝望压倒理性（第24章发出邀请）。
      汪淼：科学信念被动摇的恐惧 → 智子封锁后的崩溃 → 被"虫子"启示重建信念。
      丁仪：物理学家面对"物理学不存在"的存在性危机。
    personal: >
      叶文洁 vs 伤害她的每一个人（红卫兵、白沐霖、程丽华、母亲绍琳）——
      这些创伤累积为对整个人类文明的否定。
      降临派 vs 拯救派的内斗（申玉菲之死、潘寒被处决）。
      叶文洁 vs 伊文斯：同志→失控，"我点燃了火，却控制不了它"。
    external: >
      人类文明 vs 三体文明（终极尺度：两个文明的生存博弈）。
      军方/政府 vs 地球三体组织（现代线的直接冲突）。
      三体文明内部的生存危机（三体运动不可解，驱动星际移民）。

world_rules:
  universe_axioms:  # 宇宙公理层——本部揭示的基础规则，不越界预告续集
    - >
      十一维微观结构：宇宙的微观尺度存在11个维度（3个宏观 + 8个微观），
      基本粒子内部的微观空间如"活性炭"般拥有巨大的内部面积。
      高级文明可操控这些额外维度——将质子在维度间展开和折叠。
      这是三部曲中"物理规律可被操控/武器化"的理论根基。
      （第31章丁仪的活性炭比喻首次揭示；第34章三体文明实际操控）
    - >
      光速为宇宙速度上限：一切物质和信息的传播速度不可超越光速。
      这是三体舰队需要450年航程的根本约束，
      也是四光年通讯延迟（单程约4年，往返约8年）的物理基础。
      （本部作为隐含公理；至第三部将被揭示为可武器化的对象）
    - >
      宇宙社会学两条公理（本部末尾提出，尚未证明）：
      叶文洁在生命最后时刻对罗辑提出——
      公理一：生存是文明的第一需要。
      公理二：文明不断增长和扩张，但宇宙中的物质总量保持不变。
      这两条公理是整个三部曲世界观的基石，
      黑暗森林法则的理论源头。在第二部中被完整证明。
  physical:  # 故事机制层——本部的具体设定
    - >
      太阳能量镜面：太阳辐射层中存在能量界面，可将接收到的电波
      放大近亿倍再发射——使地球具备恒星级功率的对外通讯能力。
      （第23章，叶文洁发现；这是一切的起点）
    - >
      三体运动不可解：半人马座三星系统中三颗恒星的运动
      从数学上被证明不可预测（第20章），三体世界的文明
      在无规律的恒纪元/乱纪元交替中反复毁灭重建200余次。
    - >
      智子制造机制（公理层"11维结构"的应用）：三体文明利用微观维度的
      可操控性，将质子在二维层面展开为一个巨大的平面，
      在其上蚀刻超级智能电路，再重新折叠回微观尺度，
      制造出"智子"——一台质子大小的超级计算机（第34章）。
    - >
      智子的能力：以光速飞行，可实时监控地球，
      干扰所有高能粒子加速器的实验结果（使每次结果随机化），
      从而锁死人类的基础物理研究（第34章）。
    - >
      星际航行限制（受公理层"光速上限"约束）：三体舰队最高速度
      为光速十分之一，需间断收集反物质加速，
      全程约450年（第31章叶文洁供述）。
  social:
    - >
      文革体制：知识分子遭系统性迫害，批斗致死、亲人被迫揭发、
      告密与出卖是常态。政治运动扭曲一切人际关系，
      信任被彻底摧毁（第7-8章）。
    - >
      军事科研封闭体制：红岸基地为最高密级项目，
      进入即意味着终身隔离，内部有严格的等级和保密条例，
      政委（雷志成）与技术主管（杨卫宁）形成双头权力结构（第9-15章）。
    - >
      地球三体组织的三派分裂：
      降临派——仇恨人类，希望三体文明彻底消灭人类（伊文斯为首）；
      拯救派——崇拜三体文明为神，希望在拯救中两全（申玉菲等）；
      幸存派——只求在三体入侵中让自己的后代存活（第30章）。
    - >
      ETO通讯架构：伊文斯在"审判日"号巨轮上建立"第二红岸基地"，
      作为三体-地球通讯的中继站，截留并筛选三体文明发来的信息
      （降临派由此掌控了信息垄断权，连叶文洁都被排除在外）。
      智子对地球实施实时单向监控——三体文明可以看到地球上的一切，
      但无法读取人类大脑内部的思维（第34章）。
      古筝行动的核心目标正是切割"审判日"号以获取通讯记录（第32章）。
    - >
      科学边界学会：三体信仰在学术界的投射，
      以学术组织面目存在的ETO外围组织。通过"射手与农场主"
      等哲学命题传播科学虚无主义，动摇科学家的基础信念。
      潘寒为其在公共舆论中的代言人（第4-5章）。
    - >
      国际合作：古筝行动涉及中美等多国军方协作（第32章），
      面对文明级威胁的合作雏形。
  psychological:
    - >
      创伤外溢机制：个体被文明深深伤害后，
      绝望可外化为对整个文明的否定和背叛。
      叶文洁的逻辑链：父亲被杀→被出卖→无人忏悔→
      "人类之恶不可自救，只有借助外部力量"（第8章核心信念）。
    - >
      科学信仰崩塌：当物理学根基被动摇（加速器实验无规律），
      以科学为信仰的知识分子陷入存在性危机，
      可导致自杀（杨冬等）或精神崩溃（汪淼在第10章）。
    - >
      技术崇拜与宗教化：面对远超自身的技术文明，
      人类自然产生宗教性崇拜（拯救派将三体文明神化）。
      "虫子"心理：被维度碾压后的自我否定。
    - >
      "虫子"悖论：承认自己是"虫子"既是绝望的深渊，
      也可以是希望的起点——虫子从未被真正战胜过（第35章）。

genre_conventions:
  primary_genre: 硬科幻（Hard SF）
  secondary_genre: 社会科幻 + 历史小说 + 悬疑
  conventions:
    - convention: >
        硬科幻惯例：科学/技术是解决问题的核心手段
      planned_subversion: >
        科学本身被智子锁死，最终的希望不来自科学突破，
        而来自一个不懂科学的刑警的直觉比喻（"虫子"）。
        物理学家是最绝望的人，警察是最乐观的人。
    - convention: >
        第一次接触惯例：由政府/科研机构主导的有组织探索
      planned_subversion: >
        接触由一个被自己文明伤害的个体私自发起，
        动机不是好奇或探索而是对人类的绝望。
        红岸基地确实是官方项目，但真正的"第一次回复"
        是叶文洁的个人行为。
    - convention: >
        外星入侵惯例：外来威胁使人类团结一致
      planned_subversion: >
        人类内部先行分裂为三派，降临派主动为敌人打开大门。
        "敌人"不仅在外部，更在内部——叶文洁本人就是地球三体运动的最高统帅。
    - convention: >
        中国当代小说惯例：文革作为反思性背景或伤痕叙事
      planned_subversion: >
        文革创伤不止于历史反思，而是直接催生了文明级后果——
        一个人的创伤经历改变了全人类的命运。
        "在光年尺度上重新演绎中国现代史"（作者自述）。

daily_life:
  - dimension: 红岸基地的封闭生活
    findings:
      - detail: >
          基地位于大兴安岭雷达峰顶，巨型抛物面天线在风中发出浑厚嗡嗡声，
          白色建筑群"像几块精致的积木"（第9章）
        story_implication: >
          封闭、孤立的环境为叶文洁的极端思想提供了滋生空间，
          也使她的秘密行为（发射电波、杀人灭口）成为可能。
  - dimension: 三体世界的文明循环
    findings:
      - detail: >
          恒纪元中文明发展，乱纪元中"脱水"保存自我（VR游戏中的场景），
          200余轮文明反复毁灭重建（第4/12/16/18/20章）
        story_implication: >
          三体文明的生存焦虑是其入侵动机的根本来源——
          不是恶意，而是绝望。与叶文洁的绝望形成结构性对称。
  - dimension: 当代科研界的日常
    findings:
      - detail: >
          汪淼的纳米实验室、丁仪的台球桌客厅、
          密云射电天文基地的学生研究员（沙瑞山），
          科学家们日常生活中充满专业术语和实验细节
        story_implication: >
          为"幽灵倒计时"和"宇宙闪烁"等超自然现象入侵日常
          提供了可信的现实主义基底。

creative_constraints:
  - constraint: 四光年通讯延迟（单程约4年，往返约8年）
    narrative_function: >
      使人类与三体文明无法实时互动，增加信息不对称的张力。
      叶文洁发出信号后等了8年才收到回复——
      这段漫长等待使整个事件具有不可逆的宿命感。
  - constraint: 智子封锁——人类基础科学被锁死
    narrative_function: >
      创造了最深层的绝望源：不是打不过，而是永远无法进步。
      同时为续集留出了叙事空间（人类如何在锁死中寻找突破）。
  - constraint: 三体舰队450年后到达
    narrative_function: >
      提供了足够的时间跨度容纳续集叙事，
      同时使当下的一切行动都具有"为后代而战"的宏大感。
  - constraint: 文革历史设定——真实历史事件的约束
    narrative_function: >
      赋予叶文洁的动机以无可辩驳的真实性和重量。
      读者不需要想象"为什么她会这样做"——历史本身就是答案。
