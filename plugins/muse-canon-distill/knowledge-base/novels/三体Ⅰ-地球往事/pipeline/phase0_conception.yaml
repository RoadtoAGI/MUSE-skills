# Phase 0: 构想 — 《三体Ⅰ·地球往事》逆向分析

premise: >
  如果人类文明内部的疯狂与偏执异化出一股力量，
  使一个被自己文明深深伤害的科学家向宇宙发出了邀请，
  而回应者是一个自身也在挣扎求存的外星文明——将会发生什么？

core_value:
  positive: 忠诚/希望（对人类文明的信念与存续意志）
  negative: 背叛/绝望（对人类文明的彻底否定与出卖）
  spectrum:
    # 四层价值光谱（从正到负：正面 → 矛盾 → 相反 → 否定之否定）
    contradictory: >
      冷漠——对文明命运既不忠诚也不背叛的旁观态度
      （体现：幸存派只求自身存活，不关心文明整体命运）
    contrary: >
      天真乐观——未经考验的、不知道威胁存在的盲目信念
      （体现：故事开始前汪淼等科学家的日常状态）
    negation_of_negation: >
      以拯救之名行背叛——叶文洁认为引入外星力量是"拯救"人类脱离自身之恶的唯一途径，
      实则将文明推向毁灭深渊。这是最黑暗的形式：背叛者真诚地相信自己在行善。
      （体现：第24章叶文洁发出邀请，第27章"无人忏悔"坚定其信念）

controlling_idea:
  value: 存续的希望
  cause: >
    生命的韧性从不取决于技术等级的高低，
    而在于"从未被真正战胜过"的倔强意志
  full_statement: >
    即便面对维度碾压的文明入侵和被锁死的科学前沿，
    存续的希望仍然存在——因为生命的韧性从不取决于技术等级，
    而在于拒绝被消灭的倔强意志。
  type: ironic
  # 反讽性说明：
  # - 希望的源泉恰恰是承认自己是"虫子"这一最深的贬低
  # - 最朴素的希望来自最"不科学"的人（大史），最深邃的绝望来自最聪慧的头脑（叶文洁/丁仪）
  # - 全书以"希望"的高潮收束（第35章），却以"落日"的余韵结尾（第36章）
  # - 作者自述"这是一个关于背叛的故事"，但结局却指向被背叛者的韧性

genre:
  primary: 硬科幻（Hard SF）
  secondary: 社会科幻 + 悬疑/解谜
  conventions:
    - setting: >
        近未来/当代地球 + 外星文明（三体世界），
        现实主义基底上的宇宙尺度冲突
    - characters: >
        科学家主角、军方盟友、理想主义叛徒、外星对手，
        关键角色均为知识分子或军人
    - events: >
        第一次接触、科技危机、文明冲突、
        组织渗透与揭秘、军事行动
    - values: >
        科学探索 vs 生存威胁、
        文明忠诚 vs 个体绝望、
        技术理性 vs 道德拷问

originality_statement:
  unique_angle: >
    "第一次接触"不是由官方探索计划发起，而是由一个被自己文明深深伤害的个体
    出于对人类的绝望主动发出邀请。这颠覆了"第一次接触"叙事的基本预设：
    威胁不是来自外部入侵，而是源于文明内部的创伤外溢。
    刘慈欣在后记中明确指出：初衷是探讨"零道德的文明宇宙中，
    有道德的人类文明如何生存"。
  cliches_to_avoid:
    - 外星文明作为慈祥导师的俗套（后记中明确批判80年代中国科幻的这一倾向）
    - 首次接触的乐观叙事（接触动机本身就是人类的自我否定）
    - 人类团结一致对外的简单叙事（人类内部分裂为三派，彼此矛盾深于与外星的冲突）
    - 科学万能论（科学本身被锁死，希望最终来自非科学的直觉）

style_directives:
  - 零度叙事：重大事件（叶文洁发出邀请、杀夫灭口）以极度冷静的笔触呈现，情感通过事实本身传递
  - 多时间线交织：当代调查线 + 文革/红岸历史线 + 三体世界线，三线互为注脚
  - VR游戏嵌套叙事：用中西方历史寓言（周文王/墨子/哥白尼/牛顿/爱因斯坦）逐步揭示三体世界真相
  - 科学叙事与人文反思交织：硬科幻概念（三体运动、智子、纳米材料）与文革创伤、道德拷问并行不悖
  - 悬疑→揭秘的叙事弧：前半部为科幻悬疑（"谁在恐吓科学家"），后半部为历史揭秘（"叶文洁为什么这么做"）

word_count: 约190000

# ── 作者自述参考（序言 + 后记）──
# "这是一个关于背叛的故事，也是一个生存与死亡的故事，
#  有时候，比起生存还是死亡来，忠诚与背叛可能更是一个问题。"
# "疯狂与偏执，最终将在人类文明的内部异化出怎样的力量？
#  冷酷的星空将如何拷问心中道德？"
# "我认为零道德的文明宇宙完全可能存在，
#  有道德的人类文明如何在这样一个宇宙中生存？
#  这就是我写《地球往事》的初衷。"
