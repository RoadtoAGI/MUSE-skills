tenor: 智子知识库完整掌握真空和空间结构，可精确利用其中能量与航行规律
vehicle: 人低头看自己的手掌，掌纹、关节和每处细节都熟悉到无需探查
ground: 空间规律全面可知对应掌纹一览；调用知识迅速对应熟悉自己的手；细节没有陌生处
