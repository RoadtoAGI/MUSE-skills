tenor: 魏成认为人类面临的危机已没有任何更高或更基础力量能够回应援救
vehicle: 受困者同时向天空和大地呼救，两方都沉默无答
ground: 人类向所有可能权威求助对应对天地两端呼喊；没有力量能解决对应上下两方都不回应
