tenor: 恒星外围气态层按长周期反复扩大和缩小体积
vehicle: 生命体胸腔或肺部吸气鼓起、呼气回缩的循环
ground: 气层体积周期增减对应肺部吸气膨胀与呼气收缩；循环长期重复对应呼吸节律持续
