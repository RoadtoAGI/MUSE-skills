transfer_rule: 把时间艺术转为空间建造时，应让局部增加、整体闭合和结束节点逐一同步，不只说音乐像建筑。
failure_boundary: 即兴无累积结构、循环无终点或强调音色而非构成的音乐，不适合“搭完房子”的线性完成过程。
