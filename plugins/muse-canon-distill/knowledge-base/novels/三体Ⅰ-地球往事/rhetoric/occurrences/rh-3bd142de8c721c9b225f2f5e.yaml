tenor: 《三体》用于识别并召集对人类和三体文明持相近价值立场的人
vehicle: 怀有同一志向、沿同一条道路向同一目的地行进的旅伴汇合
ground: 共同价值目标对应相同志向；实现目标的方法立场一致对应走同一路径；游戏招募对应把分散行者召到一起
