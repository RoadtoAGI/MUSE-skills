quote: 她们当年那魔鬼般的精神力量显然已荡然无存
sensory_mapping: 恶魔面孔；黑暗威压；非人力量；恐惧寒意；力量消散
context_fact: 三名女人穿旧军装试图重现当年尊严，但身体残缺、贫困且精神已经衰败。
image_mechanism: 当年政治狂热像恶魔附体，使少女身体拥有超出个人的残酷力量；时代退潮后附体者离开，只剩衰老受损的普通人。
property_alignment: 政治狂热对应魔鬼附体；群体暴力对应恶魔力量；杀害教授对应非人残酷；当年尊严对应威压幻象；今日衰败对应力量离体；荡然无存对应驱魔后空壳
context_alignment: 同一批人既曾携魔鬼力量又成为受害者，喻体将力量来源指向时代附体，而不抹去她们亲手施暴。
narrative_function: 量化今昔反差，削弱叶文洁预期中的审判结构并增加伦理复杂度。
transfer_rule: 用魔鬼般写群体狂热时，应落到具体非人化行为、恐惧效果、力量来源和后来是否退去。
failure_boundary: 若人物暴力出于冷静私利且始终保持同等权力，附体后消散的魔鬼模型会转移个人责任。
