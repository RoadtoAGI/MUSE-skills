tenor: 申玉菲枪伤大量失血在地板积成并向门外扩散的液面
vehicle: 有面积、深度和边缘并可被脚踏入的小水泊
ground: 血液在地面汇聚成片对应积水成泊；脚踩发声且物体浸在其中对应水泊具有深度和流动性
