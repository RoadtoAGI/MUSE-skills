tenor: 两个球在相互引力下进入永远重复、没有新状态的稳定旋转
vehicle: 舞步仍在循环而变化、意志与生命已死去的舞蹈
ground: 球体彼此绕转对应舞者围绕配合；轨迹固定永不创新对应舞步机械重复失去生命
