quote: 两眼直勾勾地看着台球桌，仿佛那是个魔鬼
sensory_mapping: 视觉；威胁；心理
context_fact: 丁仪确认高能实验确实出现无规律结果。
image_mechanism: 已经熟悉的家具因所代表的实验结果而被重新面孔化：它看似普通，却像魔鬼一样藏着摧毁信仰的诱惑和灾祸。
property_alignment: 普通物件因含义改变变得可怕对应魔鬼以表象诱惑并带来灾祸；台球桌指向物理学崩塌对应魔鬼摧毁既有信念
context_alignment: 台球桌已被建立为加速器模型，恐惧从模型反射回物件。
narrative_function: 显示理论灾难对物理学家的精神威胁。
transfer_rule: 让物件承载恐惧时，应先在前文建立它与灾难机制的稳定代换，再把角色对机制的畏惧反射回物件。
failure_boundary: 若台球桌尚未被用作加速器模型，魔鬼只有情绪强度没有具体危害对应；普通害怕物件也不足成立。
