image_mechanism: 柔软愿望被铸成一件看似完整的脆物，灾难性研究结论撞入后产生裂纹并崩散；抽象失望获得不可复原的断裂时刻。
property_alignment: 乐观愿景结构完整对应未碎物体；反证造成认知冲击对应撞击力；愿景不再可信对应碎片无法继续承担原功能
context_alignment: 紧随“结论令人震惊”，破裂动作把研究从温度上升推进到旧世界观被击碎。
narrative_function: 标志SETI想象由理想主义转向冲突模型。
transfer_rule: 用破灭写信念变化时，应指出原信念的完整结构、击中它的证据和为何无法局部修补。
failure_boundary: 愿望只是暂缓、仍有关键前提保留或证据很弱时，破灭会夸大结论不可逆性。
