tenor: 现代巨摆既纪念历代文明探索三体规律，也宣告这项延续近二百轮文明的努力已经死亡
vehicle: 立在逝者墓前、同时保存记忆并标记生命终结的石碑
ground: 巨摆保存共同历史对应碑文纪念逝者；证明求解努力终止对应墓碑标示不可复活的死亡
