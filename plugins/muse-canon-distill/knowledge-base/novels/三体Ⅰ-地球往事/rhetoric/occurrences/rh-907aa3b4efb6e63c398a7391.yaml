tenor: 几亿三体人密集站满戈壁并延伸到视野尽头的群体景象
vehicle: 水滴密集汇成没有边际、覆盖地表的辽阔海洋
ground: 个体数量巨大且难以区分对应水滴汇海；人群平铺至地平线对应海面一望无际
