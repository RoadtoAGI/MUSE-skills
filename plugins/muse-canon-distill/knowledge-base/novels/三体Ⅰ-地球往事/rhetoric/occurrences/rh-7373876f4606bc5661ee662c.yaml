review_status: reviewed
tenor: 三体文明在恒星灾变威胁下对太阳系生存空间产生排他、无上限并会驱使灭绝战争的占有欲
vehicle: 监听员濒临饿死后无法满足地囤积食物、仇视进食者甚至产生杀意的病态饥饿
ground: 文明生存危机对应个体濒饿；行星空间对应食物资源；排他占领对应囤积全部食品；危机解除后欲望仍持续对应创伤性无止境占有
