chapter: 第33章 监听员
figure_type: analogy
quote: 三体文明也是一个处于生存危机中的群体，它对生存空间的占有欲与我当时对食物的欲望一样强烈而无止境
sensory_mapping: 饥饿绞痛；食物堆积；抢夺动作；生存恐慌；空间吞占
context_fact: 和平主义监听员以自己的断粮经历向元首解释三体舰队为何必然毁灭而非共享地球文明。
image_mechanism: 文明被缩成一具饿过头的身体，星系成为供给车上的食物；恒星灾难留下的集体饥饿记忆让每颗可居行星都触发囤积和杀戮冲动。
property_alignment: 三体灾变风险对应监听员断粮；可居星系对应车上食物；占领太阳系对应占有全部食品；毁灭地球人对应仇恨并想杀进食者；欲望无止境对应康复后仍记得强迫占有；无法共享对应拒绝他人分食
context_alignment: 说话者不是以抽象邪恶指控母文明，而用亲历创伤推导群体机制，使侵略动机既可理解又不可调和。
narrative_function: 以个体饥饿模型揭示三体扩张的生存心理，并预判和平共处失败。
transfer_rule: 用饥饿类比资源扩张时，应对应危机来源、稀缺对象、占有失控、排他行为和危机后持续效应。
failure_boundary: 文明资源充裕、扩张由荣誉或意识形态驱动，或存在可信共享制度时，饥饿创伤不足以解释侵略。
quality_assessment: exemplary
