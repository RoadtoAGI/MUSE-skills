tenor: 轻骑兵沿主总线高速传递信号并分流进入各计算模块
vehicle: 主河高速奔流、分出支流并渗灌沿途区域的水系
ground: 信息沿中央通道快速移动对应河水沿主河奔流；信号分派到模块对应河流分支渗入各地
