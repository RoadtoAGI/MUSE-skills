review_status: reviewed
tenor: 质子三维展开后体积达到山脉尺度、银亮可见却总质量仍仅为一个质子的物质团
vehicle: 占据巨大空间、呈银色山形但没有实体重量的幻影，可被最弱小的婴儿牵走
ground: 外形尺度对应山脉；质量近零对应幻影无实体；轻易拖动对应影像不抗力；银色反光强化非实感
