chapter: 第8章 寂静的春天
figure_type: simile
quote: 她顿时感到周围的世界像一个口袋般收紧，一切都向她挤压过来
sensory_mapping: 触觉；空间；挤压；呼吸感；心理
context_fact: 连长、指导员和政治部调查者把她叫回，并摆出她抄写的信和禁书。
image_mechanism: 原本展开的世界瞬间缩成包裹身体的柔性容器，袋口先关闭，四壁再同步贴近；政治敏感被转成空间余量快速消失的窒息感。
property_alignment: 行动空间骤减对应袋口收束；压力来自周围所有人事对应袋壁四面贴近；难以逃脱对应物体被封在袋内
context_alignment: 她尚未受审却已从物证和人员站位感到包围，口袋能呈现无形制度压力的全向性和封闭性。
narrative_function: 在讯问开始前让读者先体验陷阱合拢。
transfer_rule: 写包围感时，可选边界能动态缩小的容器，并把入口关闭、壁面逼近和剩余空间三个阶段对应情势变化。
failure_boundary: 压力只有单一来源、仍有清楚退路或人物主动进入保护空间时，收紧口袋会误写全向封闭和被动性。
