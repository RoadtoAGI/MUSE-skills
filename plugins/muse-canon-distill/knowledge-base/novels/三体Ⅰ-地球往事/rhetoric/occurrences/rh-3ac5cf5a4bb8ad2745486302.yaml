chapter: 第16章 三体、哥白尼、宇宙橄榄球、三日凌空
figure_type: simile
quote: 大地已经像一块炉中的铁板一样被烧得通红
sensory_mapping: 视觉；金属材质；高温；平面尺度
context_fact: 三颗巨日同时近距照射，岩石熔化成溪，干仓和人群燃烧。
image_mechanism: 土石地表先被换成导热金属板，再连同整片世界推入炉中；均匀红光让高温不再是局部火灾，而成为材料整体状态。
property_alignment: 大地广平对应铁板平整；整体通红对应金属红炽；岩浆在表面流动对应板面高热使附着物熔化；三日包围加热对应铁板置于炉内
context_alignment: 上一轮灾变曾把人写成炉中柴火，此次三日更强，连承载人的大地本身都成为炉内材料，灾变等级随喻体升级。
narrative_function: 一眼交代地表温度和全域性，为火网、火柱等细节提供统一底面。
transfer_rule: 写大面积红热表面时，喻体要同时匹配平整材质、受热颜色和包围式热源，使温度成为整体物态。
failure_boundary: 地面仍保持绿色、仅有零星火点或热量来自地下局部时，炉中铁板会错误宣称均匀红炽。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三日凌空下整体红炽并流出岩浆的地表
vehicle: 置于高温炉膛中被均匀烧至红热的巨大铁板
ground: 地面平展成片对应铁板平面；整片土地暗红发光对应金属受热达到红炽状态
