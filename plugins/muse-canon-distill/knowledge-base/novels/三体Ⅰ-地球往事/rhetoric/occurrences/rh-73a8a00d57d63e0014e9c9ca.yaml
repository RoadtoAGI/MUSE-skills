context_fact: 记者厌倦现实世界，认为游戏远比现实丰富；IT副总裁随即也贬低现实的平庸低俗。
image_mechanism: 屏幕边框扩展成一道世界入口，登录不再是看模拟画面，而是跨到与街道、工作同样包围身体的另一空间；两处现实开始争夺“真正生活”的地位。
property_alignment: 游戏世界对应并列空间；登录体验对应进入第二世界；持续认同对应在其中生活；用游戏否定日常对应两重现实竞争；退出仍受影响对应边界渗透
context_alignment: 潘寒正筛选愿意接受三体真实存在者，称游戏为第二现实恰表明记者已主动削弱现实世界的唯一性。
narrative_function: 暴露玩家与现实疏离程度，为其欢迎外星文明提供心理因果。
