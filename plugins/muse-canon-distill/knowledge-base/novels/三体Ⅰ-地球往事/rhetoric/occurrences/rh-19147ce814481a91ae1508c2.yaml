tenor: 大史调侃信息处专家工作条件优越、少做危险辛苦外勤
vehicle: 出身尊贵、被精心保护而不经风雨的金枝玉叶
ground: 专业人员受单位珍视保护对应贵族子弟身份珍贵；平日不出外勤对应娇贵枝叶避开粗重环境
