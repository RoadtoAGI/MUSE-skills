tenor: 红岸工程从受重视、兵力充足逐步走向降密、缩编和撤销
vehicle: 生命体或天体由旺盛高位缓慢失去能量并走向消亡
ground: 资源、人员和政治关注减少对应生命活力衰退；最终基地结束对应衰老过程走向死亡
