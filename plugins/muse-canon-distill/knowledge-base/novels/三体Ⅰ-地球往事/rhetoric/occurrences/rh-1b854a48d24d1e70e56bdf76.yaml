tenor: 速度仍有限的三体文明应先启动首次星际移民，并选择正确宜居目标
vehicle: 徒步者要完成千里长途，必须从脚下迈出第一步并沿正确方向行走
ground: 首次远征是漫长星际事业开端对应长途由第一步开始；目标恒星选择决定成败对应行路方向必须正确
