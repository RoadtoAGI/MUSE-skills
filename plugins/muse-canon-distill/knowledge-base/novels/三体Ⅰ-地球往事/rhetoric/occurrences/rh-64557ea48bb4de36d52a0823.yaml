review_status: reviewed
tenor: 以色列人与巴勒斯坦人的长期报复循环持续加剧，个人和平努力难以改变冲突
vehicle: 人陷入黏稠深泥，越挣扎越向下沉，逐渐失去自救能力
ground: 报复引发新报复对应挣扎搅动泥浆使身体下沉；和平行动无法脱困对应陷入者找不到坚实支点
