tenor: 降临派毁灭全人类的秘密纲领公开后，会场突然沉默并给汪淼造成强烈压迫
vehicle: 巨大沉重实体从上方落下，覆盖空间并以重量压紧人的身体
ground: 所有声音骤停并笼罩众人对应巨物落下覆盖会场；汪淼身体紧张对应重量施压肌肤和神经
