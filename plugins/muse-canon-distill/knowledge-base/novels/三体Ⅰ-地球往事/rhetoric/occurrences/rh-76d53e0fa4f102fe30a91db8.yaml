chapter: 第34章 智子
figure_type: simile
quote: 电磁辐射仍将持续发射，像许多根辐条一样维持住这个大球面的稳定
sensory_mapping: 中心放射线；轮圈圆周；辐条张力；球壳支撑；结构稳定
context_fact: 引力会继续使二维质子面变形，工程系统用地面电磁辐射把它稳定成同步轨道尺度球壳。
image_mechanism: 不可见电磁场被画成从行星中心伸出的硬线，每束线都顶住球壳一处；车轮的平面辐条被扩展到三维全方向，组成看不见的支撑骨架。
property_alignment: 行星中心对应轮毂；球壳对应轮圈；径向辐射对应辐条；多束均布对应轮辐环列；持续发射对应持续张力；抵抗变形对应保持车轮圆形
context_alignment: 该类比直接解释工程控制机制，使读者理解球面为何不会在引力下继续塌陷。
narrative_function: 将场强平衡转成结构力学图，清楚说明二维工作平台的维稳方式。
transfer_rule: 用辐条解释场束支撑时，应明确中心、外壳、径向分布、持续受力和各束共同维持曲率。
failure_boundary: 辐射沿切向传播、只在单点施力或球壳靠自身刚性稳定时，辐条结构会错误描述受力。
