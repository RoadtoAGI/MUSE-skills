tenor: 从行星表面向质子球壳多方向持续施加、用于平衡引力并固定壳面形状的电磁辐射束
vehicle: 车轮中心通向轮圈的多根辐条以放射结构共同支撑圆周，保持整体不变形
ground: 行星居球心对应轮轴；质子球面对应轮圈；多束径向辐射对应辐条；持续张力维稳功能相同
