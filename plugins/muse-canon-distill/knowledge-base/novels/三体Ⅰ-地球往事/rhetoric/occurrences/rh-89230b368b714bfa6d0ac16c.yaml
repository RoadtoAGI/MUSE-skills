quote: 从所有人的脸上，汪淼都读出了一句话：我们已经尽力了，快他妈的结束吧！
sensory_mapping: 视觉；语言；表情
context_fact: 临时作战中心中众人显然熬夜工作。
image_mechanism: 把相似的疲惫表情统一排成一行无声文字，汪淼的观察动作则从看脸变成读句子；群体共识由视觉直接翻译成语言。
property_alignment: 神情传递共同意思对应文字承载句义；汪淼无需听见便理解对应读者从书面取意
context_alignment: 多张脸呈同一信息，文字模型把无声共识压成一句话。
narrative_function: 交代危机持续时间和群体精疲力竭。
transfer_rule: 写多人共享但未说出口的状态时，可把可见表情先归并为同一信息，再用与角色语域相符的一句内心话落地。
failure_boundary: 人群表情分歧、观察者无法同时看清或句义超出神情证据时，“读出一句话”会把推测伪装成确定信息。
