property_alignment: 原本疏离对应起始距离很远；杨卫宁持续戒备对应拉力向外；关系更难亲近对应线段增长
context_alignment: 两人同处封闭基地却情感越来越远，物理近距离与心理远距的反差增强孤独。
narrative_function: 将她对杨卫宁的失望落成关系位置，为后来平淡婚姻预埋底色。
