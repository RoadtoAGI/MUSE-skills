tenor: 在极寒中直立冻结、失去生命和活动的孔子身体
vehicle: 坚硬、竖直、没有动作的一根冰柱
ground: 身体被冻硬且保持站姿对应冰柱坚硬竖立；生命和动作停止对应无机冰体静止
