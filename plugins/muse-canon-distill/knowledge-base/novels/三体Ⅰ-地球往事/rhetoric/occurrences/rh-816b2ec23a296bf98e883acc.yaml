chapter: 第13章 红岸之二
figure_type: metaphor
quote: 遇到工作上不顺心的时候，叶文洁就成了他唯一的出气筒
sensory_mapping: 气压；冲击；容器出口；声音
context_fact: 杨卫宁政治地位低、对部下谨慎，只有面对身份弱势的叶文洁时能粗暴发火。
image_mechanism: 无法对真正压力来源表达的情绪被压进密闭容器，叶文洁则被装成唯一阀口；每逢压力升高，冲击都从她这里排出。
property_alignment: 杨卫宁积累不满对应容器蓄压；发火对应高压气体喷出；叶文洁地位弱且固定受责对应唯一排气口；她并非问题来源对应筒只承受不产生压力
context_alignment: 权力结构解释了为何出口只能朝向叶文洁，喻体把政治压抑如何转嫁给弱者呈成清楚流向。
narrative_function: 揭示杨卫宁粗暴背后的权力机制，并加深叶文洁的孤立。
transfer_rule: 用出气装置写迁怒时，应明确压力源、被阻断的真实出口、替代承受者和反复排放路径。
failure_boundary: 受责者确实造成问题、双方能够对等争论或怒气并非积压转移时，出气筒会掩盖责任关系。
