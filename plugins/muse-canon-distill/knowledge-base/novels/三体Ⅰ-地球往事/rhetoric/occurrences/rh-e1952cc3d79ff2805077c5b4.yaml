tenor: 罗马帝国被统治阶层的纵欲和腐化深度控制，难以自行恢复纪律与行动力
vehicle: 人跌进黏稠深泥，越挣扎越下沉，双腿无法拔出
ground: 腐化包围制度和生活对应泥浆裹住身体；帝国难以改革对应陷入者无法拔腿脱身
