review_status: reviewed
tenor: 让长期维持人列计算、未恢复正常生产生活的秦国重新进入繁荣活动
vehicle: 三体人在恶劣纪元排出水分沉睡，恒纪元到来后浸水苏醒复活
ground: 国家资源和社会活动枯竭对应个体脱水干缩；气候转好后恢复生产对应三体人补水醒来
