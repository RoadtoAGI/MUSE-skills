quote: 像抓着一团纠缠在一起的蛇，又像一团难以挣脱的绞索
sensory_mapping: 触觉；视觉；束缚；威胁
context_fact: 不同相机证明倒计时只针对汪淼，胶卷成为无法否认的证据。
image_mechanism: 手中真实卷曲物先按形状变成蛇群，再按人与异常的关系变成绞索；一个喻体负责活物威胁，另一个负责不可脱身。
property_alignment: 卷曲胶片形态对应蛇身和绳圈；倒计时主动威胁对应蛇可能噬咬；多次验证仍无法摆脱对应绞索收紧
context_alignment: 胶片可触摸的缠结让两种喻体都从现场物性生长，而非空泛说害怕。
narrative_function: 把实验结论转成被活物缠绕和被套索困住的绝望。
transfer_rule: 并列双喻体时，应让每个喻体承担不同缺口：一个解释外形或动作，另一个解释关系后果，避免同义堆叠。
failure_boundary: 若对象不卷曲，或困境可以轻易解除，蛇与绞索分别失去形态和不可脱身依据。
