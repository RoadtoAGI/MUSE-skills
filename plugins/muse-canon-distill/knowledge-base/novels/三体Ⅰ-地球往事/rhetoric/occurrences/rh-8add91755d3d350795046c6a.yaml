tenor: 断电后完全停止、悬在巨摆支架中且仿佛从未运动过的巨大金属摆锤
vehicle: 沉重、稳定、长久不动并与地基融为一体的巨大岩石
ground: 摆锤静止对应磐石不动；金属巨重对应岩石质量；固定在支架间对应凝固嵌入地貌
