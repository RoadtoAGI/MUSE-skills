chapter: 第25章 叛乱
figure_type: simile
quote: 仿佛是在舞台聚光灯下迎接着掌声和赞美
sensory_mapping: 强光聚焦；舞台中心；观众视线；掌声听觉；笑容
context_fact: 士兵把枪上电筒全部照向她，她正用核弹威胁大厅，却表现得像完成精彩演出。
image_mechanism: 包围现场被改造成剧场，枪灯变聚光灯，恐惧的沉默被她主观替换成掌声；核勒索于是成为供其展示魅力的表演。
property_alignment: 电筒光柱对应聚光灯；核弹少女对应舞台演员；武装人群注视对应观众席；灿烂笑容对应谢幕表情；危机控制感对应获得赞美的满足
context_alignment: 她以艺术体操般姿态托球、娇嗔谈判，舞台类比连续揭示其把真实死亡当戏剧化自我实现。
narrative_function: 暴露少女的表演欲与狂热，使警方和她对同一场面的理解产生冷峻反差。
transfer_rule: 把危机中心写成舞台演员时，应有定向照明、围观结构、表演姿态和人物把恐惧误读为赞美的心理。
failure_boundary: 人物明显畏缩、灯光分散或无人注目时，迎接掌声会违背可见姿态。
