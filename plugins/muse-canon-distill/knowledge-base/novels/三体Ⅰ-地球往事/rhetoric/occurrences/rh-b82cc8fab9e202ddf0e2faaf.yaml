quote: 光锥的头部正刺中首都的中心
sensory_mapping: 顶天光矛；锥尖；刺入；白炽伤口；烟柱
context_fact: 高维智慧把自身重组成反射镜主动寻找首都，聚焦阳光后造成大范围毁灭。
image_mechanism: 无形光热获得兵器形体，太空镜是持矛一端，倒锥收束成刺尖扎进城市；首都在焦点处像被穿出白炽伤口。
property_alignment: 反射镜对应持矛者；光锥对应长矛；聚焦端对应矛尖；首都中心对应要害；热量集中对应穿刺压力；烟柱龙卷对应伤口喷出物
context_alignment: 巨眼先代表宇宙凝视，继而失目变镜并伸出光矛，观察者向攻击者的转化在器官—武器链中完成。
narrative_function: 把光学聚焦变成主动攻击动作，清楚标出能量方向与毁灭中心。
transfer_rule: 用刺击写聚焦束时，应匹配细长方向、尖端收束、目标要害、能量集中和局部破坏。
failure_boundary: 光斑宽广均匀、没有焦点或只提供照明时，刺入会误写能量分布和攻击意图。
