quote: 一维丝的暴雨整整下了二十多个三体时才停止
sensory_mapping: 密集亮丝；从天落下；暴雨幕；持续覆盖；空气漂浮
context_fact: 首次展开多减一维，质子成极长一维线，部分受太阳暴减速进入大气并断裂。
image_mechanism: 没有触觉的核力细丝借反光成为银色雨线，行人拖动闪光如在雨幕中穿行；降雨停止后，细段仍像尘埃永久悬浮。
property_alignment: 一维丝对应雨线；密度增长对应暴雨增强；大气控制下飘落对应风雨；人体缠丝对应淋湿覆盖；持续时长对应降雨过程；断成不可见小段对应雨化尘雾
context_alignment: 质子内部结构从微观突然成为天气，暴雨把维度失败扩展为全行星日常骚扰。
narrative_function: 组织大量细丝的运动与持续时间，并让失败实验具有可感环境后果。
transfer_rule: 用暴雨写大量细线飘落时，应匹配密度、方向、持续、覆盖范围和风对轨迹的控制。
failure_boundary: 细丝数量稀少、只在轨道静止或上升扩散而非落入大气时，暴雨的下落幕墙不成立。
