tenor: 魏成观察几何整体时自动分解出底层数字关系
vehicle: 远看完整的报纸照片在近看时显露为大量印刷网点
ground: 几何图形表面连续对应照片远观完整；深入意识后只见数字对应近观照片只见离散小点
