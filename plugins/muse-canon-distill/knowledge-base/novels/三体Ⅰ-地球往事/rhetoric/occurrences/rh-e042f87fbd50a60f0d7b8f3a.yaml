chapter: 第9章 红岸之一
figure_type: simile
quote: 与天线相比，它们像几块精致的积木
sensory_mapping: 视觉；尺度；几何形态；空间布局
context_fact: 叶文洁首次走近峰顶基地，天线主宰整个空间尺度。
image_mechanism: 观察尺度由人转向天线，真实房屋随参照物改变而缩成可拿取的小块；基地因此像被一只更巨大存在搭起的模型。
property_alignment: 建筑相对天线极小对应积木相对现实建筑缩小；白色房屋轮廓方整对应积木几何块；数栋成组摆放对应若干玩具块组合
context_alignment: 句子明确以天线作尺度参照，积木承担的是相对缩小而非否认房屋真实功能。
narrative_function: 用比例突显红岸天线的压倒性体量。
transfer_rule: 用玩具写尺度时，应先给出场内巨型参照，再匹配对象的简化几何和成组摆放，使缩小来自视点关系。
failure_boundary: 没有巨大参照、建筑细节繁复凌乱或近距离占满视野时，积木会无端幼稚化场景。
