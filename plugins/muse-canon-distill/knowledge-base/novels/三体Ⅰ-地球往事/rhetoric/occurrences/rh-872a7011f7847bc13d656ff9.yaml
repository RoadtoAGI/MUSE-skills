tenor: 需航行四百五十万三体时、抵达时可能技术落后并被地球文明轻易消灭的三体舰队
vehicle: 主动走向埋葬自身的墓穴，行程终点就是死亡与覆灭之地
ground: 航行目的地太阳系对应坟墓位置；抵达后全军覆没对应被埋葬；主动启航对应走向自己的死地
