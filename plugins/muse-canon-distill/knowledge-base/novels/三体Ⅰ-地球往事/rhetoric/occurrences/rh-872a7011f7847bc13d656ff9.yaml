chapter: 第34章 智子
figure_type: metaphor
quote: 舰队是在航向自己的坟墓
sensory_mapping: 黑暗墓穴；单向行进；埋葬；终点封闭；死亡寒意
context_fact: 执政官刚因地球近在四光年外而狂喜，元首随即指出地球技术加速将使远征军到达时不堪一击。
image_mechanism: 星际航线被画成通往墓穴的甬道，发动机每推进一步都缩短舰队与自身埋葬处的距离；远征目的地由新家园瞬间翻转为死地。
property_alignment: 太阳系目的地对应墓穴终点；四百五十万时航程对应长甬道；舰队主动驶入对应自赴葬地；技术落后战败对应死亡；飞船损耗对应沿途送葬；文明希望破灭对应墓门封闭
context_alignment: 上一句元首刚对狂喜火山泼冷水，坟墓提供冷水的具体内容，让移民希望一语转成葬礼预告。
narrative_function: 骤然逆转会议情绪，并引出地球技术爆炸这一核心战略难题。
transfer_rule: 把征途写成通往坟墓时，应让目的地、到达时的必死条件、单向行程和主体明知风险仍前进相互咬合。
failure_boundary: 舰队抵达后仍有明显胜算、可随时返航或坟墓只泛指普通危险时，该意象会提前宣判结局。
