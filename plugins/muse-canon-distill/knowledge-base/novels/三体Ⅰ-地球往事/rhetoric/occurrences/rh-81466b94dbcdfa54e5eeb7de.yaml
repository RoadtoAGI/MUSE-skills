chapter: 第12章 三体、墨子、烈焰
figure_type: simile
quote: 太阳看上去确实像一个通向无边火海的孔洞，是一个更大存在的一小部分
sensory_mapping: 视觉；空间纵深；亮度
context_fact: 汪淼正借滤镜细看太阳，发现它与现实经验中的太阳结构不同，也暂时贴近墨子的双壳模型。
image_mechanism: 圆形日轮不再被看成独立球体，而被掏空为前景壳面的一处开口；刺眼光芒由洞后更广大火海涌来，使可见太阳只成庞大存在的截面。
property_alignment: 太阳圆轮对应圆形孔口；强光来自可见面之后对应孔洞泄出背后火海；可见日面只占局部对应更大存在被壳遮住的其余部分
context_alignment: 眼前确有墨子制造的空心球模型，望远镜观察提供圆面与层次，孔洞意象兼具角色知识和场景物证。
narrative_function: 让错误模型在视觉上短暂成立，同时引出汪淼对日核结构的关键发现。
transfer_rule: 把发光天体写成开口时，应让圆形边界、光源前后关系和被遮蔽的更大空间同时成立。
failure_boundary: 光源表面细节明确来自自身、周围没有遮挡层或叙事不需要暗示背后整体时，孔洞会扭曲空间结构。
