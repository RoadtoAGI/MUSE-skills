review_status: reviewed
tenor: 第三个球加入后使空宇宙系统获得复杂、不可重复动态的关键作用
vehicle: 画龙点睛中最后一点使静止龙形突然获得生命的眼睛
ground: 前两球已有结构却死寂对应龙身已画成但未活；第三球虽小却触发质变对应点睛一笔使整条龙生动
