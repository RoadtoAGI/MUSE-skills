chapter: 第17章 三体问题
figure_type: metaphor
quote: 但这第三个球体是点上了“空”之睛的龙
sensory_mapping: 视觉绘画；眼睛；点触动作；生命唤醒
context_fact: 加入第三个等质量球后，运动与描述方程骤然复杂，似乎永不重复，魏成从焦躁转为着迷。
image_mechanism: 空与前两球先组成一条轮廓完整却不动的龙，第三球被缩成落在眼位的一点；点下瞬间，整个系统从图形变成会舞动的生命。
property_alignment: 无球至二球系统对应未点睛龙画；第三球对应最后一点眼睛；复杂运动骤现对应龙被唤活；整体质变远大于新增单元对应小笔触激活整幅画
context_alignment: 传统点睛典故与寺庙、长老语境自然相连，又准确表达三体从可积简单到混沌复杂的非线性跃迁。
narrative_function: 把第三体的质变作用凝成瞬间创生，构成本段核心意象。
transfer_rule: 写一个小增量触发系统质变时，可选最后关键部件激活整体的典故，并明确增量前后功能差而非只强调“重要”。
failure_boundary: 第三项只是线性增加复杂度、前两项本身已高度活跃或缺少突然质变时，点睛会夸大因果。
quality_assessment: exemplary
