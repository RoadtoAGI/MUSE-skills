tenor: 行动人员在死亡切割网即将迎来目标前仍慢而熟练地竖起钢柱、固定纳米丝
vehicle: 工人日复一日完成没有风险和新鲜感的例行杂务，动作松弛甚至厌倦
ground: 操作从容熟练对应例行工作；外表懒散对应任务乏味；无显露紧张对应低风险日常
