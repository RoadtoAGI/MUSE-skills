chapter: 第10章 宇宙闪烁之二
figure_type: simile
quote: 整个太空成一个整体在同步闪烁，仿佛整个宇宙只是一盏风中的孤灯
sensory_mapping: 视觉；明暗；风感；节奏；孤立空间；尺度
context_fact: 3K眼镜把背景辐射转为暗红可见光，汪淼亲眼看见同步闪烁。
image_mechanism: 无边太空被收束进一个火焰光点，全局同步性因此有了单一光源；不可见扰动力成为风，每次亮暗都像火苗被吹偏，宇宙尺度反而显得可一口吹灭。
property_alignment: 全局亮度同升同降对应单一灯火整体明灭；闪烁不规则对应风扰火焰；宇宙骤显脆弱对应孤灯易熄；周围无参照对应灯独处黑暗
context_alignment: 前文坏日光灯强调故障，本句孤灯转向亲见后的渺小、孤独和脆弱，功能并不重复。
narrative_function: 反转宇宙宏大常识，让汪淼感到其受某种外力摆布。
transfer_rule: 写宏大系统同步波动时，可把它压成单一光源，再用外部介质解释节奏，并让尺度压缩产生新的情绪判断。
failure_boundary: 只有局部天区变化、多个光源各自闪烁或波动规律稳定时，孤灯会错误统一信号并虚构随机外力。
