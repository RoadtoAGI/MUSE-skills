review_status: reviewed
tenor: 额外空间维度只在基本粒子等微观尺度卷曲存在，宏观世界无法直接进入或观察
vehicle: 八个有活动潜力的存在被锁入狭小牢笼，失去在外部世界展开的自由
ground: 维度卷缩对应被关押；微观尺度对应牢笼；宏观不可见对应囚犯不能外出；技术展开对应解禁释放
