tenor: 三体模型银球反射的夕阳在叶文洁身上快速游移、明灭和变形
vehicle: 火焰贴着身体跳动，亮斑不规则伸缩、闪烁并舔舐表面
ground: 反光随球体飞舞而跳动对应火舌摇曳；光斑明暗变化对应火焰忽亮忽灭
