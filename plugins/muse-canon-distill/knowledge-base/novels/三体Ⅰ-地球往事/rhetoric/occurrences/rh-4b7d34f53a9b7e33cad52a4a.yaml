tenor: 巨大船首冲上岸坡时以质量和惯性推开土体，使土壤翻卷飞涌
vehicle: 船首破开水面，流体向两侧翻起并形成汹涌浪排
ground: 土在巨力下失去固态阻力对应水被船首分开；翻卷土体对应浪花；船首运动机制在水土两种介质中延续
