chapter: 第32章 古筝行动
figure_type: simile
quote: 将土坡像水那样冲开，激起汹涌的土浪
sensory_mapping: 船首楔入；棕黄浪头；土体翻涌；巨大惯性；岸坡破开
context_fact: 发动机被切坏后，审判日号偏航撞上左岸，六万吨船体仍保持强大前冲惯性。
image_mechanism: 巨轮把自己的航行介质从河水直接延长到陆地，船首压力让坚实土坡暂时液化，棕色土块沿船侧起浪；上岸不再是停止，而是继续航行。
property_alignment: 楔形船首对应破水船头；松散土体对应可流动水体；两侧土壤翻起对应船首浪；巨大速度质量对应造浪动力；土坡开裂后退对应水面被分开
context_alignment: 上一句把巨轮写成陆地移动的大山，此处反让陆地变水，固定与流动尺度同时倒转，突出撞击力量。
narrative_function: 将上岸碰撞写成连续流体运动，使巨轮解体前仍保持可怕动能。
transfer_rule: 把固体写成水时，应有足够外力使其出现分流、翻卷、波峰和连续位移，而非只说柔软。
failure_boundary: 坚硬岩壁只发生脆裂、船速低而陷停，或土体仅扬尘不成连续翻涌时，水浪机制不成立。
