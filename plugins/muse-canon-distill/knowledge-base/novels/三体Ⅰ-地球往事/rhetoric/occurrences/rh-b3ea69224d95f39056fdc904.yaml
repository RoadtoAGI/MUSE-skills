review_status: reviewed
tenor: 三体行星的镜像沿二维展开边缘逐行显现，球体画面随平面扩张逐步完成
vehicle: 刷新率很低的显示屏由扫描线逐行点亮像素，图像缓慢从一边生成
ground: 球体画面按边缘推进显现对应屏幕扫描；逐步完成而非整体出现对应低速刷新；二维平面承载影像对应显示屏
