chapter: 第23章 红岸之五
figure_type: simile
quote: 恒星级功率的强劲电波，如磅礴的海潮，此时已越过了木星轨道
sensory_mapping: 视觉波面；听觉轰鸣联想；巨大水量；向外推进；空间越界
context_fact: 叶文洁认为秘密发射平淡无果时，信号实际已被太阳放大并以光速离开地球行星区。
image_mechanism: 看不见的电磁场被灌成有高度和重量的水墙，波前从太阳向外一圈圈涌去；越过木星轨道像潮水冲过一道远岸标记。
property_alignment: 电磁振荡对应水波起伏；恒星级功率对应海潮巨大能量；球面传播对应潮面铺展；光速向外对应潮头疾进；越过木星对应冲过遥远界线
context_alignment: 上一行只有孤独女性和凉馒头，这一行把她看不见的行动后果骤然扩为太阳系海潮，尺度反差构成历史性震撼。
narrative_function: 将无形信号具象为不可收回的巨大推进物，揭示平淡操作已触发宇宙事件。
transfer_rule: 以海潮写传播波时，应同时匹配波动结构、能量规模、推进方向、覆盖宽度和越过的空间标志。
failure_boundary: 信号极弱、只沿狭窄定向束传播且无连续波面，或传播很快衰减时，磅礴海潮会误写覆盖与强度。
quality_assessment: exemplary
