review_status: reviewed
tenor: 经太阳放大后以恒星级功率向整个宇宙扩散、已传播到木星轨道外的无线电波
vehicle: 声势浩大、波峰相继推进并越过广阔水域的磅礴海潮
ground: 电磁波以连续波面传播对应海潮一层层推进；能量极强且覆盖范围大对应巨潮体量压倒环境
