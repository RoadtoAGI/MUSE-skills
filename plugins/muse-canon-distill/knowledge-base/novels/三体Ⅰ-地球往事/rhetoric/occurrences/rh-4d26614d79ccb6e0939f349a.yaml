review_status: reviewed
tenor: 行星进入恒星气层后因摩擦灼热发光、快速减速并最终落入恒星
vehicle: 流星穿过大气拖出明亮尾迹，最终坠向一片无边火焰海洋
ground: 行星高速摩擦发热对应流星烧亮；受热物质形成长尾对应流星火尾；落入恒星对应坠入火海
