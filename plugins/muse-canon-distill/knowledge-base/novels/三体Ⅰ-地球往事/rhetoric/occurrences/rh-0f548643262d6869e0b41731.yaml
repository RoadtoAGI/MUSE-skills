chapter: 第5章 叶文洁
figure_type: simile
quote: 他那颗两天来绷得紧紧的心脏像被放到了柔软的天鹅绒上
sensory_mapping: 触觉；承重；松弛；心理
context_fact: 叶文洁送他木盒并接受他再来探望，汪淼双眼湿润。
image_mechanism: 紧张先让心脏成为悬着且绷硬的物体，叶文洁的善意再化成有绒面的承托；“放到”完成由悬空到落稳的瞬间卸力。
property_alignment: 持续戒备对应物体绷紧悬置；获得安慰对应被稳稳放下；温柔接纳对应天鹅绒柔软包承
context_alignment: 两天的超常压力需要明确的卸载动作，年长者的温和气质又与天鹅绒的柔软触感相合。
narrative_function: 以触觉落差收束来访，并建立汪淼对叶文洁的信任。
transfer_rule: 写骤然安心时，可让长期悬置的心理负荷落到一种具体承托面上，并让表面质地对应安慰者的气质。
failure_boundary: 若情绪只是兴奋、麻木或问题已真正解决，柔软承托会分别误写成平静、恢复感觉或消除风险。
