context_fact: 两人刚认识且身份一警一民，徐冰冰主动说汪淼在《三体》中威望很高。
image_mechanism: 警服、年龄和陌生感先构成两人之间的空隙，《三体》像一根突然收紧的绳，把两端拖近到可低声交换情报的位置。
property_alignment: 彼此陌生对应空间间隔；共享游戏知识对应连接绳；信任增加对应距离缩短；变化突然对应拉力瞬时作用
context_alignment: 《三体》正把全球陌生人聚成网络，同一机制在警车后排缩演为两个人因秘密共同体接近。
narrative_function: 迅速建立汪淼向徐冰冰追问信息的心理许可。
