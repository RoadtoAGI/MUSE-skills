tenor: 把一个质子展开成宏观二维平面并在其上制造智能计算机的工程设想
vehicle: 超越日常因果、由神力完成奇迹且只能在古老传说中成立的神话事件
ground: 工程尺度反常对应神迹超自然；虽有理论仍难直觉相信对应听神话时的悬疑；实现方式远超常识
