tenor: 外观仍近似宇宙噪声、却被智能编码细微调制而显出内在秩序的电波曲线
vehicle: 原本无生命的躯壳忽然获得灵魂，从随机动作中显露意志和主体存在
ground: 无意义曲线转为受智能调制对应躯体获得意识；难以言说的秩序感对应灵魂不可见却能从行为辨认
