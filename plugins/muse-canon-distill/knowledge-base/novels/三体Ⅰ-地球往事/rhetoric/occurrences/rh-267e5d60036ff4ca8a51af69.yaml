tenor: 遮住全部星空和阳光的质子球膜解除包裹，使三体世界瞬间重新暴露在外部宇宙中
vehicle: 宇宙巨手抓住覆盖世界的巨大蒙布，一把扯开，让被罩住的物体重见光明
ground: 质子膜遮蔽外界对应蒙布覆盖；迅速收缩对应手扯布离开；阳光瞬间进入对应揭幕见光
