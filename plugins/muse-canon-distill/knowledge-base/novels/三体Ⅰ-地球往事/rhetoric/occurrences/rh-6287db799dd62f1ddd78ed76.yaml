quote: 只是埋头于工作
sensory_mapping: 身体俯低；视觉遮蔽；堆积物；狭窄空间；持续动作
context_fact: 她已切断精神联系，开始深入技术核心并承担重要课题，成果却被雷志成占有。
image_mechanism: 工作从行为变成能包围头部的实体堆，叶文洁主动俯身钻入，外界政治、关系和未来都被堆壁挡在视野之外。
property_alignment: 技术任务对应堆积材料；长期专注对应头持续埋入；外界被忽略对应视线遮住；自我保护对应以工作堆作为掩体
context_alignment: “斩断联系”先断开横向关系，“埋头”再封闭视野，两个动作共同完成她在红岸的心理隔绝。
narrative_function: 把沉浸工作写成主动躲避世界的身体姿态。
transfer_rule: 用埋头写专注时，应让任务密集到遮蔽其他生活，并呈现主体持续低头投入的选择。
failure_boundary: 人物仍广泛社交、工作只是短时冲刺或专注并未排除其他关注时，埋头会夸大封闭。
