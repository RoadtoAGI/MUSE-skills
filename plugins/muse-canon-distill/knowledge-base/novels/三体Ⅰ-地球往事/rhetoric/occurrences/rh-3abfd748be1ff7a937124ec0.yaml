tenor: 从四周同时遭村民砍伐、边缘不断收缩的伊文斯树林
vehicle: 被大量蚜虫从多处持续吸食啃坏、绿色面积迅速消退的一片叶子
ground: 树林整体绿面对应叶片；四面砍树者对应分布各处的蚜虫；林地缩小对应叶肉被蚕食
