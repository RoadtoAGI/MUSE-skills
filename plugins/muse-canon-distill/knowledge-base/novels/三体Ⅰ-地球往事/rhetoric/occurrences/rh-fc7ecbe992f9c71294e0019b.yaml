chapter: 第30章 地球三体运动
figure_type: metaphor
quote: 人马座三星成了太空中的奥林匹斯山，那是神的住所
sensory_mapping: 仰望高处；遥远星光；神山峰顶；空间圣化；宗教敬畏
context_fact: 拯救派对三体文明的想象发展成宗教感情，三体教随之诞生。
image_mechanism: 天文坐标被垂直化成神山，四光年距离成为凡人与神域的高度差；一颗可定位的恒星系统由此取得圣地中心性。
property_alignment: 高等文明对应神祇；人马座三星对应神山位置；四光年遥远对应高不可攀；真实天体可定位对应神居有明确方位；拯救派崇拜对应凡人仰望祭奉
context_alignment: 三体教不同于传统宗教之处正是对象真实存在，把星系命名为神山连接了天文事实与宗教结构。
narrative_function: 一句完成外星文明从想象对象到宗教神祇的位阶跃迁。
transfer_rule: 把地点圣化为神山时，应同时建立居住者的超越地位、空间距离、信徒朝向和可识别圣地中心。
failure_boundary: 对象被群体视为平等伙伴、地点频繁往来且不具崇拜仪式时，神山会错误抬高权力关系。
