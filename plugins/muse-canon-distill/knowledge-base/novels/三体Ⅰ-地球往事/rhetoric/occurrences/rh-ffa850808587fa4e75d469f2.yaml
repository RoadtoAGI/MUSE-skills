chapter: 第28章 伊文斯
figure_type: analogy
quote: 本来村里是想过几年再收林子的，猪养肥了再杀嘛
sensory_mapping: 幼猪增重；等待成熟；屠刀落下；肉材收获；算计时机
context_fact: 南圪村提前来砍树，原村庄为避免失去份额也加入，法律和干部共同参与掠夺。
image_mechanism: 活树林被改写成圈中牲畜，树木每长一圈年轮都像猪增一层肉；所谓保护期只是等待更值钱的宰杀时刻。
property_alignment: 树苗对应幼猪；生长增材对应育肥增肉；村里等待对应饲养周期；成熟砍伐对应屠宰；木材利益对应肉食收益；外村抢砍对应提前夺食
context_alignment: 伊文斯把树林当燕子伊甸园，村民把同一生命空间当待宰牲畜，两套价值观直接冲突。
narrative_function: 揭示造林被默许的真实动机，并使砍伐的预谋性比贫困借口更清楚。
transfer_rule: 用养肥再杀类比资源利用时，应有生长期、收益随时间增加、产权预期和计划中的毁灭性收割。
failure_boundary: 经营目标是可持续采收、砍伐后补种，或村民此前并无占有计划时，屠宰模型会过度断言恶意。
quality_assessment: exemplary
