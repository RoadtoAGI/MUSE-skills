review_status: reviewed
tenor: 村里从一开始就把伊文斯免费种植的树林视为待成熟后统一砍伐获利的资源
vehicle: 先喂养幼猪使其长大增重，再选择最有收益的时点宰杀取肉
ground: 幼树成长对应猪养肥；等待几年对应育肥期；砍树获材对应屠宰取肉；不投入却占有成果对应饲养者收益预期
