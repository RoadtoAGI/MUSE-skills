chapter: 第31章 两个质子
figure_type: metaphor
quote: 它是一把锁。
sensory_mapping: 金属锁；锁舌扣合；门后空间；无钥匙；长期囚禁
context_fact: 审问者认为两个质子等于什么都没送，叶文洁首次给出它们的战略功能。
image_mechanism: 微小质子不靠能量摧毁宏观物体，而化成锁具卡在知识之门；体积几乎为零，却控制文明能否继续向深层物质世界前进。
property_alignment: 质子对应锁体；加速器实验对应锁孔入口；错误结果对应锁舌闭合；科学突破对应开门；三体高维知识对应钥匙控制；舰队抵达前停滞对应长期上锁
context_alignment: 这是全书科学锁死框架首次明示，L2622对牢固锁具的解释属于后续机制展开。
narrative_function: 以极小物件反转两个质子微不足道的直觉，并抛出核心悬念。
transfer_rule: 用锁写知识封堵时，应明确被锁通道、施锁者、锁闭机制、钥匙归属和无法绕行的时间后果。
failure_boundary: 若替代研究路径能绕开加速器、错误可被识别过滤或人类获得解锁知识，锁死应改写为暂时阻碍。
