context_fact: 三个太阳超过洛希极限的潮汐力撕裂行星，两半在自身引力下重塑球形，之间暂留跨太空岩浆带。
image_mechanism: 行星尺度骤缩成手中折断的莲藕，粗大球体已分开，灼热岩浆却被拉成一缕纤细黏丝；完全断裂前的脆弱联系一眼可见。
property_alignment: 行星两半对应两截藕；潮汐撕裂对应折断；横空岩浆带对应藕丝；距离继续扩大对应丝被拉长变细；最终断开对应藕丝拉断
context_alignment: 熟语常写关系，此处重新落回具体断裂形态，藕丝的细弱与行星巨体形成壮观尺度反差。
narrative_function: 精确呈现大撕裂尚未完成的过渡形态，并引出岩浆河。
transfer_rule: 用藕断丝连写物理分裂时，应同时具备主体断开、少量韧性物质残连和两端持续拉离。
failure_boundary: 两部分仍有宽厚结构连接、尚未真正分开，或早已完全断绝时，藕丝的细弱阶段不成立。
