tenor: 基本粒子随观察维度升高而急剧增加的内部结构数量、关系复杂度和可容纳信息规模
vehicle: 三维世界中从一个恒星系统扩展到银河系再扩展到整个宇宙的三级天文复杂度
ground: 七维粒子结构对应星系层级；八维对应银河级浩瀚；九维对应宇宙级结构数量；每增一维都发生远超线性的复杂度跃迁
