tenor: 全身被火包裹、仍高速奔入大殿的坐骑
vehicle: 向前滚动或飞行、只见圆团火焰而不见内部形体的火球
ground: 火焰完全遮住马身轮廓对应球状火团无内部细节；奔跑使火焰整体移动对应火球高速掠行
