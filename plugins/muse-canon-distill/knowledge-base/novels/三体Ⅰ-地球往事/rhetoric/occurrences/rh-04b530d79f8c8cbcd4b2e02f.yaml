tenor: 雷政委把手放在肩上所表达的个人信任、鼓励和政治庇护感
vehicle: 可沿身体接触传导的热量与物理力量
ground: 手掌体温沿接触传到肩部对应关怀通过触碰抵达；按肩的稳定压力对应鼓励为她提供支撑
