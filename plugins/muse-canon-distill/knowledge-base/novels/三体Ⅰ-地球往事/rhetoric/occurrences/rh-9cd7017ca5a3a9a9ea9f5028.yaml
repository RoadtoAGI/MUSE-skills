chapter: 第15章 红岸之四
figure_type: simile
quote: 叶文洁用一种悠长的声调说，像是在给孩子讲故事
sensory_mapping: 听觉；语速；代际距离；叙述节奏
context_fact: 叶文洁已年老，正在回望数十年监听宇宙形成的孤独感，汪淼安静倾听。
image_mechanism: 当下对话被拉成床边或炉旁的代际讲述，声调的长度把几十年岁月拖入句子，听者暂时缩成需要领会世界的孩子。
property_alignment: 悠长声调对应故事讲述的绵延节奏；老人对年轻人回忆往昔对应长辈面向孩子；复杂孤独被具象叙说对应故事把难懂经验转为画面
context_alignment: 她接下来使用寒风、沙漠、宫殿等连续意象，确实像一段以图景传递人生观的故事，而非技术报告。
narrative_function: 转换叙述音色，为随后高度形象化的孤独独白建立温柔而悲凉的入口。
transfer_rule: 用“讲故事”标记语调时，应让说话节奏、代际位置和随后内容的图景化共同支持，而非只因说得久。
failure_boundary: 急促争论、双方权力平等且内容纯为技术指令时，给孩子讲故事的缓慢与照护关系不会成立。
quality_assessment: effective
