review_status: reviewed
tenor: 叶文洁向汪淼讲述外星探索人生影响时悠长、缓慢而带抚慰感的语调
vehicle: 长辈给孩子讲遥远故事时从容绵延的口吻
ground: 语速和尾音悠长对应讲故事的缓慢铺陈；面对较年轻听者解释一生感受对应长辈向孩子传递遥远经验
