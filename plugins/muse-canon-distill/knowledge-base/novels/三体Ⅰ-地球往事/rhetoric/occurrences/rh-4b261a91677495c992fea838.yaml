tenor: 汪淼认出叶文洁竟是ETO统帅时，震惊使周围人事退去存在感，注意力全部集中到她身上
vehicle: 整幅画面被抽去颜色，只给唯一主体保留鲜明彩色，使其从背景强烈凸出
ground: 周围信息失去注意价值对应背景褪成黑白；叶文洁占据全部意识对应唯一彩色主体最醒目
