quote: 十多名穿军装的操作人员坐在几乎将他们埋没的一排排仪器前，仿佛是蹲守在深深的战壕中
sensory_mapping: 视觉；空间深度；包围；听觉；军事动作
context_fact: 发射主控室仪器密布，操作口令此起彼伏且项目被称为大型武器。
image_mechanism: 一排排仪器从桌面升成壕壁，坐姿变成蹲守，信号灯与口令则替代枪火和传令；室内技术劳动获得前线空间结构。
property_alignment: 仪器排高密围住身体对应壕壁包围士兵；操作员坐低几乎被埋对应人在深沟低伏；口令紧张对应临战值守；军装与武器项目对应真实军事身份
context_alignment: 人物本就是军人且执行发射，战壕并非装饰；“埋没”提供垂直深度，仪器排列提供壕壁。
narrative_function: 把技术控制室定性为看不见敌人的战场。
transfer_rule: 用战壕写控制空间时，应匹配设备围合高度、人员低姿、命令节奏和真实对抗任务。
failure_boundary: 开放明亮、人员自由走动或执行常规民用监测的控制室没有深壕与临战蹲守。
