chapter: 第2章 台球
figure_type: simile
quote: 她像一颗星星，总是那么遥远，照到我身上的光也总是冷的
sensory_mapping: 视觉；温度；距离
context_fact: 丁仪醉后谈起死去的杨冬，随后走到窗前望夜空。
image_mechanism: 先用天文距离写不可接近，再让光跨过距离触身，最后用冷感限定影响的情感温度；窗前寻找已逝星辰又把死亡叠进迟到的光。
property_alignment: 星体可见不可抵达对应杨冬吸引丁仪却情感疏远；星光抵达观察者对应她确实影响丁仪；冷光缺少温度对应关系缺乏亲密回馈
context_alignment: 天文意象来自物理学家知识，现场寻找星辰动作继续展开映射。
narrative_function: 一句交代关系距离、影响与哀痛。
transfer_rule: 写关系距离时，让喻体分别回答能否接近、影响如何抵达、抵达后是什么温度，并优先取自视角人物的知识世界。
failure_boundary: 只写美丽或明亮会落入泛化赞美；没有遥远、冷光和死亡语境时，星星不足以刻画这段具体关系。
