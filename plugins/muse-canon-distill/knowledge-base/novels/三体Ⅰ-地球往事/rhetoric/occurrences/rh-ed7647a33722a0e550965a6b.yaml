tenor: ETO计划通过公开起义从秘密组织变为全球政治事件和历史行动者
vehicle: 一直藏在幕后的人走上可被观众看见的舞台，公开扮演角色并进入演出记录
ground: 秘密活动转公开对应演员从后台登台；全球社会开始关注对应观众看见角色；行动进入历史对应演出被记录
