property_alignment: 出纸口对应嘴部开口；纸张从机器内部向外移动对应口中物被吐出；机器主动送纸对应生物肌肉推出；汪淼立即抓取对应接住刚离口之物
context_alignment: “迫不及待地抓过”需要纸张具有主动出来的速度，吐出比静态打印完成更贴动作节拍。
narrative_function: 给解码动作加速，让数字证据迅速从屏幕变成可操作纸面。
transfer_rule: 把机器输出写成口腔动作时，应匹配开口形态、内部推出机制、输出速度和接收者动作。
failure_boundary: 纸张缓慢停在托盘、需要手动抽出或设备从开放平台显示结果时，“吐”会夸大主动与速度。
