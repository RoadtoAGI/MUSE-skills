context_fact: 叶文洁在大兴安岭参加兵团大规模伐木。
image_mechanism: 树冠和枝叶被暂时略去，视线只保留笔直主干，把森林生命抬升为古典神庙的承重构件；“轰然倒下”随即让毁坏具有拆毁文明遗迹的重量。
property_alignment: 树干笔直粗壮对应神庙巨柱；高度和体量带来仰视对应纪念建筑尺度；倒地震动对应巨型构件倾覆的重量
context_alignment: 三百年级落叶松的尺度和庄严感需要具体建筑原型，巴特农又把砍伐从生产动作提升为毁坏古老遗产。
narrative_function: 为森林破坏建立庄严尺度，并开启后续巨人遗体意象。
transfer_rule: 以建筑构件写古树时，应对应主干几何、承重感、观看尺度和文化寿命，使建筑原型参与价值判断。
