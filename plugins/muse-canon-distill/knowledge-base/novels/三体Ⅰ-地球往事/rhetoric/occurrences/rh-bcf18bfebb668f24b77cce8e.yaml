tenor: 三颗恒星已吞噬十一颗行星，现存三体行星只是尚未被捕获的最后幸存者
vehicle: 巨型捕食者在广阔猎场逐一猎杀猎物，行动后只剩漏网残余
ground: 恒星气层周期捕获行星对应捕食者反复出猎；十一颗行星消失对应猎物被吞食；现存行星幸存对应猎场遗漏残余
