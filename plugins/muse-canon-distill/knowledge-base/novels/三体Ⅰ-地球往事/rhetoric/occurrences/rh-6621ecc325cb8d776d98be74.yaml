figure_type: simile
quote: 这静止向各个方向飞快扩散开来，像快速封冻的海面
sensory_mapping: 视觉；温度；物态变化；径向传播
context_fact: CPU门电路出错导致系统锁死，主板大部分最终静止，只剩少量死循环闪动。
image_mechanism: 刚才的河流和浪潮被保留为同一片水面，故障则化为寒潮从CPU圆心向外冻结；每经过一区，旗浪立即凝住。
property_alignment: 运行时旗动对应流动海面；CPU故障中心对应冻结起点；停机范围扩大对应冰层前沿推进；最终大部静止对应海面封冻
context_alignment: 它不是另起意象，而是把前文液化、河流、浪潮完整反转为冰封，延展框架承担系统从运行到锁死。
narrative_function: 直观呈现故障传播和全局停机，并完成水意象的动态闭环。
transfer_rule: 延展流体意象写停机时，可让故障变成冻结前沿，逐项对应起点、传播方向和流动消失。
failure_boundary: 各模块独立随机停机、故障不从中心传播或系统仍整体运行时，快速封海会虚构统一前沿。
