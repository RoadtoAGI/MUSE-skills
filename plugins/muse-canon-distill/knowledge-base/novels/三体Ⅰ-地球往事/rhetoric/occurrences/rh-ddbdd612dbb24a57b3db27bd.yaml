quote: 他看不到它们，但能感觉到它们磁石般的存在
sensory_mapping: 空间；牵引；触觉想象；心理
context_fact: 指挥官看不见铁炉，却最害怕守军合上引爆开关。
image_mechanism: 炸药没有被画出外形，只把它对意识的作用变成无形磁场；指挥官的注意像铁屑，被楼内一点持续拉住。
property_alignment: 危险源不可见对应磁石可藏而磁力仍在；注意力被持续吸向目标对应铁物受磁力牵引；距离不能消除作用对应磁场跨空存在
context_alignment: “看不到但感觉到”正需一种无须目视即可施力的喻体，磁石比泛称压力更精确。
narrative_function: 让隐蔽炸药在场景中保持强烈的心理在场。
transfer_rule: 写不可见威胁时，可选择作用跨越遮挡且有明确方向的力场，让人物注意力成为被牵引物。
failure_boundary: 威胁只被人物偶然想起、没有持续吸引方向或信息完全未知时，磁力会误写其确定性和作用强度。
