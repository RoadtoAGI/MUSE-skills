review_status: reviewed
tenor: 未知宇宙力量介入后，人类社会即将出现难以预测的结构性剧变
vehicle: 生命或物质系统在短时越过阈值，突然变成不同形态
ground: 变化速度快且非渐进对应突变跨过中间过程；未来秩序可能性质改变对应系统形态重组
