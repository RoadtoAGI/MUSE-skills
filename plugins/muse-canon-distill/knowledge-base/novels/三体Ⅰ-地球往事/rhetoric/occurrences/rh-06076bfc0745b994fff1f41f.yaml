tenor: 齐家屯浓烈温热的生活在半年中持续、安静、平缓地经过
vehicle: 沿边缘缓慢流动、声音轻柔且水势稳定的小溪
ground: 日子连续向前对应溪水不断流动；生活节奏平和对应小溪水势缓慢无激浪
