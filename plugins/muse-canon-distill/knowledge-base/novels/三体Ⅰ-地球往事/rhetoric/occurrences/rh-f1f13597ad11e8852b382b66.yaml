chapter: 第27章 无人忏悔
figure_type: simile
quote: 这个玩具盒般的宇宙令她感到分外舒适
sensory_mapping: 手掌尺度；盒壁；微缩景物；排列；安全包裹
context_fact: 她想象黑色球面正好扣住有边平面，星星不比小镜子大，世界布满熟悉山村。
image_mechanism: 无限宇宙被折叠进一个可合盖的盒子，恒星缩成亮片，山脉村落缩成模型；边界把黑暗和危险关在盒外。
property_alignment: 有限天穹对应盒盖；平面世界有边对应盒底边框；小星星对应玩具亮片；山村山脉对应微缩模型；可理解可控制对应儿童盒中秩序；舒适对应被盒壁保护
context_alignment: 叶文洁熟知真实三体宇宙的无限冷酷，玩具盒的错误却提供久违安全，贴切写出知识负担与朴素幸福的反差。
narrative_function: 把大凤宇宙的认知局限转成情感庇护，并引导叶文洁入睡。
transfer_rule: 把世界写成玩具盒时，应对齐有限边界、尺度缩小、物件秩序和由可控性产生的安全。
failure_boundary: 世界仍无边、对象巨大危险且无法被框定时，玩具盒只会天真化而不能解释舒适。
quality_assessment: exemplary
