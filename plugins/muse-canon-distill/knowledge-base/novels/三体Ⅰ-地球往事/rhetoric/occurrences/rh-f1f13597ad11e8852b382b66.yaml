tenor: 大凤心中尺度有限、边界清楚、星星小而安全的朴素宇宙模型
vehicle: 尺寸可握、四壁封闭、物件整齐摆放且不会脱离控制的儿童玩具盒
ground: 宇宙有明确球面和平面边界对应盒壁封闭；星星山村都缩小对应玩具物件微型化
