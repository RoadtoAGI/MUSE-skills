chapter: 第27章 无人忏悔
figure_type: metaphor
quote: 无数人在默默地舔着自己的伤口
sensory_mapping: 伤口疼痛；舌头舔舐；血迹；独处；缓慢愈合
context_fact: 社会表面进入科学春天，但文革造成的伤害和责任问题尚未真正处理。
image_mechanism: 人群被还原成一只只带伤动物，没有医院和公共语言，只能低头处理自己的创口；复苏景象下仍布满未结痂的肉身。
property_alignment: 文革创伤对应开放伤口；个人沉默处理对应独自舔舐；缺乏制度修复对应没有治疗者；时间缓慢恢复对应伤口结痂；无数受害者对应遍地伤兽
context_alignment: 季节复苏容易显得宏观乐观，舔伤细节把视角拉回个体代价，保持春天之下的残破。
narrative_function: 限制时代乐观叙述，解释叶文洁为何仍要寻找施害者忏悔。
transfer_rule: 用舔伤写创伤恢复时，应呈现伤害来源、沉默自助、治疗资源缺失和恢复不彻底。
failure_boundary: 社会已有公开审判、专业救助和集体修复，或人物积极互助发声时，孤兽舔伤会遮蔽真实行动。
