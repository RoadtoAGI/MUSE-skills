tenor: 浩劫后大量受害者各自处理身体、精神、家庭与事业创伤，缺少公开修复和共同清算
vehicle: 受伤动物独自舔舐开放伤口，缓慢止血清洁却无法彻底治疗
ground: 个人创伤对应身体伤口；沉默自救对应动物舔伤；修复有限缓慢对应舔舐疗效有限；受害者分散对应各自独处
