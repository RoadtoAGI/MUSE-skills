tenor: 记忆中的雷达峰及包围它的大兴安岭，与眼前审判日号及包围它的大西洋构成的两套基地空间
vehicle: 巨船坐落海面：船体对应山峰，铺展海水对应环山森林，由眼前海上基地反向解释旧山中基地
ground: 孤立高耸的山峰对应巨大船体；无边森林包围山峰对应海水包围巨轮；两处都承载巨型天线和秘密通讯基地
