chapter: 第29章 第二红岸基地
figure_type: analogy
quote: 那山峰的形状真的像一艘巨船，周围的大西洋像是大兴安岭的森林
sensory_mapping: 高空俯视；孤立主体；无边背景；山海互换；空间套叠
context_fact: 直升机降向由油轮改造的第二红岸基地，叶文洁因巨轮外形想起曾工作的雷达峰。
image_mechanism: 俯瞰视角将两幅地图透明叠合：山峰从森林中拔出成为船体，森林的深广被换成海面；地貌材料全部改变，基地的孤立结构和历史功能保持不动。
property_alignment: 雷达峰孤峰对应审判日号船体；大兴安岭环绕对应大西洋包围；山体长脊对应巨船轮廓；山中隔绝对应海上隔绝；第一红岸对应第二红岸；直升机抵达对应两次进入秘密基地
context_alignment: 人物刚感到时光倒流，成对空间映射把心理重演落实为地形与设施的逐项复现。
narrative_function: 把新基地纳入旧红岸记忆框架，显示叶文洁的首次选择已在另一地点繁殖。
transfer_rule: 构造两处空间的整体类比时，应先匹配中心物、包围背景、观察视角、隔绝性质和叙事用途，再允许山海等材料互换。
failure_boundary: 两地只有某个物体外形接近，周围空间、进入方式和功能均不对应时，不能扩展成整套山海互换类比。
quality_assessment: exemplary
