figure_type: simile
quote: 大眼镜后面的那双眼睛像着了火似的
sensory_mapping: 视觉；亮度；温度；能量
context_fact: 申玉菲捡到烧焦废稿后闯入魏成房间，立刻认出三体研究并急切追问。
image_mechanism: 镜片后的两点目光被直接点燃，普通注视获得亮、热和向前扑动的能量；废稿边缘的真实焦痕又把火意象引入现场。
property_alignment: 目光明亮对应火光；情绪急切对应火势骤起；注意集中对应火焰聚焦燃烧；对研究的执着对应火不易熄灭
context_alignment: 她的使命感远超魏成理解，着火眼睛既贴合烧焦算稿，也提前显出此研究对她近乎生死。
narrative_function: 用第一眼刻画申玉菲的异常执念，推动魏成随她下山。
transfer_rule: 用眼中着火写热情时，应让亮度、温度、爆发速度和注意方向共同成立，并尽量与现场火源或后果呼应。
failure_boundary: 目光平静柔和、热情短暂或场景强调冷静计算时，着火会把专注误写成激烈冲动。
