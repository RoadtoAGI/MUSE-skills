review_status: reviewed
tenor: 飞刃穿过船体后留下的极端平整、没有毛刺变形且能清晰反光的钢铁截面
vehicle: 抛光镜面平滑连续，能不失真地映出天空和朝霞
ground: 切面微观平整对应镜面光洁；影像不走形对应表面无起伏；反射朝霞对应镜面成像
