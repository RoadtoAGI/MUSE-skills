review_status: reviewed
tenor: 外星接触使人类文化与文明集团之间差异扩大、关系断开
vehicle: 材料本可熔合成整体，却在外力下开裂分割并使裂口继续扩展
ground: 文化原有接触可趋同对应材料融合；不同群体因解释差异分开对应整体沿裂缝断裂
