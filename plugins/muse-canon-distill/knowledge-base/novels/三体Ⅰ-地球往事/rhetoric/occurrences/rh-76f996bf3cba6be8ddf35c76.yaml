review_status: reviewed
tenor: 各国政府因无法想象外星叛军真实存在而低估ETO，使其半公开扩张免受及时打击
vehicle: 想象力作为可拥有的资源储量，政府存量贫乏，认知工具不足以覆盖陌生威胁
ground: 无法构想非常事件对应资源不足；判断范围狭窄对应储量贫乏；缺少认知材料导致行动无力
