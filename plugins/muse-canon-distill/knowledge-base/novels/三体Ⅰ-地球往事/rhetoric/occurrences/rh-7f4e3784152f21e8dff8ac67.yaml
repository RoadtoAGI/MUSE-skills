review_status: reviewed
tenor: 三体要通过破坏基础研究能力，使地球文明长期无法提升技术并失去未来军事反抗能力
vehicle: 科学成为文明体内可被杀死的生命器官；器官死亡后身体仍在却不能成长和武装
ground: 科学维持技术发展对应生命器官维持身体；阻断研究对应杀死器官；技术停滞对应生长终止；军事能力受限对应解除武装
