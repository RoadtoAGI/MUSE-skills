tenor: 三球系统引发的大量、快速且持续出现的描述方程
vehicle: 密集雨滴突然倾泻、连续涌来的暴雨
ground: 方程数量陡增对应雨滴密度极高；新方程持续产生对应暴雨连续落下无间隙
