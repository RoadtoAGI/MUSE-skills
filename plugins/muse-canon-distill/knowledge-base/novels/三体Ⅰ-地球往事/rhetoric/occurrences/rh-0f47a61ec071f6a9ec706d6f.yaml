chapter: 第17章 三体问题
figure_type: metaphor
quote: 我们这些表面上走到一起的人，实际上是处于两个极端的敌人
sensory_mapping: 道路；空间位置；两极距离；群体同行
context_fact: 潘寒希望主降临惩罚人类，申玉菲则希望通过三体问题拯救主，双方已互相威胁。
image_mechanism: 组织成员先在可见道路上并肩，镜头再切到价值坐标，二者被猛然拉到轴线两端；表面近与实质远同时保持。
property_alignment: 共同组织身份对应走到一起；共享对主信仰对应同一路段；降临毁人和解题救主对应相反方向；势不两立对应两端距离最大
context_alignment: 汪淼刚因共同游戏感到距离拉近，此处同一空间词汇反转：共同组织并不保证真正接近。
narrative_function: 首次明确ETO内部派系裂痕，并为申玉菲被杀提供动机。
transfer_rule: 写联盟内部分裂时，应分别建立表面汇合依据和价值坐标，再把目标放到可说明的相反端点。
failure_boundary: 双方只是策略差异、最终目标一致或不存在共同组织表面时，“两个极端敌人”会夸大裂痕或缺少反差。
