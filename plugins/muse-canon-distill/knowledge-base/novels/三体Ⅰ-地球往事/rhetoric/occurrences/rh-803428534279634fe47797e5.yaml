image_mechanism: 高亮火海中的黑斑被剥去物质重量，只留下暗影沿不可预测路线滑行；陌生天体现象因此获得幽灵般的无根运动。
property_alignment: 黑子颜色阴暗对应幽灵暗影；无规则路线对应幽灵不可预测的游荡；在火海表面漂浮对应无实体支点的悬行
context_alignment: 文明正被巨日吞噬，死亡关联使幽灵兼顾黑子外观和灾变氛围。
narrative_function: 在火海壮观中加入死亡预兆和不可控运动。
transfer_rule: 用幽灵写移动斑影时，应同时对齐低实体感、暗色轮廓和缺乏可预测轨道的漂浮方式。
failure_boundary: 边界清晰、轨迹规则或有明确机械支撑的黑色物体不具幽灵的无根与飘忽。
