review_status: reviewed
tenor: 湖泊急剧蒸发后成团上升并向顶部扩散的白色水汽
vehicle: 爆炸后形成柱茎与膨大云冠的蘑菇云
ground: 水汽先集中上冲再在高处弥散对应蘑菇云柱上升、顶部扩张；成团白云的轮廓对应蘑菇状云冠
