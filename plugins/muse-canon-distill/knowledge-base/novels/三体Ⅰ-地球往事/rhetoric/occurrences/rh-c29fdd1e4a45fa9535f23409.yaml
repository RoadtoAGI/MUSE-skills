tenor: ETO内部存在目标、信仰和阶层来源不同且相互冲突的多个派别
vehicle: 一整块坚硬铁板材质均一、无接缝、受力时共同运动且不从内部裂开
ground: 组织统一对应铁板整体；派别差异对应材质接缝；内部冲突对应铁板裂分；力量不能完全合一
