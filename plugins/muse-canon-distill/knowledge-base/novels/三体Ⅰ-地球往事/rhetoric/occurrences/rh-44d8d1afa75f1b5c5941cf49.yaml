context_fact: 叶文洁处决潘寒后向组织介绍汪淼，明确三体主把他的纳米研究视为首要威胁。
image_mechanism: 实验室技术被压成地表一簇危险火苗，发展曲线像火势外扩；三体文明居高临下准备在其形成大火前盖住氧气。
property_alignment: 新兴纳米技术对应初燃火苗；技术突破潜力对应火势蔓延；威胁三体舰队对应可能烧成大火；智子干扰与打击对应扑灭；研究终止对应火焰熄灭
context_alignment: 三体组织以毁灭人类技术为任务，火灾词把科研潜力从人类进步重写为入侵者眼中的危险扩散。
narrative_function: 直接揭示汪淼被针对的原因，并把个人研究接入星际战争主线。
transfer_rule: 用扑灭写技术压制时，应说明技术如何增长扩散、威胁对象、压制手段和是否能阻断再燃。
failure_boundary: 技术成熟稳定而非扩散、打击只延缓进度或知识已有多处备份时，扑灭会夸大可消除性。
