chapter: 第22章 地球叛军
figure_type: simile
quote: 一个字一个字地说，像怕她教育的孩子听不懂似的
sensory_mapping: 听觉节拍；逐字停顿；教学场景；耐心压力
context_fact: 潘寒不接受处分并反过来要求统帅选择派系，叶文洁重申该要求无权由他提出。
image_mechanism: 完整判决被拆成一颗颗落下的字，每个停顿都像教师确认学生跟上；慢速表面耐心，实际封死装糊涂和讨价还价的缝隙。
property_alignment: 纪律条款对应教学内容；潘寒拒绝服从对应孩子未理解；逐字慢说对应教师分解难点；明确申诉与责任对应检查理解边界
context_alignment: 它延展前面的犯错孩子框架，却新增逐字教学动作，把温柔权威推进为最终程序告知而非单纯复称。
narrative_function: 延缓处决前节奏，让处分程序显得清楚、从容且不可逆。
transfer_rule: 以教孩子听懂写慢语时，应让信息可拆分、对方确有拒绝或误解表现，并让停顿承担确认而非迟疑。
failure_boundary: 说话慢源自恐惧、语言障碍或现场噪声，或对方其实理解充分并善意协商时，儿童教育框架会误判原因。
