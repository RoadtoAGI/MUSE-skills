tenor: 叶文洁在紧张消退后重新体验文革创伤，记忆接连复苏并造成日益强烈的精神痛苦
vehicle: 表面冷却熄灭的灰烬中残存火星，重新引燃多处火头并蔓延成旺火灼伤内部
ground: 被压抑记忆看似平息对应火被灰覆盖；回忆重新出现对应余火复燃；痛苦加剧对应火势越烧越旺并灼伤
