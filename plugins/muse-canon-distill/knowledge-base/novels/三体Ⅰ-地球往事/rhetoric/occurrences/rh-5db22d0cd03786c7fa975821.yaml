tenor: 汪淼在星空下感到自己被未知宇宙力量全盘观察且无法藏身
vehicle: 巨大放大镜下裸露、被观察者看清每一细节的小虫
ground: 夜空笼罩全域对应放大镜覆盖观察面；个人相对宇宙渺小无掩护对应镜下小虫被放大暴露
