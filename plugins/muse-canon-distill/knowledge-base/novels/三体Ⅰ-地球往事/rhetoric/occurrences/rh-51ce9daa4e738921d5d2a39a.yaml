quote: 对于拯救派而言，信息的丢失如同基督教丢失了圣经、伊斯兰教丢失了古兰经
sensory_mapping: 文本载体；神圣话语；档案被抹除；信徒失据；共同体震动
context_fact: 降临派把截留信息存于审判日号并可随时删除，拯救派因此不敢武力夺船。
image_mechanism: 计算机文件被赋予经典地位，删除硬盘数据等同从宗教历史中抽走神言；数字信息的技术脆弱性瞬间转化为信仰根基坍塌。
property_alignment: 三体原始信息对应神圣启示；信息文件对应宗教经典；拯救派对应信徒共同体；三体世界被称主对应经典来源神圣；永久删除对应经典失传；不敢攻击对应信徒保护经书
context_alignment: 拯救派已经形成三体教，经典类比准确解释他们为何宁肯容忍敌对降临派也不冒险毁坏信息。
narrative_function: 用跨宗教共同机制说明信息的不可替代价值和审判日号的人质效应。
transfer_rule: 把信息库类比宗教经典时，应确认信息被视为最高权威原话、组织解释与仪式依赖它、且毁损无法由其他副本替代。
failure_boundary: 信息只是可更新技术资料、另有完整备份，或群体信仰不依赖文本权威时，丢失经典的后果会被夸大。
