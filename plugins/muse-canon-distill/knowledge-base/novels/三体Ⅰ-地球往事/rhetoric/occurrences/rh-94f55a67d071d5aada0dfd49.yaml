tenor: 巨月由满到缺掠过天空的壮丽视觉运动与舒缓琴声之间的契合
vehicle: 不可见音乐凝结成有形、有光、有轨迹的宇宙实体景象
ground: 月相变化节奏对应旋律舒缓推进；银光与曲调美感一致对应声音获得可见色泽和形态
