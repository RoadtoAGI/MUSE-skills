quote: 人们就像等待最后审判日那样等着结果
sensory_mapping: 时间悬置；法庭判决；末日威胁；群体心理
context_fact: 几十种模型均完成计算，文明把预测太阳作为世界中心活动，却不断因结果错误而毁灭。
image_mechanism: 计算结果从一组数字升格为高处即将宣读的判词，整个文明站在下方等待；模型真假和文明生死被压进同一个不可逆宣判时刻。
property_alignment: 模型验证结果对应审判判词；文明全体受影响对应全人类受审；预测正确可生存对应获救；错误导致毁灭对应末日惩罚；无法催促结果对应等待审判
context_alignment: 说话者是失意爱因斯坦，科学验证被宗教末日化，准确表现三体科学承受的生存压力。
narrative_function: 校准三体人等待计算的心理强度，并解释模型失败为何摧毁科学信念。
transfer_rule: 用终极审判写等待时，应让结果具有全体性、不可逆性、外部宣判和生死两极后果。
failure_boundary: 结果可反复试错、影响局部或参与者能随时改判时，末日审判会夸大一次计算的终局性。
