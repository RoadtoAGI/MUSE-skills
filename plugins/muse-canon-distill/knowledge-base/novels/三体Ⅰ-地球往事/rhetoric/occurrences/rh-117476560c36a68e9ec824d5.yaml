tenor: 从行星方向看到的三颗部分错开的太阳形成的复合亮斑
vehicle: 黑暗中睁开、具有多层轮廓并发出强光的巨大眼睛
ground: 叠加圆形日面对应眼球与虹膜层次；太阳光集中射来对应眼睛亮起并朝观察者凝视
