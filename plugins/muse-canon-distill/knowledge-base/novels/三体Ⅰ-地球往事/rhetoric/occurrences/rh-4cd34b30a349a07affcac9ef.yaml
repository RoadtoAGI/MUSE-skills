quote: 人们像小学生那样真诚地接近科学
sensory_mapping: 课堂；课本；举手求知；低起点；向前靠近
context_fact: 高校恢复、名著抢购、工厂重视技术革新，全国科学大会宣告科学春天。
image_mechanism: 经历浩劫的成年人集体回到课桌前，放下政治口号，以学生身份重新学习；“接近”让科学像讲台上的对象逐步走近。
property_alignment: 社会知识重建对应新生入学；科学共同体对应课堂与教师；公众真诚信任对应小学生专注；奋斗天真对应经验不足；脚踏实地对应从基础作业开始
context_alignment: 齐家屯孩子刚拿破课本上山求教，真实小学生形象为全国姿态提供近邻参照，使比喻具体。
narrative_function: 概括科学复兴的纯真气氛，同时保留其幼稚与可塑两面。
