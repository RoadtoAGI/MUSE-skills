tenor: 潘寒头颅被扭转一百八十度并因颈椎折断与仍抽搐的身体完全失去协调
vehicle: 一个原本独立的陌生物体只是被临时放在躯干旁，从未与身体组成同一生命
ground: 身体抽搐而头完全静止对应两件物体没有联动；头颅方向异常对应它与躯体缺乏自然连接
