tenor: 监听屏上由无意义随机噪声组成、沿时间无限延伸而始终不出现智慧信息的电波曲线
vehicle: 大小不等的沙粒首尾排成只有长度的一维沙漠，可无限行走却没有道路、生命或归宿
ground: 离散波峰对应沙粒；随机峰高对应沙粒大小不一；无限时间轴对应无尽沙漠；无信息对应荒漠无生命和地标
