chapter: 第24章 红岸之六
figure_type: metaphor
quote: 人类的疯狂已达到了文明史上的顶峰
sensory_mapping: 垂直攀升；山峰；极高处；临崖危险；历史地形
context_fact: 两大阵营部署大量一触即发核武，单艘潜艇即可杀死数亿人，普通人却习以为常。
image_mechanism: 文明史被折成一条山脉，每次战争与武器升级是更高坡段，核竞赛站到最高峰；峰顶并非成就，而是一步即可坠毁世界的危险边缘。
property_alignment: 文明历史对应山脉；疯狂累积对应攀升；核武破坏力对应海拔高度；美苏争霸最激烈对应抵达峰顶；全球毁灭风险对应峰顶临崖
context_alignment: 通常“顶峰”赞美成就，此处把技术能力与非理性绑定，反转进步叙事为自毁高度。
narrative_function: 以单一纵轴概括冷战升级，把叶文洁的时代观察放到文明极限尺度。
transfer_rule: 用顶峰写极端状态时，应给出历史基线、持续上升指标和为何当前确实高于此前阶段。
failure_boundary: 比较资料不足、后续或同期存在更高强度，或现象只是局部时，“史上顶峰”会成为绝对化判断。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 美苏争霸时期核武竞赛把人类自毁能力与非理性推到前所未有的最高强度
vehicle: 攀登者沿山体不断上升，最终抵达全山最高峰顶
ground: 疯狂程度随历史累积上升对应持续登山；核武足以多次毁灭地球对应高度超过此前所有阶段
