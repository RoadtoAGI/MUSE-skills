tenor: 监听员最初强烈的发现喜悦在意识到个人生活不会改变后迅速减弱
vehicle: 高温物质失去热源后散热降温，由炽热转为冰凉稳定
ground: 强烈情绪对应高温；现实思考对应撤去热源；情绪减退对应冷却；剩下凄凉对应低温状态
