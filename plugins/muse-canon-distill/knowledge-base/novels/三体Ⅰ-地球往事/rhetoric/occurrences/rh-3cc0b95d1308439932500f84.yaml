chapter: 第33章 监听员
figure_type: metaphor
quote: 激动和兴奋很快冷却下来
sensory_mapping: 热度下降；暖意散失；冷表面；速度快；余温消退
context_fact: 地球天堂真实存在，却不属于地位卑微、即将失业老去的监听员。
image_mechanism: 信息涌入带来的热量曾充满身体，个人处境像冷环境迅速吸走它；天堂仍明亮，触不到它的人只剩低温凄凉。
property_alignment: 发现兴奋对应高热；地球天堂对应热源；无法拥有对应隔断热源；自问现实对应散热过程；失落对应冷却；凄凉对应寒冷终态
context_alignment: 三体大地本就冰冷金属，情绪冷却让外部气候进入人物内心。
narrative_function: 完成发现后的情绪反转，并推动他从被动向往转向主动警告。
transfer_rule: 用冷却写情绪消退时，应给出原热源、散热原因、速度和冷却后的具体情感残留。
failure_boundary: 情绪被另一种同样强烈的愤怒替代、并未减弱，或变化缓慢无触发时，冷却不准确。
