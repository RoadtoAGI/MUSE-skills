tenor: 夕阳沉入云海时圆形轮廓在红光扩散中消失，大片天空和云层被染成血红
vehicle: 炽热生命体在下沉中熔解并流血，血液从破开的身体向周围液体和空气大面积扩散
ground: 太阳轮廓消融对应身体熔化；红色霞光扩散对应血液弥散；下沉过程对应生命流失；血红覆盖云天
