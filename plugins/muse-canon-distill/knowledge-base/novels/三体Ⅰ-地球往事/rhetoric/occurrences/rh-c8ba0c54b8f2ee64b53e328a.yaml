chapter: 第12章 三体、墨子、烈焰
figure_type: simile
quote: 已脱水和未脱水的人都燃烧起来，像无数扔进炉膛的柴火
sensory_mapping: 视觉；高温；数量；燃烧时长
context_fact: 巨日近距离升起，脱水者和未脱水者都无法抵御热量，火焰短暂明亮后熄灭。
image_mechanism: 人群的身份与动作被瞬间抹去，只剩一件件投入巨大热源的可燃物；“扔进”还把太阳辐射改写成不可抗拒的外力。
property_alignment: 人身起火对应木柴燃烧；密集人群对应无数柴块；很快熄灭对应燃料被炉温迅速耗尽；巨日环境对应包围燃料的炉膛
context_alignment: 文明个体在天体尺度前失去主体性，炉膛正好把巨日的封闭高温和人的燃料化同时呈现。
narrative_function: 用残酷物化显示灾变速度和生命的绝对无力。
transfer_rule: 表现群体被压倒性热源吞噬时，喻体需同时匹配可燃性、投入方式、数量和耗尽速度。
failure_boundary: 人物仍能抵抗逃生、火势缓慢或热源只局部接触时，柴火入炉会过早取消人的行动空间。
