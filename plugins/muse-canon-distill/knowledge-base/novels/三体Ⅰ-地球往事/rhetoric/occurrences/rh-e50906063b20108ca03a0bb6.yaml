context_fact: 周文王收起脱水追随者携带。
image_mechanism: “放气”先解释为何完整人体没有骨骼阻力，“卷”再把扁软结果转成手部可完成动作，便携性随之可感。
property_alignment: 人体失去体积支撑对应皮球放气瘪软；皮层可折叠对应橡胶球皮可压卷
context_alignment: 它补足熔蜡喻体未说明的中空瘪软和可卷特征。
narrative_function: 解释脱水人的便携性并制造物化生命感。
transfer_rule: 连续多喻体解释设定时，后一个应补前一个缺失的结构或操作属性，而非重复“柔软”。
failure_boundary: 对象仍有硬骨架、会碎裂或只能折叠不能卷时，放气皮球会误写内部结构。
