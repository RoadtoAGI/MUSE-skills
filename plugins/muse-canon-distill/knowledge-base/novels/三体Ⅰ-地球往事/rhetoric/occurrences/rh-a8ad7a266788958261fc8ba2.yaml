tenor: 两根竖立钢柱间平行张紧五十根飞刃丝形成的隐形切割装置及整场伏击行动
vehicle: 古筝由两端支撑和多根平行琴弦构成，演奏时琴弦被拨动并发出声音
ground: 两钢柱对应琴架两端；平行纳米丝对应琴弦；船穿过使丝受力对应拨弦；整套装置横跨水道对应巨型古筝
