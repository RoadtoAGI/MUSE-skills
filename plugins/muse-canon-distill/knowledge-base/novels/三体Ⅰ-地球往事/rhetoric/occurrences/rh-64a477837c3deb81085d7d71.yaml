tenor: 大撕裂后残存的微小生命潜能重新繁衍，恢复生态并最终演化出新文明
vehicle: 休眠种子在毁坏土壤中保存胚芽，条件恢复后破壳萌发
ground: 少量幸存生命携带未来可能对应种子保存胚体；环境稳定后重新繁殖对应种子遇到条件发芽
