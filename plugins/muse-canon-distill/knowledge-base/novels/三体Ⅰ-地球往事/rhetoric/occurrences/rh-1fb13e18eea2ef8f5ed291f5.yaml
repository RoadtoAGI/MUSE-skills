review_status: reviewed
tenor: 人在事件发生当时感到足以摧毁生活的重大危机
vehicle: 头顶天空坍塌、整个生存空间被压毁
ground: 危机被感为覆盖全部生活对应天空笼罩整个世界；事件似乎会摧毁秩序对应天穹坠落压垮一切
