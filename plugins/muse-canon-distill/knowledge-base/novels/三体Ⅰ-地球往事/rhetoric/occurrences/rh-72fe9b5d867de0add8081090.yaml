tenor: 不同轮三体文明抵达的历史发展阶段
vehicle: 沿一条分段道路行进并在途中某处止步的旅程
ground: 历史阶段先后排列对应道路里程依次展开；文明毁灭时所处阶段对应旅人停在沿途节点
