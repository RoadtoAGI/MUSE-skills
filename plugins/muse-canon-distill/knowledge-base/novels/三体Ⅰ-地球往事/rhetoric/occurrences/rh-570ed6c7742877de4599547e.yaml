tenor: 描述零、一、二球宇宙的寥寥几条简单方程
vehicle: 深秋枝头落尽后残留、稀疏飘落的几片枯叶
ground: 方程数量少而分散对应落叶寥落；模型缺乏变化和生命感对应晚秋叶片枯萎将尽
