chapter: 第17章 三体问题
figure_type: simile
quote: 前面的无球、一球和二球宇宙表现为一条或寥寥几条描述它的方程，像几片晚秋的落叶
sensory_mapping: 视觉；数量密度；季节；飘落
context_fact: 无球、一球和二球系统分别空无、静止或固定周期，魏成觉得它们都是死亡的符号。
image_mechanism: 抽象公式被写到空旷意识天空中，稀少符号从完整知识树上飘成枯叶；数量贫乏和系统死亡由同一秋景合并。
property_alignment: 方程寥寥对应叶片稀少；简单关系对应叶面单薄；系统无生命变化对应晚秋枯败；空背景对应落叶周围的萧疏空间
context_alignment: 下一句方程将如暴雨涌现，晚秋落叶先建立稀薄、干静基线，便于数量和生命状态同时翻转。
narrative_function: 把简单方程的贫乏写成季节性死亡，反衬三体复杂性突然繁生。
transfer_rule: 将少量抽象元素比作落叶时，应同时利用数量稀疏、材质枯薄和季节终结，并设置后文密度对照。
failure_boundary: 少数方程高度丰饶、动态强烈或语境强调精炼之美时，晚秋落叶会错误赋予衰败感。
