tenor: 森林被砍光后裸露、不断扩大的荒地斑块
vehicle: 活体皮肤被强行剥下，露出疼痛、脆弱且颜色异常的内部组织
ground: 树木覆盖层被移除对应皮肤从身体表面剥离；裸地与周围森林色差对应创面在完整皮肤上显眼
