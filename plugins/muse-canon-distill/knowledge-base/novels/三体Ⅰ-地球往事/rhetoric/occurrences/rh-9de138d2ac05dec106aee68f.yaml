chapter: 第24章 红岸之六
figure_type: simile
quote: 仿佛是大兴安岭被剥去皮肤的部分
sensory_mapping: 视觉裸露；皮肤触痛；颜色反差；创面扩张；身体尺度
context_fact: 叶文洁昔日战友每日疯狂砍伐山林，荒地逐渐连片，幸存树林反而显得异常。
image_mechanism: 大兴安岭被赋予一具铺满绿色皮肤的身体，伐木不是取走材料，而是一片片撕下保护层；连片荒地成为扩大且无法遮掩的伤口。
property_alignment: 森林覆盖对应皮肤；山体对应身体；砍伐树木对应剥皮；裸露荒地对应创面；荒地连片对应伤口扩大；残存林木对应未剥皮肤孤岛
context_alignment: 叶文洁由环境破坏推及人类疯狂，皮肤创伤把生态损失转换成对有生命大地的直接暴力。
narrative_function: 让长期伐木的面积变化具备身体痛感，强化她对人类破坏性的厌恶。
transfer_rule: 把毁林写成剥皮时，应对应原覆盖层、去除动作、裸露后脆弱性、颜色边界和创面扩张。
failure_boundary: 植被本来稀疏、砍伐后迅速自然恢复，或只是季节性落叶时，剥皮会误写永久伤害。
