tenor: 老人脸上长而柔缓、彼此协调的皱纹线条
vehicle: 多条曲线主动调整自身走向，共同构成和谐图案
ground: 皱纹曲率柔和平顺对应线条避免尖锐冲突；多条纹路共同组织面孔对应各部分协力形成整体和谐
