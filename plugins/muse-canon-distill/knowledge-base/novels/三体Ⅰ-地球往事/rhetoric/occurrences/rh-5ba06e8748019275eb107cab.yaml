chapter: 第20章 三体、爱因斯坦、单摆、大撕裂
figure_type: simile
quote: 那些皱纹都很长，曲线也很柔和，像在努力造就一种和谐
sensory_mapping: 视觉；线条；柔性运动；构图
context_fact: 汪淼近看流浪老人的脸，准备确认他是否为爱因斯坦，琴声也带自得和谐。
image_mechanism: 静止皱纹被赋予缓慢创作动作，每条线都像在面孔上寻找不相撞的弧度；衰老痕迹因此不显破败，而像共同完成一幅协调构图。
property_alignment: 皱纹长曲线对应构图线条；曲率柔和对应追求和谐的避免冲突；多纹共处对应多声部协调；脸部整体安宁对应努力结果趋于和谐
context_alignment: 老人正拉小提琴，和谐既是视觉构图也是音乐术语，面容与琴声在同一审美原则下相连。
narrative_function: 把爱因斯坦的衰老与内在温和写成面部线条动作，深化人物气质。
transfer_rule: 让静态纹理承担意图时，应从曲率、相互关系和整体效果推导具体“努力”，并与人物现场活动呼应。
failure_boundary: 皱纹短促尖锐、彼此杂乱或人物气质明显紧绷时，造就和谐会违背可见线条。
quality_assessment: effective
