review_status: reviewed
tenor: 三体通过持续制造可观测异常，让地球公众误以为科学规律失效，形成系统性错误世界观
vehicle: 建造者搭起一整座人工宇宙，表面景象完整连贯却由虚假材料和规则构成
ground: 连续异常对应建筑构件；错误解释体系对应虚假宇宙；计划性制造对应施工；公众长期居于假象对应进入建筑
