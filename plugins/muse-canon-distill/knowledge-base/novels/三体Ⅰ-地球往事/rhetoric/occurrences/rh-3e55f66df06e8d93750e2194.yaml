context_fact: 魏成从小数学极强却懒于推导和研究，第三球带来的复杂性第一次使他全力思考并着迷。
image_mechanism: 他此前接触数学的每次小胜被排列成没有承诺的艳遇，三体问题则作为唯一对象突然建立深关系；抽象研究兴趣获得爱情的排他性和持续欲望。
property_alignment: 随手得出答案对应寻欢式短接触；不珍惜天分对应放荡者不承担关系；长期研究三体对应专一爱情；第一次全功率投入对应突然动真情
context_alignment: 魏成自嘲、冷淡的叙述声线使夸张浪子比喻既幽默又准确，随后申玉菲的婚姻反而缺少爱情，形成结构反讽。
narrative_function: 把研究动机从能力展示升级为情感归宿，解释他多年执着。
transfer_rule: 用爱情写职业投入时，应建立此前短暂关系、首次专一对象、持续承诺和行为改变的完整情感史。
