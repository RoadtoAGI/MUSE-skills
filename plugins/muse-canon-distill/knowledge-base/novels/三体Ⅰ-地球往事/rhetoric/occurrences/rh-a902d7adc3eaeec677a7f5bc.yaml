tenor: 体量六万吨、设施和人员密集且可在海上独立运作的审判日号
vehicle: 由坚硬钢铁构成、托载完整聚落并在海面漂移的一座小岛
ground: 船体庞大宽阔对应岛屿陆地；钢制结构对应坚硬地质；海上独立承载基地对应孤岛自成空间
