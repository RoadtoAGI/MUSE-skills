context_fact: 女官员在大史解释为何白天切船更有效后直接评价他，汪淼稍后重复这一称呼。
image_mechanism: 大史的市井警察外形被一句话剥去，露出能把人当几何截面计算的魔鬼面孔；标签承担旁人无法承受的残酷。
property_alignment: 古筝邪招对应魔鬼刑具；按坐卧计算对应冷酷无情；全船死亡对应地狱规模；女官员震惊对应见魔判断；大史神态平常对应非人反差；汪淼后续复述对应标签成立
context_alignment: 这里是魔鬼框架首现，L2342汪淼引用属于复指，已从 explicit 纳入改为排除。
narrative_function: 给方案的伦理越界命名，同时把大史塑成令人畏惧却必要的执行者。
transfer_rule: 用魔鬼称人时，应依托具体越界行为、他人的恐惧、非人化判断及角色是否仍保留复杂人性。
failure_boundary: 人物只说冒犯笑话、没有造成严重伤害的能力，或评价来自纯私人仇恨时，魔鬼会扁平化而不解释行为。
