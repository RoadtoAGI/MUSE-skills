image_mechanism: “世界”继承上一句搭房子的建筑形态，纯理论成为唯一承重件；它断裂时，没有第二道梁柱接力，生命整体随之下落。
property_alignment: 理论承担全部意义对应支柱承重；实验摧毁信念对应支撑崩塌；自杀对应整体失去承托
context_alignment: 巴赫建筑意象紧邻在前，使支撑不是临时套语。
narrative_function: 说明单一价值系统的脆弱。
transfer_rule: 写精神支撑时，应先交代承重结构是否单一、负载是什么、失效后有没有冗余，才能让坍塌具因果性。
failure_boundary: 人物还有亲情、责任或其他价值支柱时，宣称“没有什么支撑”可能是人物判断而非完整事实，不能外推。
