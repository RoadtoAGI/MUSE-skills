tenor: 核弹女孩听见母亲消息后，眼神由表演性神采转为直接泄露真实情感和软弱
vehicle: 眼睛成为从外表进入内心的开放通道，旁观者可沿其直达隐蔽心灵
ground: 眼神暴露情绪对应通道传递内部；平时表演遮蔽内心对应道路曾封闭；母亲话题打开弱点对应入口突然贯通
