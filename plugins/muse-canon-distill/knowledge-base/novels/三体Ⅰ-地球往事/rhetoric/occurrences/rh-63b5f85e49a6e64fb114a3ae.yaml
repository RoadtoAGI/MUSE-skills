tenor: 以可执行的海量枚举筛选替代难以获得的闭式逻辑解
vehicle: 将一种形态的障碍加工成另一种可搬运、可计量的材料
ground: 不可直接推导的理论困难对应原形障碍难处理；拆成大量计算步骤对应把障碍换成可累计数量
