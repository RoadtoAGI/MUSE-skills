chapter: 第33章 监听员
figure_type: metaphor
quote: 他就有了使自己这卑微的生命燃烧一次的机会
sensory_mapping: 火焰点起；亮光；热量释放；短暂燃烧；灰烬代价
context_fact: 若政府尚未发诱骗信息，他能抢先警告地球，代价将是被处死。
image_mechanism: 六十万时灰暗生命被压成一小块燃料，红色发射键是点火器；按下一次便把余生全部转成跨越一千二百光年的光。
property_alignment: 卑微一生对应暗燃料；警告决定对应点火；电波发射对应火光远射；拯救地球对应照亮他者；获罪处刑对应自我耗尽；一次机会对应燃烧不可重复
context_alignment: 外部大地冷硬、社会压抑情感，主动燃烧成为对三体冷静麻木价值的直接反叛。
narrative_function: 把一次按键提升为生命自我实现，解释他为何毫不犹豫。
transfer_rule: 用生命燃烧写关键行动时，应有长期暗淡背景、一次性释放、外部照亮、能量耗尽和真实代价。
failure_boundary: 行动可反复、风险很小且对他人无影响，或人物还有长期实现意义的稳定路径时，一次燃烧会夸大决绝。
