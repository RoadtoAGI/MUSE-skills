tenor: 丁仪曾期待宏原子研究能越过既有理论限制，让基础物理进入新的知识层级
vehicle: 受阻者蓄力冲破封闭墙面或敌方防线，从狭小一侧进入尚未抵达的开阔区域
ground: 既有理论限制对应壁垒；新发现对应冲击力量；理解新结构对应破口；学科进入新阶段对应穿越防线
