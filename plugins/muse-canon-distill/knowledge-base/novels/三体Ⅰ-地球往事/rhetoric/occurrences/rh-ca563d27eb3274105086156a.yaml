chapter: 第12章 三体、墨子、烈焰
figure_type: metaphor
quote: 巨日的表面构成了火焰的大地。他感觉自己正向这灿烂的地狱坠落
sensory_mapping: 视觉；方向反转；坠落动觉；高温
context_fact: 巨日升至正空遮住大部分天空，汪淼先感到仰视变成俯视，周围人和土地正在燃烧。
image_mechanism: 天空与地面的坐标先被翻面：头顶日面变成脚下火地，原本仰望的身体随即获得向下坠落的内耳错觉；炽亮景象因此成为既壮丽又致命的地狱入口。
property_alignment: 巨日连续表面对应可落脚的大地；上下感颠倒对应天面翻到脚下；日面火焰对应地狱火场；眩晕失重对应向深处坠落
context_alignment: 上一句大地沿光墙下沉已动摇参照系，此处巨日占满天顶，视野条件足以完成天地翻转而非抽象夸张。
narrative_function: 把天体灾变推进为第一人称坠落体验，使壮观和恐怖同时达到峰值。
transfer_rule: 写方向错觉时，应先建立占满视野的新表面，再让观察姿势、重力感和目的地危险按同一次坐标翻转联动。
failure_boundary: 天体仍只是远处小亮点、人物没有眩晕或地表未受火灾时，坠向地狱会失去视觉和身体依据。
quality_assessment: exemplary
