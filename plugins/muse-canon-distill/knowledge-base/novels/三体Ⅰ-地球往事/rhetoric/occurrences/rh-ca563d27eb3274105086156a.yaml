tenor: 巨日覆盖头顶后产生的上下颠倒与朝日面跌落的眩晕感
vehicle: 位于脚下、由火焰构成且会吞噬坠落者的地狱地面
ground: 日面铺满视野成为连续表面对应大地承接视线；身体感觉朝太阳靠近对应坠向下方地面和地狱
