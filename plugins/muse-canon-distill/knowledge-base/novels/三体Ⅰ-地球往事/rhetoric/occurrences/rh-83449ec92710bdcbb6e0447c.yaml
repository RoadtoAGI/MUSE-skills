review_status: reviewed
tenor: 智子临时从真空取得高能粒子航行所需能量，能量守恒的平衡要延迟到质子衰变时才恢复
vehicle: 借款人从债主处先取走本金，把账记在名下，并把还款日拖到极遥远的未来
ground: 真空释放能量对应债主出借本金；智子当下使用对应借款人支取；守恒仍须满足对应债务仍记账；质子衰变时回补对应到期归还
