chapter: 第34章 智子
figure_type: metaphor
quote: 智子是从真空结构中‘借’用能量，但归还遥遥无期，要等到质子衰变之时
sensory_mapping: 宇宙账本；借据；支取能量；漫长账期；末日还款
context_fact: 两个智子需以接近光速飞往地球，科学执政官用延迟回补解释表面违反能量守恒的加速方式。
image_mechanism: 抽象守恒式被摊成跨越宇宙寿命的账本：真空先划出一笔能量，智子立刻花掉，欠项一直悬到质子衰变才在总账上勾销。
property_alignment: 真空结构对应债主；可提取能量对应本金；智子加速对应借款用途；能量缺口对应欠款；守恒定律对应账目平衡；质子衰变对应还款日；宇宙末日对应超长账期
context_alignment: 说话者正向执政官解释反直觉物理，带引号的‘借’把看似破律转成只是结算时间尺度异常。
narrative_function: 让真空取能的因果方向和延迟代价可理解，同时强调智子技术跨越文明时间尺度。
transfer_rule: 用借贷写守恒交换时，应明确能量来源、即时受益者、未消失的欠项、结算事件和延期尺度。
failure_boundary: 能量被永久无中生有、没有可定义的回补过程，或交换双方同时等量得失时，借款与遥期归还的账本模型会误导。
quality_assessment: effective
