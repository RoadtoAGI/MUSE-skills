figure_type: simile
quote: 像黑天鹅绒上发亮的水银
sensory_mapping: 视觉；材质；明暗
context_fact: 倒计时从照片进入直接视野，闭眼也不消失。
image_mechanism: 把无内容的闭眼黑场变成吸光织物，再把细数字液化成金属亮痕；黑、亮、滑三种材质对比同时成像。
property_alignment: 全黑视野对应吸光黑天鹅绒；银白细亮数字对应水银金属反光；清晰边缘从暗面突显对应水银高光
context_alignment: 极端黑白是汪淼当下真实视野，水银的亮与流动潜势又延续数字的异物感。
narrative_function: 固定倒计时的视觉质感并强化无法遮蔽。
transfer_rule: 描写暗背景上的微亮物时，可分别为背景和亮体选材质，让吸光性、反射性与边缘形态逐项对应。
failure_boundary: 彩色背景、漫射光团或边缘毛糙的对象不具备黑天鹅绒与水银的高对比和金属光泽。
