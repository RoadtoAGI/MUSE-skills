review_status: reviewed
tenor: 在海量高能粒子撞击记录中捕捉极少数真正击中靶核且结果有细微差异的有效事件
vehicle: 密集夏日暴雨中逐滴分辨，并从无数相似雨点找出唯一颜色略异的一滴
ground: 大量碰撞数据对应暴雨雨点；有效事件极少对应唯一异色雨点；差异细微对应颜色只稍有不同；筛选困难
