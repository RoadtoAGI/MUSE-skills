chapter: 第24章 红岸之六
figure_type: metaphor
quote: 雷达峰成了那些火海中逃生的鸟儿的避难所
sensory_mapping: 火焰海面；高温；飞行逃亡；安全岛；凄厉鸟鸣
context_fact: 砍伐后的山地燃起烧荒大火，基地里不断出现羽毛烧焦、哀鸣的鸟。
image_mechanism: 火焰铺平山谷成为会吞噬生命的海，鸟群不能落在燃烧波面，只能向雷达峰这座孤岛聚拢；避难仍带着烧焦痕迹。
property_alignment: 连片野火对应火海；未燃雷达峰对应安全岛；鸟群对应逃难者；飞离火区对应游离灾区；集中基地对应进入避难所；烧焦羽毛对应逃生创伤
context_alignment: 雷达峰既是叶文洁的避风空间，也是鸟类真实避难地，人和鸟在同一孤岛结构中并置。
narrative_function: 把毁林后果带到基地内部，以鸟叫让远处生态灾难无法被隔绝。
transfer_rule: 用火海与避难所写灾区时，应建立广域危险介质、少数安全高地、逃生路径和到达后的伤痕。
failure_boundary: 火势零散易绕过、基地同样燃烧或鸟类有大量其他栖息地时，唯一避难所会夸大孤立。
