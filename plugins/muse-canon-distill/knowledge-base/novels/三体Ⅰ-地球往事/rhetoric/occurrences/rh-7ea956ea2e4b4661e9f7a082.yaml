sensory_mapping: 网络空间；群体协作；代码汇聚；地理分布
context_fact: 警方追踪发现参与游戏编程者很多且遍布各地，未见单一正常商业开发主体。
image_mechanism: 看不见的游戏制作网络被套入当时已有的Linux协作图：各地节点分别写代码，成果沿网络汇入同一系统；陌生组织由熟悉先例显形。
property_alignment: 全球多地程序员对应Linux分布式贡献者；共同完成复杂软件对应协作维护同一代码库；非典型商业团队对应社区式开发；网络协调对应远程提交与整合
context_alignment: 徐冰冰是信息安全专家，使用近年的软件案例解释调查判断，技术类比符合角色知识且不夸成超自然。
narrative_function: 提供《三体》全球协作的现实机制，同时保留谁在组织、工具为何超前的谜团。
transfer_rule: 用已有项目解释协作模式时，应对应参与者分布、成果整合、治理形态和技术媒介，并明确尚未解释的差异。
failure_boundary: 《三体》是否开放源码及如何治理尚不明；类比只支持分布式开发，不能推断其许可证、社区价值或具体工具与Linux相同。
