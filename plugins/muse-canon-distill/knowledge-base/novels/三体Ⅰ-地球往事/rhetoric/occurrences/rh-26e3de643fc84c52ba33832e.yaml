figure_type: metaphor
quote: 运算速度的瓶颈就在他们那里
sensory_mapping: 狭窄空间；液体流动；拥塞；流量
context_fact: 外存人员文化程度较高却只能用记录本和笔保存中间结果，远慢于旗语门电路。
image_mechanism: 高速并行信息被汇入一个骤然收窄的口部，后方计算即使铺满大地，也要排队等纸笔逐条放行；性能短板获得清晰位置。
property_alignment: 全机数据流对应容器内液体；纸笔外存对应狭窄瓶口；记录速度慢对应低流量；其限制全机对应最窄处控制总体通过量
context_alignment: 下一段系统总线被写成河流，瓶颈先为信息流建立水力结构，又准确预示人列计算机的实际低效。
narrative_function: 在宏伟奇观中标出工程限制，使虚构计算机保留可信的系统思维。
transfer_rule: 用瓶颈诊断系统时，应找到所有流量必经的具体环节，并说明其容量为何低于上下游。
failure_boundary: 慢环节可被绕过、任务不经过它，或整体性能受多个同等限制时，把单点称为瓶颈会给出错误优化方向。
