figure_type: simile
quote: 它们那形状像长翅的散热片渐渐发出暗红色的光
sensory_mapping: 暗红热光；宽薄翼面；太空悬浮；对称伸展；散热
context_fact: 质子二维展开启动，三座聚变站正向巨型加速器提供能量。
image_mechanism: 立方发电站长出暗红色翼面，静止设备获得即将起飞般的轮廓；所谓翅膀承担的不是飞行而是把展开工程的废热扇入太空。
property_alignment: 外伸散热板对应翅膀；薄阔形态对应散热片；三座站围绕加速器对应飞体编队；暗红发光对应高温；能量启动对应翅面逐渐亮起
context_alignment: 质子即将从微观飞展成宏观结构，发电站先显出长翅轮廓，视觉上预演维度展开。
narrative_function: 给远距离能源设施提供可辨轮廓，并以红热变化显示启动进程。
transfer_rule: 以翅形写设备散热结构时，应匹配主体两侧展开、薄面比例、热交换功能和启动后的光热变化。
failure_boundary: 散热器为内部管道、外形厚重无翼面或设备没有显著排热时，长翅形象只剩拟物装饰。
