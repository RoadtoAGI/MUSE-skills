figure_type: simile
quote: 他们像一群不会游泳的落水者那样笨拙地挥动者四肢试图稳定自己，但还是不时相撞
sensory_mapping: 身体动觉；失重；四肢动作；碰撞
context_fact: 三日引力叠加使地表重力急剧减弱，人们双脚离地并以不同角度漂浮。
image_mechanism: 看不见的空气被赋予水的承托，脚下地面退远如池底；人们沿用有重力时的四肢动作，却像旱鸭子找不到有效划法，只能互撞。
property_alignment: 半空漂浮对应水中悬浮；失去地面支撑对应脚不着底；笨拙挥肢对应不会游泳者乱划；彼此碰撞对应无法控制方向
context_alignment: 角色从未经历失重，只能调用落水身体经验，类比同时解释动作形态和恐慌。
narrative_function: 把陌生引力灾变变成可感身体经验，显示权威人物瞬间失控。
transfer_rule: 写初次失重时，可选同样缺少固体支点的熟悉介质，并对应姿态、无效动作和方向失控。
failure_boundary: 受过失重训练、能用喷气或支点控制身体时，不会游泳的慌乱会低估适应能力。
