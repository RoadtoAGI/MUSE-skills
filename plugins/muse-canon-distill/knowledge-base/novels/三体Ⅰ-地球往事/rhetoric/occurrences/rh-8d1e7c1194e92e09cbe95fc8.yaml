tenor: 若雷政委因信任她受罚，叶文洁可能被一并处分但并非主要目标
vehicle: 随死者一同埋入墓穴、依附主葬者而毁掉的陪葬物
ground: 她受牵连而非案件核心对应陪葬品从属于主葬者；雷政委倒台会连带毁掉她对应墓葬封闭时附属物一同被埋
