context_fact: 审问者列出ETO三派均偏离她借三体改造人类的初衷，她承认自己的责任与无力。
image_mechanism: 叶文洁的首次信号和组织授权缩成一枚火种，文明缺陷、外星崇拜和求生欲成为燃料；火离手后按环境而非点火者意志选择路径。
property_alignment: 红岸回信对应最初火星；建立ETO对应点燃；三派动机对应不同燃料；组织扩张对应火面扩大；理念偏航对应风改变火向；威信调停失败对应扑救无效
context_alignment: 前章称运动已成燎原之势，此句由创始人视角回看火源，完成火种—燎原的责任链。
narrative_function: 用失控火势概括创始意图与组织后果的断裂，并让叶文洁承担起点责任。
transfer_rule: 用点火写行动后果时，应标明火种、可燃环境、自主扩张、偏离原意和点火者失去控制的阈值。
failure_boundary: 组织仍严格执行创始人命令、后果可随时撤回，或创始人根本未提供启动条件时，失控火灾会错配责任。
