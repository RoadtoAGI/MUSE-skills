figure_type: metaphor
quote: 在乱纪元和恒纪元的无规律交替中艰难地成长
sensory_mapping: 生命体量；生长过程；环境压力
context_fact: 多轮文明只能发展到石器或蒸汽时代便遭遇不可预测气候，成长时间长短差异巨大。
image_mechanism: 抽象技术积累获得身体：石器时代是幼小阶段，蒸汽时代是长大一截，灾变则反复冻伤或截断这具文明生命。
property_alignment: 技术复杂度增加对应生命体发育；文明需要连续恒纪元对应生物需要适宜环境；灾变中止进步对应成长被创伤截断
context_alignment: 游戏反复宣布文明毁灭与再生，生命成长词汇把每一轮脆弱发展接到同一物种延续线上。
narrative_function: 让技术史获得生命脆弱感，强化环境随机性对文明成熟的压制。
transfer_rule: 把制度或技术写成成长时，要指出起点、复杂度增加和环境如何促进或阻断发育。
failure_boundary: 短期指标上升、可逆调整或没有成熟方向的变化不构成生命成长，用此喻会暗示线性必然进步。
