tenor: 听见三颗金属球是核弹后，厅内所有人因恐惧瞬间停止动作，只有史强保持行动
vehicle: 液体或熔融物突然降温凝成固体，内部流动全部冻结
ground: 人群动作骤停对应物质从流动到固化；全厅同步静止对应整体凝固；大史独动对应固体中唯一未冻结部分
