tenor: 魏成面对社会交往时反应迟缓、投入极低且难以主动处理关系
vehicle: 人尚未完全清醒，感知和行动系统只部分工作
ground: 对社交信号反应迟钝对应半睡者感知模糊；能勉强生活却不主动经营对应身体醒一半仍低效行动
