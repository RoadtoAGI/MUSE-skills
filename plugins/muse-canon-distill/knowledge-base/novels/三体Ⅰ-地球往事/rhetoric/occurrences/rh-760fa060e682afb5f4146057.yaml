tenor: 高能智子反复穿透胶片或视网膜，以连续感光点逐笔形成文字和图形
vehicle: 绣针在布面反复穿入穿出，用密集针脚沿轮廓连成花纹
ground: 智子往返穿透对应针反复穿布；单个感光点对应针脚；点列成图对应针迹组成绣样；载体平面对应布面
