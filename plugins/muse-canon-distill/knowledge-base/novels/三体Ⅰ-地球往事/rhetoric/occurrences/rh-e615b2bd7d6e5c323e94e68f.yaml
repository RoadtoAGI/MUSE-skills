review_status: reviewed
tenor: 叶文洁再次被陌生年轻人从机场带上直升机，身体感受与多年前被押往红岸时高度重合
vehicle: 时间逆向运行，把年老的她送回第一次乘直升机、命运转折尚未发生的过去
ground: 相同交通工具和轰鸣重现对应过去场景回返；再次前往秘密基地对应命运轨迹倒回旧节点
