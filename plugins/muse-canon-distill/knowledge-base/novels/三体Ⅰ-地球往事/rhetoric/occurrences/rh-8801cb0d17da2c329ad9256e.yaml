context_fact: 到场者成绩最好、投入很深，博士生还把“生活”进一步改成“生命”。
image_mechanism: 日常生活被画成由时间、习惯和信念拼成的实体，游戏从外部娱乐卡入其中一格，并开始与原有部分共同承重。
property_alignment: 日常生活对应完整结构；游戏投入对应嵌入部件；持续影响对应部件固定；难以割舍对应移除会留下缺口
context_alignment: 潘寒借此测试依附程度，博士生的升级回答证明游戏已触及身份和生命意义，正合招募需要。
narrative_function: 将玩家投入从兴趣提升为生活依附，为接受真实三体世界铺垫。
transfer_rule: 把活动写成生活一部分时，应说明它占据的时间、关系或价值功能，以及移除后会出现的具体缺口。
failure_boundary: 对象只是偶尔消遣、可随时替代且不改变日常结构时，称为生活部分会夸大依赖。
