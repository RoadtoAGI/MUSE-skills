chapter: 第34章 智子
figure_type: analogy
quote: 它是一个四维的巨人，我们的世界是一张三维的薄纸，它站在这张纸上，我们只能看到它的脚底与纸相接触的部分
sensory_mapping: 巨人身体；薄纸平面；脚底截面；上下维差；局部显形
context_fact: 智子从三维巨月继续收缩到四维后只剩飞星大小球体，元首看到的是三维投影。
image_mechanism: 三维宇宙被降格为薄纸，智子绝大部分身体站在纸外不可见；飞星小球不代表它变小，只是巨脚在纸上留下的接触印。
property_alignment: 四维智子对应巨人；额外维度对应纸外高度；三维世界对应纸面；投影小球对应脚底接触；观察者对应纸内生物；整体不可见对应无法抬头看纸外
context_alignment: 该降维模型与后文三维人看二维圆相互配套，分别解释截面可见和封闭空间可进入。
narrative_function: 直观解释高维实体与低维投影的尺度差，使连续收缩不被误解为质量或整体消失。
transfer_rule: 用巨人站纸解释维度投影时，应保持维差、整体与截面、观察者限制和交集位置逐项一致。
failure_boundary: 脚底模型只说明截面，不能推断高维实体真实有人形、投影固定不变或具重力站立关系。
