transfer_rule: 写成组视觉记忆时，可选与素材同媒介、能说明出现顺序和重复机制的播放装置。
failure_boundary: 零散气味、连续运动场景或只闪回一次的记忆不适合幻灯；它会把非视觉经验和非循环过程误写成画片。
