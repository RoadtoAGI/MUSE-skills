context_fact: 杨冬死讯使汪淼此前赋予照片的生命感崩塌。
image_mechanism: 把不受控制的回忆分割成一张张静止画片，再交给幻灯机按序反复投映；“循环”同时交代媒介动作和心理强迫性。
