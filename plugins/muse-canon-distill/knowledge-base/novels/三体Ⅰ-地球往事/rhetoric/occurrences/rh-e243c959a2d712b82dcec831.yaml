tenor: 伊文斯失去物种拯救信念后，寻找能支撑其生活意义和继续行动的核心信念
vehicle: 建筑需要垂直支柱承受重量，支柱缺失便无法站立
ground: 生活意义承担心理重量对应支柱承重；信念丧失对应柱体消失；人物无法继续生活对应建筑失稳
