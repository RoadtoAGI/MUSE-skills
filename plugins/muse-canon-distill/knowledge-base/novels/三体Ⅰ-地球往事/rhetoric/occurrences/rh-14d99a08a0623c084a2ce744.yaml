tenor: 叶文洁仰望群星时感到置身无生命回应的宇宙并被独自遗留
vehicle: 无边、颗粒闪光却无人烟的沙漠中一个遭遗弃的孩子
ground: 无数星点散布黑空对应沙粒铺满荒漠并反光；宇宙辽阔无回应对应沙漠空旷无人；个体弱小无援对应弃儿无法自救
