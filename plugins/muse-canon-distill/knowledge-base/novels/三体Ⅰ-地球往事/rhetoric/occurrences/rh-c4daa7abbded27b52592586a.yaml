tenor: 羽毛被黏稠原油裹死、身体近乎僵住而仅眼睛仍活动的受污染海鸟
vehicle: 以黑色沥青浇铸、表面凝固而没有生命动作的鸟形雕塑
ground: 黑油完整包覆对应沥青材质；鸟体难以运动对应雕塑僵固；仅眼睛活动反衬雕塑外壳下残存生命
