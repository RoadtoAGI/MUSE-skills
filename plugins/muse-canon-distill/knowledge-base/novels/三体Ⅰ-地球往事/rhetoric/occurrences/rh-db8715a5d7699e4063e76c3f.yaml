tenor: 雷志成相信数量庞大的人民群众和持久战争能包围、消耗并消灭外星入侵力量
vehicle: 无边海水从四面包围异物，以巨大体量和连续波涛将其吞没至不可见
ground: 广大人民对应汪洋水体；群众持续作战对应海浪不断冲击；侵略者少而孤立对应落海物被吞没
