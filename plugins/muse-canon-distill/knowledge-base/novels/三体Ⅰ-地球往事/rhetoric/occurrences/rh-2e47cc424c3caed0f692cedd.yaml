figure_type: simile
quote: 这些穿着军装扎着武装带的小战士挟带着逼人的青春活力，像四团绿色的火焰包围着叶哲泰
sensory_mapping: 视觉；颜色；温度；运动；空间
context_fact: 四名初二女生作为押送者围着即将受批斗的教授上台。
image_mechanism: 军装颜色被点燃，少女身体失去固定轮廓，化为四团不断跃动、向内灼逼的绿火；青春生命力与毁灭性在同一火焰中并存。
property_alignment: 绿军装对应绿色火光；青春亢奋对应火焰旺盛跳动；四人围住目标对应火团合围；暴力威胁对应火焰灼伤
context_alignment: 人数、衣色、活力和包围位置都在句中可见，绿色火焰不是泛泛热情。
narrative_function: 制造青春与杀戮的刺目矛盾，聚焦叶哲泰的受围困处境。
transfer_rule: 以火焰写人群时，可让服饰给火焰定色、身体动作给火焰定形、空间站位决定燃烧方向。
failure_boundary: 人物安静站立、没有逼迫性或颜色线索缺失时，彩色火焰会成为装饰性炫技。
