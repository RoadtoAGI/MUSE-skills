tenor: 灾变后仍被保存、能够繁衍并重建社会的三体文明幸存基础
vehicle: 灾后留存、条件合适便萌发并长成新生命的种子
ground: 少量幸存者保存文明信息对应种子浓缩遗传潜能；环境恢复后重建文明对应种子萌发成长
