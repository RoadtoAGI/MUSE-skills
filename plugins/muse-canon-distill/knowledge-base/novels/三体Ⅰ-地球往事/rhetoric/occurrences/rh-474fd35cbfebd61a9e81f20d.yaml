tenor: 纪律严密、接令后按固定动作执行的秦军士兵
vehicle: 接收指令便以预设步骤运转、不自行改变规则的机器
ground: 士兵听号令立即动作对应机器接收控制信号；动作整齐可重复对应机械部件按固定程序运行
