tenor: 史强抓住女孩注意力分散的瞬间，以极快速度完成抽枪射击
vehicle: 闪电突然出现、亮起和击中，速度快到视线只捕捉一瞬光
ground: 抽枪极快对应闪电瞬发；枪口亮光对应电光；对方来不及反应对应雷击无预警
