chapter: 第25章 叛乱
figure_type: simile
quote: 大史闪电般抽出手枪
sensory_mapping: 瞬时亮光；高速轨迹；骤发；视觉残影；击中
context_fact: 取信人遮住女孩视线，大史需在核弹按钮被按下前命中球体。
image_mechanism: 手枪动作被压缩成一道光，从衣内到射击之间的机械步骤全部消失；女孩只在遮挡者耳边看见一次亮闪，正如雷击已发生才被意识到。
property_alignment: 抽枪突然对应闪电骤现；动作时间短对应电光瞬逝；枪口火光对应闪亮；子弹击中对应雷击落点；女孩无反应窗口对应闪电不可预判
context_alignment: 核弹危机要求绝对抢时，闪电同时匹配速度与可见亮光，比泛称迅速更具体。
narrative_function: 跳过动作分解，制造与女孩主观视野一致的突袭效果。
transfer_rule: 用闪电写动作时，应让速度、突然性、亮光或击中效果中至少两项在现场兑现。
failure_boundary: 动作需要长时间瞄准、轨迹清楚可跟随或没有任何亮闪与突击结果时，闪电会成为空泛速度词。
