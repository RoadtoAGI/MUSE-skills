tenor: 迟到五小时后异常迅速扩展、变亮的曙光
vehicle: 迟到者为补回耽误时间而加速赶工
ground: 太阳超过正常日出时刻才出现对应迟到者耽搁；曙光以超常速度增亮对应迟到后加快进程补偿
