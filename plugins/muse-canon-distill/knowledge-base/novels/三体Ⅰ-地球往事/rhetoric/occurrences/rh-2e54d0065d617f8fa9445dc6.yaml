quote: 黑球像一只受惊的麻雀在房间里乱飞
sensory_mapping: 视觉；运动；节奏
context_fact: 丁仪虚构相同碰撞条件产生荒诞不同结果。
image_mechanism: 台球从桌面二维轨迹突然获得鸟的三维飞行、急转和钻入狭处，规则失效由一连串可追踪的失控动作显形。
property_alignment: 轨迹频繁不可预测地改变对应受惊鸟乱飞；球脱离桌面进入房间对应鸟在三维空间穿梭
context_alignment: 麻雀快速折返让抽象随机结果成为可追踪动作。
narrative_function: 把规律崩塌写成荒诞但清楚的实验画面。
transfer_rule: 解释“无规律”时，不要只说混乱；选择轨迹天然多次突变的活物，并让它突破本体原有运动平面。
failure_boundary: 持续直飞、平滑弧线或仍贴桌滚动的球不符合受惊麻雀的急转和三维逃窜。
