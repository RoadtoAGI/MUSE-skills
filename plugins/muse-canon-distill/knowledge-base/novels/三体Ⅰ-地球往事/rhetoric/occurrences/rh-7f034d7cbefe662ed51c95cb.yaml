chapter: 第20章 三体、爱因斯坦、单摆、大撕裂
figure_type: simile
quote: 大陆如消融的流冰般漂浮
sensory_mapping: 视觉；漂浮；边缘融化；冷热反差；水平位移
context_fact: 三个太阳的潮汐力撕开行星，灼热核心物质涌上地表，原有海陆结构全面失稳。
image_mechanism: 通常坚固不动的大陆被减轻成薄冰片，岩浆承担海水的流动角色；板块在红热表面滑移，而“消融”让其边缘像冰一样持续失去轮廓。
property_alignment: 大陆板块对应巨大冰片；岩浆层对应承载流冰的水面；板块漂移碰撞对应流冰随流运动；地壳受热瓦解对应冰缘消融
context_alignment: 尺度大到难以想象的板块运动借常见流冰获得速度与质感，冰的冷感又与灼热岩浆形成强化末日的反差。
narrative_function: 把行星级地质流变压缩成可见水面图景，呈现大陆失去稳定性的恐怖。
transfer_rule: 以流冰写漂移板块时，应对齐承载介质、漂移方式、边缘崩解和板块间碰撞，不能只借“浮”。
failure_boundary: 大陆仍固定在完整地幔、只发生局部地震，或板块没有熔蚀漂移时，流冰会夸大地壳液化程度。
quality_assessment: exemplary
