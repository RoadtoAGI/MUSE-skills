review_status: reviewed
tenor: 行星被撕裂后，大陆板块浮在翻涌岩浆上漂移、碰撞并不断变形
vehicle: 春融水面上边缘消解、随水流漂移相撞的大片浮冰
ground: 大陆由下方熔融物托起对应冰块浮在水面；板块边缘受热破坏对应流冰消融变形
