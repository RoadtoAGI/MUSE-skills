context_fact: 汪淼刚退出震撼的游戏关卡，系统管理员第一次直接来电并邀请他参加网友聚会。
image_mechanism: 听觉质感跨感官变成看不见的力场，电话线另一端无需现身便把汪淼的注意和行动拉向组织者。
property_alignment: 悦耳男音对应磁体；注意被抓住对应铁屑受吸；愿意回应提问对应被牵引靠近；声音辨识度对应稳定磁场
context_alignment: 来电既友好又带筛选控制，磁性兼具魅力与牵引，准确预示游戏组织开始把玩家拉入现实网络。
narrative_function: 在人物未露面前建立吸引性权威，并平滑从游戏灾难转入现实邀约。
transfer_rule: 用磁性写声音时，应有具体音色吸引、注意力转向和靠近或服从倾向，不能只作空泛赞美。
failure_boundary: 声音尖锐令人排斥、听者不受影响，或吸引来自话语内容而非音色时，磁性会错配感官原因。
