chapter: 第12章 三体、墨子、烈焰
figure_type: metaphor
quote: 火焰的海洋上布满涌浪和旋涡
sensory_mapping: 视觉；流体运动；广度；温度
context_fact: 巨日逼近到肉眼可见表面细节，火焰在整个日面形成涌动纹理。
image_mechanism: 火焰不再是一簇簇向上的舌状物，而被横向铺成无边液面；涌浪与旋涡让日面具有可追踪的流体尺度和动势。
property_alignment: 整片日面被火焰覆盖对应海面连绵；火焰起伏对应涌浪；局部旋转结构对应海中旋涡
context_alignment: 观察距离在游戏中被巨日异常缩短，海洋提供足以覆盖半个天空的面状尺度，也保留太阳表面的流动。
narrative_function: 把天体表面变成近在眼前的灾难地貌，为随后坠入火焰大地铺垫。
transfer_rule: 将大面积动态表面写成海时，要分别落实连续覆盖、局部波动和旋转流，而非只借“浩大”。
failure_boundary: 孤立喷焰、笔直射流或静止光斑没有海面的连续性与流体回旋，用海洋会模糊真实运动。
