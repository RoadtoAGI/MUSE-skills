context_fact: 潘寒称参与者都是精英，宣称游戏专为具有高知识能力的阶层准备。
image_mechanism: 知识空间被拉成上下两向：进入门槛竖成高台，进入后内容又沉为深井；玩家的优越感来自既能登高又能下潜。
property_alignment: 知识门槛对应高处；学习能力对应攀登能力；隐含信息对应深层结构；理解难度对应难以探底
context_alignment: 潘寒用空间尺度抬高游戏和玩家身份，话语同时执行招募中的精英确认与排他。
narrative_function: 以高度和深度制造知识等级感，迎合并筛选在场玩家。
transfer_rule: 用高深评价知识时，应分别说明进入门槛和内部复杂度，并给出支撑二者的具体内容。
failure_boundary: 材料只是术语繁多、实质浅薄，或无需专门知识即可理解时，高深会沦为精英姿态。
