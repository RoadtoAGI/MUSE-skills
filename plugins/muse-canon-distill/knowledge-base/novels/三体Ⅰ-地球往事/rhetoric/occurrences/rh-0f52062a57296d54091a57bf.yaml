tenor: 人类第一次发出功率足以被外星文明接收和辨认的宇宙无线电信息
vehicle: 新生婴儿来到世界后第一次发出响亮啼哭，让外界知道其存在
ground: 文明首次被宇宙他者听见对应婴儿第一声宣告出生；信号内容简单重复对应啼鸣先表达存在而非复杂语言
