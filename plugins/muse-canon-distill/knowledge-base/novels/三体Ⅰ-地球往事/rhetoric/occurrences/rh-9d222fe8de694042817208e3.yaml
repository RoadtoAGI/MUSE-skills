tenor: 叶文洁曾努力调解降临派与拯救派的目标分歧，维持ETO统一
vehicle: 修补开裂物体，把分离边缘重新接合成完整结构
ground: 派系价值冲突对应整体表面裂开；协调共同纲领对应填补并连接裂口；恢复统一对应物体重新完整
