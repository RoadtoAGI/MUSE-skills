tenor: 被工作暂时压下的恐惧在汪淼离开实验室后重新占据意识
vehicle: 一直尾随、趁目标停下便赶上来的追逐者
ground: 恐惧暂时落后但没有消失对应追逐者被短暂甩开；下班后迅速复发对应追逐者重新赶到身边
