context_fact: 大史说自己级别低，虽参与作战中心却同样不知道幕后真相。
image_mechanism: 调查现实被罩上不透明梦层，案件线索仍可触摸，因果却不断变形；大史不能以醒来退出，只能在失序环境中继续办案。
property_alignment: 事件反常难解对应梦境逻辑失序；信息被遮蔽对应梦中无法看清原因；仍必须执行任务对应人在梦魇中被迫行动；不安持续对应无法醒来结束
context_alignment: 噩梦由大史口中说出，罕见承认他也受困，短句符合其不展开恐惧的说话方式。
narrative_function: 缩小大史与汪淼的信息差，建立两人共同面对未知的联盟。
transfer_rule: 让强硬人物使用常见梦喻时，应由其具体信息缺口和持续任务压力激活失序、被困两项，而非泛称事情糟糕。
failure_boundary: 普通繁忙、线索清楚或人物能随时退出的案件没有梦魇失序与不可醒机制。
