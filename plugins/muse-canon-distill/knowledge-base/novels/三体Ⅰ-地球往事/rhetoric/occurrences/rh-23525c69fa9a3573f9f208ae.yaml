tenor: 汪淼退出《三体》后重新感到的日常现实
vehicle: 细节繁多却被压在二维画面上的《清明上河图》
ground: 现实表面人物事物繁杂对应长卷场景密集；现实被游戏反衬得缺少纵深对应画中万象终究停在薄平面
