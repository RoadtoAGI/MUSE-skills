review_status: reviewed
tenor: 三体文明历经两百多次毁灭重生，在无稳定家园和出路的历史中艰难延续，终于发现宜居地球
vehicle: 受困者在漫长黑隧道中匍匐前行，远方一线出口光预示可以离开黑暗
ground: 文明艰难轮回对应爬行；不可预测灾变对应黑隧道；地球信息对应出口光；两百轮对应长距离
