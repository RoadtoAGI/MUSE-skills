tenor: 信件指控美国霸权行为会使人类社会退回更落后的发展状态
vehicle: 外力抓住沿道路前进的历史并把它向后拖拽
ground: 社会发展被理解为向前行进对应历史沿路径前进；反动行为阻碍进步对应力量把行进者拉回后方
