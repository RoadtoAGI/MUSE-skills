chapter: 第19章 聚会
figure_type: metaphor
quote: 我站在他们一边
sensory_mapping: 左右空间；站立；群体边界；身体靠近
context_fact: 六人刚明确分成欢迎三体与担忧毁灭两派，大史要求汪淼表现得极端些以继续潜入。
image_mechanism: 不可见的价值分界线穿过咖啡馆，回答让汪淼仿佛跨线站进欢迎派队伍；他还用手指具体指人，使抽象站队瞬间获得实体位置。
property_alignment: 两种政治态度对应空间两侧；表示赞同对应走向一边；指向记者等人对应选择邻近群体；伪装结盟对应暂时站入队列
context_alignment: 随后异议两人被请离，语言中的空间站队立刻变成真实房间内的群体分离，贴合度很高。
narrative_function: 让汪淼以最少话完成潜入表态，并触发潘寒正式筛除异议者。
transfer_rule: 用站边写立场时，应有清楚对立群体、可识别的归属动作和选择带来的关系后果。
failure_boundary: 议题存在多维立场、人物只赞同其中一点或保持策略性中立时，二侧站队会过度简化；汪淼此处正是策略伪装。
