chapter: 第15章 红岸之四
figure_type: simile
quote: 有时觉得生命真珍贵，一切都重如泰山
sensory_mapping: 重量；山体尺度；身体承压
context_fact: 叶文洁在“生命唯一且珍贵”和“人类相对宇宙渺小”两种感受间长期摇摆。
image_mechanism: 不可见的价值被换算成手臂和身体无法承受的重量，泰山作为极端标尺使每个选择都带上压顶分量。
property_alignment: 生命价值重大对应山体质量巨大；不容随意牺牲对应重物无法轻拿轻放；唯一性带来责任对应山压形成持续负担
context_alignment: 紧接人类如蚂蚁的极轻尺度，泰山之重构成同一句中的重量翻转，准确呈现她矛盾人生观。
narrative_function: 把生命珍贵的一极实体化，并与“什么都不值”形成剧烈摆动。
transfer_rule: 用重量表达价值时，应说明是谁承担该重量、为何不能轻放，并让相邻语境提供可对照的轻重标尺。
failure_boundary: 对象价值只是一般重要、没有责任压力或语境不存在轻重对照时，泰山会成为失去刻度的成语套用。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 在智慧生命可能唯一时，叶文洁感到每个生命和相关事物具有极高价值
vehicle: 质量巨大、难以搬动的泰山
ground: 价值高到不可轻弃对应山体重量无法忽略；生命承担唯一文明意义对应巨山压在判断尺度上
