tenor: 巨摆以永不停息的往复运动纪念三体灾难，并表达文明对不可预测宇宙的抗争
vehicle: 战士举起坚硬巨拳反复击向强敌，同时以呐喊宣告不屈
ground: 金属摆锤的圆重形体对应握紧铁拳；摆动轨迹对应拳头反复挥击；无声运动承载意志对应呐喊虽无声音仍可被读懂
