tenor: 伊文斯若停止机械修枝，就会失去维持心理稳定的行动支点而精神瓦解
vehicle: 承重结构失去支撑后突然坍塌，各部分散落并无法维持原形
ground: 持续劳动对应结构支撑；停止动作对应撤去支柱；心理失控对应整体坍塌；信念破灭使内在失去连接
