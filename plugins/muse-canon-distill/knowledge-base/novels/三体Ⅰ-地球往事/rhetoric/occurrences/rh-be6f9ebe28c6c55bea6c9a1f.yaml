chapter: 第34章 智子
figure_type: simile
quote: 就像有人用晃动的手电照着洞窟的顶
sensory_mapping: 黑暗穹顶；圆形光斑；手电摆动；从下向上照射；洞穴包围感
context_fact: 三体行星正被二维质子球面包围，地面发出的电磁束调节其引力弯曲。
image_mechanism: 整个行星内部缩成洞窟，弯曲质子面成为头顶石壁，工程电磁束则像工人手中的手电在顶上寻找支点；宏大包裹过程获得室内方位感。
property_alignment: 质子弧面对应洞顶曲面；暗夜对应洞窟黑暗；地面辐射源对应持灯者位置；光晕对应手电光斑；光斑晃动对应动态调节；球面包围对应洞穴封闭
context_alignment: 三体人即将被自己制造的质子壳完全罩住，洞窟比照准确传达由开放星空转为封闭内部的空间变化。
narrative_function: 给远距离电磁调节提供日常可视参照，并强化球壳正在闭合的包围感。
transfer_rule: 以洞顶手电写穹顶光斑时，应匹配上下方位、弧面承载、局部光晕移动、暗环境和操作者调节动作。
failure_boundary: 光源固定不动、从外部向下照射或承载面平坦开放时，洞窟顶的方位模型会错误。
