context_fact: 发现第三体复杂运动后，魏成整日思考，旁人甚至怀疑他精神出了问题。
image_mechanism: 大脑被装上动力轴，平日懒散相当于低速待机，三体问题则把能量表推到满格；看不见的专注变成可听见的高速机器。
property_alignment: 全部注意投入对应满功率供能；连续推演对应机构不停转动；超过平日状态对应从低速升至极限
context_alignment: 魏成自称懒散，对照机器突然满载能精确表现三体问题第一次调动他的全部能力。
narrative_function: 显示兴趣带来的性格反转，并为爱情比喻建立强烈投入基线。
