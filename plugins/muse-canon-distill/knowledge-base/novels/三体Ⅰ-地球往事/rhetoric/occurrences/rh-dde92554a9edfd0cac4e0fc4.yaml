chapter: 第16章 三体、哥白尼、宇宙橄榄球、三日凌空
figure_type: metaphor
quote: 游戏对走对路的人是一路放行的
sensory_mapping: 道路；关卡；步行推进；方向
context_fact: 亚里士多德以游戏规则判断汪淼理论错误，正准备火刑；三日随即出现并证明汪淼正确。
image_mechanism: 抽象推理变成分岔路线，游戏系统像沿途哨卡检查答案；正确者不必强行突破，门会一扇扇打开。
property_alignment: 理论选择对应道路方向；验证节点对应检查关卡；进入下一级对应继续前行；错误理论受罚对应走错路被拦截
context_alignment: 此刻说话者误判方向，稍后灾变反而为汪淼开放第二级，路径规则形成即时戏剧反讽。
narrative_function: 显明游戏的筛选机制，并为汪淼从火刑到升级的反转蓄势。
transfer_rule: 用道路写认知筛选时，应设置分岔、验证关卡、放行条件和可辨终点，让后续事件实际检验选路。
failure_boundary: 系统奖励与真理无关、路线可同时成立或没有逐级门槛时，“走对路”会把设计者偏好当成客观正确。
