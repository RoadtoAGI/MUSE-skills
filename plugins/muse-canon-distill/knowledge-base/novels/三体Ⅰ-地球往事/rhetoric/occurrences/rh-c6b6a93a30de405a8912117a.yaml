chapter: 第30章 地球三体运动
figure_type: metaphor
quote: 《三体》游戏是拯救派的摇篮
sensory_mapping: 摇篮包裹；婴儿初生；轻摇哺育；成长起点；安全小空间
context_fact: 拯救派后来成员多经游戏认识三体文明、发展宗教感情并投身组织。
image_mechanism: 玩家进入游戏时仍是信仰上的婴儿，剧情和组织引导像摇篮的包裹与晃动，逐步把陌生好奇养成稳定宗教归属。
property_alignment: 初入玩家对应新生儿；游戏环境对应摇篮；三体文化叙事对应养育；反复体验对应轻摇；形成宗教感情对应成长；加入拯救派对应离开摇篮进入群体
context_alignment: 组织本身先被写成孕育出的生命，游戏再成为派别成员的摇篮，生命生成框架在不同层级递归。
narrative_function: 概括游戏对拯救派的成员生产功能，而非仅把它当宣传品。
transfer_rule: 用摇篮写平台时，应证明对象在此完成早期生成、持续受养育并从中进入更成熟组织阶段。
failure_boundary: 成员加入前已有完整信仰、游戏只提供一次信息，或主要成员来自其他渠道时，摇篮会夸大生成作用。
