review_status: reviewed
tenor: 潘寒听到玩家贬低现实后，眼神明显显露兴奋与满意
vehicle: 眼睛成为发光体，向外射出突然变亮的光束
ground: 眼神亮度和聚焦增强对应光源变亮；内在兴奋被旁人识别对应光从体内向外发出
