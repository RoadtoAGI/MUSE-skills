quote: 群星像一片银色的火焰
sensory_mapping: 视觉；亮度；运动；温度反差
context_fact: 水、二氧化碳、氧氮分层冻结，大气近乎消失。
image_mechanism: 离散星点因密度和闪烁被视觉连成火面，颜色却被降到银冷；火焰的动与极寒的色互相冲突。
property_alignment: 群星密集连片对应火焰成片；星光闪烁对应火舌跳动；冷银亮点对应被抽去暖色的火光
context_alignment: 大气清空解释星光密集，绝寒语境反转火焰温暖。
narrative_function: 在文明冻结时制造冷艳宇宙景观。
transfer_rule: 反常材质比喻可保留喻体的形态与运动、反转其温度或颜色，但反转项必须由场景事实支撑。
failure_boundary: 星点稀疏稳定、天空有暖色霞光或火焰温度是主要含义时，“银色火焰”的冷反差失效。
