tenor: 国际信息和科学认识增加后，决策者对SETI尺度与困难形成更全面判断
vehicle: 观察范围向四周展开，原先视野外的障碍进入眼中
ground: 获取更多知识对应视域扩大；看见此前忽略的困难对应远处障碍进入可见范围
