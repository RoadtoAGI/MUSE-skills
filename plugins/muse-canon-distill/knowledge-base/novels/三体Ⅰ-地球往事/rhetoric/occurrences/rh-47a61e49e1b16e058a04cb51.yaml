tenor: 巨日落下后迅速铺满天空、吞没废墟的黑夜
vehicle: 被巨手急速扯开并罩下的一幅巨大黑布
ground: 夜色从天边快速扩展对应黑布被拉开；黑暗覆盖整个世界对应巨幅布料罩住下方物体
