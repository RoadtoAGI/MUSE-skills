quote: 有好几个投影仪的大屏幕，在大厅的角落里呈不同角度随意立着，像吉普赛人的帐篷
sensory_mapping: 视觉；空间布局
context_fact: 作战中心被危机逼成临时办公场，设备来不及规范安装。
image_mechanism: 先把各块屏幕压成斜立的三角/矩形篷面，再把朝向不一的设备群组装成临时营地；读者由单件外形一路看到空间的仓促布局。
property_alignment: 屏幕斜立杂乱对应临时帐篷不按固定阵列搭设；设备仓促塞入大厅对应迁徙营地的临时落脚
context_alignment: 帐篷的临时性和大厅的仓促布置贴合汪淼入场时的整体扫视。
narrative_function: 用营地图景交代空间混乱和战争临场感。
transfer_rule: 写杂乱空间时，选一个本身由多件单元临时组合成群的喻体，同时对应单件姿态、群体排列和使用期限。
failure_boundary: 整齐嵌墙、长期固定或只有一块屏幕的场景不具备营地式群组和临时性，用帐篷会误报空间性质。
