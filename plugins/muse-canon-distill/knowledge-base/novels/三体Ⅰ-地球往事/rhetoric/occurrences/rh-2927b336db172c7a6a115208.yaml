tenor: 魏成对数字组合形成的直接、整体数学直觉
vehicle: 能在脑内旋转、占据空间并从整体辨认的三维形体
ground: 数字关系被同时把握对应立体各部分共存于一个整体；不同组合呈现不同结构对应不同物体具有可辨形状
