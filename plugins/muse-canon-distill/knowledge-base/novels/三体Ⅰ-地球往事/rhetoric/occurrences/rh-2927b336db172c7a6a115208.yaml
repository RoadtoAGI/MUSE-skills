chapter: 第17章 三体问题
figure_type: metaphor
quote: 任何数字组合对于我都是一种立体形体
sensory_mapping: 视觉；空间；形状；数学直觉
context_fact: 魏成能跳过显性推导直接得出数列和公式，却很难说明自己的推理过程。
image_mechanism: 线性排列的符号脱离纸面，在意识中折叠、连接成有体积的对象；他不是逐项计算，而像一眼认出整体轮廓。
property_alignment: 数字间关系对应形体部件连接；组合差异对应外形差异；直觉判断对应整体辨形而非逐段测量
context_alignment: 魏成正在解释不可言说的数学天分，跨感官空间形体能说明为何答案先于推导出现。
narrative_function: 具象化其异常数学直觉，为他研究三体运动的图形—数字互译能力奠基。
transfer_rule: 用形体写抽象关系时，应说明元素如何组成局部、整体如何被辨认，以及这种空间化怎样改变认知速度。
failure_boundary: 人物仍需逐步运算、不同数字组合没有稳定结构感时，立体形体会伪造联觉能力。
