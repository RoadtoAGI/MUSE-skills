tenor: 老人不熟练却自足、内向而不取悦路人的小提琴演奏
vehicle: 音乐获得说话能力，反复向听者声明演奏者既是表演者也是唯一听众
ground: 演奏不顾外界评价对应说话内容只指向自己；琴声带自我陶醉对应声明自己欣赏自己的演奏
