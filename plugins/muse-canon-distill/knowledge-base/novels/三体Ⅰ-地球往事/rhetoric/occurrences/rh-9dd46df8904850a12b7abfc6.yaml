tenor: 叶文洁以轻微摆手淡化自己在文革中吃苦的话题
vehicle: 随手拂掉面前一根细小、轻飘的蛛丝
ground: 摆手幅度轻微对应拂蛛丝无需用力；把沉重往事说成过去了对应将眼前细微阻碍随手除去
