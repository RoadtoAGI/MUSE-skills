chapter: 第12章 三体、墨子、烈焰
figure_type: simile
quote: 杨母轻轻摆摆手，像拂去面前的一根蛛丝
sensory_mapping: 视觉；手部动作；触觉轻重
context_fact: 汪淼提到叶文洁在文革中受苦，她以“过去了”带过，没有展开自己的创伤。
image_mechanism: 一句沉重历史被压缩成脸前几乎无重量的细丝，手一摆便离开视野；动作的轻与往事的重形成克制反差。
property_alignment: 轻摆手对应拂丝的小动作；回避苦难话题对应清除眼前干扰；“过去了”对应蛛丝被拂后不再停留
context_alignment: 年老叶文洁此刻平静淡泊，微小家常动作符合她的克制，也掩住读者已知的巨大创伤。
narrative_function: 以轻动作表现长期创伤后的压抑和平静，并自然引入红岸回忆。
transfer_rule: 写人物淡化重负时，可让实际手势对应清除一个极轻小障碍，用动作轻重与事件分量的反差刻画克制。
failure_boundary: 人物正在激烈控诉、动作粗重或事件确实无足轻重时，蛛丝的轻会失去反差，甚至误判情绪。
