chapter: 第31章 两个质子
figure_type: metaphor
quote: 在三体文明眼中，我们可能连野蛮人都算不上，只是一堆虫子
sensory_mapping: 地面虫群；微小身体；俯视；随手碾压；密集蠕动
context_fact: 叶文洁不知道质子如何锁死科学，只知道三体人对人类的等级判断极端低下。
image_mechanism: 文明尺度被上下翻转，地球社会缩到三体视野脚下成为虫堆；人类自豪的科学在更高维控制前只相当于虫群行为。
property_alignment: 人类个体对应小虫；七十亿人口对应虫堆；低维技术对应简单行为；三体俯视对应人类俯看虫群；不沟通对应物种隔绝；入侵消灭对应灭虫
context_alignment: 本章首次提出虫子命名，结尾麦田将用真实虫灾反转该贬称，必须保留此处起点。
narrative_function: 建立文明等级羞辱和全书末段核心意象，为人类绝望与反击同时埋伏。
transfer_rule: 用虫子写文明差距时，应对应观察尺度、技术能力、沟通不对等和消灭关系，并警惕数量韧性可能反转评价。
failure_boundary: 双方技术接近、能平等谈判，或低等一方已有伤及高等方的可靠能力时，虫子不能概括全部关系。
quality_assessment: exemplary
