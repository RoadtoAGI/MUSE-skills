review_status: reviewed
tenor: 三体文明认为人类技术层级、认知能力和可对话地位极低，可被随意观察和清除
vehicle: 数量众多却个体微小、认知简单、在人看来不具平等沟通资格的一堆虫子
ground: 技术差距对应人虫能力差；人类群体对应虫群；三体蔑视对应人不与虫平等；可被消灭对应灭虫行动
