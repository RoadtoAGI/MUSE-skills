review_status: reviewed
tenor: 汪淼举起后被火焰完整包裹、已经看不清手形的双手
vehicle: 两根顶端和杆身持续燃烧、只剩火光轮廓的火炬
ground: 两只手臂竖直举起对应两根细长火炬；手上火焰包围轮廓对应火炬燃烧发光
