context_alignment: 批斗话语需要把“未知”迅速改写成政治罪证，位置隐喻让逻辑跳跃显得像填空一样直接。
narrative_function: 暴露绍琳如何把科学未知转成宗教指控。
transfer_rule: 用空位写解释空间时，应指出哪项知识缺失形成边界、哪个假说被放入、以及新证据如何改变空位。
failure_boundary: 未知只表示证据不足，并不自动支持任何特定假说；把可提出误作已证实会越过类比边界。
