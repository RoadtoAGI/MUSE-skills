tenor: 掌握太阳规律后秦国经济与国力将以极高速度增长
vehicle: 物体脱离地面高速飞行，迅速跨过长距离
ground: 短时间取得大量进步对应飞行高速越过空间；发展方向被设为向前对应飞行有目标轨迹
