context_alignment: 在排除常规载体后使用幽灵，准确命名“效果在、实体不在”的异常。
narrative_function: 为贯穿章节的倒计时异常建立母题。
transfer_rule: 无实体喻体应放在排除物理载体之后，并用重复出现、穿透媒介或选择目标等行为补足，而非见到模糊物就称幽灵。
failure_boundary: 若有明确投影装置、胶片预曝或所有人都能看到，幽灵的无源性和选择性会被事实推翻。
