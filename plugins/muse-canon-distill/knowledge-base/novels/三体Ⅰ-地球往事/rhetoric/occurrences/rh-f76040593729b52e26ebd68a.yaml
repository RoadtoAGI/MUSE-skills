chapter: 第23章 红岸之五
figure_type: metaphor
quote: 研究到了山穷水尽的地步
sensory_mapping: 山路封堵；河流断尽；空间尽头；停步；孤立
context_fact: 太阳表面无活动却出现辐射突变，短波又不可能来自核心，她准备提交无能为力的报告。
image_mechanism: 研究路线被画成穿山沿水的旅途，每项数据分析是一段路，半年后所有出口同时在崖壁和枯水处结束；放弃成为不得不停步。
property_alignment: 研究目标对应旅程终点；理论与数据方法对应山水道路；反复失败对应道路逐条封闭；无新证据对应水源耗尽；提交失败报告对应在绝路停下
context_alignment: 她随后因偶然翻阅木星论文发现新路，绝境后的转向使熟语获得清晰叙事结构。
narrative_function: 压缩半年失败并把偶然突破安排成绝路之后突然出现的岔道。
transfer_rule: 用山穷水尽写研究时，应列明已耗尽的路线、封堵原因和当时确实缺少下一步。
failure_boundary: 仍有明显实验未做、放弃主要因资源或意愿不足时，绝路会把未探索误写成不可探索。
