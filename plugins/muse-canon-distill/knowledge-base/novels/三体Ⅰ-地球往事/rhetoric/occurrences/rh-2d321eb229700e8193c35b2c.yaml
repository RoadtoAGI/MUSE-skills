chapter: 第26章 雷志成、杨卫宁之死
figure_type: metaphor
quote: 政治神经很敏感
sensory_mapping: 神经刺痛；微刺激；快速传导；身体警觉
context_fact: 雷志成暗中部署监听程序，第一时间发现叶文洁删除的外星信息并盘算上报。
image_mechanism: 抽象政治环境变成贴在皮肤上的刺激网，任何阶级和权力信号轻触雷志成便沿神经直达行动；其程序监控正是这套身体警觉的技术延伸。
property_alignment: 政治线索对应外部刺激；雷志成警觉对应低阈值神经；隐藏程序对应感受器延伸；迅速发现对应传导快速；立即审问对应反射动作
context_alignment: 该干部的敏感并非泛称，后台监控和秘密备份提供了可验证的感知器官。
narrative_function: 用身体反应概括雷志成的干部类型，并解释他为何成为唯一同时获知秘密的人。
transfer_rule: 用神经敏感写政治警觉时，应给出微弱信号、低反应阈值、监测方式和迅速行动。
failure_boundary: 人物长期忽略风险、事后才被告知，或反应主要来自偶然利益而非持续警觉时，敏感神经会美化其能力。
