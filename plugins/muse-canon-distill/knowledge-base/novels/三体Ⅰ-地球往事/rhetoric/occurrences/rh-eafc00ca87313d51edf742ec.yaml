tenor: 少女在潘寒伸手掏枪的瞬间以极高速度冲到他身边
vehicle: 闪电突然出现、以肉眼难追的速度划过空间并命中目标
ground: 少女动作几乎无预兆对应闪电骤发；旁人尚未反应她已到位对应电光传播快到难以追视
