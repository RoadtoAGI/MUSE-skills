property_alignment: 政府搜捕对应洪水上涨；组织成员对应水中受困者；内部裂痕对应自救困难；被全面清除对应水没头顶；果断清洗主张对应紧急求生动作
context_alignment: 潘寒用终局灾难抬高紧迫度，为越权杀人辩护；叶文洁的从容与此危机话术形成权力反差。
narrative_function: 以窒息式末日框架为潘寒的极端措施制造时间压力。
transfer_rule: 用灭顶写组织危机时，应有覆盖全体、迅速逼近、生存空间消失和可能彻底终结的证据。
failure_boundary: 危机只影响局部、组织有安全退路或能长期调整时，灭顶会成为操纵性的紧迫夸张。
