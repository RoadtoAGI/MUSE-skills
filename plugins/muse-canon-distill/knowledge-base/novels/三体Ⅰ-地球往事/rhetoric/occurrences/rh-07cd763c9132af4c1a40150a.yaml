review_status: reviewed
tenor: 竖立在审判日号中部、面积巨大且呈圆形的抛物面通讯天线
vehicle: 船只桅杆上高高张开、承受海风并支配船体轮廓的一面大帆
ground: 天线巨大薄面对应帆面；竖立船中部对应桅杆挂帆位置；海风中迎风对应帆受风
