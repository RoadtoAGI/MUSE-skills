tenor: 三体某一时间断面上大量候选运动矢量组合及其筛选迭代
vehicle: 具有不同适应度的生物种群在环境规则中生存、淘汰和进化
ground: 每种矢量组合作为独立候选对应种群个体；符合预测目标的组合保留对应适应环境者存活繁殖
