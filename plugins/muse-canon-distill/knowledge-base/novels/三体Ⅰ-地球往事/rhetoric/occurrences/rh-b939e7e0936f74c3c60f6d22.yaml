chapter: 第13章 红岸之二
figure_type: simile
quote: 与以前叶文洁眼中的他相比仿佛换了一个人
sensory_mapping: 视觉身份；声音语气；人物替换动作
context_fact: 雷政委此前以温暖鼓励争取叶文洁入核心岗位，此刻却在领导面前严厉宣布惩罚要求。
image_mechanism: 同一张脸和身体被保留，熟悉的语气、目光与关系却像整套卸下并换装；外表连续与人格断裂形成瞬间错认。
property_alignment: 和蔼变厉声对应人物性格更换；传递温暖变成威胁惩罚对应立场更换；叶文洁无法把两种表现连在一起对应认人却不识人的错位
context_alignment: 转变发生在一次精心安排的政治表演中，读者随后得知此前亲近含有欺骗，换人感准确承载叶文洁的认知断裂。
narrative_function: 让背叛以人格突变被身体感知，摧毁叶文洁刚建立的信任。
transfer_rule: 写熟人态度骤变时，应让语气、关系承诺和行动后果同步翻转，使“换人”来自多项连续证据。
failure_boundary: 只是一时发脾气、语气略变或人物外貌真的被替换时，该喻体分别会夸大心理断裂或失去修辞性。
