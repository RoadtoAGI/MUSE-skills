tenor: 魏成求得的一百多种形态复杂、彼此不同的三体稳定轨迹图
vehicle: 数量足以成展、以非具象线条和几何构成取胜的后现代艺术作品
ground: 轨迹线条复杂抽象对应非具象艺术构图；上百种形态各异对应画展需要数量和变化
