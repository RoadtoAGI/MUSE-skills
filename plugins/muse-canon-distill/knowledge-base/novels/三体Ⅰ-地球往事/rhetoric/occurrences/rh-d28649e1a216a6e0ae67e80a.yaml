figure_type: analogy
quote: 把那些轨迹画出来，足够办一个后现代派画展了
sensory_mapping: 视觉；线条；构图；陈列空间
context_fact: 此前研究者只找到三四种稳定状态，魏成用进化算法找到百余种，但强调这仍非其最终目标。
image_mechanism: 数学轨迹从论文图表摘下、装框并排挂上展墙，观者先看到曲线的形式美和多样性，暂时忘记其预测功能。
property_alignment: 轨迹抽象线条对应后现代非具象画；上百种结果对应展品规模；每种结构独特对应画作构图变化；研究偏离最终预测目标对应艺术展示重形式而非实用
context_alignment: 魏成以懒散幽默贬低同行追逐特解，也承认轨迹视觉奇观，画展比喻兼具炫耀和自我校正。
narrative_function: 直观显示成果数量与形态之丰富，同时划清“漂亮特解”和真正解决问题的距离。
transfer_rule: 把科学图形比作艺术展时，应落实线条风格、结果数量和观看方式，并说明形式美与科学目标的关系。
failure_boundary: 只有一两张普通曲线、形态高度重复或研究目的本就是可视化传播时，画展会夸大多样性或制造错误讽刺。
