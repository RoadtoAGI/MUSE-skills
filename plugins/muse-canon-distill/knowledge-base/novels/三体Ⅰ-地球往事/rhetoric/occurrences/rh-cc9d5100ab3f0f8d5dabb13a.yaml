tenor: 未来太空电梯以固定通道连接地表与轨道空间、降低跨越重力边界的运输成本
vehicle: 巴拿马运河切开陆地屏障，以人工水道连接两个大洋并改变全球运输
ground: 重力井阻隔地球与太空对应陆地阻隔两洋；电梯固定运输线对应人工运河；两端交通系统被接通并降低绕行成本
