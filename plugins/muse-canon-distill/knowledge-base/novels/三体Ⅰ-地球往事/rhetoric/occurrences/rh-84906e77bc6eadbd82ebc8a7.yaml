image_mechanism: 无形的规则和谜题被排成一条受阻通道，玩家每解开一关便凿开一段，直到入口与终点连通。
property_alignment: 逐关推进对应逐段清除障碍；完成全部内容对应通路首尾贯通；困难关卡对应坚硬堵塞处
context_alignment: 大史不懂游戏理论，只从办案和行动经验理解为把障碍打穿，口语化动词符合他的说话方式。
narrative_function: 把继续游戏设为可执行目标，并暗示游戏内部藏着需要抵达的真相。
transfer_rule: 用“打通”写复杂任务时，应让任务具有明确序列、阻塞节点和可判断的终点，保持路径推进结构。
failure_boundary: 开放式体验、没有关卡顺序或不存在完成状态的活动，不具备被贯通的路径，使用此喻会虚构终点。
