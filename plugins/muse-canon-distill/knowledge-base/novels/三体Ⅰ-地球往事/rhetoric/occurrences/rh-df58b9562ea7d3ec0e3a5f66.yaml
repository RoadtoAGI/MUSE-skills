review_status: reviewed
tenor: “如果你不同意，现在还来得及”所包含的一生自由与终身留守后果
vehicle: 需要身体承受、不能轻易拿起的重物
ground: 决定牵动她一生对应重物施加巨大负荷；回答不能随意更改对应拿起重量后行动受限
