figure_type: simile
quote: 他们的旗帜在大楼周围躁动地飘扬着，仿佛渴望干柴的火种
sensory_mapping: 视觉；运动；温度；危险
context_fact: 两派武斗已持续两天，进攻方仍围楼寻求突破。
image_mechanism: 旗帜的红色和抖动先收缩成跳跃火星，“渴望”再给火种赋予主动觅食性；大楼和守军由此成为只待引燃的干柴。
property_alignment: 红旗颜色对应火种红亮；躁动飘扬对应火星跳动；寻找冲突对象对应火种等待干柴；攻击升级对应点燃蔓延
context_alignment: 武斗本就处于可爆炸升级的边缘，火种将视觉旗帜与局势危险合成同一图景。
narrative_function: 以开篇动态图像预告暴力即将吞噬个体。
transfer_rule: 用点火意象写群体冲突时，应同时找到可见的红亮载体、尚未接触的燃料和一触即发的扩散路径。
failure_boundary: 和平集会、旗帜静止或冲突正在熄灭时，觅柴火种会虚构主动攻击欲和升级趋势。
