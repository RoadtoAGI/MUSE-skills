tenor: 油污海鸟的临死目光成为伊文斯长期无法摆脱的创伤记忆和职业伦理驱动力
vehicle: 一双双真实眼睛始终跟在身后凝视、监督并逼迫被注视者沿某条道路行动
ground: 记忆持续存在对应目光一路跟随；负罪和责任感对应背后监督；人生选择受影响对应目光决定方向
