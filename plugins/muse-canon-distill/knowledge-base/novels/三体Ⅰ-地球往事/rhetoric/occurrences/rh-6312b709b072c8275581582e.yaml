figure_type: simile
quote: 文雪揭发父亲的材料文笔激烈，读那一行行字就像听着一挂挂炸响的鞭炮
sensory_mapping: 视觉转听觉；爆裂声；节奏；冲击
context_fact: 叶文洁熟悉妹妹以激进红卫兵口吻写过的大量揭发材料。
image_mechanism: 安静纸行被点燃为一串引信，目光每扫过一行，就触发一枚爆响；修辞强度由词义转成耳膜承受的连续冲击。
property_alignment: 文字逐行推进对应鞭炮逐枚连爆；措辞激烈对应爆声尖锐；政治口号密集对应炸点连续；阅读受到强刺激对应耳朵被响声冲击
context_alignment: “一行行”与“一挂挂”在数量和顺序上严密配对，且文雪的公开激进风格适合喧响而非暗伏。
narrative_function: 通过通感区分妹妹的表面激烈与眼前材料的冷静杀机。
transfer_rule: 把文字转成声响时，应让阅读单位对应发声单位，句法节奏对应爆点次序，语气强度对应声压。
