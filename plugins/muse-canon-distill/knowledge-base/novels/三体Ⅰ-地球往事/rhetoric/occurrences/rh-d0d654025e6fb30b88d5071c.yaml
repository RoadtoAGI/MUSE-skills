tenor: 瘦小老红卫兵长期紧张、尖细而无法放松的说话音色
vehicle: 声音成为随身容器，无论说什么都携带一份来源不明的惊恐
ground: 音调持续尖高对应恐惧使声带绷紧；情绪渗入每句话对应声音始终把惊恐带出
