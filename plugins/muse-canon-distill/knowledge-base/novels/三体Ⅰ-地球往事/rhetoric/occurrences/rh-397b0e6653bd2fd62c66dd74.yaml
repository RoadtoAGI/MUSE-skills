tenor: 确认外星舰队后，人类会重估既往战争、国家事件和自我身份，文明精神坐标发生根本变化
vehicle: 旧的人与世界结束一次生命，新个体和新世界重新出生，拥有不同记忆权重和规则
ground: 价值体系重置对应新人诞生；旧战争失去意义对应旧世界消亡；共同敌人出现对应新世界规则建立
