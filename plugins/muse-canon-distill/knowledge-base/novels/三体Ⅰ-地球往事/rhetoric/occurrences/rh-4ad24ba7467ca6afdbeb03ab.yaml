tenor: 技术更先进、作用更关键的红岸监听部
vehicle: 位于系统内部并支配整体运作的核心部件或器官
ground: 监听部掌握更先进设备对应核心容纳关键能力；其情报为红岸行动提供依据对应核心决定系统功能
