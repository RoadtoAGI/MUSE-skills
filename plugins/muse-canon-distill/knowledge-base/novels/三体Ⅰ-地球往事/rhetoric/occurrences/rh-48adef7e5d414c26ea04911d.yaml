tenor: 原子自然低维展开会丢失原有高维结构信息，因此无法从展开平面逆推并恢复原子
vehicle: 杯子破碎后原有连续形状和连接关系丢失，碎片不能自行还原成完整器皿
ground: 降维丢失结构关系对应打碎破坏杯形；展开结果对应碎片；信息缺失使逆过程无唯一解对应无法还原
