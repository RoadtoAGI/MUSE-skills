tenor: 物理学家因智子污染实验而无法认识物质更低尺度的结构和规律
vehicle: 观察者站在表层之外，试图向幽深隐蔽处偷看被遮藏的秘密，却始终看不清内部
ground: 微观层级对应空间深处；实验观测对应窥视；未知规律对应被藏秘密；智子干扰对应遮挡视线
