tenor: 泪水折射下模糊、抖动并泛出绿光的屏幕代码
vehicle: 边界不定、成团闪动的火焰
ground: 泪膜使字符轮廓散开对应火焰无固定边缘；屏幕光随泪水与眨眼跳动对应火苗跃动
