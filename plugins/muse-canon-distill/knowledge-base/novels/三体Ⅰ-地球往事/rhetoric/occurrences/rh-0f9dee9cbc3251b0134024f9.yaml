review_status: reviewed
tenor: 被三日引力剥离的物质沿旋涡轨迹最终坠入太阳并毁灭
vehicle: 漂泊者或河流经过漫长迁移，最终抵达其注定安顿的归宿
ground: 万物运动路径收束到太阳对应旅程抵达唯一终点；坠入后不再返回对应在归宿处结束漂泊
