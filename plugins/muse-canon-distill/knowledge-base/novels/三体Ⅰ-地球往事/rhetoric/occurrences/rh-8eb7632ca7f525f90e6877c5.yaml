context_alignment: 数字、视野和背景正具备屏幕叠层关系，电影媒介比悬浮物更精确。
narrative_function: 解释视野锁定机制并暗示现实被外力当作画面操纵。
transfer_rule: 写与观察者视野绑定的现象时，应区分前景信息层与后景世界层，并选能说明二者独立运动的媒介结构。
failure_boundary: 数字固定在真实墙面、随视线移出，或本来就是设备抬头显示时，电影字幕不再表现超常锁定。
