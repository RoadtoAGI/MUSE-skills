tenor: 在单一太阳、气候相对稳定且长期免受乱纪元灭绝考验的地球文明
vehicle: 温度恒定、四季如春并隔绝外界风霜的美丽温室，以及其中被精心养护的娇嫩植物
ground: 地球稳定环境对应温室恒温；文明少受行星灾变对应植物免受风霜；自由文化繁盛却抗逆弱对应花木美丽娇嫩
