tenor: 三体人认出天空杂乱结构全是眼睛后，恐惧迅速从观察者扩散到全行星人群
vehicle: 巨大风暴或海浪横扫广阔地表，短时间覆盖所经区域并裹走原有状态
ground: 恐惧快速传播对应风浪推进；覆盖全世界对应席卷范围；情绪压倒镇静对应浪潮吞没；突发辨认对应风暴骤起
