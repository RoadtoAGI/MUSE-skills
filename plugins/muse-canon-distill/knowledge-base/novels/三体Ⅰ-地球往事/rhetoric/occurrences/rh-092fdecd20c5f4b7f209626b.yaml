review_status: reviewed
tenor: 原本随机的电波曲线出现细微但可感的智能调制和目的性结构
vehicle: 无生命躯体突然获得灵魂，从机械运动转为有意志、有意义的生命表现
ground: 波形由随机变为携带信息对应身体从无意识到有思想；叶文洁感到不可言说差异对应灵魂不能直接看见却能从行为辨认
