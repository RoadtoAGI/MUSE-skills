tenor: 峰顶俯看的银白云海，其波状起伏在形态上复现被遮住的大兴安岭山岭
vehicle: 把具体山林抽去树木、岩石、颜色和重量后，只保留高低节律与整体关系的抽象模型
ground: 云浪起伏对应山岭起伏；云层覆盖在山上却保留其形势对应抽象再现；银白统一材质对应去除具体物性
