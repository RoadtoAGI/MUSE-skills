quote: 云海在阳光下一片银白，那起伏的形状，仿佛是云下的大兴安岭某种形而上的抽象再现
sensory_mapping: 银白云浪；山脊节律；上下叠影；材质抽空；形态模型
context_fact: 登峰者已越过云层，真实大兴安岭藏在云下，只能看见其上方云海的起伏。
image_mechanism: 云层像一张柔软的拓印纸覆在群山上，接收山势却抹去森林和岩土；观者看到的是地貌关系脱离实体后的白色思想图。
property_alignment: 云海波峰对应山脊；云谷对应山谷；覆盖关系对应拓印来源；银白同质对应抽去地物颜色；无固体重量对应形而上抽象；整体延展对应大兴安岭尺度
context_alignment: 红岸实体设施已消失，云海以抽象形态保留山岭，和记忆保留事件结构而失去现场痕迹互相映照。
narrative_function: 使结尾景观同时容纳可见云海与不可见故地，为历史消失主题建立空间模型。
transfer_rule: 用抽象再现写自然叠影时，应指出原物、被保留的形式关系、被删除的具体材质及两者空间因果。
failure_boundary: 云面平坦不随山势、下方并非对应地貌，或比照只因二者都起伏而无覆盖关系时，形而上再现会显玄虚。
