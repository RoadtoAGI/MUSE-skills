tenor: 老师面对天赋极高却懒散、不肯展示推导的魏成时的为难
vehicle: 带刺、难以下手且找不到合适处置方式的棘手物件
ground: 魏成价值高却不配合常规教育对应物件重要但难握持；老师来回思索办法对应处理者寻找不扎手的下手位置
