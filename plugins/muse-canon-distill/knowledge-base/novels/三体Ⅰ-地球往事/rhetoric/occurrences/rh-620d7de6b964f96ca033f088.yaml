review_status: reviewed
tenor: 文革中流落到中学任教、外表普通却有高深才能的教师群体
vehicle: 伏卧的猛虎与隐藏的蛟龙暂不显露力量
ground: 人才身处普通岗位而未被识别对应龙虎藏伏不露形；能力一旦遇事显现便远超环境预期对应猛兽潜力巨大
