context_fact: 魏成到警局报案时，值班人员没有询问便直接让他找大史，显示专案组已有其资料。
image_mechanism: 秘密调查名单被改成挂在窗口后的公开号码牌，魏成一进门便像等候处理的病人被叫号；无形监控获得机构化流程。
property_alignment: 警方预先建档对应挂号登记；值班员即时识别对应按号码检索；被导向专案负责人对应挂号后进入指定科室流程
context_alignment: 魏成以懒散口语理解警方监控，用日常就医经验淡化却也暴露自己已卷入大案。
narrative_function: 提示申玉菲和魏成早受专案组关注，扩大读者对案件网络的认识。
