tenor: 高维智子无需穿破三维墙壁，可沿额外维度直接进入任意三维封闭空间
vehicle: 三维人从纸面上方把手放进一个二维闭合圆内，而纸上生物只能破坏圆周才能进入
ground: 三维房间对应二维圆；墙壁对应圆周；额外维入口对应纸面上方；低维居民受困对应只能沿平面穿边界
