chapter: 第34章 智子
figure_type: analogy
quote: 我们能轻易从上方进入平面上的一个圆，而平面上的二维生物永远不可能，除非它打破那个圆
sensory_mapping: 纸上圆圈；手从上方落入；闭合边界；破圈；维外绕行
context_fact: 智子要进入地下控制室，元首误以为它必须穿透地层。
image_mechanism: 地下墙壁被压成纸上圆线，对三维居民它封闭全部方向，对高维智子却漏出整片上方；所谓穿墙被改写为绕过边界维度。
property_alignment: 控制室对应圆内区域；墙和地层对应圆周；三维人对应二维生物；智子对应三维观察者；高维路径对应从上方进入；破墙对应二维生物打破圆
context_alignment: 显式卡L2593解释高维为何能看见内部，本卡进一步解释为何能进入内部，功能不同。
narrative_function: 纠正穿透材料的错误直觉，说明智子无视任何三维封闭设施的能力。
transfer_rule: 用高一维进入封闭区时，应对应低维边界的闭合、额外方向、高维绕行和低维主体只能破边进入。
failure_boundary: 边界限制来自加密、场相互作用而非几何封闭，或高维实体仍受材料耦合阻挡时，纸圆模型不能保证进入。
