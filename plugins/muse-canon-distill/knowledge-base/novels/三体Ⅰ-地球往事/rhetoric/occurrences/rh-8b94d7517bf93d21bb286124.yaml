tenor: 多年政治迫害、背叛和危机经验磨出的危险判断力
vehicle: 长期经历风吹雨打后形成的天气感知与抗性
ground: 反复外部打击对应多年风雨侵袭；从细微信号预判危险对应经风雨者能察觉天气变化
