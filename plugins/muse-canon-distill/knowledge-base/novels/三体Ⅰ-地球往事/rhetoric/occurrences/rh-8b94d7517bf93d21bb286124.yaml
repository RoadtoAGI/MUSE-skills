chapter: 第13章 红岸之二
figure_type: metaphor
quote: 这么多年的风风雨雨形成的敏感告诉她，今天倒霉的人可能不是她
sensory_mapping: 触觉；天气；时间累积；危险预感
context_fact: 叶文洁进入领导齐聚、目光冰冷的办公室，凭过往受审和被陷害经验判断主要受罚者可能是雷政委。
image_mechanism: 政治灾难被连续化成多年恶劣天气，身体每次受袭都留下感受器；此刻语气、座位和目光如气压变化，被她提前读成风暴征兆。
property_alignment: 政治运动和背叛对应风雨反复袭击；长期受难对应身体久经天气；对不祥氛围敏锐对应经验者感知风暴前兆
context_alignment: 她不是凭抽象推理而是以创伤形成的直觉反应，风雨同时容纳外部环境不可控和多年累积。
narrative_function: 让读者相信她能迅速判读审查场面，也强调这种能力的痛苦来源。
transfer_rule: 用风雨写长期磨难时，应让每次外部冲击留下可用于当前判断的感知变化，而非只罗列苦难。
failure_boundary: 经历单一、当前环境与旧危机无相似信号或人物因此变迟钝时，风雨形成敏感的因果链不成立。
