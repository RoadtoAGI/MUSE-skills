quote: 汪淼抬头看看反应黑箱，觉得它像一个子宫
sensory_mapping: 形状；内部空间；生命过程
context_fact: 设备故障频发，工程师围着它艰难维持，汪淼即将停机。
image_mechanism: 球形黑箱先成为封闭孕育空间，围在外面的工程师随即成为维持生命条件的人；停机因此被感成中止一场艰难孕育。
property_alignment: 设备内部生成新材料对应子宫孕育生命；工程师维持传感和反应条件对应母体维持孕育环境；封闭球体包裹过程对应子宫内部空间
context_alignment: 生成、包裹、维护三项均在现场成立，且贴合汪淼面对停机的心理压力。
narrative_function: 让应用研究产出获得生命尺度。
transfer_rule: 用生命器官比拟生产系统时，必须同时对应内部生成、环境维持和外部照料，不能只凭圆形外观。
failure_boundary: 只储存成品、没有内部生成过程，或无需持续维持环境的容器不适用子宫；否则会滥加生命伦理。
