review_status: reviewed
tenor: 耳机中无生命、似乎从不停止的宇宙背景噪声
vehicle: 比恒星寿命和星光存在还更持久的恒常之物
ground: 噪声每次监听都持续存在对应星星跨越人类一生仍在；噪声没有可辨起止对应永恒缺少时间边界
