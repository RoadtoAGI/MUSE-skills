chapter: 第15章 红岸之四
figure_type: simile
quote: 这噪声隐隐约约的，好像比那些星星还永恒
sensory_mapping: 听觉；时间长度；微弱连续性
context_fact: 叶文洁多年夜间监听，始终只听到没有生命信息的隐约噪声，未收到任何外星回应。
image_mechanism: 极弱声流被沿时间轴无限拉长，视觉上古老的群星反而成为可被它超越的短暂标尺；微弱不再等于短促，而成了磨人的恒常。
property_alignment: 噪声多年不间断对应恒星长久存在；听不到开端终点对应永恒无边界；信号微弱却始终在场对应远星黯淡而持续可见
context_alignment: 监听者以星空作职业背景，拿星寿命衡量声音持续性符合她的天文学经验，也把长期无回应写成时间压迫。
narrative_function: 让背景噪声获得超越个体生命的时间尺度，深化外星沉默的孤独。
transfer_rule: 写微弱却持久的感受时，可选角色熟悉的长时标作比较，并同时对齐持续、无起止和个体寿命差。
failure_boundary: 噪声间歇明显、有确定来源和周期，或人物只听过一次时，“比星星永恒”会失去长期经验依据。
quality_assessment: effective
