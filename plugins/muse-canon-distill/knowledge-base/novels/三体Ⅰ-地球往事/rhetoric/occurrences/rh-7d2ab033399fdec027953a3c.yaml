chapter: 第15章 红岸之四
figure_type: metaphor
quote: 宇宙是个空荡荡的大宫殿，人类是这宫殿中唯一的一只小蚂蚁
sensory_mapping: 建筑空间；尺度；声音空寂；生命数量
context_fact: 红岸二十多年未听到任何外星文明信号，叶文洁从感觉上接受智慧生命或许只有地球存在。
image_mechanism: 宇宙先被围合成一座可测量的空建筑，恒星变成没有住客的陈设；人类再缩成地面一点活动的小生命，宏伟空间反而加倍显示居住者的孤绝。
property_alignment: 宇宙巨大对应宫殿宏阔；无外星回应对应房间空荡无住客；人类尺度微小对应蚂蚁；唯一智慧生命假设对应宫殿中只有一只活物
context_alignment: 宫殿通常因居住者而有意义，此处空置让宇宙的宏伟失去庆典感；蚂蚁又承接她对生命珍贵与不值一提的矛盾。
narrative_function: 同时表达宇宙壮阔、人类孤独和价值尺度矛盾。
transfer_rule: 用建筑容纳宏观系统时，应为体量、空置程度和主体相对尺寸分别安排对应，并利用建筑通常用途与实际空无的反差。
failure_boundary: 已有多个文明交流证据、空间边界并非可围合，或叙事强调人类掌控宇宙时，空宫独蚁会失去事实和力量关系。
quality_assessment: exemplary
