chapter: 第17章 三体问题
figure_type: metaphor
quote: 它悬在那里，永远不会做丝毫的运动，永远不会有丝毫的变化，真是对死亡最到位的诠释
sensory_mapping: 视觉静止；时间冻结；生命状态
context_fact: 空宇宙只有一个有质量球体，没有别物对它施力，它也不能对别物作用。
image_mechanism: 物理学的零作用状态被放进一具没有脉搏的身体，永恒时间不再带来任何新姿态；静止因无限延长而从安宁翻成死亡。
property_alignment: 无外力运动对应身体无动作；无相互作用对应生命与环境断联；永远不变对应死亡后不再发展；单一存在对应死寂孤绝
context_alignment: 魏成本想借空获得宁静，却发现绝对静止等同死亡，准确开启他从一体、二体到三体寻找“活”变化的过程。
narrative_function: 定义魏成所厌恶的简单确定性，并为三体复杂运动赋予生命价值。
transfer_rule: 将静态系统比作死亡时，应同时落实动作停止、关系断绝和未来变化归零，而非只因画面安静。
failure_boundary: 系统静止却内部活跃、正在休眠等待触发或静态本身有生长意义时，死亡会错误取消潜能。
