tenor: 没有任何相互作用、永恒静止不变的单球宇宙状态
vehicle: 生命活动全部停止、未来不再产生变化的死亡
ground: 球体无运动对应死亡身体不再行动；状态永不变化对应生命过程和时间意义终止
