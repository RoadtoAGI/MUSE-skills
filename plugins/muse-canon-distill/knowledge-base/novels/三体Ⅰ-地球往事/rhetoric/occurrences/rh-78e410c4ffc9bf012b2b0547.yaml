review_status: reviewed
tenor: 女作家长期用文学细致剖析并公开人性和社会的丑恶结构
vehicle: 外科或尸检者以锋利解剖刀切开身体表层，显露内部病变和器官关系
ground: 文学分析表象下动机对应刀刃切开皮肤；揭示隐蔽丑恶对应暴露内部病灶；长期写作对应反复精细解剖
