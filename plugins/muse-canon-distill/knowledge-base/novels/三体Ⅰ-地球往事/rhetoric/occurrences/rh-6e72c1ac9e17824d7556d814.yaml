review_status: reviewed
tenor: 规则几何彻底崩解后铺满天空、形状纷乱有机且色彩怪异的质子高维结构投影
vehicle: 巨大身体遭肢解，断开的四肢与湿软内脏散布在视野中
ground: 形态由规则转为有机紊乱对应肢体器官；大片结构分离对应尸体被肢解；怪异变幻色彩对应内脏肉色和湿润表面
