chapter: 第34章 智子
figure_type: simile
quote: 更像是一个巨人被肢解后的肢体和内脏
sensory_mapping: 断肢轮廓；内脏柔软；血肉色彩；天空尸块；惊骇厌恶
context_fact: 几何体融化后复杂度进一步增加，观察者不再联想到玩具积木。
image_mechanism: 同一巨人孩子的尺度被黑暗翻转：撒出的玩具像来自巨人自身被拆开的身体，天空从游戏桌变成解剖场；无机空间结构因此取得血肉恐怖。
property_alignment: 巨大投影对应巨人体量；结构分块对应肢解部位；长条弯曲物对应四肢；团块褶皱物对应内脏；色彩怪异对应血肉表面；散布半空对应尸块四散
context_alignment: 积木的童真比照已不足以容纳变形复杂度，转为肢解巨人既跟随可见形态，也把失败实验的危险情绪推高。
narrative_function: 将科学奇观转为宇宙身体恐怖，提示质子内部可能含有难以理解的复杂世界。
transfer_rule: 用肢解身体写复杂散块时，应从肢状与器官状轮廓、柔软度、色泽、分离方式和尺度恐怖中建立对应。
failure_boundary: 结构仍保持干净规则几何、色彩单一金属化或各块有明确机器功能时，内脏意象会徒增血腥而缺视觉支点。
quality_assessment: exemplary
