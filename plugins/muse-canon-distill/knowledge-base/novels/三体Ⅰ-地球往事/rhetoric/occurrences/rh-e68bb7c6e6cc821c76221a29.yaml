tenor: 长老所说“空”并非绝对虚无，而是一种能占据、改变主体的积极状态
vehicle: 现代物理中看似真空却具有场、能量或结构的物理状态
ground: 空表面没有普通事物对应真空缺少粒子物质；空仍是一种存在且能填充对应物理真空仍有状态与效应
