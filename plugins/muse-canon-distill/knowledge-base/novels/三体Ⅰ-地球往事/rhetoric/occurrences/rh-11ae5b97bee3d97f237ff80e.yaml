chapter: 第19章 聚会
figure_type: metaphor
quote: 己对其参与者产生了很深的心理影响
sensory_mapping: 空间深度；向内穿透；表层与内层；残留痕迹
context_fact: 七名玩家提前到场却没有热烈讨论，人人沉默等待，显然游戏体验已超出普通娱乐。
image_mechanism: 心理被赋予层层向内的结构，游戏没有停在可闲聊的表皮，而像探针沉到内部，使言语要从深处上浮才说得出口。
property_alignment: 普通游戏印象对应浅表触碰；价值观震动对应深入内层；难以谈起对应深处内容不易取出；影响持久对应深层痕迹不易磨灭
context_alignment: 咖啡厅表面安静与每人内部震动形成深浅反差，解释这场精英聚会为何反常地沉默。
narrative_function: 把群体沉默解释为游戏的深层筛选效果，为组织招募气氛定调。
transfer_rule: 用深度写心理影响时，应呈现它触及的内在层面、表面可见反应和难以迅速恢复或言说的结果。
failure_boundary: 体验只造成短暂兴奋、玩家能轻松闲聊且价值判断未变时，“很深”会成为无证据的强度词。
