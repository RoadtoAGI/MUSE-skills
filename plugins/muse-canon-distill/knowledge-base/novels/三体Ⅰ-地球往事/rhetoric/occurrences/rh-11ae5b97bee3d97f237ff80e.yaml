tenor: 《三体》带给玩家持久、触及核心观念且难以轻易说出的心理改变
vehicle: 力量从表面向物体内部穿透，抵达距离外壳很远的深层
ground: 影响触及隐秘价值判断对应作用深入内部；影响不易消退对应深处痕迹难从表面抹去
