tenor: 海洋整体受叠加引力拉离地表时形成的巨大、起伏、透明水体
vehicle: 一列峰谷相接、绵延地平线并缓慢隆起的晶莹山脉
ground: 海水被拉成巨大起伏轮廓对应群峰连绵；水体透明反光对应晶体山峰闪耀
