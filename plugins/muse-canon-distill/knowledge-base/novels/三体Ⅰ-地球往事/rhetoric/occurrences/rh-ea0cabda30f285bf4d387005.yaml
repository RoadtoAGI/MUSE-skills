tenor: 叶文洁经历长期创伤后情感活力近乎熄灭，难以对杨卫宁产生热烈爱情
vehicle: 燃料已烧尽只剩冷灰，缺乏余火，无法再次点燃明亮温热的火焰
ground: 情感热度消失对应火焰熄灭冷却；爱情难以产生对应灰烬没有可燃物再起火
