context_fact: 他担心守军引爆十几个装满炸药的铁炉。
image_mechanism: 外部真实存在的炸药危险被内收到胸腔，焦急变成持续灼烧；熟语在火种与火炭密布的段落中重新获得实火温度。
property_alignment: 焦虑持续侵扰对应火焰持续灼烧；紧迫难耐对应高温疼痛；心绪失稳对应燃烧消耗
context_alignment: 同句布满火种、炸药、火炭，心中之火与将爆现场互相照应。
narrative_function: 压缩指挥官对爆炸风险的急迫感。
transfer_rule: 采用熟语时，可让周边物理环境提供同源感官细节，使惯用映射获得当前场景的具体温度。
failure_boundary: 人物只是理性催促或缓慢忧虑，且场景没有灼热危险时，“焚”会把情绪强度写得过高。
