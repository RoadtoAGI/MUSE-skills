tenor: 三体文明反复被极端天灾毁灭，却由幸存生命重新演化并建立下一轮文明
vehicle: 生命在烈火中被焚毁，又像凤凰从火焰和灰烬里重新出生
ground: 每轮文明遭太阳灾害毁灭对应身体投入火中；新文明从灾后出现对应生命由灰烬重生
