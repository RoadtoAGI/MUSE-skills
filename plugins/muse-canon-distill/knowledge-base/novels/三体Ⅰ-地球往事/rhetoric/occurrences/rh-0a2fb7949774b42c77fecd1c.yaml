tenor: 红岸显示器上无限延展、只有随机噪声起伏而不含智能信息的宇宙电波波形
vehicle: 一条连接过去未来的无尽道路，由大小沙粒连续排成荒凉沙漠，行者走多久也找不到归宿
ground: 波形横轴无限延伸对应道路贯穿时间；随机波峰密集无意义对应沙粒高低不一却不构成生命秩序
