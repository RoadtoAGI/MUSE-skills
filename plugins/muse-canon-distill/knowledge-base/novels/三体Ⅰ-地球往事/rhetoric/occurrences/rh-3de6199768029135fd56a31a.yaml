tenor: 毁灭后由幸存者反复恢复人口、社会和技术的三体文明
vehicle: 停机后可再次接通并从初始状态运行的系统
ground: 文明毁灭后活动中止对应系统停机；环境适宜后重新发展对应设备再次启动运行
