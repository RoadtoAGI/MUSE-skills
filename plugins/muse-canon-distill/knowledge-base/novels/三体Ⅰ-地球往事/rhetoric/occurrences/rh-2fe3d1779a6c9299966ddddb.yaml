figure_type: simile
quote: 教堂的罗马式尖顶像三根黑色的巨指，似乎在为他指出冥冥太空中的什么东西
sensory_mapping: 视觉；颜色；形态；指向动作；尺度；空间
context_fact: 汪淼漫走后停在王府井天主教堂前，仍被宇宙倒计时困扰。
image_mechanism: 教堂主体隐去，三条尖顶从建筑上分离成长成手指；共同上指把静态垂直线转成一个正在提示答案的手势，却不揭露所指对象。
property_alignment: 三座尖顶细长对应三根手指；黑色剪影对应黑指；尖端方向朝天对应指示手势；建筑尺度放大对应巨人肢体；目标不可见对应手指指向冥冥之物
context_alignment: 三这一数量、黎明黑色剪影和尖顶朝向均可见，教堂宗教属性又让未知指向带上超越意味。
narrative_function: 把偶然抵达教堂变成宇宙危机的视觉指引，引出圣乐场景。
transfer_rule: 把建筑尖顶写成手势时，应精确匹配数量、轮廓、朝向和观看者正在寻找的目标，让静态线条获得动作目的。
failure_boundary: 圆顶、尖顶朝向分散或人物没有追索对象时，巨指会强加统一手势和神秘意图。
