tenor: 三颗太阳在观察方向上排列成一条直线并同角速度运行的天象
vehicle: 三颗圆珠被线穿起，前后紧密排成一串
ground: 三个圆形太阳对应三颗圆珠；共线且互相遮挡对应珠子沿一根线串联
