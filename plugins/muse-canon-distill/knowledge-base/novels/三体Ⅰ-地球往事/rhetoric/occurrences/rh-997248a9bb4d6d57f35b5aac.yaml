chapter: 第1章 科学边界
figure_type: metaphor
quote: 科学对自然界的认知在深度和精度上是否存在一条底线——底线之下是科学进入不了的
sensory_mapping: 空间；深度；边界
context_fact: 丁仪介绍科学边界寻找科学局限的宗旨。
image_mechanism: 抽象认知被放进有上下层的空间：研究向深处推进，底线横向截断路径，越线后的区域则没有入口。
property_alignment: 认知能力有边界对应线分隔两侧区域；继续深入会失效对应越过底线便不能进入
context_alignment: 深度、底线、进入共享空间词汇，形成稳定概念地图。
narrative_function: 把认识论问题变成可讨论的空间目标。
transfer_rule: 表达能力极限时，可统一一套空间坐标，让方向、边界和越界后果使用同一几何关系。
failure_boundary: 若限制可被新工具连续推进、没有明确可达/不可达分区，硬画底线会把暂时技术瓶颈误写成绝对边界。
