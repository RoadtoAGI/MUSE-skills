tenor: 史强倒握冲锋枪时从腋下和手边露出的厚重枪柄，以及它马上被用于砸击的姿态
vehicle: 握柄短粗、头部沉重并专门用来敲砸硬物的榔头
ground: 枪柄外露的短粗轮廓对应榔头柄头；倒握后能抡砸对应榔头以重量冲击目标
