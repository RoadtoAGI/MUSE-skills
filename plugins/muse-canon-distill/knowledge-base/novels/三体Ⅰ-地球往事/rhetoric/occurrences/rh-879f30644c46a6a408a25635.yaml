review_status: reviewed
tenor: 主张全球起义者相信ETO成员即使遭政府大搜捕仍能幸存、扩散并重建组织
vehicle: 埋在土中的耐火种子或草根熬过野火，火后重新萌芽铺开
ground: 地下组织成员分散保存对应种子散落土中；镇压无法清除全部对应野火烧不到所有生命核心
