tenor: 山村少年因寒冷和劳作变黑、粗糙并布满深浅裂口的手
vehicle: 老树外层黝黑粗硬、纹理纵横开裂的树皮
ground: 手背皲裂纹路对应树皮裂纹；皮肤黑粗对应树皮暗色坚硬质感
