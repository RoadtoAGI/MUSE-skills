tenor: 三颗太阳围绕共同质心旋转并周期性以强光、热量扫过地表的景象
vehicle: 三片灿亮扇叶围绕轮轴转动、不断把致命热风吹向下方的巨型风扇
ground: 三日围绕不可见原点对应扇叶绕轴心；每颗太阳依次划过地平线对应扇叶周期扫过同一区域
