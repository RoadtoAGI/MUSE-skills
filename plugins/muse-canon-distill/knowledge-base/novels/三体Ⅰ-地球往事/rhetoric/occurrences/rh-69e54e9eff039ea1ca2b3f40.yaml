chapter: 第18章 三体、牛顿、冯·诺依曼、秦始皇、三日连珠
figure_type: metaphor
quote: 那些海量计算
sensory_mapping: 视觉广度；水体体量；数量压迫；空间无边
context_fact: 冯·诺伊曼已判断全世界数学家工作到末日也算不完，汪淼追问将用什么执行。
image_mechanism: 离散运算被汇成连续海面，单个步骤像水滴消失在总体中；提问者面对的已不是一叠题，而是一片无法徒步越过的水域。
property_alignment: 运算条目数量巨大对应水滴无数；任务覆盖范围广对应海面辽阔；人工完成困难对应个体被海量压倒
context_alignment: 紧邻“三千万人”的解法，海的总体尺度为随后以人海对抗计算海建立数量对称。
narrative_function: 快速放大算力缺口，让人列计算机的夸张规模获得必要性。
transfer_rule: 以海量写数量时，应让对象具有可累加单元、总体不可直观计数和压倒常规处理能力的规模。
failure_boundary: 对象只有几十或几百项、能轻易枚举，或难点来自单项复杂而非数量时，海量会错报问题性质。
