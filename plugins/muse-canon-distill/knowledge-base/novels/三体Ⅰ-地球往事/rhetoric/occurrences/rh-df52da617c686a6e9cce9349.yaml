chapter: 第7章 疯狂年代
figure_type: metaphor
quote: 连同那些梭镖和大刀等冷兵器，构成了一部浓缩的近现代史
sensory_mapping: 视觉；时间压缩；陈列；结构
context_fact: 射击武器从三八大盖到崭新冲锋枪，另有梭镖和大刀。
image_mechanism: 楼下杂乱兵器被排成一条时间轴，每件武器成为一个年代的页码；百年技术演变被折叠到同一场枪击中供人一眼读完。
property_alignment: 不同武器的制造年代对应历史时期；武器并置对应时代章节并排；一处楼顶聚齐百年器物对应漫长历史被空间压缩；武器演进对应现代史暴力线索
context_alignment: 列举本身按旧枪、新枪、冷兵器显出年代层次，“浓缩”准确解释异质装备为何共同出现。
narrative_function: 用武器谱系扩大一场武斗的历史纵深，并暗示暴力贯穿现代化。
transfer_rule: 把器物集合写成历史时，应让各物件有可辨年代、排列能形成时间序列，并由同一功能揭示跨时代连续性。
failure_boundary: 器物年代相同、来源只是随机拼凑或读者无法辨别时间标记时，称为历史会成为空泛拔高。
