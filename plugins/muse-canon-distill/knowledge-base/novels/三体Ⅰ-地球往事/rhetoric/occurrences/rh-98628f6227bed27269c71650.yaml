tenor: 三日凌空时被全域强辐射加热、足以熔岩的行星地表
vehicle: 以极高温度熔化矿石和金属的冶炼炉
ground: 地表整体达到熔岩温度对应炉腔持续高热；岩石被熔化对应矿料在冶炼炉中转为液体
