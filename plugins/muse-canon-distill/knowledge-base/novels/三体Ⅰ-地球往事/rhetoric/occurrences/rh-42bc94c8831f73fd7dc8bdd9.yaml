chapter: 第32章 古筝行动
figure_type: simile
quote: 那声音听起来像一台大马达的转子中被扔进去一个扳手，不，是很多个扳手
sensory_mapping: 金属撞击；高速旋转；卡死震动；杂乱巨响；零件飞出
context_fact: 船尾刚穿过飞刃，外观暂时无异，发动机声先暴露内部已被切割，随后曲轴撞破船壳飞出。
image_mechanism: 不可见切口通过声音显形：听者把密闭机舱想成马达外壳，每根断裂部件都变成被甩动的扳手，数量从一个纠正为很多个，响声遂获得破坏过程。
property_alignment: 船机转子对应大马达转子；切断金属件对应落入扳手；转动失衡对应硬物卡阻；连续杂响对应多个扳手碰撞；曲轴飞出对应内部零件被甩脱
context_alignment: 飞刃肉眼不可见且切割无声，机械的二次崩坏必须靠听觉说明，扳手参照让普通读者立即理解。
narrative_function: 把隐藏在船壳内的切割后果转译成可听机械事故，并引出曲轴破舱。
transfer_rule: 用异物入转子解释机械噪声时，应匹配旋转结构、金属硬碰、数量节奏、失衡方式和随后可见故障。
failure_boundary: 声音是平稳低鸣、故障来自燃烧或电路，或设备没有旋转部件时，扳手入马达会误诊机制。
