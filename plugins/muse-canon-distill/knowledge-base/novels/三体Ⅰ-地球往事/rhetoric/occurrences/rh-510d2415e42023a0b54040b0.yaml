tenor: 执政官得知地球仅四光年远后迅速扩散却受纪律压制的狂喜，以及元首随即以危险预判使其冷却
vehicle: 岩浆和压力已在火山内部积聚却被山体封住，外部一盆冷水暂时压低其喷发热势
ground: 狂喜强烈积聚对应岩浆压力；不能表露对应火山口被压；情绪可能集体爆发对应喷发；坏消息降温对应泼冷水
