review_status: reviewed
tenor: 国电领导听清众人欢迎外星入侵后，突然以陌生、警惕目光重新观察同席网友
vehicle: 初次进入陌生群体，对每张脸重新辨认身份和危险
ground: 熟悉感因观点冲击消失对应旧识变成初见者；逐个环视判断对应初见时重新收集人物信息
