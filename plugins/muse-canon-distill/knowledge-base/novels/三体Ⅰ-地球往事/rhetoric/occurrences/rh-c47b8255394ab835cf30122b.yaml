tenor: 密集蝗群从空中降落并包围三人，使他们切身感受数量庞大、反复涌现的地球生命力
vehicle: 黑云压来后暴雨倾泻，密集水滴从四面落下，人在雨幕中被完全浸没和洗涤
ground: 空中蝗群对应黑云；下落个体对应雨滴；数量密集对应暴雨；三人被包围对应沐浴；信心恢复对应雨水洗去醉意绝望
