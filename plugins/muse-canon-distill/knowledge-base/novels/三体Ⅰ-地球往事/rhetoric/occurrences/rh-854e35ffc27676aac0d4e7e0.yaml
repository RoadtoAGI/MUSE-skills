chapter: 第33章 监听员
figure_type: metaphor
quote: 整个舰队最终的结局就是坠入宇宙深渊
sensory_mapping: 黑暗无底；向下坠落；崖缘越过；无处着陆；失联
context_fact: 舰队只知道电波方向而不知距离，动力只允许一次减速，无法沿线大范围搜索。
image_mechanism: 平坦星海被翻成竖直悬崖，目标若不在减速点，舰队便像跨出崖缘，余速成为永不结束的下坠。
property_alignment: 宇宙黑暗对应深渊；目标未知对应看不见底；一次减速对应唯一攀点；错过目标对应踏空；燃料受限对应无法回攀；永久失联对应坠落不返
context_alignment: 元首仍选择冒险，因为三颗太阳也可能吞没行星，深渊将无路可选的生存困局视觉化。
narrative_function: 把导航和燃料风险压成不可逆坠落，标明首次远征的赌博程度。
transfer_rule: 用宇宙深渊写漂失时，应对应黑暗、无参照、惯性单向、制动机会有限和无法返航。
failure_boundary: 舰队可持续修正、补给或掉头，或沿途有多个候选目标时，无底坠落会夸大不可逆性。
