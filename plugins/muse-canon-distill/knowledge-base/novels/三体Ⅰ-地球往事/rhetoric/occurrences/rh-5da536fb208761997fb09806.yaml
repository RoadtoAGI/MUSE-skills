tenor: 监听员凭收到的文字信息自由想象地球海洋、森林和田野，精神暂时离开监听室
vehicle: 有翅膀的身体越过空间，在广阔景观间轻盈飞行并亲身感受风光
ground: 想象跨四光年对应飞越距离；注意在多处景观游移对应飞行穿梭；精神摆脱小室对应身体升空
