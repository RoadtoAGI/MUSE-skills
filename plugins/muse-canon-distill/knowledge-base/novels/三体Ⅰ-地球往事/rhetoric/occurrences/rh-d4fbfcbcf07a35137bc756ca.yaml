image_mechanism: 新闻重要性被换算成可扫除的重量，事件缩成地面上的毛和薄皮；侦查动作则是弯腰把别人扫掉的碎屑重新捡回证据桌。
property_alignment: 事件单件规模小对应残屑微小；看似价值低对应厨余杂物被丢弃；数量零散对应毛皮四处分布；纳入调查后可能有用对应被忽略残物重新收集
context_alignment: 大史的生活化粗口把抽象情报分级落到厨房尺度，也强调他专看专家忽略的小事。
narrative_function: 拓宽调查证据面，显示微小异常也可能属于整体行动。
transfer_rule: 用生活残屑写琐事时，应交代谁按何标准丢弃、残屑怎样分散、重新收集后能提供什么关系证据。
failure_boundary: 小事件仍可能伤害具体个体，不能因“鸡毛蒜皮”否认其价值；若它与主线无可验证联系，捡回也不会成为证据。
