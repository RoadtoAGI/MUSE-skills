tenor: 《三体》用人类熟悉的视觉、人物和历史表象包裹陌生三体文明内核以降低进入门槛
vehicle: 生物或器物的外壳遮住并保护内部结构，接触者先摸到表面，深入后才见内里
ground: 人类历史表象对应外壳；三体文化对应内部；降低陌生感对应壳面熟悉；玩家深入对应穿透壳层
