tenor: 灾难后幸存的生命将再次演化，并发展出新一轮文明
vehicle: 停机的机器在条件恢复后重新接通电源并开始运行
ground: 文明活动被毁灭中断对应机器停机；漫长时间后演化再开始对应系统重新上电运行
