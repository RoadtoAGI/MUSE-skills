chapter: 第18章 三体、牛顿、冯·诺依曼、秦始皇、三日连珠
figure_type: metaphor
quote: 生命和文明将重新启动
sensory_mapping: 开关；机器停转；通电；运转声
context_fact: 第184号文明已被三日连珠彻底毁灭，游戏提示未来仍会出现生命与下一轮文明。
image_mechanism: 生命史被写成可反复开关的系统，灾变按下停止键，行星没有永久死亡，只在黑屏后等待条件让进化程序再次运行。
property_alignment: 文明毁灭对应系统关机；幸存潜能对应机器仍可重启；环境恢复对应重新供电；再次进化对应程序从头运行
context_alignment: 刚结束的人列计算机情节把启动、锁死、热启动写得具体，此处用同一机器动词统摄整个生命文明循环。
narrative_function: 把末日转成循环节点，邀请玩家进入下一轮并延续三体问题。
transfer_rule: 用启动写生命或制度复苏时，应有明确停机状态、保留的重启条件和重新开始的过程。
failure_boundary: 旧文明成员、制度和记忆全部消失时，新文明并非同一机器简单重启；喻体只能指过程再现，不能指身份连续。
