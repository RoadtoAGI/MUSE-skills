novel: 三体Ⅰ-地球往事
author: 刘慈欣
lang: zh
translator: ''
narration_voice: 现实线限知贴汪淼，历史线贴叶文洁并穿插全知史评
diction: 白话托底，科学军政术语精确入文，口语与庄重书面语分线
rhetoric_density: medium
dialogue_mode: 用问答推进论证和设定，短句对答区分学者、军警与组织语域
pacing: 说明与奇观长段蓄势，转折用短句骤停，以冷句或仪式句收束
signature_moves:
- 现实调查与历史回溯交错：当代线贴随汪淼逐层解谜，历史线以叶文洁经历和全知史评补足因果
- 机制经问答和演示落地：让人物借台球、天文观测、作战推演等道具逐步推到科学结论
- 先交代术语、数字和操作步骤，再把抽象尺度展开成宇宙闪烁、人列计算机或三日凌空的可见奇观
- 嵌入警告原文、审讯问答、会议简报等准文档语态，让信息块同时承担悬疑和权力压力
- 在长段蓄势后用按键、宣告、轻语等单一动作或短句封口，让转折留下文明尺度的余震
anti_signature:
- 华丽修辞连续堆叠，压过科学机制、物理尺度与事件推进
- 科学设定停留在朦胧暗示，缺少术语、数字、实验或推演链
- 对白沉入日常寒暄，未携带信息、立场、论证或行动决策
author_cross_ref: 与同作者作品共享问答释设定、奇观慢摇与冷句收束；本作以现实调查、文革史述双轨和科学危机悬疑见长
style_card_by: gpt-5
