novel: 阿Q正传
author: 鲁迅
lang: zh
translator: ''
narration_voice: 冷静旁观和贴身反讽交替，让自欺逻辑自行暴露
diction: 半文半白，粗口、旧礼、官样词和新词并置
rhetoric_density: medium
dialogue_mode: 短促命令、辱骂和独白交替，对白常被叙述截断
pacing: 先平铺社会常态，再以突发羞辱或冷句收束
signature_moves:
- 把人物自我辩解写成可笑的推理链
- 用众人议论替代判词，让群体冷酷显形
- 把大词降格为私欲、器物和口头禅
- 在暴力后接平静解释，制造反讽落差
- 用重复句式呈现失败到胜利的心理翻转
anti_signature:
- 连续抒情替代冷叙和反讽
- 让人物获得清晰自省和完整觉醒
- 把革命、司法、礼法写成庄严正剧
author_cross_ref: ''
style_card_by: Codex (executor)
