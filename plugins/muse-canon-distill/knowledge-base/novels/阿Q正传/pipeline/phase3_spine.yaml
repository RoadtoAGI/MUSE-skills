inciting_incident:
  description: |
    阿Q在赵太爷家做短工时，对女仆吴妈突然说出"我和你困觉"并下跪（第四章"恋爱的悲剧"）。
    这一事件导致连锁反应：被秀才用竹杠打、被地保罚钱赔罪、被赵府永远禁入、
    全村女人躲避他、没有人再叫他做短工——他在未庄的经济和社会生存同时被切断。
  type: decision  # 阿Q主动做出的选择（虽然是冲动的），不是偶然事件
  timing: 第四章，约故事30%处
  balance_before: |
    虽然地位卑微、经常被打，但阿Q在未庄有基本的生存空间：
    有短工可做、有酒店可赊、有土谷祠可住。精神胜利法运作良好，
    他能够将一切屈辱转化为心理上的"得胜"。第二、三章虽然写了他的
    种种失败，但这些都是可重复的循环——打了→精神胜利→酒店喝酒→睡觉——
    平衡虽然低质，但是稳定的。
  balance_after: |
    经济断裂（没人雇他做工）+ 社会断裂（全村女人躲避他）+ 空间断裂（被禁入赵府）。
    精神胜利法在饥饿面前首次完全失效——"第一倒是肚子饿"（第五章）。
    他被迫从"忍受屈辱但能活"的状态转入"连基本生存都无法维持"的状态。
  impact_on_protagonist: |
    激励事件暴露了阿Q作为"人"的基本需求（对异性的渴望、对家庭的向往——
    "应该有一个女人"），但这些需求在他的社会位置上是不被允许的。
    从此他被迫行动：偷萝卜→进城→做贼的帮手→返回未庄→试图参加革命——
    所有后续情节都是这一事件的因果延伸。

desire_object:
  conscious: |
    生存和地位——阿Q想要钱、想要被尊重、想要"要什么就是什么，欢喜谁就是谁"。
    这个欲望在不同阶段变换形态：偷萝卜（求食）→ 进城发财（求钱）→
    造反（求权力）→ 投降革命党（求身份）。
  unconscious: |
    被承认为"人"——不是精神胜利法式的幻觉中的"胜利"，而是真正被社会
    当作一个有姓名、有尊严、有存在价值的人来对待。
    阿Q从未意识到这一点。他追求的表层目标（钱、女人、革命分赃）都是
    这个深层需求的扭曲投射。
  tension: |
    阿Q的自觉欲望（地位/财富）和不自觉需要（被当作人）之间的悲剧性张力在于：
    他追求地位的每一种方式（精神胜利法、偷窃、革命幻想）都在强化那个
    不把他当人的社会结构。精神胜利法让他接受被打；偷窃让他被标记为贼；
    革命幻想让他成为替罪羊。他越努力"赢"，离真正的"人"越远。

spine_statement: |
  阿Q在被切断生存来源后，以一系列不断升级的方式试图重获地位和尊严
  （求食→求财→求革命），但精神胜利法使他对自身处境的理解始终是扭曲的，
  最终他不仅没有获得尊严，反而成了新旧权力交替中被随意消耗的牺牲品。

spine_type: unconscious  # 真正的脊椎是不自觉需要——被当作"人"

dramatic_question:
  question: 阿Q能否跳出精神胜利法的循环，获得真正的尊严和社会存在？
  obligatory_scene: |
    阿Q必须在一个他无法再用精神胜利法自欺的场景中面对自己的真实处境。
    这个场景就是第九章的最后——他在刑车上看到围观群众"又钝又锋利"的
    眼睛"咬他的灵魂"，喊出"救命"。这是全篇唯一一次阿Q放弃了
    精神胜利法，但已经太迟了。

opposing_forces:
  internal: |
    精神胜利法——最大的内在阻力。每当现实给出改变的机会或压力，
    精神胜利法都会介入，将痛苦转化为"胜利"的幻觉，从而消解行动的动力。
    例如：被假洋鬼子赶出来后，本应认识到自身处境的绝望，
    但他"赊了两碗酒，喝下肚去，渐渐的高兴起来了"。
  personal: |
    假洋鬼子——直接阻断了阿Q唯一可能的社会上升通道（参加革命党）。
    赵太爷——封建权力的代表，从第一章打阿Q嘴巴到最后赵家被抢后嫁祸给阿Q。
    地保——基层权力的执行者，每次都从阿Q身上榨取酒钱。
  external: |
    辛亥革命的历史进程——表面上提供了"翻身"的可能性，实际上
    新权力结构（把总+举人老爷+假洋鬼子）比旧的更高效地排斥底层。
    "惩一儆百"的需要恰好需要一个阿Q这样的替罪羊。

# ── 幕/Arc 框架（从高潮回溯：故事有几个重大逆转？）──

arcs:
  - arc_id: ARC-1
    name: "精神胜利法的世界"
    value_at_start: "脆弱的低质平衡——有短工可做，精神胜利法运作良好"
    value_at_end: "精神胜利法表面巩固但暴力链已完整暴露，性冲动的种子已埋下"
    climax_event: "阿Q连续被王胡、假洋鬼子打后，转向欺负小尼姑获得'胜利'——精神胜利法的完整循环展示（第三章）"
    function_note: "建置——确立精神胜利法的运作机制和未庄的等级秩序"

  - arc_id: ARC-2
    name: "从断裂到虚假中兴"
    value_at_start: "调戏吴妈打破生存平衡——全面社会断裂"
    value_at_end: "短暂'中兴'后贼行暴露，从'差不多赵太爷'跌为'不敢再偷的偷儿'"
    climax_event: "阿Q携赃物'中兴'归来后，贼行被揭穿——虚假上升被彻底粉碎，'敬而远之'变为轻蔑（第六章）"
    function_note: "对抗——激励事件的直接后果，阿Q唯一一次通过物质手段改变处境，但以失败告终"

  - arc_id: ARC-3
    name: "革命幻梦与毁灭"
    value_at_start: "革命消息传来，阿Q产生翻身希望——'便是我，也要投降革命党了'"
    value_at_end: "被枪毙——精神胜利法最终崩溃，'救命'→'微尘似的迸散了'"
    climax_event: "游街枪毙——群众'又钝又锋利'的眼睛'咬他的灵魂'，阿Q喊出'救命'（第九章）"
    function_note: "解决——革命作为最后一次翻身希望被封堵后，阿Q沦为替罪羊走向毁灭"

# ── 故事高潮设计（从结局回溯）──

story_climax_design:
  crisis:
    dilemma: |
      阿Q在赵家被抢当晚面对的实际困境——但鲁迅对危机的处理是反传统的：
      阿Q并没有面对一个清晰的两难选择。他的"危机"是完全被动的——
      他连做选择的资格都没有。这本身就是最深刻的悲剧。
    option_a: "加入抢劫（行动）——但他'两只脚却没有动'"
    option_b: "回去睡觉（不行动）——但内心充满被排斥的愤怒，想告官报复"
    character_revelation: |
      这个"非危机的危机"揭示了阿Q最深层的本质：他不是"不敢行动"的人
      （调戏吴妈时够冲动），而是已经被社会结构彻底内化了无能感的人。
      最后的反应——想告官——证明他已完全站在压迫他的秩序一边来思考问题。
  climax:
    action: |
      刑车游街中，阿Q看到群众"又钝又锋利"的眼睛，
      "似乎连成一气，已经在那里咬他的灵魂"。
      他喊出"救命"——全篇唯一一次放弃精神胜利法，直面恐惧。
      但没有人回应。"然而阿Ｑ没有说。他早就两眼发黑，
      耳朵里嗡的一声，觉得全身彷佛微尘似的迸散了。"
    value_change:
      from: "自欺（精神胜利法仍在运作——'人生天地间，大约本来有时也未免要杀头的'）"
      to: "赤裸的恐惧与毁灭（'救命'→'微尘似的迸散了'）"
    controlling_idea_expression: |
      精神胜利法在死亡面前终于崩溃（"救命"），但这个崩溃来得太迟，
      没有任何人接收到这个信号——围观群众只关心他有没有唱戏。
      阿Q临终前精神胜利法的短暂失效，恰恰反证了它在整个生命中的全面控制。
      而这种心理机制的存在，正是他在这个社会结构中永远无法获得
      真正尊严的根本原因。
  resolution:
    new_balance: |
      阿Q死后一切照旧：未庄人"自然都说阿Ｑ坏"；举人老爷和赵府因财产损失号啕；
      "他们便渐渐的都发生了遗老的气味"——革命彻底消化为保守秩序。
      阿Q的死没有改变任何东西。
    lingering_feeling: |
      双重余韵：城里人的评价"竟没有唱一句戏：他们白跟一趟了"——
      读者在苦笑中意识到自己在整个阅读过程中也一直在"看热闹"，
      和那些围观群众没有本质区别。鲁迅的讽刺不只指向故事中的人物，
      也指向故事外的读者。
