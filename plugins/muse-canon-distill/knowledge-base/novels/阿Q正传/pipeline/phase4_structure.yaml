# Phase 4 逐 Arc 展开为序列

arc_expansions:
  - arc_id: ARC-1
    sequences:
      - seq_id: ARC1-SEQ1
        name: "等级秩序的暴力建立"
        core_conflict: "阿Q试图声称社会身份（姓赵）vs 权力阶层的暴力否认"
        escalation_direction: "从被剥夺姓氏权（身份层面）→ 被打后用精神胜利法自我麻痹（心理层面）→ 赌场丢钱后精神胜利法首次短路（防御裂缝）"
        sequence_climax: "阿Q打自己嘴巴'转败为胜'——精神胜利法的极端形态：自我分裂（第二章）"
        closed: "精神胜利法的运作机制完整建立——读者理解了阿Q如何将失败转化为'胜利'"
        opened: "精神胜利法有裂缝吗？赌场丢钱时'他这回才有些感到失败的苦痛了'——暗示它并非万能"

      - seq_id: ARC1-SEQ2
        name: "暴力传递链"
        core_conflict: "阿Q在力量等级中的位置被明确标定后，转向更弱者报复"
        escalation_direction: "被王胡打（'生平第一件屈辱'）→ 被假洋鬼子打（'第二件屈辱'）→ 欺负小尼姑（'十分得意的笑'）"
        sequence_climax: "摸小尼姑头皮、拧脸颊——'飘飘然的似乎要飞去了'；小尼姑的'断子绝孙'咒骂（第三章）"
        closed: "暴力传递链完整展示——欺软怕硬的社会心理"
        opened: "小尼姑脸上'滑腻'的触感残留——直接导致第四章对吴妈的冲动（激励事件的远因）"

    arc_progression_note: "两个序列构成建置的完整闭环：SEQ1 建立精神胜利法的内部机制，SEQ2 建立它在社会关系中的外部表现。二者共同为激励事件（调戏吴妈）铺设了心理和叙事的双重伏笔。"

  - arc_id: ARC-2
    sequences:
      - seq_id: ARC2-SEQ1
        name: "激励事件与社会断裂"
        core_conflict: "阿Q作为'人'的基本需求（对异性/家庭的渴望）vs 社会对底层的全面剥夺"
        escalation_direction: "性冲动爆发（'我和你困觉'）→ 被打被罚五条件（经济剥夺）→ 全村女人躲避/无人雇用（社会排斥）→ 饥饿（生存威胁）→ 与小D'龙虎斗'（底层内耗）→ 偷萝卜被狗追（尊严最低点）"
        sequence_climax: "'他所求的不是这类东西了；他求的是什么东西，他自己不知道'——叙述者直接点出不自觉欲望（第五章）"
        closed: "阿Q在未庄的生存空间被彻底关闭——必须离开"
        opened: "进城谋生——打开了新的（同样危险的）可能性"

      - seq_id: ARC2-SEQ2
        name: "虚假中兴与崩塌"
        core_conflict: "通过犯罪获得的金钱/地位 vs 底层身份的不可更改"
        escalation_direction: "携赃物归来，酒店里'现钱！打酒来！'（地位翻转）→ 劈王胡后颈'嚓！'（权力展演）→ 女人们追着买东西（社会接纳）→ 赵太爷主动请他来（权力低头）→ 贼行暴露（真相揭穿）→ '敬而远之'变为轻蔑（第二次地位崩塌）"
        sequence_climax: "阿Q的贼行被揭穿——'村人对于阿Ｑ的敬而远之者，本因为怕结怨，谁料他不过是一个不敢再偷的偷儿呢？'（第六章）"
        closed: "通过物质手段改变命运的路径彻底失败——金钱带来的尊重是虚假的、短暂的"
        opened: "阿Q再次陷入无地位无出路的困境——为革命幻想提供了心理土壤"

    arc_progression_note: "ARC-2 的两个序列构成完整的'失去→虚假恢复→再次失去'循环。SEQ1 的断裂迫使阿Q进城，SEQ2 的中兴又把他送回更糟的原点。中点反转（中兴归来）的叙事功能是给读者一个'也许能翻身'的虚假希望，然后迅速打碎。"

  - arc_id: ARC-3
    sequences:
      - seq_id: ARC3-SEQ1
        name: "革命幻想的升腾与破灭"
        core_conflict: "阿Q对革命的幻想理解 vs 革命的实际政治面貌"
        escalation_direction: "举人老爷逃难（革命的外部信号）→ 阿Q'神往'革命（内在希望点燃）→ 喊'造反了'获得惊惧目光（首次被'尊重'）→ 赵太爷叫他'老Q'（权力关系瞬间倒转）→ 土谷祠独白分赃选女人（幻想顶峰）→ 去静修庵'革命'却发现已被秀才和假洋鬼子捷足先登（幻想与现实碰撞）"
        sequence_climax: "土谷祠独白——'四两烛还只点去了小半寸，红焰焰的光照着他张开的嘴'——精神胜利法的终极形态：在幻觉中达到完全的胜利（第七章）"
        closed: "革命作为'精神事件'被阿Q完整经历了一遍——但只存在于幻想中"
        opened: "幻想需要现实兑现——阿Q必须去找革命党"

      - seq_id: ARC3-SEQ2
        name: "被拒绝与旁观"
        core_conflict: "阿Q试图加入革命 vs 新旧权力联盟的排斥"
        escalation_direction: "盘辫子模仿革命（表面参与）→ 发现连小D也盘了辫子（底层之间的模仿竞争）→ 鼓起'十二分的勇气'去找假洋鬼子（主动求索）→ '滚出去！'被彻底拒绝（最后通道封死）→ '所有的抱负，志向，希望，前程，全被一笔勾销了'（绝望）→ 赵家被抢旁观无份，'两只脚却没有动'（行动能力的终极丧失）"
        sequence_climax: "假洋鬼子'滚出去！'——阿Q连完整表达'我要投——'的机会都没有（第八章）"
        closed: "通过政治途径改变命运的路径封死——新权力和旧权力一样排斥底层"
        opened: "阿Q想'告一状'——站在压迫秩序一边思考，不知道自己已成为替罪羊"

      - seq_id: ARC3-SEQ3
        name: "替罪羊与毁灭"
        core_conflict: "国家暴力的碾压 vs 阿Q完全无力的个体"
        escalation_direction: "被逮捕（机关枪对准土谷祠的荒诞）→ 审讯中自然而然下跪（'奴隶性'）→ 画不圆的圆圈（在签死刑时仍在意面子）→ 穿白背心游街（死刑作为公共表演）→ 看到吴妈（激励事件女性角色的最终无视）→ 群众'又钝又锋利'的眼睛（精神胜利法的最后防线被击穿）→ '救命'→'微尘似的迸散了'"
        sequence_climax: "游街枪毙——'救命'是全篇唯一一次阿Q放弃精神胜利法的真实呼喊，但已经太迟（第九章）"
        closed: "阿Q的生命终结；精神胜利法在死亡面前最终崩溃"
        opened: "叙述者的结语：城里人说'竟没有唱一句戏：他们白跟一趟了'——讽刺从故事内部延伸到故事外部（读者也是看客）"

    arc_progression_note: "ARC-3 的三个序列构成'希望→封堵→毁灭'的下降弧线。SEQ1 是精神胜利法的最高点（幻想中的完全胜利），SEQ2 是现实对幻想的否定，SEQ3 是现实对生命本身的否定。三个序列的高潮冲击力严格递增：幻想破灭 < 希望被封杀 < 生命被终结。"

# ── 全篇递进关系 ──

arc_progression:
  impact_escalation: |
    ARC-1 高潮（欺负小尼姑）：精神胜利法在日常层面的胜利——冲击力最小
    ARC-2 高潮（贼行暴露）：通过物质手段改变命运的失败——冲击力适中
    ARC-3 高潮（游街枪毙）：精神胜利法的终极崩溃与生命的终结——冲击力最大
    三个 Arc 的冲击力严格递增，且每个 Arc 都关闭了阿Q的一条出路：
    ARC-1 关闭了"在现有秩序内安稳生存"；ARC-2 关闭了"通过金钱改变地位"；
    ARC-3 关闭了"通过革命翻身"——直到没有任何出路。
  causal_chain: |
    ARC-1（精神胜利法建立 + 小尼姑伏笔）→ 触发 ARC-2（调戏吴妈 → 社会断裂 → 中兴崩塌）
    → 触发 ARC-3（革命幻想 → 被拒 → 替罪羊 → 毁灭）

causal_chain: |
  ARC1-SEQ1（精神胜利法建立）→（因为精神胜利法无法处理真实的暴力等级）
  ARC1-SEQ2（暴力链展示→欺负小尼姑→触感伏笔）→（因为触感残留引发性冲动）
  ARC2-SEQ1（调戏吴妈→社会断裂→饥饿→进城）→（因为进城做贼获得赃物）
  ARC2-SEQ2（中兴归来→贼行暴露→再次沦落）→（因为无出路时革命消息传来）
  ARC3-SEQ1（革命幻想→独白→静修庵碰壁）→（因为幻想需要现实兑现）
  ARC3-SEQ2（被假洋鬼子拒绝→赵家被抢旁观→想告官）→（因为需要替罪羊）
  ARC3-SEQ3（被捕→审讯→画押→游街→"救命"→枪毙→一切照旧）
