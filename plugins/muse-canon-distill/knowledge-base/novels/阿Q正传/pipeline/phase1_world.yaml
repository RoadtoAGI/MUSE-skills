setting:
  era: 清末民初，辛亥革命前后（约1911年）
  duration: 约一年（从某年春天到冬天，跨越宣统三年九月十四日即辛亥革命爆发）
  location: |
    未庄——一个虚构的江南乡村小镇，附带"城里"作为对照空间。
    核心场所：土谷祠（阿Q的住所）、赵太爷家、钱太爷家、酒店、静修庵。
    "城里"只通过阿Q的转述出现，从未被直接描写——这本身就是未庄封闭性的体现。
  conflict_levels:
    internal: |
      阿Q的精神胜利法——内心将一切失败转化为胜利的自我欺骗机制。
      核心内在冲突：对尊严的本能渴望 vs 精神胜利法对这种渴望的消解。
      每次被打后"心满意足的得胜的走了"，但偶尔（如赌场丢钱后）自欺也失效，
      "他这回才有些感到失败的苦痛了"（第二章）——这些裂缝暗示精神胜利法的脆弱。
    personal: |
      阿Q与未庄权力阶层的冲突网络：
      - 赵太爷（封建权威）：不许阿Q姓赵，打嘴巴——等级秩序的暴力维护
      - 假洋鬼子（新式权力）：用哭丧棒打阿Q，不准他革命——新旧势力都排斥底层
      - 王胡、小D（同阶层竞争）：连最底层的尊严也要争夺
      - 吴妈（性别/阶级交叉）：调戏事件暴露了阿Q作为"人"的需求与社会对底层的全面剥夺
    external: |
      辛亥革命对未庄封建秩序的冲击——但这种冲击是表面的：
      举人老爷逃难来寄存箱子，赵秀才和假洋鬼子"咸与维新"砸了静修庵的龙牌，
      盘辫子成了"革命"的标志……鲁迅展示的是：革命没有改变权力结构，只是
      让同一批人（赵秀才+假洋鬼子）换了一种方式维持权力，而阿Q这样的底层
      依然被排斥在外，最终成为"惩一儆百"的牺牲品。

world_rules:
  physical:
    - 江南水乡地理：水田、桑树、河埠头，乌篷船是交通工具
    - 季节感明确：春寒（调戏吴妈后赤膊的冷）、夏意（求食的饥饿）、中秋（阿Q返回）、暮秋（盘辫子）
    - 物质匮乏：阿Q全部财产——破夹袄、棉被、毡帽——逐一失去的过程是其社会地位下降的物质标记

  social:
    - 等级秩序刚性："赵太爷不会错的"——权力的合法性来自财富和功名，不容底层质疑
    - 名声即生存："上了口碑"才算一件事；阿Q的兴衰都通过"舆论"传播
    - 地保制度：乡村治理靠地保，地保收酒钱维持权威——半正式的基层权力结构
    - 革命后权力转移的虚假性：把总取代知县，举人老爷做帮办民政，秀才靠假洋鬼子拿到"柿油党的顶子"——新瓶装旧酒
    - 女性地位：吴妈被调戏后是"她"要寻短见，阿Q要赔罪——受害者与施害者的倒置

  psychological:
    - 精神胜利法作为集体心理机制：不只是阿Q个人的特征，"中国精神文明冠于全球"的叙述者反讽暗示这是一种文化心理
    - 欺软怕硬的链条：赵太爷→阿Q→小尼姑/小D→更弱者——暴力沿权力阶梯向下传递
    - 遗忘机制："忘却这一件祖传的宝贝"——对屈辱的选择性遗忘是生存策略
    - 对"革命"的误读：阿Q将革命理解为个人翻身（"要什么就是什么，欢喜谁就是谁"），完全不理解其政治含义——这种误读是普遍的

genre_conventions:
  primary_genre: 社会讽刺
  secondary_genre: 悲喜剧
  conventions:
    - convention: 讽刺小说通常设置一个"局外人"视角来揭露社会荒谬
      planned_subversion: |
        鲁迅的叙述者不是冷眼旁观的局外人，而是一个带有戏仿色彩的"传记作者"，
        开篇用学究式的考据（姓名、籍贯）来给一个无姓无名的人"立传"——
        形式本身就是对正史传记体的讽刺。叙述者时而冷峻、时而同情、时而刻毒，
        姿态不断变化，让读者无法简单地站在道德高地上审视阿Q。

    - convention: 悲喜剧中主角的毁灭通常唤起观众的怜悯
      planned_subversion: |
        阿Q的死亡场景中，鲁迅不给读者清洁的怜悯感。阿Q临死前想的是
        "竟没有唱一句戏"——他至死都在用戏文来理解自己的处境。
        而围观群众的评价是"游了那么久的街，竟没有唱一句戏：他们白跟一趟了"
        ——受害者和看客共同构成了一个封闭的荒谬回路。

    - convention: 革命叙事通常提供"觉醒"或"牺牲"的意义
      planned_subversion: |
        鲁迅拒绝了这两种出路。阿Q的"革命"是精神胜利法的最高形式——
        他在幻想中分配战利品和女人（第七章），这不是觉醒而是更深的自欺。
        他的死也不是有意义的牺牲，而是权力游戏中一个无足轻重的棋子被随意丢弃。

daily_life:
  - dimension: 谋生
    findings:
      - detail: 阿Q没有固定职业，"只给人家做短工，割麦便割麦，舂米便舂米，撑船便撑船"
        story_implication: 没有固定雇佣关系意味着他随时可以被社会"断供"——调戏吴妈后没人叫他做工，他立刻陷入饥饿
      - detail: 赵太爷家的规矩——不准掌灯，例外是秀才读书和阿Q舂米
        story_implication: 阿Q的劳动与秀才的读书并列为"例外"，暗示二者在赵府的工具性等价

  - dimension: 赌博与消遣
    findings:
      - detail: 押牌宝是阿Q主要的消遣方式，赢了的钱在混乱中被抢
        story_implication: 赌博是阿Q唯一的"上升通道"幻觉，但连这条路也以暴力失败告终

  - dimension: 社交礼仪
    findings:
      - detail: 地保是社交仲裁者——打了人要付酒钱给地保，犯了事要通过地保赔罪
        story_implication: 连"公正"也是要花钱买的，穷人的每一次社会互动都是经济剥削
      - detail: 赵太爷叫阿Q"老Q"时，阿Q以为与己无干——他从未被人尊称过
        story_implication: 被尊重对阿Q来说如此陌生，以至于他无法识别尊重本身

  - dimension: 饮食
    findings:
      - detail: 黄酒是未庄的日常饮品；阿Q经常在酒店赊酒
        story_implication: 酒店是未庄的公共空间和舆论场，赊不赊酒是社会地位的晴雨表

creative_constraints:
  - constraint: 阿Q没有姓名、没有籍贯、没有家庭——他是一个几乎没有社会身份的人
    narrative_function: |
      这种"去身份化"使阿Q成为一个抽象符号——他不代表某个具体的人，
      而代表一种普遍的国民心理。同时，没有身份也意味着没有保护——
      他可以被任何人剥夺任何东西，包括姓氏权。

  - constraint: 未庄是封闭社会，革命只通过传闻传入
    narrative_function: |
      读者和未庄人一样，只能通过碎片信息拼凑"革命"的面貌。
      这种信息不对称强化了讽刺效果——每个人都在用自己的认知框架
      来理解革命（阿Q想到白盔白甲，赵太爷想到保全财产），
      没有人理解革命的真正含义。

  - constraint: 叙述者使用文白夹杂的语言，经典引用与口语并置
    narrative_function: |
      语言本身就是权力结构的映射——文言代表赵太爷们的世界（"不孝有三无后为大"），
      白话是阿Q的世界（"妈妈的"），二者的并置制造持续的反讽效果。
