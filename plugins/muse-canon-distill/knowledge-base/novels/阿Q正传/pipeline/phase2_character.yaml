# 角色系统设计图——只记角色之间的关系与功能分配，不记个体画像
# 个体画像见 characters/*.md

cast_overview:
  protagonist: 阿Q
  antagonist: |
    无单一对手。对抗力量是一个等级制社会结构本身——通过不同角色层层传递：
    赵太爷（封建权威）、假洋鬼子（新式权力）、地保（基层执行）、
    把总/举人老爷（国家暴力）。鲁迅的设计精妙之处在于：
    没有一个"反派"，但每个人都在维护那个碾碎阿Q的结构。
  supporting_cast:
    - name: 赵太爷
      function: 封建权力的化身——等级秩序的最高本地代表，阿Q一切"不被允许"的终极裁判者
    - name: 假洋鬼子（钱太爷的大儿子）
      function: 新式权力的代表——从旧秩序的异类到新秩序的把关人，直接封堵阿Q参与革命的唯一通道
    - name: 赵秀才
      function: 旧秩序与新秩序的桥梁人物——既是赵太爷的儿子（旧），又能"咸与维新"联络假洋鬼子（新）
    - name: 吴妈
      function: 激励事件的催化角色——阿Q对她的冲动暴露了底层人"作为人的基本需求"与社会禁令的冲突
    - name: 小D
      function: 阿Q的镜像——同阶层的竞争者，与阿Q的"龙虎斗"展示底层内部的无谓消耗
    - name: 王胡
      function: 阿Q自尊的标尺——阿Q看不起但打不过的人，力量等级的可视化标记
    - name: 小尼姑
      function: 暴力传递链的终端——阿Q欺负小尼姑的场景完整展示了"欺软怕硬"的社会心理
    - name: 地保
      function: 基层权力的执行者——每次冲突的仲裁者兼榨取者，从阿Q身上收酒钱
    - name: 邹七嫂
      function: 舆论传播者——消息的中转站，代表未庄的"口碑"机制
    - name: 光头老头子（审讯官）
      function: 国家暴力的面孔——和气的语调下是不可抗拒的杀戮权力

contrast_axes:
  - axis: "对革命的理解"
    阿Q: 革命 = 个人翻身（"要什么就是什么"）
    假洋鬼子: 革命 = 权力重新分配中的获利机会（拿到"柿油党的顶子"）
    赵秀才: 革命 = 不可阻挡则顺势而为（"咸与维新"）
    implication: 三人都不理解革命的真正含义，但假洋鬼子和赵秀才能成功"参与"而阿Q不能——差别在于社会资本，不在于认知水平

  - axis: "面对屈辱的反应"
    阿Q: 精神胜利法——将屈辱内化为幻觉中的胜利
    王胡: 直接的身体反抗——打回去
    小D: 模仿阿Q的策略但更消极——"我是虫豸，好么？"
    implication: 同一个压迫结构下，不同的应对策略都无法带来真正的改变

  - axis: "权力转变中的位置"
    赵太爷: 从绝对权威到"叫阿Q'老Q'"再到找替罪羊——权力的弹性维护
    假洋鬼子: 从被排斥的异类到革命后的权力核心——最成功的适应者
    阿Q: 从底层到短暂"中兴"到替罪羊——永远的被排斥者
    implication: 革命前后权力结构的实质不变，变的只是谁占据哪个位置

relationships:
  power_dynamics: |
    未庄权力金字塔（革命前）：
    赵太爷/钱太爷 → 秀才 → 假洋鬼子（边缘） → 地保 → 普通村民 → 王胡 → 阿Q/小D

    革命后权力重组：
    把总 + 举人老爷 → 假洋鬼子 + 赵秀才（"柿油党"） → 赵太爷（降格但仍有势力） → 普通村民 → 阿Q（替罪羊）

    关键发现：阿Q始终处于最底层。革命改变了金字塔上层的排列，
    但底层的位置从未改变——这是鲁迅最核心的社会批判。

  key_tensions:
    - "赵太爷 vs 阿Q：等级秩序的暴力维护（不许姓赵→不许进门→找替罪羊）"
    - "假洋鬼子 vs 阿Q：新旧权力都排斥底层（哭丧棒→'滚出去'）"
    - "阿Q vs 小D：底层内部的竞争与模仿（抢工作→龙虎斗→盘辫子）"
    - "阿Q vs 吴妈：欲望的爆发与社会禁令（'我和你困觉'→五条惩罚）"
    - "阿Q vs 小尼姑：暴力的向下传递（被打后→摸头皮→拧脸颊）"

  potential_shifts:
    - "赵太爷在革命恐慌中暂时对阿Q示好（叫'老Q'），但一旦秩序恢复立即翻脸——展示权力的工具性"
    - "假洋鬼子从旧秩序的边缘人变为新秩序的核心——最灵活的权力追随者"
    - "小D从阿Q蔑视的对象变为平手的对手——阿Q自身的衰落过程"
