novel: 狂病系列
author: 莫千回
lang: zh
translator: ''
narration_voice: 近身第一人称为主，事后悔意压住当场惊恐
diction: 校园口语、网络梗、医学灾变词与粗粝暴力并置
rhetoric_density: medium
dialogue_mode: 求生讨论、辱骂威胁和临终劝诫交替塑形
pacing: 日常慢铺后以突发屠杀、失控信息和伦理选择急坠
signature_moves:
- 先用生活闲谈降低警觉，再让暴力从窗外或门缝突然闯入
- 把感染规则放进直播、电话、广播和幸存者转述里分层投放
- 反复让人物在救与不救、走与不走之间承担不可逆代价
- 用游戏、电影、网络梗抵消恐怖，随即反转成更强绝望
- 将亲密关系扭曲为感染后的占有、愧疚或临终告别
anti_signature:
- 不要写成纯设定说明或单线打怪升级
- 不要让主角稳定英勇、判断总是正确
- 不要弱化身体细节、粗口口语和伦理后悔
