_meta:
  version: "1.0"
  chapter: "他的故事"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    Arc 0-6 共 8 个叙事弧（含灾前序章 Arc 0）。时间主线性 + 闪前插叙。
    每个 Arc 完成一次'希望被设定 → 希望被收回'下沉，并多用'闪前'预告队友之死。
    序列粒度比《燃烧》粗（本篇 37.7k 字、跨数周数省），按结构转折点取序列，非逐节切分。

# === Arc 0: 灾前重逢 ===

arc_0:
  label: "灾前重逢 —— '拧巴的我' vs '纯粹的汪华依'对照建立"
  source_anchor: "line 5-77"
  sequences:
    - seq_id: "0.1"
      label: "高中回忆 —— 绣剑 / 大天使 / '我'只敢私下装游戏动作"
      source_anchor: "line 5-25"
      core_conflict: "汪华依的'把心里所想做出来' vs '我'的'只敢藏在心里'"
      escalation_direction: "从单个细节（毕业军装）递进到'我'明确自陈的羡慕与怯懦"
      sequence_climax: "'汪华依好像总会做一些我心里其实也想做、但完全不敢明面去做的事'（line 23）"
      closed: "确立两人性格的根本对照（脊椎对照基准）"
      opened: "'我'到底会不会变成她那样？（全篇戏剧问题的种子）"
    - seq_id: "0.2"
      label: "重逢 —— 地铁叙旧 + 大天使再现 + 灾难前兆新闻"
      source_anchor: "line 26-77"
      core_conflict: "重逢隔阂 vs 回忆同频拉近 / 日常 vs 末日前兆"
      escalation_direction: "从客套寒暄递进到'最近发生了什么命案'的不安，再到约定次日出游"
      sequence_climax: "汪华依摆大天使拔剑姿势：'大天使从天堂出来之后，全都是烦心事'（line 43-45）"
      closed: "重逢的情感距离缓缓拉近"
      opened: "陈彦玉杀人案 / 附近命案 / 陨星新闻（line 59-71、121）—— 爆发前兆悬置"
  arc_progression_note: "灾前 Arc 不是闲笔 —— 它把'拧巴 vs 纯粹'的脊椎对照在末日前就钉死，后文每次'我'的犹豫都回扣这里。"

# === Arc 1: 南陵河景区爆发 ===

arc_1:
  label: "南陵河景区爆发 —— 世界在眼前崩坏 + 逃回游客中心"
  source_anchor: "line 78-225"
  sequences:
    - seq_id: "1.1"
      label: "清晨出游 + 追尾事故 + '想和不想就是不想'母题首现"
      source_anchor: "line 78-99"
      core_conflict: "'我'要不要跟吵架司机打招呼（拧巴） vs 汪华依'想和不想就是不想'（纯粹）"
      escalation_direction: "从日常摩擦（追尾）递进到路上多起事故 + 救护车被堵（爆发前的城市异常）"
      sequence_climax: "汪华依'想和不想就是不想，反正平台会自动扣钱'（line 85）—— 母题第一次出口"
      closed: "灾前最后的日常摩擦"
      opened: "城市级异常（多起追尾 / 救护车被堵 line 93）已是爆发前奏，但'我'尚未察觉"
    - seq_id: "1.2"
      label: "石桥看跳舞少女 + 岸边群体跃河撕扯 = 激励事件"
      source_anchor: "line 105-141"
      core_conflict: "灾前游玩的最后日常 vs 突如其来的无差别狂暴"
      escalation_direction: "从'特殊活动？变魔术？'的误读，递进到撕扯杀人、强暴、咬人全面铺开"
      sequence_climax: "跳舞少女被割喉肢解到脊椎相连仍被施暴 + 汪华依'不对劲啊老张！'（line 137-143）"
      closed: "灾前认知彻底破碎"
      opened: "'我'被相机砸破头 + 被踹倒者上翻白眼狂笑（line 145-155）—— 病征第一次直击'我'"
    - seq_id: "1.3"
      label: "古街逃亡 + 厕所兼职男独立小节 + 挤进游客中心避难"
      source_anchor: "line 143-225"
      core_conflict: "幸存者 vs 全面爆发的感染者 / 个体求生 vs 无差别死亡"
      escalation_direction: "弓箭手 / 石磨碾人 / 甘蔗机绞手 / 摄影师被镜头塞嘴 → 牌坊吊人 → 人肉撞锤砸卷帘门"
      sequence_climax: "'世界末日，正式登场'（line 199）+ 特警掩护下挤进游客中心拉下卷帘门（line 221）"
      closed: "Arc 1 价值落点：认知崩坏 + 暂时避难"
      opened: "卷帘门已现凹痕、门缝渗血（line 229）—— 避难所注定失守；汪华依开始研究'脱出计划'（line 235）"
  arc_progression_note: |
    本 Arc 含全篇唯一离开'我' POV 的独立小节（厕所兼职男 line 201-213）——
    用一个陌生人在马桶上被拖把棍贯穿的死，把'灾难无差别'从'我'的逃亡线外再钉一锤。

# === Arc 2: 书院学堂避难 ===

arc_2:
  label: "书院学堂避难 —— 打电话大妈事件 + 汪华依确诊'丧尸病毒' + 自曝免疫者"
  source_anchor: "line 227-397"
  sequences:
    - seq_id: "2.1"
      label: "游客中心失守在即 + 汪华依'脱出计划' + 转移书院学堂"
      source_anchor: "line 227-295"
      core_conflict: "随大流求安全（'我'） vs 主动找后路（汪华依）"
      escalation_direction: "从游客中心人群恐慌内爆（情侣互咬 line 247 / 搬支撑物逃 line 249）递进到窗破、被迫从厕所小窗翻入小巷"
      sequence_climax: "汪华依灭火器开喷争取空间 + '我'踹开厕所门翻窗逃入小巷（line 273-281）"
      closed: "游客中心避难失败"
      opened: "汪华依腿上渗血（line 287）—— 咬伤伏笔；扒窗求救者'我'放弃帮忙（line 283-285）= 拧巴母题再现"
    - seq_id: "2.2"
      label: "书院学堂 + 打电话大妈事件（道德困境顶点）"
      source_anchor: "line 295-345"
      core_conflict: "全员隐蔽求生 vs 大妈要和女儿通最后一次话（暴露风险）"
      escalation_direction: "从'让大妈挂电话'的劝阻，递进到众人合力按住大妈，直到女儿被破门者杀害的声音从电话传出"
      sequence_climax: "藏蓝衬衫男抠出手机挂断 + 大妈被抽空骨头般瘫软（line 335-337）"
      closed: "为全员安全牺牲一对母女的告别 —— 与《燃烧》道德链同源反向"
      opened: "众人'看犯人一样'盯防大妈（line 343）—— 幸存者内部裂痕；崔周平（挂电话的人）登场（line 347）"
    - seq_id: "2.3"
      label: "汪华依确诊'丧尸病毒' + '游戏即人生'信念 + 自曝免疫者"
      source_anchor: "line 347-397"
      core_conflict: "汪华依'纯粹的游戏化希望' vs '我'的'随时会死'现实主义 / '我'对她咬伤的隐秘恐惧"
      escalation_direction: "从'是丧尸病毒'的判断，递进到'要体验世界末日副本'的兴奋，再到'我可能是免疫者'的炸裂低语"
      sequence_climax: "汪华依'老张呀，我可能是这次病毒的免疫者'（line 381）"
      closed: "免疫者希望被点燃（终结灾难的钥匙）"
      opened: "'我'开始怀疑咬她的到底是不是感染者（line 397）+ 她腿伤的真实威胁悬置"
  arc_progression_note: "免疫者设定 = 把'戈多式希望'从外部（医院）内化到队伍自身（汪华依），为 Arc 3-6 的'有钥匙却找不到锁'反讽埋线。"

# === Arc 3: 辗转寻找官方避难所 ===

arc_3:
  label: "寻找官方避难所 —— 军区医院 / 政府机构全部沦陷 + 小队因免疫验证分裂"
  source_anchor: "line 399-473"
  sequences:
    - seq_id: "3.1"
      label: "末日第七天逃出书院 + 军区医院已成废墟"
      source_anchor: "line 399-441"
      core_conflict: "对官方力量的最后指望 vs 公权力全面沦陷的实景"
      escalation_direction: "从书院大火被迫出逃，递进到 ASTT 特警残骸 / 大笑的特警感染者 / 军区医院废墟"
      sequence_climax: "远望军区医院废墟 + 遍地撕咬尸体 → '末日中的第一个任务失败了'（line 437）"
      closed: "第一个官方希望（军区医院）落空"
      opened: "'有钥匙却不知道锁在哪'（line 441）—— 免疫无用论第一次抬头"
    - seq_id: "3.2"
      label: "免疫验证悖论 + 小队分家 + 目标升级为'国家中枢大都会'"
      source_anchor: "line 443-473"
      core_conflict: "验证免疫的方法分歧（找咬 / 涂血 / 必须到机构）vs 风险不可控"
      escalation_direction: "从'先求生'的私下讨论，递进到因免疫验证难题与部分队员分道扬镳，再到决定千里奔赴大都会"
      sequence_climax: "小队分家 + 升级目标'寻找国家中枢的政府机构'（line 471-473）"
      closed: "免疫验证悖论暂时无解 → 用'去更高层级机构'回避"
      opened: "千里奔赴大都会 —— 本篇尺度最大的希望被设定"
  arc_progression_note: "本 Arc 把'希望符号'逐级升格（军区医院 → 政府机构 → 国家中枢），每升一级就掏空一分免疫的意义。"

# === Arc 4: 千里奔赴大都会 ===

arc_4:
  label: "奔赴大都会 —— KB-26 广播希望 + 军队自溃战场 + 小崔自杀"
  source_anchor: "line 475-613"
  sequences:
    - seq_id: "4.1"
      label: "山区浓雾跋涉 + KB-26 广播从杂音到清晰（越清晰越绝望）"
      source_anchor: "line 475-551"
      core_conflict: "广播给的希望 vs '请勿前往'的劝退暗示"
      escalation_direction: "从第一次收到官方广播的狂喜，递进到'请勿前往哪'的恐惧，再到信号越清晰越让人不安"
      sequence_climax: "汪华依'信号太差且是重复广播' + 越靠近越少拿出收音机（line 485、589）—— 最想当勇者的人开始忧虑"
      closed: "官方广播确实存在（KB-26）"
      opened: "'请勿前往'到底是哪里？（line 529）—— 比沉默更可怕的官方信息"
    - seq_id: "4.2"
      label: "军队自溃战场遗迹 + 士兵笔记 + 信念母题"
      source_anchor: "line 553-587"
      core_conflict: "对'军队还在'的最后侥幸 vs '军队自溃了'的实景与文字铁证"
      escalation_direction: "从战场废墟的震撼，递进到地窖士兵笔记揭示'48-72 小时体系崩坏'，再到'精神垮了一切都完了'"
      sequence_climax: "士兵笔记'军队没有战败，军队自溃了 / 所有人都是敌人' + 莱昂教官'写日记固定信念'（line 579-581）"
      closed: "'制度性救赎'幻想彻底破除"
      opened: "汪华依提议'找精神寄托写日记录音'但无人实行（line 587）—— 反讽地预演本篇录音笔结局"
    - seq_id: "4.3"
      label: "大都会沦陷确认 + 汪华依首次道歉 + 小崔自缢"
      source_anchor: "line 589-613"
      core_conflict: "希望提供者（汪华依/小崔） vs 希望彻底落空"
      escalation_direction: "从大都会沦陷广播确认，递进到汪华依一边笑一边哭道歉，再到（闪前已知的）小崔树下自缢"
      sequence_climax: "广播'请勿前往任何人群聚集地，封锁线失效'（line 591）+ 小崔上吊（line 289、601）"
      closed: "最大尺度的官方希望（大都会）落空 + 最相信希望的人先放弃"
      opened: "'就算这样活下去，意义呢？'（line 601）—— 直指 Arc 6 '我'的存在性危机"
  arc_progression_note: |
    本 Arc 用闪前插叙（小崔之死先在 line 289 泄露、line 601 才到时间点）制造宿命压迫；
    士兵笔记的'日记=信念'与全篇录音笔框架形成元主题闭环。

# === Arc 5: 月儿洞贯山尸洞 ===

arc_5:
  label: "月儿洞 —— 死老鼠引路 + 尸山活感染者 + 死老鼠被肢解"
  source_anchor: "line 615-779"
  sequences:
    - seq_id: "5.1"
      label: "入洞 + 恶臭加重 + 碎碗腊肉揭示'村民曾来此避难'"
      source_anchor: "line 615-687"
      core_conflict: "靠死老鼠家乡山洞甩开追兵 vs 山洞里逐级加重的不祥线索"
      escalation_direction: "从恶臭（'动物腐尸'解释）递进到碎瓷碗 / 腊肉（村民长期避难证据）再到身后感染者嘶吼追近"
      sequence_climax: "死老鼠认出公鸡碗 = 村民来此避难（line 649-655）+ 汪华依'游戏里越急着让你往前越有东西'（line 675）"
      closed: "山洞是甩追兵的通道（表层）"
      opened: "若村民来此避难 + 极浓恶臭 + 不见人类尸体 —— 主洞有更大问题（悬置）"
    - seq_id: "5.2"
      label: "主洞尸山 + 被困活感染者群涌出 + 死老鼠 / 队友死"
      source_anchor: "line 689-771"
      core_conflict: "幸存者 vs 被困尸洞多时、惧光却自虐迎光的极端感染者群"
      escalation_direction: "从踩到腊化尸絮，递进到腊化交融尸山，再到尸山涌出大批感染者、山壁'挤粉刺'般冒出躯体"
      sequence_climax: "山壁涌动 + 死老鼠被挖眼镰刀肢解（line 757-767）+ 队友跌入暗坑/无声消失（line 771）"
      closed: "月儿洞 = 比追兵更大的屠场"
      opened: "汪华依在此被腐臭感染者咬（line 769、779）—— 直接死因伏笔"
    - seq_id: "5.3"
      label: "逃出山洞 + 汪华依伤口持续化脓 + 免疫者身份被实证"
      source_anchor: "line 773-779"
      core_conflict: "免疫的'胜利' vs 免疫的'无用'"
      escalation_direction: "从甩开追兵的短暂喘息，递进到伤口因感染者带菌而化脓发烧、抗生素将尽"
      sequence_climax: "'这一次可以完全确定，汪华依就是免疫者' + '但也证明了汪华依只是一个普通人'（line 779）"
      closed: "免疫者身份被实证"
      opened: "免疫病毒不免疫重症 → 汪华依走向死亡 → '我'的最终抉择被逼出"
  arc_progression_note: "月儿洞是本篇独有的封闭进化场景，也是把汪华依从'希望钥匙'打回'普通将死之人'的转折 Arc。"

# === Arc 6: 抛弃汪华依 + 弃药寻药 + 困死药店录音 ===

arc_6:
  label: "抛弃汪华依 + 弃药寻药 + 困死药店录下遗言"
  source_anchor: "line 781-839"
  sequences:
    - seq_id: "6.1"
      label: "汪华依成为负担 + 体面地让'我'抛弃她 + 临终赠言"
      source_anchor: "line 781-809"
      core_conflict: "'我'纠结要不要抛弃将死的挚友 vs 汪华依主动给'我'台阶（让'我'拿走物资）"
      escalation_direction: "从'她在成为我的负担'，递进到汪华依让'我'翻她背包带走物资（体面的自我牺牲），再到临终赠言"
      sequence_climax: "汪华依'选择了什么可以愧疚但不能后悔，想和不想就是不想，当断不断必受其乱'（line 807）—— 对'我'拧巴的最终判词"
      closed: "'我'抛弃汪华依（但只拿少量物资，把抗生素留给她 line 803）"
      opened: "'我'独活的愧疚 + 无意义感（line 813）—— 弃后必悔的循环启动"
    - seq_id: "6.2"
      label: "弃药寻药 + 学游戏主角潜行 + 困死药店录音托付"
      source_anchor: "line 811-839"
      core_conflict: "果断独活 vs 回头救她 / '我'第一次想做纯粹的选择 vs 仍被困"
      escalation_direction: "从'还是去找汪华依吧'的回头，递进到潜入乡镇取药（学《刺客信条》主角潜行），再到取到药却被感染者堵在药店"
      sequence_climax: "录音笔托付捡到者送药救汪华依 + 代'我'说'对不起' + '真的别像我一样 —— 要像她一样'（line 833-839）"
      closed: "全篇 main climax + closing reversal —— 救赎与道歉被转交给陌生人"
      opened: "'我'生死未卜 / 汪华依大概率已死 / 药能否送到全凭陌生人 —— 无解悬置（读者代理人接续点）"
  arc_progression_note: |
    本 Arc 是全篇脊椎的引爆：汪华依的赠言、'我'的弃而复悔、录音笔托付 ——
    用最后一个动作（录音）同时承担'承认救不了 + 传火 + 主控思想出口'三层意义。

# === 序列间 / Arc 间冲击力递增 ===

escalation_check:
  arc_0_to_1: "灾前性格对照（静） → 世界在眼前崩坏（激励事件，认知层炸裂）"
  arc_1_to_2: "景区无差别屠杀 → 避难所内部道德困境（打电话大妈）+ 免疫希望被点燃"
  arc_2_to_3: "队内希望（免疫钥匙） → 外部官方希望系统性落空（军区医院废墟）+ 小队分裂"
  arc_3_to_4: "目标升级到大都会 → 大都会也沦陷 + 军队自溃铁证 + 最相信希望的小崔自缢"
  arc_4_to_5: "宏观希望破灭 → 微观逃生通道（月儿洞）反成更大屠场 + 汪华依被咬"
  arc_5_to_6: "免疫被实证却同时被证无用 → 汪华依将死 → '我'的最终抉择被逼出（弃 / 救皆失败）"
  curve_shape: "Arc 0 静 → Arc 1 急（激励事件）→ Arc 2 急转缓（困境+希望）→ Arc 3 缓沉 → Arc 4 缓沉到底（小崔死）→ Arc 5 急（月儿洞）→ Arc 6 静→爆（录音收尾）"
  curve_note: |
    与《燃烧》'高频缓急交替'不同，本篇是'长程缓慢绞杀'型 ——
    希望符号逐级升格又逐级落空（医院→政府→大都会→月儿洞→最后的药），小队从聚到散一路减员；
    冲击力不靠单点爆发递增，而靠'宿命插叙 + 每 Arc 死一个重要的人'累积绝望。
  causal_chain: |
    Arc0 拧巴 vs 纯粹对照 →（爆发把对照推上末日）Arc1 景区崩坏 →（避难失守）Arc2 书院 + 免疫希望
    →（免疫无处验证）Arc3 寻官方落空 + 分家 →（升级目标）Arc4 大都会沦陷 + 小崔死
    →（逃生）Arc5 月儿洞屠场 + 汪华依被咬 →（免疫无用 / 她将死）Arc6 抛弃 + 弃药寻药 + 困死药店录音

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第一人称'我'（老张）回溯 + 录音笔遗书框架 —— line 5-839 全篇统一（仅 line 201-213 厕所兼职男为唯一离我 POV 的独立小节）"
    function: |
      '回溯 + 录音'双重框架制造两个时间层：
      (1) 录音当下（被困药店 line 825-839）—— 全篇的'现在'与终点；
      (2) 被回溯的整段历程（灾前 → 月儿洞 → 抛弃）。
      这让全篇带上'一切已成定局、当事人在终点回望'的宿命语气，也使篇名'他的故事'的旁观距离成立。
  parallel_threads:
    - name: "拧巴 vs 纯粹（主题暗线）"
      description: "'我'的当断不断 vs 汪华依的'想和不想就是不想'；绣剑 / 大天使 / 游戏主角动作反复回扣"
      presence: "贯穿全篇 0.1-6.2，是真正的脊椎线，外部逃生线只是它的载体"
    - name: "希望符号逐级落空（外部线）"
      description: "免疫钥匙 → 军区医院 → 政府机构 → 大都会 KB-26 广播 → 月儿洞 → 最后的药"
      primary_arcs: ["arc_2", "arc_3", "arc_4", "arc_5", "arc_6"]
    - name: "希望提供者之死（人物线）"
      description: "崔周平（小崔）= 全篇'最爱鼓励人'的希望提供者，先泄露其死（line 289）再到时间点（line 601）；养老头 / 死老鼠 / 郑新宇 / 大妈依次减员"
      primary_arcs: ["arc_3", "arc_4", "arc_5"]
    - name: "日记/录音 = 信念存续（元主题暗线）"
      description: "士兵笔记（line 581）→ 汪华依提议写日记无人实行（line 587）→ 录音笔本身（line 833）—— '精神垮了一切都完了'"
      presence: "间歇浮现，在 Arc 4 与 Arc 6 收束为元主题闭环"

