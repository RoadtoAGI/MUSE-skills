        学《刺客信条》主角潜行做'一直想做没做的事'（line 819-823）—— 唯一一次接近纯粹，仍以被困收场；
        录音笔托付（line 833-839）：请捡到者送药到河口镇龙门客栈农家乐救汪华依（免疫者，对世界有用，'她不像我'）+
        代'我'说'对不起'（'我没有抛弃她，但我也没有拯救她'）+ 终句'真的别像我一样 —— 要像她一样'。
        手法：录音笔 = 读者代理人/传火机制（同《学校》日记本、《燃烧》罗允转达），把'救赎+道歉'物理外包给陌生人。
    handoff: "录音收束 = 全篇收束（无解悬置 / 下游接续点）"
    description: "汪华依成负担 → 她让'我'翻包带走物资（体面让'我'弃她）→ '我'只拿少量物资、把抗生素留给她 → 临终赠言（愧疚不后悔/当断不断）→ '我'弃后想回头 → 学游戏主角潜行取药却困死药店 → 录音笔托付陌生人送药+转达'对不起'+'要像她一样'"

# === 节奏曲线 ===

pacing_curve:
  TG-S01: "静"        # 灾前回忆，脊椎对照
  TG-S02: "静→爆"     # 日常 → 激励事件（景区爆发）
  TG-S03: "急"        # 古街逃亡群像
  TG-S04: "急→沉"     # 道德困境（打电话大妈），张力转向内压
  TG-S05: "沉→转"     # 免疫者自曝（希望点燃 + 恐惧反噬）
  TG-S06: "急"        # 闪前：郑新宇活烹+补刀
  TG-S07: "沉"        # 军区医院废墟（第一个希望落空）
  TG-S08: "沉，反讽递进"  # KB-26 广播越清晰越绝望
  TG-S09: "沉"        # 军队自溃笔记
  TG-S10: "沉到底"     # 大都会沦陷 + 小崔自缢
  TG-S11: "急"        # 月儿洞尸山屠场
  TG-S12: "静→爆→余韵"  # 抛弃 + 临终赠言 + 录音笔托付
  notes: |
    '长程缓慢绞杀'型曲线（区别于《燃烧》的高频缓急交替）——
    激励事件后并非持续高能，而是 S04 起转入'内压 + 希望逐级落空'的长沉，
    靠宿命插叙（S06/S10 闪前）与每场死一个重要的人累积绝望，
    最终在 S12 用'录音笔'完成静→爆→余韵的反英雄收尾。

