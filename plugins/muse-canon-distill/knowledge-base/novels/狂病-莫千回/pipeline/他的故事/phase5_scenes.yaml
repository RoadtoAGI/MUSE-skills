  - scene_id: "TG-S12"
    label: "抛弃汪华依 + 临终赠言 + 困死药店录下遗言（主控思想出口）"
    chapter: "他的故事"
    source_anchor: "line 781-839"
    word_count_approx: 3600
    characters: ["'我'（老张）", "汪华依"]
    pov: "'我'（回溯收束于录音当下）"
    conflict_type: "internal"
    value_start: "汪华依伤重将死、成为'我'的负担"
    value_end: "救赎与道歉被转交陌生人 / 两人大概率皆死 —— '我'拧巴一生的总账"
    beat_direction:
      function: "全篇 main climax + closing reversal —— crisis（弃/救）+ 主控思想直接出口"
      craft_note: |
