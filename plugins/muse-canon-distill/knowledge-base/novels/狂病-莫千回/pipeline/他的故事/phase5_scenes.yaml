    description: "广播确认大都会沦陷 → 汪华依一边笑一边哭反复道歉（首次认错）→ 闪前回填小崔自缢征兆（想说话又咽下/开始沉默）→ '就算这样活下去，意义呢？'"

  - scene_id: "TG-S11"
