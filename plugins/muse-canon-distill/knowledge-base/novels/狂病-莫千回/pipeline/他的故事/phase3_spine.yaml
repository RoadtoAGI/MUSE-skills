  - "'拧巴' vs '纯粹'的双人对照贯穿全篇 —— 绣剑 / 大天使 / '想和不想就是不想'三个母题反复回扣（line 13、85、285、807）"
  - "录音笔遗书框架 = 读者代理人/传火机制的本篇变体（line 833-839）—— 与《学校》日记本、《燃烧》罗允转达同构"
  - "'日记 / 录音 = 精神寄托 = 信念存续'的元主题（士兵笔记 line 581 / 汪华依提议写日记 line 587 / 录音笔本身）—— '精神垮了一切都完了'"
  - "免疫者悖论：'有钥匙却找不到锁'（line 441）+ '免疫病毒不免疫重症'（line 779）—— 希望被设定的同时就被掏空"
  - "戈多式希望的逐级升格：军区医院 → 政府机构 → 大都会广播 → 月儿洞 —— 每一级都不抵达，越接近越绝望（KB-26 越清晰越是劝退）"
  - "宿命式插叙结构：每个 Arc 用'闪前'预告某队友的死，制造'我们都知道结局仍前行'的压迫感"
  - "汪华依的'游戏即人生'信念 —— 把末日当'世界末日副本'（line 363）/ 引《刺客信条》《最后生还者》《寂静岭》《暗黑破坏神》—— 中二是她对抗虚伪现实的盔甲，也是她的死因"

