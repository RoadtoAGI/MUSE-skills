    与《燃烧》'连续受难型'同构，但尺度更大（跨数周、跨数省、跨整支小队的从聚到散），
    且每个 Arc 都通过'闪前插叙'预先泄露某个队友的死，制造'我们都知道结局却仍前行'的宿命压迫感。
    Arc 数量与'希望符号被收回'的次数对应：军区医院 → 政府机构 → 大都会广播 → 月儿洞 → 最后的药 —— 五次希望全部落空。

