# === 脊椎 ===

spine:
  protagonist: "'我'（无正式姓名，汪华依昵称'老张' / line 79、line 183'小仙'误称后改'老张'；末日前浦城地产销售）"
  spine_mode: "desire"
  desire_object: |
    表层：和重逢的高中旧友汪华依一起在末日里活下去 →
    后期具体化为'把抗生素送回去救汪华依'（line 833）
  shadow_desire: |
    '我'真正想要的不是活下去，是'活成汪华依那样纯粹的人' ——
    一个敢把心里想做的事做出来、敢愧疚不敢后悔、能在虚伪世界里做真实自己的人（line 831）。
    '我'一生'拧巴'（line 79 汪华依一语点破）：想买绣剑却只敢藏在心里（line 13）、想推门装吃力却要确认四下无人（line 19）。
    所以本篇的'救汪华依'从来不只是救一条命 ——
    是'我'想用一次不再瞻前顾后、不再当断不断的行动，把自己赎成'她那样的人'；
    而'我'最终困在药店、连药都送不出去（line 825），是这个 shadow_desire 的彻底落空。
  conscious_vs_unconscious:
    conscious: "陪汪华依玩 / 末日逃命 / 找官方避难所验证免疫 / 弃药寻药再回去救汪华依"
    unconscious: |
      '我'不自觉需要的是'摆脱拧巴、成为汪华依' ——
      汪华依临终留给'我'的话'选择了什么可以愧疚但不能后悔，想和不想就是不想，当断不断必受其乱'（line 807）
      正是'我'缺的那块；'我'一生都在'当断不断'：
      该不该和吵架司机打招呼（line 83）、该不该帮扒窗框求救的人（line 283）、该不该抛弃汪华依（line 785）、
      该不该回去救她（line 815-817）—— 每一次犹豫都付出代价。
      讽刺的是：直到录这段录音前，'我'终于学着游戏主角奔跑、做了一直想做没做的事（line 823），
      却还是'困在了这里'（line 825）—— 觉醒得太迟。

# === 激励事件 ===

inciting_incident:
  event: "南陵河景区石桥旁，岸边五六人忽然如疯了般跃入河中撕扯跳舞少女 —— 狂病在'我'眼前正式爆发"
  source_anchor: "line 131-137"
  type: "accident"
  delay_from_opening_chars_approx: 6000
  balance_before: "灾前 / 重逢叙旧的日常：'我'落魄但安稳，对末日新闻半信半疑（line 123 '陨星会擦肩而过'）"
  balance_after: "世界在一瞬间崩坏，'我'与汪华依被卷入逃命；'循规蹈矩前行'的所有人轨迹被同时撕碎（line 93、199 '世界末日，正式登场'）"
  impact_on_protagonist: |
    把'我'从一个'打听旧友过得好不好的阴暗失意者'，直接抛入'每一秒都要恰到好处地幸运才能活'的处境（line 187）；
    并把'我'与汪华依的命运死死绑定 —— 此后全篇'我'的每个选择都围绕'对汪华依负不负责'展开。
  function: |
    本篇激励事件来得比《燃烧》《学校》都晚（约 6000 字铺垫），因为前 6000 字的'灾前重逢'不是闲笔 ——
    它建立了'我 = 拧巴' vs '汪华依 = 纯粹'的核心对照（绣剑 / 大天使 / 想和不想就是不想），
    这个对照才是全篇真正的脊椎，爆发只是把它推上末日舞台。

# === 戏剧问题 ===

dramatic_question:
  main: "'我'能不能把汪华依（人类的免疫希望、也是'我'唯一的同伴）活着带出末日 —— 或者说，'我'能不能在关键时刻不再'拧巴'，做一次纯粹的选择？"
  obligatory_scene: "'我'必须面对'救不救 / 弃不弃汪华依'的最终抉择，并由这个抉择揭示'我'到底成没成为'她那样的人'"
  subtext: |
    在一个'理性者先死、纯粹者被消耗、活下来的全是会犹豫会算计的人'的世界里，
    '纯粹'到底是救命的信念，还是害死所有人的中二？
    汪华依的纯粹给了一整队人活下去的理由（小崔语 line 457），也让这一整队人全因她而死（line 793）；
    '我'的拧巴让'我'一次次活下来，却也让'我'最终一无所获、困死药店。
  payoff: |
    答案是双重否定式的反英雄收尾：
    '我'最终既没能果断离开（line 815 '实在不行，我还是去找汪华依吧'），
    也没能果断救她（line 825 弃药寻药却困在药店），
    '我'用录音笔把'送药 + 转达对不起'的责任交给陌生的'捡到者'（line 833-839）——
    和《燃烧》罗允'转达遗言'、《学校》日记本接力同构：
    '我'终究只能当一个把希望转交出去的'读者代理人'，而不能亲手兑现希望。
    戏剧问题的回答是：'我'到死都没学会不拧巴 —— 唯一接近纯粹的一次（学游戏主角潜行 line 819），仍以被困收场。

