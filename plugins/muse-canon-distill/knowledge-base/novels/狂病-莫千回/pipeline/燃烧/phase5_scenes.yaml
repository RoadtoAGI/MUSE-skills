# === 节奏曲线 ===

pacing_curve:
  arc_1: "缓"  # 山洞早晨 + 希望锚定
  arc_2: "缓 → 急"  # 人肉树林 → 树上伏击 → 李先生死
  arc_3: "急 → 极急"  # 村庄追击 → 老刘死 + 周全踹门
  arc_4: "极急 → 缓"  # 杀全员提议 → '杀了我吧' → 爆炸救场
  arc_5: "缓 → 急"  # 山头穿越 → 公路休息
  arc_6: "极急"  # 踢人头追击 → 李太太被踹 → 哮喘 → 周全独自去
  arc_7: "急 → 静 → 急 → 余韵"  # 接受死亡 → 周全狂奔 → 戛然而止 → 罗允转达
  notes: "连续受难型 —— 缓 / 急交替密度高，每个 Arc 都完成一次价值下沉"

# === 跨场景手艺主题 ===

cross_scene_craft_themes:
  sensory_substitution:
    description: "全篇用嗅觉 / 听觉 / 触觉替代视觉 —— 文体本身承担恐怖；'你看不见' 反成读者的代入器"
    scenes: ["RS-S01", "RS-S02", "RS-S03", "RS-S07", "RS-S10"]
    function: "感官替代是莫千回最极端的 POV 实验之一 —— 与《地铁》POV 转交 / 《学校》日记体并列"

  silent_aftermath:
    description: "李先生死（一句话） / 老刘死（关门 + 后续揭发） / 李太太死（声音递减） / 周全死（戛然而止）—— 全篇关键死亡都用省略 / 关门 / 完成态承担"
    scenes: ["RS-S03", "RS-S05", "RS-S08", "RS-S10"]
    function: "省略胜过直写 —— 'doing less is more'，与《地铁》刘敏 / 《学校》社长同源"

  hope_dispatched_then_revoked:
    description: "医院传闻 → 人肉树林 → 嗅觉警告 → 进化伏击 → 屋内困局 → 爆炸救场 → 体力透支 → 踢人头追击 → 周全自燃 → 罗允转达"
    scenes: ["RS-S01", "RS-S06", "RS-S07", "RS-S08", "RS-S10"]
    function: "每一个 Arc 闭合 = 一次希望被赠予后立刻收回 —— 与《地铁》Arc 4 涂血计划同源结构"

  reader_proxy_arrival:
    description: "罗允救场 + 转达遗言（line 177-183）—— 文学层面的'传火'：让一个外部读者替死者继续陪'你' 上路"
    scenes: ["RS-S10"]
    function: "与《学校》罗允拾日记本同源 —— 罗允作为'读者代理人' 跨篇定型"

  gray_male_lead:
    description: "周全'我不算是一个好人' 自白 + 踹李太太 + 自燃换药 —— 灰色男主原型"
    scenes: ["RS-S08", "RS-S10"]
    function: "与《地铁》杨和修同源结构，但反向：杨和修从'好人' 变恶，周全从'灰色' 走向自我牺牲；都打破'纯好人' 神话"
