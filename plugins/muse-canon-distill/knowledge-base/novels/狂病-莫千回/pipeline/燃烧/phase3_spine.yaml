_meta:
  version: "1.0"
  chapter: "燃烧"
  source: "novels/狂病-莫千回/燃烧.md"
  word_count_approx: 12000
  validated_against_source: true
  form_note: "第二人称'你' + 盲女 POV —— 全篇用感官替代手法承担视觉缺失，嗅觉 / 听觉 / 触觉替代视觉"

# === 脊椎 ===

spine:
  protagonist: "'你'（盲女，男友周全的搀扶者，本名未提）"
  spine_mode: "desire"
  desire_object: "活着翻山到达机场附近的医院 → 在传闻的军方避难所与周全一起重新开始"
  shadow_desire: |
    "你"想要的不是逃命 ——
    是在'看不见的世界里仍然被搀扶' ——
    所以当周全自燃身亡，"你" 想跟着死，是因为'被搀扶'的状态本身被夺走；
    而罗允被周全托付继续搀扶你 = 这个 shadow_desire 的延迟兑现
  conscious_vs_unconscious:
    conscious: "翻山头 / 闻感染者 / 救队伍 / 找哮喘药"
    unconscious: |
      "你" 没有'独立活下去'的概念 ——
      "你" 的活法是被周全搀扶
      所以当周全死，"你" 主动让感染者扑过来 / 让窒息发生
      "你" 求的不是死，是'被引领'的延续

# === 激励事件 ===

inciting_incident:
  event: "山洞早晨 + 老刘宣告医院方向 + 出发翻山"
  source_anchor: "line 13-17"
  type: "causal"
  delay_from_opening_chars_approx: 1100
  function: |
    用'网约车司机老刘' 的一句话把全篇目的地（机场旁医院）锚定 ——
    这就是这条希望线，全篇就是为了见它不能兑现
    末日开篇标准节奏：早晨 + 离开避难所 + 设定方向 + 立刻进入危险

# === 戏剧问题 ===

dramatic_question:
  main: "盲女'你'能不能活着到达医院 + 在末日里保住唯一让你活着有意义的人（周全）？"
  subtext: |
    在感染者会自残嘴部伏击、靠气味识别同类的世界里，
    一个看不见的人，是不是反而最适合活下来？
    或者反过来：在'被搀扶' 是唯一的活法时，搀扶者一死，被搀扶的人还能活吗？
  payoff: |
    答案是悖论式的：
    "你"靠嗅觉成了队伍的救星 → 队伍依次死去 → 周全自燃换药救你 → 你不肯用药
    最后罗允强行喂药 + 转达周全遗言 → "你"活下来不是因为'值得'，是因为周全用自己的命交换了你的命的合同
    罗允的'转达' = "你"的活下来是一笔债务，不是一次胜利

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: "感染者群（树上头朝下扑 / 自残嘴部伏击 / 草丛交媾 / 踢人头追击 / 村庄外围聚集）"
    layer_2_environment: "山林崎岖（'你看不见的沟壑'）+ 村庄人肉树林 + 山头腐烂祭坛 + 公路加油站"
    layer_3_evolution: "感染者自残嘴部隐藏狂笑（line 69 撕舌头 / 塞石头）—— 第一次伏击战术具体化"
  interpersonal:
    layer_1: "李太太骂'你' 扫把星 + 拽老刘垫背 + 拽'你' 背包垫背 —— 自私链式"
    layer_2: "周全的'我不算好人' 自白（line 155）+ 踹李太太 + 自燃换药 —— 'good 中夹 evil' 模糊"
    layer_3: "感染后的周全仍呼喊'你'的名字 + 描述要把'你' 心脏缝在胸口 / 剥皮包裹 —— 爱的扭曲版本"
  internal:
    layer_1: "盲人特质带来的'被搀扶依赖'"
    layer_2: "'命压在你身上' 心理负担（line 71）"
    layer_3: "周全死后的'活下去意义崩坏' + 拒绝用药"
  societal:
    - "手机网络几乎全废（line 135）"
    - "唯一可用的是手机指南针 / 离线地图（line 135） —— 与《地铁》line 95 同源"
    - "机场附近医院 = 军方驻扎传闻（line 11）—— 跨篇'希望符号' 共享"

# === Arc 框架 ===

arc_framework:
  total_arcs: 7
  notes: |
    短篇但 Arc 密度极高 —— 每个 Arc 都是'希望被赠予 → 希望被收回' 闭合
    这是莫千回'连续受难体' 结构 ——
    Arc 数量 = 队员死亡数 + 1（每死一个就完成一次价值层下沉）

  arc_1_cave_morning:
    label: "山洞早晨 + 医院方向锚定 + 出发"
    value_starting: "山洞庇护下的微薄安宁"
    value_ending: "上路（希望被设定）"
    climax_event: "老刘'网约车司机经验：绕村翻山到医院'（line 15）"
    source_anchor: "line 5-17"
    function: |
      把传闻型'希望符号'（机场旁医院 + 军方驻扎）通过一个具体角色（前网约车司机）锚定
      为后续 6 个 Arc 的连续下沉准备落点

  arc_2_human_tree_forest:
    label: "人肉树林穿过 + 嗅觉第一次发挥 + 自残嘴部感染者天降伏击 → 李先生死"
    value_starting: "上路希望"
    value_ending: "认知层崩坏（感染者会进化 + 进入山林）+ 第一死"
    climax_event: "树上感染者头朝下扑 + 砸死李先生（line 39）+ 后续两个嘴塞石头 / 撕舌头的感染者（line 69）"
    source_anchor: "line 19-71"
    function: |
      引入两条关键世界规则：
      (1) 感染者特征气味 = 煮熟糖浆 + 咸味（line 27）—— 跨篇 lore 首次命名
      (2) 感染者自残嘴部隐藏狂笑伏击（line 69）—— 进化战术首次具体化
      原'感染者不进山林'的安全假设被打破
      李太太丧夫 + 立刻骂'你' 扫把星 —— 队伍内部反目第一次发生

  arc_3_village_chase:
    label: "村庄外围山路 + 大笑群追击 + 老刘被拽倒喂感染者 + 周全踹门进民居"
    value_starting: "队伍内紧张但靠'你' 嗅觉绕行"
    value_ending: "深渊（老刘死 + 被困民居 + 周全提议杀全员）"
    climax_event: |
      李太太拽倒老刘自己逃 → 老刘惨叫 + 撕裂声（line 99 后揭发于 line 153）
      周全踹门 + 关门 + 老刘没进来 + 抽刀提议'让大家不痛苦地死去'（line 105）
    source_anchor: "line 73-105"
    function: |
      第一个'好人型死亡'：老刘以经验为队伍引路，被队友主动牺牲
      周全的'抽刀' 提议 = 莫千回'好人也会黑化' 的早期信号
      引入两个关键意象：被剖肚当公厕的人 + 烤乳猪式焚烧（line 107）= 感染者群体仪式化恐怖

  arc_4_say_kill_me:
    label: "屋内被困 + '你' 说'杀了我吧' + 远方爆炸救场"
    value_starting: "深渊（被围攻 + 自杀提议）"
    value_ending: "希望被外部赠予（爆炸引走感染者）"
    climax_event: |
      "你"对周全说'杀了我吧'（line 113）→ 瞬间被远方爆炸打断
      感染者群追爆炸源而去
    source_anchor: "line 105-119"
    function: |
      "杀了我吧" 是反英雄收尾的预演 —— 被外部偶然打断
      爆炸源未明（暗示罗允或其他幸存者） —— 跨篇钩点
      李太太提议'被感染加入'（line 111）—— 与《狂人日志》吴先生'变成弱智没意思'对位
      '感染后即使深爱之人也会互相伤害，也许那时你们会享受这种伤害' —— 全章 lore 顶点之一

  arc_5_mountain_altar:
    label: "穿越腐烂祭坛山头 + 公路休息 + 再次靠近医院传闻"
    value_starting: "希望被赠予（爆炸救场）"
    value_ending: "希望被维持但体力透支（隐藏的危险）"
    climax_event: "翻越腐烂祭坛山头（line 129-131）+ 公路边松懈休息（line 137）"
    source_anchor: "line 121-141"
    function: |
      腐烂祭坛意象 = 感染者群体狂欢的物证
      '没有比任何时候都浓烈的腐烂恶臭' + '酸臭异常带腥味的冲击' —— 感官替代手法顶点
      手机指南针仍可用 —— 与《地铁》《学校》line 135 同源
      休息一刻 = 体力透支为下一波感染者追击埋伏笔

  arc_6_kick_head_chase:
    label: "踢人头感染者追击 + 周全踹李太太 + 哮喘发作 + 周全独自去加油站找药"
    value_starting: "希望被维持但体力透支"
    value_ending: "周全离开 + 哮喘窒息 + 感染者味道靠近"
    climax_event: |
      李太太拽'你' 背包想垫背 → 周全踹倒她（line 145）→ 李太太被感染者撕裂（line 147）
      跑到双腿一软扑倒 → 哮喘发作 + 药在背包里被李太太拽走 → 周全独自去加油站找药（line 159-163）
    source_anchor: "line 141-167"
    function: |
      第二个'好人型死亡'（李太太也算好人？她至少是平民） —— 真正的'好人'其实没有
      周全自白'我不算是一个好人' —— 揭穿'保护爱人' 与'冷血杀人' 的同体
      手机震动方向 = 周全留给'你' 的物质遗产
      '你' 拒绝用药 = 第二次自杀预演

  arc_7_self_immolation_relay:
    label: "周全自燃狂奔 + 罗允救场 + 转达遗言"
    value_starting: "周全自燃 + '你' 拒绝用药"
    value_ending: "活下来作为债务（罗允强行喂药 + 转达周全遗言）"
    climax_event: |
      周全感染后大喊'你' 名字 + 描述要把心脏缝在胸口 + 突然戛然而止（line 167-171）—— 罗允击杀
      "你" 摸到周全焦尸 + 背包绑在他手上（line 173）
      罗允喂哮喘药 + '周全有些话还想让我转达给你呢'（line 177-183）
    source_anchor: "line 167-183"
    function: |
      全章 main climax —— 莫千回标志性'用一个动作承担多层意义'：
      周全的自燃 = (1) 杀死自己（不愿以感染者状态扑'你'）
                    (2) 把背包送回（药物物理传递）
                    (3) 让'你' 看见（即使你看不见，你能闻到焦肉）
                    (4) 把救人责任传给罗允
      罗允的'转达'让"你" 的活下来变成对周全的偿还

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "周全自燃狂奔抱着背包 + 罗允从背后击杀 + 罗允强行喂哮喘药 + 转达遗言"
    source_anchor: "line 167-183"
    why_climax: |
      全章价值层的引爆点：
      - 周全开篇是'帮你看见世界'的搀扶者 → 末尾变成'即使变成感染者也想拥有你'的扭曲爱
      - "你" 开篇是'被搀扶的弱者' → 末尾变成'被强行救活的债务人'
      - 罗允从开篇一直缺席 → 末尾以'救场 + 转达者' 双重身份接管"你"的命

  closing_reversal:
    event: "罗允的最后一句'你也应该好好地活下去啊'（line 183）"
    source_anchor: "line 183"
    function: |
      不是 happy ending 也不是 hopeless ending —— 是 obligated ending
      "你" 必须活下去，因为周全用自燃换的
      这种'活着 = 偿还' 的反英雄余韵与《地铁》line 393 陈雨琪对陆小虎同源

  controlling_idea_for_this_chapter: |
    "在末日，所谓'好人 / 坏人' 的边界被消磨 ——
    最爱你的人会变成最想吃你的人，
    最自私的人会用自燃的方式救你，
    而真正的救赎不是被赠予的，是被转达的债务。"
    （映射全系列 candidate_c：'他者的善意可能比恶意更危险 —— 因为它给你希望，让你相信下一刻可以更好。'）

# === 主题钩 ===

theme_hooks:
  - "嗅觉 / 听觉 / 触觉替代视觉 —— 文体本身承担恐怖；'你看不见' 反成读者的代入器"
  - "感染者气味（煮熟糖浆 + 咸味）跨篇 lore 首次命名"
  - "感染者自残嘴部隐藏狂笑 —— 进化战术首次具体化 + '人' 与'怪物' 边界第一次被自残打破"
  - "好人型死亡的链式（老刘 → 李太太 → 周全）—— 每一个'让别人活' 的选择都让选择者死"
  - "'我不算好人' 的男主自白 + 自燃赎罪 —— 莫千回式'灰色男主' 原型"
  - "'活下来 = 偿还' 的反英雄余韵 —— 与《地铁》《学校》同源"

# === 跨篇钩点 ===

cross_chapter_hooks:
  recurring_characters_anchored_here:
    - "罗允（真）：本篇尾段第二次实质性出场 —— 摩托车（line 177）+ 救人但不强迫 + 转达遗言 + 淡淡说话风格"
    - "罗允的'救人原则' 首次确立：他救人但不替人选择继续活下去，他只是把死者的话转达"
  worldbuilding_contributed:
    - "感染者特征气味：煮熟糖浆 + 咸味（line 27）—— 跨篇 lore 首次命名"
    - "感染者自残嘴部隐藏狂笑（line 69）—— 进化战术首次具体化，与《地铁》line 137 避电进化同源（但《燃烧》早于《地铁》的进化阶段）"
    - "树上头朝下扑的伏击战术（line 39）—— 早期进化的第一种伏击方式"
    - "感染者会聚集在村庄 / 山头进行仪式化群体狂欢（line 107 烤乳猪式焚烧、line 131 腐烂祭坛）"
    - "被剖肚当公厕的人（line 107）—— 与《地铁》line 281 风井口同源意象"
    - "手机指南针 / 离线地图仍可用（line 135）—— 与《地铁》line 95 / 《学校》line 135 同源"
    - "机场附近医院传闻：军方驻扎（line 11）—— 与《学校》《地铁》同源"
    - "感染者保留辱骂 + 性侵语言（line 91, 169）—— 与《学校》line 25 / 《地铁》line 65 同源"
  imagery_contributed:
    - "人肉树林（line 23 上吊一般 + 肠子缠脖子 + 肠子从下体拽出）"
    - "头朝下从树上扑的感染者（line 39）"
    - "嘴里塞石头 / 舌头被撕的感染者（line 69）"
    - "踢人头当足球的感染者（line 141）"
    - "周全焦尸 + 双手向前伸 + 背包绑在手上（line 173）"
    - "罗允摩托车的声音 + 淡淡的转达语气（line 177-183）"
  open_lores_to_be_resolved:
    - "Arc 4 的远方爆炸源 —— 是罗允？还是其他幸存者？是否在其他篇章再现？"
    - "罗允去哪 —— 他救完'你' 后是否继续走？后续是否再见'你'？"
