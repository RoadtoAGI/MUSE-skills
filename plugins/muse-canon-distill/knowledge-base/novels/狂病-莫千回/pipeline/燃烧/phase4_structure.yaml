_meta:
  version: "1.0"
  chapter: "燃烧"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: "Arc 7 段 —— 连续受难型结构，每 Arc 完成一次价值下沉"

# === Arc 1: 山洞早晨 ===

arc_1:
  label: "山洞早晨 + 医院方向锚定 + 出发"
  source_anchor: "line 5-17"
  sequences:
    - seq_id: "1.1"
      label: "盲女'你' POV 建立 + 五人小队介绍"
      source_anchor: "line 5-11"
      core_conflict: "盲人感官 vs 末日全感官冲击"
      progression: |
        "你"是盲人 + 灾难爆发后求生第几天已忘
        领队老刘 + 男友周全 + 李氏夫妇 + "你" = 5 人
        在逃出城公路上认识 + 当时听见惨叫狂笑撕裂骨折辱骂
        周全描述邻居被孩子塞车轮压碎 + 妻子启动汽车 + 孩子涂血在身
      seq_climax: "听觉构造的末日图景 —— 第一次用'你看不见但你能听' 承担恐怖"

    - seq_id: "1.2"
      label: "出山洞 + 老刘'网约车司机经验' + 医院希望"
      source_anchor: "line 13-17"
      core_conflict: "希望被设定 vs 山林未知"
      progression: |
        周全搀扶'你' 出山洞 + 风吹山谷的静谧
        老刘以网约车经验告知方向：绕村翻山即可到医院
        机场附近医院有军方传闻 = 最后希望
        李氏夫妇有精神 + 周全鼓励'一切都会好起来'
        早餐 + 出发
      seq_climax: "老刘'差不多就可以到达医院了' —— 希望被锚定，为后续 6 Arc 的连续收回准备落点"

# === Arc 2: 人肉树林 + 嗅觉发挥 + 自残嘴部感染者 ===

arc_2:
  label: "人肉树林 + 嗅觉首次发挥 + 自残嘴部感染者天降伏击 → 李先生死"
  source_anchor: "line 19-71"
  sequences:
    - seq_id: "2.1"
      label: "人肉树林穿过 + 第一阵嗅觉发挥"
      source_anchor: "line 19-25"
      core_conflict: "幸存者 vs 树上挂的人肉痕迹"
      progression: |
        山间小路 + 腐烂血腥钻进鼻子 → "你"小声告诉周全前面有东西
        老刘疑声 + 李太太崩溃哭：'像腊肉一样掏空内脏挂在树上'
        李先生安慰：'不要去看，往前走'
        "你"感受脚底粘稠 + 告诉自己'那只是泥土'
      seq_climax: "人肉树林穿过 —— 队伍首次接受'感染者会进入山林' 的修正"

    - seq_id: "2.2"
      label: "煮熟糖浆 + 咸味的嗅觉锁定 + 队伍不信"
      source_anchor: "line 27-33"
      core_conflict: "盲女嗅觉警告 vs 李太太怀疑"
      progression: |
        "你"嗅觉捕捉到煮熟糖浆 + 咸味 → 回忆爆发时 + 公路上闻过两次
        告诉队伍：感染者在附近
        李太太撇嘴：'狗鼻子也没这么灵吧，应该是精神紧绷'
        "你"想解释味道两次先验：爆发时 + 公路上感染者近时
      seq_climax: |
        "你" 把嗅觉规则首次给到队伍 = 跨篇 lore '煮熟糖浆 + 咸味' 第一次被命名（line 27）
        '这是一种警告但被怀疑' —— 与《学校》line 19 '甚至以为是打闹' 同源延迟

    - seq_id: "2.3"
      label: "树上感染者头朝下扑 + 砸死李先生"
      source_anchor: "line 35-41"
      core_conflict: "幸存者 vs 树上伏击的感染者"
      progression: |
        身边一阵劲风 → 头顶东西掉下 → 爆裂声 + 血腥味
        李太太惊叫 + 周全拽'你' 倒下 → 身后一阵爆裂声
        平静后周全告知：树上感染者头朝下扑 + 像扑人 + 砸中李先生 → 两人脑袋砸碎
        李太太撕心裂肺哭嚎 + 老刘催促继续走
      seq_climax: "李先生死 —— 第一个'好人型死亡'； 'no time to mourn' 莫千回标志性节奏（line 41-43）"

    - seq_id: "2.4"
      label: "再现自残嘴部感染者 + 嗅觉假说被验证"
      source_anchor: "line 45-71"
      core_conflict: "幸存者 vs 草丛中无声的两个感染者"
      progression: |
        "你"闻到极浓郁感染者味道 + 警告周全不要靠近村子
        老刘走过来询问'怎么能闻到' → "你"回答可能因为失明
        李太太突然打"你"+ 周全推开"你"+ 李太太骂'扫把星 / 有心机的婊子' → 周全凶狠威胁'杀了她'
        改走村庄旁山路（绕路一倍）
        村子里感染者太多 → 山林间也闻得到 → "你" 感官失效
        草丛异响 + 老刘 + 周全杀两个感染者 → 两个感染者一个下巴 / 舌头撕裂 + 一个嘴塞石头（line 69）
        老刘 + 周全推论：感染者意识到笑声会暴露自己 → 自残嘴部隐藏
      seq_climax: |
        自残嘴部感染者首次具体化（line 69）—— 跨篇 lore：进化战术首次具体化
        '人' 与'怪物' 边界第一次被自残打破 —— 感染者会主动改造自己

# === Arc 3: 村庄外围山路 + 老刘被拽倒 + 周全踹门 ===

arc_3:
  label: "村庄外围山路 + 大笑群追击 + 老刘被拽倒喂感染者 + 周全踹门进民居"
  source_anchor: "line 73-105"
  sequences:
    - seq_id: "3.1"
      label: "大胆决策：靠近村子用嗅觉避感染者"
      source_anchor: "line 73-77"
      core_conflict: "保守绕路 vs 大胆借嗅觉穿越"
      progression: |
        "你" 嗅觉一直高负载 + 压力大 → 老刘提议靠村庄边山路行进 → 嗅觉避开
        '所有人都把命押在你身上'（line 73）
        在灌木丛穿越 → "你" 警告草丛里有两个感染者交媾
        老刘 + 周全干掉那两个感染者 → 嘴巴正常（沉迷交媾不大笑）
      seq_climax: "队伍开始把'你' 嗅觉系统化使用 —— 'do it like Doppler radar'"

    - seq_id: "3.2"
      label: "李太太 vs '你' 短暂和解 + '神通' 询问"
      source_anchor: "line 79-83"
      core_conflict: "李太太的悔意 vs '你' 的警觉"
      progression: |
        周全离开身边去杀感染者 → "你" 慌张迷茫 + 握紧周全给的匕首
        李太太凑近 → '你怎么得到的神通，是不是家里信仰，她也想信仰' → "你" 回答可能失明导致嗅觉灵敏
        感染者味道消失 → 周全回来
      seq_climax: "李太太对'你' 嗅觉的崇拜 —— 为后续她的'再次背叛' 做反讽铺垫（她想信仰，但她最后还是拉'你' 垫背）"

    - seq_id: "3.3"
      label: "大笑感染者群追击 + 屏息穿越 + 李太太抱怨暴露"
      source_anchor: "line 83-91"
      core_conflict: "屏息隐蔽 vs 李太太抱怨发声"
      progression: |
        远处五六个感染者大笑 + 骂脏话 → "你"感觉气息越来越近
        屏息穿过灌木丛 → 感染者从身边走过没发现
        李太太抱怨'不应该走村子旁边' → "你" 听到附近有感染者气息近
        一阵刺耳狂笑从身边草丛响起 → 周全骂一声 + 拽"你" 狂奔
      seq_climax: "李太太的'抱怨' 直接暴露位置 —— 这是 Arc 3 的转折"

    - seq_id: "3.4"
      label: "村庄边山壁绝境 + 冲进村子 + 周全踹门进民居"
      source_anchor: "line 93-99"
      core_conflict: "山壁 vs 村庄"
      progression: |
        慌不择路跑到山壁边 → 两选：回头对抗 / 冲村子（都是死，但冲村子稍慢死）
        换方向 + 冲进村子 → "你" 嗅觉因近距离感染者失效
        周全提醒'前面有台阶' → "你" 跨过
        周全踹开门 → 招呼后面人快进来 → 李太太进 + 周全直接关门
        老刘没进来
      seq_climax: |
        关门瞬间 + 老刘没进来 —— 莫千回标志性'关键死亡用关门 + 缺席承担'
        与《地铁》刘敏的死法 / 《学校》社长的死法同源（不写惨叫，写缺席）

    - seq_id: "3.5"
      label: "屋内 + 李太太揭发'老刘摔倒来不及' + 周全抽刀提议杀全员"
      source_anchor: "line 99-107"
      core_conflict: "屋内困局 vs 死亡方式选择"
      progression: |
        屋外狂笑大叫 + 砸门 + 惨叫声
        李太太颤抖告诉"你"：老刘摔倒了来不及……（line 99）
        周全发现窗户玻璃没了 + 防盗窗只能暂时挡 + 抽刀
        周全提议：让大家不痛苦地死去 + 自杀
        通过李太太的描述：医学院学生当烤乳猪 + 焚烧 + 惨叫被当作乐曲 + 周围感染者跳舞（line 107）
      seq_climax: "周全抽刀 + '让大家不痛苦地死去' —— 与《学校》line 197 '我' 摸口袋暗物（自感染物）同源 = 反英雄的死亡方案"

# === Arc 4: 屋内绝境 + '杀了我吧' + 远方爆炸救场 ===

arc_4:
  label: "屋内绝境 + 李太太'被感染加入'提议 + '你' 说'杀了我吧' + 远方爆炸引走感染者"
  source_anchor: "line 109-119"
  sequences:
    - seq_id: "4.1"
      label: "李太太提'被感染加入' vs '你' 的反驳"
      source_anchor: "line 111"
      core_conflict: "感染逃路 vs 感染后会伤害爱人"
      progression: |
        李太太：'要不要让感染者咬伤我们加入他们，应该比死轻松' → "你" 没回话 + 周全没回话
        "你"知道李太太对 + 也知道感染后人会互相伤害（'即使深爱之人也会互相伤害，也许那时你们会享受这种伤害'）
      seq_climax: |
        感染逃路被提出 + 被沉默否决 —— 与《狂人日志》吴先生'变成弱智没意思' 对位
        感染 = 解放 vs 感染 = 异化 的张力 = 全系列底层 lore

    - seq_id: "4.2"
      label: "'杀了我吧' + 爆炸打断"
      source_anchor: "line 113-119"
      core_conflict: "自杀决断 vs 外部偶然救场"
      progression: |
        "你"抬头向周全方向说'杀了我吧'（line 113）—— 反英雄预演
        话音刚落 → 远方爆炸声（line 115）→ 感染者群兴奋讨论 → 撞门停止 → 全数追爆炸源
        周全拥抱'你' → "你" 第一次感谢老天活着
        李太太兴奋感叹'疯子真是言之无尽'
      seq_climax: |
        "杀了我吧" 是反英雄收尾的'预演' —— 被外部偶然打断
        爆炸源未明 = 跨篇钩（暗示罗允或其他幸存者）
        莫千回标志性'希望被外部赠予 + 我们都不知道为什么'

# === Arc 5: 腐烂祭坛山头 + 公路休息 ===

arc_5:
  label: "腐烂祭坛山头 + 公路休息 + 再次靠近医院传闻"
  source_anchor: "line 121-141"
  sequences:
    - seq_id: "5.1"
      label: "出屋绕村庄 + 周全紧张 + 不愿说话"
      source_anchor: "line 121-125"
      core_conflict: "嗅觉警戒 vs 周全的隐藏情绪"
      progression: |
        村庄气息依然浓郁 → 绕到村子外面继续走
        李太太从离开村子后很少说话（感受到自己造的祸）
        周全持续紧张 + "你" 安慰说'周围没感染者' → 周全只'嗯' 一声
      seq_climax: "周全的'嗯' —— 隐藏后续'我不算是一个好人' 自白的伏笔"

    - seq_id: "5.2"
      label: "腐烂祭坛山头 + 全员呕吐"
      source_anchor: "line 127-133"
      core_conflict: "腐烂恶臭 vs 翻山求生"
      progression: |
        山头一股之前从未的浓烈腐烂恶臭 + 酸臭带腥味
        "你"呕吐 / 李太太干呕 / 周全吞咽口水忍呕
        周全告诉"你"：山头可能举行过仪式 + 腐烂肉块残骸（人 + 动物）
        '等到了医院一切都会好起来'
        翻过山头 → 感染者味道消散 → 暗示'医院附近确实更安全'
      seq_climax: "腐烂祭坛山头穿过 —— 感染者群体狂欢的物证 + 用感官替代视觉的写法顶点"

    - seq_id: "5.3"
      label: "下山到公路 + 手机指南针 + 体力透支休息"
      source_anchor: "line 135-141"
      core_conflict: "希望接近 vs 体力透支"
      progression: |
        周全拿出手机找方向 → 网络几乎全废但指南针仍可用
        肾上腺素退潮 + 双腿一软 → 李太太也倒下干呕
        周全：'休息一下吧 + 那行 + 现在的你一定后悔没拼命走到医院吧'（line 139）
      seq_climax: "周全的话'你后悔没拼命走到医院吧' —— 直接预告 Arc 6 的失败"

# === Arc 6: 踢人头感染者追击 + 周全踹李太太 + 哮喘 ===

arc_6:
  label: "踢人头感染者追击 + 周全踹李太太 + 哮喘 + 周全独自去加油站找药"
  source_anchor: "line 141-167"
  sequences:
    - seq_id: "6.1"
      label: "踢人头感染者出现 + 体力透支无法跑"
      source_anchor: "line 141-143"
      core_conflict: "体力透支 vs 踢人头感染者追击"
      progression: |
        三四个感染者像踢皮球一样大笑着踢着人头在公路出现 → 发现"你们" → 冲过来
        "你" 双腿发软不能跑 → 周全搀扶
        感染者气息充满胸腔
      seq_climax: "踢人头当足球 —— 感染者'游戏化嗜虐'写法的标志性意象"

    - seq_id: "6.2"
      label: "李太太拽'你' 背包 + 周全踹倒 + 李太太被撕裂"
      source_anchor: "line 145-147"
      core_conflict: "李太太自私 vs 周全护妻"
      progression: |
        背包被拽 + 周全怒吼'操你妈的还来！' + 闷响 + 李太太惊叫
        李太太被踹倒 + 拽掉"你" 背包 → 周全扶住"你"
        李太太诅咒 → 变哀求 → 被感染者撕裂掩盖
      seq_climax: "周全'还来' = 已经识破李太太前科（拽倒老刘）—— line 145 的'还' 一字千钧"

    - seq_id: "6.3"
      label: "'我不算是一个好人' 自白 + 哮喘发作 + 药在背包"
      source_anchor: "line 149-159"
      core_conflict: "灰色男主 vs 盲女信任"
      progression: |
        跑到双腿一软扑倒 → 周全愤怒抱怨自己废物
        周全自白：李太太是被他踹倒的 + 之前看见李太太拽倒老刘自己跑 + 想着随她去
        '我不算是一个好人' + '但绝对不会伤害你，即使伤害自己也不会伤害你'（line 155）
        "你"喉咙发痒 + 哮喘发作 → 药在背包里被李太太拽走
      seq_climax: "周全的自白 —— 与《地铁》杨和修的内心独白同源结构，但反向：杨和修变恶，周全承认自己一直灰色"

    - seq_id: "6.4"
      label: "周全独自去加油站找药 + 手机震动方向"
      source_anchor: "line 159-163"
      core_conflict: "周全冒险 vs '你' 阻拦"
      progression: |
        周全看到来路有加油站 → 离医院还两公里 + 哮喘两公里撑不住
        "你"伸手抓周全 → 周全甩开 → '哪怕百分之一可能也要试' → 手机塞给"你" + 方向震动设定
        周全爬起向来时方向离开
      seq_climax: "手机震动方向 = 周全留给'你' 的物质遗产 —— 道具承担遗言（与《地铁》吉他承担遗言同源）"

# === Arc 7: 周全自燃 + 罗允救场 + 转达遗言 ===

arc_7:
  label: "周全自燃狂奔 + 罗允救场 + 转达周全遗言"
  source_anchor: "line 165-183"
  sequences:
    - seq_id: "7.1"
      label: "'你' 独自窒息 + 感染者味道靠近 + 接受死亡的超脱"
      source_anchor: "line 165-167"
      core_conflict: "活下去意义 vs 死亡超脱"
      progression: |
        周全离开 → "你" 觉得整个世界静极
        胸闷异常 + 嗓子被堵 + 接受死亡反而呼吸平稳
        感染者味道靠近 + 烧焦味道 → 以为是感染者追来 + 周全失败
        无所谓了 —— '没有周全你也没有活下去的意义和希望'
      seq_climax: "接受死亡的超脱 —— 第二次自杀预演（第一次是 Arc 4 '杀了我吧'）"

    - seq_id: "7.2"
      label: "感染后周全狂奔 + 描述要把心脏缝在胸口"
      source_anchor: "line 167-171"
      core_conflict: "感染者周全 vs 周全的'我' 还存在吗"
      progression: |
        感染者味道 + 烧焦味道靠近 → 周全的声音狂笑 + 喊"你" 名字
        '把你心脏缝在胸口 + 剥皮包裹我 + 吃掉你身上的每一寸血肉'（line 169）
        恐惧 → 悲伤 → '也许这样也挺好'
        即将扑到面前时戛然而止
      seq_climax: |
