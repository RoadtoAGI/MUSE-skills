_meta:
  version: "0.4"
  status: |
    13 篇全部单篇拆解完成 + 综合层刷新。
    全 13 篇（学校 / 燃烧 / 狂人日志 / 地铁 / 恶 / 死亡奔赴 / 医院 / 黄金国 / 51人 / 套中人 / 不详 / 他的故事 / 精神病院）
    均已产出单篇 phase3_spine.yaml（含 world_alignment / cross_chapter_hooks / controlling_idea 证据），
    跨篇人物索引（characters/_cross_part_index.md）已综合产出 reconciliation + 5 条缝线，作为权威跨篇结论。
    本版 controlling_idea 已由 v0.3 的"三候选并列 + pick_after_full_read"收敛为"a 为脊椎 / b 为机制 / c 为情感引擎"的单主陈述。
  evidence_basis:
    - "学校（13k 字 / 日记体第一人称→末段罗允第三人称接续 / 爆发首日 2023-4-16 系列时序原点）：罗允全系列首登场 + 物质特征完整建立（钉钉球棒 / 99 度生命汁水燃烧瓶 / 摩托车 / 头盔）；一楼楼梯铁门外锁链 = 反派人类首次实物入场；POV「我」吞狗子断指自感染、理由「怕疼」（line 217-219）（《学校》line 5 / 191 / 217-235）"
    - "地铁（22.5k 字 / 多线幸存者小队第三人称→末段 POV 转交陆小虎 / 主舞台封闭地铁线）：杨和修（最理性最强最有道德感的骨科医生）涂血伪装失败被感染、反向猎杀同伴 = candidate_b 核心载体；陆霞克吉他自尽断后；气味识别假说 + 病毒不空气传播推论的原始出处（《地铁》line 301 / 329-345 / 387-393）"
    - "燃烧（12k 字 / 第二人称盲女 POV + 感官替代）：感染者气味（煮熟糖浆 + 咸味）首次命名；自残嘴部隐藏狂笑伏击战术首次具体化；罗允「救人但不强迫 + 转达遗言」原则首次完整呈现；周全「我不算好人」自燃换药 = 灰色男主原型（《燃烧》line 27 / 69 / 167-183）"
    - "狂人日志（22.3k 字 / 录音机框叙事 + POV 三层下沉 / 罗允为框层听者）：吴先生「我所有录音声音都经过修改 / 我可以是任何人」= 假罗允伪装机制本篇出处；「变成没有目的只会施虐的弱智…和畜生没两样」主动拒绝感染（line 85）；「从出生起就没有同情心」人性之恶独立宣言 = candidate_a 最强证据（《狂人日志》line 85 / 273 / 299）"
    - "恶（29.9k 字 / 反派内聚焦廖振宇 POV / 吴先生伪装罗允暗线）：两类恶对位（表演型廖振宇 vs 纯粹型吴先生）；吴先生当面裁判「谁配被记住」+ 烧录像 + 把廖振宇交感染者折磨至死；张潇潇「罗允是好人」蛊惑廖振宇杀蔡宇（《恶》line 271-277 / 329-361）"
    - "死亡奔赴（31.7k 字 / 第三人称岳子安 POV→末段罗允+洪扬接管 / shared_canon）：岳子安「奔赴女友」执念被感染异化为「把所爱者像花一样切下来吃掉」的占有幻觉；罗允「来晚没救到 / 读死者遗书塞笔记本」= 读者代理人镜像变体（《死亡奔赴》line 475-505 / 479）"
    - "医院（33.1k 字 / 第一人称刘医生「骗子」自审 / shared_canon）：机场旁医院真相 = 伪避难所、军方驻扎系以讹传讹、已沦陷；录音机杀手石浩洋诈死 + 用林东青从内部投毒纵火开二楼铁门；李教授狂病起源学说最密集落点；刘医生注射孙队长血自感染反击（《医院》line 103 / 247-291 / 605-641）"
    - "黄金国（49.3k 字 / 第三人称罗允主 POV 首次主角化 / shared_canon）：罗允核心动机揭示「惧怕死亡的过程而非死亡本身 / 拯救世界能否成功不重要、只是奔向死亡的理由」（line 825）；罗凯伯富豪嗜死避难所 + 黄金大厦 + 门卫老张；创世军实体登场（老大哥胯下缝陶亦仁脸皮）（《黄金国》line 777-779 / 825）"
    - "51人（31.7k 字 / 第三人称张亦川 POV 倒叙嵌套 / shared_canon）：创世军（陶亦仁创立的死亡奔赴型邪教武装）兴亡 + 51 人即崩塌；陶亦仁最后命令「追杀一个叫罗允的，两个人在行动」（line 361）锚定创世军=罗允追猎方；痛苦型感染者变体；秦良岳自选感染安乐死（《51人》line 211 / 221-223 / 361 / 707-715）"
    - "套中人（36.4k 字 / 第三人称洪扬 POV→插入士兵徐永恒 / shared_canon / 洪扬 origin 前传）：契诃夫式「套子=囚笼 vs 套子=铠甲」悖论；对楼网民弹弓引感染者杀父子 = 网络暴力实体化为现实操纵欲；line 695 罗允骑摩托追上挥手 = 罗允+洪扬搭档关系起点（《套中人》line 21 / 527 / 695）"
    - "不详（36.1k 字 / 第一人称李鸾不可靠叙述 + 双人格隐藏 / canon-core）：李鸾=陶亦仁第二人格（《搏击俱乐部》式「你是我」line 523），创世军缔造源头；「假罗允+小林」猎杀沈曾祺小队 = 反派对位线受害端；母猪发情粉让感染者误认携带者为同类；自我感染引创世军吃掉自己（《不详》line 245 / 461-475 / 523-567）"
    - "他的故事（37.7k 字 / 第一人称「我/老张」录音笔遗书框架 / 强归属狂病主线）：「拧巴 vs 纯粹」双人对照；免疫者硬设定首现（汪华依 line 381 免疫病毒但被带菌感染者咬后化脓重症 line 779）；KB-26 综合应急管理中心广播 + 军队自溃一手记录；封闭尸洞退化型感染者（《他的故事》line 381 / 479 / 579 / 733-779）"
    - "精神病院（53k 字 / 系列最长 / 第三人称杨中旭 POV + 嵌套幻想框架元翻转 / part-local 锚定）：汉恩基金精神卫生中心 = 伪装成避难所话术的陷阱型反派据点；副院长（家人被装病脱罪患者灭门）「让精神病人永远死在这里」净化执念 = 第三类人类反派；结尾杨中旭走入黄金大厦 / 门卫老张 = 黄金国 seam（《精神病院》line 5 / 287 / 311-313 / 327）"

title: "狂病系列"
author: "莫千回"
form: "短篇系列（13 篇独立短篇，共享世界观与时序，存在跨篇人物联动）"

premise:
  one_liner: "2023 年某春日，一种引发狂笑、嗜虐与痛觉缺失的'狂病'病毒在全球同时爆发；人类社会瞬间崩坏，但比病毒更可怕的，是那些早就预备好末日的人。"
  whatif: "如果一场末日灾难同时撕开两层人——一层被病毒解开了束缚，另一层在病毒之前就已经是怪物，那么'活下来'本身是不是已经成为一种道德污点？"

genre:
  primary: "末日 / 病毒灾难"
  secondary:
    - "心理恐怖"
    - "社会寓言（群像）"
  conventions_followed:
    - "突发不明病原 + 全球同步沦陷（28 天后类）"
    - "感染者保留部分意识但失去边界（《Crossed》《L 仔尸》谱系 —— 非纯丧尸）"
    - "幸存者小队的人性试炼"
  conventions_subverted:
    - "感染者会进化（自残嘴部隐藏、避电、伪装尸体埋伏、拿枪 / 火箭筒 / 攻坚协作）—— 不是纯反射性丧尸"
    - "病毒不是唯一的反派；人性之恶被分离为独立威胁谱系（吴先生型反社会 / 廖振宇型名利 / 副院长型净化执念 / 陶亦仁型邪教感召 / 罗凯伯型嗜死富豪 / 对楼网民型操纵）"
    - "'保持理性 + 利他' 在本系列中往往导致更惨结局 —— 理性者（杨和修、蔡宇、吴志强）下场最坏；'不正常者'（杨中旭丧尸逃生幻想成瘾）反而活到最后"
    - "POV 实验：日记体 / 第二人称失明 / 录音机嵌套三层 / 群像并行 / 不可靠叙述双人格隐藏 / 录音笔遗书框架 / 嵌套幻想元翻转"
  audience_expectations:
    - "读者期待并发 / 多 POV / 各篇独立但拼图式"
    - "读者期待残忍而具体的暴力细节描写（莫千回标志性的'游戏化嗜虐'写法）"
    - "读者期待跨篇人物再现的 easter egg（如罗允、吴先生 / 假罗允、林东青、陈雨琪 + 陆小虎、盲女、创世军、黄金大厦门卫老张）"

# === 主控思想（13 篇读完后收敛）===

controlling_idea:
  converged: |
    收敛说明（兑现 v0.3 的 pick_after_full_read）：
    读完全部 13 篇后，三个候选不是"三选一"，而是【同一主控思想的三个面】——
    candidate_a 是脊椎（人性之恶的本体论命题：恶独立于病毒、先于病毒、拒绝沦为病毒），
    candidate_b 是这个恶在末日里的运行机制（道德 / 常态在筛选中成为劣势，让恶 / 异常者存活），
    candidate_c 是它最锋利的情感引擎（披着善意 / 希望 / 爱外衣的恶 / 执念，因为给人希望而比赤裸恶意更致命）。
  main_statement: |
    "在崩坏的秩序下，人性之恶比病毒更可怕——病毒只是把那些早已腐烂的内核暴露在阳光下（脊椎 a）；
    正因为如此，末日的筛选机制会反向运作：道德感、理性与常态成为生存的负累，活下来的往往不是好人（机制 b）；
    而最致命的从来不是赤裸的恶意，而是那些披着善意、希望与爱的外衣的恶与执念——
    它们给你一个继续走下去的理由，再用这个理由把你毁掉（情感引擎 c）。"
  candidate_a:
    role: "主脊椎（人性之恶比病毒更可怕——恶独立于、先于病毒）"
    statement: "在崩坏的秩序下，人性之恶比病毒更可怕 —— 病毒只是把那些早已腐烂的内核暴露在阳光下。"
    strongest_support:
      - "狂人日志：吴先生病毒前就在猎杀 + 主动拒绝感染（'变成弱智没意思' line 85）+ '从出生起就没有同情心'（line 273）—— 系列最强证据（《狂人日志》line 85 / 273 / 287）"
      - "恶：吴先生（纯粹型）vs 廖振宇（表演型）双恶对位，吴先生掌握'记住谁'的裁判权 + 役使感染者行刑（《恶》line 329-361）"
      - "医院：石浩洋把'避难所'经营成可慢慢玩弄的屠宰场 + 培养林东青为'精神延续'（《医院》line 605-633）"
      - "黄金国：罗凯伯末日前就买各国封存虐杀录像 + 靠看他人之死获取濒死快感（《黄金国》line 261 / 745）"
      - "套中人：对楼网民弹弓引感染者杀父子 + 702 见死不救 + 母亲家暴 = 三种独立于病毒的人性之恶（《套中人》line 527）"
      - "精神病院：副院长'让精神病人永远死在这里'的净化执念屠夫（《精神病院》line 311-313）"
  candidate_b:
    role: "生存机制层（活下来的未必是好人，道德 / 理性 / 常态拖累生存）"
    statement: "真正能在末日里活下来的，未必是好人 —— 道德感往往拖累生存。"
    strongest_support:
      - "学校：「我」用最人性的'怕疼'理由完成最反人性的自感染（《学校》line 217-219）"
      - "地铁：最理性最强最有道德感最爱家人的杨和修恰因这四重'好人'属性冒最大险、最快沦陷成反向猎手（《地铁》line 329-345）"
      - "精神病院：被判定'不正常'的杨中旭恰因丧尸逃生幻想成瘾活到最后；理性的吴志强被诬陷围殴（《精神病院》line 89 / 《医院》line 345-353）"
      - "他的故事：'拧巴'（当断不断）的'我'一次次靠犹豫活下来，纯粹的汪华依被消耗殆尽（《他的故事》line 807）"
      - "副支撑：恶 / 医院——蔡宇 / 老魏 / 吴志强 / 蔡大妈等好人下场最坏（《恶》line 263 / 《医院》line 345）"
  candidate_c:
    role: "情感引擎层（他者善意 / 希望 / 爱比恶意更危险，因为给你希望）"
    statement: "他者的善意可能比恶意更危险 —— 因为它给你希望，让你相信下一刻可以更好。"
    strongest_support:
      - "燃烧：罗允'救人但不强迫'实质把'活下来'变成对死者的偿还债务；周全的爱感染后异化为'把你心脏缝在胸口'（《燃烧》line 167-183）"
      - "死亡奔赴：'奔赴女友'的执念既是支柱也是把岳子安拖向死亡的诱饵，最深的爱异化为最恶心的占有（《死亡奔赴》line 479）"
      - "反面补充 51人：陶亦仁'天上烟花'式的他者感召把人带向死亡奔赴（创世军）—— 善意 / 信念把人引向集体赴死（《51人》line 169 / 181）"
      - "副支撑 狂人日志：吴先生把'救人'反转为'毁灭剧本'——全系列最致命的'善意'（《狂人日志》line 277）"

central_value_pair:
  primary: "活着 / 死亡"
  secondary:
    - "人性 / 兽性（感染前后的边界；'感染者 = 人的极化态'，套中人 line 617-621 本我/自我/超我解读）"
    - "希望 / 绝望（每一篇都有一处'希望落空'的核心节拍；戈多式避难所符号逐级升格）"
    - "信任 / 背叛（小队内部背叛比外部追击更致命；'假罗允'盗用信任符号）"
    - "记住 / 被遗忘（廖振宇 / 吴先生执着名声；51人/死亡奔赴/不详把'被记住'做成存在性命题）"
    - "记录 / 中止（日记体 / 录音机 / 录音笔 / 故事笔记本的存续 = 文明的存续；POV 转交 = 文学层面的'传火'）"

target_audience:
  primary: "末日灾难 + 心理恐怖 + 群像文学的读者；接受残忍细节描写的成年读者"
  secondary: "B 级丧尸片爱好者、反英雄叙事爱好者"

emotional_charge:
  - "压迫性恐惧（不是惊吓而是处境恶化）"
  - "反讽性悲哀（好的选择反而带来更糟结局）"
  - "黑色幽默（'99 度生命汁水'、博德之门吟游诗人玩笑、踩井盖敲三下等微小喜剧瞬间）"
  - "存在性绝望（'记住我'欲望与'记不住任何人'现实的对照；51人/不详的'被遗忘'命题）"
  - "余韵式见证（日记本 / 转达遗言 / 读死者遗书 / 录音笔托付 / 利他传火链 —— 文学层面的'传火'：读者作为延迟见证者）"

# === 人类反派谱系（病毒型 vs 反社会人格型 二分的扩展）===

human_antagonist_typology:
  note: |
    v0.3 的'病毒型 vs 反社会人格型'二分在 13 篇读完后扩成完整的【人类反派谱系】——
    病毒型（感染者）仍是 layer_1 外部威胁，但真正承载 controlling_idea candidate_a 的是以下 6 型清醒人类反派。
    它们的共性：均独立于病毒（恶先于或外于感染），且多数明确拒绝 / 不会被感染。
  wu_xiansheng_type:
    label: "吴先生型 —— 反社会人格 / 录音机 / 伪装罗允诱杀（知对错仍作恶）"
    core: "天生无同情心、为乐趣而杀、不需名声、能伪装成任何幸存者；'我可以是任何人'伪装机制 + 带孩子诱杀模板"
    representatives:
      - "吴先生（狂人日志 line 299 / 恶 line 333-361）"
      - "石浩洋（医院 line 605-633，录音机杀手，与吴先生 reconciliation #1 待定）"
      - "假罗允（不详 line 461-475，冒名罗允 + 带小孩小林）"
    moral_cognition: "'知道什么是对什么是错'（恶 line 355）—— 比纯无意识恶高一档"
  liao_zhenyu_type:
    label: "廖振宇型 —— 名利 / 表演型（求被记住，欲望抄国外纪录片 / 开膛手杰克）"
    core: "为'被全世界记住'而杀、必录像必留名、模仿境外名案；恶的通货膨胀让其'特别'贬值"
    representatives:
      - "廖振宇（恶 line 5-35 / 83）—— 被吴先生当面判为'比上不足比下也差点、忘了就忘了'（line 355）"
  fu_yuanzhang_type:
    label: "副院长型 —— 净化执念（受害者变施害者，以'让该死的人去死'为名的偏执屠夫）"
    core: "家人被装病脱罪的精神病患灭门 → 把医院打造成'让精神病人永远死在这里'的私人监狱；灾中用门禁 / 广播 / 黑钢板主动猎杀想逃者"
    representatives:
      - "副院长（精神病院 line 41 / 241 / 287 / 311-313）"
  tao_yiren_type:
    label: "陶亦仁型 —— 死亡奔赴邪教感召者（= 李鸾第二人格）"
    core: "'死亡是路障，跨过去才能继续'的死亡奔赴哲学；用电台吸纳幸存者、无名编号制、用人命考验新人，把幸存者组织成赴死的创世军"
    representatives:
