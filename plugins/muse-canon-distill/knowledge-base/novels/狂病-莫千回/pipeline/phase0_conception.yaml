# === 已解决问题（v0.3 open_questions 收口）===

resolved_questions:
  - id: "huangjinguo_siwangbenfu_canon"
    question: "黄金国 / 死亡奔赴 是否与狂病同框，还是世界观平行？"
    resolution: "全部 13 篇均判定为 shared_canon / canon-core（同一狂病宇宙）。死亡奔赴 / 黄金国 / 51人 / 套中人 / 不详 / 他的故事 / 精神病院的 _meta.world_alignment 逐篇给出病征 + 时序 + 跨篇人物证据链。黄金国彭罗斯'共形循环宇宙'仅属罗凯伯个人玄学动机装饰，不构成新病原，不动摇 shared_canon。"
    anchor: "各篇 phase3 _meta.world_alignment"
  - id: "airport_hospital_truth"
    question: "'机场旁医院' 是真避难所还是另一个陷阱？"
    resolution: "伪避难所。'军方驻扎'系以讹传讹（亲历者刘医生证伪），实际只一支约十人小队来援后全灭、机场本身已内乱沦陷；医院仅距军民两用机场近、收容了一支覆灭小队残骸。全系列'最后希望符号'第一次被正面祛魅。"
    anchor: "医院 line 79-129 / 103"
  - id: "hann_foundation_role"
    question: "汉恩基金精神卫生中心的世界观角色？"
    resolution: "陷阱型反派据点。私立精神病院用'陪你重新认识自己'广告话术包装收容；副院长（家人被装病脱罪的精神病患灭门）打造'让精神病人永远待在 / 死在这里'的私人监狱，灾中用电子门禁 / 广播 / 黑钢板主动猎杀想逃者 = 第三类人类反派（净化执念型）。与机场旁医院构成对位：airport_hospital 是'传闻中从不抵达的避难所'，汉恩基金是'已抵达但内里是地狱的避难所'，共同坐实'本系列没有制度性救赎'。"
    anchor: "精神病院 line 5 / 41 / 311-313"
  - id: "chen_yuqi_lu_xiaohu_reappear"
    question: "陈雨琪、陆小虎是否会在其他篇章再现？"
    resolution: "再现于《医院》。陈雨琪被感染的侯楚霖虐杀开膛（医院 line 527），陆小虎扑侯楚霖被咬同归于尽（医院 line 531-537）；与《地铁》'陈雨琪→陆小虎视角反转'线呼应（时序疑为《地铁》结局后辗转至医院，待精确核对）。"
    anchor: "地铁 line 393 / 医院 line 527 / 531-537"
  - id: "luoyun_save_principle_motive"
    question: "罗允'救人但不强迫'原则的底层动机？是否会被打破？"
    resolution: "底层动机在黄金国 line 825 揭示：'惧怕的是死亡的过程而非死亡本身；拯救世界能否成功不重要，只是支撑奔向死亡的理由'。原则未被打破，但在不同篇呈现了梯度变体：燃烧（救活 + 转达遗言）→ 死亡奔赴（来晚没救到 + 读死者遗书 / 退到见证）→ 黄金国（从拾日记者升级为故事口述记录源）。"
    anchor: "黄金国 line 825 / 燃烧 line 177-183 / 死亡奔赴 line 483-503"
  - id: "trap_layout_same_mother"
    question: "《学校》一楼锁链 vs 《恶》廖振宇 / 吴先生系统性诱杀 是否为同一种反派人类布局？"
    resolution: "同'人类把同类喂给感染者'母题，但不同形态：学校一楼楼梯铁门外锁链 = 静态空间陷阱（把楼改造成只进不出的屠宰场）；恶·医院诱杀 = 动态诱导布局（麻醉挑断手脚尖 + 篝火烟雾信号 / 给孩子脸画箭头引感染者 / 背包夹带感染者碎肉投毒 + 开二楼铁门）。精神病院黑钢板封死同属静态陷阱谱系。"
    anchor: "学校 line 191 / 恶 line 343-345 / 医院 line 555 / 621 / 精神病院 line 287"

