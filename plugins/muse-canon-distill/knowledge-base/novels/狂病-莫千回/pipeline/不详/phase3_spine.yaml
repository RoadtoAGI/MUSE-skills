_meta:
  version: "1.0"
  chapter: "不详"
  source: "novels/狂病-莫千回/不详.md"
  word_count_approx: 36100
  validated_against_source: true
  world_alignment: "canon-core（狂病主线世界观内）"
  world_alignment_reason: |
    本篇与狂病主线强绑定，证据链：
    (1) 时间线锚定一致 —— 爆发首日校园跑操变疯子（line 19-21）= phase1 T1_morning_4_16 城市级群殴爆发同源
    (2) 病征一致 —— 狂笑 / 嗜虐 / 痛觉缺失 / 性嗜虐云雨 / 辱骂语言 / 颅脑一击毙命（line 21, 107-109, 247）全部命中 phase1 mad_disease_rules
    (3) 进化战术一致 —— 警服感染者靠痕迹追踪（line 237）= phase1 late_phase 战术性进化；母猪发情粉骗感染者（line 245, 557-559）= 气味识别假说的反向利用
    (4) 物资体系一致 —— 蓝牙音响诱敌（line 153-159）/ 手机离线地图（line 153）/ 锂电池陷阱（line 231）/ 抗生素 + 宠物罐头（line 161）全部与 phase1 material_rules 同源
    (5) 跨篇人物硬命中 —— "自称罗允 + 带小孩小林"的假罗允猎杀沈曾祺小队（line 461-475）= phase0 cross_part_links 的"吴先生（假罗允）+ 林东青（吴先生徒弟）"对位，本篇是该反派对位线的又一受害端证据
    (6) 免疫者 / 无症状感染者之辩（line 257）= phase1 exceptions_and_edge_cases 直接落地
    唯一独有变奏：本篇是全系列首次把"狂病感染者"以外再造第三种存在 —— 陶亦仁用"被自己进化过的血液"主动制造的"创世军感染者"（line 541-545），但最终被证明与普通感染者无异（line 555），仍在 canon 病理框架内，不构成世界观分叉。
  form_note: |
    第一人称"我"（李鸾）回溯性自白体 —— 全篇用"现在的我回头看"的未来视角追述（line 15 "此时的我……却是全人类的希望" / line 42 "如果现在的我能穿越回去"）。
    最大的形式特征是"不可靠叙述者 + 双人格隐藏":叙述者"我"把自己的分裂人格"陶亦仁"当作独立同伴叙述了全篇五分之四，
    直到 line 501-525 王晨轩问"陶亦仁在哪"+ "你是我"才向读者揭穿 —— 陶亦仁是李鸾 10 岁裂脑术（偏执体切割，line 11）后衍生的强势人格。
    《搏击俱乐部》是篇内明喻锚点（line 323 蓝光碟 / 333 "向理想狂奔的团队" / 525 "第二人格" / 531 女主角对位王晨轩）。

# === 脊椎 ===

spine:
  protagonist: "'我'（李鸾，前大学维修工，狂病免疫者 / 无症状感染者身份未定，分裂人格宿主）"
  spine_mode: "information"
  spine_mode_reason: |
    本篇组织力不是"我"对某个外部目标的欲望推进（desire），而是"我是谁 / 陶亦仁是谁 / 我到底是不是灾星"这一信息层的逐步揭示与最终重构。
    全篇真正的高潮不是动作（杀感染者），而是认知崩塌:"你是我"（line 523）—— 读者与"我"同步发现陶亦仁从不存在。
    desire 线（拯救人类 / 找到避难所 / 给沈曾祺报仇）全部是陶亦仁人格代为承载的伪目标，"我"自己始终是被动漂流（line 295 "可是我却不想去哪里了"）。
  desire_object: "（表层，由陶亦仁人格承载）创造'创世军'、反击感染者、拯救人类、重建新世界（line 333-337, 349, 541）"
  shadow_desire: |
    "我"真正要的不是拯救人类，是"停止毁灭身边的人" ——
    从出生克死母亲（line 9）、裂脑术败光家产克走老头（line 11-13, 437-441）、
    到吞噬掉双胞胎另一个胎儿的亲戚传言（line 443），
    "我"被植入了"灾星 / 暴风眼"的自我认同（line 7, 13, 563）。
    所以全篇的 shadow_desire 是:确认自己究竟是"全人类的希望"还是"应被清除的 bug"——
    结局选择后者（line 563 "我们才是应该被清除的存在"），用自我感染 + 引感染者吃掉自己来"摧毁暴风本身"（line 567）。
  conscious_vs_unconscious:
    conscious: "跟着陶亦仁的计划走 / 组建创世军 / 为沈曾祺报仇 / 在喜欢的人（王晨轩）面前有面子（line 489-491）"
    unconscious: |
      "我"始终在回避一个已知的真相 ——
      陶亦仁说"你是知道所有事的，只是不敢去面对"（line 515, 519）。
      "我"潜意识里早知道陶亦仁是自己（被队伍抛弃第一晚就用掐脖子方式"杀死"过陶亦仁，line 515），
      早知道梦游中的杀戮是自己干的（line 543 肚子伤疤），
      早知道自己不是救世主而是灾星 ——
      所有 desire 都是为了不去面对这个 unconscious 真相而搭建的逃避结构。

# === 激励事件 ===

inciting_incident:
  event: "校园跑操学生集体变成嗜血疯子 + '我'在阶梯教室 / 厕所连续目睹两支幸存者小队覆灭 + 被咬后陷入昏迷却没有感染地醒来"
  source_anchor: "line 19-67"
  type: "causal"
  delay_from_opening_chars_approx: 2000
  function: |
    狂病爆发把"我"从"一辈子修设施的废人"（line 17）抛进末日 ——
    但本篇的激励事件有双重功能:
    (1) 外层:确立"我"是被咬却不感染（line 45-67）= 免疫者 / 无症状感染者身份悬念，全篇 information 脊椎的起点
    (2) 内层:昏迷中闪回"小男孩把蓝色文具盒塞进我嘴里"（line 65）= 陶亦仁人格的首次潜入式登场（伪装成"儿时朋友"的记忆）
    与《学校》《燃烧》的标准末日开篇（早晨 + 离开避难所）不同，本篇开篇即让叙述者"我"在自白里把"灾星"身份前置（line 5-16），把信息悬念埋在最前。

# === 戏剧问题 ===

dramatic_question:
  main: "'我'（李鸾）到底是不是灾星 —— 是'全人类的希望'（免疫者救世主），还是'应被清除的 bug'（注定摧毁身边每个人的暴风眼）？"
  subtext: |
    在一个连"好人 / 坏人"边界都被病毒抹掉的世界，
    一个连自己人格都分裂、连自己做过什么都记不清的人，
    有没有资格谈"拯救"?
    更深一层:当"拯救人类"的执念（陶亦仁）和"我会毁掉所有人"的宿命（李鸾）是同一个大脑的两半时,
    "救世"与"灭世"是不是从一开始就是同一个动作?
  payoff: |
    答案是双重否定的悖论:
    "我"既不是救世主（免疫者血液造不出新人类,创世军成员被陶亦仁血液感染后与普通感染者无异 line 555）,
    也不能简单算作灾星受害者 —— 因为毁掉身边人的"陶亦仁"就是"我"自己。
    最终"我"接受"我们才是应该被清除的存在"（line 563）,
    用母猪发情粉伪装 + 命令创世军吃掉自己（line 557-561）,
    用"摧毁暴风本身"来回答这个问题 —— 即:灾星的唯一救赎是自我毁灭。

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: "狂病感染者群（跑操变疯 / 阿鲁巴掰腿 / 篮筐塞人头 / 操场焚尸祭坛 / 云雨自残 / 警服感染者痕迹追踪 line 21-109, 237-249）"
    layer_2_environment: "崩坏的城市 → 山林 → 公路绞肉机 → 废弃服务站 / 隧道 / 影音店（line 121-131, 299, 317, 341）"
    layer_3_evolution: "警服感染者可靠痕迹追踪、连续数周追杀（line 237）= phase1 late_phase 战术进化落地"
  interpersonal:
    layer_1: "沈曾祺小队在得知'我'是病毒携带者后集体抛弃'我'（line 261-273）—— '理性 + 自保'压倒'人情'的小队背叛"
    layer_2: "假罗允（吴先生型反派）+ 小林 联手猎杀沈曾祺小队:沈曾祺挑断脚筋砸烂双手喂感染者 / 夏伟毅关进疯子房 / 佩文被强暴 + 头颅放蓝牙音响上 / 亦凡剖腹（line 461-475）"
    layer_3: "王晨轩怀着'罗允会被你们解决'的信任来投奔'我',却被'我'（在不自知状态下）亲手从背后捅穿心脏（line 503-509）"
  internal:
    layer_1: "'灾星 / 暴风眼'自我认同（line 7, 13, 563）"
    layer_2: "对自身人格分裂真相的回避机制（line 515 '你是知道所有事的,只是不敢去面对'）"
    layer_3: |
      陶亦仁人格 = 最深层的内部对抗力量。
      他不是同伴也不是敌人,是"我"为了承载"主动、果决、拯救人类的执念"而分裂出的强势人格 ——
      "我"越想停下毁灭,陶亦仁越要"发动汽车不能熄火"（line 403, 535）。
      内部冲突的终极形态是 line 565:"我用左手抓住疯狂挣扎的右手,用左脚疯狂踢踹想要逃离的右脚" —— 同一具身体两个人格的肉搏。
  societal:
    - "公权力全面沦陷:军队互相变感染者、机械狗 / 无人机被感染者操控的传闻（line 141-143）= phase1 T2 军方内乱同源"
    - "免疫者 / 无症状感染者的制度性救赎不存在:'除非运气爆炸遇到正常运作的研究部门,否则我只是定时炸弹'（line 261）"
    - "蓝牙广播电台 = 末日里的'伪社会重建' —— 陶亦仁用它把幸存者诱来当创世军血液实验体（line 391-393）"

# === Arc 框架 ===

arc_framework:
  total_arcs: 6
  notes: |
    与《燃烧》的"连续受难型"（每 Arc 死一人 / 希望-收回循环）不同,
    《不详》是"渐进式自我揭示型"结构 —— 6 个 Arc 是"我"沿着三支幸存者队伍 + 一支自建队伍漂流,
    每个 Arc 都在为最终的"你是我"认知崩塌累积信息伏笔(文具盒 / 梦游 / 肚子伤疤 / 陶亦仁翻窗习惯 / 创世军只忠于陶亦仁)。
    Arc 数量 = "我"经历的'群体单位'数(覆灭的校园两队 → 沈曾祺队 → 梦游独行 → 创世军 → 王晨轩重逢崩塌)。
    结构上是"伪英雄成长线"(从废人到救世军缔造者)套了一个"不可靠叙述揭穿"的反转外壳。

  arc_1_campus_apocalypse:
    label: "校园爆发 + 两支幸存者队伍覆灭 + '我'被咬不感染 + 陶亦仁登场"
    value_starting: "废人维修工的麻木日常（line 17）"
    value_ending: "末日幸存 + 免疫悬念建立 + 陶亦仁'救我出来'（认知层:'我'以为遇到儿时朋友）"
    climax_event: "厕所小队覆灭 + '我'被咬陷入昏迷 + 闪回蓝色文具盒 → 醒来浑身血却没感染 + 陶亦仁拍肩'醒了兄弟'（line 63-73）"
    source_anchor: "line 17-119"
    function: |
      建立免疫悬念（information 脊椎起点）+ 陶亦仁人格的伪装登场。
      关键伏笔:陶亦仁"知道沃尔沃车钥匙 / 是导师的车"（line 83-85）—— 实为李鸾自己交接工作时的记忆,人格共享同一大脑信息。
      篇名"不详"在此初次落地:"我"是身份不详的免疫者,也是亲戚口中"不祥的灾星"。

  arc_2_shen_team:
    label: "加入沈曾祺小队 + 末日生存技能教学 + 免疫者身份暴露 + 被集体抛弃"
    value_starting: "免疫悬念 + 漂流求生（陶亦仁建议去首都找保障）"
    value_ending: "归属落空（被小队抛弃）+ 灾星认同被坐实（'我'成了队伍的定时炸弹）"
    climax_event: "陶亦仁酒后失言'他曾经被咬过现在和正常人一样'（line 255）→ 全队沉默 → 沈曾祺康复后清晨集体撤离,只留物资（line 273）"
    source_anchor: "line 119-295"
    function: |
      这是全篇唯一一段"近似正常的人类小队生活"——沈曾祺（前消防员）= 全系列"最适合当领袖的人才"（line 151）,
      蓝牙音响诱敌 / 母猪发情粉 / 锂电池陷阱等 canon 物资体系在此密集落地（line 153-245）。
      暴露 + 抛弃完成"灾星"宿命的第一次坐实:"我"没失去什么 → 恰恰因为身边人都先离开了"我"。
      关键伏笔:王晨轩对"我"的好感（line 199, 265）+ 母猪发情粉的功能预演（line 245 骗感染者吃毒饵）。

  arc_3_sleepwalk:
    label: "独自漂流 + 梦游症 + 梦境与现实混淆 + 影音店重逢陶亦仁"
    value_starting: "前所未有的孤独（line 295）"
    value_ending: "重新被'陶亦仁'接管方向（'创造向理想狂奔的团队'）"
    climax_event: "影音店醒来捡到《搏击俱乐部》蓝光碟 → 陶亦仁'醒了兄弟'再现 + '梦游时不会引起感染者注意,是我一直在引导你'（line 317-339）"
    source_anchor: "line 295-339"
    function: |
      全篇最大的明喻锚点埋设:《搏击俱乐部》蓝光碟（line 323）—— 为 line 525 "你是我"的揭穿提前给读者一把钥匙。
      梦游 = 双人格的物理外化:"陶亦仁"人格在"我"失去意识时接管身体行动（解释了为何梦游不被感染者注意 —— 因为身体里本就带毒）。
      伏笔密集:梦里"小孩挥手告别黑发"（line 299）+ "梦里能闻到味道感到疼"（line 309）+ "肚子伤疤以为是梦游留下"（line 543 回收）。

  arc_4_genesis_army_rise:
    label: "创世军从 3 人到 50 人 + 陶亦仁的极权化 + 首次正面剿杀感染者"
    value_starting: "被陶亦仁重新赋予目标（拯救人类 / 创造新世界）"
    value_ending: "伪英雄叙事顶点（50 人规模 + '我们真的可以拯救世界'）+ 极权阴影（成员只忠于陶亦仁、放弃姓名、'创造'手势）"
    climax_event: "创世军 30 人 vs 十余感染者首次正面剿杀,陶亦仁压住所有人到感染者扑面才下令,以碾压取胜代价 5 死（line 415-431）"
    source_anchor: "line 339-435"
    function: |
      "伪英雄成长线"的高潮 —— 表面是废人逆袭成救世军缔造者。
      但每一步都埋着揭穿伏笔:成员"只忠于长官陶亦仁"（line 489）/ "除陶长官外所有人都没有名字"（line 489）/
      "只有我和陶亦仁不需要做创造手势"（line 387）/ 陶亦仁总从窗户翻出去（line 453, 同 line 13 老头爬窗 + line 29 "我"翻窗）。
      读者在此可隐约察觉:这支队伍的唯一真领袖是陶亦仁,"我"只是挂名搭档 —— 因为陶亦仁才是"我"的主导人格。
      母猪发情粉再次入场（line 387 储备）为终局伏笔。

  arc_5_wang_reunion_and_luo_revelation:
    label: "王晨轩投奔 + 沈曾祺小队覆灭真相（假罗允 + 小林）+ '我'亲手捅死王晨轩"
    value_starting: "伪英雄顶点 + 王晨轩奇迹重逢（'我'差点哭出来）"
    value_ending: "彻底崩塌（王晨轩死在'我'手里 + '陶亦仁在哪'戳穿幻觉）"
    climax_event: "王晨轩在陶亦仁'拥抱'中疑问'陶亦仁在哪啊'（line 501）→ '我'眩晕中发现王晨轩后背被自己插了刀（line 503）"
    source_anchor: "line 435-513"
    function: |
      跨篇反派线（假罗允 = 吴先生型 + 小林 = 林东青型）通过王晨轩转述完整入场（line 461-475）——
      本篇是该反派对位线的"受害端"取证:沈曾祺 / 夏伟毅 / 佩文 / 亦凡全灭。
      情感反转:王晨轩是"我"唯一爱的人,也是《搏击俱乐部》女主角对位（line 531）——
      她的存在威胁陶亦仁人格的计划,所以"我"（陶亦仁人格主导身体时）亲手杀了她。
      "陶亦仁在哪"= 全篇 information 脊椎的引爆扳机:王晨轩看不到陶亦仁,因为陶亦仁不存在。

  arc_6_you_are_me_and_self_destruction:
    label: "'你是我'揭穿 + 创世军血液感染计划 + '我'自我感染引感染者吃掉自己"
    value_starting: "崩塌（杀了所爱之人 + 幻觉戳穿）"
    value_ending: "自我清除（接受'我们是应被清除的 bug' + 自燃式自毁:用母猪发情粉引创世军吃掉自己）"
    climax_event: "'你是我……你是我的第二人格'（line 523-525）→ 陶亦仁揭露用'我'进化过的血液造新人类（line 541）→ '我'倒发情粉 + 咬断自己舌头 + 命令创世军吃掉自己（line 557-567）"
    source_anchor: "line 513-567"
    function: |
      全篇 main climax —— information 脊椎完全揭示 + 双人格肉搏 + 自毁收笔。
      "陶亦仁张嘴舌头掉出来 = 我咬掉自己的舌头"（line 561）= 双人格同体的终极物证。
      "左手抓右手、左脚踢右脚"（line 565）= 麦基式"压力下选择揭示性格"的肉体化:两个人格争夺同一具身体的控制权。
      自毁不是绝望,是"我"对 dramatic_question 的最终回答:灾星无法被拯救只能被清除,而清除者只能是灾星自己。

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "'你是我'人格揭穿 + '我'用母猪发情粉伪装 + 咬断自己舌头 + 命令创世军感染者吃掉自己 + 左手制右手左脚制右脚强压逃跑冲动"
    source_anchor: "line 523-567"
    why_climax: |
      全篇所有价值层在此同时引爆:
      - information 层:"陶亦仁是谁"的悬念在"你是我"（line 523）彻底揭示,读者回溯发现全篇五分之四是不可靠叙述
      - 身份层:"我是救世主还是灾星"在"我们才是应该被清除的存在"（line 563）给出否定式答案
      - 人格层:两个人格争夺同一具身体的肉搏（line 565）—— 弱势的"李鸾"人格第一次战胜强势的"陶亦仁"人格,用自毁夺回控制权
      - 病理层:创世军被"进化血液"感染后与普通感染者无异（line 555）—— 证伪了陶亦仁"创造新人类"的妄想,呼应 phase0 "病毒只是把腐烂内核暴露在阳光下"

  closing_reversal:
    event: "'既然我注定将摧毁所有我身边的人,那么充满不祥的暴风,应该也可以摧毁我吧'（line 567）"
    source_anchor: "line 563-567"
    function: |
      不是 happy ending 也不是单纯 hopeless ending —— 是"灾星的自我了断式救赎"。
      篇名"不详"在此完成双重兑现:
      (1) 不祥 —— "我"是充满不祥的暴风眼,卷来身边每个人然后摧毁（line 7, 563）
      (2) 不详（身份不明）—— "我"到底是免疫者还是无症状感染者从未被确认,这个"不详"本身就是宿命:
          一个连自己是谁都不确定的人,最后只能确定自己"应该被清除"。
      与《燃烧》"活下来 = 偿还"的反英雄余韵互为镜像:《燃烧》的盲女被强行救活作为债务,
      《不详》的李鸾主动求死作为对"毁灭身边人"宿命的了断。

  controlling_idea_for_this_chapter: |
    "在末日,真正的怪物不是病毒,也不是别人 ——
    是你自己心里那个'为了拯救世界什么都做得出'的人格,
    而当你终于看清他就是你时,唯一的救赎是亲手清除你自己。"
    （主映射全系列 candidate_a:"人性之恶比病毒更可怕 —— 病毒只是把早已腐烂的内核暴露在阳光下"
     —— 陶亦仁人格 = 反社会型缔造者,与吴先生 / 廖振宇'用末日做名利舞台'同构,但本篇把这个恶内化为主角自身的分裂人格;
     副映射 candidate_c:"他者的善意可能比恶意更危险" —— 陶亦仁数次救"我"+ 给"我"目标,最终把"我"和所有人推向自毁。）

# === 主题钩 ===

theme_hooks:
  - "不可靠叙述者 + 双人格隐藏 —— 全篇五分之四把分裂人格当独立同伴叙述,'你是我'（line 523）回溯重构整篇"
  - "《搏击俱乐部》明喻框架 —— 蓝光碟（line 323）/ 第二人格（line 525）/ 女主角威胁计划（line 531）三处锚定"
  - "篇名'不详'双关:不祥（灾星暴风眼 line 7, 563）+ 不详（免疫者 / 无症状感染者身份未定 line 257）"
  - "裂脑术（偏执体切割 line 11）作为人格分裂的医学起源 —— 把'第二人格'落到 canon 内可信的生理基础"
  - "伪英雄成长线的反讽:废人 → 救世军缔造者 → '创世军感染者'与普通感染者无异（line 555）—— 救世即灭世"
  - "极权化的'创造'手势 + 放弃姓名（line 379, 387）—— '没有人会记住你'呼应全系列'记住 / 被遗忘'价值对"
  - "自我感染 + 引感染者吃掉自己（line 557-561）—— 与《学校》'我'吞断指自感染 / 《燃烧》周全自燃同源的反英雄自毁谱系"

# === 跨篇钩点 ===

cross_chapter_hooks:
  recurring_characters_anchored_here:
    - "假罗允（吴先生型反派）:'年纪大的自称罗允'+ 带小孩小林,从加入沈曾祺队第一刻就计划毁掉一切,强暴佩文 / 挑断沈曾祺脚筋砸烂双手喂感染者 / 夏伟毅关疯子房 / 亦凡剖腹（line 461-475）—— 与 phase0 cross_part_links '吴先生（假罗允）'硬命中,本篇是该反派的'冒名罗允'手法 + 受害端取证"
    - "小林（林东青型反派）:假罗允'路上救的孩子视作己出',实为同谋,趁亦凡不备一刀插小腿 + 给王晨轩注射针管（line 463-467）—— 与 phase0 '林东青（吴先生徒弟）'对位,建议跨篇登记 slug: lin-dongqing（需后续篇章交叉确认是否同一人）"
    - "罗允（真）:本篇不出场,但'真罗允'的名号被反派冒用 —— 反向印证罗允（真）的'救人但不强迫 + 带孩子'招牌形象已成末日里被利用的'信任符号',与《燃烧》《学校》罗允（真）正面形象形成对位"
  worldbuilding_contributed:
    - "裂脑术（偏执体切割,治疗癫痫）+ 术后重度昏迷一年（line 11）—— 全系列首次为'人格分裂 / 第二人格'提供医学生理基础,扩展 phase1 心理层规则"
    - "母猪配种发情粉可让感染者停止互相攻击 / 把携带者认作同类（line 245 毒饵预演 + 557-559 实证）—— 气味识别假说（phase1 recognition_mechanics）的可操作化反向利用,首次具体化'用外源气味伪装成感染者'"
    - "免疫者 / 无症状感染者之辩 + '病毒携带者拥有感染他人能力'（line 257）—— phase1 exceptions_and_edge_cases 的篇内完整论证（夏伟毅口述）"
    - "蓝牙广播自制电台（调频发射器 + 蓝牙模块 + 锂电池 + 调频天线,line 391）+ '中转站解谜'防感染者机制（书 + 纸条第四段第十三字定位,line 393）—— 全系列首次出现'幸存者主动广播聚众'+ '用智力门槛筛感染者'"
    - "'创世军'= 全系列首个'幸存者邪教化武装组织',极权符号:统一黑衣 / 手套 / 面罩 / '创造'手势 / 放弃姓名 / 同名状入会门槛（line 379, 387, 395）"
    - "'用进化血液造第三种存在'妄想 + 其实与普通感染者无异（line 541-555）—— 呼应 phase0 conventions_subverted '感染者是人的极化态',证伪'人造新人类'路径"
  imagery_contributed:
    - "篮球场围网挂人头内脏 + 篮筐塞人头 + 打人头篮球（line 69）—— 与《燃烧》踢人头当足球（line 141）同源'球类化人头'意象"
    - "操场焚尸祭坛:火堆里尸体肚皮高温自爆 + 内脏飞溅到云雨虐杀的疯子身上（line 107）—— 与《燃烧》腐烂祭坛山头 / 烤乳猪式焚烧同源"
    - "图书馆喷泉水管插满苍白肿胀尸体的'人体喷泉'（line 105）—— 与《燃烧》/《地铁》'人当器物'意象同源"
    - "佩文头颅张嘴放在蓝牙音响上'仿佛真的在求救'（line 467）—— 把'诱敌求救声'意象推到尸体层的恐怖顶点"
    - "六楼把人当滑板垂直踩落 + 半截感染者刺耳笑声（line 95-97）—— 感染者'游戏化嗜虐'标志意象"
    - "左手抓右手 / 左脚踢右脚的双人格肉搏（line 565）—— 本篇独有的'同体二人'肢体意象"
  open_lores_to_be_resolved:
    - "本篇'假罗允 + 小林'与《恶》'吴先生伪装罗允'/ phase0 'shi-haoyang 疑与吴先生同源'是否同一组反派?小林是否就是林东青?需跨篇交叉确认"
    - "陶亦仁'用我进化过的血液造新人类'是纯妄想,还是 canon 里真存在'携带者血液有特殊性'的伏笔?（与免疫者血液能否当疫苗的悬念 line 257 相关）"
    - "李鸾的'梦游时不被感染者注意'—— 是因为身体携带病毒（无症状感染者实锤?）还是母猪发情粉外其它机制?本篇未完全闭合"
    - "本篇时间跨度极长（爆发首日 → 创世军 50 人,数月）—— 在全系列时序里属于'late_phase 之后'的较晚篇章,可作为时间轴尾端锚点"
