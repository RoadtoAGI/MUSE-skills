_meta:
  version: "1.0"
  chapter: "不详"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    6 Arc 渐进式自我揭示型结构 —— 每个 Arc 都在为终局'你是我'累积信息伏笔。
    与《燃烧》连续受难型不同:本篇是'伪英雄成长线'套'不可靠叙述揭穿'的反转外壳,
    序列设计上要同时标注'表层动作进展'与'隐藏的人格揭穿伏笔'两条线。

# === Arc 1: 校园爆发 + 两队覆灭 + 被咬不感染 + 陶亦仁登场 ===

arc_1:
  label: "校园爆发 + 两支幸存者队伍覆灭 + '我'被咬不感染 + 陶亦仁登场"
  source_anchor: "line 17-119"
  sequences:
    - seq_id: "1.1"
      label: "灾星自白 + 校园跑操变疯 + 阶梯教室第一队覆灭"
      source_anchor: "line 5-27"
      core_conflict: "废人'我'的麻木日常 vs 突如其来的人间炼狱"
      progression: |
        开篇自白:"我"是带给身边人不幸的灾星(克死母亲难产 / 裂脑术败光家产 / 老头爬窗坠亡,line 5-13)
        但"此时的我却是全人类的希望"(line 15)—— 未来视角悬念前置
        操场学生跑操越跑越快 → 集体变嗜血疯子(阿鲁巴掰腿撞栏杆,line 19-21)
        阶梯教室避难:陶金慧老师被剥皮 + 三学生惨死(夹头 / 啃脸变感染者 / 被逼吃自己肠子,line 23-25)
      seq_climax: "陶金慧被剥皮 + '我'翻窗逃出 —— 第一支幸存者队伍(存在时间最短)覆灭(line 27-29)"
      hidden_setup: "篇名'不详'初次落地:'灾星 / 不祥的人'(line 13)的自我认同被前置"

    - seq_id: "1.2"
      label: "厕所第二队覆灭 + 被咬选择 + '我'昏迷闪回文具盒"
      source_anchor: "line 29-67"
      core_conflict: "被咬后保持理智的人 vs 不敢冒险出去的死局 + 谁是免疫者的赌博"
      progression: |
        从窗沿挪到厕所,加入四学生小队(line 29-31)
        被咬者保持理智但不敢出去 → "我"提议"大家都感染最保险"被骂精神病(line 53)
        从未被咬的寸头男(浓痰溅眼)反而最先变异 → 屠杀同伴(line 55-59)
        "我"开始变异感:太阳穴剧痛 + 向后倒入虚浮(line 63)
        昏迷中闪回:模糊小男孩把蓝色文具盒塞进"我"嘴里(line 65)
      seq_climax: "'我'醒来浑身血腥却没感染 —— 免疫悬念建立 + 文具盒闪回(陶亦仁人格首次潜入式登场)"
      hidden_setup: "蓝色文具盒小男孩(line 65)= 陶亦仁人格的伪装记忆,为 arc_3 重逢 + arc_6 揭穿埋第一颗种子"

    - seq_id: "1.3"
      label: "陶亦仁'救我' + 沃尔沃车钥匙 + 潜行逃出校园"
      source_anchor: "line 67-119"
      core_conflict: "免疫者'我'的脆弱 vs 满校园感染者 + 信息共享之谜"
      progression: |
        陶亦仁拍肩'醒了兄弟' + 叫出"我"名字"李鸾" + 自称儿时同学(line 71-73)
        陶亦仁知道沃尔沃车 = 导师的车(line 83-85)—— "我"疑惑他怎么知道(实为同脑记忆)
        发现:感染者只靠视觉不靠嗅觉识别人类(line 81)= 躲好就隐身
        潜行穿过宿舍区(滑板踩人垂直坠落 line 95)+ 操场焚尸祭坛(line 107-109)
        到南门开车撞飞感染者离开校园(line 115-117)
      seq_climax: "驾车离校 + 陶亦仁定调'你是免疫者,是全人类的希望'(line 119)"
      hidden_setup: "陶亦仁知车钥匙(line 83)/ 翻窗习惯 —— 人格共享信息的第一处可疑伏笔"
  arc_progression_note: "Arc 1 完成两件事:外层建立免疫悬念(information 脊椎起点),内层让陶亦仁人格以'救命恩人 + 儿时朋友'伪装登场,读者与'我'一起被骗。"

# === Arc 2: 沈曾祺小队 + 生存教学 + 暴露 + 被抛弃 ===

arc_2:
  label: "加入沈曾祺小队 + 末日生存技能教学 + 免疫者身份暴露 + 被集体抛弃"
  source_anchor: "line 119-295"
  sequences:
    - seq_id: "2.1"
      label: "漂流弃车进山 + 加入沈曾祺队 + 隐瞒免疫身份"
      source_anchor: "line 119-149"
      core_conflict: "去首都找保障的计划 vs 公路绞肉机现实 + 信不信任新队友"
      progression: |
        冒险去医院 / 政府大楼全是地狱景象 → 弃车进深山(line 121-123)
        山坡上看公路堵死成绞肉机 → "我"准确预言下车逃命者引来感染者(line 127-129)
        遇沈曾祺五人队(三男两女)→ 陶亦仁主张坦诚,"我"主张隐瞒免疫身份(line 145)
        "我"自我介绍时队员眼神怪怪的(line 147)—— 伏笔:他们其实看不到陶亦仁?
      seq_climax: "加入沈曾祺队 + '我'坚持隐瞒免疫者身份(line 145-149)"
      hidden_setup: "队员看'我'眼神怪(line 147)+ 全程只有'我'磕巴自我介绍 —— 陶亦仁不存在的早期伏笔"

    - seq_id: "2.2"
      label: "蓝牙音响诱敌 + 母猪发情粉 + 沈曾祺生存哲学"
      source_anchor: "line 149-219"
      core_conflict: "鲁莽硬刚 vs 沈曾祺式周密计划(各司其职 / 缺一不可)"
      progression: |
        沈曾祺队储备电池 / 太阳能充电宝(line 151)—— 反常识物资观
        蓝牙音响多点诱敌系统(佩文录的求救声 / 信号覆盖启动 / 三点放哨,line 153-173)
        搜刮兽医站抗生素 + 宠物罐头(避开医院超市陷阱)+ 母猪配种发情粉(line 161-165)
        夜话各自经历:夏伟毅特斯拉自动停车 / 沈曾祺前消防员救人 / 亦凡垃圾桶躲过 / 王晨轩商场逆人流逃出(line 179-217)
        佩文 = 沈曾祺战友(消防员)的妹妹,六个消防员只剩沈曾祺(line 203-211)
      seq_climax: "沈曾祺坦白全套生存体系 = '队伍缺一不可,别想害人或脱队独活'(line 175-177)"
      hidden_setup: "母猪发情粉(line 165, 245 毒饵实证)—— 终局自毁的关键道具预演;王晨轩好感(line 199)埋情感线"

    - seq_id: "2.3"
      label: "集装箱腐尸致病 + 警服感染者追踪 + 发情粉毒饵脱身"
      source_anchor: "line 219-251"
      core_conflict: "被追杀的绝境 vs 沈曾祺的脱身智慧"
      progression: |
        集装箱腐尸恶臭 → 沈曾祺 + 亦凡高烧(line 223-225)
        锂电池细线陷阱报警 → 转移留痕被追踪(line 231-235)
        警服感染者靠痕迹追踪,连续数日追杀十几人(line 237)= canon late_phase 进化
        沈曾祺清醒后用母猪发情粉拌肉罐头做毒饵 → 感染者吃后云雨自残自毁(line 239-249)
      seq_climax: "发情粉毒饵让追踪感染者自相残杀自毁 —— 危机暂时解除(line 249-251)"
      hidden_setup: "发情粉的'让感染者停止互攻 + 兴奋自毁'机制 = 终局'伪装同类'的反向逻辑铺垫"

    - seq_id: "2.4"
      label: "陶亦仁失言暴露 + 全队疏远 + 清晨被抛弃"
      source_anchor: "line 251-295"
      core_conflict: "免疫者价值 vs 定时炸弹风险 + '我'的归属渴望 vs 灾星宿命"
      progression: |
        庆祝夜陶亦仁失言'他被咬过现在和正常人一样'(line 255)→ 全队沉默
        夏伟毅辨析:免疫者 vs 无症状感染者,但都能感染他人(line 257)
        沈曾祺问'为什么一开始不讲'后沉默离开(line 263)
        队伍停止活动 + 众人避开"我" → 王晨轩想接近又退回(line 265)
        清晨帐篷外空无一人,只留物资 + 陶亦仁坐在不远处(line 273-275)
        王晨轩昨夜已告知"我"队伍要走 + 邀"我"偷偷跟随,"我"拒绝(line 291)
      seq_climax: "沈曾祺康复后清晨集体撤离,'我'被抛弃 —— 灾星宿命第一次坐实(line 273)"
      hidden_setup: "失言的是'陶亦仁'(line 255)—— 但其实是'我'自己说漏;王晨轩透露撤离信息(line 291)为 arc_5 重逢铺垫"
  arc_progression_note: "Arc 2 是全篇唯一'近似正常人类小队'段落,密集落地 canon 生存体系。暴露 + 抛弃完成灾星宿命第一次坐实:身边人都先离开'我'。"

# === Arc 3: 独行 + 梦游 + 影音店重逢 ===

arc_3:
  label: "独自漂流 + 梦游症 + 梦境现实混淆 + 影音店重逢陶亦仁"
  source_anchor: "line 295-339"
  sequences:
    - seq_id: "3.1"
      label: "孤独漂流 + 梦游症发作 + 梦境闪回"
      source_anchor: "line 295-315"
      core_conflict: "被抛弃后的极致孤独 vs 梦游中的失控漂移"
      progression: |
        独行森林,前所未有的孤独('我本可忍受黑暗,如果我从未见过光明',line 295-297)
        被抛弃第一天起梦游 → 醒来在废弃服务站 / 树上 / 帐篷旁尸体边(line 299-311)
        梦里小孩黑发挥手告别(line 299)+ 梦里能闻味道感到疼(line 309)
        梦游时基本不碰到感染者,碰到也在远处(line 305)—— 异常的'被保护'
      seq_climax: "梦游严重到分不清梦境与现实('噩梦比美梦美好',line 313)"
      hidden_setup: "梦游=人格切换的物理外化(陶亦仁接管身体);'梦游不被感染者注意'(line 305)= 身体携带病毒/无症状的暗示"

    - seq_id: "3.2"
      label: "影音店《搏击俱乐部》蓝光碟 + 陶亦仁重逢 + '我一直在引导你'"
      source_anchor: "line 315-339"
      core_conflict: "继续昏噩等死 vs 被陶亦仁重新赋予方向"
      progression: |
        梦游醒在影音店 → 手被《搏击俱乐部》蓝光碟割到(line 317)—— 明喻锚点埋设
        陶亦仁'醒了兄弟'再现 + 拿碟感叹'好久没看'(line 319-323)
        陶亦仁解释:'我梦游一次次避开危险不奇怪吗?是我一直在引导你'(line 323-327)
        陶亦仁承认私心(扬名 + 救人)+ 给"我"选择留下与否(line 329)
        陶亦仁晃着碟提议'学主人公,创造向理想狂奔的团队 / 拯救人类创造新世界'(line 333-337)
      seq_climax: "'我'接受陶亦仁'创世'提议 —— 方向被重新接管(line 339)"
      hidden_setup: "《搏击俱乐部》蓝光碟(line 323)= 给读者的最大解谜钥匙,提前 line 525 '第二人格'200 行预告"
  arc_progression_note: "Arc 3 是结构枢纽:把'梦游=人格切换'的物理机制坐实,把《搏击俱乐部》明喻钥匙交给读者。从这里起'我'重新有了(伪)目标。"

# === Arc 4: 创世军崛起 + 极权化 + 首次剿杀 ===

arc_4:
  label: "创世军从 3 人到 50 人 + 陶亦仁极权化 + 首次正面剿杀感染者"
  source_anchor: "line 339-435"
  sequences:
    - seq_id: "4.1"
      label: "招募首批 + 教育三大学生 + 招纳夫妻与五壮汉"
      source_anchor: "line 339-365"
      core_conflict: "末日找人之难 vs 陶亦仁的'反向思路 + 自制电台'"
      progression: |
        陶亦仁'反向思路找幸存者'+ 简易广播电台计划(line 339)
        找到三个躲废弃隧道的男大学生(纯靠运气活着,line 341-345)
        陶亦仁给三人'离开或加入去反抗世界'的选择(line 349-353)
        铁轨翻倒车厢遇丧子夫妻(妻子求生意志靠'报仇'被点燃,line 357-361)
        一周后凑齐十来人(line 363-365)
      seq_climax: "一周多凑十来人 —— '极致想做事时世界会帮你'(line 365)"
      hidden_setup: "陶亦仁'懂人性了'(line 327, 329)—— 人格主导力增强,'我'退为旁观;夫妻丈夫懂机器(line 381)为电台铺垫"

    - seq_id: "4.2"
      label: "陶亦仁立威 + '没有人记住你' + 极权符号建立"
      source_anchor: "line 365-413"
      core_conflict: "传统人类社会思维 vs 陶亦仁'无畏反抗 + 放弃身份'的新秩序"
      progression: |
        陶亦仁站箱上立威,驳倒嘲讽三学生的高大男人(line 367-377)
        宣言:'死亡率高 / 没必要自我介绍 / 没人会记住你 / 完成目标才有真正身份'(line 379)
        自制电台做成(调频发射器 + 蓝牙 + 锂电池 + 天线,line 391)+ 中转站解谜筛感染者(line 393)
        极权符号:统一黑衣 / 手套 / 面罩 / '创造'手势 / 同名状入会门槛(line 387, 395)
        '只有我和陶亦仁不用做创造手势'(line 387)—— 双领袖表象
        入会门槛杀死许多人(被潜伏感染者剥皮穿衣,line 399)
      seq_climax: "创世军极权化成型 + 成员自发警戒'保护长官是荣誉'(line 411)"
      hidden_setup: "'没有人记住你'(line 379)呼应全系列记住/被遗忘;成员只对陶亦仁尽忠(line 411)= arc_5 王晨轩戳穿伏笔"

    - seq_id: "4.3"
      label: "创世军首次正面剿杀感染者"
      source_anchor: "line 413-435"
      core_conflict: "感染者武力优势 vs 创世军纪律 + 远近武器配合"
      progression: |
        30 人队 vs 三公里外十余感染者聚集地(line 415)
        丧子妻子眼里再次发光 + 三学生只剩两个但已狂热(line 417)
        陶亦仁压住所有人到感染者扑面才下令(line 423-425)
        远近武器配合碾压取胜,代价 5 死(3 咬死 / 1 重伤 / 1 自感染前自尽,line 427)
        陶亦仁难得悲伤'真的可惜'(line 429)
      seq_climax: "首次正面剿杀胜利 —— '感染者也是可以剿灭的'(line 431)"
      hidden_setup: "陶亦仁的领导力/动员力顶点 —— 把'伪英雄成长线'推到最高,为 arc_6 反讽(创世军感染后与普通感染者无异)蓄势"
  arc_progression_note: "Arc 4 是'伪英雄成长线'的高潮 Arc。表层废人逆袭成救世军缔造者,但极权符号 + '只忠于陶亦仁'层层埋着揭穿伏笔。"

# === Arc 5: 王晨轩投奔 + 假罗允真相 + 亲手杀王晨轩 ===

arc_5:
  label: "王晨轩投奔 + 沈曾祺小队覆灭真相(假罗允 + 小林)+ '我'亲手捅死王晨轩"
  source_anchor: "line 435-513"
  sequences:
    - seq_id: "5.1"
      label: "五十人规模 + 与陶亦仁忆儿时 + 老头真相"
      source_anchor: "line 433-445"
      core_conflict: "对自身过去的愧疚 vs 灾星认同的松动"
      progression: |
        创世军达五十人,陶亦仁感叹顺利(line 433-435)
        陶亦仁讲老头真相:家道中落因老头信假医生(裂脑术致昏迷)+ 老头烧钱报复弄死假医生(line 437-441)
        亲戚传言'母亲怀双胞胎,我把另一个吃了'(line 443)—— 灾星认同的最深一层
        '希望我不要再毁了陶亦仁这个优秀的人'(line 445)—— 残酷反讽(陶亦仁就是自己)
      seq_climax: "老头真相揭示 —— 灾星认同从'天生'转向'被庸医/命运坑害'(line 441-443)"
      hidden_setup: "陶亦仁知道'我'昏迷时家里的事(line 441)= 同脑记忆铁证;'别毁了陶亦仁'是终局自毁的反讽前置"

    - seq_id: "5.2"
      label: "王晨轩投奔 + 沈曾祺小队覆灭转述(假罗允 + 小林)"
      source_anchor: "line 447-483"
      core_conflict: "重逢的喜悦 vs 沈曾祺队全灭的噩耗 + 假罗允反派线入场"
      progression: |
        丧子妻子报'来了认识"我"的女娃' → 王晨轩浑身泥泞破烂走进来哭(line 447-451)
        王晨轩转述:抛弃"我"后众人遇'自称罗允 + 带小孩小林'的两个畜生(line 461)
        假罗允表面仗义有爱心冲在前,佩文对他爱慕,王晨轩把小林代入死去的弟弟(line 463)
        小林失踪诱出搜寻 → 罗允强暴佩文 + 小林一刀插亦凡小腿 + 给王晨轩注射针管(line 465-467)
        佩文头颅张嘴放蓝牙音响上'仿佛求救'(line 467)
        假罗允战果:沈曾祺挑断脚筋砸烂双手 / 夏伟毅关疯子房 / 亦凡剖腹助王晨轩逃(line 469-475)
      seq_climax: "沈曾祺小队全灭真相 + 亦凡剖腹助逃遗言'这些是我一爷们该做的'(line 475)"
      hidden_setup: "假罗允+小林=吴先生/林东青型反派对位线受害端取证(跨篇钩);王晨轩活着投奔='我'唯一所爱重现"

    - seq_id: "5.3"
      label: "承诺报仇 + 陶亦仁下令杀罗允 + 王晨轩问'陶亦仁在哪'+ 刀已在背"
      source_anchor: "line 479-513"
