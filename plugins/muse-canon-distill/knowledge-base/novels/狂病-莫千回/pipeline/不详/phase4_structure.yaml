# === 序列间冲击力递增 ===

escalation_check:
  arc_1_to_2: "校园两队覆灭 + 免疫悬念 → 唯一近正常小队的归属落空(被抛弃)"
  arc_2_to_3: "被抛弃的灾星宿命坐实 → 梦游/孤独的精神崩坏 + 被陶亦仁重新接管"
  arc_3_to_4: "影音店重逢(明喻钥匙埋设)→ 创世军极权崛起(伪英雄顶点)"
  arc_4_to_5: "救世军 50 人规模顶点 → 唯一所爱(王晨轩)重逢瞬间被亲手摧毁 + '陶亦仁在哪'戳穿"
  arc_5_to_6: "幻觉戳穿 + 杀所爱 → '你是我'完全揭穿 + 自我清除"
  curve_shape: "Arc 1 急(双队覆灭)→ Arc 2 缓(小队生活)→ Arc 3 静(孤独梦游)→ Arc 4 升(创世军崛起)→ Arc 5 急转(重逢+戳穿)→ Arc 6 爆(你是我+自毁)"
  curve_note: |
    渐进式自我揭示型 —— 不同于《燃烧》每 Arc 死一人的均匀受难曲线,
    本篇是'信息伏笔缓慢累积 → 终局一次性引爆'的长引信结构。
    Arc 2-4 表面在'变好'(归属/重逢/壮大),实则全是为'你是我'蓄信息势能,
    冲击力不在死亡数,而在'读者回溯发现整篇五分之四是骗局'的认知海啸。

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第一人称'我'(李鸾)回溯性自白体 —— line 5-567 全篇统一,未来视角追述(line 15, 42)"
    function: |
      第一人称 + 不可靠叙述者是双重陷阱:
      回溯视角让读者信任'我'已经看清一切(都过去了的口吻),
      但'我'恰恰隐瞒了最大的真相(陶亦仁是自己)——
      读者和'我'一起被'我'的回避机制欺骗,直到'你是我'(line 523)回溯重构整篇。
      这是莫千回继《学校》日记体 / 《燃烧》第二人称盲女后的第三种 POV 实验:不可靠叙述 + 双人格隐藏。

  parallel_threads:
    - name: "陶亦仁人格暗线(贯穿)"
      description: "从 arc_1 文具盒闪回登场,到 arc_6 '你是我'揭穿 —— 始终伪装成独立同伴,实为'我'的强势分裂人格;每个 Arc 都有'同脑信息共享'伏笔(知车钥匙/翻窗/知老头事/创世军只忠陶长官)"
      primary_arcs: ["arc_1", "arc_3", "arc_4", "arc_6"]
      presence: "贯穿,但从未被叙述者标记为'人格' —— 直到终局浮出水面"
    - name: "情感线(王晨轩)"
      description: "arc_2 商场导购员身世 + 对'我'好感 → arc_2 末透露撤离信息 → arc_5 投奔重逢 → arc_5 被'我'(陶亦仁人格)亲手杀死;= 《搏击俱乐部》女主角对位,威胁陶亦仁计划故被清除"
      primary_arcs: ["arc_2", "arc_5"]
      presence: "间歇 —— arc_3/4 蛰伏,arc_5 浮现即被摧毁"
    - name: "跨篇反派线(假罗允 + 小林)"
      description: "arc_5 通过王晨轩转述完整入场 —— '冒名真罗允 + 带孩子'的吴先生型反派猎杀沈曾祺队,本篇是该对位线的受害端取证"
      primary_arcs: ["arc_5"]
      presence: "特定章节(arc_5 转述)单点入场"
    - name: "免疫者/无症状感染者悬念(贯穿)"
      description: "arc_1 被咬不感染 → arc_2 夏伟毅辨析 → arc_3 梦游不被注意 → arc_6 母猪发情粉伪装成功 + 创世军血液感染;身份始终'不详'"
      primary_arcs: ["arc_1", "arc_2", "arc_3", "arc_6"]
      presence: "贯穿 —— 与篇名'不详'(身份不明)直接绑定,从未被确认"

