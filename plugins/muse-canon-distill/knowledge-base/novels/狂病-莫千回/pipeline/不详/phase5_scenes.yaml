        杀王晨轩动机:她像《搏击俱乐部》女主角,会破坏陶亦仁计划(line 531)—— 情感线与明喻框架闭合
        终极妄想:用'我'进化血液造'新人类'(line 541)+ 肚子伤疤'以为梦游留下'(line 543)—— 伪英雄线证伪:创世军血液感染后与普通感染者无异(line 555),救世即灭世
        自毁三连:母猪发情粉伪装(arc_2 道具回收,line 557)+ 咬断自己舌头(陶亦仁张嘴掉舌头=同体物证,line 561)+ 命令创世军吃掉自己
        '左手抓右手/左脚踢右脚'(line 565)—— 双人格争夺同一身体的肉体化,弱势'李鸾'人格首次战胜'陶亦仁'
        收笔'充满不祥的暴风应该也可以摧毁我吧'(line 567)—— 篇名'不详(身份不明)/不祥(灾星暴风眼)'双重兑现
    description: "'我'掐死陶亦仁他若无其事站起 → 揭穿'被抛弃第一晚就掐死过陶亦仁' → '你是我,你是我的第二人格' → 揭杀王晨轩动机(《搏击俱乐部》女主角)→ 终极计划:用'我'血液造新人类 + 肚子同款伤疤 → 创世军被血液感染但与普通感染者无异 → '我'翻窗+倒母猪发情粉伪装+咬断自己舌头+命令创世军吃掉自己 → 左手抓右手左脚踢右脚强压逃跑 → 接受自毁"

# === 节奏曲线 ===

pacing_curve:
  arc_1: "急"          # BX-S01/02/03 校园双队覆灭 + 被咬不感染 + 逃出
  arc_2: "缓"          # BX-S04 沈曾祺生存体系(全篇唯一喘息段)
  arc_2_end: "缓 → 沉"  # BX-S05 暴露 + 被抛弃(情绪下沉)
  arc_3: "静"          # BX-S06 孤独梦游 + 影音店重逢(最静,埋钥匙)
  arc_4: "升 → 急"     # BX-S07 创世军立威 + 首次剿杀(伪英雄上扬)
  arc_5: "急转 → 崩"   # BX-S08 转述噩耗 + BX-S09 '陶亦仁在哪'戳穿 + 杀王晨轩
  arc_6: "爆 → 余韵"   # BX-S10 '你是我' + 自我清除
  notes: |
    渐进式自我揭示型 —— 不同于《燃烧》缓急高频交替的连续受难曲线。
    本篇是'长引信'结构:Arc 1 急开局抓人 → Arc 2-3 故意放缓放静(小队生活 + 梦游)让读者放松警惕 + 同时密集埋信息伏笔 →
    Arc 4 用'伪英雄上扬'制造虚假希望 → Arc 5-6 终局一次性引爆'你是我'认知海啸。
    冲击力不在死亡密度,而在'回溯重构整篇'的信息坍塌。

# === 跨场景手艺主题 ===

cross_scene_craft_themes:
  unreliable_narrator_dual_personality:
    description: "全篇第一人称回溯把分裂人格'陶亦仁'当独立同伴叙述,'你是我'(line 523)回溯重构整篇五分之四 —— 莫千回第三种 POV 实验(继《学校》日记体 /《燃烧》第二人称盲女)"
    scenes: ["BX-S02", "BX-S03", "BX-S06", "BX-S09", "BX-S10"]
    function: "回溯视角'都过去了'的口吻骗读者以为'我'已看清,恰恰隐瞒最大真相 —— 读者与'我'一起被'我'的回避机制欺骗"

  fight_club_foreshadow:
    description: "《搏击俱乐部》明喻框架三处锚定:蓝光碟割手(BX-S06 line 323)/ 第二人格(BX-S10 line 525)/ 女主角威胁计划=王晨轩(BX-S10 line 531)"
    scenes: ["BX-S06", "BX-S10"]
    function: "给读者一把解谜钥匙却故意不点破 —— 重读时所有'陶亦仁同脑信息'(知车钥匙/翻窗/知老头事)伏笔全部成立"

  same_brain_information_leaks:
    description: "陶亦仁知道沃尔沃车钥匙(BX-S03 line 83)/ 知道'我'昏迷时家里的事(line 441)/ 创世军'只忠陶长官'(BX-S09 line 489)/ 翻窗习惯(line 453)—— 同脑信息共享的揭穿伏笔链"
    scenes: ["BX-S03", "BX-S07", "BX-S09", "BX-S10"]
    function: "每个伏笔在当下都有'合理化解释'(他是导师学生/很多人都知道),终局一次性失效 —— 重读价值的核心来源"

  prop_as_destiny_machine:
    description: "母猪配种发情粉:BX-S04 沈曾祺储备(误以为别有用心)→ arc_2 毒饵脱身(line 245)→ BX-S10 '我'倒身上伪装成感染者(line 557)—— 同一道具贯穿生存智慧到自毁"
    scenes: ["BX-S04", "BX-S10"]
    function: "道具承担命运 —— 与《燃烧》手机/吉他承担遗言同源,但本篇是'毒饵→自毁伪装'的双重功能反转"

  savior_equals_destroyer:
    description: "伪英雄成长线(废人→救世军缔造者 BX-S07)→ 创世军被'进化血液'感染后与普通感染者无异(BX-S10 line 555)—— 救世即灭世"
    scenes: ["BX-S07", "BX-S10"]
    function: "证伪'人造新人类'妄想,呼应 phase0 '感染者是人的极化态' + 'candidate_a 病毒只暴露腐烂内核';创世军群体狂热↔感染者狂欢的隐性对位"

  game_ified_atrocity_imagery:
    description: "篮筐塞人头打人头篮球(line 69)/ 操场焚尸尸体肚皮自爆(line 107)/ 图书馆人体喷泉(line 105)/ 六楼把人当滑板垂直踩落(line 95)/ 云雨自残柴刀塞下体(line 247-249)"
    scenes: ["BX-S01", "BX-S03", "BX-S07"]
    function: "莫千回标志性'游戏化嗜虐 + 残忍美学' —— 与《燃烧》踢人头/腐烂祭坛、《学校》拖把棍头颅同源公共意象"
