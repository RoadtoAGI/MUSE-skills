# === 节奏曲线 ===

pacing_curve:
  arc_1: "缓"                    # HJ-S01 群像 + 守夜 + 决策
  arc_2: "缓 → 急 → 极急"        # HJ-S02 野猪预演 → HJ-S03 拿子弹 → 三路口围堵
  arc_3: "极急 → 急转"           # HJ-S04 对拳赴死 → 无人机引入大厦
  arc_4: "缓（揭谜慢热）"         # HJ-S05 初识 → HJ-S06 失眠识破 + 赤裸嗅日记
  arc_5: "缓 → 急 → 缓"          # HJ-S07 顶替 → HJ-S08 商场地狱突围 → HJ-S09 揭内幕
  arc_6: "急 → 极暗 → 极急"      # HJ-S10 挟持+创世军 → HJ-S11 地狱秀(最暗) → HJ-S12 逼门 main climax
  arc_7: "反转 → 和解 → 余韵"     # HJ-S13 创世军反杀 → 双哲学和解 → 记录传火
  notes: |
    单中心慢揭谜长篇节奏 —— 外部生存（Arc 1-3 快）→ 内部揭谜（Arc 4-5 慢热）→ 对峙（Arc 6 极急最暗，体量近全篇 1/3）→ 和解（Arc 7 反转 + 肯定式余韵）。
    与《燃烧》连续受难等密度不同：本篇 Arc 6 是绝对的体量与暗度顶点（HJ-S10/S11/S12 三连），前面铺垫长、后面收束有余味。

