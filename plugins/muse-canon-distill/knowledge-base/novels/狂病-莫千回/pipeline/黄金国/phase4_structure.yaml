_meta:
  version: "1.0"
  chapter: "黄金国"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    7 Arc，'闯入 → 慢揭谜 → 对峙 → 和解'单中心结构。
    Arc 1-3 外部生存线（递增冲击）；Arc 4-6 内部揭谜线（价值层层下沉到地狱秀）；Arc 7 救场 + 和解余韵。
    大厦工作人员受难片段（王家乐 / 老鼠 / 厨房）为 Arc 6 内的'地狱秀'平行序列，承担反派主题物证。

# === Arc 1: 除夕夜观鸟台 ===

arc_1:
  label: "除夕夜观鸟台守夜 + 决定进城拿弹药 + 被隐匿的眼睛盯上"
  source_anchor: "line 5-57"
  sequences:
    - seq_id: "1.1"
      label: "'去年录下的春晚'避难所群像冷开篇"
      source_anchor: "line 5-12"
      core_conflict: "末日前团圆记忆 vs 末日后机械重演"
      progression: |
        一群天南地北的人吃兔肉饺子看'新春联欢晚会' → 中年男人冷哼'那位也不来吃饭' + 金发女人解释
        → 女孩啜泣'回不去了，以后每个新年都要看这去年录下的春晚' —— 看似独立群像
        （后于 line 331 回扣：这群人即黄金大厦原住民）
      seq_climax: "'去年录下的春晚' —— 全篇最大结构性伏笔，乌托邦的虚假团圆基调"

    - seq_id: "1.2"
      label: "观鸟台守夜 + 体育馆感染者过年仪式化虐杀"
      source_anchor: "line 13-39"
      core_conflict: "罗允 / 洪扬隐蔽守夜 vs 远处感染者狂欢"
      progression: |
        距末日'十个月'（时间锚点）→ 洪扬望远镜看体育馆感染者轮流砸爆被绑人头颅
        → 先砸感染者再砸人类看反应 / 挂尸点燃当灯笼 / 砸头当放炮
        → 罗允纳闷'感染者也知道过年了吗，有时间观念吗' → 洪扬'生前习惯潜意识'
      seq_climax: "感染者'过年仪式化'恐怖 —— 感染者保留时间观念 / 生前习惯的 lore 延伸，建立本篇感染者基调"

    - seq_id: "1.3"
      label: "进城决策 + 罗允'奔死理由' + 嗡鸣声 + 被监视"
      source_anchor: "line 41-57"
      core_conflict: "弹药将尽不得不冒险 vs 城内感染者密集"
      progression: |
        天气转冷 + 弹药将尽 + '最多再两次危险就崩' → 决定明天进 8 公里外射击体验馆（激励事件）
        洪扬问'没遇到我你也要一个人去科考站？' → 罗允'我不想死，所以得继续下去'（shadow_desire 首露）
        罗允听到奇怪嗡鸣（无人机伏笔）→ '一双眼睛隐匿黑暗盯着他们'（line 57）
      seq_climax: "决定进城（激励事件）+ 被隐匿的眼睛盯上 —— 目的设定 + 大厦监视伏笔双锚"
  arc_progression_note: "群像冷开篇 → 守夜建立感染者基调 → 进城决策 + 监视伏笔，三序列从'氛围'收束到'目的 + 悬念'"

# === Arc 2: 进城 ===

arc_2:
  label: "进城路上野猪对抗感染者 + 抵达射击馆拿弹药 + 被感染者潮包围"
  source_anchor: "line 59-145"
  sequences:
    - seq_id: "2.1"
      label: "跨江大桥人肉腊肉林 + 野猪对抗感染者群"
      source_anchor: "line 59-89"
      core_conflict: "野猪个体凶悍 vs 感染者群不要命"
      progression: |
        推摩托沿江东行 + 始终被监视感 → 跨江大桥干瘪尸体如腊肉挂栏
        → 十几个感染者追杀野猪 → 野猪撞飞 / 咬断感染者脖子 → 仍被斧头菜刀群虐至倒
        → 感染者脱裤走向野猪 → 罗允放下望远镜
      seq_climax: "野猪虽凶仍被疯子群虐 —— '再凶悍的个体也敌不过疯子群'的预演 + 创世军被普通人群反杀（Arc 7）的反例铺垫"

    - seq_id: "2.2"
      label: "进城抵达射击馆 + 设备室找到大量子弹"
      source_anchor: "line 91-109"
      core_conflict: "希望拿到强力武器 vs 现实只有 .22 小口径"
      progression: |
        穿过空洞商铺精神紧绷 → 射击馆门面破坏但平安 → 大厅枪支目录 / AK47 标 5.6mm 改小口径
        → 射击场火灾爆炸枪械全废 → 设备室无枪但满地 .22 子弹盒 + 罗允猎枪子弹七八盒
        → 洪扬'过年了，真的过年了！'
      seq_climax: "找到大量子弹 —— 武器升级有限（仅子弹），维持'罗允冷兵器 + 洪扬手枪'战斗模式"

    - seq_id: "2.3"
      label: "出门遭感染者潮 + 突围搏杀 + 三路口围堵死地"
      source_anchor: "line 111-145"
      core_conflict: "突围逃离 vs 城市中心感染者全聚集"
      progression: |
        出门见街道两边几十感染者狂奔 → 选感染者较少的左侧街道 → 罗允摩托砍刀突围 + 洪扬手枪掩护
        → 光头感染者抓同伴当挡箭牌（line 137 进化）+ 砍刀脱手 → 拧油门冲出 → 突围成功
        → 抵达十字路口圆盘雕塑 → 剩余三路口全是感染者（line 145）
      seq_climax: "三路口全堵 = 死地 —— 罗允'判断把我们带到死地'的绝境，为无人机救场做落点"
  arc_progression_note: "野猪预演 → 拿子弹的喜悦 → 喜悦被三路口围堵粉碎，冲击力递增到全篇第一个生存绝境"

# === Arc 3: 无人机引路 ===

arc_3:
  label: "无人机引路 + 地下车库逃生 + 电梯升入黄金大厦"
  source_anchor: "line 145-183"
  sequences:
    - seq_id: "3.1"
      label: "对拳赴死 + 无人机降临投燃烧弹"
      source_anchor: "line 145-167"
      core_conflict: "背水一战赴死 vs 突如其来的外部救援"
      progression: |
        罗允交笔记本给洪扬 → 洪扬反手挡'一起冲，有人倒下我引爆手雷一起痛快死' → 英雄式对拳
        → 头顶呼啸黑影 = 悬浮小无人机 + 两架大无人机投燃烧弹烧感染者群
        → 小无人机绕飞引路 → '它想让我们跟它走吗'
      seq_climax: "无人机救场 + 引路 —— '一切太巧了'，把'被救'本身做成可疑信号"

    - seq_id: "3.2"
      label: "跟无人机冲地下车库 + 绿光逃生灯 + 电梯"
      source_anchor: "line 169-181"
      core_conflict: "追兵在后 vs 未知车库是陷阱还是生路"
      progression: |
        无人机一栋大厦前右转消失 → 罗允'又不是魔法，肯定有路' → 冲进漆黑地下车库
        → 感染者群追进 + 回音放大如无间炼狱 → 黑暗中绿光逃生灯亮起（有电）
        → 电梯门'叮'开 + 推摩托进 → 感染者追到最后一刻电梯关闭
        → 柔和灯光 / 无广告的电梯 = 末日前秩序诡异复刻
      seq_climax: "电梯逃生 —— 末日前秩序的诡异复刻，建立'乌托邦'表层"

    - seq_id: "3.3"
      label: "6 层电梯门开 + 中年男人'欢迎来到地狱里的天堂'"
      source_anchor: "line 183"
      core_conflict: "外界地狱 vs 大厦'净土'"
      progression: |
        电梯升至 6 层停 → 衬衫中年男人抱臂挑眉'欢迎来到幸存者做梦才能到达的净土，欢迎来到地狱里的天堂'
      seq_climax: "'地狱里的天堂'题眼 —— 全篇主题反讽第一次出口"
  arc_progression_note: "赴死 → 被救引路 → 进入大厦，从'最绝望'急转到'最诡异安全'，完成外部生存线到内部揭谜线的过渡"

# === Arc 4: 乌托邦揭幕 ===

arc_4:
  label: "黄金大厦初识 + 饺子宴 + 罗凯伯登场 + 失眠夜识破'过分友善'"
  source_anchor: "line 183-313"
  sequences:
    - seq_id: "4.1"
      label: "饺子宴 + 老张盘问 + 原住民假笑嘲讽'拯救世界'"
      source_anchor: "line 185-221"
      core_conflict: "罗允的警觉自保 vs 大厦的盘问与羞辱"
      progression: |
        热饺子 / 白灼青菜端上但不敢吃 → 老张坦白'从昨晚就注意到你们' + '想毁我们的外人下场很惨'
        → 罗允说想北上找解决病毒办法'拯救世界' → 金发女人扑哧笑 + 原住民连锁假笑嘲讽
        → 罗允观察'笑不出还跟着假笑'的虚伪 → 瘦小女人（陆思静）讨饺子吃 → 老张让他们洗澡'有人要见你们'
      seq_climax: "原住民假笑嘲讽 —— 罗允'实话太夸张反被当假话'的反向自保（line 225）+ 大厦阶层 / 虚伪基调"

    - seq_id: "4.2"
      label: "洗澡密谋 + 三道回音长廊 / 安检见罗凯伯"
      source_anchor: "line 223-243"
      core_conflict: "罗允判断大厦是否有阴谋 vs 深不可测的防护与首领"
      progression: |
        冷水澡 + 洪扬藏手雷 → 罗允'人对你越有所图越表现好，瞧不起我们反而没深阴谋'
        → 老张带去 25 层：奢华装饰 + 回音长廊（脚步声放大报警）+ 喷泉养乌龟 + 多道厚重铁门 + 制服安检
        → 三面落地窗超大平层见'管理这里唯一的神'罗凯伯
      seq_climax: "25 层防护离谱（仿佛早知灾难会爆发）—— 建立罗凯伯'对人防备拉满'的控制系统物证"

    - seq_id: "4.3"
      label: "失眠夜 + 财富魔幻对照 + 识破罗凯伯'过分友善'反常"
      source_anchor: "line 245-271"
      core_conflict: "末日里的安逸 vs '事出反常必有妖'的警觉"
      progression: |
        双人间软床失眠 → 罗允'这世界公平吗' + 一万块的水 / 十来万的酒 + 洪扬输液港 vs PICC 对照
        → 三天瞳孔指纹认证 / 全员陪葬机制（line 267）+ 本地 AI 唯一商讨对象
        → 洪扬'罗凯伯对我们好得过分，随从都瞧不起我们，唯独绝对掌控者相见恨晚 —— 不对劲'
      seq_climax: "识破'过分友善'反常 —— 认知层第一次崩坏：这座乌托邦不正常"

    - seq_id: "4.4"
      label: "罗凯伯赤裸嗅死亡日记自我窒息 + 笔记本病态迷恋 + 霍乱遗书"
      source_anchor: "line 273-313"
      core_conflict: "罗凯伯表面友善 vs 病态濒死癖（读者先于罗允知道）"
      progression: |
        罗凯伯亲自分食 / 当面吃罗允盘中肉示无毒 → 索要罗允逝者故事笔记本入神看（line 277）
        → 25 层赤裸嗅血腥死亡日记 + 自我掐脖窒息体验濒死 + 精华雨落感染者（line 289）—— 反派本质正面投放
        → 灾难当天管家 / 用人吸尘器自虐回忆（line 291）
        → 霍乱遗书故事（line 299-301）：感染者吃霍乱病人无症状 → 罗允'靠瘟疫清除感染者'幻灭
        → 罗凯伯劝'梦该醒了，留在黄金大厦' → 罗允坚持'这是我们最后想做的事'
      seq_climax: |
        罗凯伯赤裸嗅死亡日记自我窒息（line 289）—— 反派变态本质首次正面投放（读者认知领先罗允）
        + 罗允拒绝留下 —— shadow_desire（奔死理由不容剥夺）首次正面对抗诱惑
  arc_progression_note: "饺子宴羞辱 → 见首领 → 失眠识破反常 → 反派本质投放 + 拒绝诱惑，揭谜线从'氛围可疑'下沉到'反派变态确证（读者层）'"

# === Arc 5: 外出任务 ===

arc_5:
  label: "被派外出宜家取阀门 + 秦正肖顶替陆思静 + 商场地狱探险 + 秦正肖揭内幕"
  source_anchor: "line 313-475"
  sequences:
    - seq_id: "5.1"
      label: "陆思静异常 + 罗允套出'又得有人出去' + 预判被派炮灰"
      source_anchor: "line 313-347"
      core_conflict: "罗允旁敲侧击套情报 vs 大厦隐瞒外出真相"
      progression: |
        罗允问洪扬'真不留下？'→ 洪扬'铁路尽头是归宿，这没有活下去目的'（自杀背景）
        → 陆思静沉默吃羊排异常 → 罗允套出'设施又出问题，上次出去的人没回来，又得有人出去'（line 321）
        → 罗允算出'外出 = 高伤亡 + 全员撤退多但牺牲不少' → 与洪扬眼神交换：明天他俩要被派出去当炮灰
      seq_climax: "预判被派外出当炮灰 —— 罗允从'寄人篱下'转向'主动掌握信息反制'"

    - seq_id: "5.2"
      label: "外出命令 + 杨中旭幸灾乐祸 + 秦正肖顶替陆思静混入"
      source_anchor: "line 347-371"
      core_conflict: "大厦逼罗允创造价值 vs 罗允被迫接任务"
      progression: |
        老张 + 板寸男杨中旭敲门 → '植物大棚输水阀坏 + 原外出组全报销 + 缺领队' → 罗允接任务
        → 四人队：罗允 / 洪扬 / 倪海鹏 / '陆思静'（实为顶替者）→ 目标基隆广场
        → 老张向罗凯伯邀功'碎嘴丫头安排走了 + 挑了炮灰' → 真陆思静反锁躲房间，房主顶替混入
      seq_climax: "神秘顶替者混入（line 357）—— 大厦内部反抗线悬念，秦正肖身份谜面抛出"

    - seq_id: "5.3"
      label: "宜家副一层地狱探险 + 倪海鹏暴露引感染者"
      source_anchor: "line 359-419"
      core_conflict: "潜行取阀门 vs 商场枯骨感染者伏击"
      progression: |
        感染者孕妇婴儿暴行（line 361）→ 鱼线设陷阱（line 369）→ 紧急通道腐液 / 人皮钉墙（line 375）
        → 家居区人头书柜（line 389）/ 五金区抵抗痕迹 → 罗允防水涂料柜偷拿东西塞洪扬（计划伏笔 line 397）
        → 倪海鹏被枯骨感染者拽倒（'操你妈'line 403）→ 暴露 + 顶替者'撤吧，大厦一定让你们回去'（line 409 首次开口）
      seq_climax: "倪海鹏暴露 + 顶替者陌生声音（line 409）—— 地狱秀 + 顶替者身份将揭"

    - seq_id: "5.4"
      label: "鱼线 / 燃烧瓶 / 猎枪突围 + 大厦无人机吸火力 + 罗允首次开猎枪"
      source_anchor: "line 411-435"
      core_conflict: "四人突围 vs 商场感染者追击"
      progression: |
        原路冲紧急通道 + 腐液滑倒互拽 → 罗允首次开猎枪轰感染者（line 423 武器弧光）
        → 鱼线勒爆冲来感染者眼球（line 427）→ 燃烧瓶 + 猎枪 + 手枪冲出商场
        → 大厦无人机爆炸吸引火力（顶替者看表确认 line 431）→ 避开追击群
      seq_climax: "大厦真来救（line 433）—— 印证顶替者地位特殊（罗凯伯重视她），秦正肖谜底将揭"

    - seq_id: "5.5"
      label: "脱险 + 秦正肖坦白身份 + 揭大厦全部内幕"
      source_anchor: "line 437-475"
      core_conflict: "罗允求真相 vs 秦正肖部分保密"
      progression: |
        秦正肖坦白：机械维修工程履历（保密真因）+ 代陆思静因男友倪海鹏被老张选去逼她就范（line 441）
        → 老张前保安谄媚混亲信 + 选炮灰谋私 + 罗凯伯眼里大部分人是数字（line 443）
        → 罗凯伯外派幸存者像'看戏'有时帮有时看自生自灭（line 461）+ 罗凯伯极度生气仅一次（外人抢控制权）
        → 倪海鹏'传奇般存活'崇拜罗允 → 罗允问'能放我们走吗' → 秦正肖'尽力帮你劝'
      seq_climax: |
        秦正肖揭内幕（line 437-465）—— 罗允掌握大厦真相全貌：老张谋私 / 罗凯伯看戏 / 秦正肖会修机
        + 决定'接下来要做的事错一步下场很惨'（line 475）= 挟持计划成形
  arc_progression_note: "套情报 → 被派外出 → 地狱探险 → 突围 → 揭内幕，外出任务把'读者已知的反派本质'转化为'罗允也掌握的行动情报'，揭谜线推进到罗允可主动出击"

# === Arc 6: 挟持 + 大厦沦陷 ===

arc_6:
  label: "挟持罗凯伯 + 大厦被创世军攻破 + 监视屏地狱秀 + 逼罗凯伯亲手关门体验死亡"
