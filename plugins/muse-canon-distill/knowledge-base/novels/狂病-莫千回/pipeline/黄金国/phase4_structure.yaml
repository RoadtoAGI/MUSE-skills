# === 序列间冲击力递增 ===

escalation_check:
  arc_1_to_2: "观鸟台守夜（氛围）→ 进城突围 + 三路口围堵（第一个生存绝境）"
  arc_2_to_3: "围堵死地 → 无人机救场引入大厦（绝望急转诡异安全）"
  arc_3_to_4: "进入乌托邦表层 → 识破'过分友善'反常 + 反派变态本质投放（认知崩坏）"
  arc_4_to_5: "反派本质（读者已知）→ 外出任务把它转为罗允掌握的行动情报（可主动出击）"
  arc_5_to_6: "掌握真相 → 挟持 + 大厦沦陷 + 监视屏地狱秀 + 逼门体验死亡（全篇最暗 + main climax）"
  arc_6_to_7: "逼门体验死亡 → 创世军被普通人反杀 + 双哲学和解（外部反转 + 肯定式余韵）"
  curve_shape: "Arc 1 缓 → Arc 2 急 → Arc 3 急转 → Arc 4 缓（揭谜慢热）→ Arc 5 急→缓 → Arc 6 极急（最长最暗）→ Arc 7 反转 + 余韵"
  curve_note: |
    单中心慢揭谜结构 —— 不是《燃烧》连续受难等密度，而是'外部生存（快）→ 内部揭谜（慢热）→ 对峙（极急最暗）→ 和解（余韵）'的长篇节奏。
    Arc 6 是全篇体量与暗度顶点（line 475-743，近全篇 1/3），监视屏地狱秀作平行受难线穿插。

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第三人称限知，主 POV 罗允（真）—— line 13 起全程主线"
    secondary_interludes:
      - "罗凯伯内心 POV：失眠夜抠指甲（line 345）/ 赤裸嗅死亡日记自我窒息（line 289）/ 关门后濒死快感（line 735）—— 反派内心独立投放，读者认知领先罗允"
      - "大厦工作人员受难 POV：王家乐叛变（line 549-577）/ 老鼠卖队友被虐（line 591-651）/ 厨房员工烤人（line 671-675）—— 监视屏地狱秀平行线"
      - "结尾创世军追猎者青年 POV（line 777-779）—— 跨篇组织线的独立视角窗口"
    function: |
      多 POV 把'罗凯伯靠看他人死获取快感'做成结构本身：
      读者通过罗凯伯内心 POV 先于罗允知道反派变态，再通过工作人员受难 POV 看'被看的死亡'，
      最后罗允用挟持逼门完成认知同步 —— POV 切换即主题（窥镜套娃 / 看与被看）。

  parallel_external_threads:
    - "黄金大厦原住民群像（line 5-12 春晚 / 陆思静 / 秦正肖 / 倪海鹏 / 老张 / 杨中旭 / 王家乐）—— 定居型避难所内部阶层 / 反抗线"
    - "创世军感染者组织（line 535, 555, 777-779）—— 拿枪 / 火箭筒的进化型感染者势力，跨篇反派钩"
    - "发型怪异男人领导的普通人反抗队（line 783）—— 追猎创世军的另一支幸存者势力，跨篇钩"
    - "罗凯伯的二号地堡 + 直升机后路（line 255, 751-759）+ 国内 5 富豪避难所网（line 255）—— 末日精英预备网络暗线"

