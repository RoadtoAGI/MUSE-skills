_meta:
  version: "1.0"
  chapter: "黄金国"
  source: "novels/狂病-莫千回/黄金国.md"
  word_count_approx: 49300
  validated_against_source: true
  form_note: |
    第三人称限知，主 POV 罗允（真），间歇切换罗凯伯内心 + 大厦工作人员（王家乐 / 老鼠 / 厨房员工）受难片段 + 结尾创世军青年 POV。
    全篇最长（845 行）—— 双人闯城求生（罗允 + 洪扬）撞进富豪避难所（黄金大厦 / 罗凯伯），
    由"末日里物资充足的乌托邦"逐层揭穿为"靠他人之死获取濒死快感的私人地狱"。
  world_alignment: "shared_canon"
  world_alignment_reasoning: |
    与狂病主线同世界观，证据链：
    (1) 主角是跨篇主角罗允（真）+ 搭档洪扬，骑摩托 / 钉钉球棒 / 燃烧瓶 / 头盔 / 猎枪 = 罗允物质特征一致（line 13, 119, 123）；
    (2) 感染者病征完全一致：狂笑 + 辱骂（"操你妈"）+ 痛觉缺失（断臂仍攻击 line 73）+ 颅脑一击毙命（line 123）+ 性嗜虐仪式（剖腹当公厕 / 婴儿塞内脏 line 361）+ 群体狂欢 + 进化（拿枪 / 火箭筒 / 合作开防护门 line 633）；
    (3) 时间锚定共享：除夕夜 = 末日爆发后"十个月"（line 13）→ 与 phase0 "2023/4/15 爆发"对齐（4 月 + 10 月 ≈ 次年春节，吻合）；
    (4) 跨篇组织"创世军"实体登场（line 777-779）：感染后的"老大哥"带创世军，胯下缝前头领陶亦仁脸皮 —— 与《恶》廖振宇杀人狂队伍 / 系列反派人类布局同源钩；
    (5) 公共意象一致：望远镜 / 监视屏多层窥镜套娃、人体作器物（人皮钉墙 line 375、人头书柜 line 389、头颅当尿池 line 653）、机场医院型"最后希望"被罗允的"西北高原科考站"替代但同构。
    彭罗斯"共形循环宇宙"（line 803）= 罗凯伯个人玄学动机，不构成新病原 / 新灾难，属人物层装饰，不动摇 shared_canon 判定。

# === 脊椎 ===

spine:
  protagonist: "罗允（真）—— 与搭档洪扬双人组；本篇是罗允第一次作为主 POV 主角出场（前两篇《学校》《燃烧》均为尾段救场 / 读者代理人功能）"
  spine_mode: "desire"
  desire_object: "进城拿到弹药武器 → 北上西北高原科考站，找到解决狂病的办法，'拯救世界'"
  shadow_desire: |
    罗允要的不是'拯救世界'成功本身 ——
    是'还有一件值得为之奔向死亡的事' ——
    '拯救世界'能不能成不重要，它只是支撑他不把枪管塞进嘴里的理由（line 53, 825）。
    所以当罗凯伯许诺'留在黄金大厦过末日最好的生活'，等于要夺走他奔向死亡的理由 ——
    这才是罗允坚拒留下的真正动机，不是物资不够好。
  conscious_vs_unconscious:
    conscious: "拿弹药 / 离开城市 / 北上科考站 / 把逝者故事情报带过去"
    unconscious: |
      罗允和洪扬'惧怕的是死亡的过程，而不是死亡本身'（line 825）——
      他们需要一个'为何去死'的理由来对抗末日的无意义；
      '拯救世界'是这个理由的载体，不是结果。
      罗凯伯最后看懂的正是这一点：罗允'逃避死亡却又不恐惧死亡'，与罗凯伯'寻找濒死却真正恐惧死亡'完全相反（line 823）。

# === 激励事件 ===

inciting_incident:
  event: "除夕夜观鸟台守夜 + 决定第二天进城去 8 公里外的实弹枪械体验馆拿弹药"
  source_anchor: "line 41-45"
  type: "decision"
  delay_from_opening_chars_approx: 1600
  function: |
    开篇先用'去年录下的春晚'的避难所群像（line 5-12）做冷启动 —— 看似与主线无关的一群人，
    后揭示即黄金大厦原住民（line 331 回扣'除夕夜望远镜看到的倒霉蛋就是大厦的人'）。
    随即切到罗允 / 洪扬观鸟台 POV：天气转冷 + 弹药将尽 + '最多再遇两次危险旅途就崩'（line 45）——
    把'进城拿武器'变成不得不冒的险，锚定全篇第一段目的地。
    同时埋下'一双隐匿的眼睛盯着他们'（line 57）—— 黄金大厦无人机监视的伏笔。

# === 戏剧问题 ===

dramatic_question:
  main: "罗允和洪扬能不能拿到武器活着离开这座感染者密集的城市，并坚持北上'拯救世界'的目标 —— 还是被黄金大厦的安逸 / 控制困住？"
  subtext: |
    在一个'物资充足的乌托邦'与'随时会死的外界'之间，
    选择继续冒险求死的人，到底是疯子，还是唯一没被末日驯化的人？
    罗凯伯代表'用钱买来的绝对安全 + 靠看他人死亡获取快感'；
    罗允代表'明知会死仍奔向远方'—— 全篇是这两种'末日生存哲学'的对峙。
  payoff: |
    答案是双向的：
    罗允挟持罗凯伯 + 故意引感染者进回音长廊（line 689-723），逼这个'迷恋濒死却怕真死'的富豪亲手关防护门体验死亡 ——
    印证罗凯伯的变态本质（他承认关门'爽'，被抓住'不爽' line 735-737）；
    而结尾创世军被十几个普通人引走（line 775-783），让罗允看见'星星之火足以燎原'，
    也让罗凯伯瞬间看懂自己为何看好这两个外人 ——
    最终双方'妥协'：罗凯伯放罗允走 + 赠武器 / 卫星电话，罗允答应转述路上故事 + 介绍幸存者来大厦（line 819）。
    不是胜利也不是失败，是两种生存哲学互相确认对方存在后的'共存'。

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: "城市中心成百上千感染者群（十字路口三路口围堵 line 145）；拿枪 / 火箭筒的黑衣感染者（创世军，line 535, 555）；商场地下层枯骨伏击型感染者（line 403）"
    layer_2_environment: "破败跨江大桥人肉腊肉林（line 63）；地下车库迷宫黑暗（line 175）；宜家副一层全黑商场（人皮钉墙 / 人头书柜 / 烤箱烤人 line 375-389, 673）；滑腻腐液紧急通道（line 379）"
    layer_3_evolution: "感染者拿火箭筒把同伴头颅插弹头射楼（line 555）；炸开地下车库电梯井爬楼（line 615）；与楼内王家乐感染者里应外合开防护门（line 633）—— 进化战术再升级到'攻坚协作'"
  interpersonal:
    layer_1: "黄金大厦阶层压迫：老张（前保安亲信）谋私 / 选炮灰外出（line 443）；板寸男杨中旭冷嘲热讽（line 207, 349）；原住民群体假笑嘲讽'拯救世界'（line 211）"
    layer_2: "罗凯伯的'过分友善'即控制：三天瞳孔指纹认证锁死全楼 / 出事全员陪葬（line 267）；外派幸存者当濒死快感来源；可能故意把罗允逼入绝境（line 739）"
    layer_3: "秦正肖（会修直升机的高层）代陆思静混入外出队救男友倪海鹏（line 357, 441）—— 大厦内部的反抗与自救线"
  internal:
    layer_1: "罗允'寄人篱下'的不甘 + '事出反常必有妖'的警觉（line 227）"
    layer_2: "罗允'我好像总是站在人群的对立面'的孤独（line 507）—— 拯救世界宣言无人共鸣"
    layer_3: "面对'留下来过最好生活'诱惑时，罗允是否还坚持奔向死亡的理由（line 769-771 罗凯伯以为罗允会动摇）"
  societal:
    - "公权力彻底缺席：唯一的'秩序'是私人富豪用几个亿建的独裁避难所（line 253）"
    - "末日财富魔幻化：一万块一瓶水 / 十来万一瓶酒 / 几个亿一栋大厦（line 249-253）—— 阶级在末日后依然贯穿"
    - "本地部署 AI 作罗凯伯唯一'商讨对象'（line 269, 623-629）—— 对人的防备拉满，只信机器"
    - "卫星电话三到五年可用（line 793）—— 与系列'手机指南针 / 离线地图仍可用'同源的'残存科技'设定"

# === Arc 框架 ===

arc_framework:
  total_arcs: 7
  notes: |
    本篇不是《燃烧》式'连续受难每 Arc 死一人'结构，而是'闯入 → 揭幕 → 对峙 → 和解'的单中心慢揭谜结构：
    Arc 1-3 = 外部生存线（进城 / 突围 / 被引入大厦），冲击力递增；
    Arc 4-6 = 内部揭谜线（识破乌托邦 → 被派外出验证 → 挟持逼出真相），价值层层下沉到'地狱秀';
    Arc 7 = 创世军救场 + 双哲学和解 + 离去余韵。
    大厦工作人员的受难片段（王家乐叛变 / 老鼠 / 厨房烤人）是穿插在 Arc 6 内的'地狱秀'平行线，
    承担'罗凯伯靠看他人死亡获取快感'的主题物证，不单列 Arc。

  arc_1_outside_watch:
    label: "除夕夜观鸟台守夜 + 决定进城拿弹药 + 被隐匿的眼睛盯上"
    value_starting: "山林苟活的微薄安宁（但弹药将尽）"
    value_ending: "上路（目的被设定）+ 被监视的不安"
    climax_event: "决定明天进城去 8 公里外射击体验馆（line 41-45）+ '一双眼睛隐匿黑暗盯着他们'（line 57）"
    source_anchor: "line 5-57"
    function: |
      用'去年录下的春晚'避难所群像冷开篇（line 5-12）—— 后揭示即黄金大厦人，全篇最大的结构性伏笔。
      建立罗允 / 洪扬关系（罗允'不想死所以得继续' line 47 / 洪扬'铁路尽头是归宿' line 313 预埋）。
      用体育馆感染者轮流砸爆人头当放炮 / 挂尸点燃当灯笼（line 25-37）建立本篇感染者'过年仪式化'恐怖基调。

  arc_2_into_city:
    label: "进城路上野猪对抗感染者 + 抵达射击馆拿到弹药 + 被感染者潮包围"
    value_starting: "上路希望"
    value_ending: "拿到弹药的喜悦瞬间被三路口围堵粉碎"
    climax_event: "设备室找到大量 .22 子弹（line 103-107）→ 出门即见街道两边几十个感染者狂奔而来（line 111）"
    source_anchor: "line 59-145"
    function: |
      野猪杀穿感染者却被群虐（line 65-79）= 本篇'再凶悍的个体也敌不过疯子群'的预演 + 后文创世军救场的反例铺垫。
      射击馆只剩 .22 小口径子弹（line 97）—— 武器升级有限，维持罗允'冷兵器拼杀 + 洪扬手枪掩护'的战斗模式。
      十字路口圆盘雕塑三路口全是感染者（line 145）= 罗允'判断把我们带到死地'的绝境，为无人机救场做落点。

  arc_3_drone_lure:
    label: "无人机引路 + 地下车库逃生 + 电梯升入黄金大厦"
    value_starting: "三路口围堵的死地"
    value_ending: "被引入未知的'净土'（罗凯伯'欢迎来到地狱里的天堂'）"
    climax_event: "小型无人机引路 + 大无人机投燃烧弹（line 163-167）→ 冲进地下车库 → 绿光逃生灯 → 电梯升至 6 层 → 中年男人'欢迎来到幸存者做梦才能到达的净土'（line 183）"
    source_anchor: "line 145-183"
    function: |
      '一切都太巧了'（line 227）—— 把'被救'本身做成可疑信号，为揭谜线张本。
      电梯柔和灯光 / 没有广告（line 181）= 末日前秩序的诡异复刻，建立'乌托邦'表层。
      '欢迎来到地狱里的天堂'（line 183）= 全篇主题的反讽题眼第一次出口。

  arc_4_utopia_unveil:
    label: "黄金大厦初识 + 饺子宴 + 罗凯伯登场 + 失眠夜识破'过分友善'"
    value_starting: "被引入净土的警觉"
    value_ending: "认知层崩坏（这座乌托邦不正常 + 罗凯伯靠笔记故事获取病态快感）"
    climax_event: |
      罗凯伯'站在堡垒窗前看下面的战争是一件乐事'（line 261）+ 罗凯伯赤裸嗅死亡日记 / 自我窒息 + 精华雨落感染者（line 289）
      + 失眠夜罗允 / 洪扬识破罗凯伯'过分友善'反常（line 265-271）
    source_anchor: "line 183-313"
    function: |
      建立黄金大厦控制系统：三重锁 + 三天认证 + 全员陪葬机制（line 267）；本地 AI 唯一商讨对象（line 269）。
      '一万块的水 / 十来万的酒'（line 249-251）= 末日财富魔幻 + 洪扬'输液港 vs PICC'对照（line 249）= 阶级贯穿末日的物证。
      罗凯伯索要罗允记录逝者故事的笔记本（line 277）+ 赤裸嗅死亡日记自我窒息（line 289）= 反派变态本质首次正面投放（但读者先于罗允知道）。
      霍乱遗书故事（line 299-301）= '疾病细菌消灭不了感染者'的 lore + 罗允乐观幻灭。

  arc_5_outside_mission:
    label: "被派外出宜家取阀门 + 秦正肖顶替陆思静混入 + 商场地狱探险 + 秦正肖揭大厦内幕"
    value_starting: "寄人篱下 + 预感被派出去当炮灰"
    value_ending: "掌握大厦真相（老张谋私 / 罗凯伯看戏 / 直升机后路 / 秦正肖会修机）+ 决定挟持罗凯伯"
    climax_event: |
      宜家副一层地狱探险（人皮钉墙 / 人头书柜 line 375-389）+ 倪海鹏被枯骨感染者拽倒暴露（line 401-405）→ 鱼线 / 燃烧瓶 / 猎枪突围（line 425-429）
      → 脱险后秦正肖坦白身份 + 大厦内幕（line 437-465）
    source_anchor: "line 313-475"
    function: |
      陆思静'又得有人出去了'的忧心（line 321）→ 罗允旁敲侧击套出'外出 = 高伤亡 + 罗凯伯有时帮有时看戏'（line 333, 461）。
      秦正肖代陆思静混入（line 357）→ 揭'老张选炮灰逼秦正肖就范'（line 441）+ '罗凯伯眼里大部分人只是数字'（line 443）。
      罗允第一次开猎枪（line 423）—— 武器使用弧光推进。
      商场地狱秀（烤箱 / 书柜人头）= 大厦外世界的'地狱'，与大厦内'天堂'形成镜像，为 Arc 6'天堂变地狱'反转铺垫。

  arc_6_hostage_hell:
    label: "挟持罗凯伯 + 大厦被创世军攻破 + 监视屏地狱秀 + 罗允逼罗凯伯亲手关门体验死亡"
    value_starting: "掌握主动权（手雷 + TNT 噱头震慑全场）"
    value_ending: "罗凯伯被逼亲手关防护门体验濒死 + 罗允印证'迷恋死亡者真死时的样子' + 大厦十人死"
    climax_event: |
      罗允用 TNT 噱头 + 洪扬拔插销手雷挟持罗凯伯（line 487-491）→ 创世军黑衣感染者拿火箭筒攻楼（line 555）
      → 王家乐叛变开防护门 / 老鼠 / 厨房烤人地狱秀（line 577-675）
      → 罗允故意向回音长廊射击引感染者进 25 层（line 689-723）→ 逼罗凯伯一个人推 700 公斤防护门保命（line 729-733）
    source_anchor: "line 475-743"
    function: |
      全篇 main climax 区。挟持戏把罗凯伯的'乌托邦控制'反转为'被自己造的系统困住'。
      监视屏地狱秀（王家乐里应外合 line 633 / 老鼠被撬肋骨掏肺 line 651 / 厨房员工烤箱烤成焦糖 line 673）
      = 罗凯伯'看别人死获取快感'的主题在他被挟持时仍在上演 —— 他甚至专注看屏忘了自己被劫持（line 655）。
      罗允'你这么迷恋死亡的人，自己真的面对死亡时会是什么样子'（line 695）= 全篇心理对峙顶点。
      罗凯伯一个人推门 + 关门后承认'爽'、被抓'不爽'（line 735-737）= 反派本质被罗允用实验逼出 + 读者-人物认知同步。

  arc_7_spark_relay:
    label: "创世军被普通人钢卷反杀引走 + 双哲学和解 + 罗允赠物离去 + 卫星电话余韵"
    value_starting: "大厦危局 + 罗凯伯劝罗允抛下众人随他直升机走"
    value_ending: "感染者被引走大厦得救 + 罗允拒走继续北上 + 双方'妥协'共存 + 陆思静卫星电话联络"
    climax_event: |
      远处十几个普通人用钢卷从坡道冲下压死感染者群（line 775）→ 创世军黑衣感染者被引走（line 783）
      → 罗允'星星之火足以燎原'（line 781）→ 罗凯伯看懂罗允'逃避死亡却不恐惧死亡'与自己相反（line 823）
      → 双方妥协 + 罗凯伯赠枪 / 子弹 / 卫星电话（line 791-819）→ 陆思静当联络员记录故事（line 837-845）
    source_anchor: "line 745-845"
    function: |
      创世军救场（line 775-783）= 全篇 closing reversal 的外部触发 —— 让罗允不再孤独（'原来不止自己在做常人难以理解的事'）。
      罗凯伯'老张是我的手套'坦白（line 765）= 揭露独裁者用替罪靶维持'手干净'的统治术。
      双方妥协协议（line 819）+ 彭罗斯共形循环宇宙玄学动机（line 803）= 罗凯伯的预知准备解释。
      结尾陆思静声音从卫星电话响起（line 837-845）+ 罗允'今天就来记录一个关于冒险的故事吧'（line 845）
      = 与《学校》日记体 / 《燃烧》转达遗言同源的'记录 = 传火'母题收束 —— 罗允从'拾日记者'升级为'故事的口述记录源'。

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "罗允故意引感染者进 25 层回音长廊 + 逼罗凯伯一个人推 700 公斤防护门保命，逼这个迷恋濒死却怕真死的富豪亲身体验死亡"
    source_anchor: "line 689-743"
    why_climax: |
      全篇两种生存哲学的引爆点：
      - 罗凯伯开篇是'用钱买绝对安全 + 站堡垒窗前看战争为乐'的旁观者 → 高潮被迫成为'真正面对死亡'的当事人
      - 罗允开篇是'寄人篱下被嘲笑的拯救世界中二青年' → 高潮成为'用对方的哲学惩罚对方'的主动者
      - 罗凯伯关门后承认'爽'（濒死逃脱快感）、被抓住'不爽'（真死恐惧）—— 罗允用一个实验逼出反派的全部本质（line 739-745）
      - 这一刻读者与罗允的认知同步完成：所有反常（外派幸存者 / 迷恋笔记 / 故意逼绝境）都指向'罗凯伯靠他人之死获取濒死快感却不敢自己玩命'

  closing_reversal:
    event: "创世军被十几个普通人钢卷反杀引走 + 罗凯伯看懂'罗允逃避死亡却不恐惧死亡'与自己相反，双方妥协共存"
    source_anchor: "line 775-823"
    function: |
      不是正义战胜邪恶，也不是反派被消灭 —— 是两种末日生存哲学互相确认后的'共存协议'：
      罗凯伯放罗允走 + 赠武器卫星电话，作为交换罗允转述路上故事 + 介绍幸存者来大厦（line 819）。
      '星星之火足以燎原'（line 781）= 罗允发现'不止自己在做常人难以理解的事'的反孤独时刻。
      与《燃烧》'活下来 = 偿还'同源但反向：这里是'活下去 = 因为还有理由奔向死亡'的肯定式余韵。

  controlling_idea_for_this_chapter: |
    "在用钱买来的末日乌托邦里，绝对安全的代价是把他人的死变成自己的快感；
     而真正没被末日驯化的人，惧怕的是死亡的过程而非死亡本身 ——
     他们带着一个'为何去死'的理由奔向远方，
     哪怕这理由（拯救世界）能不能实现根本不重要。"
    （本篇自身 controlling idea，映射全系列 candidate_a：'人性之恶比病毒更可怕 —— 病毒只是把早已腐烂的内核暴露在阳光下'：
     罗凯伯的变态在末日前就存在（购买真实虐杀录像 line 745），末日只是给了他用他人之死取乐的舞台。）

