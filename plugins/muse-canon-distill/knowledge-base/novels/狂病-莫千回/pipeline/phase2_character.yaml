    truth_core: "= 李鸾（《不详》主角）的第二人格（《搏击俱乐部》式'你是我'）——创世军是李鸾/陶亦仁的产物"
    anchor: "《不详》line 523-525 / 《51人》line 181-223,361 / 《黄金国》line 777-779"
