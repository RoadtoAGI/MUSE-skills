_meta:
  version: "0.1"
  status: |
    后置补建：本系列逆向拆解先走了"每篇 _candidates.md + 综合 _cross_part_index.md"路径，未在 Phase A 产出系统级 phase2_character.yaml。
    本文件在角色蒸馏阶段补建，作为 character-kb-distill 的结构化输入桥（接口约束：该 skill 的结构化字段唯一来源）。
    provenance：综合自 13 篇 pipeline/{篇}/phase3_spine.yaml（spine / antagonistic_forces / arc_framework）+ characters/{篇}/_candidates.md + characters/_cross_part_index.md。
  scope_note: |
    只登记【跨篇（≥2 篇登场）人物】的系统级设计。单篇人物见各篇 _candidates.md。
    本轮蒸馏目标 = protagonist 罗允（验证全链）；其余条目为 concise 版（够支撑 contrast_axes / relationships 引用），
    待各自蒸馏时再 rebuild 扩成 full 版。
  anchors_note: "行号锚点格式 = 《篇名》line N（对应该篇 .md）；场景 locator 见 scenes/scene_{前缀}-S##.md。"

# =========================================================
# 主角（系列灵魂 / 读者代理人）
# =========================================================

protagonist:
  name: "罗允"
  role_slug: "luo-yun"
  appears_in: ["学校", "燃烧", "死亡奔赴", "医院", "黄金国", "套中人", "51人(被点名)", "不详(名号被冒用)"]
  detail_level: full

  characterization: |
    独行（常与搭档洪扬"两个人行动"）的末日救援者，戴头盔、骑摩托，装备成系统：
    钉满铁钉的球棒 + 99 度生命汁水燃烧瓶 + 砍刀 + 猎枪 + 头盔 + 绿色卫衣 + 一本记录逝者故事的笔记本。
    语气"淡淡的"，话少、不煽情；心思缜密但城府浅（《医院》石浩洋天敌、被旁人评"缜密但藏不住"）。
    在多篇里以"摩托车声 + 一个救场者"的微弱符号抵达——是把 13 篇缝成一个世界的主缝线。
  characterization_anchor: "《学校》line 223-233 / 《燃烧》line 177 / 《黄金国》主 POV / 《套中人》line 695"

  daily_life: |
    末日中持续移动：救能救的人、收殓逝者、把死者的话或遗书带走（笔记本）。
    有明确私人目标地（《黄金国》line 209/499 西北高原科考站）但救人始终优先于赶路。
  daily_life_anchor: "《死亡奔赴》line 475-505（读遗书塞进笔记本）/ 《黄金国》line 209,499"

  desire_system:
    conscious: "拯救能救的人 + 把逝者的话/故事转达下去 + 奔向'拯救世界'/西北科考站这个目标"
    unconscious: |
      用"救人 / 拯救世界"为自己提供一个【支撑奔向死亡的理由】——
      他惧怕的不是死亡，是"怎么死、为何死"的过程空白（《黄金国》line 825）。
      救人是他给自己的、走向终点路上的意义支架，不是终点本身。
    flaw: |
      "救人但不强迫"推到极致：他强行让人活下来（喂药），却只转达、不替活人选择继续活——
      于是被救者的"活"变成对逝者的债务而非自己的选择（《燃烧》盲女）。
      对自身：用利他包装了奔死倾向，自己的"活"反而无人能转达。
    desire_anchor: "《黄金国》line 825 / 《燃烧》line 177-183"

  characterization_vs_truth:
    outer: "沉默淡然、装备齐整的救人者，'好人'的微弱希望符号"
    truth_under_pressure: |
      压力下他会强行越界救人（按住喂药、击杀感染者化的爱人替被救者了断），
      但绝不替被救者决定'为什么要活'——他把这一权利留给被救者本人，只负责'转达'。
      最深一层：他自己是个用'救别人活'来给自己'奔向死亡'找理由的人。
    fissure: "救别人活下去 / 自己奔向死亡——救人原则的利他外壳里，是一个不为自己求生的人"
    truth_anchor: "《黄金国》line 825 / 《燃烧》line 179-183（强行喂药 + '你也应该好好地活下去啊'）"

  voice_traits: |
    淡。低信息密度的句子承担最重的责任——报死讯、转达遗言都用平铺的陈述，不加形容词、不煽情、不安慰。
    句式短、收尾克制；常以"……吧"收口（"活下去吧""他应该很想让你活下去吧"），把判断留给对方。
    几乎不谈自己；谈别人（被救者、逝者）时反而具体。
  voice_anchor: "《燃烧》line 177-183 / 《学校》line 223（叹气合上日记本）/ 《黄金国》line 825"

  voice_boundaries:
    - "不强迫被救者必须活下去 / 必须感激——只转达逝者的话，把'继续活'的选择留给被救者本人"
    - "不替活着的人决定'为什么要活'——他给理由（逝者的托付），不替对方做决定"
    - "不冒充他人身份——与'假罗允'（吴先生/石浩洋盗用其名诱杀）形成正面对位；他始终是他自己"
    - "不丢下能救的人独自赶路——私人目标地（西北科考站）始终让位于眼前的救援"
    - "不煽情、不用大词安慰——报死讯与转达遗言都用最平的语气"

  character_arc:
    note: "活态主角，系列跨篇弧光未闭合（他仍在路上）——故不生成 canon-ending.md"
    start: "被动的见证者——《学校》尾段拾起死者日记本、叹一口气继续上路"
    turning_points:
      - "《燃烧》line 177-183：从'见证'升级为'介入'——强行喂药救盲女 + 转达周全自燃遗言，'救人但不强迫'原则成形"
      - "《死亡奔赴》line 475-505：来晚没救到，只能读死者遗书带走——见证者的镜像（从'转达'退到'传火'）"
      - "《黄金国》line 825：袒露奔死动机——救人/拯救世界只是支撑他奔向死亡的理由"
    end_internal: "把'救别人活'确立为自己奔向死亡途中的意义支架——利他者，但不为自己求生"
    core_change: "从被动见证逝者 → 主动以'转达与救助'为自己的奔死赋予理由"

