    truth_core: "病毒前就在猎杀；拒绝感染（'变成弱智没意思'）；知对错仍以施虐为乐，掌握'谁配被记住'的裁判欲"
    anchor: "《狂人日志》line 85,299,287 / 《恶》line 159,329-361"
    reconciliation_flag: "与 shi-haoyang（《医院》录音机杀手）高度疑似同一人/同型，待蒸馏时交叉定夺（见 _cross_part_index.md §reconciliation #1）"

  - name: "石浩洋"
