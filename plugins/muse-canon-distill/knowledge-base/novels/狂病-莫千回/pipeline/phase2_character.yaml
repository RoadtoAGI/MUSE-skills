# =========================================================
# 对比轴（极化关系，支撑性格真相 / 边界佐证）
# =========================================================

contrast_axes:
  - axis: "真罗允 vs 假罗允（救人原则 vs 诱杀伪装）"
    pole_a: "罗允：以真名救人、只转达不强迫、不丢下能救的人"
    pole_b: "吴先生/石浩洋：盗用'罗允'信任符号 + 带孩子的可靠男人模板，系统性诱杀整队"
    function: "全系列最大反讽——同一个'罗允'符号，一端是救赎、一端是屠宰；坐实'他者善意比恶意更危险'（善意符号可被恶人穿戴）"
    anchor: "《恶》line 159 / 《不详》line 461 / 《狂人日志》line 299（'我可以是任何人'）"

  - axis: "罗允'救人但奔死' vs 陶亦仁/创世军'死亡奔赴'"
    pole_a: "罗允：用救人给自己的奔死找意义，但把'活'留给被救者"
    pole_b: "陶亦仁创世军：把死亡当必经路障、感召他人共赴，命令追杀罗允"
    function: "两种'与死亡相处'的对位——一个用利他延缓、一个用邪教加速；罗允是创世军的猎杀目标"
    anchor: "《黄金国》line 825 / 《51人》line 181-223,361"

  - axis: "罗允'转达' vs 洪扬'现实主义'"
    pole_a: "罗允：把逝者的话当债务传火，近乎仪式"
    pole_b: "洪扬：'正常末日嘛'，把死亡当寻常，自杀背景的现实主义对照镜"
    function: "搭档间的温差——罗允的'传火'被洪扬的'寻常'校准，避免滑向圣徒化"
    anchor: "《死亡奔赴》line 475-505 / 《套中人》line 695"

