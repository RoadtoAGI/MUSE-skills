    早高峰日常 + 丧尸传闻被理性否定 / 录像揭示虐杀 / 车厢内虐杀直击 / 追尾沙丁泥罐头 /
    德鲁门玻璃门被砸 + 电轨陷阱 + 杨和修身份揭示 / 环河路中控室 + 父亲挂电话 / 拉朵直播全球同步 /
    涂血伪装试验 / 杨和修再出现时呈感染状态并反向猎杀（main climax）/ 陆霞克留下断后、以吉他迎敌 + 叙事焦点转交陆小虎

scenes:

  - scene_id: "DT-S01"
    label: "早高峰地铁口 + 陆霞克卖唱 + 上车 + 街头群殴丧尸传闻被理性否定"
    chapter: "地铁"
    source_anchor: "line 5-29"
    word_count_approx: 1500
    characters: ["陈雨琪", "刘敏", "陆霞克", "眼镜男（杨和修）"]
    pov: "第三人称游移；本场以陈雨琪为主要观察中心"
    conflict_type: "internal + interpersonal（日常摩擦）"
    beat_direction:
      function: "建立主要观察中心 + 最日常的'正常世界' + 第一颗信息炸弹被理性主义否定（反讽埋点）"
      craft_note: |
        开篇用'卖唱青年 + 嫌话多 + 想旷课' 建立最日常的早高峰地铁 —— 越日常越反衬后续灾难
        陆霞克'有点感觉像丧尸'（line 23）= 第一颗信息炸弹，立刻被眼镜男'21 世纪不会真有丧尸'（line 25）否定
        —— 反讽埋点：最先理性否定丧尸的人（杨和修）最后变成丧尸；省略了'谁是对的' 的即时确认，留给读者后知后觉
        列车跨越野福站不停车（line 27）= 系统反常第一警报，但用'怎么没有外语翻译' 这种日常困惑承担，不直接报警
        省略了陆霞克在街头亲历的完整群殴 —— 只用他的转述（line 23），把暴力放在'听说' 距离，为后续'眼见' 升级蓄势
    description: "陈雨琪刘敏快九点挤地铁 → 注意花坛卖唱的陆霞克 → 嫌他催人 → 上车被挤成压缩饼干 → 陆霞克举吉他挤入车厢自我介绍 → 转述街头车祸群殴 + 大笑路人吃断腿'像丧尸' → 眼镜男冷笑否定 → 列车跨越野福站不停车"

  - scene_id: "DT-S02"
    label: "野福站血迹 + 眼镜男手机慢放录像揭示撕扯孩童"
    chapter: "地铁"
    source_anchor: "line 31-39"
    word_count_approx: 700
    characters: ["陈雨琪", "刘敏", "陆霞克", "眼镜男（杨和修）"]
    pov: "陈雨琪"
    conflict_type: "external（认知揭示）"
    beat_direction:
      function: "多层窥镜第一层 —— 把'街头传闻' 升级为'眼见为实的虐杀'"
      craft_note: |
        '车速够快只看到闪烁人影 + 站台玻璃大片红印'（line 31）—— 用'看不清' 制造悬念，比直接看清更恐怖
        眼镜男手机慢放录像（line 33）= 关键手艺：不是肉眼直击，而是'录像慢放' 这层中介
        —— 多层窥镜套娃的第一层（后面还有徐海水监控 + 拉朵直播），见证机制层层嵌套
        撕扯孩童只给'两个人影一左一右把瘦小身影撕开'（line 33）—— 用剪影 + 慢放定格承担，省略血肉细节
        与后面车厢内的'直写虐杀'（DT-S03）形成对照：远距离用省略，近距离才直写
    description: "路过野福站只看到闪烁人影 + 站台玻璃大片红印 → 眼镜男手机慢放录像 → 玻璃门外两人把孩童般瘦小身影撕开 → 陈雨琪要过手机看 → 确认血字 + 几个慢放画面足够让人明白发生了什么"

