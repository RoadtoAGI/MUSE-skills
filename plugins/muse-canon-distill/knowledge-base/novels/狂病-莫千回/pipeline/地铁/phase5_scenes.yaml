  - scene_id: "DT-S05"
    label: "德鲁门站地狱橱窗 + 合金锤预警与玻璃破裂 + 电轨陷阱断后战"
    chapter: "地铁"
    source_anchor: "line 95-149"
    word_count_approx: 2600
    characters: ["陈雨琪", "刘敏", "陆霞克", "眼镜男（杨和修）", "德鲁门站感染者群", "前跑青年"]
    pov: "第三人称游移；陈雨琪起始，追逐后转向陆霞克与杨和修"
    conflict_type: "external"
    beat_direction:
      function: "Arc 3 主体 —— 玻璃门安全感被击穿 + 感染者观察伤亡后调整行动"
      craft_note: |
        德鲁门站扶手挂残肢'装尸物'（line 95）+ 扶梯卷轮拽肠子（line 97）= 站台地狱橱窗意象，'惨白明亮灯光中刺眼真实'（line 99）
        穿制服感染者用合金逃生锤砸尸体；杨和修预判它能破坏玻璃，具体破门动作留白，随后以碎裂声交付结果（line 111-113）
        '工作人员 + 专业工具' 的组合给出高抗压玻璃的具体失效条件，也确认感染者保留工具使用能力
        电轨陷阱（line 121）= 理性者杨和修用环境物理作武器的战术智慧
        首批感染者触电后，余者停在铁轨边并尝试绕开；陆霞克随后用挑衅试探其愤怒反应（line 137-147）
        陆霞克舍不得吉他改用扩音器 + 皮带铜扣（line 131-135）= 喜剧化执念，吉他道具弧光的第一笔
        前跑青年触电死（line 117）用'笔直僵硬尸体' 完成态承担，不写触电过程
    narrative_evidence:
      presentation: "先让小队隔着玻璃观察并蹲行潜过；杨和修看见制服感染者拿合金锤砸尸体并推断其可能破坏玻璃，具体破门动作留白，随后由碎裂声把潜行切成追逐；追击再收窄到尸体、电轨和岔道口"
      transition_anchor: "逃生锤预警与玻璃破碎声把潜行切成追逐；僵直尸体和‘小心点，有电’把追逐切成环境陷阱"
      knowledge_change: "人物先相信高抗压玻璃能隔绝徒手攻击；推断与随后发生的玻璃破裂证明屏障仍会失效；电轨首次奏效后，余下感染者又从伤亡中调整行动"
      cross_thread_effect: "感染者行为认知线连续改变逃生线的战术；玻璃和电轨两个解法都只获得有限时间"
      effect: "压力从隔墙观察升级为破门后的追击，再升级为会观察的对手；每个解法都缩短自身有效期并迫使角色换招"
      source_anchor: "地铁.md:109-147"
    description: "德鲁门站挂满残肢 + 扶梯卷轮拽肠子 → 蹲低隐蔽前进 → 青年承受不住狂奔 → 陈雨琪与光头疯子对眼 → 杨和修据工作人员感染者手中的合金锤预判破门 → 碎裂声确认玻璃失效，感染者跳进隧道追击 → 前跑青年触电死 → 眼镜男设电轨 + 尸体陷阱断后 → 陆霞克改用扩音器皮带 → 余下感染者观察伤亡后停在铁轨边 → 陆霞克言语挑衅使其再度冲锋"

