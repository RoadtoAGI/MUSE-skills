  - scene_id: "DT-S08"
    label: "联系家人 + 杨和修父亲只响一声被挂断（静默炸弹）"
    chapter: "地铁"
    source_anchor: "line 199-227"
    word_count_approx: 1555
    characters: ["陈雨琪", "刘敏", "陆霞克", "杨和修"]
    pov: "第三人称游移；陈雨琪、陆霞克、杨和修"
    conflict_type: "internal + interpersonal"
    beat_direction:
      function: "全篇最关键的'静默炸弹' —— 埋下杨和修冒险动机 + 情绪裂痕 + 陆小虎伏笔"
      craft_note: |
        陆霞克砸贩卖机拿果茶 vs 杨和修死脑筋扫码（line 201）= 用'特殊时期特殊对待' 的小冲突勾两人性格差
