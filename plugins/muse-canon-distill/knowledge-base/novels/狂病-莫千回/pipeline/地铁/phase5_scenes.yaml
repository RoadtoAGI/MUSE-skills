# === 节奏曲线 ===

pacing_curve:
  arc_1: "缓"  # 早高峰日常 + 传闻被否定
  arc_2: "急 → 极急"  # 录像揭示 → 车厢虐杀 → 追尾沙丁泥罐头
  arc_3: "急"  # 德鲁门玻璃门被砸 → 电轨陷阱断后 → 杨和修身份揭示
  arc_4: "缓"  # 环河路中控室援助 → 父亲挂电话（静默炸弹）→ 拉朵直播
  arc_5: "缓 → 极急 + 转"  # 涂血计划缜密推论（缓蓄势）→ 暗杀反向猎杀（极急 + 沦陷转折）
  arc_6: "急 → 静 → 余韵"  # 走出隧道追击 → 陆霞克留下断后 → 叙事焦点转交陆小虎
  notes: |
    希望橱窗型结构 —— Arc 4 是唯一较长的'缓'（信息揭示 + 微喜剧），为 Arc 5 深渊蓄势
    Arc 5 内部有'缓（缜密推论）→ 极急（沦陷）' 的内部反转，是全篇冲击力顶点
    Arc 6 用'静（黄昏弹吉他）+ 余韵（POV 转交）' 收束，与开篇车站口吉他声呼应

