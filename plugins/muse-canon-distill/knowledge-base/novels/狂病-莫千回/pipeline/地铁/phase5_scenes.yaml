      craft_note: |
        '我们好像杀人了'（line 153）+ 杨和修'以前做的都是救人，杀人是第一次'（line 153）
        —— 把'医生 = 救人' 与'此刻 = 杀人' 的矛盾摆上台面，为他后续沦陷成反向猎手做最强烈道德对照
