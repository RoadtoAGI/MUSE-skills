        —— 全篇最关键的静默炸弹：一个'只响一声' 承担多层（父亲可能还活着 + 在躲疯子 + 自己的电话害了他）
        父亲的安危增加杨和修尽快出去并承担试验的动机，也打开他的情绪裂隙
        '杨和修脚下水瓶掉地'（line 213）= 用道具失手承担情绪失态，不直接写他崩溃 —— 省略式情绪
        陆霞克弟弟陆小虎首次被提及（line 207-209，双胞胎，在机场'好像还有军队'）= 末段 POV 转交的伏笔
        陆霞克转告陈雨琪'手机静音别再打'（line 223）→ 全队停止电话与短信，转向新闻求证但得不到可靠定论（line 227）
    narrative_evidence:
      presentation: "先并列四人联系亲人的不同结果并提前命名陆小虎；随后以水瓶坠地暴露杨和修失态，延迟到陆霞克追问后才交付一声挂断及其推论，最后写全队停止电话与短信"
      transition_anchor: "站台闷响、水瓶落地、‘只响了一声’和所有人低头看手机，把休息切换为场外亲人可能遇险的危机"
      knowledge_change: "无人接听只代表情况未知；主动挂断使人物推断亲人正在藏匿，手机由求援资源变成位置暴露风险"
      cross_thread_effect: "父亲暗线增加杨和修后续独自试验的动机；陆小虎被提前命名；全队转向不可靠的新闻求证"
