_meta:
  version: "1.0"
  chapter: "地铁"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    Arc 6 段 —— 线性推进型多线小队结构，沿一条地铁线（车厢 → 站台 → 隧道 → 中控室协助 → 风井口 → 山林出口）推进
    每个站台 / 出口都是一个'希望橱窗'：先给一线希望，再用更糟的地狱浇灭

# === Arc 1: 早高峰地铁 ===

arc_1:
  label: "早高峰地铁 + 陆霞克卖唱 + 上车 + 街头群殴丧尸传闻"
  source_anchor: "line 5-29"
  sequences:
    - seq_id: "1.1"
      label: "地铁口卖唱青年 + 陈雨琪刘敏想旷课"
      source_anchor: "line 5-13"
      core_conflict: "日常烦躁 vs 陆霞克卖唱的'怪'"
      progression: |
        陈雨琪 + 刘敏快九点还挤地铁 → 注意到花坛上卖唱的陆霞克
        陈雨琪吐槽'禁止践踏' 牌子 + 想第一节课直接旷
        陆霞克催乘客别挡道 → 陈雨琪反感翻白眼进站
        日常选最靠前车厢 + 被挤成压缩饼干
      seq_climax: "以陈雨琪为主要观察中心建立最日常的早高峰地铁'正常世界'"

    - seq_id: "1.2"
      label: "陆霞克挤入车厢 + 街头群殴 + 吃人传闻 + 理性否定丧尸"
      source_anchor: "line 15-29"
      core_conflict: "陆霞克的'丧尸' 直觉 vs 眼镜男的理性否定"
      progression: |
        车门将关时陆霞克举吉他挤入 → 认出陈雨琪打招呼 + 自我介绍（酒吧驻唱）
        陈雨琪嫌他话多 → 陆霞克转述街头车祸 + 群殴 + '大笑路人捡断腿边笑边吃 + 有点像丧尸'
        眼镜男冷笑'21 世纪不会真有丧尸' → 列车跨越野福站不停车（line 27）
      seq_climax: |
        第一颗信息炸弹（吃人传闻）被理性主义否定（line 25）—— 反讽埋点：最先否定的人最后变成丧尸
        列车跨越野福站不停车（line 27）= 系统反常第一警报

# === Arc 2: 车厢虐杀 + 追尾脱轨 ===

arc_2:
  label: "录像揭示站台撕扯 + 车厢内虐杀爆发 + 眼镜男紧急制动 + 追尾脱轨"
  source_anchor: "line 31-93"
  sequences:
    - seq_id: "2.1"
      label: "野福站血迹 + 眼镜男手机慢放录像揭示撕扯孩童"
      source_anchor: "line 31-39"
      core_conflict: "日常认知 vs 录像里的虐杀证据"
      progression: |
        路过野福站只看到闪烁人影 + 站台玻璃大片红印（血？）
        眼镜男手机录像慢放 → 玻璃门外两人把孩童般瘦小身影撕开（line 33）
        陈雨琪要过手机看 → 确认血字 + 几个慢放画面足够让人明白
      seq_climax: "手机慢放录像（line 33-35）把'街头传闻' 升级为'眼见为实的虐杀' —— 多层窥镜第一层"

    - seq_id: "2.2"
      label: "莱恩站不停 + 车厢内'杀人了' 尖叫 + 眼镜男紧急制动"
      source_anchor: "line 39-53"
      core_conflict: "拥挤车厢的逃生欲 vs 无处可逃"
      progression: |
        莱恩站也不停车 → 车厢焦躁 + 拍驾驶门
        远处尖叫（别的车厢）→ 刘敏吓哭问'丧尸病毒' → 陆霞克'真有的话挤成沙丁鱼罐头谁也跑不掉'
        本车厢'杀人了' 尖叫 → 眼镜男打开盒子扭按钮拉紧急制动 → 紧急刹车所有人前倒
        车门开 → 陈雨琪被挤滚出车门到隧道
      seq_climax: "眼镜男（杨和修）首次以'有行动力的理性者' 身份救人（拉制动）—— 灾难从窗外拉进车厢"

    - seq_id: "2.3"
      label: "车厢内虐杀直击 + 后续车厢感染者跳下 + 第一波扑击"
      source_anchor: "line 55-65"
      core_conflict: "幸存者 vs 车厢内大笑虐杀的感染者"
      progression: |
        陆霞克蹲地心疼吉他 → 陈雨琪看见车厢内厮杀
        大笑男撕咬老头脑袋咬下眼球当撒尿牛丸（line 57）+ 四人踩断西装男脖子鼓掌（line 61）
        断肢 / 折磨 / 残害 / 强暴 —— 所有人大笑如野兽对待同类（line 63）
        后面车厢也跳下行为诡异人影 → 大笑人扑陈雨琪 → 眼镜男打翻救她
      seq_climax: "车厢内虐杀直击 —— 莫千回标志性'游戏化嗜虐' 直写（与省略式死亡形成对照）"

    - seq_id: "2.4"
      label: "后车追尾脱轨 + 沙丁泥罐头 + 逃出 + 断手"
      source_anchor: "line 67-93"
      core_conflict: "幸存者 vs 追尾死亡机器"
      progression: |
        眼镜男大喊'后面地铁撞过来了快向前跑'（line 67）→ 互相搀扶狂奔 + 呕吐
        后车追尾 → 车头侧翻滚动 + 人体被液压成'沙丁泥罐头汁水'（line 71）→ 跑出一段才幸免
        陈雨琪甩肩膀甩落一只断手（line 81）→ 陆霞克'冲撞甩出的尸体碎块'
        眼镜男提议往德鲁门站走找信号 + 玻璃门高抗压科普（line 87-91）
      seq_climax: |
        追尾'沙丁泥罐头'（line 71）= 车祸级群体虐杀意象顶点
        no-time-to-mourn 节奏：刚逃出就要躲追尾 + 断手插曲（line 81）冲击认知

# === Arc 3: 德鲁门站 + 电轨陷阱断后 ===

arc_3:
  label: "德鲁门站地狱橱窗 + 合金锤预警与玻璃破裂 + 电轨陷阱断后战 + 杨和修医生身份揭示"
  source_anchor: "line 95-159"
  sequences:
    - seq_id: "3.1"
      label: "德鲁门站地狱橱窗 + 合金锤预警 + 玻璃破裂"
      source_anchor: "line 95-113"
      core_conflict: "蹲低隐蔽 vs 玻璃门将破"
      progression: |
        德鲁门站扶手挂满残肢'装尸物'（line 95）+ 扶梯卷轮拽肠子（line 97）
        眼镜男让蹲低隐蔽侧边前进 → 一年轻青年承受不住狂奔 → 其他人跟跑
        陈雨琪看到拍打玻璃门的半截身体 + 光头疯子对上眼（line 107）
        眼镜男发现工作人员感染者拿合金逃生锤砸尸体脑袋，并预判它能击碎玻璃（line 111）
        具体破门动作留白；碎裂声与被推入隧道的大块玻璃交付结果，感染者随即追来（line 113）
      seq_climax: |
        合金锤预警与随后传来的碎裂声连接屏障失效（line 111-113）—— '高抗压玻璃门' 的安全条件被专业工具击穿
        与《燃烧》phase1 safe_havens '消防锤可破' 同源

    - seq_id: "3.2"
      label: "前跑青年触电死 + 电轨陷阱计划 + 杨和修陆霞克断后"
      source_anchor: "line 115-127"
      core_conflict: "感染者追击 vs 带电铁轨陷阱"
      progression: |
        前面青年触电变僵硬尸体（line 117）→ 眼镜男喝止'小心有电'（line 119）
        眼镜男计划：两女生跨尸体避铁轨前跑 + 他和一男断后引诱感染者踩电轨（line 121）
        眼镜男问陆霞克'你会来帮我吧' → 陆霞克坚定点头（line 123）
        陈雨琪刘敏跨尸体进左隧道 → 陆霞克眼镜男谨慎后撤引诱
      seq_climax: "电轨 + 尸体陷阱成型 —— 用环境物理（带电铁轨）作武器 = 理性者杨和修的战术智慧"

    - seq_id: "3.3"
      label: "电轨陷阱战 + 感染者观察伤亡后停步 + 言语挑衅"
      source_anchor: "line 127-149"
      core_conflict: "引诱感染者触电 vs 余者观察伤亡后调整行动"
      progression: |
        感染者踩尸体扑来 → 被打翻接触电轨'垫死'（line 129）
        陆霞克舍不得吉他 → 改用便携扩音器 + 皮带铜扣（line 131-135）
        剩余感染者见同伴触电后停在铁轨边（line 137）→ 眼镜男提出'他们在思考？'
        眼镜男尝试沟通失败 → 陆霞克挑衅'有种过来呀' → 感染者被激怒压倒避险本能冲上电轨送死（line 145-147）
      seq_climax: |
        本场确认感染者会观察同伴伤亡、停步并尝试避开铁轨；陆霞克随后用挑衅试探其愤怒反应（line 137-147）

    - seq_id: "3.4"
      label: "'我们杀人了' + 杨和修医生身份揭示 + 四人重聚"
      source_anchor: "line 151-159"
      core_conflict: "救人者的身份 vs 第一次杀人"
      progression: |
        铁轨上满是僵尸 → 二人瘫坐 → 陆霞克'我们好像杀人了'（line 153）
        眼镜男'以前做的都是救人，杀人是第一次'（line 153）
        陆霞克拿起掉落证件 → '杨和修，东江 CC 联合医院' 骨科医生（line 155）
        陈雨琪刘敏从前隧道折返重聚 → 杨和修批评'两个女的过来送人头'（line 161）
      seq_climax: |
        杨和修身份揭示（line 155）—— '救人医生第一次杀人' 的反讽身份建立
        '以前做的都是救人' 为他后续沦陷成反向猎手做最强烈的道德对照

# === Arc 4: 环河路中控室 + 全球同步 + 父亲挂电话 ===

arc_4:
  label: "环河路安全站台 + 徐海水中控室协助 + 拉朵直播全球同步 + 杨和修父亲挂电话"
  source_anchor: "line 161-249"
  sequences:
    - seq_id: "4.1"
      label: "环河路意外安全 + 徐海水中控室登场 + 给装备给路线"
      source_anchor: "line 161-197"
      core_conflict: "继续走的危险 vs 中控室提供的有限援助"
      progression: |
        陈雨琪带来好消息：中控室没沦陷 + 环河路站安全（line 163）
        环河路站果然无感染者（但仍遍地尸骸 + 染血'铁罐头' 列车 line 165-167）
        报警电话占线（line 173）→ 徐海水通过摄像头 + 电梯紧急电话沟通（line 175-179）
        徐海水说全线沦陷'人间炼狱'+ 给警用装备箱密码 9527（防暴盾 / 警棍 line 189）
        给三个路线选项：守环河路 / 风井口 / 机场线山林出口（line 189）
      seq_climax: "徐海水中控室登场 —— 唯一残存的'制度性善意'，上帝视角但被困、无能为力"

    - seq_id: "4.2"
      label: "站台休息 + 联系家人 + 杨和修父亲只响一声被挂断"
      source_anchor: "line 199-227"
      core_conflict: "对家人的牵挂 vs 联系即暴露的恐惧"
      progression: |
        关闭玻璃门 + 换手机号 → 短暂安全
        陆霞克砸贩卖机拿果茶 vs 杨和修死脑筋扫码（line 201）
        陈雨琪联系不上父母 + 刘敏父亲困车间（line 205）→ 陆霞克想起弟弟陆小虎打不通（line 207-209）
        杨和修给父亲打电话只响一声被挂断（line 215）→ 推断'铃声暴露父亲位置'（line 219）
        陆霞克转告陈雨琪'手机静音别再打'（line 223）→ 风险推断扩散至全队
        全队停止电话与短信，转向新闻求证却得不到可靠定论（line 227）
      seq_climax: |
        一声挂断经人物推断改写了全队的通信选择（line 215-227）
        父亲暗线增加杨和修后续独自试验的动机，手机从求援资源转为潜在暴露源
        陆霞克弟弟陆小虎首次被提及（line 207-209）—— 末段 POV 转交的伏笔

    - seq_id: "4.3"
      label: "刷手机新闻 + 拉朵海外剖腹直播 + 全球同步确认"
      source_anchor: "line 227-241"
      core_conflict: "求证真相 vs 信息废墟 / 直播里的地狱"
      progression: |
        新闻几乎空白 + 粗糙视频众说纷纭（暴乱 / 病毒 / 审判日 line 227）
        国外视频显示全球同步动乱（line 229）+ 仍有人直播
        陈雨琪点进'爱冒险的拉朵' 直播 → 海外食人 → 主播被护林员感染者剖腹 + 手机塞进肚子搅动（line 239）
        陈雨琪退出'整个世界都疯了'（line 241）
      seq_climax: |
        拉朵直播 = 多层窥镜套娃（直播屏中的剖腹）+ 全球同步爆发确认（line 229-241）
        与《学校》line 93 / phase1 public_imagery 同源

# === Arc 5: 风井口埋伏 + 涂血伪装 + 暗杀反向猎杀 ===

arc_5:
  label: "风井口感染者埋伏 + 杨和修涂血伪装计划 + 暗杀刘敏 + 反向猎杀"
  source_anchor: "line 243-347"
  sequences:
    - seq_id: "5.1"
      label: "决定去风井口 + 博德之门玩笑 + 设备管理室拿工具"
      source_anchor: "line 243-267"
      core_conflict: "守 vs 走的两难 vs 队伍短暂的人情温度"
      progression: |
        杨和修主张去风井口（近处有警局 + 郊区人少 line 243）
        徐海水群聊警告隧道里出现大量感染者 → 刘敏决定'走，去风井口'（line 249）
        计划路线 + 带果汁补给 → 陆霞克'游戏团队' 玩笑 + 杨和修'博德之门吟游诗人' 吐槽（line 259-261）
        陈雨琪对回归正常生活多了憧憬（去陆霞克酒吧喝一杯 line 263）→ 到设备管理室拿撬棍剪线钳（line 267）
      seq_climax: |
        博德之门吟游诗人玩笑（line 259-261）= 黑色幽默微喜剧瞬间，为后面惨烈反衬
        陈雨琪'憧憬正常生活'（line 263）—— 希望的最高点，紧接深渊

    - seq_id: "5.2"
      label: "推开逃生通道门 + 风井口已沦陷 + 感染者冲出"
      source_anchor: "line 267-291"
      core_conflict: "逃离的希望 vs 风井口已是地狱"
      progression: |
        推开铁门 → 浓烈血腥味恶臭喷出（line 269）→ 杨和修喝'快挡' + 陆霞克架防暴盾
        感染者冲出卡门 → 拽出 + 杨和修警棍敲'眼髓' → 死死拽住铁门 + 徐海水开门禁（line 271-275）
        杨和修描述风井口地狱：爬梯挂半截尸体 + 头颅当飞机杯（line 283）
        徐海水道歉'风井口怎么会有人'→ 陈雨琪'滞留工作人员也想逃'（line 285-287）
      seq_climax: |
        风井口已沦陷（line 283）—— 第三个'希望橱窗' 浇灭（继德鲁门 / 环河路之后）
        '现在只剩冒险从隧道出口出去'（line 289）—— 希望降到谷底

    - seq_id: "5.3"
      label: "杨和修提出涂血伪装假说 + 设计试验 + 检查皮肤屏障"
      source_anchor: "line 293-321"
      core_conflict: "疯狂的冒险计划 vs 唯一的生存机会"
      progression: |
        杨和修提涂血伪装计划（丧尸剧桥段 line 295）→ 缜密推论：
          感染者攻击正常人 → 靠气味识别同类（line 301）
          病毒不空气传播（与尸体共处不感染 line 301）+ 体液接触感染（line 313）
        拒绝陆霞克一起冒险（'冒险的人最好只有一个，另一个保护女生' line 305）
        刘敏不想他冒险 → 杨和修坚持'给大家试错'（line 309）
        陆霞克检查杨和修皮肤无伤口（line 313）→ 杨和修让其他人去逃生通道外等（line 315）
      seq_climax: |
        涂血伪装假说被组织成可执行试验（line 295-315）—— 全篇 main climax 的引信
        气味识别、不经空气、体液接触与皮肤屏障均属于杨和修依据现象提出的假说，本篇没有完成验证

    - seq_id: "5.4"
      label: "杨和修祈祷找父亲 + 门后过程留白 + 暗杀刘敏 + 反向猎杀"
      source_anchor: "line 323-347"
      core_conflict: "好人 vs 沦陷"
      progression: |
        杨和修关门 + 看'老爹' 联系人 + 无神论者第一次祈祷找父亲（line 323）
        涂血试验和感染发生过程整体省略；下一次呈现杨和修时，他已呈感染状态
        刘敏进去和杨和修告别（line 327）
        徐海水群聊'逃生了，你们同伴把另外一个给杀了'（line 329）→ 陈雨琪陆霞克冲进去
        陆霞克喊'别装了' → 杨和修笑声越来越大 + 扔下刘敏人头（line 333-335）
        浑身鲜红的杨和修'这次我会慢慢的' → 狂笑冲下楼打断陆霞克双脚（line 335-339）
        陈雨琪拽出陆霞克 + 推上铁门拉门栓 → 杨和修'会见面的，好好治疗你们'（line 341-345）
      seq_climax: |
        杨和修再次出现时呈感染状态 + 暗杀刘敏 + 反向猎杀（line 329-345）= 全篇 main climax 第一引爆点
        刘敏死法用'扔人头 + 越来越大的笑声' 省略承担（line 335）
        '太快了，这次我会慢慢的'（line 335）—— 感染者保留智力 + 嗜虐语言
        最可信赖的决策者把判断力、力量和医生语言转为猎杀工具；感染时点与途径留白

# === Arc 6: 留下断后 + 吉他迎敌 + 叙事焦点转交陆小虎 ===

arc_6:
  label: "陈雨琪陆霞克逃出隧道 + 陆霞克留下断后并以吉他迎敌 + 叙事焦点转交陆小虎"
  source_anchor: "line 349-393"
  sequences:
    - seq_id: "6.1"
      label: "徐海水广播掩护 + 二人渡过最后两站 + 走出隧道"
      source_anchor: "line 349-367"
      core_conflict: "陆霞克双脚受伤的拖累 vs 徐海水的远程掩护"
      progression: |
        徐海水打开所有门禁 + 广播吸引感染者 → 看监视器揪心（line 349-351）
        陈雨琪搀扶受伤陆霞克走走停停 → 陆霞克安慰'刘敏走得快没受折磨'（line 355）
        陆霞克'杨和修是好人，但再好的好人也会变坏种'（line 357）→ 陈雨琪让他闭嘴
        徐海水广播掩护渡过第一 + 第二站台（line 359-363）→ 黄昏走出隧道（line 367）
      seq_climax: |
        陆霞克'再好的好人也会变坏种'（line 357）= 全篇主题的角色内口述（controlling_idea 的角色化表达）
        徐海水'再也帮不到，但一切都会好起来的'（line 369，半小时前发送）—— 制度性善意的告别

    - seq_id: "6.2"
      label: "翻墙上山 + 杨和修带感染者群追来 + 陆霞克推开陈雨琪"
      source_anchor: "line 367-385"
      core_conflict: "一起逃 vs 断后牺牲"
      progression: |
        陈雨琪推陆霞克翻墙 → 陆霞克解吉他扔墙外（'摔一下不会坏'）+ 心疼（line 373）
        上山到山顶 → 陆霞克脚踝肿成馒头要休息（line 375）
        发现隧道口方向出现人影 → 放大看见浑身鲜红 + 脖子挂两条人腿的杨和修（line 377）
        杨和修抬头看向陆霞克方向 → 陆霞克推开陈雨琪 + 爆粗口'别傻了我能拖延时间'（line 379-385）
      seq_climax: |
        杨和修脖子挂两条人腿带感染者群翻墙（line 377）—— 沦陷的好人作为'群体核心' 意象
        陆霞克'这世界并不是什么东西都需要意义'（line 383）= 反英雄式赴死宣言

    - seq_id: "6.3"
      label: "陆霞克留下断后并以吉他迎敌 + 时间跳跃 + 叙事焦点转交陆小虎"
      source_anchor: "line 387-393"
      core_conflict: "陆霞克赴死 vs 弹完最后一首歌的尊严"
      progression: |
        陈雨琪红着眼眶拥抱后从另一边跑下山头（line 387）
        陆霞克拿出吉他 + 幻想拽手雷的英雄 + 苦笑'早知道就唱摇滚结束了'（line 389）
        弹响吉他（几次没成功最终成功）→ 闭眼仿佛回到清晨车站口 → 唱完最后一首
        杨和修带感染者来到面前 → 陆霞克吉他抡向扑来的杨和修（line 391）
        '几天后' 陆小虎在医院遇到陈雨琪 → 不明白她为何哭 / 为何格外关心他（line 393）
      seq_climax: |
        陆霞克留下断后，唱完最后一首后以吉他迎敌（line 387-391）= 全篇 main climax 收束；具体结局留白
        吉他从被保护、拒绝消耗的珍贵物 → 逃生负担 → 终局演奏与迎敌武器的道具弧光完成
        POV 转交陆小虎（line 393）= 文学层面'传火' + 戏剧性反讽封闭

# === 序列间冲击力递增 ===

escalation_check:
  arc_1_to_2: "日常烦躁 + 传闻 → 灾难进入车厢（眼见虐杀 + 追尾死亡机器）"
  arc_2_to_3: "逃出车厢 → 站台地狱橱窗 + 玻璃门被砸开 + 第一次'我们杀人了'（认知 + 道德层崩坏）"
  arc_3_to_4: "电轨陷阱断后 → 环河路意外安全（希望被外部赠予）+ 全球同步确认 + 杨和修情绪裂痕"
  arc_4_to_5: "短暂安全 + 憧憬正常生活 → 风井口已沦陷 + 杨和修试验过程留白、再出现时呈感染状态 + 暗杀刘敏 + 反向猎杀（深渊）"
  arc_5_to_6: "杨和修反向猎杀 + 陆霞克双脚受伤 → 陆霞克留下断后并以吉他迎敌 + 陈雨琪逃出 + 数日后叙事焦点转交"
  curve_shape: "Arc 1 缓 → Arc 2 急 → Arc 3 急 → Arc 4 缓（希望 + 信息）→ Arc 5 极急 + 转（沦陷）→ Arc 6 急 → 静 → 余韵（POV 转交）"
  curve_note: |
    希望橱窗型结构 —— 三个站台 / 出口（德鲁门 / 环河路 / 风井口）依次给希望又收回
    Arc 4 是全篇唯一较长的'缓'（中控室援助 + 信息揭示 + 微喜剧），为 Arc 5 的深渊蓄势
    Arc 5 的'好人沦陷' 是冲击力顶点，Arc 6 用 POV 转交收束余韵

