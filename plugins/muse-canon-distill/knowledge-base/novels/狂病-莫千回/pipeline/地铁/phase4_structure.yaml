multi_thread_notes:
  pov_structure:
    primary: "第三人称游移，以陈雨琪为主要观察中心；关键段落进入陆霞克、杨和修、徐海水和陆小虎的内在状态"
    function: |
      陈雨琪的主要观察位置让读者以平视角度经历逃生；游移聚焦补入她无法直接掌握的战术判断、私人动机与远程援助。
      尾声再转向陆小虎，以知识差承接幸存余波。

  secondary_pov_inserts:
    - thread: "徐海水中控室插入式 POV"
      anchors: "line 277, 349-353"
      function: |
        '上帝视角无能为力的见证者' —— 徐海水通过监视器看小队，能看见但救不了
        他的视角插入承担两个功能：
        (1) 提供小队看不见的'外部空间信息'（隧道里感染者动向 / 风井口监控）
        (2) 制造'看得见却帮不上' 的张力 —— 制度性善意的无能（line 349 '一切都没救了吗'）
        徐海水的 POV 是陈雨琪 POV 的对位：一个在地狱里走，一个在玻璃后看
    - thread: "陆霞克插入段（跑在最后回头看）"
      anchors: "line 113-115"
      function: "短暂切到陆霞克视角承担'断后者' 的紧张 —— 为他后续断后牺牲埋视角伏笔"

  parallel_external_threads:
    - "拉朵海外剖腹直播（line 231-241）—— 通过手机屏幕插入的'平行空间叙事线'，证明全球同步沦陷 + 多层窥镜套娃"
    - "杨和修父亲线（line 215, 323）—— 通过电话 / 联系人'老爹' 承担的'离场角色线'，是杨和修冒险动机的隐线，从不正面出场但驱动 main climax"
    - "陆小虎机场线（line 207-209 提及 + line 393 接管）—— '离场角色线' 浮出为末段 POV，承担封闭"

  pov_handoff:
    from: "陈雨琪"
    to: "陆小虎"
    anchor: "line 393"
    timing: "全篇收束处，时间跳跃'几天后'"
    mechanism: |
      陆小虎全篇只在 line 207-209 被陆霞克口头提及（双胞胎弟弟，在机场那边'好像还有军队'）
      末段时间跳跃 + 视角骤然交给从未在主线出场的陆小虎
      由陆小虎一连串'不明白'（为何陈雨琪一见他做自我介绍就哭 / 为何对他格外关心 / 是不是爱情）承担封闭
    function: |
      POV 转交是本篇最关键的结构手艺，承担三重功能：
      (1) 戏剧性反讽收束：读者知道陆霞克留下断后的前因，具体结局留白；陆小虎只看见陈雨琪的哭泣与关心
          —— 反讽张力压在'读者知前因而新观察者不知' 的落差上
      (2) 关系余波：陈雨琪与陆小虎形成后续联系，具体动机由原文保留
      (3) 把'见证' 的责任从陈雨琪（亲历者）转给陆小虎（迟到者）再转给读者 ——
          与《学校》罗允拾日记本 / 《燃烧》罗允转达遗言同源的'读者代理人' 机制，
          本篇让亲历者陈雨琪与迟到者陆小虎直接相遇，并把解释权留在二人的认知差中

