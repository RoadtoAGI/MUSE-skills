_meta:
  version: "1.0"
  chapter: "地铁"
  source: "novels/狂病-莫千回/地铁.md"
  word_count_approx: 22500
  validated_against_source: true
  form_note: |
    多线幸存者小队 + 第三人称游移（以陈雨琪为主要观察中心）+ 末段叙事焦点转交陆小虎
    全篇用一条封闭地铁线（站台 → 隧道 → 风井口 → 山林出口）的线性推进承载一个'希望符号反复落空' 的连续受难结构
    主舞台是地铁系统：站台 = 一个个'地狱橱窗'，玻璃门 = 高抗压但可破的脆弱安全感

# === 脊椎 ===

spine:
  protagonist: "陈雨琪（大学生，本要去上课，被困地铁系统）"
  pov_structure:
    primary: "第三人称游移，以陈雨琪为主要观察中心；叙述按场景需要进入陆霞克、杨和修、徐海水和陆小虎的感受与判断"
    secondary_inserts:
      - "徐海水（中控室执勤人员）插入式 POV —— 通过监视器看小队（line 277, 349-353）；功能 = '上帝视角无能为力的见证者'"
      - "陆霞克与杨和修的内在聚焦 —— 分别承担战术试探、亲人牵挂和冒险动机"
    pov_handoff:
      to: "陆小虎（陆霞克的双胞胎弟弟）"
      anchor: "line 393"
      mechanism: |
        陆小虎先由陆霞克提及 → 末段时间跳跃'几天后' → 叙事焦点交给陆小虎，由他的'不明白' 承担收束
        读者掌握陆霞克留下断后的前因，陆小虎只看见陈雨琪的哭泣与关心，认知差形成戏剧性反讽
  spine_mode: "desire"
  desire_object: "活着走出地铁系统 → 到达机场旁医院（军方驻扎传闻的最后避难所）"
  shadow_desire: |
    主题解读：陈雨琪表层想'活下去'，全篇同时累积'见证 + 背负'。
    她目送杨和修呈感染状态、刘敏遇害、陆霞克留下断后；更强的同伴持续把生还机会推给她。
    尾声只确认她对陆小虎格外关心。读者可以把这段关系理解为陆霞克选择留下后的余波，原文没有说明她的具体动机。

  conscious_vs_unconscious:
    conscious: "走出隧道 / 避开感染者 / 联系外界 / 到达医院"
    unconscious: |
      陈雨琪没有'独自活下去就够了' 的概念
      她的活下去逐渐变成'替死者完成未竟之事' ——
      陆霞克最后留下拖延时间，把逃生机会交给她
      主题解读可把她后续关心陆小虎视为幸存关系的延续；原文保留动机空白

reader_spine:
  reader_waits_to_know: "狂笑感染者保留多少判断与目的性，小队能否把观察到的规律转化为生路"
  recognition_object: "呈感染状态的杨和修仍能伏击、嘲讽、使用医生语言威胁，并走在追击群体最前"
  withheld_answer: "理性归纳出的安全规则会在什么条件下失效"
  reveal_ladder_seed:
    early_signals:
      - "手机录像证明灾难真实，但起因仍未知（DT-S02，line 31-35）"
      - "杨和修看见感染者使用合金锤并预判玻璃会破，随后传来碎裂声（DT-S05，line 109-113）"
    mid_reframes:
      - "感染者观察同伴触电后停步、尝试避开电轨（DT-S05，line 129-147）"
      - "杨和修把气味、传播途径和皮肤屏障组织成一次求生试验（DT-S10，line 293-315）"
    final_confirmation:
      - "试验过程被省略；杨和修再次出现时已呈感染状态，仍保留判断、语言与追猎目的（DT-S10/DT-S11，line 329-377）"

# === 激励事件 ===

inciting_incident:
  event: "列车连续跨越野福站 / 莱恩站不停车 + 眼镜男手机慢放录像揭示站台撕扯 + 车厢内尖叫'杀人了'"
  source_anchor: "line 27-49"
  type: "causal"
  delay_from_opening_chars_approx: 2400
  function: |
    用'地铁不停站' 这个日常系统的反常作为第一层警报（line 27）
    用手机慢放录像（line 33-35）把'街头群殴传闻' 升级为'眼见为实的虐杀'
    用车厢内的'杀人了' 尖叫（line 49）把灾难从'窗外' 拉进'车厢内'
    三层递进打破陈雨琪'坐了这么多次地铁头一次遇到' 的日常平衡 —— 从'迟到上课' 切换到'活下去'

# === 戏剧问题 ===

dramatic_question:
  main: "陈雨琪和这支临时小队能不能活着走出地铁系统、到达医院？谁会活到最后？"
  subtext: |
    在一个'好人会先死、理性者下场最坏、最爱你的人会变成最想吃你的人' 的世界里，
    '组队互助 + 保持人性' 这套生存逻辑是否还成立？
    一个像杨和修这样有力量、有理性、有道德感的医生，是不是反而最危险？
  payoff: |
    答案是反讽式的：
    最强、最理性、最有道德感的杨和修主动开始涂血试验；过程留白，再出现时已呈感染状态并反向猎杀同伴（line 321-345）
    最'没用' 的吟游诗人陆霞克留下断后，以吉他迎敌，给陈雨琪争取时间（line 387-391）
    活下来的是最不起眼的大学生陈雨琪 ——
    她的生还由队友连续让渡机会形成；尾声只展示这些选择留下的关系余波

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: "感染者群（车厢虐杀 / 站台地狱橱窗 / 隧道追击 / 风井口埋伏 / 末段翻墙追群）"
    layer_2_environment: "封闭地铁系统（不停车站台 / 追尾脱轨车厢 / 漆黑隧道 / 带电铁轨 / 高抗压但可破的玻璃门 / 风井口金属网内锁）"
    layer_3_evolution: "感染者保留观察与工具使用能力：工作人员感染者使用合金锤（line 111）；余者观察同伴触电后停步并尝试避开铁轨，随后受陆霞克挑衅而冲锋（line 137-147）"
  interpersonal:
    layer_1: "临时小队互不相识 + 陆霞克话多惹陈雨琪反感（line 19, 47, 77）—— 低度内部摩擦"
    layer_2: "杨和修批评陈雨琪刘敏'来送人头'（line 161）+ 杨和修主导决策的强势 —— 中度张力"
    layer_3: "杨和修被感染后亲手暗杀刘敏 + 反向猎杀陆霞克陈雨琪（line 329-345）—— 内部背叛 / 谋杀的顶点：'好人' 变成最致命的追击者"
  internal:
    layer_1: "陈雨琪对家人安危的牵挂（联系不上父母 line 205）"
    layer_2: "陆霞克保护限量款吉他、拒绝将其消耗为武器（line 131）；吉他此后成为移动负担，终局才用于最后抵抗"
    layer_3: "杨和修对父亲的牵挂（line 323 祈祷找到父亲）推动他承担独自试验；感染时点和途径留白"
  societal:
    - "报警电话占线 / 无法接通（line 173, 187）—— 公权力同步坍塌"
    - "手机信号渐进失效；杨和修在 line 319 提出可用手机导航定位医院，陈雨琪在信号恢复后查看地图（line 369-373）"
    - "国外视频确认动乱全球同步（line 229）；当地成因与处置情况仍无可靠消息"
    - "中控室 = 唯一残存的'制度性善意'（徐海水）—— 但他被困、最终也无能为力（line 369 '再也帮不到'）"
    - "机场旁医院 = 军方驻扎传闻（line 319 杨和修指路）—— 跨篇'希望符号' 共享"

# === Arc 框架 ===

arc_framework:
  total_arcs: 6
  notes: |
    线性推进型多线小队 —— 沿一条地铁线由'车厢 → 站台 → 隧道 → 中控室协助 → 风井口 → 山林出口' 推进
    与《燃烧》的'连续受难体'（每 Arc 死一人）同构，但这里是'希望符号反复给予又收回' 的橱窗结构：
    每到一个站台 / 出口，都先给一线希望，再用'更糟的地狱' 浇灭
    Arc 数量大致 = 关键死亡 / 关键状态改变（刘敏遇害、陆霞克留下断后、杨和修呈感染状态）+ 起承落点

  arc_1_morning_subway:
    label: "早高峰地铁 + 陆霞克卖唱 + 上车 + 街头群殴丧尸传闻"
    value_starting: "日常的烦躁（迟到 / 拥挤 / 嫌陆霞克话多）"
    value_ending: "异常被锚定（街头群殴 + 吃人传闻 + 列车不停站）"
    climax_event: "陆霞克转述街头车祸 + 群殴 + '大笑路人捡断腿边笑边吃' + 眼镜男冷笑'21 世纪不会真有丧尸'（line 23-25）"
    source_anchor: "line 5-29"
    function: |
      用最日常的早高峰地铁场景（卖唱青年 / 嫌话多 / 想旷课）建立'正常世界'
      陆霞克的'有点像丧尸' 是第一颗信息炸弹，但被眼镜男（杨和修）的理性主义否定 —— 反讽埋点：最先理性否定的人最后变成丧尸
      列车跨越野福站不停车（line 27）= 系统反常第一警报

  arc_2_carriage_massacre:
    label: "录像揭示站台撕扯 + 车厢内虐杀爆发 + 眼镜男紧急制动 + 追尾脱轨"
    value_starting: "异常被锚定（窗外的传闻）"
    value_ending: "灾难进入车厢（眼见虐杀 + 逃出车厢 + 追尾死亡机器）"
    climax_event: |
      眼镜男手机慢放录像揭示野福站撕扯孩童（line 33-35）→ 车厢内'杀人了' 尖叫（line 49）
      → 眼镜男拉紧急制动（line 51）→ 逃出车厢看见车厢内虐杀（line 57-63）→ 后车追尾脱轨'沙丁泥罐头'（line 71）
    source_anchor: "line 31-93"
    function: |
      灾难从'窗外橱窗' 拉进'车厢内' 再拉进'隧道死亡机器'
      眼镜男（杨和修）首次以'有行动力的理性者' 身份救人（拉制动 + 喊向前跑避追尾）
      引入两个标志性意象：'人体被液压机挤成沙丁泥罐头汁水'（line 71）+ 陈雨琪甩落的断手（line 81）
      no-time-to-mourn 节奏：刚逃出就要躲追尾，没有时间反应

  arc_3_drumen_electric_rail:
    label: "德鲁门站地狱橱窗 + 合金锤预警与玻璃破裂 + 电轨陷阱断后战 + 杨和修医生身份揭示"
    value_starting: "求生（往下一站走找信号）"
    value_ending: "认知层崩坏（感染者会观察伤亡并调整行动 + '我们杀人了' + 杨和修身份揭示）"
    climax_event: |
      杨和修看见穿制服感染者用合金逃生锤砸尸体并预判玻璃将破（line 111）→ 碎裂声确认屏障失效，感染者跳进隧道追击（line 113）
      → 眼镜男（杨和修）用'带电铁轨 + 尸体' 设陷阱断后（line 119-149）
      → 余下感染者观察伤亡后停步并尝试避开电轨，随后受陆霞克挑衅而冲锋（line 137-147）
    source_anchor: "line 95-159"
    function: |
      引入关键世界规则：
      (1) 高抗压玻璃遇到专业破拆工具仍会失效（line 91, 111-113）—— 安全条件具有具体边界
      (2) 感染者会观察伤亡、停步和尝试避开电轨；陆霞克用挑衅试探其愤怒反应（line 137-147）
      杨和修证件揭示'东江 CC 联合医院骨科医生'（line 155）—— '救人者第一次杀人' 的反讽身份
      '我们好像杀人了'（line 153）+ 杨和修'以前做的都是救人'（line 153）—— 为他后续沦陷做道德对照

  arc_4_huanhe_control_room:
    label: "环河路安全站台 + 徐海水中控室协助 + 拉朵直播全球同步 + 杨和修父亲挂电话"
    value_starting: "认知层崩坏"
    value_ending: "希望被外部赠予后又收窄（环河路安全但要继续走 + 全球沦陷确认 + 杨和修情绪裂痕）"
    climax_event: |
      环河路站意外安全（line 165）→ 徐海水中控室通过监控引导 + 给装备 + 给路线选项（line 175-197）
      → 手机看到拉朵海外剖腹直播 = 全球同步沦陷确认（line 231-241）
      → 杨和修父亲电话只响一声被挂断 → 杨和修推断'铃声暴露父亲位置'（line 215-219）
    source_anchor: "line 161-249"
    function: |
      唯一残存的'制度性善意'（徐海水中控室）登场 —— 上帝视角但被困、无能为力
      拉朵直播 = 多层窥镜套娃（直播屏中的剖腹）+ 全球同步爆发证据（line 229-241）—— 与《学校》line 93 / phase1 同源
      杨和修父亲挂电话 = 全篇最关键的'静默炸弹'：父亲的安危增加他尽快出去并承担试验的动机，也打开他的情绪裂隙
      博德之门吟游诗人玩笑（line 259）= 黑色幽默微喜剧瞬间，为后面的惨烈反衬

  arc_5_wind_shaft_betrayal:
    label: "风井口感染者埋伏 + 杨和修涂血伪装计划 + 暗杀刘敏 + 反向猎杀"
    value_starting: "希望被收窄（风井口路线）"
    value_ending: "深渊（风井口已沦陷 + 杨和修试验过程留白、再出现时呈感染状态 + 暗杀刘敏 + 反向猎杀陆霞克陈雨琪）"
    climax_event: |
      推开逃生通道门 → 风井口已是地狱 + 感染者冲出（line 269-283）
      → 杨和修提出涂血伪装计划（line 293-305）+ 检查皮肤屏障 + 祈祷找父亲（line 313-323）
      → 刘敏进去告别 → 杨和修暗杀刘敏（line 327-335）→ 反向猎杀陆霞克陈雨琪（line 337-345）
    source_anchor: "line 261-347"
    function: |
      全篇 main climax 的第一引爆点 —— 莫千回'好人也会沦陷' 反讽的核心载体：
      杨和修是全篇最强 / 最理性 / 最有道德感的人，他的涂血计划基于缜密推论（气味识别 / 体液传播 / 皮肤屏障）
      找父亲的动机推动他承担独自试验；关门后的试验和感染过程留白，再出现时他已成为最致命的猎手
      暗杀刘敏用'扔人头 + 越来越大的笑声' 揭示（line 335）—— 关键死亡用'省略 + 完成态' 承担
      '太快了，刚才的妹子死得太快了，这一次我会慢慢的'（line 335）—— 感染者保留智力 + 嗜虐语言

  arc_6_guitar_relay_handoff:
    label: "陈雨琪陆霞克逃出隧道 + 陆霞克留下断后并以吉他迎敌 + 叙事焦点转交陆小虎"
    value_starting: "深渊（杨和修反向猎杀 + 陆霞克双脚受伤）"
    value_ending: "幸存关系继续外溢（陆霞克留下断后 + 陈雨琪逃出 + 数日后转交陆小虎）"
    climax_event: |
      徐海水广播掩护下二人渡过最后两站（line 359-363）→ 黄昏走出隧道（line 367）
      → 山顶发现杨和修带感染者群翻墙追来（line 377）→ 陆霞克推开陈雨琪'拖延时间'（line 379-385）
      → 陆霞克弹完最后一首歌 + 吉他抡向扑来的杨和修（line 389-391）
      → '几天后' 陆小虎在医院遇到陈雨琪（line 393）
    source_anchor: "line 349-393"
    function: |
      全篇 main climax 收束 —— 莫千回标志性'用一个道具承担多层意义'：
      陆霞克的吉他（限量款 M3000）从被保护、拒绝消耗的珍贵物（line 131）→ 逃生负担（line 373）→ 终局演奏与迎敌武器（line 389-391）
      他的'这个世界并不是什么东西都需要意义'（line 383）= 反英雄式赴死宣言
      POV 转交陆小虎（line 393）= 文学层面的'传火'：让一个完全不知情的外部角色承担读者的'迟到见证'
      陈雨琪对陆小虎的'格外关心'延续了陆霞克选择留下后的关系余波；具体动机由原文保留

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "杨和修开始未展示的涂血试验 → 再出现时呈感染状态，暗杀刘敏并反向猎杀陆霞克陈雨琪（line 321-345）"
    source_anchor: "line 329-345"
    why_climax: |
      全篇价值层的引爆点：
      - 杨和修开篇是'冷笑否定丧尸的理性者'（line 25）→ 中段是'救人无数的骨科医生'（line 153, 155）→ 末段变成'反向猎杀同伴的猎手'
      - 他把气味识别、体液传播和皮肤屏障组织成可执行试验；父亲牵挂使这次求生试错同时带有私人目标
      - 理性、行动力、责任感与父亲牵挂共同推动他承担独自试验；感染时点与途径留白
      - 反讽顶点：最可信赖的决策者再次出现时，已把判断力、医学语言与力量用于猎杀同伴

  closing_reversal:
    event: "陆霞克留下断后并以吉他迎敌（line 387-391）+ 数日后叙事焦点转交陆小虎（line 393）"
    source_anchor: "line 387-393"
    function: |
      陆霞克留下断后给陈雨琪争取时间，具体结局停在吉他迎击动作
