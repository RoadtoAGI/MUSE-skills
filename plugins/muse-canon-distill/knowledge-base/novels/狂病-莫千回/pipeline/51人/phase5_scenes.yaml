        controlling_idea payoff 是张亦川说出的安慰：'因你而活的人还活着，你所做的一切就都有意义 / 每个人的存在都是那个人来过的印记'（line 693）——
        紧接'这些话好像对自己也有用处'（line 695）—— 安慰别人即自我治愈，是全篇主题的双向落地。
        自选感染安乐死：张亦川偷割其臂涂感染血肉（line 707）+ 秦良岳'谢谢'（line 709）+ 留急救本子（line 711）——
        把'自选感染' 从《学校》求生 /《燃烧》换药改写为'安乐死 + 遗产传递'，是系列母题的本篇变体。
