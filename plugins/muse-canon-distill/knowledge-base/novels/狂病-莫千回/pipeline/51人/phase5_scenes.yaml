    description: "张亦川亮朋克纹身解释学杂技能为'融入群体' 却融不进 → 双刀感染者反常居中难炸 → 汽修同伴自告奋勇驾皮卡自爆 + '看不到头的日子想结束了' → 说说笑笑搬炸药 + 比大拇指 → 张亦川'那是一条命，是同伴呀'（哲学崩塌）→ 皮卡冲入人群自爆 → '自己都不知道那个同伴的名字'"

  - scene_id: "51-S11"
    label: "秦良岳告别独白 + controlling_idea payoff + 自选感染安乐死"
    chapter: "51人"
    source_anchor: "line 679-721"
    word_count_approx: 2200
    characters: ["张亦川", "刺成云丹", "秦良岳"]
    pov: "张亦川"
    conflict_type: "internal + interpersonal"
    beat_direction:
      function: "closing reversal —— 两个'存在感焦虑者' 互相确认 + 意义的最终安放"
      craft_note: |
        秦良岳告别独白（救过病人 / 垫付医药费 / 患癌后病人质疑他医术 / 借出的钱无人还 / 害怕被遗忘无意义 line 685-691）——
