  arc_3: "急坠"  # 51 人崩塌 + 神明被分食 + 三人逃出
  arc_4: "急"  # 黄金殿思辨（缓插）→ 青年队平行覆灭 + 追踪 + 抛弃诱饵（急）
  arc_5: "缓"  # 取药 + 毒虫真相反转（思辨/情感为主，动作让位）
