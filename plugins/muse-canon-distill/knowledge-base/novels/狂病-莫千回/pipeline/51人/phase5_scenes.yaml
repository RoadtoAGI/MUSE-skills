        把安乐死写成'获得新生般的奔跑'，用感染者'痛觉变快感' 的设定完成一次反向温柔；夕阳余晖收尾 = 全篇唯一的'美' 镜头。
    description: "失明的秦良岳告别 → 独白：救过病人/垫付医药费/患癌后被质疑医术/害怕被遗忘无意义 → 张亦川'我们很像' + '因你而活的人还活着，你所做的一切就有意义/每个人的存在都是那个人来过的印记'（payoff，也治愈自己）→ 张亦川扶其出门偷割臂涂感染血肉助安乐死 → 秦良岳'谢谢' + 留急救本子 → 蹦跳奔向夕阳余晖倒在膝盖上"

