      craft_note: |
        医生主动提出陪去医院（明知是'挡箭牌' 会死 line 431-435）—— 与张亦川 S07 抛弃诱饵形成镜像对照：一个被迫当饵，一个自愿当饵。
        '捕食者面对多数猎物会略过低价值的，捕杀性价比更高的对象'（line 437）—— 把'屎味巧克力' 运气从'气质' 提升到'生态位' 的理论解释，
        与系列《学校》'肾上腺素越低越被锁定' 假说 / 《燃烧》气味识别 lore 互补。
        '气质' 解释（line 437-441）—— 医生说张亦川在创世军时给他'见过但不熟悉的感觉，若不是最后剩三个，他都不会注意到创世军有 51 个人'——
