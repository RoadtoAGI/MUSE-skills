# === Arc 1: 屎味巧克力运气 + 遇刺成云丹 ===

arc_1:
  label: "屎味巧克力运气 + 个人逃亡群像 + 遇刺成云丹"
  source_anchor: "line 5-65"
  sequences:
    - seq_id: "1.1"
      label: "沙威玛餐厅炼狱 + '事不过三' 第三次生还 + 屎味巧克力运气规则"
      source_anchor: "line 5-31"
      core_conflict: "张亦川 vs 感染者（但运气让他被忽视）"
      progression: |
        杂物间两名幸存者被划肚扯肠 + 热胃袋掉到张亦川面前 → 呕吐暴露
        感染者发现他却被门外异响引走（line 13）—— 第三次生还
        穿行沉迷欢愉的感染者中反而比躲藏更安全（line 21）
        回忆从小'谁都可以代替他' / 老师漏点名 / 父母朋友劝再生一个（line 23-25）
        悟出'屎味巧克力' 运气：有其他选择时感染者忽视他，单独逃则照样被追（line 29-31）
      seq_climax: "屎味巧克力运气规则建立 —— '不被注意' 既是护身符也是存在性创伤"

    - seq_id: "1.2"
      label: "刺成云丹的'我都会选择你' + 张亦川'救人顺手'"
      source_anchor: "line 33-65"
      core_conflict: "张亦川存在感焦虑 vs 刺成云丹无条件的'选择'"
      progression: |
        刺成云丹（昂族 / 慢普通话）羡慕张亦川运气 vs 张亦川羡慕他名字有记忆点（line 33-35）
        刺成云丹'救了的朋友灵魂也可托付 + 无论别人怎样我都选择你'（line 37-41）
        张亦川山崖小便发现受伤的刺成云丹 + 末日后第一次跟人讲这么多话（line 43）
        引出老大哥八人和尚队伍 + 2 比 1 作战纪律（line 47-63）
        商店头脑发热搜刮 → 只找到打火机 / 香烟 / 罐头（line 61-65）
      seq_climax: "'我都会选择你' —— shadow_desire 的第一缕兑现；2 比 1 纪律 = 后续造炸弹伏笔"

# === Arc 2: 三个傻子引灾 + 陶亦仁登场 + 创世军壮大 ===

arc_2:
  label: "三个傻子引灾 + 陶亦仁登场 + 创世军成型壮大"
  source_anchor: "line 67-209"
  sequences:
    - seq_id: "2.1"
      label: "汽车警报连锁灾难 + 折损两人 + 三个拆收音机的傻子"
      source_anchor: "line 67-117"
      core_conflict: "老大哥队伍 vs 警报引来的感染者潮 + 三个闯祸傻子"
      progression: |
        汽车警报响 → 酒吧 / 居民楼 / 高楼坠下的感染者群追击（line 67-69）
        五金店开门西瓜刀劈脖 + 队友被楼上感染者压塌胸骨（line 73-81）—— 折损两人
        逃到停车场发现三个找车的傻子（引发警报者）+ 抢插钥匙 SUV 逃命（line 89-97）
        老大哥怒训三傻 → 三傻反驳'欺负自己人算什么'（line 101-103）
        三傻在拆收音机 + 转述'神秘男人' 有完整对抗感染者体系（line 115-123）
      seq_climax: "三傻同时带来灾难（警报）与希望（陶亦仁传闻）—— 末日寓言式激励事件"

    - seq_id: "2.2"
      label: "陶亦仁'风暴' + '天上烟花' 感召 + 全员选择留下复仇"
      source_anchor: "line 119-169"
      core_conflict: "苟且求生（活着只为活着）vs 死亡奔赴（破后而立的意义）"
      progression: |
        老大哥评陶亦仁'像一场风暴 + 毫无顾忌席卷一切'（line 131）
        老大哥推心置腹问众人：活着的目标若只是活着，和'为结婚而结婚' 一样痛苦（line 133-137）
        30 岁同伴讲妻儿被虐杀 → 为救赎留下（line 139）；张亦川转述给刺成云丹 → 也留下（line 141）
        陶亦仁'与其下水道厕纸不如天上烟花' 感召新人（line 169）
      seq_climax: "'天上烟花' 感召 —— 把'活着只为活着' 改写为'死亡奔赴的意义'"

    - seq_id: "2.3"
      label: "创世军 lore 成型 + 神明传闻 + 山林剿灭十几感染者的集体释放"
      source_anchor: "line 145-209"
      core_conflict: "陶亦仁权威建制 vs 内部不服 → 战果碾压不服"
      progression: |
        陶亦仁分配物资 / 布陷阱 / 造电台 / 音响挑衅感染者（line 145-157）
        '创造' 手势（line 183）+ 无名编号制（line 199）+ 死亡哲学宣讲（line 181）+ 用人命考验新人（line 191-193）
        神明下凡传闻 + 沾血不感染 + 吓跑感染者群（line 201-203）
        三十人主动剿灭十几个感染者 → 压抑释放 / 有人哭出来 / '哪怕此刻死了也值得'（line 205-207）
      seq_climax: "山林剿灭战的集体释放 —— 创世军意义与希望的顶点（line 205-207）"

# === Arc 3: 51 人巅峰崩塌 ===

arc_3:
  label: "51 人巅峰 + 一个女人引爆 + 陶亦仁被分食 + 残部三人逃出"
  source_anchor: "line 211-287"
  sequences:
    - seq_id: "3.1"
      label: "51 人巅峰 + 神明流血 + 陶亦仁被同伴分食"
      source_anchor: "line 211-223"
      core_conflict: "创世军最高点 vs 内部感染的灭顶崩塌"
      progression: |
        '算上张亦川队伍达到 51 个人' → 一个平静下午 + 一个女人让抗争戛然而止（line 211）—— 标题真相落点
        '如果神明会流血，那他是否还是神明'（line 213）
        陶亦仁被感染的创世军同伴撕成米黄色骸骨（line 215）
        痛苦型感染者：怒吼多于大笑 + 自毁性泄欲（老大哥抱头颅自毁式交媾 line 221-223）
      seq_climax: "51 人 = 巅峰即崩塌瞬间 —— 标题的第一重含义落地"

    - seq_id: "3.2"
      label: "三人幸免的结构性回报 + 出逃"
      source_anchor: "line 225-287"
      core_conflict: "回营地取物资（功利）vs 营救毒虫医生（人性残余）"
      progression: |
        毒虫医生闷头跑回营地 → 刺成云丹要追 → 张亦川以'回营地取物资' 为由跟去（line 227-235）
        躲过叠罗汉感染者取物资 + 到医生帐篷救他（line 237-243）
        被两个感染者发现 → 飞来胳膊 / 人头 / 内脏 → 引燃陷阱拖延逃脱（line 245-273）
        揭示幸免原因：张亦川被漏点名 + 刺成云丹去找他 + 医生犯病呕吐耽误（line 279-283）
        推测崩塌源是外来者中'陶亦仁旧相识的女人'（line 285）
      seq_climax: "三人因'屎味巧克力' 式的被忽视/耽误而幸免 —— 运气规则的结构性回报"

# === Arc 4: 黄金殿 + 继承意志 + 被追踪 + 抛弃诱饵 ===

arc_4:
  label: "黄金殿避难 + 继承陶亦仁意志重建创世军 + 烟雾预警 + 被追踪转移抛弃诱饵"
  source_anchor: "line 289-409"
  sequences:
    - seq_id: "4.1"
      label: "周大龙黄金殿 + 三欲三原色论 + 烟雾分级预警"
      source_anchor: "line 289-327"
      core_conflict: "金饰避难所的讽刺 vs 烟雾来源判读"
      progression: |
        黄金殿二楼金饰避难所 + 金手镯刮面包煤斑的讽刺（line 289-293）
        医生'三欲三原色' 论：食欲/性欲/暴力欲 = 生命三原色，金钱只是介质，感染者无限释放三欲故介质失效（line 295）
        西北白灰烟雾分级预警（白灰不慌 / 变黑变浓通知）→ 变黑 → 两分钟转移掩埋痕迹（line 307-313）
        队员只听刺成云丹和医生的命令 → 张亦川'我果然啥时候都没存在感' 抱怨（line 315-319）
      seq_climax: "三欲三原色论 = 本篇思想内核明示；张亦川存在感焦虑在新队伍里依旧"

    - seq_id: "4.2"
      label: "黑烟判读 + 城镇另一边青年队覆灭 + 篝火狂欢 + 青年被同化"
      source_anchor: "line 321-353"
      core_conflict: "（平行线）另一支幸存者小队 vs 会追踪的感染者群"
      progression: |
        张亦川以烟雾颜色判定是感染者（大量焚烧 + 不在乎周围 line 325）
        平行视角切到城镇另一边：树上青年看同伴被狼群般感染者覆灭（line 329-331）
        双刀感染者订书针订人皮 + 双刀绞肠炙烤食之（line 335）+ 队长被按进篝火 / 割下体泄欲（line 339-341）
        感染者把烧焦手臂同伴踢进火 + 山呼万岁（line 343）+ 烤乳猪式穿棍焚烤（line 345）
        青年被当厕所淋秽物后'嘴角扬起' 跟上狮群（line 351-353）—— 同化/感染
      seq_climax: |
        平行线确立'会追踪的感染者群 + 双刀头领' 的威胁等级；
        青年被同化'嘴角扬起跟上狮群' —— 与系列'感染 = 加入' 母题同源

    - seq_id: "4.3"
      label: "继承陶亦仁意志 + 中转站警示 + 陶亦仁最后命令'追杀罗允' + 60 秒转移抛弃诱饵"
      source_anchor: "line 355-409"
      core_conflict: "继承意志重建队伍 vs 被会追踪的感染者逼到抛弃队员"
      progression: |
        深夜九人小队 + 中转站撕破译书 + 炭笔写沦陷警示 + 收新人抹名编号（line 357-359）
        陶亦仁最后命令：追杀一个叫罗允的，特征是两个人在行动（line 361）—— 跨篇钩
        计划去零食工厂找杀伤性武器（line 363）+ 医生叹'人类未来可能只有灭亡'（line 365）
        陷阱触发 → 60 秒转移（普通陷阱本是 2 分钟，这批会追踪 line 373-375）
        张亦川故意拽倒挤撞同伴的队员当活饵 + 踹脸 + 抢背包（line 389-395）—— 仅医生察觉
      seq_climax: |
        '追杀罗允' 命令 = 跨篇核心钩；抛弃诱饵队员 = 张亦川灰色化最深一步（line 395），为 Arc 6 转向蓄力

# === Arc 5: 刺成云丹受伤 + 健康中心取药 + 秦良岳真相 ===

arc_5:
  label: "刺成云丹受伤恐破伤风 + 张亦川与医生赴健康中心取药 + 秦良岳癌症真相 + 误会冰释"
  source_anchor: "line 411-555"
  sequences:
    - seq_id: "5.1"
      label: "奶茶店失策 + 刺成云丹肩伤 + 破伤风威胁 + 医生主动当挡箭牌"
      source_anchor: "line 411-453"
      core_conflict: "为一个人冒险取药值不值 vs 张亦川下不了狠心"
      progression: |
        奶茶店最年轻队友被裱花桶灌奶油切食（line 411）+ 刺成云丹肩中刀（line 413-417）
        医生判刺成云丹需打破伤风疫苗（line 419）+ 医院极可能有感染者（line 421）
        张亦川想随便叫队员当挡箭牌陪去 → 刺成云丹拒绝'以命换命下地狱'（line 427）
        '现在不就是地狱吗' 张亦川怒（line 429）+ 医生主动提出'我和你去'（line 431-437）
        医生解释张亦川'低价值猎物气质'（捕食者略过性价比低的猎物 line 437-441）
      seq_climax: "医生解释存在感规则 —— '屎味巧克力' 运气第一次被清晰命名 + 医生明知会死仍跟随"

    - seq_id: "5.2"
      label: "健康中心福尔马林鱼缸 + 取药 + 高锰酸钾解锁炸弹 + 曲马多牵出癌症真相"
      source_anchor: "line 453-555"
      core_conflict: "毒虫偏见 vs 癌症晚期好医生真相"
      progression: |
        改去危险系数更低的健康中心（医院下属取药部 line 475-479）
        福尔马林鱼缸泡残肢婴儿 + 人头钉墙（line 489-497）+ 医生'感染者最会折磨人的是医生'（line 503）
        取曲马多 / 可待因 / 青霉素 / 阿司匹林 + 高锰酸钾（白糖炸弹关键 line 509-523）
        曲马多'可用于癌痛' → 医生坦白直肠癌晚期 / 肺转移 / 头盖骨转移 + 靶向药阿帕替尼断药耐药（line 525-541）
        肿瘤区找到瑞格非尼（line 547）+ 厌恶转愧疚尊敬 + 第一次问名字'秦良岳'（line 549-555）
      seq_climax: "曲马多牵出癌症真相 → 毒虫偏见彻底反转 + '秦良岳' 这个易记的名字再刺张亦川存在感焦虑"

# === Arc 6: 零食工厂高潮 + 无名同伴自爆 + 秦良岳告别 ===

arc_6:
  label: "零食工厂造炸弹 + 无名同伴自爆殉道 + 双刀感染者群覆灭 + 秦良岳自选感染告别"
  source_anchor: "line 557-721"
  sequences:
    - seq_id: "6.1"
      label: "工厂困守 + 放弃被压队员 + 燃烧瓶反击 + 引来追兵"
      source_anchor: "line 557-623"
      core_conflict: "营救被压队员（人性）vs 接受死亡（陶亦仁哲学）"
      progression: |
        到零食工厂 + 干尸守门兽 + 撬原料仓库铁锁（line 557-581）
        危险品仓库货架塌压住队员 → 张亦川'别使劲了有感染者来了 / 没有选择'（line 587-591）
        刺成云丹应被压队员请求一刀杀之（line 595-597）+ 六人困守原料仓库（line 599-601）
        造 16 个机油白糖燃烧瓶（按 2 比 1 line 603）→ 开门火攻推出感染者（line 613-615）
        一感染者撞进危险品仓库引大火黑烟 → 必引追兵（line 617-623）
      seq_climax: "放弃被压队员（line 591）= 陶亦仁哲学的执行；燃烧瓶灭厂内感染者但引来追兵"

    - seq_id: "6.2"
      label: "白糖高锰酸钾炸弹 + 双刀感染者居中难炸 + 无名同伴自爆殉道"
      source_anchor: "line 625-665"
      core_conflict: "炸不到居中的双刀头领 vs 需一人驾车自爆"
      progression: |
        白糖 + 高锰酸钾 3:7 装铁桶夹石块铁块 + 机油白糖燃烧弹（line 625）
        张亦川亮朋克纹身解释他学杂技能是为了'融入群体找位置' 却始终融不进（line 631）
        双刀感染者反常居于人群中央（预感？line 635-639）→ 需有人驾皮卡自爆
        汽修出身的同伴自告奋勇打火驾车 + '这种看不到头的日子想结束了'（line 641-649）
        同伴说说笑笑搬炸药赴死 + 比大拇指（line 655-661）→ 张亦川'那是一条命，是同伴呀'（line 663）→ 皮卡冲入人群自爆（line 665）
      seq_climax: |
        无名同伴自爆 = 故事 main climax；张亦川'那是一条命不是踏板'（line 663）—— 陶亦仁'死亡是路障' 哲学崩塌

    - seq_id: "6.3"
      label: "五人幸存取消编号 + 秦良岳告别独白 + 自选感染安乐死"
      source_anchor: "line 667-721"
      core_conflict: "意义 = 被记住 vs 意义 = 因你而活的人还在"
      progression: |
        剩余汽油弹小炸弹清剿零星感染者 → 追逃戛然而止 + 五人幸存（line 673）
        工厂前拍合照 + 取消编号制 + 晚上重新自我介绍互认（line 675）
        几天后失明的秦良岳告别（肿瘤蔓延颅压压视神经 line 679-681）
        告别独白：救过病人 / 垫付医药费 / 患癌后世界观崩塌 / 病人质疑他医术 / 害怕被遗忘无意义（line 685-691）
        张亦川'我们很像'（line 691）+ '因你而活的人还活着，你所做的一切就都有意义 / 每个人的存在都是那个人来过的印记'（line 693-695）
        张亦川扶秦良岳出门 + 偷割其臂涂感染血肉助安乐死（line 707）+ 秦良岳'谢谢' + 留急救本子（line 709-711）
        秦良岳蹦跳奔向夕阳余晖倒在膝盖上（line 713-721）
      seq_climax: |
        秦良岳告别 = closing reversal：两个'存在感焦虑者' 互相确认；
        张亦川的安慰治愈自己（line 695）+ 自选感染安乐死把'死亡' 从'路障' 改写为'痛苦的终结 + 来过的印记'

