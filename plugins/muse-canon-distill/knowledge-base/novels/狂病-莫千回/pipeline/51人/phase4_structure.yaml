  arc_2_to_3: "创世军 51 人巅峰 → 一个女人引爆 + 神明被分食（最高点直坠深渊）"
  arc_3_to_4: "三人幸免出逃 → 继承意志重建 + 被会追踪的感染者逼到抛弃诱饵队员（道德下沉）"
  arc_4_to_5: "抛弃诱饵 + 奶茶店折损 + 刺成云丹受伤 → 为救一人冒险取药 + 毒虫真相反转（价值重估）"
  arc_5_to_6: "取药归来造炸弹 → 无名同伴自爆灭头领群 + 秦良岳告别（哲学崩塌 + 意义安放）"
  curve_shape: "Arc 1 缓 → Arc 2 缓升 → Arc 3 急坠（崩塌）→ Arc 4 急（追逃/抛弃）→ Arc 5 缓（取药/真相）→ Arc 6 极急 → 余韵"
  curve_note: |
    倒叙嵌套使前三 Arc 是'兴亡' 完整抛物线（缓-升-坠），后三 Arc 是'连续受难型' 追逃（与《燃烧》同型，
    每个 sequence 完成一次价值层下沉或重估）。51 人崩塌（Arc 3）是结构中点的大转折，工厂自爆（Arc 6）是终极引爆。

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第三人称限知 POV（张亦川）—— 全篇紧贴张亦川的感知、心理与价值判断"
    function: |
      限知 POV 服务于'存在感' 主题：读者只能从'最没存在感的人' 眼里看创世军兴亡 ——
      连'51 人' 这个数字、'追杀罗允' 这个命令、'那个女人' 的崩塌源，张亦川都只是'听说 / 转述 / 推测'，
      他始终在事件边缘（被漏点名、躲在山坡看陶亦仁被分食），印证'路人' 视角本身就是主题载体。

  parallel_external_threads:
    - "城镇另一边的青年队覆灭（line 329-353）—— 唯一一段脱离张亦川 POV 的平行视角，确立双刀感染者头领威胁等级 + 青年被同化"
    - "陶亦仁主力大部队分裂线（line 323 / 365）—— 创世军分裂后主力规模成谜，与追兵小股分开"
    - "罗允追猎线（line 361 陶亦仁最后命令）—— 不在场但被点名的跨篇线"

  embedded_flashback_structure:
    note: |
      本篇用'张亦川已忘记末日过去多久'（line 51）的模糊时间感支撑倒叙嵌套：
      Arc 1-3 是创世军兴亡的整体回溯，Arc 4 开头'周大龙黄金殿二楼'（line 289）切回当下追逃，
      之后追逃线与对秦良岳的认知反转交织推进。这种'先讲完一个已死世界，再讲幸存者怎么走出来' 的结构
      是本篇区别于《燃烧》线性连续受难的关键。

# === 待解决钩点 ===

open_questions:
  - "陶亦仁'最后命令追杀罗允'（line 361）—— 创世军主力大部队是否真的与罗允交锋？《恶》《医院》等篇有无落地？"
  - "崩塌创世军的'那个女人'（陶亦仁旧相识 line 285）身份与动机 —— 有意引入感染（吴先生型）还是意外？是否跨篇再现？"
  - "双刀感染者作为'头领型感染者' 是否与系列其他篇头领型/练靶手感染者同源？"
  - "'机场旁医院' 符号本篇未抵达 —— 本篇目的地是零食工厂/健康中心，不解此钩"
  - "创世军主力大部队分裂后现规模（line 365 医生'不敢想'）—— 是否在其他篇揭示其后续？"
