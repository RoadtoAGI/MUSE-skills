_meta:
  version: "1.0"
  chapter: "51人"
  source: "novels/狂病-莫千回/51人.md"
  word_count_approx: 31700
  validated_against_source: true
  form_note: "第三人称限知 POV（张亦川）—— 全篇紧贴张亦川的感知与心理；倒叙嵌套（前半回溯创世军兴亡，后半回到追逃当下）"
  world_alignment:
    verdict: "shared_canon"
    reason: |
      与系列共享世界观、时序、病征、地理与跨篇人物，确证为同一狂病宇宙：
      - 病征同源：狂笑 + 辱骂 + 痛觉缺失 + 力量增强 + 仪式化嗜虐（line 7-21 / 219-221 / 329-353）
      - 进化战术同源：感染者会追踪、避火不奏效但视线受阻、群体围猎、头领居中（line 287 / 363 / 375 / 615 / 635）
      - 物质体系同源：手机离线百度地图仍可用（line 421 / 459）、燃烧瓶 / 白糖炸弹 / 蓝牙音响挑衅（line 157 / 521-525 / 603）
      - 跨篇人物确证：陶亦仁最后命令'追杀一个叫罗允的，特征是两个人在行动'（line 361）—— 直接锚定 luo-yun（真）+ 搭档（疑 hong-yang），且把创世军定位为'罗允的追猎方'
      - 自选感染主题同源：秦良岳被张亦川协助自选感染作为安乐死（line 707-715）—— 与《学校》'我' 吞断指 / 《燃烧》周全自燃 / 盲女'杀了我吧' 同一'自选感染 / 求死'母题
      跨篇地理待解：本篇出现'健康中心 / 美容中心 / 中西医结合医院 / 零食工厂'（line 477-479 / 567），均为浦城市郊城镇设施，但'机场旁医院'符号本篇未抵达也未揭示真伪 —— 见 open_questions。

# === 脊椎 ===

spine:
  protagonist: "张亦川（青年男性，'屎味巧克力' 运气的拥有者 —— 在有其他猎物时被感染者自动忽视）"
  spine_mode: "desire"
  desire_object: |
    带着刺成云丹和创世军残部活下去 + 继承陶亦仁的意志把'创世军' 延续下去
    （后期具象为：到零食工厂取白糖 / 高锰酸钾造炸弹，消灭追了好几周的创世军感染者群）
  shadow_desire: |
    张亦川真正渴望的不是活着，是'被记住 / 被需要 / 成为某人的选择' ——
    一个从小普通到'谁都可以代替他'、连老师点名都会漏掉他的人（line 23-26），
    在末日里发现'不被注意' 成了保命的护身符（line 27-31），却也因此更确认自己'毫无存在感'。
    他对刺成云丹的珍视（'救了的朋友灵魂也可托付' line 41）、对秦良岳'你也很重要' 的渴望（line 631-633）、
    乃至取消编号制度让队员重新互相认识（line 675）—— 都是 shadow_desire 的兑现尝试：
    用'让别人被记住' 来反证'自己曾经来过'。
  conscious_vs_unconscious:
    conscious: "活下去 / 造炸弹消灭追兵 / 继承陶亦仁意志壮大队伍 / 救刺成云丹打破伤风"
    unconscious: |
      张亦川把'存在感' 与'意义' 划等号 ——
      他无法接受'自己所做的一切毫无意义、不被任何人记住'（line 691 与秦良岳互认'我们很像'）。
      所以他先用陶亦仁的'死亡是路障' 哲学麻痹自己（line 659），
      却在'连名字都不知道' 的同伴自爆后动摇（line 661-665），
      最终在秦良岳的告别里完成转向：意义不在被记住，而在'因你而活的人还活着'（line 693）。

# === 激励事件 ===

inciting_incident:
  event: "三个拆收音机的年轻人引爆汽车警报 → 老大哥队伍被感染者群追杀 → 抢车逃命 → 转述'神秘男人陶亦仁' 的存在"
  source_anchor: "line 89-129"
  type: "causal"
  delay_from_opening_chars_approx: 4200
  function: |
    开篇是张亦川独立逃生的'屎味巧克力' 群像快照（line 5-65），真正改变命运轨迹的激励事件
    是三个傻子年轻人引发的连锁灾难 —— 它既造成老大哥队伍折损两人（line 101），
    又通过他们口中的'神秘男人'（line 123）把陶亦仁这个'风暴' 引入张亦川的人生。
    这是末日寓言式激励：灾难（警报）与希望（陶亦仁）由同一拨蠢人同时带来。

# === 戏剧问题 ===

dramatic_question:
  main: "张亦川能不能带着残部活着甩开 / 消灭追兵，并在陶亦仁死后给自己'毫无存在感' 的一生找到意义？"
  subtext: |
    '51人' 是一个关于计数与被遗忘的问题：
    创世军壮大到 51 人时崩塌（line 211），而第 51 个、最不被注意的那个人（张亦川）反而活了下来。
    在一个'不被记住就能活、被记住就会死' 的世界里，
    一个'谁都可以代替' 的普通人，他存在过的证据到底是什么？
  payoff: |
    答案是反转式的：张亦川活下来恰恰因为他'没有存在感'（捕食者略过低价值猎物 line 437），
    但意义不在'他被记住' —— 而在'因他和同伴的牺牲而活着的人还在'。
    秦良岳告别时张亦川说出'每个人的存在便都是那个人来过的印记'（line 693），
    这句安慰别人的话同时治愈了他自己（line 695）。
    取消编号、重新自我介绍、拍合照（line 675）= 51 人里幸存的 5 个人重新获得'名字' = 对'被遗忘' 的最终回应。

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: |
      麦德勒沙威玛餐厅里把人肉塞油锅 / 煎板 / 烤架的感染者（line 17-19）；
      会追踪的创世军感染者群（最初十几个 → 至少三十个 → 更多 line 363）；
      头戴黑帽、订书针订人皮、双刀的'双刀感染者'（前创世军同伴，感染者群头领 line 335 / 637）
    layer_2_environment: |
      五金店 / 超市 / 健康中心（人头钉墙 + 福尔马林鱼缸泡残肢婴儿 line 489-497）/
      中西医结合医院 / 零食工厂（干尸守门兽 line 567）—— 城镇设施全成感染者'艺术' 屠场
    layer_3_evolution: |
      感染者会追踪（line 287 / 375）、头领居中规避炸点（line 635-639）、
      不因燃烧爆炸迷惑（line 375）、群体围猎像狼群 / 蟑螂群（line 329-331）—— 进化到战术协同
  interpersonal:
    layer_1: |
      末日小队的'自私链'：精致利己首领搜刮队友、后宫型首领、转移时'把张亦川忘了'（line 53-55）；
      老大哥队伍 2 比 1 作战纪律 vs 头脑发热（line 59-63）
    layer_2: |
      陶亦仁的死亡哲学权威：'死亡是路障' 宣讲（line 181 / 405）+ 用人命考验新人（line 191-193）；
      张亦川自己也内化为'亲手除掉威胁整体的队员'（line 389-393 抛弃诱饵队员 / line 591-597 放弃被压队员）
    layer_3: |
      最致命的内部背叛是'隐形的'：创世军崩塌源于'一个女人'（陶亦仁旧相识 line 285）—— 信任的人才是缺口；
      张亦川对秦良岳的'毒虫' 偏见（line 173-175）是另一种内部对抗，最后被'癌症晚期' 真相瓦解（line 531）
  internal:
    layer_1: "'屎味巧克力' 运气带来的存在感焦虑（line 31 / 317-319）"
    layer_2: "陶亦仁'接受死亡' 哲学 vs 张亦川'下不了狠心' 的人性残余（line 267 / 415 / 591）"
    layer_3: "陶亦仁死后'意义崩坏'：意志要不要继承？无名同伴自爆后'那是一条命不是踏板' 的觉醒（line 661-665）"
  societal:
    - "电台 / 无线电中转站作为吸纳幸存者机制（line 187 / 357）—— 与系列'信号即文明残存' 主题同源"
    - "手机离线百度地图 / 指南针仍可用（line 421 / 459）—— 与《地铁》line 95 /《学校》《燃烧》line 135 同源"
    - "公权力全面缺席；唯一的'秩序' 是陶亦仁自建的创世军军法（编号 / 考验 / 手势 line 183-199）—— 邪教化的伪制度"

# === Arc 框架 ===

arc_framework:
  total_arcs: 6
  notes: |
    倒叙嵌套结构 —— Arc 1-2 是张亦川回溯创世军的'兴'（个人逃亡 → 加入 → 51 人巅峰），
    Arc 3 是'亡'（一个女人引爆 51 人崩塌），Arc 4-6 是崩塌后残部'连续受难型' 追逃（与《燃烧》同型）。
    价值主线：'被遗忘 / 无意义' ↔ '被记住 / 有意义'，每个 Arc 推进一次'存在感' 的重估。

  arc_1_solo_flight:
    label: "屎味巧克力运气 + 个人逃亡群像 + 遇刺成云丹"
    value_starting: "孤独逃亡中的麻木求生（被忽视 = 保命也 = 无意义）"
    value_ending: "有了刺成云丹这个'选择他' 的朋友（存在感的第一缕微光）"
    climax_event: "刺成云丹'救了的朋友灵魂也可托付 + 无论别人怎样我都选择你'（line 37-41）"
    source_anchor: "line 5-65"
    function: |
      用沙威玛餐厅炼狱开篇确立'屎味巧克力' 运气规则（line 17-31）：有其他猎物时感染者忽视张亦川。
      建立 shadow_desire（存在感焦虑 line 23-31）+ 唯一'选择他' 的人刺成云丹（line 37-41）。
      老大哥八人和尚队伍 2 比 1 纪律（line 63）= 后续'2 比 1 造炸弹' 的伏笔。

  arc_2_genesis_army_rise:
    label: "三个傻子引灾 + 陶亦仁登场 + 创世军成型壮大"
    value_starting: "苟且求生（活着只为活着）"
    value_ending: "找到'破后而立' 的意义 + 队伍壮大到将近 51 人（希望顶点）"
    climax_event: "山林剿灭十几个感染者 + '哪怕此刻死了也值得' 的集体释放（line 205-207）"
    source_anchor: "line 89-209"
    function: |
      陶亦仁'像一场风暴'（line 131）+ '与其下水道厕纸不如天上烟花'（line 169）把幸存者从'活着只为活着'
      拽进'复仇 / 创造新世界' 的死亡奔赴。确立创世军核心 lore：无名编号制（line 199）、'创造' 手势（line 183）、
      死亡哲学宣讲（line 181）、用人命考验新人（line 191）、陶亦仁'神明下凡'+ 沾血不感染传闻（line 201-203）。
      张亦川第一次'非常喜欢这支任何人都没有名字的队伍'（line 189）—— 反讽：在'抹去名字' 的集体里反而找到归属。

  arc_3_woman_and_collapse:
    label: "51 人巅峰 + 一个女人引爆 + 陶亦仁被同伴分食 + 残部三人出逃"
    value_starting: "创世军 51 人巅峰（意义与希望的最高点）"
    value_ending: "神明流血、队伍灭顶、张亦川/刺成云丹/医生三人逃出（深渊）"
    climax_event: |
      '如果神明会流血，那他是否还是神明'（line 213）→ 陶亦仁被感染的创世军同伴撕成米黄色骸骨（line 215）→
      老大哥抱陶亦仁头颅自毁式交媾（line 221）= 自毁性泄欲（区别于普通感染者）
    source_anchor: "line 211-287"
    function: |
      标题真相落点：'算上张亦川队伍达到 51 人'（line 211）—— 51 = 创世军巅峰人数 = 崩塌瞬间。
      崩塌源：'一个女人'（陶亦仁旧相识 / 外来者携入感染 line 285）—— 信任的缺口比外部追兵更致命。
      陶亦仁尸周感染者'怒吼多于大笑 + 自毁性泄欲'（line 223）= 本篇独有的'痛苦型感染者' 变体。
      三人因'张亦川被漏点名 + 刺成云丹去找他 + 医生犯病呕吐耽误' 而幸免（line 279-283）= 屎味巧克力运气的结构性回报。

  arc_4_inheritance_and_pursuit:
    label: "黄金殿避难 + 继承陶亦仁意志重建创世军 + 烟雾预警 + 被追踪转移"
    value_starting: "残部九人（继承意志 → 微弱重生）"
    value_ending: "陷阱触发被追踪 + 抛弃诱饵队员逃生（道德再次下沉）"
    climax_event: |
      陷阱触发 60 秒转移（line 369-371）+ 张亦川故意拽倒 / 抛弃一名队员当活饵（line 389-395）—— 双刀感染者搜空帐篷暴怒（line 381-383）
    source_anchor: "line 289-409"
    function: |
      周大龙黄金殿（金饰避难所 line 289-293）+ 医生'三欲三原色' 论（line 295）= 本篇思想内核的明示。
      张亦川在中转站撕破译书 + 炭笔写沦陷警示（line 357）+ 抹名编号收新人（line 359）= 继承陶亦仁但'不敢用人命考验'。
      陶亦仁最后命令'追杀罗允'（line 361）= 跨篇钩核心落点。
      抛弃诱饵队员（line 389-395）= 张亦川'灰色化' 的最深一步，仅医生察觉 → 为 Arc 6 转向蓄力。

  arc_5_hospital_run_doctor_truth:
    label: "刺成云丹受伤 + 张亦川与医生赴健康中心取药 + 秦良岳癌症真相 + 误会冰释"
    value_starting: "刺成云丹受伤恐破伤风 + 医生当'挡箭牌' 的功利算计"
    value_ending: "取到药 + 知晓医生是癌症晚期肿瘤科医生 + 厌恶转为愧疚尊敬 + 得知医生名字'秦良岳'"
    climax_event: |
      曲马多'可用于癌痛' → 医生坦白直肠癌晚期 / 肺转移 / 头盖骨转移（line 531）→
      张亦川'内心嚎叫上千次我操'（line 533）→ 第一次问医生名字'秦良岳'（line 551-555）
    source_anchor: "line 411-555"
    function: |
      把张亦川的'毒虫' 偏见（line 173 / 407）彻底反转：吗啡 / 曲马多 / 阿帕替尼 / 瑞格非尼是癌痛靶向药不是毒瘾（line 509 / 537-545）。
      医生主动当挡箭牌（明知会死仍跟随 line 437）+ 解释张亦川'低价值猎物气质'（line 437-441）= 存在感主题被首次清晰命名。
      高锰酸钾意外解锁白糖炸弹关键（line 519-523）= desire line 推进。
      '秦良岳' 这个'容易被记住的名字'（line 555）= 张亦川存在感焦虑的又一次刺痛。

  arc_6_factory_climax_and_doctor_death:
    label: "零食工厂造炸弹 + 无名同伴自爆殉道 + 双刀感染者群覆灭 + 秦良岳自选感染告别"
    value_starting: "六人困守原料仓库 + 双刀感染者居中难炸"
    value_ending: |
      五人幸存 + 取消编号制重新互认（被记住的胜利）→ 几天后秦良岳自选感染告别（意义的最终安放）
    climax_event: |
      无名同伴自告奋勇开皮卡载炸药冲入感染者群自爆（line 645-665）→ 双刀感染者群覆灭（line 673）；
      数日后失明的秦良岳告别 → 张亦川偷割其臂 + 涂感染者血肉助其自选感染安乐死（line 679-715）→ 秦良岳'蹦跳着' 奔向夕阳倒下（line 715-721）
    source_anchor: "line 411-721"
    function: |
      故事 main climax 与 controlling_idea 引爆：
      无名同伴自爆 → 张亦川'那是一条命不是踏板 / 是同伴呀'（line 663）—— 推翻陶亦仁'死亡是路障' 哲学。
      秦良岳告别独白（救过的病人 / 垫付医药费 / 患癌后世界观崩塌 / 害怕被遗忘 line 685-691）= 与张亦川'我们很像'（line 691）。
      张亦川'因你而活的人还活着，你所做的一切就都有意义'（line 693）= controlling_idea 落地 + 自我治愈。
      秦良岳自选感染（line 707-715）= 系列'自选感染 / 求死' 母题的本篇变体（区别于《学校》自感染求生 /《燃烧》周全自燃换药）。

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "无名同伴开皮卡自爆灭双刀感染者群 → 张亦川'那是一条命，是同伴呀' 的哲学崩塌"
    source_anchor: "line 645-665"
    why_climax: |
      全篇 desire line（消灭追兵）与 shadow_desire（存在感 / 意义）在此同时引爆：
      - desire 兑现：白糖 / 高锰酸钾炸弹 + 自爆皮卡终结了追了好几周的双刀感染者群（line 673）
      - shadow_desire 转向：张亦川亲眼看见'连名字都不知道' 的同伴比大拇指赴死（line 661），
        陶亦仁'死亡是路障，跨过去才能继续' 的信条在他心里崩塌 ——
        '那是一条命，一个完整的人，一个有着自己故事的存在，不是踏板，不是零件 —— 那个人是同伴呀'（line 663）。
      这是张亦川从'继承陶亦仁的工具理性' 转向'承认每条命的不可替代' 的拐点。

  closing_reversal:
    event: "秦良岳自选感染告别 + 张亦川'每个人的存在便都是那个人来过的印记'"
    source_anchor: "line 679-721"
    function: |
      不是 happy ending 也不是 hopeless ending —— 是'见证式安放' 的余韵 ending（与《燃烧》obligated ending 平行但不同）：
      秦良岳和张亦川都'害怕被遗忘、害怕所做一切无意义'（line 685-691）—— 两个'存在感焦虑者' 互相确认。
