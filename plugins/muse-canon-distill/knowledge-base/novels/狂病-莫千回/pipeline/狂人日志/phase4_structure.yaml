  - "罗允本篇立誓'录音机主人也得死'（line 307）—— 真罗允是否在某篇真的与假罗允对决？罗允是否知道有人冒充自己？"
  - "林东青（吴先生徒弟，phase0）—— 本篇未出现；'期待与听到录音机的人或组织相遇'（line 301）是否是收徒机制的种子？"
