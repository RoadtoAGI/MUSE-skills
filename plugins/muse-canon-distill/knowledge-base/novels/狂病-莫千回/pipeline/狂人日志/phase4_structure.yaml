_meta:
  version: "1.0"
  chapter: "狂人日志"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    Arc 6 段 —— 嵌套式信息下沉结构（非连续受难）：
    外框 Arc 1 / Arc 6 夹着录音内层 Arc 2-5；
    内层每个 Arc 闭合 = 一次"对吴先生的认知再下沉一档"。
    POV 在 Arc 4 起从录音第一人称下沉到录音内重演（李伟限知 POV），Arc 5 末拉回，Arc 6 回到框层。

# === Arc 1: 框层发现 ===

arc_1:
  label: "框层：罗允逃进暗门小屋 + 发现录音机 + 第一组录音 + 地下室展厅"
  source_anchor: "line 5-71"
  sequences:
    - seq_id: "1.1"
      label: "罗允逃生 + 暗门小屋 + 录音机登场"
      source_anchor: "line 5-9"
      core_conflict: "被感染者追杀的求生 vs 未知小屋的诡异"
      progression: |
        罗允被十几个感染者追击 → 胡乱逃进偏僻小屋 → 发现通向其他地方的暗门 → 跪倒喘息
        眼睛适应黑暗 → 看见老式录像带放映机 + 大屁股电视 + 一墙录像带
        桌上长方形物体 = 录音机 → 罗允按下播放键 → 模糊声音响起
      seq_climax: "按下播放键（line 9）—— 激励事件：物理求生切入认知恐怖"

    - seq_id: "1.2"
      label: "第一组录音：老康死 / 三只猪崽 / 私人堡垒 / 电台暴乱"
      source_anchor: "line 11-47"
      core_conflict: "罗允的好奇 vs 录音内容的逐步揭恶"
      progression: |
        录音第一人称（吴先生）：老康偷钳子被抓服氰化物自杀（line 13）→ 地下室关着三只'猪仔'
        电台听到东城大规模血腥群殴 → 警察撑不住（line 19）→ 17 号警方电台陷入停滞（line 21）
        吴先生去镇上 → 把堵车出城人潮当'自助餐厅'（line 41）→ 哄骗几个'寻找避难所的猪仔'回堡垒
        老康'末日理论：武器+女人'（line 27）+ 416 号录像带（line 25）
      seq_climax: "吴先生把出城绞肉机当自助餐 + '地下室进货比平常容易'（line 41）—— 第一人称游戏化嗜虐自白确立"

    - seq_id: "1.3"
      label: "罗允背后人影幻觉 + 下地下室展厅 + 取汽油"
      source_anchor: "line 49-71"
      core_conflict: "罗允的恐惧 vs 展厅的恶心冲击"
      progression: |
        录音停 → 罗允感觉背后有人影 → 甩椅子却空无一人（line 49-51）→ 确认'录制者是天生的恶鬼'（line 53）
        闻到腥臭带甜味 → 书架后虚掩暗门（line 55）→ 卡住椅子保退路 → 进地下室
        血腥派对展厅：悬吊腐烂人头当气球 + 肠子拼'欢迎参观' + 人头蛋糕塞断手 + '欢迎见证我的时代'（line 63-67）
        墙上受害者照片 + 汽油桶 + 发电机 + 红字推荐录像带标号 → 罗允拎出汽油 + 重新坐回按播放键
      seq_climax: |
        人头蛋糕'欢迎见证我的时代'（line 67）—— 主题句第一次回声 + 把吴先生的恶具象成可参观展品
        '相比那些感染者，这个里面的东西更加让自己感到恐惧'（line 53）—— 框层戏剧问题成形
  arc_progression_note: "1.1 物理求生 → 1.2 录音揭恶 → 1.3 展厅实证 + 罗允想象人影（暗示听者会被恐惧侵入）"

# === Arc 2: 录音内层 —— 爆发期猎杀 + 拒绝感染 ===

arc_2:
  label: "录音内层：病毒爆发期吴先生猎杀游戏 + 哄骗夫妻猪仔 + 主动拒绝感染"
  source_anchor: "line 73-121"
  sequences:
    - seq_id: "2.1"
      label: "童年蚂蚁记忆 + 哄骗夫妻猪仔'放他们自由'"
      source_anchor: "line 73-79"
      core_conflict: "吴先生的猎杀快感 vs 夫妻猪仔的求生希望"
      progression: |
        吴先生回忆童年把结茧虫子放蚂蚁窝看分解的快乐（line 73）→ 今天又体验到
        告诉夫妻猪仔'要放他们自由'→ 让他们帮运送昏迷新猪仔 → 蒙眼反绑'装作防止知道地方'
        编造'新猪仔也是社交软件骗来'谎言（夫妻当初就是线下聚会被骗 line 77）
      seq_climax: "童年蚂蚁记忆（line 73）—— 吴先生猎杀本能先于病毒存在的童年实证"

    - seq_id: "2.2"
      label: "望远镜看夫妻猪仔被笑脸人分食 + 主宰快感"
      source_anchor: "line 79-83"
      core_conflict: "夫妻猪仔的逃生 vs 吴先生预设的死亡剧本"
      progression: |
        山坡停车 → 望远镜看到几个吃东西的笑脸人（含两个警察 line 79）
        揭眼罩 + 指城市方向'快点跑趁我还没后悔'→ 夫妻狂奔冲向警察
        丈夫拽警察诉说 + 指吴先生位置 → 才发现警察是笑脸人 → 二人被分食（line 83）
        '他们真的在某一个瞬间蠢到以为我真的会放了他们'
      seq_climax: "望远镜里夫妻被分食（line 83）—— 把'放生'做成猎杀快感的顶点（line 111 '可以主宰别人生命的快感')"

    - seq_id: "2.3"
      label: "理性拒绝感染（核心 lore 锚点）"
      source_anchor: "line 85-87"
      core_conflict: "感染=狂乱新生活的诱惑 vs 感染=降级为弱智的理性否决"
      progression: |
        看分食一幕恍惚 → 思考'既然是病毒就可传染，我是不是也可以成为笑脸人'
        仔细思考后放弃：笑脸人'不能像正常人一样选择性释放欲望 / 就是一群疯狗'
        '变成没有目的、只会施虐的弱智，好像就和畜生也没什么两样了'（line 85）
        回家看六个新猪仔醒来 + 锁链 + 不可思议表情 → '这些才是我真正想要的东西'（line 87）
      seq_climax: |
        line 85 拒绝感染 —— 全篇核心 lore 锚点：
        把'感染'重新定义为'降级'，反社会人格主动拒绝；'享乐需要选择性'的恶的精确性
        与《燃烧》line 111'被感染加入=解脱'形成系列对位

    - seq_id: "2.4"
      label: "4月18号新猪仔入堡垒 + 立伪规则的雏形"
      source_anchor: "line 89-121"
      core_conflict: "豆豆鞋青年的质疑 vs 吴先生的伪安全话术"
      progression: |
        4月18号（line 89）告诉六人'束缚是为安全 / 我会保障生活 / 确认安全就放自由'
        豆豆鞋非主流青年质疑'拴一起更危险/另有所图'（line 91-93）
        吴先生询问其他人'谁想法一样可以送出去'→ 青年二人组继续闹 → 被带出地堡
        送回公路（更混乱：变形汽车里有肉块 + 笑脸人奔跑 line 97）→ 割绳警告安静
        假打火 + 假装引擎故障 + 假装忘放手刹 → 引来笑脸人注意 → 弃二人而去（line 107-109）
        '主宰别人生命的快感无论尝试几次都让人欲罢不能'（line 111）
        回堡垒对剩四人（李伟·张露露·赵维胜·赵小军）半真半假交代 + 藏录像带犯罪证据 + 还手机用品减戒心（line 113-121）
      seq_climax: |
        假打火弃杀豆豆鞋二人组（line 107-109）—— 吴先生猎杀从即时享乐进化为'放生式主宰快感'
        '主宰快感欲罢不能'（line 111）= Arc 2 价值结算
  arc_progression_note: "2.1 童年本能 → 2.2 放生猎杀 → 2.3 理性拒绝感染（恶独立于病毒）→ 2.4 从孤狼升级为剧场主宰者"

# === Arc 3: 录音内层 —— 立团队规则 + 搜物资重演开始 ===

arc_3:
  label: "录音内层：4月19立'外出搜物资'团队剧本 + 与赵维胜首次搜物资 + 超市遇袭"
  source_anchor: "line 123-181"
  sequences:
    - seq_id: "3.1"
      label: "4月19解除束缚 + 分房分刀 + 立伪公平外出规则"
      source_anchor: "line 123-127"
      core_conflict: "吴先生伪善规则 vs 猪仔残存的戒心"
      progression: |
        4月19（line 123）解束缚 + 丰盛早餐 + 参观木屋 + 分房（女人孩子一间 / 三个男的一间）
        分自卫刀具：李伟短柄斧 / 赵维胜开山刀 / 吴先生腰刀+多功能折叠铲（line 125）
        留守规则：李伟留守保护女人孩子 + 危险时从暗门进坚固地下室（line 125）
        李伟戒心大减 + 向赵维胜保证用命保护孩子
      seq_climax: "伪公平规则落地（一冒险一留守 + 主人每次参加 line 115）—— 把屠宰场包装成'互信避难所'"

    - seq_id: "3.2"
      label: "首次搜物资 + 镇子沦陷 + 杀三个笑脸人 + 赵维胜身手"
      source_anchor: "line 127-153"
      core_conflict: "搜物资求生 vs 镇子里的笑脸人"
      progression: |
        与赵维胜去镇子 → 电线杆吊尸 → 赵维胜叹'镇子沦陷' + 为儿子拼命（line 131）
        潜行靠近 → 衣衫褴褛男人被三笑脸人虐杀（抠眼当尿壶 + 砖石砸碎骨头 line 143-145）
        吴先生阻止赵维胜搭救（拿'你儿子谁照顾'压制 line 141）
        偷袭杀三个啃尸笑脸人（折叠铲 + 开山刀 line 149）
        阿花平价超市（line 151）→ 路上吴先生猜赵维胜是否当过海军陆战队（自曝偷东西被开除 / 老康精神问题被踢出 line 153）
      seq_climax: "抠眼当尿壶虐杀（line 143）—— 吴先生'期待普通人释放恶兽'的旁观快感 + 用'你儿子'操控赵维胜"

    - seq_id: "3.3"
      label: "超市搜物资 + 笑脸人四面埋伏 + 逃回越野车"
      source_anchor: "line 155-167"
      core_conflict: "物资到手 vs 超市埋伏的笑脸人群"
      progression: |
        进超市 → 货架倒地 + 腐肉 + 货物基本都在（line 155）→ 赵维胜装罐头 / 吴先生装糖果零食'给孩子'
        赵维胜要求倒掉零食拿有用物资（line 157）
        细微笑声 → 此起彼伏笑声从四面响起 → 笑脸人冲进来（line 159）
        左右开弓杀出 → 笑脸人无痛觉砍出见骨伤仍冲（line 163）
        逃进树林 → 赵维胜被拽倒 → 吴先生回身救 → 上越野车甩掉笑脸人（line 165）
      seq_climax: |
        超市四面埋伏（line 159）—— 感染者'诈死 / 埋伏'进化战术（与《燃烧》进化 lore 同源）
        吴先生'装糖果零食给孩子'（line 157）= 蛋糕感染源剧本的最早伏笔

    - seq_id: "3.4"
      label: "车厢内赵维胜讲述身世 + 吴先生的反胃 + 编造身世"
      source_anchor: "line 167-181"
      core_conflict: "赵维胜的真诚信任 vs 吴先生的伪装与隐秘反胃"
      progression: |
        劫后赵维胜感谢 → 讲身世：父亡 + 控制欲暴力母亲 + 从无归属感 → 妻子孩子给了归属
        爆发时亲手用花瓶砸死扑向儿子的感染妻子（line 173）→ 带孩子逃出城
        赵维胜坦白'起初以为吴先生是变态疯子'（迷晕锁地下室 line 175）→ 吴先生'不知为何有些反胃'但微笑掩饰（line 177）
        吴先生编造'不喜城市喧嚣 + 和兄弟建小屋开户外用品店'洒脱身世（line 179）
        饭桌赵维胜当众感谢吴先生救命 + 赵小军崇拜竖拇指 → '主宰们的感情永远这么单纯且无聊'（line 181）
      seq_climax: |
        '主宰们的感情永远这么单纯且无聊'（line 181）—— 吴先生对'真诚 / 信任'的彻底蔑视
        '不知为何有些反胃'（line 177）= 吴先生唯一一处微妙生理反应（对被夸'好人'的不适）—— 维度暗示
  arc_progression_note: "3.1 立剧本规则 → 3.2-3.3 真实求生历险（建立赵维胜可信形象 + 蛋糕伏笔）→ 3.4 信任被建立到顶点（为 Arc 4-5 覆灭储备情感）。注：line 183 前叙述仍为吴先生第一人称日记，line 183 起 POV 下沉"

# === Arc 4: 录音内重演（李伟 POV）—— 服务区地狱 + 天神救场 ===

arc_4:
  label: "录音内重演（切第三人称/李伟限知）：李伟外出 + 服务区人体油箱地狱 + 吴先生抛弃又燃烧瓶救场"
  source_anchor: "line 183-249"
  sequences:
    - seq_id: "4.1"
      label: "POV 切换 + 李伟·张露露的不安 + 张露露识破吴先生眼神"
      source_anchor: "line 183-193"
      core_conflict: "李伟·张露露的隐隐不安 vs 对吴先生的勉强信任"
      progression: |
        天亮 → 李伟轮到外出 → 张露露劝'离开这里吧' → 李伟苦笑'孤儿院相识 / 除彼此一无所有 / 无处可去'（line 185）
        张露露'吴先生眼神和死人一样没有感情'（line 187）→ 李伟劝'近视也这样 / 既来之则安之'
        吴先生招呼吃早餐 + '这次多带点东西'
        临行赵维胜拍胸脯保证用命守护女人孩子 + 张露露叮嘱李伟（line 191）
        张露露感到吴先生一直盯着自己心里发毛（line 193）
      seq_climax: |
        POV 正式下沉到 L2（line 183）—— 读者短暂'忘记自己在听录音'
        张露露'眼神和死人一样'（line 187）= 全篇唯一识破者，却被劝服 —— 最大反讽装置

    - seq_id: "4.2"
      label: "车内'干爹'对话 + 李伟婚礼噩梦（剖腹预演）"
      source_anchor: "line 195-207"
      core_conflict: "李伟对未来的憧憬 vs 噩梦预兆的真相"
      progression: |
        吴先生'你和女友很爱啊'+ 自语'结婚啊，挺幸福的'（line 195-197）
        李伟憧憬末日后一家人生活 + 让吴先生当孩子干爹 → 吴先生答应 + 突然笑（line 199）
        吴先生解释'想到当干爹的快乐画面'掩饰
        吴先生提议去远处高速服务区 → 让李伟先眯一会儿
        李伟梦：婚礼殿堂 + 所有人祝福 + 赵小军当花童 + 赵维胜·吴先生当伴郎
        梦变诡异：观众微笑变恐怖大笑嘴角撕到耳后 → 吴先生大笑掏尖刀当面剖开张露露肚子（line 205）→ 惊醒
      seq_climax: |
        婚礼噩梦剖腹（line 205）—— 直接预演 Arc 5 张露露开膛的真实结局（梦境作伏笔）
        '想到当干爹的快乐画面'（line 199）= 吴先生表面台词 vs 真实剧本的双关

    - seq_id: "4.3"
      label: "服务区望远镜地狱 + 制定计划 + '不要变成疯子的玩物'伪善台词"
      source_anchor: "line 209-219"
      core_conflict: "搜物资计划 vs 服务区的人造地狱景观"
      progression: |
        停车登山坡 → 吴先生倒吸冷气递望远镜 → 李伟第一次见地狱：
          人肉车轮（铁丝捆成圆球的躯体）+ 引擎盖里油枪插嘴的人体油箱（肚皮撑透明）+ 肠子捆绑跪地幸存者（line 211-213）
        李伟趴地呕吐 → 吴先生拍背安慰'世界已经疯了，我们要做的就是不要变成那些疯子的玩物'（line 213）
        李伟问要不要救那两个幸存者 → 吴先生'救不了 / 困住他们的是周围十几个疯子'（line 215）
        制定计划：从商店后面绕 + 遇少量疯子尽力解决 + 解决不了就撤（line 217）
        放下手刹滑车到近处树林（line 219）
      seq_climax: |
        '我们要做的就是不要变成那些疯子的玩物'（line 213）—— 伪善台词，与 Arc 5 真相落差最大处
        人体油箱 + 人肉车轮（line 211）= 系列'人体作为器物'本篇顶点

    - seq_id: "4.4"
      label: "服务区遇袭 + 吴先生抛弃李伟 + 李伟被绑目睹电锯虐杀 + 燃烧瓶救场"
      source_anchor: "line 221-249"
      core_conflict: "李伟的求生 vs 吴先生'剧本式'抛弃与救援"
      progression: |
        商店搜满一背包 + 按吴先生意思给赵小军找漂亮小蛋糕（line 223）
        撤离时李伟踩到诈死感染者暴露 → 吴先生一刀结果但叫声引来十几疯子（line 223）
        后门冲出遇另一方向围堵 → 李伟被扑倒 → 吴先生骂一句抛下李伟独自逃树林（line 225）
        李伟被砸晕醒来已被绑 → 目睹幸存者被扒皮 + 感染者跳舞 + 电锯从下体锯成两半（line 227-231）
        李伟极度恐惧上吐下泻 → 感染者放弃肉块残骸围向李伟（line 235）
        吴先生扩音喇叭挑衅 → 疯子群冲向他 → 燃烧瓶引爆人体油箱 + 加油站炸碎十几疯子（line 237-239）
        冲击波掀飞李伟 → 吴先生救起 + 解绑 + 捡回李伟背包确认物资没丢 → 撤回树林（line 241-243）
      seq_climax: |
        燃烧瓶引爆人体油箱救场（line 239）—— Arc 4 climax + 跨篇'燃烧瓶引爆救场'手法钩（与《燃烧》Arc 4 远方爆炸源呼应）
        吴先生'抛弃→救回'（line 225 → 239）= 把救援做成剧本的关键铺垫：救李伟只为不让畜生破坏计划（Arc 5 揭穿）
        李伟眼中吴先生'天神下凡'（line 243）= 信任被推到顶点
  arc_progression_note: "4.1 POV 下沉 + 不安 → 4.2 噩梦预演 → 4.3 地狱景观 + 伪善台词 → 4.4 抛弃+救场把信任推到顶点（读者跟李伟体验'天神救场'，却已隐知是剧本）"

# === Arc 5: 录音内重演高潮 —— 覆灭 + 揭谜 + 人性之恶宣言 ===

arc_5:
  label: "录音内重演高潮：张露露·赵小军之死 + 餐车揭谜 + 人性之恶独立宣言 + 赵维胜气死 + 李伟疯掉"
  source_anchor: "line 251-295"
  sequences:
    - seq_id: "5.1"
      label: "饭桌酒话 + 蛋糕回屋 + 张露露惨叫 + 赵小军咬死张露露 + 李伟砍死赵小军"
      source_anchor: "line 251-257"
      core_conflict: "劫后安宁假象 vs 蛋糕感染源引爆"
      progression: |
        饭桌李伟举杯谢吴先生 + 众人敬佩（张露露放下成见 line 247）
        酒话：李伟说今天见感染者一边云雨一边撕咬（line 251）→ 吴先生'下流恶心而且无聊'
        赵小军困 → 张露露带他回屋吃蛋糕（line 249）
        客厅外女人惨叫 → 李伟冲回反锁的房门 → 撞开门
        见赵小军满脸大笑扑咬张露露胸口 + 张露露脖插水果刀 + 眼眶塞蜡烛奄奄一息（line 255）
        李伟失神叫名 → 一斧砍进赵小军脑袋 → 赵维胜绝望哀嚎（line 257）
      seq_climax: |
        蛋糕 = 吴先生预埋感染源（line 223 伏笔 / 281 揭穿）—— 赵小军感染咬死张露露 + 李伟亲手砍死赵小军
        '一边云雨一边撕咬'（line 251）= 感染者性嗜虐 lore + 吴先生'恶心无聊'评价（恶的鉴赏家姿态）

    - seq_id: "5.2"
      label: "李伟 vs 赵维胜互殴 + 吴先生铁管打晕 + 醒来被绑地下室"
      source_anchor: "line 257-263"
      core_conflict: "丧亲二人的互相残杀 vs 吴先生的收网"
      progression: |
        李伟 vs 赵维胜不要命撕打 → 李伟骂赵小军杂种畜生 / 赵维胜骂李伟张露露丧家之犬扫把星克死别人（line 259）
        二人想真杀对方 → 吴先生拎铁管走进 → 二人脑袋剧痛失去知觉（line 261）
        醒来已被绑回地下室 → 仍像疯狗互骂 → 开门声才缓和（line 263）
      seq_climax: |
        李伟 vs 赵维胜互殴（line 259）—— 吴先生设计让受害者互相残杀，'连受害者之间的同情也要猎杀'
        辱骂互克（line 259）= 与系列'感染者保留辱骂语言'的人类版镜像

    - seq_id: "5.3"
      label: "餐车揭谜 + '升华'宣言 + 人性之恶独立宣言（核心 lore 锚点）"
      source_anchor: "line 265-281"
      core_conflict: "李伟·赵维胜的认知 vs 吴先生的剧本总揭穿"
      progression: |
        吴先生吹口哨推白布餐车 + 摄像机对准李伟（line 265）→ 侮辱'不愧是猪仔，一个比一个蠢'
        点题'你不是希望孩子有归宿吗 / 你不是希望和女友有孩子吗'（line 267）
        揭白布：张露露开膛 + 赵小军缝进她肚子 —— '让孩子有归宿 / 让女友有孩子'（line 269）
        吴先生'这不是侮辱，是升华'+ 核心宣言'同情心、愧疚、羞愧、怜悯，这些狗屁，自己从出生起就没有过'（line 273）
        李伟问'那你为什么救赵维胜？为什么舍命救我？'（line 275）
        吴先生'就算小孩玩具被抢也会愤怒抢回 / 不想让畜生破坏自己玩乐的计划'（line 277）
        赵维胜悟'今天一切都是提前想好的？'→ 吴先生狂喜确认'蛋糕 / 感染 / 死亡 / 争斗都是安排好的'（line 279）
        李伟回想超市蛋糕暗示 → 脑中断裂声 → 哭笑着对死去女友诉说未来计划（line 281）
      seq_climax: |
        line 273 人性之恶独立宣言 —— 全篇 main climax + 核心 lore 锚点：
        '从出生起就没有同情心 / 愧疚 / 羞愧 / 怜悯' —— 恶完全独立于病毒
        '救人=不想让畜生破坏玩乐计划'（line 277）—— 把'救'反转为'毁灭剧本'（系列罗允'救人原则'的镜像恶）
        '升华'（line 269）+ '一切提前安排'（line 279）= 吴先生作为剧场主宰者的自我加冕

    - seq_id: "5.4"
      label: "吴先生恶的起源独白 + 赵维胜被活活气死 + 狂喜顶点 + 录音收束回框层"
      source_anchor: "line 283-295"
      core_conflict: "赵维胜的诅咒控诉 vs 吴先生的恶之自我确认"
      progression: |
        李伟疯掉（'猪仔残次品，没玩乐价值' 老康话术 line 283）→ 吴先生转向未崩溃的赵维胜
        赵维胜怒斥'明知跟随者都是可怜人为何还这样' + 诅咒'恶人自有天收'（line 285）
        吴先生笑出泪反驳'狗屁恶人自有天收'+ 起源独白：
          初中被霸凌 + 霸凌者从未受罚 + 曝光无用还看他们步步高升 → '想尝试做坏人 → 发现自己天生就是坏人'（line 287）
          丧失正常感情但恐惧/刺激/快感无比强烈（躲避被发现 + 主导他人性命 + 踩别人脚下 line 287）
        吴先生提'超市想带糖果零食 + 曾想让赵维胜亲手杀感染孩子 / 但更喜欢现在结局'（line 289）
        摄像机凑近赵维胜 → 赵维胜眼鼻嘴流血被活活气死（line 291）→ 吴先生狂喜拿不稳摄像机（line 293）
        吴先生抱摄像机回地下室外 + 用录音机记录这一切（line 295）→ 叙述拉回框层
      seq_climax: |
        赵维胜被'活活气死'（line 291）—— 非物理死亡的恶之精确性 + 吴先生'第一次见活人被气死'狂喜顶点（line 293）
        恶的起源独白（line 287）—— 把'天生坏人'与'霸凌无惩罚'缝合：不是病毒造的恶，是社会从未惩罚的恶
  arc_progression_note: "5.1 蛋糕引爆覆灭 → 5.2 设计受害者互殴 → 5.3 揭谜+人性之恶宣言（main climax）→ 5.4 起源独白+气死+录音收束（回框层）"

# === Arc 6: 框层回归 —— 直接喊话 + 自毁 + 复仇立誓 ===

arc_6:
  label: "框层：吴先生 L3 直接喊话（伪装机制 + 密道）+ 录音机自毁 + 罗允立誓复仇"
  source_anchor: "line 297-307"
  sequences:
    - seq_id: "6.1"
      label: "L3 直接喊话：'我可以是任何人'伪装机制 + 自尽/苟活二选一"
      source_anchor: "line 297-301"
      core_conflict: "吴先生的恐惧传染 vs 罗允的信任与求生意志"
      progression: |
        罗允听完想丢录音机 → 吴先生声音再起跳出日记直接对听者喊话（line 297）
        '像和老康相遇一样我们能迸发更多创意刺激 / 但你和猪仔一样我也开心'（line 299）
        核心：'我所有录音声音都经过修改 / 你接下来遇到的任何幸存者可能都是我 / 我可以是任何人，任何人也都可以是我'（line 299）
        '要么现在原地自尽，要么背负着遇到我的可能性继续苟活'（line 301）
        '我真的很期待与听到录音机的人或者组织相遇'（line 301）
      seq_climax: |
        line 299 伪装机制 —— closing reversal + 核心 lore 锚点（'假罗允'反派核心的本篇出处）：
        把恶做成通过'怀疑'传染信任的机制——比病毒更可怕，因为它感染的是人与人之间最后的信任

    - seq_id: "6.2"
      label: "密道机关 + 录音机自毁 + 罗允复仇立誓"
      source_anchor: "line 301-307"
      core_conflict: "被困在吴先生剧本里 vs 罗允主动反击"
      progression: |
        吴先生给逃生密道：电视机右转三圈左转一圈（line 303）+ '带着这份恐惧一直逃下去吧，猪仔'
        '欢迎来到我的时代'（line 303）—— 主题句最终回声
        录音播完最后一段 → 录音机微弱电流声 + 完全不能开机（动了手脚 line 305）
        罗允深吸气极厌恶把录音机扔到地上 → 看汽油桶 + 看密道电视机 → 阴着脸站起（line 307）
        立誓：'围在外面的感染者全部得死，而这个录音机的主人也得死'（line 307）—— 不狼狈逃，要复仇
      seq_climax: |
        罗允复仇立誓（line 307）—— 全篇收束：见证者转为复仇者
        用复仇意志对抗'被恐惧传染'，是本系列罗允'读者代理人'形象的第三种姿态（拾日记本 / 转达遗言 / 复仇立誓）
  arc_progression_note: "6.1 恐惧传染机制 → 6.2 自毁封死退路 + 罗允拒绝被传染、立誓猎杀猎手（反英雄式正面回应）"

# === 序列间冲击力递增 ===

escalation_check:
  arc_1_to_2: "框层展厅恶心（静态展品）→ 录音第一人称揭'病毒前就在猎杀 + 主动拒绝感染'（动态恶 + 恶独立于病毒）"
  arc_2_to_3: "孤狼放生快感 → 升级为'团队剧场主宰'（伪公平规则把猎物组织成可长期玩弄的剧团 + 蛋糕伏笔）"
  arc_3_to_4: "建立赵维胜/李伟可信形象 + 信任铺垫 → POV 下沉到李伟，'天神救场'把信任推到顶点（读者被拉进剧本）"
  arc_4_to_5: "信任顶点（天神下凡）→ 蛋糕引爆全员覆灭 + 餐车揭谜'一切都是安排好的' + 人性之恶独立宣言（恶的总暴露）"
  arc_5_to_6: "录音内的恶（针对李伟/赵维胜）→ L3 喊话把恶'传染'给听者罗允（针对读者代理人）→ 罗允立誓反击"
  curve_shape: "Arc 1 缓-悬（展厅）→ Arc 2 中（第一人称揭恶 + 拒绝感染）→ Arc 3 缓-真实历险（信任铺垫）→ Arc 4 急（地狱+救场，POV 下沉）→ Arc 5 极急+揭底（main climax）→ Arc 6 静-悬-誓（喊话+自毁+复仇）"
  curve_note: |
    嵌套式信息下沉曲线 —— 与《燃烧》'连续受难'不同：
    本篇张力不靠'每 Arc 死一人'，靠'每 Arc 把对吴先生的认知再下沉一档'；
    Arc 4 的 POV 下沉是结构性最大变奏（读者短暂忘记在听录音），Arc 5 揭底 + Arc 6 喊话双重把读者/罗允拽回框层

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    L0_frame: "第三人称限知（罗允）—— line 5-9 / 49-71 / 297-307：框层听者 / 见证者 / 复仇立誓者"
    L1_tape_diary: "第一人称（吴先生口述日记）—— line 11-47 / 73-181：猎手自白，'猪仔/老康/我的时代'关键词"
    L2_dramatized_replay: "第三人称全知 → 李伟限知（录音内重演）—— line 183-295：读者短暂'忘记在听录音'，跟李伟体验完整求生历险"
    L3_direct_address: "第一人称（吴先生对听者喊话）—— line 297-303：把恐惧传染给读者代理人"
    function: |
      四层 POV 嵌套是莫千回最复杂的叙述实验：
      录音机 = 反派'录像/直播'欲望的便携化身（与廖振宇直播、感染者'被记住'焦虑同源）
      L1→L2 的无缝下沉让读者短暂'入戏'李伟的求生历险，L3 喊话'我所有录音声音都经过修改'再把读者拽回——
      产生'刚才那段亲密历险全程是猎手炫耀战利品'的双重恐怖
      与《学校》日记体（只能记录）/《燃烧》盲女感官替代（只能闻/听/摸）并列三种'记录媒介 POV'实验

  parallel_external_threads:
    - "录像带墙 + 416 号录像带 + 红字推荐标号（line 25 / 71）—— 吴先生'作品集'暗线，跨篇钩（其他角色是否会发现）"
    - "老康死亡线（line 13 氰化物自杀）—— 与系列 T0 时序锚点同源，吴先生同伙背景"
    - "'机场旁医院/避难所传闻'本篇未直接出现 —— 但吴先生'私人堡垒'是反向的'伪避难所'（庇护所即陷阱母题）"
    - "罗允（真）vs 吴先生'我可以是任何人'（假罗允）—— 跨篇最关键对位张力的本篇种子（line 299）"

