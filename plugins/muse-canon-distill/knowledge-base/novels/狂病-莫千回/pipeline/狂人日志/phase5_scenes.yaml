      craft_note: |
        童年把结茧虫子放蚂蚁窝看分解的快乐（line 73）—— 用'童年游戏'锚定猎杀本能先于病毒存在，且'腻了又重新有趣'的快感阈值
        望远镜看夫妻猪仔被笑脸人分食（line 81-83）—— '放生'被做成主宰快感；省略了什么：分食过程用望远镜的'远观'框住，不给近景特写，恶通过吴先生的'希望我能拍下来'的兴奋语气传递
        line 85 拒绝感染的内心权衡 = 全篇思想核心：
          '笑脸人不能像正常人一样选择性释放欲望 / 就是一群疯狗 / 变成没有目的、只会施虐的弱智，好像就和畜生也没什么两样了'
          —— 把'感染'重新定义为'降级'：吴先生的恶需要'选择性 + 控制 + 设计'，感染会夺走这些
          与《燃烧》line 111'被感染加入=解脱'形成系列对位
        '这些才是我真正想要的东西啊'（看锁链猪仔不可思议的表情 line 87）—— 吴先生欲望对象的精确命名：不是杀，是'主宰他人的反应'
    description: "录音：吴先生回忆童年把虫子放蚂蚁窝看分解的快乐 → 哄骗夫妻猪仔'放他们自由' → 望远镜看二人被笑脸人分食 → 思考'我是否也可以感染成笑脸人' → 理性拒绝（'变成只会施虐的弱智就和畜生没两样'）→ 看六个锁链新猪仔不可思议的表情'这才是我真正想要的'"

