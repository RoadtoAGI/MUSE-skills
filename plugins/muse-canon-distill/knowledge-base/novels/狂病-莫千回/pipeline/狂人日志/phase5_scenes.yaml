    description: "POV 李伟：服务区登坡 → 望远镜见人造地狱（人肉车轮/油枪插嘴的人体油箱/肠子捆绑跪地幸存者）→ 吴先生'不要变成疯子玩物'伪善安慰 → 商店搜物资 + 按吴先生意思给赵小军找蛋糕 → 撤离时李伟踩到诈死感染者暴露 → 被扑倒 → 吴先生抛下他独自逃 → 李伟被绑目睹电锯虐杀 → 吴先生扩音喇叭挑衅 + 燃烧瓶引爆人体油箱救场 → 李伟视吴先生为天神"

