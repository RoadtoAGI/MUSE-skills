# === 节奏曲线 ===

pacing_curve:
  arc_1: "缓 → 悬"  # KR-S01 录音机发现 + KR-S02 展厅（静态展品承担恶）
  arc_2: "中"  # KR-S03 拒绝感染（内心权衡，思想核心）
  arc_3: "缓 → 急"  # KR-S04 假打火弃杀 + KR-S05 超市埋伏（真实历险 + 信任铺垫 + 蛋糕伏笔）
  arc_4: "急 → 极急"  # KR-S06 POV 下沉+噩梦 → KR-S07 服务区地狱 + 燃烧瓶救场（信任推到顶点）
  arc_5: "极急 → 揭底"  # KR-S08 蛋糕引爆覆灭 → KR-S09 餐车揭谜 main climax → KR-S10 气死+起源
  arc_6: "静 → 悬 → 誓"  # KR-S11 L3 喊话 + 自毁 + 复仇立誓
  notes: |
    嵌套式信息下沉曲线 —— 与《燃烧》'连续受难'不同：
    张力不靠'每场死一人'，靠'每场把对吴先生的认知再下沉一档'；
    KR-S06 的 POV 下沉是结构性最大变奏（读者短暂忘记在听录音），KR-S09 揭底 + KR-S11 喊话双重把读者/罗允拽回框层
    首尾'欢迎见证/来到我的时代'（KR-S02 line 67 → KR-S11 line 303）形成主题句闭环

