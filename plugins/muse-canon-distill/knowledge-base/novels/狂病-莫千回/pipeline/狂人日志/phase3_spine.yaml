  - "录音机嵌套叙事 + POV 三层下沉（框层罗允 → 录音第一人称 → 录音内重演李伟 POV → 直接喊话）—— 莫千回最复杂的 POV 实验，把'听 / 见证'本身做成主题（与《学校》日记体 / 《燃烧》盲女感官替代并列三种'记录媒介'POV）"
  - "人性之恶独立于病毒：吴先生病毒前就在猎杀 + 病毒后主动拒绝感染（line 85 / 273 / 287）—— 系列 candidate_a 的最强证据篇"
  - "反社会人格主动拒绝感染：'变成没有目的、只会施虐的弱智，好像就和畜生也没什么两样了'（line 85）—— 把'感染'重新定义为'降级'，与《燃烧》'感染=解脱'对位"
  - "把'救人'反转为'毁灭剧本'：吴先生救李伟 / 救赵维胜只是'不想让畜生破坏自己玩乐的计划'（line 277）—— 系列罗允'救人但不强迫'的镜像恶"
  - "伪装机制（假罗允的种子）：'我所有录音声音都经过修改 / 我可以是任何人'（line 299）—— 吴先生跨篇'假罗允'反派核心的本篇出处"
