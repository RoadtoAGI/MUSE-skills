_meta:
  version: "1.0"
  chapter: "狂人日志"
  source: "novels/狂病-莫千回/狂人日志.md"
  word_count_approx: 22300
  validated_against_source: true
  form_note: |
    嵌套（录音机框叙事）+ POV 三层下沉，是本系列最复杂的叙述结构：
    L0 外框（第三人称限知 / 罗允视角）：罗允逃进暗门小屋 → 发现录音机 + 录像带墙 → 一段段按播放键 → 中途下地下室搜物资 → 听完后决定杀光感染者 + 杀掉录音机主人（line 5-9 / 49-71 / 297-307）
    L1 录音内层（第一人称 / 吴先生口述日记）：吴先生以"猪仔""老康""我的时代"为关键词逐日记录自己在病毒爆发期间的猎杀游戏（line 11-181）
    L2 录音内的戏剧化重演（第三人称全知 → 李伟限知 POV）：录音叙述从"吴先生第一人称"无缝切换为"李伟第三人称限知"的全景重演，把吴先生 6 名新猪仔里李伟 / 张露露 / 赵维胜 / 赵小军一家的覆灭演给读者看（line 183-295）—— 读者此刻并不立刻意识到自己仍在"听录音"
    L3 录音的直接喊话（第一人称 / 吴先生对听者）：录音最后吴先生跳出日记，直接对"听到录音机的人"（= 罗允 = 读者代理人）说话，宣告"我可以是任何人"伪装机制 + 给出逃生密道 + "欢迎来到我的时代"（line 297-303）
    POV 功能：
    - 录音机 = 反派的"录像 / 直播"欲望的便携化身（与廖振宇直播、感染者"被记住"焦虑同源）；吴先生把自己的恶做成可被任意陌生人捡到的"传染源"——不是病毒，是恐惧与传闻
    - L2 的第三人称重演让读者短暂"忘记"自己在听录音 → 当 L3 吴先生重新出声、揭穿"我所有录音声音都经过修改"，读者与罗允同步被拽回框层，产生"刚才那段亲密的求生历险其实全程是猎手在炫耀战利品"的双重恐怖
    - 与《学校》日记体 + 罗允拾日记本 / 《燃烧》罗允转达遗言 同源：罗允再次作为"读者代理人 / 延迟见证者"接收一份死者（或猎物）留下的记录

# === 脊椎 ===

spine:
  protagonist: |
    双主体结构：
    - 框层行动主角 = 罗允（真）—— 但他在本篇是"被动听者 / 见证者 / 决定复仇者"，全篇几乎不行动，到最后一行才转为意志主体（line 307）
    - 内层意志主角（反派型）= 吴先生（自称姓吴的木屋主人 / 录音机主人）—— 录音里一切事件的设计者与驱动力
  spine_mode: "information"
  pov_structure:
    L0_frame: "第三人称限知（罗允）—— line 5-9 / 49-71 / 297-307"
    L1_tape_diary: "第一人称（吴先生口述）—— line 11-47 / 73-121"
    L2_dramatized_replay: "第三人称全知 → 李伟限知 POV（录音内的全景重演）—— line 123-295（line 123-181 仍是吴先生第一人称日记；line 183 起切换为第三人称重演）"
    L3_direct_address: "第一人称（吴先生对听者喊话）—— line 297-303"
    function: |
      spine_mode = information：本篇的组织力不是"谁想得到什么"，而是"录音机里的信息如何一层层揭示吴先生这个人究竟是什么"——
      每按一次播放键，罗允（和读者）对录音机主人的认知就下沉一档：
      变态 → 病毒前就在猎人 → 主动拒绝感染 → 把救人也算计进猎杀剧本 → "我可以是任何人"
      信息揭示的终点不是真相和解，而是恐惧的不可摆脱（"我永远都有可能会来到你的身边" line 299）
  desire_object: |
    内层（吴先生）：不是生存，是"主宰他人性命的快感"被无限延续 + "被记住 / 我的时代"被建立（line 111 主宰快感 / 67 "欢迎见证我的时代" / 303 "欢迎来到我的时代"）
    框层（罗允）：先是单纯求生 / 找物资，听完录音后欲望被改写为"杀光外面的感染者 + 杀掉录音机主人"（line 307）
  shadow_desire: |
    吴先生的 shadow_desire：他口口声声"主宰快感""有趣"，但 L3 暴露真正驱动他的是把恐惧"传染"出去——
    "我要让你知道，现在这个末世，不只有弱智畜生一样的笑脸人，还有我这种可爱的存在"（line 299）
    他要的不是杀人本身，是让幸存者带着"任何帮助你的人都可能是我"的怀疑活下去——把人性最后的"信任"也猎杀掉
    这与病毒"解开束缚"形成对位：病毒让人变弱智畜生，吴先生让人不敢再信任同类
  conscious_vs_unconscious:
    conscious: "吴先生：消耗猪仔 / 换身份避风头 / 设计救人剧本 / 录像留念 / 录音留给下一个听者"
    unconscious: |
      吴先生自述"从出生起就没有同情心、愧疚、羞愧、怜悯"（line 273），他不需要"不自觉的需要"——
      他是被设计成没有内在缺口的反派；他的"弧光"不是改变，是自我确认（"我发现自己就是天生的坏人" line 287）
      真正的不自觉层在罗允：罗允听完后不只是恐惧，而是被"录音机主人也得死"的复仇意志填满（line 307）——
      这是本系列"灰色男主 / 见证者"罗允难得一次主动选择"猎杀猎手"

# === 激励事件 ===

inciting_incident:
  event: "罗允被十几个感染者追击 → 胡乱逃进偏僻小屋 → 发现暗门后的房间里有录音机 + 录像带墙 → 按下播放键，吴先生的声音响起"
  source_anchor: "line 5-9"
  type: "accident"
  delay_from_opening_chars_approx: 600
  function: |
    本篇激励事件是"按下播放键"这个动作（line 9）——
    它打破的不是罗允的物理平衡（他已经在被追杀），而是他的认知平衡：
    从"外面的感染者是最可怕的"被改写为"录制这些内容的家伙，则完全是一个天生的恶鬼"（line 53）
    末日开篇标准节奏的变奏：不是开篇遇险，而是"避险成功后发现更深的恐怖在屋内"——
    安全屋 = 恶魔的展厅，把"庇护所即陷阱"的系列母题做成了开场结构

# === 戏剧问题 ===

dramatic_question:
  main: "录音机里的这个人究竟是什么？听完之后，罗允（和读者）还能不能再信任任何一个向自己伸出援手的幸存者？"
  subtext: |
    在一个病毒会把人变成"没有理智的弱智畜生"的世界里，
    一个理智完好、却天生没有道德感的人，是不是比病毒更可怕？
    "人性之恶"到底是被病毒解放出来的，还是本就独立存在、根本不需要病毒？
    （吴先生的答案：独立存在——他病毒前就在猎杀，病毒后主动拒绝感染，line 11-17 / 85）
  payoff: |
    答案是双重的、且不给出口：
    (1) 信息层：录音逐层确认吴先生"从出生起就没有同情心"（line 273）+ "天生的坏人"（line 287）——
        人性之恶完全独立于病毒，病毒只是给了它一个更方便的舞台
    (2) 恐惧层：L3 吴先生宣告"我所有录音的声音都经过了修改，你接下来遇到的任何幸存者，可能都是我"（line 299）——
        必答场景不是"罗允找到并杀死吴先生"，而是"罗允永远无法确认下一个救他的人是不是吴先生"
    最终罗允的回答（line 307）：不自尽、不带着恐惧逃，而是决定"围在外面的感染者全部得死，这个录音机的主人也得死"——
    用复仇意志对抗"被恐惧传染"，是本篇罕见的反英雄式正面回应

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: "框层：十几个感染者把罗允逼进小屋（line 5）+ 录音机最后自毁断电（line 305）；内层：高速 / 镇子 / 服务区的笑脸人群（line 79 / 133 / 211-239）"
    layer_2_environment: "暗门套暗门的小屋 + 地下室血腥派对展厅（人头气球 / 肠子拼字 / 人头蛋糕 line 63-67）+ 汽油桶 + 发电机（line 71）+ 通向密道的电视机机关（line 303）"
    layer_3_human_engineered: |
      吴先生的"人造危险"远比感染者可怕——
      人肉车轮 + 油枪灌进嘴的人体油箱（line 211）/ 肠子捆绑跪地幸存者（line 213）/
      把人放回原地引感染者注意（假打火 line 107-109）/ 把救人做成剧本的服务区埋伏（line 279-289）
  interpersonal:
    layer_1_predator_prey: "吴先生 vs 历任'猪仔'——夫妻猪仔（line 75-83）/ 豆豆鞋青年二人组（line 91-111）/ 李伟·张露露·赵维胜·赵小军一家（line 115-295）"
    layer_2_fake_trust: "吴先生伪装'可靠木屋主人 / 活菩萨 / 天神下凡'骗取信任（line 177 活菩萨 / 243 天神下凡 / 247 众人敬佩），再在最高信任点引爆背叛"
    layer_3_collapse_among_victims: "李伟 vs 赵维胜——吴先生设计让二人在丧子 / 丧女后互相残杀辱骂（line 259），证明他连'受害者之间的同情'也要猎杀"
  internal:
    layer_1_wu: "吴先生几乎没有内在阻力——他自述天生无同情心（line 273），唯一'内在'是'有趣 / 无聊'的快感阈值（line 73 / 85 玩腻了 / 283 没有玩乐价值）"
    layer_2_wu_refuse: "吴先生唯一一次'内心权衡'：思考要不要主动感染成为笑脸人，最后理性拒绝——'变成没有目的、只会施虐的弱智，好像就和畜生也没什么两样了'（line 85）"
    layer_3_luo: "罗允的内在阻力：听完录音后的恶心 / 头皮发麻 / 想丢掉录音机（line 53 / 297）vs 最终升起的复仇决心（line 307）"
  societal:
    - "公权力全面沦陷：警察电台陷入混乱、警察也变成笑脸人（line 21 / 37）—— 与系列 T1/T2 时序同源"
    - "老康因偷钳子被抓 + 服氰化物自杀（line 13）—— 与 phase0 evidence / phase1 civilization_collapse_timeline T0 同源锚点"
    - "交通规则失效 + 出城人潮 → 公路绞肉机（line 31-33）—— 与《地铁》《恶》公路意象同源"
    - "录像 / 录音 / 望远镜 多层窥镜：吴先生用录像带（416 号 line 25）、摄像机（line 265 / 295）、录音机记录暴行 —— '被记住'欲望与系列 public_imagery 多层窥镜套娃同源"

# === Arc 框架 ===

arc_framework:
  total_arcs: 6
  notes: |
    本篇 Arc 框架是"嵌套式信息下沉"而非"连续受难"——
    外框（Arc 1 / Arc 6）夹着录音内层（Arc 2-5）；
    内层 4 个 Arc 不是按受难者死亡数计，而是按"罗允对吴先生的认知下沉档次"计：
    变态展厅（Arc 2）→ 病毒前就在猎人 + 主动拒绝感染（Arc 3）→ 把救人算进剧本（Arc 4）→ 升华尸体 + 人性之恶独立宣言 + 伪装喊话（Arc 5）
    每个 Arc 闭合 = 一次"以为已经够坏了"被推翻

  arc_1_frame_discovery:
    label: "框层：罗允逃进暗门小屋 + 发现录音机 + 第一段录音（老康死 / 三只猪崽 / 私人堡垒）"
    value_starting: "侥幸逃生的微薄安宁（暗门救了命）"
    value_ending: "认知初次崩坏（外面的感染者不是最可怕的，录音机主人才是天生的恶鬼）+ 想象身后有人影的惊悚（line 49）"
    climax_event: "第一组录音播完 + 罗允感觉背后有人影 + 甩椅子却空无一人 + 确认'录制这些内容的家伙完全是一个天生的恶鬼'（line 49-53）"
    source_anchor: "line 5-71"
    function: |
      建立 L0 框层 POV（罗允）+ 录音机装置；
      第一段录音教学吴先生的世界观关键词："猪仔 / 老康 / 黑室 / 私人堡垒 / 我的时代"（line 11-17 / 67）
      地下室血腥派对展厅（人头气球 / 肠子拼"欢迎参观" / 人头蛋糕"欢迎见证我的时代" line 63-67）= 把吴先生的恶具象成可参观的展品
      老康氰化物自杀（line 13）= 与系列 T0 时序锚点对齐
      '欢迎见证我的时代'（line 67）首次出现 = 全篇主题句的第一次回声

  arc_2_tape_outbreak_hunting:
    label: "录音内层：病毒爆发期吴先生的猎杀游戏（堵车自助餐 / 哄骗夫妻猪仔 / 主动拒绝感染）"
    value_starting: "罗允把吴先生当'变态恶鬼'（已知够坏）"
    value_ending: "认知下沉——吴先生是病毒前就存在的猎人，且理性地主动拒绝感染（恶独立于病毒）"
    climax_event: |
      吴先生哄骗夫妻猪仔'放他们自由' → 用望远镜看他们被笑脸人分食（line 81-83）
      → 当晚思考'我是不是也可以成为笑脸人' → 理性拒绝：'变成没有目的、只会施虐的弱智，好像就和畜生也没什么两样了'（line 85）
    source_anchor: "line 11-121"
    function: |
      核心 lore 锚点 1——反社会人格主动拒绝感染（line 85）：
        感染对吴先生是"降级"，因为感染者失去了"选择性释放欲望"的能力，沦为"疯狗 / 弱智 / 畜生"
        这与《燃烧》line 111 李太太"被感染加入"提议形成系列对位：一边把感染当解脱，一边把感染当降格
      核心 lore 锚点 2——病毒前就在猎杀（line 11-17 老康 + 地下室三只猪崽 + 黑室电台）：
        证明吴先生的恶完全先于病毒存在
      手法：吴先生把堵车 / 出城人潮当"自助餐厅"（line 41）+ 把放生当快感（line 111）—— 游戏化嗜虐的第一人称自白版

  arc_3_recruit_and_cull:
    label: "录音内层：六个新猪仔入堡垒 + 剔除两个刺头（假打火喂感染者）+ 立'外出搜物资'团队规则"
    value_starting: "吴先生是孤狼猎人（独自享乐）"
    value_ending: "吴先生升级为'团队主宰者'——用伪装的'公平 / 安全 / 互信'规则把猎物组织成可长期玩弄的剧团"
    climax_event: |
      豆豆鞋青年二人组质疑吴先生 → 被送回公路 → 吴先生假装引擎故障、假装忘放手刹，故意用打火声引来笑脸人注意，弃二人而去（line 107-109）
      → 对剩下四人（李伟·张露露·赵维胜·赵小军）编造'兄弟老康丧生 / 需要外出搜物资'的剧本（line 115-121）
    source_anchor: "line 89-181"
    function: |
      吴先生的猎杀从"即时享乐"进化为"长期剧场"——
      他设计'每次外出两男 / 一冒险一留守 / 主人必参加'的伪公平规则（line 115），让猪仔自愿留在屠宰场
      假打火弃杀（line 107-109）= "可以主宰别人生命的快感 / 放生快感"（line 111）的具体手法
      引入受害者群像：李伟 / 张露露（孤儿院情侣）+ 赵维胜 / 赵小军（单亲父子）—— 为 Arc 4-5 的覆灭储备情感投资
      L2 重演的伏笔：录音叙述在 line 123-181 仍是第一人称，但已开始大段重演场景（搜物资 / 超市遇袭），为 line 183 的 POV 切换铺路

  arc_4_dramatized_li_wei:
    label: "录音内重演（切李伟 POV）：李伟外出搜物资 + 服务区人体油箱地狱 + 吴先生抛弃李伟又燃烧瓶救场"
    value_starting: "李伟把吴先生当'靠谱可托付的木屋主人 / 干爹'（最高信任点）"
    value_ending: "李伟把吴先生当'天神下凡的救命恩人'（信任被推到顶点）—— 而读者已隐隐知道这是猎手的剧本"
    climax_event: |
      服务区李伟踩到诈死感染者暴露 → 吴先生抛下被扑倒的李伟独自逃进树林（line 225）
      → 李伟被绑成待宰羔羊、目睹幸存者被电锯锯成两半（line 229-231）
      → 吴先生用扩音喇叭挑衅感染者 + 燃烧瓶引爆人体油箱 + 加油站，炸碎十几个感染者救回李伟（line 237-243）
    source_anchor: "line 183-249"
    function: |
      POV 正式下沉到 L2——line 183 起叙述从吴先生第一人称无缝切到第三人称 / 李伟限知 POV：
        读者短暂"忘记自己在听录音"，跟着李伟体验"婚礼噩梦 → 服务区地狱 → 天神救场"的完整求生历险
      关键反讽装置：张露露早察觉'吴先生眼神和死人一样没有感情'（line 187）—— 唯一识破者，却被劝服
      李伟婚礼噩梦中吴先生剖开张露露肚子（line 205）—— 直接预演 Arc 5 的真实结局（梦境作为伏笔）
      吴先生"我们要做的就是不要变成那些疯子的玩物"（line 213）—— 伪善台词 vs Arc 5 真相的最大落差
      人体油箱 / 人肉车轮（line 211）= 系列 public_imagery'人体作为器物'的本篇顶点
      燃烧瓶炸人体油箱（line 239）—— 与《燃烧》Arc 4 远方爆炸源形成跨篇钩（同一种'燃烧瓶引爆救场'手法）

  arc_5_revelation_and_relay:
    label: "录音内重演高潮：张露露·赵小军之死 + 餐车揭谜 + 人性之恶独立宣言 + 赵维胜被气死 + 李伟疯掉"
    value_starting: "众人把吴先生当救命恩人（信任顶点）"
    value_ending: "全员覆灭 + 吴先生宣告'我从出生起就没有同情心'+ '这一切都是我提前安排好的'（恶的总暴露）"
    climax_event: |
      张露露被感染的赵小军咬死（蛋糕 = 吴先生预埋的感染源 line 249 / 281）→ 李伟一斧砍死赵小军 → 李伟 vs 赵维胜互殴 → 吴先生铁管打晕二人（line 253-261）
      → 地下室餐车揭白布：张露露开膛 + 赵小军被缝进她肚子（"让孩子有归宿 / 让女友有孩子" line 269）
      → 吴先生宣告'这不是侮辱，是升华'+ '同情心、愧疚、羞愧、怜悯，这些狗屁，自己从来都没有过'（line 273）
      → '发生的一切自己早就想好了'（line 279）→ 赵维胜被活活气死（line 291）→ 李伟精神崩溃疯掉（line 281-283）
    source_anchor: "line 251-295"
    function: |
      全篇 main climax + 核心 lore 锚点 3——人性之恶独立于病毒的总宣言：
        line 273 "同情心、愧疚、羞愧、怜悯，这些狗屁，自己从来都没有过"——吴先生从出生即无道德感
        line 287 起源独白：初中被霸凌 + 霸凌者从未受罚 + 试图曝光无用 → "想尝试做坏人 → 发现自己就是天生的坏人"
        → 病毒只是给了这个本就存在的恶一个不再受惩罚的舞台
      "救人也是剧本"的揭穿（line 277-281）：吴先生救李伟、救赵维胜，是"不想让畜生破坏自己玩乐的计划"——
        把《燃烧》罗允式'救人但不强迫'的善，彻底反转为'救人是为了更完整地毁掉你'的恶（candidate_c 的极端版）
      赵维胜被'气死'（line 291）= 莫千回式'非物理死亡'——心理伤害本身致命，吴先生因此达到狂喜顶点（line 293）
      L2 重演在此结束（line 295 吴先生抱摄像机回去用录音机记录），叙述将拉回框层

  arc_6_frame_relay_and_vow:
    label: "框层回归：吴先生 L3 直接喊话（'我可以是任何人'+ 密道）+ 录音机自毁 + 罗允立誓复仇"
    value_starting: "罗允听完全部录音的恶心与恐惧（想丢掉录音机 line 297）"
    value_ending: "罗允拒绝被恐惧传染，立誓'外面的感染者全得死 + 录音机主人也得死'（line 307）"
    climax_event: |
      录音末段吴先生跳出日记直接对听者喊话：'我所有录音的声音都经过修改 / 你接下来遇到的任何幸存者可能都是我 / 我可以是任何人'（line 299）
      → '要么现在原地自尽，要么背负着遇到我的可能性继续苟活'（line 301）
      → 给出电视机右转三圈左转一圈的逃生密道 + '欢迎来到我的时代'（line 303）
      → 录音机播完最后一段后自毁断电（line 305）
      → 罗允极为厌恶地把录音机扔到地上 + 看汽油桶 + 看密道电视 + 阴着脸站起 + 立誓复仇（line 307）
