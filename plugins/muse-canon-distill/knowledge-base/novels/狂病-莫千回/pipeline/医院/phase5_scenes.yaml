    description: "陆小虎吃的饭掺手指眼球 → 陈雨琪端第二碗未归 → 冲后厨 → 侯楚霖头埋陈雨琪胸腔 + 陈被开膛 → 陆小虎扑侯被咬手 → 抠爆侯双眼但侯痛觉缺失狂笑'好爽' → 肠子缠陆小虎脖子 → 陆窒息死 → 赵士轩砍杀侯 → 张华报蔡大妈被刀杀 + 吴志强林东青失踪 → 冲回二楼见铁门门栓被打开"

