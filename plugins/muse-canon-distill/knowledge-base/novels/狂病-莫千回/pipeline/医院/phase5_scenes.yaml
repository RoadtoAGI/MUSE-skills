    conflict_type: "interpersonal + internal"
    beat_direction:
      function: "排查彻底失败（蔡大妈暴露）+ 全系列病毒起源 lore 最密集落点（嵌在人物冲突里）"
      craft_note: |
        蔡大妈自作聪明把所有男性问遍 → '由双方都在暗处，变成我们在明处、那个人在暗处'（line 235）—— 排查的'隐秘优势' 被一句话葬送
        李教授学说承载全系列病毒起源 lore：古文寓言《狂犬》全文引（line 247）+ 安史之乱五胡乱华天降异象 + 张巡守城 +
        陨石近距离掠过=导火索（line 277）+ 《狂病编年史》业史 + H国废料排海=现代规模化主因（line 281）+ 75%本源感染率（line 287）+ 可能是基因层面改变（line 283）
        手艺关键：这一大段 exposition 全程嵌在'张华抬杠'（正史造假/现代防疫无敌）的对抗里 —— 用人物冲突运送说明文，避免知识倾倒
        罗允据此判断张华不是杀手（'能把杠精演这么像，被干掉也认了'，line 273）—— 用排查逻辑消化掉一个嫌疑人
        【省略了什么】：李教授本人从未出场（全靠'我' 转述），他的研究细节、安史之乱故事'我' 只讲'那部分'（line 251 戛然），
        把起源 lore 处理成'残缺的二手知识'，既保留神秘又服务'救援/真相都不可达' 的主题
    description: "蔡大妈送饭炫耀私下打探了所有男性 + 打探到吴志强当兵背景 → 排查优势尽失 → 张华凑来 → '我' 讲李教授狂病学说：古文《狂犬》全文 + 历史天降异象 + 张巡守城 + 陨石导火索 + H国废料排海 + 75%本源感染率 → 张华全程反智抬杠 → 罗允判断张华非杀手"

