pacing_curve:
  arc_1: "缓 → 中"  # YY-S01 噩梦 / YY-S02 抵达 / YY-S03 晚餐口述（信息密集但节奏稳）
  arc_2: "中（张力暗涨）"  # YY-S04 认知炸弹 / YY-S05 嫌疑速写 + 偷听
  arc_3: "中 → 急"  # YY-S06 排查失败 + lore / YY-S07 纵火 + 围殴吴志强
  arc_4: "缓 → 转"  # （未单列场景）抓阄 + 石浩洋'死亡' 报信 = 第一死 + 引信
  arc_5: "急 → 极急"  # YY-S08 盲女送葬（静）/ YY-S09 投毒虐杀连锁 + 铁门被开
  arc_6: "极急 → 静 → 急 → 余韵"  # YY-S10 破门屠杀 → 安乐死 → 真相复盘 → 自感染戛然而止
  notes: |
    '封闭避难所缓慢溃烂型' —— 前半（Arc 1-3）靠'隐藏杀手 + 猜疑链' 暗涨张力，节奏稳；
    后半（Arc 5-6）死亡密度骤升 + 多重反转引爆。最静的一场（YY-S08 盲女送葬）紧贴最急的一场（YY-S09 投毒），
    用'温柔' 反衬'屠杀'。YY-S04 / YY-S05 是低外部张力但高内部焦虑的'谷'

