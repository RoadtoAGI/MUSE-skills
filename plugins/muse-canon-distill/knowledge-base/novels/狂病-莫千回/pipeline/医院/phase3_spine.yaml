_meta:
  version: "1.0"
  chapter: "医院"
  source: "novels/狂病-莫千回/医院.md"
  word_count_approx: 33100
  validated_against_source: true
  form_note: |
    第一人称'我'（刘医生 / 刘老师）POV —— 全篇为'幸存者口述史' 嵌套结构：
    刘医生白天主线叙事 + 反复插入'我已经讲过无数遍的故事'（机场小队覆灭）+ 赵士轩口述（机场内乱）+ 罗允转述（录音机杀手）+ 李教授学说（狂病起源）
    POV 关键不可靠性：刘医生从开篇就隐瞒'我骗士兵说我懂病毒' 这一核心愧疚（line 99），整篇是一个'骗子' 的自我审判，结局靠主动自感染完成

# === 脊椎 ===

spine:
  protagonist: "'我'（刘医生 / 刘老师，灾难爆发时正在见习的年轻医生，幸存者群体的事实领导者 + 钥匙持有者）"
  spine_mode: "information"
  desire_object: |
    意识层：维持医院这个'最后避难所' 的脆弱秩序 —— 守住二楼铁门、安置幸存者、隐瞒'录音机杀手' 不引发恐慌
    本质层：等待一个结局 —— 不是等救援，而是等'那些感染者出现，终结掉我惶恐的生命'（line 203）
  shadow_desire: |
    "我"想要的不是活下去 ——
    是为'我当年骗士兵说我懂病毒、害他们为我送命' 这桩原罪赎罪（line 99-101）；
    所以全篇'我'在被动地等死，反复做'士兵骂我骗子' 的噩梦（line 311）；
    结局'我'当着石浩洋的面注射孙队长的血主动自感染（line 639）= 这个 shadow_desire 的兑现 ——
    不是求生，是用'再也不会做噩梦' 的方式终结审判（line 641）
  conscious_vs_unconscious:
    conscious: "守门 / 分房 / 排查杀手 / 讲述李教授学说 / 安抚幸存者"
    unconscious: |
      "我" 没有'要把所有人带出去' 的主角意志 ——
      "我" 早已认定医院是穷途末路，所有人'只是在等死罢了'（line 497）
      所以当罗允这个'真正想救人的人' 出现，"我" 的反应是'如果罗允没来就好了'（line 203）——
      因为罗允的到来逼"我" 重新面对'希望' 这件事，而"我" 早已选择了放弃

# === 激励事件 ===

inciting_incident:
  event: "王幸子推门告知'从医院外面来了两个新的幸存者'（罗允 + 盲女）—— 打破医院数周的死寂平衡"
  source_anchor: "line 25-27"
  type: "causal"
  delay_from_opening_chars_approx: 1300
  function: |
    开篇 line 5-23 是噩梦闪回（机场小队覆灭的创伤）+ '我' 的等死状态；
    罗允的到来是唯一打破平衡的外部事件 —— 他不只是'新幸存者'，他带来了'录音机杀手可能就在我们之中' 的认知炸弹（line 147-153）
    标准末日结构变体：不是'离开避难所上路'（《燃烧》），而是'外人闯入封闭避难所 + 携带隐藏威胁'，
    把'最后避难所' 从'安全幻觉' 推向'内部猎杀场' 的揭示

# === 戏剧问题 ===

dramatic_question:
  main: "在一个被传为'军方避难所' 的医院里，幸存者能不能在'内部潜伏的杀人狂' 与'二楼未死绝的感染者' 双重夹击下守住秩序与彼此的信任？"
  subtext: |
    机场旁医院 —— 全系列幸存者奔赴的'最后希望符号' —— 它的真相到底是什么？
    是真避难所，还是另一个陷阱？
    更深一层：当所有人都在防外部的感染者和'录音机杀手' 时，真正瓦解他们的，
    是不是他们自己？人类在绝境里'统一爆发' 的兽性，和感染者有区别吗？（line 349）
  payoff: |
    答案是三重否定式的：
    (1) 医院不是避难所 —— '军方镇守' 是以讹传讹（line 103），它只是离机场近、收容了一支覆灭小队的残骸；
    (2) 内部排查彻底失败 —— 蔡大妈的拙劣打探暴露了一切（line 219-235），无辜的吴志强被全体围殴 + 监禁（line 345-353）；
    (3) 真正的杀手是'已死' 的石浩洋 —— 他诈死、用七八岁的林东青作棋子，从内部投毒 + 放火 + 开二楼铁门放出感染者（line 605-623）；
    最终所有幸存者被'一个小孩玩死'（line 623），孙队长（感染后的机场队长）破门屠杀，
    刘医生用吗啡为王幸子安乐死（line 585-587）+ 注射孙队长血自感染对抗石浩洋（line 639）
    —— '守住秩序' 的戏剧问题被回答为：秩序从一开始就是幻觉，避难所就是屠宰场

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: "二楼隔离病房未死绝的感染者（被加固铁门 + 防护栏关押 / line 53）+ 火车站归来的活跃猎群（line 419-425）+ 感染后的孙队长（line 569）"
    layer_2_environment: "偏僻医院（食堂 + 小超市维持脆弱物资 / line 67）+ 物资被火烧毁后被迫外出搜索（line 315, 365）+ 火车站（人肉装饰 + 储藏室玻璃声引爆猎群 / line 399-419）"
    layer_3_evolution: "感染者会休息 / 进食补充体力 / 吃同类 / 等猎物再次出现（赵士轩观察，line 425）—— 与《燃烧》《地铁》进化线同源；二楼感染者数月静默 = 蛰伏而非死绝（line 211, 555）"
  interpersonal:
    layer_1_visible_villain: "录音机杀手（伪装成'讲义气兄弟' 石浩洋，line 47 已埋伏笔'罗允眼中闪过厌恶'）—— 诈死后从暗处投毒 / 放火 / 开铁门"
    layer_2_accomplice: "林东青（七八岁孩童，石浩洋的'精神延续'，被逼亲手杀父母仍眼睛不眨，line 627）—— 锁门 / 开门 / 投碎肉 / 杀蔡大妈的执行者"
    layer_3_internal_decay: "张华（杠精型挑拨者，全篇激化矛盾，line 41-45, 89-105, 257-269, 359）+ 蔡大妈（多嘴拙劣打探暴露调查，line 219-235）+ 集体把吴志强当替罪羊（line 345-353）—— 人类自身的'统一爆发'"
  internal:
    layer_1: "'我' 的等死状态 + 反复噩梦（机场小队覆灭，line 5-21, 143, 207, 311）"
    layer_2: "'我骗士兵说我懂病毒、害他们送命' 的原罪愧疚（line 99-101, 295）—— 全篇'骗子' 母题"
    layer_3: "罗允到来后被迫重拾'希望' 与'守护他人' 的责任，与'我早已放弃' 的本质冲突（line 203）"
  societal:
    - "'军方镇守医院' 传闻被亲历者证伪：只是距军民两用机场近 + 一支覆灭小队（line 103）"
    - "联系总部后得知'那边彻底乱了'，救援永不会来（line 145）—— 制度性救赎彻底坍塌"
    - "机场内乱实录（赵士轩口述）：军队内部感染叛变 + 飞机撞防战楼 + 感染士兵塞人头进手雷（line 119-129）"

# === Arc 框架 ===

arc_framework:
  total_arcs: 6
  notes: |
    中篇体量（约 3.3 万字）—— Arc 密度低于《燃烧》（连续受难型），结构是'封闭避难所内的缓慢溃烂'：
    前 3 个 Arc 是'秩序假象 → 认知炸弹 → 排查失败' 的社会性崩坏（慢热 + 张力暗涨），
    后 3 个 Arc 是'外部死亡 → 内部屠杀连锁 → 真相揭示 + 反英雄收笔' 的总崩溃（急速 + 多重反转）。
    莫千回'狼人杀' 结构 —— 石浩洋的元叙事台词把整篇定义为一场'狼人杀 / 剧本杀'（line 333, 615），
    幸存者是'猪仔' / '星星'，被一个孩子（林东青）逐一'玩死'

  arc_1_arrival_and_facade:
    label: "罗允盲女抵达 + 医院'避难所' 秩序展示 + 机场小队覆灭口述"
    value_starting: "数周死寂下的脆弱平衡（'我' 等死 + 二楼感染者静默）"
    value_ending: "秩序假象建立（13 人晚餐庆祝）+ 但'最后一次齐聚' 的丧钟已敲响（line 141）"
    climax_event: "晚餐时'我' 与赵士轩双线口述机场覆灭 + '军方镇守 = 以讹传讹' 被揭穿（line 79-141）"
    source_anchor: "line 5-141"
    function: |
      建立 POV（'骗子' 母题 + 等死状态）+ 医院避难所的物理设定（二楼铁门关感染者 / 食堂物资 / 13 人编制）
      用'我' 和赵士轩两段口述同时证伪'机场旁医院 = 军方避难所' 这个全系列希望符号
      埋三处伏笔：罗允眼中对石浩洋的'厌恶'（line 47）/ 盲女能闻感染者（line 51）/ 林东青只和石浩洋交流（line 159）

  arc_2_recorder_killer_reveal:
    label: "罗允密告'录音机杀手可能在我们之中' + 蔡大妈偷听 + 内部猜疑开始"
    value_starting: "秩序假象"
    value_ending: "认知层崩坏（避难所变成内部猎杀场）+ 排查圈被蔡大妈污染"
    climax_event: "罗允讲述录音机内容（变态杀手以人类神志享受嗜杀，line 169-185）+ 蔡大妈踉跄倒进门 = 排查失密第一击（line 187）"
    source_anchor: "line 143-217"
    function: |
      投下认知炸弹：比病毒更可怕的是'本身就是变态杀人狂的幸存者'（line 149）
      "我" 的逐人排查独白（line 175-183）= 群像速写 + '只要是个男的都有嫌疑' 的猜疑链启动
      蔡大妈偷听 = '小圈子保密' 第一次被打破，为 Arc 3 全面失控埋雷
      林东青'墙上画大笑人脸'（line 205）+ 第一次幻听'骗子'（line 299 预演）

  arc_3_investigation_collapse:
    label: "蔡大妈拙劣打探暴露调查 + 食堂纵火 + 吴志强被诬陷围殴监禁"
    value_starting: "认知层崩坏 + 排查圈被污染"
    value_ending: "深渊（物资被毁 + 替罪羊被造出 + 团队信任彻底断裂）"
    climax_event: |
      食堂起火烧毁大半物资（line 313-323）→ 石浩洋质疑人为纵火 + 逼罗允公开真相 →
      吴志强'被锁门' 巧合 + 当兵背景 + 石浩洋'墨镜男' 指认 → 全体围殴吴志强至昏迷 + 监禁（line 325-353）
    source_anchor: "line 219-363"
    function: |
      展示'内部排查' 的彻底失败：蔡大妈把消息透给林东青（line 305-307）→ 信息全面泄露
      纵火 = 石浩洋（借林东青之手）'激化矛盾' 的第一次主动出手（line 611 后揭）
      吴志强 = 莫千回式'替罪羊'：人群需要发泄口，'物资被毁让最后一丝神经断裂'（line 347）
      核心 lore 顶点：'人类好像自始至终和感染者都没什么区别，只是病毒把所有人爆发的时间统一了'（line 349）
      插入李教授'狂病' 学说（line 243-295）= 全系列病毒起源 lore 的最密集落点（嵌在张华争论场景里）

  arc_4_scavenging_death:
    label: "被迫外出搜索物资 + 抓阄 + 石浩洋替张华出行 + 石浩洋'死亡' 报信"
    value_starting: "深渊（物资耗尽 + 替罪羊监禁）"
    value_ending: "第一个核心死亡（石浩洋'死了'）+ 火车站猎群活跃证据 + 二楼威胁重估"
    climax_event: |
      抓阄选出赵士轩 / 陆小虎 / 张华 → 石浩洋主动替张华去（line 377）+ 托付'照顾林东青'（line 383）→
      傍晚赵士轩陆小虎狼狈归来报'石浩洋死了'（火车站玻璃声引爆猎群 / 石浩洋脚卡铁轨断后，line 387-423）
    source_anchor: "line 365-427"
    function: |
      石浩洋的'死亡' 是全篇最大的叙事诡计 —— 表面是'最讲义气的人替人赴死'，
      实则是录音机杀手金蝉脱壳（line 615 后揭：他根本没死，背包夹带感染者碎肉）
      托付林东青（line 383）= 把棋子留在医院内部继续作案
      火车站口述带来关键 lore：感染者会休息 / 进食 / 吃同类 / 等猎物（line 425）→ '二楼感染者还活着' 重估

  arc_5_internal_slaughter_chain:
    label: "盲女之死 + 罗允携汽油出走 + 侯楚霖被投毒感染虐杀陈雨琪 + 陆小虎被咬 + 蔡大妈死 + 吴志强'失踪'"
    value_starting: "第一个核心死亡 + 二楼威胁重估"
    value_ending: "总崩溃前夜（连环死亡 + 罗允这个'真救人者' 离场 + 二楼铁门被开）"
    climax_event: |
      盲女绝食而亡 + 罗允为盲女与男友焦尸点火送葬 + 决定去找李教授（line 451-511）→
      侯楚霖（被林东青投碎肉）感染 + 把头埋进陈雨琪胸腔虐杀（line 525-527）→ 陆小虎被咬 + 与侯同归于尽 + 赵士轩砍杀侯 →
      张华发现蔡大妈被刀杀 + 吴志强'失踪' + 林东青'失踪'（line 543）→ 二楼铁门门栓被打开（line 555）
    source_anchor: "line 429-565"
    function: |
      连续核心死亡 —— 莫千回的'多米诺崩塌'：盲女（自我放弃型）→ 陈雨琪 + 陆小虎（投毒连锁）→ 蔡大妈（灭口）
      罗允的离场是结构枢纽：他是唯一'真想救人' 的人，他一走（带着藏起的汽油，line 503）石浩洋立刻收网（line 547, 615）
      盲女之死支线 = 全篇唯一的'温柔'：罗允'救人但不强迫'（line 469）+ 焦尸送葬（line 511）—— 与《燃烧》同源
      二楼铁门被开 = 林东青执行石浩洋计划，把外部感染者引入内部 = 双重威胁合流

  arc_6_truth_and_self_infection:
    label: "孙队长破门屠杀 + 石浩洋现身揭真相（林东青是真凶）+ '我' 自感染对抗"
    value_starting: "总崩溃前夜"
    value_ending: "全灭 + 反英雄收笔（'我' 注射孙队长血主动感染 + '再也不会做噩梦了'）"
    climax_event: |
      孙队长（机场队长感染体）+ 两个感染者破二楼铁门 → 赵士轩被夹断手臂 + 撕脸虐杀 / 张华抢枪打空子弹被扯下巴（line 561-581）→
      "我" 用吗啡为昏迷的王幸子安乐死（line 585-587）→ 石浩洋携林东青现身用汽油烧死孙队长 + 揭真相（line 591-627）→
      "我" 拒绝屈服 + 趁机抽取孙队长血 + 当着石浩洋面注射自感染（line 639-641）
    source_anchor: "line 565-641"
    function: |
      全篇 main climax + 多重反转：
      (1) 孙队长 = 开篇噩梦里'被感染推回二楼' 的机场队长（line 87）—— 二楼关的就是他，'骗子' 幻听的真相（line 299, 567）
      (2) 石浩洋 = 录音机杀手（line 593）—— Arc 1 line 47 伏笔回收
      (3) 真凶是林东青 —— '一个小屁孩儿几乎灭了你们所有废物'（line 605）= 终极反转
      "我" 的自感染 = 反英雄收笔：不是求生，是用'达到快乐巅峰' 的方式剥夺石浩洋'享受普通人恐惧' 的快感（line 641）
      与《学校》'我' 吞断指自感染（line 217）同源 —— 主动自感染作为 POV 收笔的系列母题

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "石浩洋揭示'录音机杀手 = 我 + 真凶是林东青' + '我' 注射孙队长血自感染反击"
    source_anchor: "line 591-641"
    why_climax: |
      全篇所有价值层在此引爆：
      - 避难所 → 被证实是屠宰场（石浩洋本想'把这里当根据地慢慢向外开发'，line 633）
      - '排查内鬼' → 真凶是从未被怀疑的七八岁孩子（line 605, 623）—— '只有七八岁的林东青应该可以完全排除'（line 181）的反讽兑现
      - '我' 的'等死' → 升级为'主动选择以自感染剥夺施虐者的快感'（line 639-641）
      - 孙队长 = 把开篇噩梦（机场覆灭）与结局闭环：'我' 当年骗的士兵，化作感染者回来索债（'骗子' line 567）

  closing_reversal:
    event: "'我' 注射孙队长血 + '从现在开始，再也不会做噩梦了'（line 641）"
    source_anchor: "line 639-641"
    function: |
      不是 happy ending 也不是 hopeless ending —— 是 defiant / atonement ending（赎罪式反英雄收笔）
      "我" 用自感染完成两件事：
      (1) 对石浩洋的反击：把他'想看普通人恐惧' 的施虐预期，变成'我达到快乐巅峰的阶梯'（line 641）—— 让施虐者扑空
      (2) 对'骗子' 原罪的了结：感染后即将失去神志，'再也不会做噩梦' = 审判终止
      与《学校》自感染收笔 / 《燃烧》'活下来 = 偿还' 同属莫千回反英雄余韵谱系，但本篇是'主动赴疯' 而非'被强行救活'

  controlling_idea_for_this_chapter: |
