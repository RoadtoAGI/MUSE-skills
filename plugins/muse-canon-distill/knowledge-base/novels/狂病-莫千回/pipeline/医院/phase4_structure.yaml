# === Arc 6: 孙队长破门屠杀 + 真相揭示 + 自感染收笔 ===

arc_6:
  label: "孙队长破门屠杀 + 石浩洋现身揭真相（林东青是真凶）+ '我' 自感染对抗"
  source_anchor: "line 565-641"
  sequences:
    - seq_id: "6.1"
      label: "孙队长 + 感染者破二楼铁门 + 赵士轩 / 张华惨死"
      source_anchor: "line 565-583"
      core_conflict: "幸存者残部 vs 破门而出的感染者群（含孙队长）"
      progression: |
        赵士轩被逼上前查铁门 → 被门缝伸出的手拽住 + 铁门夹断手臂向上翻折（line 561-563）
        铁门猛开撞飞王幸子 → '骗子' 声音 + 熟悉军靴 = 孙队长（机场队长感染体，line 567-569）
        两个感染者扑赵士轩撕脸（line 571）→ "我" 开枪（第一次开枪 + 后座力大）打翻一个、打偏一个（line 573）
        张华抢枪逞能打空所有子弹（'怎么只有三发'）→ 被孙队长扯下下巴 + 咬扯舌头惨死（line 575-581）
      seq_climax: |
        孙队长破门 = 开篇噩梦（line 87 推感染者回二楼）+ 第一次'骗子' 幻听（line 299）的双重回收
        二楼关的就是孙队长 —— 全篇最大伏笔兑现

    - seq_id: "6.2"
      label: "'我' 用吗啡为王幸子安乐死 + 石浩洋携林东青现身救场"
      source_anchor: "line 583-599"
      core_conflict: "让王幸子被虐杀 vs 安乐死"
      progression: |
        "我" 看到昏迷的王幸子犹豫 → 孙队长扑来 → "我" 给王幸子注射约 2000 毫克吗啡（致死量 250，line 587）
        准备坦然受死 → 走廊传来石浩洋'喂' 声 + 失踪的林东青在其身边（line 591）
        '看来他真的就是录音机杀手呀'（line 593）
        石浩洋扔汽油 + 燃烧瓶烧死孙队长 + 另一感染者（line 595-599）→ 孙队长焚烧仍喊'骗子' 扑来
      seq_climax: |
        吗啡安乐死（line 585-587）= 医生 lore + 反英雄道德抉择
        石浩洋现身 = 录音机杀手身份坐实（Arc 1 line 47 伏笔回收）

    - seq_id: "6.3"
      label: "石浩洋揭真相 —— 林东青是真凶 + 全部布局复盘"
      source_anchor: "line 601-633"
      core_conflict: "施虐者的胜利宣言 vs '我' 的冷对"
      progression: |
        石浩洋让'我' 上王幸子尸体求饶 → "我" 冷问'你不该向最后幸存者炫耀成果吗'（line 603）
        终极反转：石浩洋把林东青推出 —— '这一切都是小林做的，一个小屁孩儿几乎灭了你们所有废物'（line 605）
        布局复盘：用林东青试探'我'（被锁起=有事）→ 蔡大妈上钩泄密 → 林东青从窗户爬下点火（line 611）
        偷吴志强钥匙锁门 / 开门嫁祸 → 背包夹带感染者碎肉让林东青投进侯楚霖的锅（line 621）
        林东青回去刀杀蔡大妈灭口（line 623）→ 林东青被逼杀亲生父母'眼睛不眨 + 插花当装饰'（line 627）
        石浩洋'天选之人' 宣言：他与林东青天生无愧疚悔恨（line 625）→ 因罗允跑了，放弃医院根据地去追罗允（line 615-633）
      seq_climax: |
        Arc 6 + 全篇 main climax —— 三重反转：杀手=石浩洋 / 真凶=七八岁林东青 / '可完全排除' 的孩子是终极恐怖
        '一群大人被一个小孩玩死'（line 623）= controlling_idea（人性之恶比病毒更可怕）的极致表达

    - seq_id: "6.4"
      label: "'我' 注射孙队长血自感染 + '再也不会做噩梦了'"
      source_anchor: "line 631-641"
      core_conflict: "屈服受虐 vs 主动赴疯反击"
      progression: |
        石浩洋威胁砍'我' 四肢做成马桶喂排泄物（line 637）→ "我" 拒绝屈服
        "我" 断言'下次见面罗允一定杀掉你，你只是躲阴影里的小丑'（line 635）→ 戳石浩洋痛处
        "我" 当面注射一管暗红液体 —— 趁石浩洋不注意用空针管抽的孙队长的血（line 639）
        '你不是很享受普通人恐惧吗？接下来你的所有折磨只是让我达到快乐巅峰的阶梯 …… 我从现在开始，再也不会做噩梦了'（line 641）
      seq_climax: |
        closing reversal —— 反英雄/赎罪式收笔：
        自感染 = 剥夺石浩洋'看普通人恐惧' 的快感（让施虐扑空）+ 终结'骗子' 原罪审判（再也不做噩梦）
        与《学校》吞断指自感染同源 —— 主动赴疯作为 POV 收笔的系列母题

  arc_6_progression_note: |
    Arc 6 是'真相 + 反英雄收笔' 的总爆发：破门屠杀（6.1）→ 安乐死 + 杀手现身（6.2）→ 终极反转复盘（6.3）→ 自感染（6.4）。
    所有 Arc 1-5 的伏笔（孙队长 / 石浩洋厌恶 / 林东青棋子 / '骗子' 幻听 / 投毒 / 钥匙）在此 Arc 集中回收。

# === 序列间冲击力递增 ===

escalation_check:
  arc_1_to_2: "避难所秩序假象（军方传闻被证伪但'我们还活着'）→ 认知炸弹：内部可能藏着清醒杀手（威胁从外部转内部）"
  arc_2_to_3: "排查启动 → 排查被蔡大妈彻底搞砸 + 纵火 + 替罪羊吴志强被造出（信任崩坏）"
  arc_3_to_4: "内部信任崩坏 → 被迫外出 + 第一个核心死亡（石浩洋'死'）+ 二楼威胁重估"
  arc_4_to_5: "单个死亡 → 内部屠杀连锁（盲女 / 陈雨琪 / 陆小虎 / 蔡大妈）+ 唯一救人者罗允离场 + 二楼铁门被开"
  arc_5_to_6: "门被开 → 孙队长破门屠杀 + 真相揭示（孩子是真凶）+ 全灭 + '我' 自感染收笔"
  curve_shape: "Arc 1-2 慢热（张力暗涨）→ Arc 3 中速（社会崩坏完成）→ Arc 4 转折（第一死 + 引信）→ Arc 5 急（连环死）→ Arc 6 极急 + 多重反转 + 余韵"
  curve_note: |
    '封闭避难所缓慢溃烂型' 结构 —— 前半部张力靠'猜疑链 + 隐藏杀手' 暗涨（不靠外部追击），
    后半部靠'死亡多米诺 + 三重反转' 引爆。与《燃烧》连续受难型（每 Arc 一死）相反：
    本篇前 4 个 Arc 仅死 1 人（石浩洋假死），死亡密度集中在 Arc 5-6 总崩溃段

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第一人称'我'（刘医生）—— line 5-641 全篇统一，事实领导者 + 钥匙持有者 + 不可靠叙述者（隐瞒'骗子' 原罪）"
    function: |
      第一人称医生 POV 承担三重功能：
      (1) 医学视角解释 lore（肾上腺素 / 吗啡致死量 / 盲女嗅觉机制 / 李教授学说转述）
      (2) '骗子' 母题的内在审判（噩梦闪回贯穿，line 5/143/207/311）
      (3) 群像观察窗口（逐人嫌疑速写 line 175-181 = 用 POV 一次性勾勒 13 人编制）
      关键不可靠性：'我' 从开篇就隐瞒核心愧疚，全篇是骗子的自我审判，结局靠自感染了结

  nested_oral_testimony_threads:
    - "'我' 的机场小队覆灭口述（line 79-105）—— '我已讲过无数遍的故事'，含'骗子' 原罪半露"
    - "赵士轩的机场内乱口述（line 109-129）—— 补全'机场覆灭' 的另一视角（弟弟赵士凯之死）"
    - "罗允的录音机杀手转述（line 169-185, 337）—— 嵌套的'录音机'（杀手做过修改的）= 多层窥镜，与《地铁》手机录像同源"
    - "李教授的'狂病' 学说（line 243-291，经'我' 转述）—— 全系列病毒起源 lore 最密集落点，含古文寓言《狂犬》"
    - "赵士轩 + 陆小虎的火车站口述（line 395-425）—— 外部世界现状 + 感染者进化 lore"

  parallel_external_threads:
    - "二楼隔离病房感染者线（含孙队长）—— 从'估计快死绝'（line 53）→ '骗子' 幻听（line 299）→ 火车站 lore 重估（line 427）→ 破门（line 565），贯穿全篇的暗线"
    - "石浩洋（录音机杀手）+ 林东青（棋子）的隐藏作案线 —— 表面看不见，Arc 6 复盘才显形（投毒/纵火/偷钥匙/灭口/开门全是他们做的）"
    - "罗允（真）的'救人但不强迫' 线 —— 携盲女入场 → 密告 → 送葬 → 携汽油去找李教授，是全篇唯一指向'希望' 的力量，但被孤立 + 离场"

