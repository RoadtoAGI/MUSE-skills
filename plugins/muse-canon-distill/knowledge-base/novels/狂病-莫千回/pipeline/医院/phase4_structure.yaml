_meta:
  version: "1.0"
  chapter: "医院"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    6 个 Arc —— 封闭避难所内的缓慢溃烂结构：
    Arc 1-3 = 社会性崩坏（秩序假象 → 认知炸弹 → 排查失败），慢热 + 张力暗涨；
    Arc 4-6 = 总崩溃（外部死亡 → 内部屠杀连锁 → 真相 + 反英雄收笔），急速 + 多重反转。
    第一人称'我'（刘医生）POV 统一全篇，含三层嵌套口述（'我' 机场口述 / 赵士轩机场口述 / 罗允录音机转述 / 李教授学说）

# === Arc 1: 罗允盲女抵达 + 避难所秩序展示 + 机场覆灭口述 ===

arc_1:
  label: "罗允盲女抵达 + 医院'避难所' 秩序展示 + 机场小队覆灭口述"
  source_anchor: "line 5-141"
  sequences:
    - seq_id: "1.1"
      label: "开篇噩梦 + '我' 的等死状态 + POV 建立"
      source_anchor: "line 5-23"
      core_conflict: "创伤记忆（机场覆灭）vs 当下的死寂"
      progression: |
        手术室被感染者闯入虐杀的噩梦闪回（脑袋当马桶 / 保安全灭 / 二楼精神科患者）
        "我" 惊醒 + 这是第几次噩梦已忘 + 看窗外白雾树林总觉得疯子会冲出
        建立'幸存者口述史' 嵌套 POV + '过去的事在梦中重演' 的创伤框架
      seq_climax: "用噩梦把开篇直接锚到全篇结局（孙队长 / 二楼感染者）—— 闪回即伏笔"

    - seq_id: "1.2"
      label: "罗允盲女抵达 + 张华质疑 vs 石浩洋护新人"
      source_anchor: "line 25-49"
      core_conflict: "接纳外人 vs 张华的'感染风险' 质疑"
      progression: |
        王幸子告知新幸存者来了（激励事件）→ 大厅介绍罗允 + 盲女（'像情侣'）
        王幸子已查无感染风险 → 张华阴阳怪气质疑 → 石浩洋吐痰威胁张华闭嘴
        关键伏笔：石浩洋夸罗允'讲义气'，罗允眼中'闪过一丝厌恶'（line 47）+ 盲女表情古怪
      seq_climax: "石浩洋护罗允 + 罗允的'厌恶' —— Arc 6 录音机杀手真相的第一颗种子"

    - seq_id: "1.3"
      label: "带新人上楼 + 盲女闻到二楼感染者 + 安置"
      source_anchor: "line 51-65"
      core_conflict: "盲女的嗅觉警报 vs '我' 解释二楼已封锁"
      progression: |
        盲女捂胸口痛苦 + '附近有很多感染者' → 罗允警惕
        "我" 解释二楼隔离病房 + 加固铁门 + 防护栏 + 阻拦网 + 估计感染者快死绝（line 53）
        揭示盲女能闻感染者气味（疑嗅肾上腺素，line 55-57）→ 罗允非情侣 → 盲女与王幸子同住
        罗允问'医院只有这些幸存者吗' → 13 人 → 罗允平静情绪（暗示找家人未果，line 65）
      seq_climax: "盲女嗅觉 = 跨篇 lore 落点 + '二楼感染者快死绝' 的安全假设（后被 Arc 6 推翻）"

    - seq_id: "1.4"
      label: "庆祝晚餐 + '我' 与赵士轩双线口述机场覆灭 + 军方传闻证伪"
      source_anchor: "line 67-141"
      core_conflict: "新人求知外界 vs '我' 隐藏的原罪 + 张华的挑衅"
      progression: |
        丰盛晚餐（豆豉鱼 / 咸鸭蛋 / 野菜面）→ 大伙追问外界
        "我" 口述：机场小队来救我 + 弹药告罄 + 孙队长被断骨刺中自我牺牲推感染者回二楼锁门（line 79-87）
        张华质疑'你凭什么这么重要' → "我" 隐瞒的真相浮现：'我骗士兵说我懂病毒'（line 99）
        关键证伪：罗允问军方镇守 → '以讹传讹，只是距机场近 + 一支覆灭小队'（line 103）
        赵士轩口述机场内乱：弟弟赵士凯被爆头 + 飞机撞楼 + 感染士兵砍头塞手雷 + 卡车碾人（line 109-129）
        张华侮辱'大头兵' → 赵士轩扣面碗 + 石浩洋踢张华 → 张华逃
        收束：'那将是我们最后一次所有人齐全聚餐'（line 141）
      seq_climax: |
        Arc 1 climax —— 双线口述同时证伪'机场旁医院 = 军方避难所'（line 103）
        '我' 的'骗子' 原罪首次半露（line 99-101）+ '最后一次齐聚' 丧钟（line 141）

  arc_1_progression_note: |
    Arc 1 是'秩序假象的建立与祛魅同步进行'：
    一边展示避难所的物理秩序（13 人 / 食堂 / 二楼封锁），一边用口述拆掉它的希望基础（军方传闻假 / 救援不来）。
    三处伏笔（罗允厌恶石浩洋 / 盲女嗅觉 / 林东青只和石浩洋交流）在此 Arc 全部埋下。

# === Arc 2: 录音机杀手揭示 + 蔡大妈偷听 + 猜疑链启动 ===

arc_2:
  label: "罗允密告'录音机杀手可能在我们之中' + 蔡大妈偷听 + 内部猜疑开始"
  source_anchor: "line 143-217"
  sequences:
    - seq_id: "2.1"
      label: "王幸子转达罗允密告 + 认知炸弹投下"
      source_anchor: "line 143-157"
      core_conflict: "病毒威胁 vs 比病毒更可怕的'变态杀手' 威胁"
      progression: |
        又一次噩梦惊醒 → 王幸子密告：罗允带来坏消息，最好别让所有人知道
        '末日里不但要防感染者，还要防本身就是变态杀人狂的幸存者'（line 149）
        罗允隐去了遇变态杀手的经历 + 杀手只留录音机 + 犯案位置离医院不远 + 可能潜伏在人群里
        罗允只告诉最值得信任的人（最初就在医院的女性王幸子）→ 再分享给同事'我'
      seq_climax: "认知炸弹：'避难所' 内部可能藏着比感染者更可怕的清醒猎手 —— 戏剧问题正式提出"

    - seq_id: "2.2"
      label: "石浩洋托管林东青 + '我' 锁起林东青 + 罗允房间会合"
      source_anchor: "line 159-167"
      core_conflict: "保护孩子 vs 孩子可能听到机密"
      progression: |
        "我" 出门遇石浩洋领着林东青（七八岁）→ 石浩洋想让王大夫带带小林去守二楼
        "我" 想到杀手可能在 → 改口自己照顾林东青 + 让石浩洋去守门
        林东青愣愣不说话（'末日吓傻'，只和石浩洋交流）→ "我" 把他锁房间里 → 去罗允房间
      seq_climax: "'我' 主动锁起林东青 —— 此举被石浩洋视为'果然有事'（line 607 后揭），无意中触发收网"

    - seq_id: "2.3"
      label: "录音机内容讲述 + 群像嫌疑速写 + 蔡大妈偷听暴露"
      source_anchor: "line 167-217"
      core_conflict: "排查嫌疑 vs 信息无法收口"
      progression: |
        罗允讲录音机内容：变态以人类神志享受嗜杀 + 比感染者更歹毒（line 169-171）
        "我" 逐人排查独白：排除'我'+王幸子（最初同事）→ 张华/侯楚霖/陈雨琪/赵士轩/吴志强/陆小虎/石浩洋皆有嫌疑（line 175-181）
        '只要是个男的都有嫌疑'（line 183）→ 罗允解释扩大知情面以控局
        房门吱呀 → 蔡大妈踉跄倒进来（偷听）→ 保证保密 + 愿帮忙观察
        "我" 回房发现林东青没哭过痕迹 + 墙上画大笑人脸（line 199, 205）→ 怀疑侯楚霖
      seq_climax: |
        Arc 2 climax —— 蔡大妈偷听（line 187）= '小圈子保密' 第一次被打破
        + 林东青'没哭却被蔡大妈说在哭' 的破绽（line 199）= 棋子第一次被启用（'吸引注意力'）

  arc_2_progression_note: |
    Arc 2 把外部威胁（感染者）替换成内部威胁（清醒杀手），戏剧问题从'能否守住避难所' 升级为'谁是内鬼'。
    猜疑链一旦启动就无法收回 —— 蔡大妈偷听是结构上的'第一块多米诺'。

# === Arc 3: 排查失败 + 纵火 + 吴志强被诬陷 ===

arc_3:
  label: "蔡大妈拙劣打探暴露调查 + 食堂纵火 + 吴志强被诬陷围殴监禁"
  source_anchor: "line 219-363"
  sequences:
    - seq_id: "3.1"
      label: "蔡大妈打草惊蛇 + 排查计划报废"
      source_anchor: "line 219-237"
      core_conflict: "蔡大妈的自作聪明 vs 隐秘排查的需要"
      progression: |
        蔡大妈送饭时炫耀'私下调查了' + 把所有男性问了一遍（除睡觉的陆小虎）
        打探到唯一线索：吴志强有当兵背景（退伍分配机场安保，line 221）
        罗允下来得知后与'我' 陷入沉默 → '由双方都在暗处，变成我们在明处、那个人在暗处'（line 235）
        蔡大妈眼神躲闪 + 否认告诉过别人（line 233 撒谎伏笔，实已告诉林东青）
      seq_climax: "排查彻底失败 —— 蔡大妈把'隐秘优势' 拱手让给杀手（line 235）"

    - seq_id: "3.2"
      label: "李教授'狂病' 学说 + 张华全程抬杠"
      source_anchor: "line 239-297"
      core_conflict: "病毒起源认知 vs 张华的反智抬杠"
      progression: |
        张华凑上来 → 罗允装随意问'我' 怎么灾前就懂病毒 → '我' 讲李教授学说
        古文寓言《狂犬》全文（line 247）+ 安史之乱/五胡乱华天降异象 + 张巡守城（line 251-255）
        张华抬杠正史造假/现代防疫无敌 → 罗允反驳 → 罗允判断张华大概率不是杀手（line 273）
        李教授学说续：陨石新闻 + 精神科异常 + 肾上腺素飙升 + 《狂病编年史》+ H国废料排海 + 75%本源感染率（line 275-291）
        "我" 隐瞒之事再现：当年骗士兵'我有办法针对病毒'（line 295）
      seq_climax: |
        全系列病毒起源 lore 最密集落点（line 243-291）
        嵌在'张华抬杠' 场景里 —— 用人物冲突承载 exposition（避免说明文倾倒）

    - seq_id: "3.3"
      label: "二楼幻听'骗子' + 盲女状态恶化暗示二楼仍有感染者"
      source_anchor: "line 299-309"
      core_conflict: "幻觉/错觉 vs 真实威胁"
      progression: |
        罗允走后 "我" 守二楼困倦 → 听到身边有人说'骗子'（line 299）→ 敲铁门无回应 → '可能错觉'
        晚饭张华缺席 + 盲女状态更差（二楼仍有感染者）+ 林东青当众说'为什么坏蛋不能自己认错'（line 305）
        蔡大妈承认告诉了林东青'人群中有坏蛋'（line 307）→ 信息全面泄露坐实
      seq_climax: |
        第一次'骗子' 幻听（line 299）= 孙队长尚在二楼活着的伏笔（Arc 6 回收）
        林东青当众发问 = 棋子第二次被启用 + 信息泄露的公开化

    - seq_id: "3.4"
      label: "食堂纵火 + 石浩洋逼罗允公开真相 + 吴志强'被锁门' 巧合"
      source_anchor: "line 311-335"
      core_conflict: "意外失火 vs 人为纵火的怀疑"
      progression: |
        凌晨罗允叫醒众人救火 → 火势不大但烧毁大半物资（line 315）
        张华指责罗允救火不力 → 石浩洋质疑：没电不会短路 + 这两天都吃方便食品，是人为？（line 319）
        石浩洋逼罗允'还打算隐瞒吗' → 罗允再讲录音机内容
        吴志强跑下楼抱怨'门被人从外面锁住又打开'（line 327）→ 众人怀疑目光转向吴志强 + '我'（备用钥匙持有者）
      seq_climax: "纵火（石浩洋借林东青之手，line 611 后揭）= 主动激化矛盾第一击 + 吴志强嫌疑成形"

    - seq_id: "3.5"
      label: "吴志强被指认为杀手 + 全体围殴 + 监禁"
      source_anchor: "line 337-363"
      core_conflict: "理性辩护 vs 集体寻找替罪羊"
      progression: |
        张华讥讽吴志强'率先跳反' 是心理战（line 333）
        石浩洋编'公路墨镜男' 故事 + 指吴志强身材像墨镜男 + 逼问'安保怎么活下来'（line 337-343）
        吴志强承认'抛下所有人躲残疾人隔间'（line 341）→ 众人不信 → 集体围殴吴志强至昏迷
        '物资被毁让最后一丝神经断裂，压抑的人群巴不得找发泄口'（line 347）
        '人类自始至终和感染者没什么区别，病毒只是把爆发时间统一了'（line 349）
        "我" + 罗允极力请求 → 监禁而非杀死 → 吴志强绑在厕所水管（line 353-355）
      seq_climax: |
        Arc 3 climax —— 替罪羊被造出（吴志强）+ 团队信任彻底断裂
        核心 lore 顶点：人类的'统一爆发' = 集体兽性（line 349）

  arc_3_progression_note: |
    Arc 3 是'社会性崩坏的完成'：排查失败（3.1）→ exposition 高峰（3.2）→ 威胁暗示（3.3）→ 纵火激化（3.4）→ 替罪羊（3.5）。
    石浩洋（隐藏的杀手）在 3.4-3.5 第一次从'护新人的好人' 转为'主动布局者'，但读者此刻仍不知情。

# === Arc 4: 被迫外出搜索 + 石浩洋'死亡' ===

arc_4:
  label: "被迫外出搜索物资 + 抓阄 + 石浩洋替张华出行 + 石浩洋'死亡' 报信"
  source_anchor: "line 365-427"
  sequences:
    - seq_id: "4.1"
      label: "物资紧缺逼出外出方案 + 抓阄 + 石浩洋替张华"
      source_anchor: "line 365-385"
      core_conflict: "没人愿外出 vs 不出就饿死"
      progression: |
        物资紧缺 → 定方案：三男外出（二对一防内部杀手）+ 三四男留守压制
        抓阄选出赵士轩 / 陆小虎 / 张华 → 张华无能狂怒要重抽 + 质疑'我' 为何不参加（医生豁免，line 373-375）
        石浩洋主动替张华去（条件：张华下次必须替他一次，line 379）
        石浩洋临行托'我'+王幸子照顾林东青：'没血缘的小林是他的精神延续'（line 383）
      seq_climax: "石浩洋'替张华赴死' 的义气假象 + 托管林东青（实为留棋子，line 383）"

    - seq_id: "4.2"
      label: "石浩洋'死了' 报信 + 火车站猎群口述"
      source_anchor: "line 387-427"
      core_conflict: "义士之死的悲痛 vs 罗允的反常追问（预演 Arc 5）"
      progression: |
        傍晚赵士轩陆小虎狼狈归 → '石浩洋死了'（line 387）→ 物资几乎没搜到
        赵士轩 / 陆小虎口述火车站：人肉装饰（铁丝骷髅 / 风干断手 / 冷冻室挂尸）→ 打碎储藏室玻璃引爆猎群
        石浩洋脚卡分岔铁轨 → 甩背包 + 喊'照顾林东青' + 断后（line 421-423）
        关键 lore：感染者会休息 / 进食 / 吃同类 / 等猎物再现 → '二楼感染者估计有些还活着'（line 425-427）
      seq_climax: |
        Arc 4 climax —— 石浩洋'死亡'（金蝉脱壳诡计，line 615 后揭：背包夹带感染者碎肉）
        火车站 lore 重估二楼威胁（line 427）—— 与开篇'快死绝' 假设对冲

  arc_4_progression_note: |
    Arc 4 是'总崩溃的引信'：表面是第一个核心死亡（石浩洋）激发悲痛，
    实则是杀手脱身 + 把投毒武器（背包碎肉）+ 棋子（林东青）同时部署到位。
    罗允此 Arc 末尾的反常追问（line 429）直接连入 Arc 5。

# === Arc 5: 内部屠杀连锁 + 罗允离场 ===

arc_5:
  label: "盲女之死 + 罗允携汽油出走 + 侯楚霖感染虐杀陈雨琪 + 陆小虎被咬 + 蔡大妈死 + 吴志强'失踪'"
  source_anchor: "line 429-565"
  sequences:
    - seq_id: "5.1"
      label: "罗允反常追问石浩洋被抓 + 众人围攻罗允"
      source_anchor: "line 429-447"
      core_conflict: "罗允的'求证' 本能 vs 众人的悲痛与人情世故"
      progression: |
        罗允盯着赵士轩问'看到石浩洋被感染者抓住了吗'（line 429）→ 众人莫名其妙
        张华带头骂罗允'搅屎棍'+ 质疑火是罗允放的 → 赵士轩/陆小虎/侯楚霖/王幸子均转向怀疑罗允（line 431-439）
        众人要围殴罗允 → 罗允掏长刀指向众人自卫（line 443）→ "我" 打圆场 → 暂平息
      seq_climax: "罗允从'密告者' 沦为'众矢之的'（line 441）—— 真救人者被孤立，为他离场铺垫"

    - seq_id: "5.2"
      label: "盲女绝食将亡 + 王幸子'有时人想要的是死亡'"
      source_anchor: "line 449-471"
      core_conflict: "罗允'必须让盲女活' 的承诺 vs 盲女想死的真实意愿"
      progression: |
