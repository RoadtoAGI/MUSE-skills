_meta:
  version: "1.0"
  chapter: "套中人"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    7 Arc 双形态结构 —— 前 3 Arc 城市横向逃亡（套子=铠甲显形），
    Arc 4 收束回家（父子团聚 + 套子被迫撕开），后 3 Arc 居家纵向围困（套子守不住任何人 → 撕开 → 上路）。

# === Arc 1: 外视角铺陈 + 超市爆发 ===

arc_1:
  label: "外视角铺陈'怪人'洪扬 + 超市采买 + 人群'炸了'"
  source_anchor: "line 5-91"
  sequences:
    - seq_id: "1.1"
      label: "婉清祖孙外视角 + 街坊议论'神神叨叨的怪人' + 暴力事件频发前奏"
      source_anchor: "line 5-31"
      core_conflict: "灾前秩序 vs 已在滋长的反常暴力（婚礼打死人 / 警车呼啸）"
      progression: |
        婉清奶奶领孙女去何家乐超市早场 → 公交站街坊议论城西婚礼打死三人（line 11）
        眼镜老头'婚宴年=兵荒马乱'（line 15）→ 警车呼啸而过（line 17）
        婉清注意到层层包裹的怪人骑车停路边等人上车（line 21）
        奶奶把孙女护身后 + 孙大娘'洪宝山家孩子神神叨叨阴气森森'（line 25-27）
      seq_climax: "用街坊外视角把'套中人'洪扬立成被歧视的怪物 —— 读者先以外人眼光看他，再被引入他的内心"

    - seq_id: "1.2"
      label: "切入洪扬内焦点 + 套子的心理病因 + 与父亲的安全关系 + 婉清善意微光"
      source_anchor: "line 33-75"
      core_conflict: "洪扬'遵守规则=不被讨厌'的内在逻辑 vs 被当怪物的处境"
      progression: |
        洪扬习惯被当怪物的目光（line 33）+ 母亲'你这样别人会觉得你是变态'（line 35）
        '遵守规则就对了'（靠右走 / 没交作业自觉站起 line 37）+ 死板但可靠（line 39）
        唯一可不守规则的人=父亲洪宝山（line 43）→ 为请帮搞实习证明的人买鸡蛋肉
        超市连环失控前奏：钉枪坠落 + 工人愤怒眼神（line 49）/ 抢土豆打架（line 53）/ 收银员砸人（line 57）/ 工人自钉腿（line 63）
        门口认出婉清（几个月前送他蓝花 line 67）+ 互相挥手（line 69）+ 警察留两个走剩下（line 71-73）
      seq_climax: "工人自钉腿 + 警察异常撤离 —— 反常征兆密度拉满，'人群炸了'的临界前一秒"

    - seq_id: "1.3"
      label: "人群'炸了' + 婉清被甩死 / 洒水车碾碎 + 断手飘到洪扬面前"
      source_anchor: "line 77-91"
      core_conflict: "洪扬的认知现实 vs 灾难的全面引爆"
      progression: |
        脚手架上的人跳下咬警察脖子（line 77）→ 满身血迹的人涌出超市（line 79）→ '人群炸了'（line 81）
        两个留守警察瞬间被淹没（line 83）→ 婉清与奶奶被冲散 + 被人群裹挟飞向马路（line 85）
        洪扬犹豫要不要救（line 87）→ 婉清被疯子当木偶甩动砸人（line 89）→ 洒水车碾碎 + 断手飘到面前（line 91）
      seq_climax: "断手飘到洪扬面前 —— 激励事件，'撕碎洪扬认知中的现实'（line 93），全篇从此进入逃命态"

# === Arc 2: 城市地狱骑行 + 咖啡厅 ===

arc_2:
  label: "骑车穿越城市地狱 + 咖啡厅避难 + 时髦客人被凌迟 + 卡车冲烂咖啡厅"
  source_anchor: "line 93-203"
  sequences:
    - seq_id: "2.1"
      label: "断手击穿认知 + 飞车 / 高架桥吊人扔人 / 十字路口地狱"
      source_anchor: "line 93-127"
      core_conflict: "逃命本能 vs 城市动线全面失控"
      progression: |
        断手撕碎现实 + 差点摔车（line 93）→ 青年被共享单车砸 + 被啃血肉（line 95-97）→ 直觉'跑起来'
        侧翻飞车 + 跳人行道躲过（line 99）→ 菜刀大笑挥砍（line 101）→ 十字路口每条路都喊'后面有恐怖分子'（line 105）
        高架桥皮带勒颈扔人（line 107）→ 卡车撞死扔下来的人 + 血雾溅身 + N95 也挡不住血腥 → 洪扬呕吐（line 109）
        西装男推洪扬'快跑后面有疯子'（line 111）→ 一推恰好躲过出租车撞写字楼（line 115）+ 出租车司机被扳手砸出凹坑（line 117）
      seq_climax: "N95 挡不住血雾导致呕吐 —— 套子第一次显出'功能边界'：能挡体液不能挡精神冲击"

    - seq_id: "2.2"
      label: "血滑倒地被疯子袭击 + 抡自行车反抗 + 找不到骑车空间"
      source_anchor: "line 123-137"
      core_conflict: "套中人的体能/果断 vs 痛觉缺失的感染者"
      progression: |
        早餐店铁板烙活人头（line 123）→ 血滑倒地 + 两疯子踹头 + 要脱裤子（line 129）→ 洪扬翻滚躲刀 + 抡自行车（line 131）
        感染者被砸倒迅速起身（痛觉缺失 line 131）→ 红色 SUV 打圈碾尸取乐（line 135）→ 想父亲在身边（line 137）
      seq_climax: "感染者被自行车砸倒仍迅速起身 —— 痛觉缺失 lore 首次在洪扬肉搏中验证（与 phase1 同源）"

    - seq_id: "2.3"
      label: "咖啡厅防盗栏避难 + 时髦客人被锁门外切手指凌迟 + 痛斥冷血畜生"
      source_anchor: "line 139-165"
      core_conflict: "求生的自私 vs 见死不救的道德重量"
      progression: |
        外卖小哥喊洪扬进咖啡厅 + 防盗栏关闭（line 139）→ 栅栏外幸存者呼救无人敢开门（line 143）
        时髦客人抓栅栏哀求'我每天来大家都认识'（line 145）→ 店员吓瘫 → 疯子一根根切他手指（line 145-147）
        只剩手掌的客人痛斥'你们都是冷血畜生'被拖走（line 149）→ 洪扬不敢看 + 自觉'想活就要自私一些'（line 151）
        几人哭泣 + 外卖小哥擦泪 + 隔栏感受同类绝望（line 153）
      seq_climax: "时髦客人痛斥'冷血畜生' —— 纯人性之恶（见死不救）首次与感染者之恶并置，洪扬自觉自私"

    - seq_id: "2.4"
      label: "联系父亲报平安 + 提醒穿防刺服 + 报警台盲音 + 卡车冲烂咖啡厅 + 后厨屠夫"
      source_anchor: "line 155-203"
      core_conflict: "短暂喘息 vs 避难所瞬间被摧毁"
      progression: |
        十几个父亲未接电话（line 155）→ 父亲自拍比大拇指（line 159）→ 洪扬提醒父亲穿防刺服 / 锁门 / 别开门（line 157-161）
        报警台盲音（line 163）→ 外卖小哥走近问洪扬 → 卡车横穿咖啡厅 + 小哥/店员/客人瞬间消失（line 167-169）
        司机半张脸撞烂仍笑（line 171）→ 感染者从卡车缺口挤入（割肉翻卷仍笑 line 173）
        洪扬随高个男生翻柜台进后厨 → 屠夫拎人头砍脊柱（line 181）→ 牛肉面馆挂人体残骸（line 183）
        洪扬抡车逃 + 拐左路回马路（line 185-187）
      seq_climax: "卡车冲烂咖啡厅 + 屠夫拎人头 —— Arc 2 climax，'避难所只是暂时'+ 人体器物化顶点"

# === Arc 3: 士兵 POV 插入 + 军方破产 + 洪扬接武器 ===

arc_3:
  label: "士兵徐永恒 POV 插入 + 军队陷入'战争泥潭' + 战斗机自炸车队 + 洪扬接过武器"
  source_anchor: "line 205-283"
  sequences:
    - seq_id: "3.1"
      label: "回马路见'压扁仍爬'感染者 + 力量暴增五马分尸 + 神经毒素猜想 + 枪声响起"
      source_anchor: "line 189-207"
      core_conflict: "洪扬的逃命 vs 感染者非人化的力量与韧性"
      progression: |
        半截身子的人仍笑着爬（line 189）→ 壮汉被一群疯子五马分尸（line 189）→ '可能已经不是人了'（line 191）
        被踩烂的受害者站起加入施虐（line 193）→ 洪扬想到'神经毒素 / 细菌病毒'（line 195）→ 被砖头砸（line 197）
        听到枪声 + 多把枪 → 三辆军卡三角阵型点射感染者（line 205-207）
      seq_climax: "枪声响起 + 军卡阵型 —— 制度性救援希望的最高点，紧接被 Arc 3 后续彻底击碎"

    - seq_id: "3.2"
      label: "切入徐永恒内焦点 + 和平年代军人想象战争 vs 真扣扳机的痛苦"
      source_anchor: "line 209-217"
      core_conflict: "军人的为国挺身觉悟 vs 分不清平民与疯子的泥潭"
      progression: |
        徐永恒幻想奔赴战场（line 209）→ 真扣扳机内心痛苦压抑（line 211）
        越纽市丰台镇山区连队 + 今晨奉命支援勒德州空军基地（line 213）
        指令来源异常：往常国土安全局，这次国防部直接指挥=战争级别（line 215）→ 沿途撞车 + 暴乱 + 警局放人（line 217）
      seq_climax: "国防部直接指挥 —— 制度层把事件定级为'战争'，但军人随即发现这是无法用军事手段解决的泥潭"

    - seq_id: "3.3"
      label: "军队'救人变杀人'战争泥潭 + 喊话失效 + 士兵精神崩溃自爆"
      source_anchor: "line 219-247"
      core_conflict: "保护群众的利他 vs 无法分辨敌我的绝望"
      progression: |
        军士长令保护群众 + 警告无效可击杀（line 219）→ 抱孩子女人裂嘴扔烂肉（line 227）
        徐永恒打死压人者却发现杀错平民（line 229）→ '分不清谁是疯子'（line 231）→ 步枪沉重（line 235）
        喊话'举手跑来受保护'被疯子利用（line 237）→ 被扔血肉的士兵精神崩溃 + 杀战友 + 拔手雷自爆（line 247）
      seq_climax: "士兵自爆 —— phase0 candidate_b '理性利他者下场最惨'扩展到军队整体；'战争泥潭'具象化"

    - seq_id: "3.4"
      label: "洪扬躲车后 + 战斗机投弹炸己方 + 通讯兵假装通话辱骂 + 战斗机撞车队"
      source_anchor: "line 249-259"
      core_conflict: "制度性救援 vs 军方内乱自毁"
      progression: |
        洪扬因装扮怪异差点被己方子弹击中 → 躲车后（line 249）→ 看到士兵抱手雷自爆的不安预感（line 251）
        密集疯狂枪声 → 战斗机低空掠过投弹炸施虐疯子群（line 255）→ 接着飞弹轰向乱窜人群
        军士长问通讯兵 → 通讯兵拿耳朵+下颚骨假装通话'战斗机群正在飞向你爸爸的后庭'（line 257）→ 战斗机撞车队爆炸（line 259）
      seq_climax: "战斗机撞车队 + 通讯兵辱骂 —— Arc 3 climax，制度性救赎被彻底砍掉（与《地铁》《学校》军方内乱同源）"

    - seq_id: "3.5"
      label: "徐永恒被炸飞到洪扬身边 + 临终按手雷带 + 洪扬带走狗牌与武器 + 第一次扔手雷"
      source_anchor: "line 259-283"
      core_conflict: "洪扬的恐惧/善意 vs 士兵的临终托付"
      progression: |
        徐永恒被炸断右手飘到洪扬身边（line 261）→ 洪扬本能安慰'不要乱动'（line 263）
        徐永恒伸左手摸索 → 洪扬以为受攻击后退 → 凑近询问帮忙 → 徐永恒把左手按在手雷带上断气（line 265-267）
        洪扬第一次扔手雷炸开缺口逃生（line 269）→ 带走狗牌（徐永恒/欧星旭 line 273）+ 四手雷/匕首/手枪/两弹匣（line 275）
        翻围栏穿绿化带进野地 + 换爬坡档冲山坡甩开感染者（line 279-283）
      seq_climax: "洪扬第一次扔手雷杀出血路 + 接过遗物 —— '套子'外的果断初次显形 + '传火'链第一环（与《燃烧》周全背包同构）"

# === Arc 4: 穿野地回家 + 父亲救场 ===

arc_4:
  label: "穿野地回小区 + 认出被虐杀街坊 + 小区门口父亲洪宝山救场 + 父亲逼洪扬撕开'不杀人'套子"
  source_anchor: "line 285-343"
  sequences:
    - seq_id: "4.1"
      label: "接近小区 + 给父亲报平安 + 认出被虐杀的熟人街坊"
      source_anchor: "line 285-301"
      core_conflict: "回家的希望 vs '人间炼狱'比'十八层地狱'更痛"
      progression: |
        给父亲发平安 + 父亲'收到'（line 285）→ 思考怎么进小区（line 287）
        垃圾处理区远望熟悉小区=人间炼狱（认识里面的人 line 289）
        刘叔挂'喜'字下 + 腹腔接血脏脸盆（line 291-293）→ 兼职学生 / 修车下棋大爷被虐杀（line 295-297）
        '失去时才回味美好'（line 299）→ 老人用便携板凳把受害者脑袋砸变形（line 301）
      seq_climax: "刘叔挂在'喜'字下 —— 抽象暴力具体化为'失去的熟人'，把灾难情感落地到洪扬的生活史"

    - seq_id: "4.2"
      label: "不忍砸老人 + 力量暴增 lore + 被断手塞车轮失速倒地 + 父亲铁锹救场"
      source_anchor: "line 303-317"
      core_conflict: "洪扬的心存不忍 vs 老人感染者的暴增力量 / 父亲的'先杀他们'"
      progression: |
        父亲催问到哪了 → 洪扬不耐烦回复（line 303）→ 掰树枝不忍砸老人头（line 305）
        发现老头力量不比自己小（力量暴增 line 307）→ 被断手塞车轮失速倒地 + 被控制住（line 309）
        洪宝山铁锹劈进老人头骨救场（line 311）→ 洪扬疑父亲是否感染（line 313）
        父亲喊'别愣着往家跑' + '别那么死板，他们要杀你你就先杀他们'（line 315-317）
      seq_climax: "父亲'他们要杀你你就先杀他们' —— 弧光关键推力，逼洪扬撕开'不杀人 / 守规则'的套子"

    - seq_id: "4.3"
      label: "父子合力杀出 + 责怪父亲乱跑 + 父亲解释 + 踩井盖敲三下黑色幽默 + 关防盗门"
      source_anchor: "line 319-343"
      core_conflict: "洪扬的死板担忧 vs 父亲的护子行动 / 父子规则同构"
      progression: |
        洪扬闭眼用木棍砸感染者 + 父子杀出冲进小区（line 319）→ 责怪父亲'说好在家等'（line 319）
        父亲愧疚解释楼上看到杀人才下来接应（line 321）→ 保安被凌迟 + 三件事催促快跑（line 323）
        父亲挠死/警告无效杀几个挡路者（line 325-327）→ 洪扬扔手雷 + 父亲'居然是真的'（line 333）
        父亲踩井盖砸洪扬三下'不然倒霉'（line 339）→ 洪扬哭笑不得'认真点'（line 341）→ 关楼下防盗门（line 343）
      seq_climax: "踩井盖敲三下 —— 黑色幽默缓冲 + 父子'规则套子'同构（父亲也有自己的迷信规则），父子团聚完成"

# === Arc 5: 居家固守 + 全球沦陷 + 楼栋逐层失守 ===

arc_5:
  label: "居家囤水囤粮固守 + 全球同步沦陷 + 居民群崩坏 + 陈老太被断手开锁害死 + 猫眼黑暗=感染者脸"
  source_anchor: "line 345-437"
  sequences:
    - seq_id: "5.1"
      label: "回家冲身防体液 + 末日生存准备 + 病毒战推断 + 神经质自我否定"
      source_anchor: "line 345-361"
      core_conflict: "洪扬的强迫式备灾 vs 父亲'当局会解决'的乐观"
      progression: |
        洪扬冲身 + 问父亲有没有接触体液 + 父亲衣服丢洗衣机（line 345）→ 换衣摘镜戴新口罩（line 347）
        洪扬讲细菌战/病毒战推断 + H 国军事基地丧尸兵录像（会包抄）+ 病毒营销谣言（line 347-349）
        神经质自我否定'我有点分不清'（line 349）→ 父亲'我相信儿子的判断'（line 351）'亲父子谢什么'（line 353）
        囤水囤冰囤电 + 查雨水收集 / 求生攻略（line 359）→ 父亲'当局会解决'但仍帮忙（line 361）
      seq_climax: "父亲'我相信儿子的判断' —— 洪扬'怕被否定'的伤口被父亲无条件接纳缝合（与结局遗言呼应）"

    - seq_id: "5.2"
      label: "全球同步沦陷确认 + 国外直播被防空警报打断 + 居民群迷信诈骗崩坏"
      source_anchor: "line 363-403"
      core_conflict: "'只是本城出事'的侥幸 vs 全球同步崩坏的真相"
      progression: |
        不论 IP 哪国都同样情况（line 363）→ 国外直播博主拍天空火光 + 防空警报 + 拦截导弹 → 直播戛然而止（line 365）
        父亲误以为枪声是放炮（line 367）→ 雷雨 + 篝火焚活人被浇灭 + 黑影在雨中穿梭（line 383）
        居民群：女居民开门后丈夫被杀崩溃求救语音（line 385-393）
        群里迷信诈骗：卖保健品 + '燕燕姐'神罚火星船票（line 401-403）
      seq_climax: "国外直播被防空警报打断 —— 全球同步沦陷确认（phase1 T2 同源），制度希望彻底死"

