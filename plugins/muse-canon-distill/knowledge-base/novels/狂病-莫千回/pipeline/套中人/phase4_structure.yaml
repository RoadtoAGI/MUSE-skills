escalation_check:
  arc_1_to_2: "灾前秩序（街坊歧视怪人）→ 城市全面引爆（婉清死 + 断手飘到面前）—— 认知层崩坏"
  arc_2_to_3: "城市横向地狱（咖啡厅被冲烂）→ 制度性救援登场又破产（军卡阵型 → 战斗机自炸车队）"
  arc_3_to_4: "制度救援破产 + 洪扬接武器 → 收束回家（父子团聚但小区已成人间炼狱 + 失去熟人街坊）"
  arc_4_to_5: "父子团聚的暂时安全 → 围困常态化 + 全球沦陷确认 + 楼内逐层失守（陈老太死 + 家被锁定）"
  arc_5_to_6: "家被锁定为目标 → 家被攻破（对楼住户引感染者爬窗）+ 弃家上天台"
  arc_6_to_7: "弃家上天台 → 天台前 701 私设门绝境 + 父亲断后惨死（活下去理由崩坏）→ 唐志林转达 + 罗允追上（活下来=偿还）"
  curve_shape: "Arc 1 缓→急 / Arc 2 急 / Arc 3 急+转（POV 切换）/ Arc 4 急→缓（团聚缓冲）/ Arc 5 缓→急（围困）/ Arc 6 缓→极急（破防）/ Arc 7 极急→静→急→余韵"
  curve_note: |
    双形态结构 —— 前 3 Arc 横向空间灾难（冲击密度高、节奏急），
    Arc 4 团聚缓冲，
    后 3 Arc 纵向时间消耗（围困拉长 → 逐层失守 → 破防 → 失怙），
    Arc 7 是全篇唯一'静'（父亲死后的空白 line 591）+ 最长余韵（唐志林对谈 + 复仇 + 上路）。

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第三人称限知 / 洪扬焦点为主（line 33-203 / 249-695）"
    secondary: "外视角开场（婉清祖孙 / 孙大娘旁观洪扬 line 5-31）+ 士兵徐永恒内焦点插入段（line 209-259）"
    framing_device: "尾段唐志林对谈（line 597-665）= 倒叙框架收束 —— 用'幸存者讲述'回望全篇 + 揭示父亲'勇敢'本质 + 完成主题落点"
    function: |
      多焦点轮换是本篇 POV 实验：
      (1) 先让读者以'街坊外人'的歧视眼光看'套中人'，再切入他的内心 —— 制造'外貌怪 vs 内心善'的反讽落差；
      (2) 士兵徐永恒段把'战争泥潭 / 制度破产'的主题交给一个建制内角色承担，避免洪扬独白说教；
      (3) 两焦点在爆炸处交汇（徐永恒被炸飞到洪扬身边 line 259-267），完成'遗物传火'第一环。
      与系列其他 POV 实验并列：《学校》日记体 / 《燃烧》第二人称盲女 / 《地铁》群像并行 / 本篇多焦点轮换 + 倒叙框架。

  parallel_external_threads:
    - "纯人性恶线（贯穿）：母亲家暴（line 35/481-495）→ 时髦客人被锁门外（line 145）→ 702 见死不救（line 569）→ 对楼住户引感染者杀人（line 527）—— 与病毒线并行的'人性之恶'独立威胁"
    - "居民群信息线（Arc 5-6）：从每分钟上百条 → 失联（line 449）—— 文明信息坍塌的微缩 + 迷信诈骗滋生（line 401）"
    - "罗允暗线（尾段浮现）：line 695 骑摩托追上 —— 与《学校》《燃烧》罗允声音意象同源，跨篇'护送者'"

