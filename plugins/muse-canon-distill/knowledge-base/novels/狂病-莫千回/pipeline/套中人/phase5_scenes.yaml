  arc_1: "缓 → 急"        # 街坊外视角 + 套子病因 → 人群炸了 + 断手
  arc_2: "急 → 极急"      # 城市地狱骑行 → 咖啡厅凌迟 → 卡车冲烂咖啡厅
  arc_3: "急 → 转 → 急"   # 军卡希望 → 士兵 POV 战争泥潭 → 战斗机自炸 + 遗物传火
  arc_4: "急 → 缓"        # 认出街坊 + 父亲救场 → 踩井盖黑色幽默缓冲
  arc_5: "缓 → 急"        # 居家备灾 + 全球沦陷 → 陈老太死 + 猫眼黑暗
  arc_6: "缓 → 极急"      # 放风 + 童年回溯 → 对楼引感染者 + 爬窗破防
  arc_7: "极急 → 静 → 急 → 长余韵"  # 父亲断后 → 死后空白 → 复仇 → 唐志林转达 + 焚家 + 罗允追上
