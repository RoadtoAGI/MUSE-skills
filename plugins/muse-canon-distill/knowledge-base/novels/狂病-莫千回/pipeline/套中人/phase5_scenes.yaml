      craft_note: |
        '人群炸了'（line 81）—— 五个字承担灾难全面引爆，前文超市连环失控（钉枪/收银员/工人自钉腿）在此引爆。
        婉清几个月前送过洪扬一朵蓝花（前文 line 67）—— 她是第一个'善意者'，她的死才有重量。
        '如同破旧木偶一般被疯子握在手里甩动砸人'（line 89）+ 洒水车碾碎'如同狂风中的花朵四分五裂高高飞起'（line 91）——
        用'木偶 / 花朵'的轻盈意象写最残忍的死，是莫千回标志性'游戏化嗜虐'美学的反向运用（轻写重）。
        '那只曾经送给洪扬花朵的小手，不偏不倚飘在陷入呆滞的洪扬面前'（line 91）——
        '断手飘到面前'是激励事件的物象核心，'撕碎洪扬认知中的现实'（line 93）。
        洪扬本想救婉清（line 87-89）但'现实不会像电影一样给人选择的时间' —— 反英雄式无力感初现。
      craft_note_purpose: "激励事件 + 第一个'善意者被毁灭'打击 + 套子被认知层撕开的起点"
    description: "脚手架上的人跳下咬警察 → 满身血迹的人涌出 → '人群炸了' → 婉清与奶奶被冲散裹挟向马路 → 洪扬犹豫要不要救 → 婉清被疯子当木偶甩动砸人 → 洒水车碾碎'如花朵四分五裂' → 那只送过花的小手飘到洪扬面前 → 撕碎洪扬认知中的现实"

