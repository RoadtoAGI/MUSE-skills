      沿北区铁路往南走（line 693 童年和父亲走铁路的复现）。
      最终罗允骑摩托追上挥手（line 695）= 跨篇'读者代理人/护送者'接管 —— 全章 closing reversal。

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "洪宝山天台前断后惨死（断臂 / 割舌 / 抠眼仍挥刀）+ 临终'你很优秀，怕事不做事做事不怕事，我永远是你的后盾' + 洪扬终于撕开套子疯狂射击杀光所有人"
    source_anchor: "line 573-589"
    why_climax: |
      全篇价值层的引爆点：
      - 洪扬开篇是'被所有人当怪物、唯独父亲接纳'的套中人 → 此刻失去唯一接纳他的人；
      - 父亲开篇是'你懂个鸟'式无条件偏袒（line 43）→ 末尾用命兑现'我永远是你的后盾'；
      - 洪扬十几年'遵守规则 / 不杀人'的套子 → 在'只有死亡之前杀光所有人'里被彻底撕开（line 585）；
      - 价值从'活着护住父亲'（仍有希望）→ '父亲死、活下去无意义'（彻底深渊）。

  closing_reversal:
    event: "唐志林'弘叔说的没错，他的儿子真的很优秀'（line 663）+ 罗允骑摩托从背后追上向洪扬挥手（line 695）"
    source_anchor: "line 663, 695"
    function: |
      不是 happy ending 也不是 hopeless ending —— 是 obligated + relayed ending（与《燃烧》同构）。
      唐志林的转达把洪扬'被母亲否定一生'的伤口缝合（'你很优秀'终于从父亲之外的第三方说出口），
      让洪扬的活下去变成替父亲背的债；
      罗允尾段追上 = 跨篇'护送者'接管，把孤身上路的洪扬纳入系列的'传火'网络。
      余韵：'以前跟着父亲走就好了，现在只有自己了'（line 693）—— 失怙者的孤独被罗允的摩托声打破。

  controlling_idea_for_this_chapter: |
    "在末日，把自己包进套子的人活了下来，敞开自己去爱的人却死了 ——
    但真正杀死人的从来不是病毒，是那些'只在乎别人不能比自己过得好'的同类（对楼 5 楼住户）；
    而活下来不是奖赏，是一笔用父亲的命换来的、必须替他走完的债。"
    （主要映射 phase0 candidate_a：'人性之恶比病毒更可怕'——
     对楼住户 / 702 见死不救 / 母亲家暴 = 三种独立于病毒的人性之恶；
     兼及 candidate_b：理性利他的父亲 + 利他的士兵徐永恒下场最惨。）

