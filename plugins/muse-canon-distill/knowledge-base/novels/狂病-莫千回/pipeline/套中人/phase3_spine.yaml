      唐志林（702 见死不救者）= 本篇的'罗允式转达者'代偿 —— 他转达弘叔的'我儿子很优秀'（line 663），
      让洪扬的活下去变成对父亲的偿还（与《燃烧》罗允转达周全遗言同构）。
