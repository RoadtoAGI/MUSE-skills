_meta:
  version: "1.0"
  chapter: "套中人"
  source: "novels/狂病-莫千回/套中人.md"
  word_count_approx: 36400
  validated_against_source: true
  world_alignment:
    verdict: "shared_canon"
    reason: |
      本篇牢牢嵌在《狂病》共享世界观与时序内，多处硬锚：
      (1) 同一爆发首日图景 —— 警局收押的暴力犯罪人员被放出（line 217）= phase1 T0/T1 '警力首先沦陷' + '警察电台异常' 同源；
      (2) 同源进化战术 —— 痛觉缺失（line 137 / 583）、力量异常增强（line 189 / 301 / 307）、非致命伤不死只能一击毙命（line 455 / 583）= phase1 mad_disease_rules 完全一致；
      (3) 同源军方内乱意象 —— 战斗机低空投弹炸己方人群 + 通讯兵假装通话辱骂（line 255-259）= phase1 T2 '军方内乱 / 战斗机互撞' + 《地铁》line 229 / 《学校》line 135 同源；
      (4) 同源传染机制 —— 体液接触（line 345 洪扬冲身 + 问父亲有没有接触体液）、自残改造伏笔未现但 line 455 总结'有脑子会用工具'与 phase1 一致；
      (5) 跨篇人物罗允真身尾段登场（line 695 绿色卫衣 + 头盔 + 摩托声 + 挥手）—— 与《学校》line 223 / 《燃烧》line 177 罗允物质特征同源；
      (6) 同源 H 国军事基地泄露丧尸兵录像 + 病毒营销谣言 + 封锁事件（line 347-349）= phase0/phase1 'H 国首发 + 视频源 + 病毒营销' 同源 lore。
      本篇为'宅家固守型'幸存者样本，补全了系列'城市逃亡 → 居家围困'的另一种末日生存形态，不与任何已建 lore 冲突。
  form_note: |
    POV 形态：第三人称限知为主，多焦点轮换 ——
    主焦点是洪扬（'套中人'本体），开篇先用婉清奶奶 / 婉清 / 孙大娘的外部视角（line 5-31）旁观洪扬，
    再切入洪扬内焦点（line 33 起）；中段插入一整段士兵徐永恒的内焦点（line 209-259）形成短暂双主视角对位，
    爆炸后两视角在 line 259-267 同一事件交汇（徐永恒被炸飞到洪扬身边）。
    篇名指涉：'套中人'呼应契诃夫《套中人》（别里科夫把自己装进套子）——
    洪扬全身用黑针织帽 + 连帽卫衣 + 护目镜 + 口罩 + 围脖 + 手套 + 马丁靴 + 蓝牙耳机层层包裹（line 21），
    哪怕只露出眼睛都会恐慌（line 33）；这套'套子'是童年被母亲家暴 + '你这样别人会觉得你是变态'（line 35 / 489）
    内化出的心理铠甲 + 强迫症式'遵守规则'（line 37 靠右走 / 站起来）。
    本篇做了契诃夫式反转：别里科夫的套子是怯懦的自我囚禁，洪扬的套子在末日里却成了护命铠甲 ——
    全副武装恰好挡住体液感染 + N95 挡血雾（line 109）+ 防刺服救父亲（line 157 / 577）。
    '套子=囚笼'与'套子=救生衣'的悖论是本篇核心文学张力。

# === 脊椎 ===

spine:
  protagonist: "洪扬（约二十出头的大学生，恐惧社交的'套中人'，全身包裹度极高）"
  spine_mode: "desire"
  desire_object: "在末日里活着回家 → 和唯一接纳自己的父亲洪宝山一起守住家、活下去"
  shadow_desire: |
    洪扬要的从来不是'活下去'本身 ——
    是'被一个不嫌弃自己的人接住'（父亲洪宝山是他唯一可以不遵守规则、感到安全的人，line 43）。
    所以当父亲死，他的'活下去'失去了承载物（line 595 抚摸父亲脸颊 + 掏手雷想同归于尽）；
    最终他没自杀，而是把'活下去'重新定义为'替父亲完成 + 替自己去做想做的事'（line 659 沿铁路往南走 = 童年和父亲走铁路的复现）。
    shadow_desire 的延迟兑现 = 罗允尾段骑摩托追上（line 695）—— '被搀扶'状态的接管，与《燃烧》盲女被罗允接管同构。
  conscious_vs_unconscious:
    conscious: "买菜回家 → 守家囤水囤粮 → 对抗爬窗 / 砸门 / 攻击的感染者 → 带父亲逃上天台"
    unconscious: |
      洪扬真正需要的是'证明自己不是母亲口中的废物 / 变态' ——
      父亲临终前两次喊'你很优秀'（line 573 / 663 唐志林转述弘叔的话）才是他一生在找的东西。
      他守规则到死板（连末日里踩井盖也要敲三下是父亲做的，line 339），
      是因为'遵守规则=不犯错=不被讨厌'是他活下来的唯一逻辑；
      末日逼他第一次打破'不杀人'的规则（line 317 父亲喊'他们要杀你你就先杀他们'）= 套子被迫撕开的弧光起点。

# === 激励事件 ===

inciting_incident:
  event: "何家乐超市门口人群'炸了'—— 工人跳楼咬警察 + 满身血迹的人涌出 + 婉清被甩死 / 洒水车碾碎，狂病在洪扬眼前全面爆发"
  source_anchor: "line 77-91"
  type: "accident"
  delay_from_opening_chars_approx: 3900
  function: |
    用'婉清的断手飘到洪扬面前'（line 91）这一具体物象击穿洪扬的'套子'与日常认知 ——
    '那只断手仿佛撕碎了洪扬认知中的现实'（line 93）。
    激励事件把洪扬从'怕社交的宅男'瞬间抛进'必须靠身体和判断活命'的处境，
    打破他十几年靠'遵守规则 + 把自己包起来'维持的脆弱平衡。
    末日开篇标准节奏：日常采买 → 公共空间（超市）→ 灾难在最密集人群处引爆。
    注：婉清几个月前送过洪扬一朵蓝花（line 67）—— 她的死是第一个'善意者被毁灭'的具体打击，
    为全篇'有套子的人也守不住任何人'埋第一颗钉子。

# === 戏剧问题 ===

dramatic_question:
  main: "把自己包了十几年的'套中人'，能不能活着护住唯一接纳他的父亲？"
  subtext: |
    在一个'遵守规则反而受害'（line 565 洪扬怒吼为什么只有遵守规则的自己受伤）的世界里，
    一个被规则囚禁、不敢露出脸的人，要不要 / 能不能撕开套子？
    更深一层：'套子'到底是病（怯懦的自我囚禁）还是免疫力（末日里的护命铠甲）？
    全篇用'装扮怪异差点被士兵当恐怖分子误击'（line 249）vs '全副武装挡住体液 + N95 挡血雾 + 防刺服救父'（line 109 / 157）
    让这个问题始终悬而两义。
  payoff: |
    答案是悖论式的：
    套子保住了洪扬的命（物理免疫 + 不暴露），却没能保住父亲（line 589 父亲在天台前断手断舌而死）。
    洪扬最终活下来，但'活着护住父亲'的戏剧问题以失败收场 ——
    他护住了自己的命，输掉了活着的理由，
    然后在唐志林的'转达'（line 663 弘叔说的没错，他儿子真的很优秀）里重获一个继续走下去的理由。
    与《燃烧》'活下来=偿还'同构：洪扬的活下去是替父亲 + 替徐永恒（带走的狗牌）背着的债。

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: |
      感染者群（超市跳楼咬人 line 77 / 卡车撞咖啡厅 line 169 / 屠夫拎人头 line 181 /
      老人用便携板凳砸人 + 力量暴增 line 301-307 / 顺防盗窗爬三楼趴窗 line 459 /
      着火带长矛仍爬窗 line 535 / 断手开密码锁 line 405-407 / 老式门锁旋钮自解 line 561）
    layer_2_environment: |
      失控的城市动线（侧翻飞车 line 99 / 十字路口高架桥吊人扔人 line 107 / 出租车撞写字楼 line 115 /
      满地血滑倒车 line 129 / 咖啡厅防盗栏被卡车冲烂 line 169）
      + 围困的楼栋（701 私设天台前置门 line 563 / 702 不开门 line 569 / 单元防盗门关闭延迟三四秒 line 343/373）
    layer_3_evolution: |
      痛觉缺失（line 137 / 583 胸腔被打穿仍攻击）+ 力量异常增强（七八十岁老头力量不比洪扬小 line 307 /
      五马分尸壮汉 line 189）+ 非致命伤不死、唯一击毙（line 455 / 583）+ 有脑子会用工具会包抄（line 347 / 455）
  interpersonal:
    layer_1: |
      '套子'招来的歧视与排斥 —— 婉清奶奶把孙女护身后（line 25）、孙大娘'神神叨叨阴气森森'（line 27）、
      母亲'你这样别人会觉得你是变态'（line 35 / 489）—— 洪扬的人际对抗力量是'被当怪物看的目光'
    layer_2: |
      纯人类的恶（非感染）—— 2 号楼 5 楼住户（反串引战网民）故意用弹弓打碎洪扬家玻璃引感染者来杀父子（line 511-529）；
      702 唐志林见死不救（line 569）；时髦客人被锁门外凌迟时痛斥店里人冷血畜生（line 149）—— phase0 candidate_a '人性之恶独立于病毒' 的本篇实证
    layer_3: |
      洪扬自身'死板守规则'与父亲'怕事不做事，做事不怕事'（line 573）的价值冲突 ——
      父亲逼洪扬撕开'不杀人'套子（line 317）
  internal:
    layer_1: "恐惧社交 / 不敢露脸（line 33 露眼睛都恐慌）—— 童年家暴内化的心理套子"
    layer_2: "'遵守规则=不被讨厌'的强迫逻辑（line 37）vs 末日需要的果断 / 越界"
    layer_3: "父亲死后'这个世界没什么意义了'（line 595）+ 自我责怪（line 427 心中的声音骂他是陈老太之死的元凶）= '活下去意义崩坏'"
  societal:
    - "警力首先沦陷：收押暴力犯被放出 + 警局出事（line 217 / 73）—— 与 phase1 T0/T1 同源"
    - "军方内乱：战斗机低空投弹炸己方人群 + 通讯兵假装通话辱骂（line 255-259）—— 与《地铁》line 229 / 《学校》line 135 同源"
    - "信息渠道坍塌：报警台盲音（line 163）→ 居民群从每分钟上百条到网络连接失败（line 397 / 449）→ 全球同步沦陷（line 363-365 国外直播被防空警报 + 火光打断）"
    - "迷信 / 诈骗 / 反智在群里滋长（line 401-403 卖保健品 + '燕燕姐'神罚火星船票）—— phase1 'cultural' 网络极端隐喻同源"

# === Arc 框架 ===

arc_framework:
  total_arcs: 7
  notes: |
    本篇是系列里少见的'城市逃亡（前半）+ 居家围困（后半）'双形态结构 ——
    前 3 个 Arc 是'套中人穿过城市地狱回家'（横向空间灾难），
    后 4 个 Arc 是'套中人在家固守 → 守不住 → 失去父亲 → 重新上路'（纵向时间消耗 + 楼栋垂直围困）。
    每个 Arc 完成一次'套子'意义的重新定价：从囚笼 → 铠甲 → 守不住的徒劳 → 撕开。

  arc_1_outside_view_and_outbreak:
    label: "外视角铺陈'怪人'洪扬 + 超市采买 + 人群'炸了'"
    value_starting: "平静的灾前日常（街坊把洪扬当怪物，但秩序仍在）"
    value_ending: "灾难全面引爆（婉清死 / 认知被撕碎）"
    climax_event: "婉清被甩死 + 洒水车碾碎 + 断手飘到洪扬面前（line 89-91）"
    source_anchor: "line 5-91"
    function: |
      先用婉清祖孙 / 孙大娘的外视角把洪扬'套子化'外观和被歧视处境立住（line 21-29）——
      让读者先以街坊的眼光看'套中人'，再切入他被误解的内心（line 33-43）。
      建立洪扬与父亲洪宝山的安全关系（line 41-43）+ 与婉清的善意微光（line 67）。
      用超市连环失控（钉枪坠落 line 49 / 收银员砸人 line 57 / 工人自钉腿 line 63）做'人群炸了'的渐强前奏。

  arc_2_city_hell_ride:
    label: "骑车穿越城市地狱 + 咖啡厅避难 + 时髦客人被凌迟"
    value_starting: "本能逃命（套子=遮挡 + 降噪耳机=心理缓冲）"
    value_ending: "见证人性双重崩坏（感染者虐杀 + 健全人见死不救）+ 咖啡厅被卡车冲烂"
    climax_event: "卡车横穿咖啡厅 + 外卖小哥 / 店员 / 客人瞬间消失（line 167-169）"
    source_anchor: "line 93-203"
    function: |
      城市横向灾难的最高密度展演（吊人 / 碾人 / 铁板烙头 / 屠夫拎人头 line 181）——
      用'套子'的功能性首次显形：N95 挡血雾但挡不住血腥呕吐（line 109）、降噪耳机压噪音（line 59 / 83）。
      引入纯人性之恶：时髦客人被锁门外切手指凌迟 + 痛斥冷血畜生（line 145-149）= 与感染者之恶并置。
      洪扬'想救但更想活'的自私自觉（line 151）= 反英雄式生存的内心铺垫。

  arc_3_soldier_pov_and_grenade:
    label: "士兵徐永恒 POV 插入 + 军队陷入'战争泥潭' + 战斗机自炸车队 + 洪扬接过武器"
    value_starting: "军队=最后的制度性希望（枪声让洪扬燃起希望 line 253）"
    value_ending: "制度性救援彻底破产（车队被己方战斗机炸毁）+ 洪扬获得火力（手雷 / 匕首 / 手枪）"
    climax_event: "战斗机冲向车队爆炸 + 徐永恒被炸飞到洪扬身边 + 临终用左手按手雷带（line 259-267）"
    source_anchor: "line 205-283"
    function: |
      唯一一段离开洪扬焦点、进入士兵徐永恒内焦点（line 209-259）——
      用军人视角承担'分不清谁是疯子谁是平民 / 救人变杀人'的战争泥潭主题（line 231-243），
      把 phase0 candidate_b '理性 + 利他者下场最惨'扩展到军队整体。
      军方内乱（战斗机炸己方 + 通讯兵辱骂 line 255-259）= 制度救赎被彻底砍掉。
      徐永恒临终把手雷给洪扬 + 洪扬带走狗牌（line 267-273）= 第一次'传火 / 遗物承接'，与《燃烧》周全背包同构。
      此处洪扬第一次扔手雷杀出血路（line 269）= '套子'外的果断初次显形。

  arc_4_homeward_and_reunion:
    label: "穿野地回小区 + 认出被虐杀的街坊 + 小区门口父亲洪宝山救场"
    value_starting: "靠熟悉地形甩开感染者的暂时优势（line 279-283）"
    value_ending: "父子团聚（套子=安全的人重新在场）但小区已成'人间炼狱'"
    climax_event: "洪宝山用铁锹劈开抓洪扬的老人 + 喊'怕事不做事，做事不怕事，我永远是你的后盾'（line 309-317）"
    source_anchor: "line 285-343"
    function: |
      从城市横向灾难收束回'家'的母题 —— 被虐杀的是认识的街坊（刘叔挂在'喜'字下 line 291 / 修过自行车的下棋大爷 line 297），
      把抽象暴力具体化为'失去的熟人'，'失去时才回味美好'（line 299）。
      父亲洪宝山登场救场 = shadow_desire（被接纳的安全感）首次实体化（line 315 像小时候被欺负时父亲出现）。
      父亲逼洪扬撕开'不杀人'套子（line 317）= 弧光关键推力。
      黑色幽默缓冲：踩井盖敲三下（line 339）—— 父亲也有自己的'规则套子'，父子同构。

  arc_5_home_siege_and_collapse:
    label: "居家囤水囤粮固守 + 全球同步沦陷 + 楼栋逐层失守 + 陈老太被断手开锁害死"
    value_starting: "回家后的相对安全 + 末日生存准备（line 359 囤水囤冰囤电）"
    value_ending: "围困常态化 + 制度希望彻底死（全球沦陷 line 363）+ 楼内邻居逐个死 + 感染者趴猫眼伪装黑暗（line 435）"
    climax_event: "感染者用断手开陈老太密码锁 + 洪扬敲门暴露 + 猫眼里那张'黑暗'其实是感染者的脸（line 405-437）"
    source_anchor: "line 345-437"
    function: |
      形态切换：从横向逃亡进入纵向时间消耗 + 楼栋垂直围困。
      补全'宅家固守型'幸存样本 —— 洪扬的'套子人格'在此成为生存优势（天性宅 line 465 / 强迫式备灾 line 359）。
      全球同步沦陷由'国外直播 + 防空警报 + 火光'确认（line 363-365）= phase1 T2 全球爆发证据同源。
      纯人性恶 + 迷信诈骗在居民群里滋生（line 401-403）。
      陈老太之死（断手开密码锁 line 405 + 楼上只有辱骂大笑无呼救 line 423）= 洪扬'懦弱旁观'的自我审判（line 425-427）。
      猫眼黑暗=感染者眼睛（line 435）—— 全篇最高密度恐怖意象之一。

  arc_6_window_breach_and_betrayal:
    label: "数十天后放风 + 对楼住户弹弓打碎玻璃引感染者 + 感染者爬窗破防 + 父子弃家上天台"
    value_starting: "围困长期化中的脆弱日常（放风聊天 line 471-505）"
    value_ending: "家被攻破（玻璃被打碎引感染者爬窗 line 517-535）+ 被迫弃家逃天台"
    climax_event: "对楼 5 楼住户用弹弓专打玻璃引感染者 → 着火带长矛的感染者爬上窗台 + 身后至少七个（line 523-535）"
    source_anchor: "line 439-545"
    function: |
      第二个纯人性恶高峰：对楼反串引战网民为'主宰别人生命'的快感 + 嫉妒（line 527）故意引感染者杀父子 ——
      phase0 candidate_a '人性之恶比病毒更可怕' 的本篇顶点，呼应吴先生 / 廖振宇型反派。
      '为什么不能遵守一次规矩'（line 565 天台前置门）= 洪扬'守规则者受害'的怒吼，套子逻辑彻底崩塌的前奏。
      弃家=放弃'套子'的物理庇护，被迫进入开放围困。

  arc_7_father_death_and_relay:
    label: "天台逃生绝境 + 父亲洪宝山断后惨死 + 唐志林开门 + 复仇 + 焚家上路 + 罗允追上"
    value_starting: "天台前还有一扇 701 私设门 + 702 不开门的绝境（line 563-571）"
    value_ending: "父亲死（活着的理由崩坏 line 589-595）→ 唐志林'转达'父亲遗言 → 洪扬重获一个继续走的理由 → 焚家上路 → 罗允追上"
    climax_event: |
      洪宝山喊'怕事不做事，做事不怕事，我永远是你的后盾'后扑向感染者群断后惨死（line 573-589）；
      洪扬最终没引爆手雷，702 的唐志林开了门（line 595）
    source_anchor: "line 547-695"
    function: |
      全篇 main climax —— 父亲的死用莫千回标志性'多层意义动作'承担：
      (1) 断后=用命换洪扬活；(2) 临终遗言'你很优秀'=洪扬一生在找的东西；
