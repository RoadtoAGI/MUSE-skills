# === 设计意图（作者层）===

design_intent:
  what_world_serves:
    - "把'当代人的精神病征'（网络暴力 / 名声欲 / 反社会人格 / 净化执念 / 嗜死窥视 / 邪教感召）实体化为感染者群 + 6 型清醒人类反派"
    - "用'气味识别' '保留语言' '进化能力' '三欲三原色'让丧尸不再是'非人' 而是'人的极化态'（《套中人》line 617-621 本我/自我/超我解读：感染者 = 被剥夺自我超我只剩本我的纯粹人类，网络暴力是其轻症）"
    - "用'机场医院 / 易达广场 / KB-26 / 军区医院'传闻把幸存者拽进永恒移动状态 —— 戈多式希望符号逐级升格，越接近越绝望；唯一抵达的避难所（汉恩基金 / 黄金大厦）里面是地狱"
    - "用 POV 实验把'看见 / 记录 / 见证' 这件事本身做成主题：盲女只能闻 / 日记体只能记录 / 录音机嵌套 / 录音笔遗书 / 不可靠叙述 / 嵌套幻想元翻转"
    - "罗允作为系列'读者代理人'主角的世界功能：把 13 篇缝成一个世界的主缝线，用'救人但不强迫 + 转达遗言 / 读死者遗书 / 记录故事'做文学层面的'传火'；其底层动机 = 黄金国 line 825'惧怕死亡的过程而非死亡本身 / 拯救世界是奔向死亡的理由'——一个'为何去死'的理由对抗末日的无意义"
  what_world_NOT_does:
    - "不给病毒起源以作者层定论（保留多个 in-universe 学说并存：李教授学说 / H 博士视频 / 狂犬病变种民间说 / H 国军事基地泄露说），明确避开科幻定论"
    - "不提供制度性救赎（军方 / 警察 / 医院 / 国家中枢全部失败；唯一'秩序'是私人富豪 / 邪教 / 偏执屠夫自建的伪制度）"
    - "不区分'本质好人 vs 本质坏人' —— 任何人都可能是吴先生，任何人都可能是杨和修，任何人都可能是周全；'不正常者'反而可能活到最后（杨中旭）"

