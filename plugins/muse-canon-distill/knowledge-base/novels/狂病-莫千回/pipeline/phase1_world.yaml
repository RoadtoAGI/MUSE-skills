    - "学校保安系统全面缺席（《学校》line 19）"
    - "警局收押的暴力犯罪人员被放出 / 警局出事（《套中人》line 217 / 73）"
  T2_4_16_4_17:
    - "市区飞机失控俯冲城市公路炸群体（《恶》line 131-133 民航客机俯冲城外人群连锁爆炸）"
    - "军方内乱（《学校》line 135；《套中人》line 255-259 战斗机低空投弹炸己方人群 + 通讯兵假装通话辱骂）"
