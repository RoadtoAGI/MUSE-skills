# === 4D 设定 ===

four_d:
  period:
    when: "当代中国（2023 年 4 月）"
    evidence: "《学校》明确 '2023年4月16日'；现代手机 / 短视频 / 直播 / AI 智能均在日常出现；《精神病院》line 239-300 用'AI 是常识但杨中旭不知 AI 为何物'间接锚定爆发时间仍是 2023 当代"
  duration:
    span: "从爆发首日起延伸数周到数月（各篇时间错位；黄金国除夕夜 = 爆发后约 10 个月，为时序尾端锚之一）"
    early_phase: "4/15-4/19：警力首先沦陷，城市级混乱、网络半瘫、报警台占线"
    mid_phase: "数日-数周：感染者群在山林间游动，幸存者小队组队转移寻找避难所"
    late_phase: "数周-数月后：感染者群进化（自残隐藏、伏击、避电、围猎、拿枪 / 火箭筒、攻坚协作）；幸存者人数指数下降；出现定居型富豪避难所 / 邪教武装 / 封闭机构变体"
  location:
    primary_city: "浦城市（虚构现代都市，约 2000-3000 万人口规模）"
    landmarks_confirmed:
      - "某高校宿舍楼区（《学校》）"
      - "地铁系统（野福 / 莱恩 / 德鲁门 / 环河路 等站；机场线；《地铁》）"
      - "城市郊区山林、村庄、镇子（《燃烧》《狂人日志》《恶》《死亡奔赴》《不详》《他的故事》）"
      - "高速公路（《地铁》《恶》《狂人日志》《死亡奔赴》）"
      - "机场旁医院（伪避难所，'军方驻扎'系以讹传讹 —— 真相已揭示，详见 airport_hospital）"
      - "汉恩基金精神卫生中心（《精神病院》—— 陷阱型反派据点，已确认）"
      - "黄金大厦（《黄金国》罗凯伯富豪私人避难所 + 门卫老张 / 《精神病院》line 327 缝合点）"
      - "南陵河景区 + 古街（《他的故事》浦城母城新地标 line 105）"
    landmarks_global:
      - "达鲁国（虚构国家，野外探险博主拉朵被当地感染者剖腹直播）"
      - "H 国（首发病例 + 自称医学博士的视频源 + 军事基地泄露丧尸兵录像 + 病毒营销谣言，《套中人》line 347-349 / 《医院》起源说）"
      - "东江市（杨和修工作的 CC 联合医院所在地，未确认是否同一城市群）"
      - "越纽市丰台镇山区连队 + 勒德州空军基地（《套中人》line 213，系列军方建制坐标）"
      - "大都会综合应急管理中心 KB-26（《他的故事》line 479，国家中枢级戈多式希望，广播'请勿前往任何人群聚集地，封锁线失效'）"
    shared_geography_extra:
      - "黄金大厦：罗凯伯富豪私人避难所，国内至少 5 名富豪 + 国外更多建超完善避难所 / 地堡的预备网络一员；门卫老张查验幸存者（《黄金国》/《精神病院》line 327）"
      - "创世军据点流动：电台中转站吸纳幸存者 + 流动转移（《51人》line 187 / 357 / 《黄金国》创世军残余）"
      - "零食工厂 · 健康中心 · 中西医结合医院（《51人》line 477-479 / 567，浦城郊城镇设施屠场化）"
      - "月儿洞封闭尸洞（《他的故事》line 733，被困感染者靠互食 / 腊化腐尸存活的退化型场域）"
      - "易达广场地下人防工程（《恶》line 221，又一戈多式希望符号，全篇未抵达）"
      - "北方 / 西北高原研究所 · 科考站（《医院》line 491 李教授去向 / 《黄金国》line 209 / 499 罗允私人北上目标，替代'机场医院'的同构希望）"
    geo_layer: "城市中心 → 郊区山林 → 偏远村镇 → 跨城公路 → 国外，按距离爆发点递减熟悉度但不递减危险性"
  conflict_layer:
    external: "幸存者 vs 感染者群体"
    interpersonal: "幸存者小队内部背叛 / 抛弃 / 谋杀 / 道德崩坏；人类反派（6 型谱系）系统性诱杀"
    internal: "良知 vs 求生本能；'保留人性'是否代价过高；'拧巴 / 当断不断' vs '纯粹'（《他的故事》）"
    societal: "公权力（警察 / 军队 / 医疗）的迅速沦陷 + 信息渠道（电台 / 网络 / 直播）的同步坍塌"

# === 狂病 世界规则（核心系统）===

mad_disease_rules:
  designation:
    in_universe_name: "狂病"
    confirmed_in: "全 13 篇均提及该病名或同源病征"
    naming_origin: "H 国一位自称医学博士的早期视频；评论区出现，后被全网搬运"

  symptoms_progression:
    stage_1: "极度兴奋 + 难以入睡 + 异常亢奋（潜伏期数小时-1 天）"
    stage_2: "无差别狂笑 + 嗜虐欲望 + 不可控辱骂（污言秽语 + 性侵语言）"
    stage_3: "肾上腺素持续异常分泌 + 痛觉缺失 + 力量异常增强"
    stage_4: "理智部分留存但伦理边界完全失效；保留语言 / 工具使用 / 简单策划能力"

  physiology:
    hormonal: "肾上腺素水平远超常人且无上限（《医院》line 57）；保持高分泌不损害躯体（H 博士观察）"
    pain_response: "几乎完全缺失痛觉 —— 四肢断了仍可继续攻击；可主动拽断自己脱臼小臂（《学校》line 115 狗子）；肚皮破裂涌出内脏仍丝毫不受影响（《死亡奔赴》line 315）；胸腔被打穿仍攻击（《套中人》line 583）；被汽油焚烧仍扑来（《医院》line 599）"
    fatigue: "不需要休息也能维持狂热状态（早期）；但晚期感染者会休息 / 进食补充体力 / 吃同类 / 等猎物再次出现（《医院》line 425 火车站观察）"
    death_trigger: "唯一可靠的杀死方式 = 颅脑或致命脏器一击毙命；非致命伤不奏效（《死亡奔赴》line 317 李荣'要一击毙命 + 不要砍天灵盖' / 《套中人》line 455 / 583）"

  transmission:
    primary: "体液接触：咬伤、抓伤、唾液 / 血液经口鼻 / 皮肤微伤进入（《地铁》line 313 由杨和修提出皮肤屏障假说，本篇未验证；《死亡奔赴》line 213 被抓不能进驾驶室；《医院》line 99 被吐血染口当场尸变；《精神病院》line 99 现场演示）"
    not_via: "空气（杨和修推论：与感染者尸体共处不感染，《地铁》line 301）"
    incubation: "数小时到一天"
    cross_species: "不感染动物（蔡宇观察确认；《黄金国》line 65-79 野猪对抗感染者全程再确认）"
    self_inoculation: "主动吃感染者残肢 / 涂感染者血肉可主动感染（《学校》line 217 吞狗子断指 / 《医院》line 639 注射孙队长血 / 《51人》line 707 涂感染血肉助安乐死 / 《不详》line 557 自我感染）"

  immunity:
    note: "免疫者 / 携带者设定（系列后期硬设定，仍未被任何官方 / 科研线利用为疫苗）"
    immune_carrier:
      - "免疫者：汪华依免疫病毒（《他的故事》line 381）—— 但'免疫病毒不免疫重症'：被啃食腐尸带菌的感染者咬后伤口持续化脓发烧而亡（line 779），免疫者仍是普通人"
      - "免疫者 / 无症状感染者身份未定：李鸾被咬不感染（《不详》line 45-67），但'病毒携带者拥有感染他人能力'（line 257）；梦游不被感染者注意疑因身体携带病毒"
      - "携带者血液特殊性 + 免疫者血液能否当疫苗的悬念（《不详》line 257）；陶亦仁'用进化血液造第三种存在'被证伪——创世军成员被血液感染后与普通感染者无异（line 555）"

  recognition_mechanics:
    targeting:
      first_hypothesis: "肾上腺素分泌越低越被锁定（H 博士说法，《学校》line 101 评论区作者复述）"
      second_hypothesis: "感染者靠气味识别同类 / 非同类（杨和修在《地铁》line 301 提出，盲女在《燃烧》通过嗅觉反向印证，《医院》line 55-57 推测盲女嗅肾上腺素）"
      low_value_prey: "感染者会把'低价值猎物气质'（低肾上腺素 / 无存在感者）略过——有其他猎物时自动忽视（《51人》张亦川'屎味巧克力'运气 line 437-441，与气味识别 / 锁定假说互补的活体样本）"
      negative_evidence: "拟态表情骗不过（《学校》line 55-57 装狂笑实验失败——与气味识别假说互补）；《地铁》涂血试验过程与感染途径未呈现，杨和修再次出现时已呈感染状态，因此无法单独验证气味伪装或皮肤屏障假说"
    smell_signature: "煮熟糖浆 + 咸味的混合气味（《燃烧》line 27 首次命名）；'甜腻恶臭 + 黄油拖把味'（《他的故事》line 625 同源气味系统）"
    scent_exploit: "母猪配种发情粉可让感染者停止互相攻击 / 把携带者认作同类（《不详》line 245 毒饵预演 + 557-559 实证）—— 气味识别假说的可操作化反向利用，首次具体化'用外源气味伪装成感染者'"

  emotional_and_behavioral:
    dominant_affect: "狂笑（基线）"
    secondary_affects:
      - "极度愤怒（被挑衅时，可压倒避险本能）"
      - "性嗜虐（与同类交媾、剖腹当公厕、肠子绑脖、把头埋进胸腔搅动等仪式化行为，《医院》line 525 / 《黄金国》line 361）"
      - "群体狂欢（围观虐杀像围观庆典）"
      - "山头 / 操场仪式化祭坛（《燃烧》line 131 腐烂肉块堆 / 《不详》line 107 操场焚尸祭坛，动物 + 人类残骸混合）"
      - "时间观念 / 生前习惯潜意识残留（《黄金国》line 25-37 过年仪式化：砸爆人头当放炮 / 挂尸点燃当灯笼）"
    three_primal_colors_theory: "三欲三原色论：食欲 / 性欲 / 暴力欲 = 生命的三原色，金钱只是介质（《51人》line 295 秦良岳提出）—— 感染者 = 三欲无介质的纯粹释放态，与本系列'感染者 = 人的极化态'design_intent 互证"
    language_use:
      - "保留语言能力但只输出辱骂 / 威胁 / 性侵语言"
      - "可发起对话试图诱敌"
      - "保留对'背叛' '丢面子' 的反应"
      - "感染后仍呼喊所爱者的名字 + 用爱的语言说占有（《燃烧》line 169 周全 / 《学校》line 119 狗子 / 《死亡奔赴》line 479 把所爱者像花一样切下来吃掉）—— 感染者保留所爱的扭曲版本"

  intelligence_evolution:
    early_phase: "完全反射性 / 不顾死活直接扑击"
    mid_phase: "学会避开会致死的物体（电轨、火）"
    late_phase: |
      战术性 ——
      自残嘴部隐藏狂笑（《燃烧》line 69 撕舌头 / 嘴塞石头）、缝嘴 + 订书针固定眼皮伏击（《精神病院》line 223，与《燃烧》同源）、
      倒挂树上伏击（《燃烧》line 39 头朝下从树上扑）、顺防盗窗爬三楼趴窗 / 趴猫眼伪装黑暗（《套中人》line 459 / 435）、
      伪装尸体诈死（《狂人日志》line 223 / 《商场枯骨伏击》黄金国 line 403）、用车祸残骸阻路截杀车辆、
      靠痕迹追踪连续数周追杀（《不详》line 237 警服感染者 / 《51人》line 287 / 375）、
      会用工具（嵌牙齿 + 铁丝木棒《精神病院》line 229 / 用断手开指纹密码锁《套中人》line 405 / 双刀《51人》line 335）、
      群体合作围猎（狼群 / 蟑螂群《51人》line 329-331）、攻坚协作（拿枪 / 火箭筒把同伴头颅插弹头射楼 + 炸电梯井爬楼 + 与楼内感染者里应外合开防护门《黄金国》line 555 / 615 / 633）
    variants:
      - "魁梧者 = '练靶手' / 群体核心（《恶》line 169 螺丝刀扳手飞甩 / 《精神病院》line 225-229 两米防爆服感染者）"
      - "自残改造者 = 伏击专家（缝嘴 / 订书针固定眼皮 / 撕舌头）"
      - "头领型 / 双刀感染者（《51人》line 335 / 635 黑帽 + 订书针订人皮 + 双刀，前创世军同伴，居中规避炸点 line 639）"
      - "痛苦型感染者（《51人》line 221-223 陶亦仁尸周衍生，怒吼多于狂笑 + 自毁性泄欲，区别于基线狂笑）"
      - "能驾驶飞机自杀式撞击但不能精密操作（《死亡奔赴》line 257-267 疯机长驾机互撞，'感染后不能精密操作'= 可被利用的弱点）"
      - "晚期感染者绑轮胎保护关键部位（《死亡奔赴》line 497 末日降临一段时间后才感染者的自我保护意识）"
      - "封闭尸洞退化型（《他的故事》line 733-739 被困月儿洞、靠互食 / 腊化腐尸存活、瘦弱迟缓、惧光却自虐掰眼皮迎光）"

  exceptions_and_edge_cases:
    refusal_to_infect:
      - "天生反社会人格者会主动避免感染——感染是'降级'，因为感染者失去'选择性释放欲望'的能力，沦为弱智 / 疯狗 / 畜生"
      - "原文出处：吴先生'变成没有目的、只会施虐的弱智，好像就和畜生也没什么两样了'（《狂人日志》line 85）；与《燃烧》line 111 李太太'被感染加入'提议形成系列对位（一边把感染当解脱，一边把感染当降格）"
    refusal_other_forms:
      - "强人 / 感召者拒绝感染但非反社会型：陶亦仁被传'神明下凡'+ 一人杀七八个感染者沾血不感染 + 吓退感染者群（《51人》line 201-203）—— '死亡奔赴的感召者'而非冷血猎手"
      - "廖振宇明确拒绝感染（学开膛手而非沦为畜生，《恶》line 35）但被感染者吞噬；吴先生把感染者当行刑工具役使"
    differentiation: "感染者群体内部存在层级（魁梧者作'练靶手' / 群体核心；自残改造者为'伏击专家'；头领型双刀感染者；痛苦型）；感染者会攻击 / 啃食同类（《精神病院》line 159）"
    self_chosen_infection:
      - "理智者在体力 / 心理彻底崩溃时可能主动选择感染（《学校》line 217 吞狗子断指 + '怕疼'理由）"
      - "盲女'你'在屋内对周全说'杀了我吧'（《燃烧》line 113）被偶然爆炸打断 —— 自杀预演"
      - "自感染作为安乐死 / 求死母题变体：秦良岳自选感染告别（《51人》line 707-715，张亦川涂感染血肉助其安乐死）；刘医生注射孙队长血主动感染剥夺施虐者快感（《医院》line 639）；李鸾自我感染引创世军吃掉自己以'摧毁暴风本身'（《不详》line 557-567）"

  origin_hypotheses:
    note: "病毒起源仍标为 in-universe 学说 / 民间解释，非作者层定论；多说并存。"
    li_jiaoshou_theory:
      label: "《医院》李教授学说（全系列最密集起源说，独有 lore）"
      claims:
        - "古文寓言《狂犬》（《医院》line 247）+ 安史之乱 / 五胡乱华伴随天降异象 + 《狂病编年史》业史（line 279）—— 历史循环暗示"
        - "陨石近距离掠过地球 = 导火索（line 277）"
        - "H 国废料排海 = 现代规模化主因（line 281）"
        - "可能是基因层面改变而非病毒（line 283）"
        - "本源感染率约 75%（line 287，全系列首次量化感染规模）"
    other_in_universe_explanations:
      - "H 国自称医学博士的早期视频（病征 + 肾上腺素被嗅探锁定假说，《学校》line 95-101）"
      - "李荣'狂病 = 狂犬病变种'民间锚定（三只狂犬病疯狗回忆，《死亡奔赴》line 365-367 / 219）"
      - "H 国军事基地泄露丧尸兵录像 + 病毒营销谣言 + 封锁事件（《套中人》line 347-349）"

# === 文明系统坍塌时序 ===

civilization_collapse_timeline:
  T0_dusk_4_15:
    - "网吧 / 公共场所首批散发感染"
    - "警察电台开始出现异常回复（辱骂 / 模仿幸存者求救）"
    - "老康（吴先生同伙）因偷钳子被抓服氰化物自杀"
  T1_morning_4_16:
    - "城市级群殴 / 虐杀全面爆发（《不详》line 19-21 校园跑操变疯子同源）"
