_meta:
  version: "1.0"
  chapter: "死亡奔赴"
  source: "novels/狂病-莫千回/死亡奔赴.md"
  word_count_approx: 31700
  validated_against_source: true
  form_note: |
    第三人称限知 POV，全程贴住岳子安（大学生，去探望异地女友周书韵途中遭遇爆发）；
    结尾 line 475-505 视角脱离岳子安、由两个拾荒幸存者（罗允 + 洪扬）外部接管 ——
    与《学校》日记体 + 罗允拾日记本、《地铁》POV 转交陆小虎同源的"读者代理人"收束。
  world_alignment:
    verdict: "shared_canon"
    reasoning: |
      据原文判定本篇属狂病病毒主线同世界观，不是平行寓言。证据：
      (1) 病征完全一致 —— 狂笑 + 不可控辱骂 + 性侵语言（line 113, 127, 479）+ 痛觉缺失（line 315 '肚皮破裂涌出内脏却丝毫不受影响'、line 423 断腿仍爬）+ 力量异常 + 一击毙命才死（line 317 李荣'要一击毙命' + '不要砍天灵盖'）—— 与 phase1 mad_disease_rules 四阶段 + death_trigger 逐条吻合。
      (2) 传染机制一致 —— 咬伤 / 抓伤经皮肤微伤传播（line 213 黄志祥被抓不能进驾驶室、line 461 岳子安被咬后自残断臂）；line 219 李荣明确称'好像得了狂犬病一类的东西，被咬被抓都会变疯'，line 365-367 李荣回忆三只狂犬病疯狗 —— 与 phase1 transmission + design_intent'一种传染性极强、潜伏期超长的狂犬病变种'同源命名。
      (3) 同步全球爆发 —— 多机场 / 城镇 / 高速同步沦陷（line 69, 223, 363），与 phase0 cross_part_links'全球同步爆发'吻合。
      (4) 进化战术一致 —— line 497 感染者身上绑轮胎保护关键部位（晚期感染者自我保护意识），呼应 phase1 intelligence_evolution late_phase。
      (5) 决定性铁证：罗允（真）跨篇登场（line 475-505）—— 摩托车 + 救人但不强迫 + 读取死者信件并转达 / 怅然，与《燃烧》《学校》罗允'读者代理人'原则逐条同构。本篇是罗允原则在'未能救到的死者'上的镜像变体。
      (6) 时间线吻合 —— 爆发首日上午机场 → 数月后岳子安抵达目的地城市（line 467 '灾难已经爆发了几个月'），落在 phase1 civilization_collapse_timeline T0-T4 区间。
    note: |
      唯一未对齐项是地名：本篇地名（航太国际航空 / NV98 航班 / 目的地城市）未点名'浦城市'，
      但 phase0 已记浦城市机场旁医院为公共符号，本篇为异地旅行线（出发地→经停中间城市→目的地城市），
      地名缺名属'未点名'而非'平行世界'，不构成 parallel_allegory 证据。

# === 脊椎 ===

spine:
  protagonist: "岳子安（大学生，去异地探望交往两年的女友周书韵）"
  spine_mode: "desire"
  desire_object: "活着穿越沦陷的国土，抵达和周书韵约好见面的城市，与她重逢"
  shadow_desire: |
    岳子安想要的不只是见到女友 ——
    是'证明自己不是路人甲'（line 401-403：从小平庸、专业是家长选的、游戏没上过巅峰，
    唯独周书韵在众多追求者里坚定选了平平无奇的他，让他第一次相信自己是'特别的'）。
    所以'奔赴女友'本质是奔赴'被一个人认定为唯一'的那个自我 ——
    末日剥光了一切社会身份后，这份'被选中感'成了他活下去的唯一坐标。
    最终的悲剧反讽：他抵达了，但他已感染成疯子，把'周书韵'幻觉投射到一个陌生幸存者身上，
    把'像花一样一片片切下来吃掉'当成爱（line 479）—— shadow_desire 以最扭曲的形态被'兑现'。
  conscious_vs_unconscious:
    conscious: "活下去 / 搞到车 / 搞到枪 / 照地图导航 / 一程一程逼近目的地城市"
    unconscious: |
      岳子安没有'为自己而活'的概念 ——
      他活着的全部动力外包给了'周书韵在等我'（line 187, 273, 371, 463）。
      所以当感染逼近（line 461 被咬），他第一反应不是怕死，是'感染了就算找到周书韵也会去伤害她'，
      宁愿开枪打断自己的左臂阻止病毒 —— 不自觉需要是'保住那个能被周书韵认定的、还是人的自己'。
      他对病毒最大的恐惧不是死，是'变成会伤害所爱之人的东西'（与《燃烧》周全自燃同源动机）。

# === 激励事件 ===

inciting_incident:
  event: "机场候机厅那个'文质彬彬的哥哥'突然发狂掐死弟弟、抠出父亲眼球 → 全机场 K 区 / 托运点 / 停车场连锁爆发呼援"
  source_anchor: "line 59-69"
  type: "accident"
  delay_from_opening_chars_approx: 5800
  function: |
    前 58 行是慢热的'末日日常'铺垫（小孩复读机式末日预言 + 自助托运关闭 + 肢解行李箱传闻 +
    安检口暴力 + 特产店玻璃割脸 —— 全是被岳子安当成'多事之秋'消解的前震）。
    激励事件用'最不该发疯的人（文质彬彬的哥哥）'第一个发疯，把'末日只是新闻里的事'这个平衡彻底打破。
    标志性反讽：那个被全员嫌烦的'复读机崽子'喊的'今天可能是世界末日'（line 5, 35, 43）一语成谶 ——
    哥哥发疯时嘶吼的正是'是，今天是世界末日！所有人都去死'（line 63）。

# === 戏剧问题 ===

dramatic_question:
  main: "在全员变成嗜血疯子的末日里，一个普通到不能再普通的大学生，能不能活着抵达女友所在的城市与她重逢？"
  subtext: |
    当'活下去'本身已经没有制度性意义（警察、军队、医院全部沦陷），
    一个'被一个人认定为唯一'的执念，到底是支撑他穿越地狱的精神支柱，
    还是把他一步步拖向死亡的诱饵？
    （李荣的对照命题：line 397 '人之所以是人，就是不会像蝇虫一样单纯为了吃食和繁衍活着 ——
    家人是精神支柱和活下去的动力'。岳子安和李荣都为'奔赴所爱之人'赴死，这是本篇双线共题。）
  payoff: |
    答案是双重悖论：
    (1) 他抵达了 —— 但作为已经感染的疯子抵达（line 469 几个月后衣衫褴褛走出山林，
        line 475 揭穿他是感染者）；
    (2) 他'见到'了周书韵 —— 但那是幻觉，他把陌生幸存者洪扬看成了女友（line 473, 479-481
        罗允复述'假如一个人非常爱另一个人，所见每个人都像所爱之人'）；
    (3) 真正抵达的不是他，是'那封信' —— 罗允从他尸体上取走遗书塞进笔记本（line 483-505），
        岳子安一路的艰辛只剩一封信的内容被两个陌生人当作谈资，
        而罗允'凡事做两手准备'的进城路线图，正是从这封信里得到的经验（line 503）。
    所以戏剧问题的回答是：他到了，但他没赢；他的'奔赴'唯一兑现的，是给后来者留下一份'传火'式的经验。

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: |
      感染者群（机场踩踏 + 按摩椅夹颅 line 79-85 / 客舱啃食 line 113-185 /
      跑道牵引车拖尸 line 269 / 公路逆行车 + 拦路抛人 line 415 /
      改装摩托车队人头插杆挂炫光灯 line 419-431 / 山林收费站追杀 line 445）
    layer_2_environment: |
      民航客机（雷暴 / 强气流 / 油耗 / 起落架损坏 line 89, 151, 197, 271）+
      陌生山区（迷路 / 发烧 / 无食物 line 445-453）+ 五六百公里跨城路程 +
      手机丢失后失去导航（line 439）
    layer_3_evolution: |
      感染疯子仍能驾驶飞机互撞自杀（line 257-265 左侧航班疯机长直冲）+
      晚期感染者绑轮胎护身（line 497）—— 进化战术；
      但'感染后不能精密操作'（line 267 李荣判断）成为可被利用的弱点
  interpersonal:
    layer_1: |
      家长把儿子推开（line 65 机场哥哥一家'实在不行把闹事的哥哥留下'）—— 末日里的亲情切割；
      李太太式自私在本篇缺席，本篇人际线反而是'萍水相逢的善意'（李荣 vs 岳子安）
    layer_2: |
      李荣的'理性冷酷' vs 岳子安的'感性赴约' —— line 231 李荣主动放弃整客舱感染者（减压闷杀）、
      line 385 长按喇叭直接撞死路中央人影（'还在遵守秩序的就是自取灭亡'）；
      这种冷酷不是恶，是李荣'灰色生存者'的生存算法
    layer_3: |
      李荣'救人但有边界' —— line 213 空保黄志祥被抓不能进驾驶室（被默契牺牲）；
      line 233 副机长'客舱里的疯子就当超度' —— 主动闷杀全舱；
      但李荣最终把猎枪和子弹留给岳子安（line 411 '我开好车，你拿好枪，很公平吧'）=
      灰色生存者的隐性温柔
  internal:
    layer_1: "普通人岳子安第一次杀人的道德重量（line 179 杀空姐后'还没从杀了人的压抑情绪走出来'）"
    layer_2: "'女友在等我'的执念 vs '理性上这条路是奔向死亡'（line 371, 409 明知是赴死仍选择前往）"
    layer_3: |
      被咬感染后'不想在见到女友前死掉，也不想感染了去伤害周书韵'（line 463）的终极两难 ——
      最后开枪断臂自救失败、感染、以幻觉'抵达' = internal 对抗力量的彻底失守
  societal:
    - "报警电话打不通 + 新闻无官媒报道（line 363）—— 与《地铁》《学校》信息渠道同步坍塌同源"
    - "塔台调度系统全面混乱（line 253）+ 多个机场同步沦陷（line 223, 249）"
    - "手机早期可联网（line 351 灾难后通讯群消息爆炸）→ 后期信号 + 手机本体双双失去（line 439）"
    - "机场围网通电防野生动物但'防肉身可以、防汽车防不住'（line 343-347）—— 民用安防在车前失效"

# === Arc 框架 ===

arc_framework:
  total_arcs: 6
  notes: |
    本篇是'公路 / 空难 + 长途奔赴'型结构 —— 不是《燃烧》那种'每 Arc 死一人'的密集受难体，
    而是'交通工具逐级降级 + 同伴逐级流失'的递减式赴死：
    飞机（机组 + 空乘群）→ 皮卡（李荣 + 蔡颖婷）→ 教练车（独自）→ 双腿（彻底孤身）。
    每降一级交通工具 = 一次生存资源剥夺 + 一个同伴离场，最后只剩'一封信 + 一具尸体'。
    Arc 6 是 POV 脱离主角的'读者代理人'收束，独立成 Arc（与前 5 Arc 的岳子安 POV 断开）。

  arc_1_airport_outbreak:
    label: "机场末日日常 + 文质彬彬哥哥发疯 + 客流踩踏沦陷 + 登机逃离"
    value_starting: "去见女友的轻松愉悦（VIP 通道 / 意外之喜 / 和女友斗嘴）"
    value_ending: "机场沦陷但'我已经离开了'的虚假安全（line 87 自我安慰'一切应该已经安全了'）"
    climax_event: "文质彬彬哥哥掐弟弟 + 抠父眼球 + 咬下安保半张脸 → K 区 / 托运点 / 停车场连锁爆发（line 59-71）"
    source_anchor: "line 5-89"
    function: |
      把全篇的核心反讽符号'今天可能是世界末日'（小孩复读机预言）从背景噪音推到台前一语成谶；
      建立岳子安'旁观者 + 手机录像见证者'身份（line 79-85 隔着舷窗放大拍按摩椅夹颅虐杀）——
      与《地铁》眼镜男录像、全系列'录像 / 直播作为见证机制'同源。
      登机逃离 = 第一层'虚假安全'，为 Arc 2 客舱内爆发反转准备落差。

  arc_2_cabin_outbreak:
    label: "客舱内空少感染发病 + 多名乘客 / 机组连锁感染 + 李荣特技飞行护送三人进驾驶室"
    value_starting: "'离开机场就安全'的虚假安全"
    value_ending: "三人困守驾驶室 + 副机长闷杀全舱 + '世界末日'被确认（line 227）"
    climax_event: |
      李荣用试飞员特技（左右倾斜 / 抬升让感染者互相摔成一团 line 197-209）把岳子安 + 蔡颖婷
      护送进驾驶室 → 黄志祥因被抓不能进、自愿躲厕所（line 213-217）→
      副机长开外流活门减压、闷杀整客舱感染者（line 235-237）
    source_anchor: "line 89-249"
    function: |
      把'安全'从机场转移到客舱再被打破 —— 病毒已在飞机内（line 107 空少在机场被小孩抓破皮感染）；
      引入李荣'灰色生存者'核心方法论（line 219 '被咬被抓都会变疯' + 主动放弃感染者）；
      黄志祥的死法用'敞开的厕所门 + 溅满鲜血'（line 305）省略承担 —— 莫千回标志性'缺席死亡'；
      减压闷杀全舱 = 本篇'集体超度'意象（line 233 '客舱里的疯子就当超度'）。
      李荣高空俯瞰城市'脉络上流动着鲜血'（line 223-225）= 全球同步沦陷的上帝视角确认。

  arc_3_crash_landing:
    label: "迫降途中躲疯机长撞机 + 起落架损坏硬着陆 + 撞候机厅 + 副机长惨死 + 防疫服斧头突围抢皮卡"
    value_starting: "驾驶室暂时安全 + 寻找小机场迫降希望"
    value_ending: "冲出机场围网 + 第一次真正脱离危险（但蔡颖婷已中枪将死）"
    climax_event: |
      硬着陆撞候机厅 + 副机长被断柱砸成半截（line 291-295）→ 三人穿防疫服 + 持斧突围
      （李荣传授'一击毙命 / 不砍天灵盖' line 317）→ 抢到插着钥匙的皮卡 → 撞毁通电围网冲出（line 341-347）
    source_anchor: "line 249-347"
    function: |
      交通工具第一次降级（飞机 → 皮卡）；李荣'熟人死亡 vs 陌生人死亡'的情感落差揭示
      （line 297 '面对一客舱残碎尸体冷静、看到半个徒弟副机长惨死却失神'）—— 灰色生存者的人性裂缝；
      传授一击毙命战术 = 本篇 lore 落地（与 phase1 death_trigger 同源、与《燃烧》罗允战术同位）；
      左侧疯机长驾机互撞（line 257-267）= 感染者进化的极端展示 + '感染后不能精密操作'弱点确立。

  arc_4_pickup_journey:
    label: "皮卡逃亡 + 蔡颖婷中枪死 + 山林潦草埋葬 + 李荣岳子安在驾校分道扬镳"
    value_starting: "脱离机场的短暂释放（蔡颖婷啜泣 + 岳子安想看女友消息 line 349）"
    value_ending: "两人分车上路 + 各自奔赴所爱之人 + '此一别可能是永别'"
    climax_event: |
      驱鸟员猎枪流弹打死后排蔡颖婷（line 353-357）→ 山林潦草埋葬（line 359-361）→
      李荣岳子安在驾校砸玻璃 / 接电线发动教练车（line 387-391）→ 分别（李荣回家给儿子过成人礼、
      岳子安去找女友）→ 李荣把猎枪 + 子弹悄悄留给岳子安（line 411）
    source_anchor: "line 349-413"
    function: |
      交通工具第二次降级（皮卡 → 教练车）+ 同伴全部离场（蔡颖婷死 / 李荣分别）；
      本篇主题核心场景 —— 李荣 line 397 '人不会像蝇虫一样只为吃食繁衍活着' +
      岳子安 line 401-403 '路人甲被周书韵认定为唯一'独白 = 双线共题'为所爱之人赴死'；
      李荣'我开好车你拿好枪'（line 411）= 灰色生存者的隐性温柔，呼应《燃烧》周全'灰色男主'谱系。
      李荣回忆三只狂犬病疯狗（line 365-367）= 病原 in-universe 解释锚定 shared_canon。

  arc_5_solo_road_to_death:
    label: "独自驾教练车 → 改装摩托队袭击翻车 → 失手机失方向 → 徒步数月 → 被咬 → 开枪断臂"
    value_starting: "独自上路 + 导航逼近目的地的希望"
    value_ending: "被咬感染 + 开枪打断左臂自救（成败留白）"
    climax_event: |
      改装摩托疯子队（人头插杆 + 炫光灯 line 419）对撞翻车 + 手机丢失（line 433-439）→
      徒步迷路 / 发烧 / 半生不熟吃野狗 / 灼烧消毒伤口（line 445-453）→
      雨夜被咬左臂（line 461）→ 用脚趾抠扳机开枪自断左臂阻止病毒扩散（line 465）
    source_anchor: "line 413-465"
    function: |
      交通工具第三次降级（教练车 → 双腿）+ 导航工具丢失 = 生存资源彻底剥夺；
      被咬后'不想感染了去伤害周书韵'的断臂自救（line 463-465）= internal 对抗力量顶点，
      与《燃烧》周全自燃同源动机（不愿以感染者状态伤害所爱之人）；
      帐篷三尸 + 遗书 + 全家福（line 455）+ 岳子安留信（line 459）= '传火'意象第一次埋点
      （他读了别人的信，也留下自己的信）—— 为 Arc 6 罗允取信收束铺垫。

  arc_6_relay_reader_proxy:
    label: "数月后抵达目的地城市 → 感染状态把幸存者幻觉成女友 → 罗允 + 洪扬击杀 → 取信转达 + 怅然"
    value_starting: "衣衫褴褛抵达约定城市 + '熟悉身影'走出树林（line 469-473 岳子安幻觉视角）"
    value_ending: |
      岳子安作为感染者被击杀 + 罗允取走遗书塞进笔记本 + 罗允从信里得到进城经验
      + 罗允怅然'未经历的苦难永远不会被体会，到他们这里就只剩一封信'（line 495）
    climax_event: |
      POV 反转（line 475）：'突然窜出的感染者大笑着倒下，罗允长出一口气' ——
      揭穿前文'周书韵递蓝花'是岳子安幻觉，他其实扑向幸存者洪扬被击杀；
      罗允取猎枪发现还有一发子弹 + 取胸前塑料袋遗书 + 读信怅然 + 提议绑轮胎护身进城（line 477-505）
    source_anchor: "line 467-505"
    function: |
      全篇 main climax + closing reversal —— POV 从岳子安外部接管到罗允 / 洪扬，
      读者此刻才确认'岳子安其实没见到女友、他抵达即死、他的爱化成了最恶心的占有幻觉'；
      罗允'读取死者信件 + 转达 / 怅然'= 《燃烧》'转达遗言'原则的镜像变体
      （《燃烧》罗允救活了人并转达；本篇罗允来晚了，只能读死者的信 + 把经验带走）；
      '一路艰辛只剩一封信的内容'（line 495）= 全系列 emotional_charge'记住 / 被遗忘'主题顶点。

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "POV 反转揭穿'抵达女友'是岳子安感染后的幻觉 + 罗允 / 洪扬击杀 + 罗允取信"
    source_anchor: "line 469-483"
    why_climax: |
      全篇价值层的引爆点：
      - 岳子安开篇是'去见女友的普通幸福大学生' → 末尾变成'把所爱之人幻觉投射到陌生人身上、
        想把'周书韵'像花一样切下来吃掉的疯子'（line 479）—— 爱的最彻底异化；
      - 读者一路代入岳子安'快到了'的希望 → 在 line 475 一句'感染者大笑着倒下'被彻底击碎，
        莫千回标志性'让读者和主角一起被骗到最后一刻'的省略 / 反转手法；
      - 罗允从一直缺席（前 5 Arc 完全没出现）→ 末尾以'拾信者 / 见证者'身份接管叙事，
        把岳子安的整段旅程压缩成'一封发黄卷边的信'。

  closing_reversal:
    event: "罗允'凡事都要做好两手准备 —— 这是自己从那封信上得到的经验'（line 503）+ 合上笔记"
    source_anchor: "line 493-505"
    function: |
      不是 happy ending 也不是 pure hopeless ending —— 是 relay ending（传火式收束）。
      岳子安没能见到女友、没能活着、连名字都没被罗允和洪扬记住，
      但他用绑轮胎护身的'晚期感染者自我保护'经验、用进城路线，间接帮罗允'做两手准备'活下去 ——
      死者的经验成了生者的工具。这与《燃烧》'活下来 = 偿还'、《地铁》《学校》'读者代理人传火'
      同构，但更冷：本篇连'被救活的人'都没有，只有'被读到的一封信'。
      罗允怅然问'假如有一天他们俩也失败了，会不会也只是别人的谈资'（line 493）=
      把'见证'本身的脆弱推到顶点。

  controlling_idea_for_this_chapter: |
    "在崩坏的末日里，'奔赴所爱之人'既是普通人活下去的唯一精神支柱，
    也是把他一步步拖向死亡的诱饵 ——
    最深的爱最终会异化成最恶心的占有，
    而一个人穷尽生命的奔赴，到了陌生人那里，只剩一封信的内容、一句谈资、一份能让别人活下去的经验。"
    （映射全系列 candidate_c：'他者的善意 / 希望可能比恶意更危险 —— 因为它给你希望，
    让你相信下一刻可以更好'；同时强力呼应 emotional_charge '记住我的欲望 vs 记不住任何人的现实'。）

