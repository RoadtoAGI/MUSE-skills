        脱鞋用脚趾抠扳机 + 咬树棍 + 开枪打断左臂阻止病毒（line 465）
        —— 断臂自救 = internal 顶点，与《燃烧》周全自燃同源动机（不愿以感染者状态伤害所爱之人）；成败留白
    description: "独自驾车不敢停（路过求救男人也没停）→ 改装摩托疯子队（人头插杆+炫光灯+人腿绑车尾+人皮贴灯）对撞 → 黄毛疯子断腿仍抓他 → 猎枪首次开火 → 卡车逼撞侧翻翻滚 → 醒来失手机失方向 → 徒步迷路发烧吃野狗灼烧消毒 → 雨夜被咬左臂 → 脱鞋用脚趾抠扳机开枪自断左臂"

  - scene_id: "SB-S11"
    label: "抵达即死 + 把幸存者幻觉成女友 + POV 反转 + 罗允取信传火（main climax）"
    chapter: "死亡奔赴"
    source_anchor: "line 467-505"
    word_count_approx: 2900
    characters: ["岳子安（感染）", "罗允", "洪扬", "周书韵（幻觉）"]
    pov: "岳子安幻觉视角 → line 475 外部接管到罗允 / 洪扬"
    conflict_type: "external + internal"
    beat_direction:
      function: "全篇 main climax + closing reversal —— 爱的最彻底异化 + POV 反转 + 传火式收束"
      craft_note: |
        6.1 仍用岳子安幻觉视角写'伪团圆'：周书韵走出树林微笑递蓝色小花 + '真的好久不见啊'（line 473）
        —— 让读者和岳子安一起被骗到最后一刻，莫千回标志性'骗读者'手法
        line 475 一句'突然窜出的感染者大笑着倒下，罗允长出一口气'—— POV 外部接管，瞬间击碎幻觉
        揭穿：岳子安是扑向幸存者洪扬的感染者，'递蓝花的女友'全是他感染后投射
        '把名字像花一样一片片切下来做成花吃掉'（line 479）—— 爱的最彻底异化（与《燃烧》周全 line 169 同源）
        罗允'非常爱一个人就所见皆像所爱之人'（line 481）—— 用一句温柔的话解释最恶心的画面
        罗允取胸前遗书塞笔记本（line 483）+ 怅然'一路艰辛只剩一封信的内容'（line 495）
        —— '记住 / 被遗忘'主题顶点；罗允'读者代理人'镜像变体（来晚没救到，只能读信带走经验）
        closing reversal：罗允从信里得到'绑轮胎护身 + 凡事做两手准备'经验（line 499-503）
        —— 死者的经验成生者的工具 = 传火式收束（relay ending），比《燃烧》'活下来=偿还'更冷
    description: "数月后衣衫褴褛断臂岳子安抵达约定城市 → 树丛走出'周书韵'微笑递蓝色小花'好久不见' → line 475 POV 反转：感染者大笑倒下，罗允长出一口气 → 揭穿岳子安扑向幸存者洪扬被击杀、女友全是幻觉 → 罗允取胸前遗书 + 怅然'一路艰辛只剩一封信' → 从信里得到绑轮胎护身 + 做两手准备经验 → 规划进城路线 + 合上笔记"

# === 节奏曲线 ===

pacing_curve:
  arc_1: "缓 → 急"  # 机场末日日常 → 哥哥发疯连锁爆发
  arc_2: "急 → 极急"  # 空少发病 → 全舱失控 → 特技护送 → 减压闷杀
  arc_3: "极急 → 急"  # 躲疯机长撞机 → 硬着陆撞厅 → 突围冲出围网
  arc_4: "急 → 静 → 缓"  # 蔡颖婷死 → 潦草缅怀（全篇唯一长喘息）→ 驾校临别
  arc_5: "急 → 慢性煎熬 → 急"  # 摩托队翻车 → 徒步迷路发烧（时间压缩的慢性煎熬）→ 被咬断臂
  arc_6: "静 → 急 → 余韵"  # 伪团圆 → POV 反转击碎 → 罗允取信传火
  notes: |
    递减式赴死结构 —— 交通工具 / 同伴逐级降级。Arc 4 中段有全篇唯一的长'静'
    （蔡颖婷潦草埋葬 + 驾校临别独白），承载双线共题，是高密度暴力中的情感锚点。
    Arc 5 的'慢性煎熬'用时间压缩（'连日发烧''数个日夜''几个月'）替代场景细写，
    把单调的徒步绝望转成节奏上的拖长。

# === 跨场景手艺主题 ===

cross_scene_craft_themes:
  prophecy_as_irony:
    description: "复读机小孩'今天可能是世界末日'反复出现（SB-S01 line 5/35/43）→ 哥哥发病亲口确认（SB-S02 line 63）→ 高空俯瞰确认（SB-S07 line 227）—— 最被嫌弃的声音说出全篇真相"
    scenes: ["SB-S01", "SB-S02", "SB-S07"]
    function: "把'末日预言'从背景噪音逐级推到台前，三次回扣形成反讽闭环 —— 莫千回标志性'让最被嫌弃的声音承担真相'"

  witnessing_apparatus:
    description: "手机 / 录像作为见证机制：隔舷窗放大拍按摩椅夹颅（看别人死 SB-S03）→ 临终复制粘贴'我爱你'狂发（留自己的话 SB-S08）→ 罗允笔记本记录死者信里的路线经验（替死者见证 SB-S11）"
    scenes: ["SB-S03", "SB-S08", "SB-S11"]
    function: "见证设备的功能弧线：从'围观他人死亡'→'诀别式自我留言'→'读者代理人替死者带走经验'，与《地铁》眼镜男录像 / 全系列'录像 / 直播作为见证机制'同源"

  silent_or_random_death:
    description: "黄志祥死（敞开厕所门 + 溅满鲜血缺席承担 SB-S08 line 305）/ 蔡颖婷死（流弹随机 + 潦草埋葬 SB-S09）/ 副机长死（硬着陆完成态 SB-S08 line 291）—— 关键死亡用缺席 / 随机 / 完成态承担"
    scenes: ["SB-S08", "SB-S09"]
    function: "省略 / 随机胜过直写戏剧化死亡 —— 'doing less is more'，与《地铁》刘敏 / 《燃烧》老刘 + 李先生同源"

  gray_survivor_lroong:
    description: "李荣'灰色生存者'方法论：减压闷杀全舱（SB-S07）/ 撞死路中央人影（SB-S09）/ 被抓不能进驾驶室（SB-S06）—— 但留枪给岳子安 + '希望我帮别人时也有人帮我孩子'（SB-S09）"
    scenes: ["SB-S06", "SB-S07", "SB-S09"]
    function: "与周全（《燃烧》）/ 杨和修（《地铁》）形成第三种灰色男主对位 —— 李荣是'冷酷算法 + 不说出口的善'型，区别于周全的自燃赎罪 / 杨和修的从好人变恶"

  love_as_anchor_and_lure:
    description: "'奔赴所爱之人'双线：岳子安（女友周书韵 SB-S01/S09/S10/S11）vs 李荣（妻儿 SB-S09）—— 既是活下去的精神支柱，也是把人拖向死亡的诱饵，最终岳子安的爱异化成'切下来吃掉'的占有幻觉"
    scenes: ["SB-S09", "SB-S10", "SB-S11"]
    function: "central_value_pair'希望 / 绝望'+'活着 / 死亡'的载体；爱的异化（SB-S11 把陌生人幻觉成女友）= 感染者保留所爱的扭曲版本，与《燃烧》周全 / 《学校》狗子同源"

  relay_reader_proxy:
    description: "传火意象链：岳子安读帐篷家庭遗书 + 留自己的信（SB-S10 line 455/459）→ 罗允取岳子安遗书 + 从信里得到进城经验（SB-S11 line 483/503）—— 一路艰辛只剩一封信的内容（line 495）"
    scenes: ["SB-S10", "SB-S11"]
    function: "罗允'读者代理人'跨篇定型的镜像变体 —— 与《学校》罗允拾日记本 / 《燃烧》罗允转达遗言同源，但本篇罗允'来晚没救到、只能读信带走经验'，把救赎边界从'转达'退到'见证 + 传火'"
