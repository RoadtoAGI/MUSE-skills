_meta:
  version: "1.0"
  chapter: "死亡奔赴"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    Arc 6 段 —— '交通工具逐级降级 + 同伴逐级流失'的递减式赴死结构。
    飞机（机组群）→ 皮卡（李荣 + 蔡颖婷）→ 教练车（独自）→ 双腿（孤身）→ 尸体（POV 脱离）。
    每 Arc 剥夺一级生存资源 + 送走一个同伴，Arc 6 由罗允 / 洪扬外部接管收束。

# === Arc 1: 机场末日日常 + 哥哥发疯 + 客流踩踏沦陷 ===

arc_1:
  label: "机场末日日常 + 文质彬彬哥哥发疯 + 客流踩踏沦陷 + 登机逃离"
  source_anchor: "line 5-89"
  sequences:
    - seq_id: "1.1"
      label: "大巴 + 机场末日日常 + 复读机小孩 + 前震被消解"
      source_anchor: "line 5-49"
      core_conflict: "'多事之秋'的烦躁 vs 被忽视的末日前震"
      progression: |
        大巴上小孩复读机式喊'今天可能是世界末日 / 有陨星'（line 5）→ 岳子安烦躁 + 和女友周书韵斗嘴
        机场：自助托运全关 + 肢解行李箱传闻（line 17）+ 113 号 VIP 之喜（line 21）
        安检口压人 + 特产店玻璃割脸（line 37-39）—— 全被岳子安当成'多事之秋 / 暴力事件频发'消解
        建立岳子安'路人甲 + 手机和女友实时聊天'的日常人设
      seq_climax: "所有前震被'最近暴力事件多'合理化 —— 与《地铁》眼镜男冷笑否定丧尸传闻同源的'理性否定'"

    - seq_id: "1.2"
      label: "文质彬彬哥哥发疯 + 抠父眼球咬安保 + 全机场连锁爆发"
      source_anchor: "line 57-71"
      core_conflict: "'家庭内斗'误读 vs 真实的病毒发作"
      progression: |
        哥哥抢弟弟手机砸脸 + 嘶吼'你他妈知道什么是世界末日吗'（line 59）→ 掐弟弟脖子（不像教训像杀）
        父母提议'把闹事的哥哥留下'（line 65）→ 哥哥彻底崩溃 + 抠出父亲眼球大笑（line 67）
        对讲机连锁呼援：K区 / 托运点 / 停车场（line 69）→ 哥哥咬下安保半张脸（line 71）
      seq_climax: |
        激励事件落点 —— '最不该发疯的人第一个发疯'+ 复读机预言一语成谶（哥哥喊'今天是世界末日'）
        莫千回标志性'让最被嫌弃的声音说出真相'

    - seq_id: "1.3"
      label: "登机逃离 + 隔舷窗放大拍按摩椅夹颅虐杀 + 虚假安全"
      source_anchor: "line 73-89"
      core_conflict: "'千万不要取消航班'求生 vs 舷窗外正在沦陷的机场"
      progression: |
        岳子安唯一念头'千万不要取消航班'（line 73）→ 除发疯一家外全员登机 → 舱门关闭
        空姐蔡颖婷'估计飞不了' vs 同伴'塔台排好次序、连锁延误不会取消'（line 75）
        岳子安隔舷窗手机放大见证：踩踏挤瘪安保 + 按摩椅夹颅虐杀（line 79-85）
        飞机升空隐没云层 → 岳子安自我安慰'离开机场一切应该安全了'（line 87）
      seq_climax: |
        手机录像见证机制确立（看别人死）+ 第一层'虚假安全'
        按摩椅夹颅 = '人体作为器物'意象（与《地铁》液压沙丁泥罐头同源）

  arc_progression_note: "1.1 日常被消解 → 1.2 激励事件爆发 → 1.3 逃离造成'虚假安全'，为 Arc 2 客舱内反转造落差"

# === Arc 2: 客舱内爆发 + 李荣特技护送 + 闷杀全舱 ===

arc_2:
  label: "客舱内空少感染发病 + 多名乘客 / 机组连锁感染 + 李荣特技护送三人进驾驶室 + 减压闷杀全舱"
  source_anchor: "line 89-249"
  sequences:
    - seq_id: "2.1"
      label: "驾驶室李荣副机长'恐怖分子'误判 + 空少潜伏发病"
      source_anchor: "line 91-117"
      core_conflict: "'境外恐怖袭击'理性误判 vs 病毒已在机内"
      progression: |
        李荣 + 副机长陈夏欣讨论：'恐怖分子？规模不小'（line 91-99）→ 误判为境外渗透
        后舱空少宋伯文被小孩抓破皮（机场感染）+ 创可贴 + 李云吐槽'娇生惯养'（line 107）
        空少突然发病：掐李云后颈 + 下流话 + 咬面门啃食（line 113）
        西装男误以为'接吻有伤风化'按呼唤铃投诉（line 113-115）—— 误读 + 黑色幽默
      seq_climax: "空少发病 —— '安全的飞机'内部第一个感染源引爆，把虚假安全打破"

    - seq_id: "2.2"
      label: "蔡颖婷发现李云被啃 + 岳子安第一次出手 + 空保黄志祥 / 乘警 / 空警登场"
      source_anchor: "line 117-151"
      core_conflict: "客舱秩序崩溃 vs 机组试图压制"
      progression: |
        蔡颖婷发现空少身下流血 + 李云被啃出白骨 → 颠簸跌倒被岳子安拉住（line 117-119）
        空保黄志祥认出空少（好友）+ 难以置信 + 警棍踹空少（line 125-127）
        岳子安掰小桌板砸倒空少（line 129）→ 客舱两端同时爆发笑声惨叫（line 131）
        自称乘警的男人 + 空警分头查前后舱（line 133）→ 副机长被李荣派出维护秩序（line 139-141）
        头等舱男人扭断亡妻脖子 + 要扒副机长皮 → 空警毯子罩头制服（line 143-151）
      seq_climax: |
        岳子安从'旁观见证者'变成'第一次动手的参与者'（砸空少）+ 多个执法者（空保 / 乘警 / 空警）登场
        李荣'今天是儿子成人礼生日'动机第一次埋点（line 141）

    - seq_id: "2.3"
      label: "空警被偷袭死 + 全舱解开安全带 + 客舱彻底失控"
      source_anchor: "line 151-185"
      core_conflict: "执法者的鲜活优势 vs 感染者痛觉缺失的反杀"
      progression: |
        空警泰瑟枪 / 辣椒水都压不住 → 被金属水杯砸后脑 + 撕腿肉偷袭致死（line 163-167）
        '上一秒还在保护的人下一秒下死手'—— 感染者会伪装求救诱杀
        全舱所有人解开安全带（不解就会被小桌板支撑管插眼 line 169）→ 彻底失控
        柔弱女生用平板砸烂男生脸（line 171）→ 女伴咬断空姐手指加入感染（line 157）
        岳子安确认'今天可能是世界末日'（line 159-161 想起小孩的话 + 陨石）
      seq_climax: |
        '被咬 / 被侵犯后还活着的人大笑加入失控者'（line 185）—— 同化机制确立
        '正常乘客被不断杀死或同化，他们死或变疯只是时间问题'= 深渊确认

    - seq_id: "2.4"
      label: "李荣特技飞行 + 小餐车防御战 + 护送三人进驾驶室 + 黄志祥被抓自愿牺牲"
      source_anchor: "line 185-217"
      core_conflict: "民航客机特技倾斜的机毁风险 vs 让感染者摔成一团的唯一活路"
      progression: |
        岳子安 + 黄志祥 + 蔡颖婷推小餐车堵窄过道防御 → 餐车变形快撑不住（line 187-195）
        李荣广播指挥：左右大幅倾斜 + 抬升 → 感染者反复摔成一团互相牵制（line 197-209）
        副机长担忧'民航客机失衡一点失误就机毁人亡' vs 李荣'不这么做疯子会乖乖坐着吗'（line 207）
        三人冲到驾驶室门前 → 李荣电话确认有无受伤被咬被抓（line 211）
        黄志祥坦白被抓 → 不能进 → 自愿用灭火器掩护后躲厕所（line 213-217）
      seq_climax: |
        李荣'试飞员特技'方法论展示（救人 + 有边界）+ 黄志祥自愿牺牲
        '被抓不能进'= phase1 transmission'体液 / 皮肤微伤'规则的硬执行

    - seq_id: "2.5"
      label: "高空俯瞰全球沦陷 + 副机长减压闷杀整客舱感染者"
      source_anchor: "line 219-249"
      core_conflict: "'去机场迫降'希望 vs 放弃整客舱人的伦理决断"
      progression: |
        李荣'好像得了狂犬病一类的东西，被咬被抓都会变疯'（line 219）—— in-universe 病名锚定
        飞向最近机场 / 城镇 → 全是火海血腥 → 高空看'城市脉络流动着鲜血'（line 223-225）
        '世界末日。今天真的是世界末日'（line 227）—— 全球同步沦陷确认
        李荣决定：在天上待着 + 放弃感染成疯子的人（line 231）
        副机长开外流活门减压 → 氧气面罩落下 → 疯子继续残杀直到青紫缺氧倒下（line 235-237）
        三人在驾驶室戴氧气面罩节约氧气'当超度'（line 233）
      seq_climax: |
        Arc 2 climax —— 减压闷杀全舱 = 本篇'集体超度'意象
        '同样是死亡，陌生人与熟人天差地别'伏笔（岳子安隔门看满客舱尸体的虚幻感 line 239）

  arc_progression_note: "2.1 机内首个感染 → 2.2 岳子安参战 + 执法者登场 → 2.3 执法者死 + 全舱失控 → 2.4 特技护送进驾驶室 → 2.5 闷杀全舱止血。'安全'从机场→客舱→驾驶室逐级内缩"

# === Arc 3: 迫降撞机厅 + 副机长惨死 + 防疫服斧头突围 ===

arc_3:
  label: "迫降途中躲疯机长撞机 + 起落架损坏硬着陆 + 撞候机厅 + 副机长惨死 + 防疫服斧头突围抢皮卡"
  source_anchor: "line 249-347"
  sequences:
    - seq_id: "3.1"
      label: "多个机场同步沦陷 + 寻找中小型机场 + 岳子安想去女友城市被拒"
      source_anchor: "line 241-255"
      core_conflict: "岳子安'我有人要找'诉求 vs 李荣'大机场客流大 = 必死局'理性"
      progression: |
        最近机场 / 相邻城市机场全沦陷（line 249）→ 李荣定中小型机场迫降（客流小 = 一丝生机）
        岳子安试探'能不能去我女友的城市' → 李荣坚定拒绝 + 自陈'我也有重要的人在很远的城市'（line 245）
        蔡颖婷担心老家外婆 → 三人各有牵挂的人确立
        中小型机场周围混乱稍轻 + 高速有车飞驰（line 251）
      seq_climax: "李荣'去找的前提是自己得活着'（line 245）—— 理性生存算法 vs 感性奔赴的第一次正面碰撞"

    - seq_id: "3.2"
      label: "左侧疯机长驾机自杀式撞击 + 李荣拉升擦顶躲过 + 对方撞山坠毁"
      source_anchor: "line 255-267"
      core_conflict: "感染机长的自杀式撞机 vs 李荣的速度时间计算"
      progression: |
        蔡颖婷发现左侧有飞机 → 副机长无线电听到求饶 / 惨叫 / '他要插爆我们这架飞机'（line 257）
        浑身鲜血疯机长站驾驶位 + 脚踩人头 + 抓操纵杆直冲（line 259-263）
        对方副机长全裸趴驾驶台 + 扶柄插着人头当旗杆（line 263）
        李荣不顾油耗专注计算 → 最后一刻擦左侧飞机顶部躲过 → 对方撞空翻转撞山坠毁（line 265）
      seq_climax: |
        '感染后还是不能精密操作'（line 267）—— 进化战术弱点确立
        感染者驾机自杀 = '游戏化嗜虐'在交通工具上的极端延伸

    - seq_id: "3.3"
      label: "起落架损坏硬着陆 + 撞候机厅 + 副机长被断柱砸成半截惨死"
      source_anchor: "line 267-297"
      core_conflict: "硬着陆求生 vs 起落架失灵的机毁风险"
      progression: |
        跑道有牵引车拖行半截尸体甩碎肉（line 269）→ 放起落架时警报（空中擦碰损坏 line 271）
        硬着陆剧烈颠簸 + 岳子安临终复制粘贴'我爱你'狂发（line 273-277）
        失去起落架缓冲 → 飞机撞向候机厅（line 279）→ 岳子安幻听周书韵'月儿'笑声 + 摸到红色液体（line 281-287）
        清醒后发现副机长只剩半截 + 断柱穿挡风玻璃（line 291）
        李荣看到'半个徒弟'副机长内脏铺操作台 → 失神（line 295-297）
      seq_climax: |
        '面对一客舱残碎尸体冷静、看到熟人副机长惨死却失神'（line 297）—— 灰色生存者的人性裂缝
        临终'我爱你'复制粘贴 = 见证设备从'看别人死'转向'留自己的话'

    - seq_id: "3.4"
      label: "防疫服 + 斧头 + 一击毙命战术传授 + 突围抢皮卡冲毁围网"
      source_anchor: "line 299-347"
      core_conflict: "三人 vs 机场跑道 / 候机厅成群感染者"
      progression: |
        驾驶室有防疫服 + 斧头 → 装备上向机库方向冲（那里有维修车 line 299-303）
        厕所敞开门 + 溅满鲜血 → 黄志祥凶多吉少（line 305）—— 缺席死亡
        李荣传授一击毙命：'打断腰砍断腿踹烂肚子只要没死疯狗就攻击 / 不要砍天灵盖会卡住'（line 317）
        岳子安红着眼砍杀（line 319-327）+ 蔡颖婷干粉灭火器掩护 → '血色迷雾中搏杀'
        李荣被施工马甲感染者掀翻 → 岳子安扔斧头砸翻追来的牵引车救场（line 331-337）
        抢到插钥匙的皮卡 → 撞毁通电围网冲出（line 341-347）
      seq_climax: |
        Arc 3 climax —— 第一次真正脱离危险（冲出围网）
        一击毙命战术 = phase1 death_trigger lore 落地；围网'防肉身防不住汽车'= 新物理规则

  arc_progression_note: "3.1 拒绝去女友城市 → 3.2 躲疯机长撞机 → 3.3 硬着陆 + 副机长死 → 3.4 突围抢皮卡。交通工具从飞机降级到皮卡"

# === Arc 4: 皮卡逃亡 + 蔡颖婷死 + 驾校分道 ===

arc_4:
  label: "皮卡逃亡 + 蔡颖婷中枪死 + 山林潦草埋葬 + 李荣岳子安在驾校分道扬镳"
  source_anchor: "line 349-413"
  sequences:
    - seq_id: "4.1"
      label: "短暂释放 + 驱鸟员猎枪流弹打死蔡颖婷 + 潦草埋葬"
      source_anchor: "line 349-361"
      core_conflict: "脱险后的情绪释放 vs 毫无铺垫的死亡"
      progression: |
        冲出围网 + 通讯群消息爆炸 + 女友一分钟前还在发消息 → 岳子安松口气（line 349-351）
        驱鸟员（感染者）持猎枪 → 第二枪打碎玻璃 → 李荣撞飞 + 倒车碾碎其头（line 353）
        李荣让岳子安下车拿猎枪 + 子弹 → 岳子安发现后排蔡颖婷胸口中弹早已停止起伏（line 357）
        山林潦草埋葬 + 防雨布裹尸 + 李荣嘱'活下来的要告诉蔡颖婷家人'（line 359-361）
      seq_climax: |
        蔡颖婷'毫无铺垫的死亡 + 潦草埋葬 + 很难称为葬礼的缅怀'（line 361）
        —— 莫千回 no-time-to-mourn + '随机死亡'，与《地铁》刘敏 / 《燃烧》李先生同源

    - seq_id: "4.2"
      label: "李荣茫然 + 狂犬病疯狗回忆 + 决定回家给儿子过成人礼 + 找车帮岳子安"
      source_anchor: "line 363-381"
      core_conflict: "回家护亲 vs 帮陌生人岳子安的两难"
      progression: |
        报警不通 + 无官媒 → 李荣推断'传染性极强 / 潜伏期超长的狂犬病变种'（line 363-365）
        回忆年轻时围观处决三只狂犬病疯狗 —— 断肢瘫地仍狂吠撕咬的'疯狂'（line 365-367）
        李荣联系到妻子但儿子（学校上课）联系不上 → 决定回家（line 369）
        李荣纠结：不能放着家人去帮陌生人，但看着和儿子年纪相仿的孩子陷绝境……（line 373）
        岳子安出主意：去人少车多的驾校找车（line 379）
      seq_climax: |
        狂犬病疯狗回忆 = in-universe 病原解释锚定 shared_canon
        李荣'希望我帮别人时也有人帮我的孩子'（line 373）—— 灰色生存者的隐性善意

    - seq_id: "4.3"
      label: "驾校接电线发动教练车 + 双线共题独白 + 分车上路 + 留枪给岳子安"
      source_anchor: "line 381-413"
      core_conflict: "两个为所爱之人赴死的人的临别"
      progression: |
        高速上李荣长按喇叭直接撞死路中央人影 + '还在遵守秩序的就是自取灭亡'（line 385）
        驾校砸玻璃 + 掰面板拽电线打火发动老教练车（line 387-391）
        李荣'人不会像蝇虫一样只为吃食繁衍活着 —— 家人是精神支柱'（line 397）
        岳子安独白：路人甲 + 周书韵在追求者里选了平平无奇的他 + 让他觉得自己'特别'（line 401-403）
        岳子安选教练车 + 烫了头来见女友（line 405）→ 李荣规划路线 + 问驾照
        分别：李荣悄悄把猎枪 + 子弹留教练车 → '我开好车，你拿好枪，很公平吧'（line 411）
      seq_climax: |
        Arc 4 climax —— 双线共题'为所爱之人赴死'的临别 + 李荣隐性温柔
        '此一别可能是永别 + 互相是彼此最后见到的普通人类'（line 393）

  arc_progression_note: "4.1 蔡颖婷死 → 4.2 李荣回家动机 + 病原锚定 → 4.3 分车上路。同伴全部离场，交通工具降级到教练车，岳子安开始孤身"

# === Arc 5: 独自赴死之路 + 被咬断臂 ===

arc_5:
  label: "独自驾教练车 → 改装摩托队袭击翻车 → 失手机失方向 → 徒步数月 → 被咬 → 开枪断臂"
  source_anchor: "line 413-465"
  sequences:
    - seq_id: "5.1"
      label: "独自驾车的地狱路 + 改装摩托疯子队对撞翻车 + 卡车逼撞侧翻"
      source_anchor: "line 413-433"
      core_conflict: "孤身驾车求生 vs 公路上的多重感染者威胁"
      progression: |
        没了李荣驾驶 → 逆行车 / 撞毁车 / 疯子拖女人扔车前（line 415）→ 不敢停车
        路过举手求救的男人也没停（line 415）—— 岳子安开始内化李荣的'秩序已崩'法则
        改装摩托队：人头插拖把棍 + 眼眶塞炫光灯 + 人腿绑车尾 + 人皮贴车头灯（line 419）
        黄毛疯子骑摩托对撞 + 摔进车内 + 断腿卡保险杠仍抓岳子安（line 421-423）
        岳子安开车门甩飞抓门疯子 + 拿猎枪轰掉右侧感染者半个脑袋（line 425-431）
        亮大灯卡车逼撞 → 岳子安猛打方向盘侧翻翻滚昏迷（line 433）
      seq_climax: |
        改装摩托队 = '人体作为器物'意象顶点（与《学校》拖把棍头颅同源）
        猎枪第一次开火（李荣遗产兑现）

    - seq_id: "5.2"
      label: "翻车醒来失手机失方向 + 徒步迷路 / 发烧 / 吃野狗 / 灼烧消毒"
      source_anchor: "line 435-453"
      core_conflict: "失去导航的彻底迷失 vs 凭直觉前行的求生本能"
      progression: |
        昏迷醒来爬出报废车 + 找到猎枪 → 但用来导航的手机丢失遍寻不见（line 435-439）
        '没了手机指引根本不知道这片山区在哪'（line 439）—— 生存资源彻底剥夺
        徒步：收费站被追杀跳池塘 + 发烧 + 双腿无力躲树林（line 445）
        野狗咬腿惊醒 → 想起李荣说的狂犬病 → 开枪射杀野狗 + 喝狗血 + 半生不熟吃狗肉（line 447-449）
        担心感染 → 打火机反复灼烧伤口消毒止血（line 451）
      seq_climax: |
        手机丢失 = 导航工具剥夺（与 phase1 material_rules'手机指南针仍可用'的反向：本篇失去它）
        '靠直觉前行'+ 灼烧消毒 = 普通大学生的极限求生

    - seq_id: "5.3"
      label: "帐篷三尸遗书全家福 + 岳子安留信 + 雨夜被咬 + 开枪自断左臂"
      source_anchor: "line 455-465"
      core_conflict: "'不想感染了去伤害周书韵'的断臂决断 vs 病毒扩散"
      progression: |
        路过帐篷：三具吊尸 + 一封遗书（家庭逃脱→崩溃）+ 全家福（line 455）
        岳子安在帐篷过夜 → 清晨用铅笔写下一封信（line 459）—— 传火意象（读别人的信 + 留自己的信）
        雨夜被几个感染者抵抗时咬伤左臂（line 461）
        '感染了就算找到周书韵也会去伤害她 + 不想感染也不想见女友前死掉'（line 463）
        给猎枪上两发子弹 → 脱鞋用脚趾抠扳机 + 咬树棍 + 闭眼开枪打断左臂阻止病毒（line 465）
      seq_climax: |
        Arc 5 climax —— 断臂自救 = internal 对抗力量顶点
        '不愿以感染者状态伤害所爱之人'与《燃烧》周全自燃同源动机；成败留白（line 465 戛然而止）

  arc_progression_note: "5.1 摩托队翻车 → 5.2 失手机徒步 → 5.3 被咬断臂。交通工具降到双腿，最后连'人的身份'都在被咬后岌岌可危"

# === Arc 6: 抵达即死 + 罗允 / 洪扬接管 + 取信传火 ===

arc_6:
  label: "数月后抵达目的地城市 → 感染状态把幸存者幻觉成女友 → 罗允 + 洪扬击杀 → 取信转达 + 怅然"
  source_anchor: "line 467-505"
  sequences:
    - seq_id: "6.1"
      label: "数月后衣衫褴褛抵达约定城市 + '熟悉身影'走出树林（岳子安幻觉视角）"
      source_anchor: "line 467-473"
      core_conflict: "'我终于到了'的圆梦 vs 读者尚不知的真相"
      progression: |
        斗转星移几个月 → 衣衫褴褛断左臂青年走出山林 → 看到目的地城市建筑群（line 467-469）
        '开车五六小时的路他走了几个月 + 无数次奔逃 / 搏杀 / 迷失还是来了'（line 469）
        树丛异响 → '熟悉身影'走出 → 岳子安认定是周书韵 → 嘶吼名字一瘸一拐跑过去（line 471-473）
        '周书韵'微笑递一朵蓝色小花 + '真的好久不见啊'（line 473）—— 仍是岳子安的幻觉视角
      seq_climax: |
        伪团圆 —— 读者被骗到和岳子安一样相信'他见到女友了'
        蓝色小花 = 末日里幸存者随手的善意被幻觉成爱的信物

    - seq_id: "6.2"
      label: "POV 反转：感染者大笑倒下 + 罗允洪扬击杀 + '把名字像花一样切下来吃掉'"
      source_anchor: "line 475-481"
      core_conflict: "读者一路的代入希望 vs 一句话的彻底击碎"
      progression: |
        '突然窜出的感染者大笑着倒下，罗允长出一口气'（line 475）—— POV 外部接管，揭穿幻觉
        岳子安其实是扑向幸存者洪扬的感染者，被击杀；'周书韵递蓝花'全是他感染后的投射
        罗允发现感染者手里有猎枪（还剩一发子弹 line 477）
        洪扬'他好像把自己当成了其他人'+ 罗允'听到他喊一个女生名字、说要把名字像花一样
        一片片切下来做成花吃掉，真的恶心'（line 479）
        罗允'假如非常爱一个人，所见每个人都像所爱之人'（line 481）
      seq_climax: |
        全篇 main climax —— 爱的最彻底异化 + 莫千回标志性'骗读者到最后一刻'反转
        感染后岳子安'保留所爱的扭曲版本'（与《燃烧》周全 line 169 / 《学校》狗子同源）

    - seq_id: "6.3"
      label: "罗允取胸前遗书 + 怅然'一路艰辛只剩一封信' + 洪扬冷漠'正常末日嘛'"
      source_anchor: "line 481-497"
      core_conflict: "罗允的见证 / 共情 vs 洪扬的现实主义冷漠"
      progression: |
        罗允翻找装备 → 胸前塑料袋挂的不是子弹是发黄卷边遗书 → 扫一眼塞进笔记本（line 483）
        洪扬从尸体找到猎枪子弹 + 拍罗允肩'回营地'（line 485）
        罗允问'有没有觉得感染者挺可怜' → 洪扬'疯子和普通人都可怜但讨论没意义，
        现在不是你死就是我亡'（line 487）
        罗允复述信的内容 → 洪扬冷漠'正常末日嘛'（line 489）
        罗允怅然：'假如他们俩也失败了，会不会也只是别人的谈资？甚至永远没人知道'（line 493）
        洪扬'未经历的苦难永远不会被体会，到他们这里就只剩一封信的内容'（line 495）
      seq_climax: |
        '一路艰辛只剩一封信的内容'（line 495）—— 全系列'记住 / 被遗忘'主题顶点
        罗允'读者代理人'原则的镜像变体：来晚了没救到，只能读死者的信 + 怅然

    - seq_id: "6.4"
      label: "从信里得到经验绑轮胎护身 + 规划进城路线 + 合上笔记（closing reversal）"
      source_anchor: "line 497-505"
      core_conflict: "死者的经验 vs 生者的生存"
      progression: |
        洪扬提那几个绑轮胎护身的感染者（晚期才感染、有自我保护意识 line 497）
        罗允'即使路边死去的尸体也有自己的故事，留下的少，更多随死亡消失'（line 497）
        罗允提议进城前找轮胎绑关键部位护身（line 499）—— 从信里得到的经验
        四日后：洪扬山地车速降梗 + 找到摩托（line 501）
        罗允拿出画在笔记本的路线图 + 指南针 + '凡事做两手准备 —— 从那封信得到的经验'（line 503）
        罗允戴头盔合上笔记（line 505）
      seq_climax: |
        Arc 6 / 全篇 closing reversal —— 传火式收束（relay ending）
        死者岳子安的经验（绑轮胎 / 做两手准备）成了生者罗允的工具
        罗允'摩托车 + 头盔 + 笔记本记录'物质特征 = 跨篇'读者代理人'定型

  arc_progression_note: "6.1 伪团圆 → 6.2 POV 反转击碎 → 6.3 取信怅然 → 6.4 经验传火。POV 彻底脱离岳子安，由罗允 / 洪扬外部见证收束"

# === 序列间冲击力递增 ===

escalation_check:
  arc_1_to_2: "机场沦陷但'我已逃离'虚假安全 → 病毒已在飞机内（虚假安全被内部击穿）"
  arc_2_to_3: "驾驶室困守 + 闷杀全舱 → 迫降撞候机厅 + 副机长惨死（安全空间本身被摧毁）"
  arc_3_to_4: "冲出围网脱险 → 蔡颖婷随机中枪死 + 同伴流失（脱险即丧友）"
  arc_4_to_5: "李荣护送 + 留枪的相对安全 → 孤身一人 + 失手机失方向 + 被咬感染（资源 / 同伴 / 人身份三重剥夺）"
  arc_5_to_6: "断臂自救（成败未知）→ 抵达即死 + POV 反转揭穿一切是幻觉（连'抵达'本身都是悲剧反讽）"
  curve_shape: "Arc 1 缓→急 / Arc 2 急→极急 / Arc 3 极急→急 / Arc 4 急→静（缅怀）→缓（临别）/ Arc 5 急→慢性煎熬→急 / Arc 6 静（伪团圆）→急（反转）→余韵"
  curve_note: |
    递减式赴死结构 —— 不是《燃烧》的'每 Arc 死一人'密集受难，而是'交通工具 + 同伴逐级降级'：
    飞机（机组群）→ 皮卡（李荣 + 蔡颖婷）→ 教练车（独自）→ 双腿（孤身）→ 尸体（POV 脱离）。
    Arc 4 中段有一个独特的'静'（蔡颖婷潦草埋葬 + 驾校临别独白）—— 全篇唯一长喘息，承载双线共题。

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第三人称限知，全程贴住岳子安（line 5-473）—— 含大量手机 / 录像 / 幻觉的'限知感知'"
    pov_handoff: |
      line 475 POV 外部接管到罗允 / 洪扬（line 475-505）——
      与《地铁》POV 转交陆小虎、《学校》罗允拾日记本同源的'读者代理人'收束。
      关键手法：在 6.1 仍用岳子安幻觉视角写'伪团圆'，6.2 才用外部 POV 揭穿 ——
      让读者和岳子安一起被骗到最后一刻。
    interleaved_pov:
      - "驾驶室李荣 / 副机长视角短暂插入（line 91-105, 175-177, 207, 229-235）—— 提供'上帝视角无能'的另一层"
      - "客舱空少 / 李云 / 蔡颖婷视角短暂插入（line 75-77, 107-127）—— 群像并行"

  parallel_external_threads:
    - "全球同步沦陷线：多机场 / 城镇 / 高速同步爆发（line 69, 223, 249, 363）—— 高空俯瞰 + 地图导航承担"
    - "周书韵线（始终缺席在场）：通过岳子安手机聊天贯穿（line 9, 55, 187, 273, 351, 377）—— 她'拉窗帘堵门躲在高楼民宿'勉强安全（line 377）但本篇不给她最终下场"
    - "李荣家人线：妻子急疯想出门找儿子 / 儿子学校联系不上 / 今天是儿子成人礼（line 141, 369, 377, 407）—— 与岳子安女友线对位"
    - "罗允 / 洪扬线（最后浮现）：两个拾荒幸存者的进城计划（line 475-505）—— 把岳子安的旅程接收为'一封信 + 一份经验'"

