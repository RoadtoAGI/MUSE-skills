_meta:
  version: "1.0"
  chapter: "恶"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    6 Arc 结构 —— 廖振宇'被记住'价值的贬值曲线。
    吴先生（假罗允）暗线 Arc 3 入场后全程蛰伏，Arc 6 才主导高潮（多线节拍：暗线长期蛰伏、特定节点浮现）。

# === Arc 1: 李春桂猎杀 + 廖振宇 MO 建立 ===

arc_1:
  label: "李春桂猎杀 + 廖振宇'录像留名'MO 建立"
  source_anchor: "line 5-35"
  sequences:
    - seq_id: "1.1"
      label: "山林伏击李春桂 + 杀人狂三人组分工"
      source_anchor: "line 5-19"
      core_conflict: "去找被拘留儿子的普通父亲 vs 蓄谋已久的猎杀者"
      progression: |
        李春桂夜里骑电摩去看望被拘留的儿子 → 车胎被预埋的玻璃钉子扎爆（line 6 伏击布局）
        青年（廖振宇）'需要帮忙吗'诱近 → 态度突变掏羊角锤追 → 李春桂扔钱包求饶无效（line 13-15）
        石头砸面门倒地 → 第三人（少年张彤）持摄像机拍摄（line 19）
      seq_climax: "李春桂被拖入树林轮番砸碎 —— 廖振宇/刘建邦/张彤的杀人狂三人组分工首次完整呈现（line 19-21）"

    - seq_id: "1.2"
      label: "对镜头炫耀'第十个猎物'+ 自报大名结束拍摄"
      source_anchor: "line 21-29"
      core_conflict: "杀人本身 vs 杀人作为表演"
      progression: |
        廖振宇抠眼眶 / 树枝插眼通鼻（line 23）+ 刘建邦反折手肘验证'断臂手指还能动'（line 25）
        泥土塞喉 / 刀划肚皮（line 27）—— 游戏化嗜虐
        对镜头宣布'第十个猎物'+ 后续还要继续猎杀 + 喊'廖振宇'大名结束拍摄（line 27）
      seq_climax: "'今天的视频就到这里'+ 自报大名（line 27）—— 表演型恶的核心仪式：杀人=内容生产，名声=目的"

    - seq_id: "1.3"
      label: "车旁'雁过留声人过留名'独白 + 留名哲学建置"
      source_anchor: "line 31-35"
      core_conflict: "被抓的风险 vs 留名的诱惑"
      progression: |
        张彤担心杀的不是流浪汉会被查（line 31）→ 廖振宇满不在乎：张彤未成年/刘建邦有精神病+律师爹
        廖振宇核心独白：要像开膛手杰克成为'全球每一代人的噩梦'，被写进小说/游戏/电影（line 31）
        幻想监狱粉丝来信 + 女粉丝结婚 + 囚犯争相合影（line 33）—— 全部来自'国外纪录片'
        回城进网吧 / 廖振宇浏览全球杀人犯'光辉事迹'（line 35）
      seq_climax: "'为了更伟大的名声，现在还不能被抓'（line 33）—— 把全篇核心欲望（被记住）钉死，作为后续贬值的起点顶点"
  arc_progression_note: "1.1→1.2→1.3 三序列把'杀人MO→表演仪式→留名哲学'层层揭示，建置一个'被记住价值=最高'的反派主角，为 Arc 2 的价值暴跌准备最高落点"

# === Arc 2: 网吧爆发 + '特别'作废 ===

arc_2:
  label: "网吧狂病爆发 + 廖振宇'特别'被宣判作废"
  source_anchor: "line 37-91"
  sequences:
    - seq_id: "2.1"
      label: "网吧口角升级 + 报警无警力 + '杀人了'触发"
      source_anchor: "line 37-47"
      core_conflict: "局部斗殴 vs 即将全面爆发的病征"
      progression: |
        前排顾客对骂 → 水瓶砸人 → 屏幕/键盘互殴（line 37）→ 网管报警但警力不足（line 39-41）
        刘建邦冷不丁问'是不是也有人在杀人呀'（line 43）→ 廖振宇警告别乱说 + 自夸'放眼全世界像他们这种人能有几个'（line 43）
        撕心裂肺尖叫'杀人了' → 廖振宇'精神一振'（line 45）以为遇同类
      seq_climax: "'杀人了'让廖振宇精神一振（line 45）—— 激励事件的引信：他先狂喜（以为有同类），下一刻被颠覆"

    - seq_id: "2.2"
      label: "网吧无差别互杀/自残/吃人 + 廖振宇皱眉"
      source_anchor: "line 47-65"
      core_conflict: "杀人狂的'专业骄傲' vs 病毒型恶的无差别失控"
      progression: |
        网管被咬断脖子喷血（line 47）→ 自扇耳光不收力 / 偏执停不下来（line 49-51）
        '每个人做出动作就会偏执继续下去……越跑越快越控制不住'（line 51 作者议论）
        互咬下体 / 旋头啃食 / 剪刀插眼 / 热水烫脸云雨 / 充电插头刺上颚（line 59-65）
        '就连虐杀动物无数、早上刚杀过人的廖振宇，看到也皱起眉头'（line 51）
      seq_climax: "刘建邦窗外'太阳掉下来了'（line 57 流星暗示病原/全球同步）+ 全网吧沦陷 —— 病毒型恶碾压式登场，廖振宇第一次被'同类的廉价'震惊"

    - seq_id: "2.3"
      label: "逃出网吧 + 张彤消失 + 公路用人当替死鬼"
      source_anchor: "line 67-91"
      core_conflict: "逃命 vs 利用他人逃命"
      progression: |
        跑回座位发现张彤带包和手机消失（line 67）→ 廖振宇推翻沙发扬言杀张彤
        逃亡中扯老人/把劝逃的小哥推入感染者群当替死鬼（line 77）→ '失去人性更易生存'（line 79 作者议论）
        面包车冲人行道'打地鼠般'碾人 + 刘建邦欢呼 + 廖振宇催拍 DV（line 87-89）
        出城后廖振宇癫狂砸方向盘吼'他们之前的一切都白做了，他们现在还有什么特别的？'（line 83）
      seq_climax: "'他们还有什么特别的？'（line 83）—— Arc 2 价值落点：'特别'被通货膨胀作废，全篇贬值曲线的第一次暴跌"
  arc_progression_note: "2.1（引信狂喜）→2.2（被同类廉价震惊）→2.3（特别作废+张彤裂缝）—— 网吧爆发把廖振宇从'独一无二'打到'人人皆恶'，张彤消失同时为 DV 危机埋第一道线"

# === Arc 3: 并入蔡宇队 + 起意杀警 + 吴先生入场 ===

arc_3:
  label: "并入蔡宇幸存者队 + 廖振宇起意杀警 + 吴先生（假罗允）入队"
  source_anchor: "line 93-195"
  sequences:
    - seq_id: "3.1"
      label: "公路所见城市级崩坏 + 飞机俯冲炸群"
      source_anchor: "line 93-103"
      core_conflict: "逃离的希望 vs 全域沦陷的事实"
      progression: |
        出城畅通但反向有车驶入城市（line 93）→ 警车被推翻 / 特警通勤车焚烧 + 特警欢呼（line 95）
        刘建邦'看到张彤了'（line 99-101）→ 廖振宇被'背叛'怒火驱使调头去那辆警车
      seq_climax: "调头追张彤所在的警车（line 103）—— 把廖振宇引向蔡宇小队的钩子，'背叛感'是他的情感驱动"

    - seq_id: "3.2"
      label: "认识蔡宇/张潇潇 + 廖振宇起意'一个人杀警出名'"
      source_anchor: "line 105-123"
      core_conflict: "搭车求生 vs 把救命恩人当出名素材"
      progression: |
        张彤解释是追偷手机的中年男人（张潇潇）才离队（line 107-109）→ 辅警蔡宇作证（line 109-111）
        蔡宇请求搭车去总局求援 + '我有枪可以掩护大家'（line 113/117）
        张潇潇自来熟攀附（line 115）+ 阴阳怪气逼大家听蔡宇的（line 121）
        廖振宇'邪恶到极致的想法'：一个人杀掉真警官会不会脱颖而出（line 119）→ 决定先按蔡宇计划走伺机动手
      seq_climax: "'一个人杀掉警察，那可真的不一样'（line 119）—— 廖振宇把'出名'策略从数量切到'稀缺事件'，表演型恶的自欺升级"

    - seq_id: "3.3"
      label: "前往下个城市的希望破灭 + 飞机坠毁连锁爆炸"
      source_anchor: "line 125-139"
      core_conflict: "去总局/避难所的希望 vs 城市外围已成炼狱"
      progression: |
        没进城远观：两三千万人口出城人潮 + 身后感染者潮（line 127-129）
        民航客机俯冲城外密集人群 + 连锁爆炸 + 街道瞬间血流成河（line 131-133）
        进总局计划彻底泡影（line 135）→ 廖振宇'荣誉/光辉未来/知名度仿佛被抢走'（line 137）
      seq_climax: "飞机坠毁炸群 + 总局计划破灭（line 133-135）—— 外部希望符号第一次崩塌，廖振宇'被记住'再受打击"

    - seq_id: "3.4"
      label: "数周逃亡 + 廖振宇'逆大环境出名'策略成形 + 队伍稳定在10人"
      source_anchor: "line 141-157"
      core_conflict: "杀人快感（刘建邦）vs 出名策略（廖振宇）"
      progression: |
        感染者进化为猎群（line 145 残骸拥堵路面截杀 / line 145 抓人压爆脑袋+侵犯）
        队伍稳定10人，蔡宇+枪是'安全感'核心，最初5人零减员（line 147）
        廖振宇对刘建邦阐明：现在杀人和丧尸没区别，'要出名就得逆着大环境走'（line 151）
        幻想统领幸存者社区→上报纸/拍电影/写进教材→晚年揭露杀人狂身份'集两面于一身永世流传'（line 153）
        刘建邦觉得这种生活没意思、怀念杀人（line 155）→ 张潇潇猥琐对女队员（line 157）
      seq_climax: "'要想出名被人记住，就得逆着大环境走'（line 151）—— 廖振宇的自欺式价值重建（假装救人当领袖），为 Arc 5 杀蔡宇埋动机"

    - seq_id: "3.5"
      label: "罗允（吴先生）带孩子入队 + 避难所消息 + 投票决定前往"
      source_anchor: "line 159-195"
      core_conflict: "继续盲目逃亡 vs 冒险奔向不确定的避难所"
      progression: |
        '罗允'带孩子林东青出现 + 提醒前方有感染者群（line 159-163）→ 检查伤势只是劳累（line 163）
        感染者群'练靶手'魁梧者飞甩螺丝刀扳手 + 群体瓜分（line 169 蔡宇所见，瞒着队员 line 171）
        盘问罗允：原队伍北上避难所被击溃，他带孩子林东青逃出（line 173）；避难所=易达广场地下人防工程，但感染者目标也可能在那（line 175）
        投票：刘建邦/陆德夫/张彤/陈秀秀/张潇潇/廖振宇/给巧克力女生 = 7票去；蔡宇/李芳/老魏/罗允未举手 → 7比4去避难所（line 181-185）
        张潇潇蛊惑廖振宇'你也是个头，别老当跟班'（line 183）→ 廖振宇因'所有人更信任警察'而举手
        罗允/吴先生末位附和张潇潇抱怨蔡宇（line 193 '微微点头'）—— 织善之网开始
      seq_climax: |
        '罗允'入队 + 投票去避难所（line 185）—— 吴先生暗线正式入场。
        关键：廖振宇举手是因为'所有人更信任崇拜那个警察'（line 183），蔡宇成为他威望的障碍 = Arc 5 杀蔡宇的直接动机。
        '罗允'的'微微点头'附和张潇潇（line 193）= 纯粹型恶第一次用'伪装成善/随大流'织网。
  arc_progression_note: |
    3.1（被钩入队）→3.2（起意杀警）→3.3（外部希望破灭）→3.4（自欺式重建出名策略）→3.5（吴先生入场+杀蔡宇动机锁定）。
    本 Arc 把三条人类线（廖振宇/张潇潇/吴先生）全部铺到同一支队伍里，是全篇结构枢纽。

# === Arc 4: 逃亡 + 老魏被弃 + 张彤被清除 + 罗允的笑 ===

arc_4:
  label: "争分夺秒逃亡 + 老魏被表决抛弃 + 张彤被吴先生'消失' + 罗允末位的笑"
  source_anchor: "line 195-261"
  sequences:
    - seq_id: "4.1"
      label: "陆德夫水上乐园丧妻回忆（受害者 POV 离场一）"
      source_anchor: "line 197-209"
      core_conflict: "想救妻子 vs 逃亡人潮中无人施援"
      progression: |
        暴雨山路泥泞（line 199）→ 陆德夫回忆灾难当天与妻子在水上乐园（line 201-203）
        妻子被水流冲远 + 人潮阻挡无法施救 + '每个人眼里都只有他们自己'（line 205）
        妻子被疯子抓住溺死（line 205，其实是陆德夫的幻想 line 207）
        罗允（吴先生）走过来拉陆德夫和后面几个队员上陡坡（line 207）→ 张潇潇借机阴阳蔡宇'跑前面不顾他人'（line 209）
      seq_climax: |
        '能陪伴一个人直到死亡的，依然也只有他自己'（line 209）—— 陆德夫信念定型，candidate_b/c 证据。
        罗允'帮后面队员'（line 207）是吴先生织善之网的第二针，反讽地与他最终诱杀全队对照。

    - seq_id: "4.2"
      label: "暴雨夜行 + 罗允盯枪 + 易达广场避难所方位确认"
      source_anchor: "line 211-235"
      core_conflict: "蔡宇的极限消耗 vs 队伍内部暗流"
      progression: |
        蔡宇压缩休息到每天3小时（line 211/231）→ 廖振宇借望远镜看不到感染者
        夜里警戒：罗允盯着蔡宇怀里的枪（line 219）→ 告知避难所在易达广场地下、到那城市就成功80%（line 221）
        刘建邦点出新人罗允'来几天就成三当家'/蔡宇是'大当家'（line 225-227）→ 廖振宇沉默（line 227）
        廖振宇盘算：到避难所后警察身份没用了，人们只会记住活下来的人（line 229）
        '可蔡宇不知道的是，队伍里几双眼睛也在默默盯着他'（line 235）
      seq_climax: "'几双眼睛盯着蔡宇'（line 235）—— 杀蔡宇阴谋成形的明示，三条人类线（廖/张/吴）在'盯枪'上汇流"

    - seq_id: "4.3"
      label: "老魏被表决抛弃 + 走马灯被分尸（受害者 POV 离场二）"
      source_anchor: "line 237-257"
      core_conflict: "带上拖累者 vs 牺牲拖累者求生"
      progression: |
        老魏低烧旧伤复发拖慢队伍（line 231/249）→ 蔡宇'想带上老魏的人举手'无人/'想抛下的举手'也无人（line 251）
        蔡宇担下坏人角色，留食物和刀，带队前进（line 251）
        老魏走马灯：海边/啤酒王/爬山坠落（line 239-243）→ 顿悟'怕的不是死，是死前没尽兴体验世界'（line 247）
        感染者分尸老魏：壮硕者扯断小兄弟 + 吸眼球（line 253-255）→ '不是每一个人都值得被拯救'（line 255）
      seq_climax: |
        老魏走马灯收尾'蔡宇根本不明白，这个世界上不是每一个人都值得被拯救'（line 255）——
        受害者视角直接反驳蔡宇的'拯救每一个人'（line 189 李芳语），是 candidate_b 的核心证据田。
        '商讨的唯一价值，就是选一个倒霉蛋当抛弃队友的坏人'（line 251）—— 对'集体决策道德'的冷峻拆解。

    - seq_id: "4.4"
      label: "张彤被林东青麻醉清除（吴先生暗线第一次出手）"
      source_anchor: "line 259-289"
      core_conflict: "廖振宇追查 DV 下落 vs 吴先生暗中清场"
      progression: |
        罗允走队尾'压抑不住脸上的笑容——他感觉到这支队伍就快完蛋了'（line 259）—— 暗线唯一露脸
        感染者距离反而变大（老魏拖慢追兵 line 261）→ DV 丢失危机：录像机不见了（line 263-265）
        张彤回忆撞见小林（林东青）偷翻背包，怀疑 DV 被小林拿走（line 267）
        廖振宇派张彤找小林、自己旁敲罗允'没看过 DV'（line 269）→ 张潇潇又来蛊惑（line 271）
        张彤带小林到营地外想威胁逼问 → 小林掏针管扎张彤腿麻醉（line 287）→ 张彤成'被迫抛弃的第二人'（line 281）
        张彤醒来被反绑堵嘴 + 意识到这对父子有问题 + 想警告廖振宇（line 285-287）→ 灌木被扒开是癫狂笑脸（line 289 被感染者发现）
      seq_climax: |
        张彤被林东青麻醉（line 287）—— 吴先生暗线第一次实质出手，用孩子当工具清除知情者。
        '一个听话的小弟就这样不明不白地没了'（line 283）—— 廖振宇情感的第一道真实裂痕。
        关键反讽：张彤识破了真相（'那对父子一定有问题' line 287）却来不及传达，是全篇最接近揭穿吴先生的瞬间。
  arc_progression_note: |
    4.1/4.3 两段受害者 POV 离场（陆德夫/老魏）从受害端钉'每个人眼里只有自己'；
    4.2 杀蔡宇阴谋成形；4.4 吴先生暗线清除知情者张彤。
    本 Arc 是'队伍崩坏'的加速段：好人被弃、知情者被清、暗线收紧。

# === Arc 5: 暗杀蔡宇 + 发现枪空 ===

arc_5:
  label: "张潇潇蛊惑 + 全队默契暗杀蔡宇 + 发现枪里没有子弹"
  source_anchor: "line 263-325"
  sequences:
    - seq_id: "5.1"
      label: "张潇潇蛊惑廖振宇杀蔡宇 + 罗允佯装无辜"
      source_anchor: "line 271-279"
      core_conflict: "蔡宇'好领袖'表象 vs 张潇潇构造的'蔡宇想奴役大家'叙事"
      progression: |
        张潇潇拉廖振宇密谋：蔡宇根本不想去避难所 + 怀疑罗允 + 想奴役大家/收枪/祸祸女队员（line 273）
        计划：快到避难所时抢蔡宇的枪赶出队伍（line 275）→ '蔡宇就是当代活某凡，留哪都是祸患'（line 275）
        '你看蔡宇把老魏直接抛弃了，到时候你有点啥事他也能把你扔了'（line 275）
        廖振宇起初怀疑张潇潇故意，后发现他'居然是认真的'、阴阳嘲讽全发自内心（line 277）
        罗允佯装'不清楚这里面的事，只想把大家带到避难所'（line 279）
      seq_climax: |
        张潇潇蛊惑（line 271-277）= candidate_c '他者言语比刀危险'的实证：
        廖振宇本已因'人们更信任蔡宇'而动摇，被'蔡宇想奴役你们'推过临界点。
        罗允佯装无辜（line 279）同时把自己从嫌疑里摘出——吴先生的精算。

    - seq_id: "5.2"
      label: "靠近避难所城市 + 蔡宇谨慎不进城 + 廖振宇定意杀蔡宇"
      source_anchor: "line 291-301"
      core_conflict: "蔡宇'越近越小心' vs 队伍'赌徒式'急于进城"
      progression: |
        靠近罗允所说城市，蔡宇不急进城、要先观察服务站（line 291）→ 引来不满
        张潇潇坐实'蔡宇不想进避难所'；陆德夫怕成下一个被弃者、坚信只有避难所是希望（line 291）
        '当局者迷……最后一搏的赌徒'（line 293 作者议论）
        望远镜看到张彤在感染者群中（line 295-297）→ 蔡宇仍不进城（line 297）
        廖振宇冷哼'大当家最后的计划也就这点东西'+ 认定蔡宇会打压自己 → '无论进不进避难所，蔡宇都必须去死'（line 299）
        蔡宇绕到城南观察（line 301）
      seq_climax: "'蔡宇都必须去死'（line 299）—— 廖振宇杀蔡宇决心锁定，张潇潇蛊惑 + '威望障碍'双重驱动"

    - seq_id: "5.3"
      label: "换班引蔡宇出营 + 三人暗杀 + 枪里没有子弹"
      source_anchor: "line 303-325"
      core_conflict: "陆德夫以为只是'抢枪逼进城' vs 三人不约而同下死手"
      progression: |
        陆德夫'难受'找蔡宇换班（line 303）—— 他以为只是抢枪逼蔡宇进城，没想到要杀人
        廖振宇以'发现感染者踪迹'为借口引蔡宇出营（line 305）
        张潇潇折断蔡宇手臂 + 罗允（吴先生）泥土堵嘴 + 廖振宇铁锤砸后脑（line 307）
        '三个在讨论时还说只是抢枪的人，却不约而同第一时间下死手'（line 307）
        翻找发现冲锋枪里一发子弹都没有、蔡宇身上也没有（line 309）
        张潇潇骂'拿把没子弹的破枪要我们唯命是从'（line 311）；罗允追问'他真的这么想吗'（line 311）
        罗允提议'庆祝，把储备食物全吃了'（line 313）→ 廖振宇/张潇潇赞成 —— 暗藏下药的局
      seq_climax: |
        枪里没有子弹（line 309）—— 全篇最精的伏笔回收：蔡宇'子弹留生死关头'（line 147）的真相是他根本没有子弹，
        全程靠'希望'这个空壳维系队伍。罗允'他真的这么想吗'（line 311）= 吴先生已看穿真相、引而不发的伏笔。
  arc_progression_note: |
    5.1（蛊惑）→5.2（决心锁定）→5.3（暗杀+枪空真相）。
    本 Arc 是'人际背叛比外部追击更致命'的顶点，也是廖振宇'登顶幻觉'的来源（杀掉威望障碍）。
    罗允（吴先生）在5.3全程在场参与，'庆祝吃光食物'（line 313）已是诱杀全队的局——读者二刷才解。

# === Arc 6: 吴先生揭穿 + 廖振宇处决 ===

arc_6:
  label: "吴先生揭穿伪装 + '同行'对谈 + 录像烧毁 + 廖振宇被判'忘了就忘了'+ 感染者司法处决"
  source_anchor: "line 317-361"
  sequences:
    - seq_id: "6.1"
      label: "蔡宇死后廖振宇威望登顶 + 饭中被下药昏迷"
      source_anchor: "line 317-327"
      core_conflict: "廖振宇'威望第一'的幻觉 vs 吴先生已布好的局"
      progression: |
        蔡宇死后队伍麻木、廖振宇感觉威望来到第一位（line 317）
        罗允（吴先生）变得异常听话、以廖振宇名义拿出私藏自热火锅给大家（line 319）—— 实为下药
        张潇潇求'进避难所前把女人办了'被廖振宇为名誉拒绝（line 321）→ 退求办李芳，廖振宇答应（line 323）
        廖振宇好奇张潇潇为何如此恨蔡宇 → '因为第一次见面，蔡宇唯独没理我'（line 325）
        '这还不够吗'（line 325）是廖振宇昏迷前最后听到的话 → 困意如潮、被下药昏迷
      seq_climax: |
        '蔡宇唯独没理我'（line 325）—— 张潇潇'无意识纯粹恶意'的本质袒露（杀人动机=被忽视）。
        饭中下药（line 319/327）—— 吴先生的局收口，廖振宇的'登顶'是诱杀前的最高幻觉。

    - seq_id: "6.2"
      label: "醒来被绑 + 吴先生持 DV 现身 + '同行'自陈"
      source_anchor: "line 327-341"
      core_conflict: "廖振宇'谁报复我' vs 真相：最听话的队友是真正的猎人"
      progression: |
        廖振宇醒来被绑树上（line 327）→ 疑蔡宇没死/张潇潇反水（line 329）
        '罗允'持自己丢的 DV 现身'这是我第一次对同行架摄像机'（line 329-331）
        自陈：'你在末日前杀人，我也在末日前杀人……而我更加纯粹，我只是单纯觉得有意思'（line 333）
        起源：童年被邻居大叔侵犯 → 杀大叔的狗获快感 → 由动物到人（line 335）
        展示山坡空地：刘建邦/陆德夫/张潇潇等横陈 + 篝火浓烟（line 337）
        '他最大的乐趣，就是看着别人毕生的希望化成泡影'（line 339）+ 树棍插嘴让廖振宇安静（line 341）
        '小林找到录像机时我多兴奋……同为杀人犯，你绝望时会有什么表现'（line 341）
      seq_climax: |
        '这是我第一次对同行架摄像机'（line 331）—— 全篇身份反转引爆点：
        最听话可靠的'罗允'是真正的猎人。'我更加纯粹，只是觉得有意思'（line 333）= 两类恶对位的核心台词。

    - seq_id: "6.3"
      label: "割眼皮逼看全队被感染者吞噬 + 麻醉挑断手脚尖的局"
      source_anchor: "line 341-347"
      core_conflict: "廖振宇不忍看 vs 吴先生'必须看'的强迫见证"
      progression: |
        篝火烟雾引感染者来到空地（line 343）→ 廖振宇呜呜挣扎想让同伴快逃
        吴先生'为这个礼物浪费不少麻醉剂，躺着的所有人脚尖手尖都被我挑断了'（line 343）
        廖振宇闭眼不看 → 吴先生割下他的眼皮 + 拭血逼他清楚看（line 345）
        解说：最崇拜廖振宇的女生与白发刘建邦穿在一起被享用+砍头；脸画箭头的张彤（line 345）——
        '他脸上的箭头，就是我用来告诉感染者们往哪走的'（line 345）；张潇潇的嘴成感染者厕所（line 345）
        陆德夫被吊起当沙袋捶死 → '能记得廖振宇的人几乎已经没有了'（line 347）
      seq_climax: |
        '脸上的箭头是我用来告诉感染者往哪走的'（line 345）—— 反派人类'役使感染者'的系统性诱杀实证。
        割眼皮逼看（line 345）= '强迫见证'母题顶点；'能记得廖振宇的人几乎没有了'（line 347）= 被记住价值归零的物理化。

    - seq_id: "6.4"
      label: "烧毁存储卡 + '谁配被记住'裁判 + 感染者司法处决 + 恶循环结尾"
      source_anchor: "line 349-361"
      core_conflict: "廖振宇'求被记住'的最后稻草 vs 吴先生'忘了就忘了'的判决"
      progression: |
        当面用打火机烧毁存储卡（line 349）→ '一切都没有了'，廖振宇无力低头
        吴先生问'为什么不求我放过你' → 廖振宇'没有意义，自己肯定会被杀的'（line 351）
        吴先生赞赏'猪崽求的不是他，是求猪崽自己……廖振宇也是个相当无情的人'（line 351）
        廖振宇抓救命稻草'那自己会被罗允记住吗？'（line 353）→ 被笑着粉碎
        裁判式独白（line 353-355）：最能记住蔡宇（怀绝望给希望最有趣 + '子弹就是希望'）；
          记住张潇潇（无意识纯粹恶意'让反社会人格的都觉少见'）；甚至记住逃掉的李芳；
          唯廖振宇'比上不足比下也差点……过一阵子就给忘了，和那些猪崽没什么区别'（line 355）
        '给予他这世界上最普通的司法——被感染者折磨至死'（line 357）
        吴先生牵林东青隐入山林（line 359）→ 结尾：消防队员带领的小队遇到'带孩子的可靠男人'（line 361）
      seq_climax: |
        '廖振宇可能过一阵子自己就给忘了'（line 355）—— closing reversal：
        毕生求被记住者被真同类判为最普通、最先遗忘。
        结尾 line 361 恶循环重启 = 与开篇李春桂猎杀（line 5-29）首尾呼应，表演型恶死、纯粹型恶继续上路。
  arc_progression_note: |
    6.1（下药登顶幻觉）→6.2（身份反转）→6.3（强迫见证+诱杀实证）→6.4（裁判+处决+循环）。
    本 Arc 是 main climax 与 closing reversal 合一，吴先生把全篇所有恶/好当面称重，
    廖振宇的'被记住'贬值曲线在此触底归零。

# === 序列间冲击力递增 ===

escalation_check:
  arc_1_to_2: "炫耀型猎杀（廖振宇=独一无二的顶点）→ 网吧爆发（人人皆恶，'特别'作废）= 被记住价值第一次暴跌"
  arc_2_to_3: "特别作废后迷茫 → 并入蔡宇队 + 起意杀警 + 吴先生入场 = 三条人类线汇流，外部希望（总局/避难所）开始崩塌"
  arc_3_to_4: "自欺式重建出名策略（当领袖）→ 老魏被弃 + 张彤被暗线清除 = 队伍崩坏加速 + 受害者 POV 双钉主控思想"
  arc_4_to_5: "知情者被清 + 杀蔡宇阴谋成形 → 暗杀蔡宇 + 发现枪空 = 人际背叛顶点 + '权力是空壳'伏笔回收 + 廖振宇登顶幻觉"
  arc_5_to_6: "登顶幻觉（威望第一）→ 吴先生揭穿 + 录像烧毁 + 判'忘了就忘了'+ 处决 = 被记住价值触底归零 + 恶循环重启"
  curve_shape: "Arc 1 顶点建置 → Arc 2 急跌 → Arc 3 缓升（自欺）→ Arc 4 缓降（崩坏）→ Arc 5 急（背叛顶点）→ Arc 6 急转直下 + 余韵循环"
  curve_note: |
    与《燃烧》'等距连续受难'不同，本篇是'被记住价值的贬值曲线'：
    廖振宇每一次以为重建了'特别'（Arc 3 当领袖 / Arc 5 杀蔡宇登顶），都被下一个 Arc 推得更低，
    Arc 6 由蛰伏已久的吴先生暗线一次性引爆到归零。

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第三人称限知主锚廖振宇（反派内聚焦）—— line 5-359 主线视角"
    secondary_pov_excursions:
      - "陆德夫水上乐园丧妻回忆（line 197-209）—— 受害者 POV 离场一，钉'每个人眼里只有自己'"
      - "老魏被分尸走马灯（line 237-255）—— 受害者 POV 离场二，反驳蔡宇'拯救每一个人'，candidate_b 核心证据"
      - "张彤被麻醉后清醒（line 285-289）—— 短暂转入张彤，让'识破真相却来不及传达'的反讽具象"
    function: |
      反派内聚焦让读者被困在廖振宇'被记住焦虑'里（恐怖来自认同的不可能）；
      两段受害者 POV 离场则在加害者视角之外，从受害端独立印证主控思想——
      这是莫千回'多 POV 拼图式'在单篇内的微缩使用。

  human_antagonist_threads:
    thread_A_liao_zhenyu_performative:
      name: "廖振宇'表演型恶/被记住'主线"
      description: "为出名而杀人、录像留名、逆大环境当领袖、杀蔡宇登顶 —— 全程在台前，是显性主线"
      primary_arcs: ["arc_1", "arc_2", "arc_3", "arc_5"]
    thread_B_wu_xiansheng_pure:
      name: "吴先生'纯粹型恶/系统性诱杀'暗线"
      description: "伪装可靠男人罗允入队 → 织善之网（拉队员/附和张潇潇）→ 用孩子清除张彤 → 参与杀蔡宇 → 麻醉全队引感染者诱杀 → 揭穿+裁判+处决廖振宇"
      primary_arcs: ["arc_3", "arc_6"]
      presence: "Arc 3 入场后全程蛰伏（仅 line 259 露一次笑、line 311 一句'他真的这么想吗'埋伏笔），Arc 6 突然主导高潮 —— 典型暗线节拍"
    thread_C_zhang_xiaoxiao_unconscious:
      name: "张潇潇'无意识纯粹恶意/蛊惑'第三极"
      description: "因被忽视而恨蔡宇 → 阴阳贬损蔡宇 → 蛊惑廖振宇杀蔡宇 → 参与暗杀 —— 是 thread A 行动的言语催化剂"
      primary_arcs: ["arc_3", "arc_4", "arc_5", "arc_6"]
      presence: "贯穿，作为 thread A 的'他者言语'催化（candidate_c），被吴先生在结局评为'少见'"
  thread_interweaving: |
    三条人类恶线在同一支幸存者小队内并行、互不知情：
    - thread A（廖振宇）在台前追'被记住'；
    - thread C（张潇潇）用言语把 thread A 推向杀蔡宇；
    - thread B（吴先生）蛰伏暗中，借 thread C 制造的内乱（杀蔡宇）削弱队伍，再一次性诱杀全队。
    Arc 5 暗杀蔡宇是三线唯一一次同框协作（line 307 三人同时下手），
    Arc 6 吴先生把三线 + 蔡宇（好人）+ 老魏/李芳全部当面称重，完成结构收束。
  parallel_external_threads:
    - "感染者进化猎群（line 145 截杀车辆 / line 169 练靶手 + 群体瓜分）—— 始终作为背景压力，Arc 6 被吴先生役使为行刑工具"
    - "避难所传闻（易达广场地下人防工程 line 221）—— 戈多式希望符号，全篇未抵达，是队伍上路的唯一动力"

# === 待解决钩点 ===

open_questions:
  - "吴先生伪装'罗允'是巧合同名，还是知道真罗允、蓄意盗用其'可靠救援者'人设？（line 159 入队即用真罗允同款'带孩子可靠男人'模板 → 强烈暗示蓄意，但本篇未明说）"
  - "林东青是否在其他篇章作为'吴先生徒弟'再现？本篇他已能独立偷窃/注射/给感染者指路（line 267/287/345），暗示长期训练。"
  - "结尾 line 361'消防队员带领的幸存者小队'是否对应某既有/待拆篇章？这是吴先生下一轮诱杀的入口钩。"
  - "易达广场地下人防工程避难所真伪 —— 与机场旁医院并列的第二个希望符号，是否在其他篇章揭示？"
  - "蔡宇'子弹就是希望'（line 353）—— 他全程无子弹靠'希望'维系队伍，这一'空壳权力'是否在其他公权力角色（特警/军方）篇章重现？"
  - "张彤最终在感染者群中（line 295-297）—— 他识破吴先生真相却没能传达，这条'差一点揭穿'的线是否有跨篇回响？"
