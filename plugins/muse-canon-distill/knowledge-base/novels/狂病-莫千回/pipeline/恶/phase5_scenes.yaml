  notes: |
    选 11 个结构承重节点（宁少勿凑），覆盖：
    廖振宇'录像留名'MO 建置 / 网吧爆发'特别'作废 / 起意杀警 + 吴先生入场 /
    两段受害者 POV 离场（陆德夫·老魏）/ 张彤被暗线清除 / 暗杀蔡宇 + 枪空 /
    吴先生揭穿'同行' / 强迫见证诱杀 / 烧录像 + '谁配被记住'裁判 + 恶循环结尾。
    scene_id 前缀 EE。

scenes:

  - scene_id: "EE-S01"
    label: "李春桂被猎杀 + 廖振宇对镜头'第十个猎物'+ 自报大名"
    chapter: "恶"
    source_anchor: "line 5-29"
    word_count_approx: 1400
    characters: ["李春桂", "廖振宇", "刘建邦", "张彤"]
    pov: "第三人称（前段锚李春桂受害视角 → 转廖振宇加害视角）"
    conflict_type: "external"
    beat_direction:
      function: "建置廖振宇'录像留名'MO + 杀人狂三人组分工 —— 全篇'被记住价值'的最高起点"
      craft_note: |
        开篇用受害者李春桂的'人性细节'（去看被拘留的儿子 line 5 / 求饶'家里不能没有他' line 17）
        与加害者的'游戏化嗜虐'（树枝插眼通鼻 line 23 / 验证断臂手指还能动 line 25）做温度对照。
        关键手艺——'省略了什么'：
        李春桂被杀的最惨烈过程（拖入树林轮番砸碎 line 19）其实写得很直白，莫千回此处不省略暴力；
        真正省略的是'廖振宇为什么变成这样'——开篇不给他任何前史动机，
        只给'对镜头宣布第十个猎物 + 自报大名'（line 27）这个仪式，
        让读者先认定他是'纯粹的恶'，为结局吴先生把他降级为'比上不足比下也差'（line 355）埋反讽。
        '今天的视频就到这里'（line 27）—— 用博主口吻收尾杀人，把'杀人=内容生产'一句钉死。
    description: "李春桂夜里去看被拘留的儿子，车胎被预埋玻璃钉子扎爆 → 廖振宇'需要帮忙吗'诱近后掏羊角锤追杀 → 石头砸面门倒地 → 张彤持摄像机 → 三人组分工虐杀 → 廖振宇对镜头宣布'第十个猎物'+ 自报大名结束拍摄"

  - scene_id: "EE-S02"
    label: "车旁'雁过留声人过留名'独白 —— 留名哲学建置"
    chapter: "恶"
    source_anchor: "line 31-35"
    word_count_approx: 900
    characters: ["廖振宇", "张彤", "刘建邦"]
    pov: "第三人称（锚廖振宇）"
    conflict_type: "internal"
    beat_direction:
      function: "把全篇核心欲望（被记住）显性化为可追踪的价值轴起点"
      craft_note: |
        这是全篇唯一一次让廖振宇'内心欲望'完整出声的场景，是后面所有贬值的度量原点。
        '雁过留声，人过留名……成为全球每一代人的噩梦，被写进小说/做进游戏/拍进电影'（line 31）
        +'监狱粉丝来信 / 女粉丝结婚 / 囚犯争相合影'（line 33）。
        关键手艺——'省略了什么'：作者故意让这些幻想'全部来自国外纪录片'（line 33），
        即廖振宇的'被记住'欲望本身是二手的、抄来的——他连出名的想象都不原创。
        这一笔不点破，但为吴先生结局'你太想出名反而最普通'（line 355）做了最早的伏笔。
    description: "清洗血迹后，张彤担心杀的不是流浪汉会被查 → 廖振宇满不在乎（张彤未成年/刘建邦有精神病+律师爹）→ 阐述'要像开膛手杰克成为全球噩梦'的留名哲学 + 监狱粉丝幻想 → '为了更伟大的名声，现在还不能被抓'"

  - scene_id: "EE-S03"
    label: "网吧狂病爆发 + 无差别互杀吃人 + 廖振宇'特别'作废"
    chapter: "恶"
    source_anchor: "line 37-83"
    word_count_approx: 2600
    characters: ["廖振宇", "刘建邦", "张彤", "网吧顾客/网管群", "感染者群"]
    pov: "第三人称（锚廖振宇）"
    conflict_type: "external + internal"
    beat_direction:
      function: "激励事件 —— '杀人了'让廖振宇先狂喜再绝望；Arc 2 价值落点：'特别'被通货膨胀作废"
      craft_note: |
        节奏先扬后抑：'杀人了'让廖振宇'精神一振'（line 45，以为遇同类）→ 立刻被无差别互杀/自残/吃人碾压。
        关键手艺——'省略了什么'：刘建邦'太阳好像掉下来了'（line 57）+ 天际划过类似流星的东西——
        这是全篇唯一一次触及'病原/全球同步爆发'的笔，但作者只给一个'不确定是不是错觉'（line 57）的暗示，
        坚决省略病毒起源解释（与 phase1 'NOT 解释病毒起源'一致），把恐怖留在'人'而非'科幻设定'。
        '就连虐杀动物无数、早上刚杀过人的廖振宇也皱起了眉头'（line 51）—— 用加害者的'被震惊'反衬病毒型恶的廉价。
        作者议论'每个人做出动作就偏执继续下去……越跑越快越控制不住'（line 51）确立病征行为逻辑。
        Arc 落点'他们之前的一切都白做了，他们现在还有什么特别的？'（line 83）—— 被记住价值第一次暴跌。
    description: "网吧口角升级互殴 → 报警无警力 → '杀人了'让廖振宇精神一振 → 顾客网管无差别互杀/自残/互咬下体/剪刀插眼/热水烫脸/啃食 → 刘建邦窗外'太阳掉下来了' → 廖振宇逃出后癫狂砸方向盘吼'他们还有什么特别的？'"

  - scene_id: "EE-S04"
    label: "并入蔡宇队 + 廖振宇起意'一个人杀警出名'"
    chapter: "恶"
    source_anchor: "line 105-123"
    word_count_approx: 1500
    characters: ["廖振宇", "刘建邦", "张彤", "蔡宇", "张潇潇"]
    pov: "第三人称（锚廖振宇）"
    conflict_type: "interpersonal + internal"
    beat_direction:
      function: "把'出名'策略从数量切到'稀缺事件'（杀真警察）—— 表演型恶自欺升级 + 杀蔡宇动机第一次出现"
      craft_note: |
        辅警蔡宇的'我有枪可以掩护大家'（line 113/117）建立他的'权力符号'表象，与结局枪空（line 309）形成最长伏笔跨度。
        张潇潇的入场（line 115 攀附 / line 121 阴阳逼大家听蔡宇）= thread C 第一次发声。
        关键手艺——'省略了什么'：廖振宇'一个人杀掉警察会不会脱颖而出'的盘算（line 119）写得很完整，
        但作者省略了'蔡宇此刻对廖振宇车上碎肉血块的反应深描'——
        只给蔡宇'略一停顿，但最后还是握紧了枪登车'（line 123）一个克制动作，
        把蔡宇'明知危险仍选择信任/求援'的好人底色用一个动作承担，不铺陈。
    description: "廖振宇调头追到张彤所在警车 → 张彤解释追偷手机的张潇潇才离队、蔡宇作证 → 蔡宇请求搭车去总局求援'我有枪' → 张潇潇自来熟攀附 + 阴阳逼大家听蔡宇 → 廖振宇起意'一个人杀真警官会脱颖而出'，决定先按计划走伺机动手"

  - scene_id: "EE-S05"
    label: "罗允（吴先生）带孩子入队 + 避难所投票 + 廖振宇杀蔡宇动机锁定"
    chapter: "恶"
    source_anchor: "line 159-195"
    word_count_approx: 2400
    characters: ["廖振宇", "蔡宇", "张潇潇", "罗允(吴先生)", "林东青", "刘建邦", "李芳", "陆德夫", "陈秀秀"]
    pov: "第三人称（锚廖振宇）"
    conflict_type: "interpersonal"
    beat_direction:
      function: "吴先生暗线正式入场 + 投票去避难所 + 锁定廖振宇杀蔡宇动机（蔡宇是其威望障碍）"
      craft_note: |
        吴先生入场用的是真罗允同款'带孩子的可靠男人'模板（line 159）—— 这是跨篇最大反讽的种子，
        但作者此处只让他'腼腆一笑'（line 207 邻场）/ '微微点头'附和张潇潇（line 193），全程克制。
        关键手艺——'省略了什么'：作者完全省略了'罗允=吴先生'的任何此刻信号，
        让读者和廖振宇一起把他当好人，把揭穿的全部张力存到 Arc 6——这是本篇'伪装'结构的核心赌注。
        投票场景（line 181-185）是 candidate_c 的舞台：张潇潇'你也是个头别老当跟班'（line 183）+
        廖振宇'因所有人更信任崇拜那个警察'而举手（line 183）—— 杀蔡宇的真实动机（威望嫉妒）在此种下。
        李芳'蔡宇想拯救每一个人'（line 189）= 蔡宇好人底色的他者定义，与老魏走马灯'不是每个人都值得拯救'（line 255）对位。
    description: "'罗允'带孩子林东青出现提醒前方感染者群 → 盘问得知其原队伍奔避难所被击溃、避难所=易达广场地下人防工程 → 投票7比4决定前往 → 张潇潇蛊惑廖振宇'别当跟班' → 廖振宇因'人们更信任蔡宇'举手 → 罗允末位微微点头附和张潇潇"

  - scene_id: "EE-S06"
    label: "陆德夫水上乐园丧妻回忆 —— 受害者 POV 离场（一）"
    chapter: "恶"
    source_anchor: "line 197-209"
    word_count_approx: 1300
    characters: ["陆德夫", "陆德夫妻子（回忆）", "罗允(吴先生)", "张潇潇"]
    pov: "第三人称（离场转锚陆德夫）"
    conflict_type: "internal"
    beat_direction:
      function: "受害者 POV 离场一 —— 从受害端钉主控思想'每个逃亡的人眼里都只有自己'"
      craft_note: |
        这是全篇第一次脱离廖振宇视角，转入一个'普通好人'的内心——形成加害/受害视角的对位。
        关键手艺——'省略了什么'：陆德夫妻子的死，作者明写'其实陆德夫并不知道妻子是如何去世的，
        妻子被抓后的一切都只是他的后来幻想'（line 207）——
        即作者主动揭穿这段惨死是'幻想'，省略了'真实死法'，让恐怖来自'想象的无穷尽'而非画面本身。
        这一笔同时把陆德夫的创伤逻辑（'每个人眼里只有自己' line 205/209）锚成他后续换班害死蔡宇（line 303）的伏笔——
        他以为自己只是'抢枪逼进城'，因为他坚信'真遇事每个人只想自己'。
        罗允（吴先生）拉队员上陡坡（line 207）= 织善之网第二针，与他最终诱杀全队反讽对照。
    description: "暴雨山路泥泞 → 陆德夫回忆灾难当天与妻子在水上乐园的最后快乐 → 妻子被水流冲远、人潮阻挡无法施救 → '每个人眼里都只有他们自己' → （作者揭穿这是陆德夫的幻想）→ 罗允拉陆德夫等上坡 → 张潇潇借机阴阳蔡宇"

  - scene_id: "EE-S07"
    label: "老魏被表决抛弃 + 走马灯被分尸 —— 受害者 POV 离场（二）"
    chapter: "恶"
    source_anchor: "line 237-257"
    word_count_approx: 2200
    characters: ["老魏", "蔡宇", "感染者群", "李芳", "廖振宇", "张潇潇"]
    pov: "第三人称（离场转锚老魏临终意识）"
    conflict_type: "external + internal"
    beat_direction:
      function: "受害者 POV 离场二 —— 反驳蔡宇'拯救每一个人'，candidate_b 核心证据；冷峻拆解'集体决策道德'"
      craft_note: |
        老魏的走马灯（海边/啤酒王/爬山坠落 line 239-243）是全篇最'文学'的一段，用'痛觉缺失'的病征反向写成'临终顿悟'。
        关键手艺——'省略了什么'：老魏被分尸的肉体细节（扯断小兄弟 / 吸眼球 line 253-255）写得直白，
        但作者把'疼痛'省略了——'死好像根本就不痛'（line 237）、'疼痛被什么力量瞬间吹散'（line 237）——
        用'感觉不到痛'承担最痛的画面，是莫千回式'省略胜过直写'的变体（省略的是受害者的痛觉而非动作）。
        '不是每一个人都值得被拯救'（line 255）= 老魏临终对蔡宇'拯救每一个人'（line 189）的正面反驳，candidate_b 的钉子。
        '商讨的唯一价值，就是选一个倒霉蛋当抛弃队友的坏人'（line 251）—— 对集体决策的冷峻拆解，蔡宇担下坏人角色。
    description: "老魏低烧旧伤拖慢队伍 → 蔡宇'想带上老魏的举手'无人/'想抛下的举手'也无人 → 蔡宇担下坏人角色留刀和食物带队前进 → 老魏走马灯（海边/啤酒王/坠落顿悟'怕的不是死是死前没尽兴'）→ 被感染者分尸（扯断小兄弟/吸眼球）→ '不是每一个人都值得被拯救'"

  - scene_id: "EE-S08"
    label: "张彤被林东青麻醉清除 + 识破真相来不及传达"
    chapter: "恶"
    source_anchor: "line 263-289"
    word_count_approx: 2200
    characters: ["廖振宇", "刘建邦", "张彤", "林东青", "罗允(吴先生)", "张潇潇"]
    pov: "第三人称（锚廖振宇 → 末段短暂转锚张彤）"
    conflict_type: "external + interpersonal"
    beat_direction:
      function: "吴先生暗线第一次实质出手（用孩子清除知情者）+ 廖振宇情感第一道真实裂痕 + 全篇最接近揭穿吴先生的瞬间"
      craft_note: |
        DV 丢失危机（line 263）把廖振宇的注意力锁死在'防暴露'，恰好让吴先生的局在他眼皮底下推进——
        这是结构上的'误导注意力'手法：读者跟着廖振宇盯 DV，忽略了真正的猎人。
        关键手艺——'省略了什么'：林东青用针管麻醉张彤（line 287）写得干净利落，
        但作者省略了'吴先生指挥林东青'的任何画面——只让张彤事后推断'这对父子一定有问题'（line 287），
        把'孩子是吴先生工具'的真相藏到 Arc 6 才由吴先生自己点破（line 345 脸上箭头）。
        '一个听话的小弟就这样不明不白地没了'（line 283）—— 廖振宇情感的第一道真实裂痕，
        罕见地让这个反派主角'说不清是悲伤还是惋惜'，给他一丝人味，反衬吴先生的彻底无情。
        张彤'想告诉廖振宇小心那个小孩和罗允'（line 287）= 全篇最接近揭穿吴先生的瞬间，被'灌木被扒开是癫狂笑脸'（line 289）切断。
    description: "DV 丢失危机 → 张彤怀疑被林东青偷走 → 廖振宇派张彤找小林、自己旁敲罗允'没看过DV' → 张彤带小林到营地外想逼问 → 被林东青针管麻醉 → 张彤成'被迫抛弃的第二人' → 醒来被反绑堵嘴、识破'这对父子有问题'想警告廖振宇 → 灌木被扒开却是感染者的癫狂笑脸"

  - scene_id: "EE-S09"
    label: "换班引出蔡宇 + 三人暗杀 + 枪里没有子弹"
    chapter: "恶"
    source_anchor: "line 301-315"
    word_count_approx: 1700
    characters: ["廖振宇", "张潇潇", "罗允(吴先生)", "蔡宇", "陆德夫"]
    pov: "第三人称（锚廖振宇）"
    conflict_type: "interpersonal + external"
    beat_direction:
      function: "Arc 5 climax —— 人际背叛顶点 + '权力是空壳'伏笔回收（枪空）+ 廖振宇登顶幻觉"
      craft_note: |
        陆德夫换班（line 303）的悲剧性来自 EE-S06 埋的伏笔：他以为只是'抢枪逼进城'，因为他坚信'人人只想自己'，
        没想到这成了亲手把蔡宇推向死亡的一环——作者用'那一晚如果有上帝视角，他们永远不会做出当时的选择'（line 303）点破。
        关键手艺——'省略了什么'：蔡宇被杀的过程（折臂/堵嘴/铁锤砸后脑 line 307）写得直接，
        但作者把'蔡宇的临终反应/有没有看清是谁'完全省略——蔡宇'还以为周围几个人只是想进城'（line 305）至死，
        用'受害者至死不知真相'承担背叛的残酷，比写他的痛苦更冷。
        枪空（line 309）是全篇最精的伏笔回收：蔡宇'子弹留生死关头'（line 147）的真相是他根本没子弹，
        全程靠'希望'空壳维系队伍。罗允'他真的这么想吗'（line 311）= 吴先生已看穿、引而不发的伏笔。
        '三个在讨论时还说只是抢枪的人，却不约而同第一时间下死手'（line 307）—— 末日道德崩坏的群像一笔。
    description: "陆德夫'难受'找蔡宇换班（自以为只是抢枪逼进城）→ 廖振宇以'发现感染者'为借口引蔡宇出营 → 张潇潇折臂 + 罗允泥土堵嘴 + 廖振宇铁锤砸后脑 → 翻找发现冲锋枪一发子弹都没有 → 张潇潇骂'拿没子弹的破枪要我们听话' + 罗允'他真的这么想吗' → 罗允提议'庆祝把储备食物全吃了'（暗藏下药的局）"

  - scene_id: "EE-S10"
    label: "醒来被绑 + 吴先生持DV揭穿'同行'+ 强迫见证全队被感染者吞噬"
    chapter: "恶"
    source_anchor: "line 327-347"
    word_count_approx: 2400
    characters: ["廖振宇", "罗允(吴先生)", "林东青", "刘建邦/陆德夫/张潇潇等被诱杀队员", "感染者群"]
    pov: "第三人称（锚廖振宇）"
    conflict_type: "external + internal"
    beat_direction:
      function: "全篇身份反转引爆点 + 两类恶对位核心台词 + 反派人类'役使感染者'系统性诱杀实证 + '强迫见证'母题顶点"
      craft_note: |
        '这是我第一次对同行架摄像机'（line 331）—— 反转引爆：最听话可靠的'罗允'是真正的猎人。
        '你在末日前杀人，我也在末日前杀人……而我更加纯粹，我只是单纯觉得有意思'（line 333）= 两类恶对位的核心台词。
        起源（童年被侵犯→杀狗获快感→由动物到人 line 335）给吴先生一个'纯粹型恶'的成因，与廖振宇'抄国外纪录片'的二手欲望对照。
        关键手艺——'省略了什么'：吴先生诱杀全队的'布置过程'被整体省略（麻醉/挑断手脚尖/篝火信号全是事后由他口述 line 343），
        读者和廖振宇同步'后知后觉'地发现全队早已被布好局——把'伪装'的全部回报一次性兑现。
        '脸上的箭头是我用来告诉感染者往哪走的'（line 345）= 反派人类役使感染者的系统性诱杀实证。
        割眼皮逼看 + 拭血（line 345）= '强迫见证'母题顶点（与系列录像/望远镜套娃同源）；
        '能记得廖振宇的人几乎已经没有了'（line 347）= 被记住价值归零的物理化。
    description: "廖振宇被下药后醒来被绑树上 → 疑蔡宇没死/张潇潇反水 → 罗允持其丢失的DV现身'第一次对同行架摄像机' → 自陈'我更纯粹只觉得有意思' + 童年起源 → 展示山坡空地横陈的全队 + 篝火浓烟 → 篝火烟雾引感染者来 → 廖振宇闭眼 → 被割眼皮+拭血逼看 → 解说女粉丝/张彤/张潇潇/陆德夫依次被吞噬 → '能记得廖振宇的人几乎没有了'"

  - scene_id: "EE-S11"
    label: "烧毁存储卡 + '谁配被记住'裁判 + 感染者司法处决 + 恶循环结尾"
    chapter: "恶"
    source_anchor: "line 349-361"
    word_count_approx: 1500
    characters: ["廖振宇", "罗允(吴先生)", "林东青"]
    pov: "第三人称（锚廖振宇 → 末段全知拉远）"
    conflict_type: "internal + external"
    beat_direction:
      function: "main climax + closing reversal —— 被记住价值触底归零 + 恶循环重启（首尾呼应开篇）"
      craft_note: |
        烧毁存储卡（line 349）= '抹除记忆=处决'的物质意象，比杀死他更先杀死他的'被记住'。
        裁判式独白（line 353-355）是全篇结构收束：吴先生把所有恶/好当面排座次——
        最值得记住的是蔡宇（'怀绝望给人希望'+ '子弹就是希望' line 353，解码 EE-S09 枪空伏笔）；
        其次张潇潇（'无意识纯粹恶意，让反社会人格的都觉少见' line 355）；甚至记住逃掉的李芳；
        唯廖振宇'比上不足比下也差点……过一阵子就给忘了'（line 355）。
        关键手艺——'省略了什么'：廖振宇的实际死亡（被感染者折磨至死）被完全省略，
        只给吴先生宣判'最普通的司法——被感染者折磨至死'（line 357）+ 镜头跟吴先生离开（line 359）——
        莫千回标志性'省略关键死亡'，且这里更狠：连'被记住价值=0'的人，连他的死都不配被写。
        结尾 line 361 全知拉远'消防队员带领的小队遇到带孩子的可靠男人'—— 恶循环重启，
        与开篇 EE-S01 李春桂猎杀首尾呼应：表演型恶死、纯粹型恶继续上路。
    description: "吴先生当面烧毁存储卡 → '一切都没有了' → 问廖振宇为何不求放过 → 廖振宇'没意义肯定会被杀' → 吴先生赞赏'猪崽求的是猪崽自己，廖振宇也很无情' → 廖振宇抓稻草'会被你记住吗' → 被笑着粉碎：能记住蔡宇（怀绝望给希望+子弹就是希望）/张潇潇（纯粹恶意）/甚至李芳，唯廖振宇'过阵子就忘了' → 判'最普通的司法被感染者折磨至死' → 吴先生牵林东青隐入山林 → 结尾消防队小队遇到'带孩子的可靠男人'"

# === 节奏曲线 ===

pacing_curve:
  arc_1: "急 → 缓"  # EE-S01 猎杀（急）→ EE-S02 留名独白（缓·建置欲望顶点）
  arc_2: "急"  # EE-S03 网吧爆发 → 特别作废（先扬后抑的急）
  arc_3: "缓 → 急 → 缓"  # EE-S04 起意杀警（缓·内心）→ 飞机炸群（急·邻场）→ EE-S05 吴先生入场+投票（缓·织网）
  arc_4: "缓 → 静 → 急"  # EE-S06 陆德夫回忆（静）→ EE-S07 老魏走马灯（静·临终）→ EE-S08 张彤被清除（急转）
  arc_5: "急"  # EE-S09 暗杀蔡宇 + 枪空（背叛顶点的急）
  arc_6: "急 → 静 → 急 → 余韵"  # EE-S10 揭穿+强迫见证（急）→ 裁判（静·宣判）→ 处决（急·省略）→ EE-S11 恶循环结尾（余韵）
  notes: |
    本篇节奏与《燃烧》'连续受难'不同 —— 是'被记住价值贬值曲线'的张弛：
    每个'急'（杀戮/背叛/揭穿）后接一个'静'（留名独白/受害者走马灯/裁判宣判），
    用'静'段承载主题（被记住/每个人只为自己/谁配被记住），用'急'段承载情节下沉。
    两段受害者 POV 离场（EE-S06/EE-S07）是全篇最'静'的低谷，与加害者视角的'急'形成呼吸。

# === 跨场景手艺主题 ===

cross_scene_craft_themes:
  performative_vs_pure_evil:
    description: |
      表演型恶（廖振宇：录像/留名/需观众，EE-S01/S02/S10）vs 纯粹型恶（吴先生：为乐趣/鄙视观众/掌握记住权，EE-S05/S10/S11）
      —— 两类恶在'对镜头架摄像机'这一同款动作上正面对位（EE-S01 廖振宇自报大名 vs EE-S10 吴先生'对同行架摄像机'）。
    scenes: ["EE-S01", "EE-S02", "EE-S05", "EE-S10", "EE-S11"]
    function: "全篇核心结构 —— 把'恶'拆成两类称重，最终纯粹型恶判表演型恶'最普通'，颠覆读者对'谁更可怕'的预期"

  being_remembered_devaluation:
    description: |
      '被记住'作为可追踪价值轴的贬值曲线：独一无二（EE-S02 留名顶点）→ 被稀释（EE-S03 '还有什么特别'）→
      自欺重建（EE-S04/S05 当领袖）→ 登顶幻觉（EE-S09 杀蔡宇威望第一）→ 被判'忘了就忘了'（EE-S11）。
    scenes: ["EE-S02", "EE-S03", "EE-S04", "EE-S09", "EE-S11"]
    function: "用一个反派的'被记住焦虑'承担当代'自媒体时代被记住'隐喻 —— 恐怖来自'太想被记住反而最先被遗忘'"

  victim_pov_excursion:
    description: |
      两段受害者 POV 离场（陆德夫丧妻 EE-S06 / 老魏走马灯 EE-S07）+ 张彤短暂转锚（EE-S08 末段），
      在加害者内聚焦之外从受害端独立钉主控思想。
    scenes: ["EE-S06", "EE-S07", "EE-S08"]
    function: |
      '省略了什么'的集中体现：陆德夫妻死法被揭为'幻想'（省略真实）、老魏被分尸省略'痛觉'（'死不痛'）、
      张彤识破真相省略'传达'（来不及说）—— 三种不同的'省略'各承担一层恐怖/反讽。

  hidden_antagonist_misdirection:
    description: |
      吴先生暗线 Arc 3 入场后全程蛰伏（EE-S05 '微微点头' / line 259 一次笑 / EE-S09 '他真的这么想吗'埋伏笔），
      用 DV 危机（EE-S08）误导廖振宇与读者的注意力，到 EE-S10 才一次性兑现。
    scenes: ["EE-S05", "EE-S08", "EE-S09", "EE-S10"]
    function: "'伪装成善'的织网手艺 —— 把揭穿的全部张力存到结局；与系列真罗允'可靠救援者'人设构成最大反讽（盗用身份）"

  empty_gun_as_hollow_power:
    description: "蔡宇的无子弹冲锋枪 —— EE-S04 建立权力符号表象 → EE-S09 暗杀时发现枪空 → EE-S11 吴先生解码'子弹就是希望'。"
    scenes: ["EE-S04", "EE-S09", "EE-S11"]
    function: "全篇最长伏笔跨度（line 113→309→353）—— '权力是空壳' + '怀绝望给人希望'的蔡宇才是最值得记住的人，肯定 candidate_b"

  evil_cycle_framing:
    description: "开篇李春桂被录像猎杀（EE-S01）与结尾吴先生接触下一支队伍（EE-S11 line 361）首尾呼应。"
    scenes: ["EE-S01", "EE-S11"]
    function: "cyclical ending —— 表演型恶死、纯粹型恶继续上路，恶的永动；结构上与《学校》'罗允拾日记本继续上路'同位但反向（继续上路的是恶本身）"
