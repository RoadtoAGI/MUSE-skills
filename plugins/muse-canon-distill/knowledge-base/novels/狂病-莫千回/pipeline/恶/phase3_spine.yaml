_meta:
  version: "1.0"
  chapter: "恶"
  source: "novels/狂病-莫千回/恶.md"
  word_count_approx: 29900
  validated_against_source: true
  form_note: |
    第三人称限知，视角主锚定在廖振宇（杀人狂青年）——全篇用'反派内聚焦'承担恐怖：
    读者被困在一个'为出名而杀人'的反社会者脑子里，看他如何在末日里失去'特别'，
    最后被一个更纯粹的同类（吴先生伪装的罗允）当成猎物'司法处决'。
    两次插入式 POV 离场：陆德夫水上乐园丧妻回忆（line 197-209）、老魏被分尸时的走马灯（line 237-255）——
    用'受害者主观'对照'加害者主观'，把'每个人眼里都只有自己'这条主控思想从两端各钉一次。

# === 脊椎 ===

spine:
  protagonist: "廖振宇（虚焦主角 / 反派型 POV —— 病毒前就杀人、为'出名'而杀人的青年）"
  spine_mode: "desire"
  desire_object: "在这场全球灾难里'脱颖而出、被全世界记住'—— 成为像开膛手杰克一样写进小说/游戏/电影、被后世争论几百年的传奇"
  shadow_desire: |
    廖振宇要的从来不是'杀人本身'（line 151-155 刘建邦才贪恋杀人的快感）——
    他要的是'被记住'，是把自己塑造成一个'集善恶于一身、永世流传的争议形象'（line 153）。
    所以末日对他不是解放，是灾难：当'所有人都在杀人'（line 83），他的'特别'被抢走了——
    '他们之前的一切都白做了，他们现在还有什么特别的？'（line 83）
    shadow_desire 的真相在结局被吴先生一句话剥光：'廖振宇也是个相当无情的人'（line 351），
    '比上不足、比下也差点'（line 355）—— 他终其一生想'不普通'，却被判定为最普通的那一类。
  conscious_vs_unconscious:
    conscious: "录像留名、绕着世界各地杀人犯案例学习、末日里逆着大环境救人当'幸存者社区领袖'好留名（line 35 / line 151-153）"
    unconscious: |
      廖振宇并不真的理解'被记住'要靠什么。他以为靠'数量 + 形象 + 录像'，
      但他从不追问'记住'对一个观众/同类意味着什么。
      吴先生在结局给出答案：能被记住的是蔡宇（怀绝望给人希望）、是张潇潇（无意识纯粹的恶）——
      是'有趣'，不是'卖力'。廖振宇的'努力出名'恰恰是他最普通的证据。
      他不自觉需要的是'被一个真正的同类承认'（line 353 '那自己会被罗允记住吗？'）——
      这个需要在最后一刻才浮出，且被立刻否决，构成全篇最残忍的价值塌缩。

# === 激励事件 ===

inciting_incident:
  event: "网吧屠杀爆发 —— 狂病在廖振宇眼前同步发作，'杀人了'三个字让他精神一振，他亲眼看到'全世界的人都在杀人'"
  source_anchor: "line 37-59"
  type: "accident"
  delay_from_opening_chars_approx: 2400
  function: |
    开篇李春桂被猎杀段（line 5-29）是'廖振宇日常态'的建置（炫耀式杀人 + 录像留名），不是激励事件。
    真正打破平衡的是网吧爆发：在 line 45 '杀人了' 让廖振宇'精神一振'（他以为又有同类），
    紧接着 line 59-65 他目睹普通人无差别互杀、自残、吃人——
    这一刻起，廖振宇的'特别'被宣判作废。
    末日开篇标准节奏在此被反用：别人的'灾难降临'，是廖振宇的'独家身份被剥夺'。
    balance_before: "廖振宇是'本城/放眼全球能有几个'的特殊存在（line 43）"
    balance_after: "全世界都在杀人，他的'特别'一文不值（line 83）—— 余下全篇是他追回'特别'的徒劳"

# === 戏剧问题 ===

dramatic_question:
  main: "在一个'人人都是杀人狂'的末日里，一个'为出名而杀人'的人，还能不能成为被记住的那一个？"
  subtext: |
    什么样的'恶'才配被记住？
    本篇把'恶'拆成两类放在天平两端：
    (A) 廖振宇式——表演型、为名声、需要观众和录像，本质是'自媒体时代被记住焦虑'的极端化；
    (B) 吴先生式——纯粹型、为乐趣、不需要名声（'我只是单纯觉得有意思' line 333），
        反社会人格但'知道什么是对什么是错'（line 355）。
    戏剧问题真正在问：表演型的恶在'恶已通货膨胀'的末日里，是否注定贬值为'普通'？
  payoff: |
    答案是毁灭性的'否'：
    廖振宇杀掉了对他唯一构成威胁的'好人'（蔡宇），以为登顶威望第一（line 317），
    却在最后一刻发现真正的猎人一直伪装成最听话的队友（吴先生=假罗允）。
    吴先生当面给他判决（line 351-357）：
    值得记住的是蔡宇、是张潇潇、甚至是逃掉的李芳，
    '至于廖振宇这种比上不足、比下也差点的人，可能过一阵子自己就给忘了'（line 355）。
    廖振宇毕生追求的'被记住'，被一个真正的传奇级杀手当面判为'忘了就忘了'——
    然后交给感染者'最普通的司法'折磨至死（line 357）。

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_virus_infected: "狂病感染者群（网吧爆发 line 47-65 / 公路飞机俯冲炸群 line 131-133 / 山林围猎进化群 line 169 螺丝刀扳手练靶手）—— '病毒型恶'，无差别、不可沟通、规模化"
    layer_2_environment: "出城公路绞肉机（line 85-91 人行道碾人 / line 125-133 飞机坠毁连锁爆炸）+ 山林暴雨泥泞（line 197-215）+ 不确定真伪的'易达广场地下人防工程'避难所（line 221）"
    layer_3_evolution: "感染者进化为有组织猎群（line 145 旧感染者拥堵路面截杀车辆 / line 169 魁梧者'练靶手'飞甩螺丝刀扳手 + 群体瓜分）—— 与《燃烧》进化战术同源但更'军事化'"
  interpersonal:
    layer_1_liao_crew_internal: "廖振宇杀人狂三人组内部（line 21-25 廖振宇/刘建邦/张彤分工 / line 67 张彤'背叛'消失 / line 263 录像 DV 丢失危机）—— 表演型恶的内部脆弱：靠'录像证据'维系的自我神话"
    layer_2_zhang_xiaoxiao: "张潇潇——'无意识纯粹恶意'的蛊惑者（line 271-277 用'罗允是好人 + 蔡宇想奴役大家'蛊惑廖振宇杀蔡宇 / line 325 恨蔡宇只因'第一次见面没理他'）—— candidate_c '他者言语比刀更危险'的载体"
    layer_3_wu_xiansheng: |
      吴先生（全篇伪装成'罗允'）—— 真正的隐藏主对手 / 反社会人格型恶（line 159 带孩子的可靠男人入队 → line 259 末尾末位压抑不住笑 → line 305-307 参与杀蔡宇 → line 329-359 当面揭穿+处决廖振宇）。
      与廖振宇构成'病毒型反派 vs 反社会人格型反派'之外的第二组对位：'表演型恶 vs 纯粹型恶'。
  internal:
    layer_1: "廖振宇的'被记住'焦虑 vs 末日'人人皆恶'的通货膨胀（line 83 / line 137 '他的荣誉、光辉的未来、知名度，仿佛都被抢走了'）"
    layer_2: "廖振宇'要逆着大环境走才能出名'的策略性自欺（line 151）—— 假装救人当领袖，本质仍是出名手段"
    layer_3: "结局被吴先生剥光后的认知崩塌：'没有意义，自己肯定会被杀的'（line 351）+ '那自己会被罗允记住吗？'（line 353）—— 从'我要名扬世界'退到'求一个同类记得我'再到一无所有"
  societal:
    - "警力先沦陷（line 39-41 网吧报警无警力 / line 95 警车被推翻、特警通勤车焚烧 + 特警叛变）—— 与《学校》《地铁》公权力坍塌同源"
    - "蔡宇=辅警+一把无子弹冲锋枪（line 111 / line 309）—— 末日里'权力符号'是空壳：枪没有子弹，权威全靠'那张皮'（line 227 / line 353）"
    - "避难所传闻：易达广场地下人防工程（line 221）—— 跨篇'希望符号'的本篇变体，全篇未抵达"

# === 反派对位（本篇核心结构）===

dual_antagonist_counterpoint:
  note: |
    本篇是全系列'反派双线'命题（phase0 candidate_a / phase1 genre_conventions.subverted '反派双线：病毒型 + 反社会人格型'）的
    最完整一次正面演示。两条人类反派线在同一支幸存者小队内并行，互不知情，
    最后由吴先生在结局把两类恶 + 一类好人放在同一个'谁配被记住'的天平上称重。

  line_A_liao_zhenyu:
    type: "表演型恶 / 病毒前杀人狂（为名声而杀）"
    mo: "每次杀人必录像、必自报大名'廖振宇'（line 27）、模仿开膛手杰克挑衅警察（line 35）、幻想监狱粉丝来信与女粉丝结婚（line 33）"
    need_for_witness: "必须有观众/录像/名声才能成立 —— DV 丢失即等于'计划全乱'（line 263-269）"
    fatal_flaw: "把'被记住'等同于'卖力表演 + 数量'，从不理解'有趣'才是被记住的货币"
    apocalypse_meaning: "灾难='特别'被通货膨胀稀释 —— 人人皆恶，他不再独一"
    end: "被吴先生判为'比上不足比下也差点'（line 355），录像存储卡当面烧毁（line 349），交给感染者折磨至死（line 357）"

  line_B_wu_xiansheng:
    type: "纯粹型恶 / 反社会人格（为乐趣而杀，不需名声）"
    disguise: "全篇伪装成'带孩子的可靠男人罗允'（line 159 入队 / line 361 结尾继续以同样话术骗下一支队伍）—— 盗用真罗允的身份是跨篇最大反讽"
    mo: |
      系统性诱杀整支队伍：用孩子林东青当工具偷 DV / 注射麻醉剂制服张彤（line 287）、
      用'避难所好消息'勾队伍上路、暗中促成杀蔡宇（line 305-307）、
      最后把全队麻醉、挑断手脚尖、点篝火当烟雾信号引感染者来（line 343-345）。
    self_account: "'你在末日前杀人，我也在末日前杀人。不过你每次都自我介绍……而我更加纯粹，我只是单纯觉得有意思'（line 333）；起源：童年被邻居大叔侵犯→杀大叔的狗获得快感→由动物到人（line 335）"
    moral_cognition: "'他只是感受不到普通的感情，但最起码，他知道什么事情是对的，什么事情是错的'（line 355）—— 比张潇潇'无意识的恶'高一档"
    end: "毫发无伤，牵着林东青隐入山林，结尾回到与开篇真罗允拾日记本结构同位的'继续上路'（line 359-361）"

  counterpoint_axis:
    - "观众依赖：廖振宇需要观众（录像/名声），吴先生鄙视观众（'为出名去杀人'被他判为不纯粹 line 333）"
    - "对'记住'的关系：廖振宇求被记住，吴先生掌握'记住谁'的权力——他是本篇唯一的'裁判'"
    - "对感染者的关系：两人都明确拒绝感染（廖 line 35 学开膛手 / 吴 phase0 '变成弱智没意思'），但廖振宇被感染者吞噬，吴先生把感染者当行刑工具役使"
    - "伪装能力：廖振宇靠'装豪迈'（line 31）拙劣表演，吴先生靠'腼腆一笑'（line 207）+ '微微点头'（line 193）几天内成为队伍'三当家'(line 225)—— 表演型反而不会表演，纯粹型才是真演员"

# === Arc 框架 ===

arc_framework:
  total_arcs: 6
  notes: |
    本篇 Arc 不像《燃烧》是'每死一人下沉一层'的等距连续受难——
    而是'廖振宇 被记住 价值'的一路贬值：从'独一无二'（Arc 1）→ 被稀释（Arc 2）→
    自欺式重建（Arc 4）→ 杀蔡宇登顶幻觉（Arc 5）→ 被裁判判为'忘了就忘了'（Arc 6）。
    吴先生（假罗允）这条暗线在 Arc 3 入场后全程蛰伏（只在 line 259 露一次笑），到 Arc 6 才主导高潮——
    这是典型'暗线长期蛰伏、特定节点突然浮现'的多线节拍（见 beat-analysis.md 多线叙事）。

  arc_1_liao_crew_hunt:
    label: "李春桂猎杀 + 廖振宇'录像留名'MO 建立"
    value_starting: "廖振宇是'放眼全球能有几个'的特殊存在（自我神话顶点）"
    value_ending: "MO 与欲望被完整建置（被记住=最高价值），但尚未受挑战"
    climax_event: "廖振宇对镜头宣布'第十个猎物'+ 树枝插眼眶 + 自报大名结束拍摄（line 23-27）；车旁'雁过留声人过留名……成为全球每一代人的噩梦'独白（line 31-33）"
    source_anchor: "line 5-35"
    function: |
      用一场极致残忍的炫耀型猎杀，把廖振宇的核心欲望（被记住）和方法（录像+留名）一次钉死。
      李春桂'要去找被拘留的儿子'的人性细节（line 5/17）与廖振宇的非人形成对照——
      这是'表演型恶'的基线，后面所有贬值都从这个顶点往下掉。

  arc_2_internet_cafe_outbreak:
    label: "网吧狂病爆发 + 廖振宇'特别'被宣判作废"
    value_starting: "特殊存在（自我神话）"
    value_ending: "认知崩坏：全世界都在杀人，'他们还有什么特别的？'（line 83）"
    climax_event: "网吧普通人无差别互杀/自残/吃人（line 47-65）→ 逃出城后廖振宇癫狂砸方向盘吼'他们之前的一切都白做了'（line 83）"
    source_anchor: "line 37-91"
    function: |
      激励事件所在 Arc。'杀人了'让廖振宇先狂喜（以为遇同类）再绝望（人人皆恶）。
      逃亡路上廖振宇用老人当替死鬼、把劝他逃命的小哥推入感染者群（line 77）——
      '失去人性在混乱中更易生存'（line 79）作者议论介入，确立本篇道德温度。
      张彤趁乱带钱与手机消失（line 67）—— 表演型恶内部第一次裂缝，也为 DV 危机埋线。

  arc_3_join_team_wu_enters:
    label: "并入蔡宇幸存者队 + 廖振宇起意杀警 + 吴先生（假罗允）入队"
    value_starting: "'特别'作废后的迷茫（出城无目标 line 95-97）"
    value_ending: "廖振宇找到'逆大环境出名'新策略（杀蔡宇/当领袖）；吴先生暗线悄然入场"
    climax_event: "廖振宇起意'一个人杀掉警察会不会脱颖而出'（line 119）；数日后罗允（吴先生）带孩子入队（line 159-187）并迅速成为队伍'三当家'"
    source_anchor: "line 93-195"
    function: |
      两条关键线在此交汇：
      (1) 廖振宇把'出名'从'数量'切换到'逆大环境'策略（line 119 / line 151-153 假装救人当社区领袖）——
          表演型恶的自欺升级；
      (2) 吴先生以'可靠男人罗允'身份入队，line 207 拉队员、line 193 附和张潇潇——
          纯粹型恶开始用'伪装成善'织网。
      张潇潇（line 115 入场 / line 157 猥琐 / line 165 阴阳蔡宇）作为'无意识恶'的第三极同时铺开。
      老魏低烧拖累队伍（line 231）为 Arc 4 埋线。

  arc_4_attrition_lao_wei_abandoned:
    label: "争分夺秒逃亡 + 老魏被表决抛弃 + 张彤被吴先生'消失' + 罗允末位的笑"
    value_starting: "队伍向避难所进发，廖振宇威望上升（'灵魂人物' line 151）"
    value_ending: "队伍开始崩坏：好人型成员（老魏）被牺牲；廖振宇的小弟（张彤）被暗线清除；吴先生掌控感增强"
    climax_event: |
      老魏走马灯 + 被感染者分尸（line 237-255）—— 受害者 POV 离场，钉'不是每一个人都值得被拯救'（line 255）；
      张彤被林东青注射麻醉、成为'被迫抛弃的第二人'（line 281-289）—— 吴先生暗线第一次出手；
      罗允走在队尾'压抑不住脸上的笑容——他感觉到了，这支队伍就快完蛋了'（line 259）—— 暗线唯一一次露脸。
    source_anchor: "line 195-261"
    function: |
      用三段'离场'同时推进：
      老魏（陆德夫水上乐园丧妻回忆 line 197-209 + 老魏走马灯 line 237-255）两段受害者 POV，
      把'每个逃亡的人眼里都只有自己'（line 205 陆德夫 / line 247 老魏）从两个角度各钉一次——
      这是 candidate_b（道德感拖累生存）与 candidate_c 的证据田。
      张彤的消失同时是廖振宇情感的第一道裂痕（line 283 '一个听话的小弟就这样没了'）。

  arc_5_assassinate_cai_yu:
    label: "张潇潇蛊惑 + 全队默契暗杀蔡宇 + 发现枪里没有子弹"
    value_starting: "廖振宇受张潇潇'罗允是好人/蔡宇想奴役大家'蛊惑（line 271-277），认定蔡宇必须死（line 299）"
    value_ending: "蔡宇被杀，廖振宇'威望来到第一位'（line 317）—— 登顶幻觉；但枪空（line 309）已暗示'权力是空壳'"
    climax_event: |
      陆德夫换班（line 303）→ 张潇潇折断蔡宇手臂 + 罗允（吴先生）泥土堵嘴 + 廖振宇铁锤砸后脑（line 307）；
      '三个在讨论时还说只是抢枪的人，却不约而同第一时间下死手'（line 307）；
      翻找发现冲锋枪里一发子弹都没有（line 309）—— 蔡宇'怀绝望给人希望'的真相浮出。
    source_anchor: "line 263-325"
    function: |
      全篇'人际背叛比外部追击更致命'的顶点（与《地铁》《学校》同源）。
      张潇潇的蛊惑（line 271-277）= candidate_c '他者言语比刀危险'的实证：
      廖振宇本已动摇，被一通'蔡宇想奴役你们'的话推过临界点。
      枪空（line 309）是本篇最精的伏笔回收：蔡宇'子弹留到生死关头'（line 147）的真相——
      他根本没有子弹，全程靠'希望'这个空壳维系队伍。吴先生在结局点破：'子弹就是希望'（line 353）。
      DV 危机（line 263-269）在此 Arc 并行升温，把廖振宇的注意力从'防暴露'引向吴先生设的局。

  arc_6_wu_reveal_liao_execution:
    label: "吴先生揭穿伪装 + '同行'对谈 + 录像烧毁 + 廖振宇被判'忘了就忘了'+ 感染者司法处决"
    value_starting: "廖振宇自以为登顶（威望第一），饭后被下药昏迷（line 325-327）"
    value_ending: "彻底归零：录像烧毁、队伍被诱杀、被判为最普通、交给感染者折磨至死（line 349-359）"
    climax_event: |
      廖振宇醒来被绑树上（line 327）→ 吴先生持 DV 现身'这是我第一次对同行架摄像机'（line 329-331）；
      自陈起源与'纯粹'（line 333-335）；展示被挑断手脚尖、麻醉的全队 + 篝火烟雾信号引感染者（line 343-345）；
      割眼皮逼看（line 345）+ 解说队员被感染者吞噬（line 345-347）；
      当面烧毁存储卡（line 349）；
      裁判式独白：能记住蔡宇（怀绝望给希望最有趣 line 353）、张潇潇（纯粹恶意 line 355）、甚至逃掉的李芳，
      唯廖振宇'比上不足比下也差点……过一阵子就给忘了'（line 355）；
      '给予他这个世界上最普通的司法——被感染者折磨至死'（line 357）。
    source_anchor: "line 327-361"
    function: |
      全篇 main climax + closing reversal 合一。
      吴先生不是来杀廖振宇，是来'称重'——他把全篇所有'恶'与'好'当面排座次，
      廖振宇毕生追求的'被记住'被一个真同类判为不值。
      结尾 line 361 '一直由消防队员带领的幸存者小队，遇到一个带着孩子的可靠男人'——
      吴先生用同一套话术开始下一轮诱杀（跨篇钩，与开篇李春桂猎杀首尾呼应：恶循环不止）。

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "吴先生（假罗允）揭穿伪装 + 当面给廖振宇做'谁配被记住'的裁判 + 烧毁录像存储卡 + 把廖振宇交给感染者折磨至死"
    source_anchor: "line 329-359"
    why_climax: |
      全篇价值层的引爆点：
      - 廖振宇开篇是'放眼全球能有几个'的特殊存在 → 末尾被判为'比上不足比下也差点、忘了就忘了'；
      - 廖振宇毕生追求'被记住' → 末尾求'被罗允记住也值了'（line 353）被当面拒绝，连这个最低需要也被剥夺；
      - 吴先生从'最听话可靠的队友罗允' → 末尾以'真正的猎人 + 裁判 + 行刑者'三重身份接管全局；
      - 蔡宇的'无子弹的枪'（line 309）在此被解码为'子弹就是希望'（line 353）——
        '怀绝望给人希望'的蔡宇才是吴先生愿意记住的人，反讽地完成了对'好人下场最惨但最被记住'的肯定。

  closing_reversal:
    event: "结尾'一直由消防队员带领的幸存者小队，在某处山林中，遇到了一个带着孩子的可靠男人'（line 361）"
    source_anchor: "line 359-361"
    function: |
      不是 happy ending 也不是单纯 hopeless ending —— 是 cyclical ending（恶的永动）。
      吴先生牵着林东青隐入山林（line 359）后，立刻用同一套'可靠男人'话术接触下一支队伍。
      与开篇李春桂猎杀（line 5-29）首尾呼应：故事开始于一场被录像的炫耀型猎杀，
      结束于一场即将开始的、不需要录像的纯粹猎杀。表演型恶死了，纯粹型恶继续上路。
      结构上与《学校》'罗允拾日记本继续上路'同位 —— 但这里继续上路的是恶本身。

  controlling_idea_for_this_chapter: |
    "在秩序崩坏、人人皆恶的末日里，
    '被记住'不是靠卖力表演和数量堆出来的——
    真正配被记住的，是那个怀着绝望仍把希望给别人的人（蔡宇），
    而最想被记住的人（廖振宇），恰恰因为太想，沦为最普通、最先被遗忘的猎物。
    比病毒更可怕的不是恶，是分得清对错却仍以杀人为乐、且掌握'记住谁'权力的那种纯粹之恶（吴先生）。"
    （主映射全系列 candidate_a：'人性之恶比病毒更可怕'；
      副映射 candidate_c：'他者的善意/言语比恶意更危险'——张潇潇用'罗允是好人'蛊惑廖振宇杀蔡宇 line 271-277；
      副映射 candidate_b：'道德感拖累生存'——蔡宇/老魏/李春桂等好人均死，廖振宇/吴先生/张潇潇反派型生还或役使他人。）

