# === 序列间冲击力递增 ===

escalation_check:
  arc_1_to_2: "封闭日常 + 末日预言（不安）→ 治疗变酷刑 + 砸死室友（灾难确认 + 主角入局）"
  arc_2_to_3: "孤立求生 → 三人结盟 + 逃生计划成型（希望被组织 + 放病友见血的代价预演）"
  arc_3_to_4: "计划启动 → 火电连锁杀群 + 救出耿小桃（计划链峰值，希望累积达顶 + 主队零减员扩员）"
  arc_4_to_5: "希望高位 → 贪枪失误 + 险团灭 + 郑云凡退场 + 副院长主动开门禁（首次重大挫败 + 反派升级）"
  arc_5_to_6: "反派转主动 → 康复楼下降 + 反派动机揭示 + 耿小桃自牺牲（延迟悲剧第一次引爆）"
  arc_6_to_7: "首次主队死亡 → 出院 + 李亚伟/唐科相继离世 + 元叙事翻转（传火完成 + 真相悬置）"
  curve_shape: "Arc 1-2 缓升 → Arc 3 中 → Arc 4 急升（希望峰值）→ Arc 5 急转直下 → Arc 6 极急 + 第一死 → Arc 7 静→急→余韵（元翻转）"
  curve_note: |
    闯关型 + 延迟悲剧 —— 与《燃烧》'每 Arc 死一人的连续受难'相反：
    本篇前 5 Arc 几乎零主队减员（一路通关、希望持续累积），把所有死亡压到 Arc 6-7 一次性收割（耿小桃→李亚伟→唐科），
    制造'攒得越高、跌得越重'的延迟悲剧节奏；元翻转再把'胜利'本身悬置。

# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "第三人称限知，脊椎锚在杨中旭（line 5-327 贯穿）"
    secondary_focalizers: |
      高频切到旁支角色的内聚焦段落，作世界图景补全（非独立线）：
        副院长（line 81, 251, 281, 287, 311-313 —— 反派内心 / 监控视角 / 动机揭示）
        郑云凡（line 233-235 —— 弑父往事 / 战场 PTSD / 自我隔离心理）
        张宁（line 57-61 —— 感染者'人体乐高'视角，唯一的感染者内聚焦）
        杨万新（line 75 —— 针灸酷刑受害视角）/ 耿小桃（line 55, 77, 295-297 —— 焦虑症 / 律师创伤）
    function: |
      复调式第三人称 —— 旁支聚焦不分走脊椎（仍以杨中旭逃生为唯一主线），
      而是把'封闭机构狂病爆发'的全景与'人类反派/反英雄'的内心同时铺开，
      并为元翻转预存多重不可靠性（张宁的感染者视角 / 杨中旭的幻想框架并置 = 暗示'视角本身可疑'）。

  parallel_external_threads:
    - "副院长监控/广播线（line 41, 81, 239, 251, 273, 281-287, 309-315）—— 贯穿全篇的反派压强，是闯关型结构的'关底 BOSS'"
    - "郑云凡线（line 39 远景 → 225-235 救场退场 → 323 楼顶矫健身影）—— 间歇浮现，跨篇钩"
    - "嵌套幻想框架元线（line 7-15 开场 → 83 扇耳光验证 → 321 揭穿十几年 → 327 倒影翻转）—— 包裹全篇的元叙事暗线"

