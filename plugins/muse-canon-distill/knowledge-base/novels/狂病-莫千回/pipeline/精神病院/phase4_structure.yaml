_meta:
  version: "1.0"
  chapter: "精神病院"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    7 Arc 闯关型结构 —— 逃生路线按楼层 / 关卡递进，副院长远程干预作为贯穿性反派压强。
    与《燃烧》连续受难型（每 Arc 死一人）不同：本篇前 5 Arc 几乎零主队减员（攒希望），
    死亡集中在 Arc 6（耿小桃）+ Arc 7（李亚伟 / 唐科）= 延迟悲剧。
    嵌套幻想框架（Arc 1 开场 + Arc 7 收尾翻转）作为元结构包裹全篇。

# === Arc 1: 嵌套幻想开场 + 精神病院日常 + 异常累积 ===

arc_1:
  label: "嵌套幻想开场 + 精神病院日常 + 李亚伟入院 + 副院长广播 + 病友病发预言末日"
  source_anchor: "line 5-55"
  sequences:
    - seq_id: "1.1"
      label: "汉恩基金广告 + 杨中旭的'特种兵来接'幻想 + 幻想框架建立"
      source_anchor: "line 5-25"
      core_conflict: "幻想中的英雄叙事 vs 病床上的囚禁现实"
      progression: |
        line 5 汉恩基金精神卫生中心广告（'这里没有病人，只有正在经历一段不太一样人生的人'）
        line 7-13 特种兵小队破门来接杨中旭去'拯救世界'—— 全力调动读者
        line 15 揭示这是杨中旭看着白墙的【日常发呆幻想】—— 文体一开篇就教读者'他活在幻想里'
        line 17-25 杨中旭来历（写丧尸日记被父母发现 → 诊断注意力缺陷 → 被送进私立精神病院 → 中度病区 / 吐药 / 禁手机 / 限放风）
      seq_climax: "幻想被戳破回到白墙 —— 嵌套幻想框架确立，为结尾元翻转埋雷"

    - seq_id: "1.2"
      label: "食堂初遇李亚伟 + 朋克自愿入院 + 带手机 + 副主楼广播'只有这里才是你们该待的地方'"
      source_anchor: "line 27-41"
      core_conflict: "李亚伟对精神病院的浪漫想象 vs 医院的真实压抑"
      progression: |
        门诊罕见排队（line 27 人满为患的早期征兆，实为狂病潜伏期亢奋人群涌入）
        食堂结识李亚伟（朋克 / 化烟熏妆 / 自愿入院 / 崇拜约翰尼 / 带手机 + 镜子）
        弑父佣兵被束缚衣推入医院（line 39 李亚伟讲述其灭门反杀往事）—— 郑云凡首次入场（远景）
        中度区会议：副院长广播'只有这里，才是你们该待的地方'（line 41）—— 话术-真相落差第一次显形
      seq_climax: "副院长广播的厌恶感'浓稠到快从广播里流出来' —— 反派据点定性的第一锚点"

    - seq_id: "1.3"
      label: "深夜病友病发预言末日 + 呼叫铃失灵 + 耿小桃理性误读'医疗事故'"
      source_anchor: "line 43-55"
      core_conflict: "病征/预言的暧昧 vs 理性解释的失效"
      progression: |
        司法病区护工议论'病人咬下医生指头才起效'（line 43）—— 狂病爆发的第一声异响
        精神分裂病友杨万新狂喊'地板下直通地狱，末日要来了，会死很多人'（line 47）+ 整夜呼叫铃无人应答
        耿小桃（律师 / 焦虑症）理性推理'医疗事故 / 药物出问题 / 假药'（line 51）—— 与真相擦肩
        走廊跑动声 / 尖叫 / 抱红色污渍的护士跑过（line 53）
      seq_climax: "病友'末日预言'既像病征又像预言 + 呼叫铃失灵 —— 激励事件累积起点"

  arc_progression_note: "Arc 1 = 建置 + 异常累积；用幻想框架 + 话术落差 + 末日预言三重铺垫，把封闭日常推向'有什么正在发生'"

# === Arc 2: 爆发确认 + 治疗变酷刑 ===

arc_2:
  label: "药量加大 + 取消放风 + 治疗器械变酷刑 + 张宁拆人体乐高 + 扇耳光确认丧尸真来了"
  source_anchor: "line 57-101"
  sequences:
    - seq_id: "2.1"
      label: "张宁把室友拆成'五眼脑袋圣诞树'人体乐高"
      source_anchor: "line 57-61"
      core_conflict: "感染者张宁的'游戏化嗜虐' vs 人体作为玩具的认知崩坏"
      progression: |
        感染者张宁在黑暗病房组装'人体乐高'：抠眼球塞嘴 / 拆肠子心脏 / 把人形挂输液架重组成圣诞树
        '五个眼球的脑袋当伯利恒之星' + 缠毛巾遮监控（line 61）
      seq_climax: "人体乐高圣诞树 —— 莫千回'游戏化嗜虐'写法在封闭机构的标志性意象 + 监控被遮（反派视野的第一处盲区）"

    - seq_id: "2.2"
      label: "清晨药量加大 + 取消放风 + 不让出病房 + 李亚伟传来命案消息'注意身边的人'"
      source_anchor: "line 63-73"
      core_conflict: "医院的封锁收紧 vs 病人对真相的无知"
      progression: |
        李亚伟趴探视窗 + 镜子 + 病房平静（line 63）
        清晨护士药量加大 / 取消放风 / 护工别电棍陪同 / 早饭专人送（line 65-67）—— 封锁收紧
        李亚伟手机打字告知：昨晚几起命案 + 患者杀光室友做成圣诞树 + 楼下有人打架 + '小心身边的人'（line 73）
      seq_climax: "'停了'（放风取消）+ 命案消息 —— 杨中旭看向厕所方向（室友进去很久）= 不祥伏笔"

    - seq_id: "2.3"
      label: "理疗/针灸时段：医护集体施虐（芒针刺眼 / 圆凳砸头 / 老式电疗仪电死绑缚病人）"
      source_anchor: "line 75-81"
      core_conflict: "治疗器械 vs 酷刑工具的恐怖反转"
      progression: |
        针灸室：医生倒苦水（'普通医师 / 蠢货儿子英语考十分'）→ 用芒针刺穿杨万新眼球（line 75）
        理疗室：医生用金属圆凳砸死护士、邪笑看向耿小桃（line 77）
        二号理疗室：老式电疗仪功率最大 + 四肢绑束缚带 + 病人咬断舌头惨死 + 护士与勒死的医生云雨欢笑（line 79）
        副院长监控全院屠杀 + 禁闭病房病患把手指插七窍（line 81）
      seq_climax: "治疗→酷刑的反转 —— 本篇独有 lore 顶点；副院长'这些东西就是社会的定时炸弹'内心独白 = 反派据点定性第二锚点"

    - seq_id: "2.4"
      label: "杨中旭堵厕所门 + 扇耳光验证非幻觉 + 室友被吐血染口尸变 + 哭着砸死室友"
      source_anchor: "line 83-101"
      core_conflict: "幻想癖好 vs 必须确认现实 / 信任 vs 自保"
      progression: |
        杨中旭用输液架堵厕所门防室友'尸变'（line 83）+ 扇自己上百耳光至流血、确认门外屠杀是真
        探视窗外感染者用头撞玻璃（数到第十三次裂、第二十次染红 line 87）
        窗外护工被挂树啃食 / 门诊楼医生坠楼被听诊器捅耳（line 89-93）
        室友被探视窗感染者吐血染口 → 当场尸变要'拔'杨中旭 → 杨中旭哭着用桌板砸死他（line 99）
        用输液架捅死探视窗感染者（line 101）
      seq_climax: |
        '扇耳光验证现实'= 幻想框架第一次显性确认 + 激励事件引爆。
        室友尸变（体液传染现场演示，对齐 phase1 transmission）+ 哭着砸死同伴 = 道德重负第一次落到杨中旭身上

  arc_progression_note: "Arc 2 = 灾难确认 + 认知崩坏；张宁乐高（远景嗜虐）→ 治疗酷刑（中景制度性恶）→ 扇耳光 + 砸死室友（近景主角入局），三段拉近镜头"

# === Arc 3: 结盟 + 逃生计划 ===

arc_3:
  label: "李亚伟抢钥匙带唐科会合 + 镜子侦察 + 杨中旭讲解十几年演练的逃生计划 + 开门放病友'增加目标'"
  source_anchor: "line 103-147"
  sequences:
    - seq_id: "3.1"
      label: "李亚伟抢钥匙开门进来 + 带上唐科 + 三人小队成型"
      source_anchor: "line 103-111"
      core_conflict: "墨守成规 vs 赌一把抢钥匙的生路"
      progression: |
        李亚伟感觉不对、装配合骗护士掏钥匙、爆气抢钥匙跑（line 103）
        带上唐科（昨夜还在扔屎、清晨突然神志正常 line 109 —— 与结尾呼应的伏笔）
        三人讨论'丧尸 vs 杀人狂'定性 + 李亚伟手机已坏无法查外界（line 107-109）
      seq_climax: "李亚伟'留在这里还是等待救援' —— 小队成型，desire 开始组织化"

    - seq_id: "3.2"
      label: "镜子侦察 + 病房门向外开的致命设计 + 感染工作人员有钥匙会开门"
      source_anchor: "line 113-119"
      core_conflict: "藏在病房的暂时安全 vs 病房无法真正反锁的结构性死局"
      progression: |
        用李亚伟化妆镜反射侦察楼道（护工被医生抽眼球 / 后门攻击 line 113）
        杨中旭点破：病房门向外开 + 门把手防伤害处理 = 内部无着力点拉门（line 117）
        感染工作人员有钥匙会依次开门 —— 留在病房=慢性死亡
      seq_climax: "病房无法反锁的结构性死局 —— '必须逃'的理由被坐实，囚禁建筑本身成对抗力量"

    - seq_id: "3.3"
      label: "杨中旭讲解十几年演练的多关卡逃生路线"
      source_anchor: "line 121-125"
      core_conflict: "杨中旭'病态熟悉'的价值 vs 同伴的将信将疑"
      progression: |
        路线：康复训练区取木棍拐杖 → 理疗区放射室取铅衣 → 司法病区上五楼 → 廊桥过康复楼 → 后山出（line 121-123）
        论证为何不直接下楼（楼下院子几十上百上千感染者 line 121）
        李亚伟大加赞赏'果然能像导游一样了解医院的人有两把刷子'
        唐科透露曾是优等班长、大半辈子在医院（line 125 —— 与结尾杨中旭十几年呼应）
      seq_climax: "杨中旭'一反平常的羞怯退让，仿佛真的变成准备冒险的勇士'—— '病'第一次转化为生存资本"

    - seq_id: "3.4"
      label: "做简易护甲 + 开门放病友'增加目标' + 跳舞病人被拽入探视窗"
      source_anchor: "line 127-147"
      core_conflict: "灰色利己计划 vs 残酷代价的现场显形"
      progression: |
        衣服报纸做护甲 + 镜子观察等时机出病房（line 125-127）
        杨中旭灰色提议'开门放更多病人出来增加目标趁乱逃'（line 139）→ 李亚伟反转成'积德'（黑色幽默）
        放出的病友多数恐惧不出 / 出来的精神不正常（散步 / 跳舞 line 143）
        跳舞病人被拽到关感染者的门前 → 被从狭小探视窗扭曲折断挤压拽入（line 147）
      seq_climax: "跳舞病人被拽入探视窗 —— '打破认知让恐惧飙升'；灰色计划的残酷代价首次显形"

  arc_progression_note: "Arc 3 = 结盟 + 计划成型 + 代价预演；从'三人结盟'到'路线讲解'到'放病友计划首次执行并见血'，逐步把希望与代价绑定"

# === Arc 4: 理疗区闯关（计划链峰值）===

arc_4:
  label: "穿越中度病区到理疗区 + 咨询台藏身 + 双瓶诱敌 + 针灸室自虐医生 + 电池引火 + 喷淋 + 漏电杀群"
  source_anchor: "line 149-203"
  sequences:
    - seq_id: "4.1"
      label: "出病房穿越中度病区 + 关门推门 + 咨询台藏身 + 伪救援断手 + 双瓶诱敌"
      source_anchor: "line 149-165"
      core_conflict: "潜行隐蔽 vs 感染者的随机开门 / 嗅觉锁定"
      progression: |
        弯腰潜行 + 顺手关开着的门 + 灭火器阻视线 + 桌板/输液架配合杀感染者（line 149）
        咨询台藏身 + 感染者逼近差点被发现（line 155）
        '垂下的手'是尸体残肢非救援（line 157）—— 伪救援/希望落空微节拍
        杨中旭血染药瓶 + 双瓶分两次诱敌（先近后远）成功引走感染者（line 161-163）
      seq_climax: "双瓶诱敌脱困 —— 杨中旭'制造异响调虎离山'计谋首次完整执行"

    - seq_id: "4.2"
      label: "冲过大门 + 二号病区 + 针灸室遇自虐医生 + 找到芒针/酒精 + 认出杨万新尸体"
      source_anchor: "line 165-177"
      core_conflict: "速度逃命 vs 感染者高速追击"
      progression: |
        感染者高速追击（'磕了药一样'）→ 险关厚重大门（line 165-167）
        二号病区报到机吐染血号码单（'地狱排序'意象 line 169）+ 牵引治疗室扯断四肢（line 171）
        针灸室外认出被插成刺猬 + 后脑一米芒针的杨万新尸体（line 173）
        针灸室遇自虐医生（往身上插针玻璃）→ 三人配合放倒 + 取两根芒针/酒精/矿泉水（line 177）
      seq_climax: "认出杨万新尸体 —— '现实里感受到的一切比想象中沉重百倍'，主角的幻想与现实重量差被点出"

    - seq_id: "4.3"
      label: "电池引火 → 氧气罐喷火 → 火警喷淋 → 地面积水扯电线漏电秒杀整群"
      source_anchor: "line 179-197"
      core_conflict: "绝境包围 vs 杨中旭的物理连锁计谋"
      progression: |
        感染者群从多科室围出（line 177）→ 杨中旭问李亚伟带没带打火机/手机
        损坏电池被芒针刺穿引燃酒精浸的衣服（line 185）→ 挑到氧气罐喷口引火蛇（line 187）
        从后门跑回楼道 → 火警触发全层喷淋浇灭火焰也浇湿感染者（line 191）
        推移动病床到紧急通道指示牌旁 → 扯断指示牌电线丢入积水 → 触电秒杀湿透感染者群（line 193）
        10 秒致死时间 + 抢在备用电源前用床单挑起电线（line 195-197）
      seq_climax: "漏电秒杀整群感染者 —— 本篇最长最完整'计划链'，物理逻辑环环相扣，希望累积达峰值"

    - seq_id: "4.4"
      label: "理疗区肃清 + 取铅衣 + 救出耿小桃 + 同伴对杨中旭'病态熟悉'的钦佩"
      source_anchor: "line 199-215"
      core_conflict: "短暂安全 vs 杨中旭暴露'入院很久'的身份伏笔"
      progression: |
        电力恢复 + 理疗区彻底安全 + 同伴钦佩（'知道电死人要几秒'line 201，来自当电工的病友）
        放射室因火警门锁释放 → 取三套分体铅衣（line 211）
        发现并救出涂尸自保的耿小桃（line 205-209）→ 配齐输液架/灭火器/电棍/拐杖/芒针/流星锤（line 213）
        李亚伟惊讶'上学就进来了，待了很久'（line 201）—— 杨中旭入院时长伏笔第二次
      seq_climax: "耿小桃归队 + 装备配齐 —— 主队零减员且扩员，希望高位运行（为后续集中收割蓄势）"

  arc_progression_note: "Arc 4 = 计划链峰值 + 希望累积顶点；潜行脱困→针灸室遭遇→火电连锁杀群→肃清扩员，四段越打越顺，是全篇'病=优势'兑现最充分的 Arc"

# === Arc 5: 司法病区（首次重大挫败 + 反派转主动）===

arc_5:
  label: "上司法病区遇开着的铁门 + 杨中旭贪枪被缝嘴感染者拽入 + 防爆服魁梧感染者 + 郑云凡手铐勒杀 + 副院长开门禁"
  source_anchor: "line 217-243"
  sequences:
    - seq_id: "5.1"
      label: "逃生通道异常安静 + 司法病区铁门竟开着 + 杨中旭贪枪被缝嘴感染者拽入"
      source_anchor: "line 217-223"
      core_conflict: "稳妥关门 vs 贪取手枪的致命诱惑"
      progression: |
        逃生通道反常安静 + 司法病区上方铁门竟开着（最糟情况 line 219）
        门槛扒着手指 → 自尽警察尸体（枪口对自己 / 半个脑袋没了 line 221）
        杨中旭贪取手枪 → 被缝嘴 + 订书针固定眼皮的伏击感染者拽入门中（line 223）
      seq_climax: "贪枪被拽入 —— 杨中旭唯一一次重大决策失误，把全队拖入司法病区险境"

    - seq_id: "5.2"
      label: "防爆服两米魁梧感染者 + 嵌牙木棒砸铅衣 + 郑云凡手铐链条勒断其脖"
      source_anchor: "line 225-231"
      core_conflict: "凡人体能 vs '练靶手'型超强感染者 / 外援登场"
      progression: |
