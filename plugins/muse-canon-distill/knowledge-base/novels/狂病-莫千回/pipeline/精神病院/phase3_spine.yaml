_meta:
  version: "1.0"
  chapter: "精神病院"
  source: "novels/狂病-莫千回/精神病院.md"
  word_count_approx: 53000
  validated_against_source: true
  form_note: |
    第三人称限知 POV，主线锚在杨中旭（住院少年），但全篇高频切到副院长 / 郑云凡 / 张宁 / 杨万新 / 耿小桃 等的内聚焦段落 ——
    属于"主角 + 群像旁支"的复调式第三人称（与《地铁》多线并行不同：本篇仍以杨中旭为唯一脊椎，旁支只作世界图景的补全）。
    最关键的文体装置是【嵌套幻想框架】：
      开篇 line 7-13 用一段"特种兵来接他去拯救世界"的桥段全力调动读者，line 15 才揭示这是杨中旭的【日常发呆幻想】——
      文体一开篇就教读者"这个人活在幻想里"，为结尾的元叙事翻转埋雷。
    line 321-327 收尾翻转：杨中旭自称 18 岁，但李亚伟 / 唐科指出他已入院"十几年"；水坑倒影先映出 18 岁青年、被雨打散后拼回一个"留板寸、有青胡茬的中年男人"——
      全篇的"逃出精神病院"很可能是这个被领养、被弃、在病床上幻想了十几年逃生路线的中年病人的一次【幻想与现实难分的出走】。
    因此本篇的恐怖有两层：表层是狂病爆发的精神病院屠场；里层是"什么是真的"始终悬置 ——
      读者无法确证杨中旭的逃亡是实际发生、还是他第无数次的病床幻想，抑或灾难真来了而他借着排练好的幻想活了下来。
    分析按"叙事表层为真"处理事件因果（幻想框架作为文体 / 主题层标注），不强行裁定哪段是幻觉。

  world_alignment:
    verdict: |
      汉恩基金精神卫生中心（私立精神病院）= 【伪装成避难所话术的屠宰场 / 反派据点】，而非真避难所。
      它同时携带三重世界观功能：
      (1) 商业话术陷阱：开篇 line 5 广告用"我们不羡慕你，我们陪你重新认识你自己 / 这里没有病人，只有正在经历一段不太一样人生的人"包装收容 ——
          与《学校》一楼锁链、《恶》廖振宇系统性诱杀同属"人类反派的系统性囚禁布局"谱系（phase1 trap_imagery）。
      (2) 反派据点（个人执念型）：副院长（line 311-313）家人被一个"装病脱罪"的精神病患灭门，从此把医院打造成"让精神病人永远待在这里、甚至死在这里"的私人监狱；
          灾难爆发后他用全院电子门 / 黑钢板封锁 + 广播诱导感染者，主动猎杀想逃的幸存者 —— 是吴先生 / 廖振宇之外的【第三类人类反派：以"净化社会"为名的偏执屠夫】。
      (3) 它【不是】跨篇符号"机场旁医院"。本篇是另一所机构（私立精神卫生中心），与 phase1 airport_hospital（军方驻扎传闻）是不同地点 ——
          但功能上构成对位：airport_hospital 是"传闻中的避难所，从不抵达"；汉恩基金是"已抵达的避难所，但里面是地狱" —— 两者共同坐实"本系列没有制度性救赎"（phase1 design_intent.what_world_NOT_does）。
    reason: |
      与 phase0/phase1 既有判定一致且做了实质推进：
      - phase1 open_questions 把"汉恩基金精神卫生中心的世界观角色"列为待解；本篇给出答案 = 陷阱型反派据点（line 5 广告 vs line 41 / 81 / 311-313 副院长真面目）。
      - 不改 phase0/phase1，仅作 part-local 锚定。机场旁医院的真伪本篇【未触及】，保持悬置。
      - 病毒在本篇仍是狂病同源（无差别狂笑 + 嗜虐 + 痛觉缺失 + 力量异常 + 体液传染 + 颅脑致命 + 进化战术），世界观规则全部对齐 phase1 mad_disease_rules，无新增病理。
      - 本篇独有 lore：狂病在【封闭机构】内爆发的形态 —— 医护用"治疗器械"（针灸芒针 / 老式电疗仪 / 听诊器 / 输液架）施虐，把"医疗"反转成酷刑；
        以及"该进精神病院的人没进来、进来的不该死"这一社会寓言层（line 39 / 71 / 313），把狂病的"网络暴力 / 反社会人格实体化"主题（phase1 design_intent）落到"精神疾病污名化"的具体场域。

# === 脊椎 ===

spine:
  protagonist: "杨中旭（私立精神病院中度病区患者，自称 18 岁，实际入院'十几年'的被领养者）"
  spine_mode: "desire"
  desire_object: "活着逃出爆发了狂病的精神病院 → 把在病床上幻想了十几年的逃生路线变成现实，离开这个'枯燥乏味的地方'"
  shadow_desire: |
    杨中旭真正要的不是"逃出医院" ——
    是"证明自己的幻想（自己没病 / 自己的想象不是病征）是有用的、是对的" ——
    所以当爆发真的来临，他既恐惧又"夹杂着一些小激动"（line 83）：
      这是他演练了十几年的剧本第一次有机会上演。
    更深一层（被结尾翻转揭出）：他要的是【长大 / 离开】本身 ——
      被养父母抛弃、在病床上停滞了十几年的少年，靠这场（真假难辨的）逃亡完成"该逃出去了"的成人礼。
  conscious_vs_unconscious:
    conscious: "找武器 / 规划路线 / 一层层往康复楼后山逃 / 带同伴活着出去"
    unconscious: |
      杨中旭没有"自己可能有病 / 自己已经被困了十几年"的现实感 ——
      他活在"我是这里最正常的人"（line 19）的自我叙事里。
      他对医院地形 / 设施 / 电死人要几秒 / 喷淋喷多久的"超常熟悉"，
        既是十几年观察的产物，也是他幻想成瘾的证据 ——
      逃生计划的每一次成功，都在替他回避一个问题：如果这一切只是又一次幻想呢？

# === 激励事件 ===

inciting_incident:
  event: "深夜精神分裂病友病发狂喊'末日要来了' + 整夜呼叫铃无人应答 + 次日清晨药量被加大 + 全院取消放风 —— 异常累积到杨中旭确认'真的有丧尸'"
  source_anchor: "line 47-67, 83"
  type: "causal"
  delay_from_opening_chars_approx: 6800
  function: |
    本篇激励事件是【渐进累积型】而非单点爆破：
      line 47-49 病友病发预言 + 呼叫铃失灵（异常起点）
      line 51 耿小桃律师式推理"医疗事故 / 药物出问题"（理性误读 —— 与真相擦肩）
      line 65-67 药量加大 + 取消放风 + 不让出病房（封锁收紧）
      line 83 杨中旭扇自己上百耳光验证不是幻觉、确认门外屠杀是真 —— 平衡彻底打破，desire 启动。
    "扇耳光验证现实"这一动作既是激励事件的引爆点，也是【幻想框架】的第一次显性确认：
      一个习惯分不清幻想与现实的人，必须用自残来确认"这次是真的"。
    末日开篇的标准节奏（异常累积 → 确认灾难 → 进入求生）被嵌进精神病院的封闭设定，
      "病人喊末日"既像病征又像预言，是莫千回式反讽的开场。

# === 戏剧问题 ===

dramatic_question:
  main: "杨中旭能不能靠他在病床上幻想了十几年的逃生计划，真的活着逃出这座爆发狂病、还有副院长主动猎杀的精神病院？"
  subtext: |
    在一个"该进来的人没进来、进来的人不该死"（line 313）的颠倒世界里，
      一个被诊断为"病人"、被全社会判定为不正常的人，
      他的"不正常"（沉迷丧尸逃生幻想）到底是病，还是恰好让他成为唯一能活下来的人？
    更深的悬置：如果他的逃亡本身也是一次幻想，那"逃出去"还算不算真的逃出去？
  payoff: |
    答案是悖论式且双层的：
      表层 —— 杨中旭的幻想计划【真的奏效】：电池引燃 → 引火警 → 喷淋 → 漏电 → 触电杀群，一环扣一环（line 185-197）；
        他靠"不正常"（对医院的病态熟悉 + 演练成瘾）活到了最后，"病"成了生存优势 —— 坐实 phase0 candidate_b（道德 / 常态拖累生存，异常者活）。
      里层 —— 但同伴一个个死去（耿小桃自我牺牲 line 299-307 / 李亚伟内伤吐血而亡 line 317-321 / 唐科回家后安然离世 line 323-325），
        最后只剩杨中旭独自走进黄金大厦 —— 他"赢了"，代价是又一次独自一人，且连"自己赢了什么 / 这是不是真的"都无法确证。
    结尾 line 327 杨中旭对黄金大厦守门人老张说"老子可他妈是从几千人的地狱死路里爬出来的" ——
      这是 desire 的兑现，也是 shadow_desire 的完成：那个柔软的、停在 18 岁的少年，终于"充满刺"地长大、离开了（李亚伟遗言 line 321）。

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: |
      感染者群（爆发于全院）:
        被改造成酷刑工具的医护（用芒针刺眼 / 老式电疗仪过载电刑 / 听诊器捅耳 / 圆凳砸头 line 75-79, 93）、
        把室友拆成"乐高积木 / 圣诞树"的患者张宁（line 57-61）、
        人体乐器演奏团（小号套肺叶 / 腿骨当鼓槌 / 阴茎当指挥棒 line 271）、
        穿防爆服的两米魁梧安保感染者（"练靶手"型 line 225-229）、
        人皮风筝 / 人脸公交站牌 / 鱼缸里的人头"章鱼"（line 251, 263, 279）
    layer_2_environment: |
      精神病院的【囚禁性建筑】本身就是对抗力量：
        病房门向外开 + 门把手做了防伤害处理 = 内部无法拉住门（line 117）、
        中度病区夜间锁门 / 手机禁带 / 放风限时（line 23, 47）、
        司法病区电子门禁、消防联动系统（开一扇门会自动开对侧逃生门 line 293）、
        全楼隐藏的黑色钢板封闭装置（line 287）
    layer_3_evolution: |
      狂病同源进化战术在封闭场域的具体化:
        自残嘴部隐藏（line 223 嘴被针线缝住 + 眼皮被订书针固定的伏击者）、
        魁梧者作"练靶手" / 群体核心（line 225-229 两米防爆服感染者，对应 phase1 differentiation）、
        会用武器（嵌牙齿 + 铁丝的木棒 line 229 / 菜刀 / 金属管 line 113）、
        感染者攻击同类（line 159 被啃下的同类头颅）、
        享受 + 炫耀杀戮而非反射攻击（line 169 "和人类一样有逻辑"）
  interpersonal:
    layer_1: "病友 / 室友的不确定性 —— '越看着正常的越要注意'（line 29）；被吐血染口的室友当场尸变要'拔'杨中旭（line 99）"
    layer_2: |
      副院长（本篇核心人类反派）:
        广播诱导感染者 / 远程开门禁 / 降黑钢板封死后门（line 239, 241, 281, 287）—— 主动把幸存者往死路逼
    layer_3: "队伍内部的'自我牺牲伦理' —— 耿小桃自愿赴死（line 299）/ 李亚伟'让我留在这'（line 317-321）—— 不是背叛，是莫千回少见的'利他链式死亡'"
  internal:
    layer_1: "杨中旭分不清幻想与现实（开篇幻想框架 / 扇耳光验证 line 83）"
    layer_2: "对决策致死同伴的愧疚（'整个计划都是他提出来的' line 151）—— 领路人的道德重负"
    layer_3: "被领养 + 被弃 + 停滞十几年的身份创伤（line 327）—— '长大 / 离开'本身是最深的内在阻力"
  societal:
    - "精神疾病污名化：该进精神病院的人没进来、进来治疗的不该死（line 39, 71, 313）—— 本篇独有的社会寓言层"
    - "私立精神病院的商业话术（line 5 广告）/ 父母'支付好全额退款'承诺把孩子送进来（line 19）—— 制度化弃置"
    - "副主楼监控 / 广播 / 监视器套娃 —— 与 phase1 public_imagery'录像 / 直播 / 监控屏多层窥镜套娃'同源"
    - "AI 监控的世界观锚点：李亚伟问'是不是 AI 监控'，杨中旭反问'AI 是什么'（line 239）—— 印证杨中旭与世隔绝十几年"

# === Arc 框架 ===

arc_framework:
  total_arcs: 7
  notes: |
    本篇是全系列字数最高的一篇（约 5.3 万字），Arc 结构呈【楼层递进型】：
      逃生路线 = 中度病区 → 理疗区 → 司法病区 → 五楼储藏区 → 廊桥过康复楼 → 康复楼自上而下到一楼后门，
      每个 Arc 大体对应一个楼层 / 关卡，叠加"副院长的远程干预"作为贯穿性反派压强。
    与《燃烧》的"连续受难型（每 Arc 死一人）"不同，本篇是"闯关型 + 三段集中死亡"：
      前 5 个 Arc 几乎零主队减员（靠杨中旭的计划接连闯关成功 = 希望持续累积），
      死亡集中在 Arc 6（耿小桃）与 Arc 7（李亚伟 / 唐科），形成"先攒希望、再一次性收割"的延迟悲剧结构。
    幻想框架（Arc 0 / 收尾）作为元结构包裹全篇。

  arc_1_setup_psych_ward:
    label: "嵌套幻想开场 + 精神病院日常 + 李亚伟入院 + 副院长广播 + 病友病发预言末日"
    value_starting: "枯燥乏味的囚禁日常（伪安宁）"
    value_ending: "异常累积 + '末日要来了'预言 + 呼叫铃失灵（不安启动）"
    climax_event: "深夜精神分裂病友狂喊'地板下直通地狱，末日要来了，会死很多人'（line 47）+ 整夜呼叫铃无人应答"
    source_anchor: "line 5-55"
    function: |
      用幻想框架（line 7-15）一开篇就教读者"杨中旭活在幻想里" —— 为结尾元翻转埋雷。
      建立汉恩基金广告（line 5）vs 副院长广播"只有这里才是你们该待的地方"（line 41）的【话术-真相落差】。
      引入李亚伟（朋克 / 自愿入院 / 唯一带手机镜子的人）+ 耿小桃（律师 / 焦虑症 / 理性推理者）+ 杨万新（精神分裂 / 末日预言者）。
      病友的"末日预言"既是病征又是预言 —— 莫千回式反讽开场。

  arc_2_outbreak_confirmed:
    label: "药量加大 + 取消放风 + 治疗器械变酷刑 + 张宁拆人体乐高 + 杨中旭扇耳光确认丧尸真来了"
    value_starting: "不安（异常累积）"
    value_ending: "确认灾难 + 第一次独自杀感染者（认知崩坏 + desire 启动）"
    climax_event: |
      理疗 / 针灸时段医护集体施虐（医生用芒针刺穿杨万新眼球 line 75 / 圆凳砸死护士 line 77 / 老式电疗仪电死绑缚病人 line 79）+
      杨中旭扇自己上百耳光验证非幻觉（line 83）+ 室友被感染者吐血染口后尸变、杨中旭哭着用桌板砸死他（line 99）
    source_anchor: "line 57-101"
    function: |
      本篇独有 lore 顶点：把"治疗"反转成"酷刑" —— 针灸芒针 / 电疗仪 / 听诊器全部成为施虐器械。
      张宁把三个室友拆成"五眼脑袋圣诞树"乐高（line 57-61）= 莫千回"游戏化嗜虐"写法在封闭机构的标志性意象。
      "扇耳光验证现实"= 幻想框架第一次显性确认 + 激励事件引爆。
      室友尸变（被吐血染口 line 99）= 体液传染规则在本篇的现场演示，对齐 phase1 transmission。

  arc_3_alliance_and_plan:
    label: "李亚伟抢钥匙带唐科会合 + 镜子侦察 + 杨中旭讲解十几年演练的逃生计划 + 开门放病友'增加目标'"
    value_starting: "确认灾难（孤立求生）"
    value_ending: "三人小队成型 + 逃生计划启动（希望被组织起来）"
    climax_event: "杨中旭完整讲出'康复训练区取武器 → 理疗区放射室取铅衣 → 司法病区上五楼 → 廊桥过康复楼 → 后山出'的多关卡路线（line 121-123）"
    source_anchor: "line 103-147"
    function: |
      引入唐科（昨夜还在扔屎、清晨突然神志正常 line 109 —— 与结尾杨中旭的"清醒"呼应的伏笔）。
      李亚伟的化妆镜（line 115）成为关键侦察道具（用反射看楼道，不冒险探头）—— 道具承担紧张。
      杨中旭对医院的病态熟悉第一次转化为生存资本（"病"= 优势）。
      "开门放病友增加逃跑目标"（line 139）= 杨中旭的灰色决策，被李亚伟反转成"积德"（黑色幽默）；
        但放出的病友多数自顾散步 / 跳舞（line 143），随即被感染者撕入探视窗（line 147）—— 计划的残酷代价首次显形。

  arc_4_physio_zone_gauntlet:
    label: "穿越中度病区到理疗区 + 咨询台藏身 + 双瓶诱敌 + 针灸室遇自虐医生 + 电池引火 + 喷淋 + 漏电杀群"
    value_starting: "逃生计划启动（希望）"
    value_ending: "理疗区彻底肃清 + 拿到铅衣 / 武器（关卡通关，希望大涨）"
    climax_event: |
      杨中旭用手机损坏电池被芒针刺穿引燃衣服（line 185）→ 引爆氧气罐喷火（line 187）→ 火警触发全层喷淋（line 191）→
      地面积水 + 扯断指示牌电线漏电 → 触电秒杀整群湿透感染者（line 193-195）
    source_anchor: "line 149-203"
    function: |
      本篇最长、最完整的"杨中旭计划链"展示 —— 物理逻辑环环相扣（电池火星 / 氧气罐 / 喷淋 / 漏电 / 10 秒致死时间）。
      "病态熟悉"全面兑现：他知道喷淋喷十分钟、火警与电力分开、电死人要几秒（line 199-201，来自当电工的病友）。
      双药瓶诱敌（line 161-163）+ 咨询台垂手是尸体残肢非救援（line 157）= 莫千回"伪救援 / 希望落空"微节拍。
      此 Arc 是"希望累积"的峰值 —— 主队零减员，连耿小桃都获救加入（line 205-209）。

  arc_5_judicial_ward_mercenary:
    label: "上司法病区遇开着的铁门 + 杨中旭贪枪被缝嘴感染者拽入 + 防爆服魁梧感染者 + 郑云凡手铐勒杀 + 副院长开门禁"
    value_starting: "通关希望（高位）"
    value_ending: "险些团灭 + 郑云凡自我隔离 + 副院长主动放感染者（希望被反派强行收回）"
    climax_event: |
      郑云凡用手铐链条勒断两米防爆服感染者的脖子（line 229）+ 自承可能已感染、主动退回病房自我隔离（line 233）+
      副院长骂"精神病就该全部去死"、远程打开安保拼死关上的隔离门禁（line 241）
    source_anchor: "line 217-243"
    function: |
      引入郑云凡（佣兵 / 弑父者 / 跨篇候选）—— phase0 candidate 的"反英雄生存者"变体：战力最强、最该活，却因可能感染主动赴死。
      "贪枪 → 被缝嘴感染者拽入 → 险死"（line 221-223）= 杨中旭唯一一次重大决策失误，付出代价（被嵌牙木棒砸 line 229）。
      副院长第一次从"被动监控者"转为"主动猎杀者"（开门禁 line 241）—— 人类反派压强陡增。
      防爆服两米感染者 = phase1 "练靶手 / 群体核心"魁梧者的本篇实体。

  arc_6_recovery_building_descent:
    label: "五楼储物 + 廊桥过康复楼 + 自上而下逐层（轮椅老人 / 图书管理员 / 人体乐器团）+ 副院长广播诱敌 + 黑钢板封死 + 耿小桃自我牺牲开门"
    value_starting: "暂稳（五楼休整 + 拿到清洁剂 / 流星锤）"
    value_ending: "后门被黑钢板封死 + 耿小桃撞柱自尽换防火门彻底关闭（深渊 + 第一次主队牺牲）"
    climax_event: |
      副院长降下全楼黑钢板封死后门（line 287）→ 防火门被卡死无法关 → 必须有人留在另一侧重启 + 破坏面板（必死 line 293）→
      耿小桃自愿钻过门缝、哭着关门破坏面板、最后撞柱自尽（line 299-307）
