    function: |
      康复楼"自上而下"逐层下降 = 物理上的下沉对应价值下沉。
      人体乐器演奏团（line 271）/ 人皮风筝（line 251）/ 鱼缸人头"章鱼"（line 263, 279）= 感染者"多元化嗜虐"进化的意象群顶点。
      副院长动机揭示（line 311-313 家人被装病脱罪的精神病患灭门）= 第三类人类反派的完整建立。
      耿小桃之死 = 本篇第一次主队死亡，且是【利他型自我牺牲】（"石中剑 / 天选之人 / 让我做一次大侠" line 301）——
        与《燃烧》李太太的自私链式死亡形成反向对位：本篇的牺牲是主动的、悲壮的。

  arc_7_exit_relay_and_meta_reveal:
    label: "副院长放行 + 走出医院 + 李亚伟雨中辞世留'黄金大厦'指引 + 唐科送杨中旭回家后安然离世 + 元叙事翻转（18 岁→中年人）+ 走进黄金大厦"
    value_starting: "走出地狱（虚假的解脱）"
    value_ending: "独自一人 + 完成'长大 / 离开'+ 走进黄金大厦（desire 兑现 + shadow_desire 完成 + 真相悬置）"
    climax_event: |
      李亚伟雨中咳血、要求"让一切停在这一刻"、揭穿杨中旭已入院十几年、留遗言"成年人不会因柔软被保护，你要充满刺"+ 指引黄金大厦（line 317-321）；
      杨中旭水坑倒影从 18 岁青年被雨打散、拼回中年男人（line 327）；
      黄金大厦守门人老张轻蔑盘问，杨中旭抬头"老子可他妈是从几千人的地狱死路里爬出来的"（line 327）
    source_anchor: "line 309-327"
    function: |
      全篇 main climax + closing reversal + 元叙事翻转三合一。
      副院长在耿小桃之死后崩溃悔悟（line 311-315），主动放行并把自己永远封在医院里 = 反派的自我审判式收束。
      "利他链式死亡"完成：耿小桃（自牺牲）→ 李亚伟（内伤而亡 + 传递遗言与黄金大厦坐标）→ 唐科（回家清醒后安然离世 + 把坐标写进杨中旭口袋）——
        三人都把"活下去 / 长大"的责任接力传给杨中旭，与《燃烧》罗允"转达遗言"、《学校》罗允拾日记本同属【传火 / 读者代理人】谱系。
      元翻转把全篇拉回主题原点：什么是真的？杨中旭是真的逃出来了，还是又一次幻想？文本拒绝裁定。
      跨篇钩：黄金大厦 / 老张 = 与《黄金国》《死亡奔赴》末日避难所寓言线的明确缝合点。

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "李亚伟雨中辞世 + 揭穿杨中旭入院十几年 + 留遗言指引黄金大厦；杨中旭水坑倒影翻转为中年男人；走进黄金大厦自报'从几千人地狱死路爬出来'"
    source_anchor: "line 317-327"
    why_climax: |
      全篇价值层与文体层在此一齐引爆：
      - 杨中旭从开篇"活在幻想里、自称最正常、停在 18 岁"→ 末尾"被点破十几年、倒影变中年、充满刺地走进新世界"，完成最大的人物真相揭示与价值变化。
      - 嵌套幻想框架在此闭环：开篇教读者"他活在幻想里"，结尾让"逃出医院"本身也悬置为可能的幻想 —— 恐怖从"屠场"升维到"什么是真的"。
      - 三位同伴的利他死亡在此完成传火，杨中旭"赢"的代价（再次独自一人）与"赢"的意义（长大 / 离开）同时落定。

  closing_reversal:
    event: "水坑倒影：18 岁青年被一滴雨打散 → 涟漪平静后拼回一个留板寸、有青胡茬的中年男人（line 327）"
    source_anchor: "line 327"
    function: |
      不是 happy ending 也不是 hopeless ending —— 是 ambiguous / awakening ending（觉醒式悬置结局）。
      读者被迫重读全篇：杨中旭的逃亡是实际发生、是十几年病床幻想的又一次排练、还是灾难真来时他借排练好的幻想活了下来？三种读法并存。
      与《学校》日记体 + 罗允续行、《地铁》POV 转交、《燃烧》第二人称盲女同属莫千回的【POV / 元叙事实验】谱系 ——
      本篇的实验是"幻想框架 + 元翻转"，把"看见 / 记录"的主题推进到"什么是真实"。

  controlling_idea_for_this_chapter: |
    "在一个该死的人活着、不该死的人被关起来等死的颠倒世界里 ——
     被判定为'不正常'的人，恰恰因为不正常而活了下来；
     而真正的逃脱不是逃出哪座楼，是停止做那个等着被保护的、柔软的孩子，
     哪怕你永远无法确定，你逃出的究竟是医院，还是你自己的幻想。"
    （主映射全系列 candidate_b：'真正能在末日里活下来的，未必是好人 —— 道德感 / 常态往往拖累生存'；
      副带 candidate_c：副院长'净化社会'的善意执念比单纯的恶更危险，李亚伟 / 唐科'活着就有希望'的善意把活下去变成杨中旭的债务。）

