# === 节奏曲线 ===

pacing_curve:
  arc_1: "缓"  # 幻想开场 + 日常 + 末日预言累积
  arc_2: "缓 → 急"  # 张宁乐高 → 治疗酷刑 → 扇耳光确认 + 砸死室友
  arc_3: "中"  # 结盟 + 计划成型 + 放病友见血
  arc_4: "急升 → 极急"  # 潜行脱困 → 火电连锁杀群（希望峰值）
  arc_5: "急转直下"  # 贪枪失误 → 险团灭 → 郑云凡退场 → 副院长开门禁
  arc_6: "缓(五楼休整) → 极急"  # 下降 + 意象群顶点 → 黑钢板封死 → 耿小桃自尽
  arc_7: "静 → 急 → 余韵"  # 副院长自审 → 李亚伟/唐科辞世 → 元翻转倒影
  notes: |
    闯关型 + 延迟悲剧 —— 与《燃烧》连续受难（每 Arc 死一人）相反：
    前 5 Arc 几乎零主队减员（一路通关、希望持续累积，Arc 4 达视觉峰值'朝阳火光'），
    死亡集中压到 Arc 6-7 一次性收割（耿小桃→李亚伟→唐科），制造'攒得越高、跌得越重'的延迟悲剧；
    元翻转再把'胜利'本身悬置，余韵层叠加'什么是真实'的二次回味。

