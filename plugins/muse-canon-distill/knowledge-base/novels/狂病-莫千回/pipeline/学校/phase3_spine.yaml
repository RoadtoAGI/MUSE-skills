_meta:
  version: "1.0"
  chapter: "学校"
  source: "novels/狂病-莫千回/学校.md"
  word_count_approx: 13000
  validated_against_source: true
  form_note: |
    日记体第一人称 —— 全篇是 POV「我」的逐日日记（4/16-4/20 五则带日期的条目 + 两段无日期断章），
    末尾（line 223-235）切换为第三人称限知，由跨篇人物罗允拾起日记本接续 = 文学层面的「读者代理人」收笔。
    系列时间锚点首篇：爆发首日 2023-4-16 在此明确（line 5）。

# === 脊椎 ===

spine:
  protagonist: "「我」（某高校男生，本名未提，日记记录者；宿舍四人之一）"
  spine_mode: "desire"
  desire_object: "活着逃出宿舍楼 → 翻墙坐上秦胜哥加满油的轿车 → 到军民两用机场 / 大警局这样的「安全的地方」"
  shadow_desire: |
    「我」想要的不只是逃生 ——
    是「不再对外界一无所知」（line 41 自陈：最折磨人的是对外界的一无所知）；
    是在四个舍友的小集体里继续被裹挟、不用一个人承担选择 ——
    所以当社长 / 狗子 / 秦胜哥相继消失、只剩「我」一人将死时，
    shadow_desire 彻底落空：既联系不到外界（网络瘫痪），也没有了集体（全员死光），
    最终「我」用「怕疼」这个最人性的理由主动吞下感染断指（line 217-219）= 用自感染逃避「独自清醒地痛」
  conscious_vs_unconscious:
    conscious: "给手机充电联系外界 / 躲在宿舍撑过去 / 翻墙坐车去机场 / 锁铁门逐层撤退"
    unconscious: |
      「我」从头到尾是「拦阻者 + 记录者」而非「决断者」——
      line 25 拦住社长不让出门、line 37 拉住秦胜哥、line 141 主张继续躲；
      「我」真正需要的是「有人替我把命运的方向定下来」，
      所以秦胜哥 + 社长一起看向「我」时（line 153），「我」只能跟着拼命；
      当集体死尽、再没有人替「我」决断时，「我」的活法也随之失效 ——
      自感染（line 217）是把最后一个决断（怎么死）也交给病毒

# === 激励事件 ===

inciting_incident:
  event: "回笼觉中被窗外嚎叫惊醒 + 拉开窗帘看见五六个学生满脸笑容追打满头是血的男生 + 砸头"
  source_anchor: "line 19"
  type: "accident"
  delay_from_opening_chars_approx: 1500
  function: |
    用「日常逃课睡回笼觉」的最松弛状态被一声嚎叫击穿，把全篇从校园流水账瞬间推入末日 ——
    关键在「满脸笑容」：第一眼像打闹（line 19「我甚至都以为只是在开玩笑打闹」），
    病征的「狂笑」先于任何解释出场，读者和「我」同步地「先看见、后理解」。
    日记体让激励事件天然带「事后回溯」语气（line 17「现在想一下，如果那个时候不懒就好了」），
    平衡被打破的瞬间已被叙述者标记为「悔之晚矣」。

# === 戏剧问题 ===

dramatic_question:
  main: "被困四楼宿舍的「我」和三个舍友，能不能活着逃出这栋已经变成屠宰场的宿舍楼？"
  subtext: |
    在一个「躲着会饿死、冲出去会被撕碎」的双输处境里，
    「不做决断、只跟着集体」的人，能不能靠集体活下来？
    或者反过来：当替你决断的人一个个死去，最后只剩你自己时，
    你还有没有「自己选择怎么活 / 怎么死」的能力？
  payoff: |
    答案是彻底否定的：
    集体逐层瓦解（狗子感染被杀 → 社长逃楼时被撕成碎块 → 一楼铁门被外部锁链锁死 → 三楼跳楼双双瘫痪），
    每一道「逃生方案」都被证伪，最后连「逃」这个动作本身都失去意义；
    「我」唯一能做的「选择」，是把怎么死也交出去 —— 吞下狗子断指自感染（line 217），理由是「怕疼」（line 219）。
    而日记本被罗允拾起继续上路（line 223）—— 戏剧问题的真正回答不在「我」这里，
    在「下一个读到这本日记的人」那里：活下来的从来不是写日记的人，是接着走的人。

# === 对抗力量（按层）===

antagonistic_forces:
  external:
    layer_1_physical: |
      感染者群（狂笑 + 痛觉缺失 + 力量异常）—— 楼下追打砸头（line 19）、对面楼扔人 / 拽断胳膊（line 29, 33）、
      门外撞门辱骂（line 25）、楼道围堵（line 69）、走廊伏击拉倒秦胜哥（line 163）、
      三楼折磨被铁丝捆绑的幸存者（line 185）、跟着跳楼的十几个感染者（line 215）
    layer_2_environment: |
      宿舍楼本身变成牢笼 —— 四楼高度（line 141）、停电电梯不可用（line 141）、
      逐层铁门（line 189）、二楼以上加装防爬铁丝网（line 203）、
      一楼楼梯铁门被外部锁链反锁（line 191）、三楼七八米跳楼高度（line 201）
    layer_3_evolution: |
      本篇感染者处于「早期反射性」阶段为主（line 57 四肢折断仍冲来、line 59「除非一击毙命不会放弃」），
      但已出现「保留语言 + 诱敌 + 围堵」的萌芽（line 65 叼断手看「我」、line 119 狗子用语言威胁、line 163 蹲守尸体旁等门开）
  interpersonal:
    layer_1: "门外辱骂的同学拿秦胜哥女友做文章（line 35）—— 感染者保留辱骂 / 性侵语言，针对性挑衅"
    layer_2: |
      小队内部的决断撕裂 —— 秦胜哥要冲出去找女友 / 求生（line 37, 137）vs「我」主张继续躲（line 141）；
      四人「你推我我推你」都不去交电费（line 17）—— 末日前的惰性成为致命伏笔
    layer_3: |
      感染后的狗子 = 最亲密关系的扭曲版 —— 用爱 / 性的语言说占有（line 123 要驾驭种马 / 撬开秦胜哥脑子、line 119 对「我」的恶毒描绘）；
      社长亲手杀死朝夕相处的舍友狗子（line 129）—— 最沉重的人际代价
  internal:
    layer_1: "「我」难以对人痛下杀手的本能（line 61「真的让我去对一个人痛下杀手时，有一种奇怪的本能」）"
    layer_2: "对外界一无所知的折磨（line 41）+ 联系家人后短暂安心 vs 社长 / 狗子家人电话里的噩耗（line 85-89）"
    layer_3: "「怕疼」—— 全篇最后、最人性、也最反人性的内心动机（line 219）：用自感染逃避独自承受痛苦与清醒"
  societal:
    - "学校保安系统全面缺席（line 19「不知道学校里的保安为什么没有在周围」）"
    - "报警电话从占线到完全打不通（line 91, 135）—— 公权力同步坍塌"
    - "家人小区也在群殴 + 警察让待在家但久等无人来（line 85）—— 城市级而非校园级"
    - "网络 / 直播 / 短视频是唯一信息源但逐步失维（line 93 直播主播被撕成碎块、line 135 部分网站登录不了）"
    - "军方内乱（line 135 轰炸机互撞 / 战斗机互相拦截）—— 与《地铁》《燃烧》同源"
    - "一楼铁门外的锁链（line 191）—— 反派人类首次实物入场，系统性「屠宰场」改造"

# === Arc 框架 ===

arc_framework:
  total_arcs: 5
  notes: |
    Arc 边界严格对应日记体的「日期分隔」—— 每一则日期条目 = 一个 Arc，
    最后一个 Arc（4/20 + 两段无日期断章 + 罗允收笔）把「跳楼 + 自感染 + 视角反转」合为故事高潮。
    这是莫千回「连续受难体」结构的日记体变体 ——
    每个 Arc 损失一名队员（狗子感染 → 狗子被杀 → 社长死 → 秦胜哥瘫痪 → 「我」自感染），
    价值层逐 Arc 下沉，且每个 Arc 都内含一处「希望被设定 → 希望落空」闭合。

  arc_1_first_day_outbreak:
    label: "爆发首日 + 校园流水账被嚎叫击穿 + 困守四楼宿舍 + 决定去隔壁充电"
    value_starting: "末日前最松弛的日常（逃课睡回笼觉 / 懒得交电费）"
    value_ending: "确认末日爆发 + 困在死手机的宿舍里、对外界一无所知（深渊的入口）"
    climax_event: "拉窗帘看见狂笑学生砸头 + 开门见四五个狂笑同学扑来 + 对面楼扔人 / 拽断胳膊（line 19-33）"
    source_anchor: "line 5-49"
    function: |
      把「狂笑」病征用「先误读为打闹、后确认为屠杀」的方式教学给读者（病征教学首篇）；
      用「四个手机都没电 / 都懒得交电费」把日常惰性转化为致命困境 ——
      莫千回式「微小的懒 = 末日里的死刑」；
      Arc 末「多希望——」破折号断句（line 49）= 日记体的省略，希望未说出口就被下一则日期切断。

  arc_2_next_door_and_lore:
    label: "出门血战进隔壁宿舍 + 狗子被咬绑椅 + 联系外界 + 「狂病」科普视频 = 病征 lore 集中投放"
    value_starting: "为求外界信息冒险出门（希望被设定）"
    value_ending: "联系上家人但社长 / 狗子家人传来噩耗 + 报警占线 + 确认全国爆发 + 狗子大概率已感染（希望落空）"
    climax_event: |
      装狂笑混入失败 + 果断还击发现钝器对痛觉缺失者无效（line 55-57）+
      社长跳起取到钥匙 + 堵门（line 67-73）+ 发现狗子胳膊被咬穿（line 81）+
      手机看到「狂病」H 国博士科普视频（line 95-101）
    source_anchor: "line 51-105"
    function: |
      全系列「狂病」病征 lore 的集中投放篇 ——
      stage 1-4 症状、肾上腺素异常、痛觉缺失、一击毙命、咬伤感染风险、
      「肾上腺素分泌越低越被锁定」首假说（line 101）全部在此通过 in-universe 视频 + 评论区给出；
      狗子被咬 = 把抽象 lore 落到具体舍友身上（line 105「不禁看向了绑在椅子上的狗子」）;
      装狂笑实验失败（line 55）= 与《燃烧》气味识别假说互补（表情骗不过）。

  arc_3_kill_the_brother:
    label: "狗子彻底感染撞玻璃爬来 + 用爱 / 性语言威胁 + 社长亲手割喉杀死舍友"
    value_starting: "把狗子绑在阳台、留一线人性希望（撑过这段就好）"
    value_ending: "亲手杀死朝夕相处的舍友 + 宿舍死寂 + 确认「好人也救不回感染者」（人性层深渊）"
    climax_event: |
      狗子拽断自己脱臼小臂（line 115）+ 撞碎玻璃 + 脸皮翻卷仍狂笑爬来（line 117）+
      用驾驭种马 / 撬脑子的语言威胁（line 123）+ 秦胜哥崩溃 +
      社长拦住秦胜哥、把水果刀插进狗子脖子（line 129）
    source_anchor: "line 107-153"
    function: |
      第一个「亲手了结自己人」的人性代价 ——
      感染后的狗子仍用爱 / 性 / 占有的语言（line 119, 123）= 感染者保留所爱的扭曲版本（与《燃烧》周全同源）；
      社长的「拦住秦胜哥、自己动手」= 把最脏的决断揽到自己身上（line 129）—— 沉默担当者原型；
      Arc 末三人就「留下等救援 vs 冲出去求生」反复拉锯（line 133-153），
      秦胜哥的「弹尽粮绝饿死 / 被折磨死」论证（line 143）把「躲」这条希望线也证伪。

  arc_4_breakout_and_chain:
    label: "全副武装逃出宿舍 + 走廊血战 + 社长被撕成碎块（拖把棍头颅）+ 逐层锁铁门 + 一楼铁门外锁链"
    value_starting: "决定拼命冲出宿舍楼坐车去机场（希望被设定 + 全员武装）"
    value_ending: "社长惨死 + 逐层撤退到一楼 + 发现一楼铁门被外部锁链锁死（最后一条逃生路被人为封死）"
    climax_event: |
      开门即被伏击拉倒秦胜哥（line 163）+ 社长长矛插眼 + 走廊十几人围堵（line 169）+
      冲进楼梯口回头只见社长头颅插在拖把棍上、身体被四分五裂蹂躏（line 177）+
      逐层锁铁门下到一楼 + 推不开铁门 + 门外锁链声浇灭最后希望（line 191）
    source_anchor: "line 155-191"
    function: |
      第二个「关键死亡用省略 + 缺席承担」—— 社长怎么死的「我」没听见惨叫（line 179），
      只看到完成态的头颅（line 177）= 莫千回标志性「不写死亡过程、只写死亡结果物」（与《燃烧》老刘 / 周全同源）；
      一楼铁门外的锁链（line 191）= 反派人类首次实物入场 ——
      这栋楼被某个清醒的人改造成了「只进不出的屠宰场」，
      把「感染者是威胁」升级为「有人在利用感染者收割幸存者」（跨篇反派布局钩点）。

  arc_5_jump_self_infect_relay:
    label: "二楼困守 + 三楼跳楼孤注一掷 + 双双瘫痪 + 「我」吞断指自感染 + 罗允拾日记本接续上路"
    value_starting: "退守二楼、连交流都难（绝境 + 「我」摸口袋里的暗物却下不定决心，line 197）"
    value_ending: |
      跳楼 → 双双瘫痪（line 215）→ 「我」吞狗子断指自感染、理由「怕疼」（line 217-219）→
      日记中止 → 罗允拾起日记本、用自己的方式活下去并继续上路（line 223-235）
    climax_event: |
      秦胜哥提议从三楼跳赌一把（line 199）+ 跳下双双瘫痪 + 十几个感染者跟着跳下（line 215）+
      「我」掏出偷藏的狗子断指塞进嘴里自感染（line 217）+ 「希望这个感染可以快一些吧，毕竟我真的很怕疼呀」（line 219）
    source_anchor: "line 193-235"
    function: |
      全章 main climax —— 用一个动作（吞断指）承担多层意义：
      (1) 主动结束「独自清醒地等死 / 被慢慢折磨」的处境；
      (2) 用「怕疼」这个最人性的理由完成最反人性的行为 = controlling_idea candidate_b 的最锋利证据；
      (3) 把「怎么死」这个最后的决断也交出去（呼应 shadow_desire：「我」从来不会自己决断）；
      视角反转为罗允（line 223）= 「读者代理人」首次确立 ——
      日记的存续 = 文明 / 见证的存续，活下来的不是写日记的人，是接着读、接着走的人。

# === 故事高潮设计 ===

story_climax_design:
  primary_climax:
    event: "三楼跳楼双双瘫痪 + 「我」掏出偷藏的狗子断指塞进嘴里主动自感染（理由：怕疼）"
    source_anchor: "line 215-219"
    why_climax: |
      全章价值层的引爆点：
      - 「我」开篇是「拦阻者 / 记录者 / 不做决断的人」 → 末尾做出全篇唯一也是最终极的主动决断：自杀式自感染；
      - 「逃出去活下来」的 desire_object 被彻底证伪（铁门锁死 + 跳楼瘫痪 + 集体死尽）；
      - 全篇反复出现的「怕疼」「下不痛快」本能（line 61 不忍痛下杀手、line 187 没给幸存者痛快）
        在此反转成「自己吞下感染源以求快点不疼」—— 最人性的怕痛驱动最反人性的自我了结。
      - 「偷偷从狗子断手上掰下来的指头」（line 217）= 这个动作在 Arc 5 之前就已暗藏（line 197 摸口袋），
        是全篇埋得最深的伏笔，揭晓即高潮。

  closing_reversal:
    event: "戴头盔的罗允在宿舍楼下合上日记本 + 翻墙找车 / 找不到 / 改骑藏起来的摩托车继续上路"
    source_anchor: "line 223-235"
    function: |
      不是 happy ending 也不是 hopeless ending —— 是「传火式」见证收笔（relay ending）：
      日记主人的命运已经定格（自感染），但他的「记录」被另一个幸存者读完、并接着走下去；
      罗允「叹了口气」两次（line 223, 233）+ 幻想与日记主人相遇却扑空 = 延迟的、错位的共情；
      罗允的物质特征（钉钉球棒 / 燃烧瓶 / 摩托车 / 99 度生命汁水 / 头盔）在此首次完整建立 ——
      为后续《燃烧》等篇罗允的「救人但不强迫 + 转达遗言」原则埋下物质 + 性格底座。

  controlling_idea_for_this_chapter: |
    "在末日，能不能活下来与你是不是好人无关 ——
    最不忍下杀手、最怕疼的人，会用最怕疼的理由把自己变成怪物；
    而真正延续下去的不是写日记的人，是接着读、接着走的人。"
    （主要映射全系列 candidate_b：「真正能在末日里活下来的，未必是好人 —— 道德感往往拖累生存」;
     「我」主动自感染用「怕疼」完成最反人性的行为 = candidate_b 最锋利证据；
     收笔的罗允「读者代理人」接续则旁触 emotional_charge 的「余韵式见证」。）

# === 主题钩 ===

theme_hooks:
  - "日记体第一人称 + 自感染收笔 + 罗允「读者代理人」接续 —— POV 实验首篇（与《燃烧》第二人称盲女并列）"
