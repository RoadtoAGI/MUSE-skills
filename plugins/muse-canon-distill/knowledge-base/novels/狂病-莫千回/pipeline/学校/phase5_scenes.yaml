# === 节奏曲线 ===

pacing_curve:
  arc_1: "缓 → 急"  # 校园流水账 → 嚎叫击穿 → 困局成形（XX-S01 → S02 → S03）
  arc_2: "急 → 缓"  # 出门血战 + 取钥匙堵门得短暂安全 → lore 集中投放（XX-S04 → S05 → S06）
  arc_3: "静 → 极急 → 静"  # 狗子爬来 → 社长割喉 → 留 vs 走拉锯（XX-S07 → S08）
  arc_4: "极急"  # 逃出宿舍 + 走廊血战 + 社长惨死 + 一楼锁链（XX-S09）
  arc_5: "静 → 极急 → 余韵"  # 二楼困守 → 跳楼 + 自感染高潮 → 罗允接续收笔（XX-S10 → S11）
  notes: |
    日记体「连续受难型」—— Arc 边界 = 日期分隔，每个 Arc 损失一名队员、内含一处「希望被设定 → 希望落空」闭合。
    五条希望线（充电 / 联系外界 / 杀狗子止损 / 翻墙坐车 / 跳楼）逐一证伪，最后连「逃 / 死」的选择权都交给病毒。
    XX-S06（lore 投放）是全篇唯一的「信息缓拍」，节奏上是两段血战之间的喘息。

# === 跨场景手艺主题 ===

cross_scene_craft_themes:
  diary_form_retrospect:
    description: |
      日记体「写作时态」本身承担悬念与悼亡 —— line 17「如果那时不懒就好了」/ line 49「多希望——」破折号 /
      line 211「希望明天可以继续记录」（读者已知不会有明天）/ 自感染后日记戛然中止（line 219）。
      日记是一份「未完成的遗书」，叙述者在故事内死亡 = 第一人称的物理终止。
    scenes: ["XX-S01", "XX-S03", "XX-S10"]
    function: "日记体 POV 是莫千回 POV 实验首篇 —— 与《燃烧》第二人称盲女并列；盲女剥夺读者视觉，日记体剥夺读者「叙述者的未来」"

  silent_aftermath:
    description: |
      关键死亡全用省略 / 缺席 / 声音递减 / 完成态结果物承担 ——
      被砸头男生（移开视线，line 21）/ 社长父亲（电话狂笑中断线，line 87）/ 社长（拖把棍头颅 + 没听见惨叫，line 177-179）/
      狗子（杀死后死寂呆看一夜，line 131）。
    scenes: ["XX-S02", "XX-S05", "XX-S07", "XX-S09"]
    function: "省略胜过直写 —— 'doing less is more'，与《燃烧》老刘 / 周全 / 李太太同源"

  hope_dispatched_then_revoked:
    description: |
      五条希望线逐一被设定后证伪 ——
      去隔壁充电（成功但断电 + 狗子被咬）/ 联系外界（家人电话喜忧 + 报警占线）/ 杀狗子止损（人性代价）/
      翻墙坐车去机场（社长死 + 一楼锁链）/ 三楼跳楼（双双瘫痪）。
    scenes: ["XX-S03", "XX-S05", "XX-S08", "XX-S09", "XX-S10"]
    function: "每个 Arc 闭合 = 一次希望被设定后立刻收回 —— 与《燃烧》连续受难结构同源"

  mirror_and_window_threads:
    description: |
      用「对面宿舍楼」（line 29-31 镜像预演本楼命运）+「直播 / 短视频 / 视频」（line 93-101 城市 / 全国 / 全球爆发窗口）
      在第一人称困局外构造平行视野，让读者比「我」看得更广。多层窥镜套娃（我看直播看转载视频看博士看评论区）。
    scenes: ["XX-S03", "XX-S06"]
