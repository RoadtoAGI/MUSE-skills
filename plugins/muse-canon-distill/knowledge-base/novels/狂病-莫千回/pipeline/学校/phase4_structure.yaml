# === 多线叙事 ===

multi_thread_notes:
  pov_structure:
    primary: "日记体第一人称「我」—— line 5-219 全篇统一（4/16-4/20 五则带日期条目 + 两段无日期断章）"
    reversal: "line 223-235 切换为第三人称限知（罗允拾日记本），= 文学层面「读者代理人」收笔"
    function: |
      日记体 POV 的三重功能（莫千回 POV 实验首篇）：
      (1) 「事后回溯」语气天然带宿命感 —— line 17「现在想一下如果不懒就好了」/ line 49「多希望——」破折号断句
         /line 211「希望明天可以继续记录」（读者已知不会有明天），日记的「写作时态」本身制造悬念与悼亡;
      (2) 「自感染收笔」让 POV 主体在故事内死亡 —— 日记中止（line 219）= 第一人称叙述的物理终止，
         读者读到的是一份「未完成的遗书」;
      (3) 视角反转为罗允（line 223）= 把「读者」这一角色显影进文本 ——
         罗允读日记 = 读者读小说的镜像，罗允「替死者继续走」= 见证 / 传火的文学化。
      与《燃烧》第二人称盲女 POV 并列为系列两大 POV 实验：
      盲女剥夺读者「视觉」，日记体剥夺读者「叙述者的未来」（你读的人已经死了）。

  parallel_external_threads:
    - "对面宿舍楼（line 29-33）—— 通过「能看到对面走廊阳台」把本楼的命运用对面楼预演（line 31「大概能猜测出我们这栋楼的样子」），平行镜像线"
    - "网络 / 直播 / 短视频（line 93-101, 135）—— 城市级 / 全国级 / 全球级爆发的「窗口」线，与本楼困局并行，确认「不只在我们学校」"
    - "家人电话线（line 85-89）—— 「我」家人安全 vs 社长 / 狗子家人噩耗的对照，把末日从校园拉到家庭"
    - "罗允暗线（line 223-235）—— 全篇视角外的幸存者，最后浮出水面接管叙述，跨篇钩"

