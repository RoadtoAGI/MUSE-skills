_meta:
  version: "1.0"
  chapter: "学校"
  derived_from: "phase3_spine.yaml arc_framework"
  validated_against_source: true
  note: |
    Arc 5 段 —— 日记体「连续受难型」结构，Arc 边界严格对应日记日期分隔（4/16-4/20 + 两段无日期断章 + 罗允收笔）。
    每个 Arc 损失一名队员，价值层逐 Arc 下沉。

# === Arc 1: 爆发首日 4/16 ===

arc_1:
  label: "爆发首日 + 校园流水账被嚎叫击穿 + 困守四楼宿舍 + 决定去隔壁充电"
  source_anchor: "line 5-49"
  sequences:
    - seq_id: "1.1"
      label: "校园流水账 + 不祥铺垫（消防车 / 警车 / 听声辨车 / 提前上课 / 打架）"
      source_anchor: "line 5-17"
      core_conflict: "末日前的松弛日常 vs 边缘渗入的不祥信号"
      progression: |
        2023-4-16 阴天 + 怕旷课早起到教室（line 5-7）
        路上看到消防车警车疾驰、社长开玩笑说去抓渣男秦胜哥（line 7）
        网络信息安全课 + 狗子听声辨车「三辆警车一辆救护车」（line 9）
        课间被要求回教室（据说有人打架，怕去凑热闹，line 11）
        三人 + 秦胜哥逃课回宿舍 + 约好中午去交电费（line 13-17）
      seq_climax: |
        line 17「现在想一下，如果那个时候不懒的话就好了」—— 日记体回溯语气先行标记「悔之晚矣」;
        「四个懒汉都不想去交电费」= 把日常惰性埋成致命伏笔

    - seq_id: "1.2"
      label: "回笼觉被嚎叫惊醒 + 拉窗帘看见狂笑砸头 = 激励事件"
      source_anchor: "line 19-23"
      core_conflict: "误读为打闹 vs 确认为屠杀"
      progression: |
        睡回笼觉 + 窗外嚎叫惊醒 + 拉窗帘看见五六个学生满脸笑容追打满头是血的男生（line 19）
        「我甚至都以为只是在开玩笑打闹」+ 注意到手里有石头棍棒 + 保安缺席（line 19）
        叫醒舍友 + 男生被抓住 + 一人拿石头砸头 + 除社长外都不敢看（line 21）
        狗子想报警但手机没电（line 23）
      seq_climax: |
        当众砸头 —— 「狂笑」病征用「先误读打闹、后确认屠杀」教学给读者（系列病征教学首拍）;
        手机没电 = line 17 惰性伏笔的第一次回收

    - seq_id: "1.3"
      label: "开门见狂笑同学扑来 + 拦门 + 对面楼扔人 / 拽断胳膊 + 决定去隔壁充电"
      source_anchor: "line 25-49"
      core_conflict: "出门求援 vs 拦门自保"
      progression: |
        开门见四五个狂笑同学冲来 + 「我」拦住社长关门（line 25）
        门外辱骂撞击 + 拿秦胜哥女友做文章（line 35）
        阳台看见对面楼三人把变形的人从四楼扔下 + 一人被舍友生生拽断胳膊（line 29, 33）
        狗子吐 + 社长拖把清理 + 秦胜哥想冲出去找女友被拉住（line 35-37）
        秦胜哥 + 狗子相继哭（担心家人，line 39）+ 「我」反思四人手机都不充电（line 41）
        约定先去隔壁宿舍充电联系外界再决定（line 43-47）
      seq_climax: |
        line 49「多希望——」破折号断句 —— 日记体省略：希望未说出口即被下一则日期切断;
        「我」首次确立「拦阻者」功能（line 25 拦社长、line 37 拉秦胜哥）

  arc_progression_note: "Arc 1 内：松弛日常（1.1）→ 激励事件击穿（1.2）→ 困局成形 + 第一个逃生方案诞生（1.3）"

# === Arc 2: 4/17 隔壁宿舍 + 病征 lore ===

arc_2:
  label: "出门血战进隔壁宿舍 + 狗子被咬绑椅 + 联系外界 + 「狂病」科普视频"
  source_anchor: "line 51-105"
  sequences:
    - seq_id: "2.1"
      label: "装狂笑混入失败 + 果断还击发现钝器对痛觉缺失者无效"
      source_anchor: "line 51-61"
      core_conflict: "拟态伪装 vs 痛觉缺失的感染者"
      progression: |
        4/17 已进隔壁充上电 + 狗子被绑椅子 + 断电（line 53）
        昨天出门按计划装狂笑减少冲突 → 刚出门即被扑（line 55）
        果断还击 + 秦胜哥踹倒一人但对方倒地仍狂笑（line 57）
        凳子腿 / 哑铃片打骨折也无效 + 「除非一击毙命不会放弃」结论（line 57-59）
        「我」难以对人痛下杀手的本能（line 61）
      seq_climax: |
        装狂笑实验失败（line 55）—— 与《燃烧》气味识别假说互补：表情骗不过;
        痛觉缺失 lore 的第一次实战验证（line 57-59）

    - seq_id: "2.2"
      label: "社长跳起取钥匙 + 楼道围堵 + 冲进隔壁宿舍堵门"
      source_anchor: "line 63-77"
      core_conflict: "取钥匙开门的时间 vs 楼道聚拢的感染者"
      progression: |
        社长够通风窗台钥匙够不到（line 63）+ 「我」怀疑钥匙没藏（line 65）
        打斗声引来楼道感染者 + 旧同学嘴叼断手眼神歹毒（line 65）
        「我」提醒社长跳起来看 → 社长跳起抓到钥匙（line 67）
        楼道站满狂笑者 + 开门冲进去 + 关门 + 搬行李堵门（line 71-73）
        死里逃生的「飘飘欲仙」感（line 77）
      seq_climax: |
        社长跳起取钥匙（line 67）—— 智取一拍;
        堵门成功 + 「飘飘欲仙」（line 77）= 短暂希望被设定

    - seq_id: "2.3"
      label: "发现狗子胳膊被咬穿 + 绑椅隔离 + 联系家人喜忧 + 报警占线"
      source_anchor: "line 79-91"
      core_conflict: "感染风险 vs 舍友情谊"
      progression: |
        充电时狗子要纱布 + 推衣发现胳膊牙印肉快被咬下来（line 79-81）
        简单包扎 + 把狗子绑椅子（怕感染，line 83）
        「我」打通家里电话 → 妈说小区群殴但家人安全（line 85）
        社长电话里听到父亲虚弱遗言 + 狂笑断线（line 87）
        狗子家人占线 / 无应答 + 秦胜哥脸惨白 + 报警占线（line 89-91）
      seq_climax: |
        社长父亲遗言「儿子长大了，以后一定要保护好自己」+ 狂笑断线（line 87）—— 全篇最早的「家人噩耗」拍;
        报警占线（line 91）= 公权力坍塌确认「不只在我们学校」

    - seq_id: "2.4"
      label: "直播主播被撕碎 + 「狂病」H 国博士科普视频 = 病征 lore 集中投放"
      source_anchor: "line 93-105"
      core_conflict: "信息渴求 vs 信息揭示的恐怖真相"
      progression: |
        手机看直播 + 主播求打赏 + 被人群撕成四分五裂直播未停（line 93）
        翻到该主播转载的「狂病」视频 + H 国博士讲述（line 95）
        病征 stage 1-4 + 肾上腺素异常 + 痛觉减弱 + 身体机能不受损（line 97）
        助手被杀 / 同病房传染 / 一周前发布（line 99）
        评论区：博士复述「肾上腺素分泌越低越被锁定」首假说 + 第一目标攻击正常人（line 101）
        「我」看向绑椅子的狗子（line 105）
      seq_climax: |
        「狂病」病名 + 全套病征 lore 通过 in-universe 视频集中投放（line 97-101）—— 系列病征教学锚点;
        line 105「不禁看向绑在椅子上的狗子」= 把抽象 lore 落到具体舍友身上

  arc_progression_note: "Arc 2 内：出门血战（2.1）→ 取钥匙堵门得短暂安全（2.2）→ 联系外界确认全国噩耗（2.3）→ lore 集中投放 + 狗子感染悬念坐实（2.4）"

# === Arc 3: 4/18 杀死舍友狗子 ===

arc_3:
  label: "狗子彻底感染撞玻璃爬来 + 用爱 / 性语言威胁 + 社长亲手割喉杀死舍友"
  source_anchor: "line 107-153"
  sequences:
    - seq_id: "3.1"
      label: "狗子半夜拽断小臂 + 撞碎玻璃 + 脸皮翻卷仍狂笑爬来"
      source_anchor: "line 107-119"
      core_conflict: "感染者狗子 vs 「狗子还是不是狗子」"
      progression: |
        4/18 外面疯子渐散但仍有人砸门 + 还有躲起来的幸存者（line 109-111）
        昨晚狗子彻底感染 + 庆幸把他关在阳台（line 113）
        狗子拽断自己脱臼小臂（line 115）+ 撞碎玻璃（line 117）
        脸皮翻卷脂肪血液染脸仍狂笑、拖着身体爬来 + 口齿不清的恶毒语言（line 117-119）
        「我」干呕 → 刺激狗子笑得更响 + 描绘对「我」要做的恶心画面（line 119）
      seq_climax: |
        狗子拽断自己脱臼小臂（line 115）—— 痛觉缺失 lore 的极端例证;
        感染后仍用爱 / 性 / 占有语言（line 119）= 感染者保留所爱的扭曲版本（与《燃烧》周全同源）

    - seq_id: "3.2"
      label: "秦胜哥试图与狗子「谈判」+ 崩溃 + 社长拦住秦胜哥亲手割喉"
      source_anchor: "line 121-131"
      core_conflict: "保留人性的谈判幻想 vs 必须了结的现实"
      progression: |
        秦胜哥拎哑铃想与狗子最后谈判、希望他冷静撑过去（line 121）
        狗子笑更大 + 说要驾驭种马 / 撬开秦胜哥脑子（line 123）
        秦胜哥确认狗子取向本正常（line 125）+ 第一次在众人面前崩溃大骂（line 127）
        秦胜哥举哑铃要砸 → 社长拦住浑身颤抖的秦胜哥、把水果刀插进狗子脖子（line 129）
        亲手杀死朝夕相处舍友后宿舍死寂、呆看尸体一夜（line 131）
      seq_climax: |
        社长拦住秦胜哥、自己动手割喉（line 129）—— 沉默担当者把最脏的决断揽到自己身上;
        「呆呆看了一夜狗子的尸体」（line 131）= 用静默承担人性代价

    - seq_id: "3.3"
      label: "外界恶化（军方内乱）+ 留守 vs 出逃的反复拉锯"
      source_anchor: "line 133-153"
      core_conflict: "留下等救援（稳妥）vs 冲出去求生（赌命）"
      progression: |
        清晨秦胜哥问要不要离开（line 133）
        报警从占线到完全打不通 + 军方内乱（轰炸机互撞 / 战斗机互拦）+ 网站宕机（line 135）
        秦胜哥仰仗：围墙外加满油的轿车 + 两分钟能跑出楼（line 137-139）
        「我」反驳：四楼 + 停电电梯 + 三层楼潜在危险 + 隔壁十米就死一人（line 141）
        秦胜哥论证：隔壁没囤零食 + 跑回去取零食撑死两三天 + 弹尽粮绝只能饿死 / 被折磨死（line 143）
        社长问到了机场去哪 → 秦胜哥答军民两用机场 / 大警局（line 147-149）
        社长附条件同意（到安全地后要开车离开）+ 三人看向「我」（line 151-153）
      seq_climax: |
        秦胜哥的「弹尽粮绝饿死论」（line 143）把「躲」这条希望线证伪;
        line 153 三人看向「我」—— shadow_desire 显形：「我」无法独自决断，只能被集体裹挟着拼命

  arc_progression_note: "Arc 3 内：狗子感染爬来（3.1）→ 谈判幻想破灭 + 社长动手（3.2）→ 外界恶化逼出「留 vs 走」决断（3.3）"

# === Arc 4: 4/19 逃出宿舍 + 社长死 + 锁链 ===

arc_4:
  label: "全副武装逃出宿舍 + 走廊血战 + 社长被撕成碎块 + 逐层锁铁门 + 一楼铁门外锁链"
  source_anchor: "line 155-191"
  sequences:
    - seq_id: "4.1"
      label: "出逃准备（缠书护臂 / 口罩 / 简易武器）+ 推开房门即遭走廊伏击"
      source_anchor: "line 155-167"
      core_conflict: "充分准备 vs 门外早已蹲守的感染者"
      progression: |
        4/19 强迫睡一宿保体力 + 天亮出发（line 157）
        胶带缠书护臂腿（防狗子情况）+ 口罩 + 简易长矛 / 哑铃 / 流星锤（line 159）
        挪开堵门物 + 呼吸加速 + 秦胜哥推开房门（line 161）
        门外两人蹲在被啃尸体旁 + 旧好友拉开门把秦胜哥拽倒（line 163）
        旧好友扑秦胜哥辱骂 + 社长长矛插眼眶（line 165-167）
        秦胜哥推开尸体爬起 + 与社长把另一疯子从窗台推下（line 167）
      seq_climax: |
        开门即被伏击拉倒秦胜哥（line 163）—— 感染者「蹲守尸体旁等门开」的早期围堵萌芽;
        line 159 缠书护臂的准备 = 吸取了狗子被咬的教训（伏笔回收）

    - seq_id: "4.2"
      label: "走廊围堵血战 + 钝器失效 + 杀出血路冲进楼梯口"
      source_anchor: "line 169-177"
      core_conflict: "杀出血路 vs 越聚越多 / 又快又强的感染者"
      progression: |
        声音引来更多感染者 + 左侧十几人右侧更多（line 169）
        秦胜哥喊快走向左奔 + 感染者力量 / 速度都更强（line 171）
        钝器对无痛觉者失效 + 缠书护臂救命 + 社长砸断拖把棍用半截长矛捅刺（line 173-175）
        推倒最后一人 + 楼梯口出现 + 「我」与秦胜哥冲进楼梯口（line 177）
        回头想拉社长 → 只看到插在拖把棍上的社长头颅 + 身体被四分五裂蹂躏（line 177）
      seq_climax: |
        拖把棍上的社长头颅（line 177）—— 关键死亡用「完成态结果物」承担（与《燃烧》同源）;
        line 179「我甚至没有听见他的惨叫声」= 死亡过程被彻底省略

    - seq_id: "4.3"
      label: "逐层锁铁门撤退 + 三楼放过被绑幸存者 + 一楼铁门外锁链浇灭希望"
      source_anchor: "line 179-191"
      core_conflict: "逐层向下的逃生 vs 一楼被人为封死的终局"
      progression: |
        关楼梯铁门反锁 + 干呕 + 埋头向下冲（line 181-183）
        三楼转角两个感染者折磨被铁丝捆绑的幸存者（line 185）
        「我」与秦胜哥砸死那两个感染者、但没给那个幸存者痛快也没带走（line 187）
        楼道残骸 + 墙染血红 + 锁三楼铁门继续下（line 189）
        没特意锁二楼（胜利在望）→ 一楼楼梯口铁门居然关着 + 推不开 + 门外锁链声（line 191）
      seq_climax: |
        一楼铁门外的锁链声（line 191）—— 反派人类首次实物入场，最后逃生路被人为封死;
        line 187 没给被绑幸存者痛快 = 「我」「下不去手 / 自顾不暇」的本能（呼应 line 61，为 line 219 自感染反转铺垫）

  arc_progression_note: "Arc 4 内：开门即伏击（4.1）→ 走廊血战 + 社长惨死（4.2）→ 逐层下撤却撞上锁链封死的一楼（4.3）"

# === Arc 5: 4/20 跳楼 + 自感染 + 罗允接续 ===

arc_5:
  label: "二楼困守 + 三楼跳楼孤注一掷 + 双双瘫痪 + 「我」吞断指自感染 + 罗允拾日记本接续上路"
  source_anchor: "line 193-235"
  sequences:
    - seq_id: "5.1"
      label: "退守二楼 + 「我」摸口袋的暗物却下不定决心 + 秦胜哥提议三楼跳楼赌命"
      source_anchor: "line 193-205"
      core_conflict: "无解的绝境 vs 孤注一掷的跳楼赌命"
      progression: |
        4/20 反锁二楼铁门 + 情绪难以静下交流（line 195）
        「我」有点恨秦胜哥（若躲着就不必面对）+ 也知是自己的选择（line 197）
        line 197「我摸了摸口袋里的东西……我现在，还是下不定决心」—— 自感染断指伏笔首次暗藏
        秦胜哥提议从三楼跳赌一把（line 199）
        「我」第一反应是自杀 + 论证高度危险（line 201）
        二楼以上加装防爬铁丝网（line 203）→ 只能从三楼跳 + 秦胜哥搜落地方式自我麻痹（line 205）
      seq_climax: |
        line 197 摸口袋的暗物 + 下不定决心 —— 全篇埋得最深的伏笔暗藏（揭晓在 line 217）;
        二楼防爬铁丝网（line 203）把「二楼跳」也封死，逼出三楼跳楼

    - seq_id: "5.2"
      label: "三楼跳楼 + 双双瘫痪 + 「我」掏断指自感染（怕疼）= 故事高潮"
      source_anchor: "line 207-219"
      core_conflict: "跳楼求生 vs 跳楼即瘫痪的终极证伪"
      progression: |
        日记中途搁笔「希望明天可以继续记录」（line 211）
        无日期断章：跳楼了，屁股着地但下肢完全失去知觉（line 215）
        秦胜哥小腿扭曲变形 + 十几个感染者跟着从三楼跳下来（line 215）
        「我已经知道接下来该怎么做了」（line 215）
        「我」掏出偷藏的狗子断指塞进嘴里自感染（line 217）
        line 219「希望这个感染可以快一些吧，毕竟我真的很怕疼呀」
      seq_climax: |
        吞断指自感染（line 217）+ 怕疼（line 219）—— 全章 main climax:
