baseline_voice:
  observed_summary: '他说话淡。最重的话——报死讯、转达遗言——他偏用最平的陈述句托住，不加形容词、不煽情、不安慰，把判断与选择留给听者，常以"……吧"收口（"活下去吧""他应该很想让你活下去吧"）。句子短、收尾克制，情绪很少直接说出口，更多沉进一个动作里：叹一口气，合上手中的笔记本。他几乎不谈自己；可一旦谈起别人——被他救的人、路边死去的陌生人——反而具体起来，会替一个素不相识的死者把故事讲完。和搭档相处时，这份近乎仪式的"传火"会被对方一句"正常末日嘛"的冷淡校准，他便也只是叹气点头，不争辩。


