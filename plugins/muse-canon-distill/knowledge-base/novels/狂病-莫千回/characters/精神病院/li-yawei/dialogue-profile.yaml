  observed_summary: '李亚伟说话又快又冲，自来熟到几乎没有边界感——上来就"老哥老哥"地喊，催人时直接爆粗（"大哥，他妈的都什么时候了，能不能别卖关子"），对监控、对副院长这种他看不上的权威会毫不掩饰地破口大骂。但他的攻击性里裹着乐观和黑色幽默：能把残酷处境讲成段子，能把别人的愧疚翻译成体面的理由。临终时语气会忽然柔下来、带着戏谑的释然（"他厉害不，想进来就进来，想出去就出去"），把最重的遗言用最轻的口吻递出去。


