baseline_voice:
  observed_summary: '杨中旭的声音是两副嗓子叠在一起。日常态是退让、含糊、自我贬低的，开口前先道歉、说话留半句、被催促才肯往下讲（"抱歉，但他没有卖关子"），对人的友好和亲热会本能躲闪。但一进入逃生模式，他的语言立刻切换成清晰、有条理、带导览口吻的"讲解体"——把路线、武器点位、设施原理像导游一样铺开，夹着冷静的数字（撞门次数、喷淋时长、电死人要几秒）。恐惧不靠喊叫外化，而是借动作和默数来承担。倾向把眼前的真实灾难仍用"丧尸
    / 尸变 / 爆发"这套幻想词汇去命名，是他世界观的底色而非偶发口癖。


    - 来源：phase2_character.yaml → voice_traits

