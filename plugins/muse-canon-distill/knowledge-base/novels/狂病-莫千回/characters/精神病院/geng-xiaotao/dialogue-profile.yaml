  observed_summary: '耿小桃的声音底色是律师式的清晰推理——会有条理地罗列假设、逐条推断（"医疗事故、廉价药、减药量、假药"），用逻辑给恐惧找一个可解释的出口。日常态偏冷静、克制、带分析腔。但当她决意赴死时，语调会变得"有些奇怪"——把残酷的物理死局翻译成武侠语汇（"石中剑""天选之人""让我做一次大侠"），并第一次大吼着争取属于自己的英雄时刻。她不潇洒，赴死时是哭着的、带哭腔的。


