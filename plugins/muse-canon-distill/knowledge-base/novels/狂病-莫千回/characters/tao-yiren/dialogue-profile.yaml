  observed_summary: '他说话是感召者的腔调——居高临下、毫不迟疑，惯用一句锋利的譬喻把人钉在选择面前（"与其死的时候如同下水道里的厕纸一样被污水撕碎，还不如像天上的烟花一般璀璨爆裂"）。下命令时把冷酷包进仁慈的壳里：看似毋庸置疑的考验，却总在权威之后补一句"接受不了的人当然也可以离开"，给人留一道自我选择的门。宣讲理想时则切换成一种近乎布道的笃定，用"bug/旧时代的产物/新存在"这类二元化的大词把杀戮与毁灭说成创造与进化，疯狂大笑着把伤疤当作天选的凭证。情绪极少示弱，更多是嘲讽与笃信交替，把听者一步步引向"向死即是向生"的结论。


