  observed_summary: '他用回溯口吻讲整段故事，语气是事后复盘式的、带自嘲和后见之明。日常对话里他习惯当"扫兴的现实派"：汪华依越是把末日浪漫成游戏，他越要补一句"别忘了随时都会死"。安慰队友时他切换成务实腔，把坏事往实用处想（安全套能装水防潮、留着也有用处）。内心独白则常常和嘴上说的相反——表面应付、心里翻涌，用"一切都是命""天命如此"这类话给自己的犹豫和退让开脱。他不爱抒情，情绪多半压在动作和反问句底下，真正心软的时候选择沉默而不是表态。


    来源：phase3_spine.yaml → spine + theme_hooks

