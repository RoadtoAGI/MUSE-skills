coverage_note: |
  跨三篇蒸馏的"诱杀工具童"：林东青在《恶》（EE）、《医院》（YY）、《不详》（BX）中均作为反派的随身孩子出场。
  师父统一指向 wu-xiansheng——经用户拍板，《恶》全程伪装"罗允"者＝《医院》诈死操盘的石浩洋＝吴先生，
  为同一人，已合并蒸馏为 wu-xiansheng；character_map.json 已把"吴先生""石浩洋"双键都指向 wu-xiansheng。
  本包凡提及师父均指 wu-xiansheng，不再区分"吴先生/石浩洋"两壳。

  活态角色 → has_canon_ending: false，不生成 canon-ending.md。判定依据：《恶》收束（EE-S11 L13-15）他牵着
  师父的手"又一次隐入山林之中"，紧接着下一支队伍又遇到"带着孩子的可靠男人"（EE-S11 L15）——他继续作为
  诱杀工具循环存在，原文未给出任何不可逆终局（死亡 / 疯癫 / 被捕 / 脱离师父）。倾向不产，已不产。

  取证来源：
  - 《恶》（EE）：EE-S06 托孤式伪装"被救的可怜孩子"被送进队伍前方（L13-15）；EE-S08 偷翻背包偷 DV、被追问时
    沉默摇头、撞见知情者张彤后掏针管麻醉且"绝对不是第一次"（L21-23 / L25-29）；EE-S11 牵师父手隐入山林、循环
    奔向下一队（L13-15）。
  - 《医院》（YY，最完整真凶揭示篇）：YY-S05 七八岁"可完全排除"的工具伪装、墙角画大笑人脸、哭声做诱饵但事后
    无泪痕（L17-19 / L33-41 / L35-41）；YY-S10 Arc6 师父当众揭示"这一切都是小林做的"——独立完成偷背包投毒
    （碎肉混锅）、纵火（爬窗点火）、嫁祸（锁/开吴志强门）、灭口（刀杀蔡大妈）、放感染者（开二楼铁门），并被
    认证为"我的精神延续 / 天选之人 / 天生不会有愧疚悔恨"、被逼杀亲生父母眼睛不眨还给尸体插花（L47-49 / L47-53 /
    L53-63 / L67-69）。
  - 《不详》（BX）：王晨轩转述的"假罗允的孩子小林"——趁亦凡不备一刀插小腿、给王晨轩注射针管致昏迷，年纪与被骗者
    死去的弟弟相仿却下手狠毒（L17-19 / L21-23）。

  软建议覆盖说明：
  - 声音框架跨 2 篇取证（YY-S05 的沉默/画画/伪哭 + EE-S08 的沉默摇头），非单点；其余维度多场支撑。
  - 弧光跨起点（被逼杀亲，YY-S10）/ 转折（独立操盘，YY-S10）/ 终点（隐入山林循环，EE-S11）三段。
  - **单点说明**：林东青为被驯化的工具童，几乎无独立内心戏与自陈，其"核心欲望"与"弧光内在转变"主要由师父
    （wu-xiansheng）的"精神延续 / 天选之人 / 代际传承"设计反推 + 行为证据外推，而非角色本人自述；phase2 中
    林东青仅作为"吴先生诱导的孩童棋子"被引用，无独立 desire_system / character_arc 字段，故来源标注均挂在
    antagonists.吴先生（师父 wu-xiansheng）名下据其延伸设计反推。

