  observed_summary: '他几乎不说话——沉默本身就是他的"声音"。被大人追问时，他用摇头、不回应、自顾自做别的事（蹲在墙角画画）来回避，把判断与同情都留给被他骗的人去脑补。他对外不开口、只和师父交流，这份"失语"既是伪装也是本性：真正的表达全沉进动作里——伸手翻背包、把针管插进对方的腿、把碎肉扔进锅、把刀捅进多嘴者的脖子。连"哭"都不是情绪而是工具：蔡大妈听见他边哭边敲门、循声找过来落入圈套，可回到房间时这孩子脸上、眼里都没有半点哭过的红血丝。唯一接近"自我表达"的，是他留在墙上的那张硕大的大笑人脸——师父的快乐写成了他的涂鸦。


    来源：phase2_character.yaml → antagonists.吴先生（工具童的沉默伪装设计）

