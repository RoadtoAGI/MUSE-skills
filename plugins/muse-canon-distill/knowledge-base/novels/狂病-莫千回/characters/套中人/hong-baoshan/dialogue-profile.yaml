baseline_voice:
  observed_summary: '他说话直、糙、嗓门大，急起来满口脏话——救儿子时是一声"操你妈"开路，断后时也是嘴里不停骂着"操你妈"挥刀。但在儿子面前，他能把最重的话说得最稳：道歉只一句轻轻的"对不起"，临终的嘱托却是一串短促有力、像口号一样的硬话（"怕事不做事，做事不怕事！我永远都是你的后盾！"）。他不爱长篇讲道理，安慰人靠的是没心没肺的乐观（看到对楼有人就笑着挥手"其实也没那么糟糕"）和黑色幽默式的日常迷信（自己也有踩井盖的规矩），情绪极少直说，更多沉进动作——一把铁锹、一句催儿子"往家跑呀"。


