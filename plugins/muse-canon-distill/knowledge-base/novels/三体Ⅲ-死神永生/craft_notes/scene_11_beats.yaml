  dimension: omission
  original_move: 最痛认知只给八字判断句，零情感词
  ai_default_failure: 写浑身颤抖泪水夺眶世界崩塌
  transfer_rule: 悲剧顶点用叙述者判断替代情感，判断更冷更重
  quote: 她终于还是犯了第二次错误
overall_traits:
