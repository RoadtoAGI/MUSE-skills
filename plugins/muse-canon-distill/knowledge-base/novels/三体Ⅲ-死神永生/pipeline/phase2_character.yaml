# Phase 2: 角色系统设计图 —— 《三体Ⅲ·死神永生》
# 只记角色之间的关系，不记个体画像
# 个体档案见 characters/{角色名}.md

cast_overview:
  protagonist: 程心
  antagonist: 托马斯·维德 / 黑暗森林法则（双重对手——人格化对手+宇宙级对抗力量）
  supporting_cast:
    - name: 云天明
      function: >
        隐形脊椎——物理缺席但驱动几乎所有关键情节（买星→执剑人、
        阶梯计划→情报、小宇宙→最终庇护）。通过缺席产生最大存在感
    - name: 罗辑
      function: >
        程心的镜像——两任执剑人的对比是全书核心参照系。
        同时承担"智者"角色（冥王星揭示曲率引擎真相）
    - name: 艾AA
      function: >
        程心的行动代理——做程心受道德约束无法执行的事。
        同时是信息触发器（肥皂船→曲率驱动）和道德挑战者（碎片论）
    - name: 关一帆
      function: >
        程心的知识代理——宇宙终极真相的唯一传递通道。
        程心最终的伴侣——基于共同责任而非情感积累
    - name: 智子
      function: >
        三体文明的人格化代表。角色转变映射三体与地球关系的完整弧线
        （敌人→监控者→小宇宙管理者→同伴）

contrast_axes:
  - axis: "按下按钮 vs 不按按钮"
    characters: [程心, 罗辑]
    description: >
      同为执剑人，面对同一个问题。罗辑威慑度91-98%，程心10%。
      区别不在于勇气，而在于与毁灭的关系：
      罗辑能接受"毁灭两个世界"这个选项的存在；程心不能

  - axis: "前进 vs 人性"
    characters: [维德, 程心]
    description: >
      维德："失去人性，失去很多；失去兽性，失去一切。"
      程心："我选择人性。"
      星环城对峙是全书最纯粹的价值冲突——没有坏人，只是对"什么不能失去"有不同答案

  - axis: "缺席的爱 vs 在场的责任"
    characters: [云天明, 程心]
    description: >
      云天明通过缺席给予（星星、情报、小宇宙），
      程心通过在场承担（执剑人、星环决定、归还物质）。
      两人的爱从未在同一时空实现

  - axis: "行动 vs 沉思"
    characters: [AA, 程心]
    description: >
      AA射穿穿梭机尾翼时程心无法动弹，AA做肥皂船实验时程心顿悟。
      行动者得到幸福（AA与云天明共度一生），负重者获得意义（程心攀登责任阶梯）

relationships:
  power_dynamics: >
    全书权力结构呈悖论形态：
    - 程心拥有最大决策权，但每次决策都导致权力丧失
    - 维德拥有最强执行力，但把最终决定权交给了程心
    - 云天明拥有最关键资源，但始终物理缺席
    - 罗辑拥有最深理解，但选择放弃一切权力守墓

  key_tensions:
    - 程心 vs 维德：人性 vs 生存（核心张力）
    - 程心 vs 宇宙法则：善良 vs 冷酷（终极张力）
    - 程心 vs 自我：责任 vs 愧疚（内心张力）
    - 云天明 vs 命运：爱 vs 分离（情感张力）

  potential_shifts:
    - >
      维德从对手到遗产：他被处决后，他的光速飞船成为程心唯一逃生工具——
      死去的对手拯救了活着的主角
    - >
      智子从敌人到同伴：从"威慑度10%"的冷酷宣判者
      到"放心，我在，你们就在"的保护者
    - >
      罗辑从执剑人到守墓人：从掌握两个世界命运的人
      到"把字刻在石头上"的文明看护人
