# Phase 0: 构想分析 —— 《三体Ⅲ·死神永生》
# 逆向提取自完成作品，非正向创作产物

premise: >
  如果一个心怀爱与善意的普通女性，在宇宙黑暗森林法则下被赋予决定两个文明存亡的权力，
  而她每一次基于人性的选择都导致灾难性后果——她最终将走向何方？

core_value:
  positive: 人性（爱、善良、责任感）
  negative: 毁灭（文明覆灭、宇宙死亡）
  spectrum:
    # 正面价值极：人性/爱/责任
    contradictory: >
      冷漠——对文明命运的漠不关心（如假警报中拒绝从人群中起飞的穿梭机驾驶员们，
      或澳大利亚保留地中的地球治安军）
    contrary: >
      理性冷酷——维德式的"失去人性失去很多，失去兽性失去一切"。
      不是人性的反面，而是为了文明存续而主动放弃人性的选择
      （维德枪击程心、准备以反物质弹头武力对抗政府）
    negation_of_negation: >
      以人性之名行毁灭——程心出于最美好的动机（爱、善良、对生命的珍视）
      做出的选择，恰恰导致了文明的覆灭。
      第一次：不忍毁灭两个世界 → 威慑崩溃 → 42亿人被驱往澳大利亚
      第二次：选择人性命令维德投降 → 光速飞船/黑域之路被堵死 → 太阳系无法自保

controlling_idea:
  value: 责任与爱
  cause: >
    因为在宇宙尺度的黑暗法则面前，个体的善恶选择无法改变文明的命运轨迹，
    但承担责任的勇气——哪怕在反复的失败和毁灭之后——
    最终使个体的生命超越了有限的存在
  full_statement: >
    在宇宙的黑暗法则面前，人性的善良可能导致文明的毁灭，
    但当个体选择为宇宙的命运承担责任时，
    她的生命便与文明的历程融为一体——
    "对于智慧文明来说，它们最后总变得和自己的思想一样大。"（第六部 L4635）
  type: ironic
  # 反讽型：程心的人性选择一次次导致灾难，构成悲剧的下行弧线；
  # 但在最终时刻（归还小宇宙物质），同样的责任感却成为最崇高的选择，
  # 形成上行的收束。全书在毁灭与希望之间保持张力，不归于纯粹的悲观或乐观。

genre:
  primary: 硬科幻（宇宙史诗）
  secondary: 悲剧 / 文明寓言
  conventions:
    - setting: >
        从近未来地球延伸至宇宙终末的超长时间跨度；
        多纪元跳跃叙事（冬眠机制实现）
    - characters: >
        普通人被推上文明级决策位置（非"天选之人"模式）；
        理性主义者与人性主义者的对立（维德 vs 程心）
    - events: >
        文明间的生死博弈（威慑、广播、降维打击）；
        技术方案的提出与验证（阶梯计划、掩体计划、曲率驱动）；
        宇宙规律被用作武器
    - values: >
        科幻类型核心价值：认知（对宇宙真相的逐步揭示）；
        悲剧类型核心价值：人性 vs 生存

originality_statement:
  unique_angle: >
    以一位"反英雄"女性主角的视角讲述宇宙末日——
    她不是拯救者而是"犯错者"，每次选择都出于善意却导致灾难。
    这颠覆了科幻类型中"英雄拯救文明"的常规，
    将主角变成文明命运的"催化剂"而非"掌控者"。
    同时，全书的时间尺度从公元1453年跨越到宇宙终末（约189亿年），
    是中文科幻中罕见的全宇宙生命周期叙事。
  cliches_to_avoid:
    - 避免了"人类团结一心战胜外星入侵"的类型陈词滥调——人类内部分裂始终存在
    - 避免了"技术拯救一切"——每个技术方案都有致命缺陷或被政治/人性因素终止
    - 避免了"爱情战胜一切"——云天明与程心的爱跨越纪元却始终未能真正相聚
    - 避免了"正义必胜"——宇宙法则不关心正义，降维打击无差别消灭一切

style_directives:
  - 纪年体叙事：以"往事"回忆录口吻，每节标题即含时间坐标
  - 零度科学叙述与深层情感并置：技术描写冷峻精确，情感通过物件和沉默承载
  - 嵌套叙事：云天明童话构成"故事中的故事"，同时服务于情报传递和寓言功能
  - 视角全景化：主跟程心，但在关键节点切至歌者、白Ice、罗辑等外部视角
  - 宇宙尺度递增：从城墙到太阳系到银河系到宇宙终末，叙事尺度不断膨胀

