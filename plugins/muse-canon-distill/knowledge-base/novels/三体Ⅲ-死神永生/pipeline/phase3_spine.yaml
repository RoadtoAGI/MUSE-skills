# Phase 3: 故事脊椎 + 幕/Arc 框架 —— 《三体Ⅲ·死神永生》
# 逆向提取自完成作品

inciting_incident:
  description: >
    程心"没多想什么"就推荐云天明为阶梯计划候选人（L582-583）。
    这个看似随意的举动，将一个垂死之人的灵魂送入太空深渊，
    同时将程心自己绑上了一条无法回头的责任之路。
  type: decision
  timing: >
    第一部中段（L582），故事约15%处。
    在此之前的叙事（魔法师之死、生命选项、云天明买星）都是前史铺垫。
  balance_before: >
    程心是PIA的年轻技术助理，负责阶梯计划的航天专业评估，
    过着正常的、可控的职业生活。云天明是一个即将安乐死的绝症患者，
    两人是普通大学同学关系。
  balance_after: >
    程心亲手将深爱自己的人送上了"死得最惨"的道路（L591-593），
    由此背负了无法偿还的愧疚债务。这份愧疚成为她此后所有选择的
    潜意识驱动力——她后来保留DX3906恒星、竞选执剑人、
    将星环公司交给维德，都与这份原始的愧疚有关。
  impact_on_protagonist: >
    程心从一个"没多想什么"的旁观者，不可逆转地变成了"有责任的人"。
    云天明买星在先、程心推荐在后，两者构成一组不对等的赠予——
    他给了她一颗星星，她给了他永恒的流放。
    "在程心的余生中，她无数次回忆那一时刻"（L583）

desire_object:
  conscious: >
    弥补对云天明的亏欠，同时保护人类文明。
    这两个目标在不同阶段有不同表现：
    - 威慑纪元：竞选执剑人（"拥有那个遥远世界的人，也能拯救这个世界"L872）
    - 广播纪元：解读云天明的童话情报
    - 掩体纪元：在维德的光速飞船与人类安全之间做选择
    - 银河纪元：飞向DX3906——云天明送的星星
  unconscious: >
    在宇宙的冷酷法则面前为"人性"寻找容身之处。
    程心的每次选择都在问同一个问题：在毁灭两个世界和保全人性之间，
    能否找到第三条路？答案始终是"不能"，但她始终在寻找。
    最终在647号小宇宙中，她找到了那条路——
    为宇宙的命运负责，归还物质，但留下记忆（漂流瓶）和生命（生态球）。
  tension: >
    自觉欲望（保护文明）与不自觉需要（保全人性）的张力，
    恰恰构成了全书的核心悲剧：
    每当程心选择人性时，文明就遭受灾难（威慑崩溃、光速飞船被终止）；
    每当他人选择牺牲人性时（维德、褚岩），文明反而获得转机。
    这个张力直到最终高潮才以反讽的方式解决——
    程心选择归还小宇宙的物质，既是最大的牺牲，
    也是唯一一次"人性选择"与"正确选择"的合一。

spine_statement: >
  在愧疚与责任的驱动下，程心一次次被推上决定文明命运的位置，
  每次都选择了人性，每次都付出了更大的代价——
  直到她的责任从一个人扩展到两个文明，最终扩展到整个宇宙。
spine_type: unconscious
  # 表面脊椎是"弥补亏欠+保护文明"（自觉），
  # 真正的脊椎是"为人性寻找容身之处"（不自觉）——
  # 这条脊椎在最终的"归还小宇宙"选择中完成。

dramatic_question:
  question: >
    当人性的善良与文明的存续不可兼得时，
    程心的选择将把人类文明——乃至宇宙本身——引向何方？
  obligatory_scene: >
    程心必须面对一个终极的两难困境，
    在这个困境中"人性"和"文明存续"的矛盾被推到极致。
    这个场景出现了两次（双重错误结构）：
    1. 威慑控制中心——是否按下毁灭两个世界的按钮（L1188）
    2. 星环城——是否允许维德以武力推进光速飞船研究（L3361）
    最终回答在第六部：程心选择归还小宇宙物质（L4613-L4619），
    这一次，人性选择与正确选择终于合一。

opposing_forces:
  internal: >
    愧疚（对云天明的亏欠）、善良（无法按下毁灭按钮）、
    对暴力的本能排斥（无法接受维德的"不择手段"）
  personal: >
    维德的极端功利主义——"失去人性失去很多，失去兽性失去一切"
    罗辑的沉默审视——威慑度91-98%的前任执剑人
    智子的冷酷宣判——"威慑度约10%"
  external: >
    三体文明的水滴攻击、澳大利亚灭绝计划
    黑暗森林法则的无情运作——二向箔降维打击
    宇宙规律武器化——维度和光速被用作战争手段
    回归运动——大宇宙因小宇宙夺走质量面临死亡

# ── 幕/Arc 框架（从高潮回溯：故事需要几个重大逆转？）──

arcs:
  - arc_id: ARC-1
    name: "阶梯"
    value_at_start: "日常平衡——程心是PIA的普通技术人员"
    value_at_end: "愧疚与失去——程心亲手将深爱自己的人送入深渊"
    climax_event: "帆索断裂，飞行器失踪；维德揭示'星星是云天明送的'"
    function_note: "建置——确立愧疚债，开启责任阶梯"

  - arc_id: ARC-2
    name: "威慑"
    value_at_start: "安全——五十四年的威慑平衡"
    value_at_end: "暴露——太阳系坐标已向全宇宙广播"
    climax_event: "程心在最后十分钟无法按下按钮，威慑崩溃"
    function_note: "第一次致命选择——人性战胜理性，后果：42亿人被驱往澳大利亚"

  - arc_id: ARC-3
    name: "童话"
    value_at_start: "情报——云天明活着并传递了关键信息"
    value_at_end: "部分理解——掌握技术方向但关键信息被遗漏，活路被限制"
    climax_event: "曲率驱动航迹被发现→国际立法禁止光速飞船研究"
    function_note: "情报与封锁——三条活路浮现但逐一受限"

  - arc_id: ARC-4
    name: "投降"
    value_at_start: "最后希望——曲率驱动在技术上可行"
    value_at_end: "命运被封——人类唯一真正的活路被堵死"
    climax_event: "程心命令维德投降，光速飞船研究被终止"
    function_note: "第二次致命选择——与第一次形成双重错误结构"

  - arc_id: ARC-5
    name: "降维"
    value_at_start: "虚假安全——掩体世界自认为可以幸存"
    value_at_end: "文明毁灭——太阳系不存在了，仅余两人逃离"
    climax_event: "罗辑揭示光速飞船=黑域真相，程心意识到第二次选择的完整后果"
    function_note: "后果兑现——两次致命选择的代价在此完整显现"

  - arc_id: ARC-6
    name: "归还"
    value_at_start: "流亡——两个文明的遗孤飞向未知"
    value_at_end: "超越——在失去一切后，为宇宙命运负责"
    climax_event: "程心决定归还647号小宇宙物质，人性选择与正确选择终于合一"
    function_note: "责任阶梯登顶——从一个人的命运到宇宙的命运"

# ── 全篇危机与高潮 ──

story_climax_design:
  crisis:
    dilemma: >
      在647号小宇宙中，程心面临最终选择：
      留在小宇宙中可以永生（等待新宇宙创世）；
      归还物质则回到未知的、可能已面目全非的大宇宙。
      但如果所有小宇宙都不归还，大宇宙将因质量不足而永远膨胀至死——
      所有文明和记忆都将永远消亡。
    option_a: 留在小宇宙中永生，但成为宇宙死亡的帮凶
    option_b: 归还物质，回到未知的大宇宙，放弃永生的庇护所
    character_revelation: >
      揭示了程心一生不变的本质：即使在失去一切之后，
      她仍然选择承担责任。
      智子说"你还是在为责任活着"（L4621）——
      这不是批评，而是对程心最深层本质的最终确认。
      她的"缺陷"（善良到不忍毁灭）和她的"力量"（责任感到为宇宙负责）
      是同一枚硬币的两面。
  climax:
    action: >
      程心和关一帆决定拆空647号小宇宙，将约50万吨物质归还大宇宙，
      仅留下漂流瓶（文明记忆体）和程心制作的微型生态球（5公斤）。
      三人乘小型飞船穿过宇宙之门返回大宇宙。
    value_change:
      from: "失去一切（文明、家园、爱人）"
      to: "获得意义——'对于智慧文明来说，它们最后总变得和自己的思想一样大'（L4635）"
    controlling_idea_expression: >
      反讽型主控思想在此完成：
      程心的前两次"人性选择"导致了灾难（威慑崩溃、活路被封），
      但第三次"人性选择"（归还物质）却是唯一正确的选择——
      因为宇宙的存续需要所有文明的无私奉献。
      全书在毁灭的底色上涂下了一抹超越的亮色：
      人性的善良在宇宙的终极尺度上不再是软弱，而是责任。
  resolution:
    new_balance: >
      程心和关一帆带着智子进入未知的大宇宙。
      647号小宇宙只剩一个漂流瓶和一个生态球。
      大宇宙中1890万年已过，DX3906恒星早已熄灭。
      "但愿大宇宙能够忽略这个误差。"（L4662）
    lingering_feeling: >
      深沉的不确定感中带有微弱的希望。
      漂流瓶能否到达新宇宙？生态球中的小鱼能否存活？
      程心和关一帆在大宇宙中能否生存？
      一切悬而未决——正如宇宙本身的命运。
      但程心最后的选择赋予了"不确定"以尊严：
      她不是被动等待命运，而是主动为宇宙承担责任。
