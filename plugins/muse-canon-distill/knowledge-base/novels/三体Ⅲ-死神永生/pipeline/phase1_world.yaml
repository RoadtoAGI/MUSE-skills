# Phase 1: 世界构建分析 —— 《三体Ⅲ·死神永生》
# 逆向提取自完成作品

setting:
  era: >
    跨越约189亿年的多纪元叙事。
    起点：公元1453年（君士坦丁堡陷落，高维碎块历史事件）
    主体：危机纪元（~201X-2208）→ 威慑纪元（2208-2270）→ 广播纪元（2272-2332）
         → 掩体纪元（2333-2400）→ 银河纪元 → DX3906黑域纪元 → 宇宙终末
    每个纪元代表人类文明与宇宙黑暗法则关系的一个阶段。
  duration: >
    故事跨越约189亿年，但主角程心的体验时间远短于此——
    通过四次冬眠跳跃（危机纪元→威慑纪元61年→掩体纪元11年→掩体纪元67年）
    和一次光速飞行+低光速黑域中的1890万年沉睡。
    刘慈欣用冬眠机制将宇宙史压缩为一个人的生命体验。
  location: >
    空间尺度递增：
    1. 君士坦丁堡城墙内（序幕）
    2. 地球（危机纪元/威慑纪元）
    3. 澳大利亚保留地（威慑后）
    4. 太阳系（掩体世界，木星背后64座太空城）
    5. 奥尔特星云外（"万有引力"号/"蓝色空间"号）
    6. 银河系猎户旋臂（歌者文明视角）
    7. DX3906恒星系（蓝星）
    8. 647号小宇宙（时间之外）
  conflict_levels:
    internal: >
      程心的道德困境——在"人性"与"文明存续"之间无法两全。
      每次选择都出于善意却导致灾难，内心愧疚不断累积。
      杨冬的终极追问"宇宙去掉生命选项会怎样"在哲学层面贯穿全书。
    personal: >
      程心 vs 维德：人性主义与极端功利主义的对立。
      维德的"只能前进，不择手段地前进"与程心的"我选择人性"构成核心人际冲突。
      云天明与程心的跨纪元情感纽带——买星、阶梯计划、童话传情、最终错过。
      罗辑与程心的对照——两任执剑人，威慑度91-98% vs 10%。
    external: >
      三体文明的入侵威胁（水滴、智子监控、第二舰队）
      黑暗森林法则——宇宙中暴露坐标即招致毁灭
      降维打击（二向箔）——来自更高级文明的无差别清理
      宇宙规律武器化——维度和光速本身被用作战争工具

world_rules:
  universe_axioms:  # 宇宙公理层——本部揭示的终极规则
    - >
      物理规律可被武器化：宇宙的基本物理常数和维度结构
      不是不可更改的"自然法则"，而是可以被高级文明操控和改造的对象。
      维度可以被降低（降维打击），光速可以被降低（曲率驱动尾迹），
      空间曲率可以被改变。当前宇宙的物理规律是战争的遗迹，
      不是宇宙的本来面目。（第六部 L4192-L4236，关一帆揭示）
    - >
      宇宙原为十维，被战争"拍扁"：太初宇宙拥有十个宏观维度，
      光速接近无穷大——那是宇宙的"田园时代"。
      在漫长的宇宙历史中，超级文明之间的战争使用了能够
      操纵物理定律本身的武器，其"辐射尘降"导致高维度逐渐坍缩——
      十维→九维→……→三维。光速也在战争中被逐步降低。
      我们所处的三维低光速宇宙是维度战争的废墟。
      （第六部 L4192-L4236，关一帆对程心揭示）
    - >
      宇宙质量守恒与重生危机：宇宙的总质量被精确设计为
      恰好足够触发大坍缩（Big Crunch），使宇宙能够坍缩后重生。
      但无数文明为自保而创建袖珍宇宙，从大宇宙中带走质量，
      使大宇宙从封闭变为开放——将在永恒膨胀中热寂而死，
      而非坍缩重生。每个文明的个体求生行为都在系统性地
      摧毁宇宙本身。（第六部 L4610）
  physical:  # 故事机制层
    - >
      黑暗森林法则（前传公理，本部贯穿）：宇宙社会学两公理推演——
      生存是文明第一需要 + 文明不断扩张但物质总量恒定 →
      任何暴露坐标的文明都将被消灭
    - >
      降维打击：高维空间可被人为跌落为低维。
      二向箔将三维空间转化为二维，逃逸速度为光速（第五部 L3636）。
      这不是武器，而是宇宙本身被改造的结果——"把海弄干的鱼"（第二部 L1729）
    - >
      宇宙维度退化（公理层"十维→三维"的机制描述）：
      降维是宇宙战争的常规手段，当前三维状态是多次降维的累积结果。
      每次降维都是不可逆的——被降低的维度无法恢复（第六部 L4192-L4236）
    - >
      曲率驱动与黑域：空间曲率驱动可实现光速飞行，
      但航迹会降低真空光速。当光速降至逃逸速度以下，
      该区域成为低光速黑洞（黑域）——即宇宙安全声明（第三部 L2769-L2800）。
      光速飞船既是逃离工具也是安全声明
    - >
      四维空间碎块：三维宇宙中残存的四维空间泡，
      内部可看到三维世界的一切内部结构，"无限细节"（第二部 L1628-L1707）
    - >
      小宇宙与归零者：从大宇宙中切割出的独立微型宇宙，
      时间流速不同，可作为文明的终极避难所。
      但每个小宇宙都夺走大宇宙的质量。
      "归零者"（Returners）向所有小宇宙广播呼吁：
      "请归还你们带走的质量，只将记忆送入新宇宙。"
      程心和关一帆最终选择将647号小宇宙的质量归还大宇宙，
      以道德选择回应宇宙的终极困境。（第六部 L4610-L4635）
  social:
    - >
      威慑博弈学：终极威慑的成功取决于威慑度——
      群体控制威慑度≈0%，只有不可预测的个体才能维持威慑。
      由此产生"执剑人"制度（第二部 L900-L916）
    - >
      人类社会女性化：威慑纪元的长期和平导致社会审美和气质全面女性化，
      男性外表趋向柔美，"良心和责任"被视为心理疾病（第二部 L852-L860）
    - >
      冬眠法律体系：冬眠者的财产权受绝对保护，
      跨世纪苏醒后仍保留所有权（程心的DX3906恒星所有权，第二部 L839-L845）
    - >
      掩体世界：木星背后的64座太空城，9亿人口的城邦世界，
      联邦政府管理，太空城间存在贫富分化（第四部 L3113）
    - >
      光速飞船禁令：曲率驱动航迹暴露文明位置，
      国际立法全面禁止曲率驱动研究（第三部 L2986-L3016）
  psychological:
    - >
      "圣母"困境：人类社会倾向于选择"善良"的领导者（程心当选执剑人），
      但善良在终极威慑中等于软弱——威慑度仅10%（第二部 L1236）
    - >
      宇宙级虚无主义：杨冬的"生命选项"追问——
      宇宙的物理规律可能已被生命改变，"自然"的宇宙是否还存在？
      这一哲学恐惧贯穿至终章（第一部 L141-L192）
    - >
      责任的递增：程心的一生是"攀登责任阶梯"——
      从好学生→火箭工程师→阶梯计划→执剑人→光速飞船→宇宙命运（第六部 L4622-L4635）

genre_conventions:
  primary_genre: 硬科幻（宇宙史诗）
  secondary_genre: 悲剧
  conventions:
    - convention: >
        科幻类型惯例：技术方案是推动情节的核心引擎
        （阶梯计划、掩体计划、曲率驱动、黑域方案）
      planned_subversion: >
        每个技术方案都不是"解决问题"而是"制造新问题"。
        阶梯计划失控→掩体计划无效→曲率驱动被禁→
        技术方案的失败链构成叙事的下行弧线，
        颠覆了"科技拯救人类"的类型常规
    - convention: >
        科幻类型惯例：英雄拯救文明
      planned_subversion: >
        主角不是拯救者而是"犯错者"。程心的两次关键选择
        都导致灾难。真正的"拯救者"维德被她阻止并被处决。
        这彻底颠覆了科幻英雄叙事
    - convention: >
        悲剧类型惯例：主角因性格缺陷走向毁灭
      planned_subversion: >
        程心的"缺陷"恰恰是人类最珍视的品质——善良、爱、对生命的尊重。
        她不是因为"坏"而犯错，而是因为"好"而犯错。
        这使悲剧超越了个人层面，成为对人类文明本性的拷问
    - convention: >
        史诗类型惯例：宏大叙事中个体被淹没
      planned_subversion: >
        通过冬眠机制，将189亿年的宇宙史压缩为一个女性的生命体验。
        宇宙级的宏大叙事始终锚定在程心的个人视角和情感上

creative_constraints:
  - constraint: 冬眠跳跃——主角每次苏醒面对已剧变的世界
    narrative_function: >
      既是时间压缩工具，也制造持续的认知落差和戏剧张力。
      程心每次苏醒都像"新生"，必须重新理解世界规则
  - constraint: 智子全程监控——人类在三体面前无秘密
    narrative_function: >
      限制了直接情报传递，迫使云天明用童话编码传递信息，
      催生了全书最精彩的"故事中的故事"叙事段落。
      编码方法为双层隐喻——故事中的隐喻不直接指向真实含义，
      而是指向一个中间事物，再由该事物指向真正的情报。
      三条战略情报：(1) 曲率驱动/光速飞行可行；
      (2) 掩体计划——在气态巨行星阴影中建造太空城；
      (3) 黑域计划——通过降低光速建立宇宙安全声明
  - constraint: 光速是逃逸速度的上限——太阳系内无处可逃
    narrative_function: >
      二向箔打击的终极恐怖在于"无法逃离"。
      唯一的出路（曲率驱动）已被程心亲手封死，
      构成不可逆转的悲剧性
