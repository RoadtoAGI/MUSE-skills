novel: 三体Ⅲ-死神永生
author: 刘慈欣
lang: zh
translator: ''
narration_voice: 编年史框架：场景叙事与《时间之外的往事》史料节选交替；限知深贴程心纵贯数纪元，嵌套段整体换语态（童话说书/歌者内视角）
diction: 白话为骨，纪元名与工程参数构成时间坐标；自造概念词成体系（黑域/二向箔），童话段换程式语汇，抒情意象宏阔至宇宙尺度
rhetoric_density: medium
dialogue_mode: 问答释设定仍是主轴；双层密语对白成体系（童话传情/明语目光双轨）；宣告式独白与维德式短刀台词一句改写局面
pacing: 纪元跳跃大开大合，史料段从容场景段收紧；灾难奇观慢摇细写（二维化），抉择时刻倒计时挤压，收束于一念或一物
signature_moves:
- 编年史插件：正文中嵌《时间之外的往事》节选，用后世史评预告与反讽当下事件
- 童话密语：嵌套童话整卷收录，表层自洽说书腔，双层隐喻加含义坐标编码情报
- 宇宙尺度挽歌：灭世写成审美对象（二维化如名画展开），美与毁灭同框，悲悯不煽情
- 纪元跳跃换世界：冬眠醒来即新时代，借苏醒者陌生目光逐物重建世界观
- 异文明内视角：以自造术语体系写歌者心流，毁灭决策出自日常工作的漫不经心
anti_signature:
- 把程心写成果决英雄——本作主角以善良铸错，叙述对其选择保持悲悯而非辩护
- 灾难场景靠惨叫与血腥堆砌——本作大毁灭走冷静观测与审美化路线
- 史料段写成干瘪设定罗列——本作史评带格言与反讽，承担叙事张力
author_cross_ref: 承袭前两作问答释设定、奇观慢摇、冷句收束；本作时间尺度最大，新增编年史插件与童话密语两大结构装置，语调从对抗转向挽歌
