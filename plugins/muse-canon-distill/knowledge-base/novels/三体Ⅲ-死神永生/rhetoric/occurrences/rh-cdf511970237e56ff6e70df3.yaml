chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 把一个人类送进敌人的心脏
sensory_mapping: 庞大外星舰队获得躯体，舰船防线成为皮肉，一个孤立人脑沿探测器轨迹钻向跳动核心。
context_fact: PIA无法靠轻型探测器有效侦察，于是设想让三体舰队主动截获人类，获得内部行动可能。
image_mechanism: 心脏把空间上的深入与战略上的关键性合并，送进则凸显进入者不是外部观测，而是被动植入。
property_alignment: 敌舰体系对应身体；核心区域对应心脏；截获进入对应植入体内；潜在情报破坏对应影响循环。
context_alignment: 人类身份完全暴露却仍有价值，正因为心脏位置可让小型、透明的主体产生超出体量的作用。
narrative_function: 一句话重构阶梯计划目标，从远程侦察转为核心渗透，并为后续炸弹意象建立容器。
transfer_rule: 系统如身体时，心脏应对应不可替代的功能中心；进入路径、外层防御和全局后果至少两项需明确。
failure_boundary: 若进入者只停留外围、无法接触关键功能，心脏会夸大位置；舰队也未必具有单一集中核心。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 让一名人类进入三体舰队内部最关键、最受保护并可能影响整体的位置
vehicle: 异物越过外层防御，被植入生物体维持生命和驱动全身的心脏
ground: 目标位于系统内部核心；微小进入者一旦到达，可能接触关键循环并造成全局后果
