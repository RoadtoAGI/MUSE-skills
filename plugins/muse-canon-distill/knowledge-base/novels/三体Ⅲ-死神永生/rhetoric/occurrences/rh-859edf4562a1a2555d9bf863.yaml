chapter: 【危机纪元4年，云天明】
figure_type: metaphor
quote: 不过他还是抱着一线希望
sensory_mapping: 不可量化的概率变成指间细线，抱持希望成为用身体护住脆弱连接的动作。
context_fact: 三百万元不能直接改变病情，他仍绕过主治医生向权威专家询问能否治愈。
image_mechanism: 一线先缩小希望量级，抱着再赋予主动维持；咨询行动证明他仍沿这根细线寻找生路。
property_alignment: 治愈概率极低对应线体纤细；咨询专家对应抓住线索；专家否定后希望中断对应细线断开。
context_alignment: 人物已申请死亡倾向，却仍做最后验证，细线准确表达求生没有归零而承载力有限。
narrative_function: 在正式放弃前保留最后一次求生动作，使安乐申请具有确认后的终局性。
transfer_rule: 以细线写微弱可能时，后文应出现抓持或追索行为，并明确什么信息会让连接承重或断裂。
failure_boundary: 若成功概率可观或人物毫不采取行动，一线的微量与抱持动作都会不合；它也不说明希望客观存在。
