chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 所以你看，最终的胜利者还是大自然
sensory_mapping: 归零者在宇宙里奔忙，大自然却像沉默的终局参赛者，只靠引力在最后一刻收拢全部赛场。
context_fact: 银河人类宇宙学认为暗物质足以使宇宙由膨胀转为坍缩并再次大爆炸。
image_mechanism: 胜负框架把无意志的宇宙演化写成与文明工程同场竞争，并以自然机制的必然性压过技术意志。
property_alignment: 归零计划对应参赛目标；文明技术对应竞争行动；宇宙引力对应更强选手；大坍缩对应获胜结果；最终时刻对应决赛。
context_alignment: 程心刚从归零者看到亮色，关一帆把希望移交自然，使安慰不再依赖文明道德。
narrative_function: 以简洁收束结束死线讨论，并为后来质量流失破坏大坍缩埋下反转。
transfer_rule: 自然过程写成胜者时，应指出它与人为行动共享的目标、各自机制以及决定终局的优势。
failure_boundary: 大自然没有意志、策略或荣誉，宇宙是否必然坍缩后来也因质量流失而改变。
