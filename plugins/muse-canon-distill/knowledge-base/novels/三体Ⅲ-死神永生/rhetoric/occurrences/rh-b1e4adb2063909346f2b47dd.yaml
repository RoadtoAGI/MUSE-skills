chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 他们就像落在水上的一滴滴彩色墨水，瞬间在平面扩展开来
sensory_mapping: 一个个人体碰到明亮水面便像彩墨绽开，衣服、皮肤和器官瞬间晕成薄薄色纹。
context_fact: 有些人推进器故障，有些主动放弃逃跑；二维展开遵守结构不重叠规则。
image_mechanism: 墨滴以日常表面扩散模拟三维到二维的面积暴增，流丽色彩与人体死亡构成残酷美感。
property_alignment: 人体对应墨滴；二维面对应水面；接触瞬间对应落水；结构展开对应晕散；衣物器官色彩对应彩墨。
context_alignment: 前文城市像沉船、水面上升，居民成为落水墨滴，把同一液态框架从城市尺度推进到个人身体。
narrative_function: 首次近距离显示人体二维化形态，以单滴过程让百万死亡获得清晰可视机制。
transfer_rule: 物体降维比作墨滴扩散时，应对齐接触点、厚度变化、面积增长、色彩保留和时间尺度。
failure_boundary: 人体组织没有溶解或分子扩散，二维边界受精确映射规则约束；墨水只模拟外观与速度。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 逐个跌入二维面的居民，身体结构在接触瞬间摊开成面积巨大的彩色二维人体
vehicle: 彩色墨滴落到水面后迅速向四周晕散成薄而宽的色斑
ground: 由小体积接触平面；扩展突然；颜色保留；厚度消失；边界向外铺开；每滴形态不同
