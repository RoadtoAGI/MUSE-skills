chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 在三维部分的太空城上，有三团黑烟一样的东西在扩散，那是被泄漏的空气形成的狂风吹出来的人群
sensory_mapping: 三股人群从城壳破口喷出，黑点在真空里散开，远看像建筑正在冒出浓烟。
context_fact: 城内空气外泄形成狂风，把未主动离城的人吹出太空城。
image_mechanism: 烟团把气流驱动的人群变成灾后征候，城市仿佛已燃烧，而“烟”的每个颗粒实际都是人。
property_alignment: 人群黑点对应烟粒；泄漏口对应烟源；狂风对应上升气流；扩散轨迹对应烟羽；三处群体对应三团烟。
context_alignment: 玻璃城的碎裂声之后出现黑烟视觉，常规城市毁灭感官被借来解释非燃烧的维度灾难。
narrative_function: 在外部远景中显示空气泄漏的方向和规模，并以认知翻转恢复黑团中的人命。
transfer_rule: 远距人群比作烟时，应交代颗粒密度、流体驱动、出口位置、扩散边缘和身份揭示。
failure_boundary: 黑团不是燃烧产物，没有烟尘或上升热流；相似限于远观颜色与扩散形态。
