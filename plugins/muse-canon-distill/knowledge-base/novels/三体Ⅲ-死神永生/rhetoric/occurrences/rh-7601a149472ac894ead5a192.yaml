quote: 灾难的引信才刚刚点燃
sensory_mapping: 行星熔成暗红死球，只像火星刚咬住导火索，亮点继续向恒星内核爬去，终端巨爆仍在等待。
context_fact: 喷出导致恒星压力降低和核聚变变弱，随后外壳坍缩挤压内核，引发最终爆发。
image_mechanism: 引信把多个天体物理阶段串成一条燃烧路径，生命灭绝从终点改写为总爆炸之前的早期触发。
property_alignment: 光粒撞击对应点火；喷出与降压对应火星推进；恒星坍缩对应接近炸药；最终爆发对应主装药爆炸。
context_alignment: 读者刚见行星已无生命，通常以为灾难结束；才刚点燃立即扩展毁灭尺度，维持叙事升级。
narrative_function: 以未完成动作制造后续悬念，并清楚标示行星毁灭与恒星爆发的因果顺序。
transfer_rule: 连锁灾难如引信时，应为点火、推进路径、主爆节点和不可逆条件建立一一对应。
failure_boundary: 恒星反应没有实体导火线或预设炸药，物理进程也可能受复杂因素影响；引信只表达链式阶段。
