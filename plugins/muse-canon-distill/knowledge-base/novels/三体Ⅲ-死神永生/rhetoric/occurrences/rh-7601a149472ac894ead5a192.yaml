tenor: 三体行星生命灭绝后，恒星仍将继续坍缩爆发并摧毁整个星系的连锁灾变刚进入后续阶段
vehicle: 炸药引信被火点着，火星沿线推进，真正的大爆炸尚未发生却已难以阻止
ground: 初始触发已经发生；过程将沿因果链继续；更大爆发在后；留给阻止的时间极少且趋势不可逆
