chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 他们都在驶向一个巨大的未知，驶向同样未知的命运
sensory_mapping: 小艇离开启示号这座岛，白Ice像沿丁仪旧航线驶进没有坐标的黑域，命运就在前方。
context_fact: 丁仪曾驶向水滴并死亡，白Ice现在乘小艇近距接触纸条，感觉与导师心灵相通。
image_mechanism: 未知和命运被空间化为航向，实际太空艇运动因此与跨时代人生轨迹完全重叠。
property_alignment: 接近纸条对应航行；未知对象对应未标目的地；丁仪前例对应旧航线；死亡风险对应命运终点。
context_alignment: 周围太空已比作海洋孤岛，驶向未知将同一空间框架转为师徒精神继承。
narrative_function: 把白Ice的恐惧从个人直觉提升为导师遗产，并为他阻止触碰纸条提供动机。
transfer_rule: 未知命运写成航行时，应对齐实际移动、前人路线、信息空白、终点风险和选择主动性。
failure_boundary: 丁仪和白Ice面对的物体与结局不同，命运也非固定地点；相通是人物主观感受。
