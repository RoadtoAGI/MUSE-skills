chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 每次，他都像是扔给她一个致密的线团，她得一段一段把线团拆开才能领会其中复杂的含义
sensory_mapping: 维德一句话落到程心手中变成硬实线球，她要找到藏住的线头，逐圈松开才看见全意。
context_fact: 维德在监狱中只说自己要去竞选世界总统，程心立刻感到不寒而栗，甚至不敢继续推演。
image_mechanism: 线团把信息压缩和推理顺序同时物化，致密还说明短句并非简单，而是意义缠得过紧。
property_alignment: 简短话语对应小线团；复杂含义对应缠绕长线；逐段推理对应拆线；不敢想后果对应不敢找线头。
context_alignment: 这是两人跨三个世纪的固定交流模式，反复抛接线团准确刻画维德省言、程心延迟理解的关系。
narrative_function: 在不立即解释计划的情况下制造政治恐惧，并让程心的认知习惯成为悬念装置。
transfer_rule: 信息压缩比作线团时，应对应输入体积、内部关联、拆解顺序和拒绝拆解的心理代价。
failure_boundary: 复杂含义未必只有一条可顺序还原的线；若话语本身混乱无结构，拆线会错误暗示答案完整存在。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 维德极短话语中压缩的复杂意图，以及程心逐层理解它的过程
vehicle: 被紧密缠结后抛来的线团，接收者必须逐段找到线头并拆解
ground: 表面体积小而内部关系多；理解需要按顺序解开连接；拆开前看不见完整长度与结构
