chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 墙上有光影移动，就像路灯照进行驶的车内
sensory_mapping: 宿舍像行驶车厢，太阳成一盏盏巨大路灯，每几秒从窗外掠过，光带扫过墙面。
context_fact: 运载舱接近轨道后约四十分钟绕地一周，太阳在舷窗外反复升落，程心睡梦将舱室改造成宿舍。
image_mechanism: 车内路灯把轨道运动带来的快速日夜循环降到日常速度经验，移动的是房间而非光源。
property_alignment: 运载舱对应行驶汽车；宿舍墙对应车内壁；太阳掠过对应路灯经过；周期明暗对应连续灯影。
context_alignment: 梦把大学宿舍与航天舱叠合，路灯车影是二者都能容纳的中间图像，使失重醒来不突兀。
narrative_function: 以熟悉光影解释陌生轨道昼夜节律，并把现实运动渗入程心的旧日梦境。
transfer_rule: 室内移动光影如车灯时，应确定谁在运动、光源间隔、投影表面和明暗周期。
failure_boundary: 太阳只有一个且实际是舱体绕地反复见光，不是沿路多盏灯；梦境压缩了天体机制。
