tenor: 太空电梯上升时太阳频繁升落，在程心梦中大学宿舍墙面造成的快速移动光影
vehicle: 汽车夜间行驶经过一盏盏路灯，外部灯光从车窗扫入，亮斑在内壁连续滑过
