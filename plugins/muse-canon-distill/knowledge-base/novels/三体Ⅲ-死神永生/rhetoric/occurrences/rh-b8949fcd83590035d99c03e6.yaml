review_status: reviewed
tenor: 歌者古歌谣中作为礼物的一小块凝固时间，其表面有条纹且具有可触摸的柔软质感
vehicle: 浅海水底含水丰富的细泥，手指触及时湿润、柔顺、可塑并带有缓慢流动感
ground: 凝固时间对应泥块；可触质地对应海泥触感；柔软对应高含水细泥；条纹对应浅海沉积纹；可涂抹对应泥可敷身；时间流动性对应泥缓慢变形
