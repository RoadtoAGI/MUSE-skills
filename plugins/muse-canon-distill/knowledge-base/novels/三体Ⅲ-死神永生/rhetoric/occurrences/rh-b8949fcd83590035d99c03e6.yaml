chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: simile
quote: 摸起来像浅海的泥一样柔软
sensory_mapping: 软海泥；指下微陷；湿润条纹；时间成块；柔物可涂
context_fact: 歌者吟唱母世界古歌谣，歌中爱人收到“凝固的时间”，随后把时间涂满身体。
image_mechanism: 最抽象的时间先凝成可捧物，再借海泥获得湿软触觉；流逝性没有消失，而潜伏在受压会变形、可涂开的物质中。
property_alignment: 凝固时间对应泥；时间条纹对应沉积层纹；柔软对应细泥质地；可捧对应泥团；可涂全身对应泥浆延展；古老时间对应海底沉积；缓慢变化对应泥形可塑
context_alignment: 异星歌谣用本土浅海经验描写高维物质，既显示歌者文明能操弄时间，也保留古朴情歌的身体亲密。
narrative_function: 以触觉而非理论解释“凝固时间”，建立歌者文明陌生却可感的审美。
transfer_rule: 用泥写抽象时间物质时，应让对象确实可捧、可压、可涂，并让纹理、沉积或缓慢变形保留时间属性。
failure_boundary: 对象坚硬脆裂、只能观测不能触碰，或时间被描写为高速尖锐能量时，浅海软泥的触觉机制会冲突。
quality_assessment: exemplary
