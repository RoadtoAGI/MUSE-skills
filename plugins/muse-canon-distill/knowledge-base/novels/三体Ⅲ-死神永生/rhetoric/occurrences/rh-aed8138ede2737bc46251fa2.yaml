chapter: 【威慑纪元12年，“青铜时代”号】
figure_type: simile
quote: 地球就像一盏突然关掉的灯
sensory_mapping: 广播通信合成行星灯光，地球表面成为灯泡，两天沉默像开关啪地落下。
context_fact: 末日战役后青铜时代号仍监听地球一年半，随后所有电磁波突然消失。
image_mechanism: 灯把多波段信号统一成可见亮度，关掉强调同步、突发与外部断源，而不是逐渐远弱。
property_alignment: 持续广播对应灯持续发光；全波段消失对应断电；突然两天归零对应开关动作。
context_alignment: 远航者只能从信号判断母星存续，灯灭自然触发地球可能死亡的恐惧。
narrative_function: 用单一动作压缩通信灾变，为后来返航诱饵和地球变化留下悬念。
transfer_rule: 信息源如灯时，应有持续辐射、统一可检测性和明确断点；渐远衰减不适合开关式熄灭。
failure_boundary: 若只停一个频道、信号逐渐变弱或因接收器故障，整盏灯关掉会误判源端状态。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 所有波段电磁信息在两天内完全停止向太空溢散的地球
vehicle: 持续发光的灯被突然切断电源后陷入黑暗
ground: 原本稳定向外辐射可探测信号；信号在短时整体归零且原因对远方观察者不可见
