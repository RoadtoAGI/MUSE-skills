chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 智子正幽灵般地悬浮在周围
sensory_mapping: 空会议室填入透明漂浮者，空气中的每个位置都可能有一双看不见的眼睛。
context_fact: 智子实时把PIA讨论传回四光年外，所有计划从制定起即对敌人透明。
image_mechanism: 幽灵为不可见监听者提供占位感，却保留无法触碰和驱赶的无力；悬浮让监视覆盖而不需入口。
property_alignment: 智子不可见对应幽灵无形；近距监听对应幽灵缠绕；穿透封闭会议对应亡灵越界。
context_alignment: 参与者会忘记后突然想起，正符合幽灵从意识背景骤然显现的恐惧模式。
narrative_function: 让技术监控获得空间压迫，说明保密机构在根本上无法保密。
transfer_rule: 不可见技术借幽灵写时，应落在感知缺席、空间贴近和无法驱除三项；不要外推其超自然意图。
failure_boundary: 若监视器位置可见、可屏蔽或只远程收集公开信息，幽灵式无处不在与越界能力会夸大。
