chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 像一颗光秃秃的大石球
sensory_mapping: 灰星悬在黑空，灰白表面没有云、海或草，只像一颗被磨圆后丢在轨道上的巨石。
context_fact: 灰星体积较小，外观似月球但没有环形山，大部分为平原。
image_mechanism: 大石球删去行星应有的世界感，把它还原为单一无生命物件，衬出死线的人工异常。
property_alignment: 行星球体对应石球；灰色地表对应石色；无大气植被对应光秃；荒原对应单调石面；寂静对应无生命物。
context_alignment: 蓝星是简化地球，灰星甚至被进一步简化为一块石头，两个世界的生命层级形成鲜明对照。
narrative_function: 用最低复杂度背景突出五根百千米黑线，使来访者遗迹成为唯一视觉焦点。
transfer_rule: 荒行星比作石球时，应落实颜色、覆盖层缺失、表面纹理、生命迹象和与异物的对照。
failure_boundary: 灰星有地质结构、重力和行星尺度，不是普通石块；比喻只概括远观表面。
quality_assessment: conventional
confidence: 1.0
review_status: reviewed
tenor: 无大气、无植被、无环形山且由荒凉平原构成的灰星整体外观
vehicle: 表面裸露、颜色灰暗、没有附着物和纹理装饰的一颗巨大圆石
ground: 球形；灰色；表面荒芜；缺少大气和生命覆盖；纹理单调；坚硬裸露；整体沉寂
