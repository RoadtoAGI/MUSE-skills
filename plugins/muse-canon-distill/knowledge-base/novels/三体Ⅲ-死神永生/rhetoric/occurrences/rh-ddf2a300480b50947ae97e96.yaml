quote: 程心，则像听到末日审判般微微颤抖起来
sensory_mapping: 主席台变成审判席，云天明的舒缓陈述成为宣判声，程心身体在无形法槌下轻颤。
context_fact: 程心曾以善意推动云天明参加阶梯计划，此刻发现他并不认同自己对人类负有责任。
image_mechanism: 末日把个人拒誓扩大为程心价值世界的终结；审判又反转仪式权力，让被选者的话裁决选择者。
property_alignment: 云天明最终表态对应终审判词；程心罪疚对应受审者恐惧；价值信念崩塌对应末日。
context_alignment: 宣誓仪式本有宗教庄重感，末日审判从同一仪式语域生长，强度由她的责任直接支撑。
narrative_function: 把拒誓的伦理冲击落到程心身体，确立她后续崩溃与补偿冲动。
transfer_rule: 审判喻体须有权威话语、不可逆结论和听者自觉有责；末日等级只适合核心价值整体坍塌。
failure_boundary: 若程心只是意外、并无罪疚或仍能轻易改变态度，末日终审会过度；云天明也没有法律裁判权。
