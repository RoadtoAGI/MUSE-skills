chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 维德像一个黑色的鬼魅，只有双眸的冷光时隐时现
sensory_mapping: 城市灯海成为阳世，维德身体被剪成黑影，双眼像鬼火在阴影中明灭。
context_fact: 罗辑遇刺后救护车开远，城市恢复光芒，维德留在现场冷眼观察。
image_mechanism: 背景越明亮，逆光人物越黑；鬼魅把这种光学剪影与维德游离常规伦理的气质合并。
property_alignment: 逆光黑影对应鬼魅无实体；冷眼时隐时现对应鬼火；置身灯海外对应徘徊阳世边缘。
context_alignment: 暗杀和情报世界刚显露，维德不随救援行动离开，鬼魅准确承接其旁观与危险。
narrative_function: 以一幅强反差剪影收束事件，并把维德标成危机背景中的冷暗力量。
transfer_rule: 人物鬼魅化应先由真实光位造成轮廓消失，再让眼神、行动位置支持非人气质；不可只因人物穿黑衣。
failure_boundary: 正面均匀照明、表情温暖或积极参与救援时，黑鬼魅的边缘游荡和冷意都不成立。
