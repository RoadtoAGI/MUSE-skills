tenor: 纽约灯海前几乎融入黑暗、只露冷眼的维德
vehicle: 无实体轮廓、在光亮人世边缘游荡的黑色鬼魅
ground: 身体边界在暗处难辨；只有眼部冷光间歇出现并造成非人威胁
