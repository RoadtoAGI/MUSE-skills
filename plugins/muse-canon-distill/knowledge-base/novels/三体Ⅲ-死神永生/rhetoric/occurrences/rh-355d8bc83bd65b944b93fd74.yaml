review_status: reviewed
tenor: 在所有外部参数下威慑度都保持百分之百、令三体恐惧的维德
vehicle: 意志不可软化、会毫不犹豫带来毁灭且令对手恐惧的魔鬼
ground: 不受常情约束；毁灭承诺可信；仅被想到便引发强烈恐惧和驱逐反应
