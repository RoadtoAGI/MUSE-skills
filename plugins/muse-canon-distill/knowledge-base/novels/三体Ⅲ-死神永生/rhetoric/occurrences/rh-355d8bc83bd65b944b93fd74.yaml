chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 那个魔鬼
sensory_mapping: 没有起伏的百分百直线在智子眼中立起一个恶魔轮廓，她摇头也无法把它从脑中赶走。
context_fact: 智子说维德没有普通威慑曲线，任何环境下都顶在百分之百，并显露恐惧。
image_mechanism: 魔鬼为恒定数值补上人格危险性，智子的身体反应又使称谓超出一般辱骂。
property_alignment: 绝不退让对应恶魔意志；敢于广播对应毁灭能力；智子恐惧摇头对应见到邪物般驱逐。
context_alignment: 智子刚被程心视为美丽魔鬼，却用同一称谓描述维德，敌我双方各自把最危险者放入恶魔类别。
narrative_function: 用三体视角追认维德的威慑能力，强化人类选择程心的反事实代价。
transfer_rule: 敌人称某人为魔鬼时，应以敌方具体恐惧动作和对方稳定行为边界支撑，而非只靠立场贬称。
failure_boundary: 维德仍是有策略与目标的人类，魔鬼不能替代其政治伦理分析，也不证明所有极端行为有效。
quality_assessment: effective
