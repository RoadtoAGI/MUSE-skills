tenor: 程心在末日消息造成的混乱意识里首先清晰想到回地球
vehicle: 一个物体从黑暗浑浊的深水中上浮到水面，率先进入可见范围
ground: 背景混浊黑暗；其他内容沉没难辨；目标由深处出现；出现有先后；浮到表面后可被表达
