chapter: 【掩体纪元67年，冥王星】
figure_type: metaphor
quote: 在她已经陷入混乱和黑暗的思绪中，这个愿望最先浮上来
sensory_mapping: 她的意识像一池被搅黑的水，回地球这一愿望从沉底的杂念间慢慢浮到水面。
context_fact: 程心刚得知太阳系将在八至十天内全部二维化，无法组织更复杂的行动方案。
image_mechanism: 先以陷入构造下沉，再以上浮给愿望反向运动，空间层次让混乱意识中的念头筛选可见。
property_alignment: 混乱思绪对应浑水；黑暗对应水下低能见度；愿望对应上浮物；首先想到对应最先露出水面。
context_alignment: 真正的安全路径已不存在，能浮出的只剩回地球这一情感归宿，理性选择被压到意识深处。
narrative_function: 在一句话内表现创伤后的认知收缩，并自然引出落叶归根的下一层解释。
transfer_rule: 念头写成上浮物时，应同时建立意识介质、深浅可见度、出现顺序和触发它上浮的压力。
failure_boundary: 愿望没有物理位置或浮力，程心也未完全失去思考；上浮仅表示最先进入清晰意识。
