chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 就像冻豆腐，解冻后成了海绵状
sensory_mapping: 不可见细胞损伤被放大为切开冻豆腐可见的蜂窝孔洞，人体组织获得海绵触感。
context_fact: 专家讨论三体人能否复活被快速深冻的人脑，人类解冻会破坏细胞。
image_mechanism: 厨房材料复现冻结—撑裂—解冻—多孔的完整机制链，不仅说明结果，还解释损伤何时发生。
property_alignment: 细胞含水对应豆腐含水；冰晶胀大对应冻豆腐形成孔隙；解冻组织失稳对应海绵状残体。
context_alignment: 专家面对跨国技术人员主动确认其生活经验，口语类比承担科学沟通而非文学装饰。
narrative_function: 把微观复活障碍转成可触实例，界定人类与三体技术差距。
transfer_rule: 科普微结构损伤时，可选材料成分和相变机制相同的实例，并按过程顺序对应，不能只凭成品外观。
failure_boundary: 若采用玻璃化避免冰晶、解冻不留孔隙，冻豆腐机制失效；豆腐尺度也不等于人体组织损伤程度。
