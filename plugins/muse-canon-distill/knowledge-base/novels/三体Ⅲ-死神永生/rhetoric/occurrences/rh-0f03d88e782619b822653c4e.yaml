tenor: 不受任何碰撞影响、相对宇宙坐标保持绝对稳定的纸条平面
vehicle: 定义空间位置和方向、其他物体据此测量而自身不随局部作用移动的宇宙基准面
ground: 位置稳定；平面方向明确；不受局部参照物拖动；可成为测量基准；尺度小却服从全局坐标
