chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 它也像一个小小的宇宙基准面，精确地保持原位不动
sensory_mapping: 飞船与机械臂在它周围移动，白平面像钉在宇宙坐标纸上的零面，所有局部运动都从它旁边滑过。
context_fact: 接触无法改变其位置或轨道丝毫，后续还发现它没有厚度。
image_mechanism: 基准面把不可推动从被动幽灵升级为全局几何稳定，暗示它属于不同维度规则。
property_alignment: 纸条平面对应坐标面；原位不动对应基准稳定；飞船运动对应局部参照变化；无厚度对应几何面。
context_alignment: 人类试图用机械抓取处理它，基准面类比迫使认识从材料工程转向宇宙几何。
narrative_function: 把异象导向维度物理解释，并预告它将成为二维空间扩展的起点。
transfer_rule: 物体比作基准几何时，应对齐维数、位置不变量、参照系关系和局部外力无效。
failure_boundary: 真正宇宙没有绝对静止基准，纸条仍有轨道描述；类比是观察者对异常稳定的近似。
quality_assessment: exemplary
