chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 只能接收到来自三体世界的挤牙膏似的零星信息
sensory_mapping: 知识成为黏稠牙膏，三体世界握住管口，人类每次只能得到一小段。
context_fact: 实际情况相反，三体在短期系统传送海量完整学科知识。
image_mechanism: 挤压动作把信息稀缺归因于提供方控制，零星膏段与后文海量洪流构成数量反差。
property_alignment: 少量信息对应一点膏体；分批释放对应反复挤压；三体控制对应握管者。
context_alignment: 这是人类基于敌对关系的旧预测，日常窘迫动作准确表现其低期待。
narrative_function: 建立信息供给基线，使三体过度慷慨显得更反常可疑。
transfer_rule: 受控少量供给如挤牙膏时，应有资源持有者、分次释放和外部施压；自然间歇不适用。
failure_boundary: 若信息一次海量公开、按稳定计划主动提供或并不稀缺，挤牙膏失效。
quality_assessment: conventional
confidence: 0.94
review_status: reviewed
tenor: 人类原先预期三体只会少量、分次且勉强提供知识
vehicle: 反复用力挤压快空牙膏管，每次只挤出一点膏体
ground: 供给量小而不连续；接受者需持续施压，提供者有意控制每次释放
