chapter: 【威慑纪元62年，奥尔特星云外，“万有引力”号】
figure_type: metaphor
quote: 面对前方茫茫的太空荒漠
sensory_mapping: 黑色太空变成无水沙海，恒星退到遥远地平线，飞船燃料成为唯一水囊，推进停止就滞死途中。
context_fact: 逃亡舰不能无限加速，否则会耗尽燃料、失去机动能力，即使摆脱追兵也无法完成后续航行。
image_mechanism: 荒漠把真空缺乏补给转成陆地求生经验，茫茫同时呈现距离和方向单调，使燃料约束立即可感。
property_alignment: 深空空无对应荒漠贫瘠；星际长途对应沙海远行；燃料储备对应携水；失去机动对应困在荒地。
context_alignment: 两舰加速博弈的底线不是瞬时速度，而是穿越后续无补给区域的续航，荒漠模型准确指向策略核心。
narrative_function: 用生存地理解释蓝色空间号为何停止加速，让燃料博弈从数字变成可见困境。
transfer_rule: 未知空间如荒漠时，应对应资源稀缺、补给间距、路径长度和耗尽后果；黑暗本身不足以构成荒漠。
failure_boundary: 附近有可达恒星、补给站或采集资源时，绝对荒漠会低估环境；太空也没有沙地阻力。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 蓝色空间号若耗尽燃料后仍须穿越的广阔、冷寂且没有补给与机动资源的深空
vehicle: 无边干旱荒漠，路程漫长，沿途没有水源、聚落和可供生存的资源
ground: 空间尺度巨大而环境空无；旅行者必须自带有限资源，耗尽后无法补充并将死亡
