chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 堪培拉惨案，成为一连串噩梦开始的标志
sensory_mapping: 堪培拉惨案像第一幅惊梦画面亮起，随后悉尼洗劫、极权和战争一幕接一幕压住睡者。
context_fact: 移民第七个月发生大规模伤亡，随后澳大利亚政治和社会迅速恶化。
image_mechanism: 噩梦把社会事件组织成不能醒来的心理序列，标志则给连续灾难划出第一帧。
property_alignment: 惨案对应首个梦魇；后续危机对应连梦；公众难信现实对应醒后失真感；无处逃离对应无法醒来。
context_alignment: 半年后人们早晨醒来反而不信已回到现实，睡梦框架与真实反应闭合。
narrative_function: 以总括句开启移民后半程崩坏，并预告灾难将从单次冲突扩散为社会常态。
transfer_rule: 连续灾难写成噩梦时，要确定第一幕、递进关系和无法醒来的现实束缚。
failure_boundary: 事件是真实历史而非主观幻觉；若后续灾难彼此无因果，连梦会制造虚假连续性。
