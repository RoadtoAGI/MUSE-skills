tenor: 移民社会自堪培拉惨案起连续发生的暴乱、专制、战争与崩溃事件
vehicle: 睡眠中一个接一个到来、充满恐惧且难以主动醒来的噩梦序列
ground: 事件连续加重；身处者失去控制；现实呈现难以相信的恐怖和荒谬
