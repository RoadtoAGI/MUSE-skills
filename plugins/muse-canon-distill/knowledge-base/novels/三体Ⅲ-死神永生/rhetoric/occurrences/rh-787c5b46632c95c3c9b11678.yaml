chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 这里像棺材一样窄，外面……也像棺材一样窄
sensory_mapping: 塔壁和现实边界一起收拢成棺木板面，呼吸与移动空间被压到贴身尺度。
context_fact: 她刚体验过一个巨大、舒适的空间，醒来后惊恐环顾锥形塔室，并把外部世界也一并否定。
image_mechanism: 第一次棺材贴合塔室尺寸，第二次把同一框架扩展到整个现实；局部物理窄促升级为存在性囚禁。
property_alignment: 锥形小室对应棺内贴身空间；现实无法到达那里对应棺木封闭；她的恐惧和求离对应活人被困棺中的窒息。
context_alignment: 以异空间的广阔作隐含对照，棺材同时说明她为何觉得塔窄，以及为何把日常世界视作死亡状态。
narrative_function: 将神秘体验从奇观变成不可逆的价值反转，推动她执意逃离现实。
transfer_rule: 延展空间喻体时，先让它贴合现场尺度，再由人物明确判断扩到更大领域；扩展必须保留封闭和行动受限的核心属性。
failure_boundary: 若外部世界仍可自由通往她向往之处，或她只嫌塔室拥挤，棺材的死亡封闭就被夸大；后文纯复述不另立卡。
