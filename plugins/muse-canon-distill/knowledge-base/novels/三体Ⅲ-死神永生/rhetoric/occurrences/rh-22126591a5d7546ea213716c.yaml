tenor: 未获登机名额的孩子目送程心离开，把她视为最后一个曾可能带来生机、如今永久远去的人
vehicle: 人们目送太阳作最后一次沉落，知道此后再无日出，光明和温暖将永久终止
ground: 程心离开对应太阳下沉；救援机会对应阳光；孩子绝望对应永夜将临；持续凝视对应目送落日；永不返回对应不再升起
