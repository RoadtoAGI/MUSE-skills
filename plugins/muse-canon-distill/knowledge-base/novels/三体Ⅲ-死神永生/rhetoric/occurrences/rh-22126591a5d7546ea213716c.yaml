chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 剩下的孩子们围在他们老师的身边看着她，像看着正在最后一次落下永远不再升起的太阳
sensory_mapping: 末次夕阳；围观孩子；光线下沉；永久黑夜；泪中模糊
context_fact: 星环穿梭机座位有限，程心最终只带走三个孩子，其余孩子留在发射港等待未知打击。
image_mechanism: 程心攀上舷梯的身影在孩子眼中沿地平线下沉，飞船舱门即将合拢如落日没地；她带走的不是普通座位，而是他们最后一束逃生光。
property_alignment: 程心对应太阳；登机离开对应西沉；她能提供的座位对应阳光；剩余孩子对应失光者；泪眼目送对应看落日；不能返回救人对应永不再升；死亡威胁对应长夜
context_alignment: 程心曾是执剑人和全人类希望载体，此刻在少数儿童面前再次被赋予太阳尺度，强化她无力普救的旧创伤。
narrative_function: 把一次不公平离场写成希望永久熄灭，为程心随后承受的道德剧痛定调。
transfer_rule: 用末次落日写救援者离开时，应有唯一光源、明确目送、不可返回、光暖终止和将临长夜。
failure_boundary: 救援者很快回来、仍有其他可靠逃生渠道，或被留下者并未寄托希望时，永不升起会绝对化处境。
quality_assessment: exemplary
