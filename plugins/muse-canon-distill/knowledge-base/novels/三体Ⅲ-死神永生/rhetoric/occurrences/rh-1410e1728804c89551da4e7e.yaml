figure_type: metaphor
quote: 黑洞之所以成为连光都能吸入的超级陷阱
sensory_mapping: 无形陷阱；边界闭合；猎物下坠；退路消失；光线被扣
context_fact: 曹彬纠正黑洞会从远处吸人的误解：远距引力与同质量普通物质相当，危险只在十分接近时急剧增强。
image_mechanism: 连续引力场被划出一道看不见的机关边界，靠近者先可自由移动，越过临界距离后退路骤然失效；连光都成为被捕猎物。
property_alignment: 黑洞对应陷阱；事件视界对应触发线；物质与光对应猎物；引力梯度对应捕捉机关；无法返回对应锁死；远处安全对应陷阱作用范围有限；高Way主动接近对应走入陷阱
context_alignment: 这段正解释高Way不是被远程吸走，而是主动越过安全网；陷阱模型既说明局部物理机制，也保留其自毁选择。
narrative_function: 纠正常识误区，明确危险边界，并为高Way从可逃区域进入不可返区域提供动作模型。
transfer_rule: 用陷阱解释物理边界时，应标明安全区、触发阈值、捕获机制、不可逆后果和进入者是否主动。
failure_boundary: 作用力从无限远就同样强、对象可越界后轻易返回，或没有明确临界范围时，陷阱会误导场强分布。
