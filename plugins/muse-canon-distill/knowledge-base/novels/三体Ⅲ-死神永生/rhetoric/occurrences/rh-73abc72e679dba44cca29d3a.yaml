figure_type: simile
quote: 程心和AA走出穿梭机，看到的景象如惨烈的战场
sensory_mapping: 焦黑尸体；冒火残骸；倾倒机群；热地面；呆立幸存者
context_fact: 多架穿梭机不顾人群强行启动，聚变发动机烧死附近人员并熔毁其他载具。
image_mechanism: 没有敌军和武器交火，逃生发动机却把民用港口改造成战后废墟；每架倾倒飞船都像被击毁装备，尸体把恐慌结果定格为战场。
property_alignment: 发射港对应战场；聚变尾焰对应攻击火力；平民尸体对应战死者；穿梭机残骸对应毁坏装备；熔化地面对应爆炸区；失神人群对应战后幸存者；警察救护对应清场部队
context_alignment: 灾难由争夺逃生而非外敌打击造成，战场喻体突出人类在假警报中先对自身开战的反讽。
narrative_function: 集中呈现强行发射代价，将此前混乱升级为可见的大规模伤亡。
transfer_rule: 用战场写非战争灾区时，应具备群体伤亡、装备残毁、火热地表、幸存者失序和造成这些痕迹的暴力机制。
failure_boundary: 现场只有轻微拥堵、无伤亡与结构破坏时，战场会夸大损失。
