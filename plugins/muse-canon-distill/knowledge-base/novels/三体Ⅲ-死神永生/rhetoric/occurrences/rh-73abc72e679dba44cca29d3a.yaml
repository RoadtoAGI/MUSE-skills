tenor: 强行发射后停泊区遍布烧焦尸体、倾倒穿梭机、熔化地面与失神人群的灾后现场
vehicle: 激烈战斗刚结束的战场，尸体焦黑、装备毁坏、地面燃烧，幸存者茫然散落
