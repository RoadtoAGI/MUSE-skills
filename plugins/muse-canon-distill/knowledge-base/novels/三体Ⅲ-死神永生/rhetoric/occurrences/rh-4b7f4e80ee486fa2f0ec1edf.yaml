figure_type: simile
quote: 这些连绵起伏的沙丘很像女人的胴体
sensory_mapping: 沙脊在夕光里连成肩腰般的柔弧，阴影沿坡面滑落，裸露地铺向天边。
context_fact: 白艾思与丁仪躺在沙坡谈宇宙规律，此前白艾思常以导师启发的方式观看沙漠。
image_mechanism: 身体轮廓提供柔软、亲近的审美阅读，把荒漠地貌暂时变成人类尺度的熟悉表面。
property_alignment: 沙丘峰谷对应身体曲线；细沙表面对应皮肤平滑；夕阳明暗对应体表塑形；连绵地势对应平卧身躯。
context_alignment: 这一旧喻马上被裸露大脑取代，显示同一景物会随思想压力改变认知模型。
narrative_function: 建立温柔旧观看方式，为丁仪谈话后沙丘变脑回的认知突变提供对照。
transfer_rule: 地貌比作身体时，应落到曲线、表面、光影、观看方向和人物当时情绪。
failure_boundary: 沙丘会迁移且无人体器官结构，性别化观看也来自白艾思个人联想。
