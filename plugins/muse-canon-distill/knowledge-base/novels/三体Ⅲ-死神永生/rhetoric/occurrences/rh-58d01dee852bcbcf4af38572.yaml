chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: 这已经是一座死城，甚至可以说是城市的一张1:1的图纸
sensory_mapping: 城市从可居住椭球摊成宇宙中的巨幅蓝图，螺钉、纤维、螨虫和细菌都成了图上精线。
context_fact: 三维每个原子都投射到对应二维位置，所有被遮挡部分按不重叠规则展开。
image_mechanism: 图纸准确命中二维表征与三维实体之差：信息几乎全在，生命、体积和功能却全部消失。
property_alignment: 二维城市对应图纸；原子级投影对应绘图精度；1:1面积对应等比例；结构可恢复对应图纸可施工；死城对应图纸不可居。
context_alignment: 政府希望未来文明由二维图像恢复三维世界，这座城市正成为该设想最完整也最悲惨的样本。
narrative_function: 给降维结果下定义，区分信息保存与生命保存，并解释后文为何还可能数学重建。
transfer_rule: 实体比作图纸时，应核对比例、细节、遮挡处理、可重建性，并明确图纸失去的功能维度。
failure_boundary: 二维城市不是人为绘制的符号图，也未必能被现有软件正确解码；图纸强调表征关系。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 完全二维化后静止、无生命但精确保留欧洲六号全部结构的平面城市
vehicle: 按实物等比例绘制、标出每一构件细节却不能承担居住功能的工程图纸
ground: 整体平面化；比例一比一；细节完整；用于表征原物；不再具有原物功能；需要解读模型才能还原三维
