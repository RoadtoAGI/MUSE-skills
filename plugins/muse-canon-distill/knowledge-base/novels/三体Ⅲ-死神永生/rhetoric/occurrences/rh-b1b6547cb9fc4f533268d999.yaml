quote: 每一种他们个人生活的选择，最后都会涉及到宇宙的命运，有时还涉及多个宇宙的命运，他们觉得自己真的像上帝了
sensory_mapping: 两人站在麦田边，本来只需决定下一季种什么，如今一次留下或离开却像按下宇宙生死的开关。
context_fact: 小宇宙带走大宇宙质量，若众多文明都拒绝归还，宇宙可能无法坍缩并重启。
image_mechanism: 上帝类比把因果尺度突然放大：日常居住选择获得创世权限，宏大责任随之转成压迫身体的重量。
property_alignment: 私人选择对应神意；宇宙开闭对应创灭；多个世界受影响对应全能范围；责任压力对应神职重担；二人决策对应终极裁定。
context_alignment: 程心一生不断承担更大责任，此刻从两个文明走到多个宇宙，上帝喻体到达责任阶梯的最高层。
narrative_function: 把伦理困境从理论讨论推入行动，预备二人最终放弃安全小宇宙。
transfer_rule: 凡人比作神时，应给出一条清楚的选择—机制—世界后果链，并保留权力与负担两面。
failure_boundary: 二人只控制647号宇宙约五十万吨质量，不能独自决定大宇宙结局，也没有全知全能。
