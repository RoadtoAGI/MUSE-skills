tenor: 受光速上限限制、不同区域无法及时传递信息与作用力的整个宇宙
vehicle: 高位神经受损、脑与四肢及各肢体之间无法正常传递神经信号的瘫痪病人
ground: 庞大整体各部分真实存在却缺乏有效联络；局部不能感知和协调远端，整体功能因此不健全
