chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 它是一个高位截瘫的病人
sensory_mapping: 星系群成为身体肢体，光速信号成为缓慢神经脉冲，宇宙大脑发出的命令永远到不了最远四肢。
context_fact: 可观测宇宙尺度约一百六十亿光年，光无法从一端传到另一端，远隔区域永远不能相互作用。
image_mechanism: 病人框架把尺度与速度不匹配转成神经传导障碍，健全判断由数学和谐落到身体协调功能。
property_alignment: 宇宙整体对应人体；远方区域对应四肢；光与作用力对应神经信号；因果隔绝对应高位截瘫；数学不和谐对应病症。
context_alignment: 关一帆先把自己与心理医生类比为诊断者，再用对方熟悉的病理模型解释宇宙为何不健全。
narrative_function: 将宇宙学尺度问题变成身体可感的失联，为高维异常与更恐怖病因打开想象入口。
transfer_rule: 系统如神经身体时，应对齐控制中心、远端部位、信号速度和功能后果；疾病名称要匹配断联位置。
failure_boundary: 宇宙未必需要全域同步才算健全，高位截瘫是价值化诊断；局部因果网络仍能正常运行。
