tenor: 远离后缩成月球大小、蓝色且无防护地暴露在黑暗森林宇宙中的地球
vehicle: 仍浸在蓝色羊水中的脆弱胚胎被提前取出母腹，失去温暖保护后暴露在寒冷黑暗环境
ground: 主体包含未成熟生命；外形小而脆弱；原有保护环境缺失；外部环境寒冷危险；离开母体显得过早
