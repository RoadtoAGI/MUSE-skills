chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 像一个充满蔚蓝色羊水的胚胎，被从温暖的母腹中拿出，暴露在太空的寒冷和黑暗中
sensory_mapping: 蓝色地球像透明羊膜中的胚胎，被无形手从宇宙母腹取出，孤悬黑暗，表面水光像尚未擦去的羊水。
context_fact: 地球从近距宏大迅速缩小，人类坐标已暴露，黑暗森林打击可能随时到来。
image_mechanism: 胚胎将文明技术先进与宇宙尺度幼弱并置，蓝海自然成为羊水，被拿出动作则解释坐标暴露后的保护丧失。
property_alignment: 地球对应胚胎；海洋对应蓝羊水；宇宙庇护想象对应母腹；坐标暴露对应被取出；黑暗森林对应寒冷外界。
context_alignment: 公众刚把文明想成弃婴，此处视角拉远后退至胚胎，宇宙威胁下的发育不足获得天体外观支持。
narrative_function: 推翻几小时前的地球宏大感，重新确立程心会面所要保护对象的脆弱尺度。
transfer_rule: 世界如胚胎时，应对应内部生命、保护介质、脱离动作、外部环境和发育阶段，避免只取柔弱。
failure_boundary: 宇宙没有保护地球的母体，人类文明也具主动技术能力；胚胎模型可能强化被照料依赖。
