chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 飞船仍在平稳地航行中，看上去像绝对静止地悬在太空中一样
sensory_mapping: 高速航行的动势被真空吸尽，残缺巨舰像悬挂在无边黑幕上，耳机和屏幕共同保持凝固。
context_fact: 中士预期舰尾消失会破坏能量循环并引发爆炸，现实却连最轻微报警都没有。
image_mechanism: 绝对静止把高速与无反馈的矛盾推到极端，悬字又赋予巨舰不受支撑却不坠落的诡异稳定。
property_alignment: 亚光速不可察对应无参照静止；航行平稳对应物体悬定；系统沉默对应没有运动反馈；舰体残缺未爆对应异常凝固。
context_alignment: 去物质效应已使外界失去实体参照，四维截面又让飞船外形与内部状态脱节，静悬感来自两重条件。
narrative_function: 以极静反衬巨变，延长灾难迟迟不爆发的恐怖，并提示所见不是常规毁损。
transfer_rule: 用静止写高速场景时，应明确参照、惯性和反馈如何被移除；静感最好与一个本应剧烈的事件形成反差。
failure_boundary: 存在星体掠过、持续加速或明显振动时，绝对静止会被感官证据推翻；匀速本身也不等于客观零速度。
quality_assessment: effective
confidence: 0.95
review_status: reviewed
tenor: 舰尾视觉上消失后仍以亚光速匀速飞行、没有任何运动反馈的万有引力号
vehicle: 没有速度、推力或扰动，永久钉在虚空一点的静止物体
ground: 缺少可见参照位移；船体没有振动、加速度与系统异常，运动无法被感官确认
