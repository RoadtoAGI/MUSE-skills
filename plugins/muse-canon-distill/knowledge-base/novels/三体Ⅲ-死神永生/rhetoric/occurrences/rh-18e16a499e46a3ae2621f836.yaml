chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 她的身体似乎带着一圈无形的力场，把人群排斥开来
sensory_mapping: 智子周围套着透明圆环，她每迈一步，前方人体像受斥力推开，身后的空区又随之闭合。
context_fact: 她已公开斩杀十多人，人群在她行走时惊慌闪避，始终不敢靠近。
image_mechanism: 力场把集体记忆和恐惧压成稳定空间规则，人与她没有接触也像被同一物理定律推动。
property_alignment: 智子身体对应场源；恐惧对应斥力；人群退让对应受力位移；空圈随行对应场域随源移动。
context_alignment: 机器人代表超越人类的技术力量，物理场词汇使政治恐怖表现为不可违抗的自然力。
narrative_function: 将一次性杀戮转化为持续秩序，让智子仅凭行走便控制整个人群。
transfer_rule: 气场写成物理场时，要固定场源、作用半径、受力方向和随源移动的可见效果。
failure_boundary: 不存在真实能量场，人群也可能在别处反抗；若退避依赖口头命令而非接近距离，场模型会失准。
quality_assessment: exemplary
