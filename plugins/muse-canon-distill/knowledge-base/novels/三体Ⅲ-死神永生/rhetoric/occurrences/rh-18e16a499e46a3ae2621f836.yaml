review_status: reviewed
tenor: 智子移动时周围人因恐惧同步退开并始终保持空圈
vehicle: 围绕物体存在、无需接触便对附近物质施加斥力的物理场
ground: 影响以身体为中心；作用跨越空隙；边界随她移动；进入范围者立即向外退
