chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 不过现在看来，倒像一个大帐篷的骨架
sensory_mapping: 八十米旗杆化成帐篷尖顶，四根钢梁像裸露篷骨撑开，国会大厦也被罩进移民营构图。
context_fact: 联合国总部迁入大厦，澳大利亚四十多亿人主要居住在各类帐篷和简易设施中。
image_mechanism: 帐篷骨架让象征稳固的钢梁反而归入临时建筑语汇，国家权力中心与难民营在形态上合流。
property_alignment: 四根钢梁对应篷骨；高旗杆对应帐篷顶杆；开放框架对应无篷布；联合国总部对应超大临时营帐。
context_alignment: 移民社会的一切政治机构都已搬入帐篷，国会旗杆此刻也被程心看成帐篷骨架，时代视角改变建筑意义。
narrative_function: 削弱旗杆稳固象征，为大厦摇晃、绞架影子和坟墓会场连续降格。
transfer_rule: 结构形似要服务语境时，应把构件逐项对应，并说明环境经验为何改变观看。
failure_boundary: 钢梁远比普通篷骨坚固，国会也非临时帐篷；喻体只取几何和时代联想。
