figure_type: simile
quote: 一个巨型帐篷，像是平放在沙漠中的半个巨蛋，而从中拥出的人群则如同巨蛋破裂后溢出的蛋清
sensory_mapping: 白色篷顶成为半枚蛋壳，门口像裂缝，人群失去个体轮廓，化作黏稠蛋清向黄沙铺开。
context_fact: 食品运输机到来，巨型帐篷中的移民蜂拥而出争抢食物。
image_mechanism: 同一枚蛋同时解释建筑外形和群体流动，破裂动作还把秩序失控写进空间结构。
property_alignment: 半圆帐篷对应半蛋壳；出口对应破口；拥挤人群对应蛋清；向外摊散对应内容物溢流。
context_alignment: 前文城市如蛋壳写脆弱，这里蛋壳已经破开，群体从庇护空间变成争食流体。
narrative_function: 用一个连贯画面开启食物骚乱转播，并将个人降格为无法分辨的群体物质。
transfer_rule: 建筑与内部人流共用容器喻体时，应让外壳形状、开口位置和内容物流向连续对应。
failure_boundary: 人群有意志且会争抢，蛋清没有；帐篷也并非因结构破裂，只是出口放人。
