chapter: 【广播纪元7年，程心】
figure_type: metaphor
quote: 保证了移民返回后世界经济的快速复苏
sensory_mapping: 停摆的城市像昏迷身体重新有了脉搏，电网亮起，生产线和运输血流沿旧设施恢复循环。
context_fact: 治安军在移民期保护城市和基础设施，又维持返乡秩序，使工业设施没有遭到大规模破坏。
image_mechanism: 复苏把多部门重新运转组织成生命体醒转，让保存基础设施的作用表现为器官未毁、可重新供血。
property_alignment: 经济停摆对应昏迷；基础设施保全对应器官存活；生产恢复对应重新活动；恢复迅速对应短期苏醒。
context_alignment: 这句处在为治安军补写正面作用的论证中，生命恢复的中性过程与随后政治处决形成冷峻反差。
narrative_function: 用惯常生命隐喻快速概括全球系统恢复，同时支撑对报复审判片面性的事实说明。
transfer_rule: 系统如病体复苏时，要交代停摆原因、仍存器官、重新供能过程和可观察的功能恢复。
failure_boundary: 经济没有单一身体或意识，增长也不等于健康公平；复苏只指活动水平重启。
quality_assessment: conventional
confidence: 0.95
review_status: reviewed
tenor: 移民返回后，全球生产、供给与城市运行在保存的基础设施上迅速恢复
vehicle: 重病或昏迷的生命体在治疗后苏醒，器官功能逐步恢复并重新活动
ground: 系统曾遭严重中断；关键结构仍被保全；外部条件改善后功能重新启动；恢复具有速度差异
