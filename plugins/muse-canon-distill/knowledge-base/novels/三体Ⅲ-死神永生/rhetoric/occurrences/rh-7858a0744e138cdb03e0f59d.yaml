chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 让程心感到时光倒流的不仅仅是他们的古代武器，还有他们的样子
sensory_mapping: 时间逆流；古枪重现；军阵返旧；未来退色；旧日临场
context_fact: 这些未来战士使用带枪栓和扳机的机械步枪，训练出的整体性、强壮体格与漠视生命的表情也带有古代军队气质。
image_mechanism: 几件旧式武器先成为时间路标，整齐军阵和冷硬面孔随后把周围未来实验室一起向过去拖动；空间未变，时代感却逆向位移。
property_alignment: 时间对应可流动介质；未来对应下游；公元世纪对应上游；古代武器对应逆流路标；旧式军人气质对应过去环境；程心感知对应随流移动；历史重演对应水流反向
context_alignment: 星环城为最前沿曲率技术而战，却用最古老步枪和军人伦理武装自己；倒流准确抓住技术未来与政治暴力复古的并置。
narrative_function: 把装备反差提升为历史回返感，为即将可能发生的内战赋予文明倒退阴影。
transfer_rule: 用时光倒流写复古现场时，应有多个来自同一旧时代的可见线索，并让它们改变人物对当前环境的整体年代判断。
failure_boundary: 只有一件装饰性古董、人物明确把它当博物展示，或其余行为仍完全属于新时代时，时间倒流会夸大沉浸程度。
quality_assessment: effective
