review_status: reviewed
tenor: 星环自卫队携带古式机械步枪、队形和冷酷神态，使程心产生返回公元战争时代的强烈错觉
vehicle: 时间之流改变方向，把观察者从未来沿原路送回已经过去的年代，使旧事物重新成为当下
ground: 未来纪元对应时间下游；公元战争时代对应上游；古式枪械对应旧岸标志；军人神态对应旧时代风貌；主观错觉对应逆流；历史形态重现对应回到过去
