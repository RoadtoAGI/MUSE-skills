chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 两个世界的支点由一位一百零一岁的老人转移到一个二十九岁的年轻女子身上
sensory_mapping: 两个文明压成杠杆两端，红色开关是支点轴，五十四年的重量从老人肩下抬起，全部落到程心身体。
context_fact: 罗辑把广播开关交给程心，从这一刻起三体依据她是否会按键重新判断威慑，十五分钟后发动攻击。
image_mechanism: 支点沿用倒置金字塔的力学框架，转移把礼仪动作直接变成承重结构替换，突出年龄和经验差。
property_alignment: 两界战略平衡对应杠杆稳定；执剑人对应支点；红色开关交接对应轴心迁移；毁灭责任对应全部重量；威慑失效对应失衡。
context_alignment: 前文程心感到四十五千米地层压心，支点进一步说明她承受的不只是地下重量，而是两个世界。
narrative_function: 在交接瞬间量化人物更替的宇宙后果，为敌人立即测试新支点的承重能力埋下机械必然。
transfer_rule: 责任如支点时，应明确承托对象、平衡条件、转移时刻和失衡后果；支点小必须与系统重量形成比例反差。
failure_boundary: 若决策由委员会、自动系统和多重否决共同承担，单人支点会误写权力；年龄差也不直接决定承重能力。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 维持地球与三体战略平衡的最终广播决定权从罗辑交接给程心
vehicle: 承托巨大重量并保持杠杆平衡的单一支点，从一个承载者移到另一个承载者身上
ground: 庞大系统稳定依赖一个极小中心；中心位置改变时，全部重量和失衡风险同步转移
