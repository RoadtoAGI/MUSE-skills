chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 人类无法摆脱面壁者的幽灵
sensory_mapping: 面壁计划被历史埋葬，执剑人却让其轮廓从墓中升起，握着开关在威慑纪元上空徘徊。
context_fact: 联合国曾收回控制权，却因群体威慑度为零迅速交还罗辑，个体秘密意志再次成为文明安全基础。
image_mechanism: 幽灵把制度连续性写成死后存续，既保留熟悉形状又取消正式实体，准确表达历史否认与现实依赖并存。
property_alignment: 面壁计划结束对应肉身死亡；执剑制度继承对应幽灵回返；公众排斥独裁对应惧鬼；无法替代个体对应摆脱失败。
context_alignment: 标题先称面壁者幽灵，正文再展示执剑人制度如何复活其权力结构，喻体有完整回返路径。
narrative_function: 把罗辑个人威慑置入制度史，揭示文明以为翻篇却仍依赖同一危险机制。
transfer_rule: 历史遗产如幽灵时，应明确旧体已结束、何种特征继续显形、谁在否认及为何无法驱除。
failure_boundary: 若后继制度与旧制度没有结构继承、影响仅是纪念，幽灵纠缠会夸大连续性；它也不证明制度必然有害。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 面壁计划形式上结束后，其个体独裁、不可预测和秘密决断逻辑在执剑人制度中继续存在
vehicle: 已经死亡的人留下幽灵，脱离原有身体仍回返现实、纠缠生者而无法驱走
ground: 旧制度名义消失但核心力量持续作用；后继社会不愿承认，却仍受其支配和恐惧
