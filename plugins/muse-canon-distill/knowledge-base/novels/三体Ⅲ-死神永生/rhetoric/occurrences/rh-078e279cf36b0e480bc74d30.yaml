figure_type: simile
quote: 就像在图像处理软件中框选并复制了一个区域后稍稍移开一样
sensory_mapping: 冥王星和周围景物像被鼠标框住复制一份，副本轻轻拖开，于黑空并排留下两套画面。
context_fact: 慢光速航迹先传来旧位置图像，冥王星移出航迹后又以正常光速传来新位置图像。
image_mechanism: 软件复制把复杂时延成像转成现代人熟悉的二维操作结果，复制区域也对应航迹的有限空间范围。
property_alignment: 慢光旧像对应复制件；正常光新像对应原图；位置变化对应拖移；航迹边界对应选框；背景重现对应区域复制。
context_alignment: 太阳系已变成巨画和图纸，曲率航迹又像图像软件编辑现实，空间物理不断取得平面媒介属性。
narrative_function: 在罗辑解释前给双重冥王星一个精确视觉模型，帮助理解慢光速证据。
transfer_rule: 时延双像借软件复制解释时，应对齐两次采样时间、区域范围、位置偏移和背景共同复制。
failure_boundary: 现实没有数字复制操作，两幅像来自不同传播路径而非两个实体；软件只模拟观察结果。
quality_assessment: exemplary
