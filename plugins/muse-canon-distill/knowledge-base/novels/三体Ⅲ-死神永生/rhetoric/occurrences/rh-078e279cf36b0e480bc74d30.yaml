tenor: 曲率航迹造成慢光与正常光同时抵达，使冥王星、卡戎及部分背景景观出现错位双像
vehicle: 在图像软件中矩形框选一片画面，复制后将副本横向移动，原图与拷贝同时保留
ground: 同一内容出现两份；副本位置有偏移；区域边界局部；背景一部分随之重复；两像时间来源不同但视觉相同
