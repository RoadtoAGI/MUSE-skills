tenor: 失控移民突破警戒线、从各处高速涌向食品垛的群体运动
vehicle: 堤坝崩开后失去约束、以巨大流量冲出并覆盖低处物体的洪水
ground: 约束线瞬间失效；大量个体同向快速推进；目标被包围后从视野中消失
