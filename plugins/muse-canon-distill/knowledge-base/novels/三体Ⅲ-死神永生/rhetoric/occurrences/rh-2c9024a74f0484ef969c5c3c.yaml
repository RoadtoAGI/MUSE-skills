chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 人群就如决堤的洪水般拥来，很快把食品垛围住淹没
sensory_mapping: 警戒线像土堤一触即垮，人体浪头越过士兵，迅速漫过食品立方体。
context_fact: 几十名士兵无法维持秩序，分发人员逃回运输机，人群包围食品垛。
image_mechanism: 洪水把群体数量、方向和不可阻挡性合成流体压力，淹没一词又从动作延伸到结果。
property_alignment: 警戒线对应堤坝；队列崩坏对应决堤；蜂拥对应洪流；食品垛消失对应被水淹没。
context_alignment: 配给匮乏使个体选择汇成同一求生方向，流体喻体准确写出制度边界被数量压垮。
narrative_function: 把抢食从混乱人群提升为灾害级冲击，为智子后续以杀戮重建秩序铺垫。
transfer_rule: 群体如决堤洪水时，应明确原约束、突破点、流向和覆盖目标。
failure_boundary: 人群并非无意识水体，内部仍有不同选择；若有稳定通道和节制速度，洪灾强度会失真。
