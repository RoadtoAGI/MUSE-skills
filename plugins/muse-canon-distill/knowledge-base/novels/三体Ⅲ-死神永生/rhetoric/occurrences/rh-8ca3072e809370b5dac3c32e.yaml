review_status: reviewed
tenor: 丁仪挖坑后失去支撑、从坡面连续滑入坑内的干沙
vehicle: 受重力沿低处持续流动、自动填平空隙的水
ground: 由高向低运动；颗粒整体呈连续流；会填入凹处；表面形成流线；停止依赖坡度
