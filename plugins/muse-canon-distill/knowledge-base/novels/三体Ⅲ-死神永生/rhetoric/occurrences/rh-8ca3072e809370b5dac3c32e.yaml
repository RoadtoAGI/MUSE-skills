chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 看着上面的沙像水一样流下来
sensory_mapping: 细沙越过坑沿成一股黄流，颗粒边界在运动中消失，像水自动灌进低处。
context_fact: 这一小坑将在白艾思后来的梦境中扩大吞没整片沙漠，模拟宇宙结构崩塌。
image_mechanism: 水流把离散颗粒的集体运动视为连续介质，为后续黄色瀑布与世界解体提供物理视觉种子。
property_alignment: 沙粒群对应水体；坡面下滑对应流淌；坑洞对应低洼；不断补入对应液体填充。
context_alignment: 丁仪用手制造的微小流沙实验，连接抽象宇宙怀疑和白艾思可感知的灾难梦象。
narrative_function: 给谈话留下动作锚点，使多年后纸条危机通过流沙梦重新激活。
transfer_rule: 颗粒材料比作液体时，应对齐坡度、连续性、填隙、流速和停止条件。
failure_boundary: 沙有摩擦堆积角且不会保持水面水平，流动只在坑沿失稳时成立。
quality_assessment: effective
