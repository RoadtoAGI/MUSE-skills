chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 有一刻，程心感觉它像是太空中挖出的一个洞
sensory_mapping: 地球和星空在圆形边界处被掏空，智子球像黑空上的井口，半透明深处没有可触底的墙。
context_fact: 球体近在几米外，占据大部分视野并挡住地球，表面从镜面转为深不可测半透明。
image_mechanism: 洞把正体反转为负空间：读者不再想象一个球悬浮，而想象宇宙少了一块，强化通信跨光年的入口感。
property_alignment: 球形边缘对应洞口；遮住背景对应空间缺失；深不可测对应洞深；图像将出现对应通向远端。
context_alignment: 云天明在几光年外，太空洞像临时开出的视听通道，比普通屏幕更符合跨世界会面。
narrative_function: 在冰球实体感后制造相反的空洞感，表现智子低维展开无法被单一物质直觉固定。
transfer_rule: 对象如空间洞时，应说明它删除了什么背景、边缘如何显现、深度为何不可测及是否承担通道功能。
failure_boundary: 球体仍是智子展开和显示界面，不是真正空间穿孔，程心也无法穿过它到达三体舰队。
quality_assessment: exemplary
