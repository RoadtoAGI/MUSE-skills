tenor: 半透明智子球因遮挡地球、内部无底而显得不是物体而是空间缺口
vehicle: 完整太空背景被挖走一块形成圆洞，洞内没有正常星光和距离参照，只向未知深处开放
ground: 主体占据背景却不像实体表面；内部深度无法估计；周边空间连续性被打断；观看有向内坠落感
