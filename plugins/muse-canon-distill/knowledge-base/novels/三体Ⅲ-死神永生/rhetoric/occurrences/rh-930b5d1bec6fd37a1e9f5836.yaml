chapter: 【掩体纪元11年，掩体世界】
figure_type: analogy
quote: 这不是倒退而是螺旋形上升
sensory_mapping: 历史盘旋；旧景复现；轨迹抬高；圆周回返；纵轴推进
context_fact: 太阳系大移民使失业、贫困和城邦政治重新出现，同时建成木星至海王星的太空城市体系。
image_mechanism: 时间进步被画成有纵轴的路径：从平面看似绕回旧位置，侧看每一圈都已抬高；“旧社会再现”因此与“新疆域开拓”被装进同一几何运动。
property_alignment: 历史进程对应螺旋轨迹；旧社会形态对应圆周方位重现；技术扩张对应轴向上升；时代轮替对应每绕一圈；总体进步对应高度增加；非简单复古对应轨迹不闭合
context_alignment: 程心同时看见太平洋一号的贫困与整个掩体工程的成就，螺旋模型正好容纳她对局部复古和整体扩张的双重判断。
narrative_function: 为未来社会的矛盾景观提供简洁历史解释，使乌托邦破裂不等于文明退化。
transfer_rule: 用螺旋写历史重复时，应同时指出可辨认的旧现象、不可逆的新条件和衡量“上升”的具体轴线。
failure_boundary: 若社会仅原样恢复旧制度、没有技术或生存范围增量，或所谓上升缺乏可核对尺度，螺旋会把循环强说成进步。
