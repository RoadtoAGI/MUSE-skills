tenor: 掩体世界重现贫富分化、流浪者和城邦等旧社会形态，但总体仍在拓展人类生存空间与技术能力
vehicle: 路径绕轴盘旋，投影会反复经过相似方位，整体高度却在每一圈后继续增加的螺旋线
ground: 旧形态重现对应转回相似方位；时代发展对应沿轴前进；社会总体改善对应高度上升；每轮差异对应螺距；并非原路返回对应轨迹不闭合
