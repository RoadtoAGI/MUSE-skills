chapter: 【掩体纪元67年，“星环”号】
figure_type: metaphor
quote: 感觉自己通过了一道时空门，一下子进入了另一个世界
sensory_mapping: 时空门框；一步穿越；旧世在后；未来迎面；中途全暗
context_fact: 冬眠期间感觉不到时间流逝，无论持续多久，冬眠者主观都只感到入眠和苏醒前后的不到两小时。
image_mechanism: 几十年连续时间被折叠进一道薄门，漫长过程从意识中删除，只保留跨槛前后的两幅世界；开眼动作因此等同推门。
property_alignment: 冬眠入口对应门前；苏醒时刻对应跨门槛；数十年间隔对应被折叠通道；主观无时长对应一步到达；旧时代对应门内侧；新纪元对应门外世界；身体状态连续对应穿门者未走长路
context_alignment: 程心经历多次冬眠，时代切换已成为她特有的生存方式；门比一般旅程更贴合“没有途中”的感知事实。
narrative_function: 在具体苏醒场景前解释冬眠体验，并为她后来因跳过他人衰老而产生愧疚建立空间模型。
transfer_rule: 用门写时间跳跃时，应有清晰前后状态、主观缺失的中间过程、一步式切换和跨越者相对不变的连续身份。
failure_boundary: 人物清醒经历全部年月、变化逐步发生，或前后环境几乎无差别时，时空门会误写连续体验为瞬时切换。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 冬眠者主观只经历不到两小时，却在苏醒一刻从原时代跳到相隔数十年、环境和人事都已改变的未来
vehicle: 人穿过一扇分隔两处空间的门，门前门后是截然不同的世界，中间路程被门框压缩为一步
ground: 进入冬眠对应进门；苏醒对应出门；漫长年月对应门内通道；无时间感对应路程消失；未来时代对应门后世界；骤然切换对应一步跨越；身体未老对应穿门者不变
