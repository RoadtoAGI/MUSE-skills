chapter: 【时间开始后约170亿年，我们的星星】
figure_type: metaphor
quote: 还有一群群透明的小气球，借着浮力在空中飘行
sensory_mapping: 没有翅膀的生物鼓成透明球囊，一群群浮过林隙，阳光穿入时像气球薄膜闪出虹色。
context_fact: 蓝星长时间演化后未见有翅生物，空中物种分别以旋转或浮力飞行。
image_mechanism: 气球同时给出形状、材质和升空机制，使新物种无需生物学名词便可动态重建。
property_alignment: 透明身体对应透明气囊；低密度对应充气；浮力飞行对应气球上升；成群飘行对应气球随风；虹彩对应薄膜干涉光泽。
context_alignment: 同句螺旋桨昆虫借机械飞行，气球生物借日常浮力，两种喻体并列展示进化的多条技术般路径。
narrative_function: 为陌生生态提供轻盈奇异的视觉细节，并反衬人物即将得知的沉重年代。
transfer_rule: 陌生生物以物件命名时，至少让轮廓、材质、运动动力和环境光效共同对上。
failure_boundary: 生物并非人造乳胶气球，内部气体、组织结构与控制运动方式均未说明。
