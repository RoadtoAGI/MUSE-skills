tenor: 蓝星上一类身体透明、充气般轻盈、依靠浮力成群飘飞的小生物
vehicle: 充入轻质气体后自动上浮、透明圆鼓并随气流缓慢漂移的小气球
ground: 体形鼓圆；内部或外观透明；密度低；借浮力升空；随气流飘移；成群出现；穿光产生虹彩
