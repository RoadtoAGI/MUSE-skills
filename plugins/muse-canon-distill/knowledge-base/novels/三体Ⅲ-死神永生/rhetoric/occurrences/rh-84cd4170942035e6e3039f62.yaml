review_status: reviewed
tenor: 程心背对未能带走的孩子时，被他们的绝望凝视触发集中、剧烈的负罪和痛苦
vehicle: 成千箭矢从后方同时射入胸口，贯穿心脏，造成密集而致命的肉体剧痛
ground: 多名孩子目光对应万箭；视线从背后射来对应箭矢方向；负罪集中于内心对应穿心；痛苦强烈对应致命伤；无法躲避对应箭雨覆盖
