chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她仍能感受到背后孩子们那绝望的目光，如万箭穿心
sensory_mapping: 背后箭雨；尖镞入胸；心脏贯穿；多点剧痛；带伤攀梯
context_fact: 程心在泪中登机，曾在执剑失败和澳大利亚灭绝宣告时体验过同类道德痛苦。
image_mechanism: 无形视线获得箭杆和尖镞，从每个被留下的孩子眼中射出，越过她的背脊汇聚心口；身体在上舷梯，内心却像被钉回原地。
property_alignment: 孩子们对应射手群；绝望目光对应箭矢；凝视方向对应弹道；程心良知对应心脏；负罪痛感对应穿刺；人数众多对应万箭；继续离开对应带伤前行
context_alignment: 程心的核心创伤正是不能牺牲眼前生命，本次儿童选择与执剑时刻同构，穿心旧痛因而复发。
narrative_function: 把伦理压力转成肉身伤害，连接程心三次重大选择创伤。
transfer_rule: 用万箭穿心写群体谴责时，应有多源目光或言语、共同指向、内疚中心、无法反击和持续行动中的疼痛。
failure_boundary: 群体并未责怪或期待主体、主体毫无负罪感，或痛苦只来自身体疲劳时，箭雨会错置伤害来源。
quality_assessment: exemplary
