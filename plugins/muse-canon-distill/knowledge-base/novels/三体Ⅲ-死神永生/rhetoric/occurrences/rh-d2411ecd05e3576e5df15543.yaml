chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 信息窗口就铺天盖地涌出来，像一场要把她们埋葬的彩色雪崩
sensory_mapping: 斑斓窗口从四面滚落，层层叠住舱内视野，像彩雪转眼没过程心和AA头顶。
context_fact: 媒体秩序已经消失，多数画面模糊、晃动或无意义，部分只剩二维平面的流动色彩。
image_mechanism: 雪崩将信息过载变成有重量的物质灾害，而“埋葬”让消息内容与接收形式共同执行太阳系死亡。
property_alignment: 窗口泛滥对应雪体；铺天盖地对应山体倾泻；画面层叠对应积雪覆盖；彩色对应多窗口色块；埋葬对应压垮理解。
context_alignment: 真实二维灾变正像不可阻挡的平面扩张涌来，屏幕中的信息雪崩成为物理灾难的舱内缩影。
narrative_function: 瞬间呈现文明通信系统崩溃，并从宏观行星画面转入个体最后时刻的碎片影像。
transfer_rule: 把信息过载写成雪崩时，应让数量、方向、速度、覆盖、视觉颜色和消息后果同步对齐。
failure_boundary: 窗口没有质量，不会真正压死她们；经A.I.筛选即可清空，雪崩只形容初始感知与死亡内容。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 星环号接收海王星和土星方向后突然同时弹出的海量彩色信息窗口
vehicle: 从高处轰然倾泻、迅速覆盖视野并能把人压埋的彩色雪崩
ground: 数量庞大；突然涌来；覆盖整个视野；层叠滚动；色彩斑斓；使接收者窒息；携带死亡消息
