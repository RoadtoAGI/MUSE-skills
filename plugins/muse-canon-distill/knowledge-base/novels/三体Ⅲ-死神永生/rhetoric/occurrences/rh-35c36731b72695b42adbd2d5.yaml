chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 许多书的书页展开，在灯光中像扑动着白翅的鸟群
sensory_mapping: 白页成翅；空中群飞；纸面扑动；灯下闪白；书群翻卷
context_fact: 集市商品在零重力中没有摊台支撑，古书也成团飘浮，许多书页保持展开。
image_mechanism: 失去书架和桌面的纸页获得了飞行动作，书脊藏进杂乱群体，只剩一片片白面交替亮起，如同一群被灯惊动的鸟。
property_alignment: 书页对应翅膀；白纸对应白羽；开合摆动对应扑翼；多书聚集对应鸟群；失重悬浮对应飞行；灯下明暗交替对应翅面翻转
context_alignment: 太平洋一号的所有商品和顾客都漂浮，鸟群意象把无序集市中的轻纸运动写成最自然的失重生命。
narrative_function: 在破败集市中插入轻盈动态，让失重社会的活力通过纸页可见。
transfer_rule: 把薄片群写成鸟群时，需要成片浅色表面、相互独立的摆动、三维悬浮和聚散节奏，使“翼”既有形也有动。
failure_boundary: 书页合拢固定、纸色深暗、物件沿同一机械轨道整齐移动时，鸟群的扑动与群体自主性均不成立。
