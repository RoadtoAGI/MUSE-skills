tenor: 失重集市里大量摊售古书散浮成团，展开的书页在灯光与扰动中摆动
vehicle: 一群白鸟聚在空中，明亮翅面交错张开并不断扑动
ground: 展开书页对应鸟翼；浅色纸面对应白翅；纸张摆动对应扑翼；成团书籍对应鸟群；空中漂浮对应群鸟飞行；灯光闪面对应翅面反光
