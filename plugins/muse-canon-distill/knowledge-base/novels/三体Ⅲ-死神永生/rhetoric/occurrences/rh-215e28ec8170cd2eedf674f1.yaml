chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 所有的机器人排成一列，鱼贯地进入门中
sensory_mapping: 机器人在真空中首尾衔接，像一串鱼沿发光门框游走，最前一只消失，后一只随即跟入。
context_fact: 小宇宙设备和太阳已拆除，机器人最后离场，门仍负责物质转移。
image_mechanism: 鱼贯将机械队列赋予流动生物节奏，‘贯’突出同一路径穿过狭口的连续性。
property_alignment: 机器人队列对应鱼群；单列对应首尾相接；穿门对应游过狭口；持续进入对应水流方向；逐个消失对应鱼游离视野。
context_alignment: 终章最后保留生态球小鱼，机器人先以鱼状队列离场，为机械世界退去、生命世界留下做微弱预响。
narrative_function: 用整齐动态图景结束机器拆除阶段，使场景从繁忙迅速空到三个人和一艘船。
transfer_rule: 队伍用鱼贯描写时，要有单一入口、首尾顺序、连续移动与群体退出，避免泛指任何排队。
failure_boundary: 机器人不靠水游动，也未表现鱼群自主转向；共同点限于队形与通过方式。
