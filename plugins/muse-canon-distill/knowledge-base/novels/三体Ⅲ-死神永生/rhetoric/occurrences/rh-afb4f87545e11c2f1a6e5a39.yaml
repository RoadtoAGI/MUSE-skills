figure_type: metaphor
quote: 自己已经坠入深渊，应该能见到他了
sensory_mapping: 地面仍托着身体，意识却穿过黑暗向下跌，云天明的眼睛仿佛在深处等候。
context_fact: 她刚因极端刺激失明，在黑暗中幻见眼睛并误把现实呼唤当云天明声音。
image_mechanism: 深渊把视觉黑暗、心理崩溃和死亡距离合成垂直坠落，见死者成为抵达底部的预期。
property_alignment: 失明黑暗对应深渊无光；昏倒对应坠落；社会绝境对应离开安全地面；幻见亡友对应接近死者领域。
context_alignment: 此前时间与社会一直被写成倒退、堕落，个人此刻完成最深一层向下运动。
narrative_function: 显示程心已无法区分生理、历史和死亡黑暗，并为现实救援声音进入制造误认。
transfer_rule: 绝望如坠渊时，应让方向、光线、断开对象和底部预期分别有现场依据。
failure_boundary: 她仍有意识并很快获救，未真正死亡或下降；若人物只是忧郁而无突发失重，深渊会过重。
