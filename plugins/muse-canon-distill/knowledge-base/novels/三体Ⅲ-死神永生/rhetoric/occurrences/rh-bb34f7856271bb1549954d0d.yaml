chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 这种事情，知道得多一点，你心里的光明就少一点
sensory_mapping: 每层宇宙真相像盖上一层黑布，关一帆警告心灯会更暗，程心却说灯早已熄灭。
context_fact: 太阳系毁灭、责任幻觉和云天明约会失败已使她精神麻木；她仍要求听真正星际战争。
image_mechanism: 把知识的心理代价计量为光减少，程心用“已经没有”表明边际损失为零，从而取得继续听的资格。
property_alignment: 希望对应内光；黑暗真相对应遮光物；增加知识对应减光；创伤对应熄灭；继续求知对应在黑暗中前行。
context_alignment: 全书黑暗森林从外部宇宙环境转进人物内心，宇宙越被揭示，心中可照明的道德图景越少。
narrative_function: 把信息披露变成人物明确选择，并标记接下来内容可能超出心理承受范围。
transfer_rule: 希望知识关系写成光量时，应说明何种知识遮光、光代表什么、是否可恢复及人物为何仍选择减少。
failure_boundary: 知识不必必然摧毁希望，程心也并非完全没有善意；光明归零是两人的悲观表达。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 了解更多宇宙战争真相会削弱人的希望、善意信念和安全感，而程心自认这些已被创伤耗尽
vehicle: 内心储存有限光亮，每增加一份黑暗知识，光源就被遮减，最终完全熄灭
ground: 光量可增减；光代表希望与善意；知识带来遮蔽；黑暗随了解扩大；归零后不再有保护意义；主体仍可选择继续看
