chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 像往常每天去做检查一样平静
sensory_mapping: 死亡门槛被压低成每日走廊路线，脚步、时间点与进门动作都沿医院惯例继续。
context_fact: 他是本市第四例安乐，现场人员很少，十点按约独自进入房间。
image_mechanism: 例行检查借空间与程序的相似掩去结果差异，越普通的走法越显出死亡已被他日常化。
property_alignment: 准时进室对应每日检查日程；独自行走对应熟悉流程；无恐惧对应例行事项低情绪负担。
context_alignment: 安乐程序就在医院内完成，场所连续性使类比可信，也与他前文卡夫卡式轻快赴死相承。
narrative_function: 消除临终仪式感，以常规动作突出人物对生命退出的平淡接受。
transfer_rule: 重大事件写成日常时，应找两者共享的真实路线和程序，再让后果差异制造反差；不能只用平静一词强贴。
failure_boundary: 若他被押入、情绪崩溃或安乐地点完全陌生，例行检查的熟悉与自愿性都会失效。
quality_assessment: effective
