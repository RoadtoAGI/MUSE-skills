chapter: 【掩体纪元11年，光速二号】
figure_type: simile
quote: 刚才空空荡荡的地面充满了奇怪的影子，像夜里被天边闪电照亮的荒原
sensory_mapping: 夜荒原；蓝闪掠地；怪影骤现；空旷无声；明暗断裂
context_fact: 探照灯关闭后，黑洞尘埃辐射成为唯一不规则光源，废城内部随其明灭时隐时现。
image_mechanism: 微弱蓝光不负责持续照明，只像远雷逐帧揭开地面；每次闪现都换出一组难辨阴影，使空城获得荒野风暴前的危险广度。
property_alignment: 城内地面对应荒原；深暗环境对应夜色；辐射脉冲对应闪电；结构影子对应荒原怪石；瞬时可见对应电光揭景；无人废墟对应荒野；广阔内腔对应地平面
context_alignment: 程心刚从破屋洞口看星空，荒原意象进一步把人造城市内部改写成无人自然废土，强化文明撤退后的倒置。
narrative_function: 用间歇视觉制造悬疑节拍，让空旷废墟在每次亮灭中重新变得陌生。
transfer_rule: 用闪电荒原写间歇照明时，要让空间开阔无人、光从远处短促爆发、阴影随脉冲出现并留下大片未辨区域。
failure_boundary: 光源稳定柔和、空间狭窄拥挤、影子边界始终清楚或环境有人群活动时，夜荒原的骤现与孤寂均会落空。
