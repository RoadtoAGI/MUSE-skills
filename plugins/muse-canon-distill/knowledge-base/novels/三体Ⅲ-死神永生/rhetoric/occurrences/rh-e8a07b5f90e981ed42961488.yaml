chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 这是蓝星的正午，但天空和太阳的色彩看上去像地球的黄昏
sensory_mapping: 蓝星太阳正挂高空，颜色却像地球将落，浅红日轮把淡黄天空染成永不对应时钟的黄昏。
context_fact: 蓝星大气和恒星光谱不同，地面是蓝草原、远方白雪山，生命环境近似地球。
image_mechanism: 用地球昼夜色谱校准陌生行星，时间与颜色的错配让相似家园保持异星感。
property_alignment: 淡黄天空对应地球暮色；浅红太阳对应落日；正午高度对应关键失配；温和照明对应黄昏观感。
context_alignment: 太阳系以最后日落终结，抵达新世界时首先遇见黄昏色正午，旧日落的颜色在新生环境回返。
narrative_function: 用熟悉时段迅速建立蓝星光色，同时提醒它虽宜居却不是地球复制品。
transfer_rule: 异星光景借地球时段比照时，应对齐色彩、亮度、太阳位置，并突出其中一项时间错位。
failure_boundary: 蓝星不是处于黄昏，太阳高度和当地时间均为正午；相似只在视觉色谱。
