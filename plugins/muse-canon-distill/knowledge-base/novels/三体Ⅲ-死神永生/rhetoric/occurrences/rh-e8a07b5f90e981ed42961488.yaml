tenor: 蓝星正午时淡黄色天空与浅红太阳组成的光色景象
vehicle: 地球太阳接近地平线时天空泛黄、日轮转红且光线温和的黄昏
ground: 天空偏黄；太阳偏红；整体色温温暖；亮度不像地球正午刺白；景象熟悉却时间位置错位
