tenor: 笔直横过整个可见太空、长度和规则度超出人力尺度的降维长线
vehicle: 上帝在宇宙大小的制图板上压住丁字尺，以绝对笔直的一笔划过整张图面
ground: 线条极直；跨度覆盖整个画面；动作由一端连续推进到另一端；尺度暗示超人力量
