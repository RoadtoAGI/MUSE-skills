chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 像上帝在宇宙的绘图板上比着丁字尺从左到右画了一道
sensory_mapping: 星海铺成深黑绘图板，巨大丁字尺贴住银河，上帝的亮笔从左缘稳稳划到右缘。
context_fact: 魔戒展开线横贯飞船视野，看不到头尾，把可见宇宙明确分成两部分。
image_mechanism: 丁字尺把令人恐惧的长线重新解释为精确作图，一端到另一端的笔势对应降维边界扫过魔戒。
property_alignment: 太空背景对应绘图板；绝对直线对应尺边；横贯视野对应整板一笔；宇宙尺度对应上帝执笔。
context_alignment: 无形巨笔已标示碎块边缘，魔戒毁灭时笔升级为上帝和工程制图工具，显示这次线迹空前巨大规则。
narrative_function: 在伤口暴力之外加入冷静几何秩序，使降维显得既毁灭性又像宇宙法则的机械执行。
transfer_rule: 自然直线如制图时，应匹配画面尺度、导向工具、落笔路径和超越人力的执行者。
failure_boundary: 不存在上帝或绘图意图，长线后续会弯散成尘埃；丁字尺仅对应最初短暂的笔直阶段。
