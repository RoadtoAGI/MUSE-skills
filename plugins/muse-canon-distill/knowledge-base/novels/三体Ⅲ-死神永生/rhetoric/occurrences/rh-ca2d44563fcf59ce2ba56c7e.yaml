tenor: 望远镜中银白明亮、物质仍在旋转但原有三体生命与文明已全部死亡的星系残骸
vehicle: 远方大片墓地在冷月下泛银，死者与遗物被集中安放，空间寂静而美丽却不再有生命活动
ground: 毁灭星系对应墓场；死亡文明对应死者；残骸星云对应墓土遗物；银光对应月照墓地；无生命对应墓地寂静；遥远观测对应远望坟区
