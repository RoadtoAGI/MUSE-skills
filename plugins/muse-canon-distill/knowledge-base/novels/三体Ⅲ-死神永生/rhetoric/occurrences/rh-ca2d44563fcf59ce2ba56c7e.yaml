chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这四十万亿千米外的银色墓场
sensory_mapping: 银色星墓；云团墓土；双星冷照；文明长眠；远镜吊唁
context_fact: 三体星系物质总量仍在且形成精致螺旋星云，但强辐射已消灭全部生命。
image_mechanism: 天文学图像的银美被罩上葬地意义，物质守恒不再等于“没有毁灭”：组合尚存如墓碑遗物，生命这一死者已经缺席。
property_alignment: 星系残骸对应墓场；文明对应死者；星云对应墓地景观；银光对应冷月色；物质留存对应遗物墓碑；生命消失对应长眠；望远镜观察对应远祭
context_alignment: 威纳尔随即用扑克牌说明物质只是重洗、生命同花顺却消失，墓场先把物质保留与生命毁灭的差别形象化。
narrative_function: 让壮丽观测成为悼亡现场，为科学守恒论加入生命尺度的损失。
transfer_rule: 用墓场写遗迹时，应有明确死去的群体、仍留存的物质痕迹、寂静空间和与生前秩序的断裂。
failure_boundary: 生命仍繁盛、遗迹正在重建，或观察者只见新生星系而无死亡证据时，墓场会提前封闭未来。
