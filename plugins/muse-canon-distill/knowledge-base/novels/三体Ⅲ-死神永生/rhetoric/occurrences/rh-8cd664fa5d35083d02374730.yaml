chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 银色的盔甲像扔进暗红色镪水的一小片锡箔，转瞬间无影无踪
sensory_mapping: 俯瞰战阵成为酸液容器，银甲成为闪亮金属薄片；人群合拢被看成腐蚀溶解。
context_fact: 君士坦丁十一世脱下紫袍，独自拔剑冲入蜂拥而来的奥斯曼军队，随后失踪。
image_mechanism: 颜色和尺度先完成化学装置，转瞬无踪再启动溶解过程；英雄冲锋因而呈现为不可逆的物质消失。
property_alignment: 银甲对应锡箔亮色；单人小尺度对应薄片；暗红敌军对应镪水颜色与体量；被围后消失对应强酸溶解。
context_alignment: 史书未能确认皇帝尸体，喻体既说明目击者为何失去他，也以不可逆反应宣布帝国终结。
narrative_function: 用一瞬化学过程压缩末代皇帝之死，让个人和帝国同步从可见世界消失。
transfer_rule: 写小亮体被大暗体吞没时，可借反应过程而非容器外形；介质颜色、体量差和不可逆后果必须逐项匹配。
failure_boundary: 皇帝若率队突围、银甲持续可见或后来完整走出敌阵，溶解的不可逆性就错误；敌阵非暗红也失去色彩扣合。
