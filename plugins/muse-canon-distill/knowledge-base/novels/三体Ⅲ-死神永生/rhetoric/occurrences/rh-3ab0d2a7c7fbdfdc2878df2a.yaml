quote: 历史似乎又回到了起点，新的轮回开始了
sensory_mapping: 两百年历史被弯成圆环，威慑时代走过一圈后，舰队航迹又把指针推回危机起点。
context_fact: 观测站发现四百一十五条新航迹，起初估计舰队仍需两三个世纪抵达。
image_mechanism: 轮回用闭合轨迹压缩复杂历史，回到起点强调文明取得的威慑成果已被一次选择清零。
property_alignment: 第二舰队对应旧危机重现；威慑失效对应回到起点；新一轮等待对应圆环再次运行。
context_alignment: 章节名失落的世界指向成果倒退，圆环又为下一句社会心理重复提供结构预告。
narrative_function: 把局部航迹发现提升为纪元级倒退，并在光速真相揭露前制造熟悉的旧危机预期。
transfer_rule: 历史轮回应明确哪些结构变量复位、哪一轮已结束，以及新一轮将由何事件启动。
failure_boundary: 技术水平、舰队速度和人类经验都已改变，历史没有真正重复；圆只概括危机关系。
