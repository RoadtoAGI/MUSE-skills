chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 那个丢失的维度并没有消失，它从宏观蜷缩到微观
sensory_mapping: 贯穿宇宙的第四轴像一条巨带缓缓屈身，一圈圈向内盘紧，最后缩进粒子尺度的暗点。
context_fact: 科学家认为宏观高维会跌落到低维，四维碎块正在缩小，但理论认为维度本身转为微观蜷缩而非消失。
image_mechanism: 蜷缩把尺度转换写成身体动作，使抽象维度既保持连续存在，又直观丧失宏观伸展和进入空间。
property_alignment: 宏观维度对应伸展躯体；紧致化对应向内屈曲；微观尺度对应缩成小团；未消失对应材料仍在。
context_alignment: 前一句用瀑布写维度跌落，此句把落下后的去向补成收卷，避免读者误以为第四维被凭空抹除。
narrative_function: 以一个连续动作衔接宏观四维毁灭和理论物理中的微观紧致维，保留科学说明的可视性。
transfer_rule: 写尺度坍缩而实体不灭时，可选择收卷动作，并分别对应保留物、原始延展、缩小方向和最终尺度。
failure_boundary: 维度没有肌肉或主动姿态，蜷缩也不等于普通物体占用体积变小；它只提示紧致化的几何结果。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 四维空间降为三维后，额外维度由宏观可展开状态转成微观紧致维度
vehicle: 原本伸展在外的长肢或长条物向内屈曲盘绕，收成肉眼难见的小团
ground: 结构仍然存在；占据尺度急剧缩小；原先可通行的方向被紧密收拢；变化具有向内卷曲过程
