chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 整个飞行器看起来像一个沿航行方向横放的巨大的降落伞
sensory_mapping: 辐射帆成为横卧太空的伞盖，五百千米帆索成为伞绳，太空舱缩成吊挂物。
context_fact: 核爆在帆后发生，软帆不能承载舱体，只能用极长帆索隔离辐射并拖曳。
image_mechanism: 将熟悉降落伞旋转九十度，保留膜—索—载荷受力链；方向反转说明它不是下落而是沿航向加速。
property_alignment: 辐射帆对应伞面；帆索对应伞绳；太空舱对应悬挂载荷；核爆辐射对应推动伞面的流。
context_alignment: 类比直接展示无法一眼想象的五百千米结构，也解释载荷为何只能置于帆后。
narrative_function: 把飞行器几何和动力传递压成单一工程图，便于理解后续偏航事故。
transfer_rule: 工程构型类比应保持部件拓扑和受力路径；必要时明确旋转方向，防止把功能也照搬成减速。
failure_boundary: 刚性帆、载荷装在帆面或没有帆索时，降落伞拓扑失效；它在此用于加速，不代表空气阻力减速。
quality_assessment: exemplary
