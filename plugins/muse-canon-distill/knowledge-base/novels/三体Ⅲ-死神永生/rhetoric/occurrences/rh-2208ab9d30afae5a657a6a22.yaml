chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 她的心已经感觉不到疼痛，只有死后的麻木
sensory_mapping: 三十五年耽误再次刺向她，心却像已死组织，连疼都不再传回，只剩冷硬麻木。
context_fact: 她已把太阳系毁灭归为自己的第二次错误，又发现太阳系原本领先银河人类近两个世纪。
image_mechanism: 死后麻木把“更痛”写成“无痛”，反常生理序列显示创伤已越过可表达阶段。
property_alignment: 内疚伤害对应致命创口；过去悲痛对应神经痛；当前无感对应死亡后麻木；仍履责对应尸体外形尚存。
context_alignment: 她自认精神已死，这句把死亡隐喻落实到心的感知功能，完成同一心理框架。
narrative_function: 避免重复哭泣表现内疚，用情绪归零显示创伤进一步深化。
transfer_rule: 极端痛苦写成死后无痛时，应有先前疼痛、越阈过程、功能停止和仍在行动的反差。
failure_boundary: 程心仍能形成新情绪与关系，麻木不是永久神经死亡；它描述当下创伤状态。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 程心反复想到自己可能耽误光速技术后，内疚超过痛感阈值而转为彻底情感麻木
vehicle: 身体死亡后神经停止传递痛觉，只剩无知觉、无反应的尸体状态
ground: 伤害已发生；痛觉曾存在；强度或持续时间越过极限；感知停止；主体仍保留外形；无法进一步反应
