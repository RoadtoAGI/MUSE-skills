chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: 就像一个手拿绞索的人，他是危险的；但如果他把绞索套到自己的脖子上，他就变成安全的了
sensory_mapping: 曲率航迹像宇宙绞索，挂在世界旁边是武器，围紧自身则把整个文明的光速出口勒住。
context_fact: 慢光速黑域可避免被黑暗森林打击；曲率航迹会降低局部真空光速，包裹恒星系即形成安全声明。
image_mechanism: 绞索用道具方向解释技术信号的二义性，并直观表现黑域安全以自我囚禁和速度上限为代价。
property_alignment: 曲率技术对应绞索；航迹邻近对应手持对外；包裹世界对应套颈；攻击能力对应勒人；低光速封闭对应自缚。
context_alignment: 黑暗森林中的安全不是展示善意，而是公开证明自己已失去攻击范围，安全与死亡刑具共用形象。
narrative_function: 将复杂宇宙社会学安全声明压成一句可记的动作类比，解释黑域为何能避打击。
transfer_rule: 双用途技术类比工具时，应让方向、对象、能力变化、外部读法和代价逐项对应。
failure_boundary: 慢光速世界不一定立即死亡，绞索也不能完整表示空间曲率；类比聚焦威胁指向与自限信号。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 曲率航迹在世界旁边表示掌握危险技术，在包裹本世界时则以降低本地光速声明无法向外威胁
vehicle: 手持绞索者可能勒死别人而危险，把绞索套到自己脖子后将危险能力转为自我束缚
ground: 同一工具可对外或对内；空间位置改变意义；对外使用威胁他者；自我使用限制行动；旁观者据此判断安全
