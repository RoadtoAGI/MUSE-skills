figure_type: metaphor
quote: 它不再是一个亮晶晶的精灵，变成了一枚飘浮在太空中的旧炮弹
sensory_mapping: 水滴表面的星光和灵气退去，精灵轮廓塌成一枚黄铜旧弹壳，在黑空中无力滑行。
context_fact: 影像显示水滴力场消失、表面变成普通金属，之后被蓝色空间号穿梭机推着减速。
image_mechanism: 精灵与旧炮弹构成身份反差，用能动性、材质和时代感三项完成去神化。
property_alignment: 镜面闪耀对应精灵光；主动机动对应灵气；黄铜锈色对应旧弹；失去推进对应被动漂浮。
context_alignment: 人类曾把水滴误认礼物又视作死神，此刻它终于落回可收藏、可研究的旧技术物。
narrative_function: 完成水滴意象的终极翻转，并为深空人类超越三体探测器提供视觉证据。
transfer_rule: 对象去神化可用前后双重身份，但应让光泽、能动性和技术地位逐项反转。
failure_boundary: 水滴仍有致命质量和速度，旧炮弹不表示无危险；精灵也只是人类早先投射。
