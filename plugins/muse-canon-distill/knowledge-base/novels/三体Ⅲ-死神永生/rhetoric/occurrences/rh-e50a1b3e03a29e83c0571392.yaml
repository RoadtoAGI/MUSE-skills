chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 她那只纤手很快会被冻得像玻璃一样脆
sensory_mapping: 温热手指一碰氮雪便会瞬间僵硬透明似的，轻微动作就可能像玻璃枝一样折碎。
context_fact: 程心因雪花唤起地球温暖，产生脱手套接雪的冲动；实际雪由冻结氮氨构成。
image_mechanism: 玻璃脆性以熟悉断裂危险击穿温暖雪景错觉，让同一晶莹质感从童年触觉翻转为致残威胁。
property_alignment: 冻结组织对应硬玻璃；失去韧性对应脆；晶莹雪花对应透明材质；轻触断裂对应冻伤后组织破坏。
context_alignment: 二维城市先像玻璃城被碾碎，此处个人身体也会玻璃化，宏观脆裂收缩到一只手。
narrative_function: 把冥王星雪景从母星慰藉拉回极端物理环境，表现情感记忆与生存理智的冲突。
transfer_rule: 冻硬组织比作玻璃时，应明确温度、韧性变化、可能断裂动作和此前晶莹美感的反转。
failure_boundary: 手不会真正变成硅酸盐玻璃或透明体，冻伤机制也更复杂；相似集中于硬脆与易裂。
quality_assessment: effective
