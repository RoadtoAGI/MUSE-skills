tenor: 裸手暴露在摄氏零下二百一十度氮氨雪花中后迅速冻结、失去韧性的组织
vehicle: 低温下坚硬、缺乏韧性、受到冲击便清脆碎裂的玻璃
ground: 温度极低；由柔韧转为硬脆；容易断裂；外表可能仍完整；破坏迅速且不可逆；触碰风险高
