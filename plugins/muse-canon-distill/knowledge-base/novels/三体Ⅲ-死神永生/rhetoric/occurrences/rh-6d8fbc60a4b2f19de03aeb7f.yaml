quote: 两眼冒火地盯着智子
sensory_mapping: AA的瞳孔像点燃两个火口，视线带着热焰直扑智子，随后石头也跟着飞出。
context_fact: AA已得知或猜到威慑失败，抱起石头砸向智子后脑。
image_mechanism: 火把不可见愤怒变成从眼睛逸出的能量，并自然连接凝视、叫骂和投掷的爆发顺序。
property_alignment: 愤怒激烈对应高温；目光定向对应火焰喷射；立即攻击对应火势外延。
context_alignment: 坑边岩浆和燃烧红柳提供真实火场，AA的情绪火焰成为人类唯一仍敢朝占领者冲出的火。
narrative_function: 在动作前一瞬显影AA的攻击意图，与程心的崩溃和智子的冷形成温度对照。
transfer_rule: 怒火从眼中发出时，要用凝视方向和后续爆发验证热能运动，避免孤立成语。
failure_boundary: 眼睛没有实际发光升温；若愤怒被压抑且没有外向动作，冒火会夸大行为趋势。
