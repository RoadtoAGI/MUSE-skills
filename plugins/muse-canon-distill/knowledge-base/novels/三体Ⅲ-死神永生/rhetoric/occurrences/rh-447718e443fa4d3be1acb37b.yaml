chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 有一种穿透心灵的力量
sensory_mapping: 智子的冷语像一根细刃越过程心的理智外壳，直接触到她的自责核心。
context_fact: 智子说全人类选择程心才选择了结局，只有程心无辜；她虽未获安慰，却承认话有力量。
image_mechanism: 穿透把接受一部分论断写成防线被刺穿，而非温和说服，保留敌人话语造成的疼痛和侵入感。
property_alignment: 心理防备对应外壳；话语说服对应穿刺；触动内疚对应抵达核心；无法忽视对应留下创口。
context_alignment: 武士刀尚未出鞘，智子先用语言完成一次精准穿刺，使她的身体武器和话语武器互相映照。
narrative_function: 显示程心对自责解释出现裂口，同时维持说话者作为敌人的侵入性。
transfer_rule: 把话语写成穿透物时，应指出心理屏障、命中内核和后续变化，最好与现场锐器或动作呼应。
failure_boundary: 程心没有完全接受或获得安慰，穿透不等于思想被占领；若话语只引起短暂注意，力度会过重。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 智子一句话越过程心的防御，使她无法完全拒绝其中判断的说服力
vehicle: 尖锐物突破外层屏障并深入物体核心的穿刺力量
ground: 作用越过表面抵抗；抵达隐秘内层；接触后留下难以忽视的改变
