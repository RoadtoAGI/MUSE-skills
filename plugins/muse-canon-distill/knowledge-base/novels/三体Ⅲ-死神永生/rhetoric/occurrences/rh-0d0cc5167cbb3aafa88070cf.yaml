quote: 她用这种想象一点一点地把纷繁的感情赶出意识
sensory_mapping: 喜悦、恐惧和思念像挤在脑内的人群，被零引力想象一个个推出门外，意识渐渐空下来。
context_fact: 她即将承担两小时会面记忆任务，不能让私人情感占用注意力。
image_mechanism: 空间驱逐把自我调节变成逐项清场，说明情绪不是自动消退，而是被有意排除。
property_alignment: 纷繁情感对应拥挤者；意识对应房间；集中想象对应驱赶动作；超然空白对应清场完成。
context_alignment: 她所在拉格朗日点被称为零的空旷，外部空域成为清理内部空间的操作模型。
narrative_function: 把心理准备写成可执行动作，为随后情感火山突破压制埋下张力。
transfer_rule: 清除念头写成赶人时，应说明心理空间、被逐对象、持续动作和腾空后的用途。
failure_boundary: 感情不能彻底移出意识，也会在重逢时返回；驱逐只描述暂时注意控制。
