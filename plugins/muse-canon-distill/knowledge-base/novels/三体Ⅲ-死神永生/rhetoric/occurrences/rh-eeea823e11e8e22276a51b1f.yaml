chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 在第四个维度上我们是瞎子
sensory_mapping: 太空艇虽能看见圆环小点，第四轴却像一片无光处，驾驶者伸手摸索，障碍会从黑暗中骤然贴到面前。
context_fact: 魔戒在三维视觉里长久只是小点，却可能处在任意四维距离，卓文因此持续低速航行。
image_mechanism: 瞎把坐标缺失转为感官缺失，强调看得见目标轮廓仍不等于拥有可导航的距离知觉。
property_alignment: 不可测第四坐标对应视觉缺失；距离判断失灵对应看不清远近；突然撞击风险对应盲行碰障；低速操纵对应摸索前进。
context_alignment: 下一刻魔戒果然从硬币大小骤成顶天立地，验证盲喻不是泛泛危险，而精确指向缺失的距离维度。
narrative_function: 用一句口语化警告压缩四维导航难题，并为紧随其后的险些相撞蓄势。
transfer_rule: 把测量缺口写成失明时，应锁定看不见的具体变量、由此造成的误判和人物采取的补偿动作。
failure_boundary: 探险者仍有三维视觉、仪器和航向控制，并非完全没有感知；失明只限第四维距离。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三维探险者无法感知和测量四维方向上的距离
vehicle: 失去视觉的人看不见前方障碍和距离，只能依靠有限线索谨慎摸索
ground: 关键感知通道缺失；目标可能近在眼前而主体不知；移动容易突然碰撞；行动必须降速
