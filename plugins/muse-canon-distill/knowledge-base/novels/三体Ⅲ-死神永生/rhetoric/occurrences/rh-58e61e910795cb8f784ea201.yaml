figure_type: metaphor
quote: 那他们就是上帝派来的拯救天使了
sensory_mapping: 远去的三体舰队被想象成天上使者，智子的和服身影像降临云端，手中握着唯一救赎密钥。
context_fact: 威胁和谴责无法迫使智子公开安全声明，公众转而乞求、祈祷并把三体人再次当神。
image_mechanism: 天使把技术信息垄断改写成神授救赎，权力不对等因宗教语汇变为值得虔诚而非可质询。
property_alignment: 三体高技术对应超凡能力；安全声明对应救赎；智子远居云雾对应天界使者；公众乞求对应祈祷。
context_alignment: 三体刚被人类广播毁灭，却被同一人类奉为拯救者，天使形象揭示恐惧如何迅速改写敌我记忆。
narrative_function: 解释公众由请求滑向宗教崇拜的关键跳跃，并为朝圣智子居所提供神学身份。
transfer_rule: 掌握稀缺技术者被写成天使时，应对应救赎资源、权力距离、信众仪式及神化带来的责任转移。
failure_boundary: 三体舰队没有上帝授权，也未承诺救人；天使是绝望公众的投射，不是叙述事实。
