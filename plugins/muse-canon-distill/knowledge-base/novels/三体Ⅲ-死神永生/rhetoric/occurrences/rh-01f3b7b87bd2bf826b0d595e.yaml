quote: 它好像是另一个宇宙的投影，与我们的世界全无关系
sensory_mapping: 白平面像从隔壁宇宙穿墙投来的光片，本体留在彼处，人的手只能掠过这层影像。
context_fact: 纸条无厚度，机械抓斗和手均无法触碰，却持续发光和发送引力波。
image_mechanism: 投影同时解释降维外观和相互作用缺失，使另一个宇宙从玄想变成对实验矛盾的工作模型。
property_alignment: 纸条平面对应投影面；无厚度对应降维影像；不可触对应本体异域；可见发光对应信息投来。
context_alignment: 白Ice由导师丁仪留下的宇宙怀疑出发，比其他人更早把纸条视作不同物理规则的入口。
narrative_function: 首次明确提出跨宇宙或跨维解释，推动任务从探测物体转向逃离危险。
transfer_rule: 异常对象比作异域投影时，应对齐本体位置、降维方式、可传信息和不能发生的相互作用。
failure_boundary: 纸条后来表现为二维空间入口但未证明来自另一宇宙；投影模型仍是白Ice猜测。
