tenor: 史耐德确认无法返航后瞬间形成、无过程且永久改变人格的生存信念
vehicle: 思想钢印一次写入大脑、直接固定不可动摇观念
ground: 改变在单一瞬间完成；新认知绕过渐进说服并稳定支配后续行为
