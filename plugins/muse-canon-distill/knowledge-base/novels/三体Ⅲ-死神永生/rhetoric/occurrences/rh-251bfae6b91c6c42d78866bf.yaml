chapter: 【威慑纪元13年，审判】
figure_type: analogy
quote: 就好像——那个传说中的什么思想钢印一样
sensory_mapping: 绝望消息成为压印机，一次落下便在意识材料上留下硬质字模，旧人格被覆盖。
context_fact: 他意识到飞船是全部世界后赞成攻击量子号，以获得生存资源。
image_mechanism: 钢印解释没有过程的一下变了，思想内容由外部现实而非机器写入，却产生同样强制稳定性。
property_alignment: 消息瞬间冲击对应钢印落下；人格改变对应印文形成；后续坚定攻击对应印记不易消除。
context_alignment: 面壁计划中的思想钢印是共享传说，庭审者能立即理解深空环境如何重写伦理。
narrative_function: 说明星舰文明价值转变并非普通意见变化，为责任判断引入环境断裂。
transfer_rule: 骤变认知借压印写时，应有单一触发、无渐变体验和长期行为一致性；还要区分技术强制与现实冲击。
failure_boundary: 若信念经过长期讨论形成、后来频繁摇摆或仍受旧伦理支配，钢印式瞬时固定不成立。
quality_assessment: effective
