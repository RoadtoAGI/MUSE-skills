chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 自身的光线淹没了后面透出的星光
sensory_mapping: 纸条的白光像浅洪漫过背后星点，星星仍透在里面，却隔着亮水变得模糊。
context_fact: 纸条透明无厚度，从侧面完全消失，但正面自发光干扰背景观察。
image_mechanism: 淹没用液面层级解释光强竞争，进一步制造纸条可见而本体不明的感官悖论。
property_alignment: 纸条强光对应洪水；星光对应低处物；透明面对应覆盖区域；模糊对应水下折损。
context_alignment: 同一作品此前太阳光淹没群星，这里微小纸条竟复制恒星效果，暗示能量尺度不应按体积判断。
narrative_function: 交代侧视消失实验的观察条件，并以恒星级视觉能力反驳白羽式无害感。
transfer_rule: 光压过光写成淹没时，应标出两者强度、空间前后、被遮对象仍存在和观察条件。
failure_boundary: 光没有液面或重量，星光也未被吸收；比较只描述视觉信噪比。
quality_assessment: effective
