tenor: 纸条自发白光比透过它的背景星光更强，使星点边缘模糊难辨
vehicle: 较高水面覆盖低处物体，物体仍在原位却沉入水下不可清楚看见
ground: 强介质覆盖弱信号；被遮对象未消失；视野由前景占据；强度差决定可见性
