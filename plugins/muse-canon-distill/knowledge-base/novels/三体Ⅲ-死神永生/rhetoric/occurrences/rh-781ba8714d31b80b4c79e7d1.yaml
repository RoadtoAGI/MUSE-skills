tenor: 得知飞船未逃离后，同一超重压力被船员体验为封闭、无出路的死亡压迫
vehicle: 墓穴土石从四周压住尸体，空间封闭、空气断绝且无法自行离开
ground: 压力包围；呼吸困难；行动受限；结局指向死亡；保护空间反转为囚禁空间
