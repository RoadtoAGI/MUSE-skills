chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 现在，它变成了坟墓一般的压迫，令人窒息
sensory_mapping: 座椅上的怀抱瞬间变成压棺土层，胸口被越压越紧，飞船像封死的墓室滑向深渊。
context_fact: 启示号无法超过光速逃逸，船员已注定与整个太阳系一起二维化。
image_mechanism: 同一触觉从怀抱到坟墓只因认知改变，喻体切换揭示感觉意义由命运判断决定。
property_alignment: 超重压力对应墓土；座舱封闭对应墓室；无法逃离对应封葬；窒息感对应缺氧；必死结局对应坟墓。
context_alignment: 白Ice即将称二维面为深渊和巨画，坟墓先把飞船设为全员共同的死亡容器。
narrative_function: 完成安全错觉的反转，在物理解释前让末日判决落到胸腔。
transfer_rule: 同一感受换喻体时，应明确新事实如何逐项逆转旧喻的情绪与功能。
failure_boundary: 飞船仍有空气且死亡尚未发生，墓穴不解释空间流动；只表达无逃脱结局。
