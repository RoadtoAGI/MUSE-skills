chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 整个沙漠都被它吞没
sensory_mapping: 沙坑张成无边巨口，沙丘一座座滑过坑沿，被黑暗腹腔整片咽下。
context_fact: 坑从丁仪手挖小洞转瞬扩至目力极限，车也被拖向坑沿。
image_mechanism: 吞咽为几何扩张赋予主动捕食性，使二维面增长的连锁机制在梦中成为巨口。
property_alignment: 深坑对应口腹；扩大边沿对应张口；沙漠坠入对应吞食；无底黑暗对应腹内。
context_alignment: 后来二维平面被称为厚度为零的深渊，这个梦喻先把空间降维表现成吞噬。
narrative_function: 把局部异变升级为世界终结，并推动车辆失去任何绕行可能。
transfer_rule: 扩张区域写成吞噬者时，应对应边界运动、物质去向、中心形态和不可逆性。
failure_boundary: 坑没有意志或消化功能，沙物质仍存在于下方；吞没只描述视野和地表消失。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 扩张深坑迅速占据全部沙漠，地表连续落入黑暗底部
vehicle: 巨口不断扩大并吞下周围土地，入口之后只剩不可见腹内
ground: 边界向外扩展；周围物质持续消失；中心黑暗深不可测；过程不可逆；规模越来越大
