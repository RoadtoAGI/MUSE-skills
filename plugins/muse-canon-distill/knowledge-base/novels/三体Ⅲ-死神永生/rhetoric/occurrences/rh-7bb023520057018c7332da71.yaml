chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 现在，他们之间有一种默契，像一个人一样
sensory_mapping: 关一帆调暗灯光，程心便飘向舷窗，两人的动作像同一身体里视线与手臂自然衔接。
context_fact: 他们在低光速穿梭机中共度了约一千六百万年外界时间，依靠备用系统一起生存。
image_mechanism: 一人类比将关系默契转成单体协调，漫长共同困境压缩了交流成本和心理距离。
property_alignment: 两人对应同体部位；共同经验对应共享意识；无言配合对应神经协调；信任对应不设防；一致目标对应单一意志。
context_alignment: 人类数量曾减至程心AA两人，低光速困局又把程心关一帆组成最小共同体，生存靠关系合一。
narrative_function: 用一个操作细节显示一千六百万年间关系变化，而不展开漫长生活叙述。
transfer_rule: 两人默契比作一人时，应给出无需提示的连续动作、共同目标、时间积累和仍保留的个体边界。
failure_boundary: 两人仍有不同愿望与决定，关一帆后来选择留下；“一人”只指当下协作默契。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 程心与关一帆在长期共同受困和共同操作后无需多言即可同步理解、配合行动
vehicle: 同一个人的感知、判断和肢体由统一意识自然协调，不需互相解释
ground: 信息共享；行动同步；无需语言；目标一致；互相信任；一方动作另一方立即理解；边界感减弱
