quote: 如果把故事看做一个二维平面，双层隐喻只为真实含义提供了一个坐标，附加的单层隐喻则相当于第二个坐标，把含义在平面上的位置固定下来
sensory_mapping: 意义平面；两轴交会；坐标锁点；多义收束；情报定位
context_fact: 肥皂船先暗示曲率驱动，雪浪纸卷曲和熨平再独立确认同一技术含义。
image_mechanism: 文学多义被摊成几何空间，解释不再靠感受强弱，而靠两条彼此独立的线索相交；“固定”把确定性变成定位动作。
property_alignment: 隐喻集合对应坐标系；候选含义对应平面点；第一线索对应一轴；附加线索对应另一轴；独立证据对应正交性；含义确定对应点固定；解码者对应定位者
context_alignment: 人类此前因单一情节可任意解释陷入僵局，坐标模型准确说明为何双重独立映射能抵消文学语言的不确定。
narrative_function: 用数学定位术语概括云天明编码法，为后续寻找“含义坐标”提供操作框架。
transfer_rule: 用坐标定位写证据收束时，应有至少两条相互独立、指向同一结论的线索，并明确每条单独仍保留多种可能。
failure_boundary: 两条证据相互依赖、只是重复同一假设，或候选意义并非可离散锁定时，坐标交点会制造虚假确定性。
