tenor: 云天明以一个双层隐喻给出候选解释，再用独立单层隐喻排除多义性、共同锁定唯一情报的编码模式
vehicle: 在二维平面定位一点时，一个坐标只限定一条可能轨迹，第二个独立坐标与其相交，固定唯一位置
ground: 故事意义空间对应平面；双层隐喻对应第一坐标；多种解读对应未定方向；单层隐喻对应第二坐标；共同交叉对应意义锁定；真实情报对应平面位置
