chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 关一帆手指灿烂的银河，眼睛却盯着韦斯特，像在指给他看一个突然出现的巨大怪物
sensory_mapping: 灿烂银河在指尖后长成怪物轮廓，关一帆的目光越过星空钉住医生，逼他承认异物存在。
context_fact: 他认为宇宙的维度结构不和谐，紧接着把宇宙称为高位截瘫病人。
image_mechanism: 手指对象而眼看听者复制发现怪物时的验证姿态，先给美丽银河覆上威胁轮廓，再宣布病理判断。
property_alignment: 银河庞大对应巨大身躯；结构畸形对应怪物异常；突然洞见对应怪物骤现；盯住医生对应催促确认。
context_alignment: 外观灿烂与数学结构病态发生冲突，怪物喻体把关一帆看到而常人未见的深层异常变成视觉突现。
narrative_function: 在理论说明前制造认知惊吓，使宇宙从审美背景翻转为需要诊断的异常主体。
transfer_rule: 以指认怪物表现理论发现时，应让对象的隐蔽异常、发现时刻和同伴验证动作同时出现。
failure_boundary: 若对象的异常早已公认、没有威胁或指示者只是欣赏景色，突然怪物的惊吓语义会误配。
quality_assessment: effective
