tenor: 关一帆指向银河并要求医生正视宇宙畸形时的动作与警告态度
vehicle: 有人突然发现庞大危险生物，指住它并盯着同伴确认对方是否看见
ground: 对象尺度巨大且带来威胁性震惊；指示者的注意力落在同伴反应而非对象本身
