chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她感觉背后像有座火山在爆发
sensory_mapping: 人声获得喷发热浪和地面震动，维德所在位置隆起成火山口，程心背部直接承受冲击波。
context_fact: 维德恰站在程心后面声嘶力竭吼叫，她看不见来源，差点惊叫。
image_mechanism: 背后定位让爆发先以声压袭身再被认出；火山尺度解释一个人的声音为何像环境灾害而非普通喊叫。
property_alignment: 突然咆哮对应喷发；巨响声压对应火山轰鸣；程心缩肩对应受冲击波惊吓。
context_alignment: 上一句兽化写维德内部失控，此句从程心体感写外部后果，两种喻体分工清楚。
narrative_function: 将领导者口号落实为他人身体恐惧，强化现场支配力。
transfer_rule: 近距声响借爆发写时，声源方位和听者身体反应要明确；灾害尺度应由异常音量和突发性共同支撑。
failure_boundary: 远处普通讲话、可预期演说或程心毫无惊吓时，背后火山的近身喷发感不成立。
