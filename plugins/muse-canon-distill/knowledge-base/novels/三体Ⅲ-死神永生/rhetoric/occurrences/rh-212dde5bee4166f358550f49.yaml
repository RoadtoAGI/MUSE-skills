tenor: 近在程心身后的维德突然爆发出的巨大咆哮与压迫
vehicle: 在背后喷发、释放热量震动和巨响的火山
ground: 声能突然从单点猛烈释放；近距离冲击包围身体并引发本能缩肩惊叫
