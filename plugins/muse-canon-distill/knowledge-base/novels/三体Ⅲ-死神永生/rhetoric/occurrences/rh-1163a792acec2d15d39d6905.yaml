chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 原来的走廊突然变成了不见底的深井，飘行变成了坠落
sensory_mapping: 圆走廊在脚下翻成立井，远端黑成无底井口，程心由漂浮者变成坠井人，栏杆像井壁把手。
context_fact: 离心力从微弱到增强，程心产生上下方向感，必须抓导引栏杆为自由下落减速。
image_mechanism: 深井把旋转站的径向重力变成地球熟悉的竖直坠落，原几何走廊无需变形，只因身体受力而重定向。
property_alignment: 辐条走廊对应井筒；外环方向对应井底；离心力对应下坠重力；栏杆对应井壁支点；长不可见对应无底。
context_alignment: 这是程心首次经历人工重力，深井的眩晕比技术说明更直接，让读者跟随身体重新获得上下。
narrative_function: 为穿越八个圆环建立统一纵向路线，并自然引出时代地层的下一层延展。
transfer_rule: 方向感翻转如坠井时，应明确轴线重定向、受力方向、身体速度、壁面支点和看不见的终点。
failure_boundary: 走廊实际沿空间站平面径向延伸，并非地下井；坠落由旋转离心效应产生且可控。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 终端站旋转重力逐渐出现后，原本水平感缺失的长辐条走廊被感知为竖直向下、人在其中下坠
vehicle: 深井从井口垂直伸向看不见的底部，人在井中受重力向下坠落，井壁可供抓扶
ground: 通道狭长且无尽；上下方向突然建立；身体沿轴线受力加速；四周壁面近身；底部不可见
