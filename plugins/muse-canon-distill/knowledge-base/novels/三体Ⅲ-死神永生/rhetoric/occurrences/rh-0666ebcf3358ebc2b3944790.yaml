chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 断面和圆洞的边缘一样，也是光洁晶亮的镜面，像被一把无形的利刀削掉了一样
sensory_mapping: 球形空缺被理解成刀锋轨迹，晶亮断面成为刃口留下的镜面，缺失部分像薄片被瞬间削走。
context_fact: 圆洞同时穿过舱壁、家具、衣物和人体，所有断面吻合成球面，现场找不到切割装置。
image_mechanism: 利刀解释光洁与齐整，无形保留因果未知；两者结合既给观察者熟悉动作模型，又不掩盖超常尺度。
property_alignment: 断面平整对应刀刃锋利；多种材料齐断对应一刀贯穿；没有工具对应刀具无形；球面吻合对应连续削切轨迹。
context_alignment: 真实原因是物体进入四维碎片后在三维视野中被截去，刀喻只忠实描述可见截面，不越权解释机制。
narrative_function: 把难以想象的维度相交转译成切割经验，同时维持超自然恐怖与技术悬念。
transfer_rule: 未知破坏如刀切时，应让断口质量、跨材质连续性和缺失轨迹支持锋利；无形用于标记施因仍未知。
failure_boundary: 边缘撕裂、烧蚀、碎屑遍地或不同材料损伤不连续时，利刀削切模型会误导；水银般反光仅是表面形似。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 床头柜、衣物和舱壁被四维空间整齐移去后留下的球面断口
vehicle: 一把看不见、锋利到不留毛刺的刀从物体中齐整削过
ground: 切割边界连续而极度光洁；施力者与常规切割过程完全不可见
