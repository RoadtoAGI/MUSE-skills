chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 程心感觉它更像是一个小房子，是她现在唯一的栖息之处
sensory_mapping: 整艘穿梭机已经死去，厚太空服却在她身体周围亮起一间单人小屋，空气和温暖都只存在屋内。
context_fact: 舱内会继续降温，现代系统全部停机；古式太空服以手动供氧、电热维持生命。
image_mechanism: 小房子把衣物放大为居所，准确体现环境层级逆转：飞船不再是家，贴身装备才是最外层世界。
property_alignment: 服壳对应房墙；头盔对应屋顶窗；供氧对应室内空气；电热对应供暖；生命维持箱对应基础设施。
context_alignment: 星环号曾是小世界和家，太阳系又成画；生存空间一路收缩，最终只剩一套服装大小。
narrative_function: 让手动太空服的重要性具象化，并说明程心为何接受其笨重与行动限制。
transfer_rule: 防护服比作房屋时，应逐项对齐墙体、空气、供暖、边界、居民数量和外部环境。
failure_boundary: 太空服没有房间尺度或长期资源，氧气能源有限；房屋只指短期生命壳层。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 在低光速停电、失压、极寒穿梭机内仍能供氧加热的笨重全手动太空服
vehicle: 有边界、空气、温度和生命条件，能把居住者与外部致命环境隔开的微型房屋
ground: 形成封闭壳体；内部可呼吸；维持温度；隔绝危险；容纳单人；是唯一安全空间；移动困难
