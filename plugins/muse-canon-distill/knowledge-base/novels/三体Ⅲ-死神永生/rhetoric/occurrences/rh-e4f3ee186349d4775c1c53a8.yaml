chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 它会发出像鸟叫的声音
sensory_mapping: 伞骨转慢后，黑伞像藏着一只夜鸟，从边缘发出越来越响的啼鸣催人加速。
context_fact: 伞必须保持适中旋转才能保护公主，过慢会合上并使她被画中魔法夺走。
image_mechanism: 鸟鸣把机械转速反馈变成活物警告，夜莺的清晰声线让危险阈值可凭听觉操作。
property_alignment: 伞响对应鸟叫；清亮连续对应夜莺鸣声；转慢声大对应警鸟催促；保护功能对应报险。
context_alignment: 童话把救命设备设计成无刻度手工系统，鸟声使宽姨和卫队长无需仪表也能控制。
narrative_function: 交代黑伞下限转速规则，并为后来铃声惊醒公主建立伏笔。
transfer_rule: 装置警报比作鸟鸣时，应匹配音色、强弱随状态变化、操作者反应和具体风险阈值。
failure_boundary: 伞内没有鸟，声音成因也未解释；夜莺只规定听感，不能证明装置有意识。
