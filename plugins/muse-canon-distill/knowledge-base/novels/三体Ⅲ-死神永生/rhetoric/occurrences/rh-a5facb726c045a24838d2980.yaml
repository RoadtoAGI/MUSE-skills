chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 恒星第一次显出了圆盘形状，虽然很小，像几十米外的一个乒乓球
sensory_mapping: 远处白球；小圆盘；纯亮表面；细节模糊；黑背景
context_fact: 传统望远镜看恒星只能见光点，新设备首次分辨其圆盘。
image_mechanism: 天体尺度被视角压缩成远处球桌上的小白球，读者立即知道它比点大多少：轮廓已圆，纹理仍全部丢失。
property_alignment: 恒星对应乒乓球；圆盘轮廓对应球面投影；白亮光对应白球；四十七光年对应几十米视觉距离；不可见细节对应远距模糊；黑太空对应背景空间
context_alignment: 极日常乒乓球为史无前例的天文分辨率提供人体尺度，克制宏大技术的抽象。
narrative_function: 精确交代图像能看见什么、还看不见什么，避免‘圆盘’被误解为高清。
transfer_rule: 用远处小球标定天体视角时，应匹配圆面大小、颜色、观察距离、细节损失和从点源到面源的变化。
failure_boundary: 图像已能解析风暴斑纹、恒星形状非圆，或参照距离不符合视角时，乒乓球会低估或错写分辨率。
quality_assessment: functional
confidence: 0.99
review_status: reviewed
tenor: 超级望远镜中遥远恒星形成可分辨但极小的圆盘，尚看不清表面细节
vehicle: 几十米外的白色乒乓球呈一个微小清楚圆面，能辨形状却难看见材质细节
ground: 恒星圆盘对应球的圆面；视角尺寸小对应远处乒乓球；亮白对应球色；细节不可见对应距离远；从点变圆对应球体轮廓可辨
