chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 他们被视觉信息的海洋淹没了
sensory_mapping: 舱室、管线、金属断面化成色彩海水一齐涌来，两个人悬在细节巨浪中找不到视线落脚处。
context_fact: 进入四维后，所有封闭体内外和固体断面并列显现，视觉在一瞬间接收海量信息。
image_mechanism: 海洋把抽象信息量赋予体积和压力，淹没则把超过认知带宽的结果写成身体失去自主。
property_alignment: 无限细节对应海量水体；全向显露对应四周水压；大脑过载对应溺水；无法把握局部对应失去方向。
context_alignment: 人物在失重飞船中本就悬浮，信息海无需地面支点，能够自然包围他们并承接此前空间泡的水感。
narrative_function: 把宏伟观看转成生理危机，为大脑随后学习忽略细节的适应过程提供压力来源。
transfer_rule: 用淹没写信息过载时，应同时呈现输入总量、来向、主体容量和处理失灵，而非只写很多。
failure_boundary: 信息没有液体重量，人物仍能呼吸并逐渐适应；海洋不表示所有细节彼此同质。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 四维视野同时输入全舰各层级细节，超过两名观察者大脑的处理能力
vehicle: 人被无边海水从四周覆盖，水量远超身体承受范围并阻断正常呼吸与辨向
ground: 介质规模巨大；输入从各方向包围；个体处理能力相对微小；过量导致失控和眩晕
