chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 仿佛一个巫师维持青春的巫术突然失效，三个世纪的太空岁月留下的痕迹一下子全部显现出来
sensory_mapping: 镜面水滴像不老巫师，力场光幕骤灭，三百年锈色和粗糙一齐从金属皮肤下冒出。
context_fact: 内部力场原本抵消电磁力并维持强互作用力材料，失效后表面成为普通黄铜色金属。
image_mechanism: 青春法术把材料态维持解释为持续抗衰，而非一瞬腐蚀；突然老化准确对应潜在时间痕迹释放。
property_alignment: 力场对应驻颜巫术；绝对镜面对应青春外表；三个世纪航行对应被压住年龄；锈色显现对应老态回归。
context_alignment: 水滴此前具有神性，巫术失效以同一超自然语汇解释神器降格，再由物理原理收束。
narrative_function: 让材料失效具有戏剧性时间反转，并把三个世纪重量一次压回水滴表面。
transfer_rule: 长期维持态如驻颜术时，应明确维持力、被压制过程、失效节点和积累痕迹同时显现。
failure_boundary: 锈迹只是外观，材料未经历普通氧化；巫术图景不能替代强相互作用力场机制。
quality_assessment: exemplary
