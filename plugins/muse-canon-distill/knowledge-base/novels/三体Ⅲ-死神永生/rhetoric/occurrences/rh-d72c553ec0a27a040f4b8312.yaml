chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 就像我们看一张纸上画的圆圈，能看到圆圈内部，并没有“透过”什么
sensory_mapping: 密闭舱体缩成纸上一圈墨线，眼光从纸面上方落下，圈内空间自然敞亮，并无穿墙光束。
context_fact: 叙述专门纠正听众把四维视觉误解为透视舰体的说法。
image_mechanism: 纸圈把封闭体降一维，使边界仍然存在却不遮住内部，从几何位置上区分高维观看和透视。
property_alignment: 三维外壳对应圆周线；舱内空间对应圈内纸面；四维视点对应纸面上方；直接可见对应无需穿线。
context_alignment: 飞船巨画已经建立平面意象，圆圈作为局部示意图继续在同一纸面上澄清观察机制。
narrative_function: 消除科幻场景最容易产生的错误图像，让后文固体内部无限展开具有可理解规则。
transfer_rule: 纠正空间直觉时，可降低一维画出边界与内部，重点对应观察位置，而非只宣称能够看穿。
failure_boundary: 三维封闭体的内部结构远比纸圈复杂，四维视觉还受透视与距离限制；图示只解释边界不遮挡。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 四维观察者无需穿透外壳便能直接看见三维封闭体内部
vehicle: 观看纸面圆圈时，边线围住的内部区域和边线本身同处一个可见平面
ground: 边界不造成视觉遮挡；内部与外部并列呈现；观察者位于高于对象的维度；看见不依赖穿透材质
