chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 她知道自己追逐的是一个梦
sensory_mapping: 她来到约定星球仍继续等候，像在清醒宇宙里追一场早该醒来的梦，前方只剩愿望投影。
context_fact: 关一帆说三体第一舰队无消息，蓝星不安全，AA劝她不能把生活全变成等待。
image_mechanism: 梦把爱情目标与现实可达性分开，程心既保持情感真实，也承认约会成功概率近乎虚无。
property_alignment: 云天明约会对应梦景；跨世纪等待对应追逐；无确切消息对应虚幻；明知无望对应清醒做梦；离开蓝星对应停止追逐。
context_alignment: 程心经历的光速时间如梦醒，抵达后期待对象却仍属梦；物理抵达没有消除情感距离。
narrative_function: 让她接受随关一帆离开，同时保留云天明作为精神唯一希望的未决张力。
transfer_rule: 目标比作梦时，应明确愿望强度、现实证据、追逐动作、清醒程度和何种决定使追逐暂停。
failure_boundary: 云天明真实存在且可能曾到过此地，约会并非纯幻想；梦只表示当前不可验证与难以抵达。
