chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 推进器喷出长达几千米的等离子体火流，刺破黑暗的太空
sensory_mapping: 几千米尾焰像炽白长矛从船尾伸出，在黑幕上扎出一道亮裂口。
context_fact: 瓦西里刚下令前进四，试图远离二维平面，船员承受强过载。
image_mechanism: 刺破将推进可见光束武器化，传达逃生力量强大，却也只在视觉上划破黑暗而未移动飞船。
property_alignment: 等离子火流对应长刃；高亮对应刃光；细长尾焰对应刺入；太空黑暗对应被穿材料。
context_alignment: 目光曾像利剑，桅杆也将像长剑；此处真正的推进火剑仍无法切断空间流。
narrative_function: 把逃离动作写到最大功率，同时用后来导航否定制造力量与无效的反差。
transfer_rule: 光流写成刺穿时，应匹配形状、方向、亮暗界面、施力意图和实际效果。
failure_boundary: 黑暗不是实体，火流没有切开真空；刺破只描述光学轮廓。
