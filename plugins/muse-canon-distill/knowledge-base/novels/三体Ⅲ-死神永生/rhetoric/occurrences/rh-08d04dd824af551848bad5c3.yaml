tenor: 启示号全功率推进时细长耀眼的等离子尾焰伸入黑暗真空
vehicle: 明亮尖锐的长矛或利刃以集中尖端穿透一整块黑色材料
ground: 形态细长；亮暗反差强；运动方向明确；尖端向外推进；黑色背景似被分开
