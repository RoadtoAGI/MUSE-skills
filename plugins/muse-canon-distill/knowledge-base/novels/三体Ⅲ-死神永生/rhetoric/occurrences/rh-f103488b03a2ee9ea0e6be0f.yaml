review_status: reviewed
tenor: 冰沙王子表面放下阴沉、表现出真诚善意的情感转变
vehicle: 低温冻结的硬块受热后软化并恢复流动
ground: 原先封闭坚硬；温暖环境作用；外观由冷漠转为柔和；变化看似彻底
