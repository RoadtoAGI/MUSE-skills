chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 在水滴面前，人类世界就像石块下的鸡蛋一般脆弱
sensory_mapping: 光滑水滴化成下压石块，城市群缩成薄壳鸡蛋，压力尚未增加，壳面已经开裂。
context_fact: 五个水滴中的一个已轻易穿过三座城市，人类的SIM材料尚不能批量生产。
image_mechanism: 石蛋接触把技术代差转成材料硬度和受力关系，结果不依赖复杂武器参数便可预见。
property_alignment: 水滴强互作用力外壳对应硬石；普通设施对应蛋壳；直线撞击对应下压；无有效遮蔽对应鸡蛋无处逃离。
context_alignment: 上一句建筑如烂果坠落已经展示脆败结果，此类比随即将个别城市推广到整个人类世界。
narrative_function: 概括占领初期绝对力量差，并解释人类为何被迫接受保留地命令。
transfer_rule: 写材料级力量差时，选择接触关系明确的硬物与脆物，分别对应攻击材质、防御材质和受力方向。
failure_boundary: 人类并非完全被动，SIM研究可能改变硬度关系；石压蛋只适用于当时技术窗口。
