chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 仿佛不是画师在运笔，而是画笔牵着他的手游移
sensory_mapping: 笔杆像活物先迈步，针眼的手腕被它带着拐弯点落，身体只是跟随。
context_fact: 画师用看似随意的动作完成精确魔画，王子因无法看懂控制逻辑而着迷。
image_mechanism: 主客倒置让熟练技巧显得超自然，也为画面拥有夺走真人的主动能力预热。
property_alignment: 熟练自动化对应工具领路；笔迹确定对应画笔有意志；手腕跟随对应被牵引；画师沉默对应让出控制。
context_alignment: 童话中的画像会反向支配现实，工具牵人是同一因果倒置在作画动作上的首现。
narrative_function: 将技艺转成魔性，使针眼既像操作者又像被画技驱使的媒介。
transfer_rule: 工具反客为主时，应给出主动方向、人的被动动作、熟练原因和主题上的控制倒置。
failure_boundary: 画笔没有意识，针眼仍是实际控制者；不能据此免除其谋杀责任。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 针眼作画时高度自动、熟练到身体似乎服从工具的运笔状态
vehicle: 有自主意志的画笔担当领路者，反过来牵引画师的手沿既定路线行进
ground: 动作流畅无需犹豫；工具方向感强；人的显性控制退居次位；过程像由外力驱动
