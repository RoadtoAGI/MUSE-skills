quote: 人家也就是拿他当高智力电池使用而已
sensory_mapping: 大脑蓄能；机构取电；智力放电；孤独电池；耗材插槽
context_fact: 高Way因严重自闭几乎不与人交流，却在这个时代凭智力取得科研成功，并长期承担降低光速理论研究。
image_mechanism: 不可见的智力先变成可储取能源，组织把一个人的思考接入研究机器，只读取输出而跳过他的痛苦；“高”修饰智力也像标注电池规格。
property_alignment: 高Way对应电池；高智力对应高容量；思考劳动对应放电；研究机构对应用电系统；成果对应电能输出；孤僻对应封闭外壳；缺乏关怀对应把人视为可替换耗材
context_alignment: 曹彬对高Way既钦佩又同情，冷硬工程物件符合科学环境，也准确表达机构只承认功能价值的批评。
narrative_function: 在一句口语中交代天才的社会处境，为他把科研失败内化为自我失败建立孤独根源。
transfer_rule: 用电池写被工具化的人才时，应明确其可输出资源、依赖他的系统、持续消耗过程和组织忽视其主体需求的证据。
failure_boundary: 人物拥有决策权、得到充分照护与共同体关系，或工作主要消耗体力而非持续认知产出时，高智力电池会错判权力结构。
