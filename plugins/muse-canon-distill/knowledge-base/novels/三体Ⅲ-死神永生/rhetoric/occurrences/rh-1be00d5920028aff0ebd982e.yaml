tenor: 程心只经历短暂低光速航行，外界却已流逝一千八百九十万年，并成为她无法摆脱的现实背景
vehicle: 体量巨大的同行者或影子紧随一个人脚后，无论她向哪里走都压在身后
ground: 始终伴随主体；位于身后代表已经过去；重量远超个人；无法甩脱；不直接可见却能感到；决定前路意义
