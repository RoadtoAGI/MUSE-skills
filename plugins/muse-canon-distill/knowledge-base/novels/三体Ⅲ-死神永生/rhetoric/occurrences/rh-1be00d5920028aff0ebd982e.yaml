chapter: 【时间开始后约170亿年，我们的星星】
figure_type: metaphor
quote: 一千八百九十万年的岁月跟在她身后
sensory_mapping: 她站在紫色树林里，身后并无脚印队伍，千万年却像一个无边巨影贴着肩背一路跟来。
context_fact: 检测结果显示低光速持续18903729年，程心刚走下舷梯面对改变后的蓝星。
image_mechanism: 让时间从抽象数字取得空间位置和跟随动作，‘身后’既是过去又是压迫性的近身存在。
property_alignment: 已逝年代对应身后位置；持续后果对应跟随；巨大数值对应巨影体量；无法回到旧日对应甩不开追随者；当前景物对应其足迹。
context_alignment: 程心多次靠冬眠跳时，但这次时间不再只是被越过的空白，而像实体追到她身边索取代价。
narrative_function: 在报表数字与痛哭之间建立身体感，让年代成为人物此后一生的同行重负。
transfer_rule: 过去写成跟随者时，应确定空间方位、持续后果、体量关系和主体无法摆脱的证据。
failure_boundary: 岁月不会主动移动，且在她的主观参照系中并未完整经历这段时间；跟随表示后果延续。
quality_assessment: exemplary
