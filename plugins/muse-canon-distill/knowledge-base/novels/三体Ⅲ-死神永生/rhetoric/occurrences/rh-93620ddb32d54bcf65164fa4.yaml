chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 就像田间干活的小伙子看到同村的姑娘从城里回来时一样
sensory_mapping: 云天明从麦田走来，手里还搓着麦穗，抬头挥手如村中青年迎接熟悉姑娘走回田埂。
context_fact: 他身处异世界麦田，穿旧衣吃麦粒，见程心时只自然挥手问好，仿佛时空隔绝不存在。
image_mechanism: 乡村重逢把宇宙事件降至同村日常，麦田现场直接承担村庄布景，亲切感因此无需抽象说明。
property_alignment: 云天明对应田间小伙；程心对应归乡姑娘；三世纪分离对应进城离村；挥手喜悦对应熟人迎接；麦田对应田间。
context_alignment: 整个会面由三体监听且可能致命，云天明却以最普通乡村姿态出现，日常性为两人提供短暂私人空间。
narrative_function: 消除重逢的史诗仪式感，让云天明成熟后的从容首先通过一个生活场景显现。
transfer_rule: 宏大重逢降为乡土日常时，应让现场物件、人物动作、旧关系和分离路径都能嵌入喻体。
failure_boundary: 两人并非同村恋人，云天明也身处外星舰队；类比刻意删除真实时空和政治危险。
quality_assessment: exemplary
