review_status: reviewed
tenor: 云天明跨越三世纪和几光年见到程心时自然、亲切而不带宏大仪式感的喜悦
vehicle: 田间劳动的乡村青年见熟识同村姑娘从城里归来，停下手中活计，以朴素亲近心情迎接
ground: 双方早已熟识；分离后重逢；喜悦自然不造作；环境是田野劳动现场；关系仿佛日常从未断裂
