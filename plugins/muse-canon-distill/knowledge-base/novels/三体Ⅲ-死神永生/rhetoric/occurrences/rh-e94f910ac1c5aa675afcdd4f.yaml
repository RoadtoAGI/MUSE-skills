chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 混沌未开的黑暗
sensory_mapping: 门后先没有田园也没有先后，只有天地未分般的全黑，直到时间和太阳一同被启动。
context_fact: 二人通过宇宙之门进入独立小宇宙，先经历无时间状态，随后太阳逐渐亮起。
image_mechanism: 四字创世母题把技术系统启动抬升为宇宙诞生，黑暗不只是缺光，更是秩序尚未分化。
property_alignment: 小宇宙未启动对应混沌未开；无光对应创世前黑暗；无时间对应秩序未生；太阳亮起对应开天见光；田园显形对应世界分化。
context_alignment: 章节题为‘我们的宇宙’，以创世语言开篇，使微型人工世界获得独立宇宙的仪式重量。
narrative_function: 用极短开场切断蓝星时间线，并为随后小宇宙创世式显影建立基调。
transfer_rule: 新系统启动借创世混沌成像时，应让黑暗、无序、无时间与随后光和结构出现形成完整前后。
failure_boundary: 647号宇宙早已建成并含设备，只是对进入者开始时间；并非真正从物理无中创生。
