chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 如果大山不会走向穆罕默德，穆罕默德可以走向大山
sensory_mapping: 纸条像不动的大山悬在宇宙坐标上，整艘启示号则成为走过去的人，把舱室移到它身边。
context_fact: 抓斗和小艇不能推动纸条，飞船却具精确位置控制，可围绕它调整。
image_mechanism: 谚语把参照系反转压缩成角色互换，宏大飞船围着微小纸条运动的荒诞因此变得简单。
property_alignment: 纸条对应大山；启示号对应穆罕默德；抓取失败对应山不走；移动飞船对应人走向山；进入舱内对应会合。
context_alignment: 后文整个世界只能围着纸条运动，这个轻松典故预演纸条成为局部宇宙中心。
narrative_function: 提供具体实验操作方案，并短暂缓和未知恐惧，为研究者后来轻慢它铺路。
transfer_rule: 不可移动目标问题宜用主动方互换类比，明确相对位置、可动对象、操作资源和新风险。
failure_boundary: 大山是普通静止物，纸条不受本宇宙作用且危险未知；成功会合不代表能够控制。
