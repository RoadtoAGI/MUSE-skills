chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 像从后面的油画中搬出来的一座冰冷的雕像
sensory_mapping: 油画提供年代与背景，雕像提供硬质轮廓和低温触感；活人被两次静物化。
context_fact: 程心初见维德，他专注雪茄烟头，对她只冷淡扫视，面部没有表情。
image_mechanism: 搬出油画解释古典感的来源，雕像再冻结其人性反应；空间位移使他像不属于现代办公室。
property_alignment: 古典脸部线条对应油画人物；面无表情对应雕像固定；情感冷淡对应石材冰冷。
context_alignment: 维德后续以极端手段推进计划，非人化第一印象为其冷酷决策风格建立视觉基线。
narrative_function: 快速定型权力人物的外观、时代错位和情感温度，制造程心的不安。
transfer_rule: 人物静物化时，可让背景艺术类型解释风格，让材质解释表情温度；两级喻体各承担不同属性。
failure_boundary: 若维德表情丰富、动作热烈或长相现代随和，油画雕像的古典冻结都不成立。
quality_assessment: exemplary
