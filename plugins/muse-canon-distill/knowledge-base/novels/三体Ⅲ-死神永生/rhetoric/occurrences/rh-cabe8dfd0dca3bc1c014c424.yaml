chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 程心感觉她整个人就是一个汉字：柔——外形和内涵都像
sensory_mapping: 机器人身体压缩成一个书写字符，和服曲线成为笔画，鞠躬细语成为字义。
context_fact: 智子身材纤小、微笑如春水、缓缓鞠躬，以日本女性形象表演柔美。
image_mechanism: 单字把多种感官特征收束成文化符号，外形和内涵两路同时归一，形成高度压缩判断。
property_alignment: 身体曲线对应字形柔和；轻细声音对应柔的听觉；鞠躬待客对应柔顺语义。
context_alignment: 汉字是中日共享文化符号，适合在东方茶道场景中为三体机器人命名气质。
narrative_function: 用一个字封印初见印象，说明智子的人类文化拟态已经达到形式—意义统一。
transfer_rule: 人物如文字时，应让字形、字义和行为至少两路对应；选字必须来自场景共享文化。
failure_boundary: 若外形柔而行为强硬，或受众不识该字文化联想，形义统一会断裂；这也不证明其真实意图柔和。
