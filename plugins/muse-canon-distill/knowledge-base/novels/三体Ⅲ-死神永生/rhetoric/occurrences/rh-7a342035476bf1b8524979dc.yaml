figure_type: metaphor
quote: 那个人是庞大凶猛的奥斯曼帝国战车的轮轴，那根轴一断，战车将轰然倒地
sensory_mapping: 帝国军队组装成轰鸣战车，苏丹缩为藏在轮心却承担全部载荷的轴，刺杀变成折轴。
context_fact: 多数将领倾向撤兵，围城继续主要依赖苏丹本人；皇帝考虑让狄奥伦娜隔空取其首级。
image_mechanism: 先以轮轴定位个人在组织中的结构作用，再沿折断、倒地推出刺杀的战略后果，完整形成因果机械链。
property_alignment: 苏丹决策核心对应轮轴居中传力；军队与国力对应庞大战车；苏丹死亡对应轴断；奥军败退对应战车倒地。
context_alignment: 皇帝手中能力只能精准杀一人，轮轴模型说明为何单点攻击可能扭转整体战局。
narrative_function: 把复杂政治判断压缩为可操作目标，为刺杀计划提供直观战略逻辑。
transfer_rule: 用机械部件写关键人物时，要先验证组织是否真有单点依赖，再让部件失效后的具体故障对应预期后果。
failure_boundary: 若权力可立即继承、军队有多中心指挥或撤兵意愿并不依赖苏丹，轴断导致整车倒地就过度简化。
