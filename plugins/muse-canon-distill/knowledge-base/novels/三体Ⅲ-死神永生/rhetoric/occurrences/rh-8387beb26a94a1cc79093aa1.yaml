tenor: 恢复普通身高的深水王子面对陌生来客时朴素、温和而宽容的神态
vehicle: 常年临海劳作、衣着粗朴，待人沉稳随和且胸襟开阔的渔民
ground: 海岛生活对应渔民环境；微笑平和对应宽厚性情；粗糙衣着对应劳动者装束；健壮身体对应长期劳作；无王族威仪对应民间朴实
