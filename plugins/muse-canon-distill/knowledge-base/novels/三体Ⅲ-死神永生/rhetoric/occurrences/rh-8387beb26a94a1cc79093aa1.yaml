chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 他看着来人微笑着，像一个宽厚的渔民
sensory_mapping: 海风面容；粗布衣；平和笑纹；结实手臂；岸边渔人
context_fact: 王子被困墓岛二十年，穿帆布粗衣，公主靠近后发现他并非远望时的巨人。
image_mechanism: 远处的孤峰巨人走近后缩成岸边劳动者，王族身份被海风和粗衣磨去，脸上的微笑留下渔民式的朴厚。
property_alignment: 深水王子对应渔民；墓岛对应渔场；粗布衣对应劳作服；健壮体格对应划船捕鱼体力；宽厚微笑对应渔民淳朴；失去宫廷生活对应民间化
context_alignment: 深水在海岛生活多年且性格被写成大海般豁达，渔民形象把前面的海洋人格落到日常人身上。
narrative_function: 消解巨人威压，让兄妹相认先显出亲近和善，再引入身份验证。
transfer_rule: 用宽厚渔民写人物时，应由临海经历、劳动体貌、朴素装束、从容神态和缺少权力距离共同支撑。
failure_boundary: 人物衣饰华贵、举止傲慢，或只因站在海边便称渔民时，职业人格会成为表面标签。
quality_assessment: effective
