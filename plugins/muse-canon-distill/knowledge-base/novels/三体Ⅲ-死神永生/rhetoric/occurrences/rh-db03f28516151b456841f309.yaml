chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 像在疯狂地跳着死亡之舞
sensory_mapping: 太阳一会儿把身体拉成贯穿宇宙的亮线，一会儿蜷回光球，像在时间急流里狂乱伸缩的临终舞者。
context_fact: 穿梭机以低光速环境的近光速绕蓝星运行，每一轮对应外界大量时间。
image_mechanism: 舞蹈给周期像差以身体节律，“死亡”则把每次循环与外部时间耗尽连接，优美运动转成倒计时。
property_alignment: 亮线伸展对应展肢；光球收缩对应蜷身；周期循环对应舞步；高速形变对应疯狂；恒星终局对应死亡主题。
context_alignment: 二维日饵曾作为舞者枯萎，蓝星太阳又跳死亡之舞；天体运动不断被人物化为宇宙谢幕。
narrative_function: 概括舷窗重复景象的恐怖意义，并推动程心收回目光拒绝观看。
transfer_rule: 周期形变比作舞蹈时，应给出具体伸缩动作、节律、驱动参照系和舞蹈所指结局。
failure_boundary: 恒星没有移动身体或死亡意志，形变完全是观察像差；舞蹈只存在于舷窗视野。
quality_assessment: exemplary
