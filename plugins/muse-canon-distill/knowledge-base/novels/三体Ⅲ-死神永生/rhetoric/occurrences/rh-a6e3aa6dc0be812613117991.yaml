chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: 仿佛二维平面是一个透镜，正管窥着从下面飞奔而过的色彩斑斓的巨兽
sensory_mapping: 二维面像贴在巨兽身侧的一片镜孔，色彩斑纹从孔下飞掠，来不及看清便冲出城界。
context_fact: 城内平面只是完整二维太空城的一小部分，大量被展开的建筑结构延伸到原城范围之外。
image_mechanism: 透镜把二维面从承载结果改成观看窗口，巨兽则给海量结构以身体、速度和不可见全貌，解决局部画面的认知困难。
property_alignment: 局部二维区对应透镜口；完整城市对应巨兽；建筑色块对应皮毛斑纹；图形奔流对应巨兽掠过；城外扩展对应身体超出视野。
context_alignment: 人类城市在降维后复杂得无法整体阅读，曾经熟悉的文明躯体变成只可管窥的陌生生命。
narrative_function: 把静态投影规则写出高速生命感，并说明为何眼前只有局部色彩而非可辨城市图。
transfer_rule: 局部投影比作透镜窥兽时，应给出窗口比例、纹理移动、整体尺度和不可辨认原因。
failure_boundary: 二维面不是光学透镜，城市也无兽类生命；管窥只描述局部窗口与复杂纹理的观看关系。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 二维面上由建筑内部结构展开形成、向各方向快速奔流的斑斓复杂图形
vehicle: 观察者透过一块小透镜，只看见一头彩色巨兽身体局部高速掠过
ground: 视野只覆盖整体局部；内部纹理复杂；图案高速横移；对象尺度远大于窗口；无法由局部立刻辨认全貌
