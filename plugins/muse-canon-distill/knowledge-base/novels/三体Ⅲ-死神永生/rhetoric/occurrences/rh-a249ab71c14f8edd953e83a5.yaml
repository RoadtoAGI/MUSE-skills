chapter: 地球文明
figure_type: simile
quote: 有一个黑色的球体在群星间如幽灵般快速移动
sensory_mapping: 卡戎像一团黑魂从群星前滑过，没有纹理和声响，只用遮星轮廓显示存在。
context_fact: 冥王星无大气且光照极弱，卡戎质量大、在近距离天空中视运动明显。
image_mechanism: 幽灵把暗球遮挡星光的负像和无声运动结合，适合地下墓室入口前的死亡氛围。
property_alignment: 黑色无细节对应鬼影；群星背景对应夜间出没；快速轨移对应飘行；真空无声对应幽灵无足音。
context_alignment: 冥王星先像闭眼，其卫星又像幽灵，整个双天体系统被统一塑造成文明墓地。
narrative_function: 让静态低光景观出现移动威胁感，并标明卡戎在冥王星天空中的异常尺度。
transfer_rule: 暗中移动物比作幽灵时，应对齐轮廓缺失、遮光方式、声响、速度与场景气氛。
failure_boundary: 卡戎有巨大质量和确定轨道，绝非无实体；幽灵只描述低光观察。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 冥王星天空中因低光而缺少表面细节、移动迅速的巨大卫星卡戎
vehicle: 黑夜里无声掠过、轮廓模糊且突然改变位置的幽灵
ground: 颜色黑暗；细节不可辨；移动无声；背景为星空；体量虽大却缺实体感
