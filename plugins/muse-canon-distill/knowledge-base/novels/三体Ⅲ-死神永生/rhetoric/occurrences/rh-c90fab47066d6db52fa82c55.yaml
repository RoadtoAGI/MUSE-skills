chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 她的影像叠印在星海上，那双美丽的双眸平静地映着星光，他突然感觉群星都在围着她旋转，她成了宇宙的中心
sensory_mapping: 程心半透明面孔浮在银河上，星光落进双眼，整个星野像转盘围绕她缓慢旋动。
context_fact: 她将独自会见云天明，若无法返回地球得不到信息；参谋长想劝她，却只从舷窗反影观看。
image_mechanism: 透明罩真实叠印人物与星海，视觉构图先制造中心，再由参谋长把任务重要性投射为宇宙绕转。
property_alignment: 程心影像对应中心轴；透明罩星海对应旋转背景；文明信息责任对应全局中心；双眸星光对应聚焦。
context_alignment: 她曾被圣母化为公众中心，此处中心感来自一个具体观察者和危险任务，仍提示他可能再次理想化她。
narrative_function: 在起航前以参谋长视角提升程心形象，并解释他为何压下劝阻、尊重其选择。
transfer_rule: 人物成为宇宙中心时，应先有真实构图支点，再说明观察者注意、任务权重和背景运动如何共同造轴。
failure_boundary: 群星没有真实绕她旋转，地球任务也非宇宙全部；中心是参谋长瞬时主观投射。
quality_assessment: effective
