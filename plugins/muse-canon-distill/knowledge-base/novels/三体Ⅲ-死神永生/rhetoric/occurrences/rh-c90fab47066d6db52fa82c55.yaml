review_status: reviewed
tenor: 参谋长透过透明罩投影看程心时，被她的美、平静和即将独自承担文明风险的地位吸引
vehicle: 宇宙以一位中心人物为轴，所有群星围绕她旋转，光芒汇入她的眼睛
ground: 观察者注意力高度集中；背景运动似乎围绕主体组织；主体承担全局意义；视觉叠印放大中心感
