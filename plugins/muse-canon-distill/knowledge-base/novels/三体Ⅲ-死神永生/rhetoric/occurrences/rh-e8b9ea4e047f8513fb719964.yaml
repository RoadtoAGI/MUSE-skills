chapter: 【威慑纪元62年11月28日16:00至16:17，威慑控制中心】
figure_type: simile
quote: 这沉重像上方的地层，已经累积了四十五千米厚
sensory_mapping: 心中无形负担与头顶真实岩层重合，四十五千米岩石仿佛直接落在胸口，每一层都是未来岁月的压力。
context_fact: 控制中心位于地下四十五千米，程心将独自承担引力波广播决定，安慰也无法减轻心情。
image_mechanism: 现场深度为心理重量提供精确数字，累积则把静态地层改写成责任逐年沉积，空间事实与内心压力严丝合缝。
property_alignment: 使命重大对应岩层重量；责任长期叠加对应地层沉积；无法逃离岗位对应深埋地下；安慰无效对应厚层难移。
context_alignment: 人物正站在地层下方，喻体可被身体定位；四十五千米既是工程防护，也是执剑人心理隔绝的真实厚度。
narrative_function: 把接任压力压到具体尺度，预告程心温和人格将在极端重量下作出关键选择。
transfer_rule: 心理重量借现场物体时，可使用真实厚度、方向和累积过程；数值应强化处境而非仅作夸饰。
failure_boundary: 若人物感到轻松解脱、责任短暂可转交，或场景并无上覆结构，四十五千米重压会违背情境。
