tenor: 大量氮氨雪花遮挡视线，使冥王星地表能见距离缩短、远处二维天体变模糊
vehicle: 一幅密实垂落的白色幕布围住近景，遮断幕后广阔舞台，使可见世界只剩狭小空间
ground: 由密集细点组成；位于观察者与远景之间；遮挡透视；边界似垂落；幕后对象仍隐约可见；缩短视野
