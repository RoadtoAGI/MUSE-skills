chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 密密的飞雪使冥王星的天空变得模糊了，二维太阳和行星在雪幕之后变得朦朦胧胧，雪使世界暂时变得窄小
sensory_mapping: 无云飞雪织成一层白幕，太阳与行星退到幕后，只剩方碑、飞船和几步内的雪地。
context_fact: 短命氮氨大气在二维太阳熄灭后冻结，大雪只持续短暂时间。
image_mechanism: 雪幕将宇宙末日暂时关在视觉之外，能见度收缩也让无家可归的两人产生片刻回家感。
property_alignment: 密雪对应幕布纤维；视线遮挡对应闭幕；二维天体对应幕后景物；近景保留对应台前；世界窄小对应幕内空间。
context_alignment: 二维灾难多次变成舞台艺术，此处自然雪幕短暂落下，像为太阳熄灭后的场景换幕。
narrative_function: 在宏大天体毁灭与人物告别之间制造短暂私密空间，让雪唤回地球触觉。
transfer_rule: 天气写成幕时，应落到遮挡层、前后景、能见距离、持续时段及幕落后人物感受变化。
failure_boundary: 雪没有连续布面或舞台意图，世界物理尺度也未缩小；窄小只指视觉与心理范围。
quality_assessment: effective
