chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 时间仿佛也变成了一潭死水。淹没了他们
sensory_mapping: 死水上涨；两人没顶；声音沉水；时钟停流；震动破面
context_fact: 维德已被判死刑，二人没有可说之言，直到太空城位置维持的震动打断寂静。
image_mechanism: 前一句维德是枯前静潭，此刻静止从人物扩散到时间本身，且由平面变成上涨水体；二人被共同淹没，关系的沉默获得窒息重量。
property_alignment: 时间对应水体；无事件推进对应死水；长久寂静对应不流；两人沉默对应沉水；无可挽回对应无岸；压迫感对应淹没；机械震动对应水面被击破
context_alignment: 这是对上一潭静水的创造性延展：维德生命将干，二人共享的最后时间却反向上涨，将告别凝固成封闭水域。
narrative_function: 把无台词的停顿实体化并拉长，让现实震动成为真正的脱离动作。
transfer_rule: 用死水淹人写停滞时间时，应让场面缺乏事件流动、人物无法改变结局，并设置一个外部动作把他们从凝滞中唤回。
failure_boundary: 对话密集、决策仍快速变化，或人物享受宁静且没有窒息感时，死水淹没会误写节奏与情绪。
quality_assessment: exemplary
