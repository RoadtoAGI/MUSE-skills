chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 接下来却无力地向下转向，离开了泡沫线，如同一颗抛出的石子越过抛物线的顶端一样
sensory_mapping: 石子抛起；弧线顶点；瞬间停滞；轨迹弯下；重复落深
context_fact: 艇员多次全力冲向泡沫线，每次都在越界前滑落，并一次比一次进入更深处。
image_mechanism: 船的复杂流体轨迹被抽成一条清楚抛物线：发动机只够把它送到弧顶，旋涡像重力在那里接管，艇首随即向下画弯。
property_alignment: 小艇对应石子；发动机加速对应初始抛力；接近泡沫线对应上升段；最靠近边界对应轨迹顶点；旋涡吸力对应重力；下滑对应下落段；反复尝试对应多次抛掷
context_alignment: 工程化抛体模型符合试验人员观察轨迹的方式，也准确说明失败发生在越界前的速度耗尽点。
narrative_function: 把逃逸失败的方向变化解释清楚，并显示每次尝试都无法改变必然下坠。
transfer_rule: 用抛物线写上冲失败时，应对应初始动力、减速过程、唯一顶点、外力接管和方向反转。
failure_boundary: 对象突然撞墙反弹、动力持续增大，或轨迹没有平滑顶点时，抛石模型会错写受力。
