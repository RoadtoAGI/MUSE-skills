figure_type: metaphor
quote: 涌动的人群顿时凝固了
sensory_mapping: 刚才还翻涌的人海像液面骤然结成透明硬块，每个伸手和前冲姿势都停在半途。
context_fact: 智子从运输机飞出落到食品垛，人群因认出她而短暂静止。
image_mechanism: 凝固沿用人群流体框架，又用物态突变表现一个身影如何在无接触时瞬间停止万千动作。
property_alignment: 涌动人群对应液体流动；智子现身对应相变触发；集体停步对应凝固；姿势保持对应固体定形。
context_alignment: 智子此前以刀制造过恐惧，她的形象本身已成为足以改变群体状态的温度条件。
narrative_function: 给秩序恢复制造第一次短暂停顿，并让随后重新沸腾显示仅靠名声已不足。
transfer_rule: 群体凝固要先有可见流动，再给出同步停止的触发点和保持姿态。
failure_boundary: 人群只暂停片刻且内部仍有意图，未真正失去活动能力；若只是速度减慢，凝固会过强。
