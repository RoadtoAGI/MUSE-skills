chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 什么东西猛烈地撞击着她的心扉
sensory_mapping: 离别感像重物从内侧撞门，心口的门板震响，先前封住的情感几乎冲出来。
context_fact: 一个多小时的童话会面归零，她与云天明可能永不再见，仍须控制言行等待审核。
image_mechanism: 心扉把心理防线实体化为门，撞击则与前文封死情感出口形成同一容器框架的压力后果。
property_alignment: 心理边界对应门扉；离别情绪对应撞击物；难以承受对应门板震动；克制失守对应门被撞开。
context_alignment: 她此前把情感赶出意识、封住火山出口，此处强力回返显示控制只维持到分别瞬间。
narrative_function: 将长时间平稳聆听骤然转成身体冲击，推动她说出宇宙很大的告别句。
transfer_rule: 情绪冲击写成撞门时，应明确心理边界、冲击来源、动作强度和可能突破的后果。
failure_boundary: 心脏没有门，撞击来源也并非具体物体；不能据此判断生理损伤。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 分别将至引发的强烈情绪突然冲击程心心理承受边界
vehicle: 不明重物反复猛烈撞门，门板和门闩承受即将破开的冲力
ground: 力量来得突然；冲击位置有边界；内部难以承受；存在突破控制的风险
