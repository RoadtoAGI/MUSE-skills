chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 这里像是从未有人类踏足的处女地一般
sensory_mapping: 原着陆点被平坦森林覆盖，旧坐标像落在一块从未被踩过的土地上，眼前没有一处能承接记忆。
context_fact: 坐标核验无误，但附近原有山峰与人类设施均已消失，地层探测尚未开始。
image_mechanism: 处女地用视觉上的无痕与历史上的未进入解释千万年抹除，把时间改造造成的陌生感写成第一次抵达。
property_alignment: 消失的遗迹对应无人痕迹；新森林对应原始覆盖；找不到旧地标对应未开发；旧访客无凭证对应首次踏足者。
context_alignment: 两人带着清晰旧记忆返回同一坐标，处女地意象与他们作为文明遗民的错位身份相合。
narrative_function: 先以表面无痕制造艾AA与云天明消息可能永久失落的悬念。
transfer_rule: 旧址写成处女地时，要同时给出坐标连续、地貌断裂、遗迹缺席和人物旧记忆四项证据。
failure_boundary: 这片土地曾有人类活动，处女只表示现有表面无迹；随后地下文字会证明历史存在。
