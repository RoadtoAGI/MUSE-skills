chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 那真是一个美丽的田园，那个时代，距今有一百多亿年吧，被称为宇宙的田园时代
sensory_mapping: 十维与无限光速构成一片无法用眼睛看见的宇宙田野，现存物理只是战后人对那片故园的数学复原。
context_fact: 新世界物理学试图从当前规律反推战争前宇宙，关一帆强调这种美只能用数学描述。
image_mechanism: 田园与前句废墟组成战前—战后对照，把数学上的高维完备转译为和平、开阔和丰饶的价值感。
property_alignment: 未受损规律对应未遭战火田地；十维空间对应开阔环境；近无限光速对应自由通达；数学和谐对应田园秩序；失落原貌对应故园。
context_alignment: 关一帆是宇宙学家，以数学确认美，却借田园让程心获得情感入口，兼顾专业限制与对话需要。
narrative_function: 为归零者试图重启宇宙赋予可理解的目标，也使宇宙战争具有失乐园悲剧。
transfer_rule: 科学原态比作田园时，应由具体结构完备、通达性和未受侵扰支撑，不只借和平褒义。
failure_boundary: 原初十维宇宙未必适合生命或具人类式宁静，田园美是价值投射和理论想象。
