chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 二维太阳和行星都笼罩在如血的红色中
sensory_mapping: 身后太阳系沉在一团血红光里，行星轮廓都像被末日留下的血色罩住。
context_fact: 星环号高速远离，后方光谱红移；太阳系本身刚完成全体二维化。
image_mechanism: 血色把相对论光谱变化转成伤口证据，使技术红移与母星死亡的情感含义重合。
property_alignment: 红移色泽对应血红；整体笼罩对应血液覆盖；二维太阳系对应伤者遗体；后方位置对应已发生的创伤。
context_alignment: 叶文洁所见太阳血跨四世纪铺展，进入光速前太阳系终于整体被同一血色包住。
narrative_function: 以红蓝对照划开身后的死亡与前方未知，为下一段宇宙碗、宝石和篝火变形蓄势。
transfer_rule: 红色比作血时，应有具体伤亡语境、覆盖对象、色彩来源和与其他方向色彩的结构对照。
failure_boundary: 红光由多普勒效应产生，不含血液；血意属于观察者对已毁太阳系的情感读取。
quality_assessment: effective
