chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 作为城墙和陷阱。有的低光速带规模之大，横穿整个星系旋臂，在恒星密集处，大量的低光速黑洞融为一体。连绵千万光年，那是星际长城
sensory_mapping: 低光速区在旋臂间连成不可见城砖，舰队一旦跨进墙体便像跌入壕沟，永远无法翻回正常光速一侧。
context_fact: 低光速黑洞可融合成千万光年障碍，陷入其中的舰队无法脱离。
image_mechanism: 军事建筑把时空参数变成可规划的地形：光速不再是常数，而成为可筑墙、挖坑的材料。
property_alignment: 低光速带对应城墙；黑洞区域对应陷阱；横穿旋臂对应长城绵延；无法逃出对应墙壕阻隔；防御用途对应护境。
context_alignment: 关一帆以战争工程语言讲规律武器，长城又把宇宙尺度落回人类熟悉的防线传统。
narrative_function: 展示规律武器不仅毁灭目标，还能永久改造战场地形和文明边界。
transfer_rule: 抽象防御系统借城防成像时，应写明边界位置、拦截机制、入侵后果和延伸尺度。
failure_boundary: 低光速带没有实体砖石或固定高度，舰队受困源于传播速度和视界而非机械阻挡。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 高等文明布设横跨星系旋臂的低光速带和黑洞群，用于阻挡或永久困住敌方舰队
vehicle: 围护疆域的高墙、诱敌落入后无法脱身的陷阱，以及绵延漫长边境的长城
ground: 划定边界；阻止通行；形成防御纵深；入内者难以退出；可连片延伸；依托地形布置；保护墙后一方
