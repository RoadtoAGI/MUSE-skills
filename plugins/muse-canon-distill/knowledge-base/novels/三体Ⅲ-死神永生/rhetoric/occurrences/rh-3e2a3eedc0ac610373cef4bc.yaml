chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 它们在天空中的尾迹还十分清晰，像划开的伤口一般
sensory_mapping: 天空皮肤；长条裂口；锐线划过；新鲜伤痕；地面焦黑创面
context_fact: 九架穿梭机的尾焰烧死地面人群后已升空，发射轨迹仍留在灾区上方。
image_mechanism: 飞船不是从天空中消失，而像刀尖向上割开蓝色表面；尾迹成为逃亡者留给城市的一道尚未合拢的伤口。
property_alignment: 天空对应皮肤；穿梭机对应刀锋；尾迹对应切口；强行发射对应划伤；轨迹清晰对应新伤未合；地面惨状对应伤口疼痛；九条尾迹对应多处创伤
context_alignment: 同段战场图像落在地面，本喻体把暴力后果延伸到天空，连接逃走者与被留下的尸体。
narrative_function: 让成功升空不显得胜利，而成为清楚记录伤害的罪证。
transfer_rule: 用伤口写天空尾迹时，应有表面背景、锐利连续线、造成线的高速主体、刚发生的暴力和痕迹未散。
failure_boundary: 尾迹柔散成云、发射无伤亡且为庆典时，伤口会强加创痛与责任。
