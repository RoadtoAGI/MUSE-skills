chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 细看时，这两只巨眼变得像两个年轮，刚刚锯断的大树露出的那种崭新的年轮
sensory_mapping: 两颗行星像刚被宇宙巨锯截断的树干，密密同心纹路还带着新鲜断面的亮泽。
context_fact: 二维化使三维行星内部的大气、地幔、核心和细分结构同时铺展在一个平面上。
image_mechanism: 年轮利用平面剖面与同心结构的高度同构，把降维解释成一次刚完成的锯切，隐含施暴动作。
property_alignment: 行星环层对应年轮；内部暴露对应锯断截面；二维化时刻对应刚刚锯断；精细同心纹对应树龄纹理。
context_alignment: 行星原是漫长宇宙历史形成的天体，如树木以年轮记时；死亡反而将全部历史横截面公开。
narrative_function: 从拟人巨眼切换到物质剖面，帮助读者理解二维化为何能同时看见行星全部内层。
transfer_rule: 剖面比作年轮时，应同时对齐同心层次、突然切开、时间记录和断面新鲜度。
failure_boundary: 行星没有木质和生长年轮，各环层也不按年份形成；相似限于暴露后的平面层纹。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 二维海王星和土星内部由大环区及无数细小同心环构成的剖面
vehicle: 大树刚被锯断后裸露、纹路清晰而新鲜的圆形年轮截面
ground: 同心环密集；层次精细；截面突然暴露；记录内部历史与结构；尺度巨大；仍显新鲜
