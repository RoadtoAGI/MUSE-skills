chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 然后像老鼠一样无声地离去了
sensory_mapping: 贴地鼠影；细碎轻步；暗处窜行；竖耳警觉；无声消失
context_fact: 冰沙召唤针眼去处理返回的深水王子，画师低声受命并悄然离开。
image_mechanism: 画师的成人轮廓缩低贴地，脚步被抹掉，只剩一团警觉影子沿墙滑入暗处；鼠态把他的秘密杀人工具与畏缩人格同时显出。
property_alignment: 针眼对应老鼠；无声脚步对应鼠足轻移；小心敏感对应竖耳警觉；执行暗杀对应暗处觅食；快速离场对应钻入洞隙
context_alignment: 针眼靠不被察觉的绘画杀人，鼠行既符合其技术隐蔽性，也与王宫暗处的生存姿态一致。
narrative_function: 以一个动作固定画师阴怯而危险的形象，并为他稍后异常有声的归来建立反差。
transfer_rule: 用老鼠写隐秘离场时，应具备贴边路线、轻小步态、高警觉、避免注视和迅速没入遮蔽。
failure_boundary: 人物昂首阔步、故意制造声响，或体态笨重无法隐蔽时，鼠行会与动作事实冲突。
quality_assessment: conventional
