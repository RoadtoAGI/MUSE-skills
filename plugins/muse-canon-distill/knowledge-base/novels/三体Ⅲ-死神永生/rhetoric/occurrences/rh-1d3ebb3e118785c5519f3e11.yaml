tenor: 针眼画师领命后收敛声息、低调迅速地离开冰沙的房间
vehicle: 老鼠贴着遮蔽物轻步窜走，身体小而警觉，尽量不发出会暴露自己的声音
ground: 脚步无声对应鼠行轻巧；敏感谨慎对应老鼠警觉；迅速离开对应窜入暗处；避免注意对应隐蔽习性
