chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 在外观上，它是那么纤细无害，像夜空中飘着的一根白羽毛
sensory_mapping: 纸条在星海前只剩一抹白，像鸟翼脱落的轻羽停在无风夜空。
context_fact: 它的强引力波曾让人预想卫星级战舰，近看却只有纸条大小，人员因此放松。
image_mechanism: 白羽把二维薄度和无害感推到极端，正与信号强度形成危险的感官—理性冲突。
property_alignment: 白光对应白羽；无厚度对应羽片薄；太空悬停对应飘浮；微小外观对应轻物；无棱角对应无害。
context_alignment: 羽毛属于旧书信的浪漫意象，使陌生高维武器被误读成人类熟悉的温柔媒介。
narrative_function: 让探测者和读者同时降低警惕，为二维化启动后的灾难反转蓄力。
transfer_rule: 危险物写成轻羽时，应同时呈现支持无害判断的视觉属性与被视觉遮蔽的反证信号。
failure_boundary: 纸条不受接触且可毁灭太阳系，羽毛的柔软、低能量均不成立；比喻正是误判来源。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 方寸大小、无厚度、发白光且静止在太空中的二维纸条
vehicle: 黑夜中轻盈飘浮、细薄洁白并不会伤人的一根羽毛
ground: 颜色洁白；形态纤薄；背景深黑；视觉重量极轻；运动显得缓慢无害
