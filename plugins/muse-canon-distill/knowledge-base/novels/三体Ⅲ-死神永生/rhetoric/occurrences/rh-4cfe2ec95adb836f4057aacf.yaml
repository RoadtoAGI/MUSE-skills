chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这些军人不知道世界已经陷落
sensory_mapping: 警戒线和军礼仍完整，背后的世界却像城墙已破的城池，守兵尚未收到陷落消息。
context_fact: 军人仍承认程心的执剑人权威，不知道广播系统已经不可恢复。
image_mechanism: 陷落把战略事实转成城防状态，保留士兵照常值勤与整体失败之间的认知时差。
property_alignment: 发射系统被毁对应城防破裂；三体掌握主动对应敌军入城；军人无知对应守兵迟获战报。
context_alignment: 眼前景观像战场，世界陷落顺势把喷发遗迹置于一场已经结束的无形战争。
narrative_function: 让程心暂借已经失效的权威通过警戒线，并加深她独自知道末日的孤立。
transfer_rule: 用陷落写系统失败时，应标出防线、失守节点和仍滞后的局部秩序。
failure_boundary: 占领尚未完成，军队与城市仍存在；陷落指战略地位，不表示每片土地已被军事控制。
