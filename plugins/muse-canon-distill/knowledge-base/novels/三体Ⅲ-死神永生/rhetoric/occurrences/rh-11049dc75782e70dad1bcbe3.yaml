chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 把它后而的一部分空间熨平，减小其曲率、那么飞船就会被前方曲率更大的空间拉过去
sensory_mapping: 空间熨平；后方平展；前弧牵船；无焰滑行；布面梯度
context_fact: 云天明用必须以特定石板和熨斗压平的雪浪纸作为曲率驱动含义坐标。
image_mechanism: 薄膜模型进入动作层：飞船不向后喷射物质，而像放在布面上的小物，由后方被熨平造成的形态差持续滑向前弧。
property_alignment: 后方空间对应皱布；曲率降低对应熨平；驱动设备对应熨斗；前方曲率对应绷弧；飞船对应布上物；运动方向对应向未平侧；连续航行对应持续熨动
context_alignment: 现实理论、肥皂船张力差与童话熨纸在此汇合，熨平一词既解释技术，又证明故事线索的精确性。
narrative_function: 把无推进剂的曲率航行转成日常手工动作，完成双层隐喻解码。
transfer_rule: 用熨布解释梯度驱动时，应明确哪一侧被改变、哪一侧保持高值、主体为何向特定方向移动，并承认这只是几何直觉。
failure_boundary: 实际机制依赖前方收缩与后方膨胀的不同配置、没有单侧减曲率，或对象需反作用推进时，单纯熨平会过度简化。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 曲率驱动通过降低飞船后方局部空间曲率，形成前后曲率差并推动飞船向前运动的设想
vehicle: 熨斗把布料后方褶皱压平，前方仍弯曲绷紧的布面产生不均衡牵引，把其上的物体拉向高曲率一侧
ground: 空间曲率对应布面褶皱；驱动装置对应熨斗；后方减曲率对应熨平；前方高曲率对应未熨弯面；飞船移动对应物体被牵；曲率梯度对应张力差
