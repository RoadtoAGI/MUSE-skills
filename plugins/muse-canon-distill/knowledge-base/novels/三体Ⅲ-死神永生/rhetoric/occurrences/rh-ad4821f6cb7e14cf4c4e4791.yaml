chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 某些慈父般的文明对地球进行近距离探测
sensory_mapping: 亿万冷漠猎手之外，极少数文明像父亲俯身查看孩子是否真无恶意，耐心看完地球的细部表演。
context_fact: 通常打击比近距探测便宜，黑暗森林文明不会核查目标；叙述仅退一步假设极少数例外。
image_mechanism: 慈父把反黑暗森林行为具象为亲缘照料，越温和稀有，越突出将安全寄托于这种观察的不现实。
property_alignment: 高级文明对应父亲；地球对应孩子；近距探测对应俯身关注；暂缓打击对应宽容；极少数对应罕见慈爱者。
context_alignment: 叙述使用退一万步的反事实语气，慈父的温情故意与冷酷宇宙相撞，用美好喻体证明方案概率不足。
narrative_function: 封堵近距监视可能挽救自残方案的反驳，说明少数善意无法构成对所有文明的声明。
transfer_rule: 强者如慈父时，应给出额外照料成本、宽容行为、弱者位置及为何这种关系不能普遍假定。
failure_boundary: 外星文明与人类没有亲缘或养育责任，近距探测也可能出于敌意；慈父只是极端乐观假设。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 少数可能愿意耗费成本近距观察地球、在打击前核实其真实安全状态的外星文明
vehicle: 慈爱父亲耐心关注孩子的具体行为，在惩罚前愿意靠近了解并给予信任机会
ground: 观察者相对强大；愿意投入额外关注；不凭单一迹象立即伤害；对弱者带有宽容保护倾向
