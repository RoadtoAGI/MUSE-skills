chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 就像透过云层的太阳，所发出的月亮般的弱光仅能显示出圆盘的形状，只有当它消失时，人们才意识到它是白天所有光亮的来源
sensory_mapping: 程心成为云后暗淡圆盘，日常温暖化为遍布周围的散射光；她离校时校园像骤然入夜。
context_fact: 程心对所有人友善，云天明起初未意识到自己爱她，直到国庆她离校才感到世界黯淡。
image_mechanism: 云层解释爱意为何未被直视，弱光解释关系有限，消失后的暗化则完成来源识别；框架沿在场与缺席两态闭合。
property_alignment: 程心温和影响对应散射日光；交往有限对应云层遮蔽；离校对应太阳消失；环境黯淡对应他失去精神亮度。
context_alignment: 她并未表达爱情，月亮般弱光防止把关系写得过强；对孤僻者而言，微小关注仍能成为全部白昼。
narrative_function: 具体呈现主人公后知后觉的爱，并把程心确立为其内在世界唯一光源。
transfer_rule: 写未察觉的影响时，可用遮蔽光源；光的强度要匹配关系强度，而离场造成的环境差异应成为识别证据。
failure_boundary: 若人物早已明确意识到爱意、双方热烈交往，云层遮蔽不成立；若程心离开后他毫无变化，也不能归为光源。
quality_assessment: exemplary
