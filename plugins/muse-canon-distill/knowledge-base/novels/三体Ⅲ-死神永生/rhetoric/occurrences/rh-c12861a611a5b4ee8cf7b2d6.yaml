review_status: reviewed
tenor: 程心不被云天明自觉察觉却持续照亮其大学生活的存在
vehicle: 被厚云遮住、只露弱光却仍提供全部白昼亮度的太阳
ground: 源头本身不醒目而影响遍及环境；只有源头离开、整体变暗时，其贡献才被反向确认
