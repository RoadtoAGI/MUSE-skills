review_status: reviewed
tenor: 由无重量魔树泡制成的雪白香皂脱手后不下落，而在空气中轻轻悬浮
vehicle: 质量极轻、受微小气流托举便缓慢飘移的白色羽毛
ground: 香皂无重量对应羽毛轻盈；雪白颜色对应白羽；空中漂浮对应羽毛随风；缓慢移动对应低落速；柔和外观对应羽绒质感
