chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 没有重量的雪白香皂就像羽毛似的飘浮在空气中
sensory_mapping: 白色羽片；脱手悬空；微风飘移；缓慢下落；轻盈无声
context_fact: 公主拿出剩余半块赫尔辛根默斯肯香皂，准备把它赠给长帆后离开王国。
image_mechanism: 本应沉甸甸落下的皂块在松手处停住，硬边视觉被白羽的轻软覆盖；它只接受空气最微弱的推力，像一片羽毛等待被接走。
property_alignment: 香皂对应羽毛；雪白对应羽色；无重量对应极轻质量；空气悬浮对应气流托举；缓慢漂移对应羽毛落速；珍贵小物对应可托在掌心
context_alignment: 轻到飘浮的香皂已驯服钢铁般怪鱼，羽毛进一步强化童话中轻物胜重物的规则。
narrative_function: 直观展示香皂的异常物性，并使离别赠物具有轻柔悬停的画面。
transfer_rule: 用羽毛写物体悬浮时，应具备低质量、浅色、受气流影响、缓慢轨迹和无撞击落地。
failure_boundary: 物体高速直线飞行、靠发动机悬停，或体积密实沉重且突然坠落时，羽毛会误写动力和速度。
quality_assessment: functional
