chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 就在海面上被咬成碎片，像融化掉一般
sensory_mapping: 船壳边缘消退；碎屑纷落；轮廓塌软；海面吞没；无暇下沉
context_fact: 外来饕餮鱼在海中巨化并暴增，成群围住船底后啃穿并继续吞食整船。
image_mechanism: 无数鱼嘴把离散咬痕连成连续消退的边界，观者来不及看见船先倾斜下沉，只见巨大固体像受热一样在水面缩没。
property_alignment: 船体对应固体；鱼群啃食对应热量作用；连续缺口对应液化边缘；碎片散入海中对应熔液扩散；形体消失速度对应快速融化
context_alignment: 灾害发生在海面，液化视觉让鱼群的啃咬与水体连成一体，强化海洋本身吞船的感觉。
narrative_function: 把难以逐口描写的群体破坏压缩为连续相变，直观显示饕餮鱼屏障的致命效率。
transfer_rule: 用融化写物体被群体分解时，应有边界连续消退、碎屑快速汇入周围介质、轮廓丧失和过程快于常规倒塌。
failure_boundary: 物体被一次爆炸炸开、保持大块残骸，或只是缓慢腐蚀时，融化会误写破坏的连续性与速度。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 整艘大船被密集饕餮鱼从各处快速啃碎，尚未沉没便在海面失去完整形体
vehicle: 固体受热后边缘连续软化、缩小并化成液体，原有轮廓在原地迅速消失
ground: 船体逐块消失对应固体液化；破坏快于下沉对应快速熔融；完整轮廓坍散对应形状失去；碎片混入海面对应物质融入液体
