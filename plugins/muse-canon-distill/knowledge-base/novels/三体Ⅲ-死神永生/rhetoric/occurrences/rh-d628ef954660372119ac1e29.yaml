chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 像一潭干涸前的静水，再也不泛起一丝波纹
sensory_mapping: 枯潭静面；一纹不起；水位将尽；白室无风；生命停流
context_fact: 维德因星环城事件被判死刑，与程心隔透明屏作最后会面，只留下三支雪茄。
image_mechanism: 曾经推动一切的强硬人物被收束成最后一层静水，死刑不是骤然斩断而是让水量走向零；外表平静因此带有确定的生命倒计时。
property_alignment: 维德生命对应潭水；死刑临近对应干涸；情绪活动对应波纹；沉默对应静面；事业停止对应水流停滞；平静目光对应平滑水面；最后会面对应枯前时刻
context_alignment: 维德此前是不可停的黑色巨轮，如今在程心决定后彻底停止；静水把这种由极动到极静的结局写成生命耗尽。
narrative_function: 用无波状态表现接受死亡后的彻底平静，并为下一处“时间死水”延展场景。
transfer_rule: 用干涸前静水写将死人物时，应同时具备生命资源将尽、外在动作停止、情绪无波和明确不可逆终点。
failure_boundary: 人物仍激烈反抗、死亡结局未定，或平静只是短暂休息且力量可恢复时，枯潭会过早封死人物可能性。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 被判死刑、生命将尽的维德彻底平静，意志和情绪不再对外界作任何反应
vehicle: 一潭即将完全干涸的水在最后时刻停滞无风，水面平直，不再生成任何波纹
ground: 临刑生命对应潭水将干；情绪平静对应水面无波；回应消失对应不再泛纹；内在力量耗尽对应水量枯竭；羁押静默对应无风水潭；死亡将至对应干涸终点
