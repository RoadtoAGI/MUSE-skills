chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 整个太阳系将跌落到二维，也就是说，太阳系将变成一副厚度为零的画
sensory_mapping: 太阳系像立体模型被压进一张宇宙画布，行星和人都摊成可见线面，再无背面深处。
context_fact: 二向箔封装消失后二维空间迅速扩大，逃离需要光速，人类飞船无法达到。
image_mechanism: 画把降维结果从数学维数转成视觉媒介，零厚度、结构展平和可观测残影在同一物件上成立。
property_alignment: 二维太阳系对应画面；天体映射对应图形；零厚度对应画布平面；内部暴露对应剖开展示；毁灭过程对应被画入。
context_alignment: 云天明针眼画师童话正是这一单独隐喻，白Ice至此才识别此前漏读的情报。
narrative_function: 以一句完成末日机制定名，并把抽象打击与全书童话伏笔闭合。
transfer_rule: 降维结果写成画时，应逐项对应厚度、投影规则、内部可见性、范围和生命代价。
failure_boundary: 二维体不是艺术家选择性描绘，画布也有微观厚度；审美观看不能淡化真实死亡。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 太阳、行星、飞船和全部生命失去第三维并按内部结构摊展在二维平面的最终状态
vehicle: 一幅只占面积没有厚度、所有对象以线面和色彩排列的巨大平面画作
ground: 厚度归零；原三维对象转为平面图形；整体仍可观看；内部结构全部显露；画面范围巨大
