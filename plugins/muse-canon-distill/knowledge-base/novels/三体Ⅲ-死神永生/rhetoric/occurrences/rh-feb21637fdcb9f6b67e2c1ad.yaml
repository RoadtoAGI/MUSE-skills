chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 仿佛是柏拉图理想世界中的一个元素，而不是现实中的实体
sensory_mapping: 白圆柱从物质太空抽离到无材质理念空间，表面失去重量、接缝和加工痕迹。
context_fact: 飞船外形与通常模块化巨舰相反，整个船体即规则引力波天线。
image_mechanism: 绘图软件仍属人工生成，柏拉图理型进一步把规则感解释为原型本身降临现实，递进强化不真实。
property_alignment: 完美圆柱对应几何理型；无制造瑕疵对应超越材料；现实中突兀对应理想元素误入实体世界。
context_alignment: 威慑舰既是飞船又是纯信息广播器，理念化外形与其文明符号身份一致。
narrative_function: 把舰体从普通装备提升为抽象威慑图腾，制造庄严疏离。
transfer_rule: 理型喻体只适合规则性达到消除材料偶然的对象，并可接在具体生成喻体之后完成抽象递进。
failure_boundary: 若对象仅仅对称、仍有明显材质缺陷与实用附件，柏拉图元素会过度哲学化；它也不证明真实完美。
