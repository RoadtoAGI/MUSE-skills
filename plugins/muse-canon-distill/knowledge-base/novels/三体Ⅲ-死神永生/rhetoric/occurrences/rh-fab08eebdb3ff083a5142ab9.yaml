tenor: 被宪兵包围、悬在真花之间等待接管的青铜时代号
vehicle: 葬礼花丛中尚未下葬、盛放死者的巨大棺材
ground: 封闭长体被花束环绕；原主人将被带走，载体作为其共同世界即将被埋葬
