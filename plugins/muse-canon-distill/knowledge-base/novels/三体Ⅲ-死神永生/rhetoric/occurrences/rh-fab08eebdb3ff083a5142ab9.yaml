chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 他们的战舰像一口待葬的巨大棺材
sensory_mapping: 战舰外壳变成棺盖，欢迎花束转成葬花，宪兵枪口构成送葬队列。
context_fact: 虚拟欢迎人海消失，返航者被包围逮捕，舰船将交给新部队。
image_mechanism: 花的真实性先被确认，却从欢迎符号改写为葬礼符号；棺材埋葬的是舰员与舰的共同身份。
property_alignment: 巨舰封闭形体对应棺体；花束环绕对应葬花；旧船员被剥离对应待葬死者与棺分离。
context_alignment: 战舰曾是十四年全部世界，此刻虽未摧毁，其作为家的生命已经死亡，待葬比废弃更准确。
narrative_function: 把诱捕现场从凯旋礼变为葬礼，集中表达归航希望的死亡。
transfer_rule: 载体棺材化时，除外形外还须有死亡对象、送葬环境和不可逆身份终结；花束可通过语境转义。
failure_boundary: 若舰员获欢迎继续服役、花束仅庆功且舰体保持家园功能，待葬语义不成立。
