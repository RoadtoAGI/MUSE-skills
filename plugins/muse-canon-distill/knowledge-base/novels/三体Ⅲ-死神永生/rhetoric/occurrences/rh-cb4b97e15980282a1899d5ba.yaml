tenor: 人脑神经化学信号每秒两三米的传递速度，以及以其为模型的低光速计算机
vehicle: 普通人步行时身体每秒前进几米的日常移动速度
ground: 可用相同米每秒量度；速度远低于光和电子通信；肉眼能理解；短距离仍可完成任务；依赖大量并行弥补单路缓慢
