chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 人脑中的化学信号传递更慢，只有每秒两三米，和人走路的速度差不多
sensory_mapping: 神经信号不再像电光闪过，而像一个人在脑内通道里步行，慢慢走到下一个处理节点。
context_fact: 每秒十几千米的当地光速使普通计算机失效，专用神经元计算机模拟动物大脑并行处理。
image_mechanism: 步速给不可见信号一个身体标尺，‘慢’因此可被直觉感受，也解释串行启动为何需数百小时。
property_alignment: 两三米每秒信号对应人步速；神经路径对应步行路线；到达节点对应走到目的地；并行神经元对应多人同时行走。
context_alignment: 关一帆正在向程心解释救命设备，日常步行比理论术语更适合紧急教学。
narrative_function: 让低光速计算机的可行性具象化，同时预告漫长启动等待。
transfer_rule: 微观速度类比日常运动时，应保留共同单位，并继续推导距离、耗时和并行机制。
failure_boundary: 神经信号是电化学传播，不是实体行走；脑网络的速度与效率也不能只由线性步速解释。
