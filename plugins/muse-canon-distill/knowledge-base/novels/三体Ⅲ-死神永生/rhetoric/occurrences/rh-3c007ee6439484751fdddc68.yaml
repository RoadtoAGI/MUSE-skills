chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 唯一的精神支柱
sensory_mapping: 饥饿、战争和专制像屋顶重压下来，只剩一根写着舰队承诺的细柱勉强顶住人心。
context_fact: 文本直接说明第二舰队是支撑每个人和整个社会免于全面崩溃的唯一东西。
image_mechanism: 柱子把集体信念的维持作用改写成受力关系，并突出单点依赖的危险。
property_alignment: 社会绝望对应上方重压；舰队信念对应承重柱；其他希望消失对应只剩一根；承诺破产对应柱断屋塌。
context_alignment: 人类先失去战略支点，现在以敌舰承诺充当心理支柱，两个支撑物的替换显示主权到依赖的坠落。
narrative_function: 量化集体心理脆弱度，为三体不兑现承诺时的全面崩溃作结构伏笔。
transfer_rule: 信念如支柱时，应明确承载物、压力来源、替代支撑和断裂后果。
failure_boundary: 社会仍有家庭、宗教和抵抗组织等其他支撑，唯一是总体叙述的强调整体，不适用于每个人。
