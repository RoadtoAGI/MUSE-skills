chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 人类这个文明的婴儿被丢弃在阴森恐怖的黑暗森林中，他大哭起来，只想抓住妈妈的手
sensory_mapping: 蓝色地球缩成森林地面哭泣的婴儿，死神镰刀在树影间闪动，程心的手被想象成唯一可抓住的温暖。
context_fact: 公众长期依赖高福利照管，三体毁灭后确认太阳系随时受击，又重新把程心塑造成圣母。
image_mechanism: 婴儿模型把政治依赖转成发展阶段，外部威胁越冷酷，抓母手的退行冲动越强，崇拜由此获得心理机制。
property_alignment: 人类文明对应婴儿；冷酷宇宙对应黑森林；毁灭打击对应林中威胁；程心母爱形象对应妈妈；崇拜对应抓手哭求。
context_alignment: 此前威慑摇篮让成人变孩子，此处孩子进一步退成婴儿，社会在安全丧失时的心理逆生长形成连续意象。
narrative_function: 解释程心形象翻案并非道德重审，而是公众在恐惧中寻找母性依附对象。
transfer_rule: 群体如弃婴时，应交代自保能力、危险环境、照料缺失、依附动作和被投射为父母的人。
failure_boundary: 人类仍有技术、制度和行动能力，不是真实无助婴儿；模型带有对公众依赖性的批判。
quality_assessment: exemplary
