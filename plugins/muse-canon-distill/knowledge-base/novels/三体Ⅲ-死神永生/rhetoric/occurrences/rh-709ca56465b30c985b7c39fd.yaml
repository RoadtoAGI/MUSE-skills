tenor: 失去安全照管、暴露于宇宙毁灭风险的人类文明，对程心投射母爱和保护需求
vehicle: 尚无自保能力的婴儿被独自遗弃在危险黑森林，因恐惧哭喊并本能寻找母亲的手
