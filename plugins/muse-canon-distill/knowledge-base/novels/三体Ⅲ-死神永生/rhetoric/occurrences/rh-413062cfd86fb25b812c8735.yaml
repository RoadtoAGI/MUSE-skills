chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 太空中有一双大眼睛在盯着她们。那是两个发光的椭圆形，其结构像极了眼睛，都有白色或淡黄色的眼白和深色的眼球
sensory_mapping: 两个行星圆面在黑空睁成巨眼，浅色环层像眼白，深核像瞳孔，冷冷俯视冥王星。
context_fact: 海王星和土星已经跌入二维平面，斜视圆面使它们从冥王星看去呈椭圆。
image_mechanism: 先宣告被凝视，再用眼白和眼球反证形状，把无生命的灾变结果变成有主体的天空凝视。
property_alignment: 两颗行星对应双眼；浅色地幔大气对应眼白；深色行星核对应瞳孔；椭圆视角对应眼裂；悬空对应俯视。
context_alignment: 程心和AA从人类墓室出来，首先遇到的是被压平行星的目光，仿佛太阳系死亡已经睁眼见证她们。
narrative_function: 以惊悚视觉揭示二维化已到外行星，并给随后复杂环层结构一个即时可辨的整体形象。
transfer_rule: 将圆形天体写成眼睛时，应先建立成对、层色、中心、视角和凝视对象，再让物理解释接住幻觉。
failure_boundary: 行星没有视觉或意志，椭圆来自观察角度；“盯着”只表达构图压迫，不表示攻击指向两人。
