chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: 所有的责任和负担都已卸下，所有的担忧和焦虑都已消散，人生回到了从母腹出生时最单纯的状态
sensory_mapping: 末日像替她摘下肩上所有包袱，焦虑雾散后，七百年人生缩回初生婴儿只需呼吸和等待的空白。
context_fact: 冥王星上她只需等待二维化；得知光速路线曾存在后，责任与选择重新出现。
image_mechanism: 卸重、消散和返母腹三种动作共同把死亡前轻松解释为责任结构清零，而非真正获得幸福。
property_alignment: 责任对应负重；放弃未来对应卸载；焦虑对应雾气；末日确定对应无需选择；单纯状态对应初生；等待对应婴儿被动。
context_alignment: 文明尽头曾退回婴儿时代，程心在物种末日也心理退回出生时；个人与文明生命周期再次同构。
narrative_function: 分析程心此前平静的来源，为“一切反过来”后无穷责任引力形成最大落差。
transfer_rule: 责任解除写成卸重和返婴时，应说明谁撤掉未来选择、轻松的代价及责任如何可能重新加载。
failure_boundary: 程心没有遗忘人格或真实回到婴儿，责任也未客观消失；这只是末日确定造成的主观暂停。
quality_assessment: exemplary
