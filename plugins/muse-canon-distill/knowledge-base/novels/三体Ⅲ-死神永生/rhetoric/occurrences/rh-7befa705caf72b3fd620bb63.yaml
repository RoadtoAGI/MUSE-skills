chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 船下的水墙表面更加致密平滑，固体感也更强，如结冰一般
sensory_mapping: 透明冰坡；冷硬表面；平滑反光；冻结水墙；船沿冰滑
context_fact: 旋涡转速向下增加，小艇下滑后离心力增强，水墙的固体外观比上缘更明显。
image_mechanism: 随着船下降，流动水墙仿佛从表皮向内冻结，细碎水纹逐渐封进透明硬面；速度越快，视觉反而越像静止冰层。
property_alignment: 旋转水墙对应结冰水体；致密结构对应冰晶紧实；光滑表面对应冰面；稳定坡形对应冻结定型；增强离心力对应冻结加深；船滑行对应冰坡滑动
context_alignment: 前一段只说‘固体一般’，此处转速增加带来‘结冰’的新相变映射，属于同场景递进而非纯复指。
narrative_function: 强化越深入旋涡越反常的材质感，并衬托涡底仍在疯狂流动。
transfer_rule: 用结冰写高速液面硬化感时，应呈现由松到密的递进、透明平滑、固定坡形和滑行触感。
failure_boundary: 液体浑浊起泡、表面破碎飞溅，或温度和叙事重点明确要求真实冻结时，应区分视觉比拟与物态事实。
quality_assessment: effective
