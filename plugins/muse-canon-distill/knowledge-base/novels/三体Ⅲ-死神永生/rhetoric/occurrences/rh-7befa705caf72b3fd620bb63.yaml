review_status: reviewed
tenor: 越靠近高速涡底，离心力使船下水面愈加紧密、光滑和稳定，呈现强烈硬面感
vehicle: 液态水冻结成连续冰层，表面坚实平滑并保持固定形状
ground: 水面致密对应冰体紧实；平滑反光对应冰面；固体感增强对应液固相变；形状稳定对应冰层定型；艇贴行对应物体沿冰面滑动
