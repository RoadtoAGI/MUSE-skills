review_status: reviewed
tenor: 程心以非人俯视角看移民区后，晴朗景色被恐惧改变的主观感受
vehicle: 寒冷阴雨天气覆盖光线，使环境潮湿、灰暗并带来不祥压迫
ground: 客观亮度仍在而情绪温度下降；景物失去温暖安全感；观察者预感危险临近
