chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 澳大利亚明媚的阳光也带上了冷雨的阴森
sensory_mapping: 正午阳光没有变暗，却像夹进冰冷雨丝，照在密集房顶上的亮色转成湿冷灰意。
context_fact: 程心突然觉得自己在世界之外俯看蚁窝般人群，随即产生莫名恐惧。
image_mechanism: 把视觉阳光与触觉冷雨叠在同一时刻，显示改变来自观看框架而非天气。
property_alignment: 明媚现实对应仍有阳光；心理恐惧对应冷雨温度；灾难预感对应阴森气氛。
context_alignment: 数十亿人被困在热沙漠，反常冷雨来自文明即将失控的内在气候，贴合外热内冷。
narrative_function: 让蚁窝视角留下持续情绪后果，并预告半年内社会灾难。
transfer_rule: 用反常天气写主观变色时，应保留客观天气作底，再让温度或湿度承载情绪偏移。
failure_boundary: 现场没有下雨降温；若叙事转为客观气象说明，冷雨会造成事实误读。
quality_assessment: effective
