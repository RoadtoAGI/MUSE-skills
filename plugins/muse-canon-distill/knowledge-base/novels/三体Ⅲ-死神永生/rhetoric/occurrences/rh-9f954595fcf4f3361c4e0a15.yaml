figure_type: metaphor
quote: 灼热的怒火和冰冷的杀气喷涌而出，凝聚了大洋洲雷电和飓风的力量
sensory_mapping: 圆睁双眼像风暴眼，怒火向外喷红热流，杀气凝成冷锋，雷声和旋风随跺脚压满房间。
context_fact: 老人涂脸持矛表演毛利战舞，每次怒吼和跺脚都使窗玻璃嗡响。
image_mechanism: 火、冷和风暴把文化仪式中的威慑拆成温度、声音与动力，使八旬身体获得大陆级攻击尺度。
property_alignment: 怒意对应灼热火流；杀意对应冰冷锋面；怒吼对应雷电；跺脚和动作对应飓风冲击。
context_alignment: 大洋洲雷电和飓风来自表演所属土地，把力量归回文化环境而非泛化为超能力。
narrative_function: 证明温和老人仍保存战士传统，并把程心未能直视敌人的缺陷转成可见反例。
transfer_rule: 气势写成风暴时，应分别分配温度、声响、运动和环境反应，并让地域来源贴合人物。
failure_boundary: 老人没有实际自然力量，冷热也可相互矛盾；此处依赖多感官表演，静态肖像中使用会显堆叠。
