chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 熔岩碎屑在星空的背景前飘浮着，在阳光中像一片懒洋洋的灰尘，程心感觉心中的什么东西正松弛下来，自己也变得像一粒浮尘了
sensory_mapping: 阳光尘带；一粒浮尘；缓慢旋转；无重量；紧绷松开
context_fact: 氢弹试验结束、维德离开后，熔石残屑冷却飘向地球，程心独自面对是否交出公司。
image_mechanism: 巨石灾变冷却成无害尘带，程心的身体尺度也随之缩小；心中绷紧部分像尘粒脱离表面，不再抵抗任何方向，只悬在光中。
property_alignment: 熔岩碎屑对应灰尘群；程心对应单粒尘埃；太空失重对应空气悬浮；缓慢飘移对应情绪松弛；阳光照尘对应自我显形；宇宙背景对应巨大房间；决策疲惫对应无主动方向
context_alignment: 上一刻维德是高能核燃料，程心此刻缩成浮尘，能量与尺度反差表现两种人格力量。
narrative_function: 在强冲突后降速，并呈现程心倾向退让、交出公司控制权的心理状态。
transfer_rule: 用浮尘写自我松弛时，应有失重或光束景物触发、尺度缩小、张力解除、方向被动和群体中的单粒身份。
failure_boundary: 人物情绪激昂、行动目标坚定，或环境碎屑高速危险时，懒洋洋浮尘会错写动势。
quality_assessment: exemplary
