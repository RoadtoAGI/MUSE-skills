tenor: 地下长明灯背后维持十万年发光的供电系统
vehicle: 占据大片空间、设备繁多、专门生产电力的一整座发电厂
ground: 规模巨大；专职供能；藏有复杂设备；与终端灯具尺寸悬殊；强调持续可靠
