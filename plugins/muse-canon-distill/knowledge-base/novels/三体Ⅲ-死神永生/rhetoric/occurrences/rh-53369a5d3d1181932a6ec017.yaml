chapter: 地球文明
figure_type: simile
quote: 后面专门为这些灯供电的部分就更大了，像一座发电厂
sensory_mapping: 石壁里那一点昏黄微光背后，仿佛塞着整座轰鸣却看不见的电厂。
context_fact: 每盏灯亮度只略强于烛光，却必须在无人维护的条件下连续工作十万年。
image_mechanism: 发电厂把不可见的后台规模骤然放大，让一线微光与支撑它的巨型系统形成荒诞比例。
property_alignment: 供电部件对应电厂；巨大体积对应厂区；单一供能职责对应发电功能；微光对应末端负载。
context_alignment: 保存文明信息同样以庞大现代技术追逐寿命，最终仍只得到石刻和烛光级成果。
narrative_function: 继续累积地质纪年工程的笨重代价，使文明能力在时间面前显得渺小。
transfer_rule: 后台系统比作基础设施时，应量出后台与前台的尺度差，并说明这种失衡由何种极端指标造成。
failure_boundary: 供电部分未必具备厂房、涡轮或电网；发电厂仅表示规模和专职供能关系。
