chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 夜空被焰火装点成流光溢彩的花园
sensory_mapping: 焰火在黑空中一簇簇开花，火线成枝，余烬成落瓣，穹顶被种成发光园圃。
context_fact: 国王六十寿辰与宣布露珠继位同夜举行，庆典以焰火、灯火和美酒营造极盛欢乐。
image_mechanism: 爆裂焰火与花朵开放共享从中心向外展开的动态，黑夜则提供花园土壤般的底色。
property_alignment: 焰火绽放对应花开；火星簇群对应花丛；多色光芒对应花色；夜空范围对应园圃。
context_alignment: 花园式美景包裹王室最危险的继承决定，灿烂表面与即将发生的暗杀形成反衬。
narrative_function: 把庆典亮度推至童话峰值，为随后黎明前黑夜的骤降建立色彩落差。
transfer_rule: 焰火写成花园时，应对齐开放动作、簇群布局、颜色层次和黑色背景。
failure_boundary: 焰火没有生命也无法停驻，花园的香气与可触性不能转移；比喻只覆盖视觉构图。
