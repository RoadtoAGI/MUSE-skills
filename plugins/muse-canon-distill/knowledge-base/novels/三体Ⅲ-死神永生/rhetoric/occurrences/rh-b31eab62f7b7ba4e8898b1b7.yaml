chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 像一根根大香蕉
sensory_mapping: 船桅和舱面都隐进夜里，只剩一排弯长黑白外形，像巨大的香蕉搁在路旁。
context_fact: 公主从未见过船在陆地搁浅，需靠近火把后才认出这些物体。
image_mechanism: 熟悉果形为陌生船体提供第一轮廓假说，童稚尺度错置保存公主无经验视角。
property_alignment: 船身弧线对应香蕉弯度；成排搁浅对应一根根摆放；夜色失细节对应光滑果形；船头船尾对应两端收尖。
context_alignment: 王宫曾缩成积木，船又缩成水果，公主不断用童年物件理解广阔外界。
narrative_function: 延迟船只揭晓并以轻巧形象缓冲即将出现的饕餮海恐怖。
transfer_rule: 陌生物先比作熟悉物时，应抓轮廓、排列、光照造成的信息缺失和观察者经验。
failure_boundary: 船远大于香蕉且材质结构不同，靠近后比较立即失效；只服务夜间远观。
