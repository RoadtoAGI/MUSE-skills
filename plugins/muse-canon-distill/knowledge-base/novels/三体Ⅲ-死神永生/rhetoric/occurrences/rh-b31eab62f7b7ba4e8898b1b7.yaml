tenor: 夜色中成排搁浅、仅显弯长轮廓的船体
vehicle: 多根体形粗长、两端收窄并略弯的大香蕉
ground: 轮廓长而弯；成列出现；表面细节在暗中消失；大小相近；横卧地面
