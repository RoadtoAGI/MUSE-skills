chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 零件继续在空中旋转着，仿佛被附于其上的灵魂所驱动
sensory_mapping: 金属骨片在两人之间自行转动，冷光一闪一闪，像舰员魂魄仍在内部拨动它。
context_fact: 附近漂行着两千战舰和上百万人的遗骸，牺牲者血迹早已升华消散。
image_mechanism: 惯性运动被转义为死者意志，附魂使无形历史重新在小物体上获得可见动作。
property_alignment: 持续自转对应魂力驱动；古零件对应附魂遗物；看不见动力对应灵魂无形；星光闪动对应存在信号。
context_alignment: 白Ice知道运动物理原因仍感到寒意，理性解释与古战场哀悼在同一画面并存。
narrative_function: 把末日战役百万死者召回当前任务现场，为人类再次接触未知物增加历史阴影。
transfer_rule: 遗物自行运动写成附魂时，应提供死者关联、真实运动条件、不可见动力和观察者情绪。
failure_boundary: 旋转由失重惯性产生，没有灵魂证据；喻体表达纪念和不安，不能作超自然判断。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 被松手后因惯性在失重环境中持续自转的末日战舰零件
vehicle: 死者灵魂依附遗物内部，主动驱动它持续运动以显示仍未离去
ground: 物体脱离人手仍运动；运动来源肉眼不可见；遗物与死者相关；持续旋转显得有意志
