chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 这个时代的太空穿梭机相当于公元世纪的飞机，在短时间内只能运载一小部分人
sensory_mapping: 客运航班；有限座舱；机场排队；起飞班次；巨量候乘者
context_fact: 一千多万人涌向发射港，而一周内全部太空交通也只能把不到百分之一人口送入近地轨道。
image_mechanism: 看似先进的太空船被放回公共交通尺度，它们只是把机场航线向上延伸；当全城同时要登机，日常班次立刻显出杯水车薪。
property_alignment: 太空穿梭机对应民航飞机；发射港对应机场；轨道航线对应空中航线；乘员座位对应客舱；发射调度对应航班时刻；危机人群对应大规模滞留旅客
context_alignment: 前文已以机场解释发射港，此处进一步用飞机运力校准‘每城都有港口’并不等于全民可逃。
narrative_function: 量化逃生资源稀缺，为发射港暴乱和生存权不平等提供结构原因。
transfer_rule: 用民航解释太空客运时，应对应载具、站场、班次、座位、航线和总人口吞吐之间的比例。
failure_boundary: 穿梭机可瞬时无限复制、每艘载客百万，或危机人口很少时，民航运力参照会低估能力。
quality_assessment: effective
