review_status: reviewed
tenor: 未来穿梭机是常规近地轨道客运工具，但其总运力面对全球人口仍极有限
vehicle: 公元时代民航飞机承担日常远程运输，每班与机队容量相对社会总人口都很小
ground: 穿梭机对应飞机；近地航程对应航空航线；发射港对应机场；座位容量对应客机载客量；全球撤离对应用民航疏散全人类；短时运力不足对应航班吞吐限制
