quote: 执剑人就成为像面壁者一样拥有巨大权力的独裁者
sensory_mapping: 发射开关与面壁印章叠在同一人手中，机构议案都必须经过这道单人关口。
context_fact: 人类发现任何政策无执剑人认可都对三体无效，制度不得不赋予其独裁地位。
image_mechanism: 面壁者是危机史已有权力原型，类比用制度功能而非人物性格说明新职位为何重现独裁。
property_alignment: 执剑人终极按钮对应面壁者战略授权；政策否决力对应摆脱常规制衡；个人意志对敌对应秘密核心。
context_alignment: 人类曾认为面壁传奇结束，执剑人却由威慑逻辑重新生成同类权力，形成历史回环。
narrative_function: 解释职位政治性质，并连接面壁计划与威慑纪元制度演化。
transfer_rule: 职位类比应比较权力来源、监督结构和决策尺度；名称或个人魅力相似不足。
failure_boundary: 若执剑人只执行集体命令、可随时罢免或无政策否决权，就不等同面壁式独裁。
