chapter: 【掩体纪元67年，“星环”号】
figure_type: metaphor
quote: 自己在时间之外逃避生活，看着别人在转瞬间老去
sensory_mapping: 时间界外；冬眠藏身；岁月流过；他人骤老；旁观者停驻
context_fact: 曹彬已白发苍苍，毕云峰去世，而程心主观只经过一次短睡；她因此决定以后不再冬眠。
image_mechanism: 冬眠不再只是时间门捷径，而成为对共同生活场域的退出：她停在边界外，别人却在眼前被五十六年快速冲刷；空间豁免转为伦理逃避。
property_alignment: 时间对应有内外边界的流域；清醒人生对应处于内部；冬眠对应退到界外；身体冻结对应免受流动；五十六年对应掠过的水程；曹彬变老对应被岁月推进；程心旁观对应岸外观看；愧疚对应逃避责任
context_alignment: 前文时空门强调冬眠者的便捷体验，此句从留下者角度重估同一机制，把技术奇迹改写为程心的道德债务。
narrative_function: 触发她最后一次冬眠的誓言，使人物停止用时间跳跃规避生活后果。
transfer_rule: 用时间之外写冬眠或停滞时，应对照仍在时间中生活的人，呈现年龄差、缺席经历、旁观位置和由此产生的伦理感受。
failure_boundary: 所有相关人物都同步停滞、冬眠者仍完整参与事件，或时间跳跃没有造成关系与责任损失时，逃到时间之外会强加愧疚。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心借冬眠跳过五十六年，身体几乎不老，也免于亲历这段生活，而清醒的人正常度过一生并迅速衰老
vehicle: 人从时间流动覆盖的世界退到边界之外躲藏，旁观留在其中的人被水流或进程迅速带向老年
ground: 正常生活对应时间内部；冬眠对应退出时间；不衰老对应不受流动；逃避经历对应躲在边外；他人衰老对应被时间带走；苏醒观察对应岸外旁观；愧疚对应逃避者自觉
