chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 仿佛她说话时别的声音都停下来，为她的细语让路
sensory_mapping: 客厅声场变成道路，杂音侧身停靠，智子的细语沿中央空道缓慢前行。
context_fact: 她声音刚能听清，却有强烈吸引力，程心已被其柔美形象迷住。
image_mechanism: 让路把低音量与高支配力的矛盾转成礼仪秩序；不是她压过噪声，而是噪声臣服。
property_alignment: 细语通过对应行者前行；环境安静对应他声停步；注意聚焦对应道路让出。
context_alignment: 智子以礼仪柔顺行使控制，声音同样不靠强音而让环境自我收束，符合角色表演。
narrative_function: 强化柔弱表面下的场域控制力，使会面气氛被智子完全掌握。
transfer_rule: 弱声支配可借让路写，但需有听者注意被独占、背景声主观退隐的证据；非物理静音应标为感知效果。
failure_boundary: 环境持续嘈杂、听者听不清或细语需重复时，让路的无阻通道不存在。
