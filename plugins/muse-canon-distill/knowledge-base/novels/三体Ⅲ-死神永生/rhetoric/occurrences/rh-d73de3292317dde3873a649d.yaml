tenor: 智子极轻细却能夺取全部听觉注意的声音
vehicle: 其他声音像行人主动停步退到两侧，让一条道路供她细语通过
ground: 弱小信号并未被环境淹没，反而使竞争声源退出；注意力通道被独占并清空
