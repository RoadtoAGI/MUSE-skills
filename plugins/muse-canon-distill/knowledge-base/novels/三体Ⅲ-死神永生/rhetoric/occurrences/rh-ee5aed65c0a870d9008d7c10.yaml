chapter: 地球文明
figure_type: analogy
quote: 洞壁上刻下的所有人类经典，其命运大概都与最前面那些远古的象形和楔形文字一样，没“人”能懂
sensory_mapping: 长长洞壁上的经典仍清晰排列，却像最前端那些沉默符号，只剩刻痕面对陌生眼睛。
context_fact: 墓室没有罗塞塔石碑式辅助译解系统，连程心都不认识大篆和部分古文字。
image_mechanism: 将未来问题用洞壁开端的当下实例预演：读不懂的远古文字成为所有现代经典的时间镜像。
property_alignment: 未来经典对应远古刻文；外星发现者对应现代观看者；文明消亡对应语言共同体消失；未解码对应没“人”能懂。
context_alignment: 洞壁按历史次序排字，空间上的最前端同时展示时间尽头，博物馆由传播装置变成自建墓碑。
narrative_function: 击破石刻等于保存文明的幻想，区分保存载体与保存意义。
transfer_rule: 用已发生的失读推演未来失读时，应对齐载体、读者、解码条件与物质留存和意义留存之差。
failure_boundary: 未来文明仍可能破译部分内容，象形文字也并非全部不可解；类比表达高概率命运而非逻辑必然。
