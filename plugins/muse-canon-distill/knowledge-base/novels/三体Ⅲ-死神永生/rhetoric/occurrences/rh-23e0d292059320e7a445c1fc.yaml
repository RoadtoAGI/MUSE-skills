chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: metaphor
quote: 最后，这35亿年风雨兼程的行进在一个小小的人类个体面前停下了
sensory_mapping: 分子链、古生物、恐龙和人类排成长队穿过年代风雨，队伍抵达地下后在程心与红色开关前全部停步。
context_fact: 水滴只剩数分钟抵达，程心意识到广播会暴露地球坐标，让全部生命最终消失。
image_mechanism: 行进把演化方向与持续性可视化，小小个体和三十五亿年队伍形成尺度反差，集中表现决断权的荒谬重量。
property_alignment: 生命演化对应长途行进；灭绝与灾变对应风雨；物种更替对应队伍接力；程心按键权对应拦路点；进程终止对应停步。
context_alignment: 上一段时间沉积是垂直重量，此处转为水平行进，把同一历史同时变成压在她上方与走到她面前的存在。
narrative_function: 将宏观进化史收束到一个人的手，使程心无法把广播理解为抽象战略操作。
transfer_rule: 历史如远行时，应明确起点、接力者、阻碍和停步条件；尺度反差要落到真实决策权限。
failure_boundary: 演化没有预设终点或统一方向，风雨兼程带有目的论；不按键也不能保证生命继续安全前进。
