tenor: 地球生命从自复制分子经漫长演化抵达人类文明，而是否继续存在取决于程心是否按键
vehicle: 一支历经三十五亿年风雨、从未停步的远行队伍，最终在一个微小拦路者面前驻足
ground: 过程跨越极长时间并克服无数灾变；当前单点决定可让全部累积前进突然中止
