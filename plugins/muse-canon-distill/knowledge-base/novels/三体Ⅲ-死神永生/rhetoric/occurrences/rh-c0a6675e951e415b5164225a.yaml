chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 那个区域像附着在蛛网上的一颗露珠
sensory_mapping: 错综管道化作银灰蛛网，一颗透明水珠粘在交点，管线穿过珠体时柔软地弯折。
context_fact: 从四维看，翘曲点不再隐形，其球形区域中的管道因折射显得弯曲且形状不连续。
image_mechanism: 露珠同时提供球形轮廓、透明材质和透镜效应，蛛网则把飞船管道组织成可附着的纤细背景。
property_alignment: 球形区域对应露珠；管道网络对应蛛网；光线折射对应珠中线条弯曲；局部附着对应小泡嵌入飞船。
context_alignment: 人物刚把入口叫无形泡，进入四维后泡获得露珠外观，视角变化通过同一水滴尺度的显形完成。
narrative_function: 把定位翘曲点的光学规则凝成一幅静物图，为安全返回提供可记忆的视觉标志。
transfer_rule: 透明球体如露珠时，应同时利用轮廓、背景线网、折射变化和相对尺度，形成完整光学对应。
failure_boundary: 翘曲点不是液体，也不靠表面张力附着管道；若背景没有交错线条，蛛网部分会失去现场依据。
