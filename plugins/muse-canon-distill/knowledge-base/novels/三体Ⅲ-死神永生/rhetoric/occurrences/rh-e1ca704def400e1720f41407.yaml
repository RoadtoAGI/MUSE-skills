chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 与广阔的二维建筑相比则十分微小，像这张巨画中无数刚能看出人形的小符号
sensory_mapping: 成千上万具展开人体落进城市巨画，只剩一个个勉强可辨四肢的小字形。
context_fact: 二维人体本身面积很大，但建筑的所有内部结构也展开，使整座城市画面扩大到更巨大尺度。
image_mechanism: 符号完成第二次尺度缩减：身体虽被放大展开，在文明总体图纸中仍只占一个微小标记。
property_alignment: 二维人体对应人形符号；二维城市对应巨画；远距观看对应只见轮廓；数量密集对应重复标记；静止对应图符固定。
context_alignment: 政府希望二维图像保存人类文化，真实的人也确实被保存成符号，却失去生命和可读个体性。
narrative_function: 揭示原子级信息完整与叙事上个体消失的矛盾，为“图纸”概念加入伦理尺度。
transfer_rule: 个体比作巨图符号时，应同时说明绝对尺寸、相对比例、可辨信息和被更大结构吞没的程度。
failure_boundary: 二维人体仍含原子级细节，并非抽象简笔符号；微小只相对于展开后的城市总面积。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 原本面积巨大的二维人体在更广阔的二维城市图景中呈现的微小人形
vehicle: 巨幅画面上数量众多、尺寸极小、仅以轮廓标示人的图形符号
ground: 尺度相对极小；数量庞大；只能辨认基本人形；嵌在更大画面；个体细节难见；承担标记作用
