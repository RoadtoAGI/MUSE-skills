chapter: 【公元1453年5月，魔法师之死】
figure_type: analogy
quote: 帝国就像身下的浴池一样，建在整块花岗岩上，将永世延续
sensory_mapping: 抽象国体下沉到人身体下方，花岗岩硬度转成制度根基，泡浴舒适感转成统治者的安全错觉。
context_fact: 叙述在帝国已经消亡后回看古罗马人曾有的永久自信。
image_mechanism: 人正躺在坚固浴池里，触觉上的稳定被误推为历史永恒；读者知道浴宫与帝国皆成遗迹，喻体因此自带反讽。
property_alignment: 帝国制度基础对应花岗岩底座；版图与机构对应浴池整体；罗马人的安逸确信对应浴者被坚硬结构托住。
context_alignment: 浴宫是罗马文明的具体荣耀，又是享乐场所，既符合时代物质经验，也暴露盛世判断的盲点。
narrative_function: 把永恒帝国观写成身体经验导致的认知误判，为前文蒸发结局提供历史反讽。
transfer_rule: 表现制度自信时，可选当事人日常依赖的稳固设施；还应让后世结局反照该设施的有限寿命，产生双时态效果。
failure_boundary: 若叙述者本身也认同帝国永续，浴池会只剩赞美；若基础松软可见，花岗岩带来的安全错觉便无从成立。
