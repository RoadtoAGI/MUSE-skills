chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 对过去的记忆，就像来自赫尔辛根默斯肯的奇异物品那样日渐稀少
sensory_mapping: 空掉的货架；零星异物；封闭港口；旧物蒙尘；数量逐年减少
context_fact: 饕餮鱼封海后城市退化为小镇牧场，王国停止外贸并有意建立没有变化、也不要过去的生活。
image_mechanism: 不可见的公共记忆被摆上旧货架，每次不再讲述便像少掉一件舶来品；海路封死后既无新货也无新故事，货架和脑海一起变空。
property_alignment: 过去记忆对应异国奇物；故事讲述对应物品流通；海路封闭对应记忆来源切断；主动遗忘对应丢弃旧物；残存老人记忆对应少量库存；日渐稀少对应货架变空
context_alignment: 长帆用同一段历史中的实物贸易解释精神遗忘，听故事的公主能从王国现实物资匮乏理解记忆匮乏。
narrative_function: 将社会失忆具体化为可盘点的物品减少，说明‘无故事’如何被制度化。
transfer_rule: 用稀缺物品写记忆消退时，应有来源中断、存量耗散、传播渠道、可见残余和主动丢弃或自然损耗。
failure_boundary: 过去仍被持续记录讲述、记忆可无限复制，或异物反而越藏越珍贵常见时，库存减少不能代表遗忘。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 封闭王国的人们主动遗忘开放贸易时代，关于过去的共同记忆不断减少
vehicle: 海路断绝后无法补充的异国奇物逐件耗损、散失，最终在日常生活中越来越难见
ground: 记忆消退对应物品散失；不再讲述对应贸易断供；旧时代内容对应异国来源；偶尔残留回忆对应少数存货
