chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 飞船的外形是四面体，像一座小金字塔
sensory_mapping: 亨特号没有流线船身，只像一座暗色小金字塔悬在轨道上，四面硬直斜向尖顶。
context_fact: 飞船内部狭窄无装饰，四人冬眠舱占大部空间，与精致星环号形成反差。
image_mechanism: 金字塔以一眼可识的几何与纪念建筑质感，说明四面体外形并暗示银河人类重功能、低装饰的生活。
property_alignment: 四面体船壳对应金字塔斜面；尖顶对应汇聚顶点；宽底对应三角基面；狭窄舱室对应向顶收窄。
context_alignment: 太阳系留下地下墓碑和方碑，银河人类飞船也呈墓葬建筑轮廓，迁徙时代仍携带纪念性几何。
narrative_function: 快速区分亨特号与星环号的外观和生活品位，为关一帆文明的朴素技术气质定调。
transfer_rule: 多面体器物比作建筑时，应对齐面数、底顶关系、尺度、内部空间与文化联想。
failure_boundary: 飞船不是石砌陵墓，也未必有方形底座；金字塔只描述四面体轮廓。
quality_assessment: conventional
confidence: 1.0
review_status: reviewed
tenor: 亨特号由四个三角面围成、底宽顶尖且体量不大的四面体船身
vehicle: 底座宽、四侧斜面向顶部汇聚的缩小金字塔建筑
ground: 几何体由三角面组成；底部宽；顶部尖；轮廓稳定；外观简洁厚重；内部空间向上收窄
