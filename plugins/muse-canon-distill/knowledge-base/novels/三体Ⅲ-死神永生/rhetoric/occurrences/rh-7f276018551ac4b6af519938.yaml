chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 这只圣杯看上去仿佛昨天才铸出来一般崭新
sensory_mapping: 九百年的时间跨度被折叠为一天，金光与宝石晶莹成为刚出炉的视觉证据。
context_fact: 圣杯来自千年封闭密室，与历代传存、已经黯淡的孪生圣杯形成对照。
image_mechanism: 喻体删除器物应有的时间层，读者先看到新铸金器的锐亮，再意识到密室中的时间并未正常作用。
property_alignment: 未黯淡的金面对应新铸金器的高亮；没有磨耗污痕对应只经历一天的短时存放；旧杯反差对应新旧制品并置。
context_alignment: 情节正在证明狄奥伦娜穿透空间，异常崭新提供了独立于证词的时间证据，使奇迹具体可信。
narrative_function: 以物表的新旧差异验证密室封闭状态，并为随后的无损取脑建立超自然规则。
transfer_rule: 表现时间异常时，可选读者熟悉老化轨迹的物件，用极短制造时距对照；现场同类旧物能校准差异。
failure_boundary: 若圣杯近期被清洗修复或材质本就不会黯淡，昨天铸出便无法证明时间异常；缺少旧杯参照时力度也会下降。
