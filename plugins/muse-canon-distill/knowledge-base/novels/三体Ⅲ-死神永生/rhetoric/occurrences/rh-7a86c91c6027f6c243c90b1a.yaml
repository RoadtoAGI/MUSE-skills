chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 画中人的眼睛摄住了他的魂，使他久久陶醉其中
sensory_mapping: 画眼摄魂；目光钩住；人立画前；意识离体；陶醉失神
context_fact: 针眼画师的画像能把现实人物收入画中，长帆在阴冷画室找到露珠画像后必须将其烧毁解除危险。
image_mechanism: 画像的超自然威胁从被画者反向作用于观看者：画中眼睛像钩索把长帆意识拉向纸面，真实魔法规则与审美沉迷叠在同一“摄魂”动作里。
property_alignment: 画眼对应摄魂者；视觉吸引对应牵引力；长帆意识对应魂；凝视不移对应被拘禁；陶醉对应魅惑；画像魔法对应真实超自然能力；清醒烧画对应挣脱
context_alignment: 画像本能让现实人物消失，长帆若沉迷拖延便可能危及公主；摄魂不只是夸赞美貌，也贴合画作在童话中的致命权力。
narrative_function: 在烧画前制造最后诱惑，让长帆的忠诚表现为从美与魔法双重控制中主动清醒。
transfer_rule: 用摄魂写目光时，应有强到中断行动的视觉吸引、主体自主性下降，并最好存在魅惑或控制的情节机制。
failure_boundary: 人物只短暂欣赏、仍能自由转移注意，或画像没有任何控制危险时，“摄魂”会把普通审美反应写得过重。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 长帆被针眼画出的露珠公主双眼强烈吸引，注意与情感完全固定在画像上，短时间无法恢复行动
vehicle: 一股具有摄取力的力量从眼睛伸出，把人的灵魂从身体夺走并拘禁，使其失去自主
ground: 画中目光对应摄魂力量；长久凝视对应灵魂被拘；行动停顿对应失去自主；陶醉对应被魅惑；画像人物对应施术者；长帆情感对应可被摄取之魂
