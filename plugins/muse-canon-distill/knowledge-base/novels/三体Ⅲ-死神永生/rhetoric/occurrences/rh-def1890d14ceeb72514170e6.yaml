tenor: 程心由太空站内环向外环下降，依次经过两个多世纪不同时代扩建的建筑层
vehicle: 勘探者沿深井穿过一层层地质岩层，各层材料和纹理保存不同年代的环境历史
ground: 空间层次按时间顺序累积；越往一个方向年代越新；每层材料和风格不同；断面可供读取历史
