chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 程心感觉自己是在“井”中穿过时代的地层
sensory_mapping: 终端站深井两侧的圆环变成彩色岩层，军国冷灰、浪漫亮色和享乐街景像年代矿脉依次掠过。
context_fact: 终端站由内向外逐环扩建，每环材料、装饰和社会风格对应大低谷至威慑纪元的不同时代。
image_mechanism: 地层把建筑扩建顺序转成沉积时间，人物的径向移动因此成为一次可见的历史钻探。
property_alignment: 圆环对应岩层；建造年代对应沉积年代；材料风格对应矿物纹理；穿行各环对应钻井过层；时代特点对应断面信息。
context_alignment: 前一段已把辐条走廊感知为深井，地层顺势附着井壁，不需另造空间方位便扩展出历史维度。
narrative_function: 在一次交通移动中压缩两百年社会史，并使最外环的尘世生活成为最新表层。
transfer_rule: 建筑层如地层时，应确保空间顺序与时间顺序一致，并用材料、色彩、风格提供可读断面。
failure_boundary: 外环更年轻与自然地层通常越深越古的规律相反，文本明确是人工扩建造成的倒置。
