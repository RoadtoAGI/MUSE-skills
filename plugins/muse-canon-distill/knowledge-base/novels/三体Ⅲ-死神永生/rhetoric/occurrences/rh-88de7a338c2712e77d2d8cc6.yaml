chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 阳光被密集的框架切碎
sensory_mapping: 终端框架像一排黑刀掠过太阳，整片白光被剁成窄亮片，在舷窗和舱壁上连续飞闪。
context_fact: 运载舱从巨型框架结构中穿过，密集构件周期性遮住阳光，随后进入暗下来的终端内部。
image_mechanism: 切碎把遮光从简单变暗写成光束的材料破裂，框架边缘成为刀口，舱体运动提供连续切割动作。
property_alignment: 连续阳光对应完整材料；框架杆件对应刀刃；明暗条纹对应碎片；穿越运动对应反复下刀。
context_alignment: 远处建筑刚像精致玩具，近处框架立刻切碎阳光，尺度错觉通过对光的强力作用被纠正。
narrative_function: 在入隧洞变暗前增加高频视觉节拍，表现终端站结构的密度和压迫尺度。
transfer_rule: 光被写成可切材料时，应明确切割物、相对运动、碎片形态和连续光如何变成明暗序列。
failure_boundary: 光没有固体断裂，框架只造成遮挡；若边缘模糊或运动缓慢，切碎的锐利感会减弱。
