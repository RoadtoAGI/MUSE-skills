chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 程心不是一个威慑者，反而成了一道安全屏障
sensory_mapping: 三体与人类广播者之间竖起一面写着执剑人的墙，众人因依赖它停手，攻击信号无法穿过。
context_fact: 广播系统已毁，若仍有秘密手段，执剑人活着会让掌握者产生依赖和推脱理由。
image_mechanism: 屏障反转执剑人应当威胁敌人的职能：同一职位本应朝外施压，却因人格判断替敌人挡住内部风险。
property_alignment: 执剑人身份对应墙体位置；他人依赖对应行动被拦；程心不广播对应屏障不放行；三体受益对应被保护侧。
context_alignment: 这面屏障建立在敌人看透她的基础上，紧接童话判断，使善意怎样转化为敌方安全机制变得可见。
narrative_function: 解释三体为何不杀程心，并完成对第二任执剑人角色的讽刺性倒置。
transfer_rule: 角色职能反转可用屏障呈现，但要明确危险从哪边来、谁被保护、阻断行为如何发生。
failure_boundary: 她无法绝对阻止未知广播者，保护效果只是概率判断；屏障也没有物理防御水滴的能力。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心的存在降低其他人擅自广播的可能，反而保护三体免遭坐标暴露
vehicle: 隔在危险源与被保护对象之间、吸收或阻止攻击的屏障
ground: 位于威胁路径中间；阻断他人行动；保护效果来自被信赖且不主动攻击
