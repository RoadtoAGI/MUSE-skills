chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 澳大利亚，它像漂在太平洋中部的一大片枯叶
sensory_mapping: 澳洲大陆缩成褐色枯叶，静静浮在蓝镜般太平洋上，明暗线正从叶脉中部移过。
context_fact: 程心从太空辨认澳大利亚，沃伯顿正值清晨，她想起住在沙漠树林边的弗雷斯。
image_mechanism: 枯叶以大陆真实色形完成识别，又把经历大移民后的澳大利亚赋予衰败和被遗留的情绪。
property_alignment: 大陆轮廓对应叶形；干旱地色对应枯黄；太平洋对应水面；孤立位置对应漂叶；远距压平对应叶片薄。
context_alignment: 朋友弗雷斯选择在这片荒凉大陆生活，枯叶既是地理外观，也承接程心对老人和灾难遗址的牵挂。
narrative_function: 把行星全景缩到一个有私人记忆的大陆，使宏大新生日出落回朋友所在的具体清晨。
transfer_rule: 大陆如漂浮物时，应同时匹配轮廓、地表颜色、水域包围、观察高度和人物地点记忆。
failure_boundary: 大陆固定于地壳且厚重，并不随海漂流；枯意来自外观与记忆，不代表生态完全死亡。
