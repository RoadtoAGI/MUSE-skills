sensory_mapping: 飞车下的小坑变成弹坑，红柳余火变成炮火，薄烟把戈壁罩成停战后的灰色战区。
context_fact: 喷发物沿途砸出冒烟小坑并点燃红柳，还震塌了少量旧建筑。
image_mechanism: 战场将分散破坏痕迹收束为一套熟悉的灾后构图，并把单枚水滴的动作提升为战争结果。
property_alignment: 岩石坑对应弹坑；燃烧红柳对应余火；震塌建筑对应战损；烟雾对应硝烟。
context_alignment: 人类尚未正式迎战却已失去战略系统，视觉上的战场准确呈现一边倒战争已经结束。
narrative_function: 把技术说明重新落回地表伤痕，引领程心走向作为失败中心的巨坑。
transfer_rule: 用战场概括灾后景观时，应让坑、烟、火、残骸至少两项分别对应，避免只凭荒凉命名。
failure_boundary: 此处没有交战双方或炮击过程，战场只描述结果形态；不能据此补写不存在的战斗。
