chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 仿佛刚才发生的一切不过是打断他们谈话的短暂噪声
sensory_mapping: 连续谈话；突发轰响；声音退去；原句续上；注意力不偏移
context_fact: 氢弹熔化巨石并令全球欢腾，维德及随从却一直只关注程心的决定。
image_mechanism: 足以吞没画面的核闪在维德的注意体系里被压缩成一小段音频干扰；噪声一停，他从完全相同的字继续，仿佛思想时间未曾走动。
property_alignment: 维德警告对应谈话主信号；核爆对应背景噪声；试验时长对应中断片段；光焰消失对应噪声停止；重复原话对应续接句子；情绪不变对应忽略干扰
context_alignment: 外部世界把试验视为希望爆发，维德却把它降为噪声，突出他对光速飞船目标的极端专注。
narrative_function: 在公共胜利高潮中重新锁定程心的第二次选择，恢复核心冲突。
transfer_rule: 用噪声写重大事件被忽略时，应有明确主议题、短暂干扰、主体注意未移、干扰后原句续接和价值尺度反差。
failure_boundary: 事件实质改变谈话条件、人物明显震撼或随后调整立场时，称短暂噪声会否认真实影响。
quality_assessment: exemplary
