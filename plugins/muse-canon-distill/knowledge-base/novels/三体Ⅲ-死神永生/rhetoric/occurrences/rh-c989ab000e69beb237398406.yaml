chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 程心的意识就像太空一般透明而空旷，没有回忆，没有明显的感觉
sensory_mapping: 她的脑内清空成无声真空，回忆星体全部熄灭，只剩透明黑域向四面无限延伸。
context_fact: 程心已拿出致死药物，自认卸下俗务，精神痛苦暂时转为异常平静。
image_mechanism: 太空把麻木从昏暗混浊改成透明空无，清明外观反而提示生命内容已经被抽走。
property_alignment: 无回忆对应无天体；无感觉对应真空无声；意识空白对应空间空旷；解脱感对应无阻透明。
context_alignment: 她即将乘太空电梯真正进入太空，此刻心理先进入空域，使死亡欲望与后来航天归属感暗中相连。
narrative_function: 建立自杀前危险宁静的总体空间，为朋友来电后心被多手抓紧制造密度突变。
transfer_rule: 意识如空域时，应明确被清除的内容、剩余透明度、参照丧失和这种空旷由何事件触发。
failure_boundary: 太空并非绝对空无，程心也仍能听电话和作决定；喻体仅指主观内容稀薄。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 决定自杀后程心暂时失去回忆、情绪和思维阻力的空白意识状态
vehicle: 透明空旷的太空没有近处物体、遮挡和声音，视线可穿过却找不到落点
ground: 内部内容稀少；边界感消失；没有阻挡或杂音；主体悬浮般失去参照
