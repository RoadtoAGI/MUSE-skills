tenor: 表面熔化、身后拖着被蒸发海洋水汽白色尾迹的三体行星
vehicle: 长发披散的人，白色发丝从头部向后飘展，在运动中被风吹乱拉长
ground: 主体前端相对集中；白色细长物向后延伸；运动和外力使尾部飘散；外观发生身份般巨变
