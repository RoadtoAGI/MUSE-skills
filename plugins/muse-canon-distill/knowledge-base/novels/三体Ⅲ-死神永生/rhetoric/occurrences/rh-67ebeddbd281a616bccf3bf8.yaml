chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 行星变成了一颗披散着白色长发的彗星
sensory_mapping: 暗红熔融行星像一颗头颅疾行，整片海洋蒸成白发从身后披散，又被太阳风逐缕吹开。
context_fact: 行星穿过高温喷出物质带后海洋蒸发，水汽尾迹在轨道后方形成并被太阳风吹散。
image_mechanism: 白发把水汽尾迹附着到行星身体上，披散动作同时表达长度、柔软形变和太阳风作用。
property_alignment: 行星球体对应头部；白色尾迹对应长发；轨道运动对应奔行；太阳风吹散对应风中发丝。
context_alignment: 三体文明已经死亡，行星却被写成人形披发，像一具仍在太空奔行的暗红遗体。
narrative_function: 用柔软白发覆盖熔融灾难的末态，为三体母星留下最后可辨认的哀美形象。
transfer_rule: 尾迹如长发时，应对应主体头部、尾迹颜色和质感、运动方向及吹散它的外力。
failure_boundary: 水汽尾迹没有人体或毛发结构，行星也不因外观像彗星就改变天体类别。
