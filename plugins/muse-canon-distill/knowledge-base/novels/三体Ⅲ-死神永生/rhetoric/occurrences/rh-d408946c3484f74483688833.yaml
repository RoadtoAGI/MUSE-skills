figure_type: simile
quote: 最后大部分光点都熄灭，只有少数像萤火虫般间或亮起
sensory_mapping: 漆黑太空；稀疏蓝点；间或闪亮；微小萤火；长阵列轮廓
context_fact: 二十五千米透镜组对准三体星系，各镜片轴向移动后仅需少数推进器保持精确焦点。
image_mechanism: 庞大望远镜结构在推进器熄灭后再次隐入黑暗，只让几颗蓝光像萤火般随机闪现；精密微调被缩成轻巧生命动作。
property_alignment: 离子推进器对应萤火虫；蓝色光焰对应萤光；间歇点火对应闪烁；太空对应夜野；少量镜片对应零散个体；对焦微调对应细小飞动
context_alignment: 设备本体不可见，只有光点勾勒位置，萤火虫恰好以点光而非实体呈现这套巨构。
narrative_function: 把宏大望远镜的精细校准写得安静灵敏，为观测三体遗迹转入凝视状态。
transfer_rule: 用萤火虫写控制光点时，应有暗背景、孤立小光、间歇闪烁、稀疏分布和轻量微调。
failure_boundary: 推进器持续喷出强烈长焰、光点密集连线或环境明亮时，萤火虫的微弱间歇感不成立。
