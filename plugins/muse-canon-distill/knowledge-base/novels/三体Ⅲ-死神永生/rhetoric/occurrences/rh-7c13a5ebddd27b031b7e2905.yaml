tenor: 散入密集抢夺者之间的一袋袋食品
vehicle: 落入蚁群、相对个体稍大却会被从各方向围住搬扯的米粒
ground: 有限资源被数量远多的微小个体包围；多人同时从不同方向拖取；完整单位迅速破碎分散
