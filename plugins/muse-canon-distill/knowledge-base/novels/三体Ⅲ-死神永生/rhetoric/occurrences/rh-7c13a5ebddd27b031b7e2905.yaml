chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 那一袋袋食品像蚁群中的米粒一般，很快被撕碎扯烂
sensory_mapping: 俯拍镜头把人缩成蚂蚁，白色食品袋成了米粒，每粒周围立刻伸出一圈拉扯的手。
context_fact: 抢到整袋食品的人马上又遭周围人争夺，包装被撕烂，内容物散落。
image_mechanism: 蚁群继承前文澳大利亚如蚁窝的尺度，把个体求生动作转成围粮搬运的密集图案。
property_alignment: 食品袋对应米粒；密集人群对应蚁群；多人扯抢对应群蚁搬食；袋破散落对应米粒被分解。
context_alignment: 转播镜头向地面拉近仍保留俯视，人和食物的相对大小支持微观群落图像。
narrative_function: 从宏观洪流切到单袋争夺，显示失控在每个资源单位上重复发生。
transfer_rule: 俯视资源争抢如蚁群时，应匹配单位尺度、围拢方式和分解动作，并与镜头高度一致。
failure_boundary: 人类争抢伴随恐惧、道德和暴力，不能由蚂蚁协作推导其社会组织；此处只写形态。
