quote: 在他们看来也就像芯片锁死一样平常，重新启动后可以再试
sensory_mapping: 意识休克被降格为电子故障，复苏成为按下重启键，痛苦体验成为可循环测试程序。
context_fact: 云天明想象三体人把无身体大脑当实验标本，反复输入各种酷刑感觉。
image_mechanism: 芯片模型抹去休克的人类痛苦，只保留操作者眼中的可恢复故障，正显出实验者冷酷视角。
property_alignment: 休克无响应对应芯片锁死；大脑未死亡对应硬件仍在；再次唤醒对应重启；重复酷刑对应重跑测试。
context_alignment: 他最怕的不是一次疼痛而是无法死亡，重启循环精确解释折磨为何无终点。
narrative_function: 把技术复活优势反转为酷刑延续机制，抬高阶梯任务的主观恐怖。
transfer_rule: 意识系统类比计算机时，应明确操作者视角、可恢复层级和循环条件；技术冷语可用于揭示物化。
failure_boundary: 若休克造成不可逆脑损伤、三体人不能复苏或不重复实验，芯片重启链条就断裂；人脑也非真正程序。
