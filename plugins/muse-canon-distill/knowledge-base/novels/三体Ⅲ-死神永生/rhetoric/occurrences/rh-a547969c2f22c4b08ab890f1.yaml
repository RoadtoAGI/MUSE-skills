chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 就像最后的晚餐结束时豪华餐厅中一盏接一盏熄灭的灯
sensory_mapping: 地球夜面成为巨大餐厅，城市灯海像一排排吊灯熄下，最后只剩澳大利亚一桌拥挤余席。
context_fact: 移民迫使澳大利亚以外城市清空，夜间照明随居民撤离一座座消失。
image_mechanism: 餐厅把文明繁华和集体离席放进同一室内，最后的晚餐还给迁移附上不可返回的终局意味。
property_alignment: 城市繁华对应豪华餐厅；居民撤离对应宾客散席；逐城停电对应逐灯熄灭；空城对应宴后死寂。
context_alignment: 人类正被集中等待可能的互食，最后晚餐在字面食物危机之前形成阴暗宗教预兆。
narrative_function: 以全球夜景蒙太奇收束地球疏空过程，并把文明退出写成一场庄严而恐怖的散席。
transfer_rule: 空间群体依次关闭可比作散席熄灯，但应匹配旧繁华、离场顺序和最后一次使用。
failure_boundary: 城市并未毁灭，未来可能重新点亮；餐厅暗示统一主人关灯，而实际停电原因多样。
quality_assessment: exemplary
