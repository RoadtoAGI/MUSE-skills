review_status: reviewed
tenor: 全人类迁出后，各大陆城市在夜间依次断电、空置并陷入死寂
vehicle: 最后一场宴席散尽后，豪华餐厅按次序关闭吊灯，最终空无一人
ground: 原先明亮繁华的空间失去使用者；光源逐个而非同时消失；最后一次离场带有终结感
