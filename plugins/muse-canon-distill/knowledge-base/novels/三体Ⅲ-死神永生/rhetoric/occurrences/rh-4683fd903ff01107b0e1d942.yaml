chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这目光与他的成熟融合在一起，像穿过光年距离的阳光
sensory_mapping: 屏幕中的目光化成一束走过数光年的暖光，落到程心身上，把紧张缓慢烘松。
context_fact: 监听使两人不能直说，云天明只能以目光延续大学时代未明言的爱，程心由此感到幸福。
image_mechanism: 阳光把不可触摸的凝视转换成可跨距传播并抵达皮肤的热量，光年既是物理距离也是离别时长。
property_alignment: 目光传情对应阳光传热；星际分离对应光年行程；成熟宽厚对应稳定光照；幸福放松对应受暖。
context_alignment: 会面依靠光年外的智子图像完成，阳光喻体同时服从通信方式、真实空间和麦田的明亮布景。
narrative_function: 在情报使命短暂停摆处恢复爱情线，使沉默成为比对话更高密度的交流。
transfer_rule: 远距关怀写成光时，应让传播距离、到达后的温度、接收方式和现场光源共同成立。
failure_boundary: 目光并未真正输送热能，也无法像阳光均匀照亮对象；它只呈现程心主观接收的温暖。
quality_assessment: exemplary
confidence: 0.99
