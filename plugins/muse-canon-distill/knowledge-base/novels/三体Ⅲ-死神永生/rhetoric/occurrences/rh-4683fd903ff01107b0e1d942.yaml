tenor: 云天明跨越三世纪仍投向程心的关爱，以及成熟后更稳定宽厚的情感力量
vehicle: 穿过星际真空和漫长距离抵达接收者、仍能给予温暖的阳光
ground: 跨越巨大距离；抵达时仍有温度；无须语言即可被感知；稳定包围接收者
