chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 正在云海中下沉的夕阳仿佛融化着，太阳的血在云海和太空中弥漫开来，映现出一大片壮丽的血红。她说这是人类的落日
sensory_mapping: 夕阳在云海里化开，血色从太阳伤口铺满天际，昼日落下的同时仿佛整个人类也沉入夜幕。
context_fact: 叶文洁曾在红岸向三体世界发出信号；四个世纪后，太阳真的二维化并把炽热物质摊成红色火海。
image_mechanism: 融化、流血与落日组成一套终结机制：视觉红霞先被读成太阳死亡，再由“人类”把天象升级为文明时段结束。
property_alignment: 红霞对应血；云海扩散对应血液弥漫；夕阳下沉对应生命衰亡；夜幕对应文明终结；叶文洁临终对应见证者死亡。
context_alignment: 后文太阳真的融化、铺血，使四百年前的主观预言获得物理兑现，象征与现实跨全书重叠。
narrative_function: 召回系列开篇的核心意象，为太阳降维高潮赋予历史因果和宿命闭环。
transfer_rule: 日落承载文明终结时，应把色彩、下沉、周期结束、人物因果与后文兑现串成同一意象链。
failure_boundary: 太阳没有血液，红霞由光学和等离子体造成；“人类落日”是叶文洁的历史判断，不等于当时即刻灭亡。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 叶文洁临终所见的血红夕阳，以及她判断由自己开启的接触将引向人类文明终结
vehicle: 受伤的太阳融化流血，在一天结束的落日中带着整个人类一起进入黑夜
ground: 红色液态扩散；主体下沉消失；过程不可逆；光明转入黑暗；结束一个完整周期；带有死亡和失血感
