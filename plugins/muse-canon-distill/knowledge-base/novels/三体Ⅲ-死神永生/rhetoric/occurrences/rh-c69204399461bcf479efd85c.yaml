chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 自己正处在最后的生死线上
sensory_mapping: 三盏灯都熄灭，程心像站在一根细线上，一侧是返航，另一侧是舱内核爆。
context_fact: 舰队正在几光年外重放审核谈话，红灯可随时触发氢弹，黄灯不再警告。
image_mechanism: 边界线把概率悬置压成空间临界点，等待审核的时间因此成为保持平衡的动作。
property_alignment: 生还与死亡对应线两侧；审核等待对应站在线上；红灯决定对应越界；结果不可逆对应边界终局。
context_alignment: 实体舷窗旁确有三色灯，抽象生死线紧贴可见控制信号，常用语因具体装置重新获得形状。
narrative_function: 在会面结束后保留悬念，阻止情感告别立即松弛成安全返航。
transfer_rule: 临界风险写成界线时，应明确两侧结果、触发动作、站立不稳和越界不可逆。
failure_boundary: 风险不是几何位置，审核也可能有多种处置；线只压缩最核心的生死二分。
