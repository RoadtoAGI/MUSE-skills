tenor: 会面内容等待三体审核、程心可能在红灯亮起后立即被氢弹杀死的临界状态
vehicle: 把生存区与死亡区分开的细线，人站在线上等待被推向任一侧
ground: 两种结果互斥；决断尚未落下；位置极不稳定；跨过边界后不可逆
