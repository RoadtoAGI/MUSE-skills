chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 横贯整个天空，像太阳系的一条新项链
sensory_mapping: 无数二维小行星亮成珠粒，在黑空串起一条横贯视野的冷光项链。
context_fact: 海王星、土星和地球已二维化，小行星带紧接着形成可见长链。
image_mechanism: 项链把天文分布转成贴身饰物尺度，珠粒结构高度对应，却让太阳系死亡获得不合时宜的装饰美。
property_alignment: 小行星光斑对应珠子；带状轨道对应链线；横贯天空对应环绕；闪光对应宝石反光；二维化新生对应新项链。
context_alignment: 二维地球随后戴上雪花花环，太阳系在毁灭中接连被装饰，宇宙暴力产生冷艳首饰化效果。
narrative_function: 标记灾难从外行星推进到小行星带，并以一条可见光带建立地球即将轮到的空间倒计时。
transfer_rule: 星点带比作项链时，应对齐离散珠点、串联轨迹、环绕对象、光泽及美感与情境的反差。
failure_boundary: 小行星并未物理相连，也没有佩戴主体；项链只描述远观排列和装饰感。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 小行星带二维化后由无数独立光斑连成、横过冥王星天空的长光带
vehicle: 许多闪亮珠粒依次串联、环绕佩戴者颈部的一条项链
ground: 由许多亮点组成；点间连续排列；整体细长成带；环绕中心天体；具有装饰光泽；新近出现
