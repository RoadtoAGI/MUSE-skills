chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 看上去像用鼠标在现实的画面中拉出的一个方框
sensory_mapping: 森林仍是真实景物，矩形却像光标拖出的选区浮在画面最上层，框内没有填色也没有厚度。
context_fact: 这个智慧造物白天因线光微弱不可见，夜间在空地小范围移动，稍后证实通向小宇宙。
image_mechanism: 电脑方框把陌生高科技物体解释为叠加现实的二维界面，突出其无厚度、透明和规则边缘。
property_alignment: 亮线边框对应选区线；透明内部对应未填充框；悬浮现实对应界面叠层；小范围移动对应鼠标拖动；规则矩形对应软件几何。
context_alignment: 宇宙之门实际是超越正常空间的接口，用数字界面作喻恰好预示其连接与选择功能。
narrative_function: 用现代人立即可识别的视觉动作引入全书最异质的宇宙技术。
transfer_rule: 不可知装置可借界面元素落地，但应同时对齐几何、透明度、层级关系和交互动作。
failure_boundary: 方框不是屏幕图形，也非由鼠标创建；它能选择对象并传送，功能远超可视化选区。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 由四条微亮细线构成、竖直悬浮并缓慢移动的矩形宇宙之门
vehicle: 电脑界面中用鼠标拖拽生成、叠加在屏幕图像上的选择矩形框
ground: 轮廓由细线组成；内部透明；矩形边界规则；叠加于环境；仿佛不受背景物质影响；具有界面感
