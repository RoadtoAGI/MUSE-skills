chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 公主的双眼在烛光中焕发出生命的光芒，让长帆感到周围又亮了起来
sensory_mapping: 眼灯复明；烛室转亮；生命放光；希望照人；阴暗退去
context_fact: 画像已烧毁，公主确认自己不会消失，并邀请长帆放弃王国、共同远航。
image_mechanism: 物理烛光只负责照见眼睛，真正的亮度变化来自公主决意；她从被伞和画像保护的易逝露珠转为自发光源，长帆的主观空间随之增亮。
property_alignment: 双眼对应灯；生命力对应发光能量；远航决心对应点燃；希望对应亮度；长帆情绪对应被照空间；阴暗画室对应过去困局；未来开放对应周围亮起
context_alignment: 故事开头她需要黑伞隔绝阳光，此刻却由内向外发光，形象反转完整标记角色从脆弱被护到自主选择。
narrative_function: 把人物弧光压进一次明暗变化，并令长帆接受远航邀请的情感依据可见。
transfer_rule: 用眼睛照亮环境写人物重获生命力时，应有此前的阴暗或衰弱、明确新决定，以及旁观者情绪随目光同步改变。
failure_boundary: 人物仍被动绝望、眼神变化只来自外灯反射，或旁观者没有受到感染时，生命光芒会把物理亮点误作成长。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 露珠公主决定放弃王位、走向未知海洋后显出的旺盛意志与希望，并感染长帆
vehicle: 一盏重新点燃的生命灯从眼中放出光芒，照亮原本阴暗画室和身边的人
ground: 眼神活力对应光源；新决定对应重新点燃；希望增强对应亮度上升；长帆受感染对应环境被照亮；画室阴暗对应前途压抑；远航愿望对应光的方向
