chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 像一条银色的天国之路
sensory_mapping: 烟迹凝固成银桥路面，导弹火球成为沿路升天的行者，夜空获得垂直通道。
context_fact: 多国导弹把原用于杀人的核弹送入轨道，供阶梯飞行器加速。
image_mechanism: 尾迹外形先成道路，核武从毁灭用途转去深空又赋予天国方向；救赎感与武器本性并置。
property_alignment: 重合尾迹对应单一路面；月光银白对应天国圣洁色；火球升空对应沿路上行。
context_alignment: 同一景象似末日又是非攻击发射，天国之路准确承载核武用途转化的庄严反差。
narrative_function: 把全球导弹发射组织成一条视觉主轴，提升阶梯计划的文明仪式感。
transfer_rule: 轨迹写成道路时，应有连续方向、可见承载物和目的地想象；颜色可辅助价值转义但不能脱离现场光源。
failure_boundary: 尾迹分散弯折、不重合或导弹向地面目标落下时，通往天国的单一路径不成立。
