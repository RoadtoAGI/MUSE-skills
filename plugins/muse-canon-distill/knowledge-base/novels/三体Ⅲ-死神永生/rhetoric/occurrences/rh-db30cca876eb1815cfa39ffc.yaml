quote: 智子的存在已经使他们对人类世界了如指掌
sensory_mapping: 庞大人类世界缩到三体人掌心，城市与计划变成掌纹，智子视线沿纹路逐条读取。
context_fact: 智子可监听PIA会议和全球活动，使人类无法依赖秘密计划。
image_mechanism: 手掌把全域知识转成近距熟悉，缩尺同时表达控制优势；掌纹细节对应情报颗粒度。
property_alignment: 全球信息对应掌面整体；秘密细节对应掌纹；持续智子观察对应随时低头查看自己的手。
context_alignment: 紧接蚂蚁放大镜类比，掌中世界进一步说明观察不仅是凝视，而已形成稳定知识占有。
narrative_function: 用惯用短语压缩敌方情报优势，为利用计划透明性作诱饵提供前提。
transfer_rule: 熟知类喻体应由覆盖范围、细节分辨率和更新速度支撑；掌握一词还需区分知情与实际控制。
failure_boundary: 智子若有观测盲区、信息延迟或无法理解人类行为，了如指掌会夸大；知晓也不自动等于能操纵。
