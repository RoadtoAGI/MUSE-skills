quote: 在生物学上，相当于哺乳动物的远祖从海中爬上陆地；在宗教上，相当于亚当和夏娃被逐出伊甸园
sensory_mapping: 文明抽象转折获得爬出海水的身体阻力和走出园门的放逐路线，安全边界在身后闭合。
context_fact: 历史学家解释危机幼稚症，认为文化冲击触及政治、宗教、经济根基并迅速浮上表面。
image_mechanism: 两组类比从演化与神话互校：一次强调介质更换和适应，一次强调失乐与不可逆知识，共同刻画文明成年。
property_alignment: 宇宙观更换对应海陆介质更换；文明失去安全感对应离开伊甸庇护；危机后不能复原对应登陆和放逐的不可逆。
context_alignment: 单一历史事件不足以量级对照，跨学科双喻体明确说明这不是普通战争，而是文明存在条件改变。
narrative_function: 为危机幼稚症建立深层成因，扩大叙述尺度并限制与普通历史冲击的误比。
transfer_rule: 说明范式迁移时，可并列机制互补的远域案例：一个解释环境适应，一个解释价值失落；两者都须共享不可逆边界。
failure_boundary: 若危机只短期扰动制度、旧宇宙观仍可完整恢复，登陆和逐园都过度；类比也不推出具体社会反应必然相同。
