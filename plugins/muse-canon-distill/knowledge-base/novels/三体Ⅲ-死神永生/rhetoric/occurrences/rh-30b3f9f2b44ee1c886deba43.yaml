quote: 那些记忆虽然清晰，但太超现实，太像梦了
sensory_mapping: 大梦醒来；清晰残像；普通卧室；超现实片段；真假摇晃
context_fact: 程心苏醒后看到金属墙、普通楼房和旧衣服，周围像她熟悉的公元时代，缺少未来全息技术。
image_mechanism: 宏伟未来在记忆里保留高清画面，眼前却回到朴素病房；两层现实无法拼合，过去岁月便像醒时仍黏在眼前的一场大梦。
property_alignment: 未来经历对应梦境；冬眠苏醒对应梦醒；病房现实对应醒后房间；清晰记忆对应梦像残留；技术奇观对应超现实情节；时代反差对应梦真难辨；自我怀疑对应醒后验证
context_alignment: 这是程心第四次纪元错位，环境倒退而非进步，使她第一次怀疑跨时本身，梦感来自具体物质证据。
narrative_function: 表现苏醒认知失配，并延迟揭示朴素城市其实位于木星太空城。
transfer_rule: 用梦写记忆失真时，应有醒后环境反证、记忆仍鲜明、事件超现实、连续性断裂和主体主动核验。
failure_boundary: 当前环境与记忆连续、旁人和物证立即确认全部经历时，梦感只剩套语。
