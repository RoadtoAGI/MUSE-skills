chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 这些力量在一个强有力的狂人统率下，凝结成一个能够碾碎一切的黑色巨轮；而她，只是一个弱小的女子，正如维德所说，是这个时代里的一个小女孩，在这滚滚向前的巨轮前，她只是一株小草
sensory_mapping: 黑轮滚来；小草独立；重压碾地；力量凝结；轮前静止
context_fact: 维德拥有统一指挥的自卫队和足以摧毁太空城的反物质子弹，程心拥有最终决定权但没有武力。
image_mechanism: 分散的人、枪和子弹先被统率压铸成单一轮体，滚动将“前进”口号变成机械惯性；程心则从政治权利缩成轮前一根可碾碎的草，唯有位置而无力量。
property_alignment: 维德集团对应黑轮；纪律统一对应轮体一体；战略推进对应滚动；巨大火力对应重量；摧毁城市对应碾碎；程心对应小草；无武装对应柔弱；最终否决对应挡在路径；维德统率对应轮轴控制
context_alignment: 维德一生信奉“不择手段地前进”，巨轮把这句口号具象成惯性机器；程心坚持生命价值，草的有机脆弱正与战争机械相反。
narrative_function: 将复杂权力对比压成一幅极端不对称画面，为小草竟让巨轮停下的转折积蓄力度。
transfer_rule: 用巨轮与小草写权力冲突时，应有组织力量的统一驱动、明确推进路径、可造成毁灭的重量，以及一个仅凭位置或原则阻挡的脆弱个体。
failure_boundary: 双方力量接近、组织内部尚未形成统一行动、强势方并未向前推进，或弱者有同等级武力时，巨轮—小草会抹掉真实博弈。
