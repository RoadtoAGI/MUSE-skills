tenor: 维德统率的自卫队、反物质武器和前进意志构成压倒性战争力量，而程心凭个人伦理决定阻挡它
vehicle: 一只由黑色重物凝结成的巨大车轮不可阻挡地向前滚压，一株柔弱小草独自立在轮下试图挡路
ground: 武装集团对应巨轮；统一统率对应轮体凝结；黑制服与冷酷对应黑色；推进战略对应滚动；反物质火力对应碾压力；程心对应小草；个体脆弱对应草茎柔弱；拒绝命令对应挡轮
