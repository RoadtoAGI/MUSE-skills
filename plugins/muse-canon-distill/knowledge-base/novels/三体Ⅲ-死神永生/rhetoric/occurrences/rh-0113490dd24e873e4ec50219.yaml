figure_type: analogy
quote: 悲伤还没有袭来，就像被利刃划开的伤口，一时还感觉不到痛
sensory_mapping: 地球的毁灭已经像刀口划进心里，三人却还在无痛的最初几秒，沉默地抬着箱子走。
context_fact: 二维地球已经出现，海洋一时不可见；直到看清超巨型雪花后，AA才哭泣，悲伤终于降临。
image_mechanism: 伤痛时差为情绪迟滞提供身体机制，避免把沉默误读为冷漠，并预告悲伤必然到来。
property_alignment: 地球毁灭对应刀伤；心理麻木对应短暂无痛；继续搬运对应受伤后惯性动作；稍后哭泣对应痛觉传到。
context_alignment: 宏观世界被无形维度利刃切开，人物内心也出现延迟发痛的伤口，物理与心理切割同构。
narrative_function: 控制哀恸节奏，在地球出现与雪花海洋之间保留一段压抑静默。
transfer_rule: 情绪迟发比作刀伤时，应安排伤害时刻、无痛窗口、惯性动作和后续痛觉到达形成闭环。
failure_boundary: 悲伤没有神经传导或真实伤口，不同人物反应也不必同步；比喻说明延迟而非医学诊断。
