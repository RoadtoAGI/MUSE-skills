chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那么多的星星，像雾似的
sensory_mapping: 星点密度被转换为雾滴密度，夜空获得近地雾层的乳白遮蔽和深浅渐变。
context_fact: 云天明与程心共同仰望银河，接续她的牛奶比喻发出感叹。
image_mechanism: 雾不靠流动过程，而靠无数微粒合成连续视觉介质，准确解释星多到失去点状边界的观感。
property_alignment: 无数星点对应无数雾滴；银河光带对应雾层连续；远近星光叠加对应雾中纵深模糊。
context_alignment: 牛奶写色带外形，雾补充颗粒合成和朦胧质感，两句在同一仰望中互补而不重复。
narrative_function: 延长共同观看的感官交流，让银河成为两人关系的共享语言。
transfer_rule: 群体颗粒像雾时，重点应落在颗粒不可分和整体连续；若上一喻体已写颜色，新喻体可补足密度机制。
failure_boundary: 星点稀疏、轮廓锐利或空气极澄澈只见单星时，雾的连续遮层不成立。
quality_assessment: effective
