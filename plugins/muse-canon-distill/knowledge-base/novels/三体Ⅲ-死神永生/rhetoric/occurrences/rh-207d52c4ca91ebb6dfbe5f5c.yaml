chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 三个多世纪前那熟悉的一切被一双无形的巨手卷起来，像画幅一样卷成圆筒状安放到这里
sensory_mapping: 无形巨手；城市画卷；纸面卷曲；圆筒内景；跨世纪搬运
context_fact: 太空城楼房、道路、广告和家庭窗口都让程心想起童年城市，但整体建在旋转圆筒内壁。
image_mechanism: 时间没有逐项复制旧生活，而像抓住整个公元世界的画布一次卷起；街区随纸面弯成环，跨八亿千米被塞入太空城，细节仍可辨认。
property_alignment: 公元生活对应画面；地球平面城市对应平展画幅；圆筒城对应卷画；城市弯曲对应纸面卷曲；历史传承对应巨手搬运；熟悉建筑对应原图细节；木星背面对应新展位
context_alignment: 针眼画师曾使人物进入画，此处画幅不再意味着死亡，而成为文明保存和搬迁的容器，形成童话意象回声。
narrative_function: 解释程心为何在陌生宇宙工程中找到家，将技术奇观与文化连续性合并。
transfer_rule: 用卷画写环境迁移时，应有原平面、整体图景、弯曲新载体、跨距搬运、细节保存和观看者的识别。
failure_boundary: 新城市风格与旧时代完全不同、文化细节已丢失，或结构不是圆筒内壁时，卷画保存会掩盖断裂。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 掩体城市把公元时代普通街区、家庭生活和审美完整重建在圆筒内壁，使程心在木星旁感到回家
vehicle: 巨手把一幅平展绘画从边缘卷成圆筒，画上原有景物随纸面弯曲却完整保留，再搬到远处陈列
ground: 公元城市对应画幅内容；平面大地对应展开画纸；圆筒内壁对应卷起画面；历史迁移对应巨手搬运；熟悉细节保留对应图像未损；木星空间对应新安放处
