tenor: 开放宇宙永远膨胀后，星系彼此失联、恒星熄灭、物质解体，生命与信息永无恢复可能的终态
vehicle: 无限宽阔却空无活人的墓穴，死者与其遗物被黑暗、寒冷土层永久埋住
