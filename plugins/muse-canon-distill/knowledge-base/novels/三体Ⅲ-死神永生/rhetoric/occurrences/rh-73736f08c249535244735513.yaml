chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 宇宙将变成一座空旷的坟墓，所有的文明和所有的记忆都将被永远埋葬在这座无边无际的坟墓中
sensory_mapping: 星系退到彼此视野外，恒星一盏盏熄灭，无边空间像墓穴合拢，文明记忆成为再无人掘读的陪葬物。
context_fact: 回归运动声明称质量不足将令宇宙开放并永远膨胀，所有生命和记忆最终死亡。
image_mechanism: 坟墓把热寂的稀疏、暗冷和永久不可通信汇为一个封闭死亡空间，‘无边’又反转普通墓穴的有限尺度。
property_alignment: 宇宙黑暗对应墓穴无光；恒星熄灭对应生命停止；物质解体对应遗体腐解；文明记忆对应陪葬；永恒膨胀对应无边墓室；无人恢复对应永久埋葬。
context_alignment: 早先死线把宇宙变成死神宫殿，此处终局不再有宫殿主体，只剩空墓，死亡意象推进到彻底无人。
narrative_function: 把质量临界值的科学后果转成必须立即回应的文明恐惧，促成归还决定。
transfer_rule: 宇宙终态写成坟墓时，应对齐光、温度、生命、信息可达性和永久性，并处理有限墓穴与无限空间的反差。
failure_boundary: 开放宇宙仍可能长期存在局部结构，坟墓也通常保存遗骸而非使物质完全解体；这是终极趋势图景。
