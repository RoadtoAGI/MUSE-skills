quote: 他感觉自己的命运就像真空光速一样硬
sensory_mapping: 硬命运；常数墙面；人生撞壁；性格焊死；无形阻隔
context_fact: 高Way深受严重自闭困扰，把改变光速视为改变自己的途径，几十年研究和人际生活都未突破。
image_mechanism: 上一层的物理硬墙被移到人物一生中，孤独不再是可调性格而成为宇宙常数；每次研究失败也同步证明他无法改变自己。
property_alignment: 高Way性格对应真空光速；人生固定对应常数恒定；改变自我对应降低光速；人际尝试对应实验作用；孤独边界对应不可逾越墙；衰老对应多年研究；移情对应参数与自我同一
context_alignment: 类比来自人物明确的移情而非叙述者装饰，解释他为何会把科研项目体验成个人命运并最终走向黑洞。
narrative_function: 把科学难题和人物心理锁成同一悲剧结构，为自毁行为建立因果压力。
transfer_rule: 以自然常数类比命运时，人物必须长期把某个可验证的不变量投射到自身，并让两条失败轨迹在时间和行动上互相强化。
failure_boundary: 人物性格已有显著改变、科研目标与其自我认同无关，或自然量可被日常手段调整时，命运与常数的硬度不会相互证明。
