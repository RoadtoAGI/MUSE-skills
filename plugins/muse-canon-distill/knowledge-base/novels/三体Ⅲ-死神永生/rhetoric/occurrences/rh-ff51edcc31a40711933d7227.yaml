chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 设想把大范围空间的曲率无限增大，像一张纸一样对折，把“纸面”上相距千万光年的遥远的两点贴在一起
sensory_mapping: 平展纸张；两枚远点；纸面弯折；边缘贴合；距离瞬间消失
context_fact: 文本回顾早期光速航行设想，并用空间折叠与随后确认的曲率驱动区分。
image_mechanism: 不可见时空被压成可拿在手中的纸，千万光年只剩纸面长度；手指一折，目的地不经航行便从远端翻到眼前。
property_alignment: 时空对应纸；空间曲率对应纸张弯度；起点终点对应纸上墨点；光年距离对应纸面间隔；极端弯曲对应对折；点重合对应位置邻接；无航程对应不沿纸面穿越
context_alignment: 紧接着曲率驱动被称为拖曳目的地，折纸模型提供读者理解‘改变空间而非加速穿越’的基础。
narrative_function: 直观说明一个旧方案的机制，并作为曲率驱动不瞬时折叠的比较基准。
transfer_rule: 用折纸解释空间邻接时，应逐项对应连续面、面上位置、曲率变化、外在折叠和沿面距离与嵌入距离的差别。
failure_boundary: 模型不能推出真实空间可任意撕折、折叠点无能量代价，或物质会自动穿过接触面；这些纸张属性需明确止步。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 空间折叠方案通过极端改变时空曲率，使原本相隔千万光年的两个位置直接邻接
vehicle: 把一张平展纸对折，让纸面上原本相距很远的两个墨点在三维中贴到一起
ground: 空间连续体对应纸面；宇宙位置对应纸上点；增加曲率对应折纸；遥远两点邻接对应折后贴合；航行距离消失对应不沿纸面移动
