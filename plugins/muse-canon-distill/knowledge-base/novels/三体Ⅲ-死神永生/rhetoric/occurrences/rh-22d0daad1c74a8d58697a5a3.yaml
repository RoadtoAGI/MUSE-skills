chapter: 【危机纪元元年，生命选项】
figure_type: metaphor
quote: 现在的地球，是生命为自己建的家园
sensory_mapping: 大气、海洋和地貌成为房屋结构，所有生物成为跨亿年协作的建造者与住户。
context_fact: 去掉生命的模拟地球干涸无海，说明现有宜居条件是生命与地球互相作用的结果。
image_mechanism: 家园把被动适应关系改写为反馈建造：生命既住在环境中，又通过代谢、演化和循环不断改造它。
property_alignment: 生命群体对应住户和建造者；大气海洋对应房屋生存设施；长期生态反馈对应持续施工维护。
context_alignment: 绿眼镜用此结论反驳智慧设计，把创造者位置从外部上帝转移给内部生命自身。
narrative_function: 收束生命选项实验的论点，并触发杨冬把同一问题外推到宇宙。
transfer_rule: 生态系统可写成家园建造时，必须呈现居民对环境的反向因果，不可只因适居便称为建造。
failure_boundary: 若环境完全先成、生命只被动入住，建造者关系不成立；短期个体行为也不能等同亿年共同反馈。
quality_assessment: exemplary
