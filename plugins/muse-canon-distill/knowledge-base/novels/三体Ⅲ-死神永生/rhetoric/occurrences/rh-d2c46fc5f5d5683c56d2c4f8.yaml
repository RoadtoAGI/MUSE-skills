figure_type: metaphor
quote: 人们屏息凝神，替全人类倾听末日判决，白Ice把这判决平静地说出来
sensory_mapping: 启示号舱室像临时法庭，全人类缺席坐在被告席，白Ice用光速两个字宣读死刑。
context_fact: 现有飞船不能达到光速，二维跌落覆盖整个太阳系，无一生命可逃。
image_mechanism: 司法判决把计算值从技术参数变成命运语言，平静宣读反而突出其不可申诉。
property_alignment: 物理计算对应审理依据；白Ice对应宣判者；全人类对应被告；光速答案对应死刑裁决；沉默对应法庭肃静。
context_alignment: 探测任务原本向总部汇报科学结果，此刻汇报变成对文明终结的法庭宣告。
narrative_function: 把逃逸速度揭示塑造成章节峰值，并让一个词承担全太阳系死亡重量。
transfer_rule: 技术结论写成判决时，应具备权威依据、受判对象、不可逆后果、宣读动作和申诉空间。
failure_boundary: 白Ice不是法官也未造成灾难，计算仍存在误差可能；判决强调接受效果而非法律责任。
