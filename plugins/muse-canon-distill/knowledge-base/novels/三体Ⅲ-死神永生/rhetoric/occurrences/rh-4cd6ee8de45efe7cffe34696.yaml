chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 仿佛是从顶端观看一道银光闪闪的瀑布浩浩荡荡地落向地球方向
sensory_mapping: 崖顶俯视；银亮水幕；浩荡下落；飞散水滴；远处地球低点
context_fact: 巨石向日面熔化，岩浆从边缘飞出后因核爆反光由暗红变为银亮。
image_mechanism: 无上下的太空由地球方向获得‘下方’，巨石边缘成为瀑布崖口；离散岩浆点在强光中连成一幅向地球倾落的银幕。
property_alignment: 巨石边缘对应崖顶；熔融岩浆对应水流；细碎颗粒对应水滴；强光反射对应银色水光；飞向地球对应向下坠落；太空艇视点对应瀑顶俯看；数量庞大对应浩荡
context_alignment: 观察者从背阳面看不到火球，熔岩反射形成的银瀑成为爆炸能量绕过巨石的壮丽证据。
narrative_function: 给复杂三维喷射一个明确方向与流量图像，增强试验奇观。
transfer_rule: 用瀑布写粒子流时，应有统一越界点、连续同向运动、上方视点、反光亮度和大量颗粒汇成流。
failure_boundary: 碎屑向四面均匀爆散、没有共同边缘或观察者从侧下方看时，瀑布方向会失准。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大量熔融岩浆碎片越过巨石边缘后被核光照成银亮，从艇的俯视方向成股飞向地球
vehicle: 从瀑布上方俯看，巨量银白水流越过崖缘，连续浩荡地向低处坠落
ground: 岩浆流束对应瀑布水流；越过石缘对应越崖；朝地球飞出对应向下坠；银色反光对应水光；大量连续碎屑对应浩荡水体
