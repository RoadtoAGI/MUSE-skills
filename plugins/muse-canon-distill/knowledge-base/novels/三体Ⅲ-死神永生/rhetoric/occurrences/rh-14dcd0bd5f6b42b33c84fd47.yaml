chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 美酒如河水般流淌
sensory_mapping: 酒从壶杯间不断倾下，桌席像河道，金红液体穿过欢宴人群。
context_fact: 庆典以极度丰盛展示王国繁荣，也掩护冰沙王子假装和解。
image_mechanism: 河流用持续流量替代静态数量词，使宴饮奢侈获得方向和速度。
property_alignment: 酒量丰足对应河水体量；连续斟饮对应流淌；宴席延伸对应河道；供应不绝对应水源不断。
context_alignment: 童话采用夸张丰盛景象，河酒与焰火花园、水晶宫共同构成盛宴套景。
narrative_function: 快速推高庆典规模与纵欲感，为王子在欢乐顶点发动阴谋制造反差。
transfer_rule: 液体数量比作河时，应交代连续供给、流向、覆盖尺度和场景容纳它的路径。
failure_boundary: 酒并未形成可航行河道，河流的自然来源与冲刷力不适用；这是数量夸张。
