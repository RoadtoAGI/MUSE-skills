chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 这很像几何学中的分形图案，把图中的任何部分放大，仍然具有同样的复杂度
sensory_mapping: 太空艇的平面图像像无穷分形，舱室里再开管线，管线里再开材料纹理，一层层没有空白。
context_fact: 降维把原来隐藏的全部内部点按几何规则摊开，真实分辨率直达基本粒子。
image_mechanism: 分形为无限细节提供熟悉数学模型，同时文本明确以实际分辨率突破理论图案受介质限制的边界。
property_alignment: 多尺度二维结构对应分形层级；局部放大对应尺度递进；持续复杂对应自相似；粒子分辨率对应极限层。
context_alignment: 前文将太阳系称为画，这里说明它不是普通画面，而是内部全部外翻的超复杂图纸。
narrative_function: 让读者理解二维化为何既零厚度又保留所有三维信息，并强化凝视会发疯的视觉过载。
transfer_rule: 无限细节类比分形时，应明确跨尺度复杂度、相似与不相似处、真实分辨率和观察限制。
failure_boundary: 二维展开未必严格自相似，分形只是复杂度类比；其映射规则与经典分形生成不同。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三维物体二维展开后从宏观构造到基本粒子尺度都显露结构、持续放大仍有新细节的图形
vehicle: 具有自相似层级的数学分形，任取局部放大仍呈现与整体相当的结构复杂度
ground: 复杂性跨尺度延续；局部包含大量结构；放大不会很快变成简单像素；观察层级近乎无限
