chapter: 《时间之外的往事》序言(节选)
figure_type: simile
quote: 像突然睁开的无数眼睛
sensory_mapping: 水珠的圆润反光被视觉化为眼白与瞳光，一次调光变成一片同步睁眼的动作。
context_fact: 叙述者在模拟环境中把太阳移向西天，斜照使田野水珠突然反光。
image_mechanism: 静止的露珠获得眼睑开启的瞬间动作，晶亮从物理反射转成了田野忽然苏醒并回望叙述者的场面。
property_alignment: 水珠成群密布对应无数眼睛的数量感；斜光下由暗转亮对应眼睛从闭合到睁开的突变；圆形光斑对应瞳孔中的高光。
context_alignment: 模拟世界可被随手调节，而田野又像有生命般响应，这与序言中回望往事的温柔、孤独同时相合。
narrative_function: 用一个可见的苏醒瞬间建立末世之后仍然鲜活的田园表面，并把观察者与被观察的世界互换位置。
transfer_rule: 描写大量微小物体同步亮起时，可选一个本身含有由暗到亮动作的群体性喻体，让数量、光变和时刻三项扣合。
failure_boundary: 若水珠持续闪亮、没有光线变化造成的突然亮起，睁开就失去动作依据；若亮点稀疏，也撑不起无数眼睛的包围感。
