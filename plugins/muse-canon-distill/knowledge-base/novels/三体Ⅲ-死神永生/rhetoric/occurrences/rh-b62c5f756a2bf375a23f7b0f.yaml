quote: 仿佛是从上方飘浮的城市沉淀下来的梦幻
sensory_mapping: 梦向下落；色彩沉底；城市悬上；画层凝结；幻想铺地
context_fact: 许多潦倒艺术家生活在太平洋一号，裸露球壁上的涂鸦位于漂浮建筑群下方并延伸极远。
image_mechanism: 抽象的城市想象被赋予重量，从无地权、无固定位置的悬浮生活中缓慢降落，最终在唯一稳定可见的球壁上结成彩色地层。
property_alignment: 飘浮城市对应上层液体；集体想象对应悬浮颗粒；艺术创作对应下沉过程；涂鸦对应沉积物；多代画作对应层积；裸球壁对应容器底部
context_alignment: 零重力本无真正上下，叙述却借观察位置建立“上城下壁”，让社会最轻的梦幻在物质最粗粝处留下永久痕迹。
narrative_function: 把涂鸦由装饰提升为城市集体精神的物质遗存，完成对贫穷而丰饶生活的概括。
transfer_rule: 用沉淀写文化痕迹时，应明确其来源群体、长期积累、落定表面和层叠结果，使抽象经验真正留下可见物。
failure_boundary: 画作由外来机构一次性布置、与上方居民无关，或表面不断清除不具积累性时，梦幻沉淀会虚构错误来源。
