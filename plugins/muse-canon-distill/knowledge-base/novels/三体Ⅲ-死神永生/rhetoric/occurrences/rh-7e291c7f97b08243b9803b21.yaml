chapter: 【时间之外，我们的宇宙】
figure_type: simile
quote: 这一切在程心和关一帆的眼中如梦似幻
sensory_mapping: 从末日蓝星一步跨进田园，又坐在智子茶案旁，场景真实得可触却像梦中不断换幕。
context_fact: 二人刚得知已进入647号小宇宙，周围空间周期复制，智子以古典礼仪为他们倒茶。
image_mechanism: 梦幻不依赖单一景物，而将连续的空间悖论与熟悉日常叠合为现实感失稳。
property_alignment: 跨宇宙突变对应梦境换景；复制世界对应幻象；故人重逢对应愿望成真；茶室可触对应清醒梦的鲜明感。
context_alignment: 程心经历过多次冬眠和时间跳跃，醒梦边界本就反复动摇，这个成语在她的时间经验里获得具体内容。
narrative_function: 暂时收束入门惊异，并让读者与人物共同接受小宇宙的新常态。
transfer_rule: 采用梦幻类常用比喻时，应在邻近语境列出具体的换景、规则违背和熟悉物错置，使成语有实体支撑。
failure_boundary: 小宇宙与智子均是真实技术存在，人物也能稳定生活；梦幻只表示初见时的认知冲击。
