chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 他的眸子中映着火把的火光，像灵魂在深井中燃烧
sensory_mapping: 瞳孔化作两口黑井，火把缩成井底细焰，像王子的灵魂被困在深处仍烧着夺位欲。
context_fact: 第一幅杀人画像完成，王子满意注视，地堡只由火炬照亮。
image_mechanism: 眼睛天然的深色圆面与反光点构成井和火，外部光景因此转成角色内部精神剖面。
property_alignment: 黑眸对应深井；火把倒影对应井底火；隐藏恶念对应深藏灵魂；夺位激情对应持续燃烧。
context_alignment: 地堡已比作巨怪腹腔，眼中再开深井，把空间恐怖进一步内收进主谋人格。
narrative_function: 在不作心理说明的情况下显露王子灵魂状态，为国王消失落下阴冷定格。
transfer_rule: 眼中火点写成深井燃烧时，应利用瞳孔形状、光点位置、包围暗度和人物欲望。
failure_boundary: 火光只是外部反射，不能证明存在实体灵魂或其被困；井深是视觉和道德联想。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 冰沙王子黑暗眼眸深处映出的微小火光及其隐藏、冷酷而炽烈的欲望
vehicle: 坠在幽深井底、被黑壁包围却仍独自燃烧的一团灵魂之火
ground: 亮点位于深黑内部；周围封闭幽暗；火焰持续；内在欲望难以触及；带地狱感
