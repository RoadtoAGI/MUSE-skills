chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 程心的目光平静如水
sensory_mapping: 氢弹警告落入她眼中像石子沉进深水，表面没有漾开波纹，只安静映着参谋长。
context_fact: 参谋长迟疑说明会面可能即时炸毁程心，她只微微点头，之后还计划获取对地球有用的信息。
image_mechanism: 静水把不动声色转成可见表面，危险信息是否在深处造成影响被保留，平静不等于空白。
property_alignment: 眼神稳定对应无波；克制反应对应水面不溅；专注倾听对应清晰映照；内在决心对应水下深度。
context_alignment: 她此前自杀时精神水面平滑，此刻相似平静来自承担风险而非麻木，同一水相显示人物状态变化。
narrative_function: 以极少表情建立程心的决绝，让参谋长在她面前显得更迟疑。
transfer_rule: 目光如静水时，应通过外部冲击、表面反应、映照对象和可能的深层活动证明平静。
failure_boundary: 平静不表示她没有恐惧或必然判断正确，水面也不能说明其真实心理深度。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 程心听到红灯三秒后氢弹毁艇的警告时仍不惊惶、鼓励参谋长继续的眼神
vehicle: 无风水面平坦安静，没有波纹、飞溅或急流，能够稳定映照眼前景物
ground: 表面无明显扰动；状态稳定；能清楚承接外界信息；深层情绪不从表面泄露
