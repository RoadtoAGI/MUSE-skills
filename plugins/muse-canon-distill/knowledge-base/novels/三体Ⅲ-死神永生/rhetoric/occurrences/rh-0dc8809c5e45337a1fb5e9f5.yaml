quote: 满意地把最致命的一击抛给她
sensory_mapping: 一句轻描淡写的惊喜在维德手中压成投射物，越过医院门口击中程心，使她脚下现实失稳。
context_fact: 云天明脑切除正在进行，程心在医院外痛苦等待，维德此时揭示赠星者身份。
image_mechanism: 抛把语言从告知改造成远距攻击，致命一击强调前置痛苦已把目标防线削弱，满意暴露施害者观看欲。
property_alignment: 秘密信息对应投射武器；刻意时机对应瞄准；轻声告知对应抛出；程心僵硬失地感对应被击中。
context_alignment: 维德此前持续欣赏她的绝望，此刻信息既真实又必要，却被他当作武器使用，完全符合角色行为方式。
narrative_function: 在手术结束前引爆情感真相，推动程心狂奔，也让维德的冷酷达到一次明确行动峰值。
transfer_rule: 消息如打击时，应呈现持有者、释放时机、命中反应和伤害部位；致命强度要由关系与情境支撑。
failure_boundary: 普通坏消息、无意泄露或接收者早已知情时，不构成蓄意投掷；心理致命并非真实生理死亡。
