chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 最远处的太空城距这里一千千米左右，看上去如玩具般小巧玲珑
sensory_mapping: 掌上模型；远处小点；完整轮廓；精致玩具；距离压缩
context_fact: 城市群距离从五十到一千千米不等，真实体量相近但视觉大小差异极大。
image_mechanism: 距离像缩放器把一颗人造星球压进掌心，城市内部数百万人和山海全部藏进玩具外壳；尺度事实与视觉印象分离。
property_alignment: 远城对应玩具；真实城市对应玩具原型；一千千米距离对应缩小比例；外壳轮廓对应模型外形；内部细节消失对应玩具简化；表观轻小对应可把玩尺度
context_alignment: 同句近城像星球、远城像玩具，以双参照直接展示太空无中景尺度带来的判断困难。
narrative_function: 用近远反差校准太空城群落深度，防止读者按画面大小误判实体。
transfer_rule: 用玩具写远距巨构时，应保留完整轮廓、因距离缩小、细节丢失、真实体量反差和视点明确。
failure_boundary: 对象本就小型、近距离可触，或细节因分辨率增强仍清晰时，玩具感不能说明距离。
quality_assessment: functional
confidence: 0.99
review_status: reviewed
tenor: 同样巨大的远端太空城因相隔约一千千米，在程心视野中缩成可把玩的精致小物
vehicle: 按比例缩小的玩具模型，整体轮廓完整但尺寸可握，宏大功能被压成观赏细节
ground: 远距视角缩小对应模型比例；完整外形对应玩具复制；细节不可辨对应小巧；真实巨构对应模型原型；可视轻盈对应玲珑感
