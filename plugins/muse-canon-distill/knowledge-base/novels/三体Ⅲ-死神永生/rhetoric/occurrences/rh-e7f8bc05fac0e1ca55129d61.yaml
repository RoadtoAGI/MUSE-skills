sensory_mapping: 五公斤像写在宇宙总账末尾的一粒小数，程心希望自然在结算坍缩时把它留在误差栏里。
context_fact: 关一帆认为其他拒绝归还的小宇宙已造成远大于五公斤的质量缺口，但临界系统也可能差一个原子就改变状态。
image_mechanism: 忽略误差把自然临界演化写成一次数值判定，五公斤从生态世界重新缩成可舍入的小数。
property_alignment: 大宇宙总质量对应计算总值；临界点对应判定阈值；五公斤对应测量误差；坍缩与否对应输出结果；自然演化对应计算者处理。
context_alignment: 程心履行宇宙责任后仍为微小生命保留例外，这句愿望精准呈现责任与慈爱的最后妥协。
narrative_function: 在终极宏观因果中为生态球争取微小伦理空间，形成全书最后悬念。
