tenor: 三体与地球两个文明断绝监视、通信和战争关系后彼此失联
vehicle: 曾有深厚纠葛的两个人在广阔道路上失散，再相遇也互不认识的陌生过客
ground: 过去关系密切；当前联系断裂；各自继续远行；未来重逢概率低；无法得知对方命运
