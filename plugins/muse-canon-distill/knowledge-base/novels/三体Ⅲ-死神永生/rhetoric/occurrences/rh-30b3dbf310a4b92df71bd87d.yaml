chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 再次成为宇宙中的陌路人
sensory_mapping: 两个世界像从同一路口分开的旅人，走入宇宙黑路，背影很快消失，彼此再无消息。
context_fact: 智子可能全部撤离太阳系，残存三体文明已处星舰状态，两边都前途未卜。
image_mechanism: 人格化的旅人关系把文明尺度失联转成日常陌生感，陌路兼具空间远离与关系清零。
property_alignment: 两个文明对应两名旅人；星际迁徙对应各走道路；断联对应成为陌生人；未知未来对应看不见去向。
context_alignment: 三世纪战争与亲密监视刚结束，陌路比敌人更空旷，贴合广播纪元突然失去对手后的真空。
narrative_function: 为威慑—移民时代收尾，并把下一阶段危机从双文明冲突转向宇宙未知。
transfer_rule: 文明失联写成陌路人时，应保留既往关系、分离路径、信息中断和未来偶遇的不确定。
failure_boundary: 文明内部含无数主体，未来也可能恢复通信；陌生人不能代表全部政治关系。
