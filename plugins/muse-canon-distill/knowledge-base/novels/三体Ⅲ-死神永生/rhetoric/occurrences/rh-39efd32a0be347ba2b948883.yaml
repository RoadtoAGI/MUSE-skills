chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 二维太阳已经变得很扁平，像从海岸看大海一样，它那不再发光的暗红色平面无边无际
sensory_mapping: 星环号像贴着岸线，暗红二维太阳从舷窗下缘铺到天际，已看不出圆盘，只剩无边海面。
context_fact: 飞船距二维平面很近且仍在跌落，太阳已熄灭，不再发光。
image_mechanism: 从海岸看海强调视角变化：同一圆面由远处天体变成近处地平面，尺度压迫随接近突然成立。
property_alignment: 二维面对应海面；星环号位置对应海岸；低角视线对应沿水面看；暗红广域对应无边海；持续跌落对应即将入水。
context_alignment: 城市沉入海、太阳成死海，最后画外人也来到海岸，整套液态意象抵达逃生边界。
narrative_function: 用观察几何显示飞船距死亡有多近，并把二维太阳由物体转成包围环境。
transfer_rule: 平面由正视转为海岸视角时，应说明观察角、圆面消失、地平线、范围感和主体相对边界。
failure_boundary: 二维太阳没有水和岸，暗红平面也不反射海光；相似来自低角度、平整与无边尺度。
quality_assessment: exemplary
