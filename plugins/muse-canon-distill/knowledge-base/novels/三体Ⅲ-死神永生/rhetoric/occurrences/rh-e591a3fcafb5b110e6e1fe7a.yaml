chapter: 【威慑纪元13年，审判】
figure_type: simile
quote: 像一堆永远无法归根的落叶
sensory_mapping: 失重人体再次成为落叶，淡蓝地球变成远离的树根，押送飞船是一阵反向风。
context_fact: 他们曾在返航减速中如落叶贴窗，如今相同动作伴随地球渐远，刑期在小行星带。
image_mechanism: 同一落叶框架发生方向反转：此前是落向母星拥抱，此刻是被带离根系；归根二字新增不可逆流放意义。
property_alignment: 囚犯失重飘落对应落叶；母星地球对应根与树；押送离地对应风吹远；终身监禁对应永不归根。
context_alignment: 这不是纯复指，而是用返航动作的原喻体反写审判结局，新映射落在根系与永久流放。
narrative_function: 以回环意象封闭返乡悲剧，让同一身体动作从希望变成永久失根。
transfer_rule: 延展旧喻体时，应保留核心形态并新增由情节反转产生的属性；新卡只在映射机制实质发展时成立。
failure_boundary: 若他们日后可返回地球或只是短期转运，永远无法归根过强；单纯再写飘落则应按复用排除。
