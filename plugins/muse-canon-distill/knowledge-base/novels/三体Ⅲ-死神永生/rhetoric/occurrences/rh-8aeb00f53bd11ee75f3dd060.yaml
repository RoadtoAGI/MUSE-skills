chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 是这个小世界的太阳
sensory_mapping: 半米生态球里，顶部一点灯光成为整片水陆的太阳，几条鱼和青草围着这枚微光维持自己的宇宙。
context_fact: 程心与智子制作全封闭生态球，发光体持续工作即可让内部生态系统生存。
image_mechanism: 功能命名完成极端尺度缩放：人工灯相对于半米世界承担恒星角色，局部生态由此获得完整宇宙结构。
property_alignment: 发光体对应太阳；生态球对应行星世界；绿藻青草对应受光生产者；能源持续对应恒星寿命；顶部位置对应天空光源。
context_alignment: 外部小宇宙太阳已拆除，程心仍在更小层级保留一个太阳，生命与世界递归缩进最后五公斤。
narrative_function: 让被拆空的647号仍留一处有光生命，并预备末段露珠折射阳光的收束画面。
transfer_rule: 小光源称太阳时，应证明它在相对尺度上承担照明、供能、生态维持和生命终止条件。
failure_boundary: 发光体不是核聚变恒星，没有引力中心或天体轨道功能，太阳身份只限生态作用。
