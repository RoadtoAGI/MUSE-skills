chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 我想让人类插上光速飞行的翅膀
sensory_mapping: 曲率引擎像一双装到人类文明背上的翼，一振便可越过恒星间黑暗，也可能把人群带入失控逃亡。
context_fact: 程心支持光速飞船研究，后来又为避免战争在联邦中制止相关计划。
image_mechanism: 翅膀把推进技术从交通工具升为物种能力跃迁，同时自然保留自由与危险共生的双面性。
property_alignment: 人类文明对应陆生者；曲率技术对应翅膀；星际航行对应飞起；逃离太阳系对应离地远行；战争风险对应失控飞行；禁研对应束翼。
context_alignment: 程心把技术愿望写成给予全人类的身体能力，符合她以保护生命而非征服为出发点。
narrative_function: 浓缩她在光速技术上的愿望与反向行动，显示责任阶梯每升一级都伴随价值冲突。
transfer_rule: 技术比作翅膀时，应说明原有束缚、新自由范围、飞行动力、操控门槛和可能坠落的风险。
failure_boundary: 光速飞船只服务能进入飞船的人群，不改变物种身体，也不能自动带来政治或精神自由。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 程心曾希望人类掌握曲率驱动，使文明能够以光速离开太阳系并获得星际自由
vehicle: 原本受困地面的生物长出翅膀，获得升空、远行、越过障碍和逃离危险的能力
ground: 新增运动器官；活动范围剧增；摆脱原有地面束缚；速度提高；可越过障碍；自由伴随失控风险；需学习使用
