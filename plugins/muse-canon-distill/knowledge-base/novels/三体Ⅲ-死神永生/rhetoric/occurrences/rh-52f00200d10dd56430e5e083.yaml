chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: simile
quote: 最后这段时间像蛛丝般被无限拉长
sensory_mapping: 最后数秒从钟面上被抽成一根发亮细丝，越等待越长，仍黏住程心不肯断开。
context_fact: 她已扔掉开关，水滴即将攻击，结果尚未显现且她认为解脱将至。
image_mechanism: 蛛丝将心理延时同时赋予长度、细度和张力，等待不再是空白停顿，而是持续受牵扯的触感。
property_alignment: 数秒延迟对应短丝被拉长；等待紧张对应丝线受力；时间连续对应蛛丝黏韧不断。
context_alignment: 宏大生命史刚压缩到最后几秒，微小蛛丝反向无限延展，贴合危机中的尺度倒置。
narrative_function: 延缓结果揭示，让程心的决定先成为不可撤回事实，再落下威慑终止。
transfer_rule: 写主观时间延长时，选取会在拉力下变长且保有张力的细物，并说明等待为何施力。
failure_boundary: 若人物平静走神或时间体验断裂成片段，连续蛛丝不合；无限只写感受，不是计时变化。
