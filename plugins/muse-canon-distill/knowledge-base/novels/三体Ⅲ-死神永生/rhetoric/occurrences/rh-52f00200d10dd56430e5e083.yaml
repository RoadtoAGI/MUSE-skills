tenor: 程心作出拒绝后仍在等待攻击结果的短暂主观时间
vehicle: 极细、黏连不断并能被牵出远超原长的蛛丝
ground: 客观尺度很短却感受绵长；连续而不易断；承受拉力时越来越细紧
