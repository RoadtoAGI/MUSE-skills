chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 程心这时感觉自己真的受到了无穷大的引力，这引力来自宇宙的各个方向，无情地撕扯着她的灵魂
sensory_mapping: 每个灭亡生命都像一颗天体从不同方向拉她，合成无穷潮汐力，把意识向千万方向扯开。
context_fact: 她想到无限宇宙引力叠加悖论，并把全地球历史生命的目光视为责任来源。
image_mechanism: 引力借科学悖论量化罪责：责任对象越多，合力越无限；撕扯又表现相互矛盾的道德要求。
property_alignment: 生命责任对应天体引力；对象数量对应无限源；内疚强度对应无穷合力；心理冲突对应潮汐撕裂；无处可逃对应全向作用。
context_alignment: 星环号靠曲率摆脱二维空间引力般洪流，程心身体逃出后，灵魂却落入更强的责任引力场。
narrative_function: 把内疚从抽象情绪提升为宇宙尺度身体灾变，显示活下去为何成为惩罚。
transfer_rule: 责任比作全向引力时，应明确力源、数量、方向冲突、撕裂部位和主体为何不能建立平衡。
failure_boundary: 责任无法物理叠加为无穷大，历史因果也不由一人承担；这是程心创伤性自责的主观力学。
quality_assessment: exemplary
