tenor: 程心放弃广播导致澳大利亚移民等巨大灾难，但广播最终仍由两舰启动，宏观结果回到原方向
vehicle: 行程原可沿直路到达终点，却因中途转向绕行一段漫长曲路后重新接回主路
ground: 起点与最终方向基本不变；中间路径显著延长；绕行付出额外代价；后来重新接入原进程
