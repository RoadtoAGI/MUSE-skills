chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 执剑人在最后时刻的放弃使历史绕了一个大弯
sensory_mapping: 历史道路本可直接通向广播，却在程心面前急转，绕过澳大利亚苦难的巨大弯道后才回到原线。
context_fact: 威慑失败后发生强制移民，一年后万有引力号广播，使太阳系与三体坐标仍然暴露。
image_mechanism: 道路把事件因果写成路线，宏观终点相同不再等于过程无差别，大弯的长度承载被延误的一年和灾难成本。
property_alignment: 启动广播对应目标方向；程心放弃对应转弯；移民灾难对应绕行路段；两舰广播对应重回主线。
context_alignment: 公众用终点相同来迅速平息讨论，弯路喻体既承认总体进程，也保留途中受难者不能被抹去的距离。
narrative_function: 概括对程心的历史评价，并解释事件为何在公共记忆中很快失去紧迫性。
transfer_rule: 历史如绕路时，应明确原方向、偏转事件、额外路程代价和重新接轨的节点。
failure_boundary: 历史没有预定终点，两舰广播也并非必然；弯路说法来自事后视角，可能低估分支不确定性。
