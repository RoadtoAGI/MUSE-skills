figure_type: simile
quote: 亚洲一号与两侧太空城之间的距离仅五十千米左右，能感觉到它们的巨大，像两颗星球一般
sensory_mapping: 两颗近行星；巨大弧面；悬空世界；视野被占；彼此并列
context_fact: 木星背面共有二十六座太空城，最近的两座距亚洲一号约五十千米。
image_mechanism: 人造城市的建筑细节在外部视角消失，外壳弧度和体量成为整颗星球；邻城不再像设施，而像另一个世界贴近悬浮。
property_alignment: 太空城对应星球；封闭外壳对应行星表面；城市人口对应世界居民；五十千米间隔对应天体近距；巨大视角对应行星压迫；独立生态对应自足世界
context_alignment: 程心刚从内部平凡街区出来，外部星球尺度反转她对同一城市的认知。
narrative_function: 标定近邻太空城的宏大尺度，并显示掩体群落由多个独立世界构成。
transfer_rule: 用星球写封闭巨构时，应由弧形外壳、视角占比、独立生态、人口世界和太空悬浮共同支撑。
failure_boundary: 结构细小开放、近距仍能一眼看全建筑细节，或不能自持人口时，星球会夸大完整性。
