chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 从一个狭小的摇篮世界中觉醒，蹒跚地走出去，飞起来，越飞越快，越飞越远，最后与宇宙的命运融为一体
sensory_mapping: 文明先在母星摇篮睁眼，摇晃着踏入太空，再长翼加速飞过星系，直到自身选择碰到宇宙生死。
context_fact: 地球与三体文明均从母星走向星际，小宇宙的质量选择最终关系大宇宙能否重启。
image_mechanism: 把技术史编排成人体成长动作，摇篮、学步、飞行依次对应活动自由度的跃迁，终点由空间扩张转成命运融合。
property_alignment: 母星对应摇篮；文明觉知对应醒来；初期航天对应蹒跚学步；光速技术对应飞行；星际扩张对应越飞越远；宇宙责任对应融入整体。
context_alignment: 程心的火箭、光速与宇宙责任个人履历正好复演这条成长线，使文明比喻由亲历者发出。
narrative_function: 在终章概括智慧文明共同轨迹，并自然引向‘与思想一样大’的显式总结。
transfer_rule: 文明成长类比生命发育时，阶段动作必须与技术自由度递增对应，并安排由移动到责任的成熟转折。
failure_boundary: 文明发展不必线性、单向或必然飞向宇宙，也可能衰退分裂；成长模型是概括性路线。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 智慧文明由母星起源，发展航天与光速能力，活动半径和责任逐步扩展至影响宇宙终局
vehicle: 幼儿在摇篮中醒来，学步走出家门，成长后长翼飞行，速度距离不断增加，最终进入更大整体
ground: 有出生容器；早期能力弱且步态不稳；先走后飞；移动能力递增；活动范围由近到远；成熟伴随更大责任；个体最终融入宏大命运
