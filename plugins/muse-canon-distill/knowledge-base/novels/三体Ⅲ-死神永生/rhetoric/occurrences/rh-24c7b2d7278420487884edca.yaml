chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 人类文化使三体世界睁开了一双新的眼睛
sensory_mapping: 三体文明的集体面孔睁开第二双眼，自然与人性从黑暗中显形，文化作品成为进入瞳孔的新光。
context_fact: 三体方面称人类文化引发其社会革命，改变政治结构，使其体验过去未觉察的自然和人性之美。
image_mechanism: 新眼睛强调增加感知器官而非灌输结论，适合文化提供观看方式、让主体自己重新认识世界的过程。
property_alignment: 文化输入对应视觉器官形成；审美能力对应新视力；未觉察意义对应旧盲区；社会改变对应看见后行动。
context_alignment: 后文人类文明也从三体镜像中重新观看自己，两种视觉喻体共同构成文化反射的互视系统。
narrative_function: 把三体文化转型写成感知革命，增强交流成功的可信美感，同时为伪装可能保留观察窗口。
transfer_rule: 文化如新眼睛时，应指出原盲区、新可见对象和看见后的行为改变；避免把接受等同机械服从。
failure_boundary: 若受众早已具备同类审美、文化只提供信息而不改变观看方式，新眼睛会夸大断裂。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类文学艺术与价值观让三体文明获得过去缺失的审美、人性和生命意义认知方式
vehicle: 原本看不见某类景象的主体新长出并睁开一双眼，突然获得新的视觉通道
ground: 新的文化能力扩展感知范围；此前存在却未被觉察的意义和美由此进入意识
