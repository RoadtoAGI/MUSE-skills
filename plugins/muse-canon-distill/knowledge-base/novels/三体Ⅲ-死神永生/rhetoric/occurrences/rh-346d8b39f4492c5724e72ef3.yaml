tenor: 用纤细双手从完整头颅中无损取出大脑的想象动作
vehicle: 从草丛摘蘑菇、从枝头摘花的轻柔采集动作
ground: 手指围住脆弱对象后完整分离；动作轻缓精细且对象离开原位仍保持形状
