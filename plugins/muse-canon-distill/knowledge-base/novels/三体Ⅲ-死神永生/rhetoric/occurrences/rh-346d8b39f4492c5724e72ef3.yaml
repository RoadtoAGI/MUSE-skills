chapter: 【公元1453年5月，魔法师之死】
figure_type: analogy
quote: 像从草丛里摘一朵蘑菇，从枝头上摘一朵小花
sensory_mapping: 血腥手术换成指尖触碰草木，触觉从切割阻力转为折断菌柄或花梗的微小反馈。
context_fact: 大脑外观完整无破损，皇帝观察狄奥伦娜纤细手指并想象其取脑过程。
image_mechanism: 两个采摘动作共同拆除剖开、切断、损伤的常规取脑过程，只保留轻触、轻摘、完整拿走三步。
property_alignment: 完整大脑对应保持形态的蘑菇或花；纤细手指轻取对应采摘；器官与身体无损分离对应花梗折离后主体仍完整。
context_alignment: 证据只有完整大脑和无伤尸体，皇帝只能借最日常的无损取物动作补足不可见过程。
narrative_function: 以轻柔日常动作反衬生理恐怖，并用过程类比具体说明异能效果。
transfer_rule: 解释不可见操作时，可把结果拆成动作步骤，再选择读者有触觉经验的日常操作；并列喻体用共同步骤互相校准。
failure_boundary: 大脑若有切口、挤压或残缺，采摘的完整性就不成立；若过程含暴力拉扯，蘑菇和小花会美化错误动作。
