chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 程心感到维德指向她的不是手指，而是一把剑
sensory_mapping: 伸出的手指在程心视野中拉长变锋，会议桌成为对峙场，她被剑尖从人群中挑出。
context_fact: 维德发现全场只有程心未嘲笑自己，越过资历层级要求她立即提出意见。
image_mechanism: 手指与剑共享狭长指向，替换后加入锋刃和攻击意图，把普通点名升级为高压考验。
property_alignment: 手指方向对应剑尖瞄准；突然点名对应出剑；权力压力对应锋刃威胁；程心茫然对应被迫接招。
context_alignment: 维德以竞争和攻击组织工作，随后又以执剑理念贯穿全书，这次手指之剑是角色权力方式的早期缩影。
narrative_function: 强化程心发言前的压力，并使她从被审视的技术助理转成必须以方案接招的人。
transfer_rule: 指向如剑需利用形态同构、权力差和应答风险；被指者应出现躲避、僵直或接招式反应。
failure_boundary: 友好邀请、平等轮流发言或手势没有锁定性时，利剑会无端添加敌意；手指也没有真实伤害力。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 维德突然点名程心发言时，指向动作带来的强制、锋利和威胁感
vehicle: 一把直刺目标、迫使对方立即应对且可能造成伤害的利剑
ground: 动作方向集中并锁定单一对象；被指者感到无法回避、稍有失误便会受创
