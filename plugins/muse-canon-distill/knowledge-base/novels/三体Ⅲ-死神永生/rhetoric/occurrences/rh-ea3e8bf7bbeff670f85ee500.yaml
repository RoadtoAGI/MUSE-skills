chapter: 【威慑后一小时，失落的世界】
figure_type: simile
quote: 那是从地下喷出的尘埃，十分浓密，以至于看上去像是固体
sensory_mapping: 本应飘散的尘粒压成一整块暗物，远看拥有可触碰的厚壁和体积。
context_fact: 程心来到地面，远望水滴摧毁地下天线后形成的蘑菇状喷尘。
image_mechanism: 固体化取消云的轻、透、散，直观呈现喷发规模与浓度的反常。
property_alignment: 尘云不透光对应固体遮挡；浓密连续对应实体表面；轮廓突兀对应块体边缘。
context_alignment: 一切景物仍平静，唯一像实体般压在地平线上的尘云承担世界失陷的物证。
narrative_function: 先建立云的物质压迫，再为图层异物和丑陋头像两次视觉重读提供底图。
transfer_rule: 把气体写成固体时，应落实到透光、边界和体积感，借材质反转突出异常浓度。
failure_boundary: 近看尘埃仍会流动扩散，不能从视觉固体感推断真实相态或硬度。
