chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 在太阳或月亮如水的冷光中
sensory_mapping: 失去热量的银光像一层薄水漫过建筑和人脸，所有轮廓都浸在冷白里。
context_fact: 聚变太阳已停止供热，只留照明，人们聚到它周围也只能寻找一点光明和温暖。
image_mechanism: 水把不可触的光赋予凉意和液态覆盖感，消除太阳应有的火热，使人工世界显出死亡温度。
property_alignment: 银色光泽对应水光；冷光对应凉水；洒落对应流淌；人群缝隙透光对应水穿隙；无热量对应无火性。
context_alignment: 二维平面即将像水面上升淹城，水样月光先在视觉上把太空城浸没。
narrative_function: 统一城市末日画面的色温，并为苍白面孔、蚁群和随后上涨的二维水面建立感官底色。
transfer_rule: 光比作水时，应明确色温、流动方向、覆盖表面、是否传热及后续水意象的呼应。
failure_boundary: 光没有液体质量、湿度或真实流动，水感仅来自冷色、均匀铺展和视觉反射。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 核聚变太阳只供照明后洒在停转太空城与人群上的银色冷光
vehicle: 清冷透明、均匀漫过表面且没有温度的一层水
ground: 色泽银冷；覆盖连续；触感似凉；流过缝隙；只传亮度不传热；环境寂静
