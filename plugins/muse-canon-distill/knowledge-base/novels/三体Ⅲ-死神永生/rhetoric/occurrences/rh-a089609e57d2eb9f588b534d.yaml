chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 特别是当它还没有被生命和文明篡改扭曲的时候
sensory_mapping: 新宇宙像一份尚未落笔涂改的原稿，生命和文明还没在维度与光速上留下删改、折痕和歪曲。
context_fact: 关一帆相信规律战争把十维近无限光速宇宙改成当前状态，想亲眼看新宇宙原貌。
image_mechanism: 篡改把文明从自然产物改写成干预原作的编辑者，扭曲同时含文本改写与形体变形两层损害。
property_alignment: 原初宇宙对应原稿；自然规律对应原文结构；文明武器对应擅改工具；降维降速对应删改扭曲；田园和谐对应作品完整。
context_alignment: 宇宙学家关一帆将观察新宇宙视作看原始证据，‘篡改’体现他对文明干预的审美与科学反感。
narrative_function: 为等待新宇宙提供私人动机，并把规律战争主题带入小宇宙安居段。
transfer_rule: 系统原貌比作被改作品时，要确定原版结构、修改者、修改手段、可见变形和价值损失。
failure_boundary: 生命本是宇宙演化的一部分，未必都损害规律；‘原初更美’是关一帆价值判断。
