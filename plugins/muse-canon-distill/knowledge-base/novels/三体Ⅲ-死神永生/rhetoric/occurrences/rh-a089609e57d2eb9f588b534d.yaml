tenor: 新宇宙刚创生、尚未受到文明使用规律武器改变维度和物理常数的原初状态
vehicle: 一份原本和谐完整的作品、文本或规则被后来者擅自改写并扭曲原貌
ground: 存在原始版本；后来行动者介入；修改出于自身目的；结构被改变；原貌难恢复；完整性和美受损；可比较前后版本
