chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 留下的人都过得像国王一样，每个人都住在宽阔的庄园里，都有自己的森林和湖泊
sensory_mapping: 一人一庄园；森林作庭院；湖泊私有；空旷王国；持枪出门
context_fact: 地球只剩不到五百万人，大自然重新覆盖大陆，留下者居住宽阔但要防范野兽。
image_mechanism: 人口退潮把普通居民周围的土地突然放大成王室尺度，每个人都获得森林和湖泊，却没有臣民与安全，只剩领地外观。
property_alignment: 居民对应国王；庄园对应宫苑；森林湖泊对应王室领地；资源丰裕对应特权享用；极少人口对应少数占有者；枪械防兽对应荒野边疆
context_alignment: 比喻只指物质占地的奢阔，随后“必须带枪”立即拆出荒凉代价，使地球生活既富足又危险。
narrative_function: 用熟悉的最高生活等级快速量化人口锐减后的资源反差，同时保留末世荒野的讽刺。
transfer_rule: 以国王写资源丰裕时，应出现个人可支配的大面积土地或稀缺物，并交代这种特权由何种人口或权力结构产生。
failure_boundary: 人物仅收入较高却没有领地级资源，或生活受严密公共配给约束时，“国王”会把普通富裕夸成统治权。
