figure_type: simile
quote: 这飞蝗群一般的车辆都是飞向发射港的
sensory_mapping: 空中蝗群；密集黑点；同向迁飞；城市上空覆盖；群体嗡动
context_fact: 黑暗森林打击传闻后，城市车辆全部涌向太空发射港寻求逃生。
image_mechanism: 飞行车的金属差异在远景中缩成虫点，众多路线合成一股迁飞方向；城市交通从有序网络变成受惊虫群。
property_alignment: 飞行车对应蝗虫；车流对应蝗群；飞向发射港对应迁飞；紧急逃生对应受惊群动；数量浩荡对应虫灾密度；投下影子对应虫群遮光
context_alignment: 车辆平时代表个人技术控制，危机中却群体化成昆虫，显出文明理性在逃难本能前的缩减。
narrative_function: 以群体生物运动表现城市逃亡规模和失序压力。
transfer_rule: 用飞蝗写空中交通时，应有大量小型个体、密集覆盖、共同迁飞方向、紧急本能和远景难分。
failure_boundary: 车辆稀疏排队、路线多向且受精确调度时，蝗群会抹掉秩序。
