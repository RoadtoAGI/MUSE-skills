chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 它与地层不发生作用，就像一个幻影
sensory_mapping: 发光方框从厚重地层中无声上浮，土石既不裂开也不沾附，像影子穿过墙面。
context_fact: 门在时间之外保存近一千九百万年，检测到目标后从岩石旁自行上升。
image_mechanism: 幻影把场态装置最反常的物质关系转成鬼魅穿透，视觉存在与触觉缺席并列。
property_alignment: 可见亮框对应可见幽影；穿过地层对应穿墙；不相互作用对应无实体；地层无损对应不留痕。
context_alignment: 装置本就悬在时间与空间常规之外，幻影贴合人物尚不知原理时的观察层级。
narrative_function: 在揭示传送功能前先确立门不服从普通物质规则。
transfer_rule: 实体装置比作幻影时，应提供可见、可移动、可穿透和不留物理后果的共同证据。
failure_boundary: 装置有稳定结构、识别能力和传送功能，不是虚幻影像；幻影只解释其穿透行为。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 宇宙之门从三十米深地层升到地面时穿过土石而不碰撞、不受阻
vehicle: 无实体、可穿透物质且不与环境发生接触的幽灵幻影
ground: 缺少实体碰撞；能穿墙穿土；外观可见；不留下扰动；运动不受介质阻碍
