tenor: 低光速黑域既让太阳系显得安全，又能在边界处通过相对论效应粉碎外来高速攻击体
vehicle: 置于广大危险环境中的坚固保险柜，以封闭厚壁隔绝盗抢和冲击，保护柜内珍贵内容
