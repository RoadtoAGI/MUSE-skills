quote: 人们把黑域称为宇宙保险拒
sensory_mapping: 宇宙保险柜；低光速柜壁；文明锁入；攻击撞碎；内外隔绝
context_fact: 高速攻击体进入低光速区会因前后部速度效应自毁，太阳系内部任何物质也无法越过视界逃出。
image_mechanism: 无形光速阈值变成保险柜实体壁，外来武器在柜面折断，文明也被一并锁在内部；安全与囚禁由同一个容器结构同时产生。
property_alignment: 黑域对应保险柜；视界对应柜壁；文明对应贵重物；安全声明对应上锁标志；攻击体对应撬柜者；粉碎效应对应防护；低光速对应锁具；封闭世界对应柜内空间
context_alignment: 黑域是三条生路中安全性最高却自由代价最大的方案，保险柜准确保留“保护越强、开启越难”的两面性。
narrative_function: 将复杂边界效应压缩为一个防护容器，并提前暗示安全即自我封闭。
transfer_rule: 用保险柜写防御系统时，应有明确内外边界、受保护核心、外来破坏被阻断和内部进出同样受限。
failure_boundary: 防御只拦外敌却允许内部自由通行、边界可轻易关闭开启，或保护对象并不珍贵时，保险柜会夸大封闭代价。
