chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那微笑像冰封的河面上一条冰缝中渗出的冰水，在冰面上慢慢弥散开来
sensory_mapping: 僵硬脸面成为冰河，嘴角笑纹成为冰缝，笑意沿面部扩散成一层更冷的水。
context_fact: 维德面无表情，程心试图以微笑建立礼貌交流，却被他的第一句话冻结。
image_mechanism: 通常微笑应融冰，此处笑本身也是冰水；动作满足面部变化，温度后果却反转社交预期。
property_alignment: 固定冷脸对应冰封河面；细微笑纹对应冰缝；笑意慢慢展开对应渗水弥散；无温暖对应冰水低温。
context_alignment: 维德的礼貌表面服务于审视和攻击，冰水式笑容准确表达形式出现而情感功能缺席。
narrative_function: 让微小表情成为威胁预兆，以动态冷意完成维德初次压迫。
transfer_rule: 反写惯常暖意时，可保留表情运动而更换介质温度；介质的扩散方式应与面部变化速度对应。
failure_boundary: 真诚放松的笑、快速大笑或使旁人感到温暖时，冰缝渗水的慢冷机制全部失效。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 维德脸上出现却不带温暖、缓慢扩开的微笑
vehicle: 从冰河裂缝渗出并在冰面扩散的冰水
ground: 细小变化从固定表面裂口出现；扩散缓慢却与周围同样寒冷，不增加温度
