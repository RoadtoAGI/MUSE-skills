chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 每秒十几千米的真空光速是一个铁一般的宇宙常数
sensory_mapping: 被战争压低的光速冷却成一根铁尺，婴儿科学拿它丈量宇宙，并相信铁尺从来如此。
context_fact: 低光速区扩散连通后会平衡为新C值，与今天三十万千米每秒的C地位相同。
image_mechanism: 铁把认识论确信赋予材质硬度，随后“常数其实被改变过”的设定又揭示铁也只是凝固的战争结果。
property_alignment: 恒定数值对应铁硬度；普遍适用对应统一材质；理论基准对应铁尺；难以改写对应不弯；历史降低对应被铸成。
context_alignment: 前文原子以铁的规则投射二维，此处科学以铁常数解释宇宙；铁意象持续表现规律的冷硬与误认。
narrative_function: 让“物理常数有战争史”这一反直觉命题获得可触摸的认识论反差。
transfer_rule: 常数比作硬材料时，应同时说明观测稳定性、理论用途和可能被忽略的历史生成过程。
failure_boundary: 常数没有材质，稳定也不等于永恒不可变；铁一般描述后生文明的确信。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 后生文明观察到的统一低光速被科学认定为绝对稳定、不可改变的基础常数
vehicle: 像铁一样坚硬、固定、无法弯折或被外力改写的实体规则
ground: 测量值稳定；适用范围广；观察中无例外；被视为不可变；构成其他理论基础；表面坚固却有形成历史
