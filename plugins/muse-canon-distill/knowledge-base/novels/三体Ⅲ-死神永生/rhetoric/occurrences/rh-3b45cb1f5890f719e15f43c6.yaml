tenor: 画像中国王忽然失去日常威严、显出迷惑震惊的神情
vehicle: 从逼真梦境突然醒来、尚未辨清现实而神志摇晃的瞬间
ground: 认知骤变；旧确信消散；短时迷惑；现实带来冲击；表情未完全稳定
