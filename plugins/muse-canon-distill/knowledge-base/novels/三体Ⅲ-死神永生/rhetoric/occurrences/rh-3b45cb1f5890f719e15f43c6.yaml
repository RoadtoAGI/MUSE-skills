chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 国王的目光中没有了威严和睿智，而是透出一种极其复杂的东西，如梦初醒
sensory_mapping: 王冠下的眼神像刚睁开，熟悉寝室忽然失真，威严还来不及重新戴回脸上。
context_fact: 画像捕捉国王身体消失前感知背叛与死亡的刹那，而现实中的他仍在寝室。
image_mechanism: 梦醒提供从安稳无知到惊觉危险的时间切口，使一幅静态肖像包含前后状态。
property_alignment: 宴后安睡对应做梦；突遭魔法对应惊醒；迷惑对应未辨现实；威严消失对应意识断层。
context_alignment: 庆典本是幸福梦境，王子背叛让国王在画像中醒来，童话表层由此破裂。
narrative_function: 让画像提前呈现受害者死亡意识，提升魔画的预知性和残酷度。
transfer_rule: 震惊表情比作梦醒时，应标出此前安稳、触发突变、短暂迷失和新现实。
failure_boundary: 国王未必真的做梦，梦醒也不能涵盖悲哀和恐惧全部层次；它只写认知断裂。
