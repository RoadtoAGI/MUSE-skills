chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 四维空间向三维跌落，像瀑布流下悬崖
sensory_mapping: 四维空间像河面抵达维度悬崖，整片结构翻过边缘，向三维低处持续倾泻。
context_fact: 蓝色空间号曾目睹四维碎块坍缩，人类现在正遭遇三维向二维的同类过程。
image_mechanism: 瀑布用高度差和连续流解释抽象维数差，跌落动词因具体悬崖模型获得方向。
property_alignment: 四维对应上游高面；三维对应低处；维度蜷缩对应越崖下落；空间连续转化对应水流；不可逆对应落水难返。
context_alignment: 白Ice梦中沙瀑已预演此模型，此处将直觉图景接回已有四维观测证据。
narrative_function: 提供全场景核心物理类比，使逃逸速度和船在瀑顶划行的后续推理可理解。
transfer_rule: 维度转化借瀑布解释时，应固定高低维、边界、流向、连续性和逆转条件。
failure_boundary: 维度没有经典空间高度，转化也非重力水流；瀑布只提供动力学直觉。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 高维空间在边界处失去一个维度、连续转化并扩展到低维空间的过程
vehicle: 河水越过悬崖边缘，在重力下持续落入更低平面形成瀑布
ground: 存在高低层级；转换跨越边界；流动连续；低处吸引更多上游介质；越界后难以逆返
