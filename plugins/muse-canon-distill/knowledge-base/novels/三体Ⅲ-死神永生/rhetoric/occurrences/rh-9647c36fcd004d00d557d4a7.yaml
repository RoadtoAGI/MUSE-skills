chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 像登上了山顶俯视一般，默斯肯大旋涡展现在他们面前
sensory_mapping: 山顶视点；巨大谷地；倾斜坡面；深处小孔；全景展开
context_fact: 小艇刚被旋涡水流捕获，进入直径约一千米的巨大漏斗状凹陷上缘。
image_mechanism: 海平面不再水平，而在浪带后突然向下翻成山谷；船所在高缘成了峰顶，视线沿三十度水坡一直坠到轰鸣孔洞。
property_alignment: 旋涡边缘对应山顶；水墙对应山坡；旋涡凹陷对应谷地；涡底对应谷底；越过浪带对应登顶；全貌显现对应俯瞰无遮挡
context_alignment: 海通常没有俯瞰高差，山顶视角把异常水面曲率立即翻译成陆地地形，帮助读者定向。
narrative_function: 一次性建立旋涡的垂直尺度与观测位置，为后续下滑制造高度恐惧。
transfer_rule: 用登顶俯瞰写凹陷全景时，应匹配高缘视点、连续坡面、低处中心、遮挡突然解除和明确向下方向。
failure_boundary: 观察者位于涡底、视野被浪遮蔽，或水面几乎无高差时，山顶俯瞰会错置空间。
quality_assessment: functional
confidence: 0.99
review_status: reviewed
tenor: 小艇越过外缘浪带后从旋涡高处看见完整漏斗凹陷及其向深处收束的水墙
vehicle: 登上山峰后视线越过遮挡，俯瞰整片山谷、坡面与谷底
ground: 旋涡外缘对应山顶；倾斜水墙对应山坡；涡底孔洞对应谷底；全貌突然可见对应登顶开阔；向下视线对应俯瞰
