property_alignment: 云天明童话对应《圣经》；隐语对应启示；IDC成员对应释经者；反复附会对应经义阐释；现实焦虑对应信仰困境；心理慰藉对应宗教安抚；证伪弱化对应经典权威
context_alignment: 前文故事像筐写政治装填，此处《圣经》进一步指出装填背后的心理需求，错误解读从利益转向信仰。
narrative_function: 标记IDC方法从情报分析滑向精神寄托，解释掩体寓意为何缺证仍流行。
