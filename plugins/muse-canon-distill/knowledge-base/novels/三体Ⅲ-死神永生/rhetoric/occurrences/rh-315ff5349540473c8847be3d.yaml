chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这人类历史上最长的七年在他们的脸上都留下了沧桑
sensory_mapping: 七年像海陆翻转的年代压过众人的面孔，皱纹和灰发成为缩小的海岸线与桑田沟壑。
context_fact: 这些人七年前参与执剑人交接，此后经历文明几乎毁灭和三体星系灭亡，如今再次与程心会面。
image_mechanism: 沧桑借极长地质式变化扩大七年主观长度，脸成为承载时代变迁的地表。
property_alignment: 七年巨变对应沧海桑田；面部衰老对应地貌痕迹；共同经历对应同一时代冲刷；不可恢复对应地景改换。
context_alignment: 终端站正以环层展示两个世纪历史，人物脸也成为七年地层，两种时间刻痕在会面处叠加。
narrative_function: 无需逐人交代经历便恢复七年前关系，并标记这段短时历史对幸存者异常漫长。
transfer_rule: 时间在脸上成地貌时，应提供事件密度、可见痕迹、观察前后对照和主观长度来源。
failure_boundary: 沧桑已高度词汇化，且外貌不能完整代表心理经历；有人也可能没有明显衰老。
quality_assessment: conventional
confidence: 0.95
review_status: reviewed
tenor: 七年威慑失败、移民和末日等待给PDC与舰队人员外貌留下的疲惫衰老痕迹
vehicle: 海洋变成桑田般的漫长地貌巨变，在表面刻下不可逆的年代变迁
ground: 时间虽按日历不长却变化巨大；外表留下可见印记；经历不可逆；观察者能从痕迹读出历史重量
