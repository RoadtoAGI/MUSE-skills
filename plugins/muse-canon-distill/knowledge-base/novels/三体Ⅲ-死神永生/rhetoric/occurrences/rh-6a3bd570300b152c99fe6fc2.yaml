chapter: 【危机纪元4年，云天明】
figure_type: metaphor
quote: 云天明的心彻底凉下来，也彻底平静了
sensory_mapping: 求生欲的热量从胸腔撤走，冷却同时让此前翻动的情绪表面变平。
context_fact: 权威医生确认癌细胞全身扩散、钱也无法改变结果；他当日下午递交安乐死申请。
image_mechanism: 凉与静沿同一热力过程相连：希望这一热源熄灭，情绪不再沸动；平静因此是终局降温而非安慰。
property_alignment: 希望消失对应热源撤除；求生挣扎停止对应分子运动降低；决定安乐死对应系统进入稳定冷态。
context_alignment: 前文一线希望刚被切断，冷却正好承接细线断裂后的归零，并直接转化为申请行动。
narrative_function: 用一个温度终点收束求生尝试，标明死亡决定由不确定进入确定。
transfer_rule: 情绪温度变化应同时对应驱动力和运动状态；写彻底冷却时，后续行为要表现决策稳定而非继续反复。
failure_boundary: 若人物随后重新燃起强烈求生欲或激烈失控，彻底凉静就被否定；悲伤痛哭也不等于平静冷却。
