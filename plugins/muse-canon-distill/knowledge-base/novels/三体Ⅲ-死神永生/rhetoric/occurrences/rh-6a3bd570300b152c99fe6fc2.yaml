review_status: reviewed
tenor: 专家确认无治愈可能后云天明的希望消失与情绪停止波动
vehicle: 失去热源后完全冷却、运动趋于静止的物体或液体
ground: 能量与活跃程度同时下降；降至稳定低态后不再产生明显波动
