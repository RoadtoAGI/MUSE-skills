chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 就像舰尾被一把无形的巨刀削掉了一段
sensory_mapping: 千米级舰体成为可削材料，尾部斜面成为刀锋收势处，消失的五分之一像被整块带离视野。
context_fact: 舰外巡查者看见标准圆柱飞船突然变短且尾端成斜面，但船内系统没有异常。
image_mechanism: 巨刀把难以把握的维度截面降到切削经验，无形则保留最惊人的因果断层：有切口而没有工具和过程。
property_alignment: 舰体骤短对应一段被削走；尾部斜面对应刀锋切面；尺度巨大对应巨刀；无报警与无过程对应刀具无形。
context_alignment: 前文舱内球面断口已有无形利刀模型，此处放大为整舰尺度，构成异常从局部向整体的实质升级。
narrative_function: 让读者立即看懂四维相交的宏观后果，并把零散诡异事件汇成飞船级危机。
transfer_rule: 同一破坏机制升级时，可保留切削动作并同步放大刀具和缺失尺度；新一层必须增加结构后果。
failure_boundary: 若舰尾爆炸、扭曲或留下大量碎片，削掉的光洁斜面不成立；巨刀只是观察模型，不能说明真实存在切具。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 四维碎片使万有引力号舰尾约五分之一在三维观察中消失的外观
vehicle: 一把看不见且尺度足以截断巨舰的刀，斜向削去完整一段物体
ground: 缺口边界巨大、平整并呈斜面；破坏过程和施力来源完全不可见
