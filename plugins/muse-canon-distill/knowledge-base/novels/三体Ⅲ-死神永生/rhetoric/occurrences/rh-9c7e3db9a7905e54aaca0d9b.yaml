chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 将它映成了金红色，像地球温馨的晚霞
sensory_mapping: 发动机火光染透尘埃，黑太空升起一片金红云霞，像地球傍晚在两条航路之间最后亮一次。
context_fact: 冬眠飞船返乡、两舰远行，两批人在同一时刻分向起航，魔戒尘埃仍留在附近。
image_mechanism: 晚霞以现场金红色为入口，把发动机尾光从工业现象转成一天将尽的故乡天色，离别因此获得时间感。
property_alignment: 尘埃金红对应晚霞色谱；发动机照明对应落日余光；快速消失对应暮色短暂；地球记忆对应温馨感。
context_alignment: 一队回地球、一队永离地球，双方都在太空看见故乡晚霞，热泪来自共享而方向相反的归属。
narrative_function: 把两支人类种子分航写成一次共同黄昏，在永恒之夜到来前留下温暖停顿。
transfer_rule: 异域光景如故乡天色时，应同时匹配颜色、持续时间、人物行程节点和可证实的记忆来源。
failure_boundary: 光来自聚变发动机而非太阳落山，太空也没有地平线；晚霞的温馨依赖地球文化记忆。
