chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 海是为了她空着，就像王宫中公主的宫殿空着等她入住一样
sensory_mapping: 空白海面；敞开宫门；无人房间；等待主人；一叶白帆入住
context_fact: 饕餮鱼已清空沿海船只，公主却把灾难造成的空海理解为供自己远航的空间。
image_mechanism: 危险的海面在她想象中升起宫墙，整片蓝色空房向主人敞门；尚不存在的白帆像即将搬入的唯一家具，让空无变成邀请。
property_alignment: 海面对应宫殿空间；船只缺席对应房间空置；公主对应宫殿主人；未来白帆对应入住物；航行愿望对应进入房间；为她而空对应专属预留
context_alignment: 公主只熟悉王宫的专属秩序，便用宫殿理解第一次见到的海，童真想象暂时遮住饕餮鱼危险。
narrative_function: 把空海从死亡证据反转为召唤，增强公主必须出航的欲望。
transfer_rule: 用空房写广阔空间的召唤时，应有明确主人、空置状态、进入欲望、即将占据的标志物和人物经验来源。
failure_boundary: 空间拥挤封闭、人物没有归属或进入意愿，或空旷只引发恐惧时，等候入住会强加欢迎意味。
