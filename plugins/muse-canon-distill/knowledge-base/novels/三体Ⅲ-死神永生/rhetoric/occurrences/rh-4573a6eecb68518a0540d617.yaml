chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 太空中充满了眼睛，都在盯着她，恐龙的眼睛，三叶虫和蚂蚁的眼睛，鸟和蝴蝶的眼睛，细菌的眼睛
sensory_mapping: 黑空不再有星，只剩恐龙、三叶虫、蝴蝶、细菌乃至千亿双人眼，从每个方向逼近程心。
context_fact: 罗辑目光已像审判火炬，程心又将其扩展为四十亿年生命共同的终审凝视。
image_mechanism: 眼睛把抽象受害者逐一变成观看主体，责任关系由她回望历史反转为历史全体回望她。
property_alignment: 灭亡生命对应眼睛；因果追问对应凝视；历史总量对应满空密度；内疚对应被盯；无处逃对应全向视线。
context_alignment: 二维行星曾像巨眼盯住她，此刻外部天体眼内化成所有生命眼，目光意象完成宇宙到良知的迁移。
narrative_function: 把物种灭绝责任推至感知顶点，并为AA一双真实眼睛的下一句形成从无限到一人的收束。
transfer_rule: 历史责任写成众眼凝视时，应具体列出跨时代主体、视线方向、被审对象和先前凝视意象来源。
failure_boundary: 许多生物没有人类式道德判断，细菌也无眼；幻觉属于程心自我审判而非受害者真实指控。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 程心在内疚幻觉中感到地球生命史上所有受太阳系毁灭波及的生命都在审视和追责她
vehicle: 宇宙空间被无数物种的眼睛塞满，所有视线同时锁住同一个受审者
ground: 观看者数量无法计；来自四面；视线聚焦一人；跨越物种与时代；被看者无处躲藏；凝视带审判意味
