chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 有一点是肯定的：宇宙正在死去
sensory_mapping: 每失去一个维度、每降低一次光速，宇宙就像少一次呼吸，正从尚能活动的身体缓慢走向停息。
context_fact: 现存宇宙被描述为规律战争后的残态，低维和低光速区域仍在扩张。
image_mechanism: 生命过程为跨亿年的物理退化建立方向感，‘正在’把终局从静态结论改成此刻仍发生的衰亡。
property_alignment: 维度丧失对应器官失能；光速下降对应生命活动减慢；损伤扩散对应病情恶化；归零静止对应死亡；现存运动对应尚未断气。
context_alignment: 程心刚自认精神已死，宇宙死亡把个人创伤扩到最大尺度，使她的内外世界同构。
narrative_function: 用一句确定判断压过前面的猜测修辞，把航程情绪推向噩梦与恐惧。
transfer_rule: 系统衰退写成死亡时，应明确仍存功能、逐步失去的能力、不可逆机制和停止终点。
failure_boundary: 宇宙没有生物意识和代谢，其终态也可能发生新大爆炸；死亡只表示结构与活动终止。
