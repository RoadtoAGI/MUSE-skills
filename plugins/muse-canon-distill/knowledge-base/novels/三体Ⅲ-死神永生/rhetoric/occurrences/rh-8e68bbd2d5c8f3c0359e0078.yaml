tenor: 宇宙因持续降维、光速降低和规律武器造成的不可逆结构退化而趋向终结
vehicle: 生命体的功能逐步衰竭，活力减少，最终停止一切活动并死亡
ground: 结构持续退化；可用自由度减少；过程不可逆；终点为静止；局部损伤积累至整体；时间尺度漫长；仍未完全死亡
