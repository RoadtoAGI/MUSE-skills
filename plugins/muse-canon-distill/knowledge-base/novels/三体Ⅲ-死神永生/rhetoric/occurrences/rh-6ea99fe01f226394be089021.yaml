chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 她要使自己变成一架没有感情的录音机和摄像机
sensory_mapping: 她清空意识，眼睛变成镜头，耳朵变成麦克风，大脑像无声存储器等待两个小时信号写入。
context_fact: 会面禁止任何记录和转发设备，若程心不能返回，地球得不到任何信息。
image_mechanism: 机器化把记忆任务拆成两个感官通道，去情感要求则显示私人重逢被公共使命强行改造成采集工作。
property_alignment: 眼睛对应摄像机；耳朵对应录音机；大脑记忆对应存储；压抑感情对应机械中立；回程汇报对应回放。
context_alignment: 她要见的是跨三世纪的爱人，越不可能无感，机器喻体越能显示自控压力和任务悖论。
narrative_function: 在通信开启前明确程心的策略，为后来情感涌动与信息隐喻之间的冲突设定基线。
transfer_rule: 人物如记录设备时，应分别对应输入通道、存储目标、被排除的人类反应和数据最终用途。
failure_boundary: 人脑会选择、遗忘并受情绪影响，程心无法真正成为机器；完全无感还可能妨碍理解隐含信息。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 程心主动压下与云天明有关的情感，只求尽可能准确、完整记住会面声音和画面
vehicle: 机械录音录像设备不参与内容、不受情绪干扰，只按输入连续保存可回放的信息
ground: 接收过程追求客观；容量需留给数据；情感判断被暂停；声音和图像同时记录；任务结束后向他人转述
