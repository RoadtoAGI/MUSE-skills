chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 加速滑向二维平面，滑向那厚度为零的深渊
sensory_mapping: 那张无厚度平面像竖在太空中的无底裂口，启示号沿看不见的斜坡滑向黑渊。
context_fact: 二维区域实际只有面积无厚度，飞船仍全功率也不能超过光速逃逸。
image_mechanism: 零厚度与深渊形成悖论：几何上没有深度，后果却吞掉全部三维深度，恰好表现降维恐怖。
property_alignment: 二维边界对应渊口；空间流动对应下坡；飞船接近对应滑落；三维消失对应坠入无底；不可逃对应无回路。
context_alignment: 梦中一切坠入沙坑深渊，现实把那一意象改成厚度为零的平面，直觉与物理在矛盾中重合。
narrative_function: 在船员关闭发动机前持续标示死亡方向，并将数学平面重新赋予情感深度。
transfer_rule: 无形边界比作深渊时，应利用进入后果、运动方向、不可逆性，并正视几何属性冲突。
failure_boundary: 二维面没有物理深度或黑暗谷底，深渊只表示三维对象不可返回的消失。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 启示号随空间流动不断接近二维区域，进入后将失去厚度并全员死亡
vehicle: 深不见底的悬崖或裂谷吞掉坠入者，边缘之后没有可返回立足面
ground: 趋近不可逆边界；进入意味着毁灭；内部不可见；主体被引向其中；恐惧来自深度与无底
