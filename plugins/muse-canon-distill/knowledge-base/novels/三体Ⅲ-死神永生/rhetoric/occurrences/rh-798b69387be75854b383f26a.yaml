chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 他们将永远与母亲星球同在一个平面上
sensory_mapping: 逃不出的三个人最终会落到地球巨画旁，像漂泊子女回到母亲身边，永远贴在同一张平面。
context_fact: 程心原想回地球落叶归根，实际来到冥王星，但整个太阳系都会进入同一二维面。
image_mechanism: 母亲隐喻把无法逃脱重新解释为归属，二维死亡因与地球同在获得最低限度的情感安慰。
property_alignment: 地球对应母亲；人类对应子女；文明起源对应出生；太空迁徙对应离家；共同二维化对应返母相伴。
context_alignment: 开篇落叶归根愿望没有在航线实现，却由宇宙坍缩以更绝对方式实现，首尾形成悲剧性满足。
narrative_function: 收束地球哀悼段，并给三人接受最后归宿提供克制、带亲缘的语言。
transfer_rule: 故乡比作母亲时，应落到出生、养育、离家、返回和共同终点，避免只作抽象赞美。
failure_boundary: 行星没有母性意志，人与地球同平面也不等于有意识团聚；安慰来自文化情感投射。
