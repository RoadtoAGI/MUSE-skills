tenor: 三人最终二维化后将与诞生人类的地球共同存在于二维空间
vehicle: 子女在生命终点回到母亲身边，与给予自己生命和家园的母亲永久相伴
ground: 生命来源；养育关系；情感归属；死亡后重聚；共同位置；无法割断的血缘感
