chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 城市像一个在太空中旋转的大轮子
sensory_mapping: 黑空巨轮；轮辐放射；外环旋转；轴心空洞；圆影缓动
context_fact: 星环城采用少见的轮辐构型，太空艇需从轴心沿八千米辐条进入环侧城市。
image_mechanism: 复杂太空城被远景轮廓压缩为一个可辨机械部件，轴、辐、环的工程结构正好逐件显形，旋转不再是抽象参数而是巨轮动作。
property_alignment: 轴心入口对应轮毂；长通道对应轮辐；环形城市对应轮圈；整体转动对应车轮旋转；离心重力对应轮缘速度；太空背景对应无地面悬轮
context_alignment: 星环城为追求结构强度牺牲开阔世界感，大轮意象准确保留其工程性、封闭性和功能优先的城市性格。
narrative_function: 在接近城市时提供一眼可懂的空间模型，为随后的轴心进入和单侧居住区定位。
transfer_rule: 用车轮写环形巨构时，至少应有明确轴心、放射连接件、连续外环和整体旋转，且各部分在叙事中承担相应功能。
failure_boundary: 结构只有空心圆环而无辐条、旋转轴不穿中心，或城市静止不产生离心效应时，车轮模型会添加不存在的部件。
quality_assessment: functional
confidence: 0.99
review_status: reviewed
tenor: 采用轮辐结构、整体绕轴旋转以产生重力的星环城
vehicle: 一只由轮毂、辐条和外轮缘组成的巨大车轮，在空中绕中心轴持续转动
ground: 城市轴心对应轮毂；八千米通道对应辐条；居住大环对应轮缘；整体旋转对应车轮滚转；圆形侧影对应轮形；轮缘离心重力对应旋转效应
