figure_type: analogy
quote: 同两个多世纪前第一轮危机开始时一样，人们并没有把这种黑暗同自己的命运联系起来
sensory_mapping: 两次相隔两世纪的危机场景叠在一起，同一群人背对远处黑暗，只看脚下尚亮的生活。
context_fact: 第二舰队最初被估计仍需两三个世纪抵达，现世代因此认为可平安度过一生。
image_mechanism: 历史类比把新危机放回已知行为模型，重复的不只是事件类别，而是危险距离、代际利益和集体否认机制。
property_alignment: 两次舰队威胁都在远未来；两代人都预期自身无恙；两次社会都把当前生活置于后代安全之前。
context_alignment: 大低谷记忆本应改变反应，却反而成为拒绝牺牲的理由，使重复带有制度学习失败的讽刺。
narrative_function: 建立历史轮回判断，并为三天后光速航迹粉碎安全预期蓄势。
transfer_rule: 历史类比应列出时间距离、行动激励和群体反应的同构点，再用关键差异推动新转折。
failure_boundary: 第二舰队已有光速技术且很快抵达，客观时间条件不同；类比只覆盖最初认知和社会心理。
