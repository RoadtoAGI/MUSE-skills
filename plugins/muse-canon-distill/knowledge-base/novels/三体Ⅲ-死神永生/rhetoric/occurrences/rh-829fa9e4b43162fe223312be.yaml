chapter: 【时间之外，我们的宇宙】
figure_type: simile
quote: 小世界沉浸在如水的月光中
sensory_mapping: 银白月色从天空灌满田园，房屋、麦地与溪边背影都像浸在一层清凉透明的水里。
context_fact: 程心深夜醒来寻找独坐溪边的关一帆，并从他的背影看出忧郁。
image_mechanism: 水把无形光线变成可包围身体的介质，清凉和静压为关一帆尚未说出的忧虑提供氛围。
property_alignment: 月光遍布对应水体充满；银亮透明对应清水；夜间凉感对应水凉；景物被照对应物体浸没；静谧对应无波水面。
context_alignment: 上一段时间像溪水流过，此处月光又成水，田园水意象从日常安稳转为夜间忧郁。
narrative_function: 把温和夜景染上凉意，平滑引出小宇宙质量流失与宇宙责任的谈话。
transfer_rule: 月光比水时，应指定它如何填满空间、改变温度感和包围物体，并让情绪随水态变化。
failure_boundary: 月光不会产生液体阻力、湿度或真实低温，水感来自视觉与情绪联觉。
