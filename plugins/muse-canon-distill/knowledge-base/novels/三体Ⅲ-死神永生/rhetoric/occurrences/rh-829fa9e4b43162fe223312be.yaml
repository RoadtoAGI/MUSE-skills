tenor: 人工月亮照遍647号小宇宙田园的清冷、均匀夜光
vehicle: 透明水体铺满并包围空间，使其中物体浸没在清澈、柔缓、略带凉意的介质中
ground: 覆盖整个环境；光线清澈；亮度柔和；具有凉意联想；边界均匀；物体仿佛被包围浸入
