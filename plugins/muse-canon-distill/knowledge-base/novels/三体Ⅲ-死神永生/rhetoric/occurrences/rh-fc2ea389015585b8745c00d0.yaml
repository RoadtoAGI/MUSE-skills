chapter: 【威慑后第一年，移民完成后第六天清晨，澳大利亚】
figure_type: simile
quote: 自己就坐在这空旷的大地正中，像大洪水后唯一的幸存者
sensory_mapping: 欢呼的海水从她四周退远，脚步雨停，潮湿般的寂静里只剩一个人坐在裸露地面上。
context_fact: 澳大利亚移民开始回乡，程心拒绝陪送，在听觉恢复空旷时感到晨光照到脸上。
image_mechanism: 幸存者图景把声音退潮后的寂静解释为灾后地貌，程心虽处获救时刻，主观位置仍在废墟中心。
property_alignment: 人群离开对应洪水退去；空广场对应裸露大地；程心独坐对应唯一幸存者；威慑灾变余波对应洪灾刚过。
context_alignment: 她曾被全民视为导致灾难的人，如今真正的广播者救回众人；唯一幸存者兼有活着与被世界留下的双重意味。
narrative_function: 收束连续的冰冻、海啸、暴雨意象，把公共解放后的程心定格为孤独余生者。
transfer_rule: 用灾后幸存者写孤独时，应先建立席卷性的前置事件，再让环境退空、主体留下和情绪反转同时发生。
failure_boundary: 广场没有遭真实洪水，程心也非唯一存活的人；喻体只限定于失明者感到的人群撤空与心理遗弃。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人群散尽后，失明的程心独自留在广场中央所感到的极端孤立
vehicle: 席卷世界的洪水退却后，唯一活下来的人坐在重新露出的荒芜陆地中央
ground: 周围原有群体突然消失；主体独处开阔空地；巨变刚刚过去；幸存伴随空虚而非欢庆
