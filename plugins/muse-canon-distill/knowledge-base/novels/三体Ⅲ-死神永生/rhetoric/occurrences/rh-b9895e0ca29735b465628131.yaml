chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 像沥青一般浓稠的黑暗
sensory_mapping: 黑暗不再是空无，而像温稠沥青灌满眼前，贴住眼球并封死所有光隙。
context_fact: 程心睁眼仍什么也看不见，转向东方也无法想象初升太阳。
image_mechanism: 沥青把视觉缺失转成有密度的物质覆盖，浓稠说明黑暗为何似乎比普通闭眼更深。
property_alignment: 全黑对应沥青颜色；不透光对应材质不透明；包围感对应黏稠附着；无法看穿对应厚层。
context_alignment: 外部世界正显露比黑暗更黑的屠杀，物质化黑暗反而成为隔绝现实的保护层。
narrative_function: 稳定失明后的感官基线，为黑色太阳与深渊幻觉提供介质。
transfer_rule: 黑暗比作黏稠物时，应匹配颜色、透明度、包裹感和行动或感知阻力。
failure_boundary: 黑暗没有质量、温度或黏性；若仍有零星亮点，均质沥青会过度封闭。
