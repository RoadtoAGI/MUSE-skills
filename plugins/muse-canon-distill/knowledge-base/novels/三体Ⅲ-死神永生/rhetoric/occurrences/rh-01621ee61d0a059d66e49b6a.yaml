chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 像飘浮在一艘巨轮周围的小舢板
sensory_mapping: 巨轮居中；舢板环围；黑海漂浮；大小悬殊；小艇成群
context_fact: 联邦舰队大部分力量已部署在星环城四周，但单艘恒星级战舰仍远小于太空城。
image_mechanism: 太空被铺成黑海，太空城成为压住画面的主船，通常庞大的战舰被比例缩成一圈小艇；军事优势因此与视觉弱小形成张力。
property_alignment: 太空城对应巨轮；战舰对应舢板；城市巨大外壳对应船体；舰只散布对应小艇围泊；无重力悬浮对应水面漂浮；舰队数量对应舢板群；封锁动作对应围船
context_alignment: 星环城缺少战舰却拥有反物质子弹，视觉上“大轮—小艇”的比例不能直接代表火力，恰好引出后续脆弱壳体与非常规武器的博弈。
narrative_function: 快速标定太空城与恒星战舰的尺度，并为常规舰队难以安全强攻建立直观背景。
transfer_rule: 用小艇围巨轮写力量部署时，应同时匹配中心目标的体积、外围单位的数量与机动方式，并允许尺度和战力不是同一结论。
failure_boundary: 外围战舰体量接近或大于目标、编队并非环绕，或中心设施不是完整巨构时，舢板围轮会误导比例。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 二十多艘恒星级战舰分布在体量远胜它们的星环城周围执行包围封锁
vehicle: 一群轻小舢板散浮在巨型海轮四周，虽数量多却在母船尺度前显得微不足道
