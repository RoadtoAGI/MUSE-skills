chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 低光速下，狭义相对论魔鬼般的律法仍然有效
sensory_mapping: 光速虽然降下来了，相对论的判决却没有松动，像魔鬼按原条文执行，让蓝星岁月在他们眼前流血般飞走。
context_fact: 穿梭机以当地光速绕蓝星运行，外界时间相对舱内以千万倍速度流逝。
image_mechanism: 魔鬼律法把中性公式转成带施害意志的强制秩序，突出物理规律正确运作本身就是人物灾难。
property_alignment: 相对论规则对应律法；无例外生效对应强制执行；时间膨胀对应惩罚；人物无能为力对应受审者；冷酷结果对应魔鬼性。
context_alignment: 程心即将再次错过千万年，人物感受需要的不是公式解释，而是面对不可申诉判决的伦理恐惧。
narrative_function: 将科学必然性人格化为敌对力量，为紧接的流血时间比喻提供施害者。
transfer_rule: 规律比作恶法时，应明确适用条件、不可申诉性、具体惩罚和人物被迫服从的处境。
failure_boundary: 物理规律没有恶意或立法者，‘魔鬼’是程心对有害后果的价值投射。
