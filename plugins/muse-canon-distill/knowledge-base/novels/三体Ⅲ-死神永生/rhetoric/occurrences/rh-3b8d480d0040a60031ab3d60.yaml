tenor: 狭义相对论在低光速区仍强制产生极端时间膨胀，使地面年代在穿梭机短时内飞逝
vehicle: 冷酷魔鬼制定并执行、不给受害者通融且以痛苦后果惩罚违抗者的律法
ground: 规则强制生效；主体无法逃避；执行冷酷无情；后果巨大；不考虑人的愿望；一旦进入适用范围便受支配
