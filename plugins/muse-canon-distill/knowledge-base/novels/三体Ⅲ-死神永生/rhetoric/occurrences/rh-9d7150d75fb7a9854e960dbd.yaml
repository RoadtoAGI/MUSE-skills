chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 她像是在目不转睛地看着江面的流水，不知不觉中感到不是水在流，而是人在向上游走
sensory_mapping: 交响声部成为江面水纹，听觉视野固定后，旋律流向反转成程心身体向上游远行。
context_fact: 音乐像古典交响，令她想起长江童话，厚重雄浑又从容舒缓。
image_mechanism: 先让音乐成为水流，再利用视觉运动错觉把被动聆听改成主体逆流旅行，具体化被带得很远。
property_alignment: 旋律连续对应江流；节奏从容对应稳定水速；沉浸失参照对应人似移动；体验深化对应向上游远行。
context_alignment: 长江框架来自前一电影，此处新增参照反转和逆行机制，说明音乐把她带回文化源头。
narrative_function: 把跨感官艺术体验变成空间迁移，表现未来文化对公元人的深层牵引。
transfer_rule: 音乐如流体可继续发展参照错觉；需明确流向、节奏稳定和主体位移感，避免只说旋律流淌。
failure_boundary: 断奏、无稳定方向或听者保持分析距离时，凝视水流造成的自移错觉不成立。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 程心聆听厚重、从容的未来音乐时产生的持续推进与逆向位移体验
vehicle: 凝视长江水流后产生参照错觉，仿佛观察者自身沿河向上游移动
ground: 连续流动介质提供稳定方向；沉浸使主体失去静止参照，感觉自己被带离原位
