tenor: 程心一句核弹不在飞船上让全场哄笑突然停止
vehicle: 手掌按住正在振响的锣面使余振立即消失
ground: 持续响声被一个精准动作截断；截断并非逐渐减弱，而是消除支撑振动的条件
