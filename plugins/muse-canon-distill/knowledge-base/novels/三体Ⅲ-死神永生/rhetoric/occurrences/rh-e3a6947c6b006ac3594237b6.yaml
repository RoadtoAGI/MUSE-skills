chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她这句话像一只手捂在锣面上，使周围的笑声戛然而止
sensory_mapping: 会议笑声合成一面锣的震动，短句成为落在锣面中心的手掌，空气余响被按平。
context_fact: 众人嘲笑飞船携带核弹会过重，程心指出核弹预先布置、飞船无需载弹。
image_mechanism: 她不是提高音量压过笑声，而是移除笑声赖以成立的误解，正如按锣从源头终止振动。
property_alignment: 哄笑响亮持续对应锣面振动；关键反驳对应手掌按面；笑声骤停对应余振被吸收。
context_alignment: 技术事实简短却改变整个方案判断，捂锣比喝止更能表现靠精确知识而非权威控制会场。
narrative_function: 完成程心从被嘲笑到掌握注意力的瞬时逆转，为方案揭示腾出静场。
transfer_rule: 写群声骤止时，应判断触发是威压、惊讶还是逻辑消解；若一句话抽掉共同前提，适合用直接阻尼声源的动作。
failure_boundary: 笑声若只是逐渐变小、被更大声音覆盖或听众仍不理解，手捂锣的即时彻底性会失配。
quality_assessment: exemplary
