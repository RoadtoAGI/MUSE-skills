chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 她面对着一只没有眸子的空眼球，透出一种荒凉的茫然
sensory_mapping: 半圆大厅成为眼眶，弧形白墙铺成眼白，正中瞳孔位置空着，整只巨眼无目标地朝程心张开。
context_fact: 控制中心内部洁白无物，随后黑衣罗辑在中央显现，成为一个黑点并使眼睛有神。
image_mechanism: 几何形似先建立眼球，眸子缺失再把空旷转成精神状态；罗辑到场补上瞳孔，使空间与人物功能完全扣合。
property_alignment: 半圆大厅对应眼球曲面；白墙对应眼白；中央空无对应缺眸；荒凉无焦点对应眼神茫然；罗辑黑影对应后来瞳孔。
context_alignment: 执剑人本质上持续注视三体世界，控制大厅化为眼睛后，罗辑正是让威慑凝视成立的视觉器官核心。
narrative_function: 把极简空间转成角色化巨眼，并以罗辑成为瞳孔表现个人意志如何赋予系统威慑生命。
transfer_rule: 建筑如器官时，应先匹配几何部件，再让人物或设备承担器官功能；缺失部件可表现空间情绪。
failure_boundary: 若大厅有复杂家具、多个视觉焦点或罗辑不在中央，空眼球构图会散；茫然是观察者感受而非建筑意志。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 半圆控制大厅、弧形半透明白墙和全白地面顶板共同形成的空旷视觉结构
vehicle: 失去瞳孔、只剩苍白球面并无法聚焦观看的空眼球
ground: 空间轮廓呈弧形球面且中央空缺；缺少焦点和生命主体，使整体显得失神、茫然
