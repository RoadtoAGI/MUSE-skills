chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 在她的眼中，浴缸中平静的水面变成了漆黑的太空，白色的小纸船在这无际的虚空中以光速航行
sensory_mapping: 黑水太空；白船星舰；浴缸无际；船尾降张；虚空滑行
context_fact: AA按童话制作肥皂纸船，程心立即把表面张力差的驱动机制对应到曲率驱动设想。
image_mechanism: 尺度在一次凝视中跃迁：瓷缸边界消失，水面暗成太空，几厘米纸船保留白帆轮廓却获得光速；关键不是外观，而是前后梯度驱动机制同构。
property_alignment: 水面对应空间；表面张力对应曲率；香皂对应曲率调节装置；纸船对应星舰；前方拉力对应空间牵引；此岸彼岸对应星际距离；船尾孔对应发动区；微观实验对应宇宙航行
context_alignment: 这是云天明双层隐喻的中间桥梁：童话小船先指向现实肥皂船，再由实验机制指向曲率飞船，卡片保留两层连接。
narrative_function: 把抽象曲率驱动变成可观察实验，并让读者与程心同步完成解码。
transfer_rule: 用桌面实验类比宇宙机制时，应匹配驱动梯度、运动方向、主体位置和因果顺序，尺度可变而机制不可只靠形似。
failure_boundary: 纸船靠外力推行、张力前后相同，或曲率飞船并非由后低前高的梯度驱动时，这一类比只剩漂亮幻景。
quality_assessment: exemplary
