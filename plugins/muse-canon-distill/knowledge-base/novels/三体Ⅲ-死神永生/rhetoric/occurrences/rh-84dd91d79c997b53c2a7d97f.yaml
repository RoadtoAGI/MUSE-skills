tenor: 肥皂降低船尾水面张力、前方张力拉动纸船的实验，被程心理解为降低飞船后方空间曲率、由前方曲率拉动的光速航行
vehicle: 浴缸水面化作宇宙空间，小纸船化作白色星舰，在前后表面性质差中跨越无际虚空
ground: 浴缸水面对应空间膜；水面张力对应空间曲率；肥皂降低后方张力对应熨平后方空间；前方拉船对应高曲率牵引；纸船对应飞船；浴缸两岸对应星际起终点；快速滑行对应近光速航行
