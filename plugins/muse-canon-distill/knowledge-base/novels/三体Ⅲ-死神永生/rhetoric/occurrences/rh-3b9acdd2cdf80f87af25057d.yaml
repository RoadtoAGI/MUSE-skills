chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 太空城像鸡蛋一样脆弱
sensory_mapping: 薄壳巨蛋；一击开裂；内部外流；完整骤碎；脆响失压
context_fact: 太空城外壳一旦被击穿就会泄漏大气，自卫队又拥有能摧毁战舰乃至城市的反物质子弹。
image_mechanism: 宏伟城市的尺度被武器威力反向缩小成掌中蛋体，坚固巨构只剩一层维持生命的薄壳；一点破裂足以从局部伤害跃迁为整体死亡。
property_alignment: 城市壳体对应蛋壳；封闭大气对应蛋内液体；居民设施对应内部组织；穿透武器对应敲击；泄压对应蛋液流出；整体灾难对应蛋体破碎；外强中脆对应完整外观
context_alignment: 前文太平洋一号已被比作漏底袋，此处鸡蛋进一步强调战争条件下薄壳城市无法承受哪怕少量命中。
narrative_function: 用最短句确立对峙的灭绝性风险，解释联邦舰队和程心为何必须阻止开火。
transfer_rule: 用鸡蛋写封闭巨构时，应有薄壳承压、内部生命高度依赖密封、局部破损可扩展为整体失效，以及相对于打击手段的巨大脆弱差。
failure_boundary: 结构有厚重装甲、多层分舱和自动封堵，或局部破口不会威胁整体时，鸡蛋会忽略真实韧性。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 人口密集的太空城依赖薄壳维持气密，遭到反物质子弹或战舰攻击时极易整体破裂毁灭
vehicle: 鸡蛋以薄而封闭的壳包住内部物质，外观巨大完整却会被局部冲击轻易打碎并失去全部内容
ground: 太空城外壳对应蛋壳；内部大气居民对应蛋内容物；气密封闭对应完整蛋体；局部穿孔对应壳裂；结构整体失效对应鸡蛋破碎；相对武器威力对应手指击蛋
