figure_type: metaphor
quote: 老人活了一百五十多岁，但终于被时间所击败
sensory_mapping: 老人守阵；时间进攻；百年对峙；体力耗尽；终局倒下
context_fact: 程心从澳大利亚政府档案得知弗雷斯活到一百五十多岁，已在十多年前去世。
image_mechanism: 一百五十年的寿命被压缩成漫长擂台，时间不再中性流逝，而持续消耗对手；超常长寿表现为拖延败局，死亡则落下最终判定。
property_alignment: 弗雷斯对应抵抗者；时间对应进攻者；生命延续对应坚持战斗；高寿对应长期不败；衰老对应伤势累积；死亡对应最终败北；档案记录对应战果公告
context_alignment: 前文维德曾“没有被时光击败”，两位公元老人都以战斗衡量衰老；弗雷斯的结局回应这一时代仍无人能越过时间。
narrative_function: 用简短战败交代旧人终局，并加深程心返回地球后面对文明与个人消逝的感受。
transfer_rule: 用时间击败人写长寿终结时，应有超常持续期、可见衰老消耗和最终死亡，强调延缓而非真正战胜时间。
failure_boundary: 人物死于年轻时的突发事故、主动自尽，或时间跨度并不突出时，时间作为取胜对手会掩盖实际死因。
