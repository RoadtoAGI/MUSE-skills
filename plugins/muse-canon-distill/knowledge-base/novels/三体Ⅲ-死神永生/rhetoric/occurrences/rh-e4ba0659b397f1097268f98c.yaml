chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 您的美丽像正午的阳光刺伤了我
sensory_mapping: 公主的面容像午日迎面照来，针眼刚抬眼便被白亮刺退，画笔也落进阴影。
context_fact: 针眼以恭维掩饰超短观察，同时声称已把公主完整记在心里。
image_mechanism: 阳光把审美强度转成眼部刺痛，正午时点提供最大刻度，使迅速低头既像敬畏又像生理避光。
property_alignment: 美貌强烈对应午日高亮；短看低头对应避光；画笔无力对应其他视觉被压制；受冲击对应刺眼。
context_alignment: 露珠名字本属清凉微小意象，此处却被写成烈日，夸张符合宫廷童话赞美语。
narrative_function: 同时完成公主美貌定标和针眼观察动作的伪装，为画像危机蓄势。
transfer_rule: 美貌借强光呈现时，应匹配亮度、注视时长、身体反应和周围事物被压低的效果。
failure_boundary: 美貌不会造成光学灼伤，正午阳光的热量也不可转移；这仍可能是针眼策略性恭维。
