tenor: 露珠公主的美貌给针眼造成的强烈、难以直视且压倒画技的视觉冲击
vehicle: 正午最强烈的直射阳光，明亮到逼人移开视线并产生刺痛
ground: 亮度达到峰值；不能久看；刺激眼睛；压过观察者承受力；覆盖其他视觉对象
