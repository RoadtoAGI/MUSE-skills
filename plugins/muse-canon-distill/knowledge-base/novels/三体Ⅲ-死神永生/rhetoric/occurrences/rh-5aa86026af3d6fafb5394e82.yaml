chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 颗粒的晶面闪闪发光，像是几只不怀好意的眸子盯着他们
sensory_mapping: 显微颗粒长出瞳孔，晶面闪光成为眼神，屏幕前的宇航员从观察者反转成被盯住的目标。
context_fact: 这些颗粒是击穿管壁的微陨石残片，证明飞船外部防护出现了危险漏洞。
image_mechanism: 晶面与瞳光先完成形似，盯着再反转观看方向，不怀好意则把无生命碎片携带的灾害风险人格化。
property_alignment: 黑色颗粒对应瞳仁；晶面闪光对应眼光；多颗排列对应数只眸子；潜在破坏对应不怀好意。
context_alignment: 飞船人员原想用显微镜掌控事故原因，图像却在心理上回望他们，符合深空环境逐渐显出敌意的氛围。
narrative_function: 把微米级物证转成近身威胁预告，连接小孔事件与即将发生的宏观空间灾变。
transfer_rule: 颗粒如眼睛应同时利用暗色主体、点状反光和朝向关系；恶意必须来自其真实危险后果。
failure_boundary: 颗粒均匀无反光、没有面向观察者的视觉组织，或物质完全无害时，眸子与恶意都会失去依据。
