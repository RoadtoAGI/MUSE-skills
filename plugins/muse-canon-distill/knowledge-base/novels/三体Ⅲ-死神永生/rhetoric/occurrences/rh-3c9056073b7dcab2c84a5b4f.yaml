quote: 我觉得它像一扇门
sensory_mapping: 没有墙的林地中立着一个单独门框，程心从它的比例和姿态直觉到另一边并非原地。
context_fact: 关一帆起初认为只是存储器，随后手臂伸入框面便从当前空间消失。
image_mechanism: 门先由熟悉建筑轮廓触发功能猜测，紧接实验把形似推进到空间通道的实质类比。
property_alignment: 长方形亮框对应门框；框面对应门洞；穿过后消失对应进入别处；一侧到另一侧对应空间连接。
context_alignment: 程心比技术人员更早用生活物件命名装置，体现她由整体形象把握未知物的方式。
narrative_function: 用一句短直觉完成装置由遗留物到宇宙入口的叙事转向。
transfer_rule: 功能尚未揭示的物体借日常器物命名时，应让外形预示动作，并立即用可观察结果验证或修正。
failure_boundary: 它没有实体门扇或墙体，穿越对象也受参数筛选；普通门不能把物质送入另一宇宙。
