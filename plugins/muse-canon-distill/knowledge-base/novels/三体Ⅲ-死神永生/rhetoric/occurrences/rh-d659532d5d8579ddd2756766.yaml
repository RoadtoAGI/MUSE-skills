tenor: 若黑暗森林光粒击中太阳，恒星将猛烈爆发、发出巨光并把自身物质抛散，随后太阳系毁灭
vehicle: 节庆焰火被点燃后短暂爆出最大亮光和绚丽火团，迅速散成碎屑并彻底熄灭
ground: 太阳爆发对应焰火炸开；强光对应焰火亮闪；恒星物质抛射对应火花飞散；短暂壮观对应焰火寿命；爆发后消失对应燃尽；观众观看对应孩子目睹
