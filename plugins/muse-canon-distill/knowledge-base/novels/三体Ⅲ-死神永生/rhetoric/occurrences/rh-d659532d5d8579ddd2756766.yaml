chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 太阳将变成一团大焰火
sensory_mapping: 太阳焰火；巨光炸开；火屑四散；壮观一瞬；随后全无
context_fact: AA以不哄骗的方式回答孩子若警报为真会看到什么，紧接着说明焰火后“一切都没了”。
image_mechanism: 灭世天体事件被暂时装进儿童熟悉的节庆景观，亮度和爆散形态真实对应，却在“然后什么都没了”中突然撤走庆典语义。
property_alignment: 太阳对应焰火火团；光粒命中对应点火；恒星爆发对应炸开；抛射物对应火花；观测者对应看焰火者；短暂峰值对应焰火一瞬；毁灭后暗寂对应燃尽
context_alignment: 三个被数学题选中的孩子有理解现实的智力，AA用可视形态而非温柔谎言描述死亡，显示她粗粝而诚实的保护方式。
narrative_function: 让儿童可理解宇宙灾变，又以庆典与灭绝的反差压缩场景残酷性。
transfer_rule: 用焰火写爆炸天体时，应匹配骤亮、外向喷散、短持续和燃尽结果，并处理观赏美感与真实伤亡的反讽。
failure_boundary: 天体缓慢暗淡不爆发、物质向内坍缩，或事件可反复持续而不熄灭时，大焰火会错写动力学。
quality_assessment: effective
