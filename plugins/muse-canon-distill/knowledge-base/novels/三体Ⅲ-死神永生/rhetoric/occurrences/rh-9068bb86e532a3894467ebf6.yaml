chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 四十亿年的时光沉积在她上方，让她窒息
sensory_mapping: 从细菌到人类的四十亿年像地层一层层盖到程心头顶，把她埋在生命史最底部，呼吸被压断。
context_fact: 她曾在执剑人最后时刻出现相同幻觉，此次太阳系真正毁灭后幻觉返回。
image_mechanism: 地质沉积把无形时间变成垂直物质重量，年数越久地层越厚，责任由历史长度直接转成埋压。
property_alignment: 年代对应沉积层；逝去生命对应层内遗迹；责任累积对应增厚；程心位置对应层底；窒息对应无出口压力。
context_alignment: 冥王星墓碑按地质纪年保存文明，程心却被同一地质时间反向埋葬，保存历史变成历史压人。
narrative_function: 复现人物核心创伤图像，并把四十亿年这一抽象数字变成可感重量。
transfer_rule: 时间写成沉积物时，应有累积单位、垂直位置、所含历史、压力后果和与地质主题的联系。
failure_boundary: 时间没有质量，地球生命史也不全由程心决定；窒息是心理和幻觉体验。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 地球四十亿年生命史及全部灭亡者的时间重量压在程心责任感上
vehicle: 沉积物经过漫长年代逐层堆积成厚重地层，压住下方生物并隔绝空气
ground: 时间跨度极长；层层累积；总量沉重；位于主体上方；压力持续；遮蔽出口；造成窒息
