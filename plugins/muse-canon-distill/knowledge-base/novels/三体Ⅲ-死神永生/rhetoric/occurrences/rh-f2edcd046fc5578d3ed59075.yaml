quote: 整个人像是被一团花簇拥着
sensory_mapping: 和服布面展开成花瓣，袖摆与纹样成为花簇层次，智子的脸从花心显现。
context_fact: 智子以完美女性机器人和日本茶道形象迎接程心与AA。
image_mechanism: 花簇先把服装转成环境，再由面容令花丛黯然失色，完成服饰美到人物美的递进。
property_alignment: 华美纹样对应花色；宽袖包围对应花瓣簇拥；纤小身体对应花心中心。
context_alignment: 三体代理人用极致人类审美软化侵略者身份，花簇外观正是文化拟态的一部分。
narrative_function: 建立智子的视觉魅惑，并为后续春水微笑和浓缩女人味连续加码。
transfer_rule: 服饰如花应让色彩、纹样和包围结构共同支持，人物位置需成为花簇中心。
failure_boundary: 单色紧身服、线条硬直或花纹稀少时，团簇与花瓣层次不成立。
