chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 可以认为，光粒就是一块以惯性飞行的光速石头
sensory_mapping: 高技术光粒被压缩成一颗投石，离手后沿黑空直线疾飞，靠最原始的撞击砸中恒星。
context_fact: 两次已观测光粒都精确考虑恒星提前量，发射后未作轨道修正；纸条却没有对准太阳。
image_mechanism: 石头剥去武器神秘性，突出光粒的动力学朴素，也为不同于光粒的二维武器留下辨别标准。
property_alignment: 光粒对应石头；发射对应投掷；惯性轨迹对应离手直飞；恒星毁灭对应撞击；提前瞄准对应预判落点。
context_alignment: 人类因熟悉光速石头而把黑暗森林打击等同光粒，后来恰因这一模型过窄误信掩体工程。
narrative_function: 用可理解旧武器反衬纸条不符合的全部特征，埋下打击类型误判。
transfer_rule: 复杂武器比作投石时，应锁定发射后控制、轨迹、作用方式、瞄准和简化带来的盲区。
failure_boundary: 光粒的材料与能量机制远非普通石块，光速也不能由经典投掷解释；只比较惯性和碰撞。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 被发射后无需修正、按初始方向以光速撞击恒星的光粒武器
vehicle: 一块被投出后只靠惯性沿直线飞行、以碰撞动能摧毁目标的石头
ground: 发射后不再操纵；轨迹由初始条件确定；以直接碰撞作用；结构简单；命中依赖预先瞄准
