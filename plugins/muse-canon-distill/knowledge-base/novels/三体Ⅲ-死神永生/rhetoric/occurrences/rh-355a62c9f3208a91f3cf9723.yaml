chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 长达三个世纪的战争和恩怨都已成为宇宙间的过眼烟云
sensory_mapping: 三百年战争压缩成一缕烟，从宇宙视野前飘过，舰队远去后颜色便散进黑空。
context_fact: 双方曾互为生死威胁，如今母星毁灭、智子撤走，两个世界都不知道自身未来。
image_mechanism: 宇宙尺度把人类感觉漫长的三世纪缩短成烟云经过一眼的时间，消散强调关系终止。
property_alignment: 战争恩怨对应浓烟；三世纪历程对应飘过；断联对应烟散；宇宙尺度对应广阔天空。
context_alignment: 前一句陌路人保留两方主体，本句继续抹去共同历史，使时代终结具有双重空无。
narrative_function: 完成宏观时间缩放，为人类转而解读宇宙生存技术清理叙事背景。
transfer_rule: 漫长历史写成烟云时，应设置更大观察尺度、曾经遮蔽的强度、消散原因和残余限度。
failure_boundary: 战争后果仍塑造两文明，记忆并未真正消失；烟散只表达当前联系与作用中断。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 地球与三体持续三百年的战争、威慑、报复和情感纠葛在断联后迅速失去现实作用
vehicle: 烟云从眼前短暂飘过，形状醒目却很快散入广阔天空，不留下可抓取实体
ground: 曾经占满视野；相对更大尺度显得短暂；结束后难以挽回；痕迹消散；旁观者只能回望
