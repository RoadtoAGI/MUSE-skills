tenor: 程心目睹云天明被摘脑后，对日常现实与隐藏残酷本质的认知突变
vehicle: 原先只见失真投影，此刻光源或原物显露出真实颜色
ground: 此前经验是间接、扁平且缺失关键信息；冲击事件让被遮蔽的层次和价值性质突然出现
