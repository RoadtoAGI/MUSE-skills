chapter: 【危机纪元5-7年，阶梯计划】
figure_type: metaphor
quote: 仿佛之前看到的只是生活的投影，某种真实的色彩此时才显现出来
sensory_mapping: 手术室周围像投影幕飞快换片，熟悉生活褪去假色，血肉事实以高饱和真色穿透。
context_fact: 她赶到医院时手术已完成，云天明遗体推走，冰冻大脑即将封入容器。
image_mechanism: 投影与真实不是简单真假，而是认知层级切换；色彩显现把抽象伦理后果变成无法退回的感官揭幕。
property_alignment: 此前计划文件对应生活投影；亲见遗体与容器对应原物显现；认知震荡对应色彩突变。
context_alignment: 她曾以文明使命理解阶梯计划，此刻第一次看见具体人的不可逆损失，投影模型精确标记抽象到实物的距离。
narrative_function: 表现价值世界翻面，令手术室成为程心之后人生的真实起点。
transfer_rule: 认知揭示借投影写时，应明确原先的信息媒介、缺失维度和触发原物显现的事件；真实色彩须有具体代价承载。
failure_boundary: 若此前理解已充分包含人命代价、此刻没有新证据，投影到真实的跳变就不成立；真实也只是人物此刻判断。
