chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 一阵沁人心脾的清苦，像饮下了冷寂的星光
sensory_mapping: 碧绿茶汤在口中化成银白星光，冷意沿喉咙落下，把太空般寂静带进胸腔。
context_fact: 三人在无声茶厅完成最后茶道，地面人群沉默，智子即将永远离开太阳系。
image_mechanism: 通感让茶的苦凉获得光的颜色与宇宙距离，饮下动作又把外部星际离别内化为身体余味。
property_alignment: 茶汤清澈对应星光透明；清苦凉意对应冷寂；入口扩散对应光被饮下；告别孤独对应遥远星空。
context_alignment: 程心将第一次进入太空，智子则飞向深空，星光既是茶味，也是二人此后无法跨越的环境。
narrative_function: 用一口茶凝结全场声音、温度和宇宙距离，为无对白的告别留下感官记忆。
transfer_rule: 味觉通感到光时，应同时匹配温度、颜色、进入身体的路径和场景情绪，避免只追求奇异。
failure_boundary: 星光不能饮用且没有味道，茶也非真正冰冷；喻体依赖告别时的主观孤寂。
quality_assessment: exemplary
