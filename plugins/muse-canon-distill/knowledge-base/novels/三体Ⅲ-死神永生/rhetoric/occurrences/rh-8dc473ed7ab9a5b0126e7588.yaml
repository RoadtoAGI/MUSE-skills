tenor: 程心慢饮绿茶时感到的清凉苦味及智子告别场景中的孤寒寂静
vehicle: 把遥远星光化为冰冷液体饮入体内，光线清澈却没有温度和人声
ground: 感受清冷；质地澄澈；进入身体后扩散；味觉与寂静情绪同时作用；来源高远
