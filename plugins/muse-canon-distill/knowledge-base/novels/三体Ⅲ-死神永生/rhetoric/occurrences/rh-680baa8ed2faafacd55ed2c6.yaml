chapter: 【公元1453年5月，魔法师之死】
figure_type: metaphor
quote: 宁可美艳地腐烂也不悄然枯萎的花朵
sensory_mapping: 女性面容获得花瓣的艳色和腐败的湿软气味，美与败坏在同一朵花上同时发生。
context_fact: 皇帝从服饰和面容认出她是境况尚可的妓女，随即注意到她病热般兴奋的眼睛。
image_mechanism: 盛放与腐烂本应前后相继，此处强行重叠，令妩媚显出正在自毁的动态；枯萎作为较安静的退路被她拒绝。
property_alignment: 妩媚面容对应花朵盛放；风尘生涯的损耗对应花体腐烂；主动追逐刺激对应宁可艳腐；不甘贫困隐没对应不愿悄枯。
context_alignment: 人物以卖淫脱离饥饿，又渴望借神迹成为圣女，艳腐准确连接她的生存选择、野心和毁灭结局。
narrative_function: 在身份揭示前给出人物命运缩影，使美貌同时成为生存资本与腐败征兆。
transfer_rule: 写美与自毁并存时，可选生命周期明确的有机体，让盛放和败坏在时间上重叠；人物还需有主动选择耗损的证据。
failure_boundary: 若人物只是自然衰老、被动受害或外表已完全败落，宁可与美艳都无从成立；纯粹赞美外貌也不宜带入腐烂。
