chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 他要先在心里绘画，我已经把您，还有您的威严和贤明一起画在心里
sensory_mapping: 国王离开视线后仍被收进针眼胸中的暗画室，王冠、眼神和威严一笔不漏落在内壁。
context_fact: 针眼之后反复以同一句式记下王后、公主和大臣，并依靠这些心像作魔画。
image_mechanism: 内部画布把记忆编码改造成与外部绘画同构的第一道工序，也让画到画里含义逐渐转向杀人。
property_alignment: 观察对应起稿；记忆表征对应心中画布；人物特征对应颜料线条；外部复画对应复制内稿。
context_alignment: 童话情报可能指向二维化机制，心中先成像提供从三维人物到平面画像的中间层。
narrative_function: 建立针眼魔法的观察—记忆—落纸流程，并让后续重复句成为死亡点名。
transfer_rule: 记忆写成内在绘画时，应说明输入观察、内部载体、保存属性和后续再现。
failure_boundary: 心脏不是视觉画布，记忆也可能失真；威严贤明等评价无法像轮廓一样精确复制。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 针眼仅凭短暂观察便在记忆中建立国王完整、可供复画的形象与性格印象
vehicle: 心内部有一张画布，观察者用无形画笔先完成一幅包含外貌与气质的肖像
ground: 视觉信息被内部保存；形象细节完整；外在与抽象品质同时进入表征；之后可复制到纸面
