chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 程心脑海中出现了另一个旋涡，由一千亿颗恒星组成，发着银光在宇宙之海中旋转，两亿五千万年转一圈，那就是银河系；地球在其中连一粒灰尘都算不上，而默斯肯旋涡又只是地球上的一粒灰尘
sensory_mapping: 银色星涡；宇宙黑海；地球尘粒；尘上小涡；尺度层层缩
context_fact: 直升机正从默斯肯旋涡上方观看其整体转动，研究者借它破解太阳系黑洞安全声明。
image_mechanism: 地面旋涡成为比例尺模板，视点连续拉远：千米水涡变成十万光年星涡，地球先缩成尘，原旋涡再缩为尘上的尘，制造双重尺度坠落。
property_alignment: 默斯肯涡对应银河形态；旋转海水对应恒星旋臂；银色水光对应星光；海洋对应宇宙；地球对应尘粒；本地旋涡对应二级微尘；涡转对应银河自转；直升机俯视对应宇宙俯瞰
context_alignment: 众人把旋涡视为黑洞模型，却同时被提醒整个太阳系在银河清理尺度下更微小，预示安全声明仍置身更大宇宙。
narrative_function: 从实地奇观跃迁到宇宙尺度，压低人类中心感并自然过渡到黑洞推演。
transfer_rule: 用嵌套旋涡和尘埃写尺度时，应保持各层形态同构，给出至少两个可比较数量级，并让视点按层级连续拉远。
failure_boundary: 宏观结构并无旋转盘形、尺度差不足，或尘埃只是泛称渺小而没有二级嵌套时，类比会失去精确震撼。
