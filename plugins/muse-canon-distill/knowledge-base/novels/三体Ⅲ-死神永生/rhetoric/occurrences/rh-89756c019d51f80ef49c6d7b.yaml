tenor: 银河系、地球与默斯肯旋涡三个尺度层级中的旋转结构及人类位置的极端微小
vehicle: 银色大旋涡漂转在无边海洋中，地球是其中小于尘埃的微点，地球上的海涡又只是这微点表面的一粒尘
ground: 银河盘旋对应海旋涡；恒星群对应发光水体；宇宙对应大海；地球对应灰尘；默斯肯旋涡对应尘上尘；公转周期对应涡转周期；中心结构对应旋涡轴心
