tenor: 艾AA与云天明刻下的文字经地质埋藏保存至程心读取，完成跨千万年的信息传递
vehicle: 行旅者越过极远距离和重重障碍，从出发地抵达另一端的接收者面前
ground: 有明确起点与终点；跨越巨大间隔；途中经历阻碍；部分受损但仍抵达；承载消息；抵达后连接分离者
