chapter: 【时间开始后约170亿年，我们的星星】
figure_type: metaphor
quote: 遥感图像上显示了四行跨越了一千八百九十万年的字迹
sensory_mapping: 四行字从山岩出发，随地层沉降、破碎和埋藏走过千万年，终于在遥感屏上抵达程心眼前。
context_fact: 石刻山岩沉入地下二十多米并部分破碎，保留下来的文字仍能被主动遥感识别。
image_mechanism: 跨越把静止文字改成时间旅行者，地质变化成为路途，残缺字面成为旅损，读取成为到达。
property_alignment: 刻写时刻对应出发；一千八百万年对应路程；岩层变动对应障碍；残字对应旅途损伤；屏幕显现对应抵达；内容对应携带消息。
context_alignment: 人物屡次靠飞船跨越时间却总错过，最终由静止石刻反向完成最成功的时间航行。
narrative_function: 赋予残缺信息胜过时间的主动感，回应程心坚持把字刻在石头上的信念。
transfer_rule: 信息跨时保存写成旅行时，应具备出发载体、途中介质、损伤、抵达界面和收件人。
failure_boundary: 字迹没有移动意志，实际由接收者在原地探测；跨越发生在时间而非空间。
