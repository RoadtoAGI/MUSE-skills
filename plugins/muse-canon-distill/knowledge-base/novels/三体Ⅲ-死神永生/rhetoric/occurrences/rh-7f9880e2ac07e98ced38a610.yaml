quote: 她像被一双有力的臂膀抱着，这种拥抱使她多少能够抵御宇宙的暗黑神话带来的寒冷和恐惧
sensory_mapping: 三倍重力把她按进椅背和侧翼，像两条坚实手臂合抱住身体，让她确认自己仍在现实中。
context_fact: 亨特号加速飞向灰星，程心在宇宙暗黑神话前感到太空虚化；加速停止后实感随之消失。
image_mechanism: 拥抱把机械过载重新编码为人际保护，压迫反而成为对抗无边宇宙的有限身体边界。
property_alignment: 座椅压力对应臂力；身体深陷对应被抱；3G稳定对应有力；实在感对应触觉确认；宇宙寒冷对应怀抱外部。
context_alignment: 着陆座椅曾像大手握住两人，此处重力成为双臂；机械身体意象持续替代已失人类共同体的安慰。
narrative_function: 显示程心需要触觉压力才能维持现实感，并让失重到来成为心理支撑被撤走。
transfer_rule: 压力比作拥抱时，应说明包覆方向、力度、保护感、所抵御对象及压力消失后的变化。
failure_boundary: 3G会造成负担而非温柔关怀，重力没有意志；拥抱感来自她对稳定触觉的需要。
