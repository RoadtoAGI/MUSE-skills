tenor: 光速航行把宇宙边缘和末日纳入个人可达尺度后，对人类思想、文化与文明造成的根本转变
vehicle: 道路里程碑标记历史阶段跨越，以及启蒙运动、文艺复兴推动认知与文化范式整体更新
