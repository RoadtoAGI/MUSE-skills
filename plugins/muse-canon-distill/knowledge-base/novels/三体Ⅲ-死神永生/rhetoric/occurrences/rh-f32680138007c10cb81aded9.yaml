chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 生活就像一匹脱缰的野马，驮着她越走越远
sensory_mapping: 生活获得马背的颠簸与冲力，程心成为被载走的乘者，空间远行最终把她抛向未来。
context_fact: 她先离家求学，随后参与阶梯计划并冬眠，与父母产生空间和时间上的永久分离。
image_mechanism: 脱缰同时取消方向控制和刹停能力，驮着则保留人物并非主动奔逃的被动感；越走越远把抽象人生写成累积路程。
property_alignment: 人生变化失控对应野马脱缰；程心被事件推动对应被驮行；离父母渐远对应路程累积；冬眠赴未来对应跨越不可返边界。
context_alignment: 她回忆不辞而别时强调无法掌控分离，野马的主动冲力符合人物对自身命运的被动理解。
narrative_function: 把一连串离家事件压成一条失控运动，强化她以保护世界补偿家庭离散的心理来源。
transfer_rule: 人生如坐骑时，要交代谁掌握缰绳、速度如何累积、终点能否选择；脱缰适用于控制权真实流失。
failure_boundary: 若人物精确规划并随时能返家，脱缰会抹除能动性；单次短暂出差也不足以形成越走越远。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心离家上大学后被事业、冬眠和时代变化持续带离父母的人生进程
vehicle: 挣脱缰绳、速度和方向不再由骑手控制并把人驮向远方的野马
ground: 进程具有强大惯性且难由主体控制；距离随着时间不断扩大并可能跨过无法返回的界线
