figure_type: simile
quote: 另外六个女人都是在天堂一般的威慑纪元出生的
sensory_mapping: 信息墙、空调与充足配给合成一座恒温乐园，六人从未越过它的边界。
context_fact: 她们第一次面对定量配给、无空调住房、公共厕所和多人上下铺。
image_mechanism: 天堂把威慑纪元的便利集中成无痛生活基线，使移民区的普通匮乏显得像被逐出乐园。
property_alignment: 物资充足对应天堂无匮乏；环境便利对应乐园舒适；无苦难经验对应居民受庇护。
context_alignment: 她们并非比较两个时代的政治，只以身体舒适判断世界，天堂正符合这种狭窄经验。
narrative_function: 解释年轻移民为何无法适应并把愤怒投向程心。
transfer_rule: 以天堂概括黄金时代时，应列出人物实际享有的免痛条件，并呈现失去它后的落差。
failure_boundary: 威慑纪元仍有政治恐惧与外部威胁，天堂只指这群人的日常物质经验；泛用会遮蔽代价。
