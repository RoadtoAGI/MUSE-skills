chapter: 【危机纪元4年，云天明】
figure_type: simile
quote: 张医生的声音轻轻响起，像飞到耳边的蚊子
sensory_mapping: 耳语获得小虫飞行轨迹，细弱声源从背景中靠近耳廓，触感般侵入私人距离。
context_fact: 老李刚死于注射，医生把手扶上云天明肩头，轻声说明药理。
image_mechanism: 蚊子把专业解释的低音量与令人不舒服的亲密靠近合在一起，使安慰动作带上挥不去的死亡嗡鸣。
property_alignment: 轻声对应蚊鸣细弱；贴耳响起对应蚊子飞近耳边；云天明不适对应耳边虫声的侵扰。
context_alignment: 医生语气温和而内容是停止呼吸心跳，微小烦扰比响亮恐吓更符合场景压抑。
narrative_function: 把解释压成贴身声响，维持死亡后的静寂并让关怀显出令人窒息的侵入感。
transfer_rule: 写近距离低语时，可选具有移动声源的微小对象；声量、方位和听者情绪应共同决定对象，而非只取轻。
failure_boundary: 医生若公开高声讲解或声音悦耳舒展，耳边蚊子的近、细、扰三项都会失配。
