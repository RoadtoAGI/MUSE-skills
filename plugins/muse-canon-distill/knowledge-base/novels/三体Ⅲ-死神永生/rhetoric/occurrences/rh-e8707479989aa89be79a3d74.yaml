chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 像一个无限嵌套的俄罗斯套娃
sensory_mapping: 一只水杯外壳打开，里面的材料又像套娃裂开，纹理、分子与更深断面一层层缩入无底中心。
context_fact: 从四维观看时，容器内容、内容内部以及固体所有断面都并列可见，任何小物也含无限信息。
image_mechanism: 套娃用重复的包含动作给无限细节建立递归秩序，眩晕来自每次以为到内层时又出现新的外壳。
property_alignment: 物体外层对应最大套娃；内部物体对应内层娃娃；继续暴露对应逐层开合；无法看全对应嵌套无终点。
context_alignment: 飞船里的杯子和笔都是手边有限小物，套娃让有限外形容纳无限内层，贴合从果核中看到无穷的紧邻总结。
narrative_function: 为无限细节提供可重复操作的视觉模型，使抽象无穷转成读者能连续想象的开盒过程。
transfer_rule: 用嵌套物表现递归深度时，应让每层结构重复、观察动作可继续，并指出为何没有可确认的末层。
failure_boundary: 真实物质内层不保持娃娃形状，尺度也受物理极限约束；无限是四维可见信息的叙述体验。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 四维视野中一个普通三维物体不断显露内部之内部所形成的无穷层次和眩晕深度
vehicle: 俄罗斯套娃逐个打开后内部仍有更小娃娃，层层包含，看似可以永远继续
ground: 每一层内部又包含下一层；外表不能穷尽结构；观察可递归深入；层数多到无法遍历
