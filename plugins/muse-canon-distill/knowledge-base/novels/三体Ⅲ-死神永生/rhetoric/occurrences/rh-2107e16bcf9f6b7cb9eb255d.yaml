tenor: 联邦公开展示缴获的一大堆金黄色反物质子弹，其数量和威力足以给整个掩体世界带来死亡
vehicle: 许多个身披金色、掌握夺命权力的死神聚集成群，突然被带到公众面前
ground: 每颗子弹对应一个死神；金黄弹头对应金色外形；反物质湮灭对应收割生命；弹药堆对应死神群；公开展示对应现身；全球恐惧对应见到死神
