chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 当那堆金黄色的死神出现在人们眼前时，举世震惊
sensory_mapping: 金色死神；群聚成堆；死亡现身；公众凝视；湮灭镰光
context_fact: 联邦一周后公开反物质武器，一万五千发子弹曾由星环自卫队掌握，单条弹链即可摧毁掩体世界。
image_mechanism: 上一场景中链条里的弹头逐颗站立成人形死神，堆积数量由库存数字变成死亡主体的集会；金色不再华丽，而成为统一制服。
property_alignment: 反物质子弹对应死神；单发杀伤对应单个夺命者；弹头金黄对应金色形体；大堆弹药对应死神群聚；湮灭爆炸对应挥镰收割；全球展示对应死神现身；舆论震惊对应直面死亡
context_alignment: 此前“死神的链条”强调排列和控制，此处公开堆放后链形消失，喻体转为许多死神本身，准确呈现数量造成的政治震荡。
narrative_function: 把秘密军事筹码改写成全球可见的灭绝威胁，解释舆论为何瞬间转向严惩星环集团。
transfer_rule: 把成批武器写成死神群时，应让每个单元都具独立致命能力、数量可见、外形有共同标志，并落实观看者的集体反应。
failure_boundary: 武器必须组合后才有微弱效果、数量很少且受可靠封存，或公众不了解杀伤后果时，一堆死神会夸大即时威胁。
quality_assessment: effective
