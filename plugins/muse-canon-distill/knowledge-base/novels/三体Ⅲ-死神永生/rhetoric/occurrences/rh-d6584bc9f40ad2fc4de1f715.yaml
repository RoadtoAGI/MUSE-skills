chapter: 【危机纪元元年，生命选项】
figure_type: analogy
quote: 一队蚂蚁不停搬运米粒大小的石块，给它们十亿年，就能把泰山搬走
sensory_mapping: 亿年地质作用缩成蚂蚁口中一粒粒石块，泰山作为最终总量让累积过程可见。
context_fact: 无生命地球模拟没有海洋，绿眼镜解释生命虽软弱却可长期改变大气、地貌和水循环。
image_mechanism: 类比将总量拆成可重复的最小动作；蚂蚁弱与泰山强的悬殊先制造不可能感，十亿年作为乘数完成翻转。
property_alignment: 个体生命作用对应搬一粒石；生态系统连续活动对应蚁队不停；地球地貌对应泰山体量；十亿年累积对应重复次数巨大。
context_alignment: 它直接补上杨冬直觉遗漏的时间变量，并为随后生命比岩石、飓风更有力的结论提供机制。
narrative_function: 用可重复动作解释微弱因果如何跨尺度放大，构成生命选项论证的核心桥梁。
transfer_rule: 讲累积效应时，要给出最小增量、重复主体、持续方向和足够时间；宏大结果须能由增量求和而非魔法跳跃。
failure_boundary: 作用若相互抵消、主体中断或石块会自动回位，重复无法累积；十亿年也不能弥补方向随机的过程。
