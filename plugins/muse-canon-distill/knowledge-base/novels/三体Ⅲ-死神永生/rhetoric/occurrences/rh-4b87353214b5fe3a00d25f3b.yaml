quote: 她像个小泼妇一样一天与那六个女人打好几次架
sensory_mapping: AA的都市女孩外表被一连串抓发、叫骂和撞人动作改写成小个子悍妇。
context_fact: 六名女人辱骂、推搡程心并抢配给，AA多次打架，最终以一次见血反击制止她们。
image_mechanism: 小泼妇把保护行为的粗野手段和身形反差同时可视化，称谓带有叙述者的亲近调侃。
property_alignment: 频繁打架对应好斗；抓头撞柱对应不讲体面；一人压六人对应泼辣强势；小字对应体形与力量反差。
context_alignment: AA一贯直率务实，进入无制度保护的移民区后，她用最市井的方式履行朋友责任。
narrative_function: 在群体敌意中给程心建立身体屏障，也以粗粝行动保留AA的生命力。
transfer_rule: 用社会类型称谓塑造动作时，应以具体姿势、频率和冲突方式支撑，且保留叙述距离。
failure_boundary: 称谓含贬义，若缺少亲密视角或人物确实只做正当防卫，容易把勇敢贬成性格污名。
