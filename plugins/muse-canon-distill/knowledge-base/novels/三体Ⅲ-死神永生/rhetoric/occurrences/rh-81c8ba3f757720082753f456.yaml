chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 在敌人的心脏，在那难以想象的环境中，他孤军奋战
sensory_mapping: 云天明像一名缩小的士兵进入巨敌胸腔，在跳动核心旁独自藏匿并发回信号。
context_fact: 他是唯一身处外星社会并深入星际的人类，三个童话必须避过三体监听。
image_mechanism: 身体心脏把社会核心变成可定位的高危器官，孤军则将文化生存重新编码为军事渗透。
property_alignment: 三体社会核心对应心脏；云天明一人对应孤军；隐语情报对应敌后作战；暴露风险对应致命器官防护。
context_alignment: 主席以英雄话语致敬，军事比喻符合IDC场合，也遮住云天明文化中介和被俘者身份的复杂性。
narrative_function: 快速确立云天明的制度性英雄评价，并解释委员会为何把其安全置于最高优先。
transfer_rule: 深入敌方社会写成进入心脏时，应落实中心位置、生命风险、孤立程度和任务价值。
failure_boundary: 三体社会不是单一身体，云天明也可能已获一定信任；敌我军事框架会压平其关系复杂度。
