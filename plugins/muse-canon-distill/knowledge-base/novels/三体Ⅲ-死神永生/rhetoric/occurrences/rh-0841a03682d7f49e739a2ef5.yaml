chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 孩子们，没有家了，家已经变成一幅画了
sensory_mapping: 两人因雪想起家，罗辑却指向空中的二维地球：故乡只剩一张可望不可归的画。
context_fact: 二维地球含原子级细节并有雪花冰环，但所有三维生命已经死亡。
image_mechanism: 画将“信息尚存”和“家已消失”分开，击破雪景造成的归家错觉；有图像不等于有归处。
property_alignment: 二维地球对应画面；原子信息对应绘画细节；无厚度对应画布；不能返乡对应不能入画；记忆对应观看。
context_alignment: 政府抢救计划追求留下死图像，罗辑一句话揭示其代价：文明也许可被画下，家却无法保存。
narrative_function: 以老人直言终止温暖雪景，让末日情感从怀旧回到不可逆现实。
transfer_rule: 家园比作画时，应明确图像保存哪些内容、空间失去哪种功能、观看者为何不能返回。
failure_boundary: 二维地球仍是物理物质而非颜料画布，未来机制也未知；“画”强调三维生命视角下的不可居住。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 地球和其全部生活空间被二维化后仍留图像，却失去可居住、可返回的三维家园功能
vehicle: 墙上一幅描绘旧居的平面画，只能观看和怀念，不能走入其中生活
ground: 保留外观信息；失去厚度；不能进入居住；成为记忆载体；与观看者分离；原物已不存在
