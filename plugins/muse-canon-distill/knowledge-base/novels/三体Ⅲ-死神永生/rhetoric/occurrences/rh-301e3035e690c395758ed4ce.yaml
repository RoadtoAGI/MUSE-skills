chapter: 【危机纪元元年，生命选项】
figure_type: metaphor
quote: 地球大气先是变成金星那样的蒸笼
sensory_mapping: 行星大气罩变成笼盖，海洋成为被加热的水源，云汽获得厨房蒸腾的湿热触感。
context_fact: 模型推测无生命大气无法阻拦紫外线和太阳风，海洋经几十亿年蒸干。
image_mechanism: 蒸笼提供从液态水到上升蒸汽的连续装置，既说明中间态环境，也自然导向水汽从大气顶部逃逸。
property_alignment: 地表受热对应蒸笼加热；浓厚水汽对应笼内蒸汽；海洋蒸发对应水持续汽化；大气层包围对应笼盖封罩。
context_alignment: 金星是科学参照，蒸笼把其温室高热翻译为身体可感经验，适合口语解释模型。
narrative_function: 把漫长大气演化压成清楚的热力过程，回答海洋如何消失。
transfer_rule: 用器具解释行星过程时，应让器具内部的能量输入、物态变化和逸出路径逐步对应科学链条。
failure_boundary: 若大气寒冷、干燥或海洋因冻结消失，蒸笼的高温水汽机制错误；地球并非真正密闭容器，逃逸口仍须另行说明。
