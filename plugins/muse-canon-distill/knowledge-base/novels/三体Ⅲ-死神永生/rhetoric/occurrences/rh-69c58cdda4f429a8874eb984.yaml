chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 夜风的吹拂，星星的闪烁，都是在重复妈妈最后的话
sensory_mapping: 风每吹一次便送来一个音节，星光每闪一下便重复一句，整个夜空成为母亲话语的回声场。
context_fact: 程心不辞而别赴未来，父母察觉异常，母亲握手说三人因爱走到一起，这是他们最后交流。
image_mechanism: 重复把触觉和视觉统一为听觉回声，让普通夜景全部被离别记忆占领，也延长一句话的持续时间。
property_alignment: 风吹与星闪对应复述节奏；母亲话语对应环境声音；彻夜站立对应反复聆听；离别难舍对应无法静音。
context_alignment: 三个世纪后程心决定以爱行事，环境复述说明这句话早已成为她跨时决策的内在背景声。
narrative_function: 把家庭告别写成宇宙尺度回声，完成她竞选执剑人的第三层情感动因。
transfer_rule: 环境复述内心句子时，应让风、光或机械节奏与记忆反刍同步，并由人物持续注意证明占据。
failure_boundary: 人物已释然、环境嘈杂无节奏或话语并不重要时，万物重复会显得抒情过度。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心离家冬眠前整夜守在窗外，母亲关于一家因爱结合的话持续占据她的感知
vehicle: 夜风和群星获得声音与记忆，一遍遍替母亲复述临别句子
ground: 不同感官刺激都被同一情绪解释；话语在环境节奏中持续返回，无法从意识中停止
