tenor: 穿梭机低光速近光速绕蓝星时，外部参照系的岁月以千万倍速度不可追回地过去
vehicle: 致命伤口中的血快速不断流出身体，带走生命，流失后无法收回
ground: 流动单向；速度极快；每一份流失都减少剩余生命；不可逆；主体能看见却难阻止；带来死亡焦虑
