chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 时间正以千万倍的速度闪电般地流逝，像从程心的心里流出的血
sensory_mapping: 蓝星每次在光带上循环，外界岁月就像鲜血从她心口涌走，千万倍时间把生命一滴滴抽空。
context_fact: 每个图形周期代表飞船绕蓝星一周，低光速相对论使外部时间飞逝，而二人几乎静止。
image_mechanism: 血把抽象时间损失转为身体失血，流逝速度不再只是倍率，而是蓝星生命和等待者寿命被持续抽走。
property_alignment: 外部时间对应血；高速流逝对应喷流；不可返回对应失血；蓝星历史对应生命存量；程心心痛对应伤口来源。
context_alignment: 太阳血曾铺展二维面，此处时间血从程心内心流出；宇宙灾变颜色转为个人失去的时间。
narrative_function: 让时间膨胀获得情感代价，并为她拒绝继续看死亡之舞、决定固定等待作铺垫。
transfer_rule: 时间流逝比作失血时，应说明参照系、损失对象、速度、不可逆性和主体为何无法止血。
failure_boundary: 程心自身时间并未千万倍流失，外部岁月也不是生命物质；血感来自与蓝星、AA分离的损失。
