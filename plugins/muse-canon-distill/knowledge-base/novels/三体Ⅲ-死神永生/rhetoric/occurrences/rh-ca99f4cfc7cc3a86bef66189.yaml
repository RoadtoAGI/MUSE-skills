tenor: 两舰人员因广播能力仅剩两个月而被迫决定是否暴露三体坐标、连带毁灭两个世界
vehicle: 无形命运从背后施力，把普通人推上法官席，迫使其宣判终极死刑
ground: 角色并未主动寻求权位；外部事件取消退路；所处位置附带必须作出的巨大裁决
