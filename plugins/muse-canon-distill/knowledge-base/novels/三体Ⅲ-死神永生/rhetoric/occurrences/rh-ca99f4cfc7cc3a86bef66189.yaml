chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 命运把我们推到了对两个世界做出最后审判的位置上
sensory_mapping: 一千四百多人原在飞船大厅漂浮，历史之手把他们推到高高审判席，两个星球像被告列在下方。
context_fact: 天线即将失效，地球威慑可能已毁，两舰举行全民公决决定是否广播。
image_mechanism: 推与审判席区分权力欲望和被迫责任，普通人获得法官位置却没有逃避判决的自由。
property_alignment: 危机迫近对应背后推力；广播权限对应法官权；两个世界存亡对应被审对象；必须表决对应宣判义务。
context_alignment: 褚岩强调所有人都是普通人，外力推位使全民公决既是民主安排，也保留荒谬重压。
narrative_function: 为投票程序赋予文明级伦理尺度，并解释为何决定不能由少数指挥官承担。
transfer_rule: 被迫裁决如推上审判席时，应说明施力事件、席位权限、审判对象和无法回避原因。
failure_boundary: 舰员仍可投反对或弃权，命运没有完全取消选择；最后审判是结果尺度，不提供法律正当性。
quality_assessment: effective
