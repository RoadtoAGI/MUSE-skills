chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 定居点就像一个农业时代的小村镇
sensory_mapping: 跨星际舰队落地后并未立即建成未来都市，只形成田地、工棚和少量居民围起的小镇。
context_fact: 新世界政府让基础科学家冬眠，等有能力开展研究时再唤醒；关一帆因此睡了近两世纪。
image_mechanism: 农业村镇逆转技术时代预期，说明高端航行能力与落地社会复杂度可以同时悬殊。
property_alignment: 初始定居点对应村镇；拓荒对应农垦；有限人口对应小共同体；基础建设对应手工业阶段；科研缺失对应低分工。
context_alignment: 人类从神级技术文明末日逃出后，在异星重新回到村镇尺度，文明生命周期再度从简陋起点重启。
narrative_function: 解释科学家长期冬眠的制度原因，并具体呈现银河人类早期生存状态。
transfer_rule: 高技术定居点比作旧时代村镇时，应落到人口、生产、分工、设施和科研能力，而非只写建筑外形。
failure_boundary: 定居点仍拥有星际技术和现代知识，不是真正农业社会；相似集中在社会规模与资源优先级。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 银河人类抵达可居世界初期人口稀少、以拓荒生产和基础建设为主的定居点
vehicle: 农业时代规模不大、资源有限、居民共同耕作建设且缺少专业科研机构的小村镇
ground: 人口少；生产以生存为先；社会分工有限；设施基础；共同体紧密；缺少科研环境；扩张缓慢
