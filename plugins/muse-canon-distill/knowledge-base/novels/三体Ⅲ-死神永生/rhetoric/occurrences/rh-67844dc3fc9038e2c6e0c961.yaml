chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 忽而变幻出霓彩，像宝石堆成的
sensory_mapping: 每个泡孔都变成一枚微小晶面，红蓝紫光在泡沫堆中轮流亮起。
context_fact: 浴宫从不同方向打灯，使同一泡沫时而雪白、时而呈现霓彩。
image_mechanism: 宝石切面与泡膜虹彩共享角度依赖的反光，堆成又对应成千泡孔聚集。
property_alignment: 泡膜对应宝石切面；虹彩对应宝石色泽；泡孔团簇对应堆叠；多向灯光对应折射照明。
context_alignment: 云喻写轻柔自然，宝石喻转为宫廷人工华贵，两面共同构成公主旧生活。
narrative_function: 增加同一泡沫的视觉变奏，让香皂成为浓缩王宫奢侈的感官道具。
transfer_rule: 虹彩表面比作宝石时，应对齐微小反光面、角度变化、色谱、聚集方式和光源。
failure_boundary: 泡膜极薄柔软且短命，不具宝石硬度或价值；类比只覆盖光学外观。
quality_assessment: effective
