tenor: 多向灯光照射下不断闪现彩虹色泽的泡沫团
vehicle: 许多切面宝石堆叠，随角度变化反射出多色耀斑
ground: 颜色多变；表面由无数小面组成；反光随角度闪烁；整体显得华贵；光点密集
