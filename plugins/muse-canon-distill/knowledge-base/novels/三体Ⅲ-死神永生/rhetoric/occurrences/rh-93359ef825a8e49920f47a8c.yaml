chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 上面画着的大红斑像一只突然睁开的巨眼
sensory_mapping: 暗处眼睑；红色巨瞳；蓝焰点亮；突然注视；人与石眼对望
context_fact: 小艇推进器为避开巨石启动，蓝光扫过涂画；程心正因维德警告而心紧。
image_mechanism: 推进器光像掀开一层黑眼皮，大红斑从石面平图变成立体瞳孔；它醒来的时点与维德警告重合，仿佛替他继续盯住程心。
property_alignment: 大红斑对应眼睛；岩石阴影对应闭合眼睑；蓝焰照明对应睁眼；石块尺寸对应巨眼；红斑朝向对应视线；程心紧张对应被注视；维德目光对应另一锐眼
context_alignment: 前文已称石块太空怪兽，此处光照带来实际‘睁眼’动作，是意象新阶段而非单纯复称。
narrative_function: 把维德话语造成的心理压力外化为空间凝视，增强试验现场的不祥感。
transfer_rule: 用睁眼写斑点被光照时，应有眼形中心、此前暗藏、突然照明、明确朝向和被看者反应。
failure_boundary: 斑点形状狭长无瞳感、光线渐变缓慢，或无人感到被注视时，巨眼动作会显得牵强。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 推进器蓝焰突然照亮巨石上原本藏在阴影中的木星大红斑图案
vehicle: 黑暗中一只巨型眼睛忽然掀开眼睑，红色瞳孔亮起并开始注视面前的人
ground: 圆红斑对应眼球瞳孔；阴影到照亮对应闭眼到睁眼；巨石体量对应巨眼尺度；程心被惊动对应遭凝视；维德对视对应双眼相遇
