figure_type: simile
quote: 这个外形本身不由得让人联想到水滴
sensory_mapping: 星环号在白色地面上卧成一滴银亮的水，船壳从头到尾没有多余棱角。
context_fact: AA猜测船体含强相互作用力材料，水滴也曾是三体文明坚不可摧探测器的俗称与形象。
image_mechanism: 水滴先以自然流线赋予轻捷感，再通过读者对三体水滴的记忆暗添坚固感，使安慰中潜藏危险技术联想。
property_alignment: 光洁表面对应液滴表面；流线船身对应水滴轮廓；强材料猜测对应水滴坚固记忆；轻捷观感对应低阻形态。
context_alignment: 程心把飞船当成末日中的家，水滴般完整外壳成为二维坍缩前短暂可靠的三维容器。
narrative_function: 用一个跨全书意象同时交代船体审美、材料猜测和人物获得的安全感。
transfer_rule: 自然形态触发作品内部旧意象时，应兼顾当下外形属性与既有情节记忆带来的第二层含义。
failure_boundary: 星环号不是液体，也未证实由水滴同类材料制成；坚固联想属于AA猜测和读者记忆。
