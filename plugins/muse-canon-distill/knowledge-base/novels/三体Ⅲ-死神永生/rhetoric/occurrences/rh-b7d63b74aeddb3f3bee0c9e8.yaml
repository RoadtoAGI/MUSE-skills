chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 使得小广场像一个大钟面，那些影子就是移动的时针
sensory_mapping: 空旷广场化成宇宙钟盘，人和艇的长影像黑色指针扫过地面，银河光是看不见的钟芯。
context_fact: 终端站整体旋转，敞开港口外银河缓缓移过，星光把等待人群和小艇的影子拉长。
image_mechanism: 钟面把空间站旋转和等待时间压成同一机械图景，影子的真实运动自然承担指针功能。
property_alignment: 广场平面对应钟盘；长影对应时针；终端旋转对应机芯；影位变化对应时间推进；等待会面对应读钟。
context_alignment: 会面跨越三世纪却即将开始，宇宙钟把漫长历史与港口片刻等待集中在同一尺度。
narrative_function: 在程心抵达小艇前制造肃静倒计时，并用物理旋转给静止人群添加运动。
transfer_rule: 场地如钟面时，应具备平面、周期运动、细长指示物、中心关系和真实的等待情境。
failure_boundary: 影子未标刻度，也不一定指示标准时间；钟喻主要表达旋转轨迹与等待感。
