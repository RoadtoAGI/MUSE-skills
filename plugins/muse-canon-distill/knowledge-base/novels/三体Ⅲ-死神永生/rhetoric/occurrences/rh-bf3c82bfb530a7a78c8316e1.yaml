chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 因而掌握着人类世界的命运
sensory_mapping: 人类未来缩成飞船手里的一枚开关或筹码，船员握紧时，地球无法从远处取回。
context_fact: 多艘引力波飞船若因水滴追击逃离太阳系，仍可在振动弦失效前独立进行坐标广播。
image_mechanism: 掌握把分布式战略风险压成手与物的控制关系，突出建造者害怕权力离开制度边界。
property_alignment: 广播权限对应手中物；独立船员对应持有者；地球存亡取决于按键对应物件可被处置。
context_alignment: 章节从技术部署深入集体恐惧，手持命运准确连接硬件控制权与政治不信任。
narrative_function: 揭示人类放弃不可摧毁系统的深层原因：惧怕自己人拥有终极权力。
transfer_rule: 用掌握写权力时，应说明持有者、可执行动作和被控制结果，避免只把命运当空泛物件。
failure_boundary: 飞船仍受技术寿命、船员选择和外部攻击限制，并非能全能操纵每条历史分支。
