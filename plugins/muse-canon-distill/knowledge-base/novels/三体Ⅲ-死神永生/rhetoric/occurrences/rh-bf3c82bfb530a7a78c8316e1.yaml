tenor: 逃入深空的引力波飞船拥有决定是否广播、进而决定地球存亡的权力
vehicle: 一件能被握在手中、由持有者选择放开或处置的命运实体
ground: 权力集中于单一主体；一个动作可改变整体结果；被决定者难以夺回控制
