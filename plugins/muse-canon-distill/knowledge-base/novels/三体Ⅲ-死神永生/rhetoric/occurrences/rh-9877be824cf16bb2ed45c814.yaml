chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 就像一个早就打算远行的人，终于卸下一切俗务，可以轻装出发了
sensory_mapping: 自杀决定像一张早备好的远行票，程心把公司、历史和痛苦从肩上逐件放下，空手走向门外。
context_fact: 她长期深度抑郁，拒绝外界信息，在得知智子将离开后平静地取出可致死药物。
image_mechanism: 远行用中性启程替换死亡终止，卸行李把心理责任实体化，因而准确呈现自杀者当刻的解脱错觉。
property_alignment: 死亡对应远行；长期念头对应早有计划；俗务责任对应行李；服药准备对应轻装出发。
context_alignment: 她曾跨越三个世纪远离旧家，远行本是传记事实；此次却把无法返回的死亡误作最后一次可控出发。
narrative_function: 让自杀决定呈现危险的平静与诱惑，为朋友电话打破这种平静设置强反转。
transfer_rule: 死亡如旅行时，应交代行李所指、出发动机和人物为何感到轻松，同时明确这种感受属于受困视角。
failure_boundary: 死亡没有目的地、返程或旅途经验，且会伤害朋友；远行喻体不能浪漫化自杀为正常选择。
quality_assessment: exemplary
