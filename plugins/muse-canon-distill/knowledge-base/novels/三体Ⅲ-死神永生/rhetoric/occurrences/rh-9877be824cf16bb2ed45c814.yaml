tenor: 程心决定服药自杀后感到解除责任、痛苦与尘世牵绊的轻松
vehicle: 计划长途旅行的人终于办完事务、卸下重行李，只带必需品从容启程
ground: 决定酝酿已久；出发意味着离开现有生活；责任被视为负重；解除牵挂带来身体般轻盈
