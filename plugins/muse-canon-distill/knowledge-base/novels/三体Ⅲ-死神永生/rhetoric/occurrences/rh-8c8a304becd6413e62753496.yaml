chapter: 【掩体纪元11年，掩体世界】
figure_type: metaphor
quote: 在旋转的星海的背景上，程心看到了掩体世界
sensory_mapping: 群星成海；光点旋流；黑潮无岸；城市浮海；头顶转动
context_fact: 程心站在旋转太空城轴端的开放太空港，周围有空气层，头顶星空随城体快速转动。
image_mechanism: 静态星空被城市自转赋予整体流动，零散光点合成一片有旋向的黑海；二十六座太空城随后像鱼群悬在巨石后，海域模型自然承接。
property_alignment: 宇宙对应海洋；星点对应波光；黑暗对应深水；视野无边对应海无岸；星空旋转对应海流；太空城对应鱼与船；木星对应水中巨石
context_alignment: 下一句鱼群避激流是同一水域框架的具体化；首处“星海”建立全景，显式鱼群卡承担局部机制，二者不重复。
narrative_function: 把太空城群置入流动环境而非静态天文图，为“掩体”关系提供生物化背景。
transfer_rule: 用星海写旋转星空时，应有密集光点、无边暗域和观察运动造成的整体流向，并让其中物体可获得漂浮关系。
failure_boundary: 只见少数固定星点、视野被建筑遮窄，或没有任何相对转动时，海的连续与流动会显得套语化。
