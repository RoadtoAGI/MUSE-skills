tenor: 太空城顶部视野中因城市自转快速绕动、密集铺满黑空的群星背景
vehicle: 无边海面布满闪光水点并整体旋流，观察者面前没有固定岸线，光点随波浪转动
ground: 深空对应海；群星对应水面闪光；星点密集对应海面无边；城市自转对应海流旋转；太空城群对应海中岛船；观察者暴露太空对应临海
