chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: “蓝色空间”号飞船像一幅宏伟的巨画舒展开来
sensory_mapping: 长舰不再前后相遮，像巨轴画卷横空铺开，舰首舰尾与舱室层层同时亮在眼前。
context_fact: 两名新手刚进入四维，第一次看见飞船外壳、舱室及封闭容器内部全部暴露。
image_mechanism: 画卷展开取消前后遮挡，把四维视野的并列性转成读者熟悉的卷轴由窄到宽的显露过程。
property_alignment: 船体纵深对应卷起画幅；升维观察对应舒展动作；全舰并列对应整画铺平；内部细节对应画面密集笔触。
context_alignment: 前文已用二维画解释升维，这里把教学模型立即落到蓝色空间号实体，让概念在同一意象中兑现。
narrative_function: 完成从抽象类比到人物所见奇观的切换，确立四维视觉的第一幅总体画面。
transfer_rule: 用展开画卷表现遮挡解除时，应让原来的纵深轴、展开动作、整体显露和局部并列逐一对应。
failure_boundary: 飞船仍是三维实体，物理部件没有压平或移动；画卷只表达四维观察下的可见关系。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 从四维视角同时显露舰首舰尾、全部舱室和内部结构的蓝色空间号
vehicle: 原本卷起或侧置的巨幅画卷完全铺平，整幅构图和各处细节同时进入视野
ground: 对象从遮挡状态变为平面并列；整体跨度一眼可见；局部细节共享同一展示面；展开过程带来宏伟感
