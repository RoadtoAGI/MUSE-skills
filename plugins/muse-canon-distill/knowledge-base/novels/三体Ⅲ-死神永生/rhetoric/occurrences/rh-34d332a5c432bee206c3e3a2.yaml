chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 精神的水面平滑如镜，倒映着正在落下的生命的太阳
sensory_mapping: 意识化成静水镜面，一轮代表生命的夕阳贴着水线下沉，余光没有激起一丝波纹。
context_fact: 她准备吞服致死药，自觉个人终结相对世界毁灭应当平静淡然。
image_mechanism: 水镜提供情绪平滑度，落日提供生命时间方向，倒影把死亡念头变成她在精神表面凝视的安静景象。
property_alignment: 麻木平静对应无波水面；意识清空对应镜面；生命结束对应日落；自杀决定对应太阳下沉。
context_alignment: 程心长期处于抑郁深海，此刻海缩成平滑表面；同一水域由压迫转成诱人的死亡宁静。
narrative_function: 把自杀前心理美化机制完整显影，随后朋友牵挂使水面破碎，反转才能具体可见。
transfer_rule: 生命如落日映水时，应同时对应情绪表面、时间方向、光线变化和打破平静的潜在扰动。
failure_boundary: 自杀不是太阳必然落下的自然过程，平静来自抑郁认知收窄；水面美感不可作为行动正当化。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心自杀前平静无波的精神状态，以及她认为自己生命正自然走向终止的意识
vehicle: 黄昏时无风水面平滑如镜，映出缓缓沉向地平线的太阳，景物安静而不可逆
ground: 情绪无扰动；意识能形成清晰单一图像；生命接近结束；过程被体验为自然下降
