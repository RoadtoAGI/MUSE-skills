chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: analogy
quote: 歌者的精神越过空间和时间的沟壑，与广播者的精神产生共振
sensory_mapping: 时空深谷；精神越谷；两端同振；恐惧回声；意识合拍
context_fact: 歌者结合坐标编码与广播记录，在意识中感受到发送文明的恐惧、焦虑、仇恨等情绪。
image_mechanism: 不可见的时间与距离先向下裂成峡谷，坐标信息成为跨谷波；当它抵达歌者意识，两颗精神像同频器物一起振动，认知变成身体响应。
property_alignment: 空间时间距离对应沟壑；广播信息对应跨谷波；发送者精神对应源振子；歌者精神对应受振子；编码相似性对应频率匹配；直觉理解对应共振；情绪强度对应振幅；恐惧感受对应回响内容
context_alignment: 歌者文明使用膜传播信息，波动共振符合其技术词库；但他刚产生同感就执行清理，物理亲近与伦理疏离形成反讽。
narrative_function: 解释高级直觉的跨时空机制，并加重清理者理解受害者恐惧后仍灭绝它的冷酷。
transfer_rule: 用共振写跨距理解时，应有来自对方的真实信号、可匹配的结构或经历、接收者的同步情绪反应和明确传播间隔。
failure_boundary: 双方没有任何信息通道、情绪完全不相似，或接收者只作逻辑推断而毫无内在响应时，共振会神秘化理解过程。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 歌者凭坐标细节和历史信息跨越巨大的传播距离与年代差，直觉重建发送者情绪并产生同感
vehicle: 一端振动越过深谷传到另一端，两个具有相近频率的物体随之同步振荡，距离虽远仍彼此响应
ground: 时空距离对应沟壑；信息传播对应越谷；两方心智对应振子；相似情绪对应同频；同感对应共振；坐标细节对应激励波；恐惧重现对应振幅增强
