tenor: 二向箔外观晶莹、薄而柔和，作用却能以不可阻挡的二维化毁灭整个恒星系，过程在歌者看来优美
vehicle: 极柔软之物拥有最强硬不可抗的力量，并像歌者把死亡内容编成旋律，以轻柔歌声完成致命表达
ground: 箔片外观对应柔软；二维法则不可逆对应最硬；投掷展开对应开口歌唱；二维化过程对应旋律扩展；星系死亡对应歌词内容；视觉唯美对应歌的美感；执行者歌者对应欣赏者与歌者
