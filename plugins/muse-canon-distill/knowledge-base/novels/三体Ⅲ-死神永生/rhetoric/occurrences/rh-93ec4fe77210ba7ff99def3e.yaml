chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: metaphor
quote: 他喜欢二向箔所体现出来的这种最硬的柔软，这种能把死亡唱成一首歌的唯美
sensory_mapping: 晶箔柔亮；规则坚硬；死亡开唱；维度成旋律；美声覆星
context_fact: 歌者嫌质量点可能清理不净，申请二向箔；这种武器会把太阳系降为二维，且其母世界也可能被迫二向化。
image_mechanism: 武器的薄、透明与安静先形成柔软表面，背后的维度规律却像不可弯折的硬核；灭绝没有爆炸巨响，而被审美听觉改写成一首逐步铺开的歌。
property_alignment: 薄箔外观对应柔软；不可阻挡的降维对应坚硬；封装解除对应起唱；二维扩张对应旋律传播；星系灭亡对应歌曲内容；平面化视觉对应唯美曲式；歌者投掷对应演唱启动；母世界悲剧对应歌中死亡
context_alignment: 执行者本名歌者且一直吟唱古歌，音乐喻体来自其审美系统；用唯美语言处理灭绝，准确暴露高级文明的伦理异质。
narrative_function: 在投出二向箔前定义其美学反差，让随后太阳系二维化既壮丽又极端恐怖。
transfer_rule: 以柔软和歌声写无声毁灭时，应让武器外观或动作确实轻柔、作用规律绝对、毁灭过程具有连续可感形态，并绑定观察者的审美视角。
failure_boundary: 武器外形笨重爆裂、效果可逆易挡，或叙事视角对死亡只有厌恶而无审美化倾向时，最硬柔软与死亡之歌都会失去角色依据。
quality_assessment: exemplary
