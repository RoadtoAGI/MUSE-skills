chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 她现在就在时间大河的江之尾，而江之头却空荡荡的
sensory_mapping: 三个世纪化成长江水程，程心停在下游江尾，父母与云天明所在的源头只剩空岸。
context_fact: 电影以长江头尾恋人表现不可跨距离，程心把自身冬眠经历转成时间河上的相同分隔。
image_mechanism: 空间恋人模型被改成时间位置，江尾说明她被水流带来，空江头则把思念对象连同整个时代一起撤走。
property_alignment: 过去时代对应江头；威慑纪元对应江尾；冬眠跨时对应顺流远行；亲人去世对应源头空荡；不能返回对应水流单向。
context_alignment: 她此前人生已多次用时间远行和江源表达，电影提供现场触发，使个人时差获得统一河流坐标。
narrative_function: 把观影感动转成程心的时代孤独，也为三体艺术真正理解人类时间经验制造反讽。
transfer_rule: 时间如河时，应明确流向、人物位置、起点与不可逆性；空间距离只在承载时间差时迁移。
failure_boundary: 可自由往返时空、过去人物仍与当前同步交流时，空江头与单向河流不成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心身处三个世纪后的未来，却发现自己过去时代的亲人和云天明都已不在的时间位置
vehicle: 一条由源头流向下游的大河，人在遥远江尾回望空无一人的江头
ground: 时间只能单向流动；主体被带到后端，与起点的人隔着不可逆距离且无法会面
