chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 看着地板上一片正在干涸的水渍，像是面对着消失的希望
sensory_mapping: 心理希望投影到脚下湿痕，水分一点点退去成为期待从现实中撤走的可见过程。
context_fact: 海上勇士未找到传说中的西欧舰队，皇帝确认拜占庭已被盟友抛弃；水渍正是他们留下的。
image_mechanism: 侦察者留下的水既是航海事实痕迹，又按蒸发过程演示消息带来的希望消亡，物证和心理后果在同一对象闭合。
property_alignment: 水渍收缩对应援军可能性降低；水分最终蒸尽对应希望归零；湿痕由归来者留下对应坏消息直接造成失望。
context_alignment: 皇帝没有抽象哀叹，而凝视报告者遗下的具体痕迹，符合重大噩耗后的注意力凝滞。
narrative_function: 让战略绝望获得缓慢、安静的视觉倒计时，并连接信使、消息和心理变化。
transfer_rule: 写希望消退时，可选由关键行动者实际留下且正在减少的物质痕迹，使来源、变化速度与结局都参与映射。
failure_boundary: 水渍若在扩大、会被再次补充或与侦察归来无关，便不能承载希望消失；短暂失望也不宜对应彻底蒸干。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 随着侦察者归来而彻底消退的欧洲援军希望
vehicle: 地板上边界收缩、即将蒸干的水渍
ground: 曾经可见而正在不可逆缩小；消失后不留下可抓取的实体
