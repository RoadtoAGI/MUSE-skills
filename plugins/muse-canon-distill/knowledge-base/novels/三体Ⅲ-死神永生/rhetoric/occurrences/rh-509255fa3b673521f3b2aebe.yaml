chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 真像牛奶洒在了天上
sensory_mapping: 黑夜成为桌面，银河白带获得液体泼洒的流向和乳质稠度，星点成为飞溅细滴。
context_fact: 程心突然站到云天明身边，仰望银河并说出这句孩子般直观的话。
image_mechanism: 牛奶同时抓住颜色、质地与偶然泼洒形状，使宏大天体结构缩成近手可见的日常小事故。
property_alignment: 银河乳白对应牛奶颜色；星云边缘弥散对应液体漫开；星点散布对应飞溅小滴。
context_alignment: 这句轻松直观的观察成为两人共享天空的记忆，符合程心让云天明感到温暖而不疏离的方式。
narrative_function: 把银河从遥远科学对象变成可亲画面，并以共同观看加深人物情感锚点。
transfer_rule: 写天体带状结构时，可选颜色、黏度和扩散边缘都相合的液体；喻体口吻还应符合说话人的年龄与关系氛围。
failure_boundary: 清晰可分的单颗星群、红色星云或规则直线光带都不似泼洒牛奶；它也不解释银河真实结构。
quality_assessment: exemplary
