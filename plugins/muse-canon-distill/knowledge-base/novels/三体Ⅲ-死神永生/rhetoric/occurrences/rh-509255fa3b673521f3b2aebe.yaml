review_status: reviewed
tenor: 夏夜横贯天空、乳白而边界弥散的银河
vehicle: 深色表面上泼洒开、扩散成不规则白带的牛奶
ground: 整体乳白而不透明；边缘散开、内部浓淡不均并横向铺展
