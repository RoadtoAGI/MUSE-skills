chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 像一副扑克牌，仅仅重洗而已……可生命是一手同花顺，一洗什么都没了
sensory_mapping: 整副纸牌；双手洗牌；牌张飞散；同花顺拆解；总数仍完整
context_fact: 观测者面对三体星云指出物质没有真正消失，但原恒星系和文明组织方式已被毁灭。
image_mechanism: 宏观爆发被缩到牌桌，所有原子像牌一张不少地留在桌上，只是洗牌手势打乱次序；生命那组罕见同花顺一散，保留原牌也无法保留其意义。
property_alignment: 物质粒子对应牌张；物质总量守恒对应整副牌不缺；角动量守恒对应洗牌规则保留；爆发对应重洗；生命有序结构对应同花顺；文明死亡对应牌型消失；随机重组对应难以复原原牌序
context_alignment: 科学家先纠正‘毁灭’的物理不准确，再用牌型说明生命层面为何仍可准确称毁灭，兼顾两种尺度。
narrative_function: 用简单概率结构区分物质守恒与生命信息丧失，提炼三体墓场的哲学意义。
transfer_rule: 用洗牌写守恒中的毁灭时，应区分元素总量、排列规则、稀有有序组合、打散过程和恢复概率。
failure_boundary: 若生命信息有完整备份、重组可确定复原，或物质本身大量湮灭，单纯洗牌模型会低估损失或错写守恒。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 恒星爆发并未减少物质和角动量，只重组了结构；三体生命这种高度有序组合却在重组中不可恢复地消失
vehicle: 一副牌洗牌前后牌张总数不变，但原先难得排列成的同花顺手牌会被随机打散
ground: 宇宙物质对应整副牌；守恒总量对应牌张不减；爆发重组对应洗牌；生命结构对应同花顺；文明毁灭对应好牌散开；重现概率极低对应不可恢复
