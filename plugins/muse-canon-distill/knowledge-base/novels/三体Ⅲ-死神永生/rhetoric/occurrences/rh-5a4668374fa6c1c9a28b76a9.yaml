chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 站在这里，几乎感觉不到半球罩的存在，仿佛置身于太空中
sensory_mapping: 半球罩被星光擦除，广场边缘溶进黑暗，人的身体像从舰壳中推出，悬在群星前。
context_fact: 广场位于舰首透明罩下，比球舱中的全息星空更强烈地触发去物质效应。
image_mechanism: 喻体没有虚构景物，而是减去可见屏障；当唯一界面失踪，封闭室内在感知上自然翻转为无遮蔽太空。
property_alignment: 罩体透明对应边界不可见；星空直面对应太空视野；近物缺失对应无遮蔽感；身体不安对应直接暴露。
context_alignment: 关一帆刚因空间狭窄恐慌，医生带他到边界最弱处，太空感既是治疗手段也引出宇航心理模型。
narrative_function: 让读者先身体体验去物质效应，再接受后文概念解释，并扩大幽闭与暴露的双重焦虑。
transfer_rule: 用置身户外写透明建筑，应说明哪些边界线索被光线、尺度或视野消除，以及剩余景观如何接管空间判断。
failure_boundary: 罩面反光强烈、框架密集或人物能触到明显墙壁时，直接置身太空的感知不会成立；物理上仍有保护层。
quality_assessment: effective
confidence: 0.96
review_status: reviewed
tenor: 站在透明半球罩下的一号广场时边界消隐造成的空间体验
vehicle: 身体直接暴露在没有墙壁、顶棚和近物参照的外太空
ground: 透明界面难以被视觉察觉；四周只剩星空，封闭建筑的保护边界从感知中退出
