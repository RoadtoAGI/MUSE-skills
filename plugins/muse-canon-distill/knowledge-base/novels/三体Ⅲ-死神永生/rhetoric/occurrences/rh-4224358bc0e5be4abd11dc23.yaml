chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 二维海洋中的这座三维孤岛不断地下沉和消融
sensory_mapping: 无厚度平面铺成大海，仅存的立体城区像孤岛被水线从四周啃蚀，十分钟内沉得无影无踪。
context_fact: 完整二维城市已向原城范围外广阔铺开，三维部分在中心显得很小。
image_mechanism: 孤岛将维度差转成介质差：有体积者成为海上陆地，无体积者成为包围海洋，边界变化因此可直观追踪。
property_alignment: 三维残部对应岛；二维区对应海；维度边界对应海岸；持续坍缩对应海蚀下沉；完全二维化对应岛消失。
context_alignment: 掩体城原是黑暗森林中的生存孤岛，此刻“孤岛”从社会功能变成几何实景，仍无法保全。
narrative_function: 从鲸背的瞬时外观提升为完整空间模型，概括太空城最后十分钟的消融。
transfer_rule: 不同状态边界写成海岛时，应分别指定海、陆、岸线、侵蚀方向和最终相变结果。
failure_boundary: 二维区不是液体，三维残部也未发生溶解；消融表示空间被逐步投射而非物质混合。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 广阔二维化区域中央尚未跌落的少量三维太空城残部
vehicle: 被海水包围、面积不断缩小并最终沉没溶解的一座孤岛
ground: 四周为另一介质；残部孤立；边界持续后退；高度或体积消失；没有援助与退路；最终完全并入周围
