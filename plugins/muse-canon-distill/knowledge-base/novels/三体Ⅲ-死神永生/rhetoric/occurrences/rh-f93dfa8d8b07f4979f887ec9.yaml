review_status: reviewed
tenor: 知晓外星飞船逼近的少数官员和观测人员屏息隐藏、害怕自身动静引来毁灭的状态
vehicle: 鱼群沉到水底躲避捕捞船，在引擎声经过头顶时不敢游动并因恐惧颤抖
ground: 捕食者位于上方且力量悬殊；被追者聚集隐蔽；声音可能暴露位置；威胁经过时间短却后果致命
