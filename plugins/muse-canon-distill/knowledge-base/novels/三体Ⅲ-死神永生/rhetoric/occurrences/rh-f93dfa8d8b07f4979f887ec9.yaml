chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 像一群躲在水底瑟瑟发抖的鱼，听着水面的捕捞船驶过
sensory_mapping: 太阳系像深水，预警人员伏在底部，外星飞船的轨迹声从头顶碾过，连说话脚步都压成气泡。
context_fact: 他们拒绝无线通信、走路放轻、说话压低，虽然所见已是一年四个月前的影像。
image_mechanism: 水下鱼群把宇宙隐蔽与日常声响禁忌连起来，捕捞船准确规定了对方可能只是路过却随时能网尽全群。
property_alignment: 人类群体对应鱼群；太阳系暗处对应水底；外星飞船对应捕捞船；压低动静对应停游屏息；毁灭风险对应被捕。
context_alignment: 真实宇宙中无线电暴露坐标，鱼怕声响虽物理上荒唐，却贴合黑暗森林形成的心理条件反射。
narrative_function: 把少数知情者的恐惧推到可笑又可信的身体细节，并保持来客身份悬念。
transfer_rule: 隐蔽群体比作猎物时，应落实捕食层级、空间上下、暴露信号、集体动作和威胁是否经过。
failure_boundary: 真空不传脚步声，飞船也未表现捕捞意图；鱼群模型呈现心理恐惧，不解释探测物理。
quality_assessment: exemplary
