chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 把自己完全封闭起来，重新变成了一部记忆机器
sensory_mapping: 舱壁变暗后，程心也关上感官外壳，大脑像录放设备一遍遍转动同一盘记忆。
context_fact: 她返航时未察觉加速减速，落地后连续五次以不同方式复述，直到任务结束才恢复情感。
image_mechanism: 机器化将主动自我压缩为存储功能，封闭舱室与封闭人格构成内外同形的工作壳。
property_alignment: 会面记忆对应数据；反复复述对应回放；忽略航行对应屏蔽外界；情绪麻木对应无感机器。
context_alignment: 此前她已要求自己成为录音机和摄像机，这里是同一框架的正式运行阶段，后文关机结束延展。
narrative_function: 压缩数小时复述流程，并把高效完成使命的代价写成暂时失去完整人格。
transfer_rule: 人进入机器模式时，应指定单一功能、输入输出循环、被关闭的人性部分和退出条件。
failure_boundary: 程心仍会理解、选择并产生潜在情绪，机器只描述功能收缩，不能取消主体责任。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 程心隔绝外界感受、抑制人格与情绪，只反复精确复述会面内容的工作状态
vehicle: 外壳封闭、按固定程序存储和回放信息而不受情感干扰的机器
ground: 输入内容被保存；输出可重复；注意功能单一；外界刺激被屏蔽；情绪不参与运算
