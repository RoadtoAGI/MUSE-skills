chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 战舰缓缓进入一片彩色的大雪中，那是人海中向他们抛出的鲜花
sensory_mapping: 花瓣和花束失去抛掷轨迹，化为多色雪片从人海上升又飘落，白色战舰像驶入庆典风暴。
context_fact: 舰员相信自己作为英雄返乡，港内全息人群欢呼并向战舰抛花，随后欢迎场景被揭示为诱捕布置。
image_mechanism: 大雪把分散花束合成天气规模，彩色保留庆典属性；美丽覆盖越密，下一刻人海消失的骗局反转越强。
property_alignment: 花束数量巨大对应大雪密度；空中飘落对应雪降；多色花瓣对应彩雪；战舰被包围对应进入雪幕。
context_alignment: 太空港无自然天气，人工花雪强化回到地球生活环境的幻觉，也使真实花束成为骗局仅存残骸。
narrative_function: 把英雄返航推到视觉高潮，为欢迎骤停、宪兵包围和待葬棺材意象蓄积残酷落差。
transfer_rule: 抛掷物如雪需满足数量、轻盈、覆盖和下降姿态；颜色修饰应保留物体身份并服务场景情绪。
failure_boundary: 少量花束、直线高速投掷或不形成包围时，大雪尺度会失真；这场雪也不证明欢迎人群真实存在。
quality_assessment: exemplary
