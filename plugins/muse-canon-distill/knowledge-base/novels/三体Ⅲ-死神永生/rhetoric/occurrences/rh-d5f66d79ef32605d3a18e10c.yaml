chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 一道拍岸浪像巨手把小船向前推
sensory_mapping: 宽大水掌；背后推力；船身一震；浪花手指；沙滩前冲
context_fact: 长帆加速划向墓岛，最后一道拍岸浪使船底触沙，也差点把公主颠下船。
image_mechanism: 无形水压在船尾聚成有掌面的巨手，浪峰抵上船壳后一次推直，把需要继续划行的最后距离替他们完成。
property_alignment: 拍岸浪对应巨手；浪峰对应掌面；水体动量对应手臂力量；小船对应被推物；向岸运动对应推送方向；船震与颠簸对应猛力接触
context_alignment: 海先以饕餮鱼阻挡航行，抵岛一刻却用浪手完成助推，使危险介质短暂转为抵达工具。
narrative_function: 给渡海动作一个有力收束，并让上岸瞬间兼具帮助与失控风险。
transfer_rule: 用巨手写浪涌推物时，应有宽面接触、明确后向前的力、物体位移、碰撞震感和介质聚拢。
failure_boundary: 浪从侧面掀翻、只在船下起伏，或船靠自身动力匀速上岸时，巨手推送会误写受力方向。
quality_assessment: effective
