review_status: reviewed
tenor: 小船冲近墓岛沙滩时，从后方涌来的拍岸浪托住船体并猛然把它送向岸上
vehicle: 一只力量巨大的手掌从后面抵住小物体，集中发力将它向前推送
ground: 浪面宽阔对应手掌；水压集中作用对应手臂发力；船被前送对应物体受推；船身震动对应巨手猛推的冲击
