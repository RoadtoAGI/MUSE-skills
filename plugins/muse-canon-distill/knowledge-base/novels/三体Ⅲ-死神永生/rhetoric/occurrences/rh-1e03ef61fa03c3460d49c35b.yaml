review_status: reviewed
tenor: 卡夫卡人物听到去死命令后立即答应并执行
vehicle: 答应倒垃圾或关门这类日常家务后随手去做
ground: 应答简短顺从且没有讨论；动作紧接语言发生，语气把任务视为低成本常规事项
