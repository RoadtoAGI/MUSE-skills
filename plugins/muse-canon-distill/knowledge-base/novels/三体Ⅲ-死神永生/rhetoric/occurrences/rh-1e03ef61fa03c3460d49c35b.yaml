chapter: 【危机纪元4年，云天明】
figure_type: analogy
quote: 就像说“好，我去倒垃圾”或“好，我去关门”一样轻快
sensory_mapping: 赴死路线被压进从房间走去做杂务的轻步节奏，桥与门、垃圾桶共享一种家常尺度。
context_fact: 云天明想到卡夫卡小说中儿子因父亲一句话立刻跳桥，并借此理解自己接受死亡的状态。
image_mechanism: 两个琐碎任务校准同一种轻快应答，死亡的极端后果被装入日常命令句式，荒诞来自语法重量与生命重量的悬殊。
property_alignment: 好字的顺从回应对应接受家务；说完即行动对应随手办事；无情绪阻滞对应低成本任务心态。
context_alignment: 云天明正在主动放弃治疗，类比揭示其死亡决定并非壮烈冲动，而是孤僻生活中的轻微撤场。
narrative_function: 把人物的自毁心理接入卡夫卡式荒诞，使重大选择呈现异常日常化。
transfer_rule: 凸显重大行为被轻量处理时，可对照同句式的低成本任务；应答节奏、执行间隔和主观负担须同步对齐。
failure_boundary: 若人物长久挣扎、激昂宣誓或被强迫执行，倒垃圾式轻快会抹掉关键心理过程。
quality_assessment: exemplary
