chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 宇宙只不过是一具膨胀中的死尸
sensory_mapping: 银河和星系嵌入巨大尸身，宇宙膨胀变成尸体鼓胀，灿烂群星成为仍在变化却无生命的组织。
context_fact: 关一帆认为光速过慢使宇宙区域永远互不知晓，维度结构又不具数学美，宇宙像病态整体。
image_mechanism: 死尸把高位截瘫进一步推到生命归零，膨胀保留宇宙最显著运动，形成有运动而无生命的悖论。
property_alignment: 宇宙持续膨胀对应尸体胀大；全域失联对应生命系统停摆；局部星系活动对应组织残余变化；整体不协调对应死亡。
context_alignment: 人物原将宇宙视为美与信仰寄托，尸体判断使审美崩塌具象化，并解释他为何突然感到衰老厌倦。
narrative_function: 把理论不和谐推至存在性恐怖顶点，给紧随其后的水滴攻击和死亡庆幸染上宇宙级阴影。
transfer_rule: 动态系统如尸体时，应区分局部运动与整体生命功能；必须说明何种协调或反馈已经丧失。
failure_boundary: 宇宙的因果局限并不等同生物死亡，且膨胀可由物理定律正常产生；这是人物哲学印象。
