tenor: 持续扩张却因各部分因果隔绝、无法形成全身协调的宇宙整体
vehicle: 失去生命和统一控制、身体仍因死后过程继续胀大的尸体
ground: 外形与尺度仍在变化，但变化缺少整体感知和目的；各部分不再通过统一生命系统协调
