chapter: 【广播纪元7年，云天明的童话】
figure_type: analogy
quote: 那时，人们的生活变幻莫测，像骑着快马在山间飞奔，时而冲上峰顶，时而跌入深谷
sensory_mapping: 疾驰马蹄；陡峭山路；峰顶开阔；深谷坠落；迎面风压
context_fact: 长帆描述王国尚与外界贸易时城市繁华、物产流动，人的阶层和际遇每天都可能改变。
image_mechanism: 抽象社会流动变成一条起伏剧烈的山路，生活把每个人按在高速马背上；峰谷在来不及准备时交替出现，刺激与风险来自同一速度。
property_alignment: 人生历程对应山路；人对应骑手；社会流动对应快马速度；财富高点对应峰顶；贫困低点对应深谷；未知事件对应前方急弯；机遇危险对应登高与坠落
context_alignment: 平淡封闭的无故事生活随后像停下的马程，动势强烈的旧时代图像让公主第一次感到‘故事’意味着波动。
narrative_function: 用身体速度说明开放社会为何同时有惊喜和危险，并与王国后来的静止形成对照。
transfer_rule: 用山间骑行写命运波动时，应对应变化速度、可识别高低点、转折不可预知、主体缺乏停下权和风险收益同源。
failure_boundary: 生活变化缓慢可控、只有单向改善，或人物能随时退出竞争时，飞奔峰谷会夸大动荡。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 故事王国开放时期个人财富、机会和处境迅速变化，可能突然暴富也可能转眼赤贫
vehicle: 骑手纵马在险峻群山间高速奔驰，接连冲顶、俯冲入谷，既兴奋又随时可能坠落
ground: 命运变化速度对应快马飞奔；成功暴富对应冲上峰顶；失败赤贫对应跌入深谷；不可预测对应山路转折；机会危险并存对应高速险行
