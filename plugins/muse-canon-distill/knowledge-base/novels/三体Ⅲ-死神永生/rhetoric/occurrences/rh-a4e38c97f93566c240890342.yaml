chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 群星的背景前出现了大批移动的星星，这些星星大多发出蓝光，有些还拖着尾迹，它们是向太阳系外逃亡的飞船
sensory_mapping: 逃亡舰队缩成一片会游动的蓝星，拖着细尾从真正群星前掠过。
context_fact: 飞船推进器开到全功率，近处飞船的光甚至在冥王星地面投下移动人影，但没有一艘降落。
image_mechanism: 先按视觉把飞船命名为星星，再揭示身份；人造光点试图加入恒星背景，却仍困在太阳系空间流中。
property_alignment: 推进光对应星光；远距船体对应点状星；尾焰对应星尾；航行对应星体移动；舰队数量对应星群。
context_alignment: 人类以恒星际飞船追逐群星，末日时飞船只能短暂伪装成星，无法真正进入恒星之间。
narrative_function: 把逃亡规模与速度做成宏阔天象，随后用地毯虫子类比立即取消其成功希望。
transfer_rule: 远距机器写成星体时，应由光点、颜色、尾迹和相对背景运动成立，并通过身份揭示产生尺度反转。
failure_boundary: 飞船不自发恒星核聚变发光，亮点来自推进器且寿命短；星星仅是远观识别。
quality_assessment: effective
