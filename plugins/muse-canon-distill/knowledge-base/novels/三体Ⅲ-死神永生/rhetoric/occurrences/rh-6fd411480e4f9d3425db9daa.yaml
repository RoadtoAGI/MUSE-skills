chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 随着各大洲的移民如洪水般拥进澳大利亚
sensory_mapping: 各洲人口化成多股水流汇向一块大陆，海岸线像堤岸承受上涨水位，内陆很快被铺满。
context_fact: 澳大利亚早期努力安置移民，后来人口规模超过住房、食品和治理能力，社会民怨上升。
image_mechanism: 洪水把迁移数量转成水位和压力，解释接收社会为何从救助转向封堵与排斥。
property_alignment: 跨洲移民流对应汇流；人数激增对应水位上涨；资源过载对应土地被淹；政策强硬对应筑堤。
context_alignment: 三体把全人类强行导向单一大陆，空间汇聚确实形成近似流域的方向结构。
narrative_function: 为澳大利亚政府心理失衡和保留领土政策提供规模背景。
transfer_rule: 人口流动如洪水时，应标明源地、汇入口、承载上限和边界反应，避免单纯污名化人数。
failure_boundary: 移民是受害者且有组织能力，不是自然灾害；若省略强制迁移原因，洪水喻体会把责任转嫁给人群。
