quote: 剩下的都是猜测，你也只把它当成猜测好了，一部我们编出来的暗黑神话
sensory_mapping: 零散物理证据被串成一部长夜神话，维度、光速和归零者如神力交战，结局只剩世界衰亡。
context_fact: 关一帆承认只掌握一点实情，随后多次要求程心把完整图景视为猜测。
image_mechanism: 神话为推测划定认识边界：它能组织巨大因果并制造情绪，却不能获得科学证明的事实地位。
property_alignment: 宇宙起源推演对应创世神话；规律武器对应神力；证据空缺对应传说不可证；黑暗结局对应末世叙事；二人编连对应讲述者。
context_alignment: 科学家关一帆主动贬低自己的理论叙事，显示他既被模型吸引又警惕它伤害程心。
narrative_function: 给宏大宇宙史加上不可靠性标记，同时保留其作为恐惧图景的文学力量。
transfer_rule: 推测体系比作神话时，应写清可组织的证据、无法验证的缺口、叙事诱惑和讲述者自限。
failure_boundary: 其中可能包含真实物理历史，并非纯虚构；神话标签不能作为反证。
