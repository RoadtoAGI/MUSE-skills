figure_type: analogy
quote: 太平洋的波涛已被距离抹去，像镜面一般光洁地反射着阳光，大片的云层像贴在镜面上的雪白肥皂沫
sensory_mapping: 太平洋铺成暗蓝镜盘，海浪纹理全被磨平，云层像洁白皂沫黏在镜面上缓慢移动。
context_fact: 太空艇从地球边缘看日出，距离已使海面波涛不可见，只能看到反光和云层。
image_mechanism: 镜面先解释尺度压平和反光，肥皂沫再为云层提供薄、白、浮贴的近表面位置，构成完整俯视材质图。
property_alignment: 海洋蓝面对应镜子；波涛消失对应镜面平整；阳光反射对应镜光；白云对应泡沫；云贴海上对应沫附镜面。
context_alignment: 程心首次从太空看地球，家园宏观景观被转换为可托在眼前的生活物件，亲近感与尺度震撼并存。
narrative_function: 建立地球日出的低部画面，为上方太阳金蛋和新生符号提供暗蓝承载面。
transfer_rule: 俯视地表如日常平面时，应同时匹配底色、纹理消失、反光和覆盖层的贴附关系。
failure_boundary: 太平洋并非固体镜面，云也不是泡沫且位于大气不同高度；距离近时全部对应会失效。
