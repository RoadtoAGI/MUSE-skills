tenor: 原被认为来自遥远恒星系、如今可能由太阳附近飞行器迅速发动的文明毁灭打击
vehicle: 掌管死亡的神祇从遥远地平线突然贴到人面前，随时可以挥下致命武器
ground: 主体代表必死威胁；预期距离骤然缩短；到来难以预测；受害者几乎没有反应时间
