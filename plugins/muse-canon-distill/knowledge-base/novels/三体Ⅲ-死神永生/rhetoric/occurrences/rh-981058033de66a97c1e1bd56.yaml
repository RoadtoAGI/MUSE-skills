chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 原以为远在天边的死神，赫然出现在眼前
sensory_mapping: 人类先把持镰死神放在六光年外，新的观测却让黑袍面孔突然占满眼前，镰刃已经举起。
context_fact: 光粒可由移动飞船发射，打击者不必位于已知恒星系，出现速度和方向因此更不确定。
image_mechanism: 死神把技术打击人格化为死亡执行者，远近短语则在一句中完成威胁模型的空间突变。
property_alignment: 光粒毁灭对应死神索命；遥远恒星源对应天边；近处飞船对应眼前；预警缩短对应突然现身。
context_alignment: 人类刚亲眼看见三体死亡，死神不再是抽象理论，而像沿同一视线从三体星旁来到太阳系面前。
narrative_function: 用最短距离翻转总结新模型，使后续社会沉寂具有明确死亡压迫。
transfer_rule: 危险如死神时，应绑定具体致死机制、旧预期距离、新发现位置和预警时间变化。
failure_boundary: 打击尚未发射，攻击者也未必在太阳附近；死神形象表达风险升级，不是到达事实。
