tenor: 云天明在航天中心门外等待程心却始终未见的时刻
vehicle: 他长期远距爱慕、等待微小回应却从未主动接近的一生
ground: 主体持续守候而目标出现概率极低；时间被等待占据，行动又受自我克制限制
