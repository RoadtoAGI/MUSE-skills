chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 这一刻很像他的一生，执著地守望着一个渺茫的希望
sensory_mapping: 门口的一段等待被纵向拉长到二十八年，出口成为人生尽头可能出现希望的狭小窗口。
context_fact: 他远赴上海只为看程心一眼，在单位外守候很久仍未见她。
image_mechanism: 局部场景与整个人生共享同一姿态，空间中的门和时间中的希望重合；小尺度重复让命运结构突然可见。
property_alignment: 等程心出门对应多年等她关注；不敢联系对应只守望；出现概率低对应希望渺茫。
context_alignment: 这次仍由他独自等待、程心并不知情，完整复现单恋中的被动方式。
narrative_function: 用现场微缩总结人物弧线，使一次未见成为其生活模式的自我认知。
transfer_rule: 以一刻比一生时，应核对姿态、目标、阻碍和结局是否同构；局部事件需是长期行为模式的高密度复现。
failure_boundary: 若这次等待方式与他过去不同、目标很快出现或他主动联系，微缩人生的同构性就被破坏。
