chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 有两匹快马像幽灵一般出了王宫
sensory_mapping: 两骑贴着墨黑大地滑出宫门，马蹄和人影像没有重量的鬼影掠向西方。
context_fact: 两人正前往地堡以魔画杀死国王王后，行踪不能被宫廷发现。
image_mechanism: 幽灵同时解释低可见度与死亡使命，让偷行方式和行动后果在一个形象中重合。
property_alignment: 暗中骑行对应鬼影出没；快速远去对应飘行；隐蔽无声对应无实体；谋杀目的对应死亡气息。
context_alignment: 黑云帷幕与墨汁大地已抹去背景，两骑因此像从宴会世界撤出的亡灵。
narrative_function: 以简短剪影把场景从王宫转到地堡，并预告当夜多人将消失。
transfer_rule: 夜行者写成幽灵时，应把光线、声响、移动质感和其任务的死亡意味对齐。
failure_boundary: 骑手有实体且马蹄会发声，幽灵的超自然能力不属于他们；魔力来自画。
