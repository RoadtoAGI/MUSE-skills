chapter: 【危机纪元元年，生命选项】
figure_type: metaphor
quote: 宇宙中的生命并不稀少，宇宙是很拥挤的
sensory_mapping: 遥远星空间距被心理压缩，文明像沉默人群站在黑暗房间，空旷星空转成隐藏密度。
context_fact: 杨冬从母亲资料知道生命普遍存在，因而怀疑生命已像改变地球那样改变宇宙。
image_mechanism: 拥挤不是只报数量，而把数量转成相互作用压力；看似空旷与实际密集的反差生成她的恐惧问题。
property_alignment: 众多文明对应人群数量；文明扩张范围对应个体占位；潜在相互作用对应拥挤者彼此碰撞。
context_alignment: 黑暗森林知识尚未公开，拥挤先以直觉空间感预告宇宙环境并非自然空白。
narrative_function: 把生命选项从地球推向宇宙，成为杨冬最后问题的认知跳板。
transfer_rule: 以拥挤描述稀疏尺度对象时，需要相对其活动半径而非肉眼距离衡量密度；还要说明共处造成的相互影响。
failure_boundary: 若文明彼此永远不可达、活动范围不重叠，绝对数量多也不构成功能性拥挤；该词不能证明具体冲突已发生。
quality_assessment: effective
