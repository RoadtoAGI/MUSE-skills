review_status: reviewed
tenor: 大量文明分布于宇宙并可能彼此影响的事实
vehicle: 许多主体共处有限空间、活动范围互相逼近的拥挤场所
ground: 主体数量高于表面所见；各自活动占用空间并可能相遇、冲突或改变公共环境
