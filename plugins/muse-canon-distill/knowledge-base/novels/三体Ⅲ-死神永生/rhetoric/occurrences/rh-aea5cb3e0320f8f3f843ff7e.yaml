chapter: 【公元1453年5月，魔法师之死】
figure_type: metaphor
quote: 自己是一株倒在淤泥中的小草，在路人不断的践踏下，早已与淤泥混为一体了
sensory_mapping: 瘦弱女子缩成泥中草茎，顾客与路人成为脚步；身体、衣物和尊严被踩进湿黑泥浆。
context_fact: 她为免饥饿离家卖淫，虽有衣食和远行经历，却认为自己已经无法脱离风尘身份。
image_mechanism: 倒下、践踏、混泥形成三阶段衰败链：先失去支撑，再遭重复外力，最后连可辨认的自我边界都消失。
property_alignment: 社会弱势对应小草纤弱；离家卖淫对应草倒入泥；顾客反复消费对应路人践踏；身份污名内化对应草与淤泥混同。
context_alignment: 她随后想凭神迹成为圣女，泥中草的自我形象解释这种跃迁愿望为何极端强烈。
narrative_function: 把家族贫困和性剥削的长期作用凝成身体性自画像，为人物野心与悲剧提供心理根基。
transfer_rule: 写长期贬损形成的自我认同时，可选会被环境同化的弱小生命，并按失势、受压、失去边界组织动态。
failure_boundary: 若人物仍保有稳定尊严、掌控交易或能随时脱离环境，与淤泥混同会抹掉能动性；一次伤害也不足以形成反复践踏。
