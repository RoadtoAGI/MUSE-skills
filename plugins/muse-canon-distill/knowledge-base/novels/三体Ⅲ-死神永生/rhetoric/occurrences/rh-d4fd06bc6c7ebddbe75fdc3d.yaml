chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 从他那个高度看过去，海面上仿佛出现了一颗拖着雪白彗尾的彗星
sensory_mapping: 明亮彗核；雪白长尾；暗色背景；高速轨迹；高空俯瞰
context_fact: 小船穿过死亡之海驶向墓岛，香皂在船后生成不断扩散的白色泡沫带。
image_mechanism: 高处视角抹去船上人物，把船压成一个移动亮点；泡沫保留为长尾，在暗海上组成一颗横向飞行的白彗星。
property_alignment: 小船对应彗星核心；白色泡沫对应彗尾；尾迹扩宽对应彗尾发散；船速对应彗星运动；海面对应星空；王子高视点对应远距天文观察
context_alignment: 前面近处视角把泡沫写成云河，此处切到巨人高视点，尺度提升后同一航迹自然变为天体。
narrative_function: 显示王子为何注意到小船，并把渡海行动放大成死亡海域中的奇观信号。
transfer_rule: 用彗星写移动物与尾迹时，应匹配亮核、后拖长带、方向一致、尾部扩散和暗色大背景。
failure_boundary: 尾迹在物体前方、迅速断裂无连续形，或背景明亮拥挤时，彗星方向与可见度均不成立。
