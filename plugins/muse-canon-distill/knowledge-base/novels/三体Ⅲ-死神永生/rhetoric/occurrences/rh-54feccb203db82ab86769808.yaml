figure_type: analogy
quote: 这些人出现在这里，就如同在公元世纪看到一群手持弓箭大刀的人一样
sensory_mapping: 旧枪列队；黄铜弹链；弓刀错时；时代倒流；古兵新城
context_fact: 为避开现代电子系统被入侵，自卫队携带新制造但采用古代纯机械结构的步枪和实体子弹。
image_mechanism: 叙述把武器代差整体平移一个时代：未来人看到步枪的惊异，等同今人看到弓刀；熟悉枪械由此重新变成考古物。
property_alignment: 未来战士对应现代人群；机械步枪对应弓箭大刀；掩体技术背景对应公元现代；落后结构对应古兵器；实体弹药对应箭矢刀锋；视觉威胁对应武器仍可杀人；时代错位对应突兀出现
context_alignment: 纯机械武器不是落后军队的无奈，而是面对信息战的主动防护；类比只解释历史观感，后文立即保留其威慑力。
narrative_function: 让读者通过一次时代平移体会未来人的陌生目光，并提示战争迫使技术反向选择。
transfer_rule: 用历史兵器类比未来旧技术时，应保持相近的时间跨度、功能同类与仍有效的物理机制，同时说明为何旧物被重新采用。
failure_boundary: 旧设备只是复古装饰、技术差距很小，或在当前冲突中已完全无效时，弓刀类比会夸大时代错位与威胁。
