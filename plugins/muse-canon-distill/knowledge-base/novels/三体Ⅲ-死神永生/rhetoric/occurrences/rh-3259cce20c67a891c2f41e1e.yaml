review_status: reviewed
tenor: 太空城中年妇女因长期谋生、操持日常和物质压力而失去年轻时的精致外表与从容气质
vehicle: 粗糙磨具长年摩擦物体表面，把原有光泽、柔和曲线和精细纹理一点点磨掉
ground: 生活压力对应磨具；岁月劳作对应反复摩擦；风韵对应表面光泽；不修边幅对应纹理磨损；市井气质对应粗糙结果；长期过程对应渐磨
