chapter: 【掩体纪元11年，掩体世界】
figure_type: metaphor
quote: 被生活磨去了风韵
sensory_mapping: 生活砂轮；光泽磨退；面容粗糙；岁月摩擦；风韵成屑
context_fact: 程心在公交车上看见两名讨论菜价和批发市场的普通妇女，掩体时代重新出现为生活奔忙的阶层。
image_mechanism: 抽象生计被赋予砂纸触感，每次讨价、劳作和疲惫都是一次细摩擦，直到身体仍在却失去此前时代普遍维护的精致表层。
property_alignment: 生活压力对应砂轮；日常奔忙对应摩擦；外貌风韵对应抛光层；疲惫对应磨损；市井化对应表面变粗；多年谋生对应持续打磨；失去精致对应光泽脱落
context_alignment: 威慑与广播纪元人人外表精致，掩体纪元恢复物质压力；磨损既写个体衰老，也写社会分层重现。
narrative_function: 通过一张普通面孔呈现时代经济结构，让“回到公元生活”的温暖带有真实代价。
transfer_rule: 用磨损写生活改变人时，应有长期重复压力、可见外表或气质损耗和明确未被修复的粗糙痕迹。
failure_boundary: 变化来自一次疾病、主动审美选择，或人物仍保持从容精致而只是年龄增长时，生活磨损会误判原因。
