chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 恒星的光芒淹没了一切星星
sensory_mapping: 太阳亮度像白色洪水灌满舷窗，细小星点一颗颗沉到光面之下。
context_fact: 太空艇朝太阳无动力滑行，透明罩随后调暗以便程心继续观察。
image_mechanism: 淹没把亮度竞争转成液面高度差，星星不是熄灭，而是被更强光场覆盖。
property_alignment: 太阳强光对应洪水；视野对应低地；弱星光对应被淹物；不可见对应沉入水下。
context_alignment: 此前地球被写成羊水中的胚胎，液体意象延续到太阳光，却由保护介质转为压倒性洪流。
narrative_function: 以动态覆盖交代观测条件变化，并把太阳的尺度优势直接压入视觉。
transfer_rule: 强光写成洪水时，应对齐扩张范围、亮度层级、被遮对象和对象仍存在的事实。
failure_boundary: 光不具液体重量，星星也未被物理覆盖；比喻只解释视觉阈值。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 太阳强光进入视野后令较暗星光全部不可见的亮度压制
vehicle: 洪水上涨并覆盖低处事物，使它们沉到水面以下消失
ground: 一种介质迅速占满视野；较弱对象被覆盖；对象仍存在却无法看见；强度差决定消失
