chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 像被遗失在远方的一小堆积木玩具
sensory_mapping: 线尽头的塔楼宫墙缩成几枚彩色木块，孤零零留在地平线上，像主人已离开游戏。
context_fact: 王宫已被冰沙夺控，国王王后消失，公主正逃往海边且没有追兵。
image_mechanism: 积木同时匹配建筑几何与儿童玩具尺度，遗失一词把政治中心改成被放弃的旧游戏场。
property_alignment: 宫殿楼群对应积木堆；远景缩小对应玩具尺寸；逃离对应遗失；政权崩塌对应可拆散。
context_alignment: 公主正在被迫长大，故宫却缩成童年玩具，空间远离与身份转变在同一画面完成。
narrative_function: 切断王宫的宏伟权威，宣布逃亡旅程进入王宫之外的新世界。
transfer_rule: 远景建筑比作玩具时，应匹配几何块面、观察尺度、人物离弃动作和地位变化。
failure_boundary: 王宫仍是大型真实建筑，政治后果也未因远看而变小；积木的可操纵性不应外推。
quality_assessment: exemplary
