tenor: 从远处山冈看去缩成微小建筑群、已被逃亡者留在身后的王宫
vehicle: 孩子玩后遗落在地面远处的一小堆积木，尺度微小、可拆散且无人照管
ground: 远距造成缩小；建筑由简单块体组成；位置被抛在身后；昔日重要性突然降低；显得脆弱可毁
