chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 她经历了一段“时间真空”，那一刻的长短不可能用时间来计量，因为那一刻时间不存在
sensory_mapping: 那一瞬像把时间从舱内抽空，长短、先后和过程全无着落，只剩从一侧跨到另一侧的感觉。
context_fact: 死线扩散使穿梭机瞬间跌入低光速，程心同时感到时刻无限短又无限长。
image_mechanism: 真空将抽象的‘无时间’变成介质被抽走的空间经验，解释为何长度概念连同计时基准一起消失。
property_alignment: 时间不存在对应介质抽空；无法计量时长对应真空中常规行为失效；跨越边界对应进入真空区；时间恢复对应重新有介质。
context_alignment: 人物身处密闭飞船，真空本是航天经验中可理解的危险状态，用它命名时空过渡符合专业语境。
narrative_function: 为物理突变提供可命名的主观体验，并把后续系统停摆与时间结构改变联系起来。
transfer_rule: 用真空表示抽象量缺失时，应说明被抽走的是什么、哪些测量随之失效、边界如何穿越以及何时恢复。
failure_boundary: 时间不是填充空间的物质介质，程心仍形成了事件记忆；真空只描述参数不可定义。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 穿梭机从正常光速跌入低光速时经历的、时间参数无法定义的过渡状态
vehicle: 容器中物质被抽空形成真空，内部不再具有通常介质及其相关行为
ground: 某种基础介质缺席；常用计量失效；内部与外部状态断裂；穿越者仍有边界感；持续量无法按常规定义；结束后介质恢复
