chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 大多数人也只是在那一小块时空中生活过，就像公元世纪那些一辈子都没有走出过山村的老人
sensory_mapping: 整个太阳系在银河尺度上缩成一座山村，六十亿人从出生到死亡都未走出村口的星际黑暗。
context_fact: 太阳系居民直到灭亡才少数乘逃亡飞船，人类对真实星际战争和宇宙终结几乎无知。
image_mechanism: 山村用熟悉地理封闭缩放太阳系，恒星际边界相当于村口，文明先进与宇宙经验贫乏并存。
property_alignment: 太阳系对应山村；恒星际空间对应外部世界；居民对应老人；无光速飞船对应无出村条件；宇宙之谜对应外界未知。
context_alignment: 程心来自被毁山村，关一帆属于走出村口的银河人类；两者知识差通过生活半径而非智力高低区分。
narrative_function: 概括太阳系文明的局限，也为关一帆随后解释真正宇宙战争提供认知台阶。
transfer_rule: 封闭文明比作山村时，应对齐空间边界、迁移条件、信息来源、终生范围和外部未知。
failure_boundary: 太阳系内部尺度巨大且科技复杂，居民也掌握天文学；山村相似只针对银河旅行经验。
