figure_type: analogy
quote: 人群很快变成了长长的队列，仿佛在运行一个数组排序程序一样
sensory_mapping: 散乱人点变成屏幕里的数组元素，恐惧像排序指令扫过，每个人被挪进一条长线。
context_fact: 智子杀人后宣布先吃饭者活、插队者死，人群随即排队，队尾绕过巨型帐篷。
image_mechanism: 排序程序把道德和恐惧造成的群体服从写成机械运算，个体只剩可交换位置的元素。
property_alignment: 混乱人群对应无序数组；死亡规则对应排序条件；各自排位对应元素移动；长队对应有序输出。
context_alignment: 超信息社会刚因基础设施消失而失明，此刻最原始暴力却像高效程序恢复秩序，形成技术讽刺。
narrative_function: 用一次瞬时重排显示恐怖治理效率，并把抢食暴民转成服从队列。
transfer_rule: 群体秩序类比算法时，应对应输入状态、规则、单位移动和输出结构，且指出谁执行规则。
failure_boundary: 人并非无感数据，排序代价包含真实死亡和恐惧；程序也不解释后续秩序的合法性。
