chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 云层像一只逗弄她的巨掌，捂着她的礼物不放开
sensory_mapping: 云幕合成一只横覆纽约天空的掌，星星成为掌心下被捂住的微小礼物。
context_fact: 程心迫切想看赠星，但纽约连续三天阴天；她相信恒星不会丢失。
image_mechanism: 掌的覆盖对应云层，逗弄把天气偶然转成短暂游戏；不放开延长等待，却因礼物永久而不转成真正剥夺。
property_alignment: 云层遮天对应手掌覆盖；星不可见对应礼物被捂住；连续阴天对应迟迟不松手。
context_alignment: 程心没有失落，逗弄而非抢夺保留轻微亲昵感，符合她确信未来能看到。
narrative_function: 让不可见恒星仍以被遮礼物存在，延长赠星情感而不削弱确定性。
transfer_rule: 天气人格化时，动作应来自云的真实遮挡，意图强度要匹配人物反应；乐观人物适合游戏性阻隔而非恶意剥夺。
failure_boundary: 若恒星已消失、云层短暂掠过或程心陷入绝望，逗弄巨掌的持续轻意会失配。
quality_assessment: exemplary
