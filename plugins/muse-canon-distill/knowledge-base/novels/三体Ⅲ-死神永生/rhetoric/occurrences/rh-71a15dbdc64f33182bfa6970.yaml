chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 仿佛是许多只向他拢抱过来的怜阀的手臂
sensory_mapping: 地面影带竖起成手臂，太阳西斜造成的增长变成缓慢伸手和合抱。
context_fact: 云天明久等程心不见，临近日落仍独守门外，感到自己一生都在守望渺茫希望。
image_mechanism: 影子真实增长提供拥抱动作，怜悯则来自他把无生命环境当作唯一见证者；越多手臂靠近，人际空缺越明显。
property_alignment: 长影对应伸长手臂；影子向他方向延展对应拢抱；多物投影对应许多手臂；孤独处境对应需要怜悯。
context_alignment: 他拒绝打扰程心，实际无人拥抱；夕影只能模拟关怀，温柔表面仍含深重自怜。
narrative_function: 让时间推移与人物孤独在同一地面运动中显形，并为等待落空收束情绪。
transfer_rule: 影子拟人应利用太阳角度造成的真实方向变化；情感动词需由人物当下需求赋义，不能脱离投影运动。
failure_boundary: 影子缩短、背离人物或只有单一短影时，拢抱动作不成立；人物若厌恶接近，怜悯拥抱也会错调。
