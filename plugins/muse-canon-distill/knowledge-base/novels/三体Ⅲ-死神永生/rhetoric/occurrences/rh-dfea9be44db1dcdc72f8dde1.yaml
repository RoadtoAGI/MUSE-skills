chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 刀在空气中呜呜作响，像电风扇一般看不见了
sensory_mapping: 刀身从一条亮线扩成透明圆盘，锋刃不可分辨，只留下风扇般的呜声和迎面气流。
context_fact: 智子拔刀后单手旋转挥舞，停止时只削落AA一小缕头发。
image_mechanism: 电风扇同时解释看不见叶片与听得见旋转，把超快刀法降到熟悉机械运动。
property_alignment: 刀刃高速旋转对应扇叶转动；刀身消影对应叶片视觉融合；呜声对应电扇嗡鸣；扫掠区域对应扇面。
context_alignment: 日常器械的稳定转速反衬武士刀的危险边缘，也说明智子能精确维持高速而不伤程心。
narrative_function: 清楚展示人类无法追踪的速度，为一缕断发形成的精准威慑提供动作依据。
transfer_rule: 描写高速旋转物时，可用读者熟悉的视觉融合现象，同时匹配转轴、扫掠面与声音。
failure_boundary: 刀没有电机、叶片和持续送风功能；若运动是直线劈刺而非旋转，电风扇不适用。
