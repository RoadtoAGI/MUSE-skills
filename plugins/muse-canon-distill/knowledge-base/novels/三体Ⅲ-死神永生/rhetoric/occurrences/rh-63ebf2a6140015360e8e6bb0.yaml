chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那些被击中的建筑先是熊熊燃烧，然后像烂掉的果实一般从几百米高度坠落到地面
sensory_mapping: 巨树城市成为果树，燃烧楼体像黑烂果肉从枝端松脱，成片砸落根部。
context_fact: 水滴穿过三座城市的巨树森林，撞击枝上建筑，造成三十多万人死亡。
image_mechanism: 果实保留城市建筑的悬挂结构，又用腐烂把撞击后的内部失效和不可挽回下坠合并为一个过程。
property_alignment: 树枝建筑对应枝头果实；撞击破坏连接对应果柄腐断；燃烧败坏对应果实腐烂；高空坠落对应落果。
context_alignment: 未来城市本就以巨树为承载，果实喻体从环境结构内部生长，不需另造空间关系。
narrative_function: 让宏观城市伤亡变成连续落果图景，显示水滴只需穿行便能收割悬挂建筑。
transfer_rule: 建筑依附树状结构时，可从枝、连接点和坠落方式寻找植物喻体，并匹配受损阶段。
failure_boundary: 建筑不是有机腐败，燃烧也不同于腐烂；若建筑位于地面或主动飞离，落果机制不成立。
