tenor: 水滴撞毁后从巨树枝干上燃烧坠落的悬挂建筑
vehicle: 腐坏后失去果柄支撑、从高枝脱落并摔向地面的果实
ground: 对象原本悬挂枝上；连接处受损后脱落；下坠时结构已败坏并将在地面破碎
