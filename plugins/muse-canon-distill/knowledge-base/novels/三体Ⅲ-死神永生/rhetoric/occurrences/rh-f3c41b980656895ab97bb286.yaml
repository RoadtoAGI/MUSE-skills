chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 声音听起来有些怪异，像是吟唱一般
sensory_mapping: 逃亡者最后的话被速度拉长变调，每个短句像隔着宇宙唱出的一小段哀吟。
context_fact: 星环号高速远离太阳系，信号频率受多普勒效应改变，通信越来越稀疏。
image_mechanism: 吟唱把技术失真转成末日声乐形式，普通私语在传播终点取得无意的挽歌感。
property_alignment: 频移对应音调变化；拉长话音对应吟唱拖腔；短促信号对应分句；末日告别对应哀歌仪式。
context_alignment: 先前木星频道出现圣歌，此处所有残存人声都被物理效应改造成吟唱，太阳系以歌声终止。
narrative_function: 给最后通信列表统一听觉质地，并把冷物理效应与人类告别情绪重叠。
transfer_rule: 失真语音比作吟唱时，应指出音高、时长、节奏的具体变化及情境赋予的仪式色彩。
failure_boundary: 说话者没有主动歌唱，内容仍是日常临终话语；吟唱只描述接收端听感。
