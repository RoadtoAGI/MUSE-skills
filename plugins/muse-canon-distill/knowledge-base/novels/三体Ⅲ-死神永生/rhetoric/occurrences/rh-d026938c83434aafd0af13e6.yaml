chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 仿佛时间也被封闭在这里不再流动
sensory_mapping: 钢门不仅封住大厅，也像阀门截断时间河流，白墙之间的岁月成为一潭没有波纹的静水。
context_fact: 地下大厅一片死寂，程心将独居十年甚至半世纪，并把这里当作全部世界。
image_mechanism: 封闭从空间边界扩张到时间通道，不再流动把声音、活动和事件的缺失统一成液体停滞。
property_alignment: 钢门隔绝对应容器密闭；大厅无声无活动对应水面静止；长期独居对应外部时间无法进入；生活气息缺失对应流动停止。
context_alignment: 前一句旧人生如水漏出，此处同一流体系统反向封死：旧水排尽，新空间却没有时间流入，形成连续意象。
narrative_function: 把接任后的漫长孤独压缩为时间停滞，并推动程心主动布置环境、恢复生活气息。
transfer_rule: 将封闭空间延伸为时间停流时，应承接门、阀或容器结构，并用事件稀缺证明流速下降。
failure_boundary: 大厅内活动频繁、外界交流不断或人物主观时间飞逝时，完全停流不成立；后文再次称坟墓属于前述框架复现。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 白色控制大厅死寂无变化、程心将与外部生活隔绝的主观时间状态
vehicle: 本应流动的液体被锁进密闭容器，失去出口后完全停滞
ground: 空间隔绝切断外界变化输入；持续过程失去可感运动，仿佛凝在同一时刻
