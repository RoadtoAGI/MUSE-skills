chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 太空仿佛是一座突然关灯的大厅
sensory_mapping: 巨大大厅；主灯骤灭；瞬时黑场；远处微光；眼睛来不及适应
context_fact: 核爆火球维持约三十秒后消失，亮度反差使一个天文单位外的太阳都显得无力。
image_mechanism: 宇宙被临时围成有顶有墙的亮厅，氢弹充当吊灯；开关一断，白色空间瞬间坍回黑幕，只余太阳像角落小灯。
property_alignment: 太空对应大厅；氢弹火球对应主灯；爆炸持续对应开灯；熄灭对应断电；远太阳对应弱辅助灯；瞬间黑暗对应光源切换；观察艇对应厅内人
context_alignment: 从‘吞没宇宙’的无边白光转到室内关灯，尺度骤收准确表现视觉适应后的太阳失色。
narrative_function: 给核爆结束一个瞬时开关动作，划分试验高潮与冷却余波。
transfer_rule: 用关灯大厅写强光骤灭时，应有此前统一照明、单一主光源、瞬时切断、空间仍在和残余弱光。
failure_boundary: 光焰缓慢衰减、多个光源接替，或环境本来暗淡时，突然关灯会夸大转变速度。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 氢弹火球熄灭后，刚被极强白光充满的周围太空瞬间恢复黑暗，远处太阳也显得暗弱
vehicle: 灯火通明的巨大大厅被突然切断电源，空间结构尚在却在一瞬失去主要照明
ground: 核火球对应大厅主灯；火球熄灭对应关灯；太空范围对应大厅；视觉骤暗对应断电；远日弱光对应残余小灯
