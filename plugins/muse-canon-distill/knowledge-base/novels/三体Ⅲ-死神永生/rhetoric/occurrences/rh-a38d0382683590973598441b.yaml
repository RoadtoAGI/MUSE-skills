tenor: 仅容纳冬眠人体、没有常规生活空间的极简深空单人舱
vehicle: 贴合一具身体、封闭且用于安置死者的棺材
ground: 内部尺寸只够人体平躺；长期封闭、无自主活动且与生死悬置相连
