chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 单人舱(可以简单到像一口棺材)
sensory_mapping: 航天舱壁收紧到棺木板面，冬眠者横卧其中，飞行被视觉化为一具封棺漂向深空。
context_fact: 一百八十公斤质量上限迫使人体、冬眠设备和舱体极端减重，航行持续两个世纪。
image_mechanism: 棺材同时提供最小几何包络和死亡预感；工程简化越成功，乘员作为活人的需求越被削除。
property_alignment: 单人平躺对应棺内尸体；极窄封闭对应棺木贴身；长期冬眠无活动对应死亡静止。
context_alignment: 候选人本就可能永不苏醒，棺材让质量讨论中的伦理风险提前可见。
narrative_function: 直观解释舱体可如何减重，并让技术可行性携带人命代价。
transfer_rule: 极简载人空间借棺材写时，应同时存在贴身尺寸、长期静止和高死亡概率；只因外壳长方不能成立。
failure_boundary: 若舱内可活动、有完备生活系统或乘员定期清醒，棺材的贴身静止会误导；它也不等于任务必死。
