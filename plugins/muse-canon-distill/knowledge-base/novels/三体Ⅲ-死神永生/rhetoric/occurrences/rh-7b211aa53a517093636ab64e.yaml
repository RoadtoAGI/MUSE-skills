context_fact: 维德告诉她DX3906是云天明所赠，揭开她不知情地利用爱慕者的事实。
image_mechanism: 跌进赋予消息到来的突发落差，冰窖把罪疚和阶梯计划深空低温合为一处身体环境。
property_alignment: 秘密揭晓对应突然坠落；震惊寒颤对应冰窖低温；罪疚困住对应窖壁封闭。
context_alignment: 云天明大脑将被冷冻，冰窖温度从他的命运反射到她身上，情节意象闭合。
narrative_function: 用瞬时温降标记真相击中，推动她从职业判断转为私人崩溃。
