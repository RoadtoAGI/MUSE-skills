chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 像灰星长出的五根黑色头发
sensory_mapping: 光秃灰色石球上突兀冒出五根黑丝，细得不可思议，却每根都伸过百千米轨道。
context_fact: 死线外径为曲率引擎作用面，内部光速为零，近看会呈宽达数百米的黑色巨柱。
image_mechanism: 头发利用远距尺度把巨柱缩成细丝，先产生轻微荒诞，落地近看后再以尺度翻转制造敬畏。
property_alignment: 灰星球体对应头；表面端点对应毛囊；黑线对应发丝；百千米长度对应长发；五条对应稀疏发数。
context_alignment: 灰星刚被称为光秃石球，下一句却让它“长出头发”，相邻意象以矛盾完成视觉更新。
narrative_function: 提供轨道远景的第一识别形象，并为地表巨柱与死神宫殿的近景升级蓄势。
transfer_rule: 行星细长结构比作头发时，应注明观察距离、相对尺度、一端附着和近看尺度反转。
failure_boundary: 死线不柔软、不生长，也非生物组织；头发相似只在远观黑细长形。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 五条从灰星表面垂直伸向百千米太空、极细笔直的零光速死线
vehicle: 从圆形头颅表皮生出、颜色乌黑、细长柔韧并向外延伸的五根头发
ground: 一端固定表面；另一端伸向外部；细长；黑色；相对行星极细；数量可数；使天体取得身体感
