chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 如果宇宙是一个大战场——事实上它就是——在阵地间，狙击手们射杀对方不慎暴露的人，比如通信兵，或伙头军什么的，这就是黑暗森林状态
sensory_mapping: 恒星文明像阵地后的士兵，一次广播如探头或发报，远处看不见的狙击手随即扣动宇宙尺度扳机。
context_fact: 地球因坐标广播遭光粒和维度打击，但关一帆说这仍不是星际战争主体。
image_mechanism: 战场类比保留黑暗森林隐蔽与猎杀，却把它降格为狙击小事，从而打开更庞大的规律武器战争。
property_alignment: 文明世界对应阵地人员；通信对应暴露；黑暗森林打击对应狙杀；远距武器对应狙击枪；宇宙大战对应总体战争。
context_alignment: 三体时代把黑暗森林视为宇宙终极图景，银河人类却已看见其外层战场，认知尺度再次扩张。
narrative_function: 重估全三部曲核心法则的层级，并以军事结构导入维度、光速等宇宙规律武器。
transfer_rule: 宇宙机制借战场分层时，应明确单兵事件与总体战争的层级、暴露信号、射程和目标重要性。
failure_boundary: 文明不是单个士兵，打击动机和战略也更复杂；狙击类比说明位置暴露机制与层级。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 宇宙文明整体战争中，文明因通信暴露坐标而被远距精确打击的黑暗森林机制
vehicle: 大战场阵地之间，隐蔽狙击手专门射杀偶然暴露位置的通信兵或伙夫
ground: 各方长期隐蔽；暴露位置即遭远射；攻击者不必接近；目标可能并非主力；单次击杀只是大战一角；生存依赖不被发现
