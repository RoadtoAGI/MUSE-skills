chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 这种宏大压得他们喘不过气来
sensory_mapping: 一千米小宇宙里，多个宇宙的后果像巨石落到两人胸口，连田间空气都不足以让他们顺畅呼吸。
context_fact: 二人讨论留下或归还质量，发现每种私人未来都可能改变大宇宙和新宇宙。
image_mechanism: 宏大通常表示向外扩张，这里反向成为向内压胸的重量，用尺度悖论呈现责任过载。
property_alignment: 宇宙后果对应重物；责任规模对应重量；心理负担对应胸压；决策困难对应无法移动重物；离开房间对应寻求呼吸空间。
context_alignment: 他们刚觉得自己像上帝，紧接着身体却被压到不能呼吸，权柄与脆弱凡人形成即时反差。
narrative_function: 把哲学争论推到生理阈值，促使二人走出房间并迎接广播转折。
transfer_rule: 宏大压力具身化时，应指定负重部位、被阻断功能、责任来源和人物缓解动作。
failure_boundary: 二人没有真实缺氧，宏大也无重量；窒息描述心理压力而非舱内环境故障。
