tenor: 个人居住选择牵连多个宇宙命运所产生的认知负担、伦理压力和无力感
vehicle: 沉重巨大物体压住胸腔，使身体无法扩张肺部并几近窒息
ground: 负荷远超承受力；压力从上而下；身体活动受限；呼吸困难；无法轻易移开；抽象规模转为近身重量
