tenor: 高强度水滴穿越保护引力波发射器的数十千米岩层时受到的阻碍
vehicle: 固体高速物体穿过可分流、可让开的液体介质
ground: 介质相对穿行者强度极低；接触无法阻止前进，只会沿路径被排开或贯穿
