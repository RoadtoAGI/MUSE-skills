chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 掩护引力波发射器的几十千米地层如同液体一样，可以轻易穿透
sensory_mapping: 厚重岩层失去石质硬度，变成可划开的连续流体，水滴像穿水般沿直线沉入地下。
context_fact: 水滴由强相互作用力材料构成，常规地层无法提供有效物理防护。
image_mechanism: 液体不是描述地层外观，而是用相对材料强度重标其阻力级别；几十千米厚度因此从坚盾降为可穿介质。
property_alignment: 水滴超高强度对应固体穿行者；岩层相对脆弱对应液体低阻；轻易深入对应流体让路；防护失效对应介质不能承载冲击。
context_alignment: 前文四十五千米地层既是物理掩护也是心理重压，此处水滴令其液化，瞬间撤销人类最深防线。
narrative_function: 用熟悉阻力差解释极端材料优势，清楚说明地下控制中心为何仍面临直接攻击。
transfer_rule: 固体如液体的工程类比应建立相对强度、穿行速度和变形结果；比较的是阻力机制，不是物态全同。
failure_boundary: 若岩层能显著减速、磨损或偏转水滴，轻易穿液模型需改为黏稠介质；它也不表示岩石真正熔化。
