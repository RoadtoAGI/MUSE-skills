chapter: 【危机纪元5-7年，阶梯计划】
figure_type: simile
quote: 一个完全不发光的黑洞，像太空被挖去一块
sensory_mapping: 星空从画布变成可挖材料，黑洞不是涂黑圆面，而是切除后露出的无底空缺。
context_fact: 程心梦见玫瑰藻星球坍缩，云天明冰冻大脑被禁锢在黑洞周围。
image_mechanism: 挖去区别了低亮度与存在缺口，赋予黑洞吞噬后不可恢复的空间损伤感。
property_alignment: 完全无光对应被挖空区域；恒星消失对应材料被去除；大脑无法逃脱对应缺口边缘的引力陷阱。
context_alignment: 赠星本是永久礼物，梦把最不可能丢失之物变成太空缺失，放大程心的罪疚。
narrative_function: 以负形图像建立噩梦中心，把恒星坍缩和失去云天明合并为宇宙缺口。
transfer_rule: 极暗对象写成背景缺失时，应区分无光与黑色实体，并让情节确有吞没或消除过程。
failure_boundary: 若黑洞有明亮吸积盘、只是远处暗星或边界不可辨，挖去一块的清楚负形会失真。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 噩梦中吞没赠星、没有任何光的黑洞
vehicle: 原本连续的太空背景被硬生生挖掉一块后留下的绝对缺口
ground: 区域不反射也不发出光；边界内不是普通暗物，而像背景本身缺失
