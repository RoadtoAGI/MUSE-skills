chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 维持零下五十摄氏度几乎像烧一个锅炉
sensory_mapping: 冰冷舱体获得锅炉炉膛，放射性电池成为燃料，零下五十度在深空背景下呈现为热炉。
context_fact: 海王星外空间接近绝对零度，一至两个世纪航程使加热电源成为百吨级难题。
image_mechanism: 锅炉反转冬眠等于冷却的直觉，温度差而非绝对数值决定工程任务，寒舱因此需要长期燃烧。
property_alignment: 深空严寒对应锅炉外部冷环境；冬眠温度对应炉内目标温度；同位素电池对应持续燃料。
context_alignment: 一句类比让负责人此前百吨夸张获得热力学依据，推动人体方案质量危机。
narrative_function: 揭示反直觉工程约束，使冬眠技术从医学问题转成能源问题。
transfer_rule: 解释温控时，应比较目标与环境温差并指出热流方向；日常设备喻体要对应持续输入和散热机制。
failure_boundary: 在接近零下五十度环境、短航程或绝热完美时，无需锅炉级持续供热；类比不代表真实燃烧。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 在接近绝对零度的外太空持续把冬眠舱维持在零下五十度
vehicle: 在寒冷环境中不断给锅炉供热，使内部保持远高于外界的温度
ground: 内部目标温度相对环境反而很高；需持续输入热量抵消向外散失并长期供能
