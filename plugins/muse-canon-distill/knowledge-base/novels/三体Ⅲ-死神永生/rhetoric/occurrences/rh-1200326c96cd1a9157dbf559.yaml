review_status: reviewed
tenor: 四维碎块边界附近看不出任何异常、没有可见扰动的空旷三维太空
vehicle: 幽深水潭表层无风无波，光滑安静，而水面下方藏着看不见的巨大深度
ground: 表面静止；外观空无；深处不可由表层判断；平静掩盖潜在复杂结构
