chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 眼前的太空一片空旷，像深潭中的水面一般平静
sensory_mapping: 银河银光铺成深潭反光，舰前黑暗水面没有一丝波纹，第四维秘密沉在无形水下。
context_fact: 两舰停在四维与三维交界附近，肉眼无法看见正在后退的碎块边缘。
image_mechanism: 深潭用无波表面解释可见空间的平静，同时把额外维度放到表面下，平静与隐藏因此同图共存。
property_alignment: 三维空旷对应平水面；无形边缘对应水下界面；四维秘密对应潭深；无异常迹象对应无波。
context_alignment: 前文一直用海和水洼解释维度空间，深潭把宏观宇宙海收束到两舰眼前一片危险而安静的局部。
narrative_function: 在降维长线出现前制造静止底板，使随后的巨笔划线获得骤然显形的反差。
transfer_rule: 平静表面掩藏深层结构时，应分别对应可见层、隐藏层、观察限制和即将打破平静的信号。
failure_boundary: 太空没有液面、上下或水压，四维碎块也不位于三维表层下方；深潭只组织可见与隐藏关系。
quality_assessment: effective
