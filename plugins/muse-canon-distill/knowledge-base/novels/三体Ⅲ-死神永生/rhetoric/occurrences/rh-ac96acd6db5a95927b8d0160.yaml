quote: 像一滴浓缩的颜料，如果把她扔到一个大湖中溶化开来，那整个湖都是女人的色彩了
sensory_mapping: 纤小身体液化成一滴浓色，落入湖面后色带向四周扩散，水域整体变成女性色彩。
context_fact: 程心暂忘智子是侵略者，只感到其女人味远超普通人。
image_mechanism: 浓缩解释小身材与强气质并存，溶湖则通过假想实验测量影响范围，把抽象女人味当作可扩散色素。
property_alignment: 智子纤小对应一滴；女人味强对应高浓颜料；感染环境对应颜料扩散；整体氛围改变对应湖水染色。
context_alignment: 机器人外形是三体精心设计的人类文化产品，浓缩颜料准确暗示其女性气质具有制造和过量特征。
narrative_function: 把初见魅惑推至顶点，同时让过度完美隐约显出非自然。
transfer_rule: 气质浓度化时，应同时有主体体量小、属性强和环境感染三层；可用扩散假想检验喻体机制。
failure_boundary: 若人物气质只在近距微弱可见、不能改变他人感受，染整湖会夸张；女人的色彩是主观文化概念。
