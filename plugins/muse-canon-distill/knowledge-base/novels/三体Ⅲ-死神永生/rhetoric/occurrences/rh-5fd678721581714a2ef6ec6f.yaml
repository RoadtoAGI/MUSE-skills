chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 仿佛整个宇宙的所有细节全聚集在周围色彩斑斓地并列呈现出来
sensory_mapping: 星体、器官、管线和原子般的断面像被召集到一间无边展厅，紧贴三人四周同时发光。
context_fact: 两人不仅看见整舰，还看见容器内部、固体断面以及层层嵌套的内部结构。
image_mechanism: 聚集将四维并列带来的信息密度写成空间搬运，宇宙尺度夸张对应局部细节无穷造成的主观总量。
property_alignment: 全层细节对应宇宙所有细节；四维并列对应聚集陈列；近身包围对应搬到周围；综合色彩对应斑斓群像。
context_alignment: 叙述刚说明太远仍看不清，仿佛标记这是过载感受而非事实判断，既放大震撼又保留物理限制。
narrative_function: 用宇宙级主观夸张封顶首次四维观看的强度，并引向下一段无限细节概念。
transfer_rule: 以万物聚集表现局部信息爆炸时，应保留主观标记，并具体说明何种并列机制制造宇宙总量感。
failure_boundary: 他们没有看见实际整个宇宙，透视和距离仍有效；喻体只表达局部信息密度的心理等价。
