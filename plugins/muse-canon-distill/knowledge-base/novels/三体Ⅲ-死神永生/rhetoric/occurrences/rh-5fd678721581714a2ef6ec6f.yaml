tenor: 局部四维视野中密集并列、层次无穷而色彩丰富的飞船内外细节
vehicle: 宇宙中每一处物质的全部细节被搬到观察者身旁，在同一圈空间中同时陈列
ground: 可见内容数量近乎无穷；远近层级被压到眼前；所有对象同时呈现；色彩复杂而难分主次
