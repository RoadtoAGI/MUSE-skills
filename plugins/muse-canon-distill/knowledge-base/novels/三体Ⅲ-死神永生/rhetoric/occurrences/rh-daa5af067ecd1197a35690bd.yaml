chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 四维空间包含三维空间，就像三维包含二维一样，要比喻的话，我们现在就处于四维空间中的一张三维的纸片上
sensory_mapping: 一百六十亿光年的三维宇宙收成一张巨纸，飞船像纸面微粒爬行，翘曲处把纸角掀向第四轴。
context_fact: 两名新手已经从翘曲点进入四维又返回三维，追问为何四维区域能与当前空间并存。
image_mechanism: 纸片通过降低一维重演包含关系，额外方向从不可言说的第四轴变成读者可见的纸外上下。
property_alignment: 三维宇宙对应二维纸；四维空间对应容纳纸的房间；三维居民对应纸面生物；翘曲点对应纸片局部离面。
context_alignment: 它承接前面的扁片人认知模型，并立刻供关一帆扩展成大纸粘肥皂泡的宇宙结构假说。
narrative_function: 把一次局部奇遇提升为宇宙维度模型，同时提供后文反复使用的纸片框架首项。
transfer_rule: 解释维度包含时，可递降一维搭建可视模型，并分别对应载体、居民、活动方向和越界通道。
failure_boundary: 三维宇宙没有纸张厚度、边缘或纤维，四维碎块也未被证明是纸外房间；模型只保留拓扑包含关系。
