chapter: 【时间之外，我们的宇宙】
figure_type: simile
quote: 但更多的信息是三体文字的，数量巨大，浩如烟海
sensory_mapping: 终端中的三体资料向视野外铺开，像烟雾盖住海面，二人只能从无边信息中捞取少量片段。
context_fact: 资料数量巨大且无现成翻译软件，程心和关一帆需先学习三体表意文字。
image_mechanism: 成语把抽象数据量扩成兼具遮蔽与无边感的烟海，强调读者面对的不是一堆文件而是一种环境。
property_alignment: 资料总量对应大海；难见边界对应海天无际；语言障碍对应烟雾遮蔽；逐篇阅读对应在海中航行；个人能力对应小舟尺度。
context_alignment: 两人被困在一千米小宇宙，电脑信息却向三体文明全史扩展，物理狭小与知识无边形成反差。
narrative_function: 交代二人在小宇宙有长期学习对象，也为后来理解宇宙命运提供资料基础。
transfer_rule: 用烟海形容信息时，应补出信息边界、读取难度、语言遮蔽和人物实际取样动作，使套语落地。
failure_boundary: 数字资料可检索、复制并有有限存储规模，不具海水流动或烟雾物质性。
quality_assessment: conventional
confidence: 1.0
review_status: reviewed
tenor: 小宇宙电脑中以三体文字保存、遍及众多领域且远超二人阅读能力的信息总量
vehicle: 烟雾弥漫、海水无边，视线无法越过也难以逐一计量的辽阔景象
ground: 数量庞大；边界不可见；个体难以穷尽；观察者容易迷失；内容连续铺展；尺度压倒个人
