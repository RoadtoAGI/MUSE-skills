chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 他的声音低沉舒缓，像在吟诵一首长长的古老歌谣
sensory_mapping: 云天明的叙述拉成长音，句子像古调一节节回旋，把程心从记忆任务带入听故事的节拍。
context_fact: 童话既须躲过监听又须承载情报，云天明连续讲一个多小时，程心由强记转为沉浸。
image_mechanism: 歌谣把信息密集的讲述转成有呼吸、有重复节拍的听觉流，使秘密编码披上古老故事的外衣。
property_alignment: 低沉声线对应低音吟诵；舒缓语速对应歌谣节拍；三个连续故事对应长篇；童话传统感对应古老传唱。
context_alignment: 监听者听见的是安全童话，程心接收的是生存情报；古歌般的声音恰好维持这层双重表面。
narrative_function: 降低解码场景的技术硬度，并为读者进入完整童话段落建立听觉过门。
transfer_rule: 叙述声比作歌谣时，应同时匹配音高、节拍、篇幅和内容的传承感。
failure_boundary: 云天明没有真正歌唱，故事也未必押韵；歌谣只限定听感与仪式性。
