chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 仿佛时时躲避着身边看不见的荆刺
sensory_mapping: 他每一步都绕开空气里的尖点，肩背像随时会被无形荆棘划破，只能越缩越紧。
context_fact: 少年实际在观察未来受害者，外在畏缩既掩护目光，也让宾客放松警惕。
image_mechanism: 无形荆刺为没有客观障碍的紧缩动作补出虚拟触觉原因，使戒备具备刺痛预期。
property_alignment: 周遭目光对应环绕荆刺；缩身对应避刺；持续警觉对应尖物密布；隐蔽威胁对应不可见。
context_alignment: 针眼即将把他人困入画中，此刻叙述先把他写成被无形环境围困的人，形成角色伪装。
narrative_function: 把单纯瘦小升级为动态恐惧表演，让读者同时看见伪装的细节和不祥感。
transfer_rule: 戒备姿态借尖刺呈现时，应明确刺点位置、身体规避动作、潜在伤害和他人为何看不见。
failure_boundary: 现场没有实际荆棘，针眼的收缩也可能是策略而非恐惧；喻体只解释可见动作。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 针眼画师持续收身避让、对周围空间表现出的过度戒备姿态
vehicle: 四周布满不可见尖刺，稍一舒展便会被扎伤的狭窄通道
ground: 威胁环绕；身体必须持续躲闪；活动范围被压窄；危险未被旁人看见
