chapter: 【威慑后第一年，移民完成后第六天清晨，澳大利亚】
figure_type: simile
quote: 家这个词像一把刀子割在她的心上
sensory_mapping: 一个轻声说出的字骤然变成冷刃，划开极度疲惫形成的厚茧，心脏在胸腔里猛缩。
context_fact: 陌生人说大家要回家，程心想到三个世纪前的父母和永远失去的旧家。
image_mechanism: 刀割把语言触发的回忆从抽象哀伤转成一次瞬时身体创伤，词的短促发音对应刃口快速落下。
property_alignment: 家字触发对应刀刃接触；丧亲记忆对应切入心口；麻木被打断对应伤口使肌肉抽搐；持续悲痛对应割伤余痛。
context_alignment: 前一刻人群因获救欢呼，回家对众人是出口，对跨越三世纪的程心却精确击中她唯一无法返回之处。
narrative_function: 在文明获救的公共喜讯中切出个人不可挽回的损失，阻止情绪轻易转向庆典。
transfer_rule: 语言如利器时，应确定触发词、被击中的具体旧伤、疼痛发生速度和身体反应。
failure_boundary: 词语没有造成器官损伤，痛感来自程心独有的传记；离开丧亲与时间流放背景便会趋于套语。
