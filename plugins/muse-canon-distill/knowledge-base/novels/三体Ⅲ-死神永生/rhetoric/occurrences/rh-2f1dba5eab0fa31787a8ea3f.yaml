chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 那四百一十五个暗弱的光点，是澳大利亚人类的希望之星
sensory_mapping: 四百一十五束推进焰化成夜空路标，地面人群抬头，把每个暗点读成通向安宁的微光。
context_fact: 智子承诺舰队到达后提供舒适生活，社会因此把其到来当作免于全面崩溃的支撑。
image_mechanism: 希望之星利用真实可见光点，把政治信赖钉在夜空目标上，距离越远，投射空间越大。
property_alignment: 舰队光焰对应星点；承诺未来对应星辰导航；社会绝望对应夜色；持续祈盼对应仰望。
context_alignment: 这些星点实际属于占领舰队，导航与威胁同源，准确承载人类认敌为救星的反讽。
narrative_function: 将抽象集体希望集中为可见对象，为舰队不来、承诺破产预留视觉落差。
transfer_rule: 希望写成星时，应让角色能实际仰望，并对应黑暗处境、方向和不可触距离。
failure_boundary: 舰队光点不是恒星，也不保证指向安全；希望属性完全来自人类信念。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 人类把正在减速接近的三体第二舰队视为结束饥饿混乱的唯一希望
vehicle: 黑夜中可见、供迷途者辨向并许愿等待的星辰
ground: 远在天际却持续可见；观察者用其确定未来方向；微弱光亮抵抗周围黑暗
