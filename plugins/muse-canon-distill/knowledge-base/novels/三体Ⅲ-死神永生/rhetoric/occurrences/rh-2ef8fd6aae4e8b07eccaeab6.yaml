chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 难道宇宙的其他部分都像处女一样纯真，等着我们去探索
sensory_mapping: 未知宇宙被人类想成披着洁白外衣的沉默对象，安静等候科学家揭开面纱。
context_fact: 丁仪怀疑智子制造的假象可能只是局部表现，宇宙其余区域也可能欺骗人类。
image_mechanism: 人格化纯真把科学实在论暴露为对对象道德品质的信任，反问随即拆穿这种拟人前提。
property_alignment: 未探索宇宙对应未经验者；规律真实对应纯真；科学探测对应接近认识；潜在伪装对应纯洁可能是假象。
context_alignment: 纸条以无害白羽外观欺骗探测者，后来事件正验证纯真外表不能担保物理安全。
narrative_function: 凝结丁仪的核心怀疑，为白Ice识别纸条危险提供跨年代思想钥匙。
transfer_rule: 未知对象借纯真人格表达时，应明确探索者赋予的道德假设、未验证部分和文本如何质疑它。
failure_boundary: 宇宙没有性别或道德意志，处女意象带有人类文化偏见；只能表示未经验证的无污染假设。
