tenor: 人类未经验证便假定除智子干扰区外的宇宙规律真实、未被更高文明篡改的观念
vehicle: 从未经历欺骗或侵犯、保持无瑕纯真并被动等待来访者认识的处女
ground: 被想象为未受污染；对探索者没有恶意；真相完整保留；等待主动接近；纯洁假设可能幼稚
