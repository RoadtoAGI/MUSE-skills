chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: “蓝色空间”号已经变成一艘超自然的魔法战舰
sensory_mapping: 深蓝战舰周围像展开法术领域，人员穿墙消失，手臂不接触便把心脏从胸腔摘出。
context_fact: 蓝色空间号人员借四维空间进入万有引力号，控制全舰并展示超越三维防护的能力。
image_mechanism: 魔法不是机制解释，而是标记认知断层：观察者只能看到效果，无法在三维经验中补出过程。
property_alignment: 四维隐形对应隐身术；隔空取器官对应法术摄物；摧毁水滴对应破除神器；未知原理对应超自然。
context_alignment: 万有引力号刚把水滴视为神性存在，新的魔法战舰又轻易解除其神性，技术等级在神话语汇中换位。
narrative_function: 概括一连串不可置信现象，并把读者带到四维真相解释前的认知位置。
transfer_rule: 技术被称魔法时，应列出观察不到的过程、违反的旧常识和可重复效果，保留待解释性。
failure_boundary: 能力仍有四维物理机制和范围限制，不是真正超自然；若机制已为人物理解，魔法会显偷懒。
quality_assessment: effective
