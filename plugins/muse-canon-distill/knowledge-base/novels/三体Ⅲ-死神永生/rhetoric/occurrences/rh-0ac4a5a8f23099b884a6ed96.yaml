tenor: 能隐形人员和穿梭机、隔空取出器官并摧毁水滴的蓝色空间号
vehicle: 不受已知物理限制、可施展隐身与隔空杀伤法术的魔法战舰
ground: 行动机制对观察者不可见；效果违反既有技术常识；同一载体连续展示多种超常能力
