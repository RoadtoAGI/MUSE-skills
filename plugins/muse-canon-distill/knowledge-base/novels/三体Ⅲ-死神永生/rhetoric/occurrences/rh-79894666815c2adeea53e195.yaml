quote: 程心瞬间被强烈的思念淹没了
sensory_mapping: 云天明的名字像水闸打开，思念一瞬漫过程心，责任、目的地和时间全沉到水下。
context_fact: AA提醒宇宙中除了幸存舰队还有云天明，二人曾约定在DX3906恒星见面。
image_mechanism: 淹没将情绪强度转成水位，前一刻航程空白，下一刻一个人的记忆占满全部未来。
property_alignment: 思念对应洪水；瞬间触发对应决堤；意识对应被淹空间；唯一渴望对应水面覆盖；呆滞对应失去行动余地。
context_alignment: 程心刚逃出吞没太阳系的二维洪流，立刻又被私人思念淹没；外部灾变转成内部情感同形。
narrative_function: 为选择DX3906提供足够强的情感动力，并把抽象“还有他”变成身体级冲击。
transfer_rule: 情绪写成淹没时，应给出闸门式触发、覆盖范围、被排除的其他念头和可见行为后果。
failure_boundary: 程心仍能回答和指定航线，没有真的窒息或失控；淹没只表示意识占比和强度。
