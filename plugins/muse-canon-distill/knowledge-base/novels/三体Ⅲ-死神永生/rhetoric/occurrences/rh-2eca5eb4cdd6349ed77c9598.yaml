chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 那目光仿佛在惊天动地地大喊：不要跑！我要杀了你！！我要吃了你！！！
sensory_mapping: 无声视线获得喉咙和雷鸣，圆眼仿佛把三句追杀怒吼直接震进观看者耳内。
context_fact: 老人持矛跺脚怒吼，眼中同时显出怒火和杀气，程心与AA被震慑。
image_mechanism: 把视觉强度转译成语言和音量，使目光里的行动意图比抽象凶狠更具体可懂。
property_alignment: 圆睁凝视对应锁定猎物；杀气对应喊杀内容；目光压迫对应惊天音量；观者发抖对应听见威胁。
context_alignment: 战舞本来就是向敌人展示勇武的仪式，目光说话符合其表演语法而非旁逸抒情。
narrative_function: 让古老战士文化在身体上复活，并把老人后文关于生存底线的话提前写进动作。
transfer_rule: 通感地写目光发声时，要为无声信息补出具体句意、强度和接收者反应。
failure_boundary: 目光没有真实声波，三句话是程心的解读；若眼神暧昧多义，写成明确台词会过度规定。
