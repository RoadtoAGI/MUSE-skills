chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 弱小和无知不是生存的障碍，傲慢才是
sensory_mapping: 人类在生存路上背着弱小和无知仍能走，傲慢却像横梁挡住视线与退路。
context_fact: 探测者因纸条像白羽毛而判断无害，白Ice记住水滴教训并要求远离。
image_mechanism: 障碍物把抽象认知品质按行动后果排序，傲慢之害在于让人停止观察和规避。
property_alignment: 文明求生对应赶路；弱小无知对应可携负担；傲慢对应路障；远离纸条对应绕障；误判无害对应被挡。
context_alignment: 这句后来成为全书判断语，眼前事件给它最具体的感官证据：微小外形不等于低危险。
narrative_function: 促使瓦西里改变命令，也为人类把希望押在掩体工程的宏观失败定性。
transfer_rule: 价值判断借道路障碍表达时，应把品质与可观察决策后果对应，避免只做口号。
failure_boundary: 弱小无知本身也会限制生存，傲慢并非唯一原因；句式是情境化警句而非普遍定律。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 文明力量不足、知识有限并不必然致死，而基于外观低估未知威胁会阻断正确生存决策
vehicle: 求生者沿道路前行，某些条件像横在路上的障碍物，真正挡路的是傲慢而非弱小无知
ground: 生存被视为前进目标；阻碍会改变行动；可识别并绕开；错误品质比资源不足更致命
