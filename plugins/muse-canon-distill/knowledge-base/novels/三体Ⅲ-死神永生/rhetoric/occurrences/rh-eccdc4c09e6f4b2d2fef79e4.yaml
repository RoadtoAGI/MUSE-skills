chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 三维空间向二维跌落的洪流似乎不可抗拒
sensory_mapping: 整个三维空间像决堤洪水向平面倾泻，星环号在洪流中勉强加速，仍被水势拖近岸线。
context_fact: 飞船高速度只减缓跌落，尚未达到逃逸所需光速，曲率引擎还需一百八十秒。
image_mechanism: 洪流把空间自身运动与飞船相对运动放入同一介质，强化临近光速前的最后阻力。
property_alignment: 三维空间对应水流；二维面对应低处汇口；飞船对应逆流物；加速坠落对应洪峰；不可抗对应流速悬殊。
context_alignment: 无形瀑布、地毯拖拽和洪流从不同尺度反复解释同一事实，此处在逃逸秒数前完成最终汇总。
narrative_function: 维持曲率引擎倒计时的不确定性，让进入光速真正成为冲出整体空间流的临界事件。
transfer_rule: 空间运动写成洪流时，应区分水流速度、主体逆行速度、终点、加速趋势和逃出阈值。
failure_boundary: 空间没有液体黏性或可见水体，“似乎”也保留程心对引擎能力的怀疑；洪流描述整体方向。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 三维空间整体持续加速流向二维边界，携带其中飞船且难以凭推进逆转
vehicle: 规模巨大、速度越来越快、裹挟一切冲向低处的洪水急流
ground: 介质整体运动；流量巨大；方向单一；速度增强；个体难以逆行；终点低陷；具有吞没破坏力
