chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 化学动力火箭就像工业革命初期的大烟筒，那时的诗人赞美如林的大烟筒，认为那就是工业文明
sensory_mapping: 火箭喷焰与烟筒黑烟纵向重叠，发射场排成工业城市烟囱林，时代荣耀带上过渡技术的烟尘。
context_fact: 程心认为化学推进无法建立太阳系防御，主动转向核动力航天专业。
image_mechanism: 历史镜像用后见之明校正当代崇拜：烟筒曾等同工业却非工业终点，火箭同样可能只是航天前史标志。
property_alignment: 化学火箭对应早期烟筒技术；社会赞美火箭对应诗人赞美烟筒；航天代表符号对应工业文明符号；技术局限对应阶段性。
context_alignment: 她的职业转向不是厌恶航天，而是拒绝把当前显眼技术误当终局，类比精准说明判断。
narrative_function: 用技术史解释人物专业选择，并建立阶梯计划追求新推进方式的思想前提。
transfer_rule: 评价过渡技术时，可找历史上曾被等同于整个时代的显眼设施；需对齐社会崇拜、真实作用和后续替代三层。
failure_boundary: 若化学火箭足以完成目标或没有更高阶段需求，烟筒的过渡局限不成立；类比也不证明具体替代方案可行。
