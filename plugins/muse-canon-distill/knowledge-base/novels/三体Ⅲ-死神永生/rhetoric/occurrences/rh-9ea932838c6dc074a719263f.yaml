chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 愿他的生命之光像太阳一样永远照耀王国
sensory_mapping: 国王的寿命被点成一轮高悬太阳，王国每处土地都落在他的金色统治光下。
context_fact: 王子正在祝寿并伪装拥护父王，实际当夜便让画师使国王消失。
image_mechanism: 生命先转成光，再由太阳赋予覆盖范围和持久性；永远愿望与即将熄灭形成尖锐反讽。
property_alignment: 国王生命对应太阳光源；统治影响对应普照；长寿祝愿对应恒常运行；王国繁荣对应受光生长。
context_alignment: 上一句焰火、灯火充满王宫，王子借现场亮度包装一项马上背叛的光明誓言。
narrative_function: 用最盛大的祝寿比喻预置反讽，使国王当夜消失更具熄灯般的骤然感。
transfer_rule: 权威生命写成太阳时，应对齐光源、覆盖对象、持续时间和受其维持的秩序。
failure_boundary: 国王并非王国唯一生机来源，太阳的恒久也无法保证寿命；祝词属于角色欺骗。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 国王的生命、统治影响及冰沙王子口头祝愿其长久延续
vehicle: 长期悬在天空、向整个国土稳定发光并维持生机的太阳
ground: 持续存在；影响覆盖全境；带来光明秩序；生命与照耀同时延续
