chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 老人的白发和白须像银色的火焰包围着头脸
sensory_mapping: 白发白须在暗画面中向外翻卷，火炬一照便成一圈银焰，把锐利面孔托在焰心。
context_fact: 针眼先画出老师以防对方反制，画像纤毫毕现并将在墙上预告老师死亡。
image_mechanism: 火焰以卷曲轮廓和自发光感激活静止白发，使画中老人仍显强大而难以接近。
property_alignment: 白发颜色对应银焰；发须卷曲对应火舌；环脸分布对应焰圈；暗处醒目对应发光。
context_alignment: 老师是唯一能与针眼抗衡的画师，火焰形象保留其威力，也与后来画像可能被烧毁形成潜在联系。
narrative_function: 用一笔塑造空灵画师的超凡外貌，并让画像在阴湿地堡中成为视觉光源。
transfer_rule: 白发比作火焰时，应落实色温、边缘走势、围绕对象和背景亮度。
failure_boundary: 发须没有热量且不会燃烧，银焰的破坏力不能转给老人；比较仅描述轮廓和光泽。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 空灵大画师浓密上扬、在火炬光下明亮包围面部的白发白须
vehicle: 从中心向外舔卷、通体银亮并围出光环的火焰
ground: 颜色银白；边缘蓬松卷曲；围绕中心；在暗处明亮；形态有向上动态
