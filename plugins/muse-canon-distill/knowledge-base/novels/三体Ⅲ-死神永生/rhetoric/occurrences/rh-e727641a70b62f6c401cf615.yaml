chapter: 【广播纪元7年，云天明的童话】
figure_type: analogy
quote: 像海洋一样广阔的陆地，骑着快马走几个月都走不到边
sensory_mapping: 无边海面；遥远地平线；陆地延展；长途马程；边界不可见
context_fact: 宫廷教育让公主以为世界只有两个王国，长帆正向她解释岛屿之外还有大陆。
image_mechanism: 陌生的巨大陆面被暂时灌成她刚见过的海，水色换成土地，海平线却保留；快马连续数月也无法把那条边拉近。
property_alignment: 大陆对应海洋；陆面延展对应水面延展；陆地边界对应海岸线；骑马数月对应长途航海；公主未知大陆对应初见大海；看不到边对应地平线
context_alignment: 用公主当天第一次亲见的海作为认知尺度，符合童话角色有限经验，也扩大她的向往。
narrative_function: 以已知空间解释未知大陆，并把无故事王国从整个世界缩成局部。
transfer_rule: 用已知广域解释未知空间时，应共享尺度、边界不可见性、穿越耗时，并选取角色刚能感知的参照物。
failure_boundary: 大陆狭小可一日穿越、角色从未见过海，或重点在地形而非面积时，海洋参照失去教学作用。
