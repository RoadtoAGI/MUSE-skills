chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 他看程心的目光已经没有了慈爱，像最后审判日的火炬
sensory_mapping: 老人眼中的慈光熄灭，只剩一束审判火光照向程心，把她当年的选择全照在末日结果前。
context_fact: 罗辑解释人类本可用曲率航迹制造黑域或光速飞船，程心曾让维德停止研究并接受其投降。
image_mechanism: 火炬把目光的明亮转为道德照明与灼痛；最后审判日恰与真实太阳系末日重合，使个人责任无处延后。
property_alignment: 罗辑目光对应火炬；揭示后果对应照明罪行；无慈爱对应火焰灼烧；太阳系终结对应审判日；程心内疚对应受审。
context_alignment: 罗辑曾以慈爱称她孩子，此刻火炬反转长明灯和温暖目光，守墓人临终成为沉默审判者。
narrative_function: 不用直斥对白完成关系转折，迫使程心把物种结局与自己的决定连接。
transfer_rule: 目光比作审判火炬时，应让光、揭露、灼痛、裁决时点和人物既往选择共同成立。
failure_boundary: 罗辑没有法律或神圣裁判权，程心的责任也受当时信息限制；火炬呈现她主观感到的谴责。
