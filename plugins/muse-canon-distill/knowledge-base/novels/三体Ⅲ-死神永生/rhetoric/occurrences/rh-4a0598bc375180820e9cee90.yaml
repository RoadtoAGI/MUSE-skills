chapter: 【危机纪元5-7年，阶梯计划】
figure_type: simile
quote: 核爆炸的闪光以一定的间隔不断地在巨帆后面亮起，像搏动的心脏
sensory_mapping: 爆炸光团成为心室收缩的亮点，辐射冲量成为泵出的血流，长航段获得生命脉搏。
context_fact: 飞行器依次触发核弹加速，直至第九百九十七枚达到目标速度。
image_mechanism: 明灭节律先对应心跳，每次推进又对应泵血功能；无生命机器因此像靠千次脉搏活着向前。
property_alignment: 定时核爆对应心搏节律；辐射推力对应泵送动力；连续加速对应生命循环维持运动。
context_alignment: 载荷是一颗人脑，飞行器外部核爆成为替代身体的巨大心跳，意象与任务对象深层呼应。
narrative_function: 把离散爆炸组织成生命节律，赋予宏大技术过程情感连续性。
transfer_rule: 周期事件借心脏写时，应让每次事件不仅相似明灭，还真实输送系统所需能量；节律须相对稳定。
failure_boundary: 爆炸间隔随机、只发光不推动或系统不依赖连续冲量时，心搏功能不成立。
quality_assessment: exemplary
