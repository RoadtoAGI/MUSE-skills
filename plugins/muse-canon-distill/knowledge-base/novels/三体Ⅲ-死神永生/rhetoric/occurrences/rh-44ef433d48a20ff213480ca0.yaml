chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 他们常常用两面相对的镜子来类比：这时在任何一面镜子中都可以看到被复制的无数面镜子，一个向深处无限延伸的镜子长廊，如果作为类比，长廊中的每面镜子就都是一个三维空间。
sensory_mapping: 两面镜子之间亮出一节又一节缩小的走廊，每个镜框里都嵌着一座完整三维世界，纵深没有尽头。
context_fact: 亲历者试图向没有四维经验的人说明空间每一点都含有无法用普通距离描述的纵深。
image_mechanism: 镜面递归把抽象的额外维度变成视线可追踪的重复深度，同时让每个三维空间保持完整而非被切碎。
property_alignment: 相对镜面对应维度间展开条件；无数镜像对应广阔的无限复制；镜廊纵深对应高维方向；每面镜子对应一个三维横断面。
context_alignment: 前文扁片人模型说明升维能看见全貌，此处镜廊模型转而说明新空间本身为何显得方寸之间深不见底。
narrative_function: 从可见对象的展开推进到空间本体的纵深，让连续两层不可描述经验各有一套直观模型。
transfer_rule: 表现无限递归的空间或结构时，选择能自我复制的载体，并明确每一层对应的完整单位及递归方向。
failure_boundary: 镜中像会缩小、变暗且只是光学复制，四维空间没有这些衰减，也不由离散的一间间三维空间拼接而成。
