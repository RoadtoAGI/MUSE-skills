review_status: reviewed
tenor: 位于地下四十五千米、由执剑人直接决定是否启动宇宙广播的零号控制站
vehicle: 藏在身体深处、驱动整体生存循环且一旦失效便危及全身的心脏
ground: 位置深入并受层层保护；核心决断由此发出，其状态关系整个系统乃至两个文明生死
