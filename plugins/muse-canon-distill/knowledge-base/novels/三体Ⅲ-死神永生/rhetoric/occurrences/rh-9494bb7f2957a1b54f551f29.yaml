chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 程心一行三人走进了黑暗森林威慑系统的心脏
sensory_mapping: 厚重钢门成为胸腔入口，深地大厅成为心室，红色开关像控制搏动的核心节点握在执剑人手中。
context_fact: 控制中心连接四座引力波发射器，执剑人只有十分钟决定是否广播，决定两个世界命运。
image_mechanism: 心脏把地理深度、功能中心与生命后果合为一体；走进动作让交接仪式像进入文明体内。
property_alignment: 地下深处对应体内心脏；广播控制对应泵出指令；两个世界存亡对应全身生命；钢门防护对应胸腔保护。
context_alignment: 此前三体舰队也被写成可植入炸弹的心脏，此处人类威慑系统获得对称核心，双方战略身体彼此瞄准。
narrative_function: 在程心见到大厅前先标定其功能重量，使随后空眼球般空旷与中心职责形成反差。
transfer_rule: 系统核心如心脏时，应对齐中心位置、输出循环、保护层和失效后果；仅重要但可替代的节点不宜称心脏。
failure_boundary: 多个控制站完全冗余、单站失效不影响系统时，唯一心脏会误写架构；这里强调的是决策中心。
quality_assessment: effective
