chapter: 【时间开始后约170亿年，我们的星星】
figure_type: metaphor
quote: 他们目光相对，灵魂交融
sensory_mapping: 两道目光在紫林间相接，悲痛像两股水汇到一起，谁也不必再解释自己失去了什么。
context_fact: 二人看见同一年代检测结果，随即确认错过云天明与艾AA并紧紧拥抱。
image_mechanism: 交融把无声互解写成物质混合，目光成为两种内在状态相接的通道。
property_alignment: 两个人对应两股物质；目光相接对应液面接触；共享理解对应混合；无言对应无需外部传递；拥抱对应边界靠拢。
context_alignment: 他们在低光速危机中已形成‘像一个人’的默契，此刻情感融合兑现那段共同求生。
narrative_function: 用极短过渡从事实震惊进入共同哀悼，并确立二人此后伴侣关系。
transfer_rule: 精神交融要有共同刺激、无言信号、情绪同步和随后行动，才能避免成为空泛亲密套语。
failure_boundary: 两人仍保留不同欲望、记忆和判断，灵魂没有字面融合；相通只限这一时刻。
quality_assessment: conventional
confidence: 0.99
review_status: reviewed
tenor: 程心与关一帆在共同确认错过一千八百九十万年后，不需言语便完全理解并共享悲痛
vehicle: 两股原本分开的液体或物质相接后混合，边界消失而成为同一整体
ground: 主体原本分离；接触后信息互通；界限暂时消退；感受共享；过程无需语言；混合后难分彼此
