chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 像巨人的呼吸
sensory_mapping: 黑暗尽头伏着看不见的庞然身体，浪声一吸一呼，整片夜色随之起伏。
context_fact: 深居王宫的公主从未见海，在夜路上只能先凭声音认识它。
image_mechanism: 呼吸用周期和身体尺度为陌生海声建立生命模型，巨人说明声源远大于个体。
property_alignment: 浪潮往复对应呼吸；海域广阔对应巨人体量；低鸣对应深呼吸；暗中未见海对应看不见身体。
context_alignment: 海中确有巨型危险生物，巨人呼吸既是认知比附，也提前放大海的威胁。
narrative_function: 让大海先以声音登场，保留视觉揭晓并展现公主的陌生化视角。
transfer_rule: 周期自然声比作呼吸时，应匹配频率、音高、声源尺度、可见性和听者经验。
failure_boundary: 海没有肺部或统一呼吸主体，具体浪声受风岸形影响；巨人只帮助初识。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 尚未看见大海时听到的低沉、巨大、周期性海浪声
vehicle: 体形远超常人的巨人缓慢吸气呼气，气流深重且有稳定起伏
ground: 声源尺度巨大；节奏周期重复；音调低沉；力量从远处传来；听者看不见主体
