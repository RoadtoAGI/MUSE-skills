chapter: 【威慑后一小时，失落的世界】
figure_type: simile
quote: 它突兀地出现在平静的天地之间，仿佛是用图形软件在一幅风景画中随意叠加上去的东西
sensory_mapping: 戈壁夕照保持完整画面，一团尘云像剪贴素材悬在其上，边沿没有融入空气。
context_fact: 交接会场仍在夕阳中安静，远方却出现水滴攻击造成的巨大蘑菇云。
image_mechanism: 数字叠图把灾难的突兀感变成视觉制作错误，背景越真实平和，异物越显得不属于此世。
property_alignment: 平静天地对应完整风景画；蘑菇云对应新增图层；突兀边界对应粗糙叠加；事件骤发对应无过渡贴入。
context_alignment: 威慑世界一小时前仍正常运行，灾难像被外力瞬时覆到旧时代景观上，符合程心尚未接受现实的观看。
narrative_function: 把政治断裂转为构图断裂，显示旧世界表面仍在而意义已被外来暴力改写。
transfer_rule: 表现景物不协调时，可借编辑流程比较背景、图层、边缘与色调，前提是观察者熟悉媒介经验。
failure_boundary: 若异物与环境有渐变烟迹或共同光色，随意叠加会过度断裂；该喻体不说明影像是虚假。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 蘑菇云与夕阳、戈壁和雪山构成的自然景色之间的不协调
vehicle: 未经光色和透视匹配便被软件粗暴贴到风景画上的独立图层
ground: 边缘与背景割裂；风格和色调不协调；出现方式缺少自然过渡
