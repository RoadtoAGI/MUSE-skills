chapter: 地球文明
figure_type: simile
quote: 他的双眼平视着前方，像是看着时光的深处
sensory_mapping: 老人的视线越过石洞前方，像沿一条四百年长廊伸进去，直到画与旧人所在的年代。
context_fact: 罗辑抚摸古老画框，说不知道蒙娜丽莎在这里，知道会常来看她，眼中随后出现泪光。
image_mechanism: 将时间空间化为可凝视的深处，使无对象的平视获得具体方向，也把画框变成通往旧文明的入口。
property_alignment: 四百年对应纵深；回忆对应远处景物；平视空处对应穿透通道；老眼泪光对应看见旧日。
context_alignment: 洞壁试图让信息穿越亿年，罗辑的目光则逆向穿过四百年；保存文明与追望过去形成双向时间轴。
narrative_function: 在不点明具体回忆对象的情况下显出罗辑罕见的悲恸，并让蒙娜丽莎承载失落时代。
transfer_rule: 把时间写成视觉纵深时，应给目光明确起点、跨越年限、潜在对象和触发回望的物件。
failure_boundary: 罗辑只是在回忆，双眼没有真的看见过去；深处不指某一确定时刻或人物。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 罗辑没有看身旁的《蒙娜丽莎》，而是平视空处、陷入跨越数百年的凝望
vehicle: 目光穿过一条有纵深的时间通道，看向遥远年代深处的人和往事
ground: 凝视方向超越眼前物体；距离感极远；对象不可直接看见；思绪跨越漫长年代；目光深沉
