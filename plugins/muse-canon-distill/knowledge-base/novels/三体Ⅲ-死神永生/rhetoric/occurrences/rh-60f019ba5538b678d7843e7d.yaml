chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 太空艇仿佛是放在滚烫的玻璃上的一块冰激凌，底部熔成一摊，向各个方向扩散
sensory_mapping: 艇底像奶油触到热玻璃先化开，舱体一层层塌成彩亮薄液，沿无形面铺向四周。
context_fact: 纸条封装力场消失后形成二维空间，太空艇最先标出平面范围，监视员随后同样二维化。
image_mechanism: 热融模型把陌生降维换成可逐帧观察的相变，玻璃透明性还解释平面为何只能由熔物显形。
property_alignment: 太空艇对应冰激凌；二维面对应热玻璃；接触点二维化对应底部融化；平面扩展对应液体摊开；彩光对应融体反光。
context_alignment: 物理机制不是加热，日常甜食的柔软反而放大坚固飞船毫无抵抗地塌平的恐怖。
narrative_function: 把太阳系二向箔生效的第一刻变成可见动态图，是后续一切二维化图景的母比喻。
transfer_rule: 降维如融化时，应精确对齐接触起点、失厚方向、平面扩散、可见标记和真实机制差异。
failure_boundary: 太空艇没有因高温液化，原子仍按几何规则映射；冰激凌只能描述外观动态，不能解释物理。
