review_status: reviewed
tenor: 太空艇接触无形二维平面后从底部开始失去三维厚度、物质向平面摊开的过程
vehicle: 冰激凌放到高温玻璃上，接触面先融化，液体沿光滑平面向四周摊薄
ground: 变化从接触底部开始；主体软化失形；物质向二维表面扩散；平面本身透明不可见；过程连续迅速
