figure_type: simile
quote: 程心真的像一个美丽的东方圣母，她与怀中的婴儿沐浴在柔和的金色阳光中
sensory_mapping: 程心与婴儿从新闻照片升为圣像，金色阳光构成光环，手臂像护住全体生命的圣母姿态。
context_fact: 褚岩将照片与三体光速舰队冷酷航迹并列，用以判断她没有启动广播。
image_mechanism: 圣母把个人母性提升为道德原型，也同时揭示这种慈悲为何与执剑人职责冲突。
property_alignment: 怀抱婴儿对应圣母抱圣婴；金光对应宗教光环；程心爱意对应慈悲；不广播对应保护生命。
context_alignment: 深空基色是黑银冷光，金色圣像让星舰人重获近太阳感觉，视觉温差即伦理选择差。
narrative_function: 无需复盘地球现场便让两舰推断威慑失败，并将最终公决的两种价值摆到屏幕上。
transfer_rule: 人物如宗教圣像时，应匹配姿态、光线、核心伦理和场景对照，避免只凭美貌。
failure_boundary: 圣母形象会神圣化程心并简化政治责任；她是普通人，照片也由观看者解释。
