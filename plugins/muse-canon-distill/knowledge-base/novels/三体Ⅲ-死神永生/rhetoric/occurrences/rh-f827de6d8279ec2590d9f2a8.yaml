chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 她感觉像被一只温暖的大手捧在手心
sensory_mapping: 沙粒贴合背脊四肢，白日余温从下方托起她，整片海滩像摊开的暖掌。
context_fact: 她逃亡一日后僵硬疲劳，第一次直接睡在宫外沙滩上。
image_mechanism: 手掌把无人格沙层转成照料者，细沙随身体成形的承托自然对应掌心包裹。
property_alignment: 沙层对应掌心；日温对应体温；贴合凹陷对应捧托；公主躺卧对应掌中小物。
context_alignment: 离开女仆照料后，自然环境暂时接替照顾者，使她能在成长旅途中获得短暂安全。
narrative_function: 用触觉消解海边危险的紧张，为她与卫队长夜谈营造亲密安静。
transfer_rule: 地面承托比作手掌时，应对齐接触面积、温度、形变贴合、主体尺度和情绪效果。
failure_boundary: 沙滩没有意志且可能藏危险，手掌式保护只属于此刻温度与姿势。
