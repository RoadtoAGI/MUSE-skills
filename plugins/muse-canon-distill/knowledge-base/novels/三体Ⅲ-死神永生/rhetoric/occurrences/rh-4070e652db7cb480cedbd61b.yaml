chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 就像听弗雷斯吹响“迪杰里多”一样，程心的心被这首诗触动了
sensory_mapping: 纸上的诗句获得木管低鸣，文字像地底声波一样穿过程心胸口，在心中持续共振。
context_fact: 弗雷斯写下关于生命和死亡的狄金森诗句送给程心，老人日常用乐器声陪她入睡。
image_mechanism: 把阅读映射到熟悉听觉记忆，说明诗的力量来自同一种低沉、超越个人灾难的尺度。
property_alignment: 诗句节奏对应木管声；精神触动对应声波共振；生死主题对应大地鼾声的古老尺度。
context_alignment: 比较对象属于两人共同生活的具体经验，比泛称感动更能保留弗雷斯给予程心的独特安宁。
narrative_function: 将老人的声音留在诗中，为程心后来离开澳大利亚保存可携带的精神支点。
transfer_rule: 比较两种艺术体验时，应对应感官节奏、情绪方向和共同主题，而非只说都令人感动。
failure_boundary: 诗的语言意义远多于乐器音色，两者效果只在程心个人经验中相通，不能普遍互换。
