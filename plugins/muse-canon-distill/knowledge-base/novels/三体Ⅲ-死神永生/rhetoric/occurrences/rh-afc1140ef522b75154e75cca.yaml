figure_type: metaphor
quote: 他以为给了所爱的人一颗星星那人就爱他了？就流着圣洁的眼泪飞越大洋来救他了？多美的童话
sensory_mapping: 一颗真实恒星变成童话信物，程心带着圣洁泪光飞越大洋，病房短暂搭成等待救赎的舞台。
context_fact: 程心实际代表PIA请求他献出大脑，云天明意识到她若不知安乐选择也会主动劝他去死。
image_mechanism: 童话先汇集礼物、爱情与营救三种愿望，再由反问和狂笑把它整体撕破；美字因此带有自嘲反讽。
property_alignment: 赠星对应魔法信物；期待被爱对应童话奖赏；跨洋到来对应救援者登场；真实使命对应童话反转。
context_alignment: 云天明长期把程心视为光源，赠星又具传奇尺度，幻想确有童话材料；来访目的则给反讽提供致命落差。
narrative_function: 瞬间翻转重逢场景，从天堂式拯救坠入被利用感，并解释他随后接受使命时的凄惨心理。
transfer_rule: 用童话反讽愿望时，应先具备信物、救援或圆满结局等叙事零件，再以现实因果逐项拆除。
failure_boundary: 若双方已有明确爱情且来访确为营救，童话不再是自欺；没有浪漫预期时，美丽童话也无反转力。
