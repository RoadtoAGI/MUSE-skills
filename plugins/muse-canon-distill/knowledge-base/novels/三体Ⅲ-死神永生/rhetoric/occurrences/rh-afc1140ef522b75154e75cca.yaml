tenor: 云天明曾对赠星会换来程心爱情和拯救所抱的浪漫幻想
vehicle: 善意礼物自动获得爱情、纯洁人物跨越远方救出主人公的美丽童话
ground: 因果由愿望而非现实关系推动；叙事期待以情感奖赏和被救结局补偿孤独者
