chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 这个被扣在透明罩中的小平台像一个无比精致的微型舞台，隐藏在下面的庞大复杂的乐队要为它伴奏，让人不由得想象在那上面上演的将是什么
sensory_mapping: 玻璃微舞台；台下乐队；中央聚光；样品登场；机械伴奏
context_fact: 机器所有管状装置朝向球心，平台只有几厘米见方，随后一截程心头发被放上去接受曲率驱动实验。
image_mechanism: 上下尺度反差被组织成剧场层级：庞大设备退到台下，最小的平台升为演出中心；读者的疑问也从机器如何运作转成样品将发生什么。
property_alignment: 微型平台对应舞台；透明罩对应舞台保护幕；头发样品对应演员；复杂设备对应乐队；多部件同步对应合奏；能量汇聚对应伴奏支撑；实验过程对应演出；观察者期待对应观众
context_alignment: 曲率驱动首次实物展示本就是技术“首演”，维德又剪取程心头发使她的一部分登台，舞台框架与后续动作严密闭合。
narrative_function: 将难懂装置转换为期待结构，集中视线、悬置结果，并给微小样品以仪式性。
transfer_rule: 以舞台和乐队写实验装置时，应有清晰焦点台、隐藏支撑系统、协同启动、可登场样品及等待结果的观看者。
failure_boundary: 实验效应均匀发生在整台设备、没有中心样品或部件各自独立不协同时，舞台—伴奏层级会误写能量关系。
