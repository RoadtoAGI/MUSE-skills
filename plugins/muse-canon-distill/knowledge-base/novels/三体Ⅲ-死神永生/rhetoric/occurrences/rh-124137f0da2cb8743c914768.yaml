chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 两个文明间的联系也渐渐变得细若游丝
sensory_mapping: 两个世界像隔在星海两端，只剩一根银白游丝牵着，舰队每远一分，细线就更难看见。
context_fact: 宇宙广播后双方无暇彼此，三体舰队在太空中持续远去，智子也将离开。
image_mechanism: 游丝把抽象文明联系转成有宽度和张力的细线，空间距离增长直接表现为线体变细、断裂风险升高。
property_alignment: 文明联系对应丝线；通信减少对应变细；舰队远离对应拉长；关系脆弱对应易断；残余智子对应尚未断点。
context_alignment: 人类仍乞求三体提供安全声明，关系实际却只剩游丝，需求巨大与通道纤弱构成结构性反差。
narrative_function: 交代技术封锁之外的空间疏离，为智子不再回应和最终告别提供连续趋势。
transfer_rule: 关系如细丝时，应明确两端、变细原因、张力来源、仍可传递什么以及断裂条件。
failure_boundary: 文明联系由多种通信和历史记忆构成，不是单根线；细若游丝也不等于完全断绝。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 三体舰队远离太阳系后，地球与幸存三体文明之间日益微弱、可能断绝的通信和关系
vehicle: 空气中飘动的极细蛛丝或虫丝，肉眼几乎看不见，稍受拉扯就会断开
ground: 连接仍存在但极其微弱；随距离增加继续变细；承受力低；难以察觉；随时可能断裂
