chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 仿佛是一面高大山崖下的几幢小屋，它们远远地透出柔和的烛光，虽然微弱，却是这无边的严寒和荒寂中仅有的温暖栖所，是所有疲惫旅人的向往
sensory_mapping: 黑崖压顶；崖脚小屋；远处烛光；无边严寒；温暖归宿
context_fact: 太空艇位于木星群落最外侧，城市受木星阴影保护，与行星相比体积和灯光都极小。
image_mechanism: 木星的曲面被竖成压顶山崖，城市群缩成崖脚几点窗火；宇宙尺度由天体图景改写成夜行者可感的寒冷、疲劳与归宿。
property_alignment: 木星暗面对应高大山崖；行星尺度对应崖壁压迫；城市群对应小屋群；人造灯光对应烛火；深空低温对应严寒；文明孤立对应荒野独舍；居民迁徙对应疲惫旅人
context_alignment: 木星既是威压天体也是遮蔽打击的保护体，小屋依崖而存的关系准确重现城市借巨物庇护又受其压迫的位置。
narrative_function: 把掩体世界从工程奇观转为文明家园，以温暖尺度收束游览并预示其脆弱。
transfer_rule: 用寒夜栖所写孤立文明时，需要庞大暗背景、少量暖光、尺度悬殊、真实环境威胁和明确庇护功能共同成立。
failure_boundary: 城市灯火铺满视野、背景明亮温暖、聚落无需依附巨物保护，或场景没有旅途与归宿情绪时，小屋烛光会虚造孤寂。
