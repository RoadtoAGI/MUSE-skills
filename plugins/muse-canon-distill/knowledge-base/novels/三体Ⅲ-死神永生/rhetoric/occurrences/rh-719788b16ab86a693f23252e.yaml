review_status: reviewed
tenor: 宇宙文明社会既有理想主义、和平、慈善和艺术力量，却由更强势主流决定总体走向
vehicle: 人类社会中同样存在善良理想者和少数价值群体，但历史主流常由权力与冲突塑造
ground: 主体类型多样；善意群体真实存在；少数不能主导总体；宏观走向受更强力量决定；个体价值与系统结果分离
