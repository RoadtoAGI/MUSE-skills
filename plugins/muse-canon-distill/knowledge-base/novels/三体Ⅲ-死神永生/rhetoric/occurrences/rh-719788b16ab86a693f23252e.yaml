chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 就像人类世界一样
sensory_mapping: 宇宙把文明种类扩展到星系尺度，结构却仍像人类社会：善人、艺术家和理想者都在，却未必握住方向盘。
context_fact: 关一帆列举归零者、和平主义者、慈善家和艺术文明，说明它们不是主流。
image_mechanism: 极短类比把陌生宇宙伦理拉回熟悉社会结构，让程心在黑暗中看见亮色，同时理解亮色为何不等于趋势。
property_alignment: 宇宙文明对应人类群体；归零者对应理想主义者；规律战争主流对应权力冲突；少数善意对应非主导力量。
context_alignment: 黑暗森林曾把宇宙与人类道德完全切开，此处类比重新建立连续性：多样和非主流善意也跨尺度存在。
narrative_function: 回应程心寻找亮色的需要，又维持对宇宙总体走向的清醒，不让希望变成乐观结论。
transfer_rule: 宏观社会类比人类世界时，应指出具体角色分布、主流形成机制和善意存在与主导权的差别。
failure_boundary: 外星文明的心理、制度未必可按人类社会理解；类比只是关一帆对观察到的价值分布概括。
quality_assessment: effective
