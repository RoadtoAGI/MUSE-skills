chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 这两艘飞船很像公元世纪的氦气飞艇
sensory_mapping: 引力波天线鼓成巨囊，人员舱像吊篮挂在下方，远看两船在黑空中缓慢漂浮。
context_fact: 旧式飞船把天线与载体做成一体，因而中型船也拥有大型船体积。
image_mechanism: 飞艇的体积—载荷反差解释看似庞大的飞船为何人员不足百，也将陌生天线结构翻译成公元人熟悉轮廓。
property_alignment: 巨大天线对应气囊；小载荷舱对应吊舱；整体庞大对应飞艇体积；功能比例失衡对应轻载结构。
context_alignment: 白Ice与程心都是公元人，古老交通工具为未来设备提供跨时代共同参照。
narrative_function: 一句完成两船造型和工程理念说明，为人在天线表面活动提供空间想象。
transfer_rule: 复杂载具比作旧交通工具时，应对齐主体结构、载荷比例、连接位置和运动观感。
failure_boundary: 飞船不靠浮力，真空姿态与飞艇空气动力不同；类比限于外形和载荷布局。
quality_assessment: exemplary
