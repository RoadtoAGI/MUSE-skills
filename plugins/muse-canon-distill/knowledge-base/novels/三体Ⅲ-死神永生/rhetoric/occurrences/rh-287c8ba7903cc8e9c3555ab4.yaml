tenor: 以巨大引力波天线为主体、有效载荷仅占很小悬挂部分的启示号与阿拉斯加号
vehicle: 庞大轻气囊提供主体体积、实际载人或载货舱只挂在下方一小块的氦气飞艇
ground: 外观体积巨大；主要结构承担媒介功能；有效载荷比例小；主体和载荷可视觉区分；整体显得轻空
