chapter: 【广播纪元7年，云天明的童话】
figure_type: analogy
quote: 假如父王和母后传给后代的美德是有一个定量的，那冰沙王子缺少的部分一定都给了露珠公主
sensory_mapping: 父母的德性像一捧可称量的谷物，漏过冰沙的那一份全堆到了露珠一边。
context_fact: 冰沙王子暴虐阴沉，露珠公主被童话叙述为聪明善良并将获拥戴。
image_mechanism: 定量分配把复杂遗传与人格差异压成守恒算术，用孩子式逻辑制造鲜明善恶两极。
property_alignment: 共同父母对应同一总量；冰沙缺德对应少分份额；露珠至善对应多得份额；兄妹反差对应此消彼长。
context_alignment: 童话需要迅速确立善恶阵营，朴素配额模型比心理解释更符合寓言语体。
narrative_function: 一句话完成两名继承人的道德排序，为废长立幼和随后政变提供动机。
transfer_rule: 品性差异借分配模型呈现时，应明确共同来源、总量假设、份额互补和叙事所需的简化。
failure_boundary: 美德不可计量也不遵守守恒，冰沙的缺陷不会因露珠优秀而产生；这是童话化归因。
