chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 一片纷繁迷乱的色彩，像被马群践踏的花园
sensory_mapping: 各色颜料像花瓣被铁蹄踏进泥里，亮色碎裂交叠，纸面留下看不懂的奔跑路线。
context_fact: 王子只能看到色彩不断涌现，尚不能理解针眼如何从混乱抵达精确肖像。
image_mechanism: 被践踏花园同时保留美丽色料和摧毁秩序，准确解释画面为何纷繁却暂时不可读。
property_alignment: 多彩颜料对应花色；交错笔迹对应蹄印；构图无序对应园圃被毁；潜在形状对应残存花园。
context_alignment: 上一喻是彩雨自然落下，此喻忽然加入马群暴力，给美术过程注入政变的破坏性。
narrative_function: 把混沌阶段推向视觉高潮，为下一瞬秩序冻结产生更强反差。
transfer_rule: 彩色混乱比作受损花园时，应保留原有美感、破坏动作、残迹方向和整体失序。
failure_boundary: 画纸未真实受损，颜料混乱是精确技法的一部分；花园毁坏不代表作品失败。
quality_assessment: exemplary
