tenor: 尚未组织成形、色块互相冲撞且秩序不可辨的画面
vehicle: 原有花色与布局被奔马踩乱、花瓣泥土杂糅的花园
ground: 颜色原料丰富；秩序遭破坏；痕迹交错；局部仍美而整体混乱；带强烈运动残迹
