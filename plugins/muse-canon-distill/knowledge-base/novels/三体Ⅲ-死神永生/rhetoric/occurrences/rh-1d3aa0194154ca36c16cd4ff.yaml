quote: 那些人就是念叨着这样的话把妈卖给妓院的
sensory_mapping: 程心脑中的辩解变成特务口中的套话，云天明被推向太空酷刑的位置与母亲被送入妓院重叠。
context_fact: 维德初见时用这句行业黑话测试她；现在她发现自己正以同类语言合理化剥夺云天明冬眠机会。
image_mechanism: 极端亲属背叛作为道德试纸，将每条看似正确的理由与实际伤害并列，迫使人物识别手段已越过自身底线。
property_alignment: 崇高辩辞对应念叨套话；利用云天明对应出卖亲人；文明利益对应交易收益；具体受害对应母亲受辱。
context_alignment: 程心曾明确拒绝维德的测试，此刻类比回返说明PIA伦理已进入她的行动，形成角色自我审判。
narrative_function: 击穿连续自我辩解，使良心认识获得不可撤销的语言，并直接触发她去找维德撤回推荐。
transfer_rule: 极端类比用于道德检验时，应对齐辩护结构、关系责任和伤害机制；冲击强度需服务人物既有底线。
failure_boundary: 若行为没有利用亲密信任、受害者能充分自主且无重大伤害，卖母类比会不成比例；它也不是法律等价判断。
