tenor: 青铜时代号人员离舰进入空气区时感到的清新空气
vehicle: 久雨停止、天空初晴后湿润洁净且带草木气味的空气
ground: 呼吸介质新鲜、湿润而无封闭循环异味；长期压抑后突然打开并带来舒展
