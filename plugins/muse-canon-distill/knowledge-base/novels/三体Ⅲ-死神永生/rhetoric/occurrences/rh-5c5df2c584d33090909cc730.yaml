chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这里的空气异常清新，像雨后初晴般香甜
sensory_mapping: 太空设施空气获得雨洗后的湿气和植物甜味，舱门开启像云层裂开见晴。
context_fact: 官兵长期生活在封闭舰内，穿过通道进入开阔空气区，蓝色地球在背景中。
image_mechanism: 雨后初晴同时解释空气品质和心理转晴，封闭航程如漫长阴雨，在返乡入口结束。
property_alignment: 循环舱气对比对应雨前闷浊；清新空气对应雨洗；离舰开阔对应初晴；返乡喜悦对应天气转好。
context_alignment: 他们误以为苦难已结束，香甜晴空气把这种确信推到感官层，为后续逮捕反转蓄力。
narrative_function: 用第一口空气完成返乡幻觉，让空间、身体和情绪同时开放。
transfer_rule: 空气比较应同时调动气味、湿度和前后封闭感；天气转折可承载心理转折，但需有明确长期压抑背景。
failure_boundary: 空气干燥刺鼻、空间仍狭窄或人物警觉恐惧时，雨后初晴的香甜舒展会失配。
