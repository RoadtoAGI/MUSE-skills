chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 就在浪花刚舔到船首的地方
sensory_mapping: 浪舌伸缩；湿线轻舔；船首受触；白沫舌尖；潮声呼吸
context_fact: 长帆把小船拖到涨潮边缘，随后要推船穿越遍布会啃噬船体的饕餮鱼海域。
image_mechanism: 海先以柔软舌尖试碰船首，水线的来回进退获得动物试探动作；这份轻触又与鱼群真正的利齿威胁形成预备反差。
property_alignment: 浪花对应舌头；水缘薄片对应舌尖；湿润对应舔触；潮汐往返对应伸缩；船首对应被舔物；浅水轻力对应温和接触；后续下海对应被吞入口中
context_alignment: 故事把海写成被饕餮鱼占据的死亡之地，“舔”让小船处于进入巨口前沿，却保持出航瞬间的轻微动作。
narrative_function: 以一个触觉动词准确标定下水边界，并在温柔海浪与凶鱼啃噬间制造张力。
transfer_rule: 用舔写浪花时，应有薄而往复的水缘、轻触固体、湿润附着和非破坏性的短接触。
failure_boundary: 巨浪重击、洪水持续淹没，或水流单向高速冲刷时，舔的轻柔和往复都会低估力量。
