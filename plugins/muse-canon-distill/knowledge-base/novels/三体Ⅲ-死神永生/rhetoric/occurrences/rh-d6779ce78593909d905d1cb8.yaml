chapter: 【危机纪元元年，生命选项】
figure_type: metaphor
quote: 对她来说，这也只有半条命了
sensory_mapping: 抽象人生完整度被量化成可切分实体，一半继续行走，另一半随物理学前景消失。
context_fact: 杨冬知道自己可以转行、结婚生子，但理论物理是其生命意义的一半；后文母亲秘密构成另一半损失。
image_mechanism: 半条命先把职业丧失计为半份死亡，后文同一单位再计母女信任，最终两半相加为一条完整死亡因果链。
property_alignment: 继续日常生活对应剩余半命；失去物理事业对应被截去一半；两项独立打击相加对应两半合成整条命。
context_alignment: 计量框架符合物理学家的思维，也让两件看似可适应的损失在结构上达到自杀阈值。
narrative_function: 建立段落延展隐喻的首个计量单位，清楚组织人物自杀的双重原因。
transfer_rule: 用分数表示人生损失时，每一份应对应独立、同量级的价值支柱，后文运算关系必须保持一致。
failure_boundary: 若后文损失可恢复、两项彼此重叠或人物并不把它们等量看待，半加半等于一的因果精度就会虚假；后文纯复指不另立卡。
