chapter: 【掩体纪元67年，冥王星】
figure_type: analogy
quote: 这些景观小而精致，像是用地球世界最美好的东西穿成的一串珍珠
sensory_mapping: 草地、清泉和沙滩各缩成一颗生态珠，沿飞船内部串联，带着地球的绿蓝白光一起航行。
context_fact: 小型星际船为四人配置六个可自转庭院，是极其奢侈的长期生存设计。
image_mechanism: 串珠同时处理离散庭院与整体飞船关系，珍珠价值又将生态从功能设备提升为文明精华。
property_alignment: 六庭院对应多颗珠；精致景观对应珠光；飞船连接对应穿线；地球元素精选对应珍贵材质；随船移动对应佩带。
context_alignment: 太阳系即将压成巨画，星环号先把地球缩成可携带项链，形成保存文明的另一种微缩。
narrative_function: 用一个整体图像完成飞船内部布局，并强化程心面对其毁灭时的惋惜。
transfer_rule: 多个精致单元比作珠串时，应对应单元形态、串联关系、选材来源、携带功能和价值。
failure_boundary: 庭院大小形状不必圆，也并非装饰无功能；珍珠只描述组合与珍贵。
