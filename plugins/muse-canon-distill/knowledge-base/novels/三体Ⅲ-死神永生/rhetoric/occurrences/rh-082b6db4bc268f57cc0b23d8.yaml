tenor: 星环号内六个独立小庭院及其中草地、溪流、树林、清泉、沙滩和潮水组成的生态景观
vehicle: 从大量材料中精选最美小珠，以线依次串联成便于携带的一条珍珠项链
ground: 单元小而精美；彼此独立又按序组合；来自同一世界的精选部分；整体可随载具远行；价值珍贵
