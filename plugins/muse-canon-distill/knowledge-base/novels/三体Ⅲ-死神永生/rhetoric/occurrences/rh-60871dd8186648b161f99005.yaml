chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 发颤的声音细若游丝
sensory_mapping: 听觉音量被转成一根可见细丝，声带颤抖成为丝线在气流中的抖动。
context_fact: 她跪在皇帝面前自称能杀苏丹，身体与声音都因权力压力而发颤。
image_mechanism: 游丝把声音沿时间拉成一条脆弱线，读者仿佛看到每个音节勉强相连，任何惊吓都能使它断掉。
property_alignment: 低音量对应丝线纤细；声颤对应游丝抖动；话语可能停顿对应细丝易断。
context_alignment: 她说出的能力极大，发声却极小；游丝将这种力量与处境的反差集中在一句回答中。
narrative_function: 以听觉细节维持人物怯弱，使惊人宣称不被写成昂扬宣战。
transfer_rule: 声音转成线状物时，要校准粗细、连续性和受扰状态；发声越可能中断，越适合选择易断材料。
failure_boundary: 声音若洪亮、沙哑厚重或断成爆发短句，游丝的纤细连续感会失配；稳定耳语也缺少颤动。
quality_assessment: effective
confidence: 0.96
review_status: reviewed
tenor: 狄奥伦娜因恐惧而细弱颤抖的回答声
vehicle: 空气中几乎看不见、轻颤易断的游丝
ground: 极细弱到难以捕捉；受微小扰动便颤动且似乎随时中断
