chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 禁卫军的马阵围拢过来，密集地挡在他们面前，像一堵森严的墙壁
sensory_mapping: 甲片墙面；整齐马身；竖矛墙齿；道路封死；森严立面
context_fact: 两船返岸后骑兵围上来，士兵虽未拔剑却以马阵挡路并凝视泡沫航道。
image_mechanism: 人、马和甲胄的缝隙在密阵中消失，众多活动身体压成一堵会移动的金属墙；它向内合拢，把海滩空间缩成围场。
property_alignment: 骑兵个体对应墙砖；重甲对应石材金属；紧密队形对应砌合；横列挡路对应墙面；竖矛对应墙顶尖刺；围拢运动对应合围墙体
context_alignment: 前句军队是涌动潮水，抵达后由流体凝成固墙，动态威胁自然转成不可穿越的封锁。
narrative_function: 把人数优势转化为阻隔结构，制造双方尚未表明立场时的紧张停顿。
transfer_rule: 用墙写密集队列时，应交代构件紧密、横向封路、材质硬度、阵面高度和绕行困难。
failure_boundary: 队伍留有明显通道、士兵四散奔跑或主动迎接放行时，森严墙壁会误判敌意和封闭度。
