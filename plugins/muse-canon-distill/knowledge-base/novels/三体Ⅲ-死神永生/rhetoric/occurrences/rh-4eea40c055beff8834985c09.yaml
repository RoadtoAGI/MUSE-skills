review_status: reviewed
tenor: 封装历史细节、被投送到未知新宇宙的信息载体
vehicle: 密封后投入海流、等待陌生人偶然捡到的漂流瓶
ground: 内容被容器保护并与发送者分离；传递跨越巨大未知空间且能否抵达取决于漫长漂流
