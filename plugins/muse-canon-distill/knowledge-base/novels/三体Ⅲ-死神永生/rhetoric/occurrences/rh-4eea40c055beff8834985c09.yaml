chapter: 《时间之外的往事》序言(节选)
figure_type: metaphor
quote: 这些信息大都存储在漂流瓶中，但愿能到达新宇宙并保存下来
sensory_mapping: 不可见的信息保存被转成瓶中纸条，宇宙尺度传输被压成一只小瓶在黑暗海面漂行。
context_fact: 末世后的叙述者相信细节已被保存，希望它们能穿越到新宇宙，自己只写历史框架。
image_mechanism: 存储提供封瓶动作，到达提供漂流终点；瓶体的微小、封闭和无人护送，把文明信息的脆弱与偶然获救一次呈现。
property_alignment: 信息封装对应纸条装入密封瓶；脱离原文明传送对应瓶子离岸随流远去；新宇宙中的未知接收者对应不确定的拾瓶人。
context_alignment: 人类世界已经消失，发送者无法与未来通信，漂流瓶比定向邮件更符合无地址、无回信、仅求幸存的处境。
narrative_function: 用个人可握的小物承载跨宇宙文明记忆，建立序言温柔而绝望的保存动机。
transfer_rule: 描写无确定接收者的远时空传播时，可选依靠环境流动的容器；它须同时解释封存、离岸和偶然抵达。
failure_boundary: 若传输有明确地址、实时控制和确认回执，漂流的随机性就与机制冲突；信息未经封装保护时，瓶体保存功能也无对应。
quality_assessment: exemplary
