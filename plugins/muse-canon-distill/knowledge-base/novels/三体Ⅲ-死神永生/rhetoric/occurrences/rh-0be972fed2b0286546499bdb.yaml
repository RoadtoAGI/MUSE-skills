chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 无数条上升的白线在褐色的大陆上出现，不断延长，不断增多加密，仿佛地球正长出白发
sensory_mapping: 褐色头颅；白发抽长；发丝增密；地球老去；太空方向竖起
context_fact: 打击传闻引发人类历史最大规模集体逃离，各地穿梭机同时从大陆升空。
image_mechanism: 轨道视角把地球弧面收成头颅，火箭尾迹不是短暂烟线，而像恐惧催生的白发从地表一根根抽长；发射越多，星球越显衰老。
property_alignment: 地球对应头颅；大陆对应皮肤头皮；白色航迹对应白发；火箭上升对应发丝长出；发射密度对应头发变密；危机恐惧对应衰老压力；集体逃离对应生命力离体
context_alignment: 太空远景既真实呈现白线，又让一次恐慌给整个地球加上年龄，符合文明受惊瞬间老去的情绪。
narrative_function: 用单一全球图像概括逃亡规模，并赋予它衰老与末日感。
transfer_rule: 用白发写地表上升尾迹时，应有弧面头颅视角、细白线、向外生长、数量增密和危机造成的衰老含义。
failure_boundary: 尾迹颜色深暗、横向铺散，或只有少量发射且情绪喜庆时，白发衰老会失准。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 从近地轨道看，大量穿梭机同时发射留下的白色尾迹密布大陆并持续向外生长
vehicle: 衰老头颅上白发从皮肤成批长出，细长发丝越来越多、越来越密
ground: 褐色大陆对应头皮；发射尾迹对应白发；白线向上延长对应发丝生长；数量增加对应头发变密；文明恐慌对应骤然衰老
