tenor: 程心看到联合国紧急大会画面后突然出现的强烈恐惧和窒紧感
vehicle: 巨大手掌从外部合拢，紧紧攥住心脏并限制其跳动
ground: 压力突然施加；作用集中胸口；对象失去舒展空间并预感不可逃脱
