chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 程心的心像被一只巨掌抓住
sensory_mapping: 屏幕亮起的瞬间，一只看不见的大手伸入胸腔收拢五指，心跳被挤在掌心。
context_fact: 程心认出堪培拉紧急会议，判断三体灭绝计划已到最后审判。
image_mechanism: 巨掌把预感从思想变成抓握，外部计划对个人和全人类的控制被压到一颗心上。
property_alignment: 突发恐惧对应手掌骤合；胸闷对应心被攥压；三体控制对应巨手掌握；无力逃避对应抓住不放。
context_alignment: 她曾手握毁灭开关，如今被更大力量反向握住，手与心位置倒转显示主动权尽失。
narrative_function: 在智子发言前先让身体认出结局，提升大会转播的不可逆压迫。
transfer_rule: 恐惧如抓心时，要有骤发触发、胸部压力和外部控制来源，避免泛化心痛。
failure_boundary: 没有实际手掌或心脏伤害；若情绪是缓慢忧虑而非猝然收紧，巨掌动作不合。
