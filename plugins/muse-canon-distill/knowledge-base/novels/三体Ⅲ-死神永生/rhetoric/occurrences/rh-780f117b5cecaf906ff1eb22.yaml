figure_type: metaphor
quote: 努力把思想变成黑色的虚空，但仍有一个最后的问题顽固地留在潜意识中
sensory_mapping: 思绪的声音和图像被逐一熄灭成黑空，问题成为黑暗里仍占位置、无法驱逐的亮点或硬核。
context_fact: 她已决定无法自救，想停止推演生命对宇宙的改变，却仍问大自然是否自然。
image_mechanism: 清空动作把停止思考具体化，残留问题借黑色背景获得更强对比；越想归零，最后内容越不可忽视。
property_alignment: 停止思考对应空间清空；压抑认知对应熄灭成黑；疑问未消对应异物残留；顽固性对应无法移走。
context_alignment: 自杀前的精神目标不是解决问题而是获得空白，虚空意象直接通向她所选择的终止。
narrative_function: 让章节终极疑问从逻辑推论变成无法排除的心理实体，推动人物越过求生界线。
transfer_rule: 写思想压抑时，可明确清空、熄灭等具体操作，再让无法删除的内容以位置或亮度显形；残留项必须是前文推理必然产物。
failure_boundary: 若人物只是暂时分心、问题很快遗忘或有多个思绪同时活跃，黑色虚空和唯一残留都不成立。
