chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 里面的生态系统十分舒适精致，像一个优美的小花园
sensory_mapping: 舱内小园；精致绿意；柔和空气；封闭生境；旅途休憩
context_fact: 第三代星环号是可载两至三人的小型恒星际飞船，内部需长期独立维持生命。
image_mechanism: 维生设备隐藏到可游赏的园景背后，狭小舱体不再像机器内部，而成为被精心修剪、能呼吸循环的私人自然角落。
property_alignment: 生态系统对应花园；植物循环对应园中生长；有限舱容对应小园；环境控制对应园艺；舒适度对应休憩感；精致设备对应景观布置；长期维生对应花园自循环
context_alignment: 飞船是星环集团最后返还的资产，花园形象保存了公司以高技术创造优雅生活的遗产，也为两人回地球提供私密空间。
narrative_function: 以熟悉宜居尺度概括复杂维生系统，缓和前段死亡氛围并开启漫游生活。
transfer_rule: 用花园写生态舱时，应有真实植物或生态循环、有限而精细的空间、舒适微气候及可停留游赏的感受。
failure_boundary: 舱内只有裸露管线、生态仅靠化学设备而无园景，或空间拥挤嘈杂时，小花园会粉饰真实体验。
