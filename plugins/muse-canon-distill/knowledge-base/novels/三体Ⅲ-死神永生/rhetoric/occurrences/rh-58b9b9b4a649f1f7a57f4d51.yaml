chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 这是一个宇宙文明的生死簿
sensory_mapping: 陌生字符一行行滚过，像宇宙末日打开的名册，每种语言都是一个文明仍被登记的姓名。
context_fact: 广播用不同语言重复信息，地球和三体语言起初未出现，二人据此判断文明是否留下长期痕迹。
image_mechanism: 生死簿把语言目录变成文明生命登记，检索熟悉文字因此具有寻找亲族姓名的情绪强度。
property_alignment: 文明对应登记个体；语言对应姓名；列表对应名册；仍存在对应生项；曾存在对应死项；缺席对应无记录。
context_alignment: 宇宙将死的广播本就处于终极时刻，传统生死簿意象给不可读字符赋予末日审判感。
narrative_function: 在内容揭晓前先制造两个文明是否被宇宙记住的悬念。
transfer_rule: 目录比作生死簿时，应明确条目代表谁、列入条件、缺席意义和查找者与条目的关系。
failure_boundary: 广播列表并未区分文明当前生死，也不包含所有短暂文明；它不是全知完整档案。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 超膜广播列出的上百万种文明语言，证明相应文明仍存在或曾长期存在并留下印记
vehicle: 登记个体出生、死亡与存亡状态的名册，可据是否列名判断其生命记录
ground: 以名称或语言列项；涵盖大量生命单位；记录存在与死亡；未列名意味着消失或短暂；由权威终局时刻发布；读者寻找自己名字
