chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 太阳系人类为他们的土地流尽了最后一滴血，或者说，只剩下你和AA这两滴
sensory_mapping: 太阳系文明像一具在保卫家园中流尽血液的身体，程心与AA成了漂在宇宙外的最后两滴。
context_fact: 太阳系已被二维化，程心和AA乘星环号逃出，其他已知太阳系人类全部死亡。
image_mechanism: 先用固定成语‘流尽最后一滴血’，再把最后一滴拆成两个具体幸存者，套语因精确计数获得新实体。
property_alignment: 太阳系文明对应身体；保卫战争对应创伤失血；人口毁灭对应血流尽；程心AA对应两滴残血；文明终结对应失血死亡。
context_alignment: 关一帆以银河人类立场批判故土依恋，血滴比喻尖锐地把程心本人纳入批判证据。
narrative_function: 把宏观文明灭亡压缩到在场者身体身份，激化土地与出走的价值争论。
transfer_rule: 群体牺牲借失血表达时，可把残余个体具体计为血滴，但必须有总体身体、伤因和死亡后果。
failure_boundary: 程心和AA是完整独立的人，不只是文明残片；太阳系毁灭原因也不能仅归于故土依恋。
