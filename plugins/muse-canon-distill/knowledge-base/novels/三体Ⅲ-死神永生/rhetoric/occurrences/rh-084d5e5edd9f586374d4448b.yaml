tenor: 小宇宙田地中成熟麦穗成片随风起伏的金黄色景象
vehicle: 海面波浪连续起伏、成片推进并反射光线的流动形态
ground: 群体连续铺展；表面起伏；波动由风推动；颜色与光泽成片变化；个体融入整体；可一浪接一浪
