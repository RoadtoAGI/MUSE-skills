chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 翠绿的麦苗慢慢变成金黄的麦浪
sensory_mapping: 麦苗长高变黄后不再是一根根植株，风一过，整块田地像金色水面层层起浪。
context_fact: 647号宇宙一年内小麦收获两季，程心和关一帆观看其成熟。
image_mechanism: 把静态作物群转换为液体表面，风把无数麦穗同步运动组织成可传播的波。
property_alignment: 麦穗群对应水面；风吹起伏对应波浪；金黄色对应反光浪面；成片田地对应海域；成熟过程对应浪形形成。
context_alignment: 封闭小宇宙以田园维持生活，麦浪为这段安稳年月提供最传统的人类农耕图景。
narrative_function: 用颜色和运动压缩两季生长，显示二人已进入可循环的生活节律。
transfer_rule: 作物写成浪时，应有足够群体面积、统一风力、连续起伏和综合色泽，避免单株也称浪。
failure_boundary: 麦田没有液体流动，波动幅度与传播机制也不同于海浪；个体植株仍固定在土中。
quality_assessment: conventional
confidence: 1.0
