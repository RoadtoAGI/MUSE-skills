tenor: 黑域计划作为掩体主流之外的小规模备选，只能先做基础理论研究，成败机制和社会后果均高度不确定
vehicle: 危机纪元面壁计划由少数人秘密探索非主流方案，以巨大未知和个人冒险换取突破可能
