figure_type: analogy
quote: 黑域计划则与面壁计划类似，是充满着未知因素的冒险
sensory_mapping: 双轨道路；主干旁暗线；少数冒险者；未知终点；远离公众视线
context_fact: 光速飞船被否决后，人类同时推进掩体计划并保留黑域基础研究，后者影响面暂时较小。
image_mechanism: 历史上的双计划结构被叠到当前：掩体走在明亮主路，黑域像面壁者当年的暗线，入口窄、地图空白，却可能绕到主路到不了的出口。
property_alignment: 掩体计划对应太阳系防御主流；黑域计划对应面壁计划；公众动员对应公开主路；小范围理论对应秘密暗线；技术未知对应方案不可见；潜在救亡对应非常规突破；失败风险对应个人冒险
context_alignment: 广播纪元重新面对生存选项，借危机纪元制度记忆说明为什么一个被边缘化的计划仍值得保留。
narrative_function: 建立黑域研究的政治位置，并为维德后来秘密推进曲率飞船提供历史框架。
transfer_rule: 用历史计划类比新方案时，应匹配主流关系、公开程度、参与规模、未知性、风险和可能突破点。
failure_boundary: 黑域若已技术成熟并获全民支持，或面壁计划与其不存在并行主流结构，则该历史类比会误写地位。
