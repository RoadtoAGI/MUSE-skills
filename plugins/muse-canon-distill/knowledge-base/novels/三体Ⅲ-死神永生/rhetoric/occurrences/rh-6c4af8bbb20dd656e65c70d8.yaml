chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 随着一切都尘埃落定
sensory_mapping: 威慑失败扬起的漫天尘土经过六年慢慢下沉，城市和舆论从灰雾中显出固定轮廓。
context_fact: 人类已回到原居地、经济重建，广播结果确认，公众开始回顾并追责整个事件。
image_mechanism: 尘埃沉降把事件结束与认知澄清连在一起：行动风暴停后，人们才看见可供复盘的地面格局。
property_alignment: 危机混乱对应扬尘；事件结束对应颗粒下落；结果明确对应视野变清；社会稳定对应尘土静置。
context_alignment: 后文舆论又铺天盖地出现，物理事件虽落定，解释战争立即卷起，成语的暂时稳定因此带反讽。
narrative_function: 作为时间铰链从事件叙述转入社会反思，快速压缩六年后的收束状态。
transfer_rule: 用尘埃落定转场时，应先有可对应的扰动期，再展示视野清晰、位置固定和随之开始的判断。
failure_boundary: 太阳系毁灭风险仍悬而未决，责任争论也未终结；落定只指前一阶段事实结果。
