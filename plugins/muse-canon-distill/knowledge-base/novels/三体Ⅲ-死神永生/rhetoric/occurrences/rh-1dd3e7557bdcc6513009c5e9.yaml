chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 两个世界的战略平衡，像一个倒放的金字塔，令人心悸地支撑在他这样一个针尖般的原点上
sensory_mapping: 两个文明叠成倒立石塔，罗辑缩成塔尖下的针点，宇宙重量压在单一接触面。
context_fact: 机构无法持有威慑，罗辑一人长期握着太阳核弹链或引力波发射开关。
image_mechanism: 倒塔先制造结构不稳定，针尖再二次缩小支撑，将规模差与单点失效风险推到极端但可计算的几何图。
property_alignment: 两个世界体量对应金字塔；威慑平衡对应倒塔静立；罗辑个人对应针尖支点；个人失误对应整体倾覆。
context_alignment: 威慑稳定实际建立在对一人决心的判断上，几何脆弱性准确呈现这种制度悖论。
narrative_function: 一图概括执剑人制度的力量与危险，为继任选择制造紧迫。
transfer_rule: 系统单点依赖可用倒置结构写；体量比、接触面积和失衡后果需逐项对应，不能只因一个人重要。
failure_boundary: 若有多重冗余、自动触发或多人共同决策，针尖单点会夸大；平衡若内在稳定也非倒塔。
