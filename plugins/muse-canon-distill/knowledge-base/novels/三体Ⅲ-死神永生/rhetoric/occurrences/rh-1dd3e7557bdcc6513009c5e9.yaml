tenor: 地球与三体的文明级平衡全部依赖罗辑个人按键决断
vehicle: 巨大金字塔倒置后以尖端支在更细针尖上维持不稳平衡
ground: 上方系统体量极大而接触支点极小；任何微小偏移都可能使整体倾覆并造成灾难
