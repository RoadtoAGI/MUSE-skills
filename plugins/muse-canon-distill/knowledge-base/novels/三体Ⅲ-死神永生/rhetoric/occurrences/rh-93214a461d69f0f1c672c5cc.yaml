chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 随着过载的消失，程心感觉像拥抱着自己的一双手臂突然松开了一样
sensory_mapping: 过载化成两条看不见的粗臂把她按紧，发动机停下时臂弯骤松，身体从怀抱中浮起。
context_fact: 太空艇越过地球后结束加速，程心由3G超重直接进入无动力失重滑行。
image_mechanism: 拥抱把惯性压力人格化成包围触感，松手准确表现不是力量渐小，而是航行阶段切换的骤然释放。
property_alignment: 过载压力对应臂力；椅背固定对应被抱紧；加速结束对应松手；失重对应离开怀抱。
context_alignment: 程心此前因朋友之手放弃自杀，此处机械过载也成为手臂，但松开只释放身体，不取消她承担会面的关系。
narrative_function: 用身体熟悉感标记加速段结束，并平滑过渡到月光般阳光中的失重漂浮。
transfer_rule: 压力如拥抱时，应匹配包围部位、施力持续、解除时点和身体状态的即时变化。
failure_boundary: 过载来自惯性且只沿特定方向，不含亲密情感；高于舒适范围时拥抱还会淡化危险。
