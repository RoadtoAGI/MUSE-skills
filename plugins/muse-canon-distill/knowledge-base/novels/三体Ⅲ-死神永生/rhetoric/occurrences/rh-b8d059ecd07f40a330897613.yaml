figure_type: simile
quote: 运载舱进入终端站时四周暗了下来，如同火车进入隧洞
sensory_mapping: 胶囊舱像列车钻入巨型圆环，阳光被框架截断，舷窗一齐转暗，前方站厅灯随后亮起。
context_fact: 终端站占据上方大部分太空，密集框架切碎阳光，运载舱沿导轨进入大厅。
image_mechanism: 隧洞把无地面的空间建筑恢复成交通基础设施，明暗序列和进站动作都能由铁路经验直接复现。
property_alignment: 运载舱对应火车；导轨对应铁轨；终端结构对应隧洞；阳光遮断对应入洞变暗；大厅灯对应站内照明。
context_alignment: 下一段终端站又让程心联想到旧火车候车厅，入隧洞先为太空电梯建立完整铁路感。
narrative_function: 用熟悉进站节拍组织巨型结构穿越，降低太空空间方位的阅读负担。
transfer_rule: 新型交通进封闭体如火车入洞时，应匹配轨道、包围结构、光变顺序和到站节点。
failure_boundary: 终端站不是山体隧道，运载舱也垂直上升；类比主要适用于遮光和沿轨进入过程。
