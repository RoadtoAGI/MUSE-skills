chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 那是他们要留在小宇宙中的东西，是要送往新宇宙的漂流瓶
sensory_mapping: 旧宇宙把文明记忆封进金属小瓶，投入创世后的高维海洋，边漂边用中微子呼喊，等待未来生命拾起。
context_fact: 金属盒会在新宇宙诞生时穿门进入，持续播放信息；其他响应回归的小宇宙也会留下记忆体。
image_mechanism: 漂流瓶把跨宇宙信息保存组织成发送—漂泊—拾取—解码链，高维空间自然接替海洋承担不确定传递。
property_alignment: 金属盒对应瓶；量子存储对应信件；高维漂浮对应海上漂流；未知文明对应拾瓶者；中微子广播对应瓶外呼号；旧文明消失对应寄信者远去。
context_alignment: 全书文明多次向宇宙发送信号，此处最后一次发送不用于威慑或暴露，而用于把记忆交给未知善意。
narrative_function: 为地球与三体文明提供跨创世的微小延续，并把终局希望放在未来阅读者而非肉身幸存。
transfer_rule: 跨时空档案比作漂流瓶时，应完整写出封装、防护、无指定收件人、漂移媒介、发现条件和解码内容。
failure_boundary: 装置有推进器和主动广播，并非被动随流；新宇宙是否存在接收文明完全未知。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 存储三体与地球文明记忆的微型电脑留在小宇宙，待新宇宙诞生后自动进入并广播信息
vehicle: 把信件密封在瓶中投入海流，让它跨越未知时间空间漂泊，等待陌生拾取者发现解读
ground: 容器保护信息；发送者无法指定收件人；旅程漫长且不确定；依靠环境流动抵达；被发现后可解读过去；发送者可能已消失；可有许多同类同时漂流
