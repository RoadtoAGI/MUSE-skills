tenor: 程心抽离人类视角后看到澳大利亚密集房屋与忙碌人群的整体形态
vehicle: 外部观察者俯看一个挤满小虫、通道密集且活动不停的蚁窝
ground: 观察尺度突然升高；单个人失去辨识度；大量个体在狭小空间按生存需求奔忙
