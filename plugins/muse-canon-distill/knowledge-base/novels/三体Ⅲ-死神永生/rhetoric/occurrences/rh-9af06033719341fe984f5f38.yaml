chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 像从世界之外看着这一切，而这一切也突然变得像一个熙熙攘攘的蚁窝
sensory_mapping: 视点升到世界外，人群缩成黑点沿房屋缝隙爬行，整片大陆起伏成一座喧闹巢穴。
context_fact: 程心从维德处返回，沿途看见望不到边的简易房和其间密密麻麻的移民。
image_mechanism: 外部视角先改变比例，蚁窝再为新比例提供群体结构，个体苦难被压成一种可怖的生物密度。
property_alignment: 世界外俯视对应尺度抽离；密集简易房对应巢室；忙碌人群对应工蚁流动；拥挤生存对应窝内高密度。
context_alignment: 维德把政治未来压成一句话后，程心也暂时把人类压成群体图案，阳光因此带上非人视角的阴森。
narrative_function: 预示移民社会将以数量和生存本能吞没个人伦理，为后续秩序崩溃定形。
transfer_rule: 群体如虫巢时，应先建立观察尺度，再对应居所拓扑、个体运动和共同生存压力。
failure_boundary: 人类仍有差异化意志与政治关系，蚁窝不能推导统一集体意识；近距离人物视角会破坏映射。
