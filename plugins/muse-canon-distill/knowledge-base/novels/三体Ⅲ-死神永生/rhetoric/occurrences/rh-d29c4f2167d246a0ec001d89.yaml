tenor: 罗辑脱去太空服后，白发白须在冥王星低重力空气中缓慢漂浮的状态
vehicle: 长发浸在水里失去下垂重量，发丝随微小水流柔缓散开漂动
ground: 重力影响减弱；发丝舒展；运动缓慢柔和；各束随气流漂移；轮廓呈悬浮状态；环境介质不可见
