chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 白发和白须在低重力中飘浮起来，像在水中一般
sensory_mapping: 信息窗里的白发白须在脸旁缓缓散开，仿佛老人沉在一池透明水中向她们告别。
context_fact: 罗辑已回地下隧道，隔着通信与正在逃离的程心、AA保持最后联系。
image_mechanism: 水中发丝为低重力提供熟悉运动参照，也让罗辑像已沉入另一个介质，与飞船一侧分隔。
property_alignment: 低重力对应浮力；空气微流对应水流；发须散开对应水中漂发；缓慢动作对应液体阻尼观感。
context_alignment: 二维平面此前像海水淹城，罗辑此刻水中般悬浮，视觉上已经进入将吞没他的宇宙海。
narrative_function: 在失真通信开始前保留罗辑最后一个清晰、安静的动态肖像。
transfer_rule: 低重力毛发比作水中漂浮时，应对齐下垂减弱、散开方向、运动速度和人物分隔感。
failure_boundary: 隧道内是空气而非液体，没有真实浮力或阻尼；相似仅在发丝运动轨迹。
