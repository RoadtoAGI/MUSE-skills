figure_type: metaphor
quote: 战斗警报忽然凄厉地鸣响，仿佛整个星空都在尖叫
sensory_mapping: 警报不再来自扬声器，声音沿透明穹顶铺入每颗星，黑色宇宙整体张口尖叫。
context_fact: 关一帆刚把宇宙称作病人，水滴攻击随即触发战斗警报。
image_mechanism: 透明罩让声源与星空在感知上重合，尖叫把机器信号人格化，还形成宇宙病人仿佛对诊断作出痛觉反应的连锁。
property_alignment: 警报尖厉对应人声尖叫；声场充满广场对应整个星空发声；最高危险对应极端痛苦；骤响对应突然受创。
context_alignment: 前一句正在谈病态宇宙，警报像回答对话，星空尖叫将理论病症与现实攻击瞬间扣合。
narrative_function: 以听觉爆裂切断哲学讨论，把潜在宇宙异常转成迫近战斗，并给场景制造灾变转折。
transfer_rule: 环境尖叫需让声源覆盖视野、音色具有人声痛感，并与场景中的受创或警示意义相接。
failure_boundary: 低沉平稳提示音、局部耳机声或安宁星空未与声场重合时，整个宇宙尖叫会失去感官基础。
