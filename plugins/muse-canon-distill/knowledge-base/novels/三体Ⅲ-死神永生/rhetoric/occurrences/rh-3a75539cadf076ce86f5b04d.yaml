tenor: 星环公司的十米级流线型穿梭机，外壳无接缝般光滑并覆盖高反射金属镜面
vehicle: 一滴表面张力塑成的光洁水滴，轮廓连续流线、表面反光且没有棱角
ground: 流线船体对应水滴轮廓；金属镜面对应水面反光；连续外壳对应液滴无缝；小型尺度对应单滴；尾部收束对应滴形尖端；表面光滑对应液体张力
