chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 通体被金属镜面覆盖，让人想到水滴
sensory_mapping: 银亮水滴；无缝曲面；镜面反光；流线尖尾；地面静滴
context_fact: 紧急逃亡时程心登上星环公司中小型穿梭机，周围还有大量形状规则的垂直起飞器。
image_mechanism: 高技术外壳隐藏全部结构线，只留下被表面张力统摄的连续曲面；金属材质保留水滴亮斑，却将柔软液体凝成可升空机器。
property_alignment: 穿梭机对应水滴；流线外形对应液滴；金属镜面对应湿亮表面；无明显结构对应无缝；小艇尺寸对应单滴；聚变起飞对应水滴反重力升空
context_alignment: 三体“水滴”曾是极致强度和光洁技术的象征，未来人类穿梭机只在外观上让程心联想它，悄然标记技术审美继承。
narrative_function: 在拥挤发射场中快速突出星环载具的光洁未来感，也唤回读者对水滴的危险记忆。
transfer_rule: 用水滴写机器时，应有连续流线、圆润收束、强反光和极少外露构件，并区分外观联想与材料强度。
failure_boundary: 机体多棱多翼、表面粗糙拼缝明显，或叙述据此直接推断强互作用材料时，水滴类比会越界。
quality_assessment: effective
