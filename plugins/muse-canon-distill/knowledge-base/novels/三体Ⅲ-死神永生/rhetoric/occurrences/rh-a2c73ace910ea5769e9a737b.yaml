chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 人群立即像被磁铁吸引的铁屑一般蜂拥而来
sensory_mapping: 食品垛成为磁极，沙地人点像铁屑齐齐转头，从各条路径拉出汇向中心的黑线。
context_fact: 第二架运输机把食品放在稍远空地，现场没有士兵或分发人员，人群立即围来。
image_mechanism: 磁场为尚未接触食品的人群运动提供看不见的共同力，强调饥饿让选择呈现机械一致性。
property_alignment: 食品中心对应磁铁；饥饿驱力对应磁场；分散人群对应铁屑；蜂拥汇聚对应沿力线吸附。
context_alignment: 没有警戒和指挥后仍出现高度一致的聚集，磁力比洪水更准确解释第二次从静止到定向的瞬变。
narrative_function: 显示第一次混乱没有形成学习，第二垛落地即自动重演争抢。
transfer_rule: 群体受目标吸引时，可用场力模型对应中心、驱力、转向和密度变化。
failure_boundary: 人有自主判断且可能抗拒，铁屑没有；若目标分散或人群向多处移动，单磁极模型不成立。
