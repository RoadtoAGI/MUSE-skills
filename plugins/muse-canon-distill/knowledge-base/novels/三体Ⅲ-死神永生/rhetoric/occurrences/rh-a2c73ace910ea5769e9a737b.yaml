tenor: 第二垛食品落地后，四周移民几乎同时改变方向并向它聚集
vehicle: 散落铁屑进入磁场后受同一中心吸引，迅速沿力线聚向磁铁
ground: 远处分散个体同步转向；中心目标产生强烈单向吸引；距离缩短后密度骤增
