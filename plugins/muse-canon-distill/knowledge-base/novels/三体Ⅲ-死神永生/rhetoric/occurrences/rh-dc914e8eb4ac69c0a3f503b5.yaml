chapter: 【危机纪元5-7年，阶梯计划】
figure_type: metaphor
quote: 悲伤的洪流淹没了手术室，淹没了整幢大楼，淹没了纽约，在她上方成了湖成了海，她在悲伤之海的海底几乎窒息
sensory_mapping: 眼泪和液氦白雾引出水势，悲伤越过手术室墙壁淹没纽约，程心的身体沉到无光海底抽泣窒息。
context_fact: 她扑到装有云天明大脑的容器前，只短暂感到寒气接触，随即确认追赶目标已离开自己的时空。
image_mechanism: 三次淹没逐级放大空间，湖到海继续增加深度；情绪强度被拆成范围、位置和呼吸后果，而非只说悲痛巨大。
property_alignment: 痛哭爆发对应洪流涌出；意识被占据对应城市淹没；无助下伏对应沉到海底；抽泣窒息对应水下缺氧。
context_alignment: 现场有白雾如瀑布和泪水，真实液体感自然过渡到情绪海洋，避免宏大尺度脱离感官。
narrative_function: 把失去云天明的个人悲痛推至世界尺度，同时让后续医生关于希望的话像从水面传入。
transfer_rule: 悲伤如洪水应安排水源、扩张尺度、主体沉降和生理后果；递进空间需对应情绪吞没层级。
failure_boundary: 克制哀伤、短暂失落或仍能清楚处理事务时，城市级洪水会失真；夸张表达不能替代临床窒息判断。
quality_assessment: exemplary
