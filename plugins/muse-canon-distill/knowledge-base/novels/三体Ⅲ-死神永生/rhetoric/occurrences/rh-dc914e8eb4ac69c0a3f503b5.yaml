review_status: reviewed
tenor: 程心确认永远失去云天明后迅速扩张、占据全部意识并令呼吸困难的极度悲痛
vehicle: 水量不断暴涨的洪流先淹没房间和城市，最终形成深海，把人压在海底无法呼吸
ground: 情绪从一点迅速扩大到覆盖整个主观世界；主体被其包围、压低并失去正常感知与呼吸能力
