chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 故事像长江一样从容流淌，使她融入其中
sensory_mapping: 电影时间化成江水，镜头成为河段，程心从观众席进入水流随故事向下游移动。
context_fact: 长江童话分别描写源头与入海口恋人，从不相见却持续思念，摄影并置两地。
image_mechanism: 影片题材自身提供河流结构，流淌同时解释节奏和两端连接；融入使观看成为被水承载。
property_alignment: 故事推进对应江流；源尾恋人对应长江两端；舒缓镜头对应从容水速；观众沉浸对应入流。
context_alignment: 程心的时代错位和云天明远距关系也被长江式不可见连接触动，喻体超出形式评价。
narrative_function: 把影片审美转成身体沉浸，并为后续音乐河流意象建立首个框架。
transfer_rule: 叙事如河时，应让题材空间、节奏和连接功能都能沿河程对应；后文纯复用应识别为同一框架。
failure_boundary: 碎片化跳剪、急促断裂或故事没有首尾空间连接时，长江从容流淌会失配。
quality_assessment: exemplary
