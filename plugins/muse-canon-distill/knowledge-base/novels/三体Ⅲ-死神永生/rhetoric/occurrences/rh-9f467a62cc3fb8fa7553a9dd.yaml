tenor: 电影中跨越不可见距离、节奏舒缓连续的爱情叙事
vehicle: 长江从源头到入海口持续、从容而不可阻断地流动
ground: 叙事沿长距离稳定推进；两端空间被同一连续介质连接，节奏厚重舒缓
