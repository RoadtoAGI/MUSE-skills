tenor: 具有整体曲率、局部近似平坦并可能在更高维度闭合的宇宙空间结构
vehicle: 一张可弯曲连续薄膜整体起弧，近看一小片仍像平面，并可首尾闭合成肥皂泡球面
ground: 空间连续体对应膜面；宇宙曲率对应膜弯曲；局部欧氏性对应小片近似平面；整体闭合对应肥皂泡；无边界有限空间对应球面；曲率可变对应膜可塑
