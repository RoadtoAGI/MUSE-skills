chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 如果把宇宙的整体想象为一张大膜，这张膜的表面是弧形的，整张膜甚至可能是一个封闭的肥皂泡
sensory_mapping: 宇宙薄膜；弧面起伏；局部平片；泡状闭合；空间可弯
context_fact: 节选为曲率驱动提供通俗理论背景，随后用折纸与熨平解释不同航行设想。
image_mechanism: 不可见三维空间被降一维摊成可触表面，曲率由公式变成膜的弯度；肥皂泡再说明一个无明显边缘的表面也能整体封闭。
property_alignment: 三维空间对应二维膜；曲率张量对应表面弯度；局部平直对应膜小片；宇宙整体对应整膜；闭合拓扑对应泡面；空间连续对应膜无断裂；尺度差对应近看与远看
context_alignment: 肥皂泡呼应刚破解的香皂纸船，而膜模型又直接为雪浪纸“带曲率—熨平”提供认知支架。
narrative_function: 以连续表面模型建立读者直觉，使后续曲率驱动的拉力关系可视化。
transfer_rule: 用薄膜解释空间曲率时，应明确这是降维模型，逐项对应局部平直、整体弯曲和可能闭合，避免把膜当真实物质层。
failure_boundary: 论证需要时间维、量子涨落或非连续拓扑细节，而叙述仍把空间当可直接拉扯实体膜时，类比会遮蔽关键差异。
quality_assessment: effective
