chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 我现在只能看到你的眼睛，那里面有星星
sensory_mapping: 眼中星点；暗瞳夜空；微光闪烁；远方召唤；向往发亮
context_fact: 长帆刚告诉公主世界远超王国与赫尔辛根默斯肯，公主立即想乘帆船远航。
image_mechanism: 公主尚未见过的广大世界先以星点进入眼睛，瞳孔从身体部位展开成夜空；长帆读取反光，也读取她被远方点亮的欲望。
property_alignment: 瞳孔对应夜空；眼内亮点对应星星；向往对应星光；未知大陆对应远星；黑夜火光对应观星环境；目光活跃对应闪烁；远航欲望对应仰望方向
context_alignment: 露珠被伞遮蔽、困在封闭王国，眼中星星把她的身体与伞外无边世界建立唯一通道，预告最终远航。
narrative_function: 不用心理说明便让长帆看见公主的向往，并为二人共同出海建立情感起点。
transfer_rule: 用眼中星星写向往时，应有暗背景上的真实亮点、明确的远方对象和人物被新世界激活的目光变化。
failure_boundary: 人物目光呆滞绝望、没有向往对象，或所谓亮点只是强光刺眼泪花时，星星会误读情绪。
