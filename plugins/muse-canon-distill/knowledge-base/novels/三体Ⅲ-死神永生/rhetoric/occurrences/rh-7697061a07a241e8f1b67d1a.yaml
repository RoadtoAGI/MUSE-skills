chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 没有能够走过一个普通人的生活道路，我的经历其实是一个文明的历程
sensory_mapping: 她本可沿家庭、职业和衰老的短路走完一生，却被一次次送上跨世纪大道，脚下里程最终等同一个文明的路程。
context_fact: 程心从公元世纪活到宇宙晚期，先后参与火箭、PIA、威慑、光速与回归决定。
image_mechanism: 道路把人生顺序具体化，再用路线长度和经过节点把个人传记同比例放大成文明史。
property_alignment: 出生学习对应起点；职业与纪元对应路段；重大选择对应岔口；冬眠跨时对应长途跳跃；文明发展对应更长路线；回忆录对应旅程回望。
context_alignment: 这不是外部英雄化，而是程心强调自己普通却被历史带远，自我声音保留被动与不幸。
narrative_function: 把角色史与三部曲文明史合拢，为下一段文明整体成长类比过渡。
transfer_rule: 个人经历等同集体历程时，应逐点展示个人节点如何对应群体阶段，并保留路线偏离与被迫前进。
failure_boundary: 程心不能代表人类所有群体与价值，她的路线只是文明史的一条关键切面。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 程心个人一生跨越多个纪元，经历的尺度与人类文明从火箭到宇宙命运的演变相重合
vehicle: 行路者沿道路走完个人旅程，而另一条更长路线记录整个文明的发展进程
ground: 有起点与连续阶段；路线受选择和外力改变；每段通向下一段；普通路线与异常长途可对照；终点回望形成历程；个体脚步承载集体轨迹
