figure_type: simile
quote: 那个差点杀了她的像狼一般邪恶凶狠的公元男人
sensory_mapping: 维德的冷目像狼眼锁住猎物，开枪动作如扑咬，程心即使远离仍记得牙齿逼近的寒意。
context_fact: 维德曾因执剑人竞争向程心开枪；程心恨怕他，却也把其强硬看作一种依靠。
image_mechanism: 狼把政治决断和杀意变成捕食行为，依靠感因此不是温暖保护，而是强大危险动物可能带来的威慑。
property_alignment: 维德追杀对应狼扑猎；凶狠意志对应利齿；高威慑度对应捕食者压迫；程心畏惧对应猎物反应。
context_alignment: 山喻提供稳定，狼喻提供攻击，二者并列解释公元力量为何既能支撑程心又使她恐惧。
narrative_function: 用一个危险动物形象压缩程心对维德的爱憎矛盾，并重新提出威慑需要的掠食性。
transfer_rule: 人物如猛兽时，应把具体攻击史、锁定方式、力量用途和观察者身体反应逐项绑定。
failure_boundary: 维德有理性目标和政治判断，不是本能野兽；狼性也不能自动证明其方案正确。
