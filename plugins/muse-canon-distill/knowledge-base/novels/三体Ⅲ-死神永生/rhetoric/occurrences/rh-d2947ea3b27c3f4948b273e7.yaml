chapter: 地球文明
figure_type: simile
quote: 它有一种诡异的简洁，像是对现实世界的某种抽象
sensory_mapping: 白色地表像复杂现实底图，黑碑只剩一块纯矩形，仿佛世界被删到一个符号。
context_fact: 方碑是地下文明博物馆入口，远古风格的箭头从四面将来者引向它。
image_mechanism: 抽象把建筑的极简外观解释为信息压缩，正呼应博物馆试图将文明压成可跨亿年保存的符号。
property_alignment: 黑色矩形对应几何抽象；无装饰对应删细节；白地反差对应模型背景；入口功能对应现实压缩点。
context_alignment: 太阳系将被二维展开成图形，方碑提前以抽象平面几何出现在三维地表。
narrative_function: 使入口兼具建筑与概念标志性质，为进入时间墓室建立哲学氛围。
transfer_rule: 极简物比作抽象时，应说明被删掉的现实细节、保留的几何、代表关系和场景主题。
failure_boundary: 方碑仍是具体建筑，不知设计者是否有抽象意图；诡异感来自观察者解释。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 白色冰原上唯一突起、无装饰无细节的黑色长方碑
vehicle: 从复杂现实中删去材质细节，只保留最基本几何关系的抽象模型
ground: 形状高度简化；颜色单一；细节被去除；与周围现实反差强；似乎代表超出自身的概念
