figure_type: analogy
quote: 核弹的每一次爆炸都使飞船的速度增加一级，很像在登一道阶梯
sensory_mapping: 无形速度轴竖立成楼梯，核爆成为脚下台阶，飞船每受一次脉冲便向上跨一级。
context_fact: 方案沿航路预置核弹，用辐射推动轻帆，目标达到光速百分之一。
image_mechanism: 阶梯将连续速度量离散化，爆炸序列既是空间节点也是速度级别；计划名称由机制自然长出。
property_alignment: 单次核爆对应一步；速度增量对应一级高度；连续布弹对应阶梯排列；目标速度对应高处终点。
context_alignment: 类比直接解释方案架构并提供可记名称，技术含义和命名功能合一。
narrative_function: 把复杂脉冲推进压成直观累加模型，完成阶梯计划命名。
transfer_rule: 离散累积过程可借阶梯写，但每级必须同向提升且顺序不可跳跃；名称应能反查真实机制。
failure_boundary: 若爆炸导致连续推力、速度有升有降或可任意绕过节点，阶梯的离散单向结构就不准确。
