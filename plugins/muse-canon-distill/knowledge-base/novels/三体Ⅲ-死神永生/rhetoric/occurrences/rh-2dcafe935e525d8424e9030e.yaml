chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 你的威慑度在百分之十上下波动，像一条爬行的小蚯蚓；罗辑的威慑度曲线像一条凶猛的眼镜蛇，在百分之九十高度波动
sensory_mapping: 两根抽象曲线长出活体：一根伏在底线细弱蠕动，另一根抬高蛇首、在九成高度警戒摆动。
context_fact: 智子用人格分析结果解释三体为何敢在程心接任后立即进攻，并称罗辑是强大威慑者。
image_mechanism: 动物不仅复现图线外形，还把纵轴数值翻译成攻击姿态，使百分比获得可感的危险等级。
property_alignment: 低位曲线对应蚯蚓贴地；小幅波动对应缓慢蠕动；高位曲线对应眼镜蛇昂首；高威慑对应毒蛇攻击性。
context_alignment: 智子当面羞辱程心并敬畏罗辑，蚯蚓与眼镜蛇的物种等级准确携带她的轻蔑和恐惧。
narrative_function: 用一组对照图像总结执剑人选择失败，并把人格模型的数值差转为无法误读的威胁差。
transfer_rule: 把曲线比作动物时，应让线形、高度、动态和语义强度分别落到姿态与行为上，并用成组喻体制造对照。
failure_boundary: 动物性不能证明人格固定不变，百分比也非生物攻击概率；脱离同一坐标轴时蚯蚓与眼镜蛇不可直接量化。
quality_assessment: exemplary
