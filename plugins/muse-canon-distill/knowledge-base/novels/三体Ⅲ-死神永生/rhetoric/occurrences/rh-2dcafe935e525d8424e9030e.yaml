tenor: 程心低位微动与罗辑高位稳定的两条威慑度曲线及其威胁差异
vehicle: 贴地缓爬的小蚯蚓与昂首盘踞、随时攻击的凶猛眼镜蛇
ground: 曲线高度对应动物离地姿态；波动形状对应蜿蜒身体；动物危险性对应对敌威慑强度
