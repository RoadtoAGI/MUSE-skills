chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 看着它们那经过两个多世纪中无数只手磨损的表面，程心竟想到了古老城门前深深的车辙印
sensory_mapping: 不锈钢和铜栏杆像城门石路，无数手掌成为车轮，两个世纪来回抓过，磨出发亮深槽。
context_fact: 早期终端站长期使用，失重推进器普及前人员都靠这些栏杆移动，大低谷也未停运。
image_mechanism: 车辙把手掌摩擦扩大为交通碾压，使栏杆不仅陈旧，更像一条由身体通行写下的历史道路。
property_alignment: 手掌对应车轮；栏杆表面对应城门道路；反复抓握对应长期碾压；金属凹痕对应深车辙；旅客流动对应车流。
context_alignment: 程心把终端站看成旧火车站后，车辙联想进一步把太空交通嵌入更古老的地面交通记忆。
narrative_function: 让两个世纪不靠说明数字而以材料磨损显形，并给高技术设施增加人手留下的温度。
transfer_rule: 累积磨损如车辙时，应对应重复动作、接触材料、时间长度、凹痕形态和承载的人流史。
failure_boundary: 栏杆磨损由手而非车轮产生，金属与道路受力不同；联想只说明累积时间和通行痕迹。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 太空终端站栏杆被两百多年无数旅客抓握后形成的深度磨损痕迹
vehicle: 古城门前道路被世代车轮反复碾压，坚硬地面逐渐刻出深车辙，保存漫长通行史
ground: 痕迹由无数次同类动作累积；材料坚硬仍被时间磨损；单次作用微小；最终凹痕记录人流历史
