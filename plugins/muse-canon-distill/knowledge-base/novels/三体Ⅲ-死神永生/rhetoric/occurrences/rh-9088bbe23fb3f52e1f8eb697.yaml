chapter: 【危机纪元元年，生命选项】
figure_type: simile
quote: 有一种冬天阳光照到身上的舒适
sensory_mapping: 背后目光获得低温季节中的光照和体表温差，社会关注变成肩背可感的暖层。
context_fact: 杨冬处于绝望疲惫中，已习惯男性注视且并不反感，这次目光促使她停下交谈。
image_mechanism: 冬天定义整体精神寒冷，阳光则只提供局部、短时暖意；喻体因此既承认注视舒适，又不夸大成激情。
property_alignment: 温和注视对应柔和日照；绝望状态对应冬日寒冷；被关注的舒适对应皮肤受暖；短暂停步对应在阳光处驻足。
context_alignment: 人物已临近自杀，过强爱情意象不合；冬阳的低强度恰能解释她仅恢复一次交流愿望。
narrative_function: 让无言注视成为最后一次人际暖意，启动关键的生命选项对话。
transfer_rule: 写目光温度时，环境季节应对应人物底色情绪，光照强度则对应关系强度；暖意只推动其实际能支撑的小动作。
failure_boundary: 若注视令她警惕或带强烈欲望压迫，冬阳的无侵扰感失效；热恋或狂喜也超过微弱冬暖。
