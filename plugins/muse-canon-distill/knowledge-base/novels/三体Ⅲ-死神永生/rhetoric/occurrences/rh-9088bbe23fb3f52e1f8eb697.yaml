tenor: 杨冬感受到绿眼镜仍在身后注视自己的目光
vehicle: 冬日阳光落在身体上带来的微弱暖意
ground: 刺激温和地覆盖皮肤而不侵扰；在寒冷背景中提供有限却清晰的温暖
