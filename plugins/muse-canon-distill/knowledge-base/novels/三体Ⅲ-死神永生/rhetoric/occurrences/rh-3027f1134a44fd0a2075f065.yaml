chapter: 【掩体纪元11年，光速二号】
figure_type: simile
quote: 那是一个光点，亮亮灭灭，间隔没有规律，像一只随意眨动的眼睛
sensory_mapping: 蓝眼独亮；无序眨动；黑暗凝视；明灭瞳孔；看不见的脸
context_fact: 光点来自五千米外半径仅二十一纳米的黑洞，尘埃坠入才产生间歇辐射。
image_mechanism: 不可见的纳米黑洞只留下一个时亮时灭的点，叙述把物理辐射的随机脉冲读成自主眨眼，于是空城中央出现隐藏主体的凝视。
property_alignment: 辐射点对应眼球；亮起对应睁眼；熄灭对应闭眼；随机脉冲对应随意眨动；空城中心对应目光焦点；黑暗背景对应隐形面孔；幽蓝光对应诡异眼色
context_alignment: 高Way曾坚信黑洞说话并从闪光中读信息，眼睛形象提前把光点塑造成可能交流、可能诱惑他的主体。
narrative_function: 将微观不可见黑洞变成可感威胁，并为高Way的迷恋和“交流”埋下感知伏笔。
transfer_rule: 把间歇光源写成眨眼时，应有单一近圆光点、固定位置、不规则开合节奏和足够黑暗以暗示隐藏观察者。
failure_boundary: 多个灯按固定频率同步闪烁、光源沿轨道移动或形状为长条面光时，眨眼会误读机制与形态。
quality_assessment: exemplary
