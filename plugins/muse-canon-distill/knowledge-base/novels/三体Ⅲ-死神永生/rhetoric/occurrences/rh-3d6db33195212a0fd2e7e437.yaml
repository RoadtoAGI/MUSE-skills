chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 宇宙仿佛被拦腰斩断，长长的断口发出炫目的强光
sensory_mapping: 黑色宇宙像巨躯被一刀横切，近一天文单位长的创口骤然翻亮，星海分在伤口两侧。
context_fact: 四维碎块边界越过魔戒，圆环三维展开并释放巨大能量，形成看不到首尾的发光长线。
image_mechanism: 腰斩把几何分割赋予肉体伤害，亮线因此从中性轨迹变成宇宙尺度伤口，毁灭强度立即可感。
property_alignment: 长线横贯对应拦腰刀口；视野两分对应躯体被截；突发强光对应内部暴露；魔戒毁灭对应致命斩击。
context_alignment: 前文巨笔画线仍偏观察性，此处魔戒真实死亡，制图线转成伤口，语气随事件从奇观升至哀悼。
narrative_function: 以宇宙受伤表现四维文明的终局，把一个遗迹毁灭放大成维度生态的创伤。
transfer_rule: 线状天象如伤口时，应对应分割方向、出现速度、内部亮度和造成该伤口的具体事件。
failure_boundary: 宇宙没有身体或腰部，三维空间也未真的断裂；可见线是降维物质而非空间裂口。
