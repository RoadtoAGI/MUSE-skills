quote: 有的像邪教般恐怖和邪恶
sensory_mapping: 若干安全方案像黑袍教义在会场传阅，以宇宙末日作神谕，要求整个人类献出技术、自由甚至生命。
context_fact: 思潮包括让系统脱离控制并在人类出现不安全行为时启动毁灭机制等极端主张。
image_mechanism: 邪教把理论方案的恐怖从结果前移到组织逻辑：末日叙事、绝对服从和自我伤害彼此强化。
property_alignment: 宇宙毁灭预期对应末日教义；自残要求对应献祭；自动毁灭机制对应不可违逆戒律；群体追随对应信众服从。
context_alignment: 紧随盛宴喻体，邪教菜肴揭示丰富想象并不等于理性或善，部分创意本身会吞噬文明。
narrative_function: 给方案谱系设置伦理下限，提醒读者安全声明讨论已滑向以恐惧合法化极端手段。
transfer_rule: 方案如邪教时，应具体对应末日叙事、权威结构、牺牲要求和对异议或退出的处理。
failure_boundary: 并非所有自残或低技术方案都有宗教组织和领袖，邪教只适用于其中恐惧驱动、强制服从的部分。
