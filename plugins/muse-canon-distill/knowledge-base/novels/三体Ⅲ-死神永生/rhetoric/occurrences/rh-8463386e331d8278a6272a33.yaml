chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 进行“裸移民”，即在移民过程中不能携带任何重型装备和设施
sensory_mapping: 文明的工厂、武器和机器像层层衣甲被扒下，只剩几十亿肉身走向澳大利亚。
context_fact: 智子以去威胁化为由禁止携带重型装备，要求一年内完成移民。
image_mechanism: 裸把设备从财产改写为文明身体的衣甲，剥离装备也就成为解除防护和尊严的动作。
property_alignment: 工业设施对应衣物工具；禁止携带对应强制脱除；失去武装对应身体暴露；依赖占领者对应赤身无防。
context_alignment: 三体以保留生存空间包装命令，赤裸意象揭示获准活着与被彻底去能力同时发生。
narrative_function: 为澳大利亚后续低技术、饥饿和暴力失序建立物质原因。
transfer_rule: 文明去装备写成赤裸时，应说明被脱去的保护层、暴露风险和强制执行者。
failure_boundary: 移民仍可携带生活和医疗用品，并非一无所有；裸字不等于真实裸体或完全去技术。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 人类迁往保留地时被剥夺重型工业、军事和基础设施的迁移方式
vehicle: 人脱去衣物和防护，赤裸身体进入陌生环境，既无工具也无身份屏障
ground: 原有保护层被强制移除；携带物被压到生存最低限度；进入新地后处于暴露和无力状态
