figure_type: analogy
quote: 想想前面的事，真像梦
sensory_mapping: 多年灾难被罩上醒后薄雾，返航舷窗成为醒来的床边，往事退入梦境。
context_fact: 青铜时代号正返回地球，船员感受一G重力并想象英雄生活；另一人反说现在才像梦。
image_mechanism: 第一句把创伤过去梦化，回应则把幸福现在梦化；同一梦框架在时间两端摇摆，显示现实感断裂。
property_alignment: 极端往事对应梦情节离奇；久远记忆对应醒后模糊；当前安稳反差对应梦醒环境。
context_alignment: 他们经历文明断裂又突然收到归航邀请，无法确定哪段生活属于正常现实，双向梦感准确。
narrative_function: 在轻谈中暴露返航者的时间创伤，并预示当前欢迎也可能不真实。
transfer_rule: 人生阶段如梦时，应明确参照的醒态；若对话翻转参照，可用同一喻体展示现实归属不稳定。
failure_boundary: 若经历连续平稳、当前与过去无巨大断层，梦的失真感不足；下一句只为复指翻转，不另立卡。
