chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 好像真的是在提醒人们被遗忘的粮仓
sensory_mapping: 会场中的人脸被她的语气抹成仓门后的粮袋，她只像指了指角落，提醒大家库存一直在身边。
context_fact: 首脑追问断电后粮食来源，智子环视大厅说每个人周围都是活生生的粮食。
image_mechanism: 日常提醒与食人内容的尺度冲突制造冷酷：真正恐怖来自她把伦理禁忌降为库存管理。
property_alignment: 周围人类对应仓储粮食；此前未想到食人对应忘记粮仓；平静回答对应例行提醒；生存竞争对应取粮。
context_alignment: 智子全年以管理和文明措辞包装灭绝，此处最普通的行政口吻抵达最极端结论。
narrative_function: 显示三体计划的非人价值尺度，并让会场从震惊转入死寂。
transfer_rule: 冷酷言论类比日常提醒时，应精准对应资源、疏忽和语气，让反差来自内容伦理。
failure_boundary: 人不是粮仓库存，提醒框架属于智子的去人格化；若说话者明显讥笑，真诚日常感会减弱。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 智子把周围活人称作粮食时平静、实用且仿佛事实显而易见的语气
vehicle: 管理者随口提醒众人还有一座被忘记、可立即取用的普通粮仓
ground: 说话者把对象视为现成资源；提醒口吻不带道德震动；听者此前只是疏忽而非拒绝
