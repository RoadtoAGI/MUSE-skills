chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 二维太阳已经占据了一半的太空，它现在已经完全熄灭，是一片浩渺的暗红色死海
sensory_mapping: 熄灭太阳摊成半边天空的暗红海面，长波从看不见的远方滚来，海上没有一点生命亮光。
context_fact: 二维太阳核心、辐射区和对流区都已熄灭，二维平面开始显出贯穿视野的空间长波。
image_mechanism: 死海延续整段水面模型，又用“死”区分先前沸腾火海；同一太阳由活海冷却成无生命海。
property_alignment: 二维面积对应海面；空间长波对应海浪；暗红对应死水色；恒星熄灭对应无生命；占半天空对应浩渺。
context_alignment: 城市沉入二维海洋后，制造这片海的太阳自身也成为死海，吞没者与被吞没者归于同一状态。
narrative_function: 标出太阳熄灭完成，并为星环号在二维长波与空间畸变中启动曲率引擎建立背景。
transfer_rule: 巨大平面天体比作死海时，应落到面积、波动、色彩、能量状态和前后生命变化。
failure_boundary: 二维太阳不是水体，仍有物质和引力；“死”表示聚变与可见活动终止，不等于绝对静止。
quality_assessment: exemplary
