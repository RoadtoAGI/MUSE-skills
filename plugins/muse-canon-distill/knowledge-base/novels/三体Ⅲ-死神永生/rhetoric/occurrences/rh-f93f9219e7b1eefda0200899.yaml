tenor: 完全熄灭后面积巨大、暗红、带长波起伏却不再产生生命能量的二维太阳
vehicle: 辽阔无边、颜色暗沉、仍有波浪却没有生命活动的死亡海域
ground: 面积浩瀚；表面有波动；色泽暗红；能量与活力消失；边界远不可见；压倒观察视野；具有吞没感
