figure_type: metaphor
quote: 仿佛是不同价值观的宏大展示
sensory_mapping: 旋转基地成为展台，窗框成为陈列框，地球、太阳、银河依次滑过充当价值图板。
context_fact: 法庭审理为星舰生存而攻击同类的案件，地球公众与舰队价值判断冲突。
image_mechanism: 基地旋转真实制造换景，展示框架把景物从背景变成无言论证者：母星伦理、太阳系共同体、宇宙生存逐层放大。
property_alignment: 窗外换景对应展品轮换；地球对应母星伦理；星海对应宇宙生存尺度；审判对应观众评判。
context_alignment: 案件核心正是用哪一尺度判断黑暗战役，宏大窗景使价值冲突获得空间层级。
narrative_function: 在庭审记录前建立无言的多尺度法庭，提醒判决不只属于地面法律。
transfer_rule: 环境成为价值展示时，各景物须能指向文本内明确立场，换景机制还应由现场运动真实提供。
failure_boundary: 若窗外静止单景、案件没有尺度冲突，价值展览会成为抽象附会；景物也不等于立场本身。
