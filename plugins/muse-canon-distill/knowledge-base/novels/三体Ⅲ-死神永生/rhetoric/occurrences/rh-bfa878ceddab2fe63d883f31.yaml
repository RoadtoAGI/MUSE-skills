chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 只有她的和服像一朵云中的小花
sensory_mapping: 白云裹住空中别墅，智子的和服只剩一点花色，在云缝里短暂开放又隐去。
context_fact: 地面朝圣者看不清智子细节，她很少在别墅前出现，每次现身都会引发集体虔诚反应。
image_mechanism: 小花把远距视觉缩点和宗教珍视结合：难见细节不再是信息缺失，而被信徒读成云端神圣显现。
property_alignment: 和服颜色对应花瓣；智子小影对应小花；别墅云雾对应云层；稀少现身对应短暂开放。
context_alignment: 她先被称清泉女人，此刻远观成为云花，自然美意象持续遮盖机器人与毁灭信息之间的冷硬关系。
narrative_function: 从人海全景切到信徒唯一可见焦点，解释微小现身为何足以激起巨大群体波动。
transfer_rule: 远处人物如小花时，应匹配颜色、背景、视觉尺度、出现频率和观看者赋予的情感价值。
failure_boundary: 和服不是花，智子也并不柔弱短命；喻体限于地面远距外观和朝圣者感受。
