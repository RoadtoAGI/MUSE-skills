tenor: 从地面远望时，四百米高云雾别墅前偶尔显现的智子和服身影
vehicle: 一朵体形细小、颜色醒目却被大片白云包围的花，在雾中时隐时现
ground: 目标相对背景极小；颜色与云雾形成区别；位置高远；偶然出现带来珍稀感
