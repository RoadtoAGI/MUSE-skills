chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 所有战士的目光都聚焦在程心身上，像要把她烧毁一样
sensory_mapping: 目光成束；焦点灼热；众眼汇聚；皮肤受烧；一人被照
context_fact: 程心要求维德停止战争准备，面对携带大量反物质子弹、训练高度一致的自卫队。
image_mechanism: 无形视线从每张金属般面孔射出，在程心身上叠成一个热焦点；人数优势被转换成温度和毁伤，使她尚未遭攻击便有身体窒息感。
property_alignment: 目光对应光束；全员注视对应多束汇聚；敌意对应热量；程心对应焦点；心理压迫对应皮肤灼痛；武装力量对应烧毁能力；注意力不移对应持续照射
context_alignment: 实验室机器刚把能量集中到球心，战士目光也对程心完成同类聚焦，科技空间的能量结构转入群体对峙。
narrative_function: 把集体敌意变成物理攻击预感，建立程心以一人承受整个武装集团压力的瞬间。
transfer_rule: 用聚焦灼烧写目光时，应有多人或持续单一视线、明确敌意、一个孤立焦点和人物可感的热压或窒息反应。
failure_boundary: 注视来自好奇赞赏、目光分散游移，或人物处于群体中并未成为唯一焦点时，烧毁会夸大敌意。
quality_assessment: effective
