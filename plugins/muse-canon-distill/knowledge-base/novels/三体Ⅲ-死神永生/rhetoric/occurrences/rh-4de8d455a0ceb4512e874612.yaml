review_status: reviewed
tenor: 全体武装战士因程心可能命令停战而把强烈敌意、压力和注意力集中到她一人身上
vehicle: 多束高能光线共同聚焦一点，以累积热量灼烧并最终摧毁目标
ground: 战士目光对应能量束；多人同时注视对应多束聚焦；敌意对应高热；程心对应焦点目标；压迫窒息对应灼烧；毁灭欲对应烧毁结果
