chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 地球文明之火不会熄灭，但也只能维持一个火苗，像陵墓中的长明灯
sensory_mapping: 四十多亿人的文明大火收缩成墓室里一豆黄焰，周围全是被淘汰者的黑暗与遗骸。
context_fact: 智子预计生存竞争后只剩三千万至五千万人，并称其为文明自由生活的胜利者。
image_mechanism: 长明灯表面兑现不熄承诺，陵墓却反转延续意义：活下来的火苗实际为被灭绝文明守丧。
property_alignment: 文明延续对应火不灭；人口骤减对应仅一火苗；保留地对应封闭墓室；亿万死亡对应陵墓死者。
context_alignment: 会场已被写成坟墓，文明火随即被置入陵墓，三体的生存承诺完成墓葬体系。
narrative_function: 揭穿保存文明措辞中的灭绝实质，并为人类互食设定恐怖终点图像。
transfer_rule: 火种延续若置于墓灯，应同时映射规模、封闭空间、照明对象和死亡背景。
failure_boundary: 长明灯稳定神圣，而幸存社会仍会变化斗争；喻体也不能证明三体会兑现保留承诺。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大屠杀后仅剩数千万人、被限制在保留地延续的地球文明
vehicle: 封闭陵墓中长期不灭却微弱孤立、只为死者守灵的长明灯火
ground: 火种规模被压到极小；在封闭死亡空间中勉强持续；延续主要证明逝者存在而非照亮生活
