chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 童年和少年的记忆，都是灰色的
sensory_mapping: 家庭、学校和孤独片段像旧照片一起褪色，只剩介于黑白之间的冷灰，没有可停驻的亮色。
context_fact: 父母用所谓贵族教育隔开他与同伴，后来又以自己否定的人生选择瓦解了教育权威。
image_mechanism: 单一色调把跨度多年的经历压成情绪滤镜，灰既低于幸福的亮色，又尚未黑到死亡，符合长期钝痛。
property_alignment: 生活乏味对应低饱和；情感阴郁对应低亮度；多年孤独同质化对应统一灰调；记忆疏远对应旧照片褪色。
context_alignment: 此句夹在安乐确认程序中，灰色童年成为按键决定的情感底片，并衬托程心后来带来的阳光。
narrative_function: 用最短色彩判断收束复杂成长史，解释云天明为何与人群疏离、对生存缺少依恋。
transfer_rule: 以颜色概括人生阶段时，应由多个事件共享同一情绪温度；色相、亮度和饱和度要各有心理依据。
failure_boundary: 若阶段中存在大量鲜明幸福记忆，全部灰色会抹平反差；灰只表达主观回忆，不能代替事实全貌。
quality_assessment: effective
