review_status: reviewed
tenor: 云天明对孤独、虚伪家庭教育和同伴隔绝构成的早年生活的整体情感记忆
vehicle: 失去鲜明色彩、低亮度而阴郁的一组灰色画面
ground: 经历缺少温暖和愉悦亮点；不同年份在回忆中被同一沉闷基调覆盖
