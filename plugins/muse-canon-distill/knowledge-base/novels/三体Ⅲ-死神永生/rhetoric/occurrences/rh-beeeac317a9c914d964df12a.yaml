chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 阔大的叶子在风中摇摆，像一群围着他们窃窃私语的巨人
sensory_mapping: 紫树挤在空地边缘，巨叶在头顶相互摩擦，像一圈巨人俯看归来者并交头接耳。
context_fact: 树木刚从穿梭机降落处逃开，根须留下孔洞，蓝星植被已比过去茂密巨大。
image_mechanism: 巨人把植物的尺度、围合位置和叶声统一成人际场景，暗示行走树木像当地居民审视远古访客。
property_alignment: 高树对应巨人；树冠对应头肩；阔叶摆动对应交谈手势；叶声对应窃语；围住空地对应围观。
context_alignment: 过去树林像夜行军队，如今树木又成窃语巨人；蓝星植物从群体移动进一步取得社会性观感。
narrative_function: 用一幅包围性画面显示生态巨变，并让两名跨千万年归来者成为新世界的异客。
transfer_rule: 围合树木比作人群时，应让尺度、位置、声响、动作和观察关系共同成立。
failure_boundary: 树木只有简单或未知触觉，不一定交流或注视；窃语属于风叶声与人物投射。
