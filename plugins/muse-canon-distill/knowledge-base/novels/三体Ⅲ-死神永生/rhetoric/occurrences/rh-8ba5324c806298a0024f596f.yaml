chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 平台上的布置十分简洁，像一张空桌面
sensory_mapping: 黑色平桌；大片留白；中央罩体；下繁上简；等待放物
context_fact: 机器下方管道装置极为复杂，顶部平台却只有中央透明罩和罩内小台。
image_mechanism: 复杂机械在一条水平切面上突然停止，视线获得一块熟悉的空白桌面；这片静止留白把注意力推向即将被放上的微小样品。
property_alignment: 顶平台对应桌板；平直表面对应桌面；无其他装置对应清空；中央位置对应摆物区；下部机器对应桌下支撑；样品操作对应桌面作业
context_alignment: 维德随后把程心头发放上小平台，桌面感使这场高度复杂实验呈现日常摆放动作，也放大样品之小。
narrative_function: 以极简平面切断视觉噪声，为机器结构分层，并引导读者看向透明罩中心。
transfer_rule: 用空桌写设备平台时，应具备明确水平面、周边清空、待放置中心和与下方复杂结构的视觉分界。
failure_boundary: 平台倾斜、表面布满控制器，或不承担承放与操作功能时，空桌会掩盖关键结构。
