chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 新纪元对她仍是一个梦，她的精神固执地生活在过去
sensory_mapping: 新世如梦；精神旧居；昨日展柜；醒而未醒；世纪隔窗
context_fact: 博物馆把程心熟悉的家电、服装和香皂列为两世纪前文物，她却觉得它们昨天仍在身边。
image_mechanism: 历史事实把旧物放进展柜，情感却反向把新纪元装进梦里；身体与精神被分配到两个时代，博物馆成为两处现实的接缝。
property_alignment: 新纪元对应梦；陌生技术对应梦景；旧时代对应精神居所；熟悉文物对应居中日用品；冬眠对应跨时睡眠；缺乏久违感对应从未离家；适应学习对应身体在新地活动
context_alignment: 程心确实靠冬眠从旧时代“醒”到未来，梦与居住因此不是泛泛怀旧，而是她跨时生存方式造成的现实倒置。
narrative_function: 解释旧香皂为何能绕开智子监视并触发解码，也揭示程心融入未来的深层困难。
transfer_rule: 用梦与旧居写时代疏离时，应呈现身体所处时代、情感承认的现实和具体旧物触发之间的错位。
failure_boundary: 人物已把新社会当作稳定归属、旧物只带知识兴趣而无现实错觉时，精神住在过去会夸大怀旧。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心虽已在新纪元生活并学习现代科技，情感上仍把公元时代当作真实日常，对当下缺少现实归属
vehicle: 身体醒来后意识仍停在旧居，而眼前新世界像一场未被承认的梦，随时可能醒回熟悉过去
ground: 新纪元陌生感对应梦境不实；公元物件熟悉对应旧居现实；冬眠苏醒对应梦醒边界；情感滞后对应精神留住；时间跨越对应居所分离；文物如昨日对应梦中时间错位
