chapter: 【危机纪元4年，云天明】
figure_type: analogy
quote: 那时如果有人为四百年后的事操心，就如同替古人担忧一样可笑
sensory_mapping: 未来四百年被沿时间轴翻转到过去，遥远后代的位置通过古人距离变成读者能直觉感受的隔世感。
context_fact: 危机纪元四年，新闻热度下降，云天明想到四百年前仍在明代、蒸汽机尚未出现。
image_mechanism: 时间镜像把不可体验的未来距离折回已有历史知识；列举技术尚未诞生，说明四百年足以改写生活基础。
property_alignment: 当代人与危机末期对应现代人与明代；技术和社会巨大变化对应两端生活不可互换；替后代焦虑对应替古人担忧的代理错位。
context_alignment: 类比来自云天明读报后的自我解释，符合普通人将长期危机让位于现世生活的心理。
narrative_function: 说明人类为何快速适应末日威胁，也为主人公对生死的疏离提供时代尺度。
transfer_rule: 解释遥远未来的心理距离时，可取等长过去区间，并列出两端真实生活差异；时间长度和代际跨度须严格对称。
failure_boundary: 若威胁已在当代产生直接后果或可由个人行动明显改变，替古人担忧的无关感会低估现实责任。
quality_assessment: effective
confidence: 0.96
review_status: reviewed
tenor: 当代人持续为四百年后到来的三体舰队焦虑
vehicle: 现代人替四百年前的古人预支其时代忧患
ground: 担忧者与事件相隔数个世代；当事时代的生活条件和问题框架无法由担忧者切身进入
