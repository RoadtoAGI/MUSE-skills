chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 还有一道最可靠的保险时时伴随着“万有引力”号
sensory_mapping: 两枚水滴像随舰携带的保险契约悬在舷窗外，一旦控制失效，便以毁舰方式立即兑现。
context_fact: 亨特秘密监控广播系统，但相信水滴速度远快于自己，可在五秒内摧毁异常飞船。
image_mechanism: 保险把毁灭性武器反写为安全兜底，准确呈现亨特站在两世界秩序一侧时的价值视角。
property_alignment: 叛乱风险对应保险事故；水滴待命对应保单有效；摧毁飞船对应风险终止赔付；亨特压力减轻对应被保障。
context_alignment: 进入盲区后这道保险失效，亨特肩上责任陡增，喻体能直接解释心理变化。
narrative_function: 交代他此前为何不焦虑，并为水滴攻击偏离导致的恐惧反转建立基线。
transfer_rule: 毁灭措施称保险时，应明确被保对象、触发事故、兜底动作和保险失效条件。
failure_boundary: 水滴不保护船员生命，只保护广播不被劫持；普通保险补偿损失，这里则主动毁灭载体。
