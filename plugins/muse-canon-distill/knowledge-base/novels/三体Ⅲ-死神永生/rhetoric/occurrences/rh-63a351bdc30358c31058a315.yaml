tenor: 水滴会在飞船叛乱或广播系统被非法控制时立即摧毁全舰的外部制约
vehicle: 事故触发后自动赔付或兜底、使主要责任人不必独自承担全部风险的保险机制
ground: 平时保持待命；特定危险出现即介入；为第一层控制失败提供最后后果保障
