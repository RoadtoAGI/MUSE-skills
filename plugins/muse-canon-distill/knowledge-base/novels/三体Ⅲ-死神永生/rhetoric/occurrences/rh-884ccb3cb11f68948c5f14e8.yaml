figure_type: simile
quote: 程心身下的座椅像手掌般把她握住
sensory_mapping: 座椅两侧变成手指，靠背成为掌心，车起飞时机械材料以握持压力包住躯干。
context_fact: 无人飞行车关门后轻盈起飞，带程心穿越立体城市。
image_mechanism: 握住把安全约束写成主动照料，乘员不需操作，未来技术像有触觉地接管身体。
property_alignment: 座椅包裹对应掌心合拢；固定身体对应握持；起飞加速度对应手掌施压保护。
context_alignment: 程心独自乘陌生车辆，手掌式座椅把自动化从冷机器转成可感安全。
narrative_function: 以触觉细节展示未来交通的人体适配，并平滑进入飞行视角。
transfer_rule: 承托装置如手时，应写出包合轮廓、施力方向和保护功能；固定带勒紧不等同温柔握持。
failure_boundary: 座椅平坦无侧向支撑、压力造成伤害或乘员仍被甩动时，手掌握持失效。
