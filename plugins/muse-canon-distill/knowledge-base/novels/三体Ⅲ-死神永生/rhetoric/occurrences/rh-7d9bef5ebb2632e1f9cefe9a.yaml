chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 一种清脆尖锐的碎裂声，仿佛建筑群和太空城本体都是玲珑剔透的玻璃制品，一个巨型碾滚正在轧过这个玻璃城
sensory_mapping: 看不见的巨碾沿水线推进，玻璃楼群在轮下成片爆出细密尖响，整座城像透明器皿碎掉。
context_fact: 三维物质没有真的破碎成碎片，而是按不重叠规则投射到二维，空气让转化声得以传播。
image_mechanism: 玻璃将声音的高频质感、城市的精巧和结构脆性绑在一起；巨碾为平面推进补上暴力施力者。
property_alignment: 尖锐声对应玻璃裂响；玲珑建筑对应玻璃工艺；二维界面对应碾轮前缘；连续坍缩对应滚压；不可逆对应粉碎。
context_alignment: 掩体世界曾被称为天堂，此刻其精美反而像玻璃制品般成为脆弱性的证据。
narrative_function: 给原本无声的几何过程加入触觉和听觉暴力，让远程观看者感到整城正在被实体碾碎。
transfer_rule: 声音触发材质比喻时，应让音色、结构外观、破坏方式、施力方向和情绪效果共同吻合。
failure_boundary: 建筑材质并非玻璃，也没有实体碾轮或常规碎片；玻璃城仅解释声响与整体脆裂感。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 空气尚存的太空城中，三维建筑和城体连续跌入二维时发出的尖锐碎裂声
vehicle: 巨大碾轮压过整座由精细玻璃构成的城市，使无数透明构件同时崩裂
ground: 声音清脆尖锐；结构大面积破坏；碎裂连续扩展；精密物件显得脆弱；碾压力量不可抵抗；毁坏彻底
