chapter: 地球文明
figure_type: metaphor
quote: 在这文明的尽头，他们也只能做远古的婴儿时代做过的事
sensory_mapping: 文明跑到白发苍苍的终点，手里最可靠的工具却仍是婴儿最早握住的石块。
context_fact: 罗辑宣布唯一可行方案是把字刻在石头上，洞壁从象形、楔形文字一路刻到现代文明。
image_mechanism: 把文明史压成人生周期，婴儿时代与尽头并置，让技术退化呈现为生命首尾闭环。
property_alignment: 远古对应婴儿；文明发展对应成长；末日对应生命尽头；石刻对应最初动作；技术失效对应能力退回。
context_alignment: 两百岁的罗辑本人以老人姿态讲述文明婴儿动作，个体衰老与物种衰亡相互映照。
narrative_function: 为独立成行的“把字刻在石头上”提供历史与生命双重回声。
transfer_rule: 把文明阶段映射为人生时，应落实出生、成长、衰老和末端动作之间的顺序对应。
failure_boundary: 文明并非生物个体，采用旧技术也不等于知识或能力整体退化；回归只针对耐久存储手段。
quality_assessment: exemplary
