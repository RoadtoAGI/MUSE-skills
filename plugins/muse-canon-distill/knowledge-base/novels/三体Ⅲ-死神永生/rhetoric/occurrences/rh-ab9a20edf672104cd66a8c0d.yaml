tenor: 高度发达的人类文明在末日前最终采用远古祖先的石刻保存信息
vehicle: 走到生命末期的老人退回婴儿最初学会的简单动作
ground: 生命阶段首尾相接；晚期能力本应更强；最终动作极原始；成长成果在终点失效；形成循环
