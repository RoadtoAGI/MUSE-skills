chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 它的叫声立刻被无边的黑暗吞没，它自己也在前所未有的恐惧中沉默了，缩到角落不住地颤抖着，与黑暗融为一体
sensory_mapping: 黑夜像张开无边巨口，先咽掉犬吠，再把角落里的狼犬一点点溶进黑色腹内。
context_fact: 王后刚被画像消除，狼犬似乎感到异常，却无法发出有效警报。
image_mechanism: 吞没与融为一体构成连续捕食过程，黑暗从照明缺失变成协助政变压制见证者的介质。
property_alignment: 夜色对应巨口或黑液；犬吠消散对应被吞；缩入角落对应进入腹内；轮廓消失对应溶解。
context_alignment: 地堡先被写成巨怪腹腔，王宫黑暗现在也执行吞咽，两个地点被同一吞噬机制连接。
narrative_function: 用唯一动物反应标记超自然死亡，同时强调阴谋发生得无声、无人可救。
transfer_rule: 黑暗写成吞噬者时，应按声音消失、身体包围、轮廓融合和情境因果分步展开。
failure_boundary: 黑暗本身不吸收声波或产生意志，狼犬沉默也源于恐惧；吞噬只组织感知过程。
