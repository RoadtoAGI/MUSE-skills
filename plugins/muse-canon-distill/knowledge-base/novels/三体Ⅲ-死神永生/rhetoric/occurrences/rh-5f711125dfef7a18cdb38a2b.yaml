tenor: 蓝色空间号在公众宗教叙事中从救人英雄被重新定义为带来毁灭的邪恶对象
vehicle: 原被视为天使的载体卸下圣光，变成属于黑暗与魔鬼、传播诅咒的船
ground: 同一对象的道德符号彻底反转；光明救赎转为黑暗毁灭；事实未变而命名改变；群体寻求罪人
