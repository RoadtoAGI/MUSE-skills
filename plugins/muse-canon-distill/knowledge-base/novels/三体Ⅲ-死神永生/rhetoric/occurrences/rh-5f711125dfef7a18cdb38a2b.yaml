chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这艘飞船由拯救天使再次变成黑暗之船、魔鬼之船
sensory_mapping: 战舰外壳上的天使白光被舆论抹黑，船帆像染成暗色，广播天线被想象成撒旦诅咒器。
context_fact: 广播曾使三体撤离救下移民，也暴露两世界坐标；公众现在希望三体舰队追杀两舰。
image_mechanism: 天使与魔鬼共用宗教垂直轴，使评价翻转成为换阵营而非重新分析同一行为的双重后果。
property_alignment: 救援结果对应天使；坐标毁灭对应魔鬼；公众改称对应变身；追杀请愿对应驱魔。
context_alignment: 三体自身刚从魔鬼变天使，蓝色空间号则同步从天使变魔鬼，两条反向神化轨迹暴露立场交换。
narrative_function: 集中呈现宗教狂潮如何重写历史，并把深空人类正式推出地球道德共同体。
transfer_rule: 对象在神魔轴上翻转时，应保持事实对象不变，逐项展示评价者利益、命名和追随行动如何改变。
failure_boundary: 飞船没有超自然善恶本体，广播既救人也致险；任何单一神魔标签都压扁了因果。
