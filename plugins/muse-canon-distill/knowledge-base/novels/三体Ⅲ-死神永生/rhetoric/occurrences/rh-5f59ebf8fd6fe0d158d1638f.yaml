chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 上方的星空却丝毫没有立体感，像挂在夜空中的一幅巨画
sensory_mapping: 村庄和山仍向远处退去，头顶星空却像一张巨大画布垂直挂起，所有旋涡都贴在同一平面。
context_fact: 程心两次观看原画都有这种奇怪感受，如今二维太阳系与画面几乎完美重叠。
image_mechanism: 挂画把画中局部的反透视异常具体化，并预言真实星空最终也会变成无厚度巨画。
property_alignment: 无立体感对应平画；星空区域对应画布；旋涡星体对应图案；下方透视景物对应真实观看空间；悬挂对应覆盖头顶。
context_alignment: 博物馆保存《星空》，宇宙随后成为《星空》；画中平面不是风格偶然，而成了末日视觉模型。
narrative_function: 完成程心对凡·高作品的迟到理解，并把艺术预感与降维结果锁定为同一构图。
transfer_rule: 画中空间比作挂画时，应利用画面内部不同区域的透视差，并让后续现实景象验证这种差异。
failure_boundary: 整幅作品本来就在物理画布上，所谓“挂在夜空”描述画内构图，不证明凡·高预知降维。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 凡·高《星空》中缺乏透视纵深、与树木村庄山脉形成反差的上部天空
vehicle: 一幅平坦巨画被悬挂在真实夜空位置，以图像代替后方无限空间
ground: 平面无纵深；边界内图案密集；占据广阔视野；与下方立体景物并置；看似覆盖真实背景；供人观看
