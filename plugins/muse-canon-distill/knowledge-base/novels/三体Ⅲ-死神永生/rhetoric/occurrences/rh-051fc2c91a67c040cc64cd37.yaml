chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 声音在这诡异的寂静中如利剑般锋利
sensory_mapping: 无声环境成为剑鞘，上校话音拔刃而出，温暖微笑与归乡期待被锋口同时切开。
context_fact: 人海欢呼突然静音，上校仍微笑，却宣布返航者将面临审判。
image_mechanism: 寂静放大声线锐度，利剑又把语义转折变成一次不可撤回的切割，笑与声发生温度冲突。
property_alignment: 冷硬声线对应金属刃；寂静衬托对应空背景显锋；逮捕宣告对应一刀切断欢迎。
context_alignment: 返乡者刚感受母星拥抱，锋利声音立即刺穿安全幻觉，完成诱捕翻转。
narrative_function: 用一句听觉切口从庆典骤转审判，使背叛感先于武装显现。
transfer_rule: 声音如刃需同时有清晰边缘、冷硬音质和切断关系的语义后果；安静背景可提供显锋条件。
failure_boundary: 声音含混柔弱、宣告可协商或气氛逐渐变化时，利剑的一击切断会过度。
