chapter: 【危机纪元5-7年，阶梯计划】
figure_type: simile
quote: 像微型瀑布般淌下
sensory_mapping: 气态白雾获得水流密度和瀑布边线，工作台成为微型悬崖，地面上方像水花蒸失。
context_fact: 云天明大脑封在超低温容器中，液氦白雾因低温贴壁缓流。
image_mechanism: 气体本来无固定轮廓，容器和台边把它导成可见流路；瀑布让低温气体的重质下沉一眼可读。
property_alignment: 贴壁下流对应水沿崖面；台边淌下对应瀑布越沿；白色雾帘对应水帘；下方消失对应水雾散开。
context_alignment: 微型尺度与装着单个大脑的技术台相称，冷静物理细节反衬程心即将爆发的巨大悲伤。
narrative_function: 精确呈现低温容器的视觉中心，并用向下运动引导程心扑近。
transfer_rule: 雾流借瀑布写时，应有重力下沉、明确边缘和连续帘面；尺度词需与载体大小一致。
failure_boundary: 雾若上升、散团漂浮或无台边跌落，瀑布的下坠流路不成立。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 液氦产生、贴着绝热容器与工作台边缘下流的低温白雾
vehicle: 越过台面边沿、形成连续白流向下坠落的小瀑布
ground: 流体受重力沿表面下行并越过边缘；整体呈白色连续帘状，底部逐渐消散
