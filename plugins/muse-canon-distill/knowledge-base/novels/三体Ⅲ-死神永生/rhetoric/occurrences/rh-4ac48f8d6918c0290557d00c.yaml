chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: 她两次处于仅次于上帝的位置上
sensory_mapping: 执剑按钮和星环城命令两次把程心托到近神高度，整个世界的生死都像落在她下一次手势里。
context_fact: 她作为执剑人放弃威慑，又命令维德停止曲率研究，两次选择事后都与文明灾难相连。
image_mechanism: 上帝位置将制度授权的规模垂直化，权力越高，事后责任就越像神级审判般压回个人。
property_alignment: 最终决策权对应神权；全人类后果对应世界创造毁灭；无人替代对应至高位置；两次时刻对应两次登位。
context_alignment: AA刚用倒立举地球反驳她的全责感，文本随即采用“仅次上帝”呈现程心自己无法摆脱的另一尺度。
narrative_function: 说明她为何不能像普通幸存者一样卸下责任，并为下一句推世界入深渊建立施力高度。
transfer_rule: 权力比作近神位置时，应量出权限范围、制衡程度、决策不可逆性和责任回返。
failure_boundary: 程心不是全知全能，掌握的信息和选项都有限；近神只指权力后果规模。
