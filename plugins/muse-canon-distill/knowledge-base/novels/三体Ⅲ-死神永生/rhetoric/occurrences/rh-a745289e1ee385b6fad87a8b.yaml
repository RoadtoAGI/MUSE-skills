image_mechanism: 童话主体像雕像一样清晰精美，唯独最可能握住秘密的‘双臂’被截去；人们可沿断口想象无数姿势，却没有一块残片能让它复原。
property_alignment: 童话整体对应维纳斯躯干；画像机制对应缺失双臂；文本美感对应雕塑典雅；解释线索断裂对应臂部断口；专家方案对应复原姿势；永远谜团对应原貌不可证
context_alignment: 断臂并未毁掉艺术价值，恰如未解隐喻仍以冷酷美构成故事基础，兼具遗憾与尊严。
narrative_function: 承认解码边界，为最关键秘密保留开放状态而不贬低童话设计。
transfer_rule: 用断臂艺术品写信息缺失时，应保留主体完整与美感，明确缺口位置、复原诱惑和证据不可得。
