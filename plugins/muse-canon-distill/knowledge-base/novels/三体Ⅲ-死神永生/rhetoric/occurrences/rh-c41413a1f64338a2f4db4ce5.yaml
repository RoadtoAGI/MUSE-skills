chapter: 【掩体纪元11年，掩体世界】
figure_type: analogy
quote: 太空城群落像是河水中一队静静地悬浮在岩石后面避开激流的鱼群
sensory_mapping: 河中巨石；石后静水；悬浮鱼群；外侧激流；整队藏身
context_fact: 城市并非木星卫星，而与木星平行绕日运行，持续用推进器保持在行星背阳面。
image_mechanism: 太阳系被缩成河道，木星以巨大身躯劈开灾难洪流；人造城市像鱼贴在尾流静区，不落底也不靠岸，只靠持续摆动保持位置。
property_alignment: 木星对应岩石；恒星爆发对应激流；行星阴影对应静水尾区；太空城对应鱼；推进器对应鱼鳍；位置维持对应悬停；四列纵队对应鱼群队形；离开阴影对应被水冲击
context_alignment: 这是掩体计划的核心机制，鱼群的主动悬停比静态躲墙更准确表现城市必须持续耗能维位。
narrative_function: 一幅图解释木星掩护、城市排列和推进器位置维持三者关系。
transfer_rule: 用石后鱼群写动态掩护时，应对应来流方向、遮挡体、尾流安全区、主体主动悬停和脱离后的风险。
failure_boundary: 城市受木星引力束缚为稳定卫星、无需推进器，或威胁从各方向同时到来时，石后避流模型会失效。
