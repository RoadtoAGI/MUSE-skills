tenor: 小宇宙中刚显现的黑土地、白房子和树木构成的安静田园环境
vehicle: 亲近者张开双臂迎接归来者，提供包围、接纳、温暖与保护
ground: 空间敞开；姿态迎接；可进入其中；带来安全；与此前恐惧相反；承诺暂时安居
