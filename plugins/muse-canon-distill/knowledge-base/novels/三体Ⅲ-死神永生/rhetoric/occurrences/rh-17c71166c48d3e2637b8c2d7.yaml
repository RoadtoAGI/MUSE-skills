chapter: 【时间之外，我们的宇宙】
figure_type: simile
quote: 这片幽静的田园像对他们张开的怀抱
sensory_mapping: 房屋与田地在晨光中向两侧展开，像一双等候已久的手臂把逃亡者迎进中心。
context_fact: 二人刚从低光速黑域进入未知门内，小宇宙为他们准备了可生活的人工田园。
image_mechanism: 把景观的空间展开人格化为拥抱，让可居住性直接转成身体被接住的触觉安全。
property_alignment: 田园展开对应双臂张开；进入环境对应进入怀抱；房屋庇护对应身体保护；幽静对应安抚；迎接对象对应两名来客。
context_alignment: 他们刚失去蓝星与旧宇宙时间，拥抱意象承接二人一路相互依偎的身体主题。
narrative_function: 为小宇宙建立伊甸式第一印象，并为之后主动拆除这片安居之所积累情感重量。
transfer_rule: 景观写成怀抱时，应让构图形成围合、人物有进入动作，并交代它提供的具体庇护。
failure_boundary: 田园由三体技术预设，没有人的真实情感或主动欢迎；温暖来自程心的投射。
quality_assessment: effective
