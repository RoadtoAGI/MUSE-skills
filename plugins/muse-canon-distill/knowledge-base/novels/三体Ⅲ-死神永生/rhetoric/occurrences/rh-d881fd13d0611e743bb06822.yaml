chapter: 【威慑后六十天，失落的世界】
figure_type: metaphor
quote: 人类世界的前途再次陷入一片黑暗之中
sensory_mapping: 通往未来的道路突然熄灯，第二舰队藏在前方暗处，人类只能摸索下一步。
context_fact: 新航迹证明三体再次派舰，但人类最初仍以为入侵远在几百年后。
image_mechanism: 前途空间化为道路，黑暗同时表示未知和威胁，社会却因距离遥远暂不把它与自身连接。
property_alignment: 未知抵达时间对应看不清前路；舰队威胁对应暗处危险；失去威慑对应光源熄灭。
context_alignment: 黑暗森林威慑刚终止，黑暗从宇宙法则回落到人类未来，使失去的那一点秩序光更加具体。
narrative_function: 概括危机情绪并反衬当代人仍把黑暗当成与自己无关的远景。
transfer_rule: 以前路黑暗写未来时，要绑定可见性、方向和潜伏危险，并安排人物对黑暗的实际反应。
failure_boundary: 未来仍可通过航迹和速度计算部分预测，黑暗不是完全无知；若路径和结果确定，则用词会过泛。
