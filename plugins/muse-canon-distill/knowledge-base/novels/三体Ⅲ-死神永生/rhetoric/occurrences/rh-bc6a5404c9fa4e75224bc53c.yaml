chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 形成了一股五万千米粗的烈焰喷泉
sensory_mapping: 裂孔像泉眼，千万度恒星物质化成白炽柱流冲出太阳，部分弧形落回，部分直射行星轨道。
context_fact: 压力从裂孔释放，喷出物质有的受引力落回恒星，有的达到逃逸速度进入太空。
image_mechanism: 喷泉以流体动力组织喷出、上升、回落和逃逸四种运动，烈焰则保留物质的高温发光属性。
property_alignment: 恒星裂孔对应泉口；高压物质对应水柱；引力回落对应泉水落下；逃逸部分对应高喷流散出。
context_alignment: 炉门解释辐射直出，喷泉随后解释物质外流，两种喻体分别覆盖打击后的光与物质杀伤。
narrative_function: 把恒星爆发的复杂流体运动画成连续动态，并为火树形态建立树干般的喷流主体。
transfer_rule: 喷流如喷泉时，应匹配出口、压力、柱流、回落和逸散比例，同时保留介质差异。
failure_boundary: 喷出物是等离子体而非水，且尺度、温度和速度远超喷泉；水景不能弱化致命能量。
