chapter: 【广播纪元7年，程心】
figure_type: simile
quote: “蓝色空间”号和“万有引力”号成为神话般的拯救之船
sensory_mapping: 两艘看不见的深空战舰被公众想象成穿过黑暗降临的光船，载着英雄从灭世洪水上方驶过。
context_fact: 广播使水滴撤离、澳大利亚移民回乡，六年后公众把两舰成员奉为超级英雄并推翻旧有谋杀指控。
image_mechanism: 神话般把复杂的劫舰、四维伏击和文明级威慑压缩成救援母题，历史灰度被崇拜叙事镀上超常光环。
property_alignment: 人类绝境对应神话灾难；启动广播对应神力救援；遥远航行对应神船来去；全民崇拜对应传说受祭颂。
context_alignment: 叙述同时指出崇拜者借英雄想象美化自己，神话色彩因此既传达感恩，也暗含社会选择性记忆。
narrative_function: 概括广播后舆论翻转，并为紧随其后的治安军报复揭示英雄神话的排他代价。
transfer_rule: 现实事件被写成神话时，应列出被放大的救援事实、被省略的复杂过程以及接受神话的群体需要。
failure_boundary: 两舰成员有谋杀、公决和生存抉择的真实历史，并非无瑕神祇；神话般描述公众形象，不是叙述者认证。
