figure_type: metaphor
quote: 这声浪随着无数堆营火的烟雾和火星升上天空，变成一片浓重的杀气聚集在城市上空
sensory_mapping: 声音获得烟雾的上升路径和浓度，火星为其点亮颗粒，听觉威胁最终压成城市上空可见暗层。
context_fact: 苏丹宣布破城后三日洗劫，奥斯曼全军在营火间欢呼，次日将发动总攻。
image_mechanism: 声浪先与真实烟火同向升起，再发生物态变化，成为停在城顶的杀意；远处喧哗因此获得逼近前的蓄积形态。
property_alignment: 各营欢呼对应多股烟气；军心汇聚对应烟雾聚成一片；攻城杀意对应浓重有压迫感的云层；次日总攻对应云层待落。
context_alignment: 城外狂欢与城内安魂弥撒构成听觉对照，杀气云把前者的胜利欲具体压到守城者头顶。
narrative_function: 将分散敌声合成为整体威胁，为大战前突然寂静积蓄势能。
transfer_rule: 跨感官聚合时，可借场内真实介质提供运动路线；声音、烟与情绪必须同源同向，变化终点还要对应下一步行动。
failure_boundary: 欢呼若来自庆典而无杀戮许诺，或烟雾被风吹散远离城市，浓重杀气的聚集方向就不成立。
