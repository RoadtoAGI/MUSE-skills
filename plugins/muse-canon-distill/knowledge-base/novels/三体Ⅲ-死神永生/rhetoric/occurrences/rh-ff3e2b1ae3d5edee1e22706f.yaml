chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 三号世界的人把它叫光幕，帷幕的幕，后来是外面的人把它叫光墓了，他们把它看做坟墓。不过人各有志，对三号世界的人来说那里是安乐的天堂
sensory_mapping: 慢光速球壳在内侧是遮住危险的帷幕，在外侧像封死世界的墓门，对自愿留下者却可能是安乐天堂。
context_fact: 三号世界认为坐标已暴露，主动用曲率航迹建立黑域，自此不再传出任何信息。
image_mechanism: 三个名称不争论物理形状，而争夺同一封闭的价值解释；称呼由观察位置和自由—安全偏好决定。
property_alignment: 黑域边界对应帷幕；信息隔绝对应遮蔽；无法离开对应墓穴；免受打击对应天堂安全；内外人群对应不同命名者。
context_alignment: 太阳系没能建黑域而毁灭，幸存银河人类却把成功黑域同时称墓与天堂，安全路线的代价得到实体样本。
narrative_function: 以命名对照解释黑域伦理争议，也显示人类分化后生活价值不再统一。
transfer_rule: 同一系统用相反喻体命名时，应标清观察位置、共享物理属性、各自重视的价值和不可消除代价。
failure_boundary: 无法验证三号世界内部是否安乐或仍有人存活；帷幕、坟墓、天堂都是立场性命名。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 低光速黑域包住三号世界后隔绝外部通信、提供安全却永久限制离开的状态
vehicle: 可遮蔽内外的帷幕、埋葬死者的坟墓，以及与外界苦难隔绝的安乐天堂
ground: 形成封闭边界；外部不可见内部；进入后无法返回；安全与囚禁并存；内部外部评价相反；信息永远断绝
