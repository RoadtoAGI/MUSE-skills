chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那些幽灵般的异类宇宙飞船可能就从太阳附近穿过
sensory_mapping: 太阳附近看似空旷，陌生飞船像透明幽灵从行星间掠过，只在发射光粒时短暂留下痕迹。
context_fact: 三体打击的光粒来自无恒星区域中的宇宙飞行器，人类对这类飞行器的分布一无所知。
image_mechanism: 幽灵把观测缺失转成隐身存在，近距离可能性因无法看见而比遥远恒星打击源更令人恐惧。
property_alignment: 未知飞船对应幽灵；缺少观测对应隐形；太阳附近掠过对应贴身游荡；突发打击对应幽灵骤现。
context_alignment: 旧模型把威胁固定在遥远恒星，新模型让移动发射源潜伏身边，幽灵恰好表现坐标不确定带来的贴近感。
narrative_function: 将黑暗森林模型从静态星图转成移动伏击空间，迅速扩大太阳系面对的未知来源。
transfer_rule: 隐蔽移动体如幽灵时，应具体说明缺失的观测维度、可能近距、留下的唯一痕迹和主体的不安来源。
failure_boundary: 飞船具有物质实体并服从航行规律，不会穿墙或超自然消失；幽灵只说明人类侦测不到。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 无法被人类掌握位置、数量与航向，却可能在近处发射黑暗森林打击的外星飞行器
vehicle: 幽灵无声隐形地游荡，能突然出现在身边，普通人无法追踪其来去和实体位置
ground: 行踪不可见；存在难以证实；可能距离很近；出现和离开不留可追踪线索；给人持续不安
