chapter: 【广播纪元7年，云天明的童话】
figure_type: analogy
quote: 他对世界的色彩和形状，就像我们对烧红的烙铁一样敏感
sensory_mapping: 每条轮廓和色斑都像红铁逼近皮肤，针眼无需端详便被视觉刺激灼中。
context_fact: 王子向国王证明年轻画师能力，随后针眼只需极短注视便能精确复现并使人物消失。
image_mechanism: 把精细视觉换成危险热触觉，烙铁的即时性与不可忽视性说明敏锐程度而非审美修养。
property_alignment: 色形出现对应烙铁接近；视觉辨别对应热痛感知；快速记忆对应本能反应；高敏锐度对应灼热强度。
context_alignment: 烙铁暗含伤害，提前暴露这份绘画天赋将成为杀人武器，而王子表面只在赞艺。
narrative_function: 用人人熟悉的痛觉刻度证明超常观察力，并给魔画机制提供可信感官基础。
transfer_rule: 感知敏锐度借危险触觉标定时，应匹配反应速度、刺激强度、不可忽略性和后续用途。
failure_boundary: 色彩形状不会灼伤针眼，他也未表现痛苦；烙铁只度量敏感与即时反应。
