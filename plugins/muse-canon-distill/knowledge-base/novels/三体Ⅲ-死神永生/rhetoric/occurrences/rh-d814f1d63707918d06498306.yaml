tenor: 针眼画师对视觉形状和色彩极端迅速、强烈且无法忽略的感受力
vehicle: 皮肤面对烧红烙铁时立即感知高热和伤害、无法迟钝的触觉反应
ground: 刺激一出现便被捕捉；感受强度高；无法忽略细微接近；反应近乎本能
