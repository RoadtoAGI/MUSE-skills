review_status: reviewed
tenor: 三体世界拒绝按程心预设的长期渐进威慑博弈，直接发动水滴摧毁全部广播能力
vehicle: 棋手不再遵守轮流走子和棋路规则，抄起承载规则的棋盘当武器猛砸对手
ground: 一方预期在共同规则内回应，另一方却取消规则层并直接攻击博弈主体；所有精细预案因此失效
