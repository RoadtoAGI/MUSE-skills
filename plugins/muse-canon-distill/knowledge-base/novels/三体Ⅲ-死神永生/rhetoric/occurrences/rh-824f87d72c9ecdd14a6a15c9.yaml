chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: analogy
quote: 对方没有移动一枚棋子，而是抓起棋盘向她劈头盖脸砸过来
sensory_mapping: 程心准备的开局与应手排列在棋盘上，三体没有触碰棋子，整块棋盘突然翻起，格线和棋子一齐砸向她。
context_fact: 程心把执剑生涯设想成可用一生下完的棋局，三体却在交接瞬间启动六个水滴直取发射台。
image_mechanism: 抓棋盘不是更强一着，而是从规则内竞争跃迁为摧毁规则载体，精确解释她所有棋路准备为何毫无用处。
property_alignment: 威慑策略对应棋路；长期互动对应轮流走子；水滴突袭对应举盘攻击；摧毁发射台对应砸毁棋盘；程心措手不及对应被迎面击打。
context_alignment: 维德曾把挡道人当棋子清除，三体此刻把整套威慑棋局武器化，显示不择手段者与规则守护者的差距。
narrative_function: 以动作喜剧般的暴烈反差揭示程心认知错误，使战略失败在一幅图中完全可懂。
transfer_rule: 博弈越界可写成攻击棋盘，但需明确原规则、规则载体、越界动作和被取消的预案；不是普通意外走法。
failure_boundary: 若对手仍在规则内采取激进策略，抓盘砸人会夸大越界；三体行动仍基于威慑结构判断，并非毫无博弈。
quality_assessment: exemplary
