chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 一种恐怖的不确定性将永远播撒到太空中
sensory_mapping: 一艘艘飞船变成暗色种子，从太阳系抛向各个方向，消失后仍可能在远处长出广播灾难。
context_fact: 人类担心引力波飞船被迫远航后成为新的星舰文明，并独立掌握宇宙广播。
image_mechanism: 播撒强调风险不是停留在一件武器上，而是随多个移动载体扩散并获得未来繁殖性。
property_alignment: 分散飞船对应散种；不可追踪航向对应未知落点；未来广播风险对应种子萌发；无法返航对应难以回收。
context_alignment: 太空的辽阔像无边土地，正好放大建造者对永久失控和迟发后果的恐惧。
narrative_function: 把技术方案的优势反转为政治噩梦，解释为何安全冗余未被采用。
transfer_rule: 风险扩散如播种时，应设置载体、散布路径、潜伏期和可能结果，使未来性来自机制。
failure_boundary: 风险不会自行生物繁殖，是否广播仍由船员决定；永远是恐惧中的夸张时长。
