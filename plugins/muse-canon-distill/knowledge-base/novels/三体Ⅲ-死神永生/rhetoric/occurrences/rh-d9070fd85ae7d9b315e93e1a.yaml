tenor: 多艘携带广播能力的逃亡飞船把不可预测战略威胁分散到深空
vehicle: 种子被向广阔土地四处撒出，落点失控并可能在未来萌发
ground: 载体分散到多个远方位置；释放后难以回收；潜在后果会在未知时间和地点生长
