chapter: 地球文明
figure_type: simile
quote: 表情形体动作都很生动，多少有些亚当和夏娃的样子
sensory_mapping: 石壁第一对男女不再像说明书图标，他们带表情站在那里，仿佛人类创世故事刚从岩面开始。
context_fact: 浮雕既想向未来发现者展示人类外观，又比旅行者金属牌上的呆板图形更生动。
image_mechanism: 亚当夏娃典故把生物学样本提升为物种起源人物，使墓碑开头同时成为文明的创世开头。
property_alignment: 男女对像对应始祖二人；展示人体对应原型身体；洞壁开端对应创世起点；生动动作对应活人而非标本。
context_alignment: 整条石刻从人类婴儿时代写到文明尽头，始祖形象让墓志从出生开始，形成完整生命弧。
narrative_function: 缓和说明图的技术感，使未来未知读者先遇见具体、可辨而有生命的人类形象。
transfer_rule: 人物组合借创世原型时，应对齐性别、位置、代表功能、身体呈现和全篇生命周期。
failure_boundary: 浮雕未必直接描绘宗教人物，也不证明单一起源叙事；相似来自构图和文化联想。
