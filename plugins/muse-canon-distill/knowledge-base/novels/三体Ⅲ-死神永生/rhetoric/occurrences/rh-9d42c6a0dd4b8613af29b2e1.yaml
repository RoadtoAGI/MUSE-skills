tenor: 文明石刻开端那对用于展示人类生物外观、表情和动作生动的男女浮雕
vehicle: 创世叙事中作为全人类最初男女、以裸体原型代表人类的亚当和夏娃
ground: 一男一女成对；承担人类原型；位于叙事开端；身体外观用于代表物种；带有生命与起源意味
