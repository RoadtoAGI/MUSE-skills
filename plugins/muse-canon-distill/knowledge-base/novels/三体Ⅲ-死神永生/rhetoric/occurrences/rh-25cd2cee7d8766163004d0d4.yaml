chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 仿佛他们上一次的蓝星之旅发生在另一个时空中的另一颗星球
sensory_mapping: 核验屏幕指向同一坐标，舷外景物却把上一段旅行推到另一颗星球，连绵山峰像被时空切走。
context_fact: 两次着陆相隔一千六百多万年，蓝星生态和地质发生大幅变化。
image_mechanism: 另时空、另星球把时间导致的陌生化拆成两个最强空间断裂，让数字跨度转成经验上的世界更换。
property_alignment: 千万年间隔对应另一时空；地貌剧变对应另一星球；无遗迹对应无共同历史；同坐标矛盾对应世界错置。
context_alignment: 人物刚从低光速区跨出，自身只经历短时而宇宙已老去，时空错位是此刻最贴身的知觉模型。
narrative_function: 把重返故地写成异星初访，强化低光速时间跳跃的情感后果。
transfer_rule: 故地陌生感借平行时空表达时，需先固定同一地点，再提供足以否认同一性的成组感官差异。
failure_boundary: 两次旅行确在同一蓝星连续时间线上；另时空与另星球只刻画主观断裂。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 同一蓝星地点在千万年演化后与程心、关一帆的旧日经验失去一切可见联系
vehicle: 发生在另一个时空、另一颗星球上的互不相干旅行
ground: 空间坐标仿佛断裂；时间跨度巨大；地貌完全异质；旧事件无现场证据；记忆与现实无法互证
