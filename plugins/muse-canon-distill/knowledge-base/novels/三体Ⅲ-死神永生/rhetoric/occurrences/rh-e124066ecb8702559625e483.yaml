tenor: 许多战士连续把金属弹链放上平台时，大量弹壳相互碰撞形成密集而持续的哗响
vehicle: 一阵雨点密集落在硬表面，许多细小撞击叠成连续均匀的哗哗声
ground: 单颗弹壳碰撞对应雨滴落下；多人连续放链对应持续降雨；密集金属声对应雨声叠加；平台对应承雨地面；声响渐止对应雨停；解除武装对应暴风过去
