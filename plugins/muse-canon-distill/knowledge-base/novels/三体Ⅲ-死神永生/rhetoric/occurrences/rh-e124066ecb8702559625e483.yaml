figure_type: simile
quote: 弹链放下时发出的下雨一般的哗哗声
sensory_mapping: 金属雨声；密点落台；哗响连片；声势渐停；寂静雨后
context_fact: 战士依次走来放下弹链，平台很快堆满黄铜子弹，最后所有人卸弹后声音停止。
image_mechanism: 每次轻放仍释放一串小撞击，数百颗金属弹汇成雨幕；当最后一链落定，突然的停声像雨云移走，标记武装解除完成。
property_alignment: 弹壳碰撞对应雨滴；弹链逐条落下对应阵雨持续；平台对应地面；多点高频声对应雨幕；由多到无对应雨停；随后寂静对应雨后；黄铜密集落下对应雨点可视化
context_alignment: 段落描写黑色力量正在消解，雨声把这一过程变成可听时间轴，最后寂静即停战真正落地。
narrative_function: 以连续听觉节拍表现一人带动全体卸武，并用骤停完成场面转折。
transfer_rule: 用下雨写群体小物碰撞声时，需要大量独立落点、短促高频声、持续一段时间并有清晰开始或停歇。
failure_boundary: 只有一两次沉重撞击、声音尖锐稀疏，或物件被无声摆放时，雨声的密度和连续性不成立。
