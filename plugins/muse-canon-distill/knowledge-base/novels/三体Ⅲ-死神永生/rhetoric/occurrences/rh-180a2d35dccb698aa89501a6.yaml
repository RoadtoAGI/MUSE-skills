quote: 程心知道自己在精神上已经死了，能让她的精神继续活下去的唯一希望是云天明
sensory_mapping: 她的身体仍呼吸行走，内在却像已经停跳，云天明成了唯一可能让那部分生命重新启动的脉搏。
context_fact: 她活下去主要为避免地球文明人口减半，蓝星约会失败后精神希望也消退。
image_mechanism: 精神死亡将创伤后的意义丧失与肉体存活分层，解释她为何能履责却无法真正生活。
property_alignment: 意义活力对应生命；创伤麻木对应死亡；肉体责任对应维持机能；云天明希望对应复苏源；约会失败对应救治中断。
context_alignment: 二维城市保留信息却生命全死，程心同样保留身体功能却失去精神活动，个体成为三维版死画。
narrative_function: 界定她在新世界的心理基线，并与AA开始爱情生活形成相邻对照。
transfer_rule: 精神状态比作生死时，应具体区分仍存功能、失去活力、复苏条件和当事人的持续责任。
failure_boundary: 程心仍有情感、判断和行动，并非临床意义死亡；此语表达极端麻木与意义丧失。
