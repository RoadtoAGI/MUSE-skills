figure_type: simile
quote: 还是终于像烈日下的水渍一样蒸发了
sensory_mapping: 千年历史被加速成地面湿痕在强光下退边、变浅、消失的短过程。
context_fact: 君士坦丁堡陷落使古罗马最后的政治延续终结。
image_mechanism: 烈日给消亡施加持续外力，蒸发则取消轰然倒塌，让帝国像最后一点水分被时代抽空。
property_alignment: 领土与力量长期收缩对应水渍退边；外敌压力对应烈日加热；政体不复存在对应水分无痕蒸散。
context_alignment: 前句把拜占庭写成古罗马留下的车辙，这里改用可耗尽的水，完成拖延千年后的最终清除。
narrative_function: 从战场死亡拉远到文明尺度，以安静消失表现历史终局。
transfer_rule: 概括长期衰亡时，可选有连续缩减阶段的物理过程；外部压力、缩减轨迹和归零状态都应有史实支撑。
failure_boundary: 若制度被继承、主体只是更名或仍留有同一政权连续性，无痕蒸发会过度断裂历史；骤然爆炸式灭亡也不合慢蒸。
