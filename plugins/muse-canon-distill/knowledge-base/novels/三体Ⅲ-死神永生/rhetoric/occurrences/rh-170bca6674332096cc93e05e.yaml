tenor: 程心与维德因她叫停光速事业、导致其理想破灭和即将被处死而形成的永久伦理与情感隔绝
vehicle: 两人分立深不见底的峡谷两岸，没有桥梁或道路可以跨越，虽彼此可见却无法抵达
ground: 二人关系对应两岸；价值冲突对应深谷；透明屏对应可见物理间隔；无法和解对应无桥；维德将死对应永久断路；共同往事对应隔岸相望
