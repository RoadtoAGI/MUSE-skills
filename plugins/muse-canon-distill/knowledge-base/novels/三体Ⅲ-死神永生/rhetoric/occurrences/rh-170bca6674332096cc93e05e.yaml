chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 隔开他们的除了这面透明屏，还有人世间最深的、已经永远不可能跨越的沟壑
sensory_mapping: 透明屏后；深谷裂开；两岸静坐；无桥可渡；谷底不可见
context_fact: 维德因星环事件被判死刑，程心在羁押室探望；他拒绝讲述自己，只取三支临刑前能抽完的雪茄。
image_mechanism: 厘米厚的透明屏向下裂成无底地貌，视觉上的近被伦理深度推远；两人能相视却不能跨越，关系距离因此同时可见和不可达。
property_alignment: 程心与维德对应两岸人物；价值决裂对应沟壑；伤害深度对应谷深；透明屏对应裂口表面；无法谅解对应无桥；死刑将至对应道路永久封闭；相视无语对应隔岸看见
context_alignment: 二人曾共享光速理想，真正分开他们的是手段与后果；沟壑比墙更适合写同一目标下向下裂开的关系。
narrative_function: 为二人最后会面确定不可和解的空间结构，抑制和解期待并强化沉默。
transfer_rule: 用沟壑写关系断裂时，应保留两端仍可辨识的共同点，同时给出造成纵深的具体伤害、缺少桥梁和时间上的不可逆性。
failure_boundary: 冲突只是暂时误会、双方已有沟通方案，或人物早无任何共同历史时，最深沟壑会夸大或缺少两岸张力。
quality_assessment: exemplary
