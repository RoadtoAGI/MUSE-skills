figure_type: analogy
quote: 那个球形舱像一只被加固的保险箱
sensory_mapping: 小球舱化成嵌在舰尾的金属保险柜，舱壁是加厚箱壳，执剑人的中微子信号像唯一钥匙。
context_fact: 控制单元体积很小但决定整舰广播功能，舰长也没有进入密码。
image_mechanism: 保险箱将技术隔离翻译成储物安全逻辑，既说明保护强度，也暗示内部控制权可成为劫持目标。
property_alignment: 球舱外壳对应箱体；无密码对应上锁；控制器对应高价值内物；执剑人信号对应唯一钥匙。
context_alignment: 亨特的任务正是必要时毁掉箱中之物，保险意象与他不信任烧熔装置形成矛盾张力。
narrative_function: 让广播系统防护结构一目了然，并为四维人员无视舱壁进入制造反差。
transfer_rule: 隔离舱如保险箱时，应对应外壳、锁、授权者和内部价值，并指出绕过方式。
failure_boundary: 球舱不是可移动箱子，外壳也防不住四维进入；类比只覆盖三维访问控制。
