tenor: 与全舰系统隔离、无舰员密码可入的引力波发射控制单元舱
vehicle: 外壳强化、锁具独立且仅授权者能开启的保险箱
ground: 内部物件价值和危险极高；外壳阻止未经授权进入；开启权限集中且与周围系统隔离
