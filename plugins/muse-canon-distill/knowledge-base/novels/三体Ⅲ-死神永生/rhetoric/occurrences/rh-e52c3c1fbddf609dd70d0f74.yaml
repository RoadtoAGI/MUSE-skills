chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 被称为太阳系长城的环日加速器
sensory_mapping: 太空长城；线圈关隘；环日延伸；巨构无尽；星际墙线
context_fact: 加速器没有连续管道，粒子在真空中从一个线圈飞向下一个，三千二百个线圈沿木星轨道围太阳一圈。
image_mechanism: 彼此远到不可同时看见的离散线圈在想象中被粒子轨迹缝成一堵环日长墙，节点间的空白由共同工程功能补齐。
property_alignment: 加速器整体对应长城；三千二百线圈对应关隘墙段；木星轨道对应城墙路线；环太阳一周对应绵延疆域；粒子逐站加速对应沿墙传递；太阳系尺度对应万里夸张尺度；工程标志性对应文明巨构
context_alignment: 程心起初误以为它是一圈实体管道，长城名称促成这种误解；随后揭示离散线圈，又让喻体从形体描述转为工程规模与协同结构。
narrative_function: 先以文化巨构建立尺度敬畏，再借误读揭示太空真空如何改变加速器设计。
transfer_rule: 以长城命名线性巨构时，应有跨越性路线、许多协同节点、远超单点视野的尺度和文明级工程标志。
failure_boundary: 设施集中于一处、各节点互不协同、路线短小，或功能完全不依赖沿线连续传递时，长城只剩空泛宏大。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 由三千二百个线圈相隔一百五十万千米、沿木星轨道环绕太阳一周的超大型粒子加速器
vehicle: 跨越广阔国土、由连续关隘和墙段构成并形成宏大闭合防线的长城
ground: 线圈序列对应城墙节点；环日轨道对应长城走向；太阳系尺度对应跨越疆域；工程整体对应巨型墙体；单个线圈对应关隘；连续功能对应墙段协同
