chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 在她的潜意识中，宇宙仍是童话，一个爱的童话
sensory_mapping: 黑暗森林被程心内心改画成柔光故事书，敌人、开关和婴儿都被置入爱会收束结局的页页图景。
context_fact: 她明知威慑和平只利于人类，却没有真正站到三体立场判断其行动。
image_mechanism: 童话不是单个装饰物，而是替现实安排角色动机和结局规则的叙事模型，因此能直接导致战略误判。
property_alignment: 善有善报对应她相信不毁灭会换来克制；爱主导结局对应她以生命伦理代替敌方利益；简化善恶对应未进入敌人视角。
context_alignment: 智子以宇宙不是童话点破程心，随后她本人又被称为童话，框架从世界观延伸到人格。
narrative_function: 给威慑失败提供核心认知因果，把程心的善与职责不相容具体化。
transfer_rule: 把世界观比作故事类型时，应提取该类型的因果规则、角色预期和结局合同，并显示它如何塑造选择。
failure_boundary: 童话并非都以爱获胜，也可能残酷；此处指程心心中理想化版本，不能概括儿童文学整体。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心把宇宙冲突理解为最终受爱、善意和美好结局支配的认知框架
vehicle: 以爱为道德秩序、善良者通常获救且冲突得到圆满解决的童话故事
ground: 世界被期待遵守道德因果；爱被视为可化解敌意的力量；残酷结局在框架中难以成立
