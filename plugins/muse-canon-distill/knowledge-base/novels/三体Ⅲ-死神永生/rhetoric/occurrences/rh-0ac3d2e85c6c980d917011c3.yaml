chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 他发现周围人的神情像在出席他的葬礼一般
sensory_mapping: 体检室像临时灵堂，蓝药片诊断成了讣告，仍年轻的同伴以送别死者的眼神围住亨特。
context_fact: 亨特伪装出不能冬眠的疾病，将在全舰轮换冬眠时独自清醒并老去。
image_mechanism: 葬礼把时间隔离写成社会性死亡：他还活着，却会从同龄人的共同年龄和未来生活中提前退出。
property_alignment: 不能冬眠对应与同伴永别；独自老去对应提前死亡；众人沉重神情对应吊唁；确诊对应死亡宣告。
context_alignment: 任务要求献出一生，周围人不知真因却准确感到牺牲结果，葬礼成为秘密使命的外部轮廓。
narrative_function: 让亨特伪病代价立即可感，并预告他将成为航程中唯一持续衰老者。
transfer_rule: 活人处境如葬礼时，应有不可逆分离、共同体哀悼和社会时间断裂，不能只凭严肃表情。
failure_boundary: 亨特并未死亡且仍可交友工作；若未来能同步冬眠，葬礼式永别便不成立。
quality_assessment: exemplary
