chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 拥有穿梭机就如同古代拥有飞船一样，对大部分人来说是可望而不可即的
sensory_mapping: 远处飞船；高墙发射场；少数所有者；仰望群众；触不到的逃生门
context_fact: 星环公司有自用穿梭机，而发射港外绝大多数市民没有任何合法登机渠道。
image_mechanism: 技术虽已日常化，所有权距离却没有随之消失；普通人站在未来发射港，仍像早期人类隔着高墙仰望国家飞船。
property_alignment: 私人穿梭机对应古代私人飞船；公司资本对应国家航天资源；所有权门槛对应发射许可；普通市民对应仰望者；独立逃生对应自主发射；极少数拥有对应特权集中
context_alignment: 把技术普及与权利普及分开，正好解释为何发射港遍布城市却仍形成死亡等级。
narrative_function: 揭示交通能力背后的所有权不平等，深化危机伦理。
transfer_rule: 用旧时代奢侈技术写未来所有权时，应区分使用普及与资产控制，并对应资本、许可、稀缺和危机收益。
failure_boundary: 载具可公共免费调用、所有权不影响登乘，或普通家庭普遍拥有时，该特权类比不成立。
