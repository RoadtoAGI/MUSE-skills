figure_type: simile
quote: 如林的新月旗在潮湿的海风中猎猎飘扬
sensory_mapping: 旗杆成为树干，旗面成为受海风摇动的枝冠，营地横向铺成林地。
context_fact: 奥斯曼营帐一直延伸至视野尽头，旗帜遍布铅灰天幕下的阵地。
image_mechanism: 一个林字把离散旗帜合成有纵深的整体，随风猎猎的旗面又让军势呈现自然繁殖般的旺盛。
property_alignment: 旗杆直立对应树干；旗帜密集对应林木成片；旗面同步摆动对应树冠受风。
context_alignment: 守城者从高处望见敌营无边，森林的连续性准确传达敌军数量和占地压力。
narrative_function: 用最短意象扩大敌阵纵深，使军事优势直接进入视觉。
transfer_rule: 以植物群写密集竖物时，应让竖直骨架、群落密度和风中上部运动同时可见，避免只借数量套用如林。
failure_boundary: 旗帜稀疏、平铺或无杆悬挂时不成树林；近景逐面辨认图案时，林的整体化也会遮蔽所需细节。
