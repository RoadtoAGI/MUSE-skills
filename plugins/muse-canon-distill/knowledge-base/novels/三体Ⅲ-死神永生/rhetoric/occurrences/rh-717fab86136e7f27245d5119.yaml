figure_type: simile
quote: 移民区的生活对她们而言是地狱般的折磨
sensory_mapping: 热、渴、拥挤和争抢被合成一间封闭刑场，每项日常不便都成为反复施加的惩罚。
context_fact: 八名女人挤住简易房，食品和水定量供应，现代生活设施大多消失。
image_mechanism: 地狱把相对贫困升格为道德惩罚，说明她们为何需要把程心当作造成惩罚的罪人。
property_alignment: 强制移民对应无法逃离；匮乏拥挤对应持续受苦；责骂程心对应寻找施罚原因。
context_alignment: 与同句天堂形成垂直坠落，喻体记录的是这代人的感受尺度，而非生存条件的客观极限。
narrative_function: 把时代落差转成情绪因果，连接环境困苦与对程心的群体暴力。
transfer_rule: 天堂与地狱成对使用时，要让同一人物群的生活指标发生可核对反转，避免空泛褒贬。
failure_boundary: 移民区仍提供住房和配给，不能把地狱当客观等量判断；对经历过大低谷者未必成立。
