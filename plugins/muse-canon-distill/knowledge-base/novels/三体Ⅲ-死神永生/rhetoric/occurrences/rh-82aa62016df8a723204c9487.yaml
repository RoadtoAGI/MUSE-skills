chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 天空布满铅云
sensory_mapping: 铅灰天盖；低云压顶；金属阴冷；日光封住；海天同黑
context_fact: 程心初到北极圈小岛，海风阴冷，黑崖黑海之间只有一道白浪。
image_mechanism: 松散水汽被压铸成沉重金属顶板，灰色不仅可见还获得重量，令世界尽头的天空似乎正在向岛面下沉。
property_alignment: 云层对应铅板；灰黑颜色对应铅色；厚度对应金属重量；低垂对应重压；遮阳对应不透光；冷海风对应金属冷感；满天覆盖对应整片板面
context_alignment: 程心内心刚恢复希望，外部世界却被铅色封住；随后云缝露金光，物质般重云使希望裂缝更鲜明。
narrative_function: 用材质和重量定下海岛肃杀基调，为阳光短暂突破建立强明暗对比。
transfer_rule: 用铅写云时，应匹配暗灰、不透明、低垂厚密和压迫冷感，并让后续光线确实被其阻隔。
failure_boundary: 云层轻薄洁白、快速飘散或阳光通透时，铅的重量与遮蔽会错写天气。
quality_assessment: conventional
