tenor: 默斯肯岛上方低沉、厚重、灰黑且遮住阳光的密集云层
vehicle: 大面积铅板颜色暗灰、质地沉重，覆盖头顶时带来向下压迫和冰冷金属感
ground: 云灰色对应铅色；云层厚密对应金属板厚重；低垂对应铅的重量；遮光对应不透明；阴冷对应金属冷触；天空布满对应铅面覆盖
