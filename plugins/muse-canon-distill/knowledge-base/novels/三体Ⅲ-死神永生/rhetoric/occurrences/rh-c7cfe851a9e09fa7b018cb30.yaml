quote: 他的表演立刻像勾了魂似的把她们吸引住了
sensory_mapping: 怒吼与跺脚像抛出无形钩索，一下扣住两人的意识，把目光和身体都拽向舞者。
context_fact: 老人涂脸、赤膊持真长矛起舞，平日和善气质瞬间变成强烈攻击性。
image_mechanism: 勾魂把审美吸引写成带危险的强制牵引，与战舞本要震慑敌人的功能一致。
property_alignment: 表演魅力对应魂被钩住；目光固定对应牵索不放；和善形象突变对应施术猝发。
context_alignment: 两人刚把传统当作好玩展品，勾魂感迫使她们体验仪式真实的战斗力量。
narrative_function: 完成弗雷斯从温厚老人到战士祖先的瞬变，并校正AA的戏仿。
transfer_rule: 写表演强吸引力时，可用捕获意象，但应让节奏、目光和观看者失控三项落地。
failure_boundary: 她们没有失去意识或被超自然摄魂；若观看只是礼貌专注，勾魂会夸大强度。
