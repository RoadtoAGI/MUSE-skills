chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 灿烂的灯火几乎把王宫照成透明的水晶宫殿
sensory_mapping: 石墙被强光洗薄，窗棂和金饰像水晶切面同时闪烁，宫殿仿佛能看穿。
context_fact: 寿宴灯火与焰火共同照亮王宫，叙述有意把欢乐写到近乎不真实。
image_mechanism: 水晶的透光和折光性质放大灯火造成的视觉透明感，也把王权奢华凝成单一材质。
property_alignment: 强照明对应水晶透亮；墙面反光对应晶面折射；王宫华丽对应宝石材质；轮廓轻化对应透明。
context_alignment: 这座看似透明的宫殿实际藏着王子的阴谋，透明视觉与政治不可见形成讽刺。
narrative_function: 补足庆典的过曝质感，让随后地堡的潮湿黑暗显得像进入反面世界。
transfer_rule: 建筑比作晶体时，应由光穿透感、反射面、材质价值和轮廓变化支撑。
failure_boundary: 石质王宫并未变成水晶，也没有真正透明；比喻不支持结构脆弱等属性。
