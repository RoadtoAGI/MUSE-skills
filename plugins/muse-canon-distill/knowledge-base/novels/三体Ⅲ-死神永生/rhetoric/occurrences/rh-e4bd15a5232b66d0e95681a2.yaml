tenor: 灯光强到轮廓通透、表面闪耀的王宫
vehicle: 由透明水晶构成、内外透亮并在各面折射光芒的宫殿
ground: 高亮近乎通透；硬质表面反光；整体华贵；边缘在光中变轻
