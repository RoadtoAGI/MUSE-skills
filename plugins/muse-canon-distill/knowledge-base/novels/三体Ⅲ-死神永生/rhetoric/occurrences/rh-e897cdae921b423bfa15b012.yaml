tenor: 广播坐标的点数、标注方式、来源和时间等细节在歌者经验中能透露发送文明的意图、情绪和处境
vehicle: 一个有生命的主体以姿态、表情、声音细节主动自我表达，让敏锐观察者读出内在状态
ground: 坐标点阵对应身体；编码细节对应表情动作；发送文明对应内在主体；模式差异对应个性；歌者判断对应识读；诚意恐惧对应表达内容；信息组合对应有机整体
