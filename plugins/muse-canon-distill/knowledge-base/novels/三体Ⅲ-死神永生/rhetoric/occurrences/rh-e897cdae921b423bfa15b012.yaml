chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: metaphor
quote: 一个坐标，在外行看来就是那么一个简单的点阵，但在歌者眼中它却是活的，它的每一个细节都在表达着自己
sensory_mapping: 坐标苏醒；点阵成脸；细节说话；数据有神态；主体浮现
context_fact: 主核只能提供模式和历史，歌者凭上万时间颗粒积累的直觉判断坐标是否真实，并在意识中形成发送者形象。
image_mechanism: 静止点阵先长出生命，再让每个取点和标注像面部细节一样开口；数据不是被机械解码，而是在经验丰富的观察者面前自己显露人格。
property_alignment: 点阵坐标对应生命身体；取点数量对应姿态；标注方式对应表情；广播历史对应经历；发送文明对应内在自我；编码差异对应个性；歌者直觉对应识人能力；诚意与恐惧对应被表达情绪
context_alignment: 歌者职业价值就在主核不可替代的直觉，活坐标把技术判断转成读人，并解释他为何把灭绝决定当审美乐趣。
narrative_function: 显示清理判断如何依赖具身经验，也让遥远人类文明在毁灭者眼中短暂获得可读生命。
transfer_rule: 把数据写活时，应给出多个能承载性格或意图的微观特征、专业观察者的长期经验和由细节到主体判断的过程。
failure_boundary: 数据完全随机、没有发送主体，或观察者只按固定阈值机械分类时，活着和自我表达会虚构不存在的意图。
quality_assessment: exemplary
