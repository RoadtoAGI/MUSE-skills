chapter: 地球文明
figure_type: simile
quote: 这光不像是电发出的，更像奄奄一息的小火苗
sensory_mapping: 厚灯罩里只剩一点黄光伏着喘息，仿佛下一瞬就会缩黑的火舌。
context_fact: 灯的造型取自卢梭墓中擎火炬的手，巨大供电系统保障它十万年不灭。
image_mechanism: 将工程上最耐久的电光看成将死火苗，用主观将熄感压过客观长寿，显出文明末日的时间反讽。
property_alignment: 昏黄对应火焰色；弱亮对应燃料将尽；小范围光晕对应小火苗；火炬形灯对应承载火焰的手。
context_alignment: 整个人类已到最后时刻，能亮十万年的灯也在当下被看成生命将尽，物理寿命与文明寿命分离。
narrative_function: 把耐久设备人格化为文明余烬，为程心面对石刻时的失语和下一段时间裁决铺垫。
transfer_rule: 写微光如将熄火苗时，应让色温、亮度、边缘状态、承载物和场景生命阶段共同支持。
failure_boundary: 灯实际没有闪烁或能源衰竭，预计还可亮十万年；奄奄一息属于末日观察者的情绪投射。
