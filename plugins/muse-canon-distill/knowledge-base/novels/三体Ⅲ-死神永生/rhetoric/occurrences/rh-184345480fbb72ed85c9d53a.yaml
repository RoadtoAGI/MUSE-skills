tenor: 能持续十万年的长明灯透过厚罩发出的昏黄微弱光线
vehicle: 燃料将尽、跳动微弱、随时会熄灭的一小簇火苗
ground: 颜色昏黄；亮度微弱；覆盖范围小；给人将熄感；与火炬造型一致；仍在勉强照明
