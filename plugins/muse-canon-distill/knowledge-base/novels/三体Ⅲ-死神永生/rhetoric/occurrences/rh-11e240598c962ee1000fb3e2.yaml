chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 与三体飞船相比，慢得像蜗牛
sensory_mapping: 人类巨舰缩成壳重的蜗牛，在太空路面一点点挪动，三体舰队却已瞬间跨入光速。
context_fact: 三体飞船可不经加速直接跃迁至光速，人类战舰为保返航需一年才达到最高速度。
image_mechanism: 蜗牛并非给出绝对慢，而是在并置瞬时跃迁后把技术代差压成赛道上的速度反差。
property_alignment: 一年加速对应蜗牛缓爬；返航燃料负担对应背壳拖累；三体跃迁对应对手瞬间消失。
context_alignment: 人类舰队仍被称为恒星级，弱小动物喻体刺破名号中的宏伟，解释为何太空也必须撤空。
narrative_function: 总结人类放弃舰队抵抗的动力学原因，关闭常规逃亡或迎战希望。
transfer_rule: 速度差用动物表达时，要给出共同赛道、时间尺度和负载条件，让相对慢有计算背景。
failure_boundary: 百分之十五光速在绝对尺度上极快，蜗牛只相对三体跃迁成立；不表示飞船运动机制相似。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 人类战舰需长期加速才能到百分之十五光速的推进能力
vehicle: 贴地缓慢爬行、短时间几乎看不出位移的蜗牛
ground: 相对对手速度差巨大；加速进展缓慢；远距离航行耗时过长而失去竞争力
