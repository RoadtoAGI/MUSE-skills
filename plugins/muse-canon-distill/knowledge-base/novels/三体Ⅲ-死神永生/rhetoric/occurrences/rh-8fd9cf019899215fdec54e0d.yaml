review_status: reviewed
tenor: 程心虽已生理苏醒，却直到看见普通城市沿圆筒内壁升上头顶，才理解自己身处木星背面太空城并进入新时代现实
vehicle: 沉睡者睁眼后意识由模糊转清，熟悉表象被真实世界替代，认知和感官在同一刻完全醒转
ground: 冬眠恢复对应半醒；误认公元城市对应梦中错觉；圆筒世界显现对应睁眼；理解新时代对应意识清醒；平凡转震撼对应梦幕撤去；自我定位对应醒后认境
