chapter: 【掩体纪元11年，掩体世界】
figure_type: metaphor
quote: 所有的平凡瞬间变为震撼，她感到自己这时才真正苏醒过来
sensory_mapping: 认知睁眼；圆筒显形；梦幕退去；平凡骤震；第二次苏醒
context_fact: 病房与街景极像公元世纪，云层散开后她才发现“天空”也是城市，大地在两侧上升连接成圆筒。
image_mechanism: 身体苏醒与世界苏醒被拆成两次事件：前者让她看到旧时代假象，后者由云隙揭开太空城结构，才把意识真正带到掩体纪元。
property_alignment: 生理醒来对应初睁眼；时代误判对应梦境；云层对应眼帘；对面大地显现对应视野清晰；理解太空城对应意识恢复；震撼对应醒觉刺激；新世界对应醒后现实
context_alignment: 程心每次冬眠都经历时代切换，本次生活表面反常地复古；“真正苏醒”准确标记她从时间错觉转入空间真相。
narrative_function: 把太空城揭示从地理信息提升为人物意识转折，完成本章未来世界的正式登场。
transfer_rule: 用真正苏醒写认知转折时，应区分此前的生理清醒与仍存误判，并由一个明确新证据重构人物所在现实。
failure_boundary: 人物此前已准确理解环境，或新景象只增加细节、不改变现实模型时，第二次苏醒会夸大认知变化。
quality_assessment: effective
