chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 科技却可能成为催生新极权的土壤
sensory_mapping: 引力波、智能控制等技术铺成土层，文明危机落下种子，面壁者与执剑人的超级独裁从中破土。
context_fact: 技术可让个人直接控制毁灭系统，减少传统独裁依赖他人的低效率和不确定性。
image_mechanism: 土壤避免把科技直接等同极权，强调它是生成条件；催生则保留危机、制度和人选择共同作用。
property_alignment: 超级技术对应肥沃土层；文明危机对应播种条件；权力集中对应植物扎根；制度扩张对应持续生长。
context_alignment: 威慑纪元民主高度发展却笼罩独裁阴影，生长模型解释两者为何可在同一社会并存。
narrative_function: 从罗辑个案上升为科技政治命题，指出文明进步工具也可能生成新的权力风险。
transfer_rule: 制度如植物时，应区分种子、土壤、养分和生长结果；技术只能作为条件，不能被写成单一必然原因。
failure_boundary: 缺少危机、控制集中或政治接受时，技术土壤未必长出极权；同一技术也可支持分权。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 超级技术在生存危机中为高度集中、绕过传统组织制约的个人权力提供条件
vehicle: 含有养分的土壤接纳种子，使原本尚不存在的植物萌发、扎根并持续生长
ground: 环境本身不等于结果，却提供结构资源和生长条件；危机种子落入后会形成新的权力形态
