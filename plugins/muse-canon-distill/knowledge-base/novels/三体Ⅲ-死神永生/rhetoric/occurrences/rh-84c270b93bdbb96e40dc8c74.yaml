chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 它像一个幻影，与现实世界中的任何物体都不发生作用
sensory_mapping: 白色平面清楚悬在眼前，抓斗合拢却像扣住空气，纸条从金属中无声漏出。
context_fact: 多次捕获实验均失败，密封抓斗回缩时纸条仍留原位。
image_mechanism: 幻影用感官矛盾解释可见而不可触，直接把工程失败转成人人理解的实体缺席。
property_alignment: 纸条可见对应影像；抓斗穿透对应无实体；位置不变对应幻影不受力；无反馈对应不相互作用。
context_alignment: 它外形像浪漫书信，行为却像幽灵；温柔表象逐渐转成超出现实的恐怖。
narrative_function: 确认纸条不是普通物质，为二维宇宙投影判断提供首个实验依据。
transfer_rule: 可见不可触对象比作幻影时，应逐项对应视觉、接触、受力和位置变化。
failure_boundary: 纸条能发光和引力波，仍与世界有某些作用；幻影不能说明其物理本体。
