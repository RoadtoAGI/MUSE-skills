tenor: 抓斗、机械臂与纸条接触时全部穿过，无法施力或改变其位置的二维物体
vehicle: 肉眼可见却没有实体、任何手和器物都穿过的幻影
ground: 视觉存在；触觉缺失；不能被抓取；不与物质交换动量；位置不受接触影响
