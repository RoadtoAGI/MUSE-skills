chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 像是古代雅典一个神庙的废墟
sensory_mapping: 断柱残阵；青藤攀石；白水喷泉；阳光遗址；人倚柱旁
context_fact: 星环城科学院和工程院小楼掩在绿树中，这处景观位于石台上并由刻意营造的希腊式残柱组成。
image_mechanism: 未来太空城复制出一块被时间打断的古典建筑，断口、藤蔓和闲卧人群共同制造历史沉积感，让新城内部出现一处假想古代。
property_alignment: 平台对应神庙基座；希腊柱式对应古雅典建筑；断柱对应遗迹；青藤对应长期废弃；喷泉对应公共圣域水景；休闲人群对应遗址访客；绿树对应古迹环境
context_alignment: 科学城以大学校园为气质，雅典遗址同时唤起古典学术传统与公民自由，反衬外部舰队封锁。
narrative_function: 用人工古迹给未来科研城市加入历史纵深与松弛气氛，强化城内外冲突。
transfer_rule: 借特定文明遗址描写仿古景观时，应落实柱式、残损、基座、植被和使用方式等多项可辨证据，并让典故服务场所精神。
failure_boundary: 建筑完整崭新、没有古典构件，或仅有几根普通立柱却无残损和时间痕迹时，雅典神庙会成为标签化联想。
