chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 他的笑戛然而止，把自己变成一具僵尸
sensory_mapping: 狂笑像电流突然切断，云天明的脸和身体冻结，活人气息退去，只剩可应答的空壳。
context_fact: 他刚独自推演程心要他受最惨死亡并歇斯底里发笑，程心关切地推门询问。
image_mechanism: 变成强调主动伪装，僵尸则把情绪压抑推到生命状态切换，显示笑与木然之间没有缓冲。
property_alignment: 笑声中止对应生命信号断开；表情木然对应尸体僵硬；隐藏痛苦对应内在空死；仍能应答对应僵尸行动。
context_alignment: 云天明随后以平静外表接受使命，僵尸形象揭示这份顺从来自情感死亡而非真正认同。
narrative_function: 完成独白到正式问询的面具切换，并让一句好的接受带有观众已知的死亡阴影。
transfer_rule: 人物如尸体应由活力骤失、姿态僵硬和内外断裂支撑；需清楚是主动封闭还是生理昏厥。
failure_boundary: 若人物仍激动争辩、表情丰富或只是短暂停笑，僵尸会过重；喻体也不意味着真实失去意识。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 程心重新进门后云天明瞬间压住狂笑、情绪和真实反应的自我控制
vehicle: 仍能坐立却没有生命表情、欲望和自主动作的一具僵尸
ground: 外在身体保留，内在活力被强行关闭；面孔与动作僵硬，无法让他人看见真实情绪
