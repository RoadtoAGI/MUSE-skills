figure_type: simile
quote: 每个字像用长长的糖丝连起来
sensory_mapping: 每个字成为糖粒，尾音拉成透明黏丝牵到下一字，听觉获得甜味和拉丝触感。
context_fact: 女性化政治演讲者用甜美声音讨论杀人规模与英雄评价，内容可怕。
image_mechanism: 糖丝精准塑造音色与连音，甜腻外壳又与残酷内容冲突，使温柔形式显得危险。
property_alignment: 甜美音色对应糖味；长尾音对应拉丝；字间连读对应糖丝串连。
context_alignment: 未来文化柔美表面包裹威慑政治，糖丝语音成为时代外柔内硬的微缩。
narrative_function: 让声音质感先诱人，再由内容制造认知不适，强化演讲者复杂性。
transfer_rule: 语音转食物时，要同时对应味觉、质地与时间延展；内容反差可另增叙事层，但不能替代声音证据。
failure_boundary: 说话短促、字音硬断或嗓音苦涩粗哑时，长糖丝的甜黏连续性失效。
