tenor: 演讲者细软甜美、字与字之间黏连流畅的声音
vehicle: 被拉成长丝、黏甜而不断裂的糖浆把颗粒串连
ground: 声音甜且柔软；音节间连接绵长黏连，缺少硬停顿
