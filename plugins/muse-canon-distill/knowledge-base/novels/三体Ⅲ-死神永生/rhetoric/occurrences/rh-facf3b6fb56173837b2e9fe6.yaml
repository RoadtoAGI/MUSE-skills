chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 渐渐地，他成了这次漫长远航的一个象征
sensory_mapping: 每批醒来的人看见他头发更白，仿佛从这张脸上读到飞船已走过多少年和多少故事。
context_fact: 亨特因伪装的冬眠障碍半世纪保持苏醒，向不同值勤批次讲述其间趣闻。
image_mechanism: 象征把身体老化变成航程刻度，他既是活日历，也是各批冬眠者之间唯一的人际接缝。
property_alignment: 持续苏醒对应航程连续；逐年衰老对应时间刻度；讲述往事对应共同记忆；人人熟悉对应公共标志。
context_alignment: 秘密身份要求他处在不起眼岗位，结果这份长期在场反而使他成为全舰最显眼的时间标志。
narrative_function: 建立亨特的情感地位，使其稍后死亡既是个人牺牲，也是半世纪远航象征被摘除。
transfer_rule: 人物成为历程象征时，应让其身体变化、持续在场和群体记忆分别对应时间结构。
failure_boundary: 亨特不能代表航程中所有政治与个体经验；象征是船员共同感受，不等于真实职权。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 始终清醒、随每批船员老去并讲述冬眠间往事的老亨特
vehicle: 一个可见标志物，以自身形态集中代表整段远航的时间、连续性和共同记忆
ground: 个体贯穿别人缺席的年代；外貌变化显示时间；共同体以他确认航程连续存在
