chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 能够看到他们身后的“土星”亮度突然增加，像一颗超新星
sensory_mapping: 暗空亮星；突然增光；白热天体；背景压暗；短暂爆发
context_fact: 艇在巨石阴影中看不见氢弹火球，只能看到核光反射在身后行星模型上。
image_mechanism: 一块不发光的岩石被核闪瞬间点成恒星，亮度跃迁先于熔化显现；模型‘土星’在几秒内演出真实星爆外观。
property_alignment: 模拟土星对应恒星；核光照射对应爆发能量；亮度骤增对应超新星增光；太空背景对应星空；短时高亮对应爆发阶段；随后熔毁对应灾变后果
context_alignment: 试验目的正是验证恒星爆发防护，超新星参照让模型瞬间接近宇宙灾难尺度。
narrative_function: 从阴影侧给核爆一个间接可见标志，并启动熔石视觉序列。
transfer_rule: 用超新星写物体骤亮时，应有天体背景、亮度突跃、孤立光源感、短时峰值和灾变关联。
failure_boundary: 物体由灯具缓慢照亮、亮度低于环境，或持续稳定发光时，超新星会夸大变化。
quality_assessment: functional
