chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 天啊，里面的人会被压成肉膜的
sensory_mapping: 逃亡者想象舱内身体被过载按成贴壁的一层肉膜，像降维在飞船内部提前发生。
context_fact: 星环号实际由无过载曲率引擎加速，外部飞船因不知情而惊叫并试图拦截。
image_mechanism: 肉膜比薄饼更直接强调人体材质与死亡，把加速度误判造成的恐怖压缩成一张血肉薄面。
property_alignment: 人体对应肉层；常规过载对应压膜力；身体厚度对应膜厚；器官损伤对应肉质破坏；飞船无变形对应推翻误判。
context_alignment: 整个太阳系正被压成二维，旁观者自然以同一扁平结局理解异常加速，曲率技术却恰好绕开它。
narrative_function: 用外部人声显示光速飞船的加速多么反常，并为认出曲率驱动提供反证。
transfer_rule: 极端过载写成肉膜时，应交代受力方向、身体材质、厚度损失、致死后果和实际技术是否符合。
failure_boundary: 人体不会均匀铺成膜，飞船内也没有这类过载；该图像属于不知情旁观者的错误推断。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 旁观者误以为星环号靠常规推进高速加速，乘员会受过载沿受力方向极度压扁死亡
vehicle: 有厚度的肉块被巨压摊成只剩薄层、近似膜片的肉质平面
ground: 压力极强；厚度接近消失；横向展开；组织破坏；结果血肉化；过程快速致命；只剩薄层
