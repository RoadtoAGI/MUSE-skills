chapter: 【公元1453年5月，魔法师之死】
figure_type: metaphor
quote: 远看像一片黑色的铁钉，把蓝色的海面钉死了
sensory_mapping: 海面由流体变为蓝板，船身缩成钉帽；布满转化为钉入，静水转化为被固定。
context_fact: 敌舰覆盖博斯普鲁斯海峡，从城墙远眺时蓝色水面似乎失去风浪。
image_mechanism: 先用铁钉完成外形缩尺，再由钉死激活施力后果；船只数量不只占满海面，还把本应流动的海锁成硬板。
property_alignment: 远处黑船对应黑色钉帽；船体密布对应钉群密钉；水面不见起伏对应板材被钉牢；舰队封锁对应钉子实施固定。
context_alignment: 海峡封锁使帝都无路可逃，钉死既写视觉静止，也把战略封闭压进一个不可拔除的动作。
narrative_function: 把敌舰数量、材质感和封锁后果串成连续图像，令蓝海显出窒息。
transfer_rule: 外形比拟可以沿动词继续生长：先校准远景形状，再让喻体的典型用途对应场景后果，形成可延展而不跳域的框架。
failure_boundary: 船只若在高速航行、海面浪涌明显，钉死的固定后果就被现场否定；白色帆船近景也不支持黑铁质感。
