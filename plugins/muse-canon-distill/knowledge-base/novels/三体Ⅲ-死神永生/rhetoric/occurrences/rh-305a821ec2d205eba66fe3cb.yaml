chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 二维城市整体扩大为它们让开位置，看上去像是在平面上激起的水波扩散开来
sensory_mapping: 每艘飞船砸进巨图，周围建筑纹理便像水纹一样从落点向外一圈圈退让。
context_fact: 不重叠映射要求新增二维飞船不能覆盖城市原子，因此整幅城市图必须重新排布扩大。
image_mechanism: 水波把难以想象的全局坐标重排变成局部扰动外传，清楚显示新增对象如何迫使整图腾挪。
property_alignment: 飞船进入对应落水物；新增位置对应波源；建筑外移对应水纹推进；城市扩大对应波圈扩张；平面对应水面。
context_alignment: 沉船、水面、墨滴、人雨之后，水波补全二维海洋的最后一种动态，维度灾难获得统一液态语法。
narrative_function: 解释飞船降维为何改变远处城市布局，并让严格投影规则呈现柔性流动外观。
transfer_rule: 全局结构响应局部插入可比作水波，但需说明波源、传播方向、被推开的元素和守恒规则。
failure_boundary: 二维城市不含液体，也不存在振荡波峰；扩散是原子位置重排的视觉结果，不会回弹。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 飞船和太空艇跌入后，二维城市依照不重叠规则整体外移、扩大以容纳新增结构
vehicle: 物体落入水面激起圆形波纹，波峰从落点向四周连续扩散
ground: 变化由局部撞入触发；扰动向外传播；平面范围扩大；运动连续成环；中心加入新物；原有结构被推开
