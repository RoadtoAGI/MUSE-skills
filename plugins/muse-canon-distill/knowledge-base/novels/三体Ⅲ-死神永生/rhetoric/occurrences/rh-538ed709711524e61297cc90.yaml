figure_type: analogy
quote: 刚才，她面前的那条河是封冻的，她可以轻松地走到彼岸；但现在，河面融化了，她只能趟过黑色的河水
sensory_mapping: 死亡彼岸仍在河对面，麻木冰层因朋友牵挂裂化，她必须踏进黑水，冷流拖住每一步。
context_fact: 弗雷斯来电和对AA的记忆打破她的空灵平静，她放下胶囊，却仍计划在挣扎后服药。
image_mechanism: 冻河把麻木写成可承重表面，融水把恢复的情感写成阻力和痛感；朋友没有移动终点，却改变了抵达方式。
property_alignment: 死亡对应彼岸；麻木对应冰面；朋友牵挂对应融冰温度；心痛对应黑水寒流；迟疑对应涉水缓行。
context_alignment: 前文精神水面因朋友破碎燃烧，此处同一水体完全融化成河，意象从静态反射进入艰难行动。
narrative_function: 精确表现自杀冲动尚未消失却失去轻松感，为智子来电争取的延迟制造可测心理距离。
transfer_rule: 选择难度如过河时，应保持两岸目标，改变介质状态，并对应触发变化、身体阻力和延长时间。
failure_boundary: 死亡不是可抵达彼岸，痛苦也不会保证她最终服药；河流框架仍受抑郁的必然化视角控制。
