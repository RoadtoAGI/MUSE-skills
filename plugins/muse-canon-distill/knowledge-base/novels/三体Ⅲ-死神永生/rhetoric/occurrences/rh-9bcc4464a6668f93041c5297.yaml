review_status: reviewed
tenor: 人类灭亡后，其文物、图像和文化信息也可能完全消失、不可恢复
vehicle: 物质与反物质相遇后相互 annihilate，原有粒子形态彻底消失
ground: 原结构消失；无法直接找回；过程彻底；只可能留下变换后的痕迹；对象从存在转为无
