chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 以前的人生像漏斗中的水一样从越来越窄的门中漏出去
sensory_mapping: 隆隆钢门变成收窄漏斗口，过往年月液化成水，从最后一道缝隙一股股流向门外，直至截断。
context_fact: 程心独自进入深地控制中心，钢门合拢后正式成为执剑人，并感到一个新的自己诞生。
image_mechanism: 门缝的真实收窄提供漏斗形态，水流则赋予人生离去的连续速度和不可抓回性；关门终点与旧我流尽同步。
property_alignment: 门缝变窄对应漏斗出口；旧生活消退对应水量流失；钢门闭合对应出口封死；身份不可逆转换对应水不能回流。
context_alignment: 执剑人岗位把她与地面生活隔绝，空间封门与身份切换同时发生，流体模型准确追踪整个过渡过程。
narrative_function: 用一个动态画面完成旧我死亡与新我诞生的仪式，使职位交接成为个人生命断层。
transfer_rule: 写人生从门缝流失时，应让开口变化控制流速，并明确什么在流、何时流尽、为何不可回流。
failure_boundary: 若门稍后即开、旧生活仍可完整恢复，漏尽与新生的不可逆性会被推翻；瞬间切换也不适合连续水流。
