tenor: 钢门关闭过程中程心与接任前个人生活、身份和选择余地的永久分离
vehicle: 漏斗中的水被狭窄出口持续排走，最后一滴流尽后无法自行回到容器
ground: 旧有内容随开口缩小不可逆地减少；界面完全封闭时，前一状态被排空并终结
