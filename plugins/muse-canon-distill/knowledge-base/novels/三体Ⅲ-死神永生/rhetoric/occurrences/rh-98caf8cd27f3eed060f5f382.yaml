chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 人们都注意到她用了Reservation这个词，这是当年对印第安保留地的称呼
sensory_mapping: 澳大利亚地图折叠成旧殖民地地图，几十亿人被推入一块标着Reservation的边角，外部世界改换主人。
context_fact: 程心住进土著老人弗雷斯家，叙述回顾澳洲土著和印第安人遭屠杀、被迫迁往保留地的历史。
image_mechanism: 同一个政策词把五世纪前殖民暴力与星际占领叠合，使人类从历史施害者转到被保留者位置。
property_alignment: 三体占领对应殖民征服；澳大利亚对应原住民保留地；强制移民对应驱逐集中；文明衰亡风险对应族群历史结局。
context_alignment: 对照由土著幸存者的住所承载，历史回返不靠抽象报应，而靠地点、词语和角色身份重合。
narrative_function: 建立占领政策的殖民本质，并让人类所受命运成为自己历史行为的镜像。
transfer_rule: 历史制度类比应核对施力者、迁移方向、指定区域和长期后果，并让同一术语承担证据锚点。
failure_boundary: 三体政策的技术、人口规模和灭绝机制不同，类比不能把两段历史细节完全等同。
