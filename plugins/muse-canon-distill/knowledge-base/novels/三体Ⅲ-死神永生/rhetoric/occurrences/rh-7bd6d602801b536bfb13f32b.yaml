review_status: reviewed
tenor: 程心初见云天明便异常清楚感知其孤独和脆弱
vehicle: 越过外部边界，秘密进入他人内心并偷看隐藏内容
ground: 信息取得超过正常交往深度；被观察内容私密、未由本人主动展示
