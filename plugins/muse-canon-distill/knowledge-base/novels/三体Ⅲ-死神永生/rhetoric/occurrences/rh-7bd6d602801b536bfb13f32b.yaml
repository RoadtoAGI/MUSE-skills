chapter: 【危机纪元5-7年，阶梯计划】
figure_type: simile
quote: 好像潜入到他的心里偷看一样
sensory_mapping: 目光变成潜入者穿过身体外壳，孤独脆弱成为心室中被偷读的隐秘陈设。
context_fact: 两人尚未交谈，程心第一眼就对这个孤僻男生产生前所未有的关心。
image_mechanism: 潜入强调感知越界，偷看强调未经许可；直觉亲近因此同时带有敏锐和隐约冒犯。
property_alignment: 初见即知对应越界进入；脆弱未言对应隐藏内容；异常清晰对应近距偷看。
context_alignment: 程心后来以关怀名义决定云天明命运，早期心灵窥视为善意与越界并存埋下结构。
narrative_function: 解释她为何记住并选择云天明，也暗示她容易把理解他人当作替他决定的授权。
transfer_rule: 直觉理解借潜入写时，应突出信息深度和许可缺失；后文若有善意越界，可让早期喻体形成回声。
failure_boundary: 若云天明主动倾诉或两人长期相知，就不叫偷看；该感觉也不能证明她真的准确理解其全部内心。
quality_assessment: effective
