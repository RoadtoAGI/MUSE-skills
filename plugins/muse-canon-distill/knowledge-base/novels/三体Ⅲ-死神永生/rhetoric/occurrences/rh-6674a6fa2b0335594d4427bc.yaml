chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 澳大利亚就像一辆即将开往不归路的囚车，上面的犯人已经快把车厢挤爆了，却还要把剩下的七亿人硬塞进去
sensory_mapping: 大陆边界收紧成铁车厢，三十四亿身体贴满车壁，治安军仍把七亿人从门缝推进，轨道直指刑场。
context_fact: 移民一度因环境恶化停顿，水滴和智子威胁继续清除外部人口，迫使迁移完成。
image_mechanism: 囚车把大陆空间、强制迁移和未知终点整合为一套押送动作，拥挤不再是管理失误而是刑程组成。
property_alignment: 澳洲边界对应车厢；移民对应囚犯；治安军强迁对应押送塞人；三体计划对应不归路；饥荒终点对应处决地。
context_alignment: 人类曾把三体舰队当救赎天使，囚车图景从地面揭示所谓保留地实际是移动中的牢笼。
narrative_function: 在移民完成前明确其刑罚性质，并预告人口集中是灭绝计划必要步骤。
transfer_rule: 强制集中如囚车时，应对应容器、押送权、超载状态、行进方向和不可返终点。
failure_boundary: 澳大利亚没有实际移动，部分人仍希望在此生存；不归路表达战略趋势而非确定每人死亡。
