chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 短暂地露出他特有的那种冰水般的微笑
sensory_mapping: 维德嘴角只轻动一下，笑意像一口冰水掠过程心皮肤，清楚却没有任何暖意。
context_fact: 维德劝程心快离开澳大利亚，并强调这次是让她离开而非此前的死亡暗示。
image_mechanism: 冰水保留微笑的可见清晰，同时用触觉温度否定亲善，使警告中的关心仍属于维德的冷硬方式。
property_alignment: 微笑短促对应冰水一触；表情清楚对应水体透明；冷漠气质对应低温；程心不安对应寒刺激。
context_alignment: 他一边干净利落地钉板一边低声预警，冰水般笑容符合控制严密、情绪不外泄的角色声音。
narrative_function: 在维德罕见帮助程心时保留其危险辨识度，并加强预言式警告。
transfer_rule: 温度比拟笑容时，应同时匹配表面质地、接触时长和观察者身体反应。
failure_boundary: 冰水不说明维德没有善意，只写表达温度；若笑容热烈持续，这一短冷触感不成立。
