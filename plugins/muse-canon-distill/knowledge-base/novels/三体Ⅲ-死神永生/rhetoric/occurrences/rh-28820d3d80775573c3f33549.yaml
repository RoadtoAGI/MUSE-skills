chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 这艘船的桅杆还在，像一把指向星空的长剑
sensory_mapping: 半埋旧船像倒下的战士，唯一桅杆仍挺成剑身，剑尖刺向满天星光。
context_fact: 公主与卫队长在搁浅船旁避风，因询问长帆名字而第一次认识帆和桅杆。
image_mechanism: 长剑提取桅杆的几何方向，并以指向星空把废船残余结构转成仍有远行欲望的姿态。
property_alignment: 桅杆对应剑身；杆顶对应剑尖；竖直姿态对应举剑；星空方向对应被指目标。
context_alignment: 海船已因饕餮鱼失去航行能力，剑仍指星空，为被困王国与外部世界主题留下突破线。
narrative_function: 给长帆名字解释配上英雄化剪影，并为两人谈及故乡和永远无法离开转调。
transfer_rule: 竖直杆件比作剑时，应匹配长度、尖端、基座姿态、指向对象和场景中的行动愿望。
failure_boundary: 桅杆没有刃口或攻击作用，旧船也未在战斗；剑意来自轮廓和方向。
