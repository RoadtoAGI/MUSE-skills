chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 知道地狱不在地下而在天上
sensory_mapping: 地狱从脚下翻转到群星之间，火焰被真空寒冷替代，灵魂不向下坠而沿太空永远漂流。
context_fact: 他熟悉航天风险，认为仅大脑发射后最好的结果也是无身体地流浪，最坏则是反复接受酷刑输入。
image_mechanism: 位置倒置保留地狱的无尽惩罚，却用寒冷天空替换地下烈火，使科幻命运获得古老恐惧结构。
property_alignment: 太空深渊对应地狱封闭；无限漂流对应无期惩罚；无法自杀对应不得解脱；极寒黑暗对应反转后的酷刑环境。
context_alignment: 航天常被写作向上探索，云天明却把向上改成下地狱，准确表现他对程心崇高使命话语的逆反。
narrative_function: 把阶梯计划的英雄叙事翻成受难叙事，说明云天明接受的不是安乐死亡而是可能永刑。
transfer_rule: 倒置传统空间意象时，应保留核心功能、替换环境属性，并让方向反转回应场景既有价值观。
failure_boundary: 若太空旅程有可靠复活、交流和退出保障，无尽地狱会过度灾难化；这是人物恐惧推演而非确定结果。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 云天明想象中，只有大脑在无限寒冷太空漂流并可能受三体人折磨的命运
vehicle: 传统位于地下、充满无尽酷刑且无法逃脱的地狱被倒置到头顶天空
ground: 主体将承受长期痛苦与绝对孤立；所在空间无边、黑暗，并切断死亡或逃脱出口
