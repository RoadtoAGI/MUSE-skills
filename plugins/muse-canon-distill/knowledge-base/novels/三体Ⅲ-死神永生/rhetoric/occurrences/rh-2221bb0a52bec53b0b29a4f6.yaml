chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 尸横遍地，仿佛刚刚下了一场死人雨
sensory_mapping: 战场平面被看成雨后地表，横陈尸体取代雨滴，褐黑血地取代积水。
context_fact: 法扎兰与狄奥伦娜登城俯瞰刚结束惨烈交战的战场。
image_mechanism: 结果态反推出一场荒诞天气：尸体不再逐个死亡，而像降水一样成批落满视野，死亡由事件变成气候。
property_alignment: 尸体遍地对应雨滴覆盖地面；散乱而密集的分布对应骤雨落点；同场战斗造成群死对应同一云团集中降水。
context_alignment: 高处全景压掉个体身份，适合用天气尺度呈现伤亡；死人雨又把战争写成笼罩所有人的非人灾害。
narrative_function: 在一眼全景中交代伤亡规模，并用违常天气制造末日感。
transfer_rule: 描写群体结果时，可从落点密度反推一个共同过程；所选过程应解释覆盖范围、随机分布和短时集中三项。
failure_boundary: 尸体若整齐列放、只堆在一角或清楚来自多次分散死亡，雨的随机落点与集中过程就不成立。
