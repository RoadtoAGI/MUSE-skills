chapter: 【掩体纪元67年，“星环”号】
figure_type: metaphor
quote: 中间那一条宽阔汹涌的云带，竟让她想到了黄河。她当然知道，这条“黄河”中的一个旋涡可能容得下一个地球
sensory_mapping: 黄蓝巨河；云气奔流；旋涡如潭；木星河面；地球入涡
context_fact: 程心从飞船窗口近看木星向阳面，流线状云纹覆盖视野，其中宽阔云带正在强烈运动。
image_mechanism: 行星大气的带状运动先被压成一条熟悉河道，颜色和流势让气体获得水体重量；下一句突然放回行星尺度，使一个普通河涡膨胀到可吞地球。
property_alignment: 木星云带对应黄河；平行带形对应河道；黄色光与云色对应浑黄水色；大气湍流对应河水奔涌；气旋对应旋涡；视野横贯对应大河延伸；容纳地球对应宇宙尺度放大
context_alignment: 程心来自中国公元世纪，黄河是她自然会调用的地表尺度；熟悉母星河流与木星巨大尺度相撞，突出苏醒后的认知震荡。
narrative_function: 让读者先看清木星云带的形色和动态，再以尺度反转提醒太空城处境的渺小。
transfer_rule: 用河流写行星云带时，应同时匹配颜色、狭长走向、连续流动和旋涡结构，并用明确参照校准两端尺度差。
failure_boundary: 云层均匀静止、没有带状边界或旋涡，或叙事把气体真的当液态河流推导航行性质时，黄河映射会误写物理状态。
