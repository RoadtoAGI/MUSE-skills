chapter: 【危机纪元5-7年，阶梯计划】
figure_type: metaphor
quote: 程心感觉他的目光从雪茄头上反射到她身上，并带上了那一小团暗火的热量
sensory_mapping: 维德始终垂看的雪茄成为反光镜，暗红烟头给目光加热，热束折向程心并烫到她隐藏的情感。
context_fact: 程心诋毁云天明缺乏人类责任，维德只说地球有他留恋的东西，暗指云天明爱她。
image_mechanism: 反射解释维德未抬眼却精准命中，带热把雪茄场景物转成心理压力，间接视线比直视更显控制。
property_alignment: 雪茄凝视对应入射方向；暗示转向程心对应反射；烟头暗火对应危险洞察；羞惧灼痛对应热量抵达。
context_alignment: 维德惯于用冷眼观察绝望，此处唯一暖源是暗火，温度没有安慰感，反而像逼供。
narrative_function: 无须明说爱情便让维德揭穿程心与云天明的关联，提升他对人心的控制威胁。
transfer_rule: 间接目光可借反射写，但需有视线停留物、真正目标和附加感受三点；场景物属性应改变目光质地。
failure_boundary: 若人物公开直视并直说、目标毫无被识破感，反射路线显得多余；真实热量并未由视线传递。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 维德借谈云天明留恋之物暗中指向程心、使她感到被识破和灼痛的目光
vehicle: 一道光先撞上燃烧雪茄的暗火，再反射向目标，并携带火焰热量灼到身体
ground: 注意从表面对象转向真正目标；视线虽不直视仍传递锐利压力和被揭穿的不适
