chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 智子把她带回了过去
sensory_mapping: 智子一鞠躬，程心像被牵过千万年长廊，回到茶道、威慑与地球仍在的旧日房间。
context_fact: 智子容貌不变，以熟悉礼仪和语句欢迎程心；大宇宙年代已远离当年。
image_mechanism: 带回把记忆唤起写成空间移动，智子既是回忆触发物又像跨时间向导。
property_alignment: 智子对应引路者；旧外貌礼仪对应路标；记忆恢复对应抵达过去；两千万年对应长距离；当前小宇宙对应临时旧地。
context_alignment: 程心一生由冬眠不断跳时，心理‘回到过去’与她熟悉的实际时间迁移形成微妙重叠。
narrative_function: 让智子出场承载全部旧史，并突出小宇宙独立时间线带来的年代失准。
transfer_rule: 人物把他人带回过去时，应提供可触发的声音、姿态、物件或共同记忆，并说明现实时间仍前行。
failure_boundary: 程心没有物理返回过去，智子也是数据体的新实例；重返只发生在记忆和感受中。
