chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 把威慑控制权交还给罗辑，就像扔出一块滚烫的铁
sensory_mapping: 发射开关变成红热铁块，机构的法律手掌一接触便冒热，十八小时后猛然甩回罗辑。
context_fact: 集体机构发现无法承担按下广播按钮的个人终极责任，且短暂移交已给敌人可乘之机。
image_mechanism: 滚烫同时解释危险与急速交还，扔出而非郑重移交暴露制度逃避责任的本能。
property_alignment: 控制权高风险对应铁块高温；机构心理压力对应灼痛；快速交回对应本能甩手。
context_alignment: 威慑装置本需有人长期握住，热铁模型说明为何一般组织无法稳定持有。
narrative_function: 以身体反射概括十八小时政治失败，证明执剑人个人制度的必要性。
transfer_rule: 权力如热物时，应有持有收益、接触代价和快速脱手动作；温度对应责任压力而非对象道德。
failure_boundary: 若机构从容长期掌控、风险可分摊或交接按计划完成，滚烫甩手会误写决策过程。
