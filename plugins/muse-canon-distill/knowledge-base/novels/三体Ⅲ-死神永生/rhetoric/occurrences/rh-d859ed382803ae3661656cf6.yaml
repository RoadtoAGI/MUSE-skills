chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: “星环”号从冥王星和它的卫星卡戎之间穿过，这两个天体相距如此之近，有穿过峡谷的感觉
sensory_mapping: 冥王星与卡戎像两面无边暗壁，星环号沿中间缝隙飞驰，仿佛钻出一条宇宙峡谷。
context_fact: 两天体构成双星式系统，逃亡飞船在其间形成移动星点，推进光照亮卡戎表面。
image_mechanism: 峡谷把没有上下方向的天体间隙变成地貌通道，为近距离尺度与两侧表面压迫提供身体经验。
property_alignment: 冥王星卡戎对应峡谷两壁；近距表面对应高崖；中间空间对应谷道；飞船穿越对应沿谷飞行；暗冷地表对应岩壁。
context_alignment: 离开冥王星既是物理穿谷也是叙事出谷，越过后两人第一次看见二维太阳系全貌。
narrative_function: 给星环号离开守墓世界设一道可感门槛，并组织混杂逃亡飞船的空间位置。
transfer_rule: 天体夹缝比作峡谷时，应交代两侧体量、相对间距、表面质感、穿越方向和出口景象。
failure_boundary: 天体间距离仍是天文尺度，没有岩壁、谷底或大气；峡谷只是相对视觉构型。
