tenor: 保持理性的各学科研究者持续投入高强度、受阻却不停止的安全声明研究
vehicle: 旅人冒着风吹雨打赶路，不因恶劣天气停歇，向明确目的地持续前进
ground: 过程漫长艰难；外部阻力多；行动连续；参与者有目标方向；结果尚未抵达
