chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 探索者们风雨兼程，试图找到具有坚实科学基础的安全声明发布方法
sensory_mapping: 各学科研究像一支赶路队伍，在宗教狂潮和理论障碍的风雨中携带模型前行，寻找可落脚的科学地基。
context_fact: 宗教复兴之际仍有大量研究者深入探索，但研究逐渐指向安全声明几乎不可能的结论。
image_mechanism: 风雨兼程把长期研究转成受天气阻挡的行路，方法是目的地，科学基础则像抵达后可站稳的地面。
property_alignment: 研究者对应旅人；困难争议对应风雨；持续研究对应赶路；有效方法对应目的地；证据基础对应落脚地。
context_alignment: 朝圣人群也在寻求救赎，理性探索者同样远行，但路线由祈祷改为科学，形成并列寻路方式。
narrative_function: 承认宗教之外仍有严肃研究，并以行程推进到共同的否定性结论。
transfer_rule: 研究如赶路时，应给出目的地、真实阻力、持续行动和可检验的抵达标准。
failure_boundary: 研究不是线性路线，失败也可能产生知识；风雨不应暗示所有反对意见都是外部阻碍。
