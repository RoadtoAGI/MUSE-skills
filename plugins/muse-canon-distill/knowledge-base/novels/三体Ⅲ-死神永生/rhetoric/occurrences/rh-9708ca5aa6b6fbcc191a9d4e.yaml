figure_type: metaphor
quote: 形成一个环绕城市中部的水环，成为城市的一条波光粼粼的腰带
sensory_mapping: 球城躯体；蓝色环带；波光闪面；腰际闭合；海水横天
context_fact: 北美一号为球形太空城，水因重力集中在赤道最低处，形成可乘艇环航六十多千米的水环。
image_mechanism: 整座球城先被看成一具圆浑身体，赤道海水随之收窄成束在腰际的亮带；波纹把静态几何环变成会闪动的装饰表面。
property_alignment: 球形城市对应身体；赤道对应腰际；环海对应腰带；环绕一周对应腰带闭合；水面波光对应带面亮饰；海带宽度对应腰带窄长比例
context_alignment: 程心正从内部学习不同太空城构型，身体尺度的腰带让反常的环海方位立即可视，也保留富裕商业城市的华丽感。
narrative_function: 用一条可见亮带概括球城水体布局，帮助读者建立封闭曲面世界的空间模型。
transfer_rule: 以服饰环带写大型环状地貌时，应让环带位于对象明确的中部、连续闭合、相对主体较窄，并有材质光泽强化轮廓。
failure_boundary: 水体散成多个湖泊、偏在极区、宽到覆盖大半城体，或不能从视觉上形成完整闭环时，腰带会误写位置与比例。
