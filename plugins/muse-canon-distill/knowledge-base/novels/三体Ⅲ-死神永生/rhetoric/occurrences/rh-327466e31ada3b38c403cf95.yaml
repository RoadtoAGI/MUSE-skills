tenor: 维德在门关后立即、突兀而有冲击力地宣布计划
vehicle: 扣动扳机后高速射出枪膛、直达目标的子弹
ground: 从蓄势静止到瞬间释放；速度快、方向明确且击中后造成强烈反应
