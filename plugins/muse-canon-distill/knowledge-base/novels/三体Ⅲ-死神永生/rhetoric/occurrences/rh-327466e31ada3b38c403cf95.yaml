chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 维德便像出膛子弹般地吐出一句话
sensory_mapping: 闭合橡木门像扣下扳机，嘴成为枪膛，短句以硬直轨迹射入会议室。
context_fact: 非相关人员离场、大门刚关，维德立刻宣布向三体舰队发射探测器。
image_mechanism: 门关提供发射时点，吐出保留口腔动作，子弹则给语言增加速度、穿透和不可收回性。
property_alignment: 此前等待对应弹丸在膛；门关对应触发；突然发言对应出膛；全场震动对应命中冲击。
context_alignment: 宣布内容本身是发射计划，语言如弹还与议题发生词义回声，使维德行动方式先于方案显现。
narrative_function: 用一记急促声响开启核心会议，确立维德先发制人、不留缓冲的领导风格。
transfer_rule: 语言借弹道写时，应有明确蓄势、触发点、短促句形和目标反应；内容若与发射相关，可形成受控双关。
failure_boundary: 长篇犹豫发言、语气柔缓或没有听众冲击时，子弹的瞬发与命中都不成立。
quality_assessment: exemplary
