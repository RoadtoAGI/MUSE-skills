tenor: 云天明微闭双眼、舒缓概述自己对人类无留恋的宣言
vehicle: 旁观者按顺序翻阅一份已经完成、总体凄凉的人生记录
ground: 说话者与经历保持距离；内容按回顾方式扫过而不再试图改变
