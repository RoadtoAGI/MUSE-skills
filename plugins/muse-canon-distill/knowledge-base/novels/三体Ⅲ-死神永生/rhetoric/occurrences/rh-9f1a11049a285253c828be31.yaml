chapter: 【危机纪元5-7年，阶梯计划】
figure_type: simile
quote: 仿佛在浏览自己凄凉的一生
sensory_mapping: 记忆成为可翻阅页面，微闭眼睛像看向内在屏幕，舒缓语气成为慢速浏览。
context_fact: 宣誓仪式上，他拒绝忠于人类，称自己没得到多少快乐、幸福和爱。
image_mechanism: 浏览降低即时情绪，把一生变成已归档材料；这种距离感使拒绝不是爆发报复，而是冷静结论。
property_alignment: 概括往事对应浏览档案；双眼微闭对应内视；语气舒缓对应旁观阅读；一生将尽对应记录完成。
context_alignment: 他已临终且被当作任务载荷，回顾姿态保留主体判断权，拒绝集体话语强加。
narrative_function: 用冷静回望增强宣言震动，完成主人公对人生归属的自我裁定。
transfer_rule: 人生回顾借浏览写时，应有终点意识、概括语态和旁观距离；激烈重演不适合低速阅读模型。
failure_boundary: 若人物情绪失控、细节逐幕重历或仍积极改写未来，浏览已完成记录会削弱现场性。
