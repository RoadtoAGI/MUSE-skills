chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 时空的薄膜在引力波中泛起一片涟漪，像风吹皱了暗夜中的湖面
sensory_mapping: 不可见时空变成夜湖薄面，十二秒振动像风掠过，黑色表面一圈圈皱起并奔向远方。
context_fact: 两舰通过全民公决启动引力波广播，死亡判决以光速传遍宇宙。
image_mechanism: 湖面将抽象度规扰动降为人人见过的波纹，风的轻微与后果的灭世形成冷静反差。
property_alignment: 时空连续体对应湖面；引力波源对应风；度规扰动对应涟漪；光速传播对应波纹外扩。
context_alignment: 舰内死亡之琴只响十二秒，舰外暗湖也只轻皱，宇宙级判决却由这几乎温柔的动作送出。
narrative_function: 把广播从按钮和震动切到宇宙尺度，并以平静画面完成两个世界命运转折。
transfer_rule: 波传播如水面涟漪时，应对应介质连续性、扰动源、外扩方式和观察背景。
failure_boundary: 时空不是二维液面，引力波幅度、维度和传播机制不同；湖面只提供形态直觉。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 引力波发射后在时空结构中向外传播的微小扰动
vehicle: 夜风掠过平静黑湖，使原本光滑水面起皱并向远处扩散波纹
ground: 连续承载面受外力扰动；局部起伏向外传播；背景黑暗而波纹本身细微
