tenor: 人类大规模离开地球后，城市、农田和其他人工地表因缺少维护而被野生植被持续覆盖
vehicle: 一支曾被逐退的力量重新发动领土进攻，越过边界并逐块夺回此前被对手控制的土地
ground: 自然生态对应收复者；人类设施对应占领区；植被扩张对应推进；大陆覆盖对应领土夺回；人口撤离对应守军退出；重新出现对应反攻
