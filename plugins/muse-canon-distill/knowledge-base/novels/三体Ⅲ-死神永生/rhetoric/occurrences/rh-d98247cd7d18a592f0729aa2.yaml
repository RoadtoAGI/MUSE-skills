chapter: 【掩体纪元11年，掩体世界】
figure_type: metaphor
quote: 只知道大自然在重新占领那里的一切，各个大陆都逐渐被森林和草原所覆盖
sensory_mapping: 森林推进；草原铺境；空城失守；大陆转绿；自然收复
context_fact: 地球只剩不到五百万人，多数居民迁入外行星太空城，各大陆正被森林和草原逐渐覆盖。
image_mechanism: 缓慢的生态演替被加速成一幅无声战线，绿色从荒废设施边缘向内推进；没有人物参战，却以覆盖面积显示领土易手。
property_alignment: 野生自然对应收复军；人类开发区对应旧占领地；人口撤离对应防线空缺；森林扩张对应进军；草原覆盖对应夺地；整个大陆返绿对应全面占领；“重新”对应自然曾在此存在
context_alignment: 人类把生存中心移出母星后，地球由政治中心降为普通城邦；占领意象同步翻转了人类与自然谁是土地支配者。
narrative_function: 用空间推进呈现母星被放弃后的巨变，为太空文明的繁荣补上一幅地球退场图。
transfer_rule: 以占领写生态恢复时，应有清楚的旧控制者撤离、可观察的扩张前沿、土地覆盖结果和前后主导权变化。
failure_boundary: 人类仍高强度维护城市、植被只是零星绿化，或生态变化来自人工造林而非自发生长时，重新占领会误写主导力量。
