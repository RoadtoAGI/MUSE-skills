quote: 这是地狱，让他跳进去吧
sensory_mapping: 事业地狱；深坑下跃；恶魔入内；火热压力；无路回身
context_fact: AA认为程心无力领导非法曲率研究，而维德虽是杀人犯和技术狂人，却具备完成事业的精神力量。
image_mechanism: 她把理想事业从星空愿景翻到地下刑场，执行它不再是登高而是下跃；对维德的辱骂又成为资格证明，只有“恶魔”能在地狱工作。
property_alignment: 非法研究对应地狱；项目接管对应跳入；风险折磨对应刑罚；维德对应恶魔；程心对应会被毁的常人；政治封锁对应坑壁；技术成功对应穿过地狱；责任对应罪责
context_alignment: 这不是否定光速理想，而是区分愿景与执行环境；AA支持交权，因为她相信维德能承担程心不能承受的黑暗手段。
narrative_function: 用粗暴地狱意象完成权力交接论证，刻画AA现实主义和对维德的矛盾信任。
transfer_rule: 用跳地狱写接手任务时，应有主动进入、持续高压、重大伦理或法律代价、退出困难和承担者特殊耐受力。
failure_boundary: 任务合法安全、压力短暂可控，或进入者可随时离开且无需承担他人伤害时，地狱会夸大职业困难。
