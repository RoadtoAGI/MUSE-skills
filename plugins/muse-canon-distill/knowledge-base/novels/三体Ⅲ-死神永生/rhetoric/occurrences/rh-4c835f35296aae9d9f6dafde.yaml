chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 他们像喝醉酒一样特别多话，无所顾忌地向身边的人倾诉自己的隐私
sensory_mapping: 监视消失像酒劲上头，长期绷紧的舌头一下松开，人们把秘密接连倒给身边人。
context_fact: 人类已被智子持续监视近三个世纪，封闭小室第一次提供确定不被窥看的空间。
image_mechanism: 醉酒提供解除心理阀门的熟悉生理模型，使自由过量后的失控立即可感。
property_alignment: 屏蔽解除审查对应酒精解除抑制；多话对应醉后健谈；倾诉隐私对应失去边界；综合征对应短时异常状态。
context_alignment: 狭窄带电房间被称作天堂，醉酒喻体补足这种物理不适与心理自由的反差。
narrative_function: 量化长期监视对人格的塑形，并说明屏蔽技术带来的社会心理震荡。
transfer_rule: 心理解禁比作醉酒时，应匹配抑制下降、语言增量、边界丧失和短时反常。
failure_boundary: 屏蔽者没有摄入酒精，也未必判断或运动失调；喻体只覆盖言语去抑制。
