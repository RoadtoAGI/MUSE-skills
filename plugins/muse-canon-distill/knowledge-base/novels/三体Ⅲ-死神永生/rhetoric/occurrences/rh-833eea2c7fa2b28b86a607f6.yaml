chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 饕餮鱼纷纷游进泡沫浮在其中，像躺在雪白的毛绒毯上一样享受着无与伦比的舒适惬意
sensory_mapping: 雪白绒毯；柔软包裹；黑鱼躺卧；身体下陷；舒适静止
context_fact: 公主把香皂浸入海水，泡沫在船尾膨胀，饕餮鱼一进入便变得温顺惬意。
image_mechanism: 海面泡沫压实成一床厚毯，凶鱼从水下跃入后像疲惫身体落进绒毛，黑色轮廓横陈其上；危险动作被躺卧姿势替换。
property_alignment: 泡沫对应毛绒毯；白色对应雪色；细密气泡对应绒毛；鱼身漂浮对应躺卧；泡沫承托对应床毯支撑；麻痹惬意对应放松休息
context_alignment: 童话先用无骨解释鱼的内感受，再用毛毯提供外部触感，使香皂通道显得柔软而安全。
narrative_function: 把克制怪鱼的机制可视化，也将死亡之海暂时改造成舒适航道。
transfer_rule: 用毛绒毯写泡沫承托时，应同时有厚白表面、细密柔软质感、横躺姿势和威胁动作消失。
failure_boundary: 泡沫稀薄快速破裂、对象在其中挣扎或被腐蚀时，毛毯会把危险触感误写为安逸。
quality_assessment: effective
