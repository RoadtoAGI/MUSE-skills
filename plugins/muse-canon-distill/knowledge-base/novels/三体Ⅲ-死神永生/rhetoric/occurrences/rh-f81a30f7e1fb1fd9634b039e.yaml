review_status: reviewed
tenor: 高速飞船前方密集银河星光因多普勒效应整体蓝移形成的广阔纯蓝星空
vehicle: 铺满视野、颜色纯蓝、由无数闪光波点组成且延伸无边的海洋
ground: 范围广阔；主色纯蓝；无数亮点汇成整体；表面似波动；包围观察者；看不到明确边界
