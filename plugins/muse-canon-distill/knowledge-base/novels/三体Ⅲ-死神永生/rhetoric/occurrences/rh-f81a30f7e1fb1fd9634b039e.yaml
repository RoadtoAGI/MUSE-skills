chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 航向的前方是银河系的星海，这时已经变成了纯蓝色。真的让人想起了海洋
sensory_mapping: 前方银河由无数蓝星汇成一片发光海面，飞船仿佛悬在蓝色星浪上方。
context_fact: 外部全景模式隐去舱体，程心和AA获得悬浮太空般的视角，前方光谱整体蓝移。
image_mechanism: 星海这个常用词在纯蓝光谱与无舱视角下重新字面化，银河真的取得海水颜色和包围感。
property_alignment: 密集星点对应波光；银河范围对应海面；蓝移对应海蓝；全景包围对应临海视野；航行对应横渡。
context_alignment: 她们刚逃离暗红二维死海，前方出现纯蓝银河海洋，死亡介质与未来介质以颜色分开。
narrative_function: 建立进入光速前的前后色彩轴，并把新航程方向赋予开放、清澈的空间感。
transfer_rule: 惯用“星海”要恢复鲜活，应让颜色、密度、观察方式、运动方向和前后景共同使海真正可见。
failure_boundary: 恒星并非连续水面，蓝色来自相对速度的光谱移动；海感随速度和显示视角改变。
quality_assessment: effective
