chapter: 【危机纪元5-7年，阶梯计划】
figure_type: metaphor
quote: 她仿佛是同自己追赶的东西短暂地接触了一下，那东西随即离开她，飘向另一个维度的时空
sensory_mapping: 寒气成为云天明留下的衣角，程心手指刚碰到便滑脱；手术完成化为维度门在她面前关闭。
context_fact: 她赶到时遗体已推走，大脑已密封冷冻；扑近造成气流吹散白雾，寒气一触即逝。
image_mechanism: 真实寒触提供短接触证据，维度漂离则把死亡与发射前的不可逆分离空间化；触觉先到，认知随后封门。
property_alignment: 扑向容器对应追赶；寒气拥抱对应擦到目标；白雾消散对应目标离手；死亡不可逆对应跨维离去。
context_alignment: 云天明未来将漂流深空，此处先在手术室从她的世界漂走，空间意象预演任务命运。
narrative_function: 把来迟一步的事实变成短触后永失的动作，触发随后悲伤之海。
transfer_rule: 追赶失落的喻体应有真实接触媒介、明确边界与不可逆越界时刻；短触越具体，永失越可信。
failure_boundary: 若程心仍可打开容器、叫醒云天明或接触持续，异维离去会夸大；寒气只是物理现象，联结属人物体验。
quality_assessment: exemplary
