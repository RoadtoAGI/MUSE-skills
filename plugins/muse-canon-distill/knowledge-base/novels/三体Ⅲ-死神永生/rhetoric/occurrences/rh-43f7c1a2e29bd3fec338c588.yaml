review_status: reviewed
tenor: 程心扑近液氦容器时短暂触到寒气，随即意识到云天明已不可追回
vehicle: 追赶者终于擦到目标边缘，目标却立即脱手并飘入无法进入的异维时空
ground: 接触极短且只触及外缘；目标随后跨越不可逾越边界，追赶彻底失败
