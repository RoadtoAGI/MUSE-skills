tenor: 程心看到肥皂驱动纸船后瞬间理解这可能暗示曲率驱动，原本分散线索突然形成清晰解释
vehicle: 黑暗空间被一道突发闪电瞬间照亮，隐藏地貌同时显形，亮度强烈却持续极短
ground: 未知问题对应黑暗；顿悟对应闪电；线索结构显现对应地貌被照；发生突然对应电光爆发；兴奋强烈对应高亮；必须立即隐藏对应闪光短暂
