chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 多出来的人会被压成肉饼的
sensory_mapping: 人体压扁；重力压具；肉饼薄片；舱内高压；多员无位
context_fact: 星环号只有五个深海液舱位，逃往木星需使用足以要求液体保护的最大加速度。
image_mechanism: 技术术语“过载”被压成最残酷的厨房结果，人体不再有骨骼和身份，只剩可挤压肉质；这让多带一个孩子的伦理愿望遭遇物理硬限。
property_alignment: 乘员身体对应肉；飞船加速度对应压板；缺液舱对应无缓冲；器官组织对应肉纤维；过载形变对应压饼；死亡对应形体破坏；座位上限对应压具容量
context_alignment: 教师要求带走全部孩子，AA用粗粝比喻切断幻想，说明选择三个并非冷酷配额而是不可绕过的身体机制。
narrative_function: 以冲击性结果快速解释深海液舱限制，把逃生选择从道德争执落到物理事实。
transfer_rule: 用压成肉饼写过载时，应有极高加速度、人体缺少均匀压力保护和真实组织形变风险。
failure_boundary: 加速度温和、乘员有抗荷座椅或液体保护，或只是拥挤不适时，肉饼会无端制造血腥。
quality_assessment: conventional
