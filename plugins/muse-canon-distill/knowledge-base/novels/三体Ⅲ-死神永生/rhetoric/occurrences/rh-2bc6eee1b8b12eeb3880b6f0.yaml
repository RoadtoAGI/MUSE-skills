tenor: 没有深海液保护的额外乘员在星环号最大加速时将承受远超人体极限的过载并被致命压扁
vehicle: 柔软肉块在巨大平面压力下被挤成扁薄肉饼，原有立体结构彻底破坏
ground: 人体对应肉块；高过载对应压具；组织破裂对应肉被挤散；身体变扁对应饼形；无防护对应直接受压；死亡对应食材失去生命结构
