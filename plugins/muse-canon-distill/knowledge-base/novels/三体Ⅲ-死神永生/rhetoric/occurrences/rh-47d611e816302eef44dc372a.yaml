chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 它们的牙齿虽小，但像金钢石一样坚硬
sensory_mapping: 细小黑鱼；亮硬齿尖；钢剑缺口；钻石刃面；刺耳咬合声
context_fact: 商人在集市把剑伸入铁桶，抽出时剑刃已被咬成锯齿，鱼牙后来被用作钻头。
image_mechanism: 不起眼的小牙在铁桶黑水中获得宝石级硬度，咬合声像无数钻石刀头同时啃钢；体型与破坏力的比例被骤然放大。
property_alignment: 饕餮鱼牙对应金刚石；咬钢能力对应切削硬度；牙尖对应钻石刃口；制成钻头对应工业用途；自身不碎对应耐磨性
context_alignment: 童话先以市场奇物展示诱惑，宝石般硬度解释人们为何大量进口，也预埋生态灾难的破坏机制。
narrative_function: 用熟悉的极硬材料量化怪鱼牙齿，为其咬碎大船建立可信尺度。
transfer_rule: 用金刚石写小型齿刃时，应提供被切材料、耐磨结果、尺寸反差和后续工具用途作为硬度证据。
failure_boundary: 对象只显得锋利却实际易碎、靠毒液或力量而非材料硬度破坏时，金刚石会误判机制。
