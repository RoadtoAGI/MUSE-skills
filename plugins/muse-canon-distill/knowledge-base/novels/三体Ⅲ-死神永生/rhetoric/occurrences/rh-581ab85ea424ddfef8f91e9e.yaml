chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 那幕景象像被烙铁烙在她心中
sensory_mapping: 红烙铁；心口焦痕；灼痛记忆；深印不退；旧伤复热
context_fact: 程心再次面对维德和可能攻击太空城的决策，回想他曾为夺取执剑权朝自己开枪。
image_mechanism: 视觉画面由信息变成灼热器具直接压入心脏，时间只能让肉体老去，却擦不掉高温烧出的凹痕；当前危险再次触碰伤处。
property_alignment: 枪击画面对应烙铁；创伤冲击对应高热；记忆固定对应烙印；内心对应皮肉；长期清晰对应疤痕不褪；再次恐惧对应旧伤触痛
context_alignment: 维德精神核心像露岩般未变，程心的旧创也未变；两种持久性在重逢决策中正面相撞。
narrative_function: 让历史暴力以身体痕迹重返当下，说明程心判断维德会开战的心理证据。
transfer_rule: 用烙印写记忆时，应是一次高强度事件，画面长期保持清晰，并在相似处境下带回近似疼痛或警觉。
failure_boundary: 记忆只是反复学习的中性知识、细节已模糊，或人物没有持续情感创伤时，烙铁会过度戏剧化。
