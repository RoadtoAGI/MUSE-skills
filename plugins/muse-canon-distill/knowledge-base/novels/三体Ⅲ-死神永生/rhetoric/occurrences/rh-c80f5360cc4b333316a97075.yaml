chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 只有地球才配得上这样的花环
sensory_mapping: 巨型雪花沿母星边缘串成白色花冠，像宇宙在地球遗像周围放下一圈葬礼花环。
context_fact: 地球海洋在二维空间冻结成四五千千米雪花，罗辑以欣赏语气评价这一奇观。
image_mechanism: 花环把未知结晶现象赋予葬仪意义，精美装饰既抚慰观看者，又确认母星已经成为被悼念者。
property_alignment: 雪花对应花朵；冰环对应环编；地球对应受献者；洁白精美对应仪式装饰；行星死亡对应追悼。
context_alignment: 小行星带先成为太阳系项链，地球再获得花环；毁灭产生的装饰最终落到葬礼语境。
narrative_function: 让罗辑以审美节制承受母星死亡，并引出其余两人的悲伤终于降临。
transfer_rule: 自然环带写成花环时，应对齐组成单元、环绕方式、受献对象及庆典或葬仪的具体语境。
failure_boundary: 雪花不是有意献上的花朵，也没有宇宙悼念者；仪式含义来自人物观看和地球结局。
