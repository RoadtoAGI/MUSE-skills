chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 太阳与下面的弯月似乎构成了一个宇宙中的巨型符号，程心觉得它象征着新生
sensory_mapping: 金色圆点悬在明亮蓝月牙上方，黑太空成为碑面，两个天体像刻出一枚新生徽记。
context_fact: 日出时地球其余部分隐入阴影，只剩明亮下弦月形与上方太阳同时可见。
image_mechanism: 符号化删去天体细节，只保留圆与弯月，程心便能把个人情绪投射到一幅极简宇宙图标。
property_alignment: 太阳圆盘对应符号圆点；地球亮弧对应弯形笔画；黑空对应符号底面；会面新机会对应新生释义。
context_alignment: 这份新生是程心的主观解释，紧随金蛋孕育图像，视觉母题一致而判断来源清楚。
narrative_function: 为地球日出段落点题，并将程心从死亡欲望转向会面使命的心理变化外化。
transfer_rule: 自然构图成为符号时，应先简化可见形体，再交代解释者、抽象含义及当前情节为何激活该含义。
failure_boundary: 宇宙没有预设这枚符号，其他观察者可能赋予不同意义；新生不能保证会面或人类获救。
