tenor: 太阳圆盘与被照亮成弯月形的地球在视野中组成的图形，以及程心赋予它的重新开始含义
vehicle: 刻在宇宙背景上的巨大象形徽记，以圆与弯月的组合直接表示诞生和新的周期
ground: 两个简单形体组成可辨图案；尺度宏大；图形超越写实对象而承载抽象意义；由观察者主动解读
