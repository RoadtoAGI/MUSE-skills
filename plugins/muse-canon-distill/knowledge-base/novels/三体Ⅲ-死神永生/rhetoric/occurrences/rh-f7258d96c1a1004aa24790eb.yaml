chapter: 【时间之外，我们的宇宙】
figure_type: simile
quote: 时间一天天过去，像那条小溪中的水，平静而流畅
sensory_mapping: 日子沿麦田边缘缓缓流过，像溪水一段接一段离开脚边，几乎听不到转折的声响。
context_fact: 两人在647号宇宙已适应生活，学习三体文字并照料田地，直到麦田第二次成熟。
image_mechanism: 场景中真实小溪为时间提供就地可见的流动模型，水势平缓同时规定这段生活的节奏与情绪。
property_alignment: 每日连续对应水流连续；时间不可逆对应水向前；生活安稳对应水面平静；日程顺畅对应河道无阻；逝去对应水离开视野。
context_alignment: 小溪是二人常坐之处，喻体取自他们当下田园而非抽象钟表，使安居时间具有封闭世界的地方性。
narrative_function: 用一句缓流压缩数月生活，并为关一帆夜间忧虑打破平静蓄势。
transfer_rule: 时间写成水流时，要让具体水体的速度、声响、河道和人物生活阶段一致，才能更新常见意象。
failure_boundary: 时间没有物质流向，人物也可回忆过去；溪水的平静只覆盖危机出现前这段生活。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 程心和关一帆在小宇宙中学习、耕种和共同生活的日子持续向前
vehicle: 田园小溪中的水沿固定河道安静、连续、无阻滞地流走
ground: 持续单向前行；日日相接；表面平静；节奏均匀；难以截留；融入周围生活；没有突发波折
