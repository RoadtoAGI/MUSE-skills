tenor: 程心眼中的威慑纪元人类社会，以及她对全体人类萌生的保护性母爱
vehicle: 怀中温暖柔软、会微笑却完全依赖成人保护的婴儿
ground: 对象惹人爱怜且缺乏自保能力；照护者因亲密接触承担不可推卸的保护本能
