chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 她感觉自己抱着整个世界，这个新世界就如同怀中的婴儿般可爱而脆弱
sensory_mapping: 柔软小脸扩张为整个新世界，婴儿的体温传入社会形象，亿万人被收拢进她的双臂。
context_fact: 年轻母亲把宝宝递给程心，身体接触使她明确自己对新人类的感情是母性。
image_mechanism: 真实婴儿先提供触觉证据，再通过抱着整个世界完成尺度跃迁；脆弱性由抽象政治判断变成手臂可感的重量。
property_alignment: 社会美好对应婴儿可爱；威慑风险对应婴儿脆弱；程心保护欲对应母亲抱持；全人类依赖执剑人对应孩子依赖照护者。
context_alignment: 候选职位要求以毁灭威胁保护世界，程心却由母性理解职责，婴儿喻体准确解释她此后不愿伤害的决策倾向。
narrative_function: 显影程心竞选的情感动力，同时埋下母性与威慑所需冷酷不兼容的悲剧因果。
transfer_rule: 用婴儿写被保护对象时，应同时呈现可爱、脆弱和照护者的身体责任，并追踪这种亲密感如何影响艰难决策。
failure_boundary: 若对象能自主承受风险、照护者与其没有保护关系，婴儿会把真实能动性抹掉；母爱也不能替代威慑能力评估。
quality_assessment: exemplary
