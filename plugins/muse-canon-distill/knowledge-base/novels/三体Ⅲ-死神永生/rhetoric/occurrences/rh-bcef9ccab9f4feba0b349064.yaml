quote: 一块黑斑，迅速扩大，就像一张在蜡烛上方展开的纸被烧焦一样
sensory_mapping: 视野像一张铺开的亮纸，中央先烙出焦点，黑边带着烧蚀纹理向四周吞去。
context_fact: 她因精神和生理刺激短暂昏厥，醒后除黑暗外什么都看不见。
image_mechanism: 烧纸给失明安排可逐帧观察的扩散机制，使视觉消失从瞬断变成边缘逼近的物质过程。
property_alignment: 初始黑斑对应焦点；快速扩大对应烧焦蔓延；景象消失对应纸面被炭化；全黑对应整纸烧透。
context_alignment: 文明之火刚被说成墓中火苗，这一火此刻不照明而烧黑程心的视觉，形成残酷反用。
narrative_function: 精确记录功能性失明发生的主观顺序，并把读者一同关入黑暗。
transfer_rule: 感官遮蔽如烧蚀时，应对应起点、边界速度、原图损失和最终覆盖。
failure_boundary: 眼睛没有受火烧或纸张碳化，医学机制未由类比说明；若黑暗从周边收缩，方向会相反。
