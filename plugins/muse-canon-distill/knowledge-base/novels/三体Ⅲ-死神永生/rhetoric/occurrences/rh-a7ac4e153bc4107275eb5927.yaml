chapter: 【危机纪元4年，云天明】
figure_type: simile
quote: 闭着双眼像安详地入睡了一样
sensory_mapping: 不可见的心肺停止被暂时遮去，镜头只保留睡眠可见的闭眼、静止与松弛。
context_fact: 注射机输完药液，老李全程未动，随后监测曲线归零。
image_mechanism: 睡眠借共同外观把死亡程序变得平缓，却因读者知道不可醒来而产生静默反差。
property_alignment: 闭眼对应睡眠姿态；无动作对应熟睡静止；无痛苦表情对应安睡放松。
context_alignment: 这是安乐死制度首次展示，喻体准确呈现程序追求的无痛表面，也保留死亡事实。
narrative_function: 降低动作噪声，让注意力落在生命从有到无的细微界线。
transfer_rule: 死亡比作睡眠时，应只承载可观察的姿态与无痛状态，并由上下文清楚标出其不可逆，避免替代死亡判断。
failure_boundary: 出现抽搐、睁眼、痛苦表情或暴力创伤时，安详入睡不成立；它也不能推出死者主观体验。
quality_assessment: conventional
