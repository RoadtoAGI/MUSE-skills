chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 它像是卡在纵横交错的管道和线缆中的一只小鸡蛋
sensory_mapping: 球舱化成蛋壳，粗细管线织成卡槽，关一帆悬浮在蛋内，外界宇宙反而被管网挡在壳外。
context_fact: 观测站只是窄小球舱，却供研究宇宙的关一帆连续工作生活多年。
image_mechanism: 鸡蛋借几何形状完成第一层识别，卡在管线中又加入机械受困感，解释空间最小与研究对象最大之间的反差。
property_alignment: 球形舱对应蛋形；舱壁包裹对应蛋壳；管线纵横对应卡住蛋的网；站体窄小对应小鸡蛋。
context_alignment: 医生借实景诊断幽闭恐惧，喻体把病因直接放在患者居住结构上，具有现场可验证性。
narrative_function: 用一眼可见的物象缓释专业诊断，也使关一帆的压缩感在环境层得到印证。
transfer_rule: 建筑如蛋需同时匹配封闭曲面、相对尺度和外部夹持结构；形似之后还应服务人物的空间处境。
failure_boundary: 舱体有宽阔开口、棱角分明或能在管线间自由移动时，蛋壳与卡住两层都会失真。
