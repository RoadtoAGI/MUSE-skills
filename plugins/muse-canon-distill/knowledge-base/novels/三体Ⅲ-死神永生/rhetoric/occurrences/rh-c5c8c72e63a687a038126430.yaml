tenor: 远处围绕太空电梯终端站分布、实际体量庞大的各式太空建筑
vehicle: 摆在儿童模型陈列架上的小型精致玩具，形状多样、轮廓清楚且可似乎用手拿起
ground: 远距使体积缩小；各对象造型不同；细节精巧；缺少地面尺度参照会误判大小
