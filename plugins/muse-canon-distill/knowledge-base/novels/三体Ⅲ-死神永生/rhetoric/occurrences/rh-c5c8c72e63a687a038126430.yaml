chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 形状各异，远远看去像一件件精致的玩具
sensory_mapping: 巨型轨道建筑在黑空中缩成小巧模型，一件件仿佛能摆上桌面，近掠时才骤然恢复庞大。
context_fact: 程心接近终端站，远看建筑精巧微小，只有从近处掠过时才能感到真实规模。
image_mechanism: 玩具利用远距透视和无参照环境制造尺度错觉，精致不只赞美设计，也预备近处巨物反转。
property_alignment: 远距建筑对应小玩具；形状各异对应模型套装；精细轮廓对应做工；近掠庞大对应尺度错觉破除。
context_alignment: 程心第一次进太空，缺少经验参照，玩具是地球日常尺度自动套用到轨道景观的结果。
narrative_function: 表现太空尺度的欺骗性，并在轻巧远景与终端站扑天盖地压下之间制造递进。
transfer_rule: 巨物如玩具时，应设置观察距离、缺失参照、精巧外形和近距纠正四个环节。
failure_boundary: 建筑不是供玩耍的缩尺模型，实际质量和危险都巨大；近距离后玩具感立即失效。
