chapter: 【广播纪元7年，程心】
figure_type: metaphor
quote: 成为近地轨道太空建筑业的巨头
sensory_mapping: 众多轨道建筑企业像地面人群，程心公司成长为高出其上的巨人，手臂伸向更多工程。
context_fact: AA在六年间运作公司使其飞速发展，而程心因冬眠和抑郁几乎未参与。
image_mechanism: 巨头把市场规模和支配力写成身体尺寸，头部高出群体同时暗示行业领头位置。
property_alignment: 公司规模对应巨人体形；行业影响对应力量；领先地位对应高度；大型项目能力对应长臂范围。
context_alignment: 巨头的庞大与AA看起来不像首席执行官的轻盈年轻形成反差，突出外观无法显示经营重量。
narrative_function: 用惯常商业隐喻压缩六年发展成果，把AA的能力置于程心停滞旁边。
transfer_rule: 组织如巨人时，应说明比较群体、规模维度、支配能力和可观察的领先结果。
failure_boundary: 公司没有身体，规模大也不保证效率或道德优势；巨头只概括行业体量与影响。
