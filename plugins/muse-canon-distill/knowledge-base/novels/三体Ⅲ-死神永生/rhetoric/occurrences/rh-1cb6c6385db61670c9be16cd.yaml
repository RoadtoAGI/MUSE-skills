tenor: 程心公司在近地轨道太空建筑行业取得规模巨大、影响力领先的地位
vehicle: 体形远超普通人的巨人，以力量和高度压过周围较小个体
ground: 相对规模突出；拥有更强资源与行动能力；在同类中醒目；能够影响行业格局
