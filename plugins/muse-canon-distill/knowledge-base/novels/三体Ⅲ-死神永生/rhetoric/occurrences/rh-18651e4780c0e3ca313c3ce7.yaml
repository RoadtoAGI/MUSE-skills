chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 地面触到她的后背，仿佛是大地在她背后直立起来一样
sensory_mapping: 她未感到自己下坠，只见天空滑开，沙地像一面大陆尺度墙壁从背后立起并撞住身体。
context_fact: 智子宣告食人计划后程心天旋地转、失去意识并向后倒下。
image_mechanism: 交换身体与环境运动，将昏厥的失控写成世界翻转，准确遵循她当时无法意识自己倒下的视角。
property_alignment: 身体后仰对应大地竖起；后背着地对应墙面接触；视野旋转对应世界翻转；失去自主对应环境主动逼近。
context_alignment: 程心刚感到社会踏入中世纪、天空黑化，物理参照系也在此刻彻底倒转，内外崩塌同步。
narrative_function: 从大会信息切入身体昏厥，以反常运动启动失明体验。
transfer_rule: 倒地可反写为地面运动，但须严格依据主观坐标、接触部位和视野滑动。
failure_boundary: 大地客观未动；人物若清楚感到自己摔落，环境主动竖起的错觉会失去视角依据。
