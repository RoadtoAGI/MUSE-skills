tenor: 程心昏厥倒地时因自身旋转而感到地面突然从后方迎上
vehicle: 原本水平的大地整体翻转九十度，在人背后竖成一堵巨大墙面
ground: 接触方向由脚下变为背后；视野与身体坐标迅速旋转；巨大平面突然占据支撑位置
