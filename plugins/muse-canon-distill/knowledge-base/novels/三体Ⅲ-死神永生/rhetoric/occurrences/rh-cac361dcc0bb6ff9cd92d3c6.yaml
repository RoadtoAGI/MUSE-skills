chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 他的目光有些恍惚，像在梦游
sensory_mapping: 目光失焦提供意识缺席的表征，站立和汇报则保留梦游者仍在行动的矛盾状态。
context_fact: 法扎兰带回完整大脑，表情显示成功，精神却仍受无损取脑的见闻冲击。
image_mechanism: 人已回到书房、心还停在地堡的分裂被压进梦游状态，恍惚成为意识落后于身体的过程。
property_alignment: 失焦目光对应梦游者对环境反应迟钝；机械完成汇报对应睡眠中仍可行动；精神滞留对应意识未完全苏醒。
context_alignment: 他是事件见证者，却先以失常神态替超自然事实作证，使皇帝尚未看到细节便感到冲击。
narrative_function: 用见证人的后效反应预热揭示，延迟信息同时提高可信度和恐惧。
transfer_rule: 表现震惊后的意识脱节，可选能解释行动继续而认知迟到的状态，并在前后文同时给出外部任务与失焦迹象。
failure_boundary: 若法扎兰言辞敏捷、目光稳定并主动控制谈话，梦游所需的身心分离不存在；单纯疲倦也不足以支持此喻。
