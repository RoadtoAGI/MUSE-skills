chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 晨空像是晦暗的海洋，那几缕被朝阳映红的薄云像飘浮在海面上的血
sensory_mapping: 抬头的天空压低成浑暗海面，几缕红云失去云体，化作被水拉长的血丝。
context_fact: 程心正在倒下，视野被天空占满，极端刺激即将使她视觉黑斑扩展。
image_mechanism: 海洋给占满视野的天空增加深度和淹没感，血迹则把自然朝霞改写成屠杀预兆。
property_alignment: 无边晨空对应海面；晦暗颜色对应深水；薄云漂移对应水面浮物；朝红对应血色。
context_alignment: 智子刚要求人类互食，会场影子与坟墓已充满死亡，朝霞因此被程心读成漂血而非新生。
narrative_function: 把客观日出污染为血海图景，并在视觉被黑暗吞没前给出最后彩色画面。
transfer_rule: 天空如海时，应匹配平面、深度和其上漂浮物；颜色变化可承担情节语境。
failure_boundary: 云与血的材质运动不同，红色来自朝阳；若天空明净蔚蓝，晦暗血海会无现场依据。
