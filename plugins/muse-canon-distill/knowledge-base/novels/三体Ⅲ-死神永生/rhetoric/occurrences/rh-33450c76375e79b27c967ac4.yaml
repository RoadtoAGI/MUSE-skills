chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 它此时不再像纸条，而像一小张透明膜
sensory_mapping: 舱内灯光穿过白平面，纸色褪去，只剩一层发着微光的薄膜浮在设备前。
context_fact: 背景光越强纸条越容易在视觉上消失，研究者只得调暗实验舱。
image_mechanism: 从纸到膜的改喻由光照条件触发，透明膜修正纸条名称造成的不透明、可触误导。
property_alignment: 二维平面对应膜片；透景对应透明；无厚度对应极薄；弱自发光对应膜面反光；小尺寸对应小张。
context_alignment: 人们仍沿用纸条称呼，新的膜形象显示语言习惯已落后于实验事实。
narrative_function: 细化纸条视觉性质，并为它在强光中隐形、难以监控增加操作困难。
transfer_rule: 同一物体改换喻体时，应说明观察条件变化、旧喻失效属性和新喻补足的感官证据。
failure_boundary: 它不是有材料厚度的膜，不能折叠拉伸或接触；比较仍停留在视觉层。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 进入明亮实验舱后显出高度透明、仅靠微光维持轮廓的二维物体
vehicle: 面积很小、薄到几乎看不见且能透出背后景物的透明膜片
ground: 外形为小平面；背景可透过；厚度难辨；边界需靠反光识别；材质视觉轻薄
