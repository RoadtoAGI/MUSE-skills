chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 在三维世界生活过的人，真的可能使自己生活在一张没有厚度的薄纸里吗
sensory_mapping: 立体的人和城市被压到纸面，所有深度被抽走，从侧面只剩没有厚度的一条线。
context_fact: 关一帆说维度攻击者会在发动前完成低维化改造，程心难以想象这种生活。
image_mechanism: 薄纸把抽象二维空间交给触觉和侧视经验，用‘生活在纸里’迫使读者感受身体结构被取消。
property_alignment: 二维空间对应纸面；失去第三维对应无厚度；二维物体线状外观对应纸侧边；生活受限对应只能沿纸面活动。
context_alignment: 程心以普通三维身体发问，日常薄纸比数学坐标更贴合她此刻的生理恐惧。
narrative_function: 把文明自我降维的技术命题转成身体无法承受的直观代价。
transfer_rule: 维度削减借平面物体呈现时，要写出被取消的方向、外观变化、运动限制和身体适配难题。
failure_boundary: 真实二维生命不会是被机械压薄的三维人，纸仍由三维物质构成且具有微小厚度。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 三维生命主动改造自身，进入只有两个宏观空间维度的世界并继续生活
vehicle: 身体和环境被压进一张零厚度薄纸，只能在纸面两个方向上存在和运动
ground: 失去厚度；运动方向减少；物体只能呈线形截面；原有身体结构无法容纳；空间被压平；生活规则根本改变
