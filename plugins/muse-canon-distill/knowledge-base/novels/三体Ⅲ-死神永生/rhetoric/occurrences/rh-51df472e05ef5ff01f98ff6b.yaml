chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 看上去像一个精致的圆形项链挂件，自己就是绘在这个小圆盘上的肖像
sensory_mapping: 球面把飞船压成掌心大小的透明圆牌，白衣程心成为牌面肖像，仿佛可从太空摘下挂到胸前。
context_fact: 会面结束前程心从智子镜面看见自己外表宁静，并想到这一形象会留在云天明记忆中。
image_mechanism: 尺度压缩与圆形轮廓把航天器改造成私人饰物，技术影像随即被转义为贴心保存的爱情纪念。
property_alignment: 球形艇对应圆挂件；透明舱内的程心对应盘上肖像；镜面缩像对应微型化；云天明记忆对应贴身珍藏。
context_alignment: 两人只能隔智子屏幕相见，挂件让不可携带的相会获得可随身带走的心理形态。
narrative_function: 在死亡审核前给离别留下可保存的视觉物证，并把宏大太空尺度收束到私人情感。
transfer_rule: 把载具写成纪念饰物时，应对齐轮廓、尺度、内部人物构图和被谁珍藏。
failure_boundary: 太空艇不会成为实物挂件，程心也不是静止肖像；这只表达镜面构图和记忆愿望。
quality_assessment: exemplary
