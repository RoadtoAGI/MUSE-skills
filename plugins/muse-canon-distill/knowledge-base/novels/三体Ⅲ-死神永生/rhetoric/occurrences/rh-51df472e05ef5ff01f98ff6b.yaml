tenor: 智子球面映出的透明圆形太空艇、艇中的程心，以及她希望被云天明珍藏的会面形象
vehicle: 可贴身佩戴的圆形项链挂件，圆盘内绘着所爱之人的微型肖像
ground: 外形小而圆；内部人物被缩成平面肖像；物件精致可珍藏；与亲密关系相连
