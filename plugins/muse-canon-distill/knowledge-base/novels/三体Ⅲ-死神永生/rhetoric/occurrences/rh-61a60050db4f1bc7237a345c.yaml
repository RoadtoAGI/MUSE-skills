sensory_mapping: 寒光刀刃；直线切口；外壳裂开；瞬间抵芯；无多余动作
context_fact: 两人八年后重逢，维德第二句话便追问是否连光速飞船也要遵从程心。
image_mechanism: 对话尚未形成表层，维德的话已收窄成刀口，一下划开礼节和旧情，露出最危险的政治核心。
property_alignment: 维德话语对应利刃；寒暄铺垫对应外壳；正题对应内部；快速提问对应切入；措辞短促对应锋薄；程心沉默对应被切后停顿
context_alignment: 他本人刚被写成圆石唯一锐处，利刃动作继续这一尖锐材质，但把关系属性落实为说话节奏。
narrative_function: 保持维德一贯声音，立刻启动两人围绕曲率飞船的主冲突。
