chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 人类社会像寒流中的湖面一样，一块接一块地冻结在极权专制的坚冰之下
sensory_mapping: 拥挤大陆化成湖面，饥饿与战争像寒流掠过，国家一块块发白变硬，最终连成无法破开的冰盖。
context_fact: 民众因生存危机放弃民主诉求，渴望强政府，各类法西斯和政教合一政权出现。
image_mechanism: 冻结将制度转变写成环境压力下的连续相变，坚冰的硬与静对应专制秩序和社会流动终止。
property_alignment: 人类社会对应湖水；生存危机对应寒流；各国转向极权对应分块结冰；专制巩固对应冰层连片变硬。
context_alignment: 澳大利亚正值热浪与沙漠，政治寒流反向覆盖社会，冷热反差强化精神环境骤变。
narrative_function: 概括多国制度同步倒退的速度和传播方式，为更古老政治僵尸复活铺路。
transfer_rule: 制度僵化如结冰时，应明确降温压力、局部起点、扩展次序和流动性损失。
failure_boundary: 政治选择仍有人为组织和反抗，不是温度决定的必然相变；坚冰也可能融化，不能暗示永久。
