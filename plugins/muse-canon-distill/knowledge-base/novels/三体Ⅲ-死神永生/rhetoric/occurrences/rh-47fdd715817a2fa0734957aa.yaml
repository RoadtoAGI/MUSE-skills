tenor: 澳大利亚各地社会在匮乏、战争和秩序需求中逐区域转向极权统治
vehicle: 湖面遭遇寒流后从局部结冰，冰块相连并最终形成覆盖水面的坚冰层
ground: 外部环境骤冷触发相变；变化从一处向相邻区域扩展；冻结后流动性和开放性消失
