chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 你还是在为责任活着
sensory_mapping: 小宇宙能供给空气、食物和永生等待，真正推动程心起身离开的却仍是责任，像她生命里不曾停下的引擎。
context_fact: 程心决定归还安全小宇宙的物质，即使外界已危险且个人留下不会单独决定总质量。
image_mechanism: ‘为……活’把抽象义务变成生命动力源，智子用‘还是’把当前选择与程心历次承担连成稳定驱动。
property_alignment: 责任对应动力源；持续生存对应机器运行；反复牺牲对应稳定供能；离开安全地对应动力输出；没有私人收益对应非享乐燃料。
context_alignment: 程心曾因责任保留生命而自认精神已死，此刻同一动力既被敬佩也被惋惜，人物弧线保持矛盾。
narrative_function: 用智子一句判断收束程心全书核心选择，并引出她自己的责任阶梯回忆。
transfer_rule: 人物为抽象价值活着时，应用跨时期的具体选择证明价值持续供能，并保留它对个人生活的代价。
failure_boundary: 程心也因爱、希望和关系而活，责任不是生理能源，更不能完整解释她的全部人格。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 程心再次把自身安全与幸福置于次位，以承担对大宇宙生命的义务作为继续行动和作决定的核心动力
vehicle: 生命体依靠一种能源、食物或目的维持活动，失去它便不再知道为何继续生存
ground: 行动有持续动力；动力来自单一核心；私人欲望让位；选择反复指向同一目的；维持生命与承担义务绑定；外人可从行为识别
