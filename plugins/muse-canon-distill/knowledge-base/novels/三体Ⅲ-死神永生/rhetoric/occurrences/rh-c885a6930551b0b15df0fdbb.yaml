chapter: 地球文明
figure_type: metaphor
quote: 隧道中亮着一排昏暗的小灯，它们发出的光被黑色的洞壁所吞噬
sensory_mapping: 每盏灯只撑起一小圈昏黄，圈外黑壁像张口把余光吃净，灯与灯之间重新合黑。
context_fact: 地下通道按地质纪年设计，灯光微弱、间隔很远，尽头深不可见。
image_mechanism: 吞噬给材料吸光赋予主动暴力，黑暗不再是缺光状态，而成了不断吃掉文明微光的实体。
property_alignment: 黑壁对应吞食者；弱光对应食物；吸收对应吞咽；暗区对应被吃空；灯列对应反复抵抗的小光源。
context_alignment: 宇宙中的二维区域正吞没太阳系，墓室洞壁在局部预演同一种黑暗吞噬，长明灯只保住小片空间。
narrative_function: 建立地下墓室的压迫感，并在罗辑登场前让文明保存工程呈现为微光对抗巨大黑暗。
transfer_rule: 光被吞噬的写法应说明吸收表面、光源强弱、消失边界和场景中更大吞没主题。
failure_boundary: 洞壁没有生命或食欲，光只是被吸收、散射不足；吞噬不表示能量物理消失。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 小灯的微弱光线落到不反光的黑色洞壁后迅速消失，无法照亮隧道间隔
vehicle: 黑暗洞壁像有口腹的生物，将到达的光整个吞入口中，不留外泄痕迹
ground: 光进入后不可见；吸收迅速；周围仍黑暗；承受者面积大；微小亮源无力抵抗；产生被夺走感
