chapter: 【掩体纪元11年，光速二号】
figure_type: metaphor
quote: 光速二号里没有人，是座……鬼城
sensory_mapping: 空城无声；蓝光鬼火；破壳黑巷；幽影滞留；来者发冷
context_fact: 光速二号围绕微型黑洞建造，项目停止后完全荒废，高Way的影像仍被认为冻结在事件视界上。
image_mechanism: “没有人”的工程设施被死亡传闻填满，黑洞间歇蓝光成了鬼火，仍可观测的人影让俗称获得实体幽灵；空白因此比有人时更拥挤。
property_alignment: 光速二号对应鬼城；撤离人员对应居民绝迹；黑洞蓝光对应鬼火；高Way视界影像对应幽灵；破损城壳对应荒废房屋；研究事故对应死亡传说；访客恐惧对应闯入禁地
context_alignment: 曹彬先以含混停顿说出“鬼城”，随后的蓝眼、荒原影子和永恒坠落逐项兑现称呼，使民间恐惧与物理奇观叠合。
narrative_function: 在进入前预设废城的情绪类型，并为黑洞科学故事加入幽灵叙事的悬念。
transfer_rule: 把废弃设施称为鬼城时，应提供无人状态、持续异常征象、与死亡相关的具体遗留物及旁观者传播的传闻。
failure_boundary: 城市仍有正常居民、异常只是一时停电，或没有任何死亡与残留主体线索时，鬼城只会成为廉价恐怖标签。
