chapter: 【掩体纪元67年，“星环”号】
figure_type: simile
quote: 她们继续在木星的黄色光晕中飘浮着，像在梦境中一般
sensory_mapping: 黄光梦境；身体悬浮；四肢无力；空间朦胧；醒梦未分
context_fact: 二人刚结束漫长冬眠，尚不能控制身体，也不知道所在位置，只能看见木星和太空城组合体。
image_mechanism: 冬眠造成的生理迟钝与真正失重叠加，醒来没有落地动作，身体仍保持梦中无支撑的漂游；木星黄晕又为白舱蒙上不现实色层。
property_alignment: 冬眠苏醒对应梦醒；失重对应梦中飞行；麻痹对应梦里动作无力；黄光对应梦境色调；未知位置对应梦中空间跳跃；缓慢漂浮对应梦态时间；信息未明对应现实模糊
context_alignment: 她们主动用冬眠逃过历史，把人生切成一次次睡醒；此刻“梦境”既写感官，也暴露她们与现实时间的断裂。
narrative_function: 延缓灾难信息揭示，让苏醒先停留在柔软不真实的过渡层。
transfer_rule: 用梦境写苏醒或失重时，应结合身体控制减弱、空间失向、光色朦胧和认知尚未确认，而非只因景色美。
failure_boundary: 人物已完全清醒、动作精准有力、环境照明清楚且位置明确时，梦境会无根据地模糊现实。
