tenor: 程心拒绝再考虑后，维德维持六十多年的光速理想、抵抗意志和生命精神突然失去活力
vehicle: 一团长期发光燃烧的火在燃料或空气断绝后暗下并彻底熄灭，再也不能复燃
ground: 目光亮度对应火光；理想对应火焰；长期意志对应持续燃烧；否决命令对应断氧；精神崩溃对应熄灭；不可逆放弃对应永不复燃
