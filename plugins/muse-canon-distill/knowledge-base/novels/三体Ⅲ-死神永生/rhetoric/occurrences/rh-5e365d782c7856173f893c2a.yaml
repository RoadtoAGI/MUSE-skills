figure_type: metaphor
quote: 他的目光黯淡下来，有什么东西熄灭了，永远熄灭了
sensory_mapping: 眼光暗去；内火熄灭；余烬无光；房间降温；永不复燃
context_fact: 维德请求程心再考虑遭拒，随后遵守承诺命令缴械，曲率驱动事业被永久停止。
image_mechanism: 维德的精神核心先借目光显亮，决定落下时亮度骤退，抽象信念像断氧火焰结束；重复“熄灭”把政策失败写成不可逆生命事件。
property_alignment: 维德目光对应火光；前进理想对应火焰；数十年坚持对应长燃；程心否决对应断氧；意志消失对应熄火；项目终止对应燃料耗尽；永久放弃对应无法复燃
context_alignment: 维德早被刻画为极端冷硬而有核心，此刻不用哭泣，只以目光失光显示核心死亡，符合其克制声音。
narrative_function: 在缴械动作前先宣告人物精神死亡，使其服从承诺带有自我献祭感。
transfer_rule: 用熄火写信念终止时，应先建立持续燃烧的目标或可见光亮，再给出切断其延续的决定和不可逆后果。
failure_boundary: 人物只是暂时疲惫、仍计划重启事业，或目光变化源于生理昏厥时，永久熄灭会过早封死后续。
