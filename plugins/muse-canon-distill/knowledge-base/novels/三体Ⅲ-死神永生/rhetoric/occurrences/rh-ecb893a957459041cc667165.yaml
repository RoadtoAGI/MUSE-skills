chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 地面上沉默的人海像一块大吸音毯，使茶厅中的寂静更深了
sensory_mapping: 数十万人铺在树下像深色厚毯，呼喊全部被绒面吞掉，连高处瓷器轻碰声也像沉入其中。
context_fact: 智子宣布将离开，朝圣者比往日多几倍，却不再祈祷欢呼，只在地面沉默等待。
image_mechanism: 吸音毯为主动沉默赋予声学作用，人群虽远在几百米下，密集无声仍像材料改变茶厅回响。
property_alignment: 人海平面对应大毯；密集个体对应纤维；集体无声对应吸音；茶厅压抑对应回响减少。
context_alignment: 人海框架在首处强调波动和声势，此刻海面凝固成毯，新喻体准确记录崇拜由喧闹转为失落。
narrative_function: 让地面群众无需对白便进入茶道场景，以加深寂静的方式参与最后告别。
transfer_rule: 沉默群体如吸音材料时，应匹配平面形态、密度、声波变化、空间距离和心理压迫。
failure_boundary: 人群并未真正吸收高处声波，茶厅静默主要来自人物行为；毯喻表达感知联动。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 别墅下方数量庞大却绝对沉默的朝圣人群，对空中茶厅造成的压抑静默感
vehicle: 厚大吸音毯覆盖空间，吞取消散声波和回响，使室内声音变钝、寂静加深
ground: 覆盖范围大；表面由密集单元构成；声音被吸收而非反射；沉默产生物理般压迫
