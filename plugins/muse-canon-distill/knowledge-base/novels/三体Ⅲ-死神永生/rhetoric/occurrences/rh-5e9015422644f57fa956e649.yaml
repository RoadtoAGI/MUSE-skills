tenor: 发动机加速产生的包压感原本让船员确信飞船正高速远离二维面
vehicle: 强大保护者用双臂紧抱众人并带着他们离开追来的威胁
ground: 身体被稳定包围；力量来源强大；移动方向远离危险；被保护者暂时无需自控；压力被解释为安全
