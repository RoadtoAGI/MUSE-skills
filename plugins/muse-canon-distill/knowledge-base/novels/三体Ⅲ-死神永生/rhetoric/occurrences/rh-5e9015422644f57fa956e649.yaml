chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 超重使人们有一种安全感，像是在某种保护力量的怀抱中逃离危险
sensory_mapping: 超重像粗壮手臂把人按进座椅，发动机轰鸣仿佛抱着整船向安全处奔跑。
context_fact: 导航随后证明飞船没有前进，空间流动抵消加速，保护感只是身体误读。
image_mechanism: 怀抱将惯性压力正面情感化，展示人类为何把过载自然等同于逃离成功。
property_alignment: 超重包压对应拥抱；发动机推力对应保护者力量；船员被固定对应怀中被抱；远离预期对应带走。
context_alignment: 此前程心经历过载也像手臂松开，此处同类触觉被赋予安全意义，随后被坟墓喻体反转。
narrative_function: 先建立错觉的舒适解释，使导航否定带来的窒息更剧烈。
transfer_rule: 压力写成保护怀抱时，应交代施力者、逃离方向、身体包围和安全判断是否可靠。
failure_boundary: 过载没有意志且可能伤人，不能证明位置改变；拥抱感正是误判。
quality_assessment: effective
