chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 球体渐渐变成半透明状，像一个大冰球般深不可测
sensory_mapping: 三四米球体像悬在艇前的巨冰珠，星光陷入层层冻雾，眼睛越向内看越找不到底。
context_fact: 全反射智子球先显出镜像，随后转半透明并在内部浮出雪花状白噪声亮点。
image_mechanism: 冰球利用半透明光学质感赋予二维智子表面以虚假体积，深不可测则连接其高维信息容量。
property_alignment: 球形智子对应冰球；半透明对应冰质；内部难辨对应光散射；冷亮表面对应冰面；异常深度对应厚冰。
context_alignment: 会面环境本应空旷无物，冰球突然挡住地球，以冷硬巨大介质切断程心与母星的直接视线。
narrative_function: 在图像出现前让通信载体本身成为奇观，并把等待信号的三分钟写成凝视深处。
transfer_rule: 半透明技术物如冰时，应匹配外形、光学散射、冷色、内部可见度和实际功能差异。
failure_boundary: 智子球没有低温、水晶格或实体厚度，深度可能来自显示机制而非内部空间。
