tenor: 智子低维展开形成的半透明球体，内部视觉纵深异常且无法看清结构
vehicle: 体积巨大的半透明冰球，表面冷亮，光线进入后被层层折射散射，看不透中心
ground: 外形近球；材质半透明；内部细节不可见；视觉深度远大于外部尺寸；颜色冷硬
