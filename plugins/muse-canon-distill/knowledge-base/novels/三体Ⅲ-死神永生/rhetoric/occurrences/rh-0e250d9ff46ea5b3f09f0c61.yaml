chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 他仍沉浸在胜利的幻想和狂喜中
sensory_mapping: 胜利幻想像温热液池漫过白艾思，他浸在狂喜里，丁仪的告别话语隔水传来仍显遥远。
context_fact: 他真心认为丁仪接触水滴危险不大，无法理解导师已在安排遗物和冬眠。
image_mechanism: 沉浸把认知偏差写成感官环境，乐观不是一个念头，而是阻隔其他证据的介质。
property_alignment: 胜利想象对应液体；狂喜包围对应浸没；风险信息对应水外声音；不信告别对应隔绝。
context_alignment: 两百年后研究者也被纸条无害外观包围，白Ice因记忆这次乐观误判而提前醒悟。
narrative_function: 说明师生对话为何未能改变历史，并建立当下判断转变的反面经验。
transfer_rule: 心理陶醉写成浸水时，应说明介质内容、包围程度、被隔绝证据和退出触发。
failure_boundary: 白艾思仍能听懂并记住谈话，不是完全失去外界感知；沉浸表示权重偏置。
