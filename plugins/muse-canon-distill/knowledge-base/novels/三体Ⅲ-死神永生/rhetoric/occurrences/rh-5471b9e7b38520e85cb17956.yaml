review_status: reviewed
tenor: 太阳接触二维面后，已展开部分面积迅速增大造成的远观体积增长错觉
vehicle: 恒星保持三维形态却由内部向外均匀胀大，半径和体积持续增加
ground: 外轮廓快速扩大；亮度同步增强；中心仍是同一恒星；远处看不清厚度变化；增长连续
