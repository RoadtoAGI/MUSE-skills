chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 从远距离看去像是恒星本身在膨胀
sensory_mapping: 遥远太阳的亮圆盘急速鼓大，远看像整颗恒星从内部充气，而非一部分摊进平面。
context_fact: 真实原因是太阳跌入二维的部分在平面扩展，三维太阳随后沉入广阔火海。
image_mechanism: 膨胀提供第一眼熟悉解释，后文清晰影像再纠正错觉，借认知落差呈现二维化的反常几何。
property_alignment: 二维直径增大对应半径膨胀；亮度增加对应能量增强；远距模糊对应无法分辨平面；连续扩展对应体积增长。
context_alignment: 文明曾误以为宇宙尺度意味着扩张与进步，太阳最后一次“变大”实际是维度和体积的丧失。
narrative_function: 从肉眼印象进入太阳二维化高潮，并清楚区分可见现象与物理机制。
transfer_rule: 视觉错觉类比应先记录观察尺度与共享现象，再及时交代真实机制和两者分歧。
failure_boundary: 太阳三维本体没有热力学式整体膨胀，面积增长来自二维展开；近距离或有厚度信息时错觉消失。
quality_assessment: effective
