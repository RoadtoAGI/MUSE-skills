chapter: 【威慑后第一年，移民完成后第六天清晨，澳大利亚】
figure_type: simile
quote: 暴雨般纷乱的脚步声
sensory_mapping: 成千双鞋底化成骤雨砸向广场，脚步点四处溅开，随后雨势沿街道迅速稀疏。
context_fact: 广播宣布可以离开澳大利亚，人群从市政厅前跑开办理疏散，程心只能凭听觉感知。
image_mechanism: 暴雨把不可定位的群体脚步拆成高频落点，雨势由密到疏又对应人群离场的时间变化。
property_alignment: 鞋底落地对应雨滴撞地；多人奔跑对应雨点密集；路线分散对应落点纷乱；声音稀疏对应雨势转小。
context_alignment: 上一句已把说话声写成落在声海上的暴雨，此处脚步继承降雨声纹，却将水面换成实体广场。
narrative_function: 仅凭声音完成广场清空的场面调度，并保持程心失明后的感知视角。
transfer_rule: 脚步如雨时，要匹配落点密度、敲击材质、移动带来的强弱变化，并避免只取喧闹一项。
failure_boundary: 脚步比雨滴更重且有共同逃离目的；若人数很少或步伐整齐，暴雨的随机密度便不合适。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 获准离开后，大批移民同时从市政厅前奔散所形成的密集杂乱脚步声
vehicle: 无数雨滴急促落地，撞击声彼此覆盖、难以分辨单点节奏的暴雨
ground: 声源数量多；敲击短促连续；整体密集而各点无序；强度会随人群散去而减弱
