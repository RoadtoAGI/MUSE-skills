chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她盯着程心，像要用眼神把她死死抓住似的
sensory_mapping: 紧扣手指；不移视线；目光钩爪；身体被拉住；泪水中的抓握
context_fact: 夏令营孩子的穿梭机被别人占用，女教师湿着脸扑向程心，请她用公司飞船救孩子。
image_mechanism: 她先用手抓住程心，随后即使不再增加身体动作，视线仍从眼中伸出第二双手，扣住程心不让求救关系断开。
property_alignment: 女教师目光对应双手；注视方向对应伸手方向；凝视强度对应握力；急切求救对应猛抓；程心对应被抓对象；不许回避对应扣住不放
context_alignment: 教师正在替孩子争夺稀缺座位，语言可能被拒绝，眼神抓握把她无法强制对方的绝望转成身体压力。
narrative_function: 让求助的道德重量落到程心身上，为随后的选择困境加压。
transfer_rule: 用抓握写目光时，应有持续对视、明确诉求、目标欲离开或回避、强烈情绪和被注视者的压力。
failure_boundary: 目光短暂游移、没有请求关系，或人物主动放对方离开时，死抓会夸大控制意图。
