tenor: 与会者逐步理解维德把人送入三体舰队这一突兀、复杂设想的思考过程
vehicle: 先把坚韧食物慢慢嚼碎，再耐心寻找线头、逐圈解开被抛来的乱线团
ground: 整体最初难以吞咽和看清结构；理解依赖把内容拆小并逐步恢复内部关联
