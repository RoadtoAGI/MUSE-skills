chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 每个人都在艰难地咀嚼着他的想法，一点点解开他扔来的这个线团
sensory_mapping: 一句话在会议室落成缠结线球，众人的思维一边磨碎它的外壳，一边从线头向内拆解。
context_fact: 维德只说送一个人去，众人需自行推演冬眠、截获和人在敌舰中能做什么。
image_mechanism: 咀嚼强调接受阻力，解线团强调结构探索，两种连续动作把沉默中的集体推理具体化。
property_alignment: 想法荒诞难接受对应难嚼；命题浓缩对应整块食物；推论缠结对应线团；逐层理解对应解线。
context_alignment: 维德习惯只抛出核心命令让专家补全机制，线团由他扔来，解法却由众人共同完成。
narrative_function: 让无对白的思考保持动作感，并控制信息披露速度，使疯狂设想逐渐显出可行性。
transfer_rule: 写复杂观点被理解时，可区分接受难度与结构难度，分别选择分解和理线动作；推进需对应真实推论步骤。
failure_boundary: 简单明白或即时获认同的观点不需咀嚼解线；若讨论始终无解，也不能声称线团已被拆开。
quality_assessment: exemplary
