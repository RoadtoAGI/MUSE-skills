chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那一切仿佛就发生在昨天
sensory_mapping: 漫长冬眠被折叠成一个夜晚，探照灯、旋翼气流和救护车红光仍贴着当下广场重新出现。
context_fact: 她回到旧联合国总部，建筑和雕塑近乎原样，现场触发维德提出只送大脑的完整记忆。
image_mechanism: 地点复现先消除空间差，再由连续感官细节压缩时间；昨天不是泛指熟悉，而是被现场重新点亮的邻近一日。
property_alignment: 广场保存完好对应昨日场景未变；记忆细节密集对应近事鲜明；人生受其改变对应情绪仍在延续。
context_alignment: 冬眠让程心只经历有限主观时间，且旧址物质连续，二百七十年的客观跨度确实没有形成同等心理距离。
narrative_function: 把阶梯计划与当前执剑人选择连成一条个人时间线，唤回维德对她命运的影响。
transfer_rule: 用昨天压缩漫长岁月时，应提供保存现场、鲜明细节或未完情绪，说明何物跨过了客观间隔。
failure_boundary: 若记忆已经模糊、地点全毁或人物情感完全断裂，昨日感缺少支点，只会成为惯用夸张。
