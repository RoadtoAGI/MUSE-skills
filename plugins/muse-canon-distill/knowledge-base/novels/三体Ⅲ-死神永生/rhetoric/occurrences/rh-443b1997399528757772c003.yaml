figure_type: simile
quote: 对未来的希望像氢弹一样爆发开来
sensory_mapping: 希望火球；瞬间引爆；强光扩散；全球照亮；情绪冲击波
context_fact: 延时直播传回巨石整体仍存的结果，世界认为掩体行星能抵御恒星爆发。
image_mechanism: 物理氢弹在太空刚熄灭，它的爆炸形态转入公众心理；成功画面成为引信，积压的求生愿望从全球同时炸亮。
property_alignment: 模拟成功对应点火；公众心理对应爆炸物；希望释放对应核能释放；欢腾传播对应冲击波；信心强度对应亮度；全球范围对应火球覆盖；此前恐惧对应压缩能量
context_alignment: 用试验自身作喻体让物理事件与社会反应首尾相接，也暗示希望可能像爆炸一样强烈而短促。
narrative_function: 收束掩体试验的政治目标，显示技术演示立即转化为公众支持。
transfer_rule: 用爆炸写群体希望时，应有积压前态、明确引信、瞬时增幅、广域传播和强烈可见反应。
failure_boundary: 信心缓慢建立、仅影响少数专家，或公众仍普遍怀疑时，氢弹爆发会夸大共识。
