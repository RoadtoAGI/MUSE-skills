quote: 关一帆蔫了一些
sensory_mapping: 程心一句反驳像抽走水分，他刚才挺起的气势立刻低下去，只剩半蔫的承认。
context_fact: 关一帆批评太阳系人类不敢离乡，程心提醒万有引力号成员也是先做俘虏才被迫出走。
image_mechanism: 植物失水把口头气势下降转成可见姿态变化，单字完成争论力量反转。
property_alignment: 自信饱满对应植物挺立；反驳对应失水；气势下降对应叶片低垂；仍回答对应未枯死；短暂受挫对应部分蔫。
context_alignment: 场景正发生在田园和农地，植物词汇从环境自然进入人物动作，不显突兀。
narrative_function: 用轻微幽默解除尖锐文明争论，并恢复两人亲密交流。
transfer_rule: 情绪受挫写成萎蔫时，最好让场景已有植物语境，并用程度词控制打击强弱。
failure_boundary: 关一帆没有生理脱水，也未彻底失去观点；‘一些’限定为短暂气势下降。
