tenor: 罗辑五十四年独守执剑人岗位、在时间流逝和文明变迁中维持威慑姿态
vehicle: 海滩上沉重孤锚承受风吹浪击，固定原处等待一艘注定不再归航的船
ground: 主体长期孤立却稳定不移；外界时间持续冲刷，所等待的使命终点又可能永远不来
