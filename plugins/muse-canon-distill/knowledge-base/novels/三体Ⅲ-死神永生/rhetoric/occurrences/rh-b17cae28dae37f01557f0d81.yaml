chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 仿佛是海滩上一只孤独的铁锚，任岁月之风从头项吹过，任时间之浪在面前咆哮，巍然不动，以不可思议的坚定等待着一艘永不归航的船
sensory_mapping: 黑衣老人压成铁锚的倒丁字，白色大厅化为海滩，岁月变风、时间变浪，从他身上不断掠过和撞击。
context_fact: 罗辑端坐地下控制中心，握住广播开关，五十四年持续与三体世界进行沉默威慑。
image_mechanism: 锚的重量和固定功能解释坚定，风浪把抽象岁月拆成两种持续侵蚀，永不归航的船则赋予等待无终点的悲剧性。
property_alignment: 倒丁字坐姿对应锚形；意志坚定对应铁锚固定；时代流逝对应风浪冲刷；威慑交接未至对应等待归船；长期独居对应孤锚。
context_alignment: 他守护的是两个世界脆弱平衡，却不能主动驶向结果，只能固定在开关旁；锚的被动守位精确区别于航船行动。
narrative_function: 为罗辑执剑人生涯塑造终极形象，并把稳定、孤独、时间代价和无望等待压缩到同一海景。
transfer_rule: 写长期坚守可选固定器物，并让环境侵蚀、守护对象和等待终点各有对应；主体的职责应确实以不动为力量。
failure_boundary: 人物频繁离岗、主动追逐目标或使命已有明确短期终点时，孤锚与永不归航会误写行动方式和时间尺度。
