tenor: 太平洋一号裸露的球形内壁在近处铺展，局部曲率无法被眼睛察觉
vehicle: 一座没有边界感的开阔平面广场，地面平整并承接上方光影
ground: 球壁局部对应广场地面；不可见弧度对应平坦；目力所及延伸对应广阔；无建筑内衬对应空广场；上方建筑投影对应广场承接影子
