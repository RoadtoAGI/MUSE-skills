chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 在小范围内看不出弧度，像一片广阔平坦的广场
sensory_mapping: 平阔灰地；弧度消失；远处延伸；上空悬城；斑斓投影
context_fact: 城市边缘球壁保持建成初期的毛坯状态，附近没有建筑或土壤覆盖。
image_mechanism: 巨球的曲面因尺度过大在脚下视觉中展开成平面，悬空建筑反把墙面当成地面投下光影，完成方向感倒置。
property_alignment: 内壁对应地坪；巨大半径对应局部近似平面；裸露区域对应空旷场地；远伸墙面对应广场尺度；建筑阴影对应广场投影；观察者靠近壁面对应站在地面
context_alignment: 完全失重令球壁没有固定的墙或地身份，广场称谓准确承接程心在边界处重新建立的视觉水平面。
narrative_function: 把球形城市的巨大尺度转译为可步入的空间，并为随后满壁涂鸦提供画布。
transfer_rule: 用广场写大型曲面时，应限定在局部视野，交代曲率不可见、表面空旷、尺度延伸及上方投影等平面证据。
failure_boundary: 远景能看清完整球弧、表面陡折狭窄或被密集设施覆盖时，广场会抹掉真实曲率和边界。
