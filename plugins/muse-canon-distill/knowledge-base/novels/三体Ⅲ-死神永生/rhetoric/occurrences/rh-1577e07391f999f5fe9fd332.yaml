figure_type: metaphor
quote: 大脑中真实世界的图像正在被虚幻的想象一点点挤走
sensory_mapping: 脑内像一间逐渐变暗的放映室，现实画面被从四边压窄，声音唤起的海浪幻景不断占满银幕。
context_fact: 程心已经失明一段时间，只能凭市政厅前突然爆发的欢呼声推想周围发生了什么。
image_mechanism: 挤走把视觉记忆衰退写成空间争夺：真实和想象不再只是强弱变化，而像两组画面在有限视野内互相排斥。
property_alignment: 大脑表征容量对应有限空间；失明导致现实图像衰减对应原住物后退；声浪激发幻景对应后来者推进；逐渐失真对应位置被占。
context_alignment: 紧接着声浪被体验为太平洋涌起，挤占机制解释了程心为何会把听觉迅速组织成覆盖大陆的虚拟景象。
narrative_function: 先交代感知失真的生成条件，使随后夸张的海啸听觉图景具有人物生理依据。
transfer_rule: 写一种心理内容替代另一种时，可先确定共同承载空间，再落实推进方向、替代速度和被迫退出的内容。
failure_boundary: 大脑表征并非真正占据可测量的平面位置，现实记忆也没有完全消失；喻体只描述主观可用度的此消彼长。
