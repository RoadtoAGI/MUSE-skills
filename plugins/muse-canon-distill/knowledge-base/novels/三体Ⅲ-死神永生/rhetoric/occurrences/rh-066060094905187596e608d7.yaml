chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: analogy
quote: 低熵体笨拙地拨弹他们的星星，像母世界上古时代的游吟歌者弹起粗糙的墟琴
sensory_mapping: 手拨星弦；恒星发声；粗琴远唱；脉冲成歌；古老广播
context_fact: 歌者把罗辑时代的人类太阳放大广播称为“弹星”，其技术在母世界看来原始笨拙，却包含可译解信息。
image_mechanism: 恒星被缩成一件可拨乐器，光强调制成为琴弦振动；技术落差则把人类降为上古歌者，但广播因此仍带有歌与交流的审美价值。
property_alignment: 太阳对应墟琴；反射层调制对应拨弦；电磁脉冲对应琴音；广播者对应游吟歌者；早期技术对应上古粗糙乐器；信息内容对应曲调；跨星传播对应歌声远传；歌者解读对应听曲
context_alignment: 观察者本身名为歌者并爱把原始膜编成歌，音乐类比来自其文化认知，也解释他为何对人类通信产生兴趣。
narrative_function: 以异星音乐视角重述前两部关键广播事件，既压低人类技术等级又保留其可理解性。
transfer_rule: 把天体广播写成拨弦演奏时，应有可控周期调制、远距离传播、编码韵律和把操作者视为表演者的观察文化。
failure_boundary: 信号是一次无结构爆炸、天体不受发送者控制，或接收文明没有音乐与节律概念时，拨琴框架会误写机制。
quality_assessment: exemplary
