tenor: 人类利用太阳增益反射层调制恒星辐射，向宇宙广播带自译解系统的原始膜信息
vehicle: 母世界上古游吟歌者用手指拨动粗糙墟琴琴弦，以简陋乐器把歌谣传给远方听者
ground: 恒星对应琴弦或琴体；调制恒星对应拨弹；广播脉冲对应琴声；人类文明对应古代游吟者；原始通信技术对应粗糙古琴；自译信息对应歌谣；宇宙听者对应远方听众
