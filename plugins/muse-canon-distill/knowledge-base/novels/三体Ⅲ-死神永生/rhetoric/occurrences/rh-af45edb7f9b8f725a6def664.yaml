chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 程心看到他小臂的断面，像镜面一样，骨骼和肌腱清晰可见
sensory_mapping: 手臂并未流血断裂，骨骼肌腱却整齐铺在门面上，像镜中图像贴着一层光滑平面。
context_fact: 手和小臂穿过框面后在当前空间消失，抽回时恢复完整，树枝与昆虫可直接通过。
image_mechanism: 镜面提供无厚度且细节清晰的视觉界面，消解真实截肢应有的血肉破坏，把恐怖变成空间切片。
property_alignment: 门平面对应镜面；截面齐平对应镜面平整；骨骼肌腱可见对应清晰成像；无创伤对应非实体图像。
context_alignment: 人物正用身体测试高维通道，镜面把超空间边界转成可观察的二维切面。
narrative_function: 以生理细节证明门对特定对象做空间分隔，同时制造短促惊异。
transfer_rule: 异常截面比作镜面时，要交代平整、细节呈现、无损和观看方位，避免只借一个光亮属性。
failure_boundary: 截面显示的是手臂真实内部而非镜面反射，且镜子不会让物体另一段消失。
quality_assessment: effective
