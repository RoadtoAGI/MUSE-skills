tenor: 被三体世界全程观察、感到透明而渺小的人类计划制定者
vehicle: 被顽童用放大镜逐只观察、随时可摆弄或灼烧的蚁群成员
ground: 观察双方尺度和力量悬殊；弱者全部暴露而不了解观察者下一步意图
