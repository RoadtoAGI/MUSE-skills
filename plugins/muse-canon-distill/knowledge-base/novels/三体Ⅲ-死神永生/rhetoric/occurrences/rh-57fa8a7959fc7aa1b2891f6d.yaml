chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 感觉自己像是一群被一个顽童用放大镜盯着的蚂蚁中的一个
sensory_mapping: 会议桌缩成蚁巢，智子成为放大镜，四光年外目光聚焦成可能灼伤身体的光点。
context_fact: 敌人先于上级看到一切计划，人类无法隐藏意图，只能适应全透明战争。
image_mechanism: 蚂蚁负责渺小与群体无差别，顽童负责力量巨大却动机难测，放大镜则精确对应监视和潜在杀伤双用。
property_alignment: 人类个体对应蚂蚁；三体技术优势对应顽童尺度；智子监控对应放大镜观察；全透明对应蚁身细节被放大。
context_alignment: 情报人员本应观察别人，如今反成实验对象，类比完成权力视线反转。
narrative_function: 把战略透明造成的自信崩溃转成童年残酷实验，显出文明级弱势。
transfer_rule: 写不对称监视时，可让观察工具兼具放大与伤害潜能；双方尺度、信息方向和行动权要逐项对应。
failure_boundary: 若被观察者能同等反监控或轻易逃离，蚂蚁的无力不成立；顽童意象也不能证明敌人必然以折磨为乐。
