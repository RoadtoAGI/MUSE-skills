quote: 追你的女孩子会像鸟群一样
sensory_mapping: 追求者获得鸟翼和盘旋轨迹，英雄成为鸟群围绕的移动中心。
context_fact: 舰员乐观想象返乡后被当作全人类英雄、获得爱情和荣誉。
image_mechanism: 鸟群把夸张数量和跟随运动合并，玩笑式轻盈反映他们对地球社会的浪漫预期。
property_alignment: 众多追求者对应群鸟数量；围绕英雄对应鸟群跟随中心；热闹追逐对应群飞动态。
context_alignment: 返乡谈话轻松，夸张喻体服务同伴打趣，并为下一刻命运反转保留天真。
narrative_function: 展示舰员对英雄待遇的乐观想象，增加被诱捕审判的悲剧反差。
transfer_rule: 群体追随借鸟群写时，要有数量、同向运动和中心目标；语气可夸张，但应符合人物玩笑场合。
failure_boundary: 只有一名追求者、关系稳定或追随者不围绕同一对象时，鸟群结构失效。
