tenor: 智人扩散、建立全球文明后被集中澳大利亚并面临概念性灭绝的整段人类史
vehicle: 一次历时七万年的徒步旅行，从起点出发绕行世界，最终回到封闭终点且再不能启程
ground: 历史有明确地理起点；文明扩散对应持续行进；集中退化形成圆形回返；灭绝切断下一程
