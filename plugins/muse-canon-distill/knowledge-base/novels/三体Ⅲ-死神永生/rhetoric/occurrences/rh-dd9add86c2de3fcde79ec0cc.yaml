chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: '走出非洲，走了七万年，最后走进澳大利亚。

  人类在澳大利亚又回到了起点，但再次起程已不可能，旅行结束了'
sensory_mapping: 人类脚印从非洲铺满大陆与星空，七万年后所有路线收束进澳洲，路牌在身后倒下，前方再无出口。
context_fact: 四十多亿人被迫移入澳大利亚，断电断粮将淘汰绝大多数，幸存者是否仍为人也不重要。
image_mechanism: 把物种史压成一条可追踪路线，走出与走进只差一个介词，却分别表示开放扩散和封闭终结。
property_alignment: 非洲迁出对应启程；全球扩散对应长途旅行；澳洲集中对应回到起点；概念消失对应旅程终止。
context_alignment: 智子把移民赞作再次走出非洲，程心以同一旅行框架反转宣传：这次不是开端，而是走入终点。
narrative_function: 用一句话概括人类历史并完成占领叙事的终极讽刺。
transfer_rule: 文明史写成旅程时，应固定地理起点、行进方向、回返机制和能否再出发的条件。
failure_boundary: 人类史没有单一路线或预设终点，澳洲也非真正物种起点；判断来自程心绝望时刻。
