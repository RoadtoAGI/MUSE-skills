chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: metaphor
quote: 主核吞下空间中弥散的所有信息
sensory_mapping: 机器张口；信息入腹；信号成食；海量吞咽；点阵消化
context_fact: 主核接收中膜、长膜和轻膜信息，将其与已知星星位置模式匹配以识别广播坐标。
image_mechanism: 无方向的信号收集被组织成一次摄食，空间信息由弥散波变成可入口物质；计算不再是观看，而是在体内拆解、筛选和吸收。
property_alignment: 主核对应生物；接收接口对应嘴；弥散信息对应食物；全频段采集对应吞下；数据存储对应进入腹内；模式匹配对应消化；坐标提取对应营养吸收；无用噪声对应残渣
context_alignment: 同段把坐标写成飞虫、下一段把坐标写活，吞食动作使主核成为捕食信息生态的一环，契合清理文明视角。
narrative_function: 把陌生通信处理流程变成摄食链条，直观显示主核覆盖范围和筛选功能。
transfer_rule: 用吞食写信息摄取时，应对应采集入口、海量输入、内部处理、有效成分提取和无用内容筛除。
failure_boundary: 系统只读取一条人工选定信息、不保存也不分析，或信息反而由主核向外发送时，吞下会误写方向与规模。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 飞行器主核大规模接收不同通信膜在空间传播的信号，并将其纳入内部计算与模式匹配
vehicle: 有巨大胃口的生物张口把周围弥散食物全部吞入体内，随后消化并从中吸收可用成分
ground: 主核对应吞食者；空间信息对应食物；接收对应吞咽；海量覆盖对应全部吞下；模式分析对应消化；识别坐标对应吸收营养；不同通信膜对应不同食材
