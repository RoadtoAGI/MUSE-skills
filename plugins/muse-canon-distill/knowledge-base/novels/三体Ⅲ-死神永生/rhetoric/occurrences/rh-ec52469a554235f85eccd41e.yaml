chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 他顶天立地站在岛上，像海上的一座孤峰。他的皮肤是日晒的棕色，强健的肌肉像孤峰上的岩石，他的头发在海风中飘荡，像峰顶的树丛
sensory_mapping: 海上孤峰；棕色岩壁；块状山石；峰顶树丛；顶天轮廓
context_fact: 公主在海岸远望墓岛，深水王子因空间效应显得极其高大，旁人小到像蚂蚁。
image_mechanism: 远距视野把人的关节抹平，身体连成一整座山；肌肉一块块凸成岩石，头发在最高处变为树林，使巨人看似从岛基直接长到天空。
property_alignment: 深水王子对应孤峰；岛上独立姿态对应海中单峰；身高对应山高；棕色皮肤对应岩面；肌肉对应岩块；头发对应树丛；海风中的发丝对应摇动枝叶
context_alignment: 墓岛的曲率空间让王子远看为巨人，山峰延展恰好把视觉尺度错觉实体化，而非单纯赞美强壮。
narrative_function: 建立深水王子的巨物视觉并整合身体细节，为靠近时逐渐变矮的空间线索提供基准。
transfer_rule: 用山峰延展描写巨人时，应让全身轮廓、皮肤材质、肌肉分块、头发植被和周围地形逐层同构。
failure_boundary: 人物近看身材普通、姿态蜷缩、表面柔白或周围没有尺度参照时，整座孤峰会掩盖真实比例。
