property_alignment: 洲际导弹群发对应核战启动；全球多地同步对应世界尺度；夜空火球对应末日视觉。
context_alignment: 外观足以触发末日判断，专业知识却区分轨道；类比突出普通视觉与工程真相的距离。
narrative_function: 制造短促误读后揭示核武用途反转，强调人类为同一目标调动毁灭库存。
