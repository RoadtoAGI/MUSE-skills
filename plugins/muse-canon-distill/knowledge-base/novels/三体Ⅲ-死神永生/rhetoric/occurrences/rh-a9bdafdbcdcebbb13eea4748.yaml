chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 他的大脑就像一节电池，一遍遍地被充入痛苦的电流
sensory_mapping: 大脑缩成圆柱电池，痛觉成为可见电流沿接口灌入，休克只像一次放空后再充。
context_fact: 他想象自己没有手脚和身体，不能自杀，三体人可无限重启并输入痛苦。
image_mechanism: 电池既承接前句芯片技术域，又突出纯被动容器；充入把痛苦从感受变为由他者掌控的物理负荷。
property_alignment: 孤立大脑对应独立电池；感官接口对应电极；痛觉输入对应充电电流；反复复苏对应充放循环。
context_alignment: 阶梯计划把人脑当有效载荷，人物恐惧进一步把自己看成可插拔器件，呈现物化内化。
narrative_function: 以技术意象完成酷刑想象高潮，使永无止境从抽象时间变成可重复操作。
transfer_rule: 被动承受者借储能器件写时，要给出接口、输入介质和循环机制；器件功能应揭示权力关系，而非只取外形。
failure_boundary: 若大脑可拒绝输入、主动断开或痛苦无法重复恢复，电池的被动循环不成立；痛觉也不是可量守恒电荷。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 被外星接口反复注入痛觉、无法自杀逃脱的云天明大脑
vehicle: 被外部电源一次次充电、只能被动容纳电流的电池
ground: 对象失去自主输入控制；外部可重复灌入能量，使内部状态达到高强度后再循环
