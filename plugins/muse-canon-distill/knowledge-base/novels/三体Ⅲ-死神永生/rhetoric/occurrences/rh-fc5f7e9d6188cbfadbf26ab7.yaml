figure_type: simile
quote: 这些却融入了一股美艳的杀气，如一条柔软而致命的绞索
sensory_mapping: 她的柔美化成一圈光滑绳索，先贴近视线，再无声收紧到令人窒息。
context_fact: 智子以迷彩、短发和武士刀现身，举止仍柔美，却带来连热浪也驱不散的寒意。
image_mechanism: 绞索把通常相斥的柔软与致命变成同一器具的两个阶段，准确承接外貌吸引和行动威胁。
property_alignment: 女性柔态对应绳索柔韧；美艳吸引对应绳圈贴近；杀气对应收紧致命；控制感对应束缚目标。
context_alignment: 智子马上以武士刀轻易压制AA，绞索先于动作宣布她的优雅已经成为压迫工具。
narrative_function: 完成智子从文化使者到占领者化身的视觉转场，并预告柔和话语背后的暴力。
transfer_rule: 融合美感与威胁时，可选自身以柔性实施伤害的物件，让两种属性共享一条动作机制。
failure_boundary: 若人物只显凶狠、没有贴近和柔美，绞索的双重性便不成立；它也不等同实际勒杀方式。
