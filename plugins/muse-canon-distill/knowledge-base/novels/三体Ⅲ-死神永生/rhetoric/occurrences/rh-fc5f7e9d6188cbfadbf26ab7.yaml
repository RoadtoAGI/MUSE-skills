tenor: 智子将女性柔美与明确杀伤威胁融为一体的气质
vehicle: 能够柔顺贴近目标、随后收紧并致死的绞索
ground: 外表柔软且可亲近；危险在接触后显现；束缚和杀伤来自同一柔性结构
