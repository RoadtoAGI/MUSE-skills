tenor: 欢呼未平时，大量高声谈话加入并密集敲击原有声浪
vehicle: 海啸已淹没大陆，海面仍翻涌，又遭密集暴雨不断击打
ground: 第一层连续声体尚未消退；第二层多点声音从上叠加；表面因双重扰动无法平静
