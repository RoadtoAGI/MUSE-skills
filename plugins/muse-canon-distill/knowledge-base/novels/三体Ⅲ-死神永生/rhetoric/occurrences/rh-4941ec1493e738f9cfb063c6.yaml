chapter: 【威慑后第一年，移民完成后第六天清晨，澳大利亚】
figure_type: simile
quote: 仿佛在大陆被淹没后又有暴雨降到无法平静的海面上
sensory_mapping: 欢呼海面仍在起伏，无数说话声像暴雨点砸下，每句话激起新的小波纹。
context_fact: 人群欢呼逐渐被密集高声谈话取代，程心一时分辨不清内容。
image_mechanism: 暴雨延展海洋框架，为第二类声音提供不同纹理：欢呼是整体巨浪，谈话是密集雨点。
property_alignment: 未息欢呼对应翻涌海面；多人说话对应暴雨；单句冲击对应雨点击水；难辨内容对应波纹相互干扰。
context_alignment: 同一段听觉由静冰、海啸到暴雨连续变相，准确追踪消息扩散的群体节奏。
narrative_function: 把单一情绪爆发过渡到信息交换，为程心听清广播消息延长悬念。
transfer_rule: 延展声海时，新声层应有不同水文动作，并与原声在时间上真实叠加。
failure_boundary: 若欢呼已完全停止，暴雨落海的叠层结构不成立；谈话也不从天空实际落下。
quality_assessment: exemplary
