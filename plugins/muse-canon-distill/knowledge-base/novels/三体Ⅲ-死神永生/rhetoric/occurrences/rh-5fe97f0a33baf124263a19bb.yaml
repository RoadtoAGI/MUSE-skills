chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 澳大利亚政府也开始变得颐指气使，以人类家长自居
sensory_mapping: 澳洲政府坐到家庭主位，数十亿移民和各国政府被排成孩子，只能等它分配房间与食物。
context_fact: 澳洲保留军力和富庶沿海区，开始设置保留领土并凌驾联合国。
image_mechanism: 家长把国家霸权转成家庭层级，使颐指气使看似照料，实则取消其他政治主体的成年资格。
property_alignment: 资源控制对应家庭供养；政策命令对应家长训令；各国受制对应孩子依赖；自称代表人类对应一家之主。
context_alignment: 三体也以保护和供养承诺支配人类，澳洲在保留地内部复制占领者的父权话语。
narrative_function: 显示受压迫者迅速复制强者结构，为政府与移民冲突升级提供心理因果。
transfer_rule: 政治家长喻体应列出资源供给、决策垄断和主体降格三层关系。
failure_boundary: 政府有真实安置职责，家长比喻不自动证明每项政策恶意；它聚焦权力姿态。
