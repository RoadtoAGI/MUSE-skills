chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 他的思想也许在岁月中沉淀得像他们头顶的地层一样厚重，也可能像地层之上的蓝天一样空灵
sensory_mapping: 罗辑的思想沿垂直轴分成两个极端：向下凝成层层岩石，向上穿透岩层化入没有边界的蓝空。
context_fact: 程心只从目光读到不见底的深邃，既不知其积累了什么，也不知是否已超脱，除非亲历同样岁月。
image_mechanism: 同一现场的地层与蓝天提供相反答案，厚重和空灵共享漫长纵深；二选一的结构保留人物无法解读的诚实。
property_alignment: 五十四年积累对应地层沉积；思想复杂沉重对应岩层厚度；彻悟后的简净对应蓝天空无；精神高远对应天空开阔。
context_alignment: 二人位于地层最深处，蓝天又被四十五千米岩石隔开，垂直距离等同程心尚未走完的执剑人生涯。
narrative_function: 拒绝替罗辑下单一心理结论，同时用上下两个极端标出程心面对的未知成长尺度。
transfer_rule: 表达不可判定的内在状态时，可选同一空间轴上的对立物象；两端各自需要独立证据与明确差异。
failure_boundary: 若文本已明确人物思想沉重或空灵，双重可能会拖延判断；地层与蓝天也不能证明某一端为真。
