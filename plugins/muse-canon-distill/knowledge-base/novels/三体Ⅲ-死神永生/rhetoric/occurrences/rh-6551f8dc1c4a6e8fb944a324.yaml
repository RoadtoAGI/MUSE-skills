chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这一事件从根本上动摇了人类社会的文化、政治、宗教和经济的根基。这一冲击直达文明的最深层，其影响却很快浮上表面，与人类社会巨大的惯性相互作用
sensory_mapping: 文明成为有地基与剖面的建筑体，三体危机像冲击波钻入最深层，震动随后从地下翻到社会表面。
context_fact: 危机同时改变文化、政治、宗教和经济，并与社会既有惯性共同催生幼稚症。
image_mechanism: 根基、深层、浮面和惯性共用一套力学空间，读者可沿冲击传播路径理解抽象制度为何迅速显出异常。
property_alignment: 基础制度对应建筑根基；深层价值对应内部深处；公共行为对应表面形变；社会延续性对应巨大惯性；危机压力对应外来冲击。
context_alignment: 这不是局部政策波动，多个文明系统同时受扰，结构性撞击比单点变化更符合影响尺度。
narrative_function: 为危机幼稚症提供动态因果模型，避免历史标签只剩讥讽，并抬高群星计划的文明背景。
transfer_rule: 写系统受冲击时，可沿根基、深层、表面和惯性安排传播链；每一空间层应对应一个真实社会层级。
failure_boundary: 若影响只停留在舆论表面、没有制度和价值变化，直达根基会夸大；惯性也不能自动证明冲击必然产生某种政策。
quality_assessment: exemplary
