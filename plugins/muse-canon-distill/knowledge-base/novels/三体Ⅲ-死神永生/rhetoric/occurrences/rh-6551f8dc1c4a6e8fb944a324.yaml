tenor: 三体危机对文明基础制度、深层观念与表层社会行为的连锁改变
vehicle: 强烈撞击传入有地基和纵深层次的庞大结构，使基础震动、深层受力并把效应推至表面
ground: 外来力量穿透多个结构层级；系统原有稳定性抵抗冲击，却把能量转成可见变形
