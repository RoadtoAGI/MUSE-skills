chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 一块灰色的东西，软软的，像陈年的羊脂
sensory_mapping: 陌生器官先被降格为可触摸的脂肪，灰色、柔软与隐约油腻感依次到达。
context_fact: 皇帝先看到袋中不明灰色软块，烛台移近后才认出那是完整大脑。
image_mechanism: 读者与皇帝先凭颜色质地把它认成陈脂，随后人脑的命名反向污染日常触感，产生肉体惊悚。
property_alignment: 脑组织灰白色对应陈年羊脂的失鲜色泽；柔软组织对应脂肪软塌质地；脱体块状外观对应成块羊脂。
context_alignment: 中世纪宫廷熟悉羊脂而不熟悉完整大脑外观，喻体符合观察者知识，并延缓物证揭晓。
narrative_function: 把超自然奇观落实为可触的物质细节，利用先物后人的辨认过程制造恶心与震惊。
transfer_rule: 写陌生生物材料时，可从观察者时代中寻找色泽、质地都熟悉的材料，并依照人物实际辨认次序安排显名。
failure_boundary: 组织若鲜红、坚硬或仍与身体相连，陈年羊脂的颜色、柔度和块状性均不成立；现代医学视角也会错位。
