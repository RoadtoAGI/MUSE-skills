review_status: reviewed
tenor: 智子失联后，追击舰只能观察蓝色空间号外部行为，无法知道其内部人员、计划与状态
vehicle: 外壳封闭的不透明黑箱，观察者只能看到输入输出，不能检查内部结构和运算
ground: 系统内部信息完全不可见；外部仍可记录行为，却难从行为唯一推断真实机制
