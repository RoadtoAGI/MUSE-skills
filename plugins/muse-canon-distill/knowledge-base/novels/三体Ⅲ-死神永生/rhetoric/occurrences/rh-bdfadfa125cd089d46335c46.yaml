chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 现在“蓝色空间”号开始对“万有引力”号呈现黑箱状态
sensory_mapping: 蓝色空间号的舱室、人员和屏幕一齐涂黑，只留下速度、航向与通信端口露在追击者视野。
context_fact: 此前潜入目标的智子实时传回内部图像，进入盲区后该监视通道永久中断。
image_mechanism: 黑箱精确表达信息边界突变：飞船实体未消失，消失的是透视内部的权限，敌我关系因此重新充满推断。
property_alignment: 飞船外壳对应箱体；内部人员计划对应隐藏机制；航向通信对应输入输出；智子失联对应箱体封闭。
context_alignment: 同章宇宙戴面纱描述宏观未知，黑箱把同一不透明性缩到具体追击目标，尺度递进清楚。
narrative_function: 说明任务为何复杂化，也为之后舰内异常和蓝色空间号真实行动保留悬念。
transfer_rule: 对象如黑箱时，应区分仍可观察的输入输出与失去的内部变量；不能把未知直接写成随机。
failure_boundary: 若仍有内线、传感器或内部通信可用，完全黑箱不成立；外部行为也可能足以推断部分状态。
quality_assessment: effective
