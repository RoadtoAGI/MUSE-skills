chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这地面由一片片光洁的金属板拼接而成，像镜子一样倒映着太阳
sensory_mapping: 黑土消失后，脚下成为一整片冷亮镜面，人工太阳在每块金属板里重复出现。
context_fact: 机器人正在把小宇宙的土壤、金属板和设备逐项送回大宇宙。
image_mechanism: 镜面从反光性质切入，把原本自然田园瞬间翻成裸露工业结构，视觉材质完成世界去魅。
property_alignment: 金属光洁对应镜面平滑；太阳倒影对应镜中成像；拼接平面对应大镜面；冷硬材质对应玻璃金属感。
context_alignment: 田园先被写成怀抱，如今土层揭开后是镜面机械底板，喻体强调安居幻景正在拆除。
narrative_function: 用材质突变显示小宇宙归还物质已从生态表层进入技术骨架。
transfer_rule: 反光表面比作镜子时，应让反射对象、平整度、材质转折和场景意义同时发挥作用。
failure_boundary: 拼接金属板未必有镜子成像精度，也没有玻璃背银结构；共同点限于光洁反射。
quality_assessment: functional
