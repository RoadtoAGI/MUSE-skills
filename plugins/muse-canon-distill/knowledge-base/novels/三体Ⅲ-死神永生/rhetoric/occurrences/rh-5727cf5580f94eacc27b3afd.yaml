tenor: 田园土壤搬空后露出的、由光洁金属板拼成的小宇宙底面
vehicle: 表面平整光亮、能清楚反射光源形象的镜子
ground: 表面光洁；反射率高；能显出太阳；平面连续；冷硬无纹理；亮暗随角度变化
