quote: 火光中狼一般地盯着来人
sensory_mapping: 火把下的蹲伏姿态和直视组合成狼在暗处压低身体、盯紧目标的捕猎轮廓。
context_fact: 强壮战俘被关在阴暗地堡铁栏后，狄奥伦娜即将用他试验异能。
image_mechanism: 狼把静态凝视补成蓄势动作：身体虽被铁栏限制，视线仍像能越栏扑击，使囚犯保留危险主动性。
property_alignment: 军官蹲伏对应狼压低身体；牢中警戒对应困兽戒备；盯视来人对应捕食者锁定对象。
context_alignment: 受试者即将成为无声牺牲品，先赋予他猛兽般的威胁感，使后来隔墙取脑更显力量悬殊。
narrative_function: 在极短出场中完成体格、敌意与处境刻画，并为超自然攻击提供看似强悍的对照物。
transfer_rule: 用动物写目光时，应同时利用身体姿态、空间处境和视线行为；动物生态动作要能解释人物潜在行动。
failure_boundary: 若人物站姿松弛、视线游移或主动示弱，狼的锁定与扑击潜势均不存在；单有凶狠表情不足以支撑完整喻体。
