chapter: 【掩体纪元67年，“星环”号】
figure_type: simile
quote: 城市中的生活又变得像天堂一样了
sensory_mapping: 安宁乐园；繁荣城景；无忧生活；门外遥望；幸福不可见
context_fact: 五十六年间木星群落扩建并形成组合体，城市平时绕木星运行，只在警报时进入掩体区。
image_mechanism: 曹彬用最高等级的幸福词概括半世纪成就，却紧接“不能去看”；天堂因此像隔门存在的失落世界，在打击降临一刻被语言召出又关闭。
property_alignment: 太空城对应天堂；安全系统对应庇护；物质生态改善对应乐园丰饶；社会安定对应无苦；居民日常对应幸福生活；程心被隔绝对应不得入园；末日无时间对应天堂即失
context_alignment: 程心曾把打击后时代想成最后港湾，如今真正醒来，天堂生活只由他人口述且没有时间参观，形成残酷兑现反差。
narrative_function: 以一句常规赞语制造最大损失感：读者刚知文明成功，下一秒便知成果将毁灭。
transfer_rule: 用天堂评价社会生活时，应落实安全、富足、环境和心理安宁等多项理想属性，并处理发言者是否亲见或带有安慰动机。
failure_boundary: 城市仍普遍贫困暴力、生态恶劣，或话语只是官方宣传且无事实支撑时，天堂只能标作反讽而不能直接采信。
