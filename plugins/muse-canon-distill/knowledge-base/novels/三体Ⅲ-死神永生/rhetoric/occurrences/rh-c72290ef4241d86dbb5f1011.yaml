tenor: 太阳系防御完善后木星太空城恢复安全、富足、舒适且繁荣的日常生活
vehicle: 天堂作为没有生存忧患、物质匮乏和痛苦的理想居所，居民可享安宁幸福
ground: 城市安全对应天堂无灾；生活富足对应理想享用；生态舒适对应乐园环境；战争暂离对应无痛苦；居民繁荣对应幸福群体；程心向往却不能进入对应天堂在望而不可达
