chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 宇宙变成了一间没有边际的空旷展厅，群星都像幻觉，飞船是唯一的展品
sensory_mapping: 宇宙黑暗拉成无边展厅，星点退作虚假布景，飞船被聚光单独陈列，船员随展品一起暴露。
context_fact: 远离太阳系后星星仅是光点、银河仅是薄雾，感官能确认的主要物质实体只剩飞船。
image_mechanism: 展厅模型同时处理空旷、唯一实体与被观察感；没有边际取消安全墙面，唯一展品则自动召唤一个未现身的观看者。
property_alignment: 虚空主宰对应空旷展厅；群星不可触对应幻觉背景；飞船有实体对应唯一展品；全面暴露对应展品供观看。
context_alignment: 这是宇航心理学对去物质效应的内部解释，随后出现超级观察者幻想，正由展品关系自然推出。
narrative_function: 把深空孤独组织成完整空间模型，解释船员被动感，也为高维观察者的真实存在制造反讽。
transfer_rule: 用展陈空间写孤立时，应指定背景、展品和潜在观者三种位置；谁具有实体、谁只能观看必须清楚。
failure_boundary: 周围存在多艘可接近飞船、行星和物质参照时，唯一展品不成立；心理模型也不能当作宇宙客观布局。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 去物质效应中航行者对虚空、群星与自身飞船之间实体关系的心理模型
vehicle: 没有墙界的空展厅，四周背景近乎虚幻，中央只陈列一件可触展品
ground: 广阔背景失去质量和可达性；唯一近处实体被孤立、暴露并仿佛供未知观看者审视
