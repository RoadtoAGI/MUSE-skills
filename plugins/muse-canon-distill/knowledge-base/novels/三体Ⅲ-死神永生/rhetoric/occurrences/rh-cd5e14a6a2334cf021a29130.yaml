chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这个美丽的魔鬼
sensory_mapping: 智子白嫩面孔保留美感，武士刀和冷笑在其后叠出恶魔阴影，两张面孔同时可见。
context_fact: 智子称程心无辜，话语触动她，却刚宣布世界已按三体预测陷落。
image_mechanism: 魔鬼把美与恶的矛盾固定为一种诱惑型角色，使程心受到触动也成为危险的一部分。
property_alignment: 姣美外表对应诱惑外形；冷酷占领对应灾祸本质；穿透话语对应蛊惑能力。
context_alignment: 程心刚把毁灭开关和水滴都看成魔鬼，此刻智子成为第三个同名存在，显示毁灭手段取得人形。
narrative_function: 压缩程心对智子的复杂判断：她承认对方有魅力，同时不解除敌对伦理。
transfer_rule: 称魅力型敌人为魔鬼时，应让吸引、说服与伤害共享行动证据，避免只作道德标签。
failure_boundary: 魔鬼是程心的价值判断，不能抹去智子的程序性身份或把一切美貌自动编码为欺骗。
