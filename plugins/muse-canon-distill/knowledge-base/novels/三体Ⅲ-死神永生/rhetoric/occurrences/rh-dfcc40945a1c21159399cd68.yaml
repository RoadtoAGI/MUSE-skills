figure_type: simile
quote: 滚滚下落的沙流发出轰隆隆的巨响，仿佛世界在解体一般
sensory_mapping: 地表像一层完整世界壳被拆开，沙丘、道路和车辆随裂口轰鸣着分解落下。
context_fact: 白艾思处于噩梦，后来真实太阳系三维空间将蜷缩一维并变成二维巨画。
image_mechanism: 世界解体把沙漠局部扩大为宇宙尺度预演，解体既是视觉坍塌也是物理维数结构松脱。
property_alignment: 沙漠全陷对应世界范围；沙丘散落对应结构拆分；轰鸣对应崩解声；无底坑对应旧世界消失。
context_alignment: 梦并非物理推导，却用正确的整体失稳感触发白Ice对纸条傲慢判断的反省。
narrative_function: 将噩梦推至末日峰值，并让他醒后立即要求飞船远离纸条。
transfer_rule: 局部灾变比作世界解体时，应让视野边界、结构失效、声音和后续真相共同支撑尺度提升。
failure_boundary: 当时只是梦中沙漠，真实二维化释放能量和声响不同；不能把梦象当测量结果。
