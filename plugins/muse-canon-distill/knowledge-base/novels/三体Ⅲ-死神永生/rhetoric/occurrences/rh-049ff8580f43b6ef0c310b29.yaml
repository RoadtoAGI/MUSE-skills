chapter: 【时间开始后约170亿年，我们的星星】
figure_type: metaphor
quote: 一千八百万年，什么都会消失的，时间是最狠的东西
sensory_mapping: 时间不挥刀也不发声，却用千万年把飞船、山峰和文明一点点削净，比任何有意敌人更不留情。
context_fact: 蓝星表面找不到星环号与人迹，飞船遥感也尚未发现地下刻字。
image_mechanism: 狠把分散的侵蚀过程集中为施害性格，使无意志年代获得可责问的残酷面孔。
property_alignment: 地质侵蚀对应伤害手段；遗迹消失对应毁灭结果；一千八百万年对应持续追击；无例外消失对应不留情；人无力对应受害者。
context_alignment: 关一帆以此劝程心放弃搜寻，口语化判断符合人在巨大时间前的疲惫而非科学陈述。
narrative_function: 把希望压到最低点，使随后地下石刻幸存成为对时间暴力的微小胜利。
transfer_rule: 时间人格化为狠者时，应列出它实际通过哪些物理过程伤害何物，以及哪些痕迹可能例外幸存。
failure_boundary: 时间本身不实施破坏，变化由地质、生物和材料过程造成；石刻随后证明‘什么都消失’并非绝对。
quality_assessment: conventional
confidence: 1.0
review_status: reviewed
tenor: 漫长年代通过侵蚀、地质变动和遗忘抹除人、文明建筑及绝大部分可辨痕迹
vehicle: 手段残酷、不留情面且会把对象彻底毁掉的狠厉施害者
ground: 造成不可逆伤害；不因对象珍贵而停止；作用范围广；持续追击；留下者极少；结果超出人的抵抗能力
