chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 外面传来密集的马蹄声，开始隐隐约约，但很快逼近，如暴雨般急骤
sensory_mapping: 远雷般低响；急密雨点；声墙逼近；地面震动；骤然寂静
context_fact: 深水王子进入王宫后，禁卫军随即赶到，蹄声最终在宫殿外戛然而止。
image_mechanism: 单个马蹄在距离中消失，只剩成千敲击点组成的雨幕；雨势从模糊边缘迅速压到屋檐前，又在一瞬全部收住。
property_alignment: 马蹄对应雨滴；骑兵群对应暴雨云团；落蹄节奏对应雨点击地；快速逼近对应雨幕推进；声量增强对应雨势加大；宫外停队对应骤雨停止
context_alignment: 前面骑兵已被写成黑潮，声音层再化为暴雨，水象把军队从远景运动延续到室内听觉。
narrative_function: 在冰沙与深水对峙时引入外部力量，让援军到达具有压倒性的声势。
transfer_rule: 用暴雨写群体蹄声时，应匹配声点数量、急促节奏、由远及近的音量变化、覆盖感和落点冲击。
failure_boundary: 只有一两匹马、蹄声间隔稀疏，或队伍缓慢远离时，暴雨会夸大规模和方向。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 大批禁卫军骑马快速接近宫殿，密集蹄声从远处迅速增强并突然停在门外
vehicle: 暴雨由远处压来，无数雨点高速、密集地敲击地面，声势在短时间内骤然铺满
ground: 众多马蹄对应密集雨点；连续落蹄对应急骤敲击；声音由远及近对应雨幕逼近；大队规模对应暴雨覆盖；骤停对应雨线突然截断
