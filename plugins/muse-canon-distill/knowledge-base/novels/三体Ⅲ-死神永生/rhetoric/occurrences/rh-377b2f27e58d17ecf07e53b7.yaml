figure_type: simile
quote: 像鸟一般轻灵的女孩子，充满生机地围着她飞来飞去
sensory_mapping: 女孩脚步获得翅翼，联络事务成为绕飞轨迹，声音与动作像鸟鸣和振翅连续出现。
context_fact: AA担任程心与开发署联络人，带她适应陌生威慑纪元生活。
image_mechanism: 鸟不只形容体重，而让围着飞这一动词持续驱动人物出场节奏，生机与机敏同步显形。
property_alignment: 动作轻快对应鸟体轻灵；来回联络对应绕飞；活泼言语对应鸟鸣般生命感。
context_alignment: 程心刚从冬眠醒来显得迟缓，AA的鸟性运动强化两代人的速度差。
narrative_function: 以动态剪影建立AA角色声音和时代活力，成为程心的移动向导。
transfer_rule: 人物如鸟应让轻、快、换向和围绕目标至少两项进入动作链；不能只凭纤瘦外形。
failure_boundary: AA若行动沉重缓慢、长时间静坐或情绪低迷，飞鸟的持续生机就不成立。
