chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 穿梭机的A.I.和各层控制系统全死了
sensory_mapping: 舱体仍围着他们，里面的智能、灯和动力却一层层停跳，只剩一只冰冷金属躯壳漂在轨道上。
context_fact: 当地光速只有每秒十几千米，所有常规电脑停机，舱门无法开启，亨特号也成为死船。
image_mechanism: 死亡把多系统停机组织成有机体失能，A.I.像意识、控制层像神经，金属结构则成为遗体。
property_alignment: A.I.停机对应意识消失；控制层停摆对应神经死亡；无动力对应肌体不动；金属罐对应尸壳；神经元计算机启动对应复苏。
context_alignment: 死线、零光速已建立死亡词场，飞船系统的‘死’把宇宙尺度死亡压到人物赖以生存的近身设备。
narrative_function: 迅速枚举危机后果，并为古老手动装备与神经元备用系统的救援建立必要性。
transfer_rule: 复杂机器写成死亡时，应把感知、控制、动力和残余外壳分别对应生命功能，并安排可辨的停跳后果。
failure_boundary: 系统可在条件改变或备用模式下重启，不具生物死亡的不可逆性与情感主体。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 低光速使穿梭机电子与量子控制系统彻底停止运行，飞船失去动力、照明、舱门控制和自主反应
vehicle: 生命体死亡后意识、器官协作和自主行动同时终止，只余无功能躯壳
ground: 停止响应；内部协作中断；不能感知或控制；能量与动作消失；外壳仍存在；需要另一套系统才能复活；同类状态可蔓延
