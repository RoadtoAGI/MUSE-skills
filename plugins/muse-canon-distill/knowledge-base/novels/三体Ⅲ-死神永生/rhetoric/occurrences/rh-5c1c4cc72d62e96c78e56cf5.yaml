chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: simile
quote: 一行白色大字出现在红色的背景上，每个字都像是一声惊惧的尖叫
sensory_mapping: 白字从红墙上张口，笔画化成声带，一枚字发出一声叫喊，整行文字形成连续惊呼。
context_fact: 警报报告水滴攻击广播系统，程心必须立即判断是否启动宇宙广播。
image_mechanism: 每个字把视觉单位逐个声化，避免警报只是抽象句子；白红对比成为尖叫的音量，惊惧则传出系统对毁灭的紧迫判断。
property_alignment: 白字高亮对应尖声刺耳；逐字排列对应一声接一声；红色底幕对应危险现场；紧急内容对应惊惧情绪。
context_alignment: 大厅本来死寂，警报先以墙色再以文字发声，视觉尖叫打破时间封闭并迫使程心行动。
narrative_function: 把系统信息转成有情绪的催促，提升倒计时的感官密度并显出程心承压起点。
transfer_rule: 文字声化时，应把字形对比、出现节奏和语义压力分别映射到音色、连发和情绪。
failure_boundary: 低对比小字、静态说明或非紧急内容无法产生逐字尖叫；读者若听不到节奏，拟声效果也会减弱。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 最高警报红色背景上逐个显现的白色文字及其传递的紧急信息
vehicle: 恐惧者在灾难临头时一声声尖利、无法克制的叫喊
ground: 每个信息单元都具有高对比冲击；内容重复施加恐惧与立即行动的压力
