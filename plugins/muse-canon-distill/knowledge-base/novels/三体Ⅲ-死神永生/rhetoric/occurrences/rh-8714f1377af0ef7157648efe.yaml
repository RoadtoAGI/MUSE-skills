figure_type: metaphor
quote: 甚至可能成为打开云天明情报神秘之门的钥匙
sensory_mapping: 词语钥匙；神秘门锁；情报门后；锁芯转动；入口开启
context_fact: 童话多数情节可有多重解释，专家认为反复出现且无法识别来源的长地名可能含有确定信息。
image_mechanism: 海量模糊解释被想象成一堵封门，唯一突兀词语因形态特殊被握成钥匙；研究目标也从解释整座迷宫转为寻找一个锁孔。
property_alignment: 赫尔辛根默斯肯对应钥匙；反常音译对应独特齿形；信息加密对应门锁；词源识别对应转锁；战略真相对应门内空间；反复强调对应钥匙线索；专家研究对应开门动作
context_alignment: 地名后来确实通过莫斯肯岛和旋涡建立突破，钥匙并非泛称重要线索，而准确预示它会开启解码下一阶段。
narrative_function: 在解读僵局中重新集中注意力，赋予陌生地名明确的突破期待。
transfer_rule: 用钥匙写线索时，应有一个具体封闭问题、线索与障碍间的独特匹配关系，以及开启后可进入的新证据空间。
failure_boundary: 线索只是众多背景信息之一、不能排除多义性，或问题不存在明确入口时，钥匙会夸大其决定性。
