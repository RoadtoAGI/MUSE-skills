chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 跨越三个世纪的情感在她的意识深处涌动，像郁积的火山
sensory_mapping: 她意识深处像火山口下的红热岩浆，三世纪情感翻滚上涌，她却把每条裂缝迅速封死。
context_fact: 云天明自然问候触发情感，程心为完成记忆任务反复默念只记录，禁止情绪外露。
image_mechanism: 郁积火山把压抑与强度放在同一机制中，封出口并不会消除岩浆，反而让自控呈现危险压力。
property_alignment: 三世纪情感对应长期岩浆积累；意识深处对应地下岩层；情绪涌动对应岩浆翻腾；自我压制对应封死火山口。
context_alignment: 上方异星穹顶的光管像神经回路，程心内部则成为地质火山，外部人工田园与内部原始力量形成反差。
narrative_function: 说明程心机械记录策略面对重逢立即受压，为后续隐语理解与私人谈话保持张力。
transfer_rule: 压抑情感如火山时，应交代积累时长、深层位置、出口控制、内部运动和可能爆发的后果。
failure_boundary: 情感未必爆发或造成破坏，火山热度也不能区分爱、愧疚等成分；喻体聚焦压强。
