chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 这一刻，沧海桑田
sensory_mapping: 舱内只过一刻，蓝星表面却足够让海退成田、田再沉海，整个世界在一次眨眼中换了地貌。
context_fact: 当地参照系时间以千万倍速度流逝，蓝星色带每个周期都是飞船绕行一周。
image_mechanism: 成语把时间膨胀的数字压缩成最经典的地貌反转，用四字完成舱内一刻与地质万代的尺度折叠。
property_alignment: 舱内瞬间对应观察时刻；蓝星千万年对应地质年代；生态重构对应海田互换；故地消失对应旧海旧田不复。
context_alignment: 二人悬在蓝星轨道上直接观看地表色带，海陆变迁不是空泛感叹，而是眼前物理可能。
narrative_function: 以极短句切断技术说明，宣告云天明重逢再次被时间彻底夺走。
transfer_rule: 用沧海桑田压缩时间时，应在邻文提供明确倍率、观察对象和足以发生地质变化的时长。
failure_boundary: 此刻未必恰好发生海陆互换，成语代表所有长期变化；舱内时间也并非真正静止。
quality_assessment: conventional
confidence: 1.0
review_status: reviewed
tenor: 穿梭机短暂一刻内蓝星地表经历极漫长年代，海陆、生态和文明均可能彻底改变
vehicle: 辽阔海洋变成桑田、陆地又沉为海洋的巨大地质轮回
ground: 时间跨度极长；地貌彻底变换；旧世界不可追回；变化在观察者感受中被压缩；尺度超越个人；熟悉环境转为陌生
