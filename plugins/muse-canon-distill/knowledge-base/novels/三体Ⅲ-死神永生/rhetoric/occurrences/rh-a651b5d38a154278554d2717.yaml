chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 近处的DX3906恒星则像深渊上燃烧的焚尸炉
sensory_mapping: 红色恒星在黑空深渊上烧着，像一座宇宙焚尸炉，行星和生命终将被送进它的火口。
context_fact: 该星系附近存在归零者死线，宇宙规律武器可能令恒星系整体坠入低光速黑域。
image_mechanism: 焚尸炉把生命之源恒星反转为处理死亡的机器；深渊定位又把局部星系放在宇宙终结边缘。
property_alignment: 恒星火焰对应炉火；行星生命对应尸体；黑色太空对应深渊；规律战争对应死亡生产；红光对应焚烧。
context_alignment: 太阳曾是人类生命源，二维化后成为死海；新恒星尚活，却已在程心眼中预先变成焚尸设施。
narrative_function: 把抽象暗黑神话钉在眼前恒星上，并将航程目的地从希望星变成潜在死亡场。
transfer_rule: 生命源比作焚尸炉时，应交代火焰、被焚对象、周围深渊、知识触发和价值反转。
failure_boundary: 恒星并不主动焚尸，DX3906仍供养蓝星生态；焚尸炉完全属于程心恐惧视角。
quality_assessment: exemplary
