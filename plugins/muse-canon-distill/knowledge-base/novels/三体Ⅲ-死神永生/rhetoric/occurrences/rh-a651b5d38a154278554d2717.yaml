tenor: 在宇宙末日与规律战争认知下，近处红光DX3906恒星呈现出的威胁性形象
vehicle: 架在无底深渊上方、以火焰焚烧尸体并把死亡产物送入黑暗的焚尸炉
ground: 持续燃烧；与死亡处理相关；位于巨大黑暗边缘；吞入生命遗骸；热火与周围寒暗反差；未来可能熄灭
