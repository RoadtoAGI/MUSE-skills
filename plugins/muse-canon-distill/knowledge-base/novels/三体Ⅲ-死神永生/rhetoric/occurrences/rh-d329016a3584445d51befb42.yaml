chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 都带来了公元世纪某种山一般强大的东西
sensory_mapping: 陌生新纪元里，两个公元男人像远处山脉立住地平线，程心的飘摇视野终于有了沉重支点。
context_fact: 罗辑七年后仍挺拔冷峻、领导抵抗精神，弗雷斯则持续用简短电话支撑程心生活。
image_mechanism: 山把抽象人格力量转成地景重量，依靠从心理感受变成靠近不移地基、辨认固定地标。
property_alignment: 人格坚韧对应岩体硬度；七年不改对应山体久立；精神领袖作用对应地标；程心依赖对应靠山。
context_alignment: 程心被时光抛进陌生纪元，公元人物成为仍与旧时代相连的固定地形，山的年代感尤其贴切。
narrative_function: 把罗辑、弗雷斯和稍后维德归入同一公元力量谱系，解释程心复杂的依靠感。
transfer_rule: 人格如山时，应写出稳定来源、时间考验、他人如何据此定位或支撑，以及力量的具体表现。
failure_boundary: 三人性格和伦理立场差异巨大，山只概括程心感到的强度与稳定，不能抹平其行动后果。
