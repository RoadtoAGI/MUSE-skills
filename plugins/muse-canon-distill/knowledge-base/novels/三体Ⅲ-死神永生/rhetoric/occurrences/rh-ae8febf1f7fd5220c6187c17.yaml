chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 归零者做的事，更像是一种宗教，一种行为艺术
sensory_mapping: 归零工程像一场宇宙宗教仪式，也像以整个维度作材料的行为艺术，完成动作本身即是宣言。
context_fact: 关一帆认为零光速会切断一切行动，因此从理论上看无法拨过宇宙零点。
image_mechanism: 宗教解释信念来源，行为艺术解释实践价值；双喻体把科学不可行与伦理象征意义分开。
property_alignment: 重启愿景对应终极救赎；归零者对应信徒；宇宙降维对应仪式；不确定成效对应信仰；行动宣言对应行为艺术。
context_alignment: 宇宙战争把规律当武器，归零者把同一规律改造当信仰与艺术，高等文明对规则的用途出现伦理分岔。
narrative_function: 标注理论可信度，同时保留归零者理想主义的敬畏感，而非简单判作技术方案。
transfer_rule: 宏大不可证行动类比宗教艺术时，应分别说明信仰、仪式、象征、实用结果和参与代价。
failure_boundary: 归零者可能拥有关一帆不知道的科学证据，宗教或艺术标签来自其个人判断。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 归零者在缺乏可验证可行机制下仍以宏大信念推进宇宙归零和重启行动
vehicle: 依赖终极信仰、共同仪式和献身的宗教，以及以行动本身表达观念、不保证实用结果的行为艺术
ground: 目标超越现有证据；参与者需要信念；行动具有象征性；成败无法在参与者生命期验证；过程本身传达价值；可能要求巨大牺牲
