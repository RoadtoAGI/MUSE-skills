chapter: 【掩体纪元11年，星环城】
figure_type: analogy
quote: 就像一群寻宝的人，突然挖出了宝藏。于是把工具胡乱地扔到周围，把宝藏小心翼翼地放到中央的空地上
sensory_mapping: 工具散墙；宝物居中；空地环护；骤然发现；兴奋凌乱
context_fact: 智子屏蔽大厅的设备显然刚被匆忙移开，只有曲率驱动机器孤零零立在中央。
image_mechanism: 空间布置被倒推成一段刚发生的寻宝动作：外围混乱记录了抛工具的急切，中央空白记录了托举宝物的谨慎，静物因此显出人的兴奋。
property_alignment: 实验设备对应工具；曲率装置对应宝藏；墙边堆放对应坑边弃具；中央机器对应中央珍品；清空距离对应保护范围；技术突破对应发现宝物；团队情绪对应寻宝兴奋
context_alignment: 曲率驱动是被禁止多年的突破，维德团队准备以战争守护它；宝藏模型同时说明技术价值和近乎占有式的狂热。
narrative_function: 不用直接描写研究者表情，凭大厅痕迹还原发现时刻并提高机器登场分量。
transfer_rule: 以寻宝场面解释工作区凌乱时，应让外围旧工具、中央新成果、匆忙动作痕迹和珍重隔离形成完整因果链。
failure_boundary: 设备按计划整齐撤除、中央机器是常规设施，或团队对它漠不关心时，寻宝狂喜会误读现场秩序。
