tenor: 实验室人员匆忙把大量仪器推到墙边，为中央孤立的新机器腾出宽阔场地并以兴奋、珍重的态度围护它
vehicle: 寻宝队突然发掘珍贵宝物，激动地把铁锹工具随手丢在坑边，再将宝物谨慎安放于中央供人观看
