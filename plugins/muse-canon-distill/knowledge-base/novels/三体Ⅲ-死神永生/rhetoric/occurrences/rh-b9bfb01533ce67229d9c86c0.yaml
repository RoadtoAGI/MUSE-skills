chapter: 【掩体纪元11年，光速二号】
figure_type: metaphor
quote: 降低光速的试验研究就像是对光的不择手段的酷刑。人们把各种极端的物理手段作用于光，打击它，扭曲它，折断它，肢解它，拉伸它，压扁它，甚至消灭它
sensory_mapping: 光被折断；光束受压；无形肢解；刑具轮换；受刑者沉默
context_fact: 六十年研究几乎无突破，磁场和引力等极端手段只能改变光的频率、路径等，不能改变真空传播速度。
image_mechanism: 抽象实验参数被翻译成对一具光之身体的暴力动作，方法清单的技术升级变成刑罚升级，而恒定光速表现为受刑后仍不屈服。
property_alignment: 科学家对应施刑者；光对应有身体的受刑者；物理场对应刑具；扭曲频率路径对应身体变形；多类实验对应轮番刑罚；无突破对应不屈服；消灭光子对应致命手段
context_alignment: 高Way把光速等同自己的强硬性格，酷刑框架同时写科研挫败与他投射出的受难自我。
narrative_function: 把漫长失败史压缩为节奏强烈的动作链，并显露研究者对自然规律由探究转为敌意。
transfer_rule: 用酷刑写强制性实验时，应让每种实验操作能对应具体施力动作，并让研究目标表现出持续抵抗或不变结果。
failure_boundary: 实验温和观察、对象随手段顺利改变，或研究者没有强迫其突破边界的意图时，酷刑会夸大暴力与挫败。
