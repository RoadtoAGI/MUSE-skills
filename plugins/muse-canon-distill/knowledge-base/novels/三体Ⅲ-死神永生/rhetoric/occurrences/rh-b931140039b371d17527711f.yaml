figure_type: simile
quote: 王朝与时代像焰火般变幻
sensory_mapping: 王朝名称化成夜空光团，几次明灭便完成兴起、鼎盛与消亡。
context_fact: 叙述刚列完以千万、亿年计的地质时期，随后压缩到人类文明和宇宙飞船。
image_mechanism: 焰火以瞬时亮灭把历史压缩成可观看的节奏，灿烂保留文明成就，熄灭则标出其短促。
property_alignment: 焰火骤放对应王朝兴起；色彩变换对应制度与时代更替；迅速熄灭对应其在生命史尺度上的短暂。
context_alignment: 三十五亿年的平稳长线旁突然插入快速闪光，正贴合倒计时中时间尺度骤缩。
narrative_function: 以绚烂而短命的画面校准人类历史比例，反衬此刻决定却能终结全部生命史。
transfer_rule: 写快速历史更替时，选择同时含绽放、变化和消退的短周期过程，并先建立更长时间参照。
failure_boundary: 焰火由人设计且按节庆燃放，不能暗示王朝更替具有预设图案或只有美感而无苦难。
