tenor: 白Ice厉声阻止瓦西里伸手后，以眼神补足未公开说出的危险理由
vehicle: 目光拥有语言器官功能，能把一条完整命令无声传给对方
ground: 信息内容具体；发送与接收双方共享背景；没有声音；情绪强度替代语调；接收者能够理解
