figure_type: metaphor
quote: 目光说出了剩下的话，“想想我的导师吧！”
sensory_mapping: 面罩挡住他的脸，眼神却像穿过玻璃的无声句子，把丁仪之死直接推到瓦西里面前。
context_fact: 丁仪曾直接接触水滴后被杀，白Ice担心瓦西里重复导师行为。
image_mechanism: 眼睛说话让省略句仍有明确语义，面罩和真空环境还强化视觉通道的必要性。
property_alignment: 目光对应发言；凝视强度对应语气；导师共同知识对应词汇；瓦西里停手对应听懂。
context_alignment: 程心与云天明也曾用眼睛说话，此处同一手法从爱情默契转为死亡警告。
narrative_function: 避免重复解释丁仪前史，同时把白Ice的阻止写得比厉声更私人、更紧迫。
transfer_rule: 目光承载具体话语时，应提供共享事件、可复原句意、情绪和对方行为反馈。
failure_boundary: 目光不能通用编码复杂语言，句意由叙述者基于上下文补全；他人未必能同样读懂。
