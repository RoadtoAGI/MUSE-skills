chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 这些画色彩浓烈，狂野奔放，想象汪洋恣意，在变幻的光影中像活了一样
sensory_mapping: 色块呼吸；线条奔跑；光影游动；壁画苏醒；满地生命
context_fact: 涂鸦铺满裸露内壁，上方大量漂浮建筑将持续变化的斑斓光影投在画面上。
image_mechanism: 移动的城市投影成为壁画的外部脉搏，使固定色块轮流明灭、轮廓游走，静态绘画于是呈现出呼吸和动作。
property_alignment: 移动投影对应生命脉搏；色彩明灭对应呼吸；狂野笔触对应肢体姿态；光影位移对应行走；大片画作对应生命群落；强饱和色对应活力
context_alignment: 这座贫穷城市的居民和建筑都在漂浮，连墙上图像也随光“活”起来，强化无固定秩序却生命旺盛的城市性格。
narrative_function: 让静态涂鸦承接悬浮城市的动态，使社会活力沉到城市最外层表面。
transfer_rule: 写画面“活了”时，应给出能造成局部明灭、轮廓位移或姿态变化的具体光学与构图条件。
failure_boundary: 均匀恒定照明、低饱和静物画或严格几何图案没有可感运动时，“活了”只剩泛化赞叹。
