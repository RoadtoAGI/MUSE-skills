figure_type: simile
quote: 这句话中最后两个相同的词像两声霹雳
sensory_mapping: 点阵译出的两个黑暗森林依次在寂静太空艇中炸亮，远处两舰也像被同一雷声击中。
context_fact: 四维遗迹描述毁灭海洋的鱼从一片黑暗森林奔向另一片，这一概念本由人类独立发现。
image_mechanism: 霹雳把语义震惊同时转成声与光，两次重复则严格对应两次落雷，词序本身形成冲击节拍。
property_alignment: 两个词组对应两声雷；意外同名对应突然闪电；文明史含义对应巨大轰鸣；众人寒战对应受雷惊颤。
context_alignment: 交流此前缓慢而抽象，这两个熟悉词突然证明宇宙法则跨文明存在，雷击感来自识别而非陌生。
narrative_function: 标出对话的核心揭示，使维度战争与黑暗森林理论在一个生理反应中接通。
transfer_rule: 重复词如连雷时，应让次数一一对应，并由前置信息说明每次重复为何增加而非稀释冲击。
failure_boundary: 词语没有真实音爆，监听信号也很微弱；霹雳表示认知后果，不能推出魔戒在威胁人类。
