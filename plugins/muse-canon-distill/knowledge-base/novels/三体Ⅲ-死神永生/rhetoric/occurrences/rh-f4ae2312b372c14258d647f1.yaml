chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 程心从童话的梦中突然惊醒
sensory_mapping: 三个童话像合拢的梦境，倒计时把她猛然叫醒，麦田和死亡审核重新扑入眼前。
context_fact: 故事结束时会面只剩一分钟，程心必须立即面对分别和生死线。
image_mechanism: 惊醒把叙事退出写成意识状态切换，突然一词保留现实回归的生理震动。
property_alignment: 故事世界对应梦；沉浸聆听对应睡眠；倒计时对应唤醒刺激；回到任务对应醒后辨认现实。
context_alignment: 童话本就承担伪装，梦境表层既美丽又不可信，醒来意味着重新承受情报代价。
narrative_function: 用单一动作结束长篇插入叙事，并把离别情绪瞬间推至前景。
transfer_rule: 从叙事抽离写成醒梦时，应说明梦境内容、唤醒信号、意识断点和醒后现实。
failure_boundary: 程心没有真正睡着，且始终保留记忆任务；梦只描述注意力占据。
