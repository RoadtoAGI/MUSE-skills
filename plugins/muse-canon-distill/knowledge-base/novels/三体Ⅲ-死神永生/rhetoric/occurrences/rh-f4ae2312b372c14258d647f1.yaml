tenor: 程心从对童话的深度投入骤然返回会面即将结束的现实
vehicle: 睡梦者因刺激突然醒来，虚构场景消散并重新意识到现实时间地点
ground: 此前沉浸于非现实场景；转换突然；醒后重获危险意识；前后感受断裂
