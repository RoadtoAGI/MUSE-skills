tenor: 稳定重复、低缓包围公主并使其迅速入睡的海浪声
vehicle: 以缓慢节拍和柔和旋律反复演唱、专门引人安睡的催眠曲
ground: 节奏重复；音量稳定；持续包围；降低警觉；直接促进睡眠
