chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 涛声像催眠曲
sensory_mapping: 浪声一拍一拍从黑海送来，像没有歌词的低声摇唱，把她的疲劳带进睡眠。
context_fact: 公主整日奔逃、身体疲惫，躺到温暖沙层后很快酣睡。
image_mechanism: 海浪周期天然对应音乐节拍，催眠曲再把物理重复连接到入睡效果。
property_alignment: 浪涌周期对应曲拍；涛声低缓对应旋律；连续海声对应反复演唱；快速睡着对应催眠。
context_alignment: 此前海声像巨人呼吸令人警觉，此刻同一声音变成摇篮曲，显示公主开始适应外界。
narrative_function: 完成从危险探海到安睡的情绪降速，并为铃声惊醒制造声场反差。
transfer_rule: 自然周期声比作音乐时，应匹配节拍、音色、持续性、听者状态和实际效果。
failure_boundary: 涛声没有旋律创作者，风浪变化时也未必舒缓；催眠效果依赖公主疲劳。
quality_assessment: effective
