chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 即使水滴敢于攻击这种屏障，它也变成了一枚一次性的炮弹
sensory_mapping: 原本可反复穿城的水滴撞上同硬度屏障后，被压缩成一发出膛弹丸，撞过一次便留在靶面。
context_fact: 人类已能少量制造SIM，若再有十年，可能用其建造导弹或防御屏障对抗水滴。
image_mechanism: 炮弹身份把近乎无敌、可连续机动的水滴降格为可消耗弹药，精确呈现防御材料改变交换比。
property_alignment: 水滴高速冲撞对应炮弹飞行；屏障命中对应撞靶；水滴被毁对应一次性消耗；失去连续攻击对应不可复用。
context_alignment: 占领只早到十年便截断技术窗口，喻体让错失的反制能力具体到一换一。
narrative_function: 显示人类并非永久无解，强化威慑失败发生时点的悲剧性。
transfer_rule: 把高阶武器降格为弹药时，应明确改变的是复用次数、命中交换和战术位置。
failure_boundary: 水滴是否必毁仍是推测，推进和机动也远胜普通炮弹；喻体只覆盖撞击后的可复用性。
