tenor: 水滴撞击由强互作用力材料建成的防御屏障后可能同归于尽的战术角色
vehicle: 发射后只完成一次撞击、不能回收或继续作战的普通炮弹
ground: 杀伤依赖高速接触；命中后自身失去继续使用能力；一次攻击只换取一个局部结果
