chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 冰沙听到他发出了吧嗒吧嗒的脚步声，像难以抑制的心跳
sensory_mapping: 吧嗒节拍；胸腔撞动；安静背景；声音逼近；压不住的慌张
context_fact: 针眼无法画下不符合透视原理的深水王子，回来报告前失去了往日灰鼠般的无声步态。
image_mechanism: 画师的恐惧从胸腔移到脚底，每一步都替心脏敲一下地面；空殿放大节拍，冰沙在见到表情之前先听见失败。
property_alignment: 脚步落地对应心脏搏动；重复节奏对应心律；声音变响对应情绪加剧；无法放轻对应难以抑制；向冰沙靠近对应坏消息逼近
context_alignment: 上一场针眼像老鼠无声离去，此刻脚步成为心跳，声学反差直接显示连他也被深水的异常吓乱。
narrative_function: 让失败消息先以声音抵达，延长冰沙等待答案的恐惧。
transfer_rule: 用心跳写脚步时，应有规律落点、安静背景、情绪压力、声音反常增强和主体无法控制。
failure_boundary: 脚步拖沓无节律、由硬鞋材质单纯放大，或人物情绪平静时，心跳会虚构心理证据。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 一向走路无声的针眼画师失败归来时，异常清楚、急促的脚步在冰沙耳中暴露紧张
vehicle: 人在恐惧或激动中无法控制的心脏反复撞击胸腔，把内部慌乱变成可听节拍
ground: 吧嗒脚步对应心搏节律；声音反常明显对应心跳加重；难以消除脚步对应心跳不受意志控制；接近房间对应焦虑逼近
