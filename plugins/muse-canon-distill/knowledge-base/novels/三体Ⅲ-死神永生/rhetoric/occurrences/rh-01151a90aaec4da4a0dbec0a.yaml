chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 我觉得那应该叫黑墓，自掘坟墓
sensory_mapping: 黑色墓穴；文明自埋；封土隔宇；静止存活；星空墓外
context_fact: 黑域会使太阳系与宇宙隔绝、技术倒退，内部没有任何东西能越过视界。
image_mechanism: “黑域”只说空间颜色，AA把“域”改成“墓”并加入挖掘动作，主动安全立刻显出活着进入死亡容器的悖论。
property_alignment: 低光速区对应墓穴；视界对应墓壁；建造黑域对应挖墓；文明对应入墓者；技术锁死对应死亡静止；隔绝星空对应地下黑暗；永久封闭对应埋葬
context_alignment: AA把星空与梦想相连，她反对的核心是文明活着却失去未来；坟墓比普通监狱更贴合这种精神死亡。
narrative_function: 用命名争夺把三方案的价值冲突人格化，鲜明建立AA支持光速飞船的立场。
transfer_rule: 用自掘坟墓评价策略时，应由主体主动选择、代价近乎不可逆，并让保存肉体与终结发展同时成立。
failure_boundary: 方案只是短期避险、仍保留开放交流与复苏通道，或死亡风险反而显著降低且无长期损失时，坟墓判断会过激。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: AA认为把太阳系变成黑域虽可免受攻击，却等于主动终结文明向宇宙扩展和高技术发展的未来
vehicle: 活人亲手挖掘黑暗坟墓、躺入其中并封土，虽然隔绝外界伤害，却把自己置于死者状态
ground: 黑域对应坟墓；太阳系封闭对应墓穴密封；人类实施对应自掘；技术停滞对应社会死亡；黑暗不可见对应墓中无光；永久不出对应埋葬；安全静止对应死者不受袭
