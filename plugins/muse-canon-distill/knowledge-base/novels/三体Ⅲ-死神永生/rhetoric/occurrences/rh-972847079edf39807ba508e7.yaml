chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 那里好像是澳大利亚土著文化的博物馆
sensory_mapping: 普通房间的墙角和墙面化成展柜，树皮画、长矛与乐器逐件显出文物标签般的年代感。
context_fact: AA初到弗雷斯家，对树皮画、岩画、土著乐器、草裙、飞去来器和颜料充满好奇。
image_mechanism: 博物馆把私人生活空间转成文化存档地，也暗示这些东西在现实社会中已近乎退出日常。
property_alignment: 屋内古老器物对应馆藏；按墙面陈设对应展览；AA参观试用对应观众互动；土著文化濒危对应文物化。
context_alignment: 弗雷斯苏醒后发现族群文化接近消失，他的家因此既是住所，也是少数仍有生命的保存现场。
narrative_function: 通过AA的好奇引出弗雷斯的文化身份，并为随后毛利战舞示范准备器物舞台。
transfer_rule: 将私人空间比作博物馆时，应具备成体系藏品、展示关系和文化退出日常的背景。
failure_boundary: 这些器物仍被主人使用而非封存展品，房屋没有公共策展功能；喻体只写陈列密度和保存作用。
