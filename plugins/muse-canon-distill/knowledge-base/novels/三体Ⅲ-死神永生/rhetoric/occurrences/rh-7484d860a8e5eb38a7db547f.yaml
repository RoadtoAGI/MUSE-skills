chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 她的心脏艰难地跳动着，像一根即将断裂的琴弦
sensory_mapping: 每次心跳都像过度绷紧的弦颤一下，细弱余音尚未消失，断裂已在下一瞬等着。
context_fact: 叶文洁在红岸峰顶临终，视野出现黑雾，观看云海中最后一次夕阳。
image_mechanism: 琴弦把心跳的节律与临界脆弱性合为一物，读者能同时听见生命余音和预感突然静止。
property_alignment: 心肌搏动对应弦振；生命张力对应绷紧；衰弱心跳对应细微琴音；死亡对应断弦；最后时刻对应临界点。
context_alignment: 四世纪后太阳也在最后日落中熄灭，个人心弦的断裂预奏了母星恒星系统的终止。
narrative_function: 以身体听觉细节唤回全书开端人物，把当年的象征性落日接到今日真实落日。
transfer_rule: 生命节律比作琴弦时，应对齐振动、张力、音量、断裂后果和场景中的终止时刻。
failure_boundary: 心脏不是单根弦，停止也不一定像物理断裂般瞬时；琴音感来自节律与临界状态。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 叶文洁生命最后时刻衰弱、勉强维持且随时可能停止的心跳
vehicle: 被拉到极限、仍在微微振动却即将崩断的一根琴弦
ground: 持续振动；张力极高；节奏微弱；声音与生命相连；断裂会使振动骤停；状态不可维持
