chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 木星像一堵遮蔽一切的暗壁
sensory_mapping: 无边暗墙；微弧表面；太阳被遮；世界尽头；墙脚小艇
context_fact: 太空艇飞离亚洲一号后才看见木星背面，因距离近无法容纳完整行星轮廓。
image_mechanism: 行星曲率在巨大尺度上几乎被拉直，变成一面从上下左右都越出视野的暗墙；程心不是看一颗球，而像抵达宇宙边界。
property_alignment: 木星表面对应墙面；巨大半径对应墙面近似平直；背阳黄色阴影对应暗色墙材；遮蔽太阳对应挡住墙后光；小艇对应墙前人；不可见全貌对应墙无边；掩体功能对应实体屏障
context_alignment: 木星正是掩体计划的遮挡物，墙不仅描述外观，也准确体现其保护城市的战略功能。
narrative_function: 将木星尺度和掩体作用合一，收束程心对行星巨大性的震惊。
transfer_rule: 用暗壁写近距巨行星时，应有弧度极小、视野占满、背光暗面、遮挡远景和观察者贴近边界。
failure_boundary: 远距可见完整球体、行星被强光照亮，或不遮挡主要威胁方向时，暗壁会错写尺度与功能。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 近处木星背阳面巨大到只能看见小弧边，占满视野并完全遮断太阳和更远太空
vehicle: 一堵无边高阔的黑暗墙体横亘面前，封死视线和通路，墙外一切都不可见
ground: 行星弧面对应墙面；占满视野对应墙无边；背阳暗色对应暗壁；遮太阳对应阻断墙后；太空城临近对应人站墙脚
