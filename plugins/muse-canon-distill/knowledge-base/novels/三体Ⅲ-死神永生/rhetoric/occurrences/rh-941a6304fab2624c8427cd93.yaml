figure_type: analogy
quote: 这堆食品就如同一块扔进浑水的雪团一样很快融化不见了
sensory_mapping: 方正食品垛缩成白雪团，黑压压人群成为浑水，从四周蚀入，几息间只剩翻动表面。
context_fact: 食品垛落地后警戒线崩溃，人群围住它并立即争抢。
image_mechanism: 融化精确表现食品不是整块搬走，而是在群体接触面上被连续拆散，浑水还保留现场污浊混乱。
property_alignment: 食品垛对应雪团；人群包围对应浑水；逐包拆走对应边缘融化；整体消失对应雪形散尽。
context_alignment: 食物本应缓解饥饿，却在无分配秩序中瞬间消散，雪的短命感强化救济无效。
narrative_function: 压缩第一次抢夺全过程，并让第二架运输机到来时失败已经可预见。
transfer_rule: 物资在人群中消失可借溶解过程，但需对应初始块体、包围介质、侵蚀边界和最终不可见。
failure_boundary: 食品没有改变物态，只是被个人拿走；若物资整批由少数人搬走，均匀融化不合。
