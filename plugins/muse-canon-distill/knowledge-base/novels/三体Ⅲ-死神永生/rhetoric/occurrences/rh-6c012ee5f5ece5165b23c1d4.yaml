chapter: 【威慑纪元61年，执剑人】
figure_type: metaphor
quote: 就是这个已经没入虚无的人，却给他爱的人留下了一个实实在在的世界
sensory_mapping: 云天明的身体和名字沉入黑暗空洞，一颗恒星与两颗行星却从他手中留在明处，具有真实重量和轨道。
context_fact: 阶梯飞行器偏航后从未被截获，计划被遗忘；DX3906却发现两颗行星，所有权证书获得巨大现实价值。
image_mechanism: 虚无与实在构成物质反差，人越不可见，礼物越庞大可证；留下把情感行动变成跨世纪遗产。
property_alignment: 云天明失踪对应没入虚无；历史遗忘对应无踪迹；恒星行星存在对应实在世界；赠星法律效力对应留下遗产。
context_alignment: 群星计划原被当作卖废纸，个人也被当作无用者，二者在未来同时反转，实在世界成为双重证明。
narrative_function: 用存在论反差重新引入云天明线，把程心唤醒、财富与后续命运连接到早年的无望赠礼。
transfer_rule: 消失者留下实物时，可对照主体可定位性与遗产可验证性；尺度反差应来自情节事实而非空泛赞颂。
failure_boundary: 若人物仍有可靠消息或遗产仅具象征意义，虚无与实在的两极会过重；没入虚无不等于确认死亡。
quality_assessment: exemplary
