review_status: reviewed
tenor: 云天明已失踪且被历史遗忘，他赠给程心的恒星系却成为有行星、有价值的真实资产
vehicle: 一个人沉入没有形体与踪迹的虚无，同时从消失处留下完整可触的世界
ground: 主体自身不再可定位、不可接触；其行为结果却稳定存在，并在物质尺度上远大于个人
