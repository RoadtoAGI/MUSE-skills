chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: “万有引力”号上只有一个人如释重负
sensory_mapping: 半世纪潜伏使命像重物压在亨特肩上，警报一响，重量落地，他终于能直起身去完成任务。
context_fact: 亨特被秘密安排在舰上监视军方，一旦有人借危机控制广播权就须采取行动。
image_mechanism: 释负反转一般警报情绪：众人紧张时他放松，因为危险出现也意味着长期不确定责任有了出口。
property_alignment: 秘密使命对应负重；多年等待对应长途背负；警报触发对应抵达卸货点；准备行动对应身体松开。
context_alignment: 他是舰上年龄最大者，负重意象同时带出长期时间和身体承压感。
narrative_function: 立刻标记亨特与全舰情绪相反，引出潜伏者身份和广播权冲突。
transfer_rule: 惯用释负要给出具体负担、持续时长和解除节点，反常情境可增强人物秘密。
failure_boundary: 警报并未消除客观危险，解除的是等待使命的压力；若人物无需承担责任，释负便无来源。
