chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 那将是她人生的最后港湾
sensory_mapping: 人生航船；风浪在后；星云港口；静水停泊；最后靠岸
context_fact: 程心决定冬眠到太阳被打击后的年代，希望看到文明存续，并逃离当前社会对她的崇拜。
image_mechanism: 她跨越三个世纪的冬眠与危机被串成漂泊航线，尚未到来的星云时代向内凹成避风水域；“最后”让寻求安宁同时带上终老意味。
property_alignment: 程心对应航船；一生对应航程；多次冬眠对应远航跳段；社会危机对应风暴；打击后时代对应港湾；心灵安宁对应静水；定居余生对应停泊；死亡终点对应不再起航
context_alignment: 她刚站在真实海岛和失效灯塔旁，航海意象从现场自然生长；但把灾后世界当港湾也保留其判断的悲剧性误差。
narrative_function: 为再次冬眠赋予情感终点，同时以安全港期待反衬即将到来的二维灾难。
transfer_rule: 用最后港湾写人生归宿时，应有此前长期漂泊、具体风浪、主动寻找庇护、预期停留至终点和现场水域意象支撑。
failure_boundary: 人物只做短期访问、仍计划继续冒险，或目标时代比当前更明确危险且人物已知这一点时，港湾会误写风险认知。
quality_assessment: exemplary
