review_status: reviewed
tenor: 程心设想黑暗森林打击后的时代能让她避开当下崇拜与负罪感，在余生获得安宁甚至幸福
vehicle: 经历漫长危险航行的船最终驶入受保护港口，停泊后不再出海，并在那里结束全部航程
