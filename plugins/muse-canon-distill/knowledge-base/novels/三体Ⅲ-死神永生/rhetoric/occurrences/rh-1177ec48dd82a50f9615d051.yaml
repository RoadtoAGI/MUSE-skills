chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 地球被作为一个知识电池来使用，试图在为其充电后获得更高的能量
sensory_mapping: 地球文明装进电池外壳，三体知识沿导线充入，人类科研反应在内部积蓄，新的理论从另一端放电。
context_fact: 三体异常慷慨地传送完整学科体系，并催促地球加快消化，学者推测其想利用人类科学加速优势。
image_mechanism: 电池把教育、创新和回收分成充电—储能—放电三段，揭示慷慨背后可能存在的工具性收益循环。
property_alignment: 三体知识输入对应充电；人类科学系统对应储能介质；创新增值对应化学转化；反向新知识对应放电能量。
context_alignment: 人类也把云天明大脑当作敌心炸弹，此处三体可能把整个地球当器件，形成文明互相工具化。
narrative_function: 为知识开放提供非善意解释，保持威慑和平表面下的战略怀疑。
transfer_rule: 群体如电池时，应明确输入、内部转化、输出和受益者；若没有回收渠道，只能写培养而非蓄电。
failure_boundary: 三体若纯粹无偿分享、无法获取人类成果，电池使用说缺少放电环节；人类知识生产也非被动储能。
