chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 太空城仍处于三维的部分在中央显得很小，且正在迅速向平面沉下去，像一头巨鲸的脊背
sensory_mapping: 铺展的二维城像海，中央三维椭球只露一道暗弧，仿佛巨鲸最后一截背脊沉入水下。
context_fact: 外部镜头显示太空城大部已二维化，完整过程不到十分钟。
image_mechanism: 巨鲸用身体体量与露背姿态精确匹配椭球残部，让无形维度边界呈现为可见水面。
property_alignment: 椭球弧面对应鲸背；二维平面对应海面；已二维部分对应没入身体；残部缩小对应下潜；完全二维化对应鲸体消失。
context_alignment: 前文太空城是破口巨轮，此处观察角度转到外部，人工船变成被海吞没的生命，沉没框架连贯变形。
narrative_function: 用外景给出整城坍缩进度，并在广阔二维结果中标出最后一点三维体积。
transfer_rule: 曲面残部比作鲸背时，应交代观察角度、露出比例、周围界面、下沉速度和最终消失。
failure_boundary: 太空城无生命也未在液体中游动；鲸背只描述三维残部的弧形和没入过程。
