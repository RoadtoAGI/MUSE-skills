tenor: IDC已解码曲率驱动与黑域等主要情报，只剩针眼画作情节无法确定含义
vehicle: 一幅由许多异形小片拼成的图画已显出整体，最后一个空缺等待唯一合适的拼图片填入
ground: 各条线索对应拼图片；战略全貌对应完整图像；成功解码对应拼片归位；针眼画作对应缺片；多义性对应形状待匹配；完成情报对应图面闭合
