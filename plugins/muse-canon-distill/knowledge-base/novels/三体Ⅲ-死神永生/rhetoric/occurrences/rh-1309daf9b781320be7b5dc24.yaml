chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 云天明情报的大部分拼图已经完成，只剩一块：针眼画师的画
sensory_mapping: 情报拼图；整图渐显；单块空缺；画片待嵌；边缘已合
context_fact: 研究者已经由肥皂船、雪浪纸、伞、深水王子和旋涡解出光速飞船与安全声明。
image_mechanism: 分散童话意象被铺成同一平面，已解含义互相咬合形成大图，针眼画作因无法与现有边缘匹配而以一个醒目空洞存在。
property_alignment: 童话情节对应拼片；情报系统对应图像；双层隐喻对应拼接边；解码成功对应嵌入；针眼画对应末片；解释约束对应轮廓匹配；战略真相对应图案
context_alignment: 后文称画作像维纳斯断臂永远失落，拼图先建立“应当补全”的期待，断臂再将空缺转为不可复原。
narrative_function: 简洁汇总解码进度，并把最后谜题隔离成读者会持续记住的缺口。
transfer_rule: 用拼图写调查时，应有多个互相约束的独立线索、逐步显现的整体和一个边界明确却暂未匹配的缺口。
failure_boundary: 线索彼此无关、可能构成多幅不同图景，或所谓最后一块并不影响整体结论时，拼图会制造虚假完备性。
quality_assessment: conventional
