chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 太空背景上的一小片白色，像夜空中的一片羽毛
sensory_mapping: 黑夜背景；孤白羽片；柔软边缘；轻微漂浮；远处小斑
context_fact: 三体星系已经被光粒摧毁，原始图像缩小时只见白斑，放大后才显出壮丽螺旋星云。
image_mechanism: 一整个文明的墓场被距离压成可吹走的白羽，爆发的凌厉结构在原始视野里只剩柔边；轻盈外观遮住毁灭重量。
property_alignment: 三体星云对应羽毛；白色物质对应羽色；模糊边缘对应羽绒；太空黑幕对应夜空；远距微小对应单片尺度；星云漂浮对应羽毛悬空；毁灭后残片对应脱落之羽
context_alignment: 后文将其称银色墓场，羽毛的轻与文明毁灭的重构成观测距离带来的残酷反差。
narrative_function: 先给出原始尺度，再为放大后的壮丽与真实毁灭蓄积反差。
transfer_rule: 用羽毛写远距星云时，应匹配浅白、柔边、小面积、暗背景和表观轻盈，并有尺度反差意义。
failure_boundary: 星云颜色浓烈、边缘锐利放射、充满视野时，单羽会弱化真实结构。
