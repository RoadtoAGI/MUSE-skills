tenor: 低光速环境中关一帆贴近并大声呼喊，通信传到程心耳中却音量微弱
vehicle: 说话者压低声带、贴近听者才可听见的轻微耳语
ground: 音量很小；需要近距；内容仍可辨；与紧急情境不匹配；听觉反馈弱；实际发声强度与接收反差大
