figure_type: simile
quote: 凭接触的感觉她知道他肯定在大声喊，但她听到的声音很小，像是耳语
sensory_mapping: 关一帆身体用力喊叫，耳机里却只剩贴耳般的轻声，仿佛灾变把吼声压成耳语。
context_fact: 太空服控制和通信系统停机，关一帆通过接触抓住程心并使用残余或模拟方式传声。
image_mechanism: 耳语以人际声量标尺显示低光速系统衰退，危急内容与微声之间的错位加重孤立感。
property_alignment: 微弱接收声对应耳语；面罩隔绝对应贴耳需求；大喊动作对应关键反差；紧急命令对应耳语内容不合。
context_alignment: 太阳系最后人声从吟唱到寂静，这里幸存者的紧急喊叫也被新宇宙环境压至耳语。
narrative_function: 交代通信异常，同时让关一帆镇定指令在极小声音中显得更紧迫。
transfer_rule: 大喊听成耳语时，应写出实际发力证据、传输介质、接收音量和情境错位。
failure_boundary: 关一帆没有主观压低声音，耳语感可能来自设备故障而非低光速直接声学效应。
