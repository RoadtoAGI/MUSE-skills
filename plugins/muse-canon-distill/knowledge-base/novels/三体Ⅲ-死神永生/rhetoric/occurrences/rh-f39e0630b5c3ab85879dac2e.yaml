tenor: 逃向发射港的空中车流在地面形成连续移动的暗影，像城市人口和活力正从内部大量外泄
vehicle: 受伤身体的血液从创口成股流出，带走生命并在表面留下移动暗红痕迹
ground: 城市对应身体；发射港方向对应伤口；车辆人群对应血液；连续车流对应流血；地面影子对应血痕；逃亡导致空城对应失血
