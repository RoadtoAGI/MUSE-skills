chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 车流在地而投下了一条流动的影子，仿佛是城市流淌而出的血液
sensory_mapping: 城市身体；长条血流；地面暗影；创口外泄；生命抽离
context_fact: 大量市民因未经证实的打击消息离开城市，集中冲向发射港。
image_mechanism: 空中车辆的影子把分散个体连成一股暗液，城市边缘的发射港成为伤口；车流每向外移动一段，城市就像失去一部分生命。
property_alignment: 城市对应肉身；居民车辆对应血细胞；空中车流对应血液；发射港对应出血口；地面流影对应血迹；集体逃离对应失血；城市功能受损对应生命衰弱
context_alignment: 飞蝗写群体本能，血液再从城市整体尺度写逃亡代价，两种生命图像由个体群转向受伤母体。
narrative_function: 把交通拥堵提升为城市生命外流，预示恐慌本身会伤害文明。
transfer_rule: 用流血写城市人口外逃时，应有城市身体、连续外向流、明确出口、生命资源带走和可见痕迹。
failure_boundary: 车流只是正常通勤并会当日返回，或城市同时大量吸纳人口时，失血会夸大不可逆损耗。
