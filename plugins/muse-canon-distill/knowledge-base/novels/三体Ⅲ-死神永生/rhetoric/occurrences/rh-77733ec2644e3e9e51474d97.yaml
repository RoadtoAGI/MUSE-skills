chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 威慑是个舒服的摇篮，人类躺在里面，由大人变成了孩子
sensory_mapping: 黑暗森林威慑弯成柔软摇篮，地球躺在其中被和平轻摇，成年手脚逐渐缩回儿童尺寸。
context_fact: 星舰人群认为地球选择程心显示已无能力维持终极威慑。
image_mechanism: 摇篮把安全与退化放在同一装置中：保护本身持续有效，却因过度舒适让被保护者失去成人责任。
property_alignment: 威慑屏障对应摇篮护栏；和平生活对应轻摇舒适；决断能力下降对应成人变孩童；依赖罗辑对应需要照料者。
context_alignment: 程心的圣母婴儿照片正在旁边显示，摇篮和孩子直接进入会场视觉语境，而非抽象责骂。
narrative_function: 用一幅家庭图景解释威慑纪元社会性格变化，并强化深空人类与地球人类的分化。
transfer_rule: 安全退化如摇篮时，要同时承认保护作用、指出依赖对象、能力退失和逆成长结果。
failure_boundary: 和平也能发展技术和文化，不必然幼稚；成人变孩子是星舰军人的价值判断，可能带偏见。
