tenor: 长期威慑和平使地球社会失去承担毁灭决断和维持警觉的成熟能力
vehicle: 成年人长期躺进舒适摇篮受保护，身体与心智逆生长为依赖照料的孩子
ground: 安全环境隔绝外部风险；舒适削弱自主能力；主体从承担责任退回依赖保护者
