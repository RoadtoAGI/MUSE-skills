chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 于是，程心生活的天空中又多了一个太阳
sensory_mapping: 妈妈和女儿的小世界展开成天空，养父升起为第二轮太阳，原本缺光的一侧被新的暖光覆盖。
context_fact: 程心由母亲收养，长大后感到父爱缺失；母亲找到有责任感的伴侣后，她认为家庭完整。
image_mechanism: 又字保留母亲已有阳光，新增太阳不取代旧光源，而是解释两种亲情共同构成家庭气候。
property_alignment: 母爱已有对应原太阳；养父加入对应新日升起；父爱温暖对应日光供热；家庭完整对应天空照亮。
context_alignment: 程心后来把新人类当孩子并以母性守护，双太阳童年说明她把爱理解为世界存续条件的来源。
narrative_function: 以光源结构压缩收养家庭形成史，解释程心强烈的照护本能和对完整小世界的珍惜。
transfer_rule: 亲人如太阳时，应说明其持续照亮的具体行为与原有光源关系；新增光源适合互补而非竞争。
failure_boundary: 若人物关系不稳定、带来伤害或只短暂出现，持续太阳会美化现实；爱也不能消除所有家庭问题。
quality_assessment: effective
