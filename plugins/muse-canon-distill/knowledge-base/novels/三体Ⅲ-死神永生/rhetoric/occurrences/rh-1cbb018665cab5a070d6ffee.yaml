chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: simile
quote: 主核指引着歌者的视线，像在星空中挥动一支长矛
sensory_mapping: 视线长矛；星空划转；矛尖锁星；主核挥臂；攻击待发
context_fact: 歌者已取出用于清理的质量点，主核把他的目光定位到广播坐标的星系。
image_mechanism: 无形注视被拉直成有长度和尖端的兵器，搜索动作同时成为瞄准动作；主核不是展示位置，而是替清理员举矛指敌。
property_alignment: 视线对应矛；方向性对应矛杆；视觉焦点对应矛尖；主核控制对应挥动者；快速转向对应挥矛；远星对应攻击目标；质量点待发对应后续投掷
context_alignment: 歌者一边把清理当琐事，一边所有感知动作都军事化；长矛揭示“看见”已经与“攻击”绑定。
narrative_function: 把遥远坐标定位转成近身瞄准，提前为弹出质量点制造攻击姿态。
transfer_rule: 用长矛写视线时，应有明确线性方向、快速转向、尖端焦点和随后可能发生的锁定或攻击。
failure_boundary: 目光漫无目的扩散、同时观看整片区域，或观察者没有锁定对象的意图时，长矛会错误收窄感知。
quality_assessment: effective
