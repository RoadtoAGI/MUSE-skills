chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 对方的眼睛仿佛是自己眼睛的镜像，进射出同样的因顿悟而兴奋的光芒
sensory_mapping: 两双对视眼睛；镜面反射；同步亮光；无声确认；一闪即移开
context_fact: 两人都从博物馆展品联想到曲率航迹，因担心智子监视而用表情确认后故作冷淡。
image_mechanism: 两人之间仿佛竖起透明镜面，程心眼中的顿悟光立刻在AA眼里原样返回；无需说出名词，同步亮度已完成确认。
property_alignment: 程心眼睛对应镜前对象；AA眼睛对应镜像；共同结论对应相同图案；兴奋对应同亮度；同时顿悟对应反射无延迟；迅速移目对应打破镜面交流
context_alignment: 不能开口的处境把眼睛变成安全通信界面，镜像比‘相似表情’更强调双方同时掌握同一秘密。
narrative_function: 以无声对视确认关键解码，又保存人物对监控的谨慎。
transfer_rule: 用镜像写共同顿悟时，应具备对视、同步出现的认知、相同情绪强度、无语言反馈和立即互认。
failure_boundary: 双方理解不同、情绪一冷一热，或一个人只是模仿另一人的表情时，镜像会误写共识。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 程心与AA对视时发现两人同时理解童话中的曲率驱动线索，并同样兴奋又不敢明说
vehicle: 镜子把一只眼睛完整复制到对面，形状、亮度和每一瞬变化都同步对应
ground: 相同顿悟对应镜像内容一致；同时兴奋对应光芒同步；目光相遇对应物与镜面对视；无需语言对应镜像直接反馈
