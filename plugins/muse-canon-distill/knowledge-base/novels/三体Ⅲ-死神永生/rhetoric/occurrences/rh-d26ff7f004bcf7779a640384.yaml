chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 被什么力量攫住，仿佛进入了海面下的一条轨道，沿着与浪带一致的方向滑行
sensory_mapping: 水下钢轨；船底扣合；固定弧线；平稳滑行；看不见的牵引
context_fact: 杰森驾驶小艇越过海面浪带，随即进入默斯肯大旋涡的势力范围。
image_mechanism: 流动海面忽然在船底硬化成有槽的弧轨，艇身从晃动转为稳定，不是恢复控制，而是被旋涡接管后沿看不见的线路运送。
property_alignment: 小艇对应轨道车；旋涡水流对应铁轨；越过浪带对应车轮入槽；切向流线对应轨道弧线；水力攫住对应轮轨扣合；无法自由转向对应不能脱轨
context_alignment: 旋涡尚未显露全貌，轨道感先让平静滑行带上被捕获的危险，符合工程人员从运动约束判断流场。
narrative_function: 标记小艇从自主航行进入旋涡控制，并为随后沿水墙下滑建立运动规则。
transfer_rule: 用轨道写流体捕获时，应对应入轨节点、单一方向、平稳牵引、横向自由消失和潜在脱轨困难。
failure_boundary: 船仍能任意转向、流向频繁随机变化，或动力完全压过水流时，轨道会误写约束强度。
