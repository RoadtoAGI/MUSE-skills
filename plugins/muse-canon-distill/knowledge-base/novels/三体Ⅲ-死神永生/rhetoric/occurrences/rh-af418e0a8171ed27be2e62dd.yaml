chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 外面孤独的橡树，不过是坟墓中伸出的枯骨
sensory_mapping: 树干成为埋尸，枝条成为指骨肋骨穿出土层，窗外土地整体化为坟墓。
context_fact: 云天明在医院面对死亡和外星酷刑想象，夕阳已被看成血。
image_mechanism: 枯枝外形先对应骨骼，坟墓再把局部树景扩成死亡世界；活植物被人物视线彻底剥夺生机。
property_alignment: 裸枝对应骨骼分叉；无叶对应肉体剥尽；孤树对应单具遗骸；医院临终处境对应坟墓环境。
context_alignment: 与墙上血摊构成同一死亡滤镜，一内一外封闭人物视野。
narrative_function: 把环境中最后的生命物改写为遗骸，标志云天明此刻无法看见任何生机。
transfer_rule: 树骨喻体应由季节性裸枝和硬质轮廓支撑；若扩展为坟墓，场景还需有明确死亡认知压力。
failure_boundary: 枝叶繁茂、嫩芽生长或群林葱郁时，枯骨与孤墓不成立；它也不表示树真的死亡。
