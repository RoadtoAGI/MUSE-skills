chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 像是后者收集的一个古董或废品
sensory_mapping: 宇航员贴在晦暗水滴旁，用仪器查看它，像在仓库里翻检一件旧机械藏品。
context_fact: 隐形穿梭机推着水滴减速，两名宇航员紧贴其表面，其中一人进行研究。
image_mechanism: 古董保留水滴的历史重量，废品则标记功能死亡，两种命名都把主客关系翻转给收集者。
property_alignment: 失效陈旧对应古董；功能丧失对应废品；宇航员研究对应收藏鉴定；被推行对应物件搬运。
context_alignment: 末日战役中无人能接近水滴，今日它落入人类收藏语汇，尺度反差直接呈现四维优势。
narrative_function: 以屈辱性静物图像确认水滴被征服，并加强万有引力号人群的认知震撼。
transfer_rule: 昔日威胁降为藏品时，应有功能失效、安全接触、被动搬运和历史残值。
failure_boundary: 古董可能有珍贵价值，废品则贬值，两者评价不同；文本以并列保留这种不确定。
