tenor: 被蓝色空间号人员捕获、贴近研究且失去神性的水滴
vehicle: 探险者从旧时代捡来的古董或废弃物，被搬运、端详并归入收藏
ground: 对象曾有历史威名但当前功能失效；收集者可安全接触操纵；价值转为研究或陈列而非威胁
