tenor: 将极小质量物体加速到近光速，利用巨大相对论动能摧毁恒星的光粒武器及其低成本灭绝效率
vehicle: 枪械发射一枚体积极小、成本低廉的子弹，以集中动能击穿远大于自身的目标
ground: 光粒对应子弹；加速器对应枪；发射对应扣动扳机；恒星对应靶标；相对论动能对应弹丸冲击；质量小对应弹药节省；摧毁文明对应击杀；“经济”对应低投入高杀伤
