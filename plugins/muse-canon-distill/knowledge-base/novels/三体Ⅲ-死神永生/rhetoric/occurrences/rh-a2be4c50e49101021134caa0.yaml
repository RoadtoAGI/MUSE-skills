chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 只需发射极小质量的“子弹”即可产生巨大的摧毁能力，确实很“经济”
sensory_mapping: 光速子弹；宇宙枪口；恒星靶心；小弹巨爆；冷酷成本表
context_fact: 人类只观测过两次光粒攻击，知道其依靠接近光速产生的相对论质量和动能。
image_mechanism: 恒星级灭绝被缩入枪弹动作，武器的规模不在弹体而在速度；引号把“经济”从工程效率反照成清理文明的冷酷会计语言。
property_alignment: 光粒对应子弹；发射文明对应枪手；近光速推进对应火药加速；恒星对应靶；动能对应穿透力；极小静质量对应小弹；毁灭星系对应致命命中；成本低对应弹药经济
context_alignment: 黑暗森林打击选择利用目标恒星自身能量，子弹—经济框架揭示宇宙清理为何可以普遍、随意发生。
narrative_function: 以常见武器模型解释光粒原理，并用反讽引号突出灭绝的工业化冷漠。
transfer_rule: 用子弹写高速天体武器时，应有小质量弹体、定向发射、速度提供主要动能和明确远距目标；成本评价需显出伦理反差。
failure_boundary: 攻击依靠大体积爆炸物、持续能束或目标自身自然坍缩时，子弹模型会误写能量来源。
