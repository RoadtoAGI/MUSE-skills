chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 奇点和大爆炸会把这个宇宙的一切记忆都抹去
sensory_mapping: 大坍缩像把宇宙卷成一张纸，再由爆炸擦成空白，文明写下的每一行都不再可读。
context_fact: 程心计划把部分人类记忆带进新宇宙，647号宇宙能跨过大坍缩保存信息。
image_mechanism: 抹去把物质毁灭转成信息表面清空，直接说明她要保存的不是个体肉身而是可读记忆。
property_alignment: 文明历史对应字迹；物质载体对应纸面；奇点爆炸对应擦除；新宇宙无旧信息对应空白页；小宇宙备份对应另存副本。
context_alignment: 程心刚依靠石刻让信息跨越千万年，此刻将同一保存冲动扩大到跨宇宙创生。
narrative_function: 确立她在小宇宙的新生活目标，并预示终章漂流瓶记忆体。
transfer_rule: 记忆毁灭写成擦除时，应说明载体、擦除力量、不可读后果和备份如何越过清空。
failure_boundary: 宇宙重启是否抹去全部信息属理论推测，记忆也不一定像表面字迹可完整复制。
