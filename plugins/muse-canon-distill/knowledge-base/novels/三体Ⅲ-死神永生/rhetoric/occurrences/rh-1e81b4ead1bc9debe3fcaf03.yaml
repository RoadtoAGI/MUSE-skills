chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 身姿和举动仍显出如水的轻柔
sensory_mapping: 她转身与行走的关节折点被抹平，动作像水面起伏一样连成柔滑曲线。
context_fact: 智子改穿迷彩、短发并携武士刀，但原有女性身姿和举动没有消失。
image_mechanism: 水只保留运动质地，不规定单一形状，使柔美能嵌入军装和武器带来的硬朗外观。
property_alignment: 水流连续对应动作流畅；水随形对应姿态灵活；水触感柔对应举止轻柔。
context_alignment: 柔水与下一句致命绞索相邻，表明危险并未替换女人味，而是寄生于同一种柔软。
narrative_function: 保留智子旧形象的识别点，为柔美与杀气融合而非简单换装建立基础。
transfer_rule: 用水写动作时，应指定连续、随形或柔触等可见性质，并让动作句法本身保持流动。
failure_boundary: 水的透明、湿润和无力未映射到智子；若动作急促僵硬，惯用的如水会成为空泛赞美。
