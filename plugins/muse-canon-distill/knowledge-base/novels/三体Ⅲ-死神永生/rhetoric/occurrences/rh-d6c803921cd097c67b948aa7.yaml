chapter: 地球文明
figure_type: simile
quote: 人类似乎拥有了神一般的力量
sensory_mapping: 量子器件、太空城和掩体工程像一连串神迹，把人类托到近乎造物主的高度。
context_fact: 这种力量面对把信息留存一亿年的要求失效，最可靠方案仍是恐龙脚印式的石刻。
image_mechanism: 神力先把技术能力推到最高尺度，随即由时间夺回权柄，使能力落差成为全段的哲学冲击。
property_alignment: 创造奇迹对应施展神迹；建造世界对应造物；突破旧限制对应超凡；似乎一词对应全能只是错觉。
context_alignment: 太阳系末日证明人类既不能阻止降维，也不能保证自己的文字存活，神性在墓室中被撤销。
narrative_function: 建立文明自我认识的峰值，让后面的时间主宰与远古婴儿形成最大反差。
transfer_rule: 把技术能力比作神力时，应给出具体神迹，并安排一个能检验和限制所谓全能的尺度。
failure_boundary: 人类没有超自然能力，也不能支配时间和宇宙规律；相似仅在技术造成的主观全能感。
