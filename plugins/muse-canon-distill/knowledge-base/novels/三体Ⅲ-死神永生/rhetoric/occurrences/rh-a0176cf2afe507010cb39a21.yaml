chapter: 【威慑纪元61年，执剑人】
figure_type: metaphor
quote: 她和AA就像站在一棵发光圣诞树上的两只小蚂蚁，周围是圣诞树的森林，光辉灿烂的大楼像叶子般挂满了每根树枝
sensory_mapping: 高架街变成树枝，大楼变成亮叶灯饰，人缩成蚂蚁，整座城市从工程体生长为节庆森林。
context_fact: 威慑纪元地面城市采用巨树式立体结构，穴居时代结束，夜间光辉灿烂。
image_mechanism: 圣诞树统一分枝形态与发光装饰，蚂蚁完成尺度校准；森林再把单体复制到城市全景。
property_alignment: 街道分叉对应树枝；楼宇悬挂对应叶片；城市灯光对应圣诞灯饰；两人微小对应蚂蚁。
context_alignment: 程心初见未来繁荣，节庆意象呈现和平乐观，蚂蚁尺度又保留技术宏伟造成的眩晕。
narrative_function: 用一个可持续空间框架介绍未来城市，为后续树枝、森林、精灵描写提供坐标。
transfer_rule: 城市树化应先对齐道路拓扑、建筑挂载和光分布，再用缩尺生物标人物尺度；后续纯沿用不重复建卡。
failure_boundary: 平面网格城市、建筑落地且道路不分枝时，圣诞树拓扑失效；无灯夜景也缺少节庆发光。
