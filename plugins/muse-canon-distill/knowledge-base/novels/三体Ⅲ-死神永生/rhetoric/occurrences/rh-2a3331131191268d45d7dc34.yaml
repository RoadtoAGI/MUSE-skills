chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 熔化物在平面上成极薄的一层，发出妖艳的彩光，像撒在平面上的焰火
sensory_mapping: 艇体结构摊成一层彩焰，红蓝金光像被一把撒在透明纸面，妖艳地标出死亡区域。
context_fact: 无形二维面无法直接观测，只有被降维物质发光后才能显示其位置。
image_mechanism: 撒焰火用颗粒化色光描出平面，庆典意象与毁灭内容相撞，形成审美恐怖。
property_alignment: 二维结构光对应焰火；平面扩散对应撒开；多色对应彩焰；短暂亮起对应焰火寿命；毁灭能量对应燃爆。
context_alignment: 后文启示号二维化也以焰火般光芒照亮黑暗，此处建立灾难反复出现的光学签名。
narrative_function: 让不可见平面获得轮廓，同时规定二向箔场景的美丽—死亡双重色调。
transfer_rule: 毁灭光景比作焰火时，应同时映射颜色、展开方式、持续时间、能量来源和反讽情绪。
failure_boundary: 焰火在三维空间爆散且为庆祝而造，二维光层没有这种目的或运动。
