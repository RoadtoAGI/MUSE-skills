tenor: 自卫队战士对可能被战争毁灭的普通生命表现出极端轻蔑和无所顾忌
vehicle: 把人的生命当作遍地廉价、可随脚踩断丢弃的枯草和碎秆
ground: 生命对应草芥；价值轻贱对应随处可见；杀伤对应踩断割除；人数众多对应草丛；缺乏同情对应不顾植物损伤；战争消耗对应清除杂草
