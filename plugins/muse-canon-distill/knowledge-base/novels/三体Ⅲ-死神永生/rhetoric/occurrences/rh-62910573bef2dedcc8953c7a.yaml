chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 视生命如草芥
sensory_mapping: 人命成草；脚下碎秆；随手割除；遍地轻物；无声踩折
context_fact: 战士携带上百颗反物质子弹，准备以能毁灭太空城的力量对抗联邦舰队。
image_mechanism: 人的身体和未来被压缩成脚下没有重量的植物碎屑，持武者无需面对具体死者，只需跨过可清除的障碍。
property_alignment: 普通生命对应草芥；价值被贬低对应廉价；大规模伤亡对应成片割除；战士力量对应践踏者；漠然对应不低头察看；城市居民对应草群
context_alignment: 反物质武器能让一座太空城瞬间毁灭，草芥尺度暴露使用者如何在心理上缩小潜在海量伤亡。
narrative_function: 在武器展示前给出伦理危险信号，说明威慑来自价值判断而不只来自火力。
transfer_rule: 使用生命如草芥这一惯用隐喻时，应有掌权或持武者、可造成大规模伤亡的能力，以及对具体生命价值的明确漠视。
failure_boundary: 人物只是情绪冷淡却会主动保护生命，或没有决定他人生死的能力时，该成语会把距离感夸成残暴。
