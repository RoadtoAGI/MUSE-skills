chapter: 【掩体纪元67年，冥王星】
figure_type: metaphor
quote: 直接进入行星的引力深井要求飞船具有极高的强度
sensory_mapping: 类地行星的引力在太空中张开一口无形深井，星环号必须以坚固船体一路沉到井底。
context_fact: 同类恒星际飞船通常用穿梭机登陆，星环号能凭全流线船体直接在行星降落。
image_mechanism: 井将抽象引力势转成有高度差的地形，既解释登陆为何困难，也暗示从表面重返太空的能量代价。
property_alignment: 行星中心对应井底；引力势差对应井深；下降登陆对应入井；逃逸能量对应爬井；强度要求对应承受深入环境。
context_alignment: 星环号能进入引力深井，稍后却面对连光速也逃不出的二维跌落区，常规深井能力显出极限。
narrative_function: 用成熟物理意象快速交代飞船罕见的行星登陆能力，为冥王星行动建立可信条件。
transfer_rule: 使用引力井时，应把井深对应势差、下落对应获能、爬出对应能耗，并交代飞船因此需要的性能。
failure_boundary: 太空中没有实体井壁或向下的绝对方向，船体强度还受大气、推进和着陆载荷共同影响。
quality_assessment: conventional
confidence: 1.0
review_status: reviewed
tenor: 恒星际飞船下降到中等质量固态行星表面并承受强引力、大气和再入载荷的过程
vehicle: 从外部越过井口深入一口深井，下降容易而返回需克服巨大高度差
ground: 势能随下降降低；脱离需要大量能量；路径朝中心收束；深度体现束缚强弱；进入后承受更大环境压力
