chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 像一大片刚扔到沙漠上的折纸玩具
sensory_mapping: 白亮板房缩成折纸小屋，硬直折痕铺满黄沙，仿佛一阵风就能把整片吹走。
context_fact: 四十亿移民被集中到澳大利亚，程心看到正午沙漠上新建的密集简易房。
image_mechanism: 折纸同时命中板材的折面几何和结构脆弱，扔字则将规划宏业改写成仓促处置。
property_alignment: 薄板房对应折纸材质；棱面结构对应纸折痕；新建脆弱对应玩具不耐用；散布沙漠对应随手扔落。
context_alignment: 世界级强制移民承诺基本生存，眼前住房却像儿童模型，尺度反差暴露安置工程的虚弱。
narrative_function: 用第一眼景观定下澳大利亚生活的临时、拥挤和不安全基调。
transfer_rule: 描写临时建筑群时，喻体应同时匹配材料、几何、摆放方式和环境尺度。
failure_boundary: 房屋仍具实际居住功能并非玩具；若结构厚重、与地基牢固结合，折纸的轻脆感不成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 仓促建成、遍布沙漠的合成板和薄金属板简易住房
vehicle: 大量轻薄、棱角整齐却经不起挤压，被随手撒在地面的折纸玩具
ground: 材料薄而折线分明；外观崭新不牢；数量多且排列像临时散落；环境尺度使其显小
