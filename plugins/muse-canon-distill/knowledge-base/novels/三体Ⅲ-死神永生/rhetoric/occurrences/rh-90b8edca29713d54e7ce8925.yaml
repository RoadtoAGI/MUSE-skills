chapter: 【掩体纪元67年，冥王星】
figure_type: metaphor
quote: 在这毁灭前夜的孤独航行中
sensory_mapping: 八至十天被压成一夜，星环号像黑暗里唯一未熄的房间，向没有黎明的终点飞行。
context_fact: 联邦公告确认逃逸成功率为零，两人以不间断睡眠避开足以使人崩溃的胡思乱想。
image_mechanism: 前夜用日常时间单位压缩宇宙末日倒计时，并借夜的黑暗与静止承载航程孤独。
property_alignment: 末日前几天对应前夜；二维完成对应次日事件；睡眠对应过夜；孤船对应黑暗独处；警报对应临夜通知。
context_alignment: 通常前夜通向新日，这里的毁灭前夜没有可醒来的文明早晨，反转强化绝望。
narrative_function: 跳过数日航程而保持倒计时张力，把睡眠写成面对终局的唯一心理防护。
transfer_rule: 把倒计时写成前夜时，应明确即将发生的事件、剩余时长、夜间行为和预期清晨是否成立。
failure_boundary: 航程实际持续数天且没有地球昼夜，前夜只表示历史阶段接近终局。
