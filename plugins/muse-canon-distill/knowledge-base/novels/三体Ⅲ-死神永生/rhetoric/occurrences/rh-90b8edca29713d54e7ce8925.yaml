tenor: 太阳系整体二维化前最后几天里，程心和AA独自飞往冥王星的航程
vehicle: 重大事件发生前的最后一夜，黑暗覆盖、等待将尽、天明即迎来不可逆结果
ground: 时间所剩极短；终局确定；主体在黑暗中等待；环境寂静孤独；正常秩序暂停
