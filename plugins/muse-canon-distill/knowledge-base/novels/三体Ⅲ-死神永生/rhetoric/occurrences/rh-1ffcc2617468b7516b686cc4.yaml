chapter: 【威慑后第一年，移民完成后第六天清晨，澳大利亚】
figure_type: simile
quote: 只是感觉他们的话音像咒语一般，使周围的其他声音越来越稀少，最后竟完全消失
sensory_mapping: 远处模糊话音像低声施咒，一层层罩过广场，脚步、哭号和议论依次被消音。
context_fact: 程心失明且离市政厅很远，只听见智子和另外两人发言，周围人群逐渐沉默。
image_mechanism: 咒语把因信息震撼而静听的社会过程写成声音直接施力，也符合程心无法获知语义、只能感受效果。
property_alignment: 听不清内容对应神秘咒文；话音持续对应施法；声音减少对应环境被控制；全场静默对应法术完成。
context_alignment: 深空广播消息对澳大利亚人如神迹降临，咒语语汇贴合他们尚不知内容便已被集体改变。
narrative_function: 从失明听觉制造消息揭晓前的静场，并让欢呼爆发拥有最大声量落差。
transfer_rule: 话语如咒语时，应有语义不可辨、效果可观察、逐步作用和群体受控四环。
failure_boundary: 静默来自人们主动关注而非超自然强制；若听者清楚内容并公开讨论，咒语神秘性减弱。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 远处信息窗中无法听清的讲话逐步压住广场喧闹、让所有人安静聆听的作用
vehicle: 施法者念出含义神秘的咒语，声音持续时周围事物受法力控制并停止活动
ground: 听者不理解具体词句；声音具有逐步支配环境的效果；群体行为像受同一法术约束
