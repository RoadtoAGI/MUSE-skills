chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 以至于澳大利亚成了一个地球世界的缩小版
sensory_mapping: 整张世界地图被折压进一块大陆，纽约、东京和上海缩成板房区，各国政府像模型标牌挤在一起。
context_fact: 移民按国家分区，各国行政系统迁入，澳洲旧地名被国家和城市名称替换。
image_mechanism: 缩小版同时说明组成复制与尺度压缩，全球政治边界没有消失，只被迫在高密度空间重演。
property_alignment: 各国区域对应原世界国家；迁入政府对应组织复制；旧城市名对应模型标签；大陆拥挤对应比例压缩。
context_alignment: 人类被要求聚成单一保留地，却仍带着旧世界全部分界，微缩结构预示冲突也会一并压入。
narrative_function: 用空间模型解释澳大利亚为何迅速承受全球治理难题和国家战争。
transfer_rule: 称场所为世界缩影时，应核对组成、标签、组织关系和缩放后的密度变化。
failure_boundary: 澳大利亚不再保有原世界资源分布和完整城市，只复制政治人口框架；不能推断功能等比例存在。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 各国人口、政府和地名按国家区域集中到澳大利亚后的政治地理结构
vehicle: 把原物所有主要分区按比例压缩、仍保留相互位置和标签的微缩模型
ground: 原有组成单位大体齐全；每个单位占据更小空间；名称和组织关系随缩放保留
