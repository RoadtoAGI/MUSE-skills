chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: AA的话就像荷叶上的水滴从程心的思想中滑过，没有留下任何痕迹
sensory_mapping: AA一层层推理凝成水珠，落到程心封闭的意识表面，圆圆滑过便掉下，连一点湿痕都没留下。
context_fact: 程心只想见云天明倾诉，仍相信自己的第二次错误不可挽回。
image_mechanism: 荷叶的疏水性给心理拒绝一种材料机制：问题不在话语破碎，而在接收表面无法吸收。
property_alignment: AA劝解对应水滴；程心思想对应荷叶；内疚封闭对应疏水层；听见对应接触；不改变信念对应无痕滑落。
context_alignment: 前文情绪多次淹没人物，此处一滴劝慰之水反而无法润湿思想，水量与心理作用形成反差。
narrative_function: 迅速结束安慰辩论，表现程心的内疚不是靠逻辑反事实即可解除。
transfer_rule: 话语无效比作荷叶水滴时，应区分话语完整性与接收者表面性质，并写出接触、滑动、无痕结果。
failure_boundary: 程心仍理解AA的话，未来也可能重新评估；无痕只表示当下情绪未被改变。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: AA关于程心不应承担太阳系全部责任的劝解虽被听见，却未进入或改变她的内疚信念
vehicle: 水滴落在拒水荷叶表面，完整滚过后滑走，叶面不吸收也不留湿痕
ground: 短暂接触；无法渗入；表面排斥；迅速滑离；不留下改变；对象本身完整却无作用
