chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 议员席好像放在一个大坑中，现在，那里的人们一定感觉自己处在一个即将被填埋的坟墓里
sensory_mapping: 环形旁听席升成墓沿，各国首脑沉在坑底，智子每句话像一铲土从高处落下。
context_fact: 澳洲议会大厅中间席位低陷，智子刚要求四十二亿人互相作为粮食。
image_mechanism: 建筑高差把政治无权直接转成埋葬空间，填埋的未完成动作保持死亡正在逼近。
property_alignment: 低陷席位对应墓坑；高旁听席对应坑沿；灭绝宣告对应落土；首脑无力反抗对应死者受埋。
context_alignment: 前文国会像掩体和帐篷骨架、影子像吊尸，此处死亡意象由外观进入人们所在空间。
narrative_function: 把会议从协商程序改写为集体葬礼，显示各国首脑已无决策权。
transfer_rule: 场所如墓穴时，应利用真实高差、围合、上方压力和人物无出口感。
failure_boundary: 会场有实际出入口且人们仍活着；若空间平坦开放，填埋动作缺乏构图依据。
