chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 像从白天的天空中抓来的一朵云
sensory_mapping: 浴池托着一朵落地白云，泡孔在灯下鼓起翻动，像刚从蓝天抓进宫殿。
context_fact: 公主回忆浴宫奢华体验，赫尔辛根默斯肯香皂只蘸一下便产生巨大泡沫。
image_mechanism: 云把泡沫微孔的蓬松和漂浮统一起来，抓来动作则把浴宫奢侈写成占有天空。
property_alignment: 白泡对应白云；泡孔团簇对应云团；轻盈漂浮对应悬空；边缘变形对应云态变化。
context_alignment: 此刻公主露宿沙滩，只能看一小盆泡沫，记忆中的云团放大宫廷生活距离。
narrative_function: 用高空尺度恢复浴宫华丽，并为泡沫带来的失重柔软体验定调。
transfer_rule: 泡沫比作云时，应匹配颜色、孔隙团块、边缘、漂浮感和场景尺度。
failure_boundary: 泡沫湿润可触且会破裂，云由水滴悬浮在高空；抓取只是幻想动作。
quality_assessment: effective
