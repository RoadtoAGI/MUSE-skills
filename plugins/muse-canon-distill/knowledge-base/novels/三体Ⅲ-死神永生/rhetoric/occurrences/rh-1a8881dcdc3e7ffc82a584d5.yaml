review_status: reviewed
tenor: 浴池中雪白、蓬松、大团堆起且轻盈漂浮的香皂泡沫
vehicle: 从明亮天空摘下、边缘柔软松散并悬浮的白云
ground: 颜色纯白；形态蓬松；体量成团；重量轻；边缘不断变化
