chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 那轰鸣显示了一种碾碎一切、吮吸一切的力量和疯狂
sensory_mapping: 涡底巨口；轰鸣咆哮；水船被吮；船骨碾断；深洞吞咽
context_fact: 小艇越过泡沫线后不断沿倾斜水墙下滑，最终在底部吮洞中被折断绞碎。
image_mechanism: 漏斗几何被赋予口腔动作，孔洞成为喉口，水流成为吸气，船体断裂成为咀嚼；旋涡不再被动遵循重力，而像主动饥饿。
property_alignment: 旋涡孔洞对应口；涡流牵引对应吸力；水体下泻对应吞咽；船体破裂对应咀嚼；轰鸣对应兽吼；持续转动对应疯狂；无法逃逸对应猎物被咬住
context_alignment: 旋涡暗示黑洞，而黑洞常被说成吞噬一切；此处用实际船只的捕获与粉碎给宇宙隐喻提供可验证的地球尺度过程。
narrative_function: 增强旋涡威胁，并把抽象引力捕获转成有意志的捕食体验。
transfer_rule: 用巨口写旋涡或机器时，应有中心入口、持续向内流、物体破碎、强烈吸入声和无法挣脱的方向性。
failure_boundary: 水流缓慢向外扩散、中心没有孔洞，或物体完整通过不受损时，吮吸碾碎的口腔机制不成立。
quality_assessment: effective
