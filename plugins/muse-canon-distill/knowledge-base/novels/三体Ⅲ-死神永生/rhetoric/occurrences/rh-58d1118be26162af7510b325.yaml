tenor: 默斯肯旋涡底部高速转动的孔洞发出巨响，把水体、船只持续向下拖入并绞碎
vehicle: 一张疯狂巨口一边用硬齿碾碎进入物，一边持续吮吸吞咽，欲望无止境且声音如咆哮
ground: 涡底孔洞对应嘴；吸入水船对应吮吸；折断船体对应牙齿碾碎；轰鸣对应咆哮；连续流量对应饥饿；失控转动对应疯狂；后文吞没对应吞咽
