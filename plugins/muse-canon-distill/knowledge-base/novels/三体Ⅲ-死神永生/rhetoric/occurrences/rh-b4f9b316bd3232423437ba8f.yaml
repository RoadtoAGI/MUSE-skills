chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 一抹凄惨的微笑出现在云天明的嘴角，渐渐溢散开来
sensory_mapping: 嘴角成为墨滴落点，凄惨笑意像薄液越过唇边，在僵硬面孔上形成一片缓慢晕染。
context_fact: 他把程心使命话语听成让自己受永刑，却以微笑回答接受，真实感受不能公开。
image_mechanism: 一抹先把笑缩成色迹，溢散再给静态表情流动方向，使内心苦涩仿佛不受控制地从面具裂口漏出。
property_alignment: 嘴角初笑对应液滴起点；笑意扩大对应晕染扩散；凄惨情绪对应暗色墨迹；压抑失守对应液体溢出。
context_alignment: 前一句他把自己变成僵尸，此处微笑从尸样面具中渗出，形成情绪虽被封锁仍留下泄漏的连续动作。
narrative_function: 在口头同意前给出唯一可见的真实情绪，让接受同时包含报复、自毁和绝望。
transfer_rule: 表情液化时，应规定出现点、扩散路径和综合色调；溢字适用于情绪突破控制而逐渐外露。
failure_boundary: 突然大笑、整张脸同时变化或情绪明快时，缓慢暗色晕染不合；微笑也不能单独证明具体动机。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 云天明接受阶梯使命前从嘴角出现并缓慢扩展到面部的悲惨微笑
vehicle: 少量带色液体或墨迹从一点渗出，越过边界向周围缓慢晕开
ground: 表情由局部微弱起始；情绪沿面部连续扩散，范围增大但基调仍阴暗
