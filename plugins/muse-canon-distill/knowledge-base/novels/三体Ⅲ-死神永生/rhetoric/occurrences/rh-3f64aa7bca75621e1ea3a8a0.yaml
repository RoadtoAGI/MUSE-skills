chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 仿佛绘制这幅画的画师抓起一把金粉豪爽地撒向整个画面
sensory_mapping: 太阳一露头，金光像掌中粉末扬开，草叶、湖面、羊背同时粘上细碎亮金。
context_fact: 此前黎明已像逐步完成的画，太阳升起成为最后一项视觉变化。
image_mechanism: 撒粉把光的直线照射改成颗粒落布，豪爽动作强调日出覆盖之快和范围之大。
property_alignment: 阳光对应金粉；太阳出现对应扬手；反光点对应粉粒；全景变暖对应撒满画面。
context_alignment: 第一故事的魔画夺走生命，这位无形画师却以日光赋予风景生机，画的价值发生反转。
narrative_function: 为黎明绘画框架落下高亮收笔，并把公主对外界的惊喜推到峰值。
transfer_rule: 日光写成撒粉时，应匹配颜色、颗粒反光、覆盖速度、范围和动作主体出现的时点。
failure_boundary: 阳光没有颗粒且从单一方向传播，地面也不会残留金粉；喻体只描述瞬间着色。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 太阳跃出地平线时金色光线瞬间落遍已经清晰的乡野景物
vehicle: 画师在成画表面大把挥撒金粉，使所有区域同时出现明亮金色闪点
ground: 变化突然；颜色统一为金黄；覆盖范围广；光点闪烁；动作有完成作品的收尾感
