chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 星体的巨大并没有给它们带来实在感，它们像是时空的旋涡
sensory_mapping: 太阳和行星不再像硬质天体，只像时空表面卷起的巨大涡眼，边缘随乱流颤动。
context_fact: 程心发现二维太阳系与凡·高《星空》的旋涡笔触几乎重叠，星体面积甚至大过空隙。
image_mechanism: 旋涡取消物体与背景的本体差别：天体不是放在空间里，而像空间自身翻卷出的局部形态。
property_alignment: 二维星体对应涡心；巨大面积对应涡旋尺度；无厚度对应非固体流态；边缘躁动对应流线；不实在对应暂态结构。
context_alignment: 凡·高画中空间与物体同样躁动，降维现实让艺术直觉成为宇宙物理图像。
narrative_function: 把二维天体从科学剖面转成整体宇宙观，推动《星空》意象在末日完成验证。
transfer_rule: 实体比作介质旋涡时，应对齐边界、流动、持续性、背景连续和失去实体感的具体来源。
failure_boundary: 太阳行星仍由物质组成，未必实际旋转成涡；旋涡表达视觉与本体感受，不是测量结论。
quality_assessment: exemplary
