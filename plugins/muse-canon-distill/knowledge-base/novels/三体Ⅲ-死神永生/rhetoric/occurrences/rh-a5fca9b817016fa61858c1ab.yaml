tenor: 二维太阳系中面积异常巨大却平面、流动、缺乏实体厚重感的太阳与行星图形
vehicle: 时空介质自身卷动形成、只有流动形态而无独立固体边界的巨大旋涡
ground: 尺度巨大；边缘由流动定义；中心与周围介质连续；缺乏坚实体积；形态旋转躁动；似由空间过程暂时形成
