chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 云天明的目光像一双宽厚的手抚摸着她
sensory_mapping: 他的视线从几光年外伸成两只温暖大手，轻轻抚过程心绷紧的肩背，呼吸随之松开。
context_fact: 程心承担记录使命并担心触发红灯，云天明自然问候后，她极度紧张的精神稍放松。
image_mechanism: 通感把视觉接触转成触觉抚慰，宽厚不只形容手掌，也具体承载云天明成熟后的包容。
property_alignment: 注视对应手部接触；目光宽容对应手掌宽厚；喜悦温暖对应抚摸温度；程心放松对应肌肉被安抚。
context_alignment: 程心曾因朋友的多手抓心而活下，此刻云天明的双手不抓留而抚慰，手意象从救命压力转成重逢温柔。
narrative_function: 在首句问候后立即建立非语言亲密，说明三世纪经历没有消除云天明对她的情感。
transfer_rule: 目光如手时，应匹配接触部位、动作力度、情绪温度和被看者可观察的身体变化。
failure_boundary: 二人没有实际触碰，目光的含义也由程心感受解释；宽厚不能证明云天明没有隐瞒。
quality_assessment: exemplary
