review_status: reviewed
tenor: 云天明充满自然喜悦、宽容和安慰力量的注视，使程心紧张情绪缓解
vehicle: 一双宽厚温暖的手以轻柔动作抚过身体，传递安全、接纳和安慰
ground: 接触柔和；力量宽稳；作用指向安抚；接受者身体紧张下降；交流无需语言
