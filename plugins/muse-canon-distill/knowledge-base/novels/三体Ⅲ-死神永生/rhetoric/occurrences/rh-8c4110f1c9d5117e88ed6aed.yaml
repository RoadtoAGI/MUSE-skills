review_status: reviewed
tenor: 密集到遮住地面的三叶虫与蚂蚁群体运动
vehicle: 贴地铺开、整体发黑并不断起伏流动的水流
ground: 个体边界被数量淹没；群体连续覆盖地表；移动形成同向或波状涌动
