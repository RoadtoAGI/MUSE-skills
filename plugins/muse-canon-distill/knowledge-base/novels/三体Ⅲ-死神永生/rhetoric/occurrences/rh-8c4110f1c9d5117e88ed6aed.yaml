chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: simile
quote: 在无数双脚下，地面像涌动着黑色的水流，那是无数三叶虫和蚂蚁
sensory_mapping: 无数黑色小体合成一层活的液面，脚下地面随爬行泛起暗色波纹。
context_fact: 程心想象地球生命全部聚到潜意识地面上，从恐龙、人类一直堆叠到昆虫和三叶虫。
image_mechanism: 水流抹去单只虫体的轮廓，只保留密度、颜色和群体运动，让生命数量呈现为不可踏过的连续面。
property_alignment: 虫群黑色对应暗流颜色；密集相接对应水体连续；成片爬动对应水面涌动；位于脚下对应贴地流层。
context_alignment: 程心被全部生命目光围住，液化虫群让最微小的生命也获得足以覆盖大地的总体力量。
narrative_function: 补全生命法庭的尺度层级，使她面对的不只是大型动物，而是数量无穷的低等生命。
transfer_rule: 群体比作流体时，应匹配颜色、覆盖连续性和运动波形，并让观察高度支持俯视液面。
failure_boundary: 若个体稀疏、方向杂乱且地面大量裸露，水流会掩盖真实结构；虫群也不具备液体的实际压力。
quality_assessment: effective
