chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 死亡是唯一一座永远亮着的灯塔，不管你向哪里航行，最终都得转向它指引的方向
sensory_mapping: 永亮死灯；众生航船；远处指向；绕行无效；终点海岸
context_fact: 杰森四十岁患绝症后被迫冬眠，未来医学只是把死亡推远；他又亲手建灯塔保存旧航海技术。
image_mechanism: 杰森把亲手建造的导航物反转成终极目的地：通常灯塔帮助船避险，此灯却指向所有航行必然结束处；亮度代表死亡永远在视野中。
property_alignment: 生命过程对应航海；人对应船；选择对应航向；死亡对应灯塔；死亡必然对应永亮；延寿对应暂不转向；绝症对应远见灯光；时间对应航程；终结对应抵达
context_alignment: 众人正在不可逆旋涡中等待救援，灯塔就在岛上发光；具体现实、杰森经历与小说题名“死神永生”在一句中闭合。
narrative_function: 提出全书核心死亡观，使旋涡探险由解谜转为面对终极方向的哲学场景。
transfer_rule: 用灯塔写必然终点时，应让主体具有航程和多条可选路线，而灯光持续可见、无法熄灭，并最终支配方向。
failure_boundary: 终点可以永久取消、不同主体有真正不同的永续归宿，或灯塔仅提供避险而不对应抵达时，该绝对命题不成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 死亡作为所有生命不可避的共同终点，无论人怎样选择道路或借冬眠推迟，都最终抵达
vehicle: 海上唯一永不熄灭的灯塔持续向所有航船发光，船可暂时走不同航路，最后仍按它指示驶向同一岸点
ground: 人生对应航行；个人选择对应航路；死亡对应灯塔；必然终点对应永亮可见；衰老疾病对应逐渐转向；冬眠延命对应绕航；所有人对应各船；死神永生对应灯塔不灭
