chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 他仿佛就是一台工作机器，工作之外就在某个不为人知的地方关机了
sensory_mapping: 维德的身体成为带开关设备，办公室供电让其运行，离开工作场域后指示灯全灭。
context_fact: 程心只知道其履历，除母亲和猫外对住处、私生活一无所知。
image_mechanism: 运行与关机把可见时间切成两态，消除休闲、亲密等中间状态；信息空白被解释为功能系统停电。
property_alignment: 工作能力对应机器运行；职业外无信息对应关机；冷淡重复动作对应程序化执行。
context_alignment: 维德把人当任务资源，自身也被写成纯工具，非人化既是他人印象也是其伦理来源。
narrative_function: 概括角色极端职业化，并维持私人动机不可读的威胁感。
transfer_rule: 人物机器化应由功能单一、状态切换和情感不可见支撑；要注明这是观察者认知空白，而非全知事实。
failure_boundary: 若文本展示丰富私生活、工作外仍主动社交或行为常由情感即兴驱动，关机二态模型会失真。
quality_assessment: effective
