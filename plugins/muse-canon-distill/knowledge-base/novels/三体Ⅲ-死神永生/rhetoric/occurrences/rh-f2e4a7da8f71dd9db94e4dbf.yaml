review_status: reviewed
tenor: 只显露职业功能、几乎没有可见私人生活的维德
vehicle: 执行任务时运行、任务外彻底关机并失去可观察活动的机器
ground: 行为由单一功能定义；功能停止后不展示情感、关系或自主生活痕迹
