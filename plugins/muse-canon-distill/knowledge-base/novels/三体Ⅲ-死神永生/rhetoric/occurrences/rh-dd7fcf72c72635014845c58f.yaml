chapter: 【广播纪元7年，云天明的童话】
figure_type: analogy
quote: 看着船后海面上雪白的泡沫云河，以及陶醉其中的饕餮鱼，公主不由得想起了牧师讲过的天堂
sensory_mapping: 白云天堂；黑鱼安眠；云河朝圣；杀性消失；海上乐园
context_fact: 赫尔辛根默斯肯香皂泡沫能令饕餮鱼全身松软惬意，小船因此穿过原本无法航行的死亡海域。
image_mechanism: 海面泡沫已经被写成白云带，鱼群又像朝圣者汇入其中；公主顺势把空间抬升成天堂，凶兽在白云中获得救赎式安宁。
property_alignment: 泡沫对应天堂白云；饕餮鱼对应进入天堂者；陶醉对应至福；不再啃噬对应罪恶暂停；白色海路对应升天道路；香皂对应赐福媒介；海域安全对应乐园无害
context_alignment: 香皂隐喻低光速区域使攻击性文明失能，天堂联想把“安全”表现为舒适导致的主动安息，而非暴力消灭。
narrative_function: 为香皂机制赋予情感意义，使技术线索同时成为童话中由死亡到安宁的奇观。
transfer_rule: 由场景联想到天堂时，应具备白云或明光、痛苦停止、主体安宁和进入前后状态反转，并让宗教视角属于场中人物。
failure_boundary: 主体仍痛苦挣扎、白色环境具有毒性，或安静只是被杀死后的僵硬时，天堂联想会掩盖真实伤害。
quality_assessment: exemplary
