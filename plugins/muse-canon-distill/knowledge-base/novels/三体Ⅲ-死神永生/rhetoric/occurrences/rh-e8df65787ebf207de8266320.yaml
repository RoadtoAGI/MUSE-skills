chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 小艇像是从一只巨炉中飘出的一颗小火星
sensory_mapping: 终端站外壳被尾焰照成巨炉，球形小艇是一点橘亮火屑，从炉口飘进黑色太空。
context_fact: 太空艇以3G加速起航，终端站在后视窗中迅速缩小，发动机光反射在其外壳。
image_mechanism: 炉与火星利用真实尾焰颜色，把离港尺度关系写成燃烧物逸散，小艇的脆弱由微粒比例直接显现。
property_alignment: 终端站对应巨炉；发动机反光对应炉火；小艇对应火星；离港对应飞出；远距缩小对应火星消隐。
context_alignment: 程心乘普通小艇承担文明信息任务，宏大意义与火星般载具形成脆弱反差。
narrative_function: 从港内中心人物构图骤然拉远，重设小艇在地球和太空前的真实尺寸。
transfer_rule: 小型发光载具如火星时，应匹配母体炉膛、光源、逸出方向、尺度比例和进入的黑暗背景。
failure_boundary: 小艇由发动机主动推进，不是随机飘散火屑；终端站也没有实际高温炉膛。
quality_assessment: exemplary
