tenor: 发动机发光的微小太空艇离开庞大、映着强光的终端站
vehicle: 一粒发亮火星从巨大炉膛中轻飘逸出，尺寸相对炉体微小，迅速进入外部黑暗
ground: 主体发光且很小；出发点庞大明亮；离开动作由内部向外；尺度反差强；远离后迅速缩点
