chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 从一出生就一直把你关在一个小箱子里，也无所谓，可一旦把你放出来一次再关回去，就不一样了
sensory_mapping: 三维世界收成一只出生即合拢的箱子，四维经历掀开箱盖，返回时边框带着对比重新压来。
context_fact: 关一帆不确定自己是否做梦，只记得去过难以想象的宽敞地方，醒后现实突然狭窄。
image_mechanism: 两次进入同一箱子的感受由一次释放隔开，喻体把空间绝对尺寸转成经验参照变化，解释症状为何突然发生。
property_alignment: 终身三维经验对应生来住箱；四维空间对应箱外广阔；短暂高维体验对应被放出；返回三维对应重新关入。
context_alignment: 当事人尚无四维概念，只能用囚禁史描述感知阈值改变；模型比一般小空间恐惧更贴合事件顺序。
narrative_function: 用可复现思想实验向医生和读者传递维度体验，并成为识别四维碎片的关键口供。
transfer_rule: 解释适应性被对比打破时，可固定环境、只改变中间经验；前后同一对象的感受差应由参照更新产生。
failure_boundary: 若人物从未接触更大空间、返回处实际比原来宽敞，重新入箱的因果链断裂；它也不证明梦境的客观真实性。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类长期生活在三维空间尚能适应，短暂进入四维后返回三维便产生强烈幽闭感
vehicle: 自出生便住在小箱中的人第一次获释，见过外部广阔后又被关回原箱
ground: 未经比较时限制可被当作正常；更大自由一旦成为经验，原有边界便转化为无法忽略的囚禁
