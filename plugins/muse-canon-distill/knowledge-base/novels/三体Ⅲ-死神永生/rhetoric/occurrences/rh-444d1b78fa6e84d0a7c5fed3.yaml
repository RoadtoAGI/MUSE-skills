chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 你的目光很锐利，像烈焰旁出鞘的利剑
sensory_mapping: 少年一抬眼，两道视线像火边骤然抽出的亮刃，冷锋与热焰同时逼向国王。
context_fact: 针眼刚以畏缩少年形象入场，却能一眼记住国王并稍后用画像杀死他。
image_mechanism: 利剑把视线的方向和伤害潜能实体化，烈焰又将其与宴会灯火及后来火炬场景连接。
property_alignment: 凝视集中对应剑锋；目光锐利对应刃口；突然抬眼对应出鞘；危险气息对应烈焰旁武器。
context_alignment: 国王亲口识别出武器般的目光，却把它当艺术天赋赞叹，形成童话式命运预告。
narrative_function: 击穿小老鼠伪装，让凶器在受害者面前短暂闪光。
transfer_rule: 目光写成兵刃时，应落实方向、锋利感、显露动作、光泽和潜在受伤者。
failure_boundary: 凝视不能直接切割身体，火焰温度也不属于眼睛；真正杀人机制仍是画像。
