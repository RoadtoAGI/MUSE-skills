tenor: 针眼画师短暂抬眼时超出年龄的锋利、灼人且带危险的凝视
vehicle: 在烈焰边拔出、刃口锐利并被火光照亮的利剑
ground: 方向集中；锋利可伤；反光明亮；靠近热源；显露瞬间带威胁
