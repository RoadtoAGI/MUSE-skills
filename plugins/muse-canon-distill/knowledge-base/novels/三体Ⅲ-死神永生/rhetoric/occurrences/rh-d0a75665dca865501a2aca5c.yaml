chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 空间的每一处微小的部分都在惊惧和疯狂中流动着、翻滚着、颤抖着，像燃烧的火焰。却只散发出酷寒
sensory_mapping: 整片空间像无数火舌彼此卷动，颜色和纹路都在燃烧般发颤，迎面来的却只有宇宙酷寒。
context_fact: 太阳已熄灭，二维星体和空间在《星空》般的平面中失去实体与纵深。
image_mechanism: 动作高度对应火焰，末句立即撤掉热量属性；感官冲突让二维空间成为会冷燃的反自然物。
property_alignment: 空间流动对应火舌摆动；翻滚对应燃烧对流；颤抖对应焰缘闪烁；惊惧疯狂对应火势躁动；酷寒对应关键反差。
context_alignment: 凡·高笔下火焰般树与星空在这里融合，太阳的火已灭，空间仍保留燃烧外观。
narrative_function: 以视觉热、触觉冷的冲突写出二维宇宙的陌生法则，并把人物恐惧投射到每一寸空间。
transfer_rule: 用火焰映射动态纹理时，可有意保留运动属性并反转温度，但必须明确哪一项失配产生效果。
failure_boundary: 空间未发生化学燃烧，也不直接拥有惊惧情绪；火焰相似只在形态运动，温度恰好相反。
