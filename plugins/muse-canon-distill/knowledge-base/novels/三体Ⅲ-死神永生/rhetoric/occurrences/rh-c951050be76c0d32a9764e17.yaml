chapter: 地球文明
figure_type: metaphor
quote: 那时的玩世不恭也像从冬眠中苏醒了
sensory_mapping: 那份被威严压住四百年的轻佻像一只越冬动物，终于从厚重岁月下探出头来。
context_fact: 程心和AA看到的已不是威严执剑人，而是成为面壁者以前会说笑、会打趣的罗辑。
image_mechanism: 冬眠把人格特质的长期收束写成有生命的潜伏，苏醒解释旧罗辑为何在末日前重新回来。
property_alignment: 执剑岁月对应寒季；性格收敛对应休眠；卸下职责对应转暖；打趣言谈对应恢复活动。
context_alignment: 她们刚从冬眠抵达冥王星，文本把生理冬眠转移到罗辑的人格历史，形成隐秘呼应。
narrative_function: 压缩罗辑四百年的性格变迁，让末日重逢同时连接青年、执剑人和守墓老人。
transfer_rule: 用冬眠写性格回归时，应明确隐伏原因、持续时段、唤醒条件和苏醒后的可见行为。
failure_boundary: 玩世不恭并非独立生命，也未在某一刻突然醒来；比喻不意味着罗辑完全回到青年状态。
