tenor: 威慑终止后人类仍身处地球，却已经丧失文明自主权和安全控制
vehicle: 原本归某人支配的家园或财产在外力接管后改换主人
ground: 居住者仍留在原地；使用与决策权已经丧失；新控制者可以规定其命运
