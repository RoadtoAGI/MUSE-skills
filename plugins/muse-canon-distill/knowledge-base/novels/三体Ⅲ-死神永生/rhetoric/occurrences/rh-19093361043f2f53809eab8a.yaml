chapter: 【威慑后一小时，失落的世界】
figure_type: metaphor
quote: 一切依旧，但这个世界已经不属于人类了
sensory_mapping: 旗帜、戈壁和雪山仍是旧景，地球却像一处房契刚被夺走的宅地，人类成了尚未被通知的借住者。
context_fact: 水滴已摧毁引力波发射系统，地面人员尚不知道，景物和仪式会场仍保持一小时前的样子。
image_mechanism: 归属关系把不可见的战略控制权转成所有权变更，外观无变化与权利已易手因此可以并置。
property_alignment: 地球景物仍在对应房屋仍在；威慑能力丧失对应产权被夺；三体可支配人类对应新主人取得处置权。
context_alignment: 章节题为失落的世界，失落在这里指控制权先于土地和人口消失，正贴合程心所知与众人无知的时间差。
narrative_function: 以一句悖论式判断完成时代切换，使平静夕景本身成为战败证据。
transfer_rule: 写政权或主权丧失时，可用归属变更承载控制、使用和处置三种权利，并保留场所外观未变的反差。
failure_boundary: 地球没有法律意义上的宇宙产权，三体也尚未实际占领每处空间；属于只概括战略支配关系。
