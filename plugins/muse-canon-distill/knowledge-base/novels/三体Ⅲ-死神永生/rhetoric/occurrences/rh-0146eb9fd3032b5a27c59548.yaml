review_status: reviewed
tenor: 高维宇宙在维度战争中持续降维，普通高维文明挤入残存碎块并灭亡，发动降维者则先改造自身适应低维
vehicle: 海洋干涸时鱼群被迫挤入逐渐消失的水洼，而造成干海的鱼提前进化上岸逃生
ground: 生存介质整体消失；残余栖息地不断缩小；同类在末地聚集；大多数随介质灭亡；施害者预先适应新环境；逃生不可逆；从一处危险转向另一处
