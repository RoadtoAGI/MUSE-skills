chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 你们说自己从海里来，海是你们建造的吗？这么说，这片四维空间对于你或者说对于你的建造者，是类似于海洋的东西吗？是水洼。海干了。
sensory_mapping: 十维空间像海水层层退去，四维碎块只剩浅水洼，飞船墓群如搁浅鱼群；降维者却先长出能在陆地呼吸的身体。
context_fact: 程心回忆魔戒对话，关一帆解释维度可被武器化，使用者会先把自身改造成能在更低维生活。
image_mechanism: 水域把不可见的维度转成生命赖以存在的介质，干涸过程同步承载空间萎缩、文明聚集与施害者逃生三条因果。
property_alignment: 高维空间对应海；四维碎块对应水洼；高维文明对应鱼；降维对应水退；墓地飞船对应搁浅鱼群；自我改造对应上岸能力。
context_alignment: 这个框架来自魔戒的非人类表达，语句简短而生态化，符合高等文明把宇宙灾变视作环境变迁的冷漠尺度。
narrative_function: 用一组可连续推演的生存图景解释降维战争，并揭示攻击者也无法恢复被毁环境。
transfer_rule: 复杂灾变采用生态类比时，应让介质、栖息地、受害群体、施害者适应和不可逆后果各有明确对应。
failure_boundary: 文明不是生物鱼，降维适应也非自然进化；海水由外部物质退去，而空间维度是宇宙结构本身。
quality_assessment: exemplary
