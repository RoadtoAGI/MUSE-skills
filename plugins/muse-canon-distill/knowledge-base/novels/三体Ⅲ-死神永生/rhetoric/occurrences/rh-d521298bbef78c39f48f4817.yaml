chapter: 【威慑后一小时，失落的世界】
figure_type: metaphor
quote: 想让刚刚结束的美好时代的余音再延长一些
sensory_mapping: 威慑纪元像一首刚收住的乐曲，AA的笑与花盆仍是最后几缕回声，真相一出口就会归零。
context_fact: AA快乐地跑来谈新住处和花，还不知道广播系统已经毁灭。
image_mechanism: 余音允许时代在事实终止后继续存在于一个人的无知和情绪中，延长动作对应程心克制哭泣。
property_alignment: 时代终止对应乐曲结束；AA未获知真相对应余音仍可听；暂缓告知对应避免噪声打断回响。
context_alignment: 上一场水滴攻击被写成曲终猛擂，此处接续余音，使宏观威慑终结与两人相见共享音乐框架。
narrative_function: 推迟真相落到AA身上的瞬间，为失落世界保留最后一丝旧时代温度。
transfer_rule: 用余音写结束后的残留时，应明确何物已终止、何种感受仍在以及哪个动作会打断它。
failure_boundary: AA的快乐来自不知情而非时代真实延续；若真相已经公开，余音只能写记忆，不能写当前状态。
