tenor: 程心暂不把威慑失败告诉AA，以保留旧日快乐片刻
vehicle: 乐曲停止后仍在空气中衰减、可被听见一小会儿的余音
ground: 主体已经结束；残留感受短暂延续；新声或现实介入会使其消失
