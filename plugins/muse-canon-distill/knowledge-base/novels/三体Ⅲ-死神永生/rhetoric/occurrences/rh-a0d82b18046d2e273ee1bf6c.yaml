chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: simile
quote: 有一片白色的星尘，像深渊鲸的排泄物
sensory_mapping: 黑渊白污；星尘散片；巨鲸遗迹；废物漂流；恒星缺口
context_fact: 歌者原想清理三体星系，却发现其中一星已被其他文明的质量点摧毁，只剩星尘。
image_mechanism: 人类尺度上壮烈的恒星毁灭被外星清理员降格为巨兽留下的一片废物，白尘在黑空中的形态提供视觉依据，价值贬低则展示文明尺度差。
property_alignment: 星尘对应排泄物；白色对应浅色废物；散布形态对应排出物扩散；深空对应深渊；摧毁恒星的清理者对应深渊鲸；毁灭残留对应生理废弃；歌者嫌弃对应污物价值
context_alignment: 歌者把灭绝星系视为不耽误唱歌的日常清理，粗俗喻体准确暴露他对另一个文明死亡的轻蔑。
narrative_function: 以反崇高视角重估三体世界毁灭，让读者感到宇宙清理者的陌生尺度和伦理冷漠。
transfer_rule: 用生物废物写天体残骸时，应有可见颜色与散布形态对应，并由观察者的巨大尺度或轻蔑价值观支撑降格。
failure_boundary: 叙述视角哀悼并敬畏残骸、尘埃形态凝聚明亮如新星，或喻体生物尺度不够大时，该比喻只会显得猎奇。
quality_assessment: effective
