review_status: reviewed
tenor: 一颗恒星被质量点清理后留下、散布在原星位附近的白色尘埃残迹
vehicle: 母世界深渊鲸在幽暗环境中排出的浅色废物，松散成片漂浮，标记巨兽经过却毫无珍贵价值
ground: 白色星尘对应浅色排泄物；尘埃散片对应松散废物；恒星消失对应生物排出后离去；深空对应深渊；清理残迹对应废弃物；巨大尺度对应深渊鲸体量
