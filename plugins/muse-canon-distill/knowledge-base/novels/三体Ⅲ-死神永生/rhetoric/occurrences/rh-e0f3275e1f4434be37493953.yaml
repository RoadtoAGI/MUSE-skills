chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 水墙的表面致密而平滑，仿佛固体一般
sensory_mapping: 硬质水坡；光滑表皮；固定倾面；紧密反光；船贴斜壁
context_fact: 默斯肯旋涡直径约一千米，水墙约三十度倾斜并向底部转速递增。
image_mechanism: 本应松动流散的水被高速旋转压成一块巨大斜面，波纹像被抹平，透明液体获得墙板般稳定的外皮。
property_alignment: 旋转水体对应固体坡；致密水面对应硬质结构；平滑流线对应固体抛光面；稳定坡角对应固定几何；船沿面滑行对应物体贴坡运动
context_alignment: 固体感解释小艇为何能像贴在盆坡而不立刻翻滚，也与旋涡实际仍流动的危险形成认知错觉。
narrative_function: 让巨型液体结构具有可想象的表面和承托感，为后文‘结冰’强化留出层次。
transfer_rule: 用固体写高速液面时，应由表面致密、形状稳定、波动受抑和物体贴附共同支撑。
failure_boundary: 水面浪花破碎、坡形快速变动或船不断被抛离时，固体平滑感不能成立。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 高速旋转与离心力使倾斜水墙表面紧密平整，几乎看不见普通水面的松散波动
vehicle: 具有固定形面、连续硬质表皮且能承托物体滑行的固体斜坡
ground: 表面致密对应固体无空隙；平滑对应加工硬面；倾角稳定对应固定形状；小艇贴壁对应物体附着斜坡
