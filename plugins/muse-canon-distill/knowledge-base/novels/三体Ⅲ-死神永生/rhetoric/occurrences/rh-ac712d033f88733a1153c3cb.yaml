tenor: 阶梯计划再遭质量打击后，程心压抑多日的体力与意志耗竭突然显露
vehicle: 承重结构被抽走支柱后软塌，原先由支撑遮住的变形和负荷同时显出形状
ground: 维持姿态所需力量突然消失；长期累积的压力从不可见变成身体下坠
