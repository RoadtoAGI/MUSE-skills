chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 程心感到自己的身体已经抽去了支撑，多日的劳累一起显形
sensory_mapping: 她的骨架仿佛失去内部梁柱，站立结构随之松软，多日疲劳像暗重物在塌陷轮廓上浮现。
context_fact: 连续奔波与方案挫折后，有效载荷仅剩半公斤，程心软坐到草坪并第一次不服从起立命令。
image_mechanism: 抽去支撑先给倒下一个机械原因，劳累显形再把长期隐忍转换为可见形变，使崩溃带有累积史。
property_alignment: 意志维持对应内部支柱；坏消息对应撤除支撑；坐倒对应结构塌软；多日疲惫对应积载显形。
context_alignment: 程心此前靠方案责任压住身体信号，失败使责任提供的支撑瞬间失效，动作和心理同步。
narrative_function: 让技术数字落到人物身体，标记她短暂抵达极限，也为维德强迫前进的残酷性提供反应面。
transfer_rule: 写人物突然垮下时，应交代此前的承重机制、撤除触发和累积负荷；显形要通过姿态或动作可见。
failure_boundary: 普通坐下休息、没有长期压抑或人物仍保持强劲行动时，抽去支撑会夸大耗竭。
