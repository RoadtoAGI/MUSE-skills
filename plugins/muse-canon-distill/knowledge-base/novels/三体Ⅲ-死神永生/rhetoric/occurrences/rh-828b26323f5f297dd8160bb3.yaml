tenor: 土著原有土地生活被殖民者暴力、开发和文化毁灭替代的历史
vehicle: 人原在柔软花露中取食，后来者把贫瘠尖硬的碎石铺满土地，使花与水无处生长
ground: 前态轻柔丰饶且与自然共生；外来行动覆盖原环境；结果坚硬贫瘠并割断旧生活
