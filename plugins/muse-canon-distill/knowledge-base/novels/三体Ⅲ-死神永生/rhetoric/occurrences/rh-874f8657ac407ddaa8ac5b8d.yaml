chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 太阳比地球小许多，像是这个暗蓝色的世界孕育出的一枚光芒四射的金蛋
sensory_mapping: 暗蓝地球像巨大母体，弧线裂开一道晨光，一枚金蛋缓缓升出，光芒从壳面四射。
context_fact: 太阳从地球弧缘升起，透视上比地球小，随后照亮地球向阳面形成明亮弯月。
image_mechanism: 金蛋将遮挡造成的日出改写为孕育动作，太阳圆形、金色和缓慢露出共同支持出生而非单纯升起。
property_alignment: 地球对应母体；太阳圆盘对应蛋；金色光芒对应金壳；弧缘升出对应产下；随后照亮对应新生命释能。
context_alignment: 程心刚从自杀边缘返回并前往见旧爱，地球孕出太阳把个人重新开始投向整个世界。
narrative_function: 把普通轨道日出提升为新生意象，并引出太阳与地球弯月构成的巨型符号。
transfer_rule: 天体如被孕育之物时，应依靠遮挡关系、形状、色彩、出现节奏和后续生命效应，而非只贴新生标签。
failure_boundary: 太阳年龄远大于地球，物理上并非地球所生；孕育仅属于当前视角的图形关系。
