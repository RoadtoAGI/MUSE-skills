tenor: 从地球弧形边缘升起、在视野中较地球小而金亮的太阳
vehicle: 暗色母体产下一枚金色发光的蛋，蛋从身体边缘缓慢露出，象征生命即将孵化
ground: 亮圆体从更大暗蓝主体边缘出现；形态完整近圆；色彩金黄；视觉关系像由大体内部产生；带新生含义
