figure_type: simile
quote: 表面处于红热状态，像一块刚从炉中取出的炭
sensory_mapping: 宇宙尺度行星缩成手边炭块，屏幕红光获得炉火余热和可灼伤的触觉。
context_fact: 地球演化模型从新生行星开始演示，随后让其按地质时间冷却。
image_mechanism: 炭块提供读者熟悉的冷却序列：先红热发光，再暗淡变色；这一过程可直接承接后文行星纹路缓变。
property_alignment: 行星球体对应炭块体量轮廓；熔热表面对应出炉炭火红光；地质冷却对应炭块离炉后渐冷。
context_alignment: 模型把漫长地质演化压进几分钟，炭的日常冷却让时间加速仍能凭感官理解。
narrative_function: 给抽象模拟提供温度和时间起点，使冷却过程一眼可读。
transfer_rule: 解释巨尺度热演化时，可选具有同一颜色变化次序的小物；喻体需能继续解释后续冷却，而非只匹配某一帧。
failure_boundary: 行星若只是被红光照亮而非自身高温，炭的内热机制会误导；蓝白高温或气态外观也不合块炭。
