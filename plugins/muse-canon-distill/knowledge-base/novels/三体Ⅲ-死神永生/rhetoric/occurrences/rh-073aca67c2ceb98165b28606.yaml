tenor: 宇宙总质量恰好处于封闭坍缩的临界阈值，一点质量减少便会改变最终演化
vehicle: 工程师精密设计的机构，各参数以极小公差配合，任一处偏差都改变整机工作状态
ground: 多个量精确配合；接近临界阈值；容差极小；微小偏差造成整体后果；结构显示数学和谐；可由测量验证
