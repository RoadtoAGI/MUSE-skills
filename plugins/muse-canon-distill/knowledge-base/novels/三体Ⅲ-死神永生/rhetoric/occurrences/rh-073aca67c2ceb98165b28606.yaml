chapter: 【时间之外，我们的宇宙】
figure_type: analogy
quote: 宇宙在质量上的设计是极其精巧的
sensory_mapping: 宇宙像一架调到临界点的精密秤，全部质量刚好压过坍缩一侧，拿走一点便向永恒膨胀倾斜。
context_fact: 三体宇宙学证明总质量一点不多不少，减少便使宇宙由封闭转为开放。
image_mechanism: 设计一词把自然参数组织成带公差的工程系统，临界性因此获得可调、可被小宇宙破坏的机械感。
property_alignment: 宇宙参数对应机器参数；临界质量对应校准点；小宇宙取走质量对应拆走部件；演化转变对应机器换挡；数学之美对应设计精度。
context_alignment: 关一帆是宇宙学研究者，却向工程师程心解释，精巧设计成为两种专业经验的共同语言。
narrative_function: 把看似微不足道的小宇宙质量提升为可能改变终极命运的关键误差。
transfer_rule: 自然临界系统类比精密设计时，应给出参数、容差、扰动量和状态跃迁，不预设真实设计者。
failure_boundary: 宇宙是否由意志设计无法由质量平衡推出，‘设计’描述结构精度而非神学事实。
