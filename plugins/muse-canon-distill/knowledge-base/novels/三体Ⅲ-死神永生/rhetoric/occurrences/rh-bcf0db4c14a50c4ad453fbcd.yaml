tenor: 博物馆洞壁上为持续十万年而设计的火炬形长明灯
vehicle: 体积庞大、外壳厚重、结构粗笨的古代探照灯
ground: 尺寸大；结构厚重；安装固定；耐久优先；光源藏在深壳内；技术外观陈旧
