chapter: 地球文明
figure_type: simile
quote: 这盏火炬形的灯十分笨重，体积和结构都像古代的探照灯一般
sensory_mapping: 一盏微弱壁灯却背着探照灯般厚重的躯壳，像把一台旧时代机械嵌进石壁。
context_fact: 灯光只相当于二十瓦白炽灯泡，笨重设计换来连续发光十万年的寿命。
image_mechanism: 探照灯提供熟悉尺度，巨大外壳与微弱输出之间的错位立刻显出耐久工程付出的代价。
property_alignment: 大体积对应探照灯机身；厚灯罩对应防护外壳；固定嵌墙对应架设设备；弱光反衬结构过剩。
context_alignment: 文明越追求地质纪年寿命，技术外形越从微型量子器件倒退到粗笨机械。
narrative_function: 把十万年寿命转成可见重量，为后文发电厂般供电部分和小火苗般亮度蓄势。
transfer_rule: 用旧设备说明新装置尺度时，应同时写体积、结构、输出差异和导致差异的设计目标。
failure_boundary: 它不是用于远距照射的探照灯，光强也完全不同；相似限于体积和构造观感。
