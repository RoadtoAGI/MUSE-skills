chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 脚步像猫一般无声
sensory_mapping: 鞋底被替换成猫足肉垫，脚步声从房间听觉中擦除，只留下离去轨迹。
context_fact: 护士为云天明扎好针、接受其感谢后微笑离开，他把她视作最后陪伴者。
image_mechanism: 猫步让离开动作既轻柔又不可挽留，护士没有制造仪式噪声，死亡空间随其离去变得更空。
property_alignment: 护士放轻脚步对应猫足无声；镇定平稳对应猫移动柔顺；离开不惊扰对应潜行特征。
context_alignment: 这不是窥伺性的潜行，而是职业性克制；无声强化云天明即将独自面对程序的孤寂。
narrative_function: 用极轻听觉节拍完成最后陪伴者退场，把注意力留给独处和回忆。
transfer_rule: 猫步喻体应由足音、落脚材质和移动节奏支撑；若情节重在温柔离场，就限制动物属性在软足无声。
failure_boundary: 高跟鞋脆响、奔跑或慌乱离去都不合猫步；它也不能据此推断护士隐秘或狡猾。
