quote: 对执剑人的指责和声讨开始铺天盖地地出现
sensory_mapping: 报刊、信息窗和争论像密布天地的巨网，从城市地面铺到天空，把执剑人形象罩在其中。
context_fact: 公众回顾移民灾难，集中追问为何选择程心并指责她未及时启动广播。
image_mechanism: 铺展动作给舆论数量增加一个空间方向，盖住天地则说明批评已从若干意见变成无法绕开的公共环境。
property_alignment: 大量指责对应密集材料；跨社会传播对应铺满天地；程心被议论对应遭覆盖；异议缺席对应无空隙。
context_alignment: 舆论最终又因享受生活迅速平息，覆盖天地的极端声势与短暂记忆形成讽刺。
narrative_function: 以规模性动词加速舆论翻转，显示公众把群体责任集中投向少数对象。
transfer_rule: 信息如覆盖物时，应说明传播介质、覆盖范围、被遮对象和其他声音失去空间的效果。
failure_boundary: 批评并未真正充满每个地方，原文也说对程心本人相对宽容；喻体表示显著舆论规模。
