chapter: 【掩体纪元67年，“星环”号】
figure_type: simile
quote: 一处像气窗的圆形窗口
sensory_mapping: 圆形小窗；黄光透入；白舱封闭；窗外气纹；旧屋采光
context_fact: 程心尚不知道自己在飞船上，只见白色球形空间和一扇透进木星黄光的圆窗。
image_mechanism: 未知飞船舷窗先被日常室内经验识别成气窗，宏大木星景观被压在一个小圆孔外；熟悉尺度暂时遮蔽真实宇宙位置。
property_alignment: 舷窗对应气窗；圆轮廓对应旧窗形；有限口径对应小窗；黄光入舱对应采光；密闭船舱对应房间；木星外景对应窗外天气；苏醒视角对应室内仰看
context_alignment: 冬眠苏醒者认知尚未恢复，气窗是她从陌生白球空间重建日常房间感的第一步，随后木星立刻打破这一判断。
narrative_function: 控制信息披露：先给熟悉小窗，再通过窗外巨行星揭示飞船处境。
transfer_rule: 以气窗写舷窗时，应有小而圆的开口、封闭室内视点、外光透入和人物尚未识别载具的认知条件。
failure_boundary: 窗口巨大落地、呈长方全景屏，人物已明确知道身处飞船，或开口不承担采光时，气窗会显得刻意缩小。
