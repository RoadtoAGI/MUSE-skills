chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 是灿烂辉煌的地球文化为人类赢得了生存的机会
sensory_mapping: 整个人类文明被摆上赛场，文学艺术像成绩单换来一张暂缓处决的生存券。
context_fact: 智子要求四十亿人移民澳大利亚并解除武装，同时声称未来舰队会提供舒适生活。
image_mechanism: 赢得把占领者单方面施舍改写为公平竞赛奖赏，暴露话语如何用文化赞美遮蔽强制条件。
property_alignment: 地球文化对应参赛表现；三体政策对应裁判判定；保留地对应奖品；立即移民对应领取条件。
context_alignment: 这是智子的宣传句，竞技交易框架将灭绝权自然化，符合占领者自居恩主的口吻。
narrative_function: 以漂亮话结束保留地声明，并与随后真实饥饿、屠杀形成讽刺对照。
transfer_rule: 政治宣传用赢得描述权利时，应识别裁判、奖品、条件和被隐藏的强制关系。
failure_boundary: 生存不是占领者应授予的奖品，地球文化也无法验证为政策真实动因；喻体属于宣传框架。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 智子宣称三体因欣赏地球文化而暂不灭绝人类
vehicle: 参赛者凭有价值的表现取得胜利奖品，获得原本不保证的生存资格
ground: 机会由强者裁定；某项表现被当作交换筹码；奖励只能在服从附加条件后兑现
