tenor: 太平洋一号由废料棚屋、流浪居民和漫天灯火组成的完全失重城市景观
vehicle: 一座生活拥挤、设施破旧的地面老城被突然抽走重力，房屋、人和杂物整座升空
ground: 废料棚屋对应破旧街屋；人口与灯火密集对应老城繁华；完全失重对应地心引力骤失；所有建筑漂浮对应整城升空；无上下秩序对应街道体系被解除
