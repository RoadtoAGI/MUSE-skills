chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 仿佛一座破旧但繁华的老城市，突然失去了地心引力，一切都飘浮在空中
sensory_mapping: 旧城升空；棚屋悬浮；漫天灯火；上下消失；童话失重
context_fact: 太平洋一号既不自转也无人造太阳，城市由早期工程居住区演变成穷人和流浪者聚居地。
image_mechanism: 叙述先召回读者熟悉的破旧老城，再在一瞬间撤去支撑它的重力；熟悉街景的全部部件脱离地面，构成既贫困又奇幻的空中市井。
property_alignment: 太空棚屋对应旧城房屋；社会杂乱对应老城拥挤；局部灯火对应繁华夜景；零重力对应引力突然消失；建筑无固定位置对应整城飘起；城市历史感对应破旧外观
context_alignment: 这座太空城本是废弃工程设施，社会生活却自行繁衍；老城模型恰好容纳其物质破败、人口活力与失重奇观。
narrative_function: 用一次物理规则撤除帮助读者整体想象零重力城市，而非逐件拼装陌生景观。
transfer_rule: 用“熟悉场所突然失去某条物理规则”解释异世界时，保留场所的社会纹理，并让规则变化系统作用于房屋、人物、交通和光线。
failure_boundary: 若城市整洁空旷、建筑固定在壳壁，或只有少量物件漂浮，整座老城骤失重会制造过量的混乱与繁华。
quality_assessment: exemplary
