tenor: 人类文明五千年间由连续进步推动、速度不断增加的发展历程
vehicle: 奔跑者持续加速、耗尽体力冲向终点的一场长距离狂奔
ground: 前进迅速；速度递增；无法停歇；投入全部力量；历程有终点；终点揭示代价
