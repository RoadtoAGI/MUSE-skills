chapter: 地球文明
figure_type: simile
quote: 文明像一场五千年的狂奔
sensory_mapping: 五千年被压成一条越跑越快的赛道，奇迹接力般推着文明喘息冲刺，直到墓碑前骤停。
context_fact: 程心面对石刻发现，能建掩体世界的文明在亿年保存问题上仍退回把字刻在石头上。
image_mechanism: 狂奔把抽象技术加速变成带惯性的身体运动，终点不是胜利而是回到婴儿时代，速度因此转为徒劳。
property_alignment: 技术进步对应步伐；进步推动更快进步对应加速；五千年对应长赛程；文明尽头对应终点；奇迹对应冲刺能力。
context_alignment: 从石刻出发的文明跑遍量子存储、掩体城和恒星际飞船，最后仍在石刻处收束成环。
narrative_function: 以单一动态轨迹概括文明史，并为时间才握有真正力量的转折蓄积速度。
transfer_rule: 把历史写成奔跑时，应给出赛程、加速机制、身体代价、终点结果及起点终点关系。
failure_boundary: 文明没有统一意志或固定方向，五千年也非连续提速；狂奔压缩了停滞、分岔和倒退。
