chapter: 地球文明
figure_type: metaphor
quote: 这一切，只是一块墓碑，人类的墓碑
sensory_mapping: 整条地下隧洞缩成一块横卧冥王星的巨碑，密密文字只是人类给自己刻下的墓志。
context_fact: 文物多数只能保存百万年，石刻目标是一亿年；未来发现者很可能无法理解文字。
image_mechanism: 墓碑重定设施功能：它不再承担向未来传播知识，而承担让将死者完成自我告别和存在标记。
property_alignment: 人类对应死者；地下石刻对应碑文；冥王星建筑对应墓碑；文明信息对应墓志；太阳系末日对应死亡。
context_alignment: 罗辑以两百岁老人身份守碑，程心和AA在行星死亡前搬文物，个体葬仪与物种葬仪重叠。
narrative_function: 给“博物馆”完成概念翻转，解释为何没有译解系统、为何保存内容有限、为何工程仍有意义。
transfer_rule: 保存设施比作墓碑时，应对齐预知死亡、受众、信息压缩、纪念功能和无法复活的边界。
failure_boundary: 人类尚未在建造时全部死亡，设施也可能被未来文明读取；墓碑强调建造者动机而非唯一用途。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 不供参观、只求在人类灭亡后留下文明刻痕的地球文明博物馆及其石刻
vehicle: 死者为自己预建、在其死亡后标明曾经存在并刻下少量姓名事迹的墓碑
ground: 建造者预知死亡；设施面向死后；信息极度压缩；标记存在而非延续生命；无人参观也可成立；保存时间长
