chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: metaphor
quote: 藏好自己，做好清理
sensory_mapping: 宇宙清扫；文明成尘；坐标污点；工具一掷；空域干净
context_fact: 歌者根据广播坐标发射质量点或二向箔摧毁星系，把灭绝行动视为不耽误唱歌的例行岗位工作。
image_mechanism: 整颗星系和全部生命被缩小成环境中的一处脏点，毁灭的火光被省略，只留下清扫后的空白；职业词汇把屠杀动作去情感化。
property_alignment: 宇宙空间对应房间；目标文明对应污物或害虫；坐标对应污点位置；歌者对应清洁工；质量点与二向箔对应清洁工具；星系毁灭对应清除；不留幸存者对应清理干净；规程执行对应例行保洁
context_alignment: 歌者地位低、把灭绝当琐碎工作，“清理”符合其官僚职业语言，并以伦理降格显示黑暗森林杀戮的常态化。
narrative_function: 建立贯穿本章的核心委婉暗喻，让太阳系毁灭在执行者视角中显得轻易、日常而更恐怖。
transfer_rule: 用清理写暴力消除时，应让执行者掌握压倒性工具、把目标物化为障碍、追求不留残余，并呈现语言如何降低道德感受。
failure_boundary: 行动只是搬迁、修复或解除武装而保留生命，或执行者明确承认对方主体并哀悼伤亡时，“清理”等同灭绝会误判范围。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 黑暗森林中的文明隐藏自身坐标，并主动毁灭可能威胁自己的其他低熵文明及其恒星系统
vehicle: 为保持居所安全而把污物、害虫或危险杂质彻底清除，使环境恢复干净且不留残余
ground: 其他文明对应污物害物；宇宙对应待维护空间；灭绝打击对应清扫；清理员对应保洁者；坐标筛选对应发现污点；彻底毁灭对应不留残余；例行执行对应日常清洁
