chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 只成为三体世界的传声筒
sensory_mapping: 智子的精致人形像被掏空成一只喇叭，几光年外控制者的话从其中传出，她自己的表情保持空白。
context_fact: 三体势力撤离后智子从公众视野消失，露面时面无表情，主要执行信息通报。
image_mechanism: 传声筒把机器人控制关系转成声学管道，智子的身体从角色降为消息通路，呆滞因此有机械原因。
property_alignment: 三体控制者对应远端说话者；智子身体对应筒体；通报对应放大转声；面无表情对应无自身内容。
context_alignment: 她随后恢复茶道人格并显出控制者尊严，传声筒状态与清泉女人之间的切换突出人格来自远端操纵。
narrative_function: 交代六年空白期智子的低活动身份，为她突然主动约见两位执剑人制造异常信号。
transfer_rule: 角色如传声工具时，应说明真实信息源、传递通道、被压抑的主体性和何时恢复个人表达。
failure_boundary: 智子仍能行动和选择表达方式，并非完全被动器具；喻体仅概括公开露面功能。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 广播后偶尔露面、仅转述三体信息而不再表现个人情绪和主动性的智子机器人
vehicle: 传声筒只把远端说话者的声音放大送出，自身不创作内容也不表达立场
ground: 信息源位于别处；载体负责原样转送；个人声音被压低；外观可见而主体性缺席
