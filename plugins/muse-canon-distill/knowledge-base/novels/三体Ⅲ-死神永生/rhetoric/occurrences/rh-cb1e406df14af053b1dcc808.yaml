tenor: 死线略微扩散后其内部可能出现的极低光速，使近距离移动耗费万年
vehicle: 大陆板块以人类一生难以察觉、需地质年代才显著的速度缓慢漂移
ground: 移动真实存在；短时几乎静止；需超长时间累积；可用厘米量级计量；宏大尺度与微小速度并置
