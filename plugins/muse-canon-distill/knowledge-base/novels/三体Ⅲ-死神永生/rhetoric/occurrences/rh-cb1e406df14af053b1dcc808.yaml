chapter: 【时间开始后约170亿年，我们的星星】
figure_type: analogy
quote: 比如像大陆漂移的速度，一万年一厘米
sensory_mapping: 光在低速区不再闪过，而像大陆一样一万年只挪一厘米，人走几步便把爱人甩在千万年外。
context_fact: 二人担忧死线与低光速区会令同一地点不同位置产生巨大的时间差。
image_mechanism: 大陆漂移提供极慢速度的现成标尺，再把厘米和万年接入人物步行，形成从地质到情感的尺度冲击。
property_alignment: 低光速对应板块慢移；一厘米光程对应一厘米漂移；万年传播对应地质时标；肉眼静止对应短时不可察。
context_alignment: 两人刚经历一千六百万年跳变，地质速度正能解释时间如何在几步间再次裂开。
narrative_function: 把抽象低光速常数换算成恋人分离的可怕日常后果。
transfer_rule: 极端小速度宜选具真实量纲的慢过程，并把同一量纲继续推入人物动作，避免只给空泛的慢。
failure_boundary: 大陆漂移由板块运动造成，低光速是时空性质；两者只共享数量级与感知效果。
