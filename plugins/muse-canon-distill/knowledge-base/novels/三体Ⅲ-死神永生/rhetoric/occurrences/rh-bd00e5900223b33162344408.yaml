figure_type: simile
quote: 被身后一串银铃般的大笑惊醒过来
sensory_mapping: 笑声的每个音节变成一枚银铃相继碰响，从热浪和沉思后方清脆穿来。
context_fact: 程心在坑边凝视岩浆、产生自杀诱惑时，智子从身后走近并大笑。
image_mechanism: 银铃给笑声亮度和节拍，悦耳质地与来者的占领者身份形成不安反差。
property_alignment: 笑声清脆对应银质高音；连续音节对应一串铃响；突然惊醒对应铃音穿透沉思。
context_alignment: 坑底暗红、热浪滚滚，清亮笑声过分轻快，准确表现智子以美感包裹胜利冷酷。
narrative_function: 切断程心的自毁冲动并以声音先行引出智子的新形象。
transfer_rule: 声音比作乐器时，应匹配音高、节奏和穿透力，并让声源身份改变喻体情绪。
failure_boundary: 银铃不承载笑声的嘲讽语义；若笑声低沉、断续或沙哑，这一明亮音色会失准。
