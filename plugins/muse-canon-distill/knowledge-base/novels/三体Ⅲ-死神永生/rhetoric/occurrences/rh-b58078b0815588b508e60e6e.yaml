chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 许多人在合唱。他们唱着一首庄严舒缓的歌，像是圣歌
sensory_mapping: 哭喊声浪里升起一条稳定合唱，缓慢庄严，像末日教堂中送别整个太阳系的圣歌。
context_fact: 官方声音已经消失，普通人在广播频道中以喊叫、哭泣、狂笑和歌唱度过最后时刻。
image_mechanism: 圣歌为不可识别噪声提供唯一有组织的听觉形态，把私人恐惧短暂提升为共同葬仪。
property_alignment: 多人合唱对应唱诗班；庄严舒缓对应礼拜曲式；末日对应宗教终极时刻；频道传播对应公共仪式空间。
context_alignment: 冥王星墓碑完成视觉葬仪，通信中的圣歌完成听觉葬仪，人类为自己补上无人主持的送别。
narrative_function: 在声音海洋中留下一个可辨秩序，表现末日前仍有人选择共同、庄严地发声。
transfer_rule: 歌声比作圣歌时，应由曲式、演唱人数、仪式时刻和情绪功能支撑，而非只写“好听”。
failure_boundary: 歌曲未必具有宗教文本或正式礼仪，圣歌判断来自听感与末日语境。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 末日广播噪声中仍可辨的多人合唱，旋律庄严而舒缓
vehicle: 宗教仪式中众人共同歌唱、节奏舒缓、用于敬畏超越力量或安抚死亡的圣歌
ground: 多人同声；旋律庄严；速度舒缓；面对终极事件；具有仪式性；在混乱中维持秩序和慰藉
