chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 我们应该是站在边境线上的木头岗亭上，周围是没有人烟的戈壁或雪原，我们在寒风中看着敌国方向一旦发现地平线上的坦克或骑兵。就打电话或点狼烟通知后方说敌人要入侵了
sensory_mapping: 太空岗亭；荒凉边境；哨兵望敌；地平线坦克；狼烟回报
context_fact: 一号单元位于小行星带外，职责是从所有方向尽早探测近光速攻击辐射。
image_mechanism: 二十五千米透镜组和小空间站被压缩成最原始木岗亭，太空冷寂替换荒原寒风，光粒则从物理信号变成越境敌军；职责优先级因此一目了然。
property_alignment: 空间站对应岗亭；太阳系边缘对应国境；太空荒凉对应戈壁雪原；观测员对应哨兵；望远镜对应瞭望；光粒对应坦克骑兵；通信束对应电话狼烟；舰队地球对应后方
context_alignment: 瓦西里借古代哨兵纠正威纳尔沉迷科学图像，类比强调同一望远镜首先是生存预警设施。
narrative_function: 用角色化场景解释预警系统分工，并建立发现航迹后必须越级报警的行为逻辑。
transfer_rule: 把监测站写成边哨时，应有外围位置、长期单调观察、明确敌向、短预警链和需要保护的后方。
failure_boundary: 设施位于核心区、任务是纯科研且没有即时上报机制，或威胁从内部产生时，边境岗亭会误写职责。
