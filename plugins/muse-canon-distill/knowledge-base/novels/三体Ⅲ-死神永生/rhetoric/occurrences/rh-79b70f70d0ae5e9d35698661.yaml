chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 那个进入三体舰队的人类可以说是一颗植入敌人心脏的炸弹
sensory_mapping: 人脑随飞行器穿入敌舰躯体，在心脏中成为一枚未设定爆时的微型炸弹，等待谋略引爆。
context_fact: PDC接受只送人体或大脑的方案，因为人类谋略优势可能在敌舰内部产生无法预估的机会。
image_mechanism: 炸弹在既有心脏框架中加入潜伏、能量释放和非对称破坏，使仅仅进入内部获得明确战略方向。
property_alignment: 三体舰队对应身体；内部关键区对应心脏；人类谋略对应爆炸能量；等待机会对应延时潜伏；改变战局对应全身受创。
context_alignment: 身份对敌方完全透明，传统间谍伪装失效，炸弹价值来自位置和行为不可预测而非隐蔽身份。
narrative_function: 把阶梯计划由壮举升级为主动战略武器，为牺牲个体的政治批准提供危险吸引力。
transfer_rule: 渗透者如炸弹时，应明确植入位置、潜伏期、触发机制和作用半径；破坏潜力不能只靠标签宣称。
failure_boundary: 若进入者被完全隔离、没有行动或信息能力，心脏炸弹无法引爆；喻体也会掩盖其可能选择忠于敌方。
quality_assessment: exemplary
