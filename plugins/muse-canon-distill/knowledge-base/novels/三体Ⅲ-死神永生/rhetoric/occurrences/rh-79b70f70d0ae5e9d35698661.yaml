review_status: reviewed
tenor: 进入三体舰队内部的人类凭谋略与不可预知行动改变战争走向的潜在能力
vehicle: 被秘密植入生物心脏、体量小却可从核心爆炸并摧毁整个身体的炸弹
ground: 进入者位置接近系统核心；其作用暂时潜伏，一旦激活可能产生远超自身质量的破坏
