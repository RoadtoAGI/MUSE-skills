chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那团尘云已经被风吹散了一些，不再呈蘑菇状，变得像一头乱发
sensory_mapping: 蘑菇冠被风梳裂成蓬乱发束，夕阳把末梢染红，云团像一颗披头散发的巨首。
context_fact: 程心接近喷发点时，风已吹散部分尘云，其边缘被落日照成血红。
image_mechanism: 乱发延续上一段头像框架，同时用发束的蓬散方向精确显示云由整形向破碎变化。
property_alignment: 分叉云丝对应发束；风吹散对应头发飘乱；残存云团对应头部发量；血红边缘对应染色发梢。
context_alignment: 前一眼把云看成丑陋头像，此处自然推进到乱发，属于同一观看中的形态演变。
narrative_function: 让固定蘑菇云随接近过程继续变化，并用凌乱外观维持灾难的不安人格。
transfer_rule: 延展面孔或身体意象时，新局部应由对象真实形变触发，并保持前后空间位置连续。
failure_boundary: 若云仍是光滑完整的蘑菇冠，乱发缺少丝状依据；不能把风向理解成人物动作意图。
