chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 人们的脸色都如鬼魅般苍白
sensory_mapping: 一张张活人的脸被月光抽尽血色，漂在黑色人海中像提前离体的幽魂。
context_fact: 居民知道逃亡无望，戴着头盔悬浮在中轴线上，集体盯住二维平面将出现的方向。
image_mechanism: 鬼魅让仍活着的人在物理死亡前先取得死者外观，倒计时由时间信息变成面部颜色。
property_alignment: 苍白皮肤对应鬼脸；失重悬浮对应幽魂漂浮；寂静对应鬼域无声；末日等待对应已近死亡。
context_alignment: 程心由此联想到澳大利亚血色黎明；过去人性灾难与当前宇宙灾难通过同样的非人面孔相连。
narrative_function: 把百万数量还原为可感的个体恐惧，并把人群从城市居民转成预先出现的亡灵。
transfer_rule: 活人比作鬼魅时，应由光色、姿态、环境和临死处境共同支持，避免仅靠“苍白”一词。
failure_boundary: 居民仍有生命、意识和行动能力，鬼魅感来自冷光与观察者心理，不说明他们失去人格。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 三百万人静候二维化时在银色冷光中显出的苍白面孔
vehicle: 失去血色、属于死者世界、在暗处若隐若现的鬼魅脸孔
ground: 颜色惨白；生命活力消失；置身死亡环境；静默不动；光线幽冷；介于活人与尸影之间
