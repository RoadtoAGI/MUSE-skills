chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 那是生死线，船一旦过去是回不来的
sensory_mapping: 白色生死线；界内黑涡；一越无返；地狱门槛；船身滑落
context_fact: 旋涡凹陷低于海面，只有越过外围浪带才能看见；常规功率无法冲回泡沫线。
image_mechanism: 连续海面被一条白泡沫切成两种存在状态，船首跨线的微小位移不可逆地改写命运；后来“地狱之门”是同一边界框架的强化。
property_alignment: 浪带对应界线；外海对应生命区；涡内对应死亡区；越过对应入门；旋涡捕获对应禁止返回；吮洞对应地狱深处；白泡对应可见门槛
context_alignment: 实地旋涡是低光速黑洞的含义坐标，生死线的单向性正对应黑洞视界：可进入而不能逃出。
narrative_function: 在物理解释前先让视界的不可逆性通过船行风险被身体体验。
transfer_rule: 用生死线写自然边界时，应存在可定位阈值、跨越后机制突变、常规力量无法返回和真实毁灭后果。
failure_boundary: 边界模糊渐变、船能随时掉头，或越过只增加轻微风险时，生死线会制造虚假绝对性。
quality_assessment: exemplary
