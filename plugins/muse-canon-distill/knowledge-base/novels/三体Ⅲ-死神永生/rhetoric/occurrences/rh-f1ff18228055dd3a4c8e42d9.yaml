tenor: 默斯肯大旋涡外围由泡沫标出的流体边界，常规船只越过后即被涡流捕获并最终毁灭
vehicle: 一条把生者区域与死亡领域分开的边界线，跨过去便进入只进不出的地狱入口
ground: 泡沫浪带对应界线；外侧安全海面对应生；内侧旋涡对应死；越线对应越界；无法返航对应单向边界；船毁对应死亡结局；后称地狱之门对应边界入口
