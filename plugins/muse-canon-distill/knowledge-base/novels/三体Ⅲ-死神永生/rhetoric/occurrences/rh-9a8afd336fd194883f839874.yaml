chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 他的口中血似喷泉
sensory_mapping: 鲜血从亨特口腔像红色泉柱涌出，在失重中散开成一串球形水滴。
context_fact: 蓝色空间号人员从四维空间无创摘除亨特心脏，他身体僵直抽搐。
image_mechanism: 喷泉给无重力血液初始动力和流量形状，再由球化现象显示太空环境的异常美感。
property_alignment: 口腔对应喷口；循环余压对应水压；大量鲜血对应泉水；连续外涌对应喷射。
context_alignment: 现场没有胸口伤痕，口中喷泉成为体内灾难唯一直接出口，强化四维攻击的诡异。
narrative_function: 在心脏显形前先给出强烈生理后果，引导军官寻找血球中的异物。
transfer_rule: 液体如喷泉时，应匹配压力来源、出口、连续性和离体轨迹。
failure_boundary: 喷泉通常向重力下回落，此处血在失重中成球；喻体只描述刚离口的喷射阶段。
