chapter: 【危机纪元4年，云天明】
figure_type: simile
quote: 水面如镜子般没有一丝波纹
sensory_mapping: 液体的可动性被冻结为玻璃平面，灰天在水上形成无缝复制，水深因反光而消失。
context_fact: 云天明梦见纸船漂在永远下细雨、却永远不起波纹的无岸水面。
image_mechanism: 镜面把不合物理的静水变得可见；雨落而无纹进一步强化其硬质静止，使梦境像封闭展示面。
property_alignment: 无波水面对应镜面平整；灰天倒映对应镜子反射；看不见水天线对应反射面与环境同色融合。
context_alignment: 云天明正在接近安乐死，永恒不变的镜水提供无痛、无扰动却也无生机的死亡空间。
narrative_function: 建立梦境核心静态质感，为后续把星星作为礼物送出保留一片内在避难所。
transfer_rule: 以镜写静水时，还可让反射内容和边界消失参与构图；现场若有降雨，应交代无波是梦境规则而非忽略因果。
failure_boundary: 水面有风纹、船尾涟漪或雨滴环纹时，完整镜面会被破坏；浑浊不反光的水也缺少镜子的第二项属性。
quality_assessment: effective
