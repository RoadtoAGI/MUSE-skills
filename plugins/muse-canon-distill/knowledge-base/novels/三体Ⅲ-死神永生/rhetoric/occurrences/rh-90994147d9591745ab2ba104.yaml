tenor: 将死的云天明只求远远看程心一眼后接受死亡
vehicle: 溺水者耗尽力量浮出水面吸一口气，再沉入水中
ground: 主体已无法摆脱死亡结局；一次短暂接触只能提供最后缓解，不能改变最终下沉
