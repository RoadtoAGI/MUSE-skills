chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 就像一个溺水者拼命升上水面吸一口气，再沉下去也能死得平静些
sensory_mapping: 孤独成为缺氧水体，见程心成为水面一口空气，返回死亡成为身体再次沉底。
context_fact: 他从安乐室被救却绝望，飞往上海，不打算让程心知道，只想远看一眼。
image_mechanism: 上浮、吸气、再沉三步与旅程、观看、赴死逐项平行；一口气限定愿望规模，也保留拼命赶去的急迫。
property_alignment: 临终处境对应不可逃溺水；飞沪寻找对应拼命上浮；看一眼对应吸气；不打扰后离去对应重新下沉。
context_alignment: 程心是他精神世界的太阳，短暂看见可提供呼吸却无现实关系，符合单恋边界。
narrative_function: 把突发旅行的强迫性与克制同时说明，避免行为被误读为求爱或纠缠。
transfer_rule: 说明短暂慰藉时，可选不改变终局却能延迟痛苦的生理动作，并让行动步骤与喻体过程严格同序。
failure_boundary: 若见面可能治愈疾病、建立关系或改变死亡决定，就不只是最后一口气；若他不急迫，上浮拼命也过强。
