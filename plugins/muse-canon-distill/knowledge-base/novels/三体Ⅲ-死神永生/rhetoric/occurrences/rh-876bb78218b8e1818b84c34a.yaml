chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 像一个小小的穹顶遮住了一半夜空
sensory_mapping: 旋转伞面在公主眼前扩成一座黑色小天，伞沿切开星空，一半在内一半在外。
context_fact: 黑伞必须整夜不停旋转以防公主被魔画夺走，卫队长正在替她守护。
image_mechanism: 穹顶把便携器物建筑化、宇宙化，视角夸大正好对应它为一人建立安全世界的功能。
property_alignment: 伞面对应天穹；伞沿对应天际边界；近距遮挡对应覆盖半空；防护魔力对应保护罩。
context_alignment: 海是液态星空，伞又成为第二重小天，公主睡在多层宇宙结构的中心。
narrative_function: 把卫队长的劳作转成守护姿态，并为两人关系升温提供浪漫构图。
transfer_rule: 近距圆形物比作穹顶时，应匹配曲面、位置、视角占比、防护功能和内外边界。
failure_boundary: 伞只覆盖一人且会散架，无法像真实天空延展；一半夜空是视角效果。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 卫队长在公主上方稳定旋转、近距占据巨大视角的圆形黑伞
vehicle: 缩小却完整覆盖头顶的半球形天穹，隔开其外更大的天空
ground: 形状弧圆；位于正上方；覆盖视野；构成保护边界；近距看似尺度巨大
