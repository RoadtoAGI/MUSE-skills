tenor: 穿古式笨重防护服、靠头灯和有限供氧困在失能黑暗穿梭机内的程心与关一帆
vehicle: 矿井塌方或断电后困在地下狭窄黑暗空间、靠头灯和自救装备等待出路的古代矿工
