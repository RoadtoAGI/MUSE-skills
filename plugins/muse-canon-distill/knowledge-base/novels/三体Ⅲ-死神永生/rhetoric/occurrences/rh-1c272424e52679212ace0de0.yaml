chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 在狭窄的舱内，程心感觉他们像古代被困在井下的矿工
sensory_mapping: 两束头灯扫过死寂金属舱壁，厚服中的两人像井底矿工，头顶没有可立即打开的出口。
context_fact: 穿梭机A.I.和控制系统停止，舱门打不开，他们需启动神经元计算机和低光速动力。
image_mechanism: 矿工把宇宙高科技事故降到古老受困原型，装备、照明、空气和手工操作均高度同构。
property_alignment: 穿梭机对应矿井；失能系统对应塌方停电；太空服对应矿工服；头灯对应矿灯；有限氧气对应井下空气；自救对应恢复控制。
context_alignment: 科技文明遇到低光速后退回模拟设备与手动服，人类在宇宙规律前再次成为用古老工具求生的劳动者。
narrative_function: 整体概括低光速舱内处境，为后续神经元计算机的“古老”界面建立感知框架。
transfer_rule: 高技术载具受困比作矿难时，应逐项对应空间、出口、照明、空气、装备和自救手段。
failure_boundary: 他们不在地下，也没有岩层坍塌；穿梭机仍可经备用系统恢复，矿工感来自狭窄黑暗。
