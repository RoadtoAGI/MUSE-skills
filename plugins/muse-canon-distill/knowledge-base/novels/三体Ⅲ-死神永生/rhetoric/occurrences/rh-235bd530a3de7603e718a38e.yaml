chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这种转换使得麦田上的光影也在不断变幻中，像是太阳在云层中出没一样
sensory_mapping: 头顶灯管一根暗下另一根亮起，麦浪上的亮斑像云缝日光游移，阴影在田埂间慢慢换向。
context_fact: 每时每刻保持两三根管道发光，但具体亮管不断替换，为作物提供人工阳光。
image_mechanism: 云日把工程切换的离散亮灭平滑成自然光候，麦田因而获得类似地球天气的动态。
property_alignment: 亮管对应太阳；暗管团对应云层；轮换亮灭对应日光出没；麦田光影变化对应云影移动。
context_alignment: 云天明为程心布置熟悉田园，人工穹顶通过云日光影进一步模拟自然，却仍显露异世界变形。
narrative_function: 使静态麦田画面活起来，并从单纯管道系统过渡到程心对异星艺术和大脑的联想。
transfer_rule: 人工灯切换如云日时，应对应光源遮显、切换频率、阴影移动和被照场景的自然需求。
failure_boundary: 管道不是太阳，暗管也未遮挡同一光源；亮度变化来自换灯而非云层运动。
