chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 程心在瞬间由广袤的太空回到蛋壳般狭小的船舱中
sensory_mapping: 无边星海骤然合拢成贴身舱壁，程心像缩回一枚蛋壳，活动受限却终于与黑暗宇宙隔开。
context_fact: 全景太空已被她感为噩梦，关一帆应要求关闭显示，狭舱反而恢复一丝安全感。
image_mechanism: 蛋壳同时压缩体积并赋予庇护功能，让狭窄从缺点转为抵御宇宙恐惧的保护层。
property_alignment: 船舱小对应蛋内空间；舱壁对应壳；人体受限对应胚胎蜷缩；关闭显示对应壳隔绝外界；安全感对应壳保护。
context_alignment: 前文3G像臂膀拥抱，此处舱壁像蛋壳包围，程心持续以身体包裹抵御认知寒冷。
narrative_function: 用尺度急缩完成从宇宙理论回到可承受私人空间的心理退守。
transfer_rule: 封闭小空间比作蛋壳时，应利用包裹、姿势受限、隔绝外界和脆弱安全四层属性。
failure_boundary: 船舱由工程结构支撑且可操纵航行，不具蛋壳的生物孕育功能或易碎程度。
