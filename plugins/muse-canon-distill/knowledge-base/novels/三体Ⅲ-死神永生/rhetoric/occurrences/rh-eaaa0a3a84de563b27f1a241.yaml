chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 那些拥有神一般技术力量的参战文明
sensory_mapping: 这些文明不像使用宇宙中的工具，而像神祇伸手改动维度和光速本身。
context_fact: 它们毫不犹豫地降低维度攻击、降低光速防御，影响范围遍及星系群。
image_mechanism: 神力给规律操控定出认知上限，同时延续人类曾有神力错觉的反差：真正神级技术能修改舞台。
property_alignment: 规律改写对应神谕；维度毁灭对应灭世；慢光速造域对应创世；跨星系作用对应超凡范围；低等文明无力对应凡人。
context_alignment: 人类在石刻前发现神一般力量是假象，银河战争中的文明才抵达这一比喻的真实尺度。
narrative_function: 标定技术等级差，使听者理解太阳系顶级攻击对施放者可能只是常用手段。
transfer_rule: 技术比作神力时，应列出它实际改变的自然层级、范围和普通技术不可达之处。
failure_boundary: 参战文明仍受物理条件约束并非全能，规律武器也造成不可控后果；“神”只指相对技术差。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 能够把维度、光速等宇宙规律武器化的顶级参战文明技术能力
vehicle: 神话中可改变世界基本秩序、创造或毁灭宇宙结构的神力
ground: 能力远超普通生命；可改变自然规则；作用范围跨星系；近乎不可抵抗；能创造新环境也能毁灭旧环境
