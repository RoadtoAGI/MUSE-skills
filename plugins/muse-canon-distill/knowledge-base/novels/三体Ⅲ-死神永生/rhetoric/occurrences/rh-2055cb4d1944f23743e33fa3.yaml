chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 仿佛都是放大镜下的小精灵，在雪天飘落到手掌上后马上就会化成一小滴水
sensory_mapping: 窗口抹掉五千千米标尺，六边冰晶又缩回掌心，像镜下会眨眼、落手即化的小精灵。
context_fact: A.I.分别展示单朵雪花，真实直径大于月球，但标准窗口使它们看起来与普通微小冰晶无异。
image_mechanism: 小精灵利用熟悉掌心经验反向缩尺，精致图案压过天文尺寸，突出图像脱离参照后的认知欺骗。
property_alignment: 晶枝精巧对应精灵身形；窗口放大对应放大镜；漂浮外观对应轻盈飞动；冰晶对应落掌雪花；尺度消失对应小型错觉。
context_alignment: 二维化保存了细节却摧毁尺度直觉，如同保存城市图纸却失去可居世界，信息完整与现实缺失再次并置。
narrative_function: 将超巨型奇观拉回童年触觉记忆，让无法想象的尺度以反差进入读者经验。
transfer_rule: 巨物写成微型精灵时，应明确哪个显示机制移除了标尺，并保留形状、质感与熟悉触觉作为缩尺依据。
failure_boundary: 雪花不会落到手掌，也不小巧易融；小精灵感只存在于无尺度的单体窗口。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 显示窗口中被单独截取、失去真实尺度感的四五千千米二维雪花
vehicle: 放大镜下纤小、精巧、轻盈如精灵的普通雪花，落到温暖手掌便融成水滴
ground: 形体精细；画面中尺度不明；看似小巧轻盈；晶莹有生命感；与手掌经验关联；脆弱易融
