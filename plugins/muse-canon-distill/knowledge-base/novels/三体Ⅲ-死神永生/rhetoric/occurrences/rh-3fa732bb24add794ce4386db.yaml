chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 太空像一面放大镜，可以在瞬间把人类的阴暗面放到最大
sensory_mapping: 圆形透镜；细小黑斑；骤然放大；视野被暗色占满；缺陷纹理显露
context_fact: 反对光速飞船者以‘青铜时代’号审判为证，担忧离开太阳系的人类社会倒退。
image_mechanism: 太空不直接制造新恶，而像透镜把文明中已有的微暗缺陷聚焦、扩展；地球上可被制度稀释的斑点在生存压力下占满整幅社会图像。
property_alignment: 人类文明对应被观察物；阴暗倾向对应暗斑；太空环境对应放大镜；资源封闭对应高倍率；制度距离对应失去校正；社会倒退对应暗面扩大；快速恶化对应瞬间聚焦
context_alignment: 已有末日战舰案例提供暗斑原型，放大镜说明反对者担心的并非技术本身，而是环境对既有人性的尺度效应。
narrative_function: 凝练光速飞船政治争论的核心恐惧，为逃亡主义禁令提供思想来源。
transfer_rule: 用放大镜写环境恶化人性时，应说明原有缺陷、放大条件、倍率来源、可见后果和环境不等于新造缺陷。
failure_boundary: 群体进入太空后制度更强、资源充足，或所谓恶行并无地球端先兆时，放大镜会把新机制误当旧缺陷放大。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类进入封闭、资源有限且远离制度约束的太空后，自私、暴力和专制倾向会迅速极端化
vehicle: 放大镜把原本细小难见的暗斑扩大到充满视野，使纹理和缺陷骤然显著
ground: 人性弱点对应微小暗斑；太空极端环境对应透镜；危机压力对应放大倍率；社会倒退对应暗面充满画面；短时间变化对应瞬间聚焦
