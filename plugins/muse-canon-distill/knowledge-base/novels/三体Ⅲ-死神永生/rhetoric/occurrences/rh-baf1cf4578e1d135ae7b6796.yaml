chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 仿佛置身于另一个移民时代，那是五个世纪前澳大利亚的移民时代
sensory_mapping: 星光下的合成板房褪去现代材质，化成旧木屋，空气仿佛混入马粪和牧草气味。
context_fact: 深夜移民区灯光稀疏而安静，程心由景象联想到牛仔与牧马人并告诉弗雷斯。
image_mechanism: 历史移置由视觉继续到嗅觉，使当前强制迁徙暂时套上熟悉的拓荒叙事。
property_alignment: 简易平房对应拓荒聚落；沙漠荒原对应旧边疆；稀疏夜灯对应前现代设施；移民身份对应殖民者。
context_alignment: 程心的印象来自电影而非亲历，浪漫化错觉随后由弗雷斯指出当年移民是开拓、现在是囚禁。
narrative_function: 先生成怀旧图景，再让土著老人以历史差异击破它，深化对强制移民性质的认识。
transfer_rule: 跨时代景观类比应从建筑、地貌、生活设施和迁移目的逐项比对，并让关键差异进入后续纠正。
failure_boundary: 五百年前的殖民扩张与当前被迫集中方向相反，牛仔气味是程心想象，不能当历史同一。
