tenor: 落日余晖照在紫色森林树冠边缘形成的一圈明亮金黄色轮廓
vehicle: 工匠在物体边沿覆盖一层薄而闪亮的黄金镀层，使轮廓发出金属光泽
ground: 亮色附着边缘；厚度很薄；颜色金黄；随角度闪耀；主体材质不变；效果由外部覆盖产生
