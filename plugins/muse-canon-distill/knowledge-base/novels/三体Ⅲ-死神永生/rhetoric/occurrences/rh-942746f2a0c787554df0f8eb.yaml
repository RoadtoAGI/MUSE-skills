chapter: 【时间开始后约170亿年，我们的星星】
figure_type: metaphor
quote: 天空中弥漫着绚烂的晚霞，给紫色的森林镀上了金边
sensory_mapping: 晚霞像无形工匠沿每棵紫树的轮廓刷过一层金属薄光，黑暗降临前边缘短暂发亮。
context_fact: 二人在等待第三次地下遥感，太阳落下，发现石刻的结果即将返回。
image_mechanism: 镀金把光照的边缘效应写成精细加工，让病态紫林在希望出现前得到短暂贵重轮廓。
property_alignment: 霞光对应金层；树冠边缘对应被镀边沿；金黄色对应黄金色；短时反光对应薄镀层；森林本色保留对应基材不变。
context_alignment: 地下文字需技术从黑岩中显影，地上光线也正从紫林边缘显形，等待场景内外形成视觉呼应。
narrative_function: 调亮连续失败后的氛围，并以日落金边预示跨年代消息即将被发现。
transfer_rule: 光线写成镀层时，要限定它附着的边缘、色泽、基材和短暂条件，维持精确视觉关系。
failure_boundary: 树木没有金属覆盖，霞光随太阳位置消失，也不改变表面材料。
