figure_type: simile
quote: 模拟巨行星的巨石像四团被喷灯的火焰吹着的冰激凌
sensory_mapping: 喷灯蓝焰；冰激凌软化；表面塌圆；融液长尾；四团并列
context_fact: 氢弹辐射先于物质冲击到达，类地石块破碎，巨行星模型因体量大而定向熔化。
image_mechanism: 天体尺度的岩石突然失去坚硬感，核辐射像喷灯贴面横吹；受热棱角以冰激凌速度软掉，液态岩浆被吹向背面拉成长尾。
property_alignment: 巨石对应冰激凌团；核辐射对应喷灯；向日面对应受火面；岩石熔化对应乳脂软化；规则球面对应融后圆团；岩浆尾对应滴流；四块模型对应四团甜品
context_alignment: 测试用巨石本已像行星，冰激凌把宏大灾变降至手边相变，直观展示掩体行星为何能保住整体。
narrative_function: 说明辐射烧蚀的方向、速度和结果，同时形成全段最清晰的物态图像。
transfer_rule: 用喷灯冰激凌写定向烧蚀时，应匹配单侧热源、表面先软化、轮廓圆化、融物流向和主体尚存。
failure_boundary: 目标直接爆碎或整体均匀升温、无熔流尾迹时，冰激凌会误写保存方式。
