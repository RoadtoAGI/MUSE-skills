sensory_mapping: 误报警的巨大损失像罪名被绑到瓦西里身上，他被推出军队替整个系统承受惩罚。
context_fact: 历史后来证明光速航迹发现意义重大，瓦西里复职并升为中将。
image_mechanism: 替罪羊保留不公的制度结构，解释他为何不服并选择冬眠等待历史改判。
property_alignment: 集体误判对应群体罪过；瓦西里对应羊；开除对应驱逐；后来平反对应替罪机制被识破。
context_alignment: 此行他再次面对未知警报，过往受罚经历同时影响谨慎和对白Ice直觉的最终采纳。
narrative_function: 压缩人物前史，并把当前指挥风格建立在一次制度性牺牲上。
transfer_rule: 制度追责写成替罪羊时，应明确群体责任、集中惩罚、对象不公和后续验证。
failure_boundary: 瓦西里可能仍负部分职业责任，不能因比喻认定完全无过；仪式献祭细节也不适用。
