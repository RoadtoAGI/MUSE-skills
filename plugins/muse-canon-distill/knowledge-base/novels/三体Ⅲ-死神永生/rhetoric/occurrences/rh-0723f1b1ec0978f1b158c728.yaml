chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 像轻纱，像白云，像……时间，是的，她在轻抚时间，时间在她的手中变得柔软蜿蜒，流淌得如同竹林中的那层薄雾般缓慢
sensory_mapping: 玉手先触到轻纱与白云的软质，继而把时间拉成蜿蜒雾带；触觉、运动和时间感沿同一条缓流接通。
context_fact: 程心观看智子行茶，被其飘逸动作催眠，暂时忘记血与火的历史和现实世界。
image_mechanism: 三个喻体逐级去除重量：轻纱仍可触，白云难以抓握，薄雾则既柔软又流动，最终让抽象时间取得手感与速度。
property_alignment: 手势无重对应轻纱飘拂；动作连绵对应白云舒展；主观时间减速对应薄雾缓流；尘世退远对应雾幕遮蔽。
context_alignment: 茶道的慢节奏与竹林、茶香共同构成和敬清寂的封闭时间，喻体来自场景内部而非外加装饰。
narrative_function: 把智子的文化魅惑从外貌推进到时间控制，也让暂时安宁与随后政治危机形成张力。
transfer_rule: 描写仪式改变时间感，可先给动作可触的材质，再让材质获得流速；每次换喻都应推进重量、形态或速度。
failure_boundary: 急促敲击、明确计时压力或嘈杂打断会破坏软质缓流；只有动作漂亮而时间感未改变时，不宜延伸到轻抚时间。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 智子操作茶具的轻柔动作，以及这套动作令程心体验到的主观时间
vehicle: 能被手指抚弄的轻纱和白云，以及贴着竹林缓慢流动的薄雾
ground: 动作轻软到几乎没有阻力；时间进程舒缓、连续并遮断远处尘世
