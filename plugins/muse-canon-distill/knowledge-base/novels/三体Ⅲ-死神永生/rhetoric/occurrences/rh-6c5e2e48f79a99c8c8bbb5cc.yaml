property_alignment: 坐标广播对应核报复；双方毁灭对应相互确保摧毁；长期不按键对应冷战无全面核战。
context_alignment: 类比也暴露差异：执剑人单点与文明异质性使结果未必复制，因而希望一词保留不确定。
narrative_function: 说明公众对威慑制度的乐观预期，为程心接任后的破裂积累反差。
