chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 后面拖曳了一条长长的泡沫尾迹，像一道落在海上的白云带。无数的饕餮鱼从两侧游过来进入泡沫中，像在进行一场云河中的朝圣
sensory_mapping: 海上白云带；绵长云河；黑色朝圣队列；两侧汇聚；天堂般光亮
context_fact: 香皂随船溶解生成大量泡沫，鱼群主动离开船底进入尾迹，公主由此想到牧师讲的天堂。
image_mechanism: 船尾的白沫不再是杂乱水迹，而升格为铺在海上的云河；黑鱼从危险围攻者变成循光而来的朝圣队伍，死亡航道遂显出通往天堂的仪式秩序。
property_alignment: 泡沫尾迹对应白云河；泡泡轻白对应云朵；船行轨迹对应河道延伸；饕餮鱼对应朝圣者；两侧游入对应汇聚朝拜；陶醉漂浮对应宗教慰藉；公主的天堂联想对应圣境
context_alignment: 童话内部已有天堂概念，泡沫的无重量和白光又提供真实云感，宗教图景从外观自然长出。
narrative_function: 把一次危险渡海写成奇迹般的白色 procession，并预埋童话对光速、曲率航迹等信息的编码。
transfer_rule: 用云河朝圣写群体汇入轨迹时，应有连续亮带、共同流向、主体主动靠近、进入后的状态改变和仪式目的感。
failure_boundary: 轨迹短促暗浊、鱼群被强迫卷入或进入后仍攻击挣扎时，朝圣与天堂会美化冲突。
