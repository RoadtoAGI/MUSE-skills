tenor: 小船航行留下长而雪白的泡沫航迹，周围黑鱼不断从两侧汇入并在其中安静漂浮
vehicle: 一条白云组成的天河落到海面，众多朝圣者从各处聚来进入圣河，沿其接受安抚
