chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 是真正的纳须弥于芥子的境界
sensory_mapping: 暗铜色圆环近在艇前，细小截面里却像收进一座无边巨山，无数层圆环同时向内展开。
context_fact: 探险队第一次近看全封闭的四维实体，在三维眼光中看见无数个魔戒叠加出的高维质感。
image_mechanism: 须弥与芥子的极端尺度反差承接四维纵深，让看似神秘的包容性落在一个文化中已有的悖论图景上。
property_alignment: 魔戒外观对应芥子；高维纵深对应须弥山；多层叠加对应宏观整体内藏；三维尺度失效对应大小关系超越。
context_alignment: 前文的方寸之间深不见底给出抽象判断，此处面对实体时用须弥芥子把判断凝成可敬畏的物象。
narrative_function: 赋予首次接触四维文明以宗教式宏伟感，同时点明高维实体不能按三维外廓估量。
transfer_rule: 借尺度悖论表现高维包容时，要同时落实微小外观、巨大内蕴以及常规尺度失效的原因。
failure_boundary: 魔戒并未真的收纳须弥山，且其实际四维体积未知；典故表达感知质感，不能充当尺寸测量。
