tenor: 魔戒有限的可见尺度中显现出四维物体巨大的内在纵深和包容性
vehicle: 佛教想象中宏伟的须弥山被完整容纳于微小芥子之内
ground: 外部尺度极小而内部容量巨大；宏观整体没有因容器微小而压扁；常规大小关系被超越
