figure_type: analogy
quote: 整团管道乱麻像一个巨大的大脑模型，那交替亮起的管子象征着一条条神经回路的建立
sensory_mapping: 穹顶变成巨脑，灰管是神经纤维，白亮沿弯曲回路轮流奔走，仿佛一个异星意识正在思考。
context_fact: 程心被极端混乱管道吸引并产生奇想，随后理智否定，认为更可能是散热等工程装置。
image_mechanism: 大脑模型利用网络和动态亮路两项强对应，把无规则工程暂时赋予认知生命，但文本保留其误读性质。
property_alignment: 管道网络对应神经纤维；交缠复杂对应脑连接；亮管切换对应回路激活；整体装置对应巨脑模型。
context_alignment: 云天明的身体和意识如何存在仍是谜，麦田上方似脑穹顶自然诱发程心把环境当作其认知容器。
narrative_function: 展示人类面对异星工程时不可避免的类比冲动，并用随即否定强调文化认知边界。
transfer_rule: 复杂网络如大脑时，应至少匹配连接结构与动态激活，并明确这是功能证据还是观察者投射。
failure_boundary: 程心自己否定了该解释，管道可能只是散热系统；形似神经不能推出意识或计算功能。
