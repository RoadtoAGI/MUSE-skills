chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 许多自己分辨不出来的怪啸，像狂风吹过枯林
sensory_mapping: 人声在黑暗中变成枯枝，气流从无数喉咙和空隙穿过，刮出方向难定的啸叫。
context_fact: 程心刚失明，无法确定哪些声音来自现实、哪些来自幻觉。
image_mechanism: 枯林提供复杂声道，风则把个体发声者抹去，只保留死亡环境中的总体鸣响。
property_alignment: 多重人声对应密集枯枝；奔跑气流对应狂风；怪啸对应风穿枝孔；无法定位对应林中回响。
context_alignment: 文明被宣布进入互食荒野，现代会场在她耳中先退化成无叶死亡树林。
narrative_function: 强化失明后的听觉恐怖，并让现实与幻觉边界继续模糊。
transfer_rule: 混合怪声比作风过林时，应匹配声道数量、风力、音色和定位困难。
failure_boundary: 声音实际由人发出且包含语言情绪，枯林会抹去意义；若能分辨清楚台词则不宜。
quality_assessment: effective
