review_status: reviewed
tenor: 混乱人群中来源不明、彼此混合的尖叫哭号和异响
vehicle: 狂风穿过无叶枯林时在枝干间挤压、碰撞形成的多层怪啸
ground: 声音尖厉而不规则；多处声源互相叠加；听者难辨每一声的具体来源
