chapter: 【时间开始后约170亿年，我们的星星】
figure_type: analogy
quote: 总感觉那是一种病态压抑的颜色，让她想到心脏供氧不足的病人的嘴唇
sensory_mapping: 整片森林像一张缺氧发紫的嘴唇，把她包在病态色泽里，连可呼吸空气也显得令人窒息。
context_fact: 一千八百多万年后蓝星植物为适应光照由蓝变紫，程心注定在此度过余生。
image_mechanism: 嘴唇紫绀把纯颜色判断接上具体病理因果，使紫色同时传出身体窒息与世界病变。
property_alignment: 植被紫色对应紫绀嘴唇；行星光照改变对应供氧异常；程心压抑对应病人窒息；铺天盖地对应病征扩大到世界。
context_alignment: 程心具航天工程与生命支持经验，缺氧征象比审美色谱更自然地组织她的不安。
narrative_function: 在年代测定前先让新蓝星带上病态预感，暗示这不是可恢复的旧家园。
transfer_rule: 颜色联想到病征时，应对齐色值、形成机制、身体感受和场景危险，而非只借负面情绪。
failure_boundary: 紫色植物可能完全健康且适应良好，蓝星大气含氧量反而提高；疾病只属程心联想。
