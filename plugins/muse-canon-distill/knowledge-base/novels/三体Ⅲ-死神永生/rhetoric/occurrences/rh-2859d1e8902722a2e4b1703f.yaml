chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 宇宙对两个世界仍保持着神秘的面纱
sensory_mapping: 银河披上一层巨大薄纱，智子飞向远处便没入褶皱，两个文明站在纱外看不见背后的猎手。
context_fact: 多枚智子进入盲区后永久失联，只探测过两个荒凉星系，科学家怀疑存在文明人为干扰。
image_mechanism: 面纱把信息不透明赋予遮挡界面，保持一词又隐约加入宇宙不愿被看透的主动性，与黑暗森林隐蔽法则相合。
property_alignment: 宇宙未知对应面容隐藏；智子盲区对应纱幕遮挡；少量荒凉数据对应可见轮廓；文明隐蔽对应不揭面。
context_alignment: 后一句明确黑暗森林不允许宇宙透明，面纱与透明度使用同一视觉机制，形成概念闭合。
narrative_function: 把智子盲区从技术故障提升为宇宙隐蔽秩序的证据，维持两个世界共同无知。
transfer_rule: 未知如面纱时，应指出遮挡主体、可见层与不可见层，以及探测为何在某条界面失效。
failure_boundary: 若未知只因设备暂时损坏、对象本身完全公开，面纱的结构性隐藏会过度解释；宇宙也未必有主动意志。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 地球和三体文明即使发射智子探测，仍无法获知银河其他区域真实状态与盲区成因
vehicle: 一个主体用不透明面纱遮住面容和细节，只让观察者看见外部轮廓
ground: 对象真实存在却主动或结构性地阻止观察；探测者只能获得有限表象，关键身份与机制隐藏
