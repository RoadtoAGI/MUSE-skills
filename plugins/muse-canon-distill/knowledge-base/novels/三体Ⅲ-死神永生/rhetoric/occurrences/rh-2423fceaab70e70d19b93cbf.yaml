chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 夜色像天鹅绒般笼罩着一切
sensory_mapping: 黑绒从穹顶落到沙滩，把宽姨和马车裹没，只留盔甲上的几点星光。
context_fact: 公主从酣睡醒来，火把已灭，只能看见卫队长的星空剪影。
image_mechanism: 笼罩将黑绒从远处背景改成覆盖动作，比前文黑天鹅绒世界更贴近人物身体。
property_alignment: 夜色对应黑绒；火把熄灭对应布幕落下；景物失细节对应吸光；全景被包对应笼罩。
context_alignment: 这是同一夜色织物框架的推进：先是远方一块布，此刻成为罩住一切的材料，首处已建立材质。
narrative_function: 压暗背景，突出卫队长、黑伞和星光构成的亲密剪影。
transfer_rule: 延展织物夜色时，应增加新的空间动作或观察关系，避免只重复颜色形容。
failure_boundary: 夜色没有实体重量，天鹅绒保温属性也不成立；此处只取吸光与覆盖。
