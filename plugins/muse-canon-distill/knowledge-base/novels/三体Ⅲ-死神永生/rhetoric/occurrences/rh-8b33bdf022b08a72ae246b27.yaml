chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 画笔继续在这色彩的迷宫中游走
sensory_mapping: 笔尖钻进色块构成的岔路，沿红蓝墙面转弯回绕，像在寻找国王面孔的出口。
context_fact: 王子被色彩涌现催眠，针眼却显得无需思考，笔迹最终突然形成完整肖像。
image_mechanism: 迷宫把平面色块变成有深度的路径系统，画笔因而获得探索者角色和目的地。
property_alignment: 复杂色块对应岔路；笔迹曲折对应游走；未见形状对应不知出口；肖像显现对应走出迷宫。
context_alignment: 魔画信息藏在童话迷宫中供人类解码，这个局部作画意象也镜像整套情报结构。
narrative_function: 延长形状出现前的认知悬念，并赋予笔尖独立行动感。
transfer_rule: 创作过程写成迷宫时，应明确路径材料、探索者、局部迷失和最终出口。
failure_boundary: 针眼似乎完全掌握路线，并未真正迷失；迷宫只反映旁观者无法理解的复杂性。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 画笔在复杂交叠色块间寻找并建立最终肖像结构的运动
vehicle: 行者在分岔众多、路线难辨的迷宫通道中穿行寻找出口
ground: 路径曲折；局部选择繁多；整体结构暂不可见；移动将通向确定结果
