chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 所有的影子仍在摇晃，像绞架上的尸体
sensory_mapping: 灯光把首脑影子吊到墙面和地板上，爆炸一震，黑色人形便成排无力摆荡。
context_fact: 治安军正在轰炸，会场听到爆炸、吊灯摇晃，有人喊智子的断电命令等于屠杀。
image_mechanism: 绞架将普通光影运动预演为集体处决，尸体的被动摇摆对应首脑们虽在场却无控制力。
property_alignment: 人形影子对应尸体轮廓；吊灯悬挂对应绞架；爆震摇晃对应尸身摆动；屠杀宣告对应死亡结局。
context_alignment: 国会原是决策场，此刻所有人只能听取占领者裁决，墙上影子比本人更早成为受刑者。
narrative_function: 用会场物理震动给屠杀一词配出视觉判决，并为坟墓意象推进。
transfer_rule: 摇摆影子比作吊尸时，应具人形、悬挂光源、外力摆动和明确死亡语境。
failure_boundary: 人物仍活着且影子未真正悬吊；若场景没有死亡威胁，绞架会成为无根据恐怖装饰。
