review_status: reviewed
tenor: 海王星和太阳都缩成暗点、看不见同伴船时，两人脚下唯一可感的巨型天线平台
vehicle: 无边海面中孤立、四周没有其他陆地可见的一座小岛
ground: 周围广阔空无；立足面有限；与其他聚居地隔绝；可见参照只有脚下；救援遥远
