chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 在太阳系这冷寂的边缘，脚下的天线仿佛是宇宙中唯一的孤岛
sensory_mapping: 黑色宇宙扩成无岸海洋，天线表面成为唯一硬地，两名宇航员站在孤岛边缘望不到邻岛。
context_fact: 两船相隔近十万千米，人员总数不足百，昔日两千舰队方阵只剩遗骸记忆。
image_mechanism: 岛屿把真空中的立足感和孤绝同时物化，海洋尺度又自然承接太阳系边缘的冷寂。
property_alignment: 天线平台对应岛面；太空对应海洋；看不见阿拉斯加号对应无邻岛；少量人员对应孤岛居民。
context_alignment: 后文探测者像水底鱼，此处先把宇宙写成海域，海洋空间框架连续支撑恐惧。
narrative_function: 缩小人类探测力量的尺度，并为古战舰零件带来的孤魂感营造背景。
transfer_rule: 太空平台比作孤岛时，应落实立足面、周围介质、可见距离、同伴缺席和救援条件。
failure_boundary: 天线能高速航行且有通信，不是固定陆岛；太空也没有水面或方向上下。
quality_assessment: exemplary
