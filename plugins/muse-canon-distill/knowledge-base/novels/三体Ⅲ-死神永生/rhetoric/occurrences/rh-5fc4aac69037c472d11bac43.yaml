chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 他在之前的大部分时间都处于一种很阳光的状态
sensory_mapping: 过去几个月他的情绪像田园白昼，温暖敞亮；质量流失的念头出现后，光线突然被一片阴影截断。
context_fact: 关一帆此前设想孩子重建人类，几天来却反常地长时间沉思和计算。
image_mechanism: 把整体情绪变成照度和温度，‘突然发现’对应天气转暗，程心因此能从行为变化读出心事。
property_alignment: 乐观对应明亮；亲和对应温暖；未来希望对应可见远景；忧虑出现对应阴影；状态持续对应晴朗时段。
context_alignment: 小宇宙太阳可在人为昼夜间切换，人物心境以阳光命名与封闭田园的光照环境自然贴合。
narrative_function: 先建立明暗反差，再引出关一帆关于宇宙质量的忧虑。
transfer_rule: 性格或情绪写成阳光时，需给出先前具体乐观行为、温暖影响和转暗触发点。
failure_boundary: 关一帆一直保有宇宙恐惧和自卑，‘阳光’概括主要表层状态，并非全部心理。
