chapter: 【威慑纪元13年，审判】
figure_type: metaphor
quote: 末日战役是人类最大的创伤，十多年来：其疼痛不但没有减轻，反而愈加剧烈
sensory_mapping: 人类文明获得一具共同身体，末日战役撕开最大伤口，水滴再现像碰到创面，使旧痛沿政治神经加剧。
context_fact: 地球拒绝让水滴追杀蓝色空间号，即使后者被视为异类，因为再次允许水滴攻击人类在政治上不可接受。
image_mechanism: 创伤把军事损失延伸为集体身体记忆，疼痛增长解释看似不理性的政策底线来自尚未愈合的受害经验。
property_alignment: 舰队覆灭对应巨大创口；十多年记忆对应慢性伤；水滴再攻击对应触碰伤源；政治拒绝对应回避二次受伤。
context_alignment: 水滴曾造成压倒性屠杀，视觉与技术符号都未改变，集体看到同一武器自然触发创伤反应。
narrative_function: 解释两个文明已合作却不能让三体武器执法人类，也让万有引力号追击获得政治必然性。
transfer_rule: 历史事件如伤口时，应区分损伤、疼痛记忆、触发物与恢复程度；时间经过不等于自动痊愈。
failure_boundary: 若社会已完成和解、相关符号不再触发情绪，疼痛加剧缺少证据；集体创伤也不能替每个个体发言。
