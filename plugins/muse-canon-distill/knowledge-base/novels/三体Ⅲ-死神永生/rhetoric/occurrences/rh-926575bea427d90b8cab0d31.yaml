chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 他就像一块核燃料，即使静静地封闭在铅容器中，都能让人感觉到力量和威胁
sensory_mapping: 铅罐；静置燃料棒；不可见辐射；潜藏热量；危险标志
context_fact: 维德出狱后仍有随从和太空艇，面对核爆不动声色，坚持推进光速飞船。
image_mechanism: 监狱与伤残只像在他外面加了一层铅壳，无法消耗内部能量；他不需行动，组织和敌意已像辐射穿壁让程心感到。
property_alignment: 维德对应核燃料；意志与组织力对应核能；监狱对应铅容器；安静坐着对应封存；追随者活动对应辐射外泄；潜在暴力对应临界反应；程心警觉对应辐射探测
context_alignment: 场景刚经历氢弹，核意象有真实物理背景；维德把公众希望视为噪声，更像另一种尚未释放的核源。
narrative_function: 概括维德被压制仍具威胁的政治能量，为星环集团后续武装化预告。
transfer_rule: 用封存核燃料写危险人物时，应对应高能内核、外部约束、静态表面、持续泄露信号和可能临界释放。
failure_boundary: 人物已失去组织、意志和行动能力，约束能彻底消解威胁时，核燃料会虚构潜能。
quality_assessment: exemplary
