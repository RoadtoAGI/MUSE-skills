tenor: 维德即使刚出狱、残缺一手且表面安静，仍能吸引忠实组织并散发改变局势的潜在力量和危险
vehicle: 高能核燃料被厚铅容器封存时外表静止，却仍含巨大能量并释放需警惕的辐射
