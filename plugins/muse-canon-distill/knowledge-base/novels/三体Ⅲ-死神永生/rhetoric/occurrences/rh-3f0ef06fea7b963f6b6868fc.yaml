chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她浅浅一笑，如微风吹皱一汪春水，水中的阳光细碎轻柔地荡漾开来
sensory_mapping: 脸面成为春水，嘴角动作成为微风，肤色光泽裂成水上细碎日光向外荡漾。
context_fact: 程心初见智子，被其完美容貌和柔顺气质震撼。
image_mechanism: 风—水纹—光碎构成三步动态，准确追踪浅笑如何从肌肉微动扩展为整张脸的生机。
property_alignment: 浅笑触发对应微风；细微表情纹路对应水皱；面部光彩扩开对应阳光碎片荡漾。
context_alignment: 茶道空间、和服与春水共同构成东方柔美表演，也使程心暂忘其侵略者身份。
narrative_function: 把静态完美面容注入动态生命，完成智子魅惑力核心特写。
transfer_rule: 表情如水波时，应细分触发、纹理扩散和光线后果；动作强度须与风力和波幅一致。
failure_boundary: 大笑、急促抽动、面部阴暗无反光或表情不扩散时，微风春水的轻柔链条失效。
