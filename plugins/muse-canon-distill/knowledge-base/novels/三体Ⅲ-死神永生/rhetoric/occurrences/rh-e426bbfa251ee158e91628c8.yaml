chapter: 【威慑后第一年，移民完成后第六天清晨，澳大利亚】
figure_type: simile
quote: 四周一片死寂，仿佛世界被冻住一般
sensory_mapping: 脚步与话音像水流同时结冰，澳大利亚连同看不见的人群被封进一块无声透明冰体。
context_fact: 所有人集中听取关于引力波广播的消息，讲话间隔内没有其他声音。
image_mechanism: 冻结把群体专注扩大为世界停摆，并以物态静止解释程心仅凭听觉感到的空白。
property_alignment: 群体不动对应凝固；声音消失对应振动冻结；覆盖四周对应世界结冰；等待消息对应冰封暂停。
context_alignment: 前一年社会曾冻结在专制坚冰下，此处短暂冻结来自解放消息，重复意象却改变因果。
narrative_function: 在欢呼巨浪前压低声场到零，形成爆发式转折。
transfer_rule: 世界冻结应由多类运动同步停止和广域静默支撑，并说明解除冰封的触发。
failure_boundary: 客观世界仍在运转，静止只限程心可听范围；若仍有背景声，全面冻住会夸大。
