tenor: 信息窗发言间隙，原本混乱的广场和周围人群完全停止发声和动作
vehicle: 整个世界在低温中凝冻结冰，所有流动与振动都被固定
ground: 运动全面停下；声音因振动受阻而消失；停滞覆盖范围超出单一个体
