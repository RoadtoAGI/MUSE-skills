tenor: 大移民给城市建筑、公共设施和可见生活秩序留下的破坏痕迹被修复
vehicle: 受伤身体的创口愈合，结痂脱落后皮肤上的疤痕逐渐淡去
ground: 破坏留下可见痕迹；修复需要一段时间；表面恢复完整；痕迹消失不等于事件未发生
