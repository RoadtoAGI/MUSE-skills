chapter: 【广播纪元7年，程心】
figure_type: metaphor
quote: 城市的伤痕就完全消失
sensory_mapping: 断电街区和破损楼面像皮肤创口逐日合拢，两年后繁华灯光覆盖最后一道疤。
context_fact: 城市与工业设施主体保存完好，返乡后不到两年便恢复移民前的繁荣景象。
image_mechanism: 伤痕让城市获得可愈合表皮，把重建成果集中在肉眼可见的创口消退，同时为社会记忆仍可能存在留出余地。
property_alignment: 设施破坏对应伤口；修缮重建对应愈合；繁荣外观对应皮肤复原；两年过程对应疤痕淡化。
context_alignment: 社会刚经历报复处决，城市外表却迅速无痕，身体表层的恢复反衬伦理创伤未被同样检视。
narrative_function: 压缩重建时间并建立外在繁荣，为人们转向享乐、回避毁灭前景提供视觉背景。
transfer_rule: 城市如受伤身体时，应锁定具体受损表面、修复过程和无痕外观，并区分物理恢复与历史遗忘。
failure_boundary: 城市没有痛觉，且人口创伤与政治后果不会随建筑修好而消失；伤痕只指可见物质损坏。
quality_assessment: effective
