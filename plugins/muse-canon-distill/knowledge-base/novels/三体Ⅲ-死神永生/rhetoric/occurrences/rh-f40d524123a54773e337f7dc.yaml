chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 它们顶起星空，仿佛把宇宙变成了死神的宫殿
sensory_mapping: 黑柱从平原立到看不见尽头，星空像被它们托成穹顶，整个灰星成了死神无人的大殿。
context_fact: 死线内部光速为零，代表绝对死亡；近处看是完全黑色、无反光的巨柱。
image_mechanism: 宫殿把五条技术痕迹组织成建筑秩序，零光速的物理死亡获得主宰空间的神殿形象。
property_alignment: 死线对应殿柱；星空对应穹顶；灰星平原对应殿堂地面；零光速对应死神权能；黑色对应死亡装饰。
context_alignment: 冥王星方碑是人类墓碑，灰星黑柱则像更高文明的死亡宫殿，纪念尺度升级为宇宙法则尺度。
narrative_function: 把死线从怪异物理对象提升为敬畏景观，并触发程心对万物归宿的追问。
transfer_rule: 巨柱景观比作宫殿时，应落实柱、顶、地面、主人、功能和观察者情绪，形成完整空间。
failure_boundary: 死线没有支撑星空或建筑目的，也不存在死神主人；宫殿是尺度和死亡属性造成的心理构图。
quality_assessment: exemplary
