review_status: reviewed
tenor: 五根宽数百米、高百千米的绝对黑柱从灰星平原直入星空构成的地表景观
vehicle: 由通天黑柱支撑穹顶、庄严空旷、属于死亡主宰的巨型宫殿
ground: 柱体高耸；数量成列；顶部触及天穹；空间尺度宏大；颜色黑；氛围庄严恐怖；与死亡力量关联
