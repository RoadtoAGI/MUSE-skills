review_status: reviewed
tenor: 在温柔未来突然看见持枪维德，程心感到旧时代恐怖重新接管现实
vehicle: 中断三个世纪的噩梦恢复播放，并从旧情节继续
ground: 熟悉威胁在长久间隔后重现；当前环境的现实感被突兀、不可置信的恐怖覆盖
