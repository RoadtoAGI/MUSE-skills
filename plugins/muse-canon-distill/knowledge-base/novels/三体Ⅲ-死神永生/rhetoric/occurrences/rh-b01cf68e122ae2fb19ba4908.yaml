chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 像是通过了太空中一道巨大的拱门
sensory_mapping: 暗铜环箍化成两侧直上星空的门柱，太空艇如微小车马从中央门洞疾掠而过。
context_fact: 魔戒因第四维距离误判突然由硬币大小变得顶天立地，太空艇险些撞上环箍。
image_mechanism: 拱门把圆环由被观看的物体改成包围航路的建筑，尺度突变因此通过艇身与门洞比例立即可感。
property_alignment: 圆环空心对应门洞；环箍对应拱券与门柱；艇身穿环对应过门；巨大尺度对应建筑压迫感。
context_alignment: 前句还是远处硬币，下一瞬变成可穿越建筑，拱门准确承接四维盲距造成的尺度翻转。
narrative_function: 把险撞的几何路线清楚画出，同时将首次近距接触写成跨入异文明遗迹的门槛。
transfer_rule: 环形物如门时，应明确通行轴线、边框尺度、主体比例和穿越前后的空间位置。
failure_boundary: 魔戒不是建筑入口，太空艇也没有进入其内部；喻体只描述从圆环空洞穿过的视觉过程。
quality_assessment: effective
