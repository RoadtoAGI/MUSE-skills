tenor: 太空艇紧急转向后从巨大魔戒的圆环中心高速穿过
vehicle: 行进者从一座顶天立地的拱门洞口进入并穿出另一侧
ground: 环状结构围成可通行空洞；主体沿洞口轴线穿越；边框尺度压倒行进者；通过发生在短时间内
