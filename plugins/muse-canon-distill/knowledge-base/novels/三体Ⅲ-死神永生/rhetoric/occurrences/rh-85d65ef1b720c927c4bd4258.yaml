review_status: reviewed
tenor: 战士卸下后放在黑色实验平台上的两条柔性弹链，由连续黄铜反物质子弹串接而成
vehicle: 两条金黄色长蛇收拢身体静卧地面，鳞片连续反光，仍保留潜在致命性
ground: 弹链长曲形对应蛇身；黄铜弹壳对应金色鳞片；连续子弹对应鳞节；静置对应蛇伏卧；反物质杀伤对应毒性；两条链对应两蛇
