chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 弹链静静地躺在平台上，像两条金黄色的蛇
sensory_mapping: 金蛇伏台；鳞节闪黄；长身弯曲；静中有毒；黑面衬亮
context_fact: 自卫队开始服从停战命令，把随身反物质子弹链逐一轻放到曲率实验平台上。
image_mechanism: 卸除的武器仍以蛇形保存危险：串联弹壳成为鳞片，柔链在重力下弯伏；“静静躺下”把攻击状态转为被驯服的毒物。
property_alignment: 弹链对应蛇身；黄铜色对应金鳞；弹壳节列对应鳞节；柔性弯曲对应蛇姿；静止放下对应伏卧；反物质威力对应剧毒；成对链条对应两蛇
context_alignment: 战争力量刚被写成黑色巨轮，此刻分解回一条条可放下的金蛇，形象变化记录集体从推进到解除武装。
narrative_function: 让投降动作兼具美感与余险：武器安静下来，却没有失去可致命的本性。
transfer_rule: 用蛇写链状武器时，应有连续节片、可弯长形、鲜明表面反光、静伏姿态和潜在伤害性。
failure_boundary: 物体笔直刚硬、表面无节、颜色暗哑，或完全无危险功能时，金蛇会只剩形状牵强。
quality_assessment: effective
