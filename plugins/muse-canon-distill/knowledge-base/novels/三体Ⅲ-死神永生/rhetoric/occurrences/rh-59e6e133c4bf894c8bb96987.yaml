chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 显示她肖像的全息标语影像在人群上方飘荡，像绚丽的彩云
sensory_mapping: 宣传影像脱离屏幕成为云片，程心的肖像被光色拉成悬在人海天际的彩层。
context_fact: 程心在联合国广场面对支持者，竞选影像以全息形式飘在人群上空。
image_mechanism: 彩云同时解释全息图像的无实体边缘、漂浮姿态和庆典色调，让政治宣传成为天气般笼罩现场的景观。
property_alignment: 全息无实体对应云气；空中漂移对应云行；绚丽光色对应霞彩；覆盖人海对应云层铺展。
context_alignment: 支持者营造的节庆气氛需要明亮天象，而影像的物理呈现也具备透明和漂浮条件。
narrative_function: 迅速建立竞选现场的繁盛视觉表面，为紧接着的世界脆弱感提供美丽背景。
transfer_rule: 把投影写成云，应让透明边缘、悬空移动和光色至少两项可见；云的天气色调还要匹配现场情绪。
failure_boundary: 固定在硬屏上的清晰矩形画面、单色警报或低处标牌不具备彩云的漂浮铺展。
