tenor: 广场人海上方漂浮的程心肖像和竞选标语全息影像
vehicle: 色彩明丽、没有固定边缘并在天空缓慢漂移的云层
ground: 形体悬空且持续变动；明亮色彩覆盖并装饰下方密集人群
