chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 一阵轰鸣声从远处的发射区传来，很奇怪，竟让程心想起默斯肯大旋涡的声音
sensory_mapping: 发射轰鸣；涡底回声；地面如水墙；人潮被吸；末日吮洞
context_fact: 未经证实的光粒警报引发城市集体逃亡，所有车辆和穿梭机向发射港汇聚。
image_mechanism: 同样的低频巨响跨场景触发记忆，向上逃生的发射港在听觉上反转成向下吞噬的旋涡；人群以为离开危险，却可能正被恐慌吸入灾难。
property_alignment: 聚变声对应涡声；发射港对应旋涡中心；车辆汇入对应水流汇入；穿梭机起飞对应船只挣扎；恐慌秩序对应不可抗力；误报警报对应虚假生死线；毁灭风险对应涡底绞碎
context_alignment: 默斯肯旋涡刚帮助她理解黑域，此刻成为灾难心理模板，说明宇宙方案之外，人类恐慌本身也会形成吞噬结构。
narrative_function: 把解谜场景的死亡预感带入逃亡现场，为随后人踩人式选择增加宿命感。
transfer_rule: 用旧灾害声响类比新现场时，应有高度相似的音色和震动，并让两场景在运动汇聚、失控或危险机制上形成第二层呼应。
failure_boundary: 声音相似仅为偶然、当前人群井然可控且行动确实安全时，旋涡联想只能标作人物创伤而非机制判断。
