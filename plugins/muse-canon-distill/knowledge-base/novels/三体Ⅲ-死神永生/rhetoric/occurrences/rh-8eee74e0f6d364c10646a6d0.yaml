tenor: 月落云合后失去细节、陷入浓重均匀黑暗的大地
vehicle: 整件物体沉进黏稠黑墨，被深色液体包覆并染透
ground: 黑色浓重；轮廓被吞没；覆盖全面；具有湿冷黏滞的触感联想
