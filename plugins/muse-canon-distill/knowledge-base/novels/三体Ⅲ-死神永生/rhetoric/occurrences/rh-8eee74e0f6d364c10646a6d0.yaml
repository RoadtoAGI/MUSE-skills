chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 大地像是浸在墨汁中一般
sensory_mapping: 田野宫墙一起沉到墨池底，边缘被黑液泡软，只剩寒风掠过看不见的表面。
context_fact: 乌云遮天、黎明尚未来临，王子与针眼借最暗时段离宫。
image_mechanism: 浸泡把无光状态转成液体包围，墨的浓度让黑暗从颜色变成有重量的介质。
property_alignment: 夜色对应墨黑；全面无光对应整体浸没；景物失轮廓对应染透；阴冷空气对应湿墨触感。
context_alignment: 针眼即将用颜料改写现实，墨汁般黑夜提前把整个王国放进一张待画的暗底。
narrative_function: 加重阴谋环境的物质感，并把庆典的水晶透明反转为不可见。
transfer_rule: 黑暗比作液体时，应匹配颜色浓度、包围程度、轮廓消失和触觉气氛。
failure_boundary: 大地没有真正被染湿，墨汁的气味与流动也未出现；喻体只增强暗度和包覆感。
quality_assessment: effective
