chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这束微弱的光线在太空中行走了近三个世纪才接触到他们的视网膜
sensory_mapping: 细小光束长出脚步，在黑暗中走过二百八十六年，最终以最后一步轻触两人的视网膜。
context_fact: 两人看到的是恒星过去的样子，其当下光线抵达时，云天明和程心都已不在人世。
image_mechanism: 行走把难以感知的光年换成人类旅程，把传播延迟从数字变成迟到的相遇；接触则把宇宙信息落在身体上。
property_alignment: 光路对应道路；传播历时对应漫长行走；光线微弱对应孤小旅人；视网膜接收对应抵达触碰。
context_alignment: 云天明本人将死且无法陪伴程心，代替他的古老星光成为能跨世纪抵达她的旅者。
narrative_function: 同时显出恒星距离、生命短暂和赠礼延时，使暗红光点承载跨越死亡的情感。
transfer_rule: 光线如旅人时，应给出出发时间、路程、历时和接触终点；时间延迟必须参与叙事意义。
failure_boundary: 近距即时照明或传播时间无关紧要时，数世纪行走会制造虚假庄严；光也没有主观意志。
