tenor: DX3906在二百八十六年前发出的光传播到云天明和地球观察者眼中的过程
vehicle: 一个微弱旅人独自穿越漫长路程，历时数世纪后才抵达并触碰目的地
ground: 传播持续时间极长且方向连续；到达终点时才与接收者发生短暂接触
