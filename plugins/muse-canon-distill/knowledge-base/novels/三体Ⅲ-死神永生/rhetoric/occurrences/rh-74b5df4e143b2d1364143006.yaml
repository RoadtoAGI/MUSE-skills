figure_type: simile
quote: 那个像旧火车站一样的终端大厅
sensory_mapping: 旧站大厅；灰暗设施；长途候车；线性入口；年代磨损
context_fact: 程心从星环城轴心进入长辐条时回忆公元时代的太空电梯终端站，并立即指出这里规模更大且没有陈旧感。
image_mechanism: 未来太空枢纽被套进地面铁路记忆，宏大设施显出候车、换乘与磨损的日常质感；当前星环城再以反差擦除这层旧感。
property_alignment: 太空电梯终端对应铁路枢纽；大厅对应候车厅；乘客通行对应旅客集散；固定线路对应轨道；陈旧内装对应老站；长距离运输对应远途列车
context_alignment: 这是程心跨越六十年后的记忆坐标，旧火车站不仅写建筑外观，也让她衡量星环城相同构型下的时代跃迁。
narrative_function: 借旧交通经验连接两个时代，并通过随后否定陈旧感突出星环城的新规模与活力。
transfer_rule: 用旧车站写交通建筑时，应匹配集散大厅、线性运载系统、候乘流程与可见年代痕迹，而非只凭空间大。
failure_boundary: 设施是私密实验室、没有旅客换乘功能，或空间高度未来化且无任何磨损时，旧火车站会错置社会用途和年代感。
