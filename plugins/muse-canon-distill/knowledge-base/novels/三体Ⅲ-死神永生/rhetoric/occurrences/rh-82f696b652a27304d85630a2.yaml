sensory_mapping: 制服与人脸仍在，狙击枪和飞行车却在其后投出恶魔轮廓，每次发现幸存者就喷出死亡。
context_fact: 智子许诺治安军免于移民，期限后命令他们消灭保留区外所有人。
image_mechanism: 变成强调过程：自利报名、强迫移民到全面猎杀逐步剥掉其人类共同体身份。
property_alignment: 投靠三体对应向恶势力效忠；滥杀同类对应魔鬼作恶；从收敛到疯狂对应变形过程。
context_alignment: 同段抵抗者被烈火炼成真金，两群人在同一危机中分别变成魔鬼和金，构成选择对照。
narrative_function: 给协从军行为作伦理定性，并把占领暴力落实到人类自身执行者。
transfer_rule: 群体变成魔鬼应展示连续越界步骤和具体受害行为，不能只凭敌对阵营命名。
failure_boundary: 治安军成员动机和参与程度可能不同，魔鬼称谓压平个体差异，适合作总体行为评价。
