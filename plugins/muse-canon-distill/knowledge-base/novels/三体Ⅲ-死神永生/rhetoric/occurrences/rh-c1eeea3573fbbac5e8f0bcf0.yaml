chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她的心就像被一只同样处于零下两百多摄氏度超低温的冰手攥紧了
sensory_mapping: 奥尔特星云低温凝成手掌穿入胸腔，五指收拢时把心跳、呼吸和温度一起压低。
context_fact: 她不敢想象冬眠大脑被外星人复活后的生活，认为那可能是噩梦。
image_mechanism: 冰手把任务环境的物理温度带回身体，又用攥紧动作转译道德恐惧；候选人的远方困境即时控制她。
property_alignment: 深空严寒对应冰手低温；心理紧缩对应手掌攥心；无法帮助候选人对应心脏被控制。
context_alignment: 零下两百多度来自航行环境，不是泛泛心寒，科学数值与身体恐惧精准咬合。
narrative_function: 将伦理想象转成躯体反应，突出程心与其他执行者的心理差异。
transfer_rule: 情绪冷触应从情节中的真实温度来源取材，再用具体接触动作对应身体症状；数值越具体越需有设定依据。
failure_boundary: 若她感受的是愤怒发热或胸部毫无紧缩，冰手会错调；它也不能证明候选人必然受苦。
