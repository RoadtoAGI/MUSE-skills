figure_type: simile
quote: 低重力之下，他像是在雪地上飘行，不时用拐杖点地以减慢速度
sensory_mapping: 罗辑白衣白须掠过氮雪，拐杖每点一下才把身体按回地面，像一缕慢慢飘向墓门的影子。
context_fact: 罗辑拒绝登上星环号，独自回到人类墓碑等待太阳系最后时刻。
image_mechanism: 飘行将低重力物理与老人告别合并，他的身体仿佛已脱离日常重量，向守墓终点淡出。
property_alignment: 低重力跳步对应飘行；白色地表对应雪地；拐杖点地对应校正滑行；老人轻瘦对应无重量轮廓。
context_alignment: 初登场时白发似自发光，离场时身体似飘行；罗辑以两次非尘世白色形象包住冥王星守墓段。
narrative_function: 给罗辑最后一次实体离场留下安静、可见的长镜头，并与二人飞船逃离形成方向分离。
transfer_rule: 低重力步态比作飘行时，应落到接地、步幅、减速动作、地表质感和人物告别语境。
failure_boundary: 罗辑仍靠双脚和拐杖移动，没有真正悬浮或失去重量；飘行是远观步态。
