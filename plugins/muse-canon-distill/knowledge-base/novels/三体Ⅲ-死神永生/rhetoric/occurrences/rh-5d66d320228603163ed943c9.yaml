chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 从远处看，大厦如同一个依山而建的巨大掩体
sensory_mapping: 国会大厦的白色体量压低贴住山坡，入口像防爆口，各国首脑仿佛躲进最后堡垒。
context_fact: 联合国迁入国会大厦召开紧急会议，澳大利亚发电设施正遭治安军空袭。
image_mechanism: 掩体不只复制外形，还把民主议会的公共建筑改写成围攻中的避难工事。
property_alignment: 依山布局对应嵌山掩体；厚重体量对应防护外壳；首脑集中对应人员避险；轰炸声对应战场环境。
context_alignment: 会场即将宣布人类互食，政治中心外观先成为被围困的防御物，公共秩序已退到求生层。
narrative_function: 为远程转播建立末日堡垒基调，并衬托大厦最终无法保护其中任何人。
transfer_rule: 公共建筑比作掩体时，应让地形、体量、防护功能和现场威胁共同成立。
failure_boundary: 大厦实际设计目的不是军事防护，远观形似也不代表能抵御水滴或轰炸。
