quote: 他的目光和表情都给人一种大海般豁达的感觉
sensory_mapping: 开阔海面；远平线；舒展视线；宽广水域；无遮天光
context_fact: 公主把王子与外貌相似却阴郁的冰沙比较，感到王子的神情明显更开朗。
image_mechanism: 人的面部不再是一小块封闭表面，目光向外铺成海面，表情的松弛把边界推到地平线；公主从中感到可接近的宽广。
property_alignment: 王子目光对应海面；情绪开朗对应天光开阔；胸襟宽容对应大海容量；远眺姿态对应海平线；与冰沙差异对应海域与阴影反差
context_alignment: 深水之名与海上孤岛让海洋喻体自然落在人物身上，也预示他不受王国狭窄秩序束缚。
narrative_function: 在巨人外形之外补充可亲人格，使公主的求助对象兼具力量与宽厚。
transfer_rule: 用大海写人物豁达时，应由目光范围、容纳能力、表情舒展和场景中的真实海域共同支撑。
failure_boundary: 人物心胸狭窄、目光闪避，或场景强调海的暴烈封闭时，大海会传递相反性格。
