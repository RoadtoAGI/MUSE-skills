chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 她的眼睛说：不，AA，这次不一样，这次能确定
sensory_mapping: 无声嘴唇；直视目光；眼中句子；坚定亮点；对面读懂
context_fact: 两人担心智子监视，只在谈话间隙说出‘曲率’，并用眼神补全‘驱动’和确认。
image_mechanism: 语言从口腔移到瞳孔，程心的注视依次完成否定旧疑虑、强调这次不同、给出确定结论；AA像读字幕一样读完。
property_alignment: 眼睛对应说话器官；目光强度对应语气；确信神情对应陈述内容；AA对视对应倾听；默契对应语言解码；避免开口对应无声发言
context_alignment: 智子可能监听声音和行为，长期默契使两位女性把最关键的确认压进眼睛，符合谨慎情境。
narrative_function: 完成曲率驱动解码而不破坏隐秘性，也显示两人判断已从猜测跃迁为确信。
transfer_rule: 用眼睛说话时，应有明确接收者、可由表情区分的具体信息、关系默契、发声受限和被理解后的反应。
failure_boundary: 目光含义模糊、双方不熟，或句子包含无法由神情编码的技术细节时，眼睛不能承载完整语言。
