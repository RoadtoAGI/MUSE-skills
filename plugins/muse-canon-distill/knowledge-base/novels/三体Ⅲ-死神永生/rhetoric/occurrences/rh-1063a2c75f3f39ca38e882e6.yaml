chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 银河系像银色的火海一般，能够在地上映出人影
sensory_mapping: 银河在头顶铺成银白火海，无数星火汇出的光甚至把三个人影投到蓝草上。
context_fact: 蓝星距银心并未明显更近，太阳系方向可能受星际尘埃遮挡才显得银河黯淡。
image_mechanism: 火海同时表现银河的高亮和密集波动，银色又撤去高温，让星空成为冷燃的夜间光源。
property_alignment: 星点对应火舌；银河带对应海面；银色星光对应银焰；地面投影对应火光照明；密集结构对应火海翻动。
context_alignment: 二维太阳曾成为血色火海，此处新世界银河成为银色火海，毁灭红火转换成照明冷火。
narrative_function: 建立蓝星夜晚的超常亮度，并自然引出在星光中可见的迁徙草木。
transfer_rule: 高亮星带比作火海时，应落实星点—火舌、带状—海面、照度、色温和与旧火海的差异。
failure_boundary: 银河没有连续火焰或热量，地面亮度来自恒星总光；火海只描述远观亮纹和范围。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 蓝星无月夜空中异常明亮、密集铺展并发出银光的银河带
vehicle: 辽阔无边、亮度强烈、表面不断闪动的银色火焰海洋
ground: 面积广阔；无数亮点似火舌；光度足以照地；边缘起伏；整体连续；颜色银白；背景为黑夜
