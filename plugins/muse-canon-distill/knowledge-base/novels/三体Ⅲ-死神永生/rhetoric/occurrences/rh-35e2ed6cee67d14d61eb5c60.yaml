quote: 那就像一座神圣的祭坛
sensory_mapping: 玻璃圣坛；众人环立；圣物居中；静默凝视；战争献祭
context_fact: 维德团队在平台上完成曲率驱动实验，也曾围绕它决定以反物质武器对抗联邦。
image_mechanism: 先前的微型舞台在伦理决断中改换为祭坛：展示技术的台面成为要求献身的圣地，围观者也从观众变成可能献祭自身和城市的信徒。
property_alignment: 实验平台对应祭坛；曲率技术对应圣物；罩体隔离对应圣域；维德对应主祭者；自卫队对应信众；战争决定对应誓祭；人员生命对应祭品；凝视不移对应宗教专注
context_alignment: 维德把前进视为最高命令，技术目标已占据准宗教位置；祭坛准确揭示理性事业如何索取生命牺牲。
narrative_function: 把停战选择提升为信仰危机，解释维德为何盯着平台而不看任何人。
transfer_rule: 以祭坛写技术或事业核心时，应存在集体信仰、仪式性聚集、不可轻弃的圣物及真实牺牲要求，而非仅因物体被放在中央。
failure_boundary: 平台只用于日常检测、参与者无共同信念，也没有立誓或牺牲后果时，祭坛会凭空宗教化技术。
