chapter: 地球文明
figure_type: analogy
quote: 留下脚印比创造世界更难
sensory_mapping: 掩体城像完整世界拔地而起，身后却连一枚脚印都被亿年风化擦净。
context_fact: 人类可造宏伟掩体世界，却只能靠石刻把极少信息尝试保存一亿年。
image_mechanism: 脚印与世界的尺寸倒置把反直觉难度可视化：制造越宏伟，仍不等于能抵抗漫长擦除。
property_alignment: 文明信息对应脚印；掩体工程对应创造世界；地质时间对应抹平地面；保存对应足迹留存；信息缩减对应脚印微小。
context_alignment: 科学家找到的一亿年信息样本恰是恐龙脚印，前文事实被提升为整个人类命运的类比。
narrative_function: 回收恐龙脚印细节，以一幅尺度悖论总结技术文明在时间面前的失败。
transfer_rule: 用小痕迹对照大创造时，应让小物承担更苛刻的时间指标，并在前文布置可验证的具体样本。
failure_boundary: 脚印指文明遗存而非所有日常痕迹，创造世界指大型技术建设；两者难度取决于亿年保存这一特定指标。
quality_assessment: exemplary
