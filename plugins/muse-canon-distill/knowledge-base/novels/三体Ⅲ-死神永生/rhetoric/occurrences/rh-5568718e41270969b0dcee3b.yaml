review_status: reviewed
tenor: 让文明信息跨越地质纪年留存，比建设当代宏大工程更困难
vehicle: 行路者造出庞大世界容易，反而无法在会抹平一切的地面留下一个微小足迹
ground: 创造物规模巨大；留痕尺度微小；留痕要求耐久；保存难度反超制造难度；结果由承载介质决定
