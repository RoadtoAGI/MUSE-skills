chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 这是一个死的世界，一张死的画
sensory_mapping: 城、人、血管和飞船全被摊进一幅巨画，色彩与细节仍在，画面里却再没有一次呼吸。
context_fact: 摄像机试图寻找活动迹象，二维人体和城市除火焰引起的变形外全部静止。
image_mechanism: “死”同时修饰世界与画，切断信息保存等于生命延续的错觉；二维结果既是对象尸体也是其图像。
property_alignment: 二维空间对应画布；投射结构对应画面；静止人体对应画中人物；原子细节对应精细绘制；生命消失对应死画。
context_alignment: 政府抢救文物只求留下死的图像，此处提前展示目标实现后的极限：完整图像仍是彻底死亡。
narrative_function: 为城市二维化段落下判词，并把视觉奇观的美感重新压回生命伦理。
transfer_rule: 现实比作死画时，应同时验证平面性、定格、细节保存、功能丧失和生命不可逆。
failure_boundary: 二维世界仍可能遵循某种物理过程，图像也非人工颜料；“死”依据当前观察不到生命活动。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 原子信息完整却一切静止、没有任何生命活动的二维欧洲六号及居民
vehicle: 曾经描绘世界但本身无生命、所有形象永久定格的死画
ground: 平面呈现；细节可见；场景被定格；对象无运动；图像替代实体；生命不能从信息中恢复
