chapter: 【危机纪元元年，生命选项】
figure_type: simile
quote: 看上去如同夕阳中一个巨大的句号
sensory_mapping: 二十千米环形设施在远距俯瞰中压成标点圆点，夕阳像一页临近结束的背景。
context_fact: 杨冬在物理学遭智子封锁后俯瞰停机加速器，并走向自杀。
image_mechanism: 外形只负责让加速器成为句点，停机、夕阳与人物绝望共同激活句点的终止功能，使设施替时代落笔。
property_alignment: 加速器环形对应句号圆点；设备停运对应句子结束；夕阳对应一天终结；物理研究受阻对应学科叙事被截断。
context_alignment: 场景同时处在杨冬生命和基础物理前景的终点，句号能在个人、学科、时代三层收束。
narrative_function: 用单一可见形状预告人物选择，并把停机设施提升为危机纪元的标点。
transfer_rule: 标点喻体须同时满足字形和语法功能；圆形只能提供入口，现场还要有明确结束事件才能让句号成立。
failure_boundary: 加速器仍高速运行或场景指向新计划启动时，句号的终止意义会被行动否定；仅因圆形套用也会流于表面。
