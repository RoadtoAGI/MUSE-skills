chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: simile
quote: 空间中有许多坐标在穿行，如同母世界的天空中飞翔的矩阵虫
sensory_mapping: 点阵虫群；信息飞空；坐标穿行；主核捕捉；黑空如天
context_fact: 歌者的工作是让主核从各种通信膜弥散信息中匹配点阵模式，识别可能有诚意的坐标。
image_mechanism: 抽象广播被赋予有边界的昆虫身体和航迹，主核的模式识别因此像从天空虫群中辨认特定纹样；“坐标”由静态点变成移动生物。
property_alignment: 点阵坐标对应矩阵虫；传播过程对应飞行；星际空间对应天空；并发广播对应虫群；模式特征对应虫体纹样；主核匹配对应视觉辨虫；坐标来源方向对应航向
context_alignment: 歌者能凭细节判断坐标“活着”并感受发送者精神，虫群意象提前把信息对象生命化，契合其职业直觉。
narrative_function: 把陌生通信机制变成母世界日常生态图景，并自然引出主核如何拾取坐标。
transfer_rule: 用飞虫写传播中的数据时，应有大量独立小单元、可辨点阵或纹样、穿行轨迹和负责筛选捕获的观察系统。
failure_boundary: 信息固定存储不传播、只有单一连续波且无可辨单元，或系统不进行模式筛选时，飞虫群会错写数据形态。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 星际空间中由不同文明持续广播、在信息网络里传播并等待识别的大量坐标点阵
vehicle: 母世界天空中成群飞行的矩阵虫，以规则点阵身体穿过视野，轨迹各异而可被捕捉
ground: 坐标点阵对应虫体矩阵；信息传播对应飞行；大量坐标对应虫群；空间背景对应天空；主核拾取对应捕捉识别；不同广播方向对应飞行轨迹
