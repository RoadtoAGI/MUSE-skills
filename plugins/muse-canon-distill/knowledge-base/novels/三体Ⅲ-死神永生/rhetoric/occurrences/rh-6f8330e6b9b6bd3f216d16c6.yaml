chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 处于幼年的人类文明曾经打开家门向外看了一眼，外面无边的暗夜吓住了他，他面对黑暗中的广袤和深邃打了个寒战，紧紧地关上了门
sensory_mapping: 幼童开门；门外暗夜；深空寒战；门扇急闭；屋内求安
context_fact: 人类向宇宙迈步后连续遭遇末日战役、黑暗战役和逃亡舰队极权化，社会最终禁止曲率驱动研究。
image_mechanism: 文明史被缩成一次儿童探门动作，数世纪探索只是“看一眼”；宇宙冷酷由敌人清单合成门外黑夜，政策封闭则成为本能关门。
property_alignment: 人类文明对应孩子；发展阶段对应幼年；太阳系对应房屋；太空边界对应家门；探索飞行对应向外看；黑暗森林对应暗夜；战争创伤对应惊吓寒战；技术禁令对应关门；黑域对应反锁
context_alignment: 标题“对无边暗夜的恐惧”在此落为完整动作，既解释选择，也保留它可能是幼年创伤反应而非永恒真理。
narrative_function: 用单幅寓言总结光速计划死亡的深层心理，将政治决策还原为文明恐惧。
transfer_rule: 把文明写成开门幼童时，应有相对安全内域、首次外探、真实创伤、成熟度不足和随后可识别的封闭政策。
failure_boundary: 文明已有长期稳定星际经验、外部并不危险，或关门源于资源核算而非恐惧时，幼童寓言会贬低理性选择。
