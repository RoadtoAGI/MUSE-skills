tenor: 尚不成熟的人类初入宇宙便经历三体威胁、末日战役与黑暗战役，因恐惧而放弃光速扩张并倾向封闭太阳系
vehicle: 年幼孩子第一次打开安全家门，见门外无边黑夜和未知深处，受惊发抖后立刻关门躲回屋内
