chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 那巨大的鸟群像一个完整的生命体,在黄昏的天空中变换着形状
sensory_mapping: 千万小鸟在黄昏合成一具会呼吸的黑色身体，收缩、伸展，轮廓像一只独立巨兽。
context_fact: 程心由正在扩散的人海联想到鸟群，用旧图像理解数百万人在失重中的整体运动。
image_mechanism: 单一生命体是二级映射：人海先像帷幔，再经鸟群中介获得整体生命感，个体死亡与群体动作形成张力。
property_alignment: 单鸟对应细胞；鸟群边界对应身体轮廓；同步转向对应神经协调；形态变化对应肢体动作；群体趋势对应共同意志。
context_alignment: 眼前人群也像完整生命体移动，却将在二维化中逐人失去生命，整体活态只维持片刻。
narrative_function: 给帷幔静物意象补上生命运动，并将人海的壮观与每个个体的无助并置。
transfer_rule: 群体比作单体生命时，应展示个体—细胞对应、同步机制、整体边界和连续变形。
failure_boundary: 鸟群没有统一神经或单一意识，形变来自局部规则；该句是程心记忆中的类比中介。
