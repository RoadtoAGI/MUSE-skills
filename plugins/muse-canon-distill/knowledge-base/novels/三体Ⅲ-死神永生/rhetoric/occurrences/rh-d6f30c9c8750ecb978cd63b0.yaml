chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 亨特肩上的责任陡然增加了十倍
sensory_mapping: 盲区切断外援，两枚水滴替他承担的重量瞬间落回肩背，老亨特像被十倍重担压低。
context_fact: 智子无法再了解舰内情况，水滴不可能及时反应，而天线仍有两个月寿命。
image_mechanism: 责任重量把系统冗余变化转成身体承载变化，保险消失与肩负加重形成直接因果。
property_alignment: 水滴退出对应他人卸手；独自判断对应单肩承重；文明级后果对应巨大重量；压力骤现对应重物突然落下。
context_alignment: 亨特已七十八岁且半生清醒，老年身体让这份抽象责任的重量更可感。
narrative_function: 重启潜伏使命的紧迫性，并解释他为何对异常现象采取极端敏感阈值。
transfer_rule: 责任如负重时，要交代原分担者、转移节点、承载身体和失败后果。
failure_boundary: 十倍不是测量值，且亨特仍有制度和技术限制；若责任未集中，重量倍增会失实。
