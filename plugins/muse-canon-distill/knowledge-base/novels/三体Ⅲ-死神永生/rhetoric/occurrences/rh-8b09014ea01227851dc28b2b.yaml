property_alignment: 被历史否定对应深埋；极端思想腐败对应垃圾；危机复兴对应上浮；成为主流对应覆盖表面。
context_alignment: 社会刚被写成湖面结冰，垃圾随即浮到这层表面，同一垂直构图展示专制下的意识形态污染。
narrative_function: 对制度倒退作价值判断，并把复古政治写成死物返场而非新方案。
transfer_rule: 旧观念复辟写成埋藏废物上浮时，应对应历史淘汰、封存条件、复出机制和新位置。
failure_boundary: 思想传播依靠活人组织而非物质浮力；垃圾标签是叙述价值判断，不能替代政治分析。
