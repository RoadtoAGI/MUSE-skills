chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 就像波光粼粼的水面被冻结一样，所有的色块都有了联系
sensory_mapping: 色块的波纹在同一刹那结冰，漂移亮点锁进晶面，国王轮廓从冻结纹路中浮出。
context_fact: 王子先只见随机色雨和混乱花园，随后几乎瞬间看懂每一色块的意义。
image_mechanism: 冻结提供全局同步的相变模型，解释无序为何无需逐笔修整便能突然成为精确图像。
property_alignment: 浮动色块对应水波；闪动色泽对应粼光；瞬时定形对应结冰；结构显现对应冰面连成一体。
context_alignment: 前文多次出现凝固意象，此处把它落实为可见过程，并预演真人被固定进画像。
narrative_function: 完成作画段的视觉奇观与节奏骤停，让魔法成像既神秘又具有物态逻辑。
transfer_rule: 无序骤然成形比作冻结时，应对应先前流动、同步转折、局部锁定和整体可读。
failure_boundary: 颜料未降温成冰，冻结通常固定既有波形而不自动生成肖像；喻体只说明突变方式。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 散乱流动的色彩在一瞬间固定关系、显出完整形状的成像转折
vehicle: 反光波纹持续变化的水面突然结冰，所有起伏在同一平面定住并连成整体
ground: 此前不断流动；转变突然；局部关系同时固定；表面由难辨转为可读；运动转成结构
