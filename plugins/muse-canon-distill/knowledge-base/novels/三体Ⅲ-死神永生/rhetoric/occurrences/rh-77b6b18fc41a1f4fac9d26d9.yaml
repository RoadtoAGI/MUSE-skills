figure_type: metaphor
quote: 拜占庭是古罗马拖在身后的长达千年的车辙
sensory_mapping: 古罗马成为驶离视野的车，拜占庭被压成地面沟痕，千年时间沿车后方拉成长线。
context_fact: 君士坦丁堡陷落被视为罗马帝国政治连续性的最终结束。
image_mechanism: 车已离去而辙仍在，解决拜占庭既不是古罗马本体、又承接其制度方向的历史关系；陷落则让长痕终于中断。
property_alignment: 古罗马历史主体对应行驶车辆；拜占庭延续对应车辆留下的辙；制度继承对应辙沿原方向延伸；最终陷落对应痕迹消止。
context_alignment: 车辙承认拜占庭有自身辉煌却仍处于罗马之后，符合段落对帝国连续与终结的双重判断。
narrative_function: 以单幅时间空间图概括千年继承关系，为后面的蒸发意象锁定消失对象。
transfer_rule: 写历史后继体时，可区分移动主体与遗留路径；只有后继制度明显受前体方向塑形、又缺少同一主体性时，辙才准确。
failure_boundary: 若拜占庭被论证为古罗马同一主体直接续存，车与辙的主次会削弱连续性；若其制度完全另起，旧车路径也不适用。
