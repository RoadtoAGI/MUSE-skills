chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 一阵尖厉的怪声，仿佛是穿梭机被一把利刃从头到尾划开
sensory_mapping: 怪声沿舱体贯穿而过，像看不见的刀尖从船头一路剖到船尾，下一刻所有系统熄灭。
context_fact: 死线已扩散成低光速黑域，穿梭机跨越边界时经历时间真空和控制系统死亡。
image_mechanism: 利刃用声学线性运动赋形无形边界，仿佛低光速区以一次纵向切割把飞船从正常时空分离。
property_alignment: 边界穿越对应刀行；尖声对应切割摩擦；船体全长对应从头到尾；系统断裂对应被划开；剧震对应受刀冲击。
context_alignment: 二维打击曾像巨碾压玻璃城，低光速转换则像刀剖飞船；规律武器以不同工具感进入身体经验。
narrative_function: 在理论解释前以听觉宣布灾变，制造船体是否破裂与乘员是否存活的不确定性。
transfer_rule: 全局状态切换比作利刃划体时，应由声音方向、作用范围、突发边界和系统后果支持。
failure_boundary: 船壳未被物理切开，气密性也随后可恢复；刀割只描述声响和界面穿越感。
