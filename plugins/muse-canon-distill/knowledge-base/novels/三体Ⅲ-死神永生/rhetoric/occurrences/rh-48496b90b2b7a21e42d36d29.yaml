tenor: 外观不可见、能吞噬物质和光并制造极端引力，却仍不能改变真空光速的黑洞
vehicle: 潜伏在世界中的邪恶魔鬼，拥有令人恐惧的超常力量，能扭曲来者道路却也受更高规则限制
ground: 黑洞对应魔鬼；事件视界吞噬对应吞食生命；不可见性对应潜伏；强引力对应魔力；扭曲光路对应施法；不能改光速对应能力边界；宇宙对应魔鬼活动世界
