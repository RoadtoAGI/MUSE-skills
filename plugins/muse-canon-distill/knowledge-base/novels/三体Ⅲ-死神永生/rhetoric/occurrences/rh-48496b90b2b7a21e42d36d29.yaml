chapter: 【掩体纪元11年，光速二号】
figure_type: metaphor
quote: 这些宇宙中的魔鬼也只能用自己的引力场改变光线的路径和频率
sensory_mapping: 黑暗魔鬼；引力施法；光路扭曲；无形吞噬；力量受限
context_fact: 黑洞项目需要超高密度引力场，但理论与观测都显示黑洞只能改变光的路径和频率，不能改变真空光速。
image_mechanism: 没有表面的天体被赋予恶意主体，弯曲光线变成魔鬼伸手施法；“也只能”随即给它划出界限，使恐怖力量在更坚硬的光速法则前失效。
property_alignment: 黑洞对应魔鬼；不可直接看见对应隐形潜伏；吞噬物质对应攫取；强引力对应超自然力量；光线偏折对应施法扭路；光速恒定对应魔法禁区；多个黑洞对应宇宙魔鬼群
context_alignment: 曹彬正在讲高Way对宇宙规律又怕又恨，魔鬼称谓让黑洞成为可诱惑他的反规则力量，同时不牺牲科学结论的边界。
narrative_function: 为黑洞添加危险人格，并用“魔鬼也不能”反衬真空光速的绝对强硬。
transfer_rule: 把自然对象写成魔鬼时，应给出具体破坏能力、隐蔽或诱惑方式、受害对象，以及连它也无法越过的规则边界。
failure_boundary: 对象温和可控、没有吞噬或扭曲后果，或被写成全能而语境又明确存在能力上限时，魔鬼意象会与事实冲突。
