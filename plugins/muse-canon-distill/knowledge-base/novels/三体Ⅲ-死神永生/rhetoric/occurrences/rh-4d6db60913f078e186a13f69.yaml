figure_type: simile
quote: 到父亲这一代更是一贫如洗
sensory_mapping: 抽象匮乏获得洗刷后的空白表面，财富像污物或附着物一样被冲尽。
context_fact: 狄奥伦娜家族长期食不果腹，父亲甚至靠女儿卖淫收入生存。
image_mechanism: 洗这一动作把贫困写成持续剥离后的结果，干净在此反转为没有任何生存资源可剩。
property_alignment: 财物耗尽对应附着物被洗尽；没有余粮对应表面不留残渣；代际贫困加深对应反复冲刷。
context_alignment: 后文父亲向女儿收钱展示贫困已穿透伦理底线，洗尽的彻底性与此相称。
narrative_function: 以成语快速标定家境谷底，为人物卖淫和家庭剥削提供物质因果。
transfer_rule: 惯用喻体仍需由情节落实其程度；使用彻底清除类表达时，后文应出现资源近零所迫出的具体选择。
failure_boundary: 家庭若仍有稳定财产或只是一时现金紧张，洗尽会夸大程度；该表达也不适合描述单项资源短缺。
