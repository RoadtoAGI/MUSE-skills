chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 两次都奇迹般地脱险
sensory_mapping: 毁灭边缘像悬崖，人类两次将要坠落时，都有不可预料的手在最后一刻把整体托回。
context_fact: 罗辑建立威慑、两舰借四维碎块启动广播都依赖少数决策者和罕见条件，宗教由此复兴。
image_mechanism: 奇迹把复杂低概率链压缩为超自然干预感，事件难以事先规划的部分被信徒解释成神意。
property_alignment: 文明绝境对应信众危难；罕见机遇对应神迹介入；突然脱险对应拯救降临；因果难解对应超常性。
context_alignment: 叙述明确这是流行宗教思潮的解释，神迹感真实存在于公众认知，却不替其证明具体神明。
narrative_function: 概括宗教复兴的经验基础，使后续太空教堂和智子崇拜不显得无源。
transfer_rule: 事件如奇迹时，应列出失败边缘、低概率条件、突然转折及谁把因果缺口解释为神意。
failure_boundary: 两次脱险都有可追踪的人类行动和物理机制，罕见不等于超自然；喻体属于信徒归因。
quality_assessment: functional
confidence: 0.97
review_status: reviewed
tenor: 人类在威慑建立和深空广播两次危机中凭极少数人及罕见机遇避免即时毁灭
vehicle: 超越常规因果和人力能力的神迹在绝境中突然介入，拯救即将灭亡的信众
ground: 成功概率极低；转折突然；关键条件平时难以出现；结果具有文明级救援效果
