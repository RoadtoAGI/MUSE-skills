chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 把城市的灯海远远抛在后面，为了避免车灯的干扰，他又把车开到远离公路的田野间。车灯熄灭后，两人走下车，深秋的夜空中，星海很清澈
sensory_mapping: 汽车驶离黄色城市海岸，车灯一灭，头顶黑色海面浮出星光；云天明在两片光海之间换岸。
context_fact: 市内光污染使DX3906不可见，何博士驾车远郊并关闭车灯，才带云天明寻找赠出的星。
image_mechanism: 同一个海字连接人工与宇宙两种光群，抛在后面和抬头可见形成方向翻转，使离城成为进入星空的动作。
property_alignment: 城市灯点密集对应海面粼光；群星繁多对应星海；光污染遮蔽对应前海压过后海；远郊清暗对应星海澄清。
context_alignment: 赠星需要从尘世灯火退出才能看见，双海转换也把世俗生活与超越生命的礼物并置。
narrative_function: 为观星场景完成视觉换幕，并把云天明最后的现实旅程推向宇宙尺度。
transfer_rule: 用海写光群时，应让点的密度、覆盖范围和观看位置共同成立；连续使用同一喻体可制造空间过渡。
failure_boundary: 灯光或星点稀疏、视野狭窄时难形成海面；若城市灯仍强烈可见，清澈星海也不会出现。
