tenor: 云天明离开城市人工灯群、进入远郊后面对的密集自然星空及两种光域的转换
vehicle: 前后相接的两片海：一片由城市灯火组成，另一片由清澈群星铺成
ground: 无数光点聚集成广阔连续表面；离开一片光域后，另一片更深远的光域显露
