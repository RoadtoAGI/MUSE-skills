review_status: reviewed
tenor: 没有推进能力的太平洋一号若强行加速，漂浮建筑撞破球壁后会发生结构破裂和大气外泄
vehicle: 装满松散物品的袋子底部破开，内容物失去包裹并从缺口连续漏出
