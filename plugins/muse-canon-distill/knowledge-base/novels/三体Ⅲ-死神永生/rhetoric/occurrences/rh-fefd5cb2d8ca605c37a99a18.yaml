chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 那时城市就会像一个漏了底的袋子
sensory_mapping: 薄袋破底；空气喷漏；物件倾出；外壳瘪空；容器失守
context_fact: 太平洋一号内部一切自由漂浮，城市没有推进器，球壁曾被武器击穿造成严重大气泄漏。
image_mechanism: 本来包住整座社会的球壳忽然退化成一层软袋皮；内部建筑在加速度下成为砸向袋底的杂物，先撕开容器再随空气一起外漏。
property_alignment: 太空城外壳对应袋体；球壁破裂对应袋底破洞；空气对应可漏内容；悬浮建筑对应散装重物；统一加速对应内容物压底；真空对应袋外空处
context_alignment: 零重力城市没有把建筑固定在壳壁，袋装散物比通常的建筑坍塌更准确地说明推进为何会导致自毁。
narrative_function: 用日常容器失效解释复杂的加速、撞壁与泄压链条，明确城市无法避险的结构宿命。
transfer_rule: 以漏袋解释封闭系统失效时，要让外壳承担容器功能、内部物可自由移动，并存在明确破口和向外流失的压力差。
failure_boundary: 内部构件牢固锚定、外壳有分舱止漏，或破损不会引起整体内容逸散时，漏底袋会夸大连锁灾难。
quality_assessment: exemplary
