review_status: reviewed
tenor: 茶道谈话只确认安全声明可能存在，却不给方法，仍让绝望公众获得极少希望
vehicle: 大量饥饿乞讨者同时伸手，施予者在每只空手中放下一点勉强可得的食物或钱物
ground: 需求巨大而迫切；获得者处于弱势；供给极少；少量给予仍足以维持期待；分配面向众多人
