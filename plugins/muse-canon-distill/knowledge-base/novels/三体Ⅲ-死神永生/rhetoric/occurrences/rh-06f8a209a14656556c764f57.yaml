chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 给在等待中乞讨希望的人们伸出的无数双手里放上了一点儿东西
sensory_mapping: 全人类像跪在末日路边伸出手掌，智子只把有这个字掰成微小碎片，落进亿万只空手。
context_fact: 社会茫然等待毁灭，罗辑问出安全声明，智子只回答有并拒绝说明做法。
image_mechanism: 乞讨把公众从寻求知识者写成依赖施舍者，一点东西准确量化一个肯定答案与完整方法之间的悬殊。
property_alignment: 公众绝望对应乞饿；等待提问对应伸手；智子一字回答对应少量施舍；继续研究对应靠微物维持希望。
context_alignment: 智子在茶席上实际递出茶碗，抽象希望也像被放入手中，礼仪给予与信息克制形成同构。
narrative_function: 总结茶道谈话的社会效应，并把下一轮全民方案狂潮解释为对一点希望的放大消费。
transfer_rule: 希望如施舍物时，应对应匮乏状态、伸手动作、给予量和少量资源如何继续驱动行为。
failure_boundary: 公众并非完全被动，也会自主研究；智子的回答可能带战略限制，不能只解释成有意吝啬。
