tenor: 夜色中沿海岸延伸、翻卷前行的一道白色海浪
vehicle: 体形很长、通体白亮并贴地蜿蜒移动的大蛇
ground: 形态细长连续；颜色发白；边缘弯曲；沿地表移动；初见者感到危险
