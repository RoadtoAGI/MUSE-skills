chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 好像有一条白色的大蛇
sensory_mapping: 白浪在黑海边弯曲爬行，浪头起伏像蛇身，公主只看见一条发亮长脊。
context_fact: 公主只在画中看过蓝海，夜间第一次接近真实海岸，把浪误认为生物。
image_mechanism: 蛇把浪线的横向运动和危险感生命化，误认也体现她缺乏尺度与海洋经验。
property_alignment: 白浪对应白蛇；浪线延展对应长身；波峰蜿蜒对应蛇行；海岸推进对应爬动。
context_alignment: 此前冰沙心藏毒蛇，这里自然白蛇只是一道浪，童话让相似形态承担不同危险级别。
narrative_function: 用误认完成海浪视觉揭晓，并保持公主童稚观察的连续性。
transfer_rule: 移动自然形态比作动物时，应匹配轮廓、颜色、运动方向和观察者为何会误认。
failure_boundary: 海浪没有蛇头、肌肉或意图，接近后比较即被卫队长纠正。
quality_assessment: effective
