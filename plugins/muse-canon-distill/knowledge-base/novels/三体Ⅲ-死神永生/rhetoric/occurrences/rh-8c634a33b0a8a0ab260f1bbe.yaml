tenor: 二维太阳系展开成壮丽平面图景时，程心平静等待自己也被纳入其中的死亡过程
vehicle: 兼具诗歌意境和绘画构图、色彩优美而供人审美的一件艺术作品
ground: 画面壮丽；色彩与结构丰富；过程可被观看；情绪带抒情性；对象最终平面化；美感掩着真实痛苦
