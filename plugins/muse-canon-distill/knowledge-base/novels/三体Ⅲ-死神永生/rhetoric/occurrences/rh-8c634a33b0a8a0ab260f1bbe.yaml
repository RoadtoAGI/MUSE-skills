chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 在这如诗如画的毁灭中，成为太阳系巨画的一部分
sensory_mapping: 行星、太阳和雪花已铺成巨画，程心仿佛只需静候自己也化成画中一笔，完成这幅末日作品。
context_fact: 在冥王星时她卸下全部责任，只等待二维化；现在得知光速飞船本可提供另一条路。
image_mechanism: 如诗如画将毁灭审美化，解释末日为何曾给她轻松；随后责任重新压回，使这份平静显得危险。
property_alignment: 二维太阳系对应画；壮丽景象对应诗意；人体投影对应画中一笔；静候观看对应审美距离；死亡对应作品完成。
context_alignment: 全段反复出现巨画、图纸和舞台艺术，此句显示人物也曾用同一艺术框架麻醉自己的行动责任。
narrative_function: 回看程心片刻轻松的心理机制，为她在罗辑目光下重新承担内疚做转折。
transfer_rule: 灾难写成诗画时，应同时呈现可审美形式、观看距离、被遮蔽代价和人物为何需要这种审美化。
failure_boundary: 毁灭不是艺术创作，受害者也非自愿画材；诗画感来自远距视觉和程心当时的责任卸除。
quality_assessment: effective
