figure_type: analogy
quote: 现在每座城市都有一个太空发射港，主要作为太空穿梭机的起飞场，就像古代的机场一样
sensory_mapping: 城市航站；成排飞行器；起飞场；旅客汇集；交通节点
context_fact: 打击传闻引发市民涌向发射港，试图搭乘穿梭机逃到太空城。
image_mechanism: 陌生太空基础设施被套入机场平面图，跑道改成立式发射位，飞机换成穿梭机，城市到城市的航线延伸到地球轨道。
property_alignment: 发射港对应机场；太空穿梭机对应客机；发射位对应跑道；轨道航程对应航空航线；候乘者对应旅客；调度系统对应空管；城市配置对应机场覆盖
context_alignment: 叙述面向仍熟悉机场的读者，以交通系统类比快速说明发射港为何会在警报中成为逃难中心。
narrative_function: 交代未来基础设施的日常定位，并让随后的抢登机秩序易于理解。
transfer_rule: 用机场解释新型交通节点时，应对应载具、起降空间、乘客集散、调度规则、航线终点和城市网络。
failure_boundary: 设施只服务无人货运或武器发射、没有乘客和常态航班时，机场模型会错写社会功能。
