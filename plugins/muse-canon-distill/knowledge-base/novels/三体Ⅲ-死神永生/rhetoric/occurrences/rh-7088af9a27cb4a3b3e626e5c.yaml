figure_type: metaphor
quote: 她感到自己怀抱着的婴儿面对一群恶狼，只想尽自己的力量保护怀中的孩子
sensory_mapping: 怀中婴儿；狼群环逼；手臂护紧；利齿将扑；孤身守护
context_fact: 程心面对数十名决意战斗的武装人员，他们的反物质弹可摧毁太空城；她回忆自己曾在澳大利亚保护婴儿的经历。
image_mechanism: 一场文明技术决策被收缩成最本能的护幼姿势，未来生命失去抽象数量而成为怀中重量；战士的理想与纪律则退去，只留下群猎利齿。
property_alignment: 平民与未来世代对应婴儿；程心对应保护者；自卫队对应狼群；弹药对应狼牙；集体压迫对应围猎；战争爆发对应扑咬；叫停抵抗对应抱紧并挡住；弱势程度对应婴儿无自卫力
context_alignment: 程心的道德行动一贯由具体弱者触发，旧日抱婴记忆使她此刻的选择来自角色经验，而非临时政策论证。
narrative_function: 揭示程心再次选择人性保护的心理机制，并把她与维德的价值冲突推向决断。
transfer_rule: 用护婴对狼群写伦理抉择时，应有明确无力受保护者、迫近且具身体伤害能力的群体、保护者的责任记忆与力量不对称。
failure_boundary: 受保护群体拥有充分选择和武力、威胁方并无伤害意图，或保护者主要维护自身权力时，婴儿与恶狼会剥夺他者主体性。
