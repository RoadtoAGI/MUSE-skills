chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 见到管子上的破口时伊万愣住了，像见了鬼一般
sensory_mapping: 普通维护现场骤然降成撞鬼时刻，圆孔成为不可能存在的幽灵痕迹，伊万的身体停在原地。
context_fact: 碳纤维管坚固且不承压，破裂概率极小，后续显微图才确认微陨石碎片。
image_mechanism: 鬼不对应破口外形，而对应因果空缺；愣住的停顿把工程知识遭到冲击的幅度直接显出来。
property_alignment: 破口无合理原因对应超自然违例；突见异常对应撞见鬼魅；动作冻结对应惊恐僵直。
context_alignment: 小事故将引出空间防护失效和更大异常，撞鬼反应提前标出普通解释体系已经松动。
narrative_function: 在技术解释出现前放大第一处物理异常的惊悚感，开启飞船诡异事件链。
transfer_rule: 见鬼式惊骇适合知识充分者遇到因果断裂，需先交代常规机制为何排除，反应才不流于套语。
failure_boundary: 若异常有显而易见的机械原因、人物只是厌恶或惊讶而未失去因果把握，见鬼会夸张。
