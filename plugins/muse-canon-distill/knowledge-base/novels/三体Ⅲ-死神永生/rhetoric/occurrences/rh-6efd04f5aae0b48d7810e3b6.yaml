tenor: 工程师看见坚固、无压管道上出现物理上难以解释的贯穿破口时的惊骇反应
vehicle: 突然撞见违背日常世界规则、令人怀疑超自然存在的鬼魅
ground: 眼前事实超出因果预期；主体瞬间僵住并产生强烈恐惧与不信
