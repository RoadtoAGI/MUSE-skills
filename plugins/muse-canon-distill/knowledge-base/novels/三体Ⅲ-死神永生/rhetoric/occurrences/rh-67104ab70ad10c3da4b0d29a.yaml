quote: 这样一个柔软的女性世界，威慑？！
sensory_mapping: 整座光辉城市和其中轻柔的人群被压成软质世界，黑暗森林威慑则像必须由硬手握住的利器。
context_fact: 程心刚见到高度女性化的男女和温柔艺术，随即想到这种社会仍靠执剑人毁灭能力维持和平。
image_mechanism: 柔软将审美气质转为材料属性，紧跟的威慑问号利用软材与硬暴力不相容制造认知冲突。
property_alignment: 温和举止对应柔软触感；攻击性降低对应缺少硬边；和平舒适对应材料顺滑；威慑决断对应需要抗压硬度。
context_alignment: 六位男性候选人稍后被写成冰冷岩墙，软世界与硬执剑者形成这一时代选择程心的核心对立。
narrative_function: 把未来社会的性别化观感压缩成威慑疑问，为程心竞选优势与实际威慑不足同时埋伏。
transfer_rule: 群体气质材质化时，应明确触感来自哪些行为，并将硬软只用于特定能力维度，避免泛化人格价值。
failure_boundary: 温柔外表不能自动证明决策软弱，女性化也不等于无威慑力；若社会实际极具攻击性，柔软判断会被推翻。
