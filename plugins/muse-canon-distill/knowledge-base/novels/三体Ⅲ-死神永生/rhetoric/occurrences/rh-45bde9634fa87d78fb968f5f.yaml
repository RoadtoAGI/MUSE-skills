figure_type: metaphor
quote: 地球世界一天天陷入大同盛世的梦幻中不能自拔
sensory_mapping: 地球躺进金色盛世梦境，繁荣画面层层包住感官，三体舰队在梦外加速却无人醒来。
context_fact: 地球选择低威慑度执剑人，三体在交接时发动整体袭击并已派出光速舰队。
image_mechanism: 梦幻把误判和不自拔连成睡眠机制，繁荣不是虚假本身，而是被当成全部现实后形成麻醉。
property_alignment: 和平舒适对应美梦；忽略敌情对应闭眼；长期威慑对应沉睡；交接袭击对应梦外危险逼近。
context_alignment: 星舰人群保留末日战役记忆，与地球半世纪安逸形成醒者与梦者的视角冲突。
narrative_function: 解释地球为何作出执剑人误选，并为深空启动广播提供道德自证。
transfer_rule: 社会沉梦要说明梦中诱因、被屏蔽现实、无法醒来的机制和外部唤醒事件。
failure_boundary: 威慑纪元的和平与文化发展是真实成果，不能全部贬为幻觉；喻体聚焦战略麻痹。
