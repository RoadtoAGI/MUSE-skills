chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这个在篝火旁大喊的孩子立刻浇灭了火，在黑暗中瑟瑟发抖，连一颗火星都害怕了
sensory_mapping: 地球成为黑林中的孩子，无线广播聚成篝火，通信基站逐一熄灭，剩余低功率信号化为令他颤抖的火星。
context_fact: 黑暗森林理论公布后，全球短暂关闭移动通信，严格限制无线发射，尽管普通泄漏几乎传不出两光年。
image_mechanism: 孩子延续文明幼稚性，篝火把广播功率和坐标暴露合一，火星则精确表现管制从必要警惕滑向微量恐惧。
property_alignment: 人类文明对应孩子；宇宙广播对应林中喊叫；高功率发射对应篝火；通信关闭对应浇火；低功率泄漏对应余烬火星。
context_alignment: 黑暗森林本就是猎杀环境模型，篝火场景位于同一世界观内部，使技术管制获得直观生存逻辑。
narrative_function: 用一个连贯动作概括文明心理转向，并解释地球突然电磁沉默为何令远航战舰误判沦陷。
transfer_rule: 信号如火时，应对齐可探测亮度、暴露距离和关闭动作；余烬强度可用于区分理性防范与过度反应。
failure_boundary: 若信号无法离开本地、没有潜在监听者，篝火暴露只反映主观恐惧；人类也并非单一幼童意志。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 得知黑暗森林状态后，人类文明从高功率向宇宙发信转为压制一切电磁泄漏的恐惧反应
vehicle: 曾在夜林篝火旁高喊位置的孩子突然察觉猎手，扑灭火焰并惧怕余烬暴露自己
ground: 主体此前幼稚地公开自身位置；理解危险后急剧收缩信号，即使微小暴露也引发过度恐惧
