review_status: reviewed
tenor: 杨冬对日常经验、微观物理与宏观宇宙层级关系的信念及其反转
vehicle: 完美深海表面漂浮的丑陋泡沫，随后反转为包住混乱内部的美丽表皮
ground: 可见表层与不可见深层分层；表层形态依赖深层，却可能与深层的秩序和美丑相反
