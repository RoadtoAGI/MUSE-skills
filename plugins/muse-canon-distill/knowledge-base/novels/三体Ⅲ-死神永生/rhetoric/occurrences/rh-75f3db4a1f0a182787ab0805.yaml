chapter: 【危机纪元元年，生命选项】
figure_type: metaphor
quote: 日常世界只是浮在这完美海洋上的泡沫。现在看来，日常世界反而成了美丽的外表
sensory_mapping: 尺度层级被竖直排成海面、泡沫和深水，随后整幅图翻面：泡沫变成外壳，深处显露混浊。
context_fact: 智子锁死物理实验后，杨冬失去对微观和宏观规律和谐完美的基本信念。
image_mechanism: 同一表里容器先让深层赋予表层意义，再通过美丑换位完成认知坍塌；框架变化本身就是她绝望的动态。
property_alignment: 日常经验对应海面泡沫或外表；微观宏观规律对应包围并支撑表层的海洋与内部；信念反转对应表层和深层交换美丑。
context_alignment: 她的职业专门越过日常表面探查尺度尽头，因此海洋深层模型精准落在物理学家认知结构上。
narrative_function: 把基础物理危机转成可感的世界翻面，直接说明失去物理学为何等于失去生命意义。
transfer_rule: 表达知识层级反转时，可保持同一空间容器而交换层级价值；前后两种判断都须能沿表面、内部、包容关系逐项重读。
failure_boundary: 若新发现只增加局部噪声而未推翻深层秩序，整体翻面会过度；若表层不依赖深层，也不能用海洋承托泡沫。
quality_assessment: exemplary
