chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 人类社会的孩子脸又变了
sensory_mapping: 整个人类社会缩成一张孩子脸，刚因获救露笑，转眼因求智子不得便皱眉，把救船画成魔鬼。
context_fact: 公众先崇拜两舰，后因祈求三体救赎而谴责它们广播坐标，甚至请求追杀。
image_mechanism: 孩子脸把集体舆论拟成可见表情，变脸动作突出价值判断随依赖对象改变而非依据新事实。
property_alignment: 公众对应孩子；英雄崇拜对应笑脸；宗教转向对应情绪变化；谴责两舰对应怒脸；反复依赖对应幼稚。
context_alignment: 威慑曾被称让成人变孩子的摇篮，此处孩子脸延续社会退化判断，并用一次变脸提供新证据。
narrative_function: 讽刺公共记忆的机会主义，解释同一飞船如何在六年内被神化又妖魔化。
transfer_rule: 群体如孩子变脸时，应列出触发事件、前后表情、利益依赖和评价标准为何不稳定。
failure_boundary: 公众内部意见多元，并非单一儿童主体；孩子形象带有叙述者贬义，不能替代社会成因分析。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 人类公众对蓝色空间号的评价从拯救者迅速翻转为罪恶魔船的情绪化态度
vehicle: 孩子的脸随即时欲望和恐惧迅速变换表情，喜爱、怨恨都直接外露且缺少稳定判断
ground: 态度转变快；情绪支配评价；记忆和原则不稳定；反应带有依赖权威的幼稚性
