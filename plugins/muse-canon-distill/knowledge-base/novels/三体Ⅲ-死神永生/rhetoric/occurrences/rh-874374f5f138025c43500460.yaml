chapter: 【威慑纪元62年，奥尔特星云外，“万有引力”号】
figure_type: analogy
quote: “万有引力”号能看到“蓝色空间”号手中的牌，反之则不行
sensory_mapping: 燃料舱变成手牌，两舰每次加速是一次出牌，万有引力号越过桌面看清对手余牌，自己牌面仍扣住。
context_fact: 智子情报和旧航行记录使追击舰精确掌握逃亡舰燃料，蓝色空间号却不知道追击舰储量。
image_mechanism: 手牌将物理库存与策略隐私合一，看到牌直接说明为何同样受燃料限制的一方仍拥有决策优势。
property_alignment: 燃料存量对应手牌数量；加速选择对应出牌；储备底线对应最后底牌；智子情报对应偷看牌面；反向未知对应扣牌。
context_alignment: 文本已把追逐称为加速博弈，牌局模型补上参与者、资源和信息差，使半世纪追击具有清楚规则。
narrative_function: 快速解释万有引力号长期保持优势的原因，并让蓝色空间号停加速成为可预测的亮牌时刻。
transfer_rule: 战略如牌局时，应对应有限资源、轮次行动、隐藏信息和胜负目标；看牌优势需有真实情报渠道。
failure_boundary: 资源可无限补充、决策连续无轮次或双方信息对称时，手牌模型不适用；知情也不保证必胜。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 追击双方关于彼此燃料储量、速度上限和加速选择的信息不对称博弈
vehicle: 一场牌局中，一名玩家能看见对手手牌，而对手看不见他的牌，只能猜测下注余量
ground: 双方都按有限隐藏资源连续决策；单向信息透明让知情者能预测对方底线并保留自身策略空间
