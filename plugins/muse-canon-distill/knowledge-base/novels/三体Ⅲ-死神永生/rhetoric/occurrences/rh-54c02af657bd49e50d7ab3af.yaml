chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: simile
quote: 像平衡鹏那无边无际的黑翅膀，向存在的一切压下来，压下来
sensory_mapping: 无边黑翼；天空压低；万物入影；反复下沉；宇宙重压
context_fact: 歌者以低熵体维持和增加有序度为最高意义，并把普遍熵增视为一切生命必须抵抗的背景。
image_mechanism: 统计物理趋势取得一个遮天身体，熵不再只是数值上升，而是黑翼不断缩减万物头顶空间；“压下来”重复制造不可停的逼近。
property_alignment: 宇宙熵增对应平衡鹏；影响全域对应翼展无边；有序度降低对应光被遮；不可逆进程对应持续下压；热寂终局对应完全覆盖；低熵体对应翼下挣扎生命；平衡态对应鹏的名字
context_alignment: 歌者文明把维持低熵视为生存意义，黑翼成为其文化中对宇宙终极平衡的恐惧图腾，解释清理逻辑背后的世界观。
narrative_function: 把熵增理论转为压顶威胁，为低熵生命的自我正当化提供宇宙尺度背景。
transfer_rule: 用遮天巨翼写普遍趋势时，应有全域覆盖、持续逼近、光或秩序被削减及无法绕开的终点，并让文化意象与观念相连。
failure_boundary: 变化只影响局部、可逆且带来更多秩序，或场景强调轻盈上升时，黑翼下压会误写方向和范围。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 宇宙整体熵持续升高、有序度下降，并以不可逆趋势压迫所有存在和文明
vehicle: 母世界神话中的平衡鹏展开无边黑翼，从宇宙上方反复下压，阴影覆盖一切且无法逃离
ground: 熵增趋势对应黑翼下压；影响范围对应翅膀无边；有序消失对应黑暗覆盖；不可逆对应持续压下；所有存在对应翼下万物；宇宙平衡终点对应鹏名“平衡”
