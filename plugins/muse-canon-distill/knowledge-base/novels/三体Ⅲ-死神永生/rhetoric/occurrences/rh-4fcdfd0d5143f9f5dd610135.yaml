chapter: 【威慑纪元61年，执剑人】
figure_type: simile
quote: 大低谷像一只筛子，滤掉了太多的东西
sensory_mapping: 历史人口成为倒入巨筛的颗粒，灾难震动筛面，十四条家族线从孔中落入无名处。
context_fact: 十五名购星者中除冬眠到未来的程心外，其余十四人及继承人都湮没。
image_mechanism: 筛选不赋予淘汰者道德意义，只显示灾难对人口和法律连续性的粗暴过滤；程心成为偶然留存颗粒。
property_alignment: 历史群体对应混合颗粒；大低谷死亡断代对应筛孔淘汰；程心冬眠幸存对应筛上残留。
context_alignment: 法律所有权依赖继承链，筛子正好解释为何灾难后的稀有幸存转化为唯一合法权利。
narrative_function: 用机械过滤概括跨世纪人口损失，并交代程心恒星产权的历史偶然。
transfer_rule: 灾难如筛时，应指出筛选对象、通过条件和残留结果；筛子描述存亡分布，不暗示灾难有目的选择。
failure_boundary: 若多数人正常延续、淘汰按明确功绩选择或成员可重新返回，随机粗筛模型不适用。
