tenor: 大低谷灾难使群星计划购买者及其合法继承线大量消失
vehicle: 颗粒混合物经过筛孔后，大量成分落走，只留下少数筛上物
ground: 群体经历统一淘汰机制；多数成员消失，少数因条件偶然保留到后世
