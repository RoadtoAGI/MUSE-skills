chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 如果人类在太空中一直是蜗牛的速度，那我们就应该尽早开始爬
sensory_mapping: 人类航天缩成贴地爬行的蜗牛，奥尔特星云成为远处终点，维德把未来任务推到今天起步。
context_fact: 按现有速度探测器需数万年到达，但技术进步又不确定，PIA希望尽早直接接触敌舰。
image_mechanism: 蜗牛承认技术弱势，开始爬却把无力感转成时间策略；喻体不许诺速度突破，只重排出发时点。
property_alignment: 宇航低速对应蜗牛缓行；技术短期不变对应无法换步态；星际距离对应长路；提前发射对应尽早起爬。
context_alignment: 维德的推进哲学正是用时间和资源补偿原理限制，蜗牛图像比空泛勇气更贴合决策变量。
narrative_function: 把看似荒唐的即时启动转成直观时间逻辑，推进会议从否定原理转向寻找方案。
transfer_rule: 以慢动物写技术劣势时，应让可调变量落在起步、持续时间或路径，而不能借喻体假装速度已提升。
failure_boundary: 若技术很快会跃迁、任务可等待更优工具，尽早爬未必最优；蜗牛也不能说明资源投入成本。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类现有宇航速度极低，但仍应立即启动跨世纪探测计划的战略判断
vehicle: 移动极慢的蜗牛无法加速，只能依靠尽早起爬来补偿路途漫长
ground: 速度上限低且短期无法突破；到达时间主要取决于是否提前开始持续移动
