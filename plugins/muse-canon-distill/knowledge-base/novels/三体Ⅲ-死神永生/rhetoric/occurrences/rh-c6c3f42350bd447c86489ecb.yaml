chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 船身被沙子埋住一半，露在外面的部分像巨兽的白骨
sensory_mapping: 沙滩像浅坟，船肋和白船板从中拱出，仿佛一头海兽只剩骨架。
context_fact: 饕餮鱼使船无法下海，海边大量船只长期搁浅废弃。
image_mechanism: 骨骸把交通工具失能转成死亡遗迹，半埋状态自然对应埋葬与考古发现。
property_alignment: 船体对应兽躯；船肋对应肋骨；风化白色对应白骨；沙埋对应坟层；废弃对应死亡。
context_alignment: 海声像巨人呼吸，旧船却是巨兽尸骨，活海与死船构成捕食结果。
narrative_function: 在饕餮鱼实物演示前先用残骸证明海上禁航的历史规模。
transfer_rule: 废弃大型器物写成骨骸时，应对齐承重结构、颜色、掩埋比例、失能时间和死亡原因。
failure_boundary: 船没有生物生命，白色也可能来自涂料；巨兽身份不能推断船只大小之外属性。
