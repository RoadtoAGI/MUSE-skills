chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 那东西初看像某种动物的一块骨头，实际是一个金属零件
sensory_mapping: 小零件在星光下露出骨白弧面，像从两百年前战舰尸体中剥落的一截骨。
context_fact: 零件属于末日战役被毁战舰，后来作为古战场遗物在黑市流通。
image_mechanism: 外形相似与历史语义叠合，金属残件因所属舰队全灭而真正获得遗骨意味。
property_alignment: 金属曲面对应骨形；冷光对应漂白；脱离战舰对应脱离躯体；古战场来源对应遗骸。
context_alignment: 脚下天线是孤岛，手中零件则是沉船遗骨，海难式宇宙意象继续深化。
narrative_function: 让抽象舰队覆灭浓缩为可手持遗物，并引出灵魂驱动的下一层想象。
transfer_rule: 机械残件比作骨头时，应同时利用轮廓材质、与主体分离、死亡历史和持有者触感。
failure_boundary: 零件是制造物且仍可能有功能，动物种类也不可从外形确定；骨义主要来自历史联想。
