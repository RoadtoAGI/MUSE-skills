chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 中校摇摇头，眼神恍惚起来，像是在回忆梦境
sensory_mapping: 舰廊事件蒙上一层醒梦后的雾，戴文的目光无法聚焦，摇头像在捞取即将散开的片段。
context_fact: 他声称在万有引力号看见本应位于另一艘船的朴义君，事件违背正常空间位置。
image_mechanism: 梦境回忆不否定画面本身，只削弱它与现实的连接；恍惚目光把这段认知断裂外显。
property_alignment: 不可能相遇对应梦的非现实性；细节仍可叙述对应梦像残留；眼神恍惚对应醒后难以聚焦。
context_alignment: 四维碎片让两舰空间关系发生异常，而人物只能用梦的经验理解，喻体保留事实与怀疑并存。
narrative_function: 把超物理现象先包装为心理症状，延迟真相并引导医生作出错误诊断。
transfer_rule: 以梦境写异常记忆时，要让画面清晰度与现实确信度分开；身体神态应显示检索困难。
failure_boundary: 若人物完全确信、叙述连续且有即时客观证据，梦境回忆会错误削弱其认知；纯粹遗忘也未必具有梦感。
