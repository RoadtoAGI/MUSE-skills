tenor: 戴文讲述在舰廊看见不可能人物时呈现的恍惚回忆状态
vehicle: 醒来后试图重组梦中片段、无法确认其顺序与现实性的神情
ground: 记忆画面存在却边界模糊；叙述者对经历的现实身份缺少确定把握
