chapter: 地球文明
figure_type: analogy
quote: 像人生
sensory_mapping: 洞壁的历史像一条人的生命线，每走过一个岔口，身后都留下没有活成的另一生。
context_fact: 罗辑以亚历山大未遇秦、汉代独尊儒术等例子追问如果当时选择不同，今日会怎样。
image_mechanism: 极短答句把宏观反事实历史缩到每个人熟悉的遗憾结构，程心自己的两次关键选择随之浮现。
property_alignment: 历史断面对应人生阶段；文明选择对应个人选择；另类历史对应未活人生；丢失机遇对应遗憾。
context_alignment: 罗辑随即问程心是否丢失很多，类比从文明史精准折回她交出威慑和放弃曲率飞船的经历。
narrative_function: 由历史讨论触发人物潜台词，以三个字打开程心的道德创伤而不直说。
transfer_rule: 宏观历史比作人生时，应让一个共同机制连接二者，并由后续对白把机制落到具体人物。
failure_boundary: 历史由无数主体共同形成，没有个人式统一意识；人生也不一定把每次未选路径视为损失。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 每个历史断面都存在大量未走成、因选择而永久丢失的发展机遇
vehicle: 个人一生在每个阶段做出选择，同时失去其他可能人生
ground: 时间单向推进；岔路众多；选择排除其他路径；错过不可追回；后来者会反事实追问
