chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 就像把画纸暴露在一场彩色的雨中，五彩的雨滴不断滴到纸面上
sensory_mapping: 画笔每次点触都变成一滴彩雨，红蓝黄点从无形天空落下，在雪白纸面越积越密。
context_fact: 王子起初看不出画面形状，针眼以看似随意的点划完成魔法肖像前半程。
image_mechanism: 雨把离散笔触组织成统一落下过程，随机外观与最终精确成像之间由此形成悬念。
property_alignment: 笔尖点触对应雨滴落下；多色颜料对应彩雨；白纸对应承雨地面；痕迹累积对应雨势持续。
context_alignment: 雪浪纸本身来自奇异世界，彩雨让作画像一种自然天气，弱化画师主动控制的痕迹。
narrative_function: 把静态绘画过程变成可听可动的事件，并延迟国王肖像显形。
transfer_rule: 散点笔触比作雨时，应匹配落点形状、方向节奏、覆盖增长和底面变化。
failure_boundary: 颜料由画师控制且不会自由降落，雨水的混色和流淌未必发生；随机性只是观者错觉。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 针眼先以零散色点色道覆盖画纸、尚未出现可辨形状的作画阶段
vehicle: 白纸无遮蔽地承受一场多色雨，密集彩色水滴随机落下并逐渐铺满表面
ground: 点状痕迹连续增加；颜色多样；落点似乎随机；白底逐步被覆盖；过程有自上而下节奏
