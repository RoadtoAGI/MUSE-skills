tenor: 重工业迁入太空、耕地减少后，地表生态恢复并主要承担居住、自然与休闲功能的地球
vehicle: 经过规划保护、由森林草原覆盖、供人舒适生活和游赏的大型公园
ground: 污染生产功能被移出；绿地成为主要景观，人类活动与自然环境以休闲尺度共存
