chapter: 【威慑纪元61年，执剑人】
figure_type: metaphor
quote: 地球正在变成一个大公园
sensory_mapping: 整个行星的工厂烟尘退到轨道，陆地铺成连续森林草原，飞行车像园内小车越过一片巨大绿地。
context_fact: 威慑和平促使重工业进入轨道，粮食工业化释放耕地，生态接近工业革命前水平。
image_mechanism: 公园把生产空间转为受管理自然空间，既呈现绿色美好，也暗示这种地表依赖太空工业维持。
property_alignment: 工业外迁对应移除园外设施；森林草原恢复对应公园绿地；人口减少对应低密使用；舒适游览对应休闲功能。
context_alignment: 程心刚离开巨树城市便被绿色迎面包围，行星尺度公园准确概括她看到的文明成果与不真实感。
narrative_function: 一笔交代威慑纪元生态成就，强化程心对新世界的爱，也提高随后威慑崩溃的损失感。
transfer_rule: 区域如公园时，应说明生产功能、绿地比例、管理方式和使用目的如何改变；景观美不能掩盖支撑系统。
failure_boundary: 地表仍以重工业和密集农业为主、生态未经恢复时，大公园只是愿景；自然生态也不完全等同人工公园。
