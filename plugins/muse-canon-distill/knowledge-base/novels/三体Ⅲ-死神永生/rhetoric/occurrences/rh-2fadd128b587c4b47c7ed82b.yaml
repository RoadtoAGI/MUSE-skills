chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 伞沿的小石球在烛光中闪亮，在周围的墙壁上投映出一圈旋转的星光
sensory_mapping: 小石球把烛焰分成群星，沿房间墙壁绕行，公主站在一座微型星系中央。
context_fact: 空灵画师必须不停转伞维持保护，刚进入公主房间仍不能停止。
image_mechanism: 墙面投影抹去伞骨实体，只保留环形运动亮点，机械旋转由此升级为天体运行。
property_alignment: 反光点对应星星；伞沿圆周对应轨道；转伞对应公转；暗墙对应夜空。
context_alignment: 童话正给真实宇宙技术编码，便携黑伞周围出现微型星光，使器物保留天体暗示。
narrative_function: 在紧急报丧中给黑伞一次清晰视觉展示，并强化其神秘保护性质。
transfer_rule: 旋转反光写成星群时，应对齐点状光源、环形轨迹、中心、背景暗度和运动稳定性。
failure_boundary: 亮点只是烛光投影，没有天体距离或引力；星光不说明伞的真实原理。
