chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 渐渐密集，像由零星的雨点转为大雨
sensory_mapping: 每句议论成为落在会场的雨点，发言间隙缩短后，听觉由点滴变成整片雨声。
context_fact: 程心解释阶梯方案后，众人从沉默计算逐渐进入热烈可行性讨论。
image_mechanism: 降雨强度提供可连续升级的密度标尺，变化过程比直接说喧闹更能呈现方案如何获得群体响应。
property_alignment: 零星发言对应初落雨点；参与者增多对应雨滴增密；集体讨论声对应大雨连续声幕。
context_alignment: 前一刻笑声被捂锣般截停，这里以新声场重新建立会场能量，声音形态变化清楚。
narrative_function: 展示技术想法从个人答案扩散为群体推演，平滑推进会议节奏。
transfer_rule: 群声增长宜选有连续强度级别的自然过程；要写出点状声源如何在数量与间隔上合成整体。
failure_boundary: 讨论若由一人突然高喊带起、声音忽强忽弱或很快停止，渐密降雨的连续增长就不成立。
