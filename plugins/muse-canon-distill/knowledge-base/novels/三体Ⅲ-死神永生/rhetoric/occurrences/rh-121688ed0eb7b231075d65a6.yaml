chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 感受高维空间感是一场灵魂的洗礼
sensory_mapping: 无穷空间像水流漫过意识，把附着其上的旧尺度冲淡，观者从四维纵深中重新抬头。
context_fact: 莫沃维奇和关一帆在信息过载后适应四维，看见三维经验无法容纳的空间纵深。
image_mechanism: 洗礼把认知扩张写成全身性的精神事件，水的覆盖和冲刷对应概念意义被一次经历重新赋值。
property_alignment: 高维震撼对应仪式冲击；旧概念失效对应洗去旧身份；概念获得新义对应精神重生；一次亲历对应仪式门槛。
context_alignment: 它承接镜廊类比后的方寸深不见底，把空间知识的变化落到三名宇航员此后再也无法忍受三维狭窄的心理后果。
narrative_function: 把物理奇观转化为人物永久变化，为返回三维后的幽闭感提前定调。
transfer_rule: 使用洗礼表现认知转变时，要给出被冲刷的旧观念、跨越事件和获得的新身份或尺度。
failure_boundary: 人物没有接受宗教仪式，道德品格也未必改善；洗礼只指体验的覆盖强度和认知不可逆性。
quality_assessment: effective
confidence: 0.96
review_status: reviewed
tenor: 亲历四维空间后，人的自由、开放、深远和无限等基本观念被整体改写
vehicle: 以水完成的宗教洗礼洗去旧身份，使接受者以更新后的精神状态重新开始
ground: 经历具有仪式性冲击；旧有认知被冲刷；主体在短时间内获得新的精神尺度
