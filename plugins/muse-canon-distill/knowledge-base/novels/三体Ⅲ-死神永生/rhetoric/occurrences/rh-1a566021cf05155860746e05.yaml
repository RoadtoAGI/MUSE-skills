chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 它们凝成一个光团，像一块巨大的蓝宝石发出璀璨的蓝光
sensory_mapping: 无数星点挤成一整块浓蓝晶体，嵌在正前方黑空，亮得像宇宙尺度的蓝宝石。
context_fact: 随着飞船速度增加，单颗星已不可分辨，前方光谱强烈蓝移。
image_mechanism: 宝石把无法分辨的星群视为一个高密度光物体，颜色、凝聚和价值感共同表现相对论奇观。
property_alignment: 蓝移星光对应宝石蓝色；星群聚集对应晶体整体；多星闪烁对应切面反光；黑空对应宝石底衬；高亮对应璀璨。
context_alignment: 太阳系毁灭曾把行星制成项链和花环，逃离时全银河星光又凝成宝石，宇宙继续以首饰美掩盖极端物理。
narrative_function: 将碗底的动态聚集收束成单一视觉焦点，为进入光速提供最鲜明的前方标志。
transfer_rule: 光团比作宝石时，应具体对齐色相、凝聚边界、内部多点光泽、背景反差和形成机制。
failure_boundary: 光团无固体晶格、体积或可持握边界，蓝宝石只描述高速成像的颜色与亮度。
quality_assessment: exemplary
