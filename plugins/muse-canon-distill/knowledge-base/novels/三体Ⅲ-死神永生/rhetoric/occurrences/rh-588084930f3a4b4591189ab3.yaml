chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 本来已经熄灭的希望之光又像萤火虫一般微微闪亮了
sensory_mapping: 死船黑暗里，金属瓶和手动仪表像一只萤火虫亮起，只有一点光，却证明生路还没全灭。
context_fact: 现代电子系统全部停机，但古式装备能在低光速下工作，关一帆随后启动神经元计算机。
image_mechanism: 萤火虫精确限定希望强度：它不是太阳或闪电，只是黑暗中小而有生命的技术余光。
property_alignment: 希望对应微光；低技术装备对应萤火虫；全船停机对应黑夜；重新发现对应复亮；生存可能对应光点仍在。
context_alignment: 程心的心光曾自称全灭，云天明消息使宇宙转春；灾难后希望再次缩到萤火尺度，反复呈现脆弱复燃。
narrative_function: 从绝望判断转入主动求生，并让古老机械的价值先以情感信号出现。
transfer_rule: 微弱希望比作萤火时，应明确暗环境、光源载体、照明范围、不稳定性和它触发的下一步行动。
failure_boundary: 备用设备能否救生尚未确定，萤火也不能照亮整体困境；相似限于希望小幅复现。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 程心发现古式太空服、氧气瓶和指针仪表后，对依靠低技术备用系统求生重新产生的微弱希望
vehicle: 黑夜中一只萤火虫发出细小、间歇、范围有限却清楚可见的微光
ground: 光度微弱；周围极暗；曾经熄灭后重现；只照亮小范围；不稳定；来自小生命；足以标记存在但不能驱散黑夜
