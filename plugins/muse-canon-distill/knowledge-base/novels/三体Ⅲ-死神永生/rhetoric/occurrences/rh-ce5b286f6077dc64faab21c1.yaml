chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 猪，都是猪！只会在享乐的泥坑里打滚的猪
sensory_mapping: 现代文明的舒适环境塌成泥坑，享乐者失去人的直立姿态，集体伏低身体反复打滚。
context_fact: 阶梯飞行器有效载荷降至半公斤，柯曼琳痛斥人类登月半世纪后仍拿不出星际技术。
image_mechanism: 猪的低姿态和泥坑的封闭脏污共同贬低舒适生活，把技术停滞写成主动沉溺而非单纯能力不足。
property_alignment: 即时享乐对应泥中打滚；技术停滞对应不离泥坑；缺乏远志对应俯身低处；全人类被统称对应猪群。
context_alignment: 人物在绝望与愤怒中发言，夸张侮辱符合情绪峰值，也凸显轻载荷数字与文明自满的巨大落差。
narrative_function: 以粗暴形象释放技术挫败，给维德随后提出只送大脑的冷静突破制造反差。
transfer_rule: 动物贬喻要把行为模式、环境选择和价值判断连在一起，并保留这是角色愤怒视角而非客观分类。
failure_boundary: 若群体持续投入高风险科研、停滞主要由物理极限造成，享乐泥坑会错误归因；喻体也带有人格侮辱。
quality_assessment: effective
