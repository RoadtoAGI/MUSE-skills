review_status: reviewed
tenor: 在航天技术停滞、文明危机临头时仍沉溺舒适消费的全人类
vehicle: 不顾外界危险、只在肮脏泥坑中翻滚取乐的一群猪
ground: 主体把即时感官满足置于长期生存之上；群体活动局限在低处，缺乏向外开拓能力
