tenor: 太阳系预警中心在打击警报后涌入数量失控的信息窗口，新消息不断抢占前景、遮蔽旧消息并充塞大厅
vehicle: 堤坝突然决口，洪水以巨大流量冲入有限空间，前浪被后浪覆盖，迅速淹没房屋和可用地面
ground: 新窗口对应洪峰水体；信息持续生成对应洪水涌入；窗口相互遮盖对应后浪盖前浪；大厅被占满对应空间淹没；系统容量边界对应堤坝；人员不作为对应受灾瘫痪
