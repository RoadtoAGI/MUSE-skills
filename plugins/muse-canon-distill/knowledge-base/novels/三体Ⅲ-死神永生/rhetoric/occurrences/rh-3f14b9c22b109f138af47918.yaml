chapter: 【掩体纪元67年，“星环”号】
figure_type: simile
quote: 空间几乎被泛滥的信息窗口所淹没。那些窗口在大厅中到处飘浮，不断有新出现的窗口挤到前面，但很快又被后来的窗口遮盖，像溃堤后涌出的洪水一般
sensory_mapping: 窗口洪水；信息决堤；前浪被盖；大厅没顶；人群呆立
context_fact: 黑暗森林打击已经降临，预警中心收到海量信息，但工作人员因发现掩体方案无效而陷入绝望麻木。
image_mechanism: 无重量的界面获得水的体积和冲力，生成顺序成为层层浪头；信息本应用于控制危机，此刻却越多越遮蔽，反过来占领控制中心。
property_alignment: 数据窗口对应洪水；系统信息入口对应决口；生成速度对应涌流；界面遮盖对应浪压浪；大厅容量对应低地；视觉充塞对应淹没；工作人员失能对应灾民瘫痪；不可筛选对应水势失控
context_alignment: 太阳系以为预警和掩体带来掌控，真正打击到来时，控制中心先被自己的信息淹没；洪水体现知识过量与行动为零的反转。
narrative_function: 以动态界面揭示系统性失控，并让人群的静止与信息洪流形成致命反差。
transfer_rule: 用洪水写信息过载时，应有突然突破容量、持续高速输入、旧内容被覆盖、空间或注意力被占满，并造成筛选和行动能力下降。
failure_boundary: 信息流量可控、窗口自动整理不互相遮挡，或人员仍能迅速处理并行动时，溃堤洪水会夸大系统失效。
