chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 每个点都像一只小章鱼一样伸出许多触手
sensory_mapping: 标志上的每个神经节点都像圆身小章鱼，触手向四面八方伸去，与别的章鱼缠成网络。
context_fact: 该计算机以生物神经元代替量子芯片，在低光速下仍能运行，界面也退回平面文字系统。
image_mechanism: 章鱼将抽象节点—边网络生物化，中心和多分支结构一眼可辨，也暗合神经元活体计算。
property_alignment: 点节点对应章鱼身体；连接线对应触手；多向分支对应多腕；互联网络对应触手相接；生物计算对应有机形态。
context_alignment: 高科技在低光速中失效，能工作的计算机反而以小生物群为标志，技术从量子抽象回到生命形状。
narrative_function: 用图标先说明神经元计算机原理，并为古老控制台中仍有生命般网络工作建立亲近感。
transfer_rule: 网络节点比作多足生物时，应精确对应中心、分支数、方向、互联和系统的生物属性。
failure_boundary: 连接线不柔软也不自主运动，节点无章鱼身体；相似纯属图形拓扑。
quality_assessment: effective
