chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 由一个维度蜷缩到微观中
sensory_mapping: 第三维像一条长肢从宇宙中慢慢蜷起，最后卷进粒子大小的暗点，平面只剩长宽。
context_fact: 二维化后物体厚度为零，但内部结构按规则完整映射到平面。
image_mechanism: 蜷缩区分维度毁灭与尺度收拢，为高维信息仍保留而宏观厚度消失提供身体直觉。
property_alignment: 第三维对应伸展肢体；尺度减小对应蜷曲；微观隐藏对应卷成小团；二维结果对应剩余方向。
context_alignment: 程心曾见四维碎块维度蜷缩，白Ice沿用同一动作说明三维也不例外。
narrative_function: 给跌落补充静态几何结果，让瀑布流动类比与零厚度画面之间闭合。
transfer_rule: 维数消失写成蜷缩时，应说明原尺度、收缩目标、信息是否保留和观察层级。
failure_boundary: 维度不是柔性肢体，微观蜷缩是理论描述而非可见卷曲过程。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 三维空间向二维转化时，第三个维度缩到基本粒子尺度而在宏观上消失
vehicle: 原本伸展的长形身体或物体卷曲收拢，把长度藏进极小团块中
ground: 先有展开尺度；收缩方向明确；内容未必消失而是藏入微小范围；宏观观察失去该方向
