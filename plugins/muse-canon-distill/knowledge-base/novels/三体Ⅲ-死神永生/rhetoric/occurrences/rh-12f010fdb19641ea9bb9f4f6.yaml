chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 这种局面很像危机爆发后的逃亡主义
sensory_mapping: 冬眠舱成为沿时间轴发射的逃生船，世纪间隔取代星际距离，醒来取代抵达。
context_fact: 政府担心富人冬眠到未来享受进步成果，因此像压制克隆人一样严控技术。
image_mechanism: 类比把空间方向旋转到时间方向，保留逃离共同危险和资源排他的社会结构，因而生成时间逃亡主义命名。
property_alignment: 冬眠越过时代对应飞船离开地球；富人优先对应少数逃亡者；留守者承担建设对应被遗弃多数。
context_alignment: 技术本身用于治病，社会视角却看到不平等迁移；与危机逃亡对照能解释监管强度。
narrative_function: 为冬眠政治争议提供可识别模型，并把技术史接入危机伦理。
transfer_rule: 跨时间与空间类比时，应保留主体选择、离开对象、抵达收益和成本分配四项，而非只因都含逃字。
failure_boundary: 若冬眠机会普遍平等、醒来者不占未来资源或留守者自愿承担成本，逃亡主义的社会结构会减弱。
