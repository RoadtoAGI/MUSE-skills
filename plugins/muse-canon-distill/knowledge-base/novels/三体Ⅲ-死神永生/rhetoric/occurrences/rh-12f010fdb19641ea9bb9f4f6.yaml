tenor: 危机前富人试图借冬眠越过当代、直接占有更富裕未来的时间逃亡
vehicle: 危机后部分人试图乘飞船离开地球、逃开三体威胁的空间逃亡主义
ground: 少数人凭稀缺技术离开共同命运；逃离成本和机会不平等会撕裂社会正义
