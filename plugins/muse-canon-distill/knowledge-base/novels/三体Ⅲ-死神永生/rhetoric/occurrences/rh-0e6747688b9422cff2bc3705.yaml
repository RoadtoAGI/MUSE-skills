figure_type: simile
quote: 她的眼睛像得了热病似的发着光
sensory_mapping: 难以直接看见的兴奋被转成病热造成的眼部亮光，心理温度与生理高热重叠。
context_fact: 狄奥伦娜双目低垂、浑身颤抖，却因即将展示异能而透出少见的期待。
image_mechanism: 发光给目光提供亮度，热病再给亮度添加灼热、神志失衡和潜在致命性，使期待既强烈又不祥。
property_alignment: 异常明亮的眼神对应高烧时的灼亮双眼；压不住的兴奋对应热病亢奋；身体颤抖对应病中震颤。
context_alignment: 她将以超自然力量取脑，病症喻体让身体脆弱与能力可怖在同一神态中并存。
narrative_function: 在异能显现前制造病态预兆，并让人物的阶层怯弱和内在狂热同时可见。
transfer_rule: 为矛盾情绪寻找生理喻体时，外部症状要与已写动作相连，病理后果还须补足情绪的危险方向。
failure_boundary: 若她目光温和稳定、身体也不颤抖，热病的失控感便无证据；若场景需要冷静算计，发热意象会抬错情绪温度。
