chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 这话的每个字都像一记重锤砸在程心的心上
sensory_mapping: 重锤举落；逐字砸击；胸口钝痛；震动回响；旧伤再裂
context_fact: 维德所说‘第二次错误’直指程心执剑时未及时威慑、导致地球陷入灾难。
image_mechanism: 六个字被拆成六次有重量的落锤，越短越无缓冲；锤头不打理智论证，而直落她储存愧疚的心口。
property_alignment: 字词对应锤击；维德语气对应挥锤力量；句子节拍对应连续落点；程心内疚对应受击部位；心理震荡对应冲击波；历史创伤对应旧裂处
context_alignment: 周围氢弹试验即将开始，私人话语的重锤先于宏观爆炸击中程心，形成尺度反差。
narrative_function: 显示警告直中程心最深负罪，使试验奇观无法转移两人冲突。
transfer_rule: 用逐字重锤写话语冲击时，应有短句落点、既有痛处、说话者施力、节奏累加和受话者身体化反应。
failure_boundary: 话语轻松含糊、听者无相关创伤，或对方立即不以为意时，重锤会过度赋重。
