tenor: 维德重复警告程心不要再次因仁慈作出会危及人类的决定，每个字都唤醒她的执剑失败创伤
vehicle: 沉重铁锤连续砸击胸口同一位置，冲击逐次累加并造成钝痛和震荡
ground: 每个字对应一次锤击；警告分量对应锤重；旧创伤对应被砸心口；短句节奏对应连续落锤；心理震动对应肉身震荡
