chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 极度的疲惫和情感的浪潮同时淹没了她
sensory_mapping: 记忆机器一关，疲惫和爱恋像两面巨浪合拢，把程心整个人压进泪水。
context_fact: 她连续六小时复述并压抑情感，进入返回舱看见蓝色地球后终于哭出。
image_mechanism: 浪潮把延迟反应写成蓄水后的突发回灌，同时对应她由封闭机器变回有身体的女人。
property_alignment: 积压情绪对应远处聚浪；疲惫叠加对应双浪；失去克制对应被淹；哭泣对应水体外溢。
context_alignment: 前文故事和时间曾是包裹她的缓流，此处水势转为不可控浪潮，标记任务保护层消失。
narrative_function: 释放会面段长期延迟的情绪，并将读者从情报解码拉回人物承受。
transfer_rule: 积压感受写成浪潮时，应说明蓄积时长、触发点、多股力量和身体失守。
failure_boundary: 疲惫与情感性质不同且没有真实水压，淹没只表达总量和不可抵抗。
