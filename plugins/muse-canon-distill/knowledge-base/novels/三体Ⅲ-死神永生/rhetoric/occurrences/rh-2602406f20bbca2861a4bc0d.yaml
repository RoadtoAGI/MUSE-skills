figure_type: metaphor
quote: 接着骚动加剧，人群再次沸腾起来
sensory_mapping: 冻结的人海重新受饥饿加热，身体像气泡翻上表面，攀爬者从沸点处向垛顶冒出。
context_fact: 人群只被智子出现镇住片刻，随后割网拿食，有人无视她向垛顶爬。
image_mechanism: 沸腾与前句凝固构成相变反转，说明饥饿热量压过名声威慑，必须用杀戮再次降温。
property_alignment: 骚动扩散对应液体升温；多人翻动对应沸滚；攀上垛顶对应气泡上冒；噪声加剧对应沸声。
context_alignment: 食品争夺已连续用蛋清、洪水、浑水流体化人群，沸腾保持同一物质框架并推进强度。
narrative_function: 证明口头命令失败，直接触发智子拔刀杀人的转折。
transfer_rule: 群体沸腾应有由静到动的温度式升级、内部翻滚和向上突破，最好与前态形成对照。
failure_boundary: 饥饿者不是被动受热分子，行动有目标；若骚动局限少数区域，整体沸腾会夸大覆盖面。
