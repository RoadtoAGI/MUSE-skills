chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 像半个布满了过多触角的水雷
sensory_mapping: 半球水雷；触角密生；金属尖管；球心聚束；危险机械
context_fact: 机器主体为密封半球，大量装置和管道环绕球面，全部朝向不可见球心集中能量。
image_mechanism: 看不懂用途的管路先被视觉归并成武器触角，圆壳因放射刺突显出水雷轮廓；复杂科学设备由此获得潜在爆炸性的身体。
property_alignment: 机器半球对应半枚雷体；管道对应触角；粗细不等对应引信差异；金属表面对应水雷外壳；全向插入对应放射刺突；能量汇聚对应爆炸核心；复杂度对应触角过多
context_alignment: 装置将制造光速飞船关键部件，周围团队携带反物质武器；水雷意象把科研突破与随时引爆的政治危机叠合。
narrative_function: 先用危险物轮廓组织陌生机器的复杂外观，为其上方精致舞台制造上下反差。
transfer_rule: 用水雷写球形装置时，应有金属球壳、放射突起、密集引信感与真实高能风险，且视角能看清整体轮廓。
failure_boundary: 装置为柔软有机体、管线平贴表面、整体没有球形或不涉及高能过程时，水雷会添加错误危险机制。
quality_assessment: effective
