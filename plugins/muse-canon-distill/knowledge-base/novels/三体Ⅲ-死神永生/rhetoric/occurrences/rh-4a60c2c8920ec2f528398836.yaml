tenor: 曲率驱动机器下半部的密封半球及从四周伸入、全都指向球心的大量粗细管状装置
vehicle: 半枚球形水雷表面密布过量引信触角，尖管从各方向突出并带有危险爆炸感
ground: 密封半球对应水雷球壳；管状物对应触角引信；放射排列对应水雷刺突；金属质感对应武器外壳；装置复杂对应触角过密；高能集中对应爆炸危险
