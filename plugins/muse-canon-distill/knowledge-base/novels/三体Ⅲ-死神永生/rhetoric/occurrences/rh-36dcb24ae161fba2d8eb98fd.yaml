chapter: 【掩体纪元11年，掩体世界】
figure_type: metaphor
quote: 程心的心中漾起一种温暖的感觉
sensory_mapping: 心湖暖纹；话音落水；波圈扩散；胸中回温；日常轻荡
context_fact: 公交乘客谈论批发菜价、供暖费、工作和恋爱，这些公元式市井声音在两个未来纪元曾消失。
image_mechanism: 普通话语不是以观点说服她，而像小物连续落入心湖，让被时代疏离冻住的内面恢复流动和温度；漾起保留情绪轻而持久的节奏。
property_alignment: 内心对应水体；亲切感对应温水；声音刺激对应入水触点；情绪扩散对应涟漪；多段对话对应连续波纹；久违回归对应水面解冻；倾听陶醉对应波动持续
context_alignment: 她刚因太空城奇观震撼，此处真正令她温暖的却是最琐碎人声，水纹尺度贴合这种安静而非壮烈的归属。
narrative_function: 把社会观察转入身体感受，解释程心为何把掩体世界认作迟来的家。
transfer_rule: 用漾起写情绪时，应是柔和感受由具体触发逐渐扩散，强度适中且内心此前相对平静或冰冷。
failure_boundary: 情绪骤然爆炸、伴随剧痛恐慌，或人物毫无感受变化时，水纹的缓慢柔性会低估真实节奏。
