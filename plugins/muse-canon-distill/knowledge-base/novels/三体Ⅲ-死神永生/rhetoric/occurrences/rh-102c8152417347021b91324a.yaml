review_status: reviewed
tenor: 水滴穿层造成的几次猛烈地震后骤然归于停止
vehicle: 鼓师在乐曲结束处连续重击鼓面并以最后一槌收住
ground: 强冲击呈离散节拍；末段力度集中；数次重击后突然静止并宣告结束
