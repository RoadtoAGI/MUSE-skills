chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: simile
quote: 震动猛烈跳动了几下后停止了，就像鼓师在曲终时的几下猛擂
sensory_mapping: 岩层跳动化成低沉鼓面，几次重震成为收尾鼓点，最后一击后大厅陷入静默。
context_fact: 程心以为水滴会击中控制中心，实际震动来自二十千米外的亚洲发射台被毁。
image_mechanism: 鼓点给无形地下冲击分出节奏和终止线，曲终还暗示持续六十二年的威慑在此刻落幕。
property_alignment: 地层猛震对应重擂；几次跳动对应连续鼓点；突然停止对应曲终收槌；威慑终止对应乐曲结束。
context_alignment: 人物闭眼只剩触觉与声音，听觉喻体比地质形状更贴近她能接收的信息。
narrative_function: 把攻击结束与时代终结压在同一节拍上，并在结果文字出现前制造短暂静场。
transfer_rule: 为冲击序列取音乐喻体时，应匹配节拍数量、力度走势和停止方式，让结构意义由收尾动作产生。
failure_boundary: 震动并非鼓师有意编排，若冲击持续无节奏或渐弱消散，曲终猛擂的清晰收束会失真。
quality_assessment: exemplary
