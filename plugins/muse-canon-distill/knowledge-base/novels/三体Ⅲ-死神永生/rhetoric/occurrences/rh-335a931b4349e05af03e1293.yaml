figure_type: metaphor
quote: 这个故事她己经倒背如流
sensory_mapping: 连续流水；顺滑河道；无阻流动；词句涌出；稳定节奏
context_fact: 程心没有看发下的童话文本，因为她已反复阅读并长期思考公主是否以自己为原型。
image_mechanism: 记忆中的句子不需逐块寻找，而像蓄水打开出口后自动接续；即使从末端倒取，语言仍保持一股不断的流势。
property_alignment: 故事词句对应水；记忆路径对应河道；熟练复述对应连续流动；无停顿对应无堵塞；倒背能力对应任意方向取流；长期熟悉对应稳定水源
context_alignment: 专家仍在首次拆解密码，程心却已把故事内化成无需看纸的语言流，显示她与云天明的私人联系。
narrative_function: 迅速交代程心的熟悉程度，为她比专家更接近情感原型却仍难解密码制造反差。
transfer_rule: 用流水写背诵熟练时，应体现连续、低检索阻力、稳定节奏、充足记忆来源和可从不同位置调用。
failure_boundary: 复述频繁卡顿、靠临时阅读提示，或只是理解大意不能准确说出原文时，如流会夸大熟练度。
