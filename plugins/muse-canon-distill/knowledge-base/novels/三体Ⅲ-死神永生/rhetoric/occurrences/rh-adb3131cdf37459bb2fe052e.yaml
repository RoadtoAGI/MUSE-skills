tenor: 未来艺术吸收后现代经验后回到温和形式、同时达到新层级的演化
vehicle: 沿螺旋向上运动，经过相似方位却在更高高度建立新平台
ground: 新形态重现部分古典特征但非简单倒退；历史经验被保留并在更高层重新组织
