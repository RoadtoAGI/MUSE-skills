chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 更像是自后现代以后的螺旋升华，完全建立在一个新的美学基础上
sensory_mapping: 艺术史成为旋转楼梯，未来文化绕回古典方向时已升高一层，脚下换成新美学地基。
context_fact: 程心看到温和写实艺术，却意识到其中包含宇宙时空等后现代之后的新内容。
image_mechanism: 螺旋同时解决回归与进步的表面矛盾：平面位置似曾相识，垂直高度已经改变。
property_alignment: 温和古典外观对应转回相似方位；吸收后现代对应完成一圈；新美学对应更高平台。
context_alignment: 人物需解释为何艺术不像预期延伸、也非复古，螺旋提供历史连续又非线性的模型。
narrative_function: 给未来文化定位，概括其乐观宁静并解除程心的时代陌生。
transfer_rule: 文化螺旋只适合形式复现而内涵、条件已升级的情况；需分别指出相似面和高度增量。
failure_boundary: 若只是原样复古、没有后现代经验残留或新基础，螺旋升华会把循环误写成进步。
