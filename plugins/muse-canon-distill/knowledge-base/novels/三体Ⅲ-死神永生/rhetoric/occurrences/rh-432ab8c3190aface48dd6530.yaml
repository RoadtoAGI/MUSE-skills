chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 这是比智子更强的技术锁死。所以，黑域安全声明除了自我隔绝外，还有技术自残的一面。这也就意味着人类将永远没有力量飞出自造的低光速陷阱了
sensory_mapping: 技术断肢；牢门锁死；自造陷坑；力量耗尽；文明困内
context_fact: 黑域内计算速度极低，任何物质不能超越当地光速，太阳系成为绝对封闭世界。
image_mechanism: 安全工程被重新演成自我施害：文明为躲避猎手先削弱自身，再关上只能从强者一侧开启的门；完成后连后悔所需的技术肌肉也消失。
property_alignment: 文明能力对应身体；降光速对应自伤；技术发展对应肌力；视界对应牢门；黑域对应陷阱；主动建设对应自造；永久封闭对应锁死；智子对应外部锁链
context_alignment: 这条生路以最高安全交换宇宙自由，连续“锁死—自残—陷阱”把代价从抽象限制推进到不可逆自我囚禁。
narrative_function: 纠正“保险柜”只显安全的单面印象，让方案选择呈现身体与自由代价。
transfer_rule: 用自残陷阱写安全策略时，应由主体主动实施、能力损失不可逆，并让损失本身阻止未来退出。
failure_boundary: 限制可随时恢复、外部救援可靠，或主体保留足够技术解除装置时，自造永久陷阱会夸大不可逆性。
