tenor: 人类主动降低太阳系光速后，计算与航行技术能力大幅退化，且再也无法发展出逃离黑域的力量
vehicle: 人先损伤自己的肢体和工具，再从内部锁死牢门，落入亲手制造、此后无力攀出的陷阱
ground: 技术退化对应自残；低光速限制对应锁具；太阳系对应陷阱；实施黑域对应亲手布置；无法逃离对应锁死；智子封锁对应外加枷锁；黑域限制对应内生牢笼
