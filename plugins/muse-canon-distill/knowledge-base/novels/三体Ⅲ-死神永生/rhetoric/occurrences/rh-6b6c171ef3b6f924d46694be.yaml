figure_type: simile
quote: 形成了一道长达一百六十千米的屏障，如一道墙，将北冰洋与斯堪的纳维亚半岛北端隔开
sensory_mapping: 海上长墙；陡峭石面；连续岛脊；两侧水域；狭窄墙缝
context_fact: 程心到挪威群岛处置星环公司事务，所处岛链由冰川蚀刻并横亘一百六十千米。
image_mechanism: 分散岛屿在远尺度上彼此接合，峰脊抬成一段石墙，湍急海峡只像墙体裂缝；地理位置因此从群岛变成明确边界。
property_alignment: 群岛链对应墙体；险峰对应墙垛；岩石山体对应墙材；一百六十千米延伸对应长墙；北冰洋与半岛对应墙两侧；岛间海峡对应开口裂隙
context_alignment: 程心正思考生命边界与新希望，世界尽头的实体屏障为她所处隔绝环境提供清晰轮廓。
narrative_function: 迅速交代群岛宏观地形和肃杀封闭感，为随后海底测试建立空间背景。
transfer_rule: 用墙写岛链时，应有线性连续、显著高差、两侧区域、阻隔功能和少量可通行缺口。
failure_boundary: 岛屿零散低平、间距宽到不能阻隔水域，或排列成环而非线时，长墙会误写地貌。
