chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 它主要由两根或四根头部带金属球的悬杆和一根带套简的转轴组成，就像这把伞
sensory_mapping: 旋转伞柄；带球伞骨；离心张开；减速合拢；上下滑动套筒
context_fact: IDC实制童话黑伞后，曹彬认出其结构和操作模拟18世纪蒸汽机离心调速器。
image_mechanism: 陌生工业装置套上伞的轮廓：转轴成为伞柄，带球悬杆成为伞骨；随着旋转，‘伞’开合把看不见的速度变化翻译为可见角度。
property_alignment: 调速器转轴对应伞柄；悬杆对应伞骨；金属球对应石球；离心力抬杆对应伞张开；转速下降对应伞合拢；套筒位移对应开合传动；蒸汽门反馈对应声音报警
context_alignment: 委员会先亲手旋伞感到劳累，机械实物让曹彬从外观跨到反馈控制机制，童话密码由视觉相似进入技术原理。
narrative_function: 借熟悉伞形解释调速器，并解出黑域降低光速的核心隐喻。
transfer_rule: 用日常开合物解释调速器时，应逐项匹配中心轴、径向悬臂、端部配重、速度引起的角度变化和反馈联动。
failure_boundary: 伞靠手动卡扣开合、没有离心配重或反馈阀门时，外形相似不能推出自动调速机制。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 蒸汽机离心调速器以带球悬杆随转速张合，联动套筒调节蒸汽门并维持速度
vehicle: 带石球伞骨绕伞柄旋转，转快时离心张开、转慢时内合，并以声音提示速度
ground: 转轴对应伞柄；悬杆对应伞骨；金属球对应伞沿石球；转快外张对应开伞；转慢内合对应收伞；联动调节对应伞的速度反馈
