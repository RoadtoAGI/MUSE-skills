chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: metaphor
quote: 罗辑等待了半个世纪的晴空霹雳，在他离开五分钟后就降临到了程心的头上
sensory_mapping: 五十四年平静天空在交接后骤裂，六个水滴化成雷电，越过所有准备直接劈到程心头顶。
context_fact: 罗辑始终准备迎接进攻，三体却在判断程心不会按键后立即启动水滴，没多延误一秒。
image_mechanism: 晴空突出和平表象与突袭反差，等待半世纪和五分钟并置则把事件突然性归于承受者更换而非威胁新生。
property_alignment: 威慑和平对应晴空；潜伏水滴对应云外雷源；全速突袭对应霹雳下击；决断压力对应击中头顶；交接五分钟对应骤发。
context_alignment: 控制中心本在四十五千米地下，攻击却仍以从天而降的雷击抵达，显示地层防护无法隔绝战略冲击。
narrative_function: 用一句时间反差宣布罗辑时代与程心时代的断裂，启动全书关键倒计时。
transfer_rule: 突发危机如晴空雷击时，应先建立平静表面、潜伏威胁和具体命中者；突然性来自认知或时点反差。
failure_boundary: 若预警持续公开、攻击渐进且有充足反应时间，晴空霹雳不合；罗辑事实上预期危机，晴空只属于社会表面。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 六个潜伏水滴在执剑人交接后立即突袭地球、迫使程心在十分钟内作毁灭决定的危机
vehicle: 晴朗无云时突然从天而降、猛烈击中头顶且来不及躲避的一记雷电
ground: 灾难长期可能却在具体时刻毫无过渡地爆发；冲击来自上方，直接落到单一承受者并要求即时反应
