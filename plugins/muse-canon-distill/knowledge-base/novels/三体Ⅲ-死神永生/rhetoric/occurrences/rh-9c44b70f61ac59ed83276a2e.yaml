review_status: reviewed
tenor: 父母灌输的贵族教育在云天明心中形成的孤僻价值束缚
vehicle: 挣扎会启动棘轮、自动收紧的发条手铐
ground: 束缚已内置于主体并限制行动；反抗动作反而触发更强约束，形成自我强化回路
