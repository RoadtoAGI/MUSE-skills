chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 就像以前的那种能上发条的手铐，越想挣脱，它铐得越紧
sensory_mapping: 抽象教养变成腕上金属铐圈，挣脱意志扭动发条，压力随每次反抗勒得更深。
context_fact: 父母已放弃贵族教育，但其鄙视普通人的观念使云天明越来越孤僻，无法融入同龄人。
image_mechanism: 发条机构解释外部教育如何内化：施教者离开后装置仍由受者自己的挣扎供能，束缚因此自动延续。
property_alignment: 内化观念对应已扣上的手铐；社交尝试触发羞耻对应挣扎上发条；越想摆脱越孤僻对应铐圈自紧。
context_alignment: 父母现实行为已否定其教条，云天明却仍受控，自动手铐恰能说明因果脱离原施力者后继续。
narrative_function: 给人物长期孤僻建立反馈机制，解释他为何明知教育虚伪仍无法回到人群。
transfer_rule: 写内化束缚时，可选由受困者动作反向驱动的装置；必须指出哪种反抗行为经过何种心理环路使约束加深。
failure_boundary: 若束缚只来自父母当前强迫、离开后立即消失，自动装置不成立；若反抗确实逐步奏效，也不能说越挣越紧。
quality_assessment: exemplary
