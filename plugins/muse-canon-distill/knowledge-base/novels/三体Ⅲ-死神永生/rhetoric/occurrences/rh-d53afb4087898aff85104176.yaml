chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 只有简单的小昆虫，很像简化版的地球
sensory_mapping: 蓝星像把地球生态删到基础版：留下草木、鱼和小虫，拿掉森林动物与繁复食物网。
context_fact: 地球植物能在此生长，人类即使无技术也可生存，程心和AA准备把种子种下。
image_mechanism: 版本类比把生态差异解释为功能保留与模块删减，既说明宜居性，也警示系统冗余不足。
property_alignment: 蓝星环境对应基础版本；地球对应完整版；共有植物鱼虫对应保留功能；缺高等动物对应删减模块；可供人类生存对应兼容性。
context_alignment: 星环号曾是地球最美事物串成的小世界，蓝星则是简化地球；幸存者再次依靠缩小版家园延续。
narrative_function: 用一句整体判断总结生态调查，并为是否播种地球物种的伦理与生存选择奠基。
transfer_rule: 生态系统比作简化版本时，应列出保留模块、删减层级、兼容对象和复杂度后果。
failure_boundary: 蓝星不是地球的人工复制或软件版本，独立生命机制仍可能不同；相似基于已知表面调查。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 蓝星具备可迁徙植物、少量鱼类和昆虫却缺乏陆地高等动物的简单生态系统
vehicle: 保留原系统基本组件和运行条件、删去大量物种与复杂层级的地球生态简化版本
ground: 基础环境相似；含氧大气；有植物鱼虫；物种数量较少；食物网层级更少；地球生命可移植；复杂度显著降低
