chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 可能会以为这是一个没有任何设备的空壳
sensory_mapping: 球形舱壁像一枚掏空硬壳，座位之外看不见按钮线路，真正操纵界面要在空气中才会显形。
context_fact: 现代飞行器取消手动操纵物，屏幕用投影生成，公元人进入会看见空荡舱室。
image_mechanism: 空壳利用外形保留与内件消失的反差描述界面隐形化，误判来自把设备等同于可见硬件。
property_alignment: 舱壁对应壳体；无实体控制器对应内部掏空；隐藏投影功能对应不可见器官；公元人误解对应把壳当废物。
context_alignment: 程心来自公元世纪却已适应未来技术，叙述用假想公元人而非她误判，暗示她对新纪元的融入。
narrative_function: 快速交代未来操纵界面，并让后来加装的三色灯和氢弹因实体可见而更加突兀。
transfer_rule: 高功能空间如空壳时，应明确消失的是哪些可见器件、功能如何另行存在及谁会产生误判。
failure_boundary: 舱内并非无设备，投影、传感器和AI都在运行；空壳只描述公元人的视觉印象。
quality_assessment: functional
confidence: 0.97
review_status: reviewed
tenor: 操纵与显示全部采用空中投影、肉眼看不到实体设备的现代太空艇舱内空间
vehicle: 内部组织已被掏空的外壳，只剩围合轮廓，表面完整却看不见功能器官
ground: 外部边界存在；内部视觉上空无；功能结构不显露；初见者可能误判主体没有设备能力
