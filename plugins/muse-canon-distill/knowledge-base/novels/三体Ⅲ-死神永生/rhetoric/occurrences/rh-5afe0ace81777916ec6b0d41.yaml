chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 他听到一句如释重负的话
sensory_mapping: 抢救压力成为肩背重物，确认软管无药后的话音带出卸重时的一口长气。
context_fact: 安乐程序刚被撞门中止，众人急切断电拔管并检查药液是否进入云天明身体。
image_mechanism: 此前连续急动作积累重量，检查结论成为放下节点；语气变化替看不清现场的云天明报告风险解除。
property_alignment: 担心药液注入对应背负重压；检查软管对应确认能否卸下；发现未出药对应重物落地；话音放松对应卸重呼气。
context_alignment: 主人公只听见一句含混话，情绪质地比字面内容更可靠，卸重准确传达医护共同紧张。
narrative_function: 用声音确认抢救成功，收束突然闯入的动作高潮。
transfer_rule: 释负类惯用语应由清楚的压力来源和解除节点支撑；可让前序动作积累重量，再由一句话呈现卸下。
failure_boundary: 若危险仍未排除、说话者语气平常或并未承担责任，卸重感就无因；它也不说明主人公本人感到轻松。
