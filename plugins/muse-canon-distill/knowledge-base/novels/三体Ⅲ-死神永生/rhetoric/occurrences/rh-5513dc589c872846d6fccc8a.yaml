figure_type: metaphor
quote: 岁月崩塌下来，压在他身上
sensory_mapping: 时间楼体；支柱折断；岁月轰塌；老者被压；身体骤沉
context_fact: 维德此前虽一百一十岁仍步伐稳健，放弃抵抗后突然显得疲惫无力，需扶平台坐下。
image_mechanism: 过去六十多年没有平缓流走，而被他的意志撑在头顶；信念熄灭像撤掉支柱，积累的全部年份同刻落下，解释外貌为何瞬间老去。
property_alignment: 岁月积累对应建筑重量；维德意志对应支柱；理想终止对应支撑断裂；老态显现对应结构下坠；疲惫身体对应被瓦砾压住；扶台落座对应负重弯倒；骤变对应瞬时崩塌
context_alignment: 维德刚被比作冰雪后露出的岩石，始终抵抗时间；此刻时间从被抵抗者变成坍塌重物，完成失败后的形体反转。
narrative_function: 把心理失败转为身体衰老的瞬时因果，浓缩人物一生被压回肉身的悲剧。
transfer_rule: 用岁月崩塌写骤老时，应有长期超龄坚挺的前态、维持状态的精神支撑、明确断裂时点和随即出现的负重姿态。
failure_boundary: 衰老一直均匀可见、人物没有突然失去支撑，或身体变化发生在多年之后时，瞬时坍塌会破坏时间节奏。
