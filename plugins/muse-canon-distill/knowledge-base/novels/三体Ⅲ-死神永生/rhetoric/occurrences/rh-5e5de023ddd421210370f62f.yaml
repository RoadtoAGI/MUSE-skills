chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 使城市的灯海黯然失色
sensory_mapping: 街灯和窗灯原本连成金色海面，惨白星光一落，整片灯浪像退色般沉下去。
context_fact: 恒星亮度超过满月并继续上升，城市人工照明在其照射下不再醒目。
image_mechanism: 灯海把离散城市灯点聚成连续面，黯然则像海上反光被另一轮太阳夺走，便于比较两种光源规模。
property_alignment: 密集灯点对应海面波光；城市范围对应海域；恒星强光对应压过反光的天光；失色对应海面变暗。
context_alignment: 灯海本是现代繁荣标志，此刻被将死恒星的光抹淡，文明照明在宇宙打击前显得微小。
narrative_function: 用人工光与天体光的同场竞争标定能量差，并暗示地球繁荣的脆弱。
transfer_rule: 群灯如海时，应写明离散光点如何连面、覆盖范围及更强光照如何改变整体亮度。
failure_boundary: 城市灯并非液体，也没有真实潮汐；远近视角改变时未必形成连续灯海。
quality_assessment: conventional
confidence: 0.95
review_status: reviewed
tenor: 遍布城市的大量人工灯光在三体恒星爆发光照下显得暗弱
vehicle: 无数灯点汇成一片发光海面，整体波光却被更强天光压暗
ground: 光点数量密集；分布覆盖大片区域；远观形成连续亮面；更强光源能削弱其视觉存在
