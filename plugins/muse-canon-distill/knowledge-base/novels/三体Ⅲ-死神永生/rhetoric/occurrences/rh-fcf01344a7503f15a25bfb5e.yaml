chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 在水滴面前，“蓝色空间”号只是一个纸糊的靶子
sensory_mapping: 巨型战舰的金属舰壳在水滴前褪成薄纸，推进与武器被钉在靶架上，一点撞击即可穿出破洞。
context_fact: 两个水滴与追击舰同行，实力差距使蓝色空间号判断背水一战也没有逃脱可能，最终投降。
image_mechanism: 纸糊撤销战舰给人的坚固感，靶子再撤销其主体行动性，两词分别压低防御与战术地位。
property_alignment: 舰体相对脆弱对应薄纸；水滴贯穿能力对应一击穿靶；被追踪锁定对应靶位固定；无法反击对应供射对象。
context_alignment: 末日战役已经证明水滴能轻易摧毁舰队，纸靶不是抽象贬低，而有同类攻击事实支撑。
narrative_function: 瞬间说明投降不是意志软弱，而是物理力量悬殊的唯一理性选择。
transfer_rule: 强弱对比用纸靶时，应分别对应材质差、命中概率和反击能力；攻击者必须有已证实的一击优势。
failure_boundary: 若目标能机动避让、武器可伤害对手或防护能承受多次攻击，纸糊靶子会抹去真实博弈。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 常规恒星战舰蓝色空间号面对强相互作用力水滴时几乎为零的防御和逃脱能力
vehicle: 用薄纸糊成、固定供射击使用，一击即可洞穿撕碎的靶子
ground: 目标易被锁定且没有有效反击；表面体量虽大，材料强度在攻击者面前近乎不存在
