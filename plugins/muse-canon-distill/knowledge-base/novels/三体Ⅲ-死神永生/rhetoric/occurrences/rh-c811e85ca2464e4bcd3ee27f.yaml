chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 永恒之夜又笼罩了一切
sensory_mapping: 金红晚霞熄灭，黑夜像幕布合拢，把返乡舱和远行双舰一并收入没有黎明的星际暗处。
context_fact: 尘埃云的金红色很快消失，两支飞船继续进入远离恒星的深空。
image_mechanism: 笼罩给黑暗一个覆盖动作，永恒则把普通昼夜循环取消，使刚才的地球晚霞成为无法重复的短暂例外。
property_alignment: 深空黑暗对应夜色；全向包围对应罩幕；发动机光灭对应幕落；漫长航行对应永恒无晓。
context_alignment: 晚霞紧接永夜，地球一天的时间结构被压缩成几秒，突出离开母星后温暖光景的稀缺。
narrative_function: 为章节视觉落幕，并在两粒种子出现前恢复孕育未知未来的黑色背景。
transfer_rule: 黑暗如罩幕时，要安排明确的前一光源、覆盖动作、包围范围和持续尺度。
failure_boundary: 星空仍有银河和发动机光，深空也非绝对无光；永恒是航行者体验而非物理时间断言。
quality_assessment: effective
