tenor: 发动机照亮尘埃的短暂光芒消失后，深空重新恢复无边黑暗
vehicle: 没有尽头的黑夜像巨大罩幕从四周落下，把地面万物全部覆盖
ground: 黑暗范围无边；亮光退去后重新占据视野；主体被包围；持续时间远超人的尺度
