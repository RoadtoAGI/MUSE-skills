figure_type: simile
quote: 一批像叫花子似的手无缚鸡之力的女孩子
sensory_mapping: 骑士团称号附带的铠甲想象被撤去，只留下饥弱身体和乞食姿态。
context_fact: 拜占庭人期待西欧精兵，实际到来的女孩无力作战，断供后沦为娼妓。
image_mechanism: 叫花子把军事身份瞬间降到生存底线，让期待中的武装援助显出饥饿、伸手求食的反面轮廓。
property_alignment: 女孩缺乏给养对应乞者饥困；没有战力对应乞者无自保资源；依赖拜占庭供给对应向人求食。
context_alignment: 喻体服务于期待落空，也解释断供为何迅速摧毁她们，而非只贬损外貌。
narrative_function: 压缩祖辈传奇与现实的落差，揭开家族所谓光荣起源中的贫困和剥削。
transfer_rule: 反转身份光环时，应选能解释实际资源条件的社会角色，让服饰、能力和依赖关系共同推翻称号。
failure_boundary: 若女孩装备齐全、能够作战，只是人数少，叫花子会错写能力；若文本没有供给依赖，也缺乏乞食关系。
