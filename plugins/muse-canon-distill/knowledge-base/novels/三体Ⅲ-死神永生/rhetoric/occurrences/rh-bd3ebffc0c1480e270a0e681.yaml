chapter: 【广播纪元7年，云天明的童话】
figure_type: analogy
quote: 就像看到自己最亲密的人突然拔剑刺来的那一瞬间
sensory_mapping: 画像的瞳孔里像映出儿子拔出的冷刃，亲情先断，剑尖随后抵到胸前。
context_fact: 冰沙王子假意祝寿后当夜命针眼作画，使父王从现实消失。
image_mechanism: 具体刺杀场景把复合表情的各成分置于同一毫秒：亲密解释悲哀，拔剑解释震惊，逼近解释恐惧。
property_alignment: 冰沙身份对应亲密者；政变对应突然拔剑；画像魔法对应致命刺击；国王无备对应来不及反应。
context_alignment: 王子没有亲手用剑，画像是远程兵刃；情境类比揭开艺术礼物实际承担的刺杀功能。
narrative_function: 用一个可表演的瞬间精确规定画像神情，同时坐实政变的亲族背叛性质。
transfer_rule: 复杂惊恐借背叛场景表达时，应让关系、攻击动作、时间尺度和各情绪成分逐项对应。
failure_boundary: 国王没有亲眼看到王子拔剑，魔画过程也非近身刺杀；类比只解释心理瞬间。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 国王在死亡来临前对儿子背叛产生的震惊、悲哀、恐惧与来不及反应
vehicle: 毫无防备时看见最信任亲近者突然拔剑直刺自己的瞬间
ground: 攻击来自亲近者；信任骤然崩塌；危险致命；反应时间极短；悲痛与恐惧同时出现
