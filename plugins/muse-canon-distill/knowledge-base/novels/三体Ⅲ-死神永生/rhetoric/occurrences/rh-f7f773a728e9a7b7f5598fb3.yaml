chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 冰水似的微笑在维德脸上溢散开来
sensory_mapping: 冰冷水面；嘴角溢流；寒意扩散；面部降温；清澈刺骨
context_fact: 程心要求维德掌管公司却永远服从她，维德指出他若违约反而对她幸运，但保证守诺。
image_mechanism: 笑不是肌肉上扬，而是一股冰水从嘴角漫过整张脸；越扩散越没有暖意，把承诺包装成冷静的未来警告。
property_alignment: 维德微笑对应冰水；嘴角出现对应水源；表情展开对应溢散；冷酷语意对应低温；讥讽清醒对应冰水透明；程心感受对应接触寒意
context_alignment: 火中难见水刚写他的无助，此处出现的却是冰水式控制，水意象由软弱迅速回到冷硬人格。
narrative_function: 以冷笑确认契约，暗示维德服从并不会消除他给程心带来的危险。
transfer_rule: 用冰水写微笑时，应匹配表情铺展、情感低温、语言中的冷讽、旁观者寒意和流动而非僵硬质感。
failure_boundary: 微笑真诚温暖、爆发式大笑，或人物面无变化时，冰水溢散会错写温度与运动。
