chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 最外层是蓝色的环，看上去十分艳丽，像这只眼睛的睫毛和眼影
sensory_mapping: 海王星最外沿的蓝气层贴着椭圆舒展，像给那只巨眼描上一圈冷艳眼影和睫线。
context_fact: 浅色地幔与深色行星核已经构成眼白和眼球，外层大气提供第三层蓝环。
image_mechanism: 睫毛眼影把抽象行星剖面转成面部细节，艳丽装饰与整颗行星死亡形成冷酷反差。
property_alignment: 蓝环对应眼影；最外层位置对应眼缘；环形边界对应睫线；艳丽颜色对应妆饰；内侧深核对应眼球。
context_alignment: 降维把毁灭过程制成异常精美的平面图案，美感越具体，宇宙打击的无情越突出。
narrative_function: 继续展开巨眼框架，同时给海王星大气、地幔和核心的科学分层提供记忆锚点。
transfer_rule: 延展眼睛意象时，新喻体应精确落到新增层位、颜色和功能，避免只重复“像眼睛”。
failure_boundary: 大气环没有毛发或化妆功能；睫毛与眼影只描述外围位置和艳丽轮廓。
quality_assessment: effective
