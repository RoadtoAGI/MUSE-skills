chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 她们的未来也是空荡荡的
sensory_mapping: 未来空地；前方无人；目标撤空；海面寂静；视野无着
context_fact: 两人在无人默斯肯岛望见空海，星环集团与维德已消失，地球大部分地区也无人居住。
image_mechanism: 眼前空荡海面沿时间轴向前铺开，景物缺失被转写成生活内容缺失；“也”把外部无人区和内在前途直接叠合。
property_alignment: 未来对应前方空间；人生计划对应道路；事业对应建筑物；重要他人对应居民；失去目标对应视野空无；无人地球对应孤独前景；“也”对应海面与时间重叠
context_alignment: 句子紧接只闻旋涡、不见任何物体的夕阳海面，空不是抽象套语，而由现场地貌向两人的生活延伸。
narrative_function: 将时代余波收进人物前途，为她们选择冬眠跳过当前时代建立动机。
transfer_rule: 以空旷空间写未来时，应先在场景中建立可见空地，并明确人物失去哪些目标、关系或行动路径，使空间缺物对应生活缺项。
failure_boundary: 人物已有清晰计划、稳定共同体和迫切任务，或场景本身繁密热闹时，空荡未来会与事实不合。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 程心与AA在星环事业覆灭、旧友消失后没有明确生活方向、关系归属或可投入的目标
vehicle: 一片没有人、物、道路或声响的空旷空间，向前望去找不到可抵达之物
ground: 未来时间对应前方空间；目标对应空间中的物体；同伴与事业对应居民建筑；失去方向对应无道路；未知生活对应空视野；孤独对应无人声
