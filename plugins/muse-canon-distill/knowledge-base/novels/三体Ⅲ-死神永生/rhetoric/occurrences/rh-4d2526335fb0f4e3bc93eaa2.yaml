chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 大厅中像乌云消散般亮起来
sensory_mapping: 黑云退场；室内转亮；压顶松开；光线回流；风暴过后
context_fact: 自卫队已放下反物质弹链并接受停止战争的命令，随后全体无声退出大厅。
image_mechanism: 并未必改变的物理灯光随黑色人群撤离而主观升亮，武装密度被体验成遮光云层；最后一人出门等于云口打开。
property_alignment: 黑制服群体对应乌云；大厅压迫对应云下阴影；人员散去对应云散；视野空出对应天空开；窒息缓解对应空气清朗；战争威胁对应风暴；停战对应放晴
context_alignment: 前文力量凝为黑色巨轮，此处黑色实体离开后化为可消散的云，显示不可阻挡的战争机器已经解除。
narrative_function: 用一瞬主观明暗完成停战后的释压，并把大厅从军事集会地还原为实验空间。
transfer_rule: 以乌云消散写群体离场时，应有深色密集主体、此前持续压迫、离开后空间和人物呼吸明显松开，并形成从阴到明的感受变化。
failure_boundary: 离场者衣着明亮且气氛友善、危机仍未解除，或空间因停电反而变暗时，乌云散去会制造虚假释然。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 武装自卫队离开实验大厅后，群体造成的黑暗压迫感迅速解除，空间在程心感受中恢复轻松明亮
vehicle: 遮蔽天空的厚重乌云分散退去，压暗的地面重新得到光照，空气和视野同时开阔
ground: 黑衣战士对应乌云；群体压迫对应阴暗；人员离开对应云层消散；心理放松对应光线恢复；大厅空间对应云下天空；危机解除对应天气转晴
