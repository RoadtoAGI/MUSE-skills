chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 黑暗森林理论已成为人类历史的一个大背景
sensory_mapping: 六十年历史像连续上演的戏，黑暗森林是一块深色巨幕，威慑、移民和广播都在幕前发生。
context_fact: 理论自威慑纪元起广为接受，但学术界始终争论其证据，广播纪元又出现大规模质疑。
image_mechanism: 背景把理论从单一论点扩展成历史场域，它可以被台前争论暂时忽略，却仍包围所有制度选择。
property_alignment: 理论长期影响对应常驻布景；政治事件对应台前表演；公众习以为常对应背景化；危机色调对应暗幕颜色。
context_alignment: 本节标题宣称最后质疑，背景喻体说明质疑者并非从未生活在该理论下，而是在共同幕布前重新解释证据。
narrative_function: 用一句定位六十年思想史，随后三个疑点便成为试图拆除或重画这块背景的论证。
transfer_rule: 观念如历史背景时，应写清持续时段、覆盖事件、淡出注意的方式和它如何改变前景解释。
failure_boundary: 理论会主动影响决策并被争辩，不像布景完全静止；背景也不表示所有历史都由它决定。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 六十余年来黑暗森林理论持续影响人类政治、社会心理和事件解释的基础环境
vehicle: 舞台后方覆盖大面积、长期不移动的布景，为台前每场表演提供共同空间与色调
ground: 长期存在；覆盖广泛；不总处于注意中心；持续规定前景事件的意义与氛围
