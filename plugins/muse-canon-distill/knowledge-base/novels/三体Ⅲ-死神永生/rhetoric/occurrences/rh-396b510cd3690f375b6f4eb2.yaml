chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 小的只有几米高，看上去像一枚放大的炮弹
sensory_mapping: 放大弹头；尖锥前端；短粗金属体；竖立弹丸；冷硬流线
context_fact: 未来穿梭机大小差异很大，最小型号仅数米却能飞出地球引力井。
image_mechanism: 飞船的舷窗和复杂设备从远处消失，壳体被压成一枚大弹丸；小尺寸与直冲太空的性能由炮弹形态同时传达。
property_alignment: 小穿梭机对应放大炮弹；头锥对应弹头；流线机身对应弹体；金属外壳对应弹壳；垂直起飞对应发射；高速升空对应弹道飞行
context_alignment: 发射港正陷入逃亡恐慌，炮弹外形使救生交通工具暗含武器般的危险和速度。
narrative_function: 给陌生小型穿梭机一个清楚尺度与轮廓，突出其体积小却能入轨的反差。
transfer_rule: 用炮弹写小型飞行器时，应匹配尖头、轴对称流线、金属壳、发射姿态和高速直向用途。
failure_boundary: 飞行器翼展宽大、外形方钝、多舱拼接或缓慢悬浮时，炮弹会错写气动形态。
