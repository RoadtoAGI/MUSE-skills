chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 各种尺寸的窗口从所有方向涌现。像彩色的雪崩，很快埋住了原有的几个显示太空工程实时画面的大窗口
sensory_mapping: 彩色窗口雪块；四面涌落；层层覆盖；屏幕被埋；视觉洪流
context_fact: 程心和AA谈公司未来时，黑暗森林打击传闻引发全媒体突发信息，系统同时生成大量窗口。
image_mechanism: 轻薄虚拟界面突然获得雪块体积和重量，从空间各处塌落叠压；原本稳定的大窗口像地标被覆盖，人站在信息雪层下反而看不清事件。
property_alignment: 信息窗口对应雪块；系统大量推送对应积雪崩塌；多方向出现对应雪流扩散；原界面对应被埋地物；用户注意对应受困者；信息过载对应掩埋窒息；彩色内容对应异色雪层
context_alignment: 未来界面真实悬浮在室内，窗口具有空间方位和遮挡关系，因此雪崩的体积覆盖不是抽象修饰。
narrative_function: 把信息量突增转成灾害事件，显示传播速度越快，人越难辨认真相。
transfer_rule: 用雪崩写界面过载时，应有积累后突发、数量高速增长、空间覆盖、旧信息被埋和接收者行动受阻。
failure_boundary: 窗口按顺序少量出现、自动分类且不遮挡核心内容时，雪崩会夸大混乱。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 突发事件触发大量彩色信息窗口同时弹出、快速叠加，遮住原有界面并淹没使用者注意力
vehicle: 高山积雪大面积崩落，无数雪块从上方和四周高速涌下，把原有地物瞬间掩埋
ground: 窗口数量暴增对应雪体崩落；多方向涌现对应雪流包围；彩色界面对应混杂雪块；覆盖旧窗口对应掩埋地物；信息冲击对应雪崩冲力
