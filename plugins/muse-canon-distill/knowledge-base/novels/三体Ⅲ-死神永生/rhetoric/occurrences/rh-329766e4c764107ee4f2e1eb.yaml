chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: simile
quote: 像漆黑海面上升起的磷火
sensory_mapping: 黑海无边；磷光浮起；一点冷亮；暗中有序；微火漂移
context_fact: 歌者认为低熵体的熵下降、有序度上升构成高于乐趣的生存意义。
image_mechanism: 在黑翼压下的全域暗面上，生命不被写成炽烈火焰，而是从海面自行浮出的冷磷光；其微弱尺度保留局部秩序相对宇宙的有限性。
property_alignment: 高熵背景对应黑海；低熵生命对应磷火；秩序增加对应发光；局部性对应小光斑；自组织对应自发升起；脆弱延续对应磷光易散；意义对应黑暗中可辨光
context_alignment: 歌者以清理其他低熵世界维护自身火光，磷火的美与脆弱同时说明这一文明为何把生存置于一切之上。
narrative_function: 为冷酷宇宙观保留一幅微小审美核心，使“意义”既崇高又自限。
transfer_rule: 用暗海磷火写局部秩序时，应突出背景广暗、主体微小自发、冷光可见和随时可能熄灭的尺度反差。
failure_boundary: 主体拥有压倒宇宙的强光、秩序扩张遍及全域，或背景本身明亮稳定时，磷火会错误弱化或失去对比。
