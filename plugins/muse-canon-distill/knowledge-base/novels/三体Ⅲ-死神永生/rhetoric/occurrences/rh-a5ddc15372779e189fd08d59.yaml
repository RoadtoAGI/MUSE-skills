tenor: 智慧文明从母星走向宇宙后，其行动范围、技术能力与责任尺度随认知边界扩张
vehicle: 一个实体身体能够随思想覆盖的范围同步长大，观念越辽阔，体量便越庞大
ground: 尺度能够增长；内在认知决定外在边界；思想扩张先于行动扩张；最终二者相称；大尺度带来相应影响力与责任
