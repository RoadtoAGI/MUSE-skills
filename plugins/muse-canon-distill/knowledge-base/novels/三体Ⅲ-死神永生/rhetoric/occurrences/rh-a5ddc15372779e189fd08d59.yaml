chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 对于智慧文明来说，它们最后总变得和自己的思想一样大
sensory_mapping: 文明从摇篮站起，思想先伸向星海，随后飞船、选择与责任也沿这张心智地图膨胀到宇宙大小。
context_fact: 程心回顾文明由母星觉醒、飞行并最终与宇宙命运相连的历程。
image_mechanism: 把无形思想赋予空间尺寸，再让文明实体追上这一尺寸，构成认知疆域推动生存疆域的生长模型。
property_alignment: 思想边界对应文明体量；认识宇宙对应走入宇宙；技术扩张对应身体长大；责任扩大对应体量增加；终极问题对应宇宙尺寸。
context_alignment: 叙述位于程心责任阶梯顶峰，她个人经历被视作文明历程，大小意象同时收束个人与物种。
narrative_function: 用一句格言总结三部曲从地球危机到宇宙责任的尺度递进。
transfer_rule: 抽象思想写成尺寸时，应展示认知如何经由技术、行动和责任逐级转换为真实影响范围。
failure_boundary: 思想辽阔的文明未必拥有同等技术或道德责任，文明也不会物理膨胀到宇宙大小。
