chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 将成为已经在迷途中的人们眼前的又一团迷雾
sensory_mapping: 人类已在黑森林岔路迷失，程心圣母像一团白雾挡住前路，祈祷者只能在雾中继续绕圈。
context_fact: 程心认为自己成了危险文化符号，崇拜会让公众以母爱神话逃避威慑失败和现实求生问题。
image_mechanism: 迷雾把文化符号的认知危害转成视觉遮挡，程心选择消失也因而像主动移除路前障碍。
property_alignment: 公众错误方向对应迷途；圣母崇拜对应新雾；理性判断受阻对应视线遮蔽；自杀责任感对应试图散雾。
context_alignment: 宗教段落充满云雾中的智子和星际祈祷，此处雾从神圣背景转成认知障碍，程心拒绝同样被云端神化。
narrative_function: 给程心第二次自杀决定提供公共伦理动机，而非仅延续个人抑郁。
transfer_rule: 观念如迷雾时，应说明行路目标、既有迷失、新增遮挡和人物试图恢复视野的动作。
failure_boundary: 程心是否消失未必能纠正公众，崇拜也含真实同情；迷雾是她的自责判断，不是已证效果。
