quote: 掩体计划——地球文明的方舟
sensory_mapping: 文明登舟；太阳洪灾；巨城船舱；旧地沉没；灾后续航
context_fact: 模型预测太阳打击将摧毁类地行星，计划建设约五十座太空城容纳预计六至八亿人口。
image_mechanism: 行星级工程被压缩为一艘灾前船只：建设、装载、遮蔽、灾后漂航形成完整救生链，使技术清单获得文明存亡的单一轮廓。
property_alignment: 掩体工程对应造方舟；太空城群对应船体舱室；移民人口对应载荷生命；太阳爆发对应洪水；地球对应被淹陆地；四巨行星对应护航屏障；星云生存对应洪后航行；文明延续对应物种保存
context_alignment: 计划要求救下几乎全部人类而非少数逃亡者，方舟的“保存完整生命共同体”属性准确区别它与被否决的小规模星际逃亡。
narrative_function: 为技术报告提供总意象，先确立掩体计划作为文明整体救生工程的价值重量。
transfer_rule: 用方舟写灾难工程时，应有可预见的全域灾变、有限建造窗口、群体装载、封闭庇护和灾后延续能力。
failure_boundary: 项目只救少数特权者、灾难局部可原地恢复，或载具无法维持灾后生存时，方舟会虚构普遍救赎。
