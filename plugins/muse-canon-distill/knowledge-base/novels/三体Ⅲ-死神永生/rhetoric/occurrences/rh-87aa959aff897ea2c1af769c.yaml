quote: 因为只有在这个选择中，人是大写的
sensory_mapping: 大写的人；字母挺立；主体升格；尊严显字；选择落笔
context_fact: 三条生路中，掩体和黑域以安全为中心，只有光速飞船保留走向星空的可能，却已被法律禁止。
image_mechanism: 复杂价值论被压成排版差异：同一个“人”若只求活命便保持普通字形，选择自由远航时在精神上被放大、挺立成标题。
property_alignment: 人类对应文字“人”；被动生存对应小写；自主探索对应大写；尊严对应字号；光速飞船对应大写操作；文明身份对应专名；承担风险对应笔画加重
context_alignment: 维德追求“不择手段前进”，程心则以人的尊严限制手段；大写人是二人共同理想也是后来冲突的伦理分界。
narrative_function: 用极短回答揭示程心支持光速飞船的价值核心，并让维德确认双方目标相同。
transfer_rule: 用大写写主体尊严时，应有同一群体在被动工具与自主行动者之间的明确差别，并落实于具体选择。
failure_boundary: 选择只服务权力扩张、把多数人当工具，或没有提升主体自由时，“大写”会沦为自我美化。
