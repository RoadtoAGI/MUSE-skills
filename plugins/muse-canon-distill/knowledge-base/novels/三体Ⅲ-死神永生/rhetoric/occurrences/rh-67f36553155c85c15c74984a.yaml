chapter: 【危机纪元4年，云天明】
figure_type: metaphor
quote: 生活是属于他这样的人的。至于自己这样的，只能被生活所抛弃
sensory_mapping: 抽象生活成为有门槛的领地或主人，胡文站在门内，云天明被一只手推到门外。
context_fact: 胡文把云天明旧创意做成成功企业并付他三百万元，云天明自认始终未将想法付诸行动。
image_mechanism: 属于与抛弃构成不对称主体关系：生活主动选择谁配拥有它，云天明把自身失败解释成遭外部世界退回。
property_alignment: 胡文实干成功对应被生活接纳；云天明不行动对应失去成员资格；临终孤独对应被抛到共同体外。
context_alignment: 钱突然到手仍不能救命，归属喻体解释为何物质补偿没有恢复其生命感，反而确认缺席。
narrative_function: 概括两位同学的行动差异，强化主人公自我放逐并推动他把钱转成赠礼。
transfer_rule: 人格化生活时，应由参与、反馈和退出的具体事件支撑其接纳机制；还要辨明这是人物自我判断而非客观裁决。
failure_boundary: 若云天明仍积极创造或被现实持续回报，抛弃判断会自相矛盾；喻体也不能证明被动处境全由性格造成。
quality_assessment: effective
confidence: 0.95
review_status: reviewed
tenor: 行动者能参与现实并取得成果、云天明则觉得自己被排除在有意义人生之外
vehicle: 生活像有归属选择和意志的共同体，接纳实干者并把无行动者逐出
ground: 参与能力决定谁能留在系统中；失去行动与成果者体验到被动分离和无归属
