chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 人类社会倒退了如此长的距离，一只脚甚至已经踏进了中世纪
sensory_mapping: 人类身体背向未来快速倒行，一只脚已踩进中世纪门内，另一只还拖在残余现代设施上。
context_fact: 澳大利亚出现极权、政教合一和石头战争，信息与重型装备消失。
image_mechanism: 身体步伐把不同领域的制度退化统一成历史空间位移，一脚内一脚外保留转型未完成状态。
property_alignment: 现代成果丧失对应倒退；半年剧变对应长距离快退；政教合一对应中世纪门内；残存设施对应另一脚在现代。
context_alignment: 人物醒来不信现实，脚步图像让数世纪倒退压到每日身体经验。
narrative_function: 总括移民社会的文明降级，并为依赖三体舰队的反常希望提供背景。
transfer_rule: 历史退化写成步行时，应标明方向、跨越尺度、门槛事件和仍未越界部分。
failure_boundary: 中世纪并非单一黑暗状态，现代危机也有独特技术条件；不能把所有专制等同一个时代。
