figure_type: analogy
quote: 星光从对面的裂缝透进来，像透过破房子的房顶看夜空一样
sensory_mapping: 黑屋内侧；顶上裂口；洞外星点；细光漏入；废墟仰望
context_fact: 太空艇驶入城壳裂缝后关闭探照灯，废城内部黑暗，另一侧破口直接连通太空。
image_mechanism: 巨型太空城的封闭壳体缩为一间破屋，宇宙从包围建筑的外部环境转成屋顶洞口里的一小片夜空，空间尺度瞬间可居住也更凄凉。
property_alignment: 城壳对应房顶；结构破损对应瓦片缺失；对面裂缝对应屋顶洞；内部暗场对应无灯房间；星空对应夜空；漏光对应洞口星光；艇中观察对应屋内仰望
context_alignment: 前文废城像搁浅鲸尸，此处视点已进入其内部；破房模型准确解释从巨大封闭结构内部看宇宙的陌生方向。
narrative_function: 校准城内外空间关系，并把科学城废墟转成带有人类弃居痕迹的鬼屋。
transfer_rule: 用破屋解释壳体内视野时，应有包围观察者的结构、局部开口、内暗外亮及从洞口看见远方天空的明确视线。
failure_boundary: 观察者位于建筑外部、外壳透明、开口占满整个视野或内部仍灯火通明时，屋顶漏星的视点关系不成立。
quality_assessment: effective
