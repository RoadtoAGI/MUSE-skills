quote: 断了的骨头长好后，愈合的断裂处长得比原来还粗，这在医学上叫超量恢复
sensory_mapping: 三体历史的缺口化成断骨，文化输入像愈合信号，原先最薄弱处长出异常粗大的新骨。
context_fact: 弗雷斯以骨科医生经验发问：三体过去缺少的东西是否已超量恢复、程度无人知道。
image_mechanism: 医学修复给文明价值变化提供过冲模型，既解释技术爆炸，也保留恢复到何种程度的不确定。
property_alignment: 价值匮乏对应骨折缺损；人类文化刺激对应愈合机会；思想变化对应骨痂增生；未知过度结果对应超量恢复。
context_alignment: 类比来自说话者真实专业，不是万能文明定律；他用一段身体常识补足程心对三体变化的盲区。
narrative_function: 提出三体吸收人类文化后可能比人类更极端的新风险，为后续未知技术与价值观埋伏。
transfer_rule: 用生物补偿类比社会变化时，应对应原缺损、修复刺激、过冲部位，并保留跨尺度不确定。
failure_boundary: 文明没有统一生理稳态，价值与技术也不按骨愈合定律增长；这是警示性模型而非预测证据。
