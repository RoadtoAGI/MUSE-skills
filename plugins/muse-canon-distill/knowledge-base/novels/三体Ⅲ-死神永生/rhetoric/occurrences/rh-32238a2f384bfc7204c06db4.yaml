tenor: 三体文明长期匮乏人类所拥有的自由、个体价值等要素后可能出现的过度补偿
vehicle: 断骨愈合时在骨痂处增生，使曾经缺损的部位恢复得比原骨更粗
ground: 先经历明确缺失或损伤；补偿机制在缺口处集中作用；恢复结果可能超过从未受损状态
