chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 一部分浸透了金色的阳光，像二维地球飘逸的长发
sensory_mapping: 冰海蒸成白汽，从地球圆面一侧拖出金亮丝束，像母星在太阳风中扬起最后的长发。
context_fact: 围绕二维地球的巨型雪花被二维太阳照融，水汽受太阳风吹离地球。
image_mechanism: 长发把流体尾迹接到被称为“她”的地球身体上，死亡天体由剖面图重新获得柔美生命轮廓。
property_alignment: 地球圆面对应头部；白色水汽对应发丝；太阳风对应吹发之风；金光对应发色光泽；长尾对应飘逸长度。
context_alignment: 花环融成头发，葬仪装饰转为母星身体的一部分，美丽仍由毁灭过程生成。
narrative_function: 在地球冰环消失时保留一个短暂动态形象，并以女性化母星加深告别情感。
transfer_rule: 天体尾迹比作长发时，应建立头部锚点、丝状材质、流动方向、光色和人物化语境。
failure_boundary: 水汽不是毛发，地球也没有身体或性别；长发只描述尾迹形状与母星拟人感。
