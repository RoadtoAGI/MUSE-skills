chapter: 【威慑纪元62年11月28日16:00至16:17，威慑控制中心】
figure_type: simile
quote: 像坟墓一样简洁
sensory_mapping: 四十五千米深处的白色门厅褪去家具和色彩，控制中心成为埋葬一个活人的地下墓室。
context_fact: 罗辑五十四年独居深地，唯一职责是随时启动两个世界的毁灭，中心保持全白空旷。
image_mechanism: 简洁从审美词翻转为生存删减：坟墓只保留容纳与封闭，正对应执剑人把个人生活压缩到一个开关。
property_alignment: 地下深埋对应墓穴位置；空无装饰对应墓室简洁；长期独居对应与世隔绝；毁灭职责对应死亡中心。
context_alignment: 这是罗辑本人提出的设计原则，显示战士身份如何塑造空间；程心随后试图恢复生活气息，形成角色差异。
narrative_function: 一语界定执剑人生存代价，并让控制中心成为威慑死亡逻辑的物质化容器。
transfer_rule: 空间如坟墓应由深度、封闭、功能删减和死亡关系共同支撑；简洁必须带出生活被清空的代价。
failure_boundary: 空间充满社交、自然光和日常装饰时，墓室语义不成立；一般极简设计也不必然意味着死亡。
