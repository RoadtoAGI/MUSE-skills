tenor: 罗辑要求的威慑控制中心内部设计与生活状态
vehicle: 只容纳死亡主体、没有装饰与日常功能的封闭坟墓
ground: 空间极度空白、封闭且删去生活痕迹；入住者与外界隔绝并长期面对死亡
