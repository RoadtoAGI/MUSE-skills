figure_type: simile
quote: A.I.宣布的启动更像是停机，因为周围突然安静下来
sensory_mapping: A.I.报出启动，舱内却像总电源被切断，熟悉嗡鸣一层层退尽，只剩持续寂静。
context_fact: 曲率驱动以空间变化推进，不依赖聚变喷流；引擎启动后星环号开始脱离冥王星。
image_mechanism: 用停机经验反写启动，听觉空缺凸显新技术工作机制与传统发动机完全不同。
property_alignment: 聚变堆关闭对应停机；嗡声消失对应静默；无新噪音对应机器未动错觉；实际加速对应关键反转。
context_alignment: 在人类最宏大的逃生技术真正运转时，场景没有轰鸣壮举，只有文明熄灭后的同一种安静。
narrative_function: 以感官反差宣布曲率飞船成功存在，并让逃生高潮保持冷静、陌生。
transfer_rule: 启动比作停机时，应明确旧系统关闭、新系统无声、实际运动证据和读者常识冲突。
failure_boundary: 飞船没有整体停机，曲率引擎确已运行；相似只来自声音与传统机械反馈。
quality_assessment: exemplary
