chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 昔日的恶魔变成了拯救天使
sensory_mapping: 三体舰队原有的黑色魔影被地面祈盼覆上白翼，减速火焰像天使从夜空下降的光。
context_fact: 社会崩溃后，人们只相信智子关于舰队会带来舒适生活的承诺。
image_mechanism: 恶魔与天使共享超自然强力，只翻转道德角色，揭示改变的不是舰队，而是人类绝境中的解释。
property_alignment: 旧入侵威胁对应恶魔；新救济期待对应天使；舰队接近对应降临；人类祈盼对应等待救赎。
context_alignment: 三体尚未改变控制和威胁手段，极端宗教式转名贴合政教复兴、理性秩序退场的社会。
narrative_function: 把受害者依附占领者的心理倒置压成一句，为智子下一步宣布屠杀制造残酷落差。
transfer_rule: 同一对象由恶魔转天使时，应保持能力不变，明确是利益处境和观察者判断翻转。
failure_boundary: 称谓不证明三体真实善恶转化；若对象确有可核验行为改变，单纯认知反转会低估事实。
quality_assessment: exemplary
