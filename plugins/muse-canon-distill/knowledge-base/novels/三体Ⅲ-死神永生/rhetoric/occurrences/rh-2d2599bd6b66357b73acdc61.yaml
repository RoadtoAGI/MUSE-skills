chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 就像一个飘飞在荆棘丛中的美丽肥皂泡，任何轻微的触碰都会使一切在瞬间破灭
sensory_mapping: 世界文明收缩成虹彩薄膜，周围政治风险长出尖刺；一次决策接触便让整层光彩无声爆裂。
context_fact: 程心被推为执剑人候选者，任何威慑判断失误都可能引发两个世界的毁灭。
image_mechanism: 肥皂泡把繁荣的美与承压能力分开，荆棘又把抽象风险布置成全向尖点，使轻微触碰足以解释灾难尺度。
property_alignment: 现代文明的美好对应泡膜虹彩；威慑平衡脆弱对应薄膜易破；多方危机对应荆棘包围；一次误判对应尖刺轻触。
context_alignment: 程心的母性让她更看见可爱表面，而执剑人职责要求触碰毁灭按钮，美丽泡膜恰把这两种感受压在一起。
narrative_function: 凝缩执剑人选择的核心悖论，为程心因保护欲接受候选铺设感情逻辑。
transfer_rule: 写系统性脆弱时，可把美观表层、承压薄度、危险分布和触发阈值分别配给同一物象。
failure_boundary: 若系统能局部受损后修复、危险只来自单一可控方向，瞬间整体破灭与荆棘包围会夸大机制。
