chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 宇宙规律是最可怕的武器，当然也是最有效的防御手段
sensory_mapping: 维度和光速不再是战场背景，而像被高等文明从宇宙骨架上拆下，制成炮弹与盾墙。
context_fact: 降维用于攻击，降低光速用于防御；太阳系遭二向箔，黑域则以慢光速求安全。
image_mechanism: 武器隐喻翻转规律的角色：规则原本限定所有参与者，如今参与者反过来改写规则打击对方。
property_alignment: 降维对应弹药；慢光速对应盾；基础规律对应武器材料；文明部署对应开火设防；宇宙扩散对应持续杀伤。
context_alignment: 从红岸无线电到规律武器，战争技术一路把环境本身纳入武器，最终战场与武器不可区分。
narrative_function: 给“真正星际战争”下核心定义，并把太阳系毁灭置于更大宇宙生态中。
transfer_rule: 规则比作武器时，应说明谁能改写、如何部署、攻击对象、防御机制、作用尺度和环境代价。
failure_boundary: 规律并非可手持物件，高等文明也可能只触发局部效应而非随意改写全部物理；武器强调用途。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 高等文明改变空间维度、真空光速等基础物理规律来毁灭敌人或封闭自身的技术
vehicle: 可由交战者操控、对目标施加毁伤或形成护盾的进攻武器和防御装备
ground: 被文明有意部署；能改变敌我生存条件；作用范围巨大；进攻防御皆可；后果持续扩散；难以逆转；决定战争胜负
