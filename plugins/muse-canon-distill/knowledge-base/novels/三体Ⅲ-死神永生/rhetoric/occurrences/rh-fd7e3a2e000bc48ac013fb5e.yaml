chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 光度很强，像几根蜿蜒曲折的灯丝
sensory_mapping: 灰色管团中两三根管子骤然白亮，像巨型灯泡的曲折钨丝，光芒洒到下方麦穗。
context_fact: 发光管道轮流亮起，露出部分照亮农田，成为作物生长所需的阳光。
image_mechanism: 灯丝同时解释线形、强光和人工照明，微小器件被放大为穹顶结构，使异星阳光保持工业来源。
property_alignment: 发光管对应灯丝；曲折路径对应盘丝；强光对应通电炽亮；麦田照明对应灯泡功能；暗管对应未通电丝。
context_alignment: 麦田、草帽与铁锹极其乡土，头顶灯丝般工程光源揭示田园被置于完全异质的技术环境。
narrative_function: 在乱麻底图中标出可追踪亮线，并为光影转换和云中太阳联想提供光源。
transfer_rule: 发光线体如灯丝时，应匹配自发光、弯曲形态、背景反差、轮换状态和照明对象。
failure_boundary: 管道未必靠电阻加热发光，也不在灯泡内；灯丝模型不解释其真实工程用途。
