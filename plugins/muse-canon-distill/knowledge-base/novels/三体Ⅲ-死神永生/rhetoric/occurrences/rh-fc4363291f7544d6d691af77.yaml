chapter: 【时间开始后约170亿年，我们的星星】
figure_type: analogy
quote: 使自己这粒沙尘四处飘飞的，是怎样的天风；把自己这片小叶送向远方的，是怎样的大河
sensory_mapping: 她先是一粒被天风卷离地面的尘，又是一片落入大河的叶，时代的气流与水势推着她跨过文明和千万年。
context_fact: 程心经历执剑、太阳系毁灭、光速逃亡与低光速时间跳跃，最终错过云天明。
image_mechanism: 沙尘—天风和小叶—大河构成双尺度动力图，重复小主体与大介质的比例，解释她为何终于放弃自责和控制。
property_alignment: 程心对应沙尘与叶；宇宙历史对应天风大河；跨时代漂流对应飘飞远送；个人无力对应轻小；彻底放弃对应任介质穿过。
context_alignment: 程心长期把灾难归于个人责任，此处喻体把因果重新放回远大于她的历史力量，完成心理松手。
narrative_function: 收束她的责任创伤，让痛哭从失恋扩大为对一生被大尺度力量搬运的领悟。
transfer_rule: 个人受时代支配可用微物—巨流模型，但需给出长期轨迹、外力来源、比例失衡和人物停止抵抗的时刻。
failure_boundary: 程心并非完全被动，她的关键决定真实改变历史；风河意象不能抹除个人能动性与责任。
