chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: metaphor
quote: 在这粒种子从母世界起航时
sensory_mapping: 世界母株；星海播种；小粒起航；胚芽封存；远方落点
context_fact: 歌者生活在离开母世界已一万多个时间颗粒的航行单元中，单元带有主核、仓库、长老和清理能力。
image_mechanism: 巨大的星际载体被缩成一粒可播撒之物，母文明则生物化为母株；封闭内部不再只是船舱，而是保存制度与技术基因的胚体。
property_alignment: 母文明对应母株；航行单元对应种子；出发对应脱离母体；星际航线对应传播；成员与设备对应胚体；文化规则对应遗传信息；抵达远方对应落地；文明扩展对应发芽
context_alignment: 歌者文明以低熵生命的延续为最高意义，种子称谓把一艘船的生存直接纳入繁殖逻辑，也解释其携带清理基因的自我理解。
narrative_function: 用一个有繁殖目的的物件交代外星载体性质，使其清理行为同时显出文明扩张背景。
transfer_rule: 用种子写文明载体时，应有可辨母体、离开与传播过程、封装的可复制核心、潜在新环境和延续或繁殖目标。
failure_boundary: 载体只是一次性无人弹药、不携带任何可延续文明结构，或始终绕母世界运行不向外传播时，种子会误写任务。
quality_assessment: effective
