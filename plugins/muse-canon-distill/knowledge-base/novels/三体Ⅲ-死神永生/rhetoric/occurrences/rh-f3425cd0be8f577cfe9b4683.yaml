chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 其中的二维人只能看到周围世界的侧面，在他们眼中，周围的人和事物都是一些长短不一的线段而已。只有当一个二维扁片人从画中飘出来，进入三维空间，再回头看那幅画，才能看到画的全貌。
sensory_mapping: 彩色平面先被压成眼前长短不一的细线，扁片人向纸外飘起后，整幅画忽然在脚下铺开。
context_fact: 褚岩带莫沃维奇和关一帆通过翘曲点进入四维，二人看到飞船各舱室与封闭物内部同时展开。
image_mechanism: 先让读者承担扁片人的视觉缺陷，再把二维到三维的跃迁旋转为三维到四维，使不可经验的多一维获得可递推的观察模型。
property_alignment: 二维侧视线段对应三维日常所见外表；离开画面对应进入四维；看见全画对应三维内外同时展开；维度限制对应遮挡不自知。
context_alignment: 人物已亲眼经历躯体断面和飞船展开，类比把震撼体验压缩成读者能够从纸面想象的升维动作。
narrative_function: 为四维视觉建立基础认知阶梯，支撑后文无限细节和高维空间感的进一步描写。
transfer_rule: 解释不可直接经验的高维现象时，可先降低一维构造同构观察者，逐项对应视野限制、越界动作和新获得的信息。
failure_boundary: 二维画和扁片人是教学模型，真实四维体验还包含无限细节与空间纵深；类比不能推出高维仅是从外面看图画。
quality_assessment: exemplary
