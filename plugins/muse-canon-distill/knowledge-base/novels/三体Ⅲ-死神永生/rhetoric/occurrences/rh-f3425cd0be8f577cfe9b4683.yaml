tenor: 三维人进入四维后第一次看清原本被遮挡的三维世界整体
vehicle: 困在二维画中的扁片人只能见线段，离开画面进入三维后才看见整幅图画
ground: 低维观察者受自身维度限制；对象只呈现截面或侧面；升高一个维度后遮挡解除并出现整体
