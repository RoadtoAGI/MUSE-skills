tenor: 程心推荐云天明后逐渐加深、最终遮蔽内心安宁的罪疚与不祥预感
vehicle: 一缕暗云在海面上持续增厚，最后遮住天空和日光，使整片海域陷入阴暗
ground: 负面情绪从微弱局部逐步扩张；它覆盖原有清明感，使主体难再看到轻松出口
