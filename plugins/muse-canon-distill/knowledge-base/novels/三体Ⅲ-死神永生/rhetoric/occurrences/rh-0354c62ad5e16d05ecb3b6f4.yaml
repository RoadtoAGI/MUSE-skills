quote: 程心的心头总是被阴云笼罩，那阴云开始时只是若隐若现的一缕，后来渐渐浓重，使她的心海难见天日
sensory_mapping: 内心展开成海，最初一丝云影在水面聚集，云层越压越低，最后太阳和水平线同时消失。
context_fact: 瓦季姆死亡让她怀疑PIA阴谋，她每次想到云天明便意识到自己可能剥夺了他的冬眠生机。
image_mechanism: 阴云提供增长过程，心海提供被遮蔽的广阔心理表面；难见天日把罪疚从念头升级为整体意识气候。
property_alignment: 最初不安对应一缕云；反复思考对应云层聚集；罪疚加深对应阴云浓重；内心失去安宁对应海面无日。
context_alignment: 梦中的玫瑰星随后坍缩为黑洞，白日阴云先建立视觉基调，使良心恐惧自然转入噩梦。
narrative_function: 连续显影程心从自我辩解到无法回避责任的过程，并推动她尝试撤回候选推荐。
transfer_rule: 情绪天气应有可追踪的生成速度、覆盖范围和光照后果；阴云适用于威胁尚未落地却持续积聚。
failure_boundary: 瞬间爆发的单一惊吓、迅速解决的疑问或仍占主导的轻松情绪，不足以形成渐浓云层和无日心海。
quality_assessment: exemplary
