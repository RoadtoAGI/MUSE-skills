chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 冰沙心中有一窝冬眠的毒蛇，在等待着苏醒的机会
sensory_mapping: 阴沉外表下盘着一窝冷蛇，继承权决定像升温信号，蛇身开始松动吐信。
context_fact: 国王决定让露珠继位，冰沙随后引入针眼画师并一夜清除王室与大臣。
image_mechanism: 冬眠区别无害与休眠，蛇窝把单一恶念扩成多条互缠计划，苏醒提供政变启动机制。
property_alignment: 潜伏恶意对应冬眠毒蛇；多项阴谋对应一窝；继承受挫对应升温；连环谋杀对应醒蛇咬击。
context_alignment: 狼喻解释本性未改，蛇窝进一步进入内心展示危险如何储存并等待。
narrative_function: 把政变从突然转折改写为长期潜伏的必然爆发，提升童话警示性。
transfer_rule: 潜伏恶意写成冬眠毒物时，应说明数量、静止条件、触发时机、毒性和醒后动作。
failure_boundary: 计划并非生物自动苏醒，冰沙仍主动选择行动；蛇窝不能解释具体政治策略。
