chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 程心感到自己面对着一堵由六块冰冷的岩石构筑的城墙，城墙显露着岁月磨砺的坚硬和粗糙，沉重中透着寒气，后面暗藏杀机
sensory_mapping: 六个人失去血肉温度，化成并排巨石，阴沉目光成为石缝寒气，未说的话与计划藏到墙后。
context_fact: 六人保持公元男性气质、城府很深，以沉默目光劝程心退出执剑人竞选。
image_mechanism: 六块给群体结构精确计数，岩石提供个体材质，城墙再把个体组合成具有防守和伏击功能的整体。
property_alignment: 六名候选对应六块岩石；复杂城府对应墙后不可见；年长经历对应岁月磨砺；强硬人格对应坚硬粗糙；敌意对应暗藏杀机。
context_alignment: 前文未来社会被程心感为柔软，此处公元男人突然以岩墙出现，材质冲突让时代与候选者差异可触。
narrative_function: 在谈话前建立权力压迫和危险预感，也解释程心为何既反感他们又低估其威慑适配性。
transfer_rule: 群体如墙时，应分别写构件数量、材质、组合功能与墙后信息；温度和粗糙度要来自人物可观察特征。
failure_boundary: 成员意见分散、态度开放或意图完全透明时，整堵城墙会抹平差异；杀机只是程心感受，不能当事实。
