tenor: 六名公元男性执剑人候选者共同形成的封闭、难读、强硬且带威胁的群体气场
vehicle: 六块经岁月风化的冰冷岩石砌成重城墙，表面粗硬，墙后隐藏守军和杀机
ground: 每个个体都封闭情绪并拒绝通透；群体并列后形成阻挡，外表坚硬且内部意图不可见
