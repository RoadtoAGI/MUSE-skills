chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 她那已经撕裂的心终于在血泊中平静下来
sensory_mapping: 心理裂口成为真实创面，鲜血铺满胸腔，她的心不再跳撞，只在暗红液体里安静下沉。
context_fact: 她拒绝智子救援，只要求带走AA和弗雷斯，听到直升机远去后闭眼。
image_mechanism: 血泊反转安宁含义：平静通常表示恢复，此处却是重伤后的失血静止，保护朋友的完成带来耗尽。
property_alignment: 连续创伤对应撕裂；强烈悲痛对应流血；朋友获救对应挣扎暂止；留下赴死对应血泊静卧。
context_alignment: 她已生理失明，内在图像却以最强烈血色出现，把外界屠杀转入身体内部。
narrative_function: 收束她对两位朋友的责任，同时显示自我放弃并非释然，而是创伤性静默。
transfer_rule: 受创后的平静写成血泊时，要让安静来自耗竭、给出伤源，并避免误作治愈。
failure_boundary: 心脏没有真实撕裂出血；若人物获得健康释怀或积极行动，血泊会错误暗示濒死。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心承受威慑失败、屠杀真相和送走朋友后重创却暂时安静的情绪
vehicle: 心脏被暴力撕开、流血后浸在自身血泊中，因生命力耗尽而停止挣扎
ground: 伤害严重且不可复原；痛苦已经外溢；平静来自耗竭而非愈合
