chapter: 【公元1453年5月，魔法师之死】
figure_type: metaphor
quote: 皇帝看着那变成一个黑洞的月亮，那是天上的坟墓
sensory_mapping: 月盘失光成为墓穴开口，天空被转成墓地，城市的未来像已经置入其中。
context_fact: 格言称明月照耀时城市不会陷落；此刻月食发生，狄奥伦娜也未能完成刺杀。
image_mechanism: 先由月食外观形成黑洞，再由格言失效把洞赋义为墓穴；天象因此从被观察物变成提前完成的埋葬动作。
property_alignment: 月盘变黑对应墓穴幽暗；明月消失对应保护承诺终止；城市将亡对应坟墓接纳死者。
context_alignment: 中世纪人物以天象理解国运，坟墓意象符合皇帝信念体系，也与第二天帝国灭亡准确衔接。
narrative_function: 把月食、刺杀失败与城陷预感合并为一个垂直死亡标志，封闭神迹希望。
transfer_rule: 天象成为命运喻体时，须有文本内共享预言或仪式赋义；外观变化只提供入口，文化规则决定它承载何种结局。
failure_boundary: 若人物不相信月亮保护城市或月食后局势转好，天上坟墓会沦为作者强加；普通新月也不等同墓穴。
