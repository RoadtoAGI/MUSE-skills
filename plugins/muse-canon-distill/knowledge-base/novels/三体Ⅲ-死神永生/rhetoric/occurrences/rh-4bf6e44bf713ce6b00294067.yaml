tenor: 白Ice被计算窗口包围、预感纸条危险却找不到逃离证明时的焦灼状态
vehicle: 猛兽跌入封闭陷阱，四处冲撞寻找出口却被边界困住
ground: 危险迫近；空间被围合；行动反复无果；本能要求逃脱；力量无法转化为出路
