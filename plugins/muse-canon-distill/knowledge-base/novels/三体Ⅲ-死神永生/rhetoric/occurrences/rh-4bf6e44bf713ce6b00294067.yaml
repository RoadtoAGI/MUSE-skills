chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 焦躁不安，像掉进陷阱的困兽
sensory_mapping: 十几个方程窗口像陷阱围栏竖起，白Ice在中央来回计算，每条曲线都把他赶回原处。
context_fact: 他凭噩梦直觉促使启示号远离纸条，随后独自计算二维跌落的逃逸速度。
image_mechanism: 困兽将信息窗口的视觉包围与认知无出口叠合，焦虑变成身体在边界内冲撞。
property_alignment: 白Ice对应困兽；窗口环绕对应陷阱壁；反复计算对应冲撞；未知解法对应找不到出口；二维危险对应猎捕。
context_alignment: 纸条本身像无害白羽，真正敏锐者却成困兽，反差显示危险只能由行为压力显现。
narrative_function: 在二维化启动前维持人物预警线，并把抽象计算转成紧迫逃生动作。
transfer_rule: 受困思考写成困兽时，应让物理围合、问题边界、反复动作和出口目标同时出现。
failure_boundary: 白Ice仍能理性计算并影响决策，不是纯本能动物；陷阱主要是知识与时间限制。
