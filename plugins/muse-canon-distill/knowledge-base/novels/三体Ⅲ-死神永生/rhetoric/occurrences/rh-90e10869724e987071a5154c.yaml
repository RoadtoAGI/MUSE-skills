quote: 悲伤终于降临
sensory_mapping: 刀伤后的无痛片刻结束，悲伤像终于抵达的阴云落到舱内，AA先哭出声来。
context_fact: L3852已说悲伤尚未袭来；看到地球雪花海洋、想起森林草原旧城后，AA哭泣、程心含泪。
image_mechanism: 降临把情绪延迟写成有路程的到达，与前文“尚未袭来”闭环，精确控制悲痛发生点。
property_alignment: 情绪延迟对应尚在途中；雪花画面对应抵达触发；哭泣对应来客进门；多人沉默对应环境被覆盖。
context_alignment: 人类等待二维平面降临，人物也等待悲伤降临；外部物理终局与内部情绪终局同步。
narrative_function: 兑现伤口类比的延迟痛觉，让景观说明转入简短、克制的哀悼。
transfer_rule: 情绪写成降临者时，应在前文建立缺席或延迟，并用明确感官触发与行为标出到达。
failure_boundary: 悲伤不是外部主体，三人的情绪强度和方式也不同；降临概括共同时间点。
