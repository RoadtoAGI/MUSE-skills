chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 每个方向的映像都有无穷多个，像相对摆放的两面镜子中的场景一样，成长长的一排延伸到无穷远处
sensory_mapping: 太阳、房子和飞船一套套排向黑暗深处，如两镜互照时每一层画面又生出下一层。
context_fact: 小宇宙相对边界彼此连通，人物飞到一端会从另一端回来，光线也因此周期传播。
image_mechanism: 相对镜给周期拓扑的光学结果提供家常模型，重复对象、排列方向和无穷递归全部可直接看见。
property_alignment: 周期光路对应镜间往返；同一物体多像对应反复成像；长列对应镜轴排列；无穷延伸对应递归反射；观察者副本对应镜中自我。
context_alignment: 刚进入时关一帆已用同一现象解释空间，这里拆空背景后镜廊结构更清晰，成为框架的最终视觉兑现。
narrative_function: 在有限一千米空间中制造无穷纵深，并为旧宇宙记忆向新宇宙延续提供形式回声。
transfer_rule: 周期空间借相对镜解释时，应把成像机制、重复方向、对象一致性和无限递归共同写出。
failure_boundary: 小宇宙映像来自周期边界而非镜面反射，亮度和尺度也未必像现实镜廊逐层衰减。
