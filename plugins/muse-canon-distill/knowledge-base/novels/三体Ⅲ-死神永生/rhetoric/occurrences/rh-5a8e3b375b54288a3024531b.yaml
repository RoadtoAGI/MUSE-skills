chapter: 地球文明
figure_type: analogy
quote: 使得两者几乎像一个双星系统，围绕着共同的质心运行
sensory_mapping: 冥王星和卡戎不像主从挂接，而像两颗暗星牵着彼此，绕看不见的中点转圈。
context_fact: 卡戎质量达到冥王星十分之一，足以使冥王星也显著绕共同质心运动。
image_mechanism: 双星提供天体力学同构而非单纯外观，纠正常见行星中心、卫星附属的直觉。
property_alignment: 冥王星与卡戎对应双星两体；质量比接近对应互绕显著；共同质心对应系统中心；周期轨道对应双星运行。
context_alignment: 太阳系正在失去三维结构，冥王星系统在毁灭前仍以精确互绕展示旧宇宙秩序。
narrative_function: 解释卡戎视运动与系统特殊性，并给冥王星天空增加尺度依据。
transfer_rule: 天体系统类比应以质量比、质心位置、轨道关系和观测效果为核心，不只取数量相同。
failure_boundary: 两体不是恒星，发光和形成机制不同；几乎一词限制类比到动力学。
