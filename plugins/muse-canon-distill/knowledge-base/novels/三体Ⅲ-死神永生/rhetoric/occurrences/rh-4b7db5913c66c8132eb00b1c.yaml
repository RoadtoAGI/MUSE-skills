figure_type: simile
quote: 甚至有人猜测是一艘如同木卫二般大小的飞船
sensory_mapping: 他们预想黑暗中驶来一颗改造成船的卫星，船体横跨视野，边缘像木卫二地平线。
context_fact: 发射体引力波极强却无雷达回波，探测小组准备遭遇巨型入侵物。
image_mechanism: 用已知天体直接标尺化未知载具，木卫二不仅给出尺寸，还携带行星级威胁预期。
property_alignment: 设想船体对应卫星球体；信号强度对应天体规模；入侵威胁对应巨大质量；观测不可见对应尚未显出地平线。
context_alignment: 实际来物只有方寸纸片，卫星级预想为尺度反转提供最大落差。
narrative_function: 记录专家合理误判，并为见到纸条后的集体松气制造认知陷阱。
transfer_rule: 未知物尺度借天体标定时，应让信号证据、直径级别、观察预期和威胁推断相互对应。
failure_boundary: 强信号不必来自同等物理体积，实际纸条即反证；木卫二比较只是事前猜测。
