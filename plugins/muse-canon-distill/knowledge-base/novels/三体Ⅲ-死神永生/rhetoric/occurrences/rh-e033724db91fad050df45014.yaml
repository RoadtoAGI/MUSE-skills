chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 亨特其实是一名“反执剑人”
sensory_mapping: 执剑人手指悬在广播键上，亨特的手指悬在熔毁键上，两人隔着星空像镜中相反动作。
context_fact: 亨特手表按钮可触发烧熔弹，在阈值超限时使飞船广播系统永久失效。
image_mechanism: 反字保留职位结构、翻转行动方向，用最短命名呈现同样孤独责任下的功能对称。
property_alignment: 独立裁决对应执剑人权限；手表按钮对应红色开关；销毁系统对应反向操作；阻止广播对应反威慑。
context_alignment: 地球执剑人刚作出不广播选择，深空反执剑人也面对按钮，两条危机线由镜像角色并置。
narrative_function: 快速解释亨特制度位置，并为他与舰长同时按销毁键的冲突赋予结构意义。
transfer_rule: 反某角色命名应保留职责结构和决策尺度，只翻转清晰的目标或动作方向。
failure_boundary: 亨特不能启动威慑、也不代表全人类，权限范围小于执剑人；反称谓不意味价值绝对相反。
quality_assessment: exemplary
