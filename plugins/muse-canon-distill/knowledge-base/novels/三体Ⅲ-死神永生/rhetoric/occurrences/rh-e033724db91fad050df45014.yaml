tenor: 亨特在危险时销毁广播控制器、阻止任何人启动终极威慑的秘密角色
vehicle: 与执剑人占据镜像位置、手握相反开关并执行相反使命的人
ground: 两者都独自判断危险阈值；都控制引力波系统命运；一个负责启动，一个负责不可逆销毁
