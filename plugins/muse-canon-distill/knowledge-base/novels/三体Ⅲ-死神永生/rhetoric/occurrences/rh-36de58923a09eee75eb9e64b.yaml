chapter: 【威慑纪元61年，执剑人】
figure_type: simile
quote: 自己左肩像被猛击一拳
sensory_mapping: 看不见的弹头被替换成拳面，枪击穿透感暂时消失，只留下肩部受力和后退。
context_fact: 未来医疗防护让她中枪没有痛感，但冲击仍把她推靠残壁。
image_mechanism: 拳击分离动量与穿透疼痛，准确表达麻醉条件下只保留的机械感受。
property_alignment: 弹丸冲量对应猛拳；肩部局部受力对应拳击落点；身体后退对应被打推开。
context_alignment: 程心先验证老枪仍能用，喻体让读者理解为何她看见中枪却只感钝击。
narrative_function: 用熟悉体感翻译未来无痛枪伤，保持动作清晰而延迟伤势恐怖。
transfer_rule: 高速伤害借拳击写时，应限定在冲量与钝感，并由麻醉或防护解释缺少穿刺痛。
failure_boundary: 若描写剧烈灼痛、切割感或没有身体位移，猛拳只覆盖部分体验；不能据此判断伤口轻。
