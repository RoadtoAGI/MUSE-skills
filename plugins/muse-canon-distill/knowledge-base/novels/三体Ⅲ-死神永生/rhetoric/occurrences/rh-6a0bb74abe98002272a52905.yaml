chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: metaphor
quote: 这个决断不是用思想做出的，而是深藏在她的基因中，这基因可以一直追溯到四十亿年前，决断在那时已经做出
sensory_mapping: 最早生命把一张保护生存的决定书折入基因链，数十亿年复制传递，直到程心手握开关时从细胞深处展开。
context_fact: 她想象全部生命向自己投来目光，婴儿回到怀中，最终把广播开关扔出并不再犹豫。
image_mechanism: 深藏把本能定位到身体内部，早已做出则把即时决策改写为进化遗嘱，解释倒计时内为何没有理性程序可改变。
property_alignment: 保护生命本能对应预设决议；基因传递对应文件封存复制；四十亿年选择对应早期签署；危机触发对应自动执行；拒绝按键对应决议落实。
context_alignment: 程心一直以母性理解世界，基因决议把个人性格连接到生命史，也说明三体为何准确预测她不会毁灭。
narrative_function: 给关键选择提供人物内部终极因果，同时保留对错判断，把悲剧从犹豫提升为本能与威慑职责冲突。
transfer_rule: 本能如预写决议时，应说明形成史、保存载体、触发条件和绕过意识的表现；不能用基因替代所有人格解释。
failure_boundary: 复杂道德选择并非单一基因直接编码，进化也产生攻击与牺牲行为；此喻体是人物感受，不是遗传学结论。
