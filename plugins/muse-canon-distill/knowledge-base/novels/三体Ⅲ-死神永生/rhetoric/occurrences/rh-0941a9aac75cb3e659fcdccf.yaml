tenor: 戴文长期监看蓝色空间号实时画面后形成的主观在场位置
vehicle: 身体虽在一处，注意、熟悉关系和日常观察却实际居住在另一处空间的人
ground: 持续感知输入建立比本地更强的环境熟悉度；心理定位随注意对象而非肉身位置移动
