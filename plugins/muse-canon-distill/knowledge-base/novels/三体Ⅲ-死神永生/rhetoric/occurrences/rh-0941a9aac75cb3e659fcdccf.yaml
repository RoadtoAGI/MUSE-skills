chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 在你的感觉中，自己更像是身处‘蓝色空间’号而不是‘万有引力’号
sensory_mapping: 实时图像变成一条感官舷梯，戴文的视听与注意沿梯跨船，肉身所在舱室退成背景。
context_fact: 他不停监视目标船内部，对那里的人比对本舰人员更熟，图像中断后出现跨船幻见。
image_mechanism: 身处把注意偏置提升为空间迁居，解释为何画面突然消失会像环境被抽走，并诱发人物位置错置。
property_alignment: 实时连续观看对应感官在场；熟悉目标成员对应社会在场；忽视本舰人员对应本地环境退隐。
context_alignment: 医生用这一模型解释朴义君幻觉，虽未触及真实四维事件，却精确捕捉监视造成的认知偏移。
narrative_function: 给异常现象提供可信心理学误诊，维持悬念并展示远程图像如何重塑空间归属。
transfer_rule: 写媒介造成远程在场时，应给出输入持续性、关系熟悉度和本地注意衰减，说明心理位置怎样迁移。
failure_boundary: 零散观看、对远端陌生或本地互动更强时，身处另一地的判断过度；它也不能排除客观异常。
