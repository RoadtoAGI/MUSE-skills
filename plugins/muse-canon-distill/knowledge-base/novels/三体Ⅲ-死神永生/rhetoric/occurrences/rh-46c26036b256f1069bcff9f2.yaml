chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这束夕阳透进窗里的余晖，投在白墙上如一摊肮脏的血
sensory_mapping: 暖夕光失去光泽和温度，凝成黏稠血液贴墙，圣洁白墙变为案发现场。
context_fact: 云天明误以为程心要把他送去受无尽酷刑，爱慕反转为怨恨，周围景物随之变质。
image_mechanism: 相同余晖在心理滤镜下由温暖变污血，颜色相似提供入口，情绪则改变材质与道德含义。
property_alignment: 夕阳暗红对应血色；墙上光斑对应血摊形状；怨恨死亡想象对应肮脏暴力。
context_alignment: 前文程心曾是太阳，此刻她的使命让光源反成血迹，完成爱情意象的极端反转。
narrative_function: 让误解即时污染视觉世界，以环境色彩外化主人公心理崩坏。
transfer_rule: 光斑转液体时，应由颜色、边界和附着平面支撑；材质情感须来自人物刚发生的认知变化。
failure_boundary: 正午白光、规则光束或人物仍感温暖时，肮脏血摊会失配；它只反映主观视野。
