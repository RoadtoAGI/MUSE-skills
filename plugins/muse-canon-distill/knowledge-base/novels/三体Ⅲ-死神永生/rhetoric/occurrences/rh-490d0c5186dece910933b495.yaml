chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 这里处于夜之海的最深处，潮湿阴森，像一个沉睡着的冷血巨怪的腹腔
sensory_mapping: 地堡墙壁变成冷湿内脏，两个人和火把落进巨兽肚腹，微光随呼吸般的阴影摇动。
context_fact: 地堡是王子秘密杀人的工作间，墙上将挂满被魔画吞掉的人。
image_mechanism: 腹腔把地下空间从容器变成活物内部，冷血与沉睡令静止环境保留随时苏醒的危险。
property_alignment: 地下深处对应身体内部；潮湿对应腹腔黏湿；阴冷对应冷血；地堡包围对应巨怪吞入。
context_alignment: 前文大地浸墨，此处进一步潜入其身体深处，使政变像在王国腹内秘密消化受害者。
narrative_function: 建立童话恐怖场域，并把画像杀人写成吞噬机制的空间前奏。
transfer_rule: 地下室比作兽腹时，应匹配深度、湿度、温度、包围感和潜在吞噬功能。
failure_boundary: 地堡不会呼吸或消化，冷血巨怪也未实际存在；不得据此推断空间会主动攻击。
