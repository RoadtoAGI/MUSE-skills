chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 像你，公主，都像水晶一样美丽
sensory_mapping: 透明小珠；晶面反光；清澈亮点；精致轮廓；易碎硬光
context_fact: 长帆指给公主看火把旁草叶上的露珠，公主问它是否像自己。
image_mechanism: 草叶水珠和少女面容被同一束火光穿透，分别折成两颗小水晶；名字的偶合因共同的清亮外观获得可见形体。
property_alignment: 草叶露珠对应水晶珠；公主容貌对应水晶纯净；火光闪烁对应晶面折射；透明质地对应目光清澈；小巧精致对应宝石尺度；潜在脆弱对应易碎
context_alignment: 童话用最朴素的宝石赞美展开关系，紧接着才揭露阳光会使露珠消失，让美丽先于死亡进入。
narrative_function: 建立公主与露珠的第一层外观联系，为下一层生命短暂的身份暗喻铺垫。
transfer_rule: 用水晶联结人物与自然小物时，应具备透明度、折光、精致尺度和人物处境中的脆弱暗示。
failure_boundary: 对象浑浊粗糙、光线全无，或人物美感来自温暖柔软而非清亮时，水晶会造成冷硬错觉。
