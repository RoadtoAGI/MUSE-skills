chapter: 【威慑纪元62年，奥尔特星云外，“万有引力”号】
figure_type: simile
quote: 太阳已经变成了一颗舰尾方向的普通星星，与其他的星星一样，失去了真实的存在感，仿佛是遥远虚空中的幻觉
sensory_mapping: 太阳的圆面和热量被抽走，只剩舰尾一颗无深度光点，像贴在无底黑幕上的意识残像。
context_fact: 飞船进入真正外太空，所有方向都如深渊，除水滴外没有感官可确认的近处实体。
image_mechanism: 先把太阳降格为普通星星，再抽去真实感，幻觉因此建立在尺度、温度和独特性的连续丧失上。
property_alignment: 太阳缩成星点对应幻象缺少体积；热源不可感对应无触觉证据；混入群星对应身份消隐；不可抵达对应遥远虚空。
context_alignment: 太阳本是地球归属和航行源点，其幻化标志飞船跨出家园的感官边界，也衬出水滴成为唯一实体安慰。
narrative_function: 建立深空失实感，为船员心理异常和两舰与地球通信切断提供空间基调。
transfer_rule: 把熟悉天体写成幻觉时，应逐项移除其尺度、热量或参照作用，让存在感丧失有可感过程。
failure_boundary: 太阳仍有可辨圆面、强光热效应或被用于近距导航时，幻觉的无实体感不成立；镜面反射的水滴则是字面光学现象。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 越过奥尔特星云后，船员视野中缩小为普通星点的太阳及其心理存在感
vehicle: 在遥远黑暗中没有实体支撑、只被意识投射出来的一点幻象
ground: 视觉信号细小且无法提供尺度与触感；熟悉天体失去独特性，难再被感为可抵达的真实来源
