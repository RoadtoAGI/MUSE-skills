chapter: 【时间之外，我们的宇宙】
figure_type: simile
quote: 那身点缀着小红花的华丽和服像移动的花簇
sensory_mapping: 远处先移动来一团红花，待靠近才显出和服与人形，静止田园因这簇颜色有了春光。
context_fact: 小宇宙刚由太阳照亮，智子作为其管理者首次出现，穿日本和服迎接二人。
image_mechanism: 花簇把服装纹样从平面装饰放大为整体移动色块，人物出场先由颜色和季节感抵达。
property_alignment: 和服红花对应花瓣；华丽布面对应密集花簇；步行对应花簇移动；红色点缀对应春色；衣摆体量对应簇团轮廓。
context_alignment: 智子曾以和服、茶道塑造地球文化形象，此刻花簇延续她精心设计的迎客外观。
narrative_function: 在仅有两人的封闭世界中以鲜艳动态宣布第三个熟悉角色到来。
transfer_rule: 花纹服装比作花簇时，应从局部图案推到整体色块、运动轮廓和场景季节变化。
failure_boundary: 花朵是织物图案，智子仍有清晰人形与自主动作；并非植物实体移动。
