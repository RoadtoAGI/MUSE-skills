chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 自从那酷刑般的化疗停止以后
sensory_mapping: 医院治疗室叠上映照刑讯场，药物反应成为每轮施刑留下的疼痛和虚弱。
context_fact: 癌症已无法治愈，停止化疗后云天明反而感觉好些，甚至产生新生错觉。
image_mechanism: 酷刑撤去后的松弛解释为何停止治疗会像获救；医疗的救命目的与实际只剩折磨的效果发生反转。
property_alignment: 化疗副作用对应酷刑疼痛；疗程重复对应多轮施刑；患者被动承受对应受刑者失去控制。
context_alignment: 治疗已不能改变结局，酷刑喻体准确落在收益归零后仍持续的身体代价，而非否定所有治疗。
narrative_function: 说明主人公为何把停治体验为新生，并强化安乐选择的现实压力。
transfer_rule: 医疗过程借酷刑写时，应先明确疗效与代价已失衡，并用具体副作用支撑重复痛苦和失控，限定在该病例阶段。
failure_boundary: 若治疗有明确治愈收益、痛苦可控或患者主动选择且随时能停，酷刑的无目的强迫性会误导。
