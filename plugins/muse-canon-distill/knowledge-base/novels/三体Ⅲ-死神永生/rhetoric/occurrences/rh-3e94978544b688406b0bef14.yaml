chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: “迪杰里多”发出一种低沉浑厚的呜呜声，不像是音乐，仿佛是大地的鼾声
sensory_mapping: 粗树枝乐器把气息送入夜色，低音沿门廊和地面扩散，整片大陆像在睡眠中缓缓呼吸。
context_fact: 弗雷斯每夜在门厅台阶吹奏，程心与AA长期伴着声音入睡。
image_mechanism: 鼾声取消表演性的旋律，把乐器并入土地身体；人类入睡与大地沉睡因此同步。
property_alignment: 低频呜声对应鼾音；持续吹奏对应规律呼吸；土著木管对应土地发声通道；两人入睡对应同处睡眠。
context_alignment: 弗雷斯把自己视为大地和丛林的动物，乐声成为他与祖先土地连接的听觉证据。
narrative_function: 在移民混乱后建立古老、安定的夜间底音，并引出老人关于土地与苦难的智慧。
transfer_rule: 把低音写成巨大存在的睡眠声时，应匹配频率、节奏、声源方向和听者身体状态。
failure_boundary: 大地不会呼吸，乐曲也可能含复杂技巧；若声音尖锐急促或用于唤醒人，鼾声不合。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 夜间迪杰里多持续发出的低沉、浑厚而接近自然底鸣的声音
vehicle: 巨大大地沉睡时从内部传出的缓慢、低频鼾声
ground: 音调低且富共振；节奏持续重复；声源仿佛来自地面深处而非人工旋律
