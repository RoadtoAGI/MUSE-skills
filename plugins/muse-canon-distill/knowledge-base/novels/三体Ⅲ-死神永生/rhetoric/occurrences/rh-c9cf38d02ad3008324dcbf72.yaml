chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那一幅幅画就像一颗颗心，在为自然和人性之美轻轻跳动
sensory_mapping: 画框成为胸腔，柔美色块随不可见脉搏起伏，整个展厅充满低声心跳。
context_fact: 程心预期后现代怪异延续，却看到温和乐观的新美学。
image_mechanism: 心脏把静态画面赋予内在节律，跳动说明生机来自作品内部价值，而非外部喧闹形式。
property_alignment: 单幅画对应单颗心；情感主题对应心的情感象征；色彩生机对应脉搏；轻柔风格对应轻跳。
context_alignment: 新纪元艺术强调自然与人性，心脏将审美复兴写成社会生命恢复。
narrative_function: 用群体微声意象概括画展体验，表现程心对时代文化的信任增长。
transfer_rule: 静态作品如心时，应指出其内在节律如何由色彩、构图或情感形成；心跳强度要匹配风格。
failure_boundary: 作品冷漠机械、刻意无情感或视觉剧烈爆炸时，轻轻跳动的心会错调。
