tenor: 未来画展中温和写实、色彩柔美又有生机情感的画作
vehicle: 一颗颗以轻柔节律跳动、持续输送生命的心脏
ground: 每件作品独立承载情感核心；色彩与形式呈现微妙动态和生命活力
