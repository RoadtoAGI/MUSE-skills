chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这些人就像一群饿狼遇到了一大块鲜肉
sensory_mapping: 圆桌讨论变成狼群围食，人体方案成为带血肉块，发言热度获得扑咬和撕扯的身体性。
context_fact: 机器探测器超重难以实现，有人提出发送人脑，讨论随即超过此前热度。
image_mechanism: 饥饿解释热度来源，狼群解释集体围攻式思考，鲜肉则暴露他们把具体人当作可拆解资源的伦理冷酷。
property_alignment: 方案困境对应长期饥饿；人体新路径对应鲜肉出现；多人抢议对应狼群围食；对象物化对应肉而非人。
context_alignment: PIA以不择手段推进，捕食意象准确显出技术兴奋背后的工具化人性。
narrative_function: 同时加速会议和发出伦理警报，为云天明被选中埋下冷酷基调。
transfer_rule: 群体机会兴奋借捕食写时，应让此前匮乏、新资源价值和争抢动作都有证据；喻体还可揭示被讨论对象如何被物化。
failure_boundary: 若讨论克制、以保护候选人为先或方案并非解决稀缺需求，饿狼鲜肉会无端污名化参与者。
