chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 再次远离人群，更深地缩进自己的精神蜗壳里
sensory_mapping: 社会险恶成为触碰，云天明的意识像软体向内缩，孤僻加厚成一层随身硬壳。
context_fact: 他原以为工作环境较易相处，发现被人出卖后再次疏离人群，事业也因此恶化。
image_mechanism: 缩进给心理回避一个可见方向，更深说明防御逐次加剧；蜗壳同时保命和困住主体，呈现策略的双刃性。
property_alignment: 敏感脆弱对应蜗牛软体；孤僻人格对应硬壳；遭背叛对应外界刺激；减少交往对应缩入深处；事业受损对应行动受限。
context_alignment: 云天明无法真正出世，蜗壳并非自由隐居，只是随身携带的狭窄精神空间。
narrative_function: 解释他从短暂开放回到更深孤立，也为后来适应异类环境的悖论优势预先造型。
transfer_rule: 心理壳体应同时写出触发刺激、退缩动作、保护收益和行动代价；深浅变化可表示防御程度。
failure_boundary: 主动而充实的独处、仍频繁信任交往或外界没有伤害时，受惊缩壳会误写人物选择。
