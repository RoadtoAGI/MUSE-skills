tenor: 云天明遭遇职场欺骗后加强自我封闭、减少社会交往的心理防御
vehicle: 受惊蜗牛把柔软身体向硬壳深处收缩，以狭小封闭空间隔开外界伤害
ground: 主体脆弱且依靠退缩自保；防御减少外界伤害，也同步限制行动与连接
