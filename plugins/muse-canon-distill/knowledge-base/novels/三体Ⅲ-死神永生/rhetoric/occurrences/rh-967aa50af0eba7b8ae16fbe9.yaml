chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 仍能看到那片幽幽的光亮，像荒野中的磷火
sensory_mapping: 几千米火流刺向前方，后方二维平面却留一团冷光，像荒野尸骨旁不灭的磷火。
context_fact: 太空艇和监视员正在二维化，启示号发动机全功率逃离却没有拉开空间距离。
image_mechanism: 磷火把远光从爆发后的物理余辉转成死亡标记，荒野对应无边太空和无人救援。
property_alignment: 二维余光对应磷火；黑暗太空对应荒野；死者位置对应腐物发光；远距微亮对应幽火。
context_alignment: 前一刻是妖艳焰火，拉远后缩成磷火，同一事件随视距从壮丽降为坟地征兆。
narrative_function: 保持危险方位可见，并在飞船尚未察觉被空间拖回时持续施压。
transfer_rule: 远处死亡光比作磷火时，应对齐亮度、色温、环境空旷、死亡来源和观察距离。
failure_boundary: 发光来自二维化能量而非化学磷光，太空也无荒野地面；仅映射观感与死亡语义。
quality_assessment: exemplary
