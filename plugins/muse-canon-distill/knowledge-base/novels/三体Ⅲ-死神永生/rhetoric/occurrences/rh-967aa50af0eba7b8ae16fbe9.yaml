tenor: 启示号急速远离后，太空艇二维化处在黑暗远方残留的微弱诡异光斑
vehicle: 无人荒野里由腐物发出的幽冷磷光，孤零零闪在黑暗地表
ground: 光线微弱幽冷；周围空旷无人；来源与死亡腐败相关；远处仍醒目；令观察者不安
