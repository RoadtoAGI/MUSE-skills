chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 片片朦胧的光晕，像睡梦中眼皮下滚动的眼球
sensory_mapping: 闭合眼皮；皮下眼球；模糊滚动；暗黄微光；沉睡巨脸
context_fact: 木星完全处于阴影，太阳不可见，只能看到液态表面磷光穿过深厚大气。
image_mechanism: 木星大气变成覆盖世界的眼皮，下面的液态流动像一只看不见的眼球在梦中转向；光不是照出来，而从皮下隐约透动。
property_alignment: 木星大气对应眼皮；液态表面对应眼球；磷光对应皮下微光；云层流动对应眼球滚动；背阳状态对应闭眼；朦胧边界对应隔皮观察；巨大行星对应沉睡巨物
context_alignment: 前一试验巨石有睁开的红眼，这里真实木星却闭眼沉睡，眼意象由威胁凝视转为庞大无意识运动。
narrative_function: 给难以看清的背阳木星表面赋予缓慢生命感，并制造幽暗不安。
transfer_rule: 用眼皮下眼球写朦胧光斑时，应有覆盖层、下方圆润运动、边界模糊、弱光透出和闭合暗环境。
failure_boundary: 大气透明、表面细节清晰静止或强烈自发光时，隔眼皮滚动的模糊性不成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 木星背阳面液态氢氦的微弱磷光透过厚重大气，形成缓慢移动、模糊起伏的亮斑
vehicle: 闭眼睡梦时眼球在眼皮下转动，外部只能看见柔软皮层下模糊滚移的隆起和暗光
ground: 厚大气对应眼皮；下层液面对应眼球；朦胧光晕对应皮下轮廓；缓慢流动对应眼球滚动；背阳黑暗对应睡梦闭眼
