review_status: reviewed
tenor: 当下冬眠者借未来生物技术获得永生机会，以及死亡风险由阶层分配的变化
vehicle: 通向高处永生的一段阶梯，少数人先踏上首级；掌管所有人死亡的死神也开始偏袒
ground: 技术过程需要分阶段跨越；早进入者占先手，原本普遍的终点对不同群体变得不对称
