chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 那些现在就冬眠的幸运者就踏上了永生的第一个台阶。这样，人类历史上第一次连死神都不公平了
sensory_mapping: 冬眠舱成为永生阶梯的第一阶，幸运者躺下却等于向上迈步；死神在阶梯下选择性放行。
context_fact: 社会相信一两个世纪后可实现永生，能冬眠到未来的人可能直接接上该技术，留下者则为其建设。
image_mechanism: 台阶把冬眠和永生区分为相连阶段，死神人格化则把结构不平等压到最普遍的死亡尺度。
property_alignment: 冬眠跨越当前对应踏首阶；未来永生技术对应阶梯高处；先行者特权对应抢先登阶；死亡不均对应死神偏袒。
context_alignment: 冬眠争议核心不是装置本身，而是谁能跳过危险年代；阶梯与不公共同揭示时间逃亡的阶层性。
narrative_function: 把技术诱惑和伦理后果收束在一个上升动作中，为政府严控冬眠提供直观理由。
transfer_rule: 过程如阶梯时，每一级应对应真实阶段，先后顺序要带来可说明的优势；人格化裁判用于显示分配不公。
failure_boundary: 未来永生若无可靠预期，首阶未必通向目标；冬眠机会完全平等时，死神偏袒的社会判断减弱。
