chapter: 【掩体纪元67年，“星环”号】
figure_type: simile
quote: 怪眼一样的大红斑也缓缓移入视野
sensory_mapping: 红色怪眼；旋涡瞳孔；暗线后转出；巨脸表面；缓慢凝视
context_fact: 星环号与城市组合体已成为绕木星运行的卫星，舷窗中能看到木星日夜线和大红斑随背景移动。
image_mechanism: 行星云层先形成一张占满窗外的巨面，椭圆风暴在日夜线后像眼球转出；轨道运动因此被体验为木星把目光缓慢移向飞船。
property_alignment: 大红斑对应眼睛；椭圆边界对应眼眶；内部风暴对应瞳孔纹理；红色对应异色眼；木星表面对应脸；行星自转对应转眼；缓慢入窗对应目光移来；容纳地球尺度对应巨眼
context_alignment: 半世纪前木星暗面已被写成眼皮下滚动的眼球，此刻向阳面大红斑真正“睁眼”，标记掩体保护状态已经改变。
narrative_function: 让轨道异常获得不安生命感，并以复现眼意象提示木星由屏障变成暴露背景。
transfer_rule: 用眼睛写行星风暴时，应匹配椭圆轮廓、内部旋转层次、从边缘移入的转向动作和可被视作面孔的广大表面。
failure_boundary: 风暴呈长条无中心、静止不移动、颜色与周围完全相同，或只能见到一个无轮廓小点时，怪眼映射会失去形动依据。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 木星大红斑随着行星自转从日夜交界线后进入舷窗视野的巨大红色旋涡
vehicle: 一只形状异样、尺度骇人的红色眼睛从暗处缓慢转来，以旋涡状瞳孔凝视观察者
ground: 大红斑椭圆对应眼形；中央旋涡对应瞳孔；红色对应怪异眼色；随自转移入对应眼球转向；巨大尺度对应巨眼；木星表面对应面孔
