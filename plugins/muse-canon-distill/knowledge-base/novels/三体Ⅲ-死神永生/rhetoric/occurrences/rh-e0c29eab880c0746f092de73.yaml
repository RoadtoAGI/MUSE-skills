quote: 程心感觉自己仿佛身处午夜的悬崖下
sensory_mapping: 午夜黑暗；头顶峭壁；崖脚小人；阳光被切断；岩面压近
context_fact: 太空中没有大气散射，艇一进入试验石块背阳面便从强光骤然落入全黑。
image_mechanism: 悬浮石块在近处竖成地面悬崖，阴影给无上下的太空补出崖底位置；太阳像被岩顶完全挡住，程心缩成午夜壁脚的一点。
property_alignment: 巨石对应悬崖；背阳面对应崖阴；太空艇对应崖下行人；瞬间无光对应午夜；岩面近距对应壁脚；太阳遮蔽对应崖顶挡天
context_alignment: 太空没有自然上下，地景比喻为程心的身体感重新建立方向，也强化试验前孤立感。
narrative_function: 表现光暗突变和巨石尺度，为维德在阴影中出现营造压迫舞台。
transfer_rule: 用午夜悬崖写遮光天体时，应匹配巨大近壁、彻底阴影、观察者位于边缘下方、光源被遮和尺度压迫。
failure_boundary: 阴影区仍有强散射光、石面平缓遥远，或观察者位于岩顶上方时，崖底午夜会错置位置。
