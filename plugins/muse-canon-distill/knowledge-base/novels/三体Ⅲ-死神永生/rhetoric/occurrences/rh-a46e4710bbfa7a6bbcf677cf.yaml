chapter: 【掩体纪元67年，冥王星】
figure_type: simile
quote: 黑暗，像一只永远闭着的眼睛
sensory_mapping: 冥王星悬成一只合紧的黑眼，太阳弱光落在眼睑上也不能把它唤醒。
context_fact: 冥王星处于远日点，只有星环号进入低轨才能看清蓝黑冰岩地表。
image_mechanism: 闭眼把低照度转成器官动作，永远一词又把遥远寒冷放大为拒绝观看的永久姿态。
property_alignment: 暗色球体对应闭眼；低太阳光对应不见亮瞳；表面细节隐藏对应眼睑遮住；远日点漫长对应永闭。
context_alignment: 程心不敢抬头看毁灭，冥王星也像闭眼；人物回避与行星外观形成同构。
narrative_function: 用第一印象确立冥王星的墓地气质，为地下文明墓室和时间工程转场。
transfer_rule: 暗天体比作闭眼时，应利用球形、亮暗分布、观看互惠、时间尺度和人物心理呼应。
failure_boundary: 冥王星仍反射光且无感知，眼睛结构与行星地貌无关；比较限于远观印象。
quality_assessment: exemplary
