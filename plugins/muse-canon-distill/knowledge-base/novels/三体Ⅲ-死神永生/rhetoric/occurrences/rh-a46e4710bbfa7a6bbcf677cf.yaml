review_status: reviewed
tenor: 远日点弱光下整体蓝黑、缺少亮面和可见活动的冥王星
vehicle: 眼睑永久合拢的眼睛，不接收光也不向外显露内部意识
ground: 外观暗闭；表面细节不显；没有目光回应；长期处于无光状态；球形与眼形可联想
