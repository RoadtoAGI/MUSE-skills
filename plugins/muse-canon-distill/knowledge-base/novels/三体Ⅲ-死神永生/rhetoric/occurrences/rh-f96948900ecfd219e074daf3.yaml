chapter: 【广播纪元7年，云天明的童话】
figure_type: analogy
quote: 王国的生活像镜面一样平静，昨天像今天，今天像明天，去年像今年，今年像明年
sensory_mapping: 年月被铺成一面无纹镜子，每一天都映回前一天的同一张脸，没有一圈波纹留下事件。
context_fact: 童话开篇把故事等同曲折灾难，王子公主长大前，王国被设定为持续幸福且无事。
image_mechanism: 镜面静止负责空间平滑，连续日期互换负责时间重复，两组比较共同把抽象无故事状态做成可见平面。
property_alignment: 社会无冲突对应镜面无波；日常重复对应日期相像；长期稳定对应年度复制；无故事对应无新图样。
context_alignment: 这份过度平静正为下一句王国终于有了故事蓄势，镜面也暗示后来会被暴力打碎。
narrative_function: 以童话式重复建立初始秩序，让继承危机成为清晰可辨的第一道波纹。
transfer_rule: 停滞生活写成镜面时，应同时表现无扰动和时间单位之间的重复关系。
failure_boundary: 王国生活仍包含个体活动，镜面也不等于幸福；比较只压缩宏观叙事变化。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 无故事王国长期没有事件、变化或时间差异的稳定生活
vehicle: 没有波纹的镜面，以及彼此完全相同、可互相复制的一连串日期
ground: 表面无扰动；前后状态一致；时间推进不产生新形状；观察者看不到突变
