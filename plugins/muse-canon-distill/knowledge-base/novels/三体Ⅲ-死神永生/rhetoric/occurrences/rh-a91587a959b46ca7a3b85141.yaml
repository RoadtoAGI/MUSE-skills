chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 人类当时像个第一次走向社会的孩子，对险恶的外部世界充满了恐惧和迷茫
sensory_mapping: 地球成为家庭门内，黑暗宇宙成为陌生街市，人类文明缩成刚跨门槛的孩子。
context_fact: 后世认为面壁计划幼稚，却承认它产生于三体危机的精神冲击。
image_mechanism: 成长类比将荒唐策略放进学习阶段：错误不是无缘故愚蠢，而是首次社会化的必经反应。
property_alignment: 封闭地球经验对应家庭保护；首次接触三体对应初入社会；面壁计划试错对应孩子摸索规则。
context_alignment: 威慑纪元已掌握黑暗森林规则，后见成熟与危机初年的稚嫩形成时间对照。
narrative_function: 既评价面壁计划又保存历史同情，为执剑人制度的成熟化铺垫。
transfer_rule: 文明成长借儿童社会化时，应对齐保护环境、首次外部接触、规则未知和试错；不可只用幼稚贬低。
failure_boundary: 若人类早有同类宇宙战争经验或信息充分仍故意失策，初入社会的无经验解释不足。
