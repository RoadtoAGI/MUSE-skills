tenor: 危机初期首次面对敌对宇宙文明、缺少成熟策略的人类社会
vehicle: 离开家庭保护、第一次进入复杂社会而不懂规则的孩子
ground: 主体经验不足且安全边界刚被打破；面对潜在恶意既恐惧又无法判断应对方式
