chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 小艇仿佛是紧贴在一个静止的海水盆地的边坡上
sensory_mapping: 巨大水盆；倾斜边坡；船身贴壁；周围静止；盆底深孔
context_fact: 小艇已下滑水墙三分之一，与旋涡一起转动；看水墙感觉静止，看天空才见世界旋转。
image_mechanism: 共同旋转被感官减掉，奔流液体冻结为盆壁，小艇像贴在斜面上的小片；只有抬头看天，隐藏的旋转才重新显现。
property_alignment: 旋涡凹面对应盆地；水墙对应边坡；小艇对应附坡物；共同角速度对应相对静止；涡底对应盆底；四周水面对应盆壁围合
context_alignment: 该错觉来自真实参考系，而非纯幻想，盆地图使人物为何不敢看天的眩晕机制可理解。
narrative_function: 呈现旋转参考系的感知反转，让危险运动在船内看似静止。
transfer_rule: 用静止坡面写共转系统时，应明确观察者与介质同角速度、近景相对不动、远景暴露旋转和坡面几何。
failure_boundary: 船与水墙速度不同、近景持续掠过，或观察者有稳定外部参照时，静止盆坡错觉会被打破。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 小艇与旋转水墙同步运动，艇上人失去相对转动感觉，只感到自己停在倾斜水坡
vehicle: 一只物体静止附着在不动盆地的斜坡表面，周围地形与它保持固定关系
ground: 水墙对应盆地边坡；小艇贴水对应物体附坡；同步旋转对应相对静止；涡心低处对应盆底；视野全是水坡对应盆壁包围
