chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 无论是它的防御效果还是借助其发布安全声明的可能性，都只是水中月镜中花
sensory_mapping: 水中月影；镜面花朵；伸手扑空；波纹打散；美丽虚像
context_fact: 智能机器自复制形成太阳系屏障需上万年，其防御和安全声明功能也缺少可行机制，IDC最终放弃研究。
image_mechanism: 技术推演在远处投出两幅完整图景，像月和花都已存在；一旦把时间、材料和功能条件伸手探入，图景只在计算表面晃动，无法成为工程实体。
property_alignment: 防御愿景对应水中月；安全声明愿景对应镜中花；理论描述对应可见倒影；工程实现对应伸手取得；万年延迟对应水面距离；功能不足对应虚像无实体；放弃项目对应倒影破散
context_alignment: IDC曾恋恋不舍重视鱼群设想，古典虚景意象准确表现方案既美又不可用，而非简单荒谬。
narrative_function: 为一段复杂技术否定给出凝练结论，标记错误解读退出。
transfer_rule: 用水月镜花写方案落空时，应让目标具有可见吸引力，同时明确实体缺失、触取失败和验证后破灭。
failure_boundary: 方案只是成本高却能分阶段实现，或已有可触及原型时，纯虚像会抹掉真实工程进展。
quality_assessment: conventional
confidence: 0.99
review_status: reviewed
tenor: 鱼群设想看似能拦截打击或发布安全声明，实际无法在可用时间和机制上产生这些效果
vehicle: 水面月影与镜中花朵清晰诱人，却没有可触取的实体，伸手便发现所得为空
ground: 方案表面可见对应倒影清晰；技术目标诱人对应月与花之美；无法实现对应不可触取；进一步研究破灭对应接近后发现虚像
