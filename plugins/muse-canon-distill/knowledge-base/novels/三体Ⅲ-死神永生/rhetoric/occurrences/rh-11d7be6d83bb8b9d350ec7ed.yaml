chapter: 【威慑后第一年，移民完成后第六天清晨，澳大利亚】
figure_type: metaphor
quote: 周围的太平洋突然一涌而起，喧嚣的巨浪从四面八方把澳大利亚吞没
sensory_mapping: 死寂冰面骤然解冻抬高，欢呼化成环澳巨浪越岸，失明的程心被声水完全淹没。
context_fact: 远处转播宣布威慑恢复，周围人群从绝对安静突然转为久久不息的欢呼。
image_mechanism: 利用澳大利亚被海洋环绕的地理事实，把声音强度、方向和覆盖范围变成真实可定位的海啸。
property_alignment: 欢呼突发对应海面涌起；巨大声量对应巨浪；四周声源对应环海包围；听觉过载对应大陆被吞。
context_alignment: 程心失明后以听觉重建世界，地理尺度只能由声音想象；太平洋是最贴身的大陆级喻体。
narrative_function: 让读者先听见世界获救的集体反应，再等待程心理解欢呼原因。
transfer_rule: 大陆级声浪如海啸时，应匹配地理包围、突发抬升、传播方向和感官淹没。
failure_boundary: 声音不具水压且欢呼来自大陆内部，不是海上实体浪；喻体属于失明者空间想象。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 全澳人群得知广播启动后同时爆发的巨大欢呼声及其对程心听觉的包围
vehicle: 太平洋海面整体抬升，巨浪越过海岸从所有方向淹没大陆
ground: 声量规模覆盖大陆；浪头突然从静止中升起；传播由周边向中心包围并压过一切
