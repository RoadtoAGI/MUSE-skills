chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 一声女人的尖叫，像利刃划破晨空
sensory_mapping: 尖叫变成一线寒亮刀锋，从人群中向上划过灰白晨空，静默表面裂开一瞬。
context_fact: 智子宣布食人计划后无人说话，只有附近女人突然尖叫，随即又归于死寂。
image_mechanism: 利刃把高频声音视觉化为切线，并让静默和晨空共同取得可被破开的表面。
property_alignment: 尖锐音色对应刀锋；声音骤起对应挥刀；打破死寂对应划开表面；很快消失对应裂口合拢。
context_alignment: 智子此前以武士刀建立统治，此刻人类唯一发声也呈刀形，却只能划开天空而不能伤及计划。
narrative_function: 给集体震惊一次极短声响出口，并把后续死寂的压倒力量衬得更大。
transfer_rule: 声音如利刃时，应匹配音色、运动方向、被切介质和切开后的持续时间。
failure_boundary: 声波不真正切割，若叫声低沉绵长或背景本就嘈杂，刀锋的单线突入不成立。
quality_assessment: effective
