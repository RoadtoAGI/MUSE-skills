chapter: 【时间开始后约170亿年，我们的星星】
figure_type: analogy
quote: 她曾经多次见过长时间曝光的星空照片，由于地球的转动，照片上的星星都成了线段，它们的长短和方向都一样。但现在，星星变成的线长短不一，方向也不一样
sensory_mapping: 一千六百万年像一次超长曝光，每颗恒星把自己的运动刻成光线，只是这些线不再随同一地球转轴整齐排列。
context_fact: 穿梭机低光速近乎停在自身时间里，外界恒星已移动巨大距离，蓝星生态也发生剧变。
image_mechanism: 长曝光为时间压缩提供技术模型，差异点在于相机不只记录地球自转，而记录恒星真实运动。
property_alignment: 恒星对应点光源；千万年运动对应曝光轨迹；线长对应位移量；方向差对应各自速度；舷窗对应曝光画面。
context_alignment: 太阳系曾成为巨画，这里整个星空成为时间摄影；宇宙不断以图像媒介显露不可直接经历的时间。
narrative_function: 让一千六百万年这一数字可视化，并以熟悉星轨和异常星轨的差异证明时代跨度。
transfer_rule: 漫长运动比作长曝光时，应对齐点到线、时间窗口、长度、方向，并说明与普通曝光的关键差别。
failure_boundary: 舷窗没有真实相机积累旧光，所见线形还受低光速光学机制影响；照片是解释模型。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 经过一千六百万年后舷窗外各恒星因不同自身运动轨迹拉成方向长度各异的发光线段
vehicle: 长时间曝光相机把相对移动的星点累积记录成连续星轨线段
ground: 点光源沿时间积成线；线长反映位移；方向反映运动方向；长曝光压缩漫长时间；多个轨迹可交错；观察者看到时间总和
