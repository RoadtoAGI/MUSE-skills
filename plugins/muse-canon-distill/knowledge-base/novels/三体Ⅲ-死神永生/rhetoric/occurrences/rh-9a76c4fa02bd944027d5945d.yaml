chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 前方的航程一片空白，她心中的太空不再是黑色的，而是变成了虚无的颜色
sensory_mapping: 星环号前方虽有群星，她的内在星图却被擦成无色空页，连黑暗都比这片虚无更具体。
context_fact: 太阳系已毁，她和AA是仅存地球人，飞船可到五万光年内多数恒星，却不知道去哪。
image_mechanism: 空白先表示路线未填，虚无颜色再撤销感官本身，使无意义比黑暗更彻底。
property_alignment: 未知航向对应空白图；无目标对应无标记；绝望对应失色；黑色太空对应尚有背景；虚无对应意义和视觉同时缺席。
context_alignment: 罗辑下一句如闪电照亮黑色思绪，正是对这片空白星图第一次重新写入方向。
narrative_function: 把物理上无限选择与心理上无路可选的矛盾定格，为“去找他们”制造必要黑场。
transfer_rule: 未来写成空白或无色时，应区分未知、黑暗和虚无三层，并让后续信息具体填入一个标记。
failure_boundary: 飞船外仍有可导航星图，程心也保留寻找云天明的潜在愿望；空白只属当下意义感。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 程心虽必须活下去却失去目的地、意义和未来想象，内心无法为航程赋予任何内容
vehicle: 星图或画布上完全未书写的空白区域，以及连黑色都不存在、不可被命名的虚无色域
ground: 没有标记；没有方向；缺乏可见内容；颜色被取消；边界无法辨认；未来不能想象；行动仍需进入其中
