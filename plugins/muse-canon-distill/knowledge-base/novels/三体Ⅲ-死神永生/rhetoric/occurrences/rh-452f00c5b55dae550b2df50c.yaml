chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 阶梯计划为绝境中的地球文明带来了一线曙光
sensory_mapping: 末日黑夜包住地球，阶梯飞行器留下的云天明像地平线细光，先划开一条亮缝。
context_fact: 阶梯计划曾被判为失败，云天明却被三体截获并在此时获准与程心实时会面。
image_mechanism: 曙光把一个信息机会放进昼夜转换，线的微小保留结果不确定，晨的方向则赋予希望。
property_alignment: 文明绝境对应长夜；会面机会对应初光；信息尚未知对应细线；未来转机对应日出将至。
context_alignment: 上一章地球宗教祈求拯救天使，此处真正转机来自被遗忘的人类计划，曙光替代神光，回到历史因果。
narrative_function: 为阶梯计划翻案，开启云天明会面线，并把读者期待从智子移向旧日私人关系。
transfer_rule: 希望如曙光时，应先建立具体黑夜，限定光线强度，并说明它证明什么、尚未照亮什么。
failure_boundary: 会面受严密限制且可能导致程心死亡，未必真能救地球；曙光表示机会而非成功。
quality_assessment: conventional
confidence: 0.97
review_status: reviewed
tenor: 被遗忘近三世纪的云天明阶梯计划，在地球无安全声明线索时带来可能获得信息的希望
vehicle: 长夜尽头地平线上出现第一条晨光，尚未照亮世界，却证明太阳即将升起
ground: 此前环境黑暗；希望初现且微弱；来源位于未来方向；少量信号改变对全局的预期
