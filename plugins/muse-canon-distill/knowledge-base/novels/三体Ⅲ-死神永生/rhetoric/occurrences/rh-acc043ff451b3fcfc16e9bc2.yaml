chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 引擎的声音在旋涡的轰鸣中像蚊子叫
sensory_mapping: 细小嗡声；巨响背景；声音被吞；微弱振翅；无力发动机
context_fact: 小艇试图加速越过泡沫边界逃出旋涡，却多次失败并继续下滑。
image_mechanism: 通常代表动力的引擎在涡底轰鸣前缩成一只小虫，机械声只剩细嗡；声音尺度先宣告发动机无法对抗水流。
property_alignment: 电动引擎对应蚊子；引擎声对应蚊鸣；旋涡轰鸣对应巨大环境声；动力相对弱对应小虫力量；声音不可闻对应逃逸能力不足
context_alignment: 紧接着小艇冲线失败，听觉比例提前量化人造动力与自然旋涡的悬殊。
narrative_function: 用声量反差表现逃逸尝试的无力，提升旋涡威胁。
transfer_rule: 用蚊鸣写机械声时，应有压倒性背景噪声、相对微小音量、细高频质感和动力悬殊。
failure_boundary: 引擎低频震耳、环境安静，或设备虽小却能压过外力时，蚊鸣会误导性能。
