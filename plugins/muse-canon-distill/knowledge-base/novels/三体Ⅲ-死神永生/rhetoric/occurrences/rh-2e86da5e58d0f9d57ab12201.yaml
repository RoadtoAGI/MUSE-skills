quote: 人们感到这重力像是前方母亲星球的拥抱
sensory_mapping: 无形加速度化成地球伸来的双臂，把贴在舷窗的人群压向母星方向。
context_fact: 幸存者离地多年即将返航，眼前地球仍只是微蓝星点，一G重力先在身体上恢复。
image_mechanism: 物理过载与记忆中的体重完全相同，熟悉触感因此先于视觉抵达；母亲身份把压迫力转成欢迎。
property_alignment: 一G熟悉压力对应母亲抱力；加速度朝地球对应从母星伸手；返乡者贴窗对应孩子投入怀抱。
context_alignment: 归航者误信地球欢迎，拥抱的温暖为随后审判背叛制造巨大反差。
narrative_function: 把惯性力转成返乡仪式，集中表达漂流者对母星的信任和渴望。
transfer_rule: 物理力人格化时，方向、强度与身体记忆应先准确；关系喻体再由人物对来源对象的情感决定。
failure_boundary: 过载远超一G造成伤害、方向背离地球或人物憎恶母星时，拥抱的熟悉安全感失效。
