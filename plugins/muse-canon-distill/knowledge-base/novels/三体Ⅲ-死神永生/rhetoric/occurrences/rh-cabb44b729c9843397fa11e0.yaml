chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 海浪哗哗地喧响，仿佛在一遍遍地重复着长帆的话：永远不可能离开，永远不可能离开
sensory_mapping: 浪头拍岸；哗哗节奏；低沉复唱；句子循环；黑海回声
context_fact: 公主刚问能否离开无故事王国，长帆连续回答两个‘永远不可能’。
image_mechanism: 无词的浪声被公主的失望切分成同一句话的音节，每一轮浪头都把‘永远’送回岸上，使一个人的回答扩展为整片海的判决。
property_alignment: 海浪对应复诵者；浪声对应话语；周期涨落对应重复次数；长帆结论对应复唱内容；海岸封锁对应声音不止；公主聆听对应被合唱包围
context_alignment: 阻止出海的正是这片海，令海浪亲口重复禁令，使物理屏障同时获得声音权威。
narrative_function: 把一次对话中的绝望扩散到环境，压实公主想离开的核心困境。
transfer_rule: 用自然节律写语言复诵时，应让声响周期、句式重复、人物刚说过的内容和环境立场相互对应。
failure_boundary: 自然声无节律、人物未形成可重复短句，或环境与话语结论相反时，复诵会显得由叙述强加。
