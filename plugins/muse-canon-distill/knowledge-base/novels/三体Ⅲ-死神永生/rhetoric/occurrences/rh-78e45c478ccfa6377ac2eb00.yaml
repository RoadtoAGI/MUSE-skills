tenor: 公众以黑暗森林理论可能只是迫害妄想来维持的安全感，被三体星系毁灭事实完全推翻
vehicle: 睡眠中令人舒适的美梦遭外界巨响打断，梦境碎裂，醒者被迫面对床外现实
