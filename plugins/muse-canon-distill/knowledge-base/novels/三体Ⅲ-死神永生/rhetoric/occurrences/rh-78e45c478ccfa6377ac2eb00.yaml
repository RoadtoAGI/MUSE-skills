figure_type: metaphor
quote: 安逸的美梦彻底破灭
sensory_mapping: 宇宙迫害妄想像柔软梦幕包住城市，三体恒星惨白爆光从夜空击入，把幕面当场震碎。
context_fact: 人们日益否定黑暗森林理论，随后亲眼看到三体恒星异常增亮并熄灭，证实其遭宇宙打击。
image_mechanism: 梦把学术质疑与公众自我安慰区分开，破灭则让遥远天象成为唤醒动作，安全感不是被辩论而是被事实击碎。
property_alignment: 否认危险对应安逸梦境；三体毁灭光对应惊醒刺激；理论获证对应醒见现实；彻底失效对应梦无法续接。
context_alignment: 程心本人刚从噩梦醒来看见蓝光，社会的美梦也在同一夜醒来，私人睡眠和文明认知精确叠合。
narrative_function: 用一句完成理论争论的终局，并把叙事从六年享乐切回太阳系末日等待。
transfer_rule: 认知幻象如梦时，应交代梦的舒适收益、现实遮蔽、具体唤醒信号和醒后的新判断。
failure_boundary: 此前质疑含有真实科学不确定性，不全是梦或自欺；破灭只针对三体毁灭后的公众否认。
