chapter: 【危机纪元5-7年，阶梯计划】
figure_type: simile
quote: 它们就像是一串太空地雷
sensory_mapping: 无形航道变成雷区，核弹成为悬空雷点，飞行器每越过一处便踩响一次。
context_fact: 阶梯飞行器以每次核爆辐射获得速度增量，探测器还会调整下一枚位置。
image_mechanism: 地雷模型把预置、路径、触发三项统一，危险用途被反转为推进台阶而保留爆炸机制。
property_alignment: 核弹预置对应埋雷；串沿航线对应雷区排列；飞行器经过触发对应踩雷；爆炸冲量对应地雷作用。
context_alignment: 阶梯强调速度级别，地雷补充空间布设和依次触发，两种模型共同解释完整方案。
narrative_function: 让千枚核弹的空间结构一眼可见，并预示任何位置偏差都可能破坏序列。
transfer_rule: 路径触发系统可借雷区写，但应区分作用对象：此处爆炸有意推动而非摧毁，映射只覆盖布设和触发。
failure_boundary: 核弹若随船携带、远程同时引爆或位置不沿航路，串列地雷结构失效；毁伤后果也不可照搬。
quality_assessment: effective
