tenor: 沿地球至木星航段依次预置的一千零四枚核弹
vehicle: 沿预定路径串列埋设、由经过目标依次触发的地雷
ground: 爆炸装置固定分布在路线节点；移动物经过时按顺序引爆并施加作用
