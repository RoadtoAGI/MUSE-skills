figure_type: metaphor
quote: 巨型机都是电老虎，这时的耗电量相当于一个小县城
sensory_mapping: 电流成为食物，机房设备获得张口吞食的动物身体，小县城用电量成为虎口食量标尺。
context_fact: 绿眼镜启动无生命地球模拟，主机全功率耗电达到小县城规模。
image_mechanism: 老虎先给高耗电以凶猛食欲，紧接的县城量级再把俗称校准成可比较数据，形象与说明互相约束。
property_alignment: 巨量耗电对应猛虎大食量；全功率持续运行对应猛兽连续吞食；供电负担对应饲养猛兽的资源压力。
context_alignment: 短暂粗略模拟已动用县城级资源，电老虎让生命对地球影响这一运算的规模立即可感。
narrative_function: 在对话间隙交代计算代价，为模型结论增加工程重量。
transfer_rule: 消费型设备借动物写时，应用随后的量化标尺限定胃口；动物性格只承载摄取强度，不外推攻击行为。
failure_boundary: 低功耗待机、短促峰值或可忽略能源成本时，老虎的持续大食量不成立；设备也没有自主捕食意图。
