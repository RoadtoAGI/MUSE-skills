chapter: 地球文明
figure_type: simile
quote: 他那长长的白发和白须在低重力下飘散开来，像是自己发光似的
sensory_mapping: 白发白须在黑洞般的隧道里舒展开，仿佛每根发丝都浮着一层冷光。
context_fact: 两人刚进入只靠昏暗长明灯照亮的地下墓室，先听见声音，才看见两百岁的罗辑。
image_mechanism: 自发光错觉把反射灯光与低重力飘动合成光晕，使老人从黑暗中先以白色轮廓显现。
property_alignment: 白发对应亮色光体；飘散发梢对应光芒外射；昏暗隧道对应暗底；远处站立对应孤立光源。
context_alignment: 罗辑守着只能亮十万年的灯和文明墓碑，他本人也像一盏将熄未熄的古老灯火。
narrative_function: 完成罗辑迟暮登场，以近乎超现实的白光同时保留慈祥、苍老和守墓者气质。
transfer_rule: 写暗处白色物体似自发光时，应同时交代暗背景、反光来源、边缘运动和人物登场功能。
failure_boundary: 头发没有真实发光；若环境明亮或发丝不飘散，光晕错觉与守墓氛围都会减弱。
