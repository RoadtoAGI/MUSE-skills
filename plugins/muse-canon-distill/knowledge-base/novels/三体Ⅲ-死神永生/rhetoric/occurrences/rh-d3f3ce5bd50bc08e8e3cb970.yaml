chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 烛光和人群像一片发光的太空尘埃
sensory_mapping: 白色宇航服和烛火化成无数微粒，在巨型十字架下漂成一团发亮尘云，与星点难分。
context_fact: 轨道教堂没有实体建筑，礼拜者和特制蜡烛直接悬浮太空，地面可见其光。
image_mechanism: 太空尘埃利用失重悬浮和远距缩小，把人群从宗教主体变成宇宙中的微粒，规模宏大与个体渺小同现。
property_alignment: 教众对应尘粒；烛光对应粒子反光；失重悬浮对应漂浮；数万人群对应尘云；群星背景对应宇宙介质。
context_alignment: 人类向宇宙祈求安全，画面却让信徒成为宇宙尘埃，视觉上暴露其在黑暗森林中的微不足道。
narrative_function: 给无建筑教堂塑形，并以远景尺度呈现广播纪元宗教热潮的壮观与徒劳。
transfer_rule: 悬浮群体如尘埃时，应匹配个体尺度、分布密度、光点来源、背景介质和观察距离。
failure_boundary: 教众有组织和共同意图，不像尘埃随机运动；近看也不会失去人体形态。
