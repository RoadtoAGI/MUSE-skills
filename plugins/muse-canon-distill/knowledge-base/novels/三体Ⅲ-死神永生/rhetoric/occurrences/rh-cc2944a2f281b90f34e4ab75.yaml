chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她的声音很轻，如一阵微风吹过
sensory_mapping: 好的四个字像一缕风掠过狭小舱室，轻轻触到参谋长便消散，没有带起任何物件。
context_fact: 她刚获知红灯可从绿灯直接跳转并在三秒后引爆，回答仍平静简短。
image_mechanism: 微风把声量和情绪扰动统一为轻触动作，越是面对氢弹，声音越轻，反差突显决心。
property_alignment: 低声对应微风弱度；短回答对应掠过；语调平稳对应气流顺滑；舱内无反应对应不扰环境。
context_alignment: 太空真空本无风，舱内这缕人声成为唯一柔性运动，与冷硬红灯和氢弹形成材质对照。
narrative_function: 用听觉轻度压住情节危险强度，表现程心对死亡风险的接受。
transfer_rule: 声音如微风时，应落实音量、持续、流向、触达对象及它没有造成的扰动。
failure_boundary: 声音通过舱内空气传播而非真实风，轻柔也不代表信息无分量。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 程心确认理解致命规则时轻柔、低声且没有激烈情绪的说话声
vehicle: 微风短暂拂过空气和皮肤，力量轻、声音低，经过后不造成明显扰动
ground: 强度微弱；持续短；流动平顺；对周围影响小；听者能感到却几乎抓不住
