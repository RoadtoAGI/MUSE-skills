chapter: 【掩体纪元67年，冥王星】
figure_type: simile
quote: 毁灭像一对黑色的巨翼遮盖了她思想的天空
sensory_mapping: 毁灭在她脑内展开两面黑翼，草地庭院和行星的念头都落入翼影，她只敢低头看眼前。
context_fact: 程心已知道星环号、美好掩体世界和整个太阳系都会成为无厚度薄片。
image_mechanism: 思想先空间化为天空，毁灭再化为遮天生物；双层转换把回避思考写成身体不敢抬头。
property_alignment: 思想范围对应天空；末日威胁对应黑翼；恐惧压抑对应遮光；回避想象对应低头；毁灭扩展对应展翼。
context_alignment: 纸条初见像白羽毛，真正后果却长成黑色巨翼；同一鸟类意象完成从微小无害到遮天灭世的反转。
narrative_function: 用心理图像承接宏观末日信息，保护人物不被抽象尺度淹没，并揭示其回避策略。
transfer_rule: 压倒性念头写成遮天之翼时，应建立内在天空、遮蔽动作、色彩、身体反应和先前意象回声。
failure_boundary: 毁灭没有鸟形或主观意志，程心仍能执行任务；翼影只表示思想被恐惧占据。
