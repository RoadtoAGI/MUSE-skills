chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 不要问他们的世界在哪儿，这是这个宇宙的基本礼节，就像不要问女士的年龄
sensory_mapping: 在黑暗森林里，世界坐标像年龄一样被礼貌地绕开，只是泄露它付出的代价不是尴尬而是灭绝。
context_fact: 关一帆拒绝说明人类舰队位置；暴露恒星坐标会招来黑暗森林打击。
image_mechanism: 日常礼仪以轻松语气承载生存禁令，相同的“不问隐私”结构与悬殊后果形成幽默和寒意。
property_alignment: 世界坐标对应年龄；宇宙文明对应社交双方；询问对应冒犯；保密对应隐私保护；打击风险对应放大的社交后果。
context_alignment: 地球曾因坐标泄露毁灭，幸存者已把惨痛宇宙法则内化为一句随口礼节。
narrative_function: 用关一帆的玩笑迅速交代银河人类的新常识和戒备方式，同时塑造其温和幽默。
transfer_rule: 高风险禁忌借日常礼仪说明时，应保留共同隐私结构，并明确后果规模差产生的语气效果。
failure_boundary: 世界坐标涉及集体生死，不等同个人年龄；类比只说明不应直问和默认保密。
