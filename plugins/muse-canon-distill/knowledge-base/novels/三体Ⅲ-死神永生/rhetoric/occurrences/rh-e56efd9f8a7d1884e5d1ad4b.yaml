chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: simile
quote: 弧形的白墙突然变成了红色，仿佛被地狱的岩浆烧透了
sensory_mapping: 洁白墙体仿佛从背面被熔流浸透，红光带着想象热度压向大厅，地下控制中心瞬间染成地狱内壁。
context_fact: 三体水滴正在攻击广播系统，屏幕以红色显示最高警报，程心进入十分钟决断窗口。
image_mechanism: 烧透解释红色由表面显示升级为穿透材质的灾变，地狱岩浆则把警报等级转译为世界毁灭的温度与归宿。
property_alignment: 墙面通红对应岩浆灼透；最高警报对应地狱危险；整墙覆盖对应熔流浸染；危机逼近对应热浪压迫。
context_alignment: 原本冰样半透明的冷白空间被瞬间反转为熔热红色，视觉温差对应威慑平静彻底破裂。
narrative_function: 用颜色和想象温度触发全书关键倒计时，让抽象警报直接变成末日环境。
transfer_rule: 警报如灼烧时，可利用底色反差、覆盖范围和热感联想；地狱强度只适合不可逆的最高级灾难。
failure_boundary: 小范围红字、普通提示或渐缓色变不足以支持整墙被岩浆烧透；显示屏并未发生真实高温。
