chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 像一个巨大的蚁群覆盖了一具新鲜的动物尸体，很快使其变成白骨架
sensory_mapping: 人海像黑蚁爬满巨树城市，街区的物资和秩序被层层剥走，最后只剩建筑骨架和火光。
context_fact: 几千万人突破驻军进入悉尼，洗劫城市，犯罪与火灾使其失去正常生存条件。
image_mechanism: 尸体和白骨给城市洗劫安排清晰的消耗终点，蚁群则维持俯视下的人数与覆盖方式。
property_alignment: 移民人海对应蚁群；悉尼资源对应尸体软组织；全面洗劫对应啃食；空壳城市对应白骨架。
context_alignment: 此前澳大利亚已被看作蚁窝、食品如米粒，此处同一昆虫尺度扩展到整座城市被群体耗空。
narrative_function: 用强烈身体图像概括悉尼事件，使政府与移民关系转入相互毁灭阶段。
transfer_rule: 群体耗空城市如食腐时，要对应覆盖、资源消耗和残余结构，并交代群体为何被迫汇聚。
failure_boundary: 城市不是尸体，移民也非同质捕食者；类比不能抹去驻军逃跑、政策排斥和个体生存动机。
