chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 各个政治实体和利益集团的影子开始在解读工作中显现
sensory_mapping: 政治暗影；解释纸面；轮廓渐显；幕后实体；光线被遮
context_fact: 各集团开始按自身政治诉求解释童话，把情报工作变成宣传主张的工具。
image_mechanism: 最初以科学名义透明进行的解读工作成为受光平面，幕后的集团不必直接入场，其立场先以解释偏向投下轮廓；读者从影子反推操纵者。
property_alignment: 政治集团对应实体；利益诉求对应遮光形状；偏向性解释对应影子；非公开介入对应本体在幕后；影响出现对应投影变清；IDC工作对应被覆盖表面；公共目标对应原有光源
context_alignment: 童话本就由隐藏符号传递信息，政治力量又以“影子”侵入解码，使研究者面对双层隐藏：云天明的意图与集团的投射。
narrative_function: 把难以指认的制度性干预变成渐现迹象，标记解读由科学协作转向利益争夺。
transfer_rule: 用影子写幕后影响时，应有未公开主体、可从结果辨认的轮廓、逐渐增强的介入和一个原本较透明的活动表面。
failure_boundary: 集团公开署名直接下令、影响没有任何可辨结果，或所谓影子只指人员到场时，幕后投影机制不成立。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 舰队国际、国家、公司与宗教等集团虽未公开主导，却逐渐以自身利益影响IDC的童话解释
vehicle: 遮在主体后方的影子先投到工作表面，轮廓暴露有某个实体接近并改变光线，主体本身仍未完全现身
ground: 利益影响对应投影；集团本体对应遮光物；间接操纵对应只见影子；政治倾向对应影形轮廓；影响渐强对应影子显现；解释工作对应承影表面
