chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 渐渐就沉浸在了故事中。时间就在云天明的童话中流逝
sensory_mapping: 故事像一条低缓河流漫过程心，她从岸上强记的人变成水中听者，被三个童话带过一小时。
context_fact: 云天明低沉舒缓地连续讲三个故事，程心起初努力记忆，最终从童话梦中惊醒。
image_mechanism: 沉浸与流逝共享水域框架，注意力包围和时间推进因此成为同一动态过程。
property_alignment: 故事内容对应水体；全神贯注对应浸入；时间经过对应水流；忘记外界对应水下隔离。
context_alignment: 会面发生在真空太空，液体叙事场反而提供包裹感，暂时替代舱外空旷与死亡审查。
narrative_function: 跨越长篇童话时长而不显跳切，并说明程心为何从任务模式转为真实读者。
transfer_rule: 叙事沉浸写成水流时，应对齐包围程度、外界隔绝、时间方向和退出动作。
failure_boundary: 故事没有液体边界，程心仍在主动记忆；流动速度只代表主观时间体验。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 程心的注意力完全进入童话叙事，以致一个多小时在主观上连续而不显著地过去
vehicle: 身体浸入持续流动的水体，被介质包围并随水流向前移动
ground: 对象被整体包围；外部信号变弱；过程连续；时间向单一方向经过；身处者不易察觉流速
