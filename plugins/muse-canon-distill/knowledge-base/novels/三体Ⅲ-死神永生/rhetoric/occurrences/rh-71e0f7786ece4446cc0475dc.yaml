tenor: 智子的杀气使程心感到强烈恐惧和敌意，即使身处高温坑边仍不减
vehicle: 由某人携来、能压过环境热量并笼罩旁人的寒冷空气
ground: 身体感受与现场温度相反；影响从来者向周围扩散；外部热源无法抵消心理冷感
