figure_type: metaphor
quote: 巨坑中涌出的热浪也驱不散她带来的寒气
sensory_mapping: 岩浆热浪迎面扑来，智子周围却像结着一层冷雾，越靠近越让皮肤和情绪收紧。
context_fact: 智子穿迷彩、携武士刀现身，柔美姿态中显出致命威胁。
image_mechanism: 冷热对抗把美艳杀气转为身体温度，连岩浆都不能驱散的冷强调威胁超越物理环境。
property_alignment: 杀气扩散对应寒气弥漫；程心畏惧对应体感发冷；热浪无效对应危险感压过现场温度。
context_alignment: 智子将马上以刀控制AA，寒气先让她的未出手暴力获得可感范围。
narrative_function: 使新装束的视觉威胁落到触觉，并为柔软绞索喻体补上死亡温度。
transfer_rule: 以反常温度写气场时，要给出真实环境温度作参照，并说明心理影响的传播方向。
failure_boundary: 寒气不是机器人制造的物理降温；若现场本就寒冷，温差反转会失去辨识度。
