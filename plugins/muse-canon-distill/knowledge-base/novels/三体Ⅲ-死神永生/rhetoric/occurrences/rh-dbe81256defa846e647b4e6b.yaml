tenor: 太阳跌入二维后，炽热发光物质在平面迅速铺开，三维残部位于中央继续缩小下沉
vehicle: 无边火焰汇成海洋，血红海面向外扩张，中央物体被火浪逐渐吞没
ground: 面积广阔；温度极高；红光翻涌；边缘快速扩张；中心有下沉物；具有吞没与毁灭力量
