chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 二维太阳继续扩大，很快在平面上形成了一片广阔的火海，三维太阳就在这血色火海的中央缓缓沉下去
sensory_mapping: 太阳物质在平面铺成血红火海，仍有体积的恒星像最后一块岛体在海心慢慢没下去。
context_fact: 二维太阳边缘以每秒两万多千米扩展，三十秒内直径已超过三维太阳。
image_mechanism: 火海同时保留恒星高温与沉海空间模型，将火和水这两种相反介质熔成降维专属景观。
property_alignment: 等离子体对应火；二维面积对应海；红光对应血色；三维残部对应沉物；边缘扩展对应海面漫涨。
context_alignment: 太空城先沉入二维海洋，恒星现在沉入自身形成的火海；同一降维机制跨城市与太阳尺度复现。
narrative_function: 给太阳二维化的高速几何变化建立总体画面，并承接叶文洁所见太阳融血意象。
transfer_rule: 炽热平面写成火海时，应同时处理火的温度、海的面积与波动、中心沉没和扩张速度。
failure_boundary: 火海不是燃烧液体，太阳残部也不受浮力下沉；海感来自平面范围和相对运动。
quality_assessment: exemplary
