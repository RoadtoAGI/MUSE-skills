tenor: 空气涌向宇宙之门形成的强旋流把水球碎片与失重小物体吸入门中，使其从647号消失
vehicle: 饥饿巨兽张口吸入猎物、咬碎并使其完全进入体内不再可见
ground: 有强力吸入；对象无法抵抗；进入中心后消失；过程迅速；可同时摄取许多对象；伴随尖啸；具有毁灭性
