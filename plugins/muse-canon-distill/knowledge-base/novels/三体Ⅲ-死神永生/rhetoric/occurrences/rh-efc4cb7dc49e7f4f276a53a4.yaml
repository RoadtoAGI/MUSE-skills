chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 空中飘浮的无数小物体也都被龙卷风吞噬
sensory_mapping: 旋涡在门前张开无形大口，尖啸着把水球和漂浮碎物一件件吸走，吞下后不留在小宇宙。
context_fact: 智子开放气体通行，压差使云雾旋涡转成龙卷风，物质经门返回大宇宙。
image_mechanism: 吞噬为流体吸入添加口腔方向与消失终点，声音、撕碎和不可抗拒共同形成兽性动作。
property_alignment: 宇宙之门对应兽口；龙卷吸力对应吞咽；小物体对应猎物；水球撕碎对应咬碎；穿门消失对应入腹；尖啸对应兽吼。
context_alignment: 归还物质虽是自愿伦理行动，现场却具有世界被吃空的暴烈感，喻体保存牺牲的身体性。
narrative_function: 把空气归还从技术步骤推进成小宇宙加速瓦解的高潮。
transfer_rule: 旋流写成吞噬时，应给出入口、吸力、猎物反应、破碎过程和不可见终点。
failure_boundary: 龙卷风无饥饿与消化，物体没有毁灭而是转移到大宇宙；吞噬描述本地消失。
quality_assessment: effective
