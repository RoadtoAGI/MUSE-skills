chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 他一手指着上方，眼中喷出火焰
sensory_mapping: 双眼喷火；怒焰外冲；面孔灼亮；热力逼人；激情燃烧
context_fact: 战士公开反对投降，称联邦把人类关在太阳系，宣誓代表全体自卫队为宇宙自由战斗到底。
image_mechanism: 不可见的政治激情先在体内燃烧，再从最能传递意志的眼睛找到喷口；手指向宇宙的动作给火焰确定了攻击方向。
property_alignment: 战士眼睛对应喷口；狂热对应燃料；愤怒对应热量；锐利目光对应火舌；激昂演说对应助燃气流；感染同伴对应引火；战争意愿对应持续燃烧
context_alignment: 自卫队刚被写成黑色战争机器，喷火目光把集体力量落实到一个发言者身上，也让程心对失控武装的恐惧可感。
narrative_function: 将抽象自由宣言变成逼近程心的身体威胁，推动她立即行使否决权。
transfer_rule: 用眼中喷火写激烈意志时，应同时有可见凝视、明确愤怒对象、语言或动作的爆发，以及可能外溢为行动的热度。
failure_boundary: 人物语气平静犹疑、目光回避，或情绪是冷淡悲伤而非外向攻击时，喷火会误写能量方向。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 自卫队战士谈到联邦将剥夺星际自由时，从目光和表情中爆发出的狂热、愤怒与战斗意志
vehicle: 高温火焰从眼睛向外喷射，能灼伤面前对象并显示内部正在剧烈燃烧
ground: 眼神对应喷口；激情对应燃料；愤怒强度对应高温；目光外射对应火焰喷出；战斗号召对应点燃他人；失控情绪对应火势爆发
