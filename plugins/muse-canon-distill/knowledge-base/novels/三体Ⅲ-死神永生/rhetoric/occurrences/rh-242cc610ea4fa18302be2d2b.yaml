chapter: 【公元1453年5月，魔法师之死】
figure_type: metaphor
quote: 之后，这个世界又回到了正常的轨道上
sensory_mapping: 不可见物理法则成为一条固定轨道，二十五天魔法期成为世界整体的一次脱轨与复轨。
context_fact: 高维碎块接触地球期间狄奥伦娜可穿越三维封闭，碎块离开后能力消失。
image_mechanism: 轨道同时给出常态路径、偏离区间和回归节点，把一段超自然插曲嵌进物理宇宙仍连续运行的模型。
property_alignment: 常规物理对应固定轨道；高维接触对应外力造成偏航；碎块离开对应复轨；能力终止对应运行恢复可预测。
context_alignment: 叙述用现代物理解释中世纪魔法，轨道模型让神迹成为局部维度事件，而非世界法则永久改变。
narrative_function: 关闭魔法框架，恢复历史因果，并把奇观限定在精确时间窗内。
transfer_rule: 用轨道写规则恢复时，应明确常态、扰动源与复归时点；适合可重复预测的系统，不适合不可逆转型。
failure_boundary: 若高维接触永久改变世界或后续仍持续出现魔法，复轨判断就错误；所谓正常若从未建立，也无既定轨道可回。
