tenor: 高维碎块离开后恢复常规物理规律的世界
vehicle: 短暂偏离路线后重新进入既定轨道运行的天体或列车
ground: 系统通常沿稳定规则演化；异常外力使其短时偏离，外力消失后恢复可预测路径
