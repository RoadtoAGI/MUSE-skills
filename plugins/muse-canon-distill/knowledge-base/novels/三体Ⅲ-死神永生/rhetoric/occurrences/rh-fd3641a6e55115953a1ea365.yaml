figure_type: simile
quote: 立刻触电似的后退了一步
sensory_mapping: 恐惧的心理刺激被改造成电流进入身体，后退获得肌肉痉挛般的速度和硬度。
context_fact: 杨冬扶栏俯视深渊，既恐惧又受诱惑；栏杆摇晃的错觉触发退步。
image_mechanism: 深渊诱惑尚在意识层，触电反射却让求生本能抢先接管肌肉，一步后退显出两种意志的瞬间胜负。
property_alignment: 栏杆晃动的刺激对应电接触；立刻后退对应触电弹开；无思考动作对应神经反射先于意识。
context_alignment: 她正接近自杀决定，身体仍本能避险；触电般撤退准确保留这种尚未统一的内外冲突。
narrative_function: 以急促身体节拍打断凝视深渊，显示死亡诱惑与求生反射并存。
transfer_rule: 瞬时动作借反射喻体时，应明确刺激点、撤离方向和意识延迟，使速度来自因果链而非单纯强调。
failure_boundary: 若她从容后退、先作决定再移动，触电的无意识反射就不成立；没有接触物或突然刺激时也会显得套用。
