chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 火星城市像蛋壳般脆弱
sensory_mapping: 火星城罩壳化成一层薄蛋壳，水滴只需啄开一点，内部空气和生命便从裂口泄尽。
context_fact: 两个水滴长期监视火星，城市一旦被撞击减压，全部居民都可能死亡。
image_mechanism: 蛋壳同时解释材料脆弱和气密整体性，使一次撞击为何成为灭顶灾难无需技术展开。
property_alignment: 城市密闭外壳对应蛋壳；内部居民对应壳内生命；水滴穿孔对应壳裂；减压对应内部环境流失。
context_alignment: 上一段地球如石下鸡蛋，这里把同一脆弱框架缩到火星城市外壳，延续占领期力量关系。
narrative_function: 说明火星即使保有现代技术也不敢制造广播器，技术能力被生存结构反制。
transfer_rule: 密闭栖居地比作蛋壳时，应对应外壁、内部环境、破口和整体后果。
failure_boundary: 城市可能有隔舱和修复系统，并非一孔必毁；蛋壳不能说明实际材料强度或撞击范围。
