review_status: reviewed
tenor: 依靠密闭结构维持气压、被水滴撞穿就会整体减压的火星城市
vehicle: 薄而封闭、内部自成环境，一处破裂便失去完整性的蛋壳
ground: 外壁薄脆；内部生存依赖完整密封；局部穿孔可危及全部内部生命
