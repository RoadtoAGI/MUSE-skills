chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 原三维世界中的每一个原子，都以铁的规则投射到二维空间平面上相应的位置
sensory_mapping: 每个原子像被一条冷硬铁轨锁住，只能落到规则指定的位置，谁也不能遮住谁。
context_fact: 投影精确到细菌和原子，所有细节必须在平面排列，不能重叠或被遮挡。
image_mechanism: 把抽象定律赋予金属硬度，使读者感到降维不是混乱压扁，而是极端精确、冷酷的秩序。
property_alignment: 规则必然性对应铁的硬度；不可偏离对应不可弯折；全原子适用对应统一铸模；精确位置对应固定轨道。
context_alignment: 人类法律在末日前可被废止，宇宙的铁规则却仍逐原子执行，权力层级形成反差。
narrative_function: 强调二维图纸的原子级可信度，同时把物理精确转化为令人窒息的强制感。
transfer_rule: 规则比作硬质材料时，应指出不可变、适用范围、执行精度和与可变人类规则的对照。
failure_boundary: 法则没有材质或机械轨道，“铁”不表示它由金属产生，也不证明人类已完整理解其数学形式。
quality_assessment: conventional
confidence: 0.99
review_status: reviewed
tenor: 三维原子向二维位置映射时绝对执行、没有例外的不重叠物理法则
vehicle: 像铁器一样坚硬、不可弯折或撼动的强制规则
ground: 约束刚性；不能协商；适用于全部对象；结果固定；外力不能改变；无例外执行
