chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 像是顺口滑出的一个余音
sensory_mapping: 惊天咆哮留下声场尾巴，决定人命的短句像一小段余振沿空气滑出。
context_fact: 维德先狂吼前进，随即平静提出将候选人送到一光年外，众人很久才意识到其含义。
image_mechanism: 余音以低显著度掩盖巨大语义重量；声学上的次要与决策上的核心发生反差，表现维德冷酷。
property_alignment: 语调冰冷低调对应余音微弱；紧随咆哮对应主声后残响；听众迟悟对应余音不引注意。
context_alignment: 对维德而言极端方案只是前进逻辑的自然续句，余音准确呈现他对牺牲的无情感加重。
narrative_function: 延迟听众与读者理解，在轻声中落下比咆哮更严重的行动命令。
transfer_rule: 重大内容借余音写时，需要前一强声作声学参照，并让听者延迟反应证明低显著度；反差必须服务人物态度。
failure_boundary: 若短句独立高声宣布、反复强调或立刻引爆回应，就不是顺口余音；没有前一咆哮也缺少主声。
