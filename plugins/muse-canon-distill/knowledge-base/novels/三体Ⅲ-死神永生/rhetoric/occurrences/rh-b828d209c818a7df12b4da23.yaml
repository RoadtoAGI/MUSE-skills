tenor: 维德恢复冰冷语调后轻描淡写说出的把人送到奥尔特星云
vehicle: 宏大声响结束后无意间滑出的微弱尾音
ground: 音量和注意度低于前一声响；表面像附带残留，实际延续并完成前一动作的后果
