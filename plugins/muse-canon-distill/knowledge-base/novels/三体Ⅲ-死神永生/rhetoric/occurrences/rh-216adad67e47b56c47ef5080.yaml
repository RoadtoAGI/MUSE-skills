review_status: reviewed
tenor: 木星方向所有频道同时充斥无数人呐喊、哭泣、狂笑和歌唱形成的混杂音频
vehicle: 由无数水滴和浪头组成、覆盖广大空间、躁动翻涌并淹没个别声音的海洋与人海
ground: 总量巨大；连续覆盖频道；局部声音相互叠压；整体不断起伏；个体内容难辨；具有淹没感；充满整个感知空间
