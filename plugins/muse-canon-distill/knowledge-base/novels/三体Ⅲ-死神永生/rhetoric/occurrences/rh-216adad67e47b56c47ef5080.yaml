chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 在每一个通信和广播预道上，都是一片声音的海洋，大部分是人声，仿佛太阳系空间已被躁动的人海填满
sensory_mapping: 每个频道都涌进人声潮水，哭喊与狂笑卷成浪头，单句话刚露出便被下一层声浪吞没。
context_fact: 可识别视频几乎消失，政府广播已经中断，末日人口只能以未经组织的声音同时出现。
image_mechanism: 海洋将数量与音量合并，声浪把波动物理性和情绪躁动叠合；太阳系空间仿佛被最后的人声填实。
property_alignment: 频道对应海域；个别人声对应水滴；音量起伏对应浪；内容覆盖对应淹没；全频道同时发声对应人海填满。
context_alignment: 实体人海已化为人雨和二维符号，剩余人类又在通信中组成声音人海，身体消失前留下最后一层波动。
narrative_function: 用听觉总景呈现文明秩序瓦解，同时保留无数个体临终反应的混杂存在。
transfer_rule: 多声源写成海洋时，应具体对应声音单元、波幅、覆盖、不可辨原因和传播空间。
failure_boundary: 声音没有液体体积，也未真的填满真空；通信系统把分散信号汇入接收端才形成海感。
quality_assessment: exemplary
