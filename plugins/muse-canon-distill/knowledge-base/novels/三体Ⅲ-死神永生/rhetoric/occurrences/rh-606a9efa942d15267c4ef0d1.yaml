figure_type: simile
quote: 前排一座太空城突然发出蓝光，像是太空中出现了一个蓝色小太阳
sensory_mapping: 蓝色小日；骤然升亮；深黑影子；太空光团；城市被照
context_fact: 木星引力不断拉近太空城，城市需周期启动高耗能推进器维持距离。
image_mechanism: 城市尾部的多台发动机在远处合成一个完整蓝日，周围真实太阳被木星遮住，这颗人造小太阳便暂时接管照明。
property_alignment: 推进器阵列对应太阳；蓝色光焰对应恒星光；点火对应太阳出现；太空城对应发光天体；人艇深影对应日照投影；巨大能耗对应恒星级亮感
context_alignment: 城市本已像星球，推进器点亮后又短暂成为太阳，人造世界以天体语言完整进入掩体群落。
narrative_function: 让抽象位置维持获得醒目视觉，并提示其巨大能耗。
transfer_rule: 用小太阳写推进器群时，应有远景合光、强亮度、明确色温、照明与投影效应和突然点火。
failure_boundary: 光焰微弱分散、无法照亮环境或只短促闪一下时，小太阳会夸大持续与能量。
