quote: 如果千秋功罪真有人评说，现在已经可以派一个人去解释岁月造成的误会
sensory_mapping: 未来成为历史法庭，阶梯计划被摆上审判席，程心躺入冬眠舱等于提前赶赴尚未开庭的证人席。
context_fact: 飞行器偏航后程心已无联络任务，PIA仍让她作为大型工程联络员进入未来，以免计划被遗忘误解。
image_mechanism: 评说、功罪、派人解释组成完整审判结构，把抽象历史记忆问题转成证据缺口和证人保存。
property_alignment: 后世评价对应法庭裁断；计划得失对应功罪案情；档案失真对应岁月误会；冬眠联络员对应跨时证人。
context_alignment: 阶梯计划既成功推进又失去目标，后世极易只看结果；活人能携带决策背景，确有证词价值。
narrative_function: 给程心继续冬眠提供超越项目失败的理由，也把她送入威慑纪元的偶然命运合法化。
transfer_rule: 历史评价如审判时，应指出案情、证据缺口、裁判者和证人；保存人物必须能提供档案之外的信息。
failure_boundary: 若资料已完整无歧义、亲历者同样偏见严重，证人不一定能消除误会；后世也未必形成统一法庭。
