chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 像一群动弹不得的靶子
sensory_mapping: 漂浮人体压平为靶纸轮廓，宪兵枪线从四周交汇，失重空间变成封闭射场。
context_fact: 宪兵关闭磁力鞋并命令交枪，否则不保证生命安全。
image_mechanism: 靶子把失重的物理无支撑转成战术无防御，动弹不得同时覆盖姿态与权力状态。
property_alignment: 无法移动对应固定靶；被枪口围指对应瞄准线；群体漂浮对应多靶排列。
context_alignment: 他们曾是战舰战士，此刻连站立和还击都被技术剥夺，靶化完成身份反转。
narrative_function: 以静态图像显示逮捕方绝对控制，使威胁无需开枪也成立。
transfer_rule: 人物如靶须有行动权被剥夺、明确瞄准者和单向伤害关系；单纯站着不动不足。
failure_boundary: 若官兵仍能机动、反击或枪口未对准，固定靶的绝对被动会误写局势。
quality_assessment: effective
