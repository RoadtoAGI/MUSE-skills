chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 如果光粒从近距离的飞船上发射，便几乎没有预警的机会，就像三体世界的命运一样
sensory_mapping: 近处暗船；骤发光粒；恒星瞬爆；警报未响；文明来不及转身
context_fact: 太阳系预警可对远方发射提供一至两年，但近距隐蔽飞船能消除这段光行时差。
image_mechanism: 三体毁灭被作为已经完成的实验模型叠到太阳系上：发射距离一缩短，警报时间也归零，地球会像已消失的三体世界一样先遭命中再被观测。
property_alignment: 太阳系对应三体星系；太阳对应被击恒星；近距敌船对应光粒发射源；预警系统对应观测站；光行时差对应反应窗口；窗口消失对应三体无预警；掩体计划对应来不及启动
context_alignment: 读者即将通过超级望远镜看到三体墓场，历史事实使风险类比具有证据而非抽象恐吓。
narrative_function: 限定预警系统能力，防止掩体计划被误解为必然有准备时间。
transfer_rule: 用历史灾难类比未来风险时，应匹配攻击机制、发射距离、信息传播延迟、反应窗口和最终损害。
failure_boundary: 太阳系能直接探测近距敌船、拦截发射，或攻击机制速度显著不同，则三体无预警命运不能直接复制。
