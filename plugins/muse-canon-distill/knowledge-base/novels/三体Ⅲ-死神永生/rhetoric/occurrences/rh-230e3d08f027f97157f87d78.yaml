tenor: 宣传画号召不同族群的人以生命、身体和团结共同建设太阳系防御体系
vehicle: 人们把自身血肉当砖石，肩并肩砌成绵长坚固城墙，阻挡墙外入侵者
ground: 防御依赖大量个体共同组成；成员承担生命代价；结构需连续无缺口；目标是阻挡外敌
