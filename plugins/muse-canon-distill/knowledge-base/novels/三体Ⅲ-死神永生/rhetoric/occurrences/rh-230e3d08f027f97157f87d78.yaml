chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 用我们的血肉筑起太阳系的长城
sensory_mapping: 画中手挽手的人群化成砖块，身体一层层砌向行星轨道，血色灰浆把太阳系围成长墙。
context_fact: 海报背景是联合国旗，不同肤色的人组成致密人墙，宣传危机初期太阳系防御建设。
image_mechanism: 血肉筑墙把牺牲口号和画面人墙合为施工动作，个体团结从抽象价值变成结构承重关系。
property_alignment: 个人身体对应砖石；手挽手对应墙体连接；牺牲对应血肉材料；防御系统对应长城；三体威胁对应墙外敌人。
context_alignment: 程心刚看到太空电梯等旧工程实物，海报把这些技术成果重新接回建设者身体和危机激情。
narrative_function: 呈现危机纪元动员语言的集体主义力度，并与广播纪元享乐、祈祷形成时代对照。
transfer_rule: 群体如防墙时，应对应成员材料、连接方式、承受方向、保护对象和付出的身体成本。
failure_boundary: 防御工程主要由技术和资源建成，不应把真实生命工具化为建筑材料；口号带有战争宣传夸张。
quality_assessment: effective
