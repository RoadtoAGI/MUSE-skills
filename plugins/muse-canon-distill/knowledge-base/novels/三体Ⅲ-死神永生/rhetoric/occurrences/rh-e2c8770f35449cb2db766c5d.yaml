chapter: 地球文明
figure_type: analogy
quote: 在他的画中，空间与山、麦田、房屋和树一样，也充满了细微的躁动
sensory_mapping: 天空和物体共享一层短促旋动的笔触，空处也像麦浪、树冠和山体一样微微发颤。
context_fact: 程心由弦论想到空间也由振动微弦构成，并认为凡·高在《星空》中画出了这些弦。
image_mechanism: 实体类比取消背景与前景的等级，把不可见空间转成与物体同样有纹理和运动的可视材料。
property_alignment: 空间笔触对应物体表面；旋涡对应麦田树木的动势；微弦振动对应细微躁动；满幅纹理对应共同结构。
context_alignment: 太阳系正被二维化，空间不再是空容器而成为可改变、可坍缩的实体结构，画作因此获得预言感。
narrative_function: 把艺术观看、弦论和降维灾难叠合，使《星空》从名画文物转为理解宇宙结局的视觉模型。
transfer_rule: 让背景像实体时，应指出共享纹理、运动、结构及该改写如何响应场景中的物理问题。
failure_boundary: 凡·高未必在表现微弦，画面躁动是程心的理论化解读；空间在画布上也不是真实物质。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 凡·高画中通常作为空白背景的空间呈现连续旋动、振颤的笔触和内在结构
vehicle: 山、麦田、房屋和树这些有实体、有表面、能够显出动态的物质对象
ground: 都有可见纹理；都占据画面；都带运动感；都不是被动空白；都以笔触形成结构
