chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: analogy
quote: 那感觉就像在一条大河中顺流漂了很久，终于精疲力竭地上了岸，静止下来，看着大河在眼前流淌，看着熟悉的水面漂向远方
sensory_mapping: 宽阔大河；随流漂泊；湿身上岸；静坐岸边；熟悉水面远去
context_fact: 两人把公司交给维德后冬眠，计划在掩体纪元未来醒来，外部世界将继续多年。
image_mechanism: 连续意识被放进河水，过去岁月一直推着她们前行；低温到来像双手终于抓住岸沿，身体停止，时间水面却从眼前带走熟悉时代。
property_alignment: 生命经历对应大河；程心意识对应漂流者；时代推进对应水流；长期疲惫对应精疲力竭；冬眠启动对应上岸；主观停时对应静止；外界历史对应继续远流；未来苏醒对应再次入河
context_alignment: 程心多次跨纪元冬眠，每次都从历史水流中暂时退出；‘熟悉水面’远去准确写她对当下关系的告别。
narrative_function: 把生理意识模糊转成时间位置变化，完成广播纪元向掩体纪元的过渡。
transfer_rule: 用上岸写冬眠或暂停时，应对应此前随流经历、疲惫触发、主体静止、外部时间继续和熟悉时代远离。
failure_boundary: 暂停期间外界时间也冻结、人物仍持续感知参与，或休眠很短无时代变化时，上岸看河远去会夸大脱离。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心和AA进入冬眠时意识逐渐脱离连续时间流，停止参与外界生活，却保留最后片刻旁观感
vehicle: 旅人在大河中随水长途漂流，耗尽体力后爬上岸停住，看着河水独自继续奔向远方
ground: 人生时间对应河流；意识随时间经历对应顺流漂；疲惫进入冬眠对应精疲力竭上岸；主观时间停止对应岸上静止；外界纪元继续对应河水远去
