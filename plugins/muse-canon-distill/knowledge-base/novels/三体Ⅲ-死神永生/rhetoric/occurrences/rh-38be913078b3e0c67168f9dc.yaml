chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 在空寂的城市和原野上像猎鹰一样盘旋，见人就杀
sensory_mapping: 飞行车化成鹰影在空城上空绕圈，狙击镜像锐眼扫过地面，发现人点便压低航线扑杀。
context_fact: 移民期限结束后，治安军奉智子命令清除澳大利亚外所有人类。
image_mechanism: 猎鹰将监视、机动和击杀串成完整捕食链，也把幸存者降为无遮蔽猎物。
property_alignment: 飞行车高巡对应鹰盘旋；传感搜索对应锐眼；散落人类对应小猎物；激光射击对应俯冲捕杀。
context_alignment: 各大陆已成空城和原野，开阔地形使天空捕食者拥有绝对视野，贴合游猎场景。
narrative_function: 把清除命令转成持续可见的狩猎日常，解释抵抗组织为何不能大规模集结。
transfer_rule: 空中追杀如猛禽狩猎时，应匹配搜索高度、盘旋轨迹、猎物尺度和攻击触发。
failure_boundary: 飞行车靠技术传感和远程枪械，不具鹰的生物本能；城市遮蔽物也可能中断开阔猎场。
