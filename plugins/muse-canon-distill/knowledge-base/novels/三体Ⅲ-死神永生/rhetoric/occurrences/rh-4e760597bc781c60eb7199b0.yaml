chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 使现在的三体星系成为了辐射的熔炉，对生命和文明来说是一个死亡之域
sensory_mapping: 星系熔炉；银云灼热；双星炉火；辐射禁域；无生命墓场
context_fact: 黑暗森林打击只毁一颗恒星，保留双星吸积星云，反而让强辐射长期持续。
image_mechanism: 看似柔和银云内部被揭为工业炉膛，幸存恒星不是希望光源而是持续加热器；视觉美丽与生物致死共享同一发光机制。
property_alignment: 三体星系对应熔炉；双星对应炉火；星云物质对应炉料；吸积对应进料；强辐射对应热浪；星云自发光对应炉膛亮；文明对应被焚物；星系边界对应死亡区
context_alignment: 清理者故意保留两星提高杀伤持久性，熔炉意象准确表现打击的“毒辣”并拆掉稳定双星的梦想。
narrative_function: 反转壮丽星云观感，解释为何物质未消失却生命彻底毁灭。
transfer_rule: 用熔炉写天体区域时，应有持续能量源、物质流入、强辐射或高温和生命无法承受的空间范围。
failure_boundary: 星云只是冷尘反射光、辐射低且可居住，或能量爆发已结束时，熔炉会错写持续机制。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 三体恒星爆发残骸被幸存双星持续吸积，释放强辐射，使整个星系长期不适合生命生存
vehicle: 高温熔炉持续吞入物料并向四周放出灼热辐射，炉区成为任何生命进入都会死亡的禁域
ground: 星云吸积对应熔炉进料；强辐射对应炉热；双星对应炉火；星系范围对应炉膛；生命灭绝对应入炉烧毁；长期发光对应炉火持续；死亡之域对应危险禁区
