chapter: 【威慑纪元61年，执剑人】
figure_type: metaphor
quote: 你们都很出色，但挡道的棋子都应清除
sensory_mapping: PIA与执剑人竞争变成棋盘，维德站在盘外伸手，瓦季姆和程心缩成挡线棋子，被逐枚清出格子。
context_fact: 维德承认杀死瓦季姆以推进阶梯计划，此刻又开枪清除可能赢得执剑人选举的程心。
image_mechanism: 棋子保留人物能力却剥除其目的，挡道把谋杀合理化为版面整理，清除一词显出角色极端工具理性。
property_alignment: 总体计划对应棋局；维德控制对应棋手；人才作用对应棋子价值；阻碍目标对应挡住棋路；谋杀对应清出棋盘。
context_alignment: 他反复宣称只许前进，棋局模型说明不择手段在其思想中意味着连己方人才也只按路径处置。
narrative_function: 以角色自述统一两次谋杀动机，确立维德与程心尊重个体生命之间最尖锐的伦理差异。
transfer_rule: 人物如棋子时，应明确棋手、目标、走法和被牺牲原因；若用于批判，应显示能动性被剥夺的代价。
failure_boundary: 合作成员能共同决定目标、拒绝命令或离开项目时，单向棋手模型会抹除权力边界；出色也不等于可牺牲。
quality_assessment: exemplary
