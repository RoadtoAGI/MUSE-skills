review_status: reviewed
tenor: 维德把瓦季姆和程心等能力出众却妨碍其计划的人视为可杀死、可替换的工具
vehicle: 棋局中虽有价值却占住进攻路线的棋子，被棋手从棋盘上直接拿走
ground: 个体价值只按是否服务目标计算；一旦妨碍前进，主体生命和自主性都可被上位操盘者取消
