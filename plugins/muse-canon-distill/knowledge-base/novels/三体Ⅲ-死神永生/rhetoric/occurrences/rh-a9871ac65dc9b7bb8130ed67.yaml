chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 像轻风般拂过她的面颊
sensory_mapping: 无形轻风；面颊微拂；扰动外扩；短触即逝；机器低鸣
context_fact: 曲率装置启动时管道发红并发出低鸣，但无热量溢出，程心不确定自己感到的扰动是否真实。
image_mechanism: 无法看见的时空效应借皮肤最熟悉的轻风触感取得存在感，机器中心仿佛吹出一圈没有温度的气流。
property_alignment: 空间扰动对应风；平台中心对应风源；径向扩散对应气流推进；微弱触觉对应轻拂；不可见对应透明空气；短时感受对应风过；不确定性对应难辨微风
context_alignment: 实验对象极小、效应理论陌生，轻风把伟大技术首次启动压到几乎不可确认的人体尺度，保留悬疑。
narrative_function: 给不可视物理过程提供触觉入口，同时用“也许幻觉”控制奇观强度。
transfer_rule: 用轻风写无形场扰动时，应呈现方向性扩散、皮肤轻触、低强度和短持续，并避免同时出现与风矛盾的灼热重压。
failure_boundary: 扰动剧烈冲击、伴随高热或可见物质喷射，或人物完全没有身体触感时，轻风会削弱真实强度。
quality_assessment: functional
confidence: 0.96
review_status: reviewed
tenor: 机器启动后从小平台向外扩散、不可见且可能只是幻觉的微弱空间扰动触感
vehicle: 一阵力度很轻、看不见形体的风掠过面颊，留下短暂柔和触觉后继续扩散
ground: 无形扰动对应无形风；向外扩散对应风掠过；面颊触感对应风触皮肤；力度微弱对应轻风；短暂经过对应一拂而过；来源难辨对应看不见气流
