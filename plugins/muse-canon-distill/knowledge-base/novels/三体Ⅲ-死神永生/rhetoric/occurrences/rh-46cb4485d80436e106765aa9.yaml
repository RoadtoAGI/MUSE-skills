chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 就像一个与父母暂时走失的孩子，对所遇到的根本没有父母的野孩子更加恐惧和不信任
sensory_mapping: 两艘深空战舰缩成荒野中的两个孩子，地球成为暂时看不见的父母，返航通信成为仍系在身上的家庭线索。
context_fact: 万有引力号通信中断却计划抓捕后返航；蓝色空间号已在黑暗战役后选择无源远航。
image_mechanism: 走失与无父母只差一个时间副词，却划出能否回归秩序的根本界线；前者因看见自己的可能未来而更恐惧后者。
property_alignment: 地球文明对应父母；暂时断联对应走失；仍计划返航对应等待团聚；蓝色空间号独立生存对应无父母野孩子。
context_alignment: 文本随后明确前者有源、后者无源，亲子来源模型正好将物理同航与精神分途区分开。
narrative_function: 解释追捕者为何在同样孤独后反而加深敌意，并预示来源秩序即将失效。
transfer_rule: 用家庭关系解释群体归属时，应明确共同来源、断联时长和返归预期；比较焦点应落在制度依附程度。
failure_boundary: 若双方都已自愿永久独立，走失与野孩子的差别消失；喻体也不能证明独立群体道德上更危险。
