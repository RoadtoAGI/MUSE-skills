review_status: reviewed
tenor: 暂时失去地球实时通信的万有引力号船员对永久脱离地球的蓝色空间号成员的态度
vehicle: 短暂与父母走散、仍期待团聚的孩子遇见从来没有父母和家庭规训的野孩子
ground: 一方仍以共同来源和返归为安全基础；另一方已脱离同一秩序，因而被前者视为不可理解且危险
