chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 在这种月光中，树形建筑更像巨树了，投下大片的阴影
sensory_mapping: 银冷光线抹去建筑材质，密集楼叶连成树冠，整幢高楼在地面压下一片森林般黑影。
context_fact: 城市停电且停止自转，核聚变太阳只发月光般冷光，繁华建筑失去日常照明和人流。
image_mechanism: 冷光隐去技术细节，保留树形轮廓和影子，使仿生建筑短暂退回自然原型，也失去文明活性。
property_alignment: 建筑主轴对应树干；建筑叶子对应树叶；密集上部对应树冠；高大尺度对应巨树；投影对应林荫。
context_alignment: 人类曾用技术造出人工生态形态，末日停电后这些成果只剩沉默巨树的外壳。
narrative_function: 把城市繁荣遗迹化，为紧接着的森林废墟总景建立空间骨架。
transfer_rule: 仿生建筑回比自然原型时，应由特定光线或状态改变突出轮廓、枝叶、尺度和阴影。
failure_boundary: 建筑没有生长、木质或生态功能；相似主要来自设计形态和冷光剪影，属于较直观的外形比照。
