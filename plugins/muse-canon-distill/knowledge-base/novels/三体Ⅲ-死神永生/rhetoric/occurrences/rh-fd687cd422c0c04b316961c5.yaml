chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 它们现在零乱地竖立在发射港的停泊区，像一片钢铁植物的丛林
sensory_mapping: 银灰树干；尾翼枝叶；密集林冠；竖直生长；金属冷光
context_fact: 发射港停有一百多架垂直起飞穿梭机，机库仍在不断移出更多载具。
image_mechanism: 横卧飞机的熟悉姿态被翻成竖直，机身像茎干从场坪长出，尾翼在高处展开成枝叶；数量一多，工业设备便形成可穿行的冷硬林地。
property_alignment: 穿梭机对应植物；机身对应树干；尾翼对应枝叶；垂直停放对应生长；尺寸差异对应林木高低；金属外壳对应钢铁材质；发射场对应土壤；密集排列对应丛林
context_alignment: 城市车流刚像蝗群，发射港又长出钢铁植物，危机把高度技术化空间重新组织成失控生态。
narrative_function: 建立发射场规模与视觉复杂度，为人群在各机间抢登制造迷宫感。
transfer_rule: 用丛林写竖立设备群时，应匹配垂直主干、顶部附件、高低差、密集遮挡、材质反转和可穿行空间。
failure_boundary: 设备平放整齐、数量稀少或高度一致如围栏时，丛林会夸大层次和杂乱。
quality_assessment: exemplary
