chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 地球成了一座大教堂，成为了一颗祈祷之星
sensory_mapping: 陆地和城市连成一座行星教堂，夜空十字架像尖顶，亿万祷词从地表汇成光声向宇宙升起。
context_fact: 全球礼拜频繁举行，人们饭前睡前祈祷，近地轨道还建有巨型十字架和太空教堂。
image_mechanism: 大教堂把分散仪式统一到一个建筑内部，祈祷之星再从外部命名整颗地球，使宗教化同时有内视和宇宙远视。
property_alignment: 地球对应教堂建筑；各地人群对应会众；轨道十字架对应教堂标志；共同祷词对应礼拜；宇宙广播愿望对应星体祈祷。
context_alignment: 安全声明必须让远方文明一眼识别，祈祷之星恰是公众希望赋予地球的可见身份，却仍只有人类自己听见。
narrative_function: 用行星尺度总景概括宗教复兴，并引出下一段具体的轨道礼拜画面。
transfer_rule: 世界如仪式建筑时，应把居民、标志、重复行为、共同对象和外部观看形象逐项安置。
failure_boundary: 地球仍有世俗社会和多种立场，祈祷也无法成为可被全宇宙理解的声明；大教堂指主导氛围。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 宗教全面复兴后，全地球人口在日常和全球礼拜中共同祈求宇宙安全声明
vehicle: 整座建筑都服务于礼拜的巨型教堂，以及持续向外发出祷告的宗教星体
ground: 活动覆盖整个空间；参与者高度普遍；共同话语指向超越者；场所身份由生活世界转为礼拜设施
