chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 他们来的路像一条把世界分成两部分的长线
sensory_mapping: 山冈下的大地摊成平面，道路从脚边划向天边，像尺子画出的一笔把田野切开。
context_fact: 马车连夜逃离王宫，登高后公主第一次从远处看见来路和故土全景。
image_mechanism: 高视点压平地貌，实际道路因此转成几何线，长线把逃亡距离变成一眼可量的图形。
property_alignment: 道路对应线条；两侧田野对应分割区域；山冈俯瞰对应平面视图；王宫方向对应线端。
context_alignment: 整个童话围绕绘画与平面展开，现实风景也主动变成图纸，模糊画内画外边界。
narrative_function: 展示逃离距离并引导视线到线端王宫，为下一积木喻体完成尺度缩小。
transfer_rule: 道路写成分割线时，应设置俯视角度、延伸方向、两侧区域和明确端点。
failure_boundary: 道路有宽度起伏且不真正割裂世界，分成两半只是远眺构图。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 从山冈回望时笔直延伸、穿过广阔王国直达天边的来路
vehicle: 画在平面上的一条极长直线，把整幅画面切成左右两个区域
ground: 形态细长；方向明确；从近处延至远点；在俯视平面中形成分割；两侧景物展开
