chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 像一块轻轻盖向君士坦丁堡的金色裹尸布
sensory_mapping: 金色尘幕被赋予布料的柔软垂落，夕阳暖色与裹尸用途的寒意在同一画面碰撞。
context_fact: 皇帝想象巨炮制造的飞尘越过缺口飘向即将陷落的城市。
image_mechanism: 尘埃成为覆盖整座城的葬具，轻轻把慢速飘落写成葬礼动作，金色又保留帝都最后的辉煌。
property_alignment: 弥漫尘幕对应展开的布面；由空中缓慢下沉对应裹尸布被轻放；君士坦丁堡将亡对应被覆盖的尸体；夕阳金辉对应华美布色。
context_alignment: 城市尚在抵抗，皇帝的想象却已预演其死亡；华丽与送葬并置，准确承接拜占庭末日的庄严感。
narrative_function: 提前宣告城陷结局，把局部炮击提升为文明葬礼，并以柔缓动作反衬暴力来源。
transfer_rule: 预示整体毁灭时，可让正在扩散的环境物成为覆盖物；颜色既应来自现场光线，也要承载对象自身的历史气质。
failure_boundary: 尘埃若急速横扫或只在地面翻滚，就没有盖下的垂直过程；城市若无死亡威胁，裹尸布会成为过度凶兆。
