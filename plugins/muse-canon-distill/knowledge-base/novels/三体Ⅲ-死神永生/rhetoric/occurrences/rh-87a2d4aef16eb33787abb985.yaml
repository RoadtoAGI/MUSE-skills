chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 车体却不可遏止地随着周围的沙子向坑移动，像放在一张被拉动的桌布上的盘子
sensory_mapping: 汽车像一只盘子停在黄布上，轮胎徒劳旋转，整张沙布却把它平平拖向桌沿。
context_fact: 这是白Ice噩梦中的沙漠崩塌，沙坑扩大后周围沙层整体向内流动。
image_mechanism: 桌布类比把局部车辆运动与底层空间运动分离，预演飞船加速却被流动空间拖回二维面的机制。
property_alignment: 汽车对应盘子；流沙层对应桌布；车轮空转对应盘子自身不走；沙层内移对应拉布；坑沿对应桌沿。
context_alignment: 梦把尚未发生的空间跌落翻译成家常力学图景，为白Ice醒后直觉提供可操作模型。
narrative_function: 让逃跑失败的原因直观可见，并提前解释启示号为何有过载却无加速。
transfer_rule: 载体拖动对象时，应分别标出对象自驱、承载面运动、相对速度和边缘终点。
failure_boundary: 盘子与桌布主要靠摩擦，飞船则随空间流动；机制只在参照系关系上相似。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 车轮全功率空转、车辆仍被整体流动的沙层拖向扩张深坑的运动
vehicle: 盘子与桌面无固定连接，桌布被横向拉走时盘子随承载面一起平移
ground: 主体自身驱动失效；承载面整体移动；相对承载面近乎静止；外部拖动方向决定命运
