chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 程心和AA是仅有的画外人
sensory_mapping: 太阳系巨画已经完成，只有星环号舱内两人还站在画框外，看着所有故人定格其中。
context_fact: 最后人声已经中断，星环号是太阳系唯一仍在二维面之外的人造物，但仍持续跌向平面。
image_mechanism: 画外人以艺术观看位置表达物种级孤独：她们的幸存既是距离，也是被迫见证。
property_alignment: 二维太阳系对应画；全人类对应画中人物；星环号对应画外观看点；尚未二维化对应未入画；跌落对应接近画框。
context_alignment: 罗辑刚说进画，信号中断后两人成为唯一画外人；同一措辞清晰划开生死边界。
narrative_function: 压缩太阳系人口归零后的状态，并把两人的逃生压力转为最后见证者责任。
transfer_rule: 幸存者写成画外人时，应建立完整画面、画内群体、画框边界、观看职责和即将跨界的风险。
failure_boundary: 二维太阳系仍是物理空间，程心AA也不在真正画廊；画外只表示暂未降维。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 太阳系所有其他人造物和人类都已二维化后，仍暂处三维空间的程心与AA
vehicle: 一幅画已经容纳全部场景，只有两名观看者站在画框之外尚未被画入
ground: 人数仅剩两人；与平面图像空间分隔；能够观看全画；随时可能进入画中；承担外部见证；原共同体皆在画内
