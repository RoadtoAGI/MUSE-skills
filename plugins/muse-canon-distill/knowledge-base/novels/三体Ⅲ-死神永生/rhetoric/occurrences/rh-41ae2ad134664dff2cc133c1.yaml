chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 山下全是云海，望不到边，被上空的满月照着，一片银色，很像现在看到的样子
sensory_mapping: 月下银云；峨眉峰顶；无边云海；柔和亮面；高处俯视
context_fact: 瓦西里看见三体爆发后三年的螺旋星云，联想到自己曾在峨眉山看到的月夜景色。
image_mechanism: 四十万亿千米外的毁灭残云被拉回一次山顶记忆，恒星光换成满月，宇宙物质换成脚下云海；相同银色让两个尺度短暂重合。
property_alignment: 三体星云对应峨眉云海；残余恒星光对应月光；银白色对应月照颜色；螺旋云团对应云层起伏；太空观测站对应山顶视点；巨大尺度对应无边云面
context_alignment: 人物用地球最美月景理解外星墓场，使毁灭图像保持审美美丽，也暴露观测者的距离。
narrative_function: 在科学观测中注入私人记忆，为下一句物质不灭、生命消失的感慨铺垫。
transfer_rule: 用月下云海写星云时，应匹配银色照明、云状结构、无边延展、高处视点和美景与事件含义的反差。
failure_boundary: 星云暗红尖锐、局部细小，或观察重点是高速喷流而非柔云时，月海会软化结构。
