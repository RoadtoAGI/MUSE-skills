chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 他在失重中的动作却很稳健，仿佛仍然有重力作用在他身上一般
sensory_mapping: 脚下重力；身体下沉；稳健步态；固定竖直；失重中不飘
context_fact: 维德从对面太空艇飘来，实际处于微重力，却比有经验者还显得属于这个环境。
image_mechanism: 周围人和物都应漂浮，维德却像自带一条向下的重力线，身体每次发力都立刻收住，不让惯性拖出多余动作。
property_alignment: 维德身体对应受重物；稳健动作对应地面行走；方向控制对应竖直参照；不翻滚对应重心稳定；单手操作对应有支撑面；失重舱对应被个人重力改写的空间
context_alignment: 维德意志和控制力一贯强硬，自带重力的身体印象把精神定势投到物理动作上。
narrative_function: 用失重中的反常稳定恢复维德的压迫性存在，显示岁月和伤残未削弱他。
transfer_rule: 用仍有重力写失重动作时，应具备他人漂浮参照、主体姿态稳定、惯性收束、上下感明确和控制力来源。
failure_boundary: 人物抓扶手才稳定、频繁翻滚碰撞，或环境本就有人工重力时，该反常比拟失效。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 缺少太空经验且只有一只手的维德在失重舱内移动时姿态稳定、方向明确、毫不漂乱
vehicle: 人在正常重力地面上有脚下支撑和固定上下，身体能稳稳行走并控制惯性
ground: 动作稳定对应重力压地；方向明确对应上下固定；单手仍能控制对应地面平衡；不随舱漂移对应身体有重量；自然适应对应日常行走
