figure_type: simile
quote: 像一座顶天立地的巨钟在报时
sensory_mapping: 炮击的低沉震动被听成钟声，三小时间隔被听成钟摆控制的刻度。
context_fact: 围城五周内，巨炮按装填周期每天轰击七次，基督教铜钟相形微弱。
image_mechanism: 机械装填周期成为异教世界的计时制度；巨钟每报一次，城墙离终点更近一格，炮声升级为统治性的时间背景。
property_alignment: 炮击的等间隔对应钟的定时报点；震动的宏大音量对应巨钟共鸣；每日重复轰击对应钟表持续划分时间。
context_alignment: 双头鹰铜钟象征基督教秩序，巨炮之钟以更强声势建立征服者的新时间，形成可听见的政权替换。
narrative_function: 把围城压力从零散袭击变成无法逃离的倒计时，并完成两个文明时间体系的对照。
transfer_rule: 周期性威胁借计时器具表现时，周期、声响和终点都要可对应；场内真实钟声还能校准权力差距。
failure_boundary: 炮击若间隔混乱或只发生一次，就不能承担报时功能；若没有逐步逼近的终局，巨钟只剩音量夸张。
