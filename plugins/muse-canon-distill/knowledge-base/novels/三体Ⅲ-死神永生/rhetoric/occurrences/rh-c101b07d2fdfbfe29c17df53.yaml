chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 白线头部的小火团像一大片浮向太空的萤火虫
sensory_mapping: 细小火点；成群萤光；缓慢上浮；暗色背景；白线拖尾
context_fact: 近地轨道镜头拍下各地穿梭机集体发射，真实速度因远距尺度显得缓慢。
image_mechanism: 巨大火箭在行星尺度上缩成发光小虫，发动机烈焰只剩一粒萤光；成千飞行器的恐慌逃亡因远景显得轻盈安静。
property_alignment: 穿梭机对应萤火虫；发动机火焰对应发光腹部；远距小尺寸对应微虫；集群发射对应虫群；上升航迹对应漂浮飞行；地球暗面对应夜野
context_alignment: 上一图像把尾迹写成地球白发，本图像把头部载具缩成萤火，宏观衰老与微小逃生并置。
narrative_function: 让全球逃亡兼具壮观与脆弱，显示个体飞船在宇宙尺度上的微小。
transfer_rule: 用萤火虫写远距火团时，应匹配微小亮点、暗背景、成群分布、缓慢表观运动和独立闪光主体。
failure_boundary: 火团连成强光柱、近景震耳高速，或背景白昼明亮时，萤火虫的轻微光感不成立。
