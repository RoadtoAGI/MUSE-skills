chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 仿佛露出白色晨光的天边被撕开了一道口子
sensory_mapping: 晨光像绷紧白布，黑烟从底边猛地扯出竖裂口，浓暗内部不断向上翻卷。
context_fact: 治安军开始空袭澳大利亚，五公里外发电厂爆炸，天刚蒙亮。
image_mechanism: 撕裂把烟柱从覆盖物改成天幕创口，说明攻击不仅毁地面设施，也破坏新一天本应完整的光。
property_alignment: 白晨光对应浅色表面；黑烟对应裂口内暗层；爆炸对应撕扯；竖直烟柱对应口子延展。
context_alignment: 程心预感太阳不会再升起，第一道黑口正从日出方向破坏晨光，贴合文明断电。
narrative_function: 用单一远景宣布最后审判阶段开始，并把电力系统毁灭写成天空受伤。
transfer_rule: 烟柱如裂口时，应利用背景连续色、烟的边缘方向和突发破坏来源。
failure_boundary: 天空没有实体表面，烟也覆盖其前方而非露出内部；若背景杂乱无连续亮面，撕口轮廓不清。
quality_assessment: exemplary
