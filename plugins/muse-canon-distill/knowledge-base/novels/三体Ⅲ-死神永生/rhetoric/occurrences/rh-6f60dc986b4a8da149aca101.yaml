review_status: reviewed
tenor: 核聚变发电厂被炸后，一道浓黑烟柱从明亮东方地平线升起
vehicle: 白色布面或皮肤被暴力撕裂，裂口中露出深黑内部并向上张开
ground: 黑色线形突然切断连续亮面；边缘由爆炸形成；裂缝从地平线向天空延伸
