tenor: 辐射帆反光形成、五分钟后渐暗消失的橘红光团
vehicle: 巨大眼睛短暂睁开凝视地球，随后缓慢合上眼睑
ground: 圆形亮面短时出现并朝向地球；亮度逐渐降低直至不可见，像视线主动结束
