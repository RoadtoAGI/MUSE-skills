chapter: 【危机纪元5-7年，阶梯计划】
figure_type: simile
quote: 像一只在太空中看了一眼地球后慢慢闭上的眼睛
sensory_mapping: 二十五平方千米帆面成为橘红虹膜，反光是一次睁眼，逐渐转暗是眼睑缓闭。
context_fact: 阶梯飞行器巨帆在同步轨道展开，程心从上海夜空只见其五分钟反光。
image_mechanism: 亮度曲线被转成眼睑动作，飞行器获得离开前回望母星的主体姿态；一次观看对应程心唯一目击。
property_alignment: 圆形光团对应眼睛；面向地球反光对应凝视；渐暗消失对应慢慢闭眼；即将远航对应告别。
context_alignment: 帆载着云天明大脑离开地球，回望眼睛赋予无意识载荷一瞬人性，也对应程心的凝视。
narrative_function: 把工程展开转成无声告别，以一次睁闭收束两人的地球联系。
transfer_rule: 光体眼睛化时，应让圆面朝向、出现时长与亮度变化构成完整睁闭动作；情节还需有观看或告别关系。
failure_boundary: 光团闪烁不规则、快速爆灭或并非朝地球反射时，慢闭眼动作不成立。
