tenor: 海底曲率驱动试验启动后，平静海面传出的持续低沉巨响
vehicle: 极远处成千上万匹马同时疾驰，密集蹄击汇成连续、厚重并震动地面的轰鸣
ground: 声源规模大对应万马；低频隆隆对应蹄群合声；持续推进感对应马群奔腾；看不见源头对应远处队伍；力量感对应地面震动
