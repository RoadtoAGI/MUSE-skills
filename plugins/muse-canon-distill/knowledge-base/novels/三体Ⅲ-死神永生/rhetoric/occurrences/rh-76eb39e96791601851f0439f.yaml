chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那片海面发出一阵低沉有力的隆隆声，像远处万马奔腾
sensory_mapping: 远方马群；低频轰鸣；密集蹄击；地面震颤；声浪推进
context_fact: 众人在海上平台观看实验，装置位于水下，启动后先只能听见海面隆隆声。
image_mechanism: 看不见的水下推进器把声音传到海面，单个机械振动在水体中合成马群蹄声；轰鸣仿佛从海平线后整片奔来。
property_alignment: 水下装置群对应万马；机械振动对应马蹄；低沉声对应远距衰减；连续隆响对应群马奔跑；海水传声对应地面传震；试验推进力对应奔腾力量
context_alignment: 曲率技术本来抽象不可见，万马声先给它可感的规模与动势，随后海面圆环变化才出现。
narrative_function: 为试验视觉现象提供听觉先兆，制造巨大力量正在水下聚集的期待。
transfer_rule: 用万马奔腾写低频群声时，应具备大量重复冲击、远距混合、持续推进、介质震动和不可见声源。
failure_boundary: 声音尖细断续、来自单一小装置，或节奏完全平滑无脉冲时，马蹄群像会误写声谱。
quality_assessment: effective
