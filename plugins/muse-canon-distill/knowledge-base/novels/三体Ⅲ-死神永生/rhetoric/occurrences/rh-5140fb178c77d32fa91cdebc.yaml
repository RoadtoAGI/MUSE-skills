chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 火山下面就是这个世界曾经的战略支点——引力波发射天线
sensory_mapping: 一千五百米天线化成地底杠杆的支点，两个世界的重量压在其上，水滴一击便让结构翻落。
context_fact: 水滴已穿入四十五千米地层摧毁天线，地面只留下被误认作火山的喷发。
image_mechanism: 支点把不可见威慑关系变成受力结构，使地下设施的隐藏位置与文明级作用同时可见。
property_alignment: 天线维持威慑对应支点承重；设施体积有限对应支点微小；摧毁天线对应抽掉支点；世界陷落对应结构倾覆。
context_alignment: 程心正从地表火山走向深坑，支点意象让她看到脚下曾承托世界的装置已经碎裂。
narrative_function: 把技术遗址提升为时代坍塌中心，强化她走向喷发点近似走向失败根部。
transfer_rule: 称关键设施为支点时，要交代其承载系统、杠杆关系和失效后整体变化。
failure_boundary: 威慑还依赖执剑人、其他发射台和太阳广播，天线并非唯一物理支点；用词概括其系统角色。
quality_assessment: effective
