review_status: reviewed
tenor: 维持地球与三体战略平衡的亚洲引力波发射天线
vehicle: 承住庞大结构重量、位置关键且一旦折断便使整体倾覆的支点
ground: 单一设施承担系统稳定；作用远大于自身尺度；被摧毁后整个平衡立刻失效
