chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 在银河系猎户旋臂的漫漫长夜中，有两颗文明的流星划过，宇宙记住了它们的光芒
sensory_mapping: 猎户旋臂是无尽夜空，地球与三体像两颗先后擦亮它的流星，身影已远去，语言仍把光痕留在宇宙记忆里。
context_fact: 广播在一百五十七万种语言中包含三体和地球古文字，证明两文明曾长期存在。
image_mechanism: 流星把文明寿命与宇宙时长按比例缩放，短暂不再等于无意义，能被记住的光成为文化印记。
property_alignment: 文明对应流星；宇宙史对应长夜；兴盛对应发光；有限寿命对应划过；文字语言对应残留光迹；广播收录对应宇宙记住。
context_alignment: 两文明曾互为敌手又共同塑造历史，终章把它们并列为两颗光体，冲突被更长时间尺度重新评价。
narrative_function: 为三部曲两大文明写下墓志铭式总结，并把人物泪水转成存在曾被记住的安慰。
transfer_rule: 文明比作流星时，应具体比较寿命比例、背景暗度、亮起事件、消逝与可留存的信息光迹。
failure_boundary: 文明并非单线瞬间且可能仍有后裔存在，宇宙也没有人格记忆；广播收录是技术记录。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 地球与三体文明在宇宙史中存在时间有限，却发展到留下可被末日广播认可的持久文化印记
vehicle: 两颗流星在漫长黑夜中短暂发亮划过，消失后其光迹仍被观看者记住
ground: 存在相对短暂；背景时间漫长黑暗；出现时明亮；沿相邻区域运动；终会消失；光芒留下记忆；数量为两颗且命运相连
