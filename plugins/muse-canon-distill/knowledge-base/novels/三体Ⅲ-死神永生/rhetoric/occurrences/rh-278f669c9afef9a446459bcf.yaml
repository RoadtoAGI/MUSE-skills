chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: 太阳系的三维空间像一张大地毯，正在被无形的手拖向二维深渊，而这些逃亡的飞船只是地毯上缓缓爬行的小虫子
sensory_mapping: 无形巨手攥住太阳系地毯往深渊抽，蓝焰飞船只是毯面小虫，腿脚再快也抵不过整块地面滑走。
context_fact: 导航参照系显示未二维部分整体向已二维参照系运动，逃逸所需速度为光速。
image_mechanism: 地毯—虫子模型严格区分相对地面速度与地面本身速度，直觉解释推进器全开为何仍不能延长多少生命。
property_alignment: 三维空间对应地毯；空间流动对应拖拽；二维区对应深渊；飞船对应虫子；推进速度对应爬速；物理机制对应无形手。
context_alignment: 先前人群在无形瀑布中像蚁群，此处扩大到全太阳系，居民、飞船和空间共同成为被移动表面的附着物。
narrative_function: 把A.I.抽象参照系说明转成一幅不可逃动力图，为逃亡飞船群下最终判决。
transfer_rule: 解释载体运动压过主体自驱时，应让载体、拖力、主体速度、运动方向和终点在同一模型中闭合。
failure_boundary: 飞船不接触实体地毯，空间流也非摩擦拖运；模型只表达参照系整体移动与速度数量级。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 太阳系整片三维空间流向二维区，而飞船虽全速逃亡仍随空间一起接近边界
vehicle: 巨手把整张地毯拖向深坑，地毯上的小虫虽反向爬行，却因载体移动更快而仍被带走
ground: 承载介质整体移动；主体附着其上；局部自驱速度远小于介质速度；目标是不可返深处；施力者不可见；所有对象共享命运
