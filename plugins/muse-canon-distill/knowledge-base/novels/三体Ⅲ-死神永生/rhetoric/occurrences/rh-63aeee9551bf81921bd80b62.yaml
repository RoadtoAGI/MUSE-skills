tenor: 关一帆从沉浸式讲述宇宙黑暗真相的状态突然收束，恢复谨慎和现实自觉
vehicle: 睡梦中投入另一世界的人突然醒来，意识切回眼前并意识到刚才内容不可靠
ground: 状态突变；此前忘我；话语中断；重新判断环境；对刚才经历产生距离；神情从沉浸转清醒
