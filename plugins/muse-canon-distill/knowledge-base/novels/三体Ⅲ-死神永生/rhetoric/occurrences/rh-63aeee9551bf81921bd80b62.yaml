chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 关一帆说，像是突然醒来一样
sensory_mapping: 他讲到宇宙目的时像从暗黑梦境猛然睁眼，立刻否认并把一切退回猜测。
context_fact: 关一帆刚推演规律战争与宇宙终结，随后称其为两人编出的暗黑神话。
image_mechanism: 醒来把理论狂奔与谨慎科学分成梦实两态，人物自己切断越过证据边界的推演。
property_alignment: 推演沉浸对应梦；突然否认对应醒；现实证据对应眼前；暗黑神话对应梦内容；谨慎限定对应清醒判断。
context_alignment: 程心本就觉得星海像噩梦，讲述者也以醒来姿态退出神话，知识与恐惧互相投影。
narrative_function: 标示推测证据等级，避免宇宙终局理论被当作确定设定，并塑造关一帆的自我校正。
transfer_rule: 思想沉浸比作梦醒时，应给出沉浸内容、状态转折、醒后修正和证据边界。
failure_boundary: 关一帆始终清醒且有意对话，醒来只是神态和论述姿态变化。
quality_assessment: conventional
