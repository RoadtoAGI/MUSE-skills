context_fact: 宗教力量迅速恢复，大批民众聚到教会下，政教合一国家重新出现。
image_mechanism: 僵尸比垃圾更进一步获得行动性，说明旧制度不仅浮现，还能重新组织人口与权力。
property_alignment: 历史淘汰对应死亡；制度复辟对应尸体起身；结构陈旧对应腐朽躯壳；重新掌权对应追逐活人。
context_alignment: 前句已写深坟上浮，僵尸从同一墓地框架中自然走出，形成复辟意象链。
narrative_function: 把社会倒退推到比法西斯更古老层级，强化文明时间逆行。
