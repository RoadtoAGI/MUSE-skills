chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: 仿佛这一半宇宙变成了一个黑色的大碗，群星都在向碗底滑落
sensory_mapping: 前方黑空凹成巨碗，四散星点像珠子沿看不见的弧壁滑向正前方碗底。
context_fact: 星环号即将进入光速，前方星星迅速聚成无法分辨单星的密集团块。
image_mechanism: 碗把相对论角度压缩转成重力滑落的日常几何，聚集方向、曲率感和中心位置一次说明。
property_alignment: 前方半球对应碗内壁；航向中心对应碗底；星光对应珠点；像差聚集对应下滑；周边星空变空对应珠子离开高处。
context_alignment: 此前空间像漏斗、深渊和海面，此刻速度改变观察几何，宇宙本身成为可倾斜容器。
narrative_function: 给进入光速的第一幅剧变建立可理解动态，并定位随后蓝宝石光团的形成处。
transfer_rule: 点场向中心聚集可比作碗底滑落，但要交代凹面、中心、外围变化、驱动机制和观察方向。
failure_boundary: 宇宙没有实体碗壁或重力把恒星移动，星体位置未变；变化来自光线进入高速参照系的方向。
