chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 他说那是连接今生与来世的桥
sensory_mapping: 七色拱桥；旋转深渊；此岸彼岸；雾水桥身；死亡入口
context_fact: 涡底水雾在阳光中形成彩虹，小艇正不可逆地向能碾碎一切的吮洞下滑。
image_mechanism: 无实体彩虹在黑暗涡口上架出拱桥，桥的一端仍沐浴阳光，另一端落向看不见的底；小艇越下滑，审美景观越接近死亡门槛。
property_alignment: 彩虹对应桥体；弧形对应桥拱；涡壁两侧对应两岸；船上生命对应今生；致命涡底对应来世；下降过程对应跨越边界；水雾生成对应桥身虚幻
context_alignment: 杰森正在实地重演坡的旋涡小说，文学中的死亡桥突然覆盖现实彩虹，增强探险者的宿命感。
narrative_function: 把美丽彩虹与迫近死亡扣合，使旋涡奇观同时成为生死界标。
transfer_rule: 用桥写生死过渡时，应有明确两岸、不可直接跨越的鸿沟、连接弧线、正在逼近边界的主体和单向风险。
failure_boundary: 人物处境安全、彩虹不跨越危险地形，或叙事强调返回而非死亡过渡时，来世之桥会制造虚假预兆。
