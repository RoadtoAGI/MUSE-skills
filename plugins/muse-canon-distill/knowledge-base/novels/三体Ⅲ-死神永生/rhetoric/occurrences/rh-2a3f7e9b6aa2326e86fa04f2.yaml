tenor: 跨越旋涡深渊的彩虹被爱伦·坡赋予从当前生命通向死亡后世界的边界象征
vehicle: 一座拱桥横跨不可步涉的深渊，两端分别接到两个世界，使旅者可从此岸过渡到彼岸
ground: 彩虹弧线对应桥拱；旋涡深渊对应生死鸿沟；当前一侧对应今生；涡底死亡对应来世；小艇下滑对应走向桥界
