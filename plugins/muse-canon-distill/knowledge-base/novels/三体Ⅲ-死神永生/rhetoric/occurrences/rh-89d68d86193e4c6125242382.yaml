chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 这把伞一合上，我就会消失，我就是阳光下的露珠
sensory_mapping: 晨露亮珠；阳光逼近；水珠变小；无声蒸发；伞下阴影
context_fact: 针眼画师可把人物画进画中使其从现实消失，公主靠持续撑开的黑伞躲避画像。
image_mechanism: 名字从称谓变成命运：伞面化作唯一阴影，合拢的一瞬等同太阳越过草叶，少女像水珠那样在强光中由可见到全无。
property_alignment: 公主对应露珠；黑伞对应遮阴草叶；针眼画师的视线对应阳光；收伞对应日照抵达；被画消失对应蒸发；护送时间对应露水暂存期；清丽外貌对应露珠晶亮
context_alignment: 前句水晶只写美，此句由长帆的叹息发现蒸发规律，把童话称名转成死亡预言。
narrative_function: 凝聚公主的生存规则和悲剧脆弱性，也推动长帆承诺永远为她打伞。
transfer_rule: 用阳光下露珠写受保护的短命人物时，应对应保护阴影、暴露触发、逐瞬消失、清亮外观和无法自行抵御。
failure_boundary: 人物离开保护后仍能长期存活、危险来自一次物理袭击而非暴露，或消失可逆时，露珠蒸发会误写规则。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 露珠公主一旦失去黑伞遮蔽便会被无形画师抹除，生命短暂且依赖持续保护
vehicle: 清晨露珠依靠阴影暂存，太阳一照便迅速蒸发，不留实体痕迹
ground: 黑伞遮蔽对应草叶阴影；伞合见光对应日出照射；公主被抹除对应露珠蒸发；美丽短暂对应水珠晨间寿命；长帆护伞对应延长阴影
