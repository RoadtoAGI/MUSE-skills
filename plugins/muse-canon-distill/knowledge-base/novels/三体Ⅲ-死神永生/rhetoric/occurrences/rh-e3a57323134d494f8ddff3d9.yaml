chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 白色的烟雾在首都的太阳前袅袅升起，像三个世纪的岁月一样在她的泪眼中消散
sensory_mapping: 白烟袅升；太阳逆光；泪眼模糊；世纪散尽；烟丝无痕
context_fact: 程心刚与维德最后告别，第一次抽他钟爱的雪茄；三天后维德被处决。
image_mechanism: 实体烟雾承担整段跨世纪经历的可见寿命：从手边生起，穿过权力中心的人造太阳，在泪水折光中逐渐失去轮廓；呼出即是送别。
property_alignment: 烟雾对应岁月；烟丝绵长对应三世纪跨度；升起对应时间远去；扩散对应时代瓦解；消失对应人物死亡；泪眼模糊对应记忆朦胧；雪茄来源对应维德遗留
context_alignment: 雪茄由太平洋一号买来、送给维德又由他退回，烟的消散串联程心游历、停战与告别，成为一件物品承载的时代闭环。
narrative_function: 用一个短暂视觉动作压缩三世纪，并让维德的死亡与程心的历史负担共同淡出。
transfer_rule: 以烟雾写漫长岁月时，应有具体触发物连接那些岁月，让烟的生成、上升、扩散、消失分别对应记忆的来处与终结。
failure_boundary: 时间经历没有共同物件或人物纽带、烟雾浓重滞留不散，或人物情绪是清晰振奋而非泪眼送别时，岁月消散会失焦。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心跨越三百多年经历的时代、人物和选择在维德临刑告别后汇成记忆，并在泪眼中远去
vehicle: 第一口雪茄的白烟缓慢升到明亮太阳前，边缘散开、形体变淡，最后无痕消失
ground: 三个世纪对应烟雾延展；历史人物离去对应烟消；记忆模糊对应雾散；泪眼对应烟雾朦胧；时间上升远去对应烟袅袅升起；首都太阳对应时代背景光源
