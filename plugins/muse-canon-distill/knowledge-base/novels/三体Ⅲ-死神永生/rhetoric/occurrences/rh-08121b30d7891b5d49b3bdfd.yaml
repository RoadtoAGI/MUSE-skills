chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 专业人员一副老死不相往来的样子，捂紧口袋总怕被别人偷走些什么；情报人员则异常活跃友好，总想偷到些什么
sensory_mapping: 文件和专业知识缩进衣袋，冷漠专家双手护袋，热情特务在人群中伸出看不见的手。
context_fact: PIA名义上共同侦察三体世界，内部成员却受各国双重领导，对彼此搞情报更感兴趣。
image_mechanism: 口袋把无形信息变成可携私物，偷窃则解释过度友好与封闭姿态为何互为反应，场景获得即时动作。
property_alignment: 国家机密对应袋中财物；专家隔离对应捂紧口袋；特务套近乎对应扒手接近；情报泄露对应财物被偷。
context_alignment: 传统情报职业习惯被带进跨国机构，财物模型揭示共同敌人尚未消除内部所有权边界。
narrative_function: 以轻微讽刺快速区分两类成员，也给维德随后强行聚焦外敌的会议动作提供背景。
transfer_rule: 知识如财物时，应标清所有权、藏匿位置、接近手段和失窃后果；人物社交姿态要能显示攻防方向。
failure_boundary: 开放共享且无归属冲突的团队不适合偷窃模型；专业沉默也可能源于陌生，不必然是护密。
