chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 二维太阳系和群星一起凝聚成红色的一团，像在宇宙尽头熊熊燃烧的篝火
sensory_mapping: 身后整片太阳系缩成宇宙边缘一堆红火，像远行者回望再也回不去的最后营火。
context_fact: 高速参照系使后方光线红移并集中，二维太阳系已无生命、太阳也已熄灭。
image_mechanism: 篝火把物理上熄灭的家园重新点亮为回望意象；温暖含义与真实死亡形成强烈反讽。
property_alignment: 红移光团对应火焰；后方中心对应远处火堆；太阳系对应离开营地；黑空对应旷野；聚集光源对应柴薪合火。
context_alignment: 前方是冷蓝宝石，后方是暖红篝火；航程以色温将未知未来与已失故乡分成两极。
narrative_function: 封住太阳系叙事视觉出口，让母星系统以最后一个可回望的红点从视野消失。
transfer_rule: 远离家园的红光比作篝火时，应利用观察方向、距离、色温、聚集和回望情感。
failure_boundary: 太阳系没有重新燃烧或提供温暖，篝火只来自相对论红移与远行者心理。
