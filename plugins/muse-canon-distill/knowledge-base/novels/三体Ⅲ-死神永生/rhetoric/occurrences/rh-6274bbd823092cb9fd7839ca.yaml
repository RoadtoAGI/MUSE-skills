chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 有像直升机螺旋桨一样旋转着飞行的昆虫
sensory_mapping: 昆虫没有扇动翅膀，身体上方却转出一圈旋翼般的模糊圆盘，在光束间悬行。
context_fact: 蓝星已演化出能迁移的植物和无翅飞行生物，程心二人在林间观察陌生生态。
image_mechanism: 螺旋桨把无法按旧生物分类的运动还原为熟悉机械动作，先交代旋转再交代飞行因果。
property_alignment: 昆虫旋转部位对应旋翼；身体升空对应直升机起飞；持续旋转对应持续升力；悬飞轨迹对应旋翼机运动。
context_alignment: 两名航天技术背景人物以工程装置理解新物种，观察语言符合其经验。
narrative_function: 用一个清晰运动模型显示千万年后进化路径的陌生而可理解。
transfer_rule: 陌生生物动作借机械装置成像时，应让部件位置、运动方式、产生效果和观察视角一一对齐。
failure_boundary: 原文没有证明飞虫真的采用直升机同样的气动结构，螺旋桨只描述外观与运动。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 蓝星上一类没有翅膀、以身体部件旋转产生升力的小型飞虫
vehicle: 靠高速旋转水平旋翼升空并悬飞的直升机螺旋桨
ground: 围绕轴心旋转；旋转产生升力；可悬空前进；轮廓呈旋翼状；动作连续而机械
