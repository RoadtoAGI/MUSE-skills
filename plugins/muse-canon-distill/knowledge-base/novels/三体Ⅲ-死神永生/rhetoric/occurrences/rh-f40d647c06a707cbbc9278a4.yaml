chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 那只是我们这些弱小的虫子保命的举动，神们不屑如此
sensory_mapping: 人类把恒星系缩进黑域，像虫子钻入缝隙；规律武器的使用者则像站在世界之外的神，连看都不必看这种藏身术。
context_fact: 关一帆区分防御性黑域与战争中主动制造低光速黑洞的高等技术。
image_mechanism: 虫—神垂直尺度把技术差距转成人格与体量差距，同时让安全方案显出卑微代价。
property_alignment: 弱文明对应虫子；黑域对应藏身缝隙；高等文明对应神；规律武器对应神力；不建光墓对应不屑躲藏。
context_alignment: 黑暗森林曾把文明写作猎人，此处战场升级后人类降为虫子，宇宙权力尺度再次下压。
narrative_function: 纠正把黑域视为最高技术的错觉，并建立规律战争参与者的压倒性等级。
transfer_rule: 用物种或神性等级比技术差时，应把生存策略、可用力量、自由代价和观察尺度一起对应。
failure_boundary: 弱文明可能在特定领域先进，高等文明也非全能神；虫与神只是相对技术位置。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 银河人类等弱小文明靠黑域躲避打击，而掌握规律武器的高等文明无需以自我封闭求生
vehicle: 低微虫子见到危险便藏匿保命，力量超凡的神则俯视它们并不屑采用同样手段
ground: 力量等级悬殊；弱者主要目标是存活；弱者靠隐蔽退缩；强者能支配环境；强者无需牺牲自由；双方认知尺度不同
