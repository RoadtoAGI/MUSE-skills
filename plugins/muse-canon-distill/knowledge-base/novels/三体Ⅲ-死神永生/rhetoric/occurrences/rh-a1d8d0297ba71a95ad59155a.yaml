chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 雪白的云雾在门的附近形成一个大旋涡，像从太空中看到的地球上的台风
sensory_mapping: 门成了黑暗风眼，白云在周围卷出一整片螺旋，像把一场地球台风缩进一千米宇宙。
context_fact: 智子第一次允许气体穿门，空气压差使旋涡迅速变成尖啸龙卷并吸走水球与小物体。
image_mechanism: 轨道台风给无边界失重气流一个可俯看的完整形状，白云与中心门恰好复现云墙和风眼。
property_alignment: 雪白云雾对应台风云带；门对应风眼；旋转气流对应台风环流；巨大圆盘对应轨道视图；增强风势对应台风强度。
context_alignment: 程心熟悉从太空观看地球，末日拆除场景借地球天气成像，让归还空气带上母星记忆。
narrative_function: 把无形泄压过程变成壮观可辨的行星级图案，并递进到龙卷吞噬。
transfer_rule: 旋涡比作台风时，应说明观察尺度、中心结构、云带颜色、旋向和随后风力后果。
failure_boundary: 小宇宙旋涡由空气穿门的压差形成，没有行星自转、海温和天气系统；机制不同。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 小宇宙空气通过门涌回大宇宙时，云雾围绕长方形入口形成的巨大旋转气流
vehicle: 从轨道俯视地球时可见的白色台风云系，围绕风眼成大片螺旋
ground: 白色云体；围绕中心旋转；尺度巨大；具有清晰涡旋；气流强劲；中心像入口或风眼；可从整体俯看
