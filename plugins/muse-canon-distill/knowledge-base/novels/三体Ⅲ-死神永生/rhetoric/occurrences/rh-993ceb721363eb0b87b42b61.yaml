chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 像一幅失重状态下的《清明上河图》
sensory_mapping: 立体长卷；市井百态；人货悬浮；灯火铺陈；舷窗观画
context_fact: 程心刚依次看到流浪者饮酒、空中集市、古书摊与满壁涂鸦，离开时从舷窗总览永夜之城。
image_mechanism: 连续游览收集的零散生活细节在离城远景中被收拢成长卷；熟悉的地面市井又被解除重力，横向铺陈转成立体漂浮。
property_alignment: 城市居民对应画中人物；商品与棚屋对应市井物象；阶层繁杂对应社会全景；丰富局部对应长卷细节；舷窗视框对应画框；漂浮状态对应失重改写；历史感对应古画
context_alignment: 太平洋一号虽贫穷失序，却拥有最具烟火气的生活；《清明上河图》准确评价其社会密度而非物质富裕。
narrative_function: 以文化记忆为游览段落作总结，肯定边缘社会的活力，并让未来奇观保留中国市井温度。
transfer_rule: 借名画概括群体场景时，应匹配画作的构图方式、人物密度和社会题材，再让世界规则对原画空间作可见改写。
failure_boundary: 场景只有宏伟建筑没有日常人物，社会秩序高度整齐，或引用名画仅因“中国古代”标签时，该典故会失去构图与题材依据。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 太平洋一号中穷人、流浪者、棚屋、集市、酒火和涂鸦共同构成的悬浮城市生活全景
vehicle: 《清明上河图》式铺陈繁密市井百态的长卷被置于零重力，人物、摊货和屋宇离开地面漂散成立体画卷
ground: 多阶层市民对应长卷人物；集市摊货对应画中商业；棚屋街区对应市井建筑；生活细节密集对应长卷百态；舷窗远观对应整体观画；失重漂浮对应画卷三维化
