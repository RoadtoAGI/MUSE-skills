quote: 环日加速器的建立到使物理学的基础理论领域处于重新洗牌的状态
sensory_mapping: 环日加速器像巨手收起理论牌面，弦论与三体信息一起被洗散，学者重新等候发牌。
context_fact: 大量超弦理论和三体传授内容被证伪，白Ice旧模型却获部分验证，因此迅速取得地位。
image_mechanism: 洗牌把证伪造成的知识重组与学术地位变动合成一次重置动作，突出偶然机会和旧权威失效。
property_alignment: 旧理论排序对应牌面；实验检验对应收牌洗牌；学者竞争对应玩家；新证据对应重新发牌。
context_alignment: 三体曾故意欺骗人类，牌局意象暗含信息博弈，使科学重建不仅是发现也包含被骗后的重算。
narrative_function: 解释冬眠学者为何未落伍，并为白Ice成为任务专家建立可信履历。
transfer_rule: 知识格局写成洗牌时，应明确旧排序、打乱机制、新一轮判据和谁因此升降。
failure_boundary: 科学证据并非随机发牌，正确理论也不会因洗牌凭运气成立；喻体只写格局重置。
