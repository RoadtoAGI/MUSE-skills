chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 这所有的记忆都凝结在她的目光中
sensory_mapping: 两千万年数据像骤然冷却的溶液，在智子眼中结成一枚多面的晶体，每个面闪出悲哀、敬佩或责备。
context_fact: 智子面对程心归还小宇宙的决定，软件检索双方全部共同记忆并生成复杂表情。
image_mechanism: 凝结把机器高速检索与人类目光定格统一：时间跨度被压缩，异质情绪像晶体成分同时可见。
property_alignment: 长期记忆对应分散物质；检索汇总对应降温聚合；目光对应结晶载体；多种感情对应多面晶光；瞬时表情对应凝固时刻。
context_alignment: 智子是数据体，原本离散的记忆在表情中物质化，跨过软件与人格之间的界线。
narrative_function: 让智子在最终分别前取得完整情感主体地位，并为‘责任’评价提供两千万年证据重量。
transfer_rule: 记忆凝结要呈现原先分散、触发汇聚、压缩载体和多成分如何在一个表面同时显现。
failure_boundary: 目光不能实际储存或展示全部数据，情绪解读也由叙述推断；凝结只表示压缩呈现。
