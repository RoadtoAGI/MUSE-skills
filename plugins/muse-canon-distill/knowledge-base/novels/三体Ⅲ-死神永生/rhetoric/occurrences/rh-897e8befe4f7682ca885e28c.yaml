chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 对于三维世界来说你们现在有神一样的力量
sensory_mapping: 舱壁和皮肤在三人手边全部敞开，他们像从天外伸手的神，只需一指就能碰到心脏或反应堆。
context_fact: 褚岩警告新手不要乱动，因为他们可能摸到内脏、高压电缆、蒸汽或集成电路。
image_mechanism: 神力把维度优势转换为权限优势：无需理解设备，也无需突破外壳，就能从规则之外施加作用。
property_alignment: 四维入口对应超越凡界；边界失效对应穿墙神通；触碰内部对应隔空干预；三维无防御对应凡物无力反抗。
context_alignment: 两舰正是靠这种维度优势杀人并毁掉水滴，神喻既解释能力，也使不慎触碰带上伦理危险。
narrative_function: 压缩四维作用力的军事含义，并通过褚岩的操作禁令把宏大能力落到手部纪律。
transfer_rule: 力量如神时，要写清它越过哪条凡俗规则、能直达何处、后果为何悬殊以及使用者受何限制。
failure_boundary: 他们仍是脆弱三维人，需要翘曲点且会被高压或蒸汽伤害；神只描述对三维边界的相对优势。
quality_assessment: effective
