review_status: reviewed
tenor: 进入四维的人可以绕过三维边界，直接触碰封闭物内部并随意破坏关键部件的能力
vehicle: 神灵不受凡俗墙壁和身体边界约束，能从不可见方向直接干预世界内部
ground: 行动超越对象的空间规则；普通防护失效；微小动作即可产生巨大后果；被作用者难以抵御
