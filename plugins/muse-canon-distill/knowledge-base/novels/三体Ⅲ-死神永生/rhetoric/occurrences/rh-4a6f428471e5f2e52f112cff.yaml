figure_type: metaphor
quote: 这是历史心脏的最后跳动
sensory_mapping: 红色按钮每闪一次，历史胸腔中的心脏便搏动一下，数字上升到阈值时已接近停跳。
context_fact: 舰员依次按动红色按钮，赞成票向启动广播所需的944票增长。
image_mechanism: 把统计数字变成心跳，使冷静程序获得身体生死节奏；红光颜色也与血液和心脏相合。
property_alignment: 按钮红闪对应心脏收缩；票数递增对应连续搏动；广播阈值对应临终点；两世界毁灭对应生命停止。
context_alignment: 亨特心脏刚被摘出仍在太空搏动，历史心脏随即接替个人器官，使两种死亡尺度重合。
narrative_function: 把投票倒计时从政治程序提升为历史生命末刻，并增强每次点击的震动。
transfer_rule: 过程如心跳时，应匹配周期信号、生命主体、停跳条件和颜色或声音感官。
failure_boundary: 广播不会立即终结全部历史，毁灭到达时间不定；最后是伦理感受而非天体物理时点。
