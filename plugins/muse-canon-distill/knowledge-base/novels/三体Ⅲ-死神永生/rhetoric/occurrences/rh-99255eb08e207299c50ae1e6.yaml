chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 曲率驱动航迹是飞船在进入光速时留下的，就像火箭从地面起飞时在发射台上留下的烧痕
sensory_mapping: 发射台焦黑；尾焰灼烧；飞船离去；固定伤痕；后程无痕
context_fact: 科学家发现曲率航迹形成肥皂泡状低光速区，并解释为何只在加速区域而非整条航线可见。
image_mechanism: 无形空间被当作发射台表面，曲率发动机在跨入光速的一刻用‘尾焰’烙下永久焦痕；飞船离开后，伤痕留在原处而航行继续。
property_alignment: 曲率飞船对应火箭；进入光速对应起飞点火；被熨平空间对应烧焦台面；航迹对应焦痕；惯性航行对应离台飞行；无后续航迹对应焦痕固定不延伸；观测遗迹对应查看发射场
context_alignment: 人类已熟悉火箭遗迹，借发射台而非尾烟纠正‘航迹应沿全程延伸’的直觉。
narrative_function: 解释曲率航迹的生成时段与空间位置，为发现三体光速飞船提供物理依据。
transfer_rule: 用烧痕写推进遗迹时，应对应启动阶段、局部介质、不可逆改变、主体离去和痕迹不随行。
failure_boundary: 推进器全程持续改变空间、航迹随飞船连续延长，或痕迹会迅速复原时，发射台焦痕模型不适用。
