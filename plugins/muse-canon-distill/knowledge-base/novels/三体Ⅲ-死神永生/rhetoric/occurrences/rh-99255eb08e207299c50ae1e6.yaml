review_status: reviewed
tenor: 曲率飞船加速进入光速阶段会永久改变局部空间，达到光速惯性航行后不再继续生成航迹
vehicle: 火箭点火离开发射台时尾焰灼烧台面留下固定焦痕，升空后焦痕不随火箭继续延长
ground: 飞船加速对应火箭点火；局部空间改变对应台面灼伤；航迹留在起点对应烧痕固定；进入惯性飞行对应火箭离台；后程无痕对应烧痕不跟随
