chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 他们不得不给联合国开出了许多空头的政治支票
sensory_mapping: 政治声明变成一张张签好金额的票据，联合国拿到纸面财富，兑现窗口后却没有任何资金。
context_fact: 大国顺应世界大同热支持提高联合国地位，却拒绝把太空防御研究纳入其框架，也很少实际投入。
image_mechanism: 支票把承诺拆成签发与兑现两个时刻，空头精准定位外观信用和真实支付之间的断裂。
property_alignment: 政治声明对应票据签发；资源投入对应账户资金；未来履约对应到期兑现；拒绝实投对应账户空缺。
context_alignment: 随后《太空法公约》的域外资源条款也被称为同类空头支票，首处比喻统摄了大国策略。
narrative_function: 揭示群星计划法律基础中的政治虚实，也反衬一张看似废纸的恒星证书后来真正增值。
transfer_rule: 承诺如支票时，要分别交代签发者、受益人、支付物和兑现期限；空头判断需有明确的不投入证据。
failure_boundary: 若承诺已配套预算、权限和执行节点，称为空头会否定真实履约能力；政策延迟也不等于无资金。
quality_assessment: effective
