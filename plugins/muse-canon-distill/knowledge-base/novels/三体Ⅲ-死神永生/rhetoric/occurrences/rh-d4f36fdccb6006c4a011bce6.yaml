review_status: reviewed
tenor: 各大国向联合国作出听来慷慨却没有资源投入和履约意愿的政治承诺
vehicle: 付款人签发却没有资金担保、到期无法兑现的空头支票
ground: 书面或口头承诺具有正式外观；真正履行时缺少可支付资源，价值因而归零
