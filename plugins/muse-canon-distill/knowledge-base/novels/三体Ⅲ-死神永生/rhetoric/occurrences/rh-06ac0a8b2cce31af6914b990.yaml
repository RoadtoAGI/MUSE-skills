figure_type: simile
quote: 像发狂的野兽般声嘶力竭地咆哮起来
sensory_mapping: 会议语言退化为兽吼，维德身体像笼中猛兽绷紧，三个前进成为连续扑撞。
context_fact: 方案遇到人体质量等阻碍，维德宣布只有自己能命令退却，并要求不择手段前进。
image_mechanism: 野兽把理念从管理口号变成生理本能，声嘶力竭证明命令不是修辞姿态，而是驱动他的强迫冲动。
property_alignment: 高声咆哮对应兽吼；突然改调对应失控；重复前进对应单一扑击冲动。
context_alignment: 维德平时冰冷，此处爆发形成极端温差，显露其冷酷表面下更强烈的推进欲。
narrative_function: 用失控峰值确立PIA行动伦理，为后续牺牲个体预告领导者边界。
transfer_rule: 人物兽化应有声音、身体控制和欲望单一化三层证据；平时状态越克制，突变越应有明确触发。
failure_boundary: 若只是提高音量、措辞仍从容或很快道歉收束，发狂野兽会夸大；它也不等于临床精神失常。
