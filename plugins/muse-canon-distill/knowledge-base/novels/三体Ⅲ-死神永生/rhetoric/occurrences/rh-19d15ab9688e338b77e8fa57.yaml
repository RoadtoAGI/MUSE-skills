chapter: 【危机纪元4年，云天明】
figure_type: metaphor
quote: 一股悲哀的巨浪冲上云天明的脑际，几乎令他昏厥
sensory_mapping: 悲哀获得水体重量与上冲方向，脑际成为岸线，昏厥成为被浪头压入水下。
context_fact: 老李已连续四次确认结束生命，最后一次按键前云天明产生强烈阻止冲动。
image_mechanism: 前四次按键积蓄水位，最后提示触发浪头越岸；冲上二字让情绪从背景悲伤转成一瞬生理袭击。
property_alignment: 悲哀骤增对应浪峰抬升；冲击脑际对应浪拍岸线；几乎昏厥对应人被巨浪淹没失去平衡。
context_alignment: 程序此前冷静重复，巨浪打破机械节律，显示真正死亡临界点终于穿透旁观距离。
narrative_function: 在最后按键前制造情绪峰值，并让云天明对他人死亡的反应反照自己的选择。
transfer_rule: 情绪波浪应有可追踪的蓄积和明确触发点；运动方向、峰值时刻和身体后果须与事件节奏一致。
failure_boundary: 若悲哀缓慢持续、没有突然触发或只表现为轻微低落，巨浪的峰值与淹没力量会虚高。
