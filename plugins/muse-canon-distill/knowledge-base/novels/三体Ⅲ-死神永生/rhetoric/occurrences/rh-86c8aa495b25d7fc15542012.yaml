chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 那黑色的云带竟是悬浮在中轴线上的人海
sensory_mapping: 居民密到先被看成一条贯城黑云，镜头放大后云粒才翻成无边人海中的一张张身体。
context_fact: 欧洲六号剩余约三百万人戴着生命维持装置，在失重中等待二维平面到来。
image_mechanism: 云带到人海的认知翻转分两次抹去个体，再由放大镜头恢复人身，使数量规模先于身份冲击观察者。
property_alignment: 密集人点对应云粒与水滴；贯穿两极对应云带；群体延展对应海面；失重漂移对应云水流动；黑色服装对应乌云。
context_alignment: 人海随后成为帷幔、人雨、墨滴和蚁群，云水复合意象是整场群体降维的初始总体形态。
narrative_function: 从城市全景导入居民尺度，以“竟是”完成由地貌误认到百万生命的道德聚焦。
transfer_rule: 远距人群借云海呈现时，应先让密度和形状成立，再通过尺度变化揭示构成单元及其后果。
failure_boundary: 人群不是连续流体，每个人仍有独立位置与选择；云海只属于远距成像和群体尺度。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 数百万人密集悬浮、从太空城一极延伸到另一极形成的黑色群体
vehicle: 连绵横贯天空的黑云带与面积广阔、个体难分的海面
