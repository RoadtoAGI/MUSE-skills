quote: 她吓得缩着脖子，像冻住一般不敢动了
sensory_mapping: AA缩颈的瞬间像被寒气封住，肌肉和关节停在原位，连下一次闪避都无法启动。
context_fact: 智子高速舞刀后只削下一缕头发，AA意识到对方随时能够杀死自己。
image_mechanism: 冻结把心理恐惧转成全身温度与硬度变化，静止由抽象害怕变为可见身体状态。
property_alignment: 惊吓僵直对应冻结定形；不敢移动对应冰封失去活动；缩颈保持对应物体凝固在瞬间姿态。
context_alignment: 上一句写热浪驱不散智子寒气，此处AA被冻住，使那股心理寒意落到具体受害者。
narrative_function: 终止短暂反抗，并用绝对静止突出智子动作速度和控制力。
transfer_rule: 用冻结写恐惧时，应有明确的骤停姿势、活动受阻和寒意来源，避免只把冷当情绪标签。
failure_boundary: AA生理上没有结冰，稍后仍能行动；若人物边怕边持续挣扎，冻结的完全静止会过量。
