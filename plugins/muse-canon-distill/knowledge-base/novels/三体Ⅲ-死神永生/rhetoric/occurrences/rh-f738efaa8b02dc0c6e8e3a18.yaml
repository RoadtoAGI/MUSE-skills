chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 她现在的生活就是这样，凄迷中藏着希望，阴冷中透出温暖
sensory_mapping: 铅灰云层；一道蓝缝；金色阳光；阴地变暖；冷景中的亮点
context_fact: 太阳刚从罗弗敦低云缝中照亮荒凉海岸，程心把眼前景象与自己从绝望转向行动的状态相连。
image_mechanism: 她的生活被铺成同一幅北海画面，困境保留为大片铅灰，曲率发现和责任只打开一条窄缝；光并未抹去冷色，却从内部给它加温。
property_alignment: 程心困境对应铅云；曾想生命尽头对应世界阴冷；新目标对应云层裂缝；希望对应蓝天；继续生活的理由对应阳光；情绪回暖对应金色洒落；风险仍在对应大部天空未晴
context_alignment: 她明确引用童话金粉画面，但新的核心是把现实天气转成自身生命结构，属于原意象在人物处境中的新增映射。
narrative_function: 用眼前光景完成程心的心理转折，为她继续承担星环公司和技术探索提供情感起点。
transfer_rule: 用云隙阳光写困境中的希望时，应保留大面积阴冷背景，只让有限光口产生方向、温度和继续行动的理由。
failure_boundary: 人物困境已彻底消失、希望毫无现实来源，或环境阳光普照无阴影时，云缝结构会错配转折程度。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心曾以为生命结束，如今因曲率驱动线索、公司责任和未来行动重新获得继续生活的希望
vehicle: 低垂铅云和阴冷荒野中裂开一道蓝天缝隙，短暂阳光洒下金色暖光改变整幅景象
ground: 人生低谷对应阴冷铅云；新理由对应云缝；希望出现对应蓝天显露；情感温暖对应阳光金粉；环境未全晴对应困境仍存
