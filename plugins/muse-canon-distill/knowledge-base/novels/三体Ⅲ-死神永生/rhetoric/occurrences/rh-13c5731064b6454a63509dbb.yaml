chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 海浪哗哗地喧响，仿佛在一遍遍地重复着长帆的话：永远不可能离开，永远不可能离开
sensory_mapping: 一排排浪头像嘴唇轮流开合，哗声按同一节拍把永远不可能离开送回岸上。
context_fact: 王国四面环海且海中饕餮鱼毁船，长帆认为故乡赫尔辛根默斯肯永远不可返回。
image_mechanism: 浪的周期为重复句提供天然韵律，环境从背景变成对困境作证的声音主体。
property_alignment: 浪潮往复对应反复说话；哗声节拍对应句子重音；封锁海域对应话语内容；持续海声对应永远。
context_alignment: 海曾像巨人呼吸和催眠曲，此刻终于获得明确语言，声音意象随公主理解加深而语义化。
narrative_function: 把地理封锁压成回声式宿命句，为公主请求外部世界故事制造情感动力。
transfer_rule: 环境声写成复述时，应让声响周期、句子节拍、现场事实和人物心理相互验证。
failure_boundary: 海浪没有语言意图，具体词句由人物心理投射；未来也未必绝对无法离开。
