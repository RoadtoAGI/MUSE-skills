tenor: 宏观四维空间自发转化为能量更低、维数更少的三维空间
vehicle: 高处水体越过悬崖边缘，在重力作用下不可逆地坠向低处形成瀑布
ground: 系统从高位流向低位；变化具有自发方向；跨越界面后难以返回；连续区域随过程缩小
