chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 处于宏观状态的高维度会向低维度跌落，就像瀑布流下悬崖一样
sensory_mapping: 四维空间像高原水面越过宇宙崖口，整片维度化成瀑流坠入三维，边缘持续后退。
context_fact: 观测显示四维碎块不断缩小，四维物质越界后瞬间在三维展开并放出能量。
image_mechanism: 瀑布把维数差转成势差，高维到低维的理论方向因水的自然下落获得不可逆直觉。
property_alignment: 高维宏观态对应悬崖高处；低维态对应谷底；降维对应水下落；碎块缩小对应上游水体流失。
context_alignment: 魔戒先用海干解释文明史，科学家再用瀑布解释物理机制，水意象由生态寓言转入理论模型。
narrative_function: 提供现有理论唯一可视预测，并为魔戒即将落入三维毁灭建立动力方向。
transfer_rule: 用势能流动解释不可逆转化时，要标出高低态、驱动力方向、越界位置和上游耗减。
failure_boundary: 维度没有空间意义上的上下或重力，理论也未说明真实势函数；瀑布只表达自发单向转变。
quality_assessment: exemplary
