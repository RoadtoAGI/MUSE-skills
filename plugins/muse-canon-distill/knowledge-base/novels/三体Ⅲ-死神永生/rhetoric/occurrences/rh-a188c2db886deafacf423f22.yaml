chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 随着向二维跌落的三维太空坠向平面，就像在无形瀑布中的蚁群一样
sensory_mapping: 上百万人像瀑布水流里的黑蚁，推进器徒劳划动，仍随整片空间直落看不见的潭面。
context_fact: 逃生者已离开城市，却仍位于跌落的三维空间中，任何飞行器都达不到光速逃逸。
image_mechanism: 瀑布把空间本身的流动显形，蚂蚁即使会爬也无法逆转水体下坠，精确解释为何离城不等于逃生。
property_alignment: 三维空间流对应瀑布；人群对应蚁群；推进器对应蚁足；二维面对应瀑底；无形对应透明水流。
context_alignment: 蚁群意象从城内俯视转为瀑布裹挟，尺度渺小之外新增了介质整体运动这一物理解释。
narrative_function: 回答居民为何逃出太空城仍必死，并把空间坍缩的不可逃性转成直观动力学。
transfer_rule: 主体随空间运动可比作瀑布携带物时，应区分主体自驱速度与介质整体速度，并给出共同终点。
failure_boundary: 太空没有液态水或绝对向下，居民也非昆虫；瀑布只模拟空间流向和速度悬殊。
quality_assessment: exemplary
