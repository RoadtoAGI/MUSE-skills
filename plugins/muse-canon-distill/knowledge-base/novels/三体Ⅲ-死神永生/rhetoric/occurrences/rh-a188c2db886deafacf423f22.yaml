tenor: 从欧洲六号逃出的上百万人连同周围三维空间一同高速坠向二维面
vehicle: 被巨大瀑布水流裹挟、密集冲向下方且无法逆流逃脱的蚁群
ground: 个体微小密集；承载介质整体下落；运动方向一致；自身力量无法抗衡流动；终点致命；瀑布本体近乎透明
