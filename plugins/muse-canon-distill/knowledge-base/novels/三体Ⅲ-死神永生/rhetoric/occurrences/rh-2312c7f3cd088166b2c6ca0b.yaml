review_status: reviewed
tenor: 掩体、黑域、光速飞船三种文明生存策略及程心制止曲率研究造成的可能性终止
vehicle: 三条从险境通往安全地带的道路，其中一条确能通行，却被人在入口彻底封堵
ground: 存在多个方向；目标均为生存；路径可行性不同；需要持续建设才能走通；封堵使后来者无法通过；选择有不可逆后果
