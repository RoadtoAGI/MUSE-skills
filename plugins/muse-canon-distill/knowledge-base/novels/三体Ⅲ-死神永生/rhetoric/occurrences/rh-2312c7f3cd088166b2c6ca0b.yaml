chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 地球文明的三条生存之路：掩体、黑域和光速飞船，其中只有光速飞船是真正的活路。云天明指出了这条活路，但她把这条路堵死了
sensory_mapping: 文明面前曾分出三条岔路，掩体和黑域通向死端，唯一穿出太阳系的光速道路却被程心亲手封住。
context_fact: 太阳系已因二维打击毁灭，而星环号证明曲率飞船确能达到光速逃离。
image_mechanism: 道路把技术方案的时间发展和集体选择空间化，堵死动作让政策决定呈现为对全体后来者关闭通道。
property_alignment: 三项方案对应三路；生存对应路外安全地；研发对应修路；光速飞船对应通路；制止维德对应设障；末日对应无路可退。
context_alignment: 云天明童话给出路线图，程心的伦理决定像封路；如今她乘唯一完成的光速船沿那条路逃出，反差构成审判。
narrative_function: 将复杂反事实压成可见岔路，为程心第二次错误的自我判决建立核心图形。
transfer_rule: 策略比作道路时，应标出起点、目标、岔路、施工条件、死路证据及谁在何时封堵。
failure_boundary: 历史并非确定道路，星环城独立、尾迹发现和黑域建设都含不确定性；堵死是程心事后的因果简化。
