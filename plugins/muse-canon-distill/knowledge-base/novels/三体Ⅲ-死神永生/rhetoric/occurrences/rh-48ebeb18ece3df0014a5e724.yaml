review_status: reviewed
tenor: 旧宣传画中军人直视观看者的强烈、专注且具有号召压力的眼神
vehicle: 燃烧火炬发出集中明亮的光，穿透黑暗并把附近目标照得无处躲避
ground: 强度高；方向集中；具有热感和压迫；能够吸引并固定他人注意；传递坚定意志
