chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 用如炬的目光盯着画外
sensory_mapping: 军人双眼像两束火炬越过旧纸面燃烧，光线钉住厅中观看者，地球需要你的口号随之发亮。
context_fact: 画面是一名占满招贴的军人，以陌生旧式军装和直视姿态进行太阳系防御动员。
image_mechanism: 火炬把静态眼神赋予光和热，盯视方向如光束照向画外，使海报跨越两世纪仍有动员力量。
property_alignment: 眼神强烈对应火光亮度；直视对应光束方向；意志坚定对应持续燃烧；观看压力对应热与照射。
context_alignment: 终端站金属和旧海报承载危机纪元激情，火炬属于那个时代直接、炽热的公共语言。
narrative_function: 让静止宣传画主动凝视程心，迅速复活旧防御时代的情绪温度。
transfer_rule: 目光如火时，应落实亮度、方向、持续性、被照对象和场景中真实的意志来源。
failure_boundary: 画中眼睛不发光或发热，程心对画风也并不熟悉；炬只表达宣传画设计的强度。
quality_assessment: conventional
