chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: AA站在如水的星光中向他们挥手
sensory_mapping: 银亮星光像浅水漫过草原，AA站在光水中央挥手，蓝草从脚边成片涌过。
context_fact: 银河在蓝星夜空亮如银色火海，程心与关一帆乘穿梭机去灰星，AA独留蓝星。
image_mechanism: 水将冷星光与会移动的蓝草统一成海洋画面，送别人像被留在一座发光孤岛上。
property_alignment: 星光对应水；均匀照地对应漫流；AA站立对应浸水；蓝草涌动对应浪；风中波纹对应水纹。
context_alignment: 太阳系的光曾是冷水和死海，这里的星光水却托住活人和蓝草，旧意象在新世界获得生命。
narrative_function: 把三人第一次短别拍成宁静远景，并强化仅三个人世界中的孤寂与依恋。
transfer_rule: 光比作水时，应让周围地貌或运动提供波纹、涌流和浸没关系，使液态感扩展成整幅构图。
failure_boundary: 星光没有液体阻力或湿度，AA也未被真实包围；相似来自均匀亮度和草浪环境。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 异常明亮的银河星光均匀洒在蓝星草原和独自送别的AA身上
vehicle: 清澈液体漫过并包围站立者，表面流光柔和、介质连续
ground: 光线连续覆盖；色泽清冷；周围被包围；亮度足以显形；草浪波纹强化液态感；人物似浸其中
