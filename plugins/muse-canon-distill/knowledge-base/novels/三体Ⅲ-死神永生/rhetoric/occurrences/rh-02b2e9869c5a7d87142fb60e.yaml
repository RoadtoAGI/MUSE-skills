chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她看上去很痛苦，好像孩子们的目光正把她烧焦似的
sensory_mapping: 灼热视线；皮肤焦黑；多束聚焦；无处躲避；热痛逼身
context_fact: 教师不敢看身边孩子，因为她若选出少数，等于亲自决定其余孩子不能逃生。
image_mechanism: 每个孩子的期待从眼中射出热量，几十道视线汇到教师身上；她尚未做决定，身体已像承担选择后果般被烤出焦痕。
property_alignment: 孩子目光对应火焰热束；共同凝视对应多束聚焦；教师羞愧对应灼痛；痛苦表情对应烧伤；回避视线对应躲火；无法公平选择对应持续受热
context_alignment: 上一位教师曾用眼神抓程心，此刻孩子目光反向烧她，视觉力量沿责任链逐级传递。
narrative_function: 把不可分配的逃生名额转成肉身刑罚，迫使程心介入作出全带或不走的决定。
transfer_rule: 用烧焦写群体注视时，应有多目光集中、羞愧或审判语境、身体痛感、回避动作和无法退出的责任。
failure_boundary: 目光友善无期待、被看者享受关注，或压力来自时间而非他人判断时，烧焦会错置情绪来源。
