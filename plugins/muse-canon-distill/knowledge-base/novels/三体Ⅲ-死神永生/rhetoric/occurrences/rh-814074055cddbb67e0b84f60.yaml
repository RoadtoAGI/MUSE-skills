chapter: 【时间之外，我们的宇宙】
figure_type: analogy
quote: 所有的宇宙都是一个超膜上的空泡
sensory_mapping: 高层超膜像一张无边薄皮，大宇宙和小宇宙在上面各鼓成空泡，泡内看不见邻泡，信号却能沿膜传来。
context_fact: 小宇宙无法主动向原大宇宙发信，但大宇宙可耗费巨大能量在超膜上传播广播。
image_mechanism: 空泡把多宇宙从抽象集合变成膜上几何，泡壁解释隔绝，共用膜面解释单向广播可能。
property_alignment: 独立宇宙对应单个气泡；宇宙边界对应泡膜；超膜对应承载薄膜；多宇宙对应泡群；超膜广播对应膜上扰动传播。
context_alignment: 智子说明无法展开三体理论，空泡是专为非专业听者保留机制关系的最低可理解模型。
narrative_function: 解释封闭小宇宙为何仍可能接收外界信息，为回归运动广播建立物理入口。
transfer_rule: 容器式宇宙类比需同时服务边界、相互隔离、共同基底和跨基底传播，不能只给圆形外观。
failure_boundary: 超膜与宇宙并非普通物质薄膜和空气泡，维度、拓扑和能量机制远超可见气泡。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 包括大宇宙与647号在内的多个独立宇宙嵌置于更高层超膜上的结构关系
vehicle: 连续薄膜表面鼓起许多内部中空、彼此分隔却共享同一膜面的气泡
ground: 单体内部独立；边界由膜形成；多个个体附着共同基底；彼此可邻近但不直接连通；大小可不同；膜面可传播扰动或信息
