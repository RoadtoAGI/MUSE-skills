chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 已经很瘦小的身子紧缩成一根树枝一般
sensory_mapping: 少年把肩臂贴紧躯干，灰袍中只剩一条细硬竖线，像随手可折的枝条。
context_fact: 他在众多华服宾客之间低头行走，刻意维持不起眼和受惊的外表。
image_mechanism: 树枝消除人体丰满度，把主动紧缩的姿态压成一条几何线，强化不占空间的潜行感。
property_alignment: 瘦身对应枝细；紧缩对应窄直；灰斗篷对应木色；脆弱外观对应可折枝条。
context_alignment: 前面的老鼠给出动物动态，树枝继续把身体压扁，使伪装在宫廷尺度中近乎消失。
narrative_function: 精确勾勒针眼的剪影，并把他的危险藏进一副似乎易折的身体。
transfer_rule: 人体比作枝条时，应抓取线性轮廓、体积、姿态硬度和材质色调。
failure_boundary: 人体仍柔软有动作，树枝的植物生长与真实脆度不适用。
