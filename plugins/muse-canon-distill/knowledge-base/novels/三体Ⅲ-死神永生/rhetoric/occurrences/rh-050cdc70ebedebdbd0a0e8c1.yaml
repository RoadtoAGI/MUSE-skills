chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 使得冰冻的二维海洋看上去像一件舞台艺术品
sensory_mapping: 六边雪花在地球圆面外排成一圈巨型布景，晶枝像舞台师精心摆出的发光装饰。
context_fact: 这些雪花比月球还大，却保持精细晶枝，并因不重叠规则平行陈列。
image_mechanism: 舞台艺术解释“自然物为何像设计物”：物理规则把随机海洋重排为远距可见的装饰构图。
property_alignment: 二维平面对应舞台幕面；巨型雪花对应装置；平行无重叠对应编排；晶莹色泽对应灯光效果；远观对应观众视角。
context_alignment: 人类最后只能作为观众观看母星被宇宙规则布置成作品，美感与家园死亡同时抵达。
narrative_function: 把科学奇观的强烈不真实感说清，并为罗辑称地球配得上花环提供审美基础。
transfer_rule: 自然景象比作舞台艺术时，应指出人工感来自尺度、排列、视角、光效和重复规则中的哪些具体特征。
failure_boundary: 雪花没有艺术家、观众或象征设计，晶体仍由未知二维结晶规律自然形成。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 由直径四五千千米、平行排列且绝不重叠的规则雪花构成的二维地球冰环
vehicle: 为舞台专门设计、图案化排列、具有强装饰效果而非自然尺度的巨型艺术装置
ground: 构图刻意感强；图案重复而各异；尺度夸张；平面排列；装饰性高；供远处观看；现实感被削弱
