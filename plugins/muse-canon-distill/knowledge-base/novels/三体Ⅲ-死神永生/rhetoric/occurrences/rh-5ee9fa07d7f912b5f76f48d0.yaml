chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这个念头就像一只手猛然抓住了思想的琴弦，让它停止了振动
sensory_mapping: 颤动琴弦；猛然按住；余音骤停；手指收紧；静默断句
context_fact: 程心和AA从博物馆小船、肥皂及童话联想到曲率驱动，却担心智子监视会危及云天明。
image_mechanism: 正在共鸣扩展的思想被拉成一根有声弦，安全念头不与其辩论，而以手掌直接按住振源；旋律尚未说出口就从内部静音。
property_alignment: 思想活动对应琴弦；兴奋联想对应振动；将要说出的结论对应旋律；云天明安全顾虑对应抓弦手；自我控制对应手指加压；沉默转移目光对应声音停止
context_alignment: 云天明曾借童话传递信息，思想本可成为共同旋律；监视威胁却要求两人以目光和暗语交流，止弦动作贴合隐秘场景。
narrative_function: 让顿悟后的自我审查成为瞬时动作，延迟‘曲率驱动’的说出。
transfer_rule: 用抓弦写念头压制时，应有原本持续的认知节奏、突然外力、明确阻断原因、余音消失和行为上的沉默结果。
failure_boundary: 新念头只是温和转移注意、旧思路仍并行展开，或人物立即高声说出结论时，猛抓琴弦会夸大中断强度。
quality_assessment: exemplary
