tenor: 程心刚从小船联想到曲率驱动，随即想到云天明安危，警觉压住兴奋并中断继续表露和思考
vehicle: 一只手突然握紧正在发声的琴弦，物理阻止弦继续振动，使旋律当场止息
ground: 兴奋思绪对应琴弦振动；曲率联想对应正在形成的旋律；安全顾虑对应抓弦之手；强制沉默对应停止振动；目光移开对应余音截断
