chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 它们黑色的鳍像利刀一样划开水面
sensory_mapping: 黑色刃尖；平滑水面；锐线推进；水纹裂口；逼近木盆
context_fact: 数条能咬碎钢剑和船体的饕餮鱼正从海中接近漂走的木盆。
image_mechanism: 鱼身藏在水下，只让鳍作为刀锋露出；每向前一寸，完整海面就在刃后分成两股水纹，危险先以切口到达。
property_alignment: 鱼鳍对应刀刃；鳍尖对应刀尖；游动对应挥刀推进；水面分开对应材料被切；黑色轨迹对应逼近武器；鱼牙破坏力对应刀意延伸
context_alignment: 读者尚未看见鱼嘴咬盆，刀鳍已把即将发生的粉碎提前投到平静海面。
narrative_function: 用一条动态锐线制造威胁，也为香皂泡沫使凶鱼失力的反转蓄势。
transfer_rule: 用利刀写水面鳍线时，应匹配薄尖外形、直向运动、介质被分开、目标逼近和潜藏身体。
failure_boundary: 鳍圆钝低伏、鱼群缓慢漂浮，或水面本就破浪翻涌时，刀刃切口难以成立。
quality_assessment: effective
