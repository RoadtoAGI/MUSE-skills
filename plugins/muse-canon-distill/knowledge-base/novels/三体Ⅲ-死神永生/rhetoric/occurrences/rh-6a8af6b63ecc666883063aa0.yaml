review_status: reviewed
tenor: 饕餮鱼游向木盆时露出水面的黑色尖鳍及其快速前进形成的切线
vehicle: 锋利刀刃以窄薄刃口切开连续材料，留下笔直裂口并逼近目标
ground: 鳍的薄尖轮廓对应刀刃；前进分水对应切开材料；黑鳍逼近对应持刀攻击；水面开缝对应刀口轨迹
