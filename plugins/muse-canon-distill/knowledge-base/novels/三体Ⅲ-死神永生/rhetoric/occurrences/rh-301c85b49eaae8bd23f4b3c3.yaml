tenor: 狄奥伦娜执意停留在刚才的异空间回忆中
vehicle: 孩子被大人强行拉离心爱玩具时的留恋与挣扎
ground: 对象提供强烈愉悦而不愿脱离；外部现实强迫注意力回归并引发抗拒
