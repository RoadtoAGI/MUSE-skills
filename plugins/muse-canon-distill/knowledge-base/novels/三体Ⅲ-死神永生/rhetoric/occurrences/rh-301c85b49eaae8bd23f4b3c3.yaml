chapter: 【公元1453年5月，魔法师之死】
figure_type: analogy
quote: 像一个孩子挣扎着不让大人把她从心爱的玩具旁拉开
sensory_mapping: 意识从回忆撤出的心理拉扯变成大人抓住孩子身体向后拖，异空间成为她手边的玩具。
context_fact: 她从塔中醒来仍半闭双眼，反复回味宽广舒适的那里，不愿面对现实。
image_mechanism: 抽象注意力被分配身体方向：回忆在前方吸引，现实从后方拉走；孩子身份又写出她面对体验时的单纯占有欲。
property_alignment: 沉浸回忆对应孩子贴近玩具；被唤醒对应大人强行拉开；执著陶醉对应孩子挣扎不放。
context_alignment: 异空间体验无法向旁人说明，她的留恋先以人人熟悉的儿童冲突显得可信，再转入棺材般现实的恐惧。
narrative_function: 把异常体验的吸引力写成可观察动作，为她宁愿离开现实乃至冒险使用能力建立动机。
transfer_rule: 表现意识不愿回归时，可将注意力两端配置成吸引物与拉拽者；人物外显动作必须显示停留和抗拒的方向。
failure_boundary: 若她只是困倦迟钝、对异空间并无愉悦，心爱玩具会误写情感；若现实没有外力唤醒，也缺少被拉开的关系。
quality_assessment: effective
