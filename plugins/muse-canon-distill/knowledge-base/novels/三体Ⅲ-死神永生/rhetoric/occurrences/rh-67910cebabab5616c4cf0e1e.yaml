tenor: 越来越多失重居民从三维城区向二维平面坠落的连续群体过程
vehicle: 大量雨滴从空中密集落向同一地面，雨势随时间增强
ground: 个体数量多；下落方向一致；落点分散；密度逐渐增大；过程连续；接触表面后形态改变
