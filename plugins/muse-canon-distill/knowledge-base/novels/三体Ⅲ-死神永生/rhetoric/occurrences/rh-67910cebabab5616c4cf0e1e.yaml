chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 落在上面的“人雨”渐渐密集起来
sensory_mapping: 居民从中轴线一批批落下，密集身体像雨点砸向平面，每一滴都摊成一道人形。
context_fact: 二维平面不可阻挡地逼近中轴线，越来越多人推进器失效或主动放弃。
image_mechanism: 把个体死亡汇成天气过程，数量级变得直观；引号保留人不是无名水滴的伦理刺痛。
property_alignment: 居民对应雨滴；失重坠落对应降雨；二维面对应地面；密度增加对应雨势增强；二维人体对应落点水痕。
context_alignment: 前文水面、墨滴和沉船构成液态灾难链，人雨把空中人海最终送入同一水面。
narrative_function: 从情侣和母婴个例拉回百万尺度，显示死亡由零星转为不可计数的群落过程。
transfer_rule: 群体坠落写成雨时，应保留个体落点或痕迹，让数量压迫不抹除叙事对象的人性。
failure_boundary: 居民不是无意识水滴，部分人主动选择、部分人设备故障；雨只描述密度和运动轨迹。
quality_assessment: effective
