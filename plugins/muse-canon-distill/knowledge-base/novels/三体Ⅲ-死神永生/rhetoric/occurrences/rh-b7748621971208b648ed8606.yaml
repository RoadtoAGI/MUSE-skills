review_status: reviewed
tenor: 群众把罗辑和程心推上承担文明存亡的救世职位，使其无法按个人意愿拒绝
vehicle: 囚犯被外力押上断头台，行进方向和最终位置都由他人决定
ground: 无论外界评价是崇拜还是惩罚，主体都被群体推向不可退出的位置；荣光与毁灭共享强制机制
