chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 一个人被推崇为救世主与被推上断头台有一个共同点，就是他(她)都没有选择
sensory_mapping: 欢呼人群化为押送力量，救世台座与断头台重合，程心被举高的同时也被固定在落刀位置。
context_fact: 公众把程心视作圣母和救世主，联合国正式劝她竞选，她认为罗辑此前同样没有真正选择。
image_mechanism: 类比不比结果而比被推动作，以最负面的断头台揭开正面推崇中的强制和牺牲。
property_alignment: 群众推崇对应外力押送；救世职位对应高台；无法拒绝对应被推行；承担毁灭责任对应落刀风险。
context_alignment: 执剑人可能被世界感激也可能遭审判，罗辑交权即被拘押，断头台并非抽象夸张而有制度后果。
narrative_function: 把程心接受竞选从个人雄心改写为群体强制，强化救世身份的悲剧结构。
transfer_rule: 正负位置类比应找相同动作或权力关系，而非只追求反差；需说明谁推、为何不能退出、代价是什么。
failure_boundary: 若候选者主动追逐权力且有真实退出机制，断头台式无选择会削弱其能动责任。
quality_assessment: exemplary
