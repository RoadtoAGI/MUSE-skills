chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 这些二维城市像飘浮在漆黑太空中的没有厚度的大陆，在无形的二维平面上遥遥相望
sensory_mapping: 几座熄灯城市在黑空摊成暗色陆块，隔着看不见的平面海域彼此对望。
context_fact: 镜头同时看见欧洲六号和远处另外两座已二维化太空城，摄像机也正向该平面跌落。
image_mechanism: 大陆把难估的二维面积赋予地理尺度，并让原本漂浮的封闭城市在平面上变成静态地貌。
property_alignment: 二维城市对应大陆；无形平面对应海域；城市边界对应海岸；远距分布对应洲际距离；熄灯对应暗陆。
context_alignment: 人类把行星表面搬进太空城，降维后太空城反而成为真正的平面大陆，人工世界回到地理图景。
narrative_function: 扩展单城灾难到群落尺度，并以遥望构图营造多个文明遗骸之间的寂静。
transfer_rule: 大面积平面物比作大陆时，应建立边界、相互距离、承载平面、内部复杂度和周围介质。
failure_boundary: 城市没有地壳、海拔或生态大陆功能，也没有意识相望；大陆只描述面积、轮廓和分布。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 分散在同一二维平面上、面积广阔且不再发光的多座二维太空城
vehicle: 黑色海洋中彼此远隔、面积巨大、边界可见却扁平展开的大陆
ground: 面积广阔；轮廓各自完整；彼此相距遥远；共同处于同一平面；内部结构复杂；周围黑暗；看似静止
