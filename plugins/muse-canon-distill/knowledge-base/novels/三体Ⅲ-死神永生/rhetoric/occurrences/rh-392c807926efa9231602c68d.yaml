tenor: 占领、背叛和大屠杀环境中仍选择高代价抵抗的人类群体及其道德价值
vehicle: 含杂质矿料经烈火熔炼后去除伪质，留下耐火、纯净且有价值的真金
ground: 极端压力筛除不坚定者；留下者数量少而品质经行为验证；价值在考验后显现
