chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 地球抵抗运动是人类在这场烈火中炼出的真金
sensory_mapping: 整个人类被投入占领烈火，投降与自利像杂质熔走，深山中的抵抗者凝成少量亮金。
context_fact: 抵抗者在水滴和治安军协助的镇压下作战，每次行动近乎自杀。
image_mechanism: 冶炼把灾难从单纯毁灭改写为价值检验，真金不靠宣言，而靠能否在高温中保形。
property_alignment: 占领杀戮对应烈火；社会各阶层对应混合矿料；牺牲筛选对应去杂；坚持抵抗对应金不熔毁。
context_alignment: 治安军被写成魔鬼，抵抗者的金属亮度与其黑暗形成清晰道德对照。
narrative_function: 在全面败坏叙述中保留人类尊严来源，并为后文唯一亮色作铺垫。
transfer_rule: 品格如真金须有具体高温考验、淘汰机制和留下者行为证据。
failure_boundary: 苦难不会自动净化群体，抵抗者内部也可能复杂；冶炼只评价文中选择，不证明纯粹无瑕。
