chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 流沙气势磅礴地倾泻而下，形成黄色的大瀑布
sensory_mapping: 亿万沙粒汇成黄水，从环形坑沿整圈泻下，像无尽瀑布落入黑底。
context_fact: 丁仪在梦中高喊尼亚加拉瀑布，但眼前沙瀑远超其可比尺度。
image_mechanism: 颗粒群被连续流体化，瀑布同时提供悬崖几何、下坠速度和声响，使空间跌落可感。
property_alignment: 流沙对应水流；坑沿对应悬崖；坠落对应瀑降；轰鸣对应水声；黄沙对应染色水体。
context_alignment: 四维跌向三维后来也被比作瀑布，这个梦把同一维度机制预先投射到沙漠。
narrative_function: 构建贯穿后文的瀑布模型，帮助白Ice从噩梦直觉跃迁到逃逸速度计算。
transfer_rule: 颗粒坠落写成瀑布时，应对齐落差、连续性、流量、声音、颜色与边缘长度。
failure_boundary: 沙粒碰撞摩擦与水流不同，不会形成同样飞沫；瀑布只说明集体下坠。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 环绕巨坑边缘、连续向下坠落且声势巨大的沙流
vehicle: 水量惊人的黄色瀑布从漫长悬崖边缘垂直倾落，发出轰鸣
ground: 物质连续下落；边缘形成落差；规模宽广；声音轰隆；流量巨大；下方不可见
