chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 哦，要进画里了，孩子们，走好
sensory_mapping: 通信影像先消失，只余老人声音说自己要跨进那幅太阳系巨画，随后冥王星亮起铺开。
context_fact: 冥王星最先接触二维面的区域正是地下博物馆，罗辑留在那里守墓。
image_mechanism: “进画”用轻松口吻把死亡与降维动作合一，罗辑主动采用此前的巨画框架完成自我送别。
property_alignment: 二维太阳系对应画；冥王星坍缩对应跨框；罗辑二维像对应画中人物；信号中断对应离开画外；定格对应死亡。
context_alignment: 他守护的博物馆收藏绘画，最后连同自己进入更大的宇宙画作，守墓人与墓碑不可分。
narrative_function: 给罗辑最后一句话保留幽默和从容，并在信号中断前准确预告下一画面。
transfer_rule: 死亡写成进画时，应有平面化机制、画外见证者、进入时点和人物对该意象的主动选择。
failure_boundary: 罗辑没有主动作画或保持意识，二维物质也非传统颜料；“进”是对不可逆坍缩的从容转述。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 罗辑所在冥王星即将二维化，他将由三维活人变成太阳系平面图像的一部分
vehicle: 一个人跨过画框进入画面，从现实空间转为永远定格的画中形象
ground: 由三维转平面；进入后不能返回；外部观察者与画中人分隔；形象可能留存；生命动作停止；过程近在眼前
