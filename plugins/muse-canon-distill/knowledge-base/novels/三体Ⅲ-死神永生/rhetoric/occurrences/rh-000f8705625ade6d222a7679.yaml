chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 就像冰雪消融后露出的岩石
sensory_mapping: 白雪退去；黑岩显露；硬核裸出；岁月融水；轮廓更峻
context_fact: 维德头发胡须全白、背微驼且失去一臂，但步伐稳健，目光仍保有程心熟悉的意志。
image_mechanism: 白发和衰老先形成覆盖层，岁月本应侵蚀人物，却只把可变表面融走；留下的岩石因周围变薄而比年轻时更裸露、更硬。
property_alignment: 白发衰容对应冰雪；时间对应融化过程；身体表层对应雪被；极端理智意志对应岩石；性格冷硬对应石质；核心未变对应岩体留存；更凸显对应覆盖退去
context_alignment: 维德一直以冰冷意志著称，冰雪既继承其寒性又被时间消融，只有更深层岩石保留，准确写出衰老中的不变与强化。
narrative_function: 在一眼对视中完成六十年人物更新：身体已老，驱动战争的精神结构仍完整。
transfer_rule: 用融雪露岩写人物核心时，应区分会随时间退去的外层与长期稳定的内核，并让外层消退确实增加内核可见度。
failure_boundary: 人物核心也显著软化或改变、外貌没有衰老迹象，或所谓内核从未被表层遮蔽时，融雪不能解释“反而凸显”。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 一百一十岁的维德外貌衰老而精神核心未被时间削弱，反因岁月剥除表层而更加凸显
vehicle: 冬季覆盖地表的冰雪逐渐融尽，原先遮蔽的坚硬岩石显露出深色轮廓和不变质地
ground: 衰老外表对应消融冰雪；时间流逝对应升温融化；精神核心对应岩石；冷硬性格对应石质坚硬；核心凸显对应岩面露出；未被击败对应岩石不受融雪改变
