chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 一个世界都能在弹指一挥间灰飞烟灭
sensory_mapping: 宇宙像随手一弹，三体恒星、行星和文明立刻焦成灰粉与烟缕，从星图上被吹散。
context_fact: 光粒体积很小却诱发恒星能量，在数小时内摧毁三体行星并最终爆炸恒星。
image_mechanism: 弹指压缩攻击者成本和时间，灰飞烟灭放大目标彻底消失，二者共同体现黑暗森林打击的经济随意。
property_alignment: 微小光粒对应弹指；短时毁灭对应一挥间；星系破碎对应成灰；文明消失对应烟散。
context_alignment: 程心用世界级轻易毁灭衡量个人死亡，宏观灰烬反而使她误以为个人终结更应轻若露珠。
narrative_function: 提供自杀推理的错误尺度前提，同时复述宇宙冷酷对个体价值感的侵蚀。
transfer_rule: 巨大对象瞬灭如灰烟时，应匹配触发动作小、转化时间短、残余形态和不可复原性。
failure_boundary: 三体星系毁灭实际经历多阶段物理过程，并非真正一弹完成；成灰也不等于物质消失。
quality_assessment: conventional
confidence: 0.96
review_status: reviewed
tenor: 三体星系在宇宙打击下以极短时间彻底毁灭，文明和行星结构不复存在
vehicle: 手指轻弹的短促动作就使实体烧成灰、散成烟，被气流吹走且无法复原
ground: 毁灭速度极快；施力相对轻微；结果彻底；残余分散不可重组；受害对象与力量不成比例
