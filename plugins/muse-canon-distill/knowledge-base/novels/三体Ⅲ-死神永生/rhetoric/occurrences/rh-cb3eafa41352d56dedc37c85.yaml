review_status: reviewed
tenor: 零下五十度时器官维持极低生理活动的冬眠人体
vehicle: 主功能暂停、仅保留最低供电以便日后恢复的电脑待机状态
ground: 系统未关闭而活动降至最低；核心状态被保存，收到条件后可重新启动完整功能
