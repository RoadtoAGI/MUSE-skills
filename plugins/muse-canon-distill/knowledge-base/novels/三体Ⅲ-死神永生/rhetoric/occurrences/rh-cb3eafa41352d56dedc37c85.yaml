chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 很像电脑待机
sensory_mapping: 心肺代谢变成低功耗指示灯，苏醒像按键唤醒，体外维持系统承担待机电源。
context_fact: 冬眠不是把人完全冻死，血液被替代，主要器官仍保持微弱缓慢活动。
image_mechanism: 待机精确置于运行与关机之间，解释为何需要持续维持设备，也说明苏醒不是从死亡复活。
property_alignment: 低代谢对应低功耗；器官未停对应系统未关机；体外循环对应待机供电；苏醒对应恢复运行。
context_alignment: 负责人面对航天工程师说明设备质量，计算机状态模型比睡眠日常词更便于估算能源需求。
narrative_function: 用熟悉技术状态澄清冬眠机制，为后文加热和续航难题奠基。
transfer_rule: 生物状态借计算机模式时，应对齐能耗、状态保存和恢复条件，并明确哪些生命活动仍在持续。
failure_boundary: 若人体全部冻结无代谢、复活需重建细胞，待机而非关机的模型就错误；类比也不说明意识是否保存。
quality_assessment: exemplary
