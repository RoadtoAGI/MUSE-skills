chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 像跳水似的钻进了那个空间
sensory_mapping: 褚岩把空气当成透明水面，头先扎入，肩、腰、腿沿无形球面一截截沉没。
context_fact: 他已多次进入四维，为鼓励两名新手，直接钻入廊道中看不见的翘曲区域。
image_mechanism: 跳水为没有材质的空间边界赋予水面感，身体断面快速变化因此被读成入水时的逐段没入。
property_alignment: 空间球面对应水面；头部先入对应俯冲姿势；躯体逐段消失对应入水没顶；熟练动作对应主动跃入。
context_alignment: 翘曲区此前被称无形泡泡，跳水动作自然激活水的潜在材质，使抽象维度入口连成统一触觉想象。
narrative_function: 以熟悉身体动作缓解四维入口的不可理解，同时保留旁观者目睹人体消失的惊恐。
transfer_rule: 写穿越无形界面时，可借越过水面的身体顺序对应边界位置、进入方向和局部消失过程。
failure_boundary: 四维入口没有水阻、浮力或溅水，褚岩也不是向下运动；跳水只适用于越界姿态和消失次序。
quality_assessment: effective
