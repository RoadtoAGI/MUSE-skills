review_status: reviewed
tenor: 褚岩头朝前、身体连续越过球面进入无形四维空间泡的动作
vehicle: 跳水者从池边主动俯冲，头部先破开水面，躯干和双腿依次没入水中
ground: 身体以前端引领越过界面；各部位连续消失；动作主动流畅；界面另一侧不可见
