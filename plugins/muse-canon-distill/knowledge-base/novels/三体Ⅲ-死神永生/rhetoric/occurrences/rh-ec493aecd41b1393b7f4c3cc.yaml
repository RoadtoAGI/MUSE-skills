chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 归零者，让我看到一些亮色
sensory_mapping: 死线仍是绝黑巨柱，归零者的理想却像画面边缘添上一笔亮色，让程心暂时看见宇宙并非只有杀戮。
context_fact: 关一帆把归零者描述为试图恢复田园时代的群体，随后说明和平、慈善与艺术文明均非主流。
image_mechanism: 价值判断被转成画面色调，程心不要求光明覆盖全宇宙，只寻找黑暗中局部可见的异色。
property_alignment: 黑暗战争对应暗背景；理想主义对应亮色；少数善意文明对应小色块；看到对应获得希望；非主流对应亮色面积有限。
context_alignment: 此前她说心中已无光，这里主动请求亮色，显示认知更黑暗后仍保留寻找善意的本能。
narrative_function: 从零光速恐惧转入宇宙伦理的多样性，并短暂恢复程心的价值视角。
transfer_rule: 希望写成亮色时，应先确立主背景、亮色来源、面积比例和它能改变但不能消除的情绪。
failure_boundary: 归零者的理论与行动可能失败或造成破坏，亮色是程心的价值解读，不等于客观善。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 程心在了解宇宙战争后，从归零者试图重启宇宙的行为中寻找少量希望与善意
vehicle: 深暗画面中出现一块明亮颜色，使观看者从压倒性黑色里辨认出生机和变化
ground: 整体背景黑暗；亮部数量很少；颜色改变情绪；可被注视并提供方向；与绝望形成反差；不能消除全部黑暗
