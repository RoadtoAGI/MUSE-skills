tenor: 时间尺度最终决定文明成果能否留存，并压倒人类全部技术能力
vehicle: 掌握权柄和武器的主宰者把决定胜负的力量握在手中
ground: 拥有最终控制权；能够夺走成果；不受人类命令；在较量中胜出；裁定何物留下
