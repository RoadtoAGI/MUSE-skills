chapter: 地球文明
figure_type: metaphor
quote: 真正的力量在时间手里
sensory_mapping: 人类刚举起造物的工具，时间已经把更重的权杖握在手里，静静等一切风化。
context_fact: 量子存储只能保存数百至数千年，特殊印刷品约二十万年，亿年尺度逼迫人类选择石刻。
image_mechanism: 把无主体的流逝人格化为持权者，将材料衰变和信息损失统一成一场权力悬殊的对抗。
property_alignment: 时间对应掌权者；材料衰变对应施力；保存期限对应权力边界；人类技术失败对应被制服。
context_alignment: 罗辑以地质纪年衡量每件设施，整个地下墓室就是时间权力留下的工程形状。
narrative_function: 给文明狂奔定下真正对手，把工程困境提升为全章的宇宙尺度裁决。
transfer_rule: 将抽象过程写成持权者时，应明确它控制什么变量、如何施力、谁受制以及权力在哪个尺度显现。
failure_boundary: 时间没有意志、手或目的，破坏来自物理过程；拟人化不说明所有事物都必然同速消失。
quality_assessment: exemplary
