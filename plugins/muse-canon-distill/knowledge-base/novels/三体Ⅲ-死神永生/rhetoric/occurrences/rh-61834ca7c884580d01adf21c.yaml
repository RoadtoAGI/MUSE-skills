chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 管道有粗有细，都呈暗灰色，像一团乱麻般缠绕纠结
sensory_mapping: 上千根灰管像巨量麻绳被揉成天幕乱团，任一根都钻进别的缝隙，找不到头尾。
context_fact: 管道组成麦田上方天空，混乱是刻意设计而非疏于整理，只有少数管道发光。
image_mechanism: 乱麻把工程复杂度转成手部无法解结的线团，既提供形状，也强化人类秩序观面对的认知挫败。
property_alignment: 管道对应麻线；交叉缠盘对应打结；暗灰色对应麻团色；无法追踪对应找不到线头；整体穹顶对应巨团。
context_alignment: 三体美学可能以混乱为美，乱麻在人类语感中带贬义，正好保留程心观察视角的文化偏差。
narrative_function: 快速建立异世界天幕的主视觉，并为灯丝、云日和大脑模型等连续联想提供底形。
transfer_rule: 线性系统如乱麻时，应落实单元数量、交叉方式、追踪失败和观察者对秩序的预期。
failure_boundary: 管道功能可能高度有序，外观混乱也可能是最优工程；乱麻不能证明设计低效。
