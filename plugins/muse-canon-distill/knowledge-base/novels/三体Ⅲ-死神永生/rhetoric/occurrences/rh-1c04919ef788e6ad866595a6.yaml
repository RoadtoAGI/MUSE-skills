chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 一个人的终结也就应该如露珠滚下草叶般平静淡然
sensory_mapping: 程心把自己想成叶尖小露珠，药片像轻微倾斜草叶，她无声滑落，不惊动任何人。
context_fact: 她以三体世界轻易毁灭为参照，准备独自服药，并暂时忘记AA和弗雷斯会受伤。
image_mechanism: 露珠把死亡缩小为无害自然运动，滚落方向和轻盈触感遮蔽了人际后果，正是此刻认知偏差的形象。
property_alignment: 个体生命对应露珠；服药终止对应滚落；无痛想象对应无声滑行；自认无牵挂对应叶面无痕。
context_alignment: AA此前像水灵植物，苦难水珠滚落；程心现在反把自己当将滚落的水珠，朋友关系随后打破这份自我缩小。
narrative_function: 把自杀诱惑写得具体而美，便于下一段用朋友之手揭穿所谓不留痕迹。
transfer_rule: 死亡如自然微物离开时，应指出谁在采用该视角，并紧邻呈现被省略的人际或伦理后果。
failure_boundary: 人的死亡会给朋友造成持久伤害，且不是无意识自然滴落；露珠只再现程心病中的主观淡化。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 程心设想服药结束自己生命可以轻微、安静且不扰动世界
vehicle: 清晨露珠沿草叶光滑表面无声滚落，离开叶尖后消失于视野，不留下破坏
ground: 动作安静；个体微小；离开顺着自然趋势；周围环境几乎不受影响；过程短暂
