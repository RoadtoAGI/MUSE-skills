chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 这是一片沸腾的二维海洋，在炽热的红光中，无数细胞状的细小结构飞快地生成、消失、分裂和组合
sensory_mapping: 红亮辐射区像一圈沸海，细胞般的斑块在浪面冒生、裂开、合并，又立刻消失。
context_fact: 三维太阳内部结构因无重叠映射全部展开，观察者第一次直接看到核心、辐射区和对流区。
image_mechanism: 海洋提供流体尺度，细胞提供局部动态；无机恒星内部因此同时具有物质翻滚与活组织增殖感。
property_alignment: 辐射环区对应海面；能量扰动对应沸腾；细小结构对应细胞；生成分裂对应增殖；整体模式对应生命组织秩序。
context_alignment: 太阳即将死亡，展开的内部却显得最有生命力；生成与消失的快速循环反衬整体终结。
narrative_function: 把陌生二维恒星内部组织成可辨的流体—生命图景，并建立熄灭前的活跃峰值。
transfer_rule: 复杂流体借海洋和细胞双重成像时，应分别说明宏观介质与微观单元，不把两层属性混为一谈。
failure_boundary: 结构不是生物细胞，太阳也没有海水；两组喻体只对应流动尺度和局部生灭形态。
