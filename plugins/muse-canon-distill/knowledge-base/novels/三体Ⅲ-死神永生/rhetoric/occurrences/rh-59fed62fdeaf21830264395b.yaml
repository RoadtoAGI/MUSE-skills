quote: 见到了使他血液凝固的景象
sensory_mapping: 无底黑坑一进入视野，寒意像冰沿血管封住全身，白艾思短暂凝在驾驶位。
context_fact: 小沙坑已扩成世界尺度，车辆即将随沙瀑坠落，丁仪仍在狂笑。
image_mechanism: 凝固把心理惊骇转成体内相变，和沙丘流动形成一内静一外动的剧烈反差。
property_alignment: 恐惧突袭对应骤冷；僵直对应固化；血液失流对应行动受阻；死亡预感对应生命循环停止。
context_alignment: 纸条会把三维物体摊平固定，梦中身体先以凝固感预演失去活动维度。
narrative_function: 在宏观景象展开前落下身体反应，确保灾难尺度仍由人物感受承载。
transfer_rule: 惊恐写成体液相变时，应结合触发画面、身体姿态、温度感和行动后果。
failure_boundary: 血液没有真实结冰，持续凝固会致死；此处只表达瞬间僵冷。
