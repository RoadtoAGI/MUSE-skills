tenor: 多架穿梭机无视地面人群强行点火，聚变烈焰连续烧死并炭化大量逃难者的发射港停泊区
vehicle: 集中焚烧尸体的火葬场，烈火、焦黑遗体、烟气和死亡气味占据整个空间
