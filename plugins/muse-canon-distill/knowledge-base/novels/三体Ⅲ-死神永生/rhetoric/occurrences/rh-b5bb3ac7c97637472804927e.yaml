chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 停泊区变成了火葬场
sensory_mapping: 停机坪焚场；人体焦黑；团团烈焰；烟火横飞；烤肉气味
context_fact: 误传光粒警报引发逃亡，穿梭机从拥挤停泊区直接发射，高温等离子体杀死周围人群。
image_mechanism: 本应把活人送往天空的交通场反向执行死亡处理，发动机喷口成为焚化炉；每次“逃生”升空都在地面增加一批被火化者。
property_alignment: 停泊区对应火葬场；发动机对应焚化炉；等离子焰对应火化火；逃难者对应遗体；炭黑人体对应骨灰前状态；连续起飞对应批次焚烧；白尾迹对应烟道排出
context_alignment: 场景由求生本能驱动，火葬场意象把少数人的上升与多数人的死亡锁成同一机械动作，揭示逃亡伦理崩溃。
narrative_function: 用场所身份反转概括混乱顶点，让误报警报造成的社会死亡比真正打击更直接。
transfer_rule: 把交通或工业场写成火葬场时，应有持续高热、真实人体死亡、焦化残留和原有功能被死亡流程替代。
failure_boundary: 火焰只烧毁设备、人员已疏散，或伤亡未经证实时，火葬场会不当把危险写成大规模焚尸。
quality_assessment: exemplary
