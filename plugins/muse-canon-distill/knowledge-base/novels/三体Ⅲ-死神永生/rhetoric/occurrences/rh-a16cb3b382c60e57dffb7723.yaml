chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 智子微笑着摇摇头，像对一个孩子解释她的幼稚
sensory_mapping: 智子的微笑像教师俯身面对孩子，缓慢摇头后用最简单图景讲解黑暗森林危险。
context_fact: 程心问人类能否逃离太阳系，智子随后以暗处、明处和被照亮小鸟解释无处可逃。
image_mechanism: 成人与孩子关系把文明情报差距转成人际年龄差，微笑与摇头因此带上温柔包装的羞辱。
property_alignment: 三体知识优势对应成人经验；程心提问对应孩子疑问；摇头解释对应纠正；简化比喻对应儿童化讲述。
context_alignment: 智子恢复清泉般女性形象，母性式耐心与她掌握毁灭真相的权力结合，礼貌更显残酷。
narrative_function: 先标记话语权差距，再引出全段最核心的聚光小鸟黑暗森林类比。
transfer_rule: 解释姿态如教孩子时，应由表情、知识差、问题性质和简化回答共同支持轻蔑感。
failure_boundary: 程心不是幼稚儿童，问题也关乎真实未知；这个判断属于智子的姿态，不是客观智力评估。
