chapter: 【广播纪元7年，程心】
figure_type: simile
quote: 她就像一株鲜活水灵的植物，岁月和苦难的水珠都从她光滑的叶片上滚落，一点儿都沾不上
sensory_mapping: AA像一株亮绿新叶，六年光阴和澳洲苦难凝成水滴，落到叶面便滚下，叶色仍鲜嫩。
context_fact: AA经营公司成为行业巨头，但外貌和活泼性格仍像大移民前，几乎看不出六年影响。
image_mechanism: 植物把水灵从形容词恢复为含水叶片，苦难再转成水滴，人物韧性通过不沾叶面的滚落动作显形。
property_alignment: AA年轻活力对应鲜活植物；岁月苦难对应雨滴；无痕外貌对应光滑叶面；持续发展对应植物生长。
context_alignment: 程心的痛苦渗入每个细胞，AA的苦难却停不住叶面；相邻水意象以渗透和滚落区分两人承伤方式。
narrative_function: 一幅图同时写出AA的外貌、性格与恢复力，并反衬程心六年仍陷抑郁。
transfer_rule: 人物如植物时，可让外部经历成为具体天气，依据叶面、根系或生长状态呈现其承受机制。
failure_boundary: AA确实经历过压力且需要工作处理后果，并非毫无内在创伤；光滑叶片只指外显状态。
