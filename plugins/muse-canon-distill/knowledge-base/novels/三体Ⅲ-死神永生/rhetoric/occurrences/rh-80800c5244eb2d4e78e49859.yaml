chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 进化的旗帜将再次在这个世界升起
sensory_mapping: 文明制度旗杆上的法律与伦理被降下，一面写着进化的冷旗在饥饿大陆上重新升顶。
context_fact: 智子宣布大部分人将在生存竞争中淘汰，只留下三千万至五千万人。
image_mechanism: 旗帜把生物过程政治化为统治纲领，使人为制造的饥荒看似自然法则凯旋。
property_alignment: 生存竞争对应旗上原则；制度撤除对应旧旗降下；暴力筛选对应新政权统治；号召争食对应旗下行动。
context_alignment: 说话者以庄严演说包装屠杀，升旗仪式感正服务这种意识形态合法化。
narrative_function: 揭露三体如何用进化话语为灭绝计划命名，并把人类尊严改写成竞争。
transfer_rule: 抽象原则升旗时，应识别谁升旗、替代何种秩序、要求哪些行动以及宣传目的。
failure_boundary: 进化没有旗手、意志或道德纲领；人为断电制造饥荒不能等同自然选择。
