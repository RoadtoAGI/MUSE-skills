tenor: 智子将被迫食人和大规模死亡包装为自然选择重新主导人类社会
vehicle: 一支政治或军队在领土上升起旗帜，宣布其原则取得统治并召集追随者
ground: 某种规则被公开确立为最高原则；升起意味着旧秩序退场；个体被要求在其名下行动
