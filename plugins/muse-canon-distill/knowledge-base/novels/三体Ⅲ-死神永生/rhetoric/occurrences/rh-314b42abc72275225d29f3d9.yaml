chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 她又看看战士们胸前那一条条金黄色的弹链，那是死神的链条
sensory_mapping: 金链横胸；弹头成节；死神执索；湮灭闪光；世界被拖走
context_fact: 自卫队拥有一万五千发反物质子弹，磁约束稍有偏差即可毁掉星环城，一条弹链的火力足以摧毁掩体世界。
image_mechanism: 黄澄澄的弹头因排列方式先组成真实链形，再由每一节内部的反物质获得夺命主体；装饰般金色被翻成死神携带的拘束工具。
property_alignment: 弹链对应锁链；单发子弹对应链节；金属连接对应节节相扣；反物质杀伤对应死神力量；佩枪战士对应执链者；一链摧毁世界对应锁住众生命；金黄色泽对应耀眼死亡饰物
context_alignment: 武器外观古老且弹链金亮，真实威力却属于未来；死神链条把可见形状和不可见湮灭能同时锁在一幅图里。
narrative_function: 将数量庞大的战略风险压缩到战士胸前的可见物，触发程心叫停战争的决定。
transfer_rule: 用死神器物写武器时，应让器物形状与实物轮廓吻合，并由明确杀伤范围、携带者姿态和触发后果支撑死亡归属。
failure_boundary: 弹药只是低致伤训练弹、并非链状排列，或杀伤力没有超出普通枪械时，死神链条会用神话威势替代事实。
