tenor: 由许多反物质弹头首尾排列而成、任一条便足以摧毁整个掩体世界的金黄色弹链
vehicle: 死亡主宰手中成串延伸的锁链，每一节都能套住生命并把大片人群拖向毁灭
ground: 反物质弹链对应死神锁链；子弹对应链节；金属串联对应链条形态；战士携带对应死神执链；命中湮灭对应夺命；整条毁灭世界对应群体被锁走
