chapter: 【公元1453年5月，魔法师之死】
figure_type: metaphor
quote: 前一只已经烙上了时间的印痕，变得有些黯淡
sensory_mapping: 无形年代获得烧热烙铁的压力，金面黯淡被看成时间留下的焦暗印记。
context_fact: 历代保存的圣杯已经变暗，密室取出的孪生杯却像新铸，二者形成时间对照。
image_mechanism: 烙印把缓慢氧化压缩成一次留下永久痕迹的接触，使时间从抽象长度变成能触碰器物的施力者。
property_alignment: 金面黯淡对应烙痕变色；年代累积对应烙具持续施力；旧杯可凭表面辨认对应印记承担身份记录。
context_alignment: 同源双杯只有一只留下印痕，恰好反证另一只所在空间未受正常时间与环境侵蚀。
narrative_function: 让器物老化成为可读证据，服务超自然密室规则的验证。
transfer_rule: 将时间写成留痕者时，应点明具体材料变化，并让痕迹能与未受作用的对照物比较。
failure_boundary: 痕迹若来自人为污损或可轻易清洗，便不能归因于时间；没有表面变化时，烙字只剩陈词。
quality_assessment: effective
