chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 在这一段噩梦般的短暂历史中
sensory_mapping: 七年历史像一夜恶梦，水滴、移民、广播和蓝星爆光接连换景，程心始终找不到醒来的出口。
context_fact: 程心经历威慑失败、澳大利亚苦难、失明复明和三体星系毁灭，长期深度抑郁。
image_mechanism: 噩梦把历史短度和心理强度分开，七年在文明尺度很短，却因灾难密度具有主观漫长与失控。
property_alignment: 七年时段对应短梦；连续灾变对应恐怖梦景；程心被动经历对应梦中失控；抑郁余波对应醒后惊悸。
context_alignment: 她刚从死亡的平静中被朋友电话唤回，朋友成为现实锚点，噩梦喻体说明为何这两人如此重要。
narrative_function: 概括朋友关系所承受的历史背景，并把自杀从个人终止重新放回共同经历。
transfer_rule: 历史如噩梦时，应对应时长压缩、事件失控、具体恐怖画面和醒后残留，而非只用来表示糟糕。
failure_boundary: 这些灾难真实发生，不能像梦一样醒来取消；噩梦也不包含制度与个人责任分析。
quality_assessment: effective
