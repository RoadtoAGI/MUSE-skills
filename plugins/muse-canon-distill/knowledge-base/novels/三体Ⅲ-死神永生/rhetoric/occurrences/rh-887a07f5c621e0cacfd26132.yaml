review_status: reviewed
tenor: 从威慑交接到三体毁灭和末日等待的七年灾难历史
vehicle: 睡眠中的噩梦短暂却充满恐惧、失控和不合常理的连续灾变，醒后仍留下惊悸
ground: 经历时间相对短；事件密集可怕；主体缺乏控制；现实感像被扭曲；记忆造成持续创伤
