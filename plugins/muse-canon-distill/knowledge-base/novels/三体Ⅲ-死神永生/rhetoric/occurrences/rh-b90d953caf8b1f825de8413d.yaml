chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 如同一颗恒星被瞬间拉成一条线
sensory_mapping: 一颗灼亮太阳像柔软光团被两端猛扯，眨眼间抻成横跨黑空的白炽细带。
context_fact: 小尺度四维物质进入三维会体积骤增，魔戒展开线长接近一个天文单位。
image_mechanism: 拉伸动作同时解释体积突增和亮度沿线分布，让抽象降维展开具有材料受力的瞬时形变。
property_alignment: 魔戒能量对应恒星光度；四维结构对应原球体；三维展开对应拉长；瞬时降维对应猛然受力。
context_alignment: 下一句用一亿三千万千米测量线长，恒星被拉直先给出太阳系级直觉，再由数字落地。
narrative_function: 在人体伤口图像之后补上天体尺度和物理形变，使亮线既暴烈又可估量。
transfer_rule: 以拉伸解释形态展开时，应明确原形、作用方向、时间尺度及原有能量如何分布到新形态。
failure_boundary: 没有恒星实际被拉长，魔戒原本也是环而非球；喻体只匹配亮度、尺度和瞬时线化。
