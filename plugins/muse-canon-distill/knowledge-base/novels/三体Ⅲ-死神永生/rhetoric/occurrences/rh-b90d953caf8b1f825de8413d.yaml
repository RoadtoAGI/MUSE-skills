tenor: 魔戒全部四维质量在降维瞬间展开为一条极亮、极长的三维物质线
vehicle: 球形恒星被巨大力量在一瞬拉伸成细长直线，原有光度沿全长铺开
ground: 发光强度达到恒星尺度；形态由紧凑体变成长线；转变极快；线长远超常规天体
