chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 二维太阳外围那一圈金色的气体舞者则像枯萎的叶子般黯淡下来，失去了活力
sensory_mapping: 刚才旋舞的金色日饵忽然褪暗蜷缩，像秋叶失水后从太阳枝头一片片垂落。
context_fact: 核心、辐射区和对流区依次暗淡崩溃，万有引力仍在，将失去辐射支撑的日饵拉回。
image_mechanism: 枯叶把舞者的主动生命感转成季节性死亡，亮度、姿态和下落三项变化在同一植物过程里闭合。
property_alignment: 金色日饵对应叶片；辐射支撑对应枝上生命；光度降低对应褪色；引力回落对应落叶；太阳熄灭对应季节终结。
context_alignment: 人类想落叶归根，太阳日饵也真的以枯叶姿态归回恒星，归宿意象从人扩展到恒星物质。
narrative_function: 完成日饵舞者的生命弧，让恒星熄灭从物理参数下降变成可见的集体谢幕。
transfer_rule: 活跃结构转为枯叶时，应连续对齐此前的生命形象、褪色、失支撑、下落和季节终点。
failure_boundary: 日饵没有植物代谢或季节，回落来自引力而非叶柄断裂；枯萎只描述视觉衰败。
