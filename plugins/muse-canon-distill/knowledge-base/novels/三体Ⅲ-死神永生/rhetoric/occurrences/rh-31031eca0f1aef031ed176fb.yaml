tenor: 二维太阳熄灭时失去辐射支撑、光度下降并开始坠回太阳的金色日饵
vehicle: 水分与生命耗尽后褪色、萎缩、从枝头无力落下的枯叶
ground: 颜色由亮转暗；形态失去舒展；支撑消失；活力终止；受重力拉回；个体逐一倒下
