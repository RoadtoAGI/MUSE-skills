chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 关一帆对这个决定暴跳如雷
sensory_mapping: 退出命令像触发雷云，关一帆的喊声轰然落在舰桥，身体也随怒气剧烈动作。
context_fact: 他认为眼前可能藏有宇宙学全部答案，无法接受因微陨石风险立刻离开。
image_mechanism: 如雷把愤怒的强度主要交给声响和突发性，暴跳动作又补上雷暴中地面震动般的身体能量。
property_alignment: 怒气骤起对应雷声突发；高声质问对应轰鸣；身体激动对应震动；压过商议对应雷暴占据听觉。
context_alignment: 宇宙学家面对终极秘密却被生存命令拉走，情绪确有爆裂动因，但成语化表达弱化了具体四维现场。
narrative_function: 用极短惯用语标出科学欲望与舰长生存责任的正面冲突。
transfer_rule: 使用成语式雷喻时，应由紧邻台词补足爆发原因、声量和身体动作，避免成为无依据情绪标签。
failure_boundary: 文本没有真实雷声或天气变化，关一帆随后仍能谈判妥协；雷暴不表示持续失控。
