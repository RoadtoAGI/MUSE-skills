chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 使它在失重中向前飞行，像一只游动的暗红色小水母
sensory_mapping: 拳头大小心脏每搏动一次便挤血前游，两根血管像触须拖在后面，血球成为周围水泡。
context_fact: 心脏无创离开胸腔仍有节奏搏动，血管喷血提供微小推进力。
image_mechanism: 水母把器官形态、脉冲动力和失重悬浮三项严密扣合，使身体恐怖获得可理解运动。
property_alignment: 心脏搏动对应伞体收缩；喷血反推对应喷水推进；两根血管对应触须；失重漂浮对应水中悬游。
context_alignment: 四维攻击不可见，但被摘器官按熟悉生物方式游动，日常海洋美感反而放大恐怖。
narrative_function: 让观众在认出心脏前先看见一个完整活物形象，延迟揭示并增强震撼。
transfer_rule: 漂浮器官如水母时，应同时匹配主体形状、附肢、周期运动和推进机制。
failure_boundary: 心脏没有水母意识或伞体，血管也非触须；离开循环后运动持续时间有限。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 仍搏动的亨特心脏拖着两根血管、借挤血反作用在失重中前移
vehicle: 暗红半透明水母收缩伞体、拖着触须在水中脉冲游动
ground: 主体周期收缩推进；后方拖有细长管状物；整体悬浮于流体般空间并缓慢前行
