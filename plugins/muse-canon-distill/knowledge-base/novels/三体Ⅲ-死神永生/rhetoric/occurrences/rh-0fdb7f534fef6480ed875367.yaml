chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 地球其实是孤悬于死亡之海上
sensory_mapping: 孤岛地球；黑色死海；无船可渡；远岸木星；亿万人困守
context_fact: 现有预警约二十四小时，而任何普通飞行器都不能在这段时间把人从地球送到木星。
image_mechanism: 行星在太空中的球体被重写成海面孤岛，技术距离变成无法渡过的水程；秘密飞船则像极少数私藏的小舟，加剧不平等。
property_alignment: 地球对应孤岛；深空对应海；打击风险对应死亡水域；木星对应安全岸；预警时间对应风暴逼近；人类对应岛民；恒星际飞船对应渡船；轨道距离对应海程
context_alignment: 云天明童话中的王国也被饕餮海封闭，死亡之海把现实地球置回同一困境：有外界、有航路，却只有极少数人能离开。
narrative_function: 把预警时间和运力数字转为孤绝空间，奠定“死亡面前不平等”的政治冲突。
transfer_rule: 用孤岛死海写群体困境时，应有明确安全彼岸、渡越工具极少、时间不足和外部环境致命。
failure_boundary: 存在大规模即时传送、当地可有效防御，或外部空间并无普遍威胁时，孤岛会夸大无路可逃。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 地球承载几十亿人却距最近木星掩体远超预警时间内可达范围，打击来临时没有群体逃生通道
vehicle: 一座孤岛悬在遍布死亡危险的无边海面，远离安全陆地，岛民来不及渡海便会遭灾
ground: 地球对应孤岛；宇宙对应海洋；黑暗森林威胁对应死亡海水；木星掩体对应远岸；预警短促对应潮灾将至；几十亿人对应困岛居民；飞船稀少对应无船
