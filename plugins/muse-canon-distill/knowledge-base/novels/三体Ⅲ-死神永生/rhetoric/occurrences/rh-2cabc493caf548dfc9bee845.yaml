chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 这泛着星光的博大与神秘，仿佛是另一个液态的星空
sensory_mapping: 头顶星空在脚下化成黑水，星点随波纹摇晃，两片宇宙在地平线处接合。
context_fact: 公主以前只见过画中蓝海，夜间真实海面的黑与星光远超既有图像。
image_mechanism: 倒影建立上下镜像，液态一词保留海的物质差异，使熟悉星空成为理解陌生海洋的媒介。
property_alignment: 黑海对应夜空；倒映星点对应群星；海面广阔对应天穹；波动对应液态；水天线对应两空相接。
context_alignment: 一路景物被画面化，海却扩张成另一个宇宙，为饕餮海和外部世界增加真正未知尺度。
narrative_function: 完成大海首次亮相的敬畏感，并解释公主为何被吸引得走近危险水边。
transfer_rule: 水面写成星空时，应以真实反光、共同底色、尺度、上下位置和流动差异支撑。
failure_boundary: 海有岸、深度和危险生物，天空并非液体；倒影也只在特定角度和天气成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 夜空下黑暗广阔、表面反射群星且不断波动的大海
vehicle: 由液体构成、铺在地面并保留无数星点的第二片天空
ground: 范围无边；底色深黑；布满星光；具有神秘深度；表面会流动起伏
