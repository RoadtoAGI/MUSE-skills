quote: 看，她是圣母玛丽亚，她真的是
sensory_mapping: 联合国广场化成宗教圣像背景，普通婴儿成为圣婴，程心抱持动作被人群镀上神圣光环。
context_fact: 年轻母亲把宝宝递给程心，群众希望她阻止野蛮男性毁掉美好世界，并推举她竞选执剑人。
image_mechanism: 现场姿势先完成圣像构图，人群命名再把政治候选者神圣化；母爱和救世责任由同一视觉符号捆绑。
property_alignment: 程心抱婴对应圣母抱子；善良形象对应圣洁；保护世界期待对应神圣庇护；群众欢呼对应信众崇拜。
context_alignment: 程心刚确认自己对新人类的感情是母性，公众圣母投射放大了她的真实倾向，也遮蔽威慑所需毁灭意志。
narrative_function: 显出选举如何以安慰形象替代能力判断，并为程心当选与威慑失效建立社会层因果。
transfer_rule: 人物如宗教圣像时，应有姿态、德性和群体期待三层对应；神圣化还需显示它如何影响现实权力选择。
failure_boundary: 保护性形象不能证明战略能力或道德无瑕；若人物拒绝照护角色，圣母投射只是群众误读。
