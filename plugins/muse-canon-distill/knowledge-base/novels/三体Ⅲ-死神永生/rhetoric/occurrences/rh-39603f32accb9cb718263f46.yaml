chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 仿佛是在宇宙的底片上用尖利物划出来的
sensory_mapping: 黯淡太阳和黑空连成底片，火树像刀尖划破乳剂，白亮枝干在暗面留下灼痕。
context_fact: 恒星内部反应暂弱导致太阳迅速变暗，喷出物形成的火树因背景变黑而更加耀眼。
image_mechanism: 底片将亮暗反转纳入摄影材料，尖划痕解释火树为何在暗背景中显得硬、亮、不可擦除。
property_alignment: 暗太阳对应底片；火树亮线对应划痕；尖锐轮廓对应利物刮刻；强反差对应乳剂破损露白。
context_alignment: 前文魔戒毁灭也借宇宙摄影显影，此处换成底片受损，两个文明终局共享摄影而损伤方式不同。
narrative_function: 在恒星最终坍缩前冻结一幅高反差灾难图像，使火树的美转成材料伤痕。
transfer_rule: 亮线如底片划痕时，应利用暗背景、反相亮度、边缘硬度及形成划痕的具体力量。
failure_boundary: 宇宙不是感光片，火树是三维等离子流而非平面刮痕；类比不表示有人刻画。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 暗下去的太阳表面前异常醒目、边缘锐利而灿亮的火焰巨树
vehicle: 尖锐物刮破黑色摄影底片的感光层，留下高反差、锋利发白的划痕
ground: 背景暗黑；线状主体亮度反差极强；边缘尖锐；形态像外力刻入表面
