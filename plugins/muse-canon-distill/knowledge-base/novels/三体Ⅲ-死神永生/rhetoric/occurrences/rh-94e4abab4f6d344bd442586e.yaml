chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 把悬了许久的心放了下来
sensory_mapping: 卫星级想象把心吊在半空，白羽外形出现后，那颗心像重物终于落回胸腔底部。
context_fact: 他们理智上仍承认纸条可能是武器，却因微小外观否认其能摧毁星系。
image_mechanism: 垂直位置变化把焦虑强度转成悬吊高度，放下一词同时暴露放松由主观操作完成。
property_alignment: 长期恐惧对应悬挂；不确定性对应无支撑；看见小物对应下放；呼气放松对应落稳。
context_alignment: 纸条实际固定在宇宙基准位置不动，人的心却因外观上下移动，形成认知稳定性的反讽。
narrative_function: 标记致命误判发生的瞬间，让后续白Ice坚持撤离具有逆众人的紧迫性。
transfer_rule: 焦虑写成悬物时，应说明悬吊原因、持续时间、下放触发和是否真正获得安全支撑。
failure_boundary: 危险没有下降，只有感受下降；心脏也未发生位移，因此不能把放松当风险证据。
