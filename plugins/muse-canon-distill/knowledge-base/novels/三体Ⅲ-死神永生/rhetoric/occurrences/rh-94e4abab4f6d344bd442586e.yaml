tenor: 探测人员看到纸条外形后，长期高度紧张的心理暂时恢复平稳
vehicle: 一件重物长期悬在高处，终于被安全放回有支撑的低处
ground: 此前位置不稳；持续耗费力量；落下后获得支撑；身体紧张随高度降低而解除
