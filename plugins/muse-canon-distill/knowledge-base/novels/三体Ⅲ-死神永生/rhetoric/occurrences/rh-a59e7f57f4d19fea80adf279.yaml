chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 像被一个无形的巨人啃了一口
sensory_mapping: 炮弹没有现身于画面，缺口的锯齿轮廓却被组织成牙齿留下的巨大咬痕。
context_fact: 乌尔班巨炮每三小时击中狄奥多西城墙，并能反复轰开大缺口。
image_mechanism: 远处不可见的炮击施力者获得巨人口腔，读者从缺损轮廓反推粗暴咬合，城防随之缩成可食之物。
property_alignment: 炮击剥落整块墙体对应咬下一块食物；缺口的不规则弧边对应齿列咬痕；巨炮的破坏尺度对应巨人的身体尺度。
context_alignment: 皇帝只能凭震动想象战场，这个喻体用结果显影看不见的攻击者，也放大城墙正在被吞噬的危机。
narrative_function: 让军械参数转化为肉身性侵害，使古老城墙的崩毁具有被怪物进食的屈辱与恐怖。
transfer_rule: 写不可见力量造成的缺口时，可从缺口边缘和材料去向反推动作；轮廓真能支持咬痕时，施力者才适合被具象为巨口。
failure_boundary: 规则整齐的爆破孔、贯穿而未剥落的孔洞都不呈现牙齿撕走材料的形状，此时使用啃会掩盖真实力学特征。
