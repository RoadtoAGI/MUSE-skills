chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那根漫无尽头的长线仿佛是从银河系垂下来的
sensory_mapping: 银色导轨从舱顶直插黑空，最远端像系在银河亮带上，一根宇宙垂线把程心缓慢提起。
context_fact: 运载舱沿太空电梯以低视觉速度上升，程心透过上方舷窗长久凝视导轨。
image_mechanism: 从银河垂下把工程的上升方向倒转为星空放线，导轨由人造设施变成连接天地的宇宙悬索。
property_alignment: 导轨对应垂线；终端远不可见对应没入银河；电梯上升对应沿线攀行；天地连接对应高处悬挂。
context_alignment: 程心刚摆脱自杀并真正进入太空，垂线像从她已产生归属感的星空伸手接引，与此前抓心之手形成温和呼应。
narrative_function: 在低速、近乎静止的航程中提供宏大纵向画面，并以凝视催眠自然过渡到梦境。
transfer_rule: 超长竖直结构如天上垂线时，应匹配消失点、观察方向、主体运动和上下两端连接对象。
failure_boundary: 导轨由地球向轨道建造，并非银河放下；银河距离远超电梯终端，连接只属透视错觉。
