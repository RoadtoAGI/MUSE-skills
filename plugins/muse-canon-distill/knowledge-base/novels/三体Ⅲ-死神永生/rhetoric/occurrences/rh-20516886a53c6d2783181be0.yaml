chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她又变回了一个如花丛中的清泉一般的女人
sensory_mapping: 和服与发髻鲜花围成花丛，智子的白嫩面容和柔细话音像清水在花影间缓缓流过。
context_fact: 她曾在澳大利亚以迷彩、短发和武士刀示人，此刻恢复初次茶道会见的装束与礼仪。
image_mechanism: 花丛直接吸收发髻装饰，清泉则把声线、姿态和肤色合成一股柔润流体，形成完整女性美景。
property_alignment: 发髻鲜花对应花丛；白嫩清丽对应泉水澄澈；柔细声音对应水流轻响；礼仪动作对应缓流。
context_alignment: 读者刚见过她忍者般杀气，清泉的洁净与真实暴力记忆冲突，使美感带上刻意换装的欺骗性。
narrative_function: 一句完成智子形象重置，同时让程心与罗辑进入表面宁静、实则谈论毁灭的茶道场。
transfer_rule: 人物如景物组合时，应让服饰、声音、动作分别落入景中不同物件，并利用前后形象反差增加含义。
failure_boundary: 智子并不纯洁无害，清泉只描述外在审美与举止；忽略其杀戮史会误读人物。
