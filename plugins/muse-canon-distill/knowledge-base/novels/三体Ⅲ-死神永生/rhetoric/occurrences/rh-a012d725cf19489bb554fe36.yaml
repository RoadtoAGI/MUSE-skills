chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 她感觉他像是在抱着自己从深水向上浮，在发光条的冷光中，她看到了他的眼睛，那目光仿佛在告诉她就要到水面了
sensory_mapping: 每一秒窒息像仍在深水，关一帆抱着她向亮处上浮，舱压升高仿佛水面越来越近，开面罩便是破水换气。
context_fact: 太空服停止供氧，关一帆用金属瓶释放气体为穿梭机加压，在程心完全窒息前打开面罩。
image_mechanism: 溺水模型把不可见气压增长变成可感上浮距离，拥抱、目光、到面呼吸形成完整救援叙事。
property_alignment: 缺氧对应溺水；关一帆抱持对应救生托举；气压上升对应上浮；发光条对应水面亮光；开面罩呼吸对应出水。
context_alignment: 二维与低光速灾难常被写成海，关一帆此刻不是一起沉没，而是第一次以真实救援动作把程心带向“水面”。
narrative_function: 将技术加压过程转成亲密身体体验，深化两人的信任并控制窒息倒计时。
transfer_rule: 缺氧救援比作上浮时，应对齐呼吸困难、托抱、压力变化、光线方向、到面时刻和第一次吸气。
failure_boundary: 舱内没有水或浮力，两人位置也未真正上升；水面仅表示可呼吸条件阈值。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 程心缺氧窒息时，关一帆抱住并安抚她，同时给舱内加压，直到可以开面罩呼吸
vehicle: 救援者抱着溺水者从深水上浮，水面逐渐接近，最终破水重新吸入空气
ground: 主体无法呼吸；救援者身体托抱；过程有明确生存方向；气压逐渐上升如接近水面；最后突然获得空气；目光传递坚持
