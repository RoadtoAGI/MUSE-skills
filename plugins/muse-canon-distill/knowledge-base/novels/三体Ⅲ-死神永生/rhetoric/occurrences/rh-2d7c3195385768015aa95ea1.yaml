review_status: reviewed
tenor: 边长约一千米、三组相对边界彼此拓扑粘合的正立方体小宇宙
vehicle: 一间有四墙、天花板和地板，但每对相对表面其实是同一表面的封闭房间
ground: 边界数量有限；人在内部活动；每个方向有表面；相对表面相连；越过一端回到另一端；空间封闭无外部
