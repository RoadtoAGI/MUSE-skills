chapter: 【时间之外，我们的宇宙】
figure_type: analogy
quote: 你可以把它想象成一个房间，有四面墙，加上天花板和地板。但这房间的奇怪之处在于，它的天花板就是地板，在四面墙中，相对两面墙其实是一面墙，所以它实质上只有两面墙
sensory_mapping: 把不可见的三维环面折成一间房：走穿前墙便从后墙回来，穿过天花板又从地板进入。
context_fact: 二人看到四周复制田园及自己的无穷映像，关一帆用拓扑学解释只有一个世界。
image_mechanism: 房间先给出熟悉六面边界，再逐对粘合墙面，通过可执行步行动作解释抽象三维环面。
property_alignment: 小宇宙立方边界对应房间六面；周期边界对应相对墙同一；越界返回对应穿墙回到起点；封闭宇宙对应无外部房间。
context_alignment: 人物已亲自跨过田园尽头，房间类比直接调用刚完成的步行实验，解释顺序自然。
narrative_function: 把令人恐惧的无限复制景象还原为有限、安全且可居住的空间结构。
transfer_rule: 高维或拓扑结构类比房间时，应给读者可沿每条轴执行的越界路径，而非停在外观相似。
failure_boundary: 小宇宙没有实体墙面，复制景象由光线周期传播形成；普通房间也不会把相对墙粘成同一位置。
quality_assessment: exemplary
