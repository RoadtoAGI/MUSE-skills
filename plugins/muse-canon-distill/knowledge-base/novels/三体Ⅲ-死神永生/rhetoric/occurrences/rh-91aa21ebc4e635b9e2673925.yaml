chapter: 【掩体纪元11年，光速二号】
figure_type: simile
quote: 感到心里如这太空中的废墟一样空荡荡的
sensory_mapping: 胸中空城；黑暗内腔；无人回声；远点幽光；情绪失重
context_fact: 程心刚在废城中得知高Way可能仍冻结在黑洞视界上，在外界活着而于自身世界已经死亡。
image_mechanism: 外部废城被内折进胸腔，撤空的设备和居民对应被奇异命运抽走的言语与情绪；物理空旷成为心理容积。
property_alignment: 心境对应城内空间；茫然对应黑暗；失落对应设施撤空；孤独对应无人废墟；未解信息对应远处闪光；情绪停滞对应废城不自转
context_alignment: 比喻直接取材于程心当下所处环境，黑洞造成的时间悖论和城市荒废共同进入她的心理反应。
narrative_function: 以环境回声收束高Way故事，使哲学震动落到程心可感的情绪空腔。
transfer_rule: 用空废建筑写心境时，应让人物刚经历明确失落或认知抽空，并使场所的无人、无物、黑暗等特征逐项对应心理状态。
failure_boundary: 人物情绪强烈喧腾、场所仍拥挤繁忙，或所谓空虚只是短暂无聊时，废墟尺度会过度放大内心。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 程心听完高Way永恒坠落的命运后，内心失去情绪支点、只剩巨大空缺的感受
vehicle: 光速二号废墟内部建筑设备尽失，黑暗空间宽阔无人，只余远处幽蓝光点
ground: 内心失落对应城市无人；情绪空缺对应地面无物；孤独对应废墟寂静；难以理解的命运对应黑暗深处；残余思绪对应孤立蓝光
