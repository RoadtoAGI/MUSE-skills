chapter: 地球文明
figure_type: simile
quote: 罗辑把拐杖高举过头，白发长须舞动着，看上去像分开红海的摩西
sensory_mapping: 拐杖在头顶变成神杖，白须随动作扬起，昏暗石洞仿佛裂开的海路两壁。
context_fact: 现代科学穷尽方案后，发现保存亿年信息仍只能把字刻在石头上，AA随后发笑，程心却震撼。
image_mechanism: 摩西造型先把宣布抬到神迹高度，答案落在史前技术上，庄严视觉与朴素结论制造强烈反差。
property_alignment: 罗辑拐杖对应摩西神杖；白发长须对应先知外貌；唯一方案对应海中通路；文明绝境对应追兵逼近。
context_alignment: 人类想让文明越过亿年天堑，如族群越过红海；可依靠的奇迹最终只是石刻。
narrative_function: 把技术汇报转成末日启示场景，并以史诗姿态承托文明退回最古老媒介的黑色幽默。
transfer_rule: 借经典人物造型时，应同时对齐姿势、道具、困境、行动功能，并让典故规模服务当下反差。
failure_boundary: 罗辑没有神力，石刻也不能保证文明获救；典故只赋予宣布姿态和绝境通路结构。
