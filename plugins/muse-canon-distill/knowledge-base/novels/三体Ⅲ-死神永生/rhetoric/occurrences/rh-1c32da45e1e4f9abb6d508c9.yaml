chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 人类文明的两粒种子继续向星海深处飘去
sensory_mapping: 两艘飞船的发动机光点像细小种子从尘埃晚霞中分开，漂入黑暗星海，等待尚不存在的土壤。
context_fact: 两百多人乘冬眠舱返回太阳系，其余人员随两舰寻找新星系，两支航路同时起航。
image_mechanism: 种子把人口和知识压缩成文明繁殖单位，飘行保留被命运支配的轻小感，萌发则把一切又开始了具体化。
property_alignment: 飞船小群体对应种子；人类知识人口对应胚芽；分向航行对应随风传播；新世界定居对应落地萌发。
context_alignment: 前一段太空晚霞短暂温暖后永夜重临，种子从余晖飘入黑暗，既接续地球生命意象又容纳前途未卜。
narrative_function: 为四维碎块章节收尾，把分离写成文明重新播种而非单纯撤离。
transfer_rule: 以种子写群体延续时，应落实携带的遗传性内容、传播路径、潜在土壤和不能保证萌发的风险。
failure_boundary: 飞船可主动导航且成员具有意识，不像种子完全随风；返回太阳系的一支也未必建立新文明。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 分别驶向太阳系和未知深空、携带人类成员与文明延续可能的两支飞船
vehicle: 两粒离开母株、随风飘往远处的种子，落到合适环境后可能萌发新的生命
ground: 体量相对原文明微小；内部保存复制与延续潜力；离开原生地远行；未来能否成活不确定
