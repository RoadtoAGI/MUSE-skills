chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 露珠公主被巨大的悲痛压倒
sensory_mapping: 父母死讯像沉重石块落到肩背，公主双腿失力，被压得跌坐掩面。
context_fact: 空灵画师说国王王后现只剩画像，不能通过毁画救回，公主随即痛哭。
image_mechanism: 压倒把情绪强度与实际跌坐动作连成因果，使心理重量在身体姿态中显形。
property_alignment: 悲痛强度对应重物质量；死讯到来对应落压；跌坐对应被推倒；无法立即上路对应受压停滞。
context_alignment: 她马上必须承担王国责任，重压既是哀伤，也是骤然落到身上的继承职责。
narrative_function: 给短暂崩溃明确身体落点，再由老画师催促推动她从受压中起身。
transfer_rule: 悲痛写成重压时，应落到具体姿势、触发消息、承受阈值和恢复行动的条件。
failure_boundary: 情绪没有物理质量，跌坐也可能源于主动反应；重量不能量化悲伤深度。
