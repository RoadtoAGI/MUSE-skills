tenor: 确认父母已无法复生后，公主因强烈悲伤失去站立和行动能力
vehicle: 体量巨大的重物从上方压下，把人推倒在地并使其无法起身
ground: 力量突然而重；作用于全身；超过承受能力；身体随心理冲击倒下；暂时阻断行动
