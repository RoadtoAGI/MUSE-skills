chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 我们在黑暗森林中就是一只拴在树顶上的小鸟，被聚光灯照亮，打击可能来自任何方向
sensory_mapping: 整个宇宙熄成森林暗处，太阳系像树梢小鸟被绳索固定，白色光柱钉住羽毛，枪口在四面黑林中游移。
context_fact: 广播已经把太阳系位置传向宇宙，人类尚无光速航行能力，无法在打击到来前整体迁离。
image_mechanism: 小鸟框架同时编码可见性、机动性和力量差：聚光灯解释暴露，绳索解释不能逃，暗林解释攻击未知。
property_alignment: 太阳系对应小鸟；坐标广播对应聚光灯；低速航行对应绳索；未知文明对应暗处猎手；任意打击对应四面射击。
context_alignment: 黑暗森林是双方共享的宇宙理论，此处新增树顶、绑缚和聚光，把宏观理论压缩成程心能立即看懂的绝境。
narrative_function: 一句回答人类为何不能靠逃亡规避打击，并将安全声明问题推向文明自残讨论。
transfer_rule: 受困目标类比应分别配置暴露机制、束缚机制、攻击者藏身处、力量比例和威胁方向。
failure_boundary: 太阳系仍能建设掩体、飞船和预警，且攻击者是否存在未知；小鸟模型强调战略劣势而非绝对零行动。
