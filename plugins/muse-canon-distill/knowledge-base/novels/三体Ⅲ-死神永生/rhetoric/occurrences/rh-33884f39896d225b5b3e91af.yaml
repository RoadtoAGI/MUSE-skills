tenor: 太阳系坐标广播后无法隐藏、无法逃离且可能遭任意方向宇宙打击的人类文明
vehicle: 黑暗森林里一只被绳拴在树顶、又遭聚光灯照住的小鸟，猎手可从四周发现并射击它
ground: 目标位置完全暴露；行动范围被束缚；周围攻击者藏在暗处；威胁方向不可预测；目标防御弱小
