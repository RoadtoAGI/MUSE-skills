chapter: 【掩体纪元11年，掩体世界】
figure_type: analogy
quote: 看着那些在飘浮的建筑间敏捷穿行的人，程心不由得想起了在树枝间悠荡而行的长臂猿
sensory_mapping: 棚屋成枝；人体荡行；蹬踏弹出；空中换点；立体穿梭
context_fact: 城市没有常规车辆、拖曳索或个人推进器，居民靠踹密集建筑获得反作用力前进。
image_mechanism: 城市的无序建筑群被改写成没有地面的树冠，人不再沿街走路，而在一个个可借力节点间抛出身体；失重惯性接续了长臂猿摆荡的弧线。
property_alignment: 城市居民对应长臂猿；飘浮棚屋对应枝条；三维街区对应林冠；踹墙借力对应抓枝摆动；惯性滑行对应放手腾空；抵达下一建筑对应抓住下一枝；熟练控制对应猿类敏捷
context_alignment: 太平洋一号是失重、贫穷却生命力旺盛的自发城市，动物式运动既解释物理技巧，也写出居民对非正规环境的适应。
narrative_function: 把陌生的失重交通转成一眼可懂的连续动作，并赋予混乱城市活泼的生态感。
transfer_rule: 用树栖动物解释无重力移动时，应逐一对应可抓蹬节点、腾空阶段、下一落点、身体轨迹与熟练控制方式。
failure_boundary: 人物靠持续推进器直线飞行、周围没有密集借力物，或每次碰撞都无法控制方向时，长臂猿摆荡的节点链不成立。
quality_assessment: exemplary
