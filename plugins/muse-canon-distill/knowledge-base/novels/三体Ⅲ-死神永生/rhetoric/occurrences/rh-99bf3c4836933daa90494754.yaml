figure_type: simile
quote: 浑身软软的像没有骨头一样，不愿意动
sensory_mapping: 软塌鱼身；松弛尾巴；水面仰躺；骨架消失；懒散漂浮
context_fact: 饕餮鱼进入洗脸水的泡沫便停止攻击，有的摆尾表示惬意，有的露出白肚皮。
image_mechanism: 原本钢硬的怪鱼像被抽走内部骨架，身体从箭一般的攻击姿态摊成水上软袋；力量并未被击伤，而被舒适感卸掉。
property_alignment: 鱼体紧张度对应骨架支撑；泡沫麻痹对应抽骨；停止推进对应无法发力；仰躺对应软体摊开；攻击欲消退对应刚性消失
context_alignment: 上一刻鱼鳍还是利刀，本句突然无骨，硬与软的材质反差显出香皂克制机制。
narrative_function: 让公主以身体感觉理解泡沫效果，并促成长帆想到渡海办法。
transfer_rule: 用无骨写骤然松弛时，应呈现原先刚劲姿态、支撑感消失、动作停止和身体摊软的结果。
failure_boundary: 对象因骨折受伤、麻痹抽搐或仍高速行动时，无骨的舒适松弛会混淆生理状态。
