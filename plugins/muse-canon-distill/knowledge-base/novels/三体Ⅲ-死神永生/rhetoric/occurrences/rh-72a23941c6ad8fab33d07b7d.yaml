quote: 这个在外太空的漫漫长夜和怪异险恶的异族社会中孤军奋战的男人
sensory_mapping: 异域长夜；孤军潜行；无援战线；秘密情报；一人守火
context_fact: 云天明被截获复活后在三体世界度过三个世纪，独自创作上百童话并在有限会面中传递三篇。
image_mechanism: 宇宙黑暗与政治孤独合成一条无昼战线，童话创作不再是书斋活动，而是敌境中反复试探审查边界的情报战。
property_alignment: 云天明对应孤军战士；三体社会对应敌后；孤独岁月对应漫漫长夜；构造隐喻对应作战筹划；审查风险对应敌人；三个故事对应送出的情报；人类对应远方主力
context_alignment: 程心从解码成功反推他三世纪处境，军事框架贴合PIA任务的延续，也赋予童话温柔外表下的抵抗意义。
narrative_function: 把技术突破重新归还人物代价，使希望同时带出云天明的孤独与勇气。
transfer_rule: 用孤军奋战写长期隐秘工作时，应有敌对环境、信息隔绝、明确任务、暴露风险和缺少援助，而非仅指一个人很忙。
failure_boundary: 人物拥有稳定团队和公开资源、环境并不敌对，或工作失败无安全代价时，孤军战场会夸大处境。
