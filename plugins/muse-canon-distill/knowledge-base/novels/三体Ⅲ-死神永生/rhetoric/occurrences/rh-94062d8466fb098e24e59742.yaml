tenor: 回归运动向全部小宇宙广播质量危机，要求各文明决定是否归还物质以挽救大宇宙的终极时刻
vehicle: 宗教末日中所有生命被召集接受最终裁决、决定存亡与归宿的最后审判日
ground: 发生在世界终局；涵盖所有群体；过去行为面临评价；必须作出不可逆选择；生死归宿取决于回应；具有庄严恐惧；无后续申诉
