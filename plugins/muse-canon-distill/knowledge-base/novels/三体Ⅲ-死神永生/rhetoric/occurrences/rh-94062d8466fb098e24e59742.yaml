chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 在这宇宙的最后审判日
sensory_mapping: 一百五十七万种语言像末日法庭逐一宣读名字，小宇宙中的人将以归还或拒绝回答这场终审。
context_fact: 广播宣布宇宙质量低于临界值，请各小宇宙归还物质，否则所有生命与记忆将死亡。
image_mechanism: 审判把物理质量问题转换成文明行为的道德裁决，广播既是事实通知也是最后伦理召唤。
property_alignment: 宇宙终结对应末日；广播对应宣判；各文明对应受审者；拿走质量对应待审行为；归还选择对应答辩；宇宙存亡对应判决。
context_alignment: 智子、程心与关一帆代表两个文明同处一室，拥抱发生在共同受审而又被记名的瞬间。
narrative_function: 把发现母文明语言的喜悦置于末日庄严中，并预备随后立即作出归还决定。
transfer_rule: 终局事件借审判日表达时，需有广泛召集、既往行为、明确选择、不可逆后果和价值责任。
failure_boundary: 没有神或法官执行裁判，广播发起者也不能强制归还；结果由物理因果与集体行动决定。
quality_assessment: effective
