chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 焰火般的光芒再一次照亮了黑暗的太空
sensory_mapping: 启示号像一枚巨大焰火在黑空摊开，船员和舱体化成彩亮纹路，几秒后只剩平面巨画。
context_fact: 阿拉斯加号从十万千米外看见全过程，启示号所有人手拉手成为最先被画入者。
image_mechanism: 焰火延续太空艇二维化的光学签名，重复词再一次明确这不是庆典而是同一杀伤机制扩大。
property_alignment: 二维化能量对应爆焰；船体结构展开对应焰火纹路；黑太空对应夜幕；数秒过程对应短暂燃放。
context_alignment: 章节从一根白羽毛开始，以整船焰火结束；轻柔白光转成毁灭彩光，误判完成闭环。
narrative_function: 为探测编队线落幕，并给远处观察者留下可传回太阳系的第一幅毁灭图像。
transfer_rule: 重复焰火意象时，应扩大对象与观察距离，并保留颜色、时长、展开和死亡反讽。
failure_boundary: 能量释放小于四维坍缩且无人工庆祝目的；焰火只描述远观光景。
