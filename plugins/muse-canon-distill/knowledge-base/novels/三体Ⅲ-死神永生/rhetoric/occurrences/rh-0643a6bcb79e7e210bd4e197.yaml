chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 故事像个筐，什么都能往里装
sensory_mapping: 空筐；杂物投放；越堆越乱；无筛选入口；筐沿被撑满
context_fact: IDC后期被政治实体、公司和宗教影响，各方按利益解释故事，讨论变得政治化和功利化。
image_mechanism: 有精密密码结构的童话被降格为开放容器，主张者不再从文本取证，而把预先准备的东西从外面一件件扔进去；筐越满，原故事越看不见。
property_alignment: 童话对应筐；文本边界对应筐沿；派别主张对应杂物；附会解释对应投放；缺乏证伪对应入口不设门槛；政治化争论对应筐内混杂碰撞
context_alignment: 解读本应从受控谈话中提取有限信息，筐的粗放容纳与这一科学任务的精确要求形成讽刺。
narrative_function: 揭示情报解读为何变味，把方法失控的原因从观点多样压缩成无边界装填。
transfer_rule: 用筐写解释滥用时，应对应固定文本容器、外加观点、缺少筛选规则、容量无限幻觉和原内容被遮蔽。
failure_boundary: 解释均由文本证据约束、能相互排除并经实验检验时，称作乱装会抹杀合理多义性。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 各政治实体和利益集团任意把自身主张塞进云天明童话的解释，使文本承载彼此无关的宣传内容
vehicle: 一个没有分类和容量约束的筐，任何形状的杂物都可被随手投入并混装
ground: 故事文本对应筐体；政治解读对应杂物；强行附会对应往里塞；缺少验证边界对应什么都能装；解释混乱对应杂物混堆
