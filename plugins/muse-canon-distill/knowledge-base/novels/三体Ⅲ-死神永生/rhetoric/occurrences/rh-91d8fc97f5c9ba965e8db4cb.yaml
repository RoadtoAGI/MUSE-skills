chapter: 【掩体纪元67年，“星环”号】
figure_type: simile
quote: 这个空间中充满了夕照一般的黄色光
sensory_mapping: 满舱夕黄；白壁染金；柔光迟暮；苏醒朦胧；末日余照
context_fact: 程心苏醒于木星向阳面附近的星环号，木星比半世纪前更亮，黄色光从圆窗照入。
image_mechanism: 行星反光在封闭白舱内均匀铺开，失去明确光束后只剩日暮色温；人物刚醒的麻痹与文明打击前夕也被同一迟暮光包围。
property_alignment: 木星反光对应夕照；黄色色温对应落日金黄；舱内漫射对应暮色弥散；苏醒朦胧对应黄昏视觉；白球空间对应受夕照室内；打击临近对应一天将尽
context_alignment: 她们以为将醒在打击后的安宁时代，却实际醒在太阳系末日前，夕照的时间意味与事实形成准确预警。
narrative_function: 先以温柔光色建立苏醒画面，再让黄昏隐义悄然预告文明将晚。
transfer_rule: 用夕照写人工舱光时，应匹配暖黄色温、漫射柔度、过渡时刻和场景中的迟暮或结束语义。
failure_boundary: 光线冷白刺眼、来自正午直射，或情节处于朝气勃发的开端且无终结压力时，夕照会误导时间情绪。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 星环号白色球形舱内由向阳面木星反射、透过圆窗进入的柔黄环境光
vehicle: 日落时低角度太阳把环境染成温暖而渐暗的金黄色，光线柔和、带有一天将尽的迟暮感
ground: 木星黄光对应夕阳金色；舱内漫射对应暮光充满；柔和亮度对应低角度照明；苏醒时刻对应昏晓过渡；危机将至对应日暮意味；白舱受染对应景物染黄
