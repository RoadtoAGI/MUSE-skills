tenor: 弗雷斯在文明设施崩退时重新激活的祖先记忆、简朴生存能力和土地身份
vehicle: 长期休眠在身体深处的野生动物醒来，重新回到土地与丛林中生活
ground: 能力和欲望曾被现代生活压住；环境变化触发恢复；恢复后对住所、物资和露天生活的需求改变
