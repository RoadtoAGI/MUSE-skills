chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 他体内的某种东西复苏了，突然感觉自己其实是大地和丛林中的动物
sensory_mapping: 医生与诊所的现代外壳内，一只睡了几个世纪的丛林动物睁眼，闻到土地便愿意在露天安睡。
context_fact: 弗雷斯曾是富有医生，移民开始后却觉得草棚和露宿足够，祖先四万年前来到澳洲。
image_mechanism: 复苏把文化记忆安排为身体内的休眠生命，动物身份则把少物质需求和土地适应合成一种本能。
property_alignment: 祖传生存能力对应休眠动物；危机触发对应苏醒；愿露宿对应回归野地；需求减少对应脱离驯养。
context_alignment: 老人自己也是冬眠苏醒者，体内第二次复苏把生物冬眠与文化身份恢复重叠。
narrative_function: 解释他的超然来源，并为骨折超量恢复的文明类比提供个人样本。
transfer_rule: 身份复归写成体内生物苏醒时，应明确休眠期、触发环境和醒后行为改变。
failure_boundary: 土著身份不是遗传动物本能，现代与自然也非绝对对立；比喻属于弗雷斯的自我感受。
