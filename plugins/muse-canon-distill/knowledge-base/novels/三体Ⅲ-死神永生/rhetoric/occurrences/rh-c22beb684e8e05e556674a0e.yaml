chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 那黑压压的人海像极了飘浮的蚁群
sensory_mapping: 数百万人缩成中轴线上一团团黑点，像蚁穴被翻开后整群蚂蚁悬在空中。
context_fact: 程心再次产生居高临下看蚁穴的感觉，前一次是在澳大利亚看到被生存危机压迫的人群。
image_mechanism: 尺度缩小把宏大人口转成昆虫群，暴露观察视角的冷酷，也凸显人类面对维度打击的无力。
property_alignment: 居民对应蚂蚁；太空城对应蚁穴；黑压压密度对应蚁群；远距镜头对应俯视；二维打击对应压倒性外力。
context_alignment: 人类建成天堂般掩体城，却仍像蚁穴中的昆虫；技术尺度增长没有改变宇宙中的相对渺小。
narrative_function: 回收澳大利亚篇的蚁穴视角，将人类内部生存竞争升级为整个物种遭遇外力清除。
transfer_rule: 人海写成蚁群时，应交代俯视尺度、群体密度、栖居结构、共同威胁和旧场景回声。
failure_boundary: 居民并非无个性的昆虫，许多人作出清醒选择；蚁群只表达远观尺度与脆弱性。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 失重中密集悬浮在太空城中轴线、等待末日的数百万人
vehicle: 数量巨大、个体微小、从高处看只呈黑点聚集的漂浮蚁群
ground: 个体相对城市极小；数量密集；黑色成片；从远处俯看；群体形态变化；面对外力无能为力
