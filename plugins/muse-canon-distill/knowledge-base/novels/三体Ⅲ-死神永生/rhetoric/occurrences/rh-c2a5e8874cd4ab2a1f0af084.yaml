chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 他已经使自己变成一台威慑机器，一枚在半个世纪的漫长岁月中每一秒都一触即发的地雷
sensory_mapping: 百岁老人内部的情感与语言被拆除，只剩冷硬机构；红色开关连到地雷引信，五十四年每秒都绷在触发点。
context_fact: 罗辑半世纪沉默面壁，以目光向智子展示牺牲一切的决绝，使三体世界不敢轻举妄动。
image_mechanism: 机器解释可靠重复，地雷补上被动静止和瞬间毁灭；两物组合正是威慑需要的可预测能力与不可触碰后果。
property_alignment: 长期单一职责对应专用机器；个人生活消失对应去人化；可信决心对应引信完好；敌方进攻对应触碰；立即广播对应地雷爆炸。
context_alignment: 程心随后以母性和生活气息理解岗位，两种人格对比可由机器地雷与守护母亲的物象直接辨认。
narrative_function: 解释罗辑高威慑度的自我改造代价，并确立程心交接时无法复制的心理标准。
transfer_rule: 人物如机器武器时，应分别对应稳定功能、触发条件、响应延迟和自我牺牲；不能只借冷酷外表命名。
failure_boundary: 人物仍频繁犹豫、触发规则含混或反应可撤回时，一触即发地雷不成立；喻体也抹去其持续选择的能动性。
