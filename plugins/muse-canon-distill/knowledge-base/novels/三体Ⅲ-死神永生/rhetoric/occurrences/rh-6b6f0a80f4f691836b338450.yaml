chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 理论物理学已成为没有实验基础的空对空的数学游戏
sensory_mapping: 数学公式离开实验地面悬到空中，理论彼此对打和计分，却没有任何弹道落回物质世界。
context_fact: 曹彬在加速器真相公布后认为理论物理失去实验基础，选择冬眠等待智子封锁解除。
image_mechanism: 空对空把研究对象与验证基础同时抽走，游戏再削弱认识真理的约束，说明数学精致仍可能自我循环。
property_alignment: 数学推演对应游戏规则；理论互证对应空中对打；实验缺失对应没有地面；不可证伪对应胜负不落现实。
context_alignment: 候选者不是轻视数学，而是因封锁使理论无法连接物理世界，空悬位置准确表现其职业危机。
narrative_function: 用一句话交代曹彬冬眠动机，也把智子封锁对知识生产的损害从设备层推到认识论层。
transfer_rule: 研究如游戏时，应明确规则、现实参照和验证出口；空转判断需由实验或数据链真实断裂支撑。
failure_boundary: 若理论仍有天文观测、间接实验或可检验预测，完全空对空会低估其现实联系；游戏也不等于没有价值。
