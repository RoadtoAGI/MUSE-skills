tenor: 智子封锁粒子加速器后，无法获得实验检验、只在数学内部发展理论的物理研究
vehicle: 双方都悬在空中、没有地面目标和现实落点，只按人为规则相互动作的一场游戏
ground: 活动缺少与实体世界接触的基础；参与者仍可内部推演，却无法确认结果是否对应现实
