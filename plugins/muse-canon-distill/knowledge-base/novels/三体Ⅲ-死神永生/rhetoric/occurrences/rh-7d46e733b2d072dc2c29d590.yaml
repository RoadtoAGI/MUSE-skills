chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 他们的身躯只是那长长影子末端的两个黑点
sensory_mapping: 火把把影子向墙上拖成巨长黑线，两具真人反而缩在起点，像线端墨点。
context_fact: 二人在地堡准备以画面替代真人，视觉上人物已先被二维黑形压小。
image_mechanism: 主从尺度倒置让影子成为主体、身体成为标点，预演活人被平面图像取代。
property_alignment: 人物小剪影对应黑点；长影对应延伸线条；细节不可见对应点的抽象；末端位置对应附着关系。
context_alignment: 魔画以二维图像吞掉三维身体，火炬投影先在地堡墙上排练同一降维。
narrative_function: 把环境描写嵌入童话机关暗示，增强两名凶手也受影像逻辑支配的不祥感。
transfer_rule: 人物写成图形标记时，应对齐观看尺度、轮廓损失、与更大线面的关系及主题机制。
failure_boundary: 人物真实体积没有缩小，黑点也不说明其道德属性；效果取决于火炬视角。
quality_assessment: exemplary
