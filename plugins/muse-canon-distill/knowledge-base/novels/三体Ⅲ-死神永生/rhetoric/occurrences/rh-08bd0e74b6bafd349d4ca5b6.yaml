chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 很快在她的周围清出了一块空地，就像一滴洗洁精落到盘中的油汤里一般
sensory_mapping: 俯视人海像一盘油汤，智子落在中心如清洁剂滴入，黑色人层立刻向外裂开一圈。
context_fact: 智子连续斩杀十多人，人群恐惧后退，在她身旁留出空地。
image_mechanism: 洗洁精提供具体的径向排斥过程，比泛称散开更精确地说明空圈如何瞬间从中心生成。
property_alignment: 智子对应洗洁精滴；密集人群对应油膜；恐惧传播对应张力改变；圆形空地对应油层退开的孔洞。
context_alignment: 全息画面的俯视尺度已把人群流体化，家常实验却承载血腥杀戮，冷酷反差贴合智子的示范。
narrative_function: 让一次杀戮如何重建空间秩序清晰可见，并引出她移动时空圈持续存在。
transfer_rule: 描写中心驱散密集群体时，应选择能形成径向空区的界面过程，并对应触发点、边界和扩张。
failure_boundary: 洗洁精通过物理化学作用，人群因恐惧主动退避；若人群仅向一个出口逃，圆形排斥不合。
