review_status: reviewed
tenor: AA得知飞船内只过五十二小时而外界已过二百八十六年时突然惊觉时间跨度的神情
vehicle: 从漫长梦境突然醒来，尚带恍惚却开始意识到现实已大幅变化的人
ground: 此前缺乏时间感；突然得到事实；神情惊愕；现实与主观经历断裂；需要重新定位自身所处年代
