chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: AA问，一脸如梦初醒的样子
sensory_mapping: 五十二小时航程被一句二百八十六年击穿，AA像刚睁眼发现梦外世界已换了时代。
context_fact: 曲率航行的相对论效应使她们抵达时已是银河纪元409年。
image_mechanism: 梦醒把极短主观时间与极长外部时间合并，冬眠者熟悉的时代跳跃在光速航行中再次发生。
property_alignment: 飞船内短时对应梦时；外界二百八十六年对应醒后久别；惊问对应初醒；年代断层对应梦实脱节。
context_alignment: 程心与AA多次从冬眠醒入未来，这次没有睡眠舱，光速本身制造了最大一次“醒来”。
narrative_function: 让相对论数字落到人物表情，并明确她们已经与太阳系时代彻底断开。
transfer_rule: 时间跃迁比作梦醒时，应对齐主观时长、客观时长、认知断层和人物既有睡眠经验。
failure_boundary: AA并未睡着或失去航程记忆，梦醒只形容时间尺度冲击和神态。
