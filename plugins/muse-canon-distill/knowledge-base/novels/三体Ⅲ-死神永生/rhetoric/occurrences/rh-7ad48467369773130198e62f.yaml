figure_type: simile
quote: 公元世纪的化学动力火箭，如摩天大楼般高高耸立着，却只有顶端那一点点有效荷载
sensory_mapping: 高耸箭体；摩天楼轮廓；仰望顶端；巨大主体；微小载荷
context_fact: 程心看到未来穿梭机舱几乎全是有效空间，因而回想旧火箭低载荷比例。
image_mechanism: 火箭在发射台上暂时变成一栋没有楼层的高楼，整座‘建筑’只为把屋顶那一点东西送走；高度越夸张，载荷反差越明显。
property_alignment: 化学火箭对应摩天楼；箭体对应楼身；垂直发射对应高楼竖立；总体高度对应楼层尺度；有效载荷对应楼顶小室；地面设施对应楼基
context_alignment: 古今技术对比不依赖公式，摩天楼尺度和顶端小点让推进效率差异一眼可见。
narrative_function: 衬托未来穿梭机能源与结构效率的跃迁。
transfer_rule: 用摩天楼写大型火箭时，应突出竖直高度、主体与顶端载荷的比例、地面仰视和庞大支撑。
failure_boundary: 火箭短宽、载荷占主体大部，或重点在水平组装时，摩天楼会误写比例。
