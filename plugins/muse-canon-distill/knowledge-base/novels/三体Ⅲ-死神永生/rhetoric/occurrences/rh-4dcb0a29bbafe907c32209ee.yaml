quote: 更像一个在窃窃私语中产生拜占庭式阴谋的地方
sensory_mapping: 办公室的低声交谈化为宫廷耳语，十八世纪厚墙退回拜占庭暗堡，现代情报工作披上旧阴谋阴影。
context_fact: 程心初入PIA，发现总部与想象中的现代地球情报中心迥异。
image_mechanism: 建筑物理质感先建立古堡，窃语再激活政治功能；拜占庭式并非只说年代，而把秘密、背叛和派系预装进场景。
property_alignment: 旧厚楼对应宫廷堡垒；情报保密对应窃窃私语；多国猜忌对应拜占庭阴谋网络。
context_alignment: 随后维德强调欺骗背叛，成员彼此窃取情报，喻体提前准确预告机构文化。
narrative_function: 以初见空间完成PIA气质定调，为程心的技术理性与情报伦理冲突铺垫。
transfer_rule: 机构场所借历史政治文化时，建筑、交流方式和权力机制至少要有两层落点；年代相似本身不够。
failure_boundary: 若PIA公开透明、楼内明亮喧闹且成员互信，拜占庭阴谋就只是装饰性历史标签。
