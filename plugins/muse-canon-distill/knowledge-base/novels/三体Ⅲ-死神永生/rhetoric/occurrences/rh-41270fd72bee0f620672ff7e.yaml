chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 就像在地面向上扔石头扔多高总会落回来
sensory_mapping: 飞船像被向上抛出的石子，发动机给它一段上升弧线，空间引力般的流动终会把它拽回平面。
context_fact: 白Ice反复四次计算，确认整个太阳系逃出跌落区需达到光速。
image_mechanism: 抛石补足瀑布类比中的逃逸速度概念，把相对介质问题连接到熟悉的引力阈值。
property_alignment: 飞船加速对应抛石；暂时远离对应上升；空间回流对应引力；二维面对应地面；光速对应逃逸速度。
context_alignment: 两个类比连续使用：瀑布说明空间流，抛石说明为何多划一阵仍不够，互相补足。
narrative_function: 堵住通过持续普通加速逃生的希望，为末日判决建立不可辩驳的日常直觉。
transfer_rule: 阈值运动用抛体类比时，应对齐初速、约束场、最高点、返回和真正逃逸条件。
failure_boundary: 二维跌落不由天体引力造成，飞船还能持续推进而石头通常只受初抛；只比较阈值结构。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 低于二维跌落区逃逸速度的飞船即使短暂远离，最终仍会被空间流动拉回
vehicle: 石头被向上抛出后获得有限高度，但速度低于引力逃逸值便会减速并落回地面
ground: 初始运动方向反向；可获得短时距离；约束场持续作用；存在明确逃逸速度；低于阈值必然返回
