quote: 一根根在杯底竖起来，形成一片绿色的小林
sensory_mapping: 茶叶在杯底一根根立住，杯沿之内忽然长出一圈微型树冠，清香像从小林中升起。
context_fact: 智子在中式客厅为二人倒茶，使用的茶叶似龙井，省去过去繁琐茶道。
image_mechanism: 尺度缩小把杯底排列扩成风景，茶叶形态、颜色和香气共同完成从饮品到林地的转化。
property_alignment: 茶叶对应树木；竖立姿态对应树干；绿色对应叶冠；杯底对应林地；成片排列对应森林；茶香对应林间气息。
context_alignment: 门外是真田园，杯中又出现小林，小宇宙的层层微缩结构在日常茶具中复现。
narrative_function: 用细小熟悉景物缓冲宇宙管理者的宏大身份，恢复智子茶室场景的生活质感。
transfer_rule: 微物写成景观时，应让单体形状、群体排列、底面、颜色和气味在缩放后仍对应。
failure_boundary: 茶叶没有根、枝叶或生态关系，森林感只来自杯底的短暂排列。
