figure_type: simile
quote: 她仿佛在交替变换外形，时而像人，时而像猫
sensory_mapping: 两排火把造成的明暗切片像连续剪影帧，披斗篷的人影在每帧中收缩、舒展为猫。
context_fact: 狄奥伦娜遮住半张脸，沿有成排火把的阶梯悄无声息地上行并没入黑暗。
image_mechanism: 明暗交替承担变形剪辑器，猫在每次进入暗区时接管她的步态和轮廓，形成持续数步的动态框架。
property_alignment: 斗篷剪影的收缩伸展对应人猫轮廓切换；无声步伐对应猫的软足潜行；火把间歇照明对应变形逐帧发生。
context_alignment: 人物刚展示无需刀具的诡秘能力，离场时的形态不稳定感延续其超自然身份，又严格依托现场灯光。
narrative_function: 让普通离场成为一次小型幻术，在异能揭晓前维持人物不可归类、难以捕捉的气质。
transfer_rule: 动态变形需要现场节律装置；行走穿越明暗、遮挡或反射时，每一次视觉切换都可推进同一喻体。
failure_boundary: 均匀照明下轮廓不会交替变化；若人物脚步沉重或衣着贴身，猫的轻捷和形态收束便无法由动作支持。
