tenor: 拥有庭院、生态循环和居住空间的星环号及其内部微型生活环境
vehicle: 尺度虽小却自给自足、具有山水生态与居民生活的一整个世界
ground: 边界完整；生态自循环；内部可长期生存；包含多样景观；对居住者构成全部生活空间
