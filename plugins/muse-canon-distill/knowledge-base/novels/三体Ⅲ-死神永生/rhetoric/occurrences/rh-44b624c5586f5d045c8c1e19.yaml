chapter: 【掩体纪元67年，冥王星】
figure_type: metaphor
quote: 一个如此美好的小世界很快将变成一张没有厚度的薄片
sensory_mapping: 六座庭院、溪流、树林和沙滩被船壳包成掌中的地球，末日后将一起摊成一页薄画。
context_fact: 星环号用可支持四十人的冗余生态系统维持至多四人，还能在行星表面充当长期基地。
image_mechanism: 世界隐喻先把小飞船的生命容量放大，再让它骤降为无厚度薄片，三维丰富与二维贫瘠形成强落差。
property_alignment: 船壳边界对应世界边界；生态循环对应自然系统；六庭院对应地貌；四名乘员对应居民；长期基地对应可居世界。
context_alignment: 星环号浓缩了地球最美部分，太阳系毁灭因此能在一艘船的庭院里被感知和哀悼。
narrative_function: 把宏大末日缩到程心能爱惜的具体对象，并为黑翼遮蔽思想的心理防御提供触发点。
transfer_rule: 封闭居所写成小世界时，应列出自足循环、地貌、居民、边界和持续时间，随后可用状态改变检验其完整性。
failure_boundary: 飞船依赖技术维护且物种、资源远不及行星，不能等同完整世界；称谓强调居住体验与生态自足。
