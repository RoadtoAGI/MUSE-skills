tenor: 云天明这一事实对程心拒绝执剑人候选资格所构成的决定性限制
vehicle: 横在前路、垂直坚固且无法绕过或越过的高墙
ground: 对象具有不可否认的实体感；它封死继续沿原有决定前进的路径
