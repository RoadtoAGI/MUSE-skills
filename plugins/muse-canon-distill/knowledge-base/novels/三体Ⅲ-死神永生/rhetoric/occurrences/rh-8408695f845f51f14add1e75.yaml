chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 还有一个事实，像一堵不可逾越的墙一样矗立在程心面前
sensory_mapping: 关于云天明的责任从心中理由竖成迎面硬墙，程心每一次退选念头都撞在墙面上。
context_fact: 即便民意与母性两项理由都不存在，云天明仍使她无法置身威慑事务之外。
image_mechanism: 矗立把事实赋予高度和硬度，不可逾越则把伦理牵连转成路径封锁，表现其在论证中的终止权。
property_alignment: 事实确定对应墙体坚实；伦理责任不可回避对应无法绕行；拒绝候选的意图对应前进路径被截断。
context_alignment: 云天明由她送入太空并可能仍在敌方世界，私人因果的坚固程度高于外界劝说，适合成为最后障碍。
narrative_function: 把程心接受候选的三层理由收束于最不可撤销的一项，并重新接通阶梯计划线。
transfer_rule: 事实如墙应明确它阻断的是哪一条行动路径，以及为何无法绕开；高度与硬度来自责任或证据强度。
failure_boundary: 若人物有可行替代选择、事实后来被轻易否定，墙的不可逾越性会失真；一般困难只适合写门槛或路障。
