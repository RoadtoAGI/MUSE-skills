chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 它们的形状疯狂变幻，像两团狂风中的火焰
sensory_mapping: 宇宙两端蓝红光团像被暴风撕扯的火，忽而拉长忽而缩聚，轮廓一刻也不固定。
context_fact: 穿梭机在每秒十几千米的新光速下以近光速绕蓝星运行，外部时间高速流逝。
image_mechanism: 狂风火焰为相对论像差提供连续形变模型，颜色和不稳定边缘都可直接感知。
property_alignment: 星团光色对应火光；形变对应火舌翻动；高速参照系对应狂风；两端光团对应两团火；轮廓不稳对应风中燃烧。
context_alignment: 进入正常光速时星团像篝火与宝石，跌入低光速后同样光团变成受狂风折磨的火焰，稳定宇宙彻底失序。
narrative_function: 第一眼标示低光速外景异常，并把时间加速造成的周期变化转成危险动态。
transfer_rule: 不稳定光团比作风中火焰时，应落实色彩、边缘、外力、形变频率和观察状态变化。
failure_boundary: 星团没有燃烧介质或风，恒星也未实际变形；火焰只描述光学像差。
