chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 那些窗口层层叠叠地涌现，像彩色的乌云般很快覆盖了银河
sensory_mapping: 矩形窗口软化成云团，一层层从视野边缘涌上，银河像晴空被风暴云盖没。
context_fact: 战斗警报启动后，控制信息以全息窗口密集出现，覆盖一号广场原本直面的银河。
image_mechanism: 乌云同时提供层叠运动、遮天结果和灾害预兆，彩色则保留界面视觉特征，使数字警报获得天气规模。
property_alignment: 窗口层叠对应云层堆积；连续弹出对应乌云涌来；彩色界面对应彩云色块；遮住银河对应覆盖天空。
context_alignment: 前文彩云是竞选庆典，此处彩色乌云沿用悬空影像却翻转情绪，从文明美景转为战斗风暴。
narrative_function: 把信息过载写成天空突变，完成从深空宁静到紧急作战的视觉封锁。
transfer_rule: 界面如云时可用生成速度、层次和遮挡率建立运动；乌云的威胁色彩需与信息内容一致。
failure_boundary: 只有单个静止窗口、界面不遮挡环境或信息是普通通知时，乌云风暴的规模和预兆不合。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 大量彩色警报信息窗口在透明广场上空连续弹出并遮住星空
vehicle: 风暴前迅速增厚、层叠推进并吞没天空的彩色乌云
ground: 多个暗示危险的面层快速聚集；它们从局部扩张并遮蔽原有明亮景观
