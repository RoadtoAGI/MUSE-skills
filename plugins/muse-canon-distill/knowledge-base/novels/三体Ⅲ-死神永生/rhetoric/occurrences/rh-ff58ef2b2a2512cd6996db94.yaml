chapter: 【掩体纪元11年，掩体世界】
figure_type: metaphor
quote: 那人们将生活在一圈或者几圈大竹子里
sensory_mapping: 巨竹弯环；筒壁包围；纵向长廊；视野收窄；多管并列
context_fact: 曹彬解释轮辐构型虽强度高、面积大且易建造，居民却会持续感到身在飞船而非完整世界。
image_mechanism: 复杂轮辐剖面被缩成日常中空竹管，面积数字让位于身体被筒壁包住的体验；竹管再弯成环，准确保留城市结构。
property_alignment: 居住环对应竹管；环形曲率对应竹子弯成圈；隧道内腔对应竹腔；封闭壁面对应竹壁；长而窄对应竹节比例；多环城市对应几根竹子；居民受限视野对应管中生活
context_alignment: 问题焦点是主观“世界感”而非工程参数，竹管的身体压迫比面积数据更能说明为何理想构型不适合长期生活。
narrative_function: 把空间心理的缺陷具体化，解释人类为何付出更高工程代价建造整体外壳城市。
transfer_rule: 用管状自然物写封闭建筑时，应同时匹配截面、长宽比、内外壁关系、视线方向和使用者的包围感。
failure_boundary: 居住区拥有贯通的大型中庭、透明外壁、横向开阔视野，或只是短暂通过的交通管时，“住在竹子里”会夸大逼仄。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 轮辐式太空城由一条或数条狭长环形居住隧道构成，面积虽大却缺乏整体中空城市的开阔视野
vehicle: 人住进一根或几根巨大、细长、中空且视线被筒壁限制的竹管内部
ground: 环形隧道对应弯成圈的竹管；中空截面对应竹腔；狭长空间对应竹节纵向延伸；壁面封闭对应竹壁；多环结构对应多根竹子；缺少世界感对应住在管内
