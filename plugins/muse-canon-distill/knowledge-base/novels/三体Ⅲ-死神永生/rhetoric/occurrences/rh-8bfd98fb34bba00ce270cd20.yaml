chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 太阳表面仿佛长出了一棵灿烂的火树
sensory_mapping: 太阳成为土壤，一根白炽树干从裂孔拔起，四小时内把灿烂树冠生长到行星轨道。
context_fact: 喷出带直径五万千米，太阳物质航行约四小时后到达0.6天文单位外的行星轨道。
image_mechanism: 生长把高速传播转成植物由根到梢的空间延伸，后续行星接触树梢因而有明确结构位置。
property_alignment: 裂孔对应树根；喷流主带对应树干；扩散前缘对应树冠树梢；传播到轨道对应树木长高。
context_alignment: 灿烂通常赞美生命树，此处火树所到之处烤焦生命，美感与灭绝形成强烈反讽。
narrative_function: 用一棵可生长巨树统摄数小时天文传播，并为下一段魔爪反复抓行星提供形态基础。
transfer_rule: 线状扩展如树木生长时，应给出根、干、冠、梢与时间推进的对应，并利用生命含义调节情绪。
failure_boundary: 物质带没有木质分枝或生物生长，喷射速度也非植物缓慢伸长；树只说明外形和传播阶段。
