chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 形成一片一望无际的人海
sensory_mapping: 树下的人头铺到地平线，跪拜和欢呼像海面波纹分片起伏，智子悬在四百米高的岸外。
context_fact: 大批不同宗教信徒每日朝拜智子居所，人数高峰远超历史大型朝圣。
image_mechanism: 人海把个体信徒降为连续介质，规模和群体同步动作通过水面扩展获得可见边界感。
property_alignment: 个人对应水滴；密集人头对应海面；一望无际对应无边海域；集体仪式对应波浪起伏。
context_alignment: 智子别墅在云雾高处显得极小，人海从地面仰望，使神与信众的垂直距离和数量差同时显现。
narrative_function: 为宗教狂热提供全景尺度，并建立后续沉默人海和吸音毯延展意象的首处。
transfer_rule: 人群如海时，应落实个体密度、可见范围、集体运动和观察者所在的岸或高点。
failure_boundary: 人群有信仰差异和组织选择，不是同质液体；海喻不能抹去个体责任。
