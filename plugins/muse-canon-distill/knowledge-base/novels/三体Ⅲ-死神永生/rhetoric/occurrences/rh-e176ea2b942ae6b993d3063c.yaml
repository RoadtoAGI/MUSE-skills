tenor: 聚集在智子巨树建筑下、数量达到数倍麦加朝圣规模的信徒人群
vehicle: 海水铺展到地平线，由无数水滴连成起伏密集、看不见边岸的广阔水面
ground: 个体数量极多；分布连续密集；范围超出视野；整体会产生共同声势与波动
