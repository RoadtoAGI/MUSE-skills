chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 它们除了肚皮通体乌黑，像钢铁做成的机器
sensory_mapping: 黑钢外壳；铆接机器；硬质刀具；规律运转；冷光表面
context_fact: 公主第一次近距离观察能咬碎船只的饕餮鱼，看到它们进入泡沫前后由凶硬转为懒散。
image_mechanism: 鱼鳞和皮肉被视觉压成整块黑钢，鳍与牙像装配刀具，游动成了冷硬机器的执行程序；泡沫随后让这台机器突然断电般松弛。
property_alignment: 乌黑鱼身对应黑钢机壳；坚硬牙鳍对应机器刀具；重复围攻对应程序运行；生物凶性对应无情执行；进入泡沫停动对应机器停机
context_alignment: 钢铁外观承接前文咬钢、碎船的能力，并与雪白柔软泡沫构成最强材质反差。
narrative_function: 强化怪鱼的工业破坏感，同时凸显轻盈香皂能制服重硬对象的奇异规则。
transfer_rule: 用钢铁机器写动物时，应由体色、外壳硬度、部件功能、重复动作和情感缺席共同支撑。
failure_boundary: 动物毛皮柔软、动作随机温顺，或破坏来自群体数量而非个体硬结构时，钢铁机器会过度机械化。
