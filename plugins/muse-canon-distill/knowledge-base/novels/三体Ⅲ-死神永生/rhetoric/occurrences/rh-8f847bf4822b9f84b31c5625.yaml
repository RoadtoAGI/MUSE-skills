chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 把城市照得亮如白昼
sensory_mapping: 幽蓝星点膨成惨白太阳，楼群影子突然压在地面，午夜街道像正午一样无遮无掩。
context_fact: 三体星系一颗恒星被光粒击中，亮度在两分钟内超过满月并急剧升至峰值。
image_mechanism: 白昼用城市居民最熟悉的照度阈值衡量天文爆发，把遥远恒星事件直接投到街道和人影。
property_alignment: 恒星增亮对应太阳升起；地面人影对应白昼照明；灯海失色对应夜灯无用；不可正视对应日光强度。
context_alignment: 蓝光先与程心陵墓噩梦重合，转成白昼后把私人恐惧扩展为所有市民可见的文明判决。
narrative_function: 以日常照明尺度显示打击能量，并让三体毁灭成为地球天空中的公共事件。
transfer_rule: 异常光如白昼时，应提供可核对的影子、人工光失效、颜色和直视反应，而非只写很亮。
failure_boundary: 光源仍是星点而非近距太阳，光照只持续短时且色谱惨白；不意味着当地进入真正白天。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 遭打击的三体恒星突然增亮，以惨白强光照亮夜间城市的程度
vehicle: 太阳升起后的白昼，地面轮廓、人影和远处建筑都被充足天光照清
ground: 照度远超普通夜光；城市细节清晰可见；黑夜视觉状态被短暂取消；人眼难以直视光源
