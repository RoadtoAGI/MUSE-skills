review_status: reviewed
tenor: 人在常规推进产生的极高过载下沿加速方向被严重压缩致死的身体后果
vehicle: 有厚度的面团被强力上下挤压，摊成扁平薄饼
ground: 压力极大；厚度显著减少；形体横向摊开；原结构破坏；过程快速；无法存活
