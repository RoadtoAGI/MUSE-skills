chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 如果是常规推进，这样级别的加速度，进入什么液都要被压成薄饼的
sensory_mapping: 若靠喷气硬推，身体会被加速度按在舱壁上，像面团一瞬压成薄薄圆饼。
context_fact: 曲率驱动改变空间而没有过载，因此飞船无需让乘员进入深海液保护。
image_mechanism: 薄饼用夸张的形态压缩说明常规过载，同时与整个太阳系被压成二维薄片形成黑色呼应。
property_alignment: 人体厚度对应面团厚度；加速度压力对应压饼力；身体扁化对应摊饼；死亡对应结构破坏；保护液失效对应压力过强。
context_alignment: 乘员逃离降维薄片时，常规加速本也会把他们压成薄饼；曲率引擎是唯一不重复二维命运的推进方式。
narrative_function: 以粗粝身体图像快速说明无过载为何关键，并衬出曲率驱动机制的革命性。
transfer_rule: 极端压力比作压饼时，应说明受力方向、厚度变化、结构后果和新技术如何避开该机制。
failure_boundary: 人体不会均匀变成可辨薄饼，实际先发生器官损伤；夸张只表达过载致死与压缩方向。
