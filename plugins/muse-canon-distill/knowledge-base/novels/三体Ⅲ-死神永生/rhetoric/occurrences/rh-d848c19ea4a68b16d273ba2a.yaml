tenor: 窗外木星大红斑在亨特接受秘密使命的沉默时刻呈现的视觉形态
vehicle: 尺度巨大、长久睁开并无声凝视两人的眼睛
ground: 椭圆红斑近似眼形；固定朝向观察者；持续存在如不眨眼的见证者
