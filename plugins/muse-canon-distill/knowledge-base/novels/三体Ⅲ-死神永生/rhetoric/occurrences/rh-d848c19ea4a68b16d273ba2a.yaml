chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 木星的大红斑像一只巨眼一样注视着他们
sensory_mapping: 木星云层化成眼白，红斑收束为巨瞳，隔着舷窗把两人的秘密交接锁在视线里。
context_fact: 总参谋长要求亨特牺牲半生潜伏，必要时甚至毁灭全舰；两人随后长久沉默。
image_mechanism: 巨眼把无声行星变成第三名见证者，并以远超人类的尺度审视这一伦理使命。
property_alignment: 大红斑椭圆对应眼球；朝向舷窗对应注视；长寿风暴对应持续睁眼；秘密会谈对应被见证。
context_alignment: 使命涉及两个世界却必须绝对保密，唯一旁观者只能是无生命天体，强化孤独责任。
narrative_function: 为亨特接受使命赋予审判和见证感，并将个人选择置于行星尺度。
transfer_rule: 天体拟眼时，应匹配轮廓、朝向、持续性和被观看事件，避免只凭圆形。
failure_boundary: 红斑是风暴且无意识，注视来自构图投射；若观察角度不呈眼形，映射会消失。
