review_status: reviewed
tenor: 北美一号高纬低重力区几座高达十千米、顶端逼近人造太阳的摩天大厦
vehicle: 几根从地表笔直刺向日轮的细长尖刺，狭窄、锐利并带有穿透方向
ground: 十千米楼身对应长刺；窄高比例对应细尖；楼顶朝向球心太阳对应刺尖指日；成组高楼对应数根并列尖刺；低重力生长对应刺从地面伸出
