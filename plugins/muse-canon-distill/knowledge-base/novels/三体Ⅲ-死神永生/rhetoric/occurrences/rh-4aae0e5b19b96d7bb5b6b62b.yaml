chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 像从地面伸向太阳的几根细长的尖刺
sensory_mapping: 细长黑刺；垂直上挑；刺尖近太阳；球内成束；高度眩晕
context_fact: 球形城市高纬处重力较低，建筑高度只受球体内部空间限制，最高楼达到球半径的一半。
image_mechanism: 宏伟楼群在球内反常的向心方向被压成几条锐线，楼顶几乎碰到中心光源，城市天际线遂呈现刺穿太阳的攻击姿态。
property_alignment: 大厦楼身对应刺身；高宽悬殊对应细长；尖顶对应刺尖；向球心延伸对应刺向目标；多楼并立对应数刺；人造太阳对应被指向的圆靶
context_alignment: 北美一号的重力随纬度变化，尖刺形象同时交代高纬建筑为何能异常拔高及其朝向球心的空间关系。
narrative_function: 把十千米高度和球内倒悬式方向压进一幅锐利构图，突出掩体城市的非地球尺度。
transfer_rule: 用尖刺描写超高建筑时，建筑应有显著细长比、汇聚方向、锐尖轮廓，并在远景中指向一个明确视觉目标。
failure_boundary: 楼体粗矮、顶部平钝、排列成连续墙面，或没有共同指向时，尖刺会误写建筑轮廓和方向感。
quality_assessment: effective
