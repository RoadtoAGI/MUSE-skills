chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 好像某种超级绘图软件以太空为屏幕绘出的一个基本形状
sensory_mapping: 太空成为黑色画布，飞船表面消去接缝与模块，鼠标一次拖出白色圆柱。
context_fact: 当代巨舰通常由不规则模块组合，万有引力号却因船体本身是引力波天线而极端规则。
image_mechanism: 软件生成解释规则性带来的不真实感，基本形状强调它像几何原型而非工程物的视觉冲突。
property_alignment: 白色圆柱对应软件基本体；无附加结构对应未编辑原型；黑太空对应屏幕背景。
context_alignment: 飞船承担文明威慑的抽象功能，纯几何外形使其像一枚被直接写入宇宙的符号。
narrative_function: 在首次亮相中突出舰体异质性，并为下一句柏拉图理型抬升抽象层次。
transfer_rule: 工程物如数字模型时，应由几何纯度、表面无误差和背景分离度支撑；软件喻体用于视觉生成感，不替代结构机制。
failure_boundary: 船体有大量模块、磨损接缝或不规则突起时，未编辑基本体不成立。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 外形异常规则、呈纯白圆柱的万有引力号
vehicle: 在无边黑色屏幕上由绘图软件生成的理想几何基本体
ground: 轮廓规则到缺少制造误差和功能附着物；对象与背景对比清楚、像直接渲染而非建造
