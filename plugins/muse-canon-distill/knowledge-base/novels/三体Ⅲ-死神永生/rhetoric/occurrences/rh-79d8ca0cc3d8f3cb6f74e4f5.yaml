chapter: 【掩体纪元66年，太阳系外围】
figure_type: analogy
quote: 现在逃离，就像在瀑布顶端附近的河面上划船，除非超过一个逃逸速度，否则不论怎样划，迟一早都会坠入瀑布
sensory_mapping: 飞船发动机像船桨奋力划动，脚下空间河却整片奔向维度悬崖，船头再用力仍向瀑口后退。
context_fact: 启示号有过载却无正加速，计算所得逃逸速度为光速，现有飞船不能达到。
image_mechanism: 瀑顶划船把空间本身流动与飞船相对运动分开，使逃逸速度成为船速超过河速的直观门槛。
property_alignment: 飞船对应小船；发动机对应划桨；流动空间对应河水；二维边界对应瀑口；光速对应逆流阈值。
context_alignment: 梦中汽车随桌布和沙流移动，此处用更完整流体模型把直觉转成正式物理汇报。
narrative_function: 回答能否逃离的核心问题，并让光速判决在公布前已有必死逻辑。
transfer_rule: 介质流中逃逸类比应区分主体速度、介质速度、危险边界和超过阈值后的条件。
failure_boundary: 空间流动不等于水流阻力，光速限制来自相对论；划船模型不能计算精确数值。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 太阳系飞船在向二维面流动的三维空间中逆向推进、若速度不足仍会随空间跌落的处境
vehicle: 小船在瀑布上游逆流划行，水整体向崖边加速，船速若低于水流便终将越崖
ground: 承载介质整体流向危险边界；主体可局部逆行；存在速度阈值；不足阈值只延缓结局；越界不可逆
