chapter: 【时间之外，我们的宇宙】
figure_type: metaphor
quote: 然后才用阳光揭开这个世界的面纱
sensory_mapping: 阳光像一只手从中央提起黑纱，蓝色先露出一圈，随后田地、白房和树从遮蔽下显形。
context_fact: 小宇宙太阳由暗圆盘慢慢变亮，周围蓝色扩展为天空，田园随之出现。
image_mechanism: 面纱把亮度变化改成有方向的揭示动作，蓝天扩展成为布料被掀开的可视边缘。
property_alignment: 黑暗对应面纱；世界景物对应纱后面貌；阳光增强对应揭纱；蓝圈扩张对应开口扩大；二人观看对应被揭示对象的观众。
context_alignment: 前文宇宙黑暗面纱由知识揭开，此处阳光揭开可居世界，认知恐惧转成感官安顿。
narrative_function: 组织田园渐显的视觉顺序，并延续全书‘揭幕即进入新世界’的门槛感。
transfer_rule: 光揭面纱应描写遮挡状态、揭起边缘、显露顺序和原本已在后方的具体对象。
failure_boundary: 没有实体布料或主动之手，黑暗也非覆盖物；景物可见性由照度变化造成。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 太阳逐渐增强照明，使原本隐藏在黑暗中的蓝天、田园、房屋和树木依次可见
vehicle: 手把遮在对象前的薄面纱掀开，使后方原有面貌逐步露出
ground: 对象原已存在；遮挡使其不可见；揭开有过程；光承担揭示动作；可见范围逐渐扩大；观看者终于识别真貌
