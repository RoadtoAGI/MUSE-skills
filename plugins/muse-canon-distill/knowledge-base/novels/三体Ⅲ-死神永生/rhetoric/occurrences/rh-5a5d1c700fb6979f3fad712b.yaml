chapter: 【掩体纪元67年，冥王星】
figure_type: metaphor
quote: 掩体世界可能真的被建设成了天堂一般
sensory_mapping: 巨行星后的城市像悬在太空的天堂，灯海、生态和安全穹顶共同许诺永不坠落。
context_fact: 掩体工程曾被视为黑暗森林打击避难方案，如今二维化使所有行星遮挡失效。
image_mechanism: 天堂把工程成就与终极安全合并，随后崩溃一词让完美庇护在毁灭恐惧中反转。
property_alignment: 掩体城市对应天堂空间；富足美景对应完美生活；行星遮蔽对应免灾；二维打击对应天堂崩塌。
context_alignment: 程心和AA拒绝观看，越像天堂越加重终结痛苦，喻体功能正建立在失效上。
narrative_function: 概括人类六十六年建设的最高成果，并以天堂毁灭宣判掩体路线失败。
transfer_rule: 安全社会比作天堂时，应同时映射生活质量、免灾承诺、居民信念和承诺被何种风险击穿。
failure_boundary: 掩体世界仍有政治与苦难，并非超验天堂；本句来自未亲见的推测。
