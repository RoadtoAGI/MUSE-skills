chapter: 地球文明
figure_type: metaphor
quote: 仰头看看，像是星空被挖空了一大块
sensory_mapping: 黑碑直插头顶，矩形内部一颗星也没有，像星幕被利器剜去一块，只剩黑洞口。
context_fact: 方碑是白色地表唯一突起，走近后尺寸远超程心和AA远观判断。
image_mechanism: 挖空把遮挡误读为空间缺失，纯黑碑面因与天空同色而不再像实体，反而像负形。
property_alignment: 碑面对应空洞；无星区域对应被挖；矩形轮廓对应切口；高大遮天对应大块缺失。
context_alignment: 二维打击将从空间中抽走一个维度，入口视觉也像现实被挖除，形成主题预响。
narrative_function: 用负空间显出方碑真实规模，并强化它通向地下文明墓室的入口感。
transfer_rule: 遮挡物写成背景缺口时，应对齐颜色融合、边界、被遮元素、观察角度和主题作用。
failure_boundary: 星空没有真正缺失，黑碑有实体表面；挖空只来自背光视角。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 近看高大黑碑占据视野、以纯黑矩形遮住后方星空的效果
vehicle: 有人从连续星幕中切挖掉一整块，留下没有星点的几何空洞
ground: 局部完全无光点；边界整齐；缺失区域尺度巨大；背景连续性被打断；观察者仰视
