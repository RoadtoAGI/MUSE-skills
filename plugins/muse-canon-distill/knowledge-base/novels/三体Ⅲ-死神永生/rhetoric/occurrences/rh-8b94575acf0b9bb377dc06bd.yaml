chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 对于这些来自超信息化社会的人来说，这就像失明一般
sensory_mapping: 墙面和衣物的信息界面全部熄黑，社会仍在身边运动，移民却像睁眼走进无光空间。
context_fact: 超信息化设施在移民区消失，基本通信也无法保障，政府和居民只能从极少渠道获知事件。
image_mechanism: 失明把技术依赖写成人体感官依赖，强调信息不是额外便利，而是现代社会用于看路的器官。
property_alignment: 信息界面对应眼睛；社会动态对应可视环境；通信中断对应视神经断开；治理失效对应盲行失向。
context_alignment: 人们仍习惯在死墙和衣服上乱点，动作如失明者摸索旧位置，使类比获得现场行为支撑。
narrative_function: 解释现代治理为何迅速失效，并把秩序崩坏归因到感知基础设施断裂。
transfer_rule: 把信息匮乏比作感官丧失时，应标明原通道、不可见对象和由此失败的行动。
failure_boundary: 居民仍有肉眼、口头消息和有限渠道，并非完全无知；若只是信息变慢，失明可能强于实际。
quality_assessment: effective
