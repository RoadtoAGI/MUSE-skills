review_status: reviewed
tenor: 移民失去信息墙、个人终端和可靠通信后无法获知社会动态的状态
vehicle: 眼睛失去视觉后看不见环境、方向和接近的危险
ground: 原有主要感知通道突然关闭；周围事件仍发生却无法取得；行动者失去定向和预警能力
