chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 周围的树影和人影在它的光芒中像秒针一般走动
sensory_mapping: 发射场地面成为表盘，人和树脚成为针轴，火球升高让长影像秒针扫格。
context_fact: 导弹每隔五分钟沿尾迹升空，火光改变周围投影方向。
image_mechanism: 真实光源运动驱动影针，周期发射又让表盘获得计时功能，视觉运动与计划节拍闭合。
property_alignment: 长影对应针身；根部固定对应针轴；光源移动造成扫转对应秒针走动；五分钟间隔对应计时。
context_alignment: 全球工程按精确序列启动，秒针让宏大核发射呈现机械秩序而非混乱爆炸。
narrative_function: 在高空火球之外提供地面微观动势，显示时间与发射节律。
transfer_rule: 影子如表针时，应明确支点、扫动方向和周期来源；光源运动必须真实造成投影旋转。
failure_boundary: 漫射光无清晰影子、影子只平移或发射无节律时，秒针的绕轴计时机制不成立。
quality_assessment: exemplary
confidence: 0.97
review_status: reviewed
tenor: 导弹火球移动时被强光推动、快速扫过地面的树影人影
vehicle: 表盘上按稳定方向移动、标记短时间流逝的秒针
ground: 细长暗影绕固定支点转动；移动连续可见并以短周期标记时间
