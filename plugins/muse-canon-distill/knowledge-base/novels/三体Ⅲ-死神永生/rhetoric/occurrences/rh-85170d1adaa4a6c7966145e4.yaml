chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 人类文明在宇宙中有了一面镜子，使人类从以前不可能的角度重新认识自己
sensory_mapping: 人类文化发往四光年外，在三体作品中形成镜面，电影、小说和音乐把文明的脸重新照回地球。
context_fact: 三体作品全面模仿地球人物与环境，艺术水准很高，反而取代日益颓废的本土文化成为主流。
image_mechanism: 镜子将模仿解释为有距离的反射，既说明相似来源，也保留反射角度带来的新视野和潜在失真。
property_alignment: 人类原文化对应镜前主体；三体模仿作品对应反射面；作品相似对应镜像保形；异文明角度对应新观察方向。
context_alignment: 章节标题文化反射与此句闭合，前文新眼睛负责三体观看人类，此处镜子负责人类反看自己。
narrative_function: 给反射文化命名并解释其吸引力，也暗示镜面展示人类而遮蔽镜后真实三体世界。
transfer_rule: 文化镜像要交代原型、反射媒介、保留特征和角度差；镜像价值来自相似与变形同时存在。
failure_boundary: 若作品完全原创、与人类文化无可辨联系，镜面不成立；高度模仿也不能证明镜后社会真实相同。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 三体世界模仿人类创作的反射文化，让地球人通过异文明版本观察自身文化特征
vehicle: 镜面把观察者的形象从外部角度反射回来，使平时无法直看的自身轮廓显现
ground: 外部对象保留原型特征并重新呈现；主体通过差异化回返图像获得自我认知
