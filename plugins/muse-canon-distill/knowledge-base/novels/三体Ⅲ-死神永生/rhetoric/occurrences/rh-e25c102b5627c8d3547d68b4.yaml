quote: 一定比十部奥德赛史诗更曲折、诡异和壮丽
sensory_mapping: 云天明未说出的三世纪像十卷远航史诗叠起，异星岛屿、身体重塑和孤独漂流藏在平静脸后。
context_fact: 他曾以大脑飞出太阳系，被三体截获并重建，如今身处第一舰队，具体经历地球一无所知。
image_mechanism: 奥德赛提供流亡归望、异域遭遇和漫长考验的叙事骨架，十部数量夸张补足三世纪未知容量。
property_alignment: 云天明漂流对应奥德修斯远航；异世界经历对应怪岛奇遇；身心磨难对应史诗考验；三世纪对应十部篇幅。
context_alignment: 会面表面只是麦田闲谈，史诗藏而不露，正反衬云天明成熟到看不出故事的状态。
narrative_function: 在无法直接叙述三世纪经历时为其规模定标，并把读者期待转向他将讲述的童话编码。
transfer_rule: 人生比史诗更繁复时，应选择共享旅程结构的原型，并对应时长、异域、考验和未述容量。
failure_boundary: 十部是主观夸张，云天明经历未必具有英雄归乡结构；史诗框架不能填补缺失事实。
