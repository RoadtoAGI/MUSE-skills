tenor: 罗辑与三体世界在没有实际发射动作时持续进行的意志威慑和生死判断
vehicle: 两名剑客以内在利剑在静止对峙中猛烈相击，力量如没有声响的雷霆
ground: 外表完全静止无声而内部冲突强度极高；短暂意志动摇即可预先决定一方生死
