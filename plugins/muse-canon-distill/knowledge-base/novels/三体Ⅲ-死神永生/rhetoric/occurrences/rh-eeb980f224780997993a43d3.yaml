chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 在两剑客之间那寂静的空间里，灵魂之剑如无声的霹雳撞击搏杀
sensory_mapping: 目光拉成长剑刺入灵魂，寂静空气中爆开看不见的霹雳，手中实体剑尚未出鞘，胜负已在内层碰撞完成。
context_fact: 执剑人只需按动广播开关，却靠随时毁灭双方的可信意志与三体世界长期对峙。
image_mechanism: 灵魂之剑把威慑能力放入意志，无声霹雳把高能与零外显并置；两层矛盾准确表现威慑战争的隐形激烈。
property_alignment: 双方意志对应两剑客；可信毁灭决心对应心中利剑；长期沉默对应无声空间；瞬间广播决定对应霹雳一击；威慑结果对应未出剑先定生死。
context_alignment: 罗辑静坐不动却维持两个文明安全，传统剑道中凝固对视比挥剑更关键，吻合执剑人工作的真实重心。
narrative_function: 解释罗辑威慑度来自何处，并为程心接任后目光和意志不足形成评价尺度。
transfer_rule: 把威慑写成决斗时，应把武器、蓄势、交锋和致命阈值分别落到信息、意志、判断与行动，外静内烈必须同存。
failure_boundary: 若冲突靠持续公开攻击、双方看不见彼此决心，或失败不会立即致命，凝视中的无声剑决就不适配。
