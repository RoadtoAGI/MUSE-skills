figure_type: metaphor
quote: 聚集的孤独像黑色的狂飙自天而落，超出了他可以承受的极限
sensory_mapping: 孤独先蓄成坝后水体，溃决瞬间又升格为黑色风暴，从上空整片砸下，光线与呼吸同时被夺走。
context_fact: 程心信息使安乐程序中止，却未提供陪伴或治愈；云天明离院时只剩无法完成死亡的孤独。
image_mechanism: 堤坝负责解释多年静态忍耐，狂飙负责解释突然超载；两阶段框架把量的积累和形态的爆发连续起来。
property_alignment: 长期孤独对应坝后蓄积；原有忍耐对应堤坝拦截；程序中止对应坝溃；情绪压倒承受对应黑色狂飙覆落。
context_alignment: 获救通常应带来光明，此处却降下黑风，反写外部救命与内部绝望的背离。
narrative_function: 把情节上的生还转成心理最低点，推动他冲动飞往上海看程心。
transfer_rule: 爆发性情绪可用蓄积系统加灾害过程联写；前文必须有长期储量，触发事件须真实破坏原有控制结构。
failure_boundary: 孤独若刚产生、仍可忍受或被救援明显缓解，蓄坝与狂飙都过重；风暴也不能代替具体触发因果。
