tenor: 程心眼中能够启动黑暗森林广播的红色开关
vehicle: 被人惊惧排斥、携带毁灭诱惑并必须立即远离的魔鬼
ground: 外形可接近而后果邪恶；能诱使人实施毁灭；目击者本能退避并拒绝接触
