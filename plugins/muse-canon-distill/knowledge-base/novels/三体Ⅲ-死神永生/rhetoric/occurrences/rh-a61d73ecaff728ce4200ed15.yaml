chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: simile
quote: 像看一个魔鬼般看着它滑向远处
sensory_mapping: 小小开关滑过地面时获得恶魔的危险面孔，程心的视线像防备活物一样追着它退远。
context_fact: 水滴即将抵达发射台，程心在生命史幻象后惊叫并把开关扔掉。
image_mechanism: 魔鬼把装置的功能后果压到可凝视的敌对人格上，使她的伦理恐惧表现为身体性的抛掷与盯视。
property_alignment: 开关可触发毁灭对应魔鬼带来灾祸；按钮近在手边对应诱惑贴身；扔开并戒备对应驱逐危险存在。
context_alignment: 前文水滴也被程心称作光滑魔鬼，两边毁灭手段在她眼中都取得同一种邪恶面孔。
narrative_function: 用动作完成她的最终拒绝，并显示她已把战略工具理解成不可碰触的道德恶物。
transfer_rule: 器物人格化为恶性存在时，要让功能后果、人物态度和具体身体动作共同支撑命名。
failure_boundary: 开关没有意志也不会诱惑，魔鬼只呈现程心的伦理感受；不能据此判断广播选择客观邪恶。
