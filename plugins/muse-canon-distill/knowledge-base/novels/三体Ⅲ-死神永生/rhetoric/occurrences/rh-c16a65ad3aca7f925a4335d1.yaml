figure_type: analogy
quote: 在这场伟大的盛宴中。永远他妈的有一桌没人动过的菜
sensory_mapping: 宇宙像铺满长桌的盛宴，高等文明已尝过、改过许多菜，丁仪只盼角落还剩一桌原封不动。
context_fact: 他怀疑智子之外的宇宙规律也可能被高等文明制造假象，却靠这一想法维持研究信念。
image_mechanism: 盛宴把物理规律转成可被文明接触和改变的菜肴，没人动过成为科学实在性的通俗判据。
property_alignment: 宇宙规律对应菜品；高等文明对应先到宾客；篡改对应动菜；未污染规律对应 untouched 桌；科学家对应后来取食者。
context_alignment: 下一段处女纯真比喻与无人动过的菜共享未被接触框架，丁仪的粗鄙语言暴露其绝望。
narrative_function: 把深层认识论危机压成可重复咒语，并为噩梦中没有未动宴席的结论设置核心符号。
transfer_rule: 知识真实性借宴席表达时，应明确资源、先到者、介入痕迹、未动部分和说话者为何需要相信。
failure_boundary: 规律不是会被消费的有限菜肴，文明影响也未必覆盖宇宙；丁仪明确将其作为自我安慰。
