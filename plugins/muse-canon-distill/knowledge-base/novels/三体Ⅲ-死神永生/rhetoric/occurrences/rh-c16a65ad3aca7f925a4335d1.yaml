tenor: 丁仪自我安慰宇宙中总存在一部分未被文明改造或伪造、仍可供物理学发现的真实规律
vehicle: 一场宾客众多的巨大宴席虽大部分菜已被取食，总会留有一桌无人碰过、保持原样的菜
