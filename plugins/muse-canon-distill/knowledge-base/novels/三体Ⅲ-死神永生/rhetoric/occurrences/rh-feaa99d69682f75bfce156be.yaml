chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 火树像太阳伸出的魔爪，一次次拉低行星
sensory_mapping: 白炽火树扭成太阳长爪，行星每绕行一次便被爪尖勾住，向恒星表面拖下一截。
context_fact: 行星穿越喷出带会减速降轨，约十次后将坠入太阳，但恒星先发生坍缩爆发。
image_mechanism: 魔爪把无形阻力转成有方向的抓拉，轨道逐次下降因而成为猎物被一点点拖回身体。
property_alignment: 喷出带对应伸爪；阻力接触对应抓住；速度降低对应拉扯；坠向太阳对应猎物被拖回。
context_alignment: 前段火树本具树枝形态，转为爪后从壮观景物变成主动施害者，贴合行星反复受捕的动力学。
narrative_function: 以重复抓捕解释轨道衰减，并把三恒星争夺行星的旧命运推向结局。
transfer_rule: 持续外力如抓拉时，应明确施力主体、伸出结构、接触频率、每次位移和最终归向。
failure_boundary: 太阳没有意志或手爪，喷出带只靠物质阻力；行星最终也未按该路径被十次拖入。
quality_assessment: exemplary
