review_status: reviewed
tenor: 恒星喷出物质带反复阻滞三体行星，使其减速并降低轨道
vehicle: 巨兽从身体伸出带爪手臂，反复抓住逃离目标并把它向自己拖近
ground: 作用从恒星向外延伸；每次接触都施加阻力；目标轨道逐步靠近施力者；重复后将被吞没
