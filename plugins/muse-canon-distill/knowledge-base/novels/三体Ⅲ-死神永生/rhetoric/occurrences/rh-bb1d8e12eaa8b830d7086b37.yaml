chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 人体冬眠——人类在时间上的首次直立行走
sensory_mapping: 时间从不可穿越的背景变成地面，人类借冬眠从原地爬起，以直立步态跨向数世纪后的未来。
context_fact: 冬眠原被当作医疗或远航工具，社会学视角显示它会重组代际公平、逃亡和永生机会。
image_mechanism: 直立行走借生物进化里程碑标定技术跃迁，不只强调走得远，还强调行动主体和社会结构随之改变。
property_alignment: 自然寿命限制对应旧爬行；冬眠跨世纪对应新步态；未来可达对应移动范围扩大；文明重组对应直立后的能力跃迁。
context_alignment: 本章讨论的是技术造成的社会形态变化，进化步态比单纯交通工具更能覆盖文明层面的后果。
narrative_function: 以标题确立冬眠的历史尺度，引导读者从医疗装置转向时间迁徙与阶层政治。
transfer_rule: 把技术写成新步态时，应证明它改变可达空间、行动主体和社会组织，不只提高原有指标。
failure_boundary: 若技术只服务少数短期治疗、未扩大时间可达范围，直立行走会过度抬高历史意义。
