chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 充满阳光的成熟，像他身后金黄的麦子
sensory_mapping: 云天明晒黑的脸和银衣前浮着金色光，成熟像身后麦浪一样饱满，穗粒把经历收进内部。
context_fact: 他外貌仍年轻却比病时健康，三世纪磨难不留沧桑，只显出阳光般成熟，身后正是待收麦田。
image_mechanism: 麦子由现场背景直接转成人格生长模型，金黄和待收状态说明成熟的结果可见，过程则藏在穗粒内部。
property_alignment: 云天明成长对应麦苗成熟；健康气色对应金黄；经历沉淀对应籽粒充实；无伤痕对应完整麦穗；温暖气质对应阳光。
context_alignment: 异星麦田可能专为会面布置，云天明与麦子共享成熟，使环境像他主动选择的自我说明。
narrative_function: 以明亮田园图像结束外貌观察，取代病弱大学生旧形象并预示丰厚信息将被收获。
transfer_rule: 成熟人格如作物时，应匹配生长阶段、颜色、内在果实、环境光和经历如何被收进而非留伤。
failure_boundary: 人物成熟无法像作物按季测量，也不等于可被他人收割；麦子只描述程心感知到的气质。
quality_assessment: exemplary
