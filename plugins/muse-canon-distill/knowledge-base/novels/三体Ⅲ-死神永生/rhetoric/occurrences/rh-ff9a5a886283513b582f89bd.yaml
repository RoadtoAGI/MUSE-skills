tenor: 云天明历经巨大未知磨难后呈现的健康、平静、温暖且已经充分成长的成熟气质
vehicle: 阳光下成熟的金黄麦穗，经历生长后籽粒充实，颜色温暖，已到收获阶段
ground: 成长过程已经完成；外观健康饱满；色调明亮温暖；经历风雨而不显伤痕；具有内在成果
