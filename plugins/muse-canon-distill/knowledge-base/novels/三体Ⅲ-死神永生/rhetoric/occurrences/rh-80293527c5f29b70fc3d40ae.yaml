tenor: 低光速时间跳跃后夜空中被恒星运动拉成长短不一的细亮线
vehicle: 几缕细长银白头发随意落在吸光、柔暗的黑色天鹅绒表面
ground: 细长形态；银白闪光；背景深黑；数量稀疏；方向散乱；明暗反差强
