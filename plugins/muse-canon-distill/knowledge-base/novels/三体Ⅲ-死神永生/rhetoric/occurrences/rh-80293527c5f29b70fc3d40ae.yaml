chapter: 【时间开始后约170亿年，我们的星星】
figure_type: simile
quote: 有几根较长的，像散落在黑天鹅绒上的银发
sensory_mapping: 黑夜像无反光的绒面，几条星轨在上面松散铺开，细得像银发又亮得能被一眼挑出。
context_fact: 蓝星夜空恒星因千万年运动和观测条件呈线状，二人在等待地下遥感结果。
image_mechanism: 银发确定线条的纤细与冷亮，黑天鹅绒同时提供颜色、质感和吸光背景，组成静物式星空。
property_alignment: 星线对应发丝；星光银白对应银发；黑夜对应天鹅绒；轨迹散乱对应发丝散落；稀疏数量对应几缕。
context_alignment: 时间制造的宇宙异常被压成安静纤细的近景，与二人依偎等待的静夜节奏一致。
narrative_function: 在石刻消息显现前营造跨千万年的寂静，并持续提示天空已非旧天空。
transfer_rule: 细亮线置于暗背景时，喻体应同时承担线宽、光泽、铺陈方式和底材吸光性。
failure_boundary: 星轨是发光天体的运动影像，不具头发的实体柔软或绒面的可触质地。
