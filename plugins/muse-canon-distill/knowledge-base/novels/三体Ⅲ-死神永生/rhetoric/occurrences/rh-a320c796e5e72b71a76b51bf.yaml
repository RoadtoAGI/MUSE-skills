chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 仿佛是一片寂静的金属坟墓，埋葬着人类的光荣与梦想
sensory_mapping: 空城和战舰像一座座金属棺椁散在黑暗轨道上，舷窗熄灭，昔日舰队荣光封在冷壳内。
context_fact: 太空移民已返回地球或火星，太阳系空间只剩空荡城市和战舰。
image_mechanism: 墓地不把设施写成废料，而把它们保留为文明死去阶段的遗体和纪念物，光荣与梦想因而获得埋葬位置。
property_alignment: 空战舰对应棺椁；熄灭人类活动对应死亡；散布轨道对应墓群；旧舰队成就对应随葬记忆。
context_alignment: 这些船曾代表末日战役后的复兴，此刻被主动弃置，比被摧毁更显人类退出太空的时代死亡。
narrative_function: 为太阳系去人类化提供全景墓志，结束威慑纪元的太空梦想。
transfer_rule: 遗弃设施群写成墓地时，应区分遗体载体、死去的活动和被保存的历史意义。
failure_boundary: 设施没有报废，未来仍可能再利用；墓地表达当下无人和梦想中断，不保证永久死亡。
