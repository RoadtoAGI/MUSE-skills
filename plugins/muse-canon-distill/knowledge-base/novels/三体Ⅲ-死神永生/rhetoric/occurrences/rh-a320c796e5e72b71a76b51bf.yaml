tenor: 人员撤空后仍漂浮在各轨道上的太空城和恒星战舰群
vehicle: 由金属墓碑与棺椁组成、寂静安放死者及其往事的巨大墓地
ground: 结构实体保留而生命活动消失；遗物标记曾有辉煌；空间安静荒凉且无人返回
