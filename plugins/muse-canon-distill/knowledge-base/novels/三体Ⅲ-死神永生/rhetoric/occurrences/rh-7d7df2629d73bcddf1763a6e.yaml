chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 画面像一扇通向另一个世界的窗口，针眼就在窗的另一边望着这个世界
sensory_mapping: 墙上窗口；纸面深处；窗后人影；跨界目光；翘起纸角
context_fact: 针眼无法画深水王子后画下自己并从现实消失，只留下颜料未干、纸角翘起的自画像。
image_mechanism: 平面颜料向后打开深度，画框变成世界边界；针眼不是被描摹在纸上，而像退到窗后继续盯人，只有翘起纸角不断提醒长帆那仍是一张纸。
property_alignment: 画框对应窗框；雪浪纸对应窗面；画中世界对应窗后房间；针眼画像对应窗后本人；犀利目光对应隔窗注视；现实消失对应穿窗迁移；纸角对应物质边界证据
context_alignment: 童话规则确实允许人物被画入另一空间，窗口因此既是视觉比喻，也是针眼逃生机制的近乎字面显现。
narrative_function: 把画像的逼真与维度转移合并，呈现画师逃离后的诡异余威。
transfer_rule: 用窗口写画面时，应对应边框、表面界面、后方空间、双向目光和现实层留下的平面证据。
failure_boundary: 画面刻意扁平抽象、人物无注视关系，或作品只记录过去而不形成另一空间时，通窗感会过度实体化。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 针眼的自画像逼真到让长帆感到画中人已进入二维画面空间并从那里反看现实
vehicle: 墙上开出的窗口连接两个真实空间，窗后的人能隔着透明界面注视窗前世界
ground: 画框对应窗框；画纸表面对应透明窗面；二维画中空间对应窗后世界；针眼肖像对应另一边真人；观看画像对应隔窗对视
