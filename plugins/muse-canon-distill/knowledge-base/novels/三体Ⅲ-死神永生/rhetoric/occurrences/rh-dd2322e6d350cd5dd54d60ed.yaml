chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 天文学从此摘除了白内障
sensory_mapping: 学科病眼；白障摘除；恒星成圆；视野复明；远天清晰
context_fact: 过去任何望远镜只能增强恒星亮度，无法分辨形状，新透镜组首次看到恒星圆盘。
image_mechanism: 整个学科被赋予一只长期混浊的眼，新设备不是简单放大而是外科式清障；恒星由点变面成为复明的直接证据。
property_alignment: 天文学对应眼睛；旧分辨率对应视力障碍；恒星无形对应模糊；巨镜对应手术器械；圆盘图像对应清晰轮廓；技术突破对应摘障；天文学家激动对应患者复明
context_alignment: 威纳尔把望远镜当科学仪器而瓦西里把它当哨兵眼睛，白内障隐喻先强化“看清”的学术价值，也为两种用途争执立场。
narrative_function: 以身体康复概括划时代分辨率提升，让技术指标获得直观历史意义。
transfer_rule: 用摘白内障写观测突破时，应有此前长期模糊、同一对象由点或雾变清晰，以及新工具实质提升分辨而非只增亮。
failure_boundary: 旧系统本已看清形状、新设备只扩大视场，或误差来自数据解释而非成像模糊时，白内障诊断会失准。
quality_assessment: exemplary
