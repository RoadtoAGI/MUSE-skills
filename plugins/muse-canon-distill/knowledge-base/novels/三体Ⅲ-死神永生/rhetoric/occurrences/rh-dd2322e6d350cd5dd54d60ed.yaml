review_status: reviewed
tenor: 两千米口径超级望远镜第一次把四十七光年外恒星从无形状光点分辨为可见圆盘，使可见光天文学获得新视力
vehicle: 患白内障的眼睛经手术摘除混浊晶状体，模糊视野恢复清晰，终于看见物体形状
ground: 旧天文学对应病眼；分辨率限制对应白内障；超级望远镜对应手术；恒星光点对应模糊影；圆盘显现对应复明；观测史跨越对应摘除完成
