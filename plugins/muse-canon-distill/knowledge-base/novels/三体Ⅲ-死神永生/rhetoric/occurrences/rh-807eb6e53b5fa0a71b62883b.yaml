chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 这一群人像是古代的工厂车间在开班前会
sensory_mapping: 委员们的连体服变成工装，裸露金属墙成为车间，三十多人像等着汽笛开班的工人。
context_fact: 智子屏蔽要求带电密室、禁止电子设备并减少家具，会议只能在狭窄空间举行。
image_mechanism: 服装和场地的时代错位把世界级决策机构降格成基层班组，抽掉未来社会的精致外观。
property_alignment: 高压服对应工装；金属屏蔽室对应车间；无会议桌对应班前简会；委员群体对应工班。
context_alignment: 人类刚摆脱无处不在的智子监视，最先进保密能力却产生最古旧的会议景象。
narrative_function: 用反差快速交代屏蔽技术代价，也让随后的童话解读具有朴素、秘密作业的氛围。
transfer_rule: 机构场景比作工作现场时，应由服装、空间材质、家具布局和聚集姿态共同支撑。
failure_boundary: 委员并非工人，会议内容也不是生产排班；喻体只描述可见场景与组织姿态。
