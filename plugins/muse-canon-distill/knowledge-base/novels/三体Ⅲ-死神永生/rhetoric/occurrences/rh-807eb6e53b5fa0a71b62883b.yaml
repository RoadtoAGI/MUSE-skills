tenor: 穿高压工作服挤坐在简陋金属屏蔽室中的最高级情报委员会成员
vehicle: 旧式工厂里身着劳保服、在开工前围坐听安排的一班车间工人
ground: 服装偏劳动防护；房间金属而简陋；人员拥挤围坐；会议陈设缺少体面与科技设备
