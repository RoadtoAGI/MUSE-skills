chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 行星际飞船与恒星际飞船的差别，就像内河渡船与大洋上的万吨巨轮的差别一样
sensory_mapping: 小河渡船；万吨巨轮；岸边短渡；无边大洋；厚重远航装备
context_fact: AA说明新‘星环’号即使到木星也能维持程心一生，而穿梭机只承担短途入轨。
image_mechanism: 宇宙距离被换成水域尺度，行星间航行只是随时看得见岸的短渡，恒星际航程则离岸进入大洋；决定差异的是自持与抗险而非船体大小。
property_alignment: 行星际航程对应内河；恒星际空间对应大洋；短程飞船对应渡船；星际飞船对应万吨轮；外部补给对应靠岸；生态循环对应船上储供；系统冗余对应远洋备份；深空故障对应风暴
context_alignment: 前文大量航海童话已建立船型差异语言，此处用真实航海等级解释未来飞船的生存设计。
narrative_function: 说明‘星环’号为何是可靠终身避难所，并区分体积与航程适配。
transfer_rule: 用渡船和巨轮比较航天器时，应对应航程尺度、离岸程度、自持系统、风险冗余和补给可得性。
failure_boundary: 若行星际船同样具长期生态冗余，或恒星际航程有密集补给站，水域等级差会被削弱。
