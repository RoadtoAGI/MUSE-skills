tenor: 恒星际飞船相较行星际飞船具备更强推进、封闭生态和多重冗余，可在长期远航中独立生存
vehicle: 万吨远洋巨轮可穿越大洋、长期自持并抵御风浪，内河渡船只适合短途平静水域和岸边补给
ground: 行星际飞船对应内河渡船；恒星际飞船对应远洋巨轮；星际距离对应大洋；行星间短航对应内河；生态循环对应远洋补给；冗余系统对应抗风浪装备
