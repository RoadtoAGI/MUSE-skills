chapter: 【时间之外，我们的宇宙】
figure_type: simile
quote: 它们滚滚而过，像波纹凌乱的湍急河面
sensory_mapping: 各文明符号挤成一整面急流，笔画像碎波互相覆盖，眼睛刚抓住一行就被下一股冲走。
context_fact: 广播以不同语言重复同一简短信息，语言数量从几万迅速增到上百万。
image_mechanism: 河面把离散字符聚成连续动态场，滚动方向对应水流，字形差异对应交错波纹，速度解释不可阅读。
property_alignment: 符号滚动对应河水奔流；异质字形对应凌乱波纹；高密度对应满河水量；一闪而过对应水波消逝；窗口对应可见河段。
context_alignment: 前文资料浩如烟海是静态信息规模，此处字符成湍河，水域意象由存量切换为紧急广播的速度。
narrative_function: 先以无法辨认的洪流制造宇宙级规模，再让地球与三体文字从流中被辨出。
transfer_rule: 滚动信息比作河流时，应分别对齐流向、速度、密度、表面纹理和读者抓取失败。
failure_boundary: 字符按程序整齐刷新并携带离散语言，未真正随机碰撞；湍流只描述视觉拥挤。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 超膜广播中数十万种异质文明文字在终端窗口高速连续滚动的视觉画面
vehicle: 水量巨大、流速很快且表面波纹彼此冲撞杂乱的急河
ground: 整体单向滚动；速度快；内容密集；局部纹样凌乱；难以凝视辨认；前后不断涌来；形成流面
