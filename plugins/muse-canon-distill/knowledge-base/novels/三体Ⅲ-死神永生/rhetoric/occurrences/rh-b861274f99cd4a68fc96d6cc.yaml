chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 智子转身一挥手，像赶走一只蚊子般挡开了石头
sensory_mapping: 石块的重量被缩成耳边飞虫，智子只用一记随意挥手便把攻击从身边掸走。
context_fact: AA从地上抱石砸向智子后脑，智子转身单手挡开，随即拔刀反制。
image_mechanism: 蚊子把攻击者和武器一同缩小，在同一个挥手动作里呈现机器人与普通人的力量差。
property_alignment: 石头攻击对应蚊虫骚扰；一挥手挡开对应赶蚊；智子不受损对应威胁微弱；动作轻慢对应蔑视。
context_alignment: 智子作为强技术造物面对AA，日常驱虫动作比正面格斗更能显示双方根本不在一个力量层级。
narrative_function: 瞬间取消AA的反抗效力，并为下一步武士刀展示建立绝对控制。
transfer_rule: 表现力量悬殊时，让强者以处理微小烦扰的同构动作回应攻击，动作必须真实可比。
failure_boundary: 石头客观上远重于蚊子，类比只写智子的主观难度；若她需躲闪或受伤，随手赶蚊就会失准。
