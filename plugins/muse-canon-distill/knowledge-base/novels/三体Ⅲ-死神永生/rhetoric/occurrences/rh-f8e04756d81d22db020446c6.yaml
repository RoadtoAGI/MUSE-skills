chapter: 【危机纪元元年，生命选项】
figure_type: metaphor
quote: 生命只是地球表面一层薄薄的、软软的、稀稀拉拉的、脆弱的东西
sensory_mapping: 生物圈被压成行星皮肤上的柔软薄膜，森林、动物和细菌成为稀疏附着点。
context_fact: 绿眼镜正反驳杨冬低估生命塑造地球的力量，并准备引入十亿年时间尺度。
image_mechanism: 薄层精确复现直觉中的尺度劣势，随后蚂蚁搬山类比将从时间维度翻转这种脆弱判断。
property_alignment: 生物圈厚度对应薄层；生命分布不均对应稀稀拉拉；个体组织柔弱对应软材料；短期易毁对应脆弱表皮。
context_alignment: 该喻体由对手先替杨冬概括直觉，功能是建立将被时间力量反驳的认知模型。
narrative_function: 把错误直觉完整显形，使后续反论不只是给结论，而是改造一个可见模型。
transfer_rule: 论证前复述直觉模型时，应保留它真正有根据的尺度属性，再指出遗漏变量；喻体可局部正确而整体推论错误。
failure_boundary: 它只描述空间厚度与材料强度，不能推出长期地质影响小；若用作最终结论，就忽略时间累积。
