chapter: 【银河纪元409年，我们的星星】
figure_type: analogy
quote: 就像你在地面上做一个倒立，就认为自己举起了地球一样
sensory_mapping: 程心把一次决定撑在记忆里，仿佛倒立者手掌贴地就相信六十万亿亿吨地球全压在自己手上。
context_fact: AA列举星环城战争、政府态度和黑域意愿等多重不确定因素，试图削弱程心的全责判断。
image_mechanism: 倒立利用身体姿态制造“我在下、地球在上”的视觉真相，再以尺度荒谬揭穿自我中心因果。
property_alignment: 程心决定对应手撑地；太阳系历史对应地球；责任感对应托举感；因果视角对应倒置视角；力量悬殊对应个体不可能举球。
context_alignment: 她曾处于仅次上帝的位置，AA用最日常的倒立动作把这种神级自我归因拉回普通人尺度。
narrative_function: 给AA的安慰提供尖锐、可记的核心论证，呈现另一种对程心责任的合理解释。
transfer_rule: 反驳过度归因时，可选择一个接触真实但总体控制虚假的动作，并量出主体与系统尺度差。
failure_boundary: 程心的决定确有重大影响，并非毫无因果；倒立类比只反驳“她单独毁灭一切”的绝对结论。
