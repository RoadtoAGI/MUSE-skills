figure_type: metaphor
quote: 水滴死了
sensory_mapping: 镜面精灵的光熄灭，黄铜外壳像尸体留下，航向和减速都由隐形穿梭机替它完成。
context_fact: 影像显示水滴表面变暗锈蚀、力场消失，蓝色空间号人员在外部捕获研究它。
image_mechanism: 死亡将复杂技术失效压成从活物到尸体的瞬变，同时承接人类此前赋予水滴的神性和灵气。
property_alignment: 推进停止对应生命活动停息；镜面失光对应神采消失；外壳保留对应尸体；被拖行对应无自主。
context_alignment: 水滴曾像死神绣花针主动猎杀舰队，此刻一句死亡把力量等级和主客位置彻底翻转。
narrative_function: 给超自然现象作最简明结论，并触发舰长对广播系统被劫持的立即反应。
transfer_rule: 机器死亡应由动力、控制、外观和自主性至少两项同时失效支撑。
failure_boundary: 水滴本来无生命，部分结构可能仍完好；死亡不说明具体故障机制或不可修复性。
