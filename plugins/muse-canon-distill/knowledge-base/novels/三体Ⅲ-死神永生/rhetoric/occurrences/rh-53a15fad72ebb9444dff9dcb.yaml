chapter: 【掩体纪元11年，星环城】
figure_type: simile
quote: 整个人类文明史像是一场大梦
sensory_mapping: 大梦醒转；城市梦影；森林现实；世纪恍惚；遗迹残片
context_fact: 地球人口锐减，森林藤蔓覆盖大部分城市，程心和AA在无人大陆漫游并凭遗迹寻找过去。
image_mechanism: 曾被城市和制度占满的世界在自然复归后像醒来时的房间一样空，文明的规模与持续时间反而因消失过快而呈现梦的虚幻。
property_alignment: 文明史对应梦程；城市繁荣对应梦中世界；自然覆盖对应醒来擦除；遗址对应梦的残忆；程心长期冬眠对应反复睡醒；历史断裂对应梦境跳切；当下稀疏人口对应醒后空房
context_alignment: 程心实际通过冬眠跨越时代，她每次醒来都面对被改写的世界，因此“大梦”既是历史评价也是她独特时间经验。
narrative_function: 把文明退潮带来的失真感凝成一句总括，为她再次选择冬眠提供情绪逻辑。
transfer_rule: 用大梦概括历史时，应让曾经完整的秩序在人物醒转式断裂后消失，并保留少量遗迹或记忆造成真伪恍惚。
failure_boundary: 社会连续稳定、人物亲历过程没有时间断层，或过去仍以制度和人口完整延续时，大梦会空泛抹平历史因果。
quality_assessment: effective
