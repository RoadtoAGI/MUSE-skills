review_status: reviewed
tenor: 程心在重新野化、人口退回新石器时代规模的地球上回望人类城市文明的漫长兴盛与消退
vehicle: 一场内容宏大、经历真实感强烈的长梦，醒后景象迅速退去，只留下难以确信的记忆
ground: 文明兴衰对应梦境展开；城市消失对应梦醒景散；历史漫长对应大梦绵延；当下荒野对应醒后现实；遗迹对应残余梦影；程心跨时代体验对应梦者
