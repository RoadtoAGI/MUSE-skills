chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 最后一句话像一声闪雷，把程心从残留的睡意中震醒
sensory_mapping: “云天明来过”在舱内像雷声炸开，程心残余睡意被整个震散，关一帆也僵在原地。
context_fact: 程心刚从灰星返回蓝星，自认约会是泡影；AA却收到云天明留给她的信息。
image_mechanism: 闪雷把情节反转的突发性、音量感和唤醒功能合一，心理死亡状态也被短暂震活。
property_alignment: AA话语对应雷声；秘密揭示对应闪电；睡意对应睡梦；震惊对应震动；程心清醒对应雷惊醒。
context_alignment: 罗辑的话曾像闪电照亮黑思绪，云天明消息再以雷电出现；两位缺席者都用电光重新给她方向。
narrative_function: 在一句内完成希望复燃与段落转折，把程心从麻木重新拉回约会线。
transfer_rule: 消息比作惊雷时，应有此前静态、突发内容、身体反应、意识改变和后续行动方向。
failure_boundary: 舱内没有真实雷声，AA可能平静说话；强度来自信息意义而非声压。
