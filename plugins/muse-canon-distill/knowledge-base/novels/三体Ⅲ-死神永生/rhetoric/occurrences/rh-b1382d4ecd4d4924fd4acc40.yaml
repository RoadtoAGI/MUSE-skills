chapter: 地球文明
figure_type: simile
quote: 像正在逼近的死神
sensory_mapping: 昏黄灯下那一点微笑不动声色地靠近，像黑袍死神已经走进文明墓室。
context_fact: 二维打击正在太阳系展开，程心、AA和罗辑都知道人类末日已到，墓室本身是人类墓碑。
image_mechanism: 把静止画中微笑赋予逼近运动，观者所处的死亡倒计时渗入画面，使九百年谜意变成末日凝视。
property_alignment: 难解微笑对应死神神秘面容；若隐若现对应幽灵现身；包容一切对应死亡普遍性；墓室环境对应来临地点。
context_alignment: 画作曾跨越九世纪，如今在文明终点见证所有观看者死亡，艺术的长寿与人的必死在同一微笑中相撞。
narrative_function: 封住博物馆段落，并把下一章二维太阳系从物理灾难转成已走到门前的死亡主体。
transfer_rule: 静态表情比作逼近者时，应由场景倒计时提供运动感，并让表情属性与来者功能逐项对应。
failure_boundary: 微笑没有恶意或移动，蒙娜丽莎也不是死亡预兆；死神感完全来自墓室与末日语境。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 冥王星墓室中《蒙娜丽莎》若隐若现、包容一切又一无所有的神秘微笑
vehicle: 无声接近、无法阻止、对一切生命作最终收割的死神
ground: 安静无声；难以解读；不可逃避；接近所有人；兼具超然与威胁；终结在即
