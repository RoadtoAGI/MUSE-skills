quote: 他们为了共同的理想奋斗了六十多年，现在已经走到人生的尽头
sensory_mapping: 人生长路；老者同行；六十年脚程；终点将至；理想在前
context_fact: 维德一百一十岁且从未冬眠，毕云峰也已年老，两人为曲率驱动事业工作六十多年。
image_mechanism: 六十年被拉成一条可丈量的路，身体衰老显示剩余路段越来越短；“共同理想”既是行走方向，也是二人尚未抵达的目的地。
property_alignment: 生命时间对应道路长度；维德与毕云峰对应旅人；共同事业对应同路；长期奋斗对应跋涉；年老对应临近终点；死亡对应道路尽头；光速飞船对应远方目的地
context_alignment: 程心生理年龄仍只有三十三岁，与两位老者的长途人生相对；路径意象强化她拥有更多时间却掌握最终决定权的反差。
narrative_function: 压缩两人的终身投入，增加程心随后叫停项目的时间与伦理重量。
transfer_rule: 用道路尽头写生命晚期时，应呈现可追溯的长期方向、行动积累、身体或时间余量减少，以及尚完成或未完成的目的。
failure_boundary: 人物仍处壮年、只是某项工作结束，或一生没有持续方向时，人生尽头会把阶段终点误作死亡临界。
