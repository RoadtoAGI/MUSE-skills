figure_type: simile
quote: 血像一条细细的黑蛇蜿蜒爬过
sensory_mapping: 流血路径获得蛇身曲线，液面前缘获得爬行动作；惨白月光把红血压成黑色剪影。
context_fact: 狄奥伦娜被剑钉死后塔内全黑，只有一小块月光照见地面血迹。
image_mechanism: 静默死亡没有叫喊，唯一运动转移到血蛇；液体前缘一点点进入光斑，像死者最后逸出的活物。
property_alignment: 细血流对应蛇的细长身体；弯曲流路对应蛇行；缓慢向前蔓延对应爬行；逆光暗色对应黑蛇。
context_alignment: 狄奥伦娜始终无声，微小爬行动作在黑暗中格外可见，延长了刺杀后的恐怖余波。
narrative_function: 把静止尸体旁的流血变成最后动态焦点，以冷静微观画面收束杀戮。
transfer_rule: 液体喻体应由真实流路和前缘速度决定；曲折、窄流、暗色齐备时，爬行动物能让运动方向显形。
failure_boundary: 血若喷溅、成片漫开或在强光下鲜红，蛇的连续身形、缓速与黑色均不成立。
