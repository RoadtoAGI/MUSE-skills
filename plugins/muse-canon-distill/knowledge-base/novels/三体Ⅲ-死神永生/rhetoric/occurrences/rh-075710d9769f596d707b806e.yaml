chapter: 【时间之外，我们的宇宙】
figure_type: analogy
quote: 即使时间仅有二维，也将呈平面状而不是直线状，有无数个方向，那就意味着我们可以同时做出无数个选择
sensory_mapping: 一维时间像窄轨只能向前，二维时间铺成广场，每个方向都能延伸一条选择，彼此不必抹去。
context_fact: 智子说新宇宙可能有多个时间维度，关一帆尝试向程心解释其生存优势。
image_mechanism: 线—面升维把不可想象的多时间转成身体导航，方向数目的变化直接推导选择数目的变化。
property_alignment: 一维时间对应直线；单一历史对应唯一前路；二维时间对应平面；多种结果对应多方向；同时选择对应路径并存。
context_alignment: 程心一生被不可逆选择困住，多维时间在她面前首先被解释为能同时选择，精准回应其遗憾。
narrative_function: 让高维新宇宙具有情感诱惑，也为二人等待重生提供直观希望。
transfer_rule: 抽象维度借道路说明时，应从自由度数量推到方向、路径、选择与结果，保持机制链完整。
failure_boundary: 物理时间维度不必允许意识复制或同时实现所有人生选择，关一帆的解释是直觉推演。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 拥有两个时间维度时，事件演化不再只有单一前后路径，而可沿多方向并行实现不同选择
vehicle: 行路者从只能前后移动的一条直线进入平面，可向任意角度同时分出道路
ground: 维度增加；可行方向由两个变为连续无数；起点相同；路径可分叉；多个终点并存；选择不必互相排除；几何位置表示事件状态
