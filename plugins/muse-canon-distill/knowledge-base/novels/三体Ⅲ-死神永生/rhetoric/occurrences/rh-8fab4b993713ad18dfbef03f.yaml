quote: 笔者不想写细节，只提供一个历史或往事的大框架
sensory_mapping: 抽象叙事层级被空间化为可见骨架，缺失细节成为框架之间尚空着的格位。
context_fact: 叙述者记忆不足，只打算保留往事轮廓，并希望后来者把丰富信息填充进来。
image_mechanism: 框架把写作改造成先立骨架、后填空格的建造过程；下一句填充沿同一空间结构运作，因此此处是框架首建。
property_alignment: 历史事件间的总体关系对应建筑承重骨架；暂缺的具体记忆对应框架内空位；未来补全资料对应向空位填入材料。
context_alignment: 序言主动声明材料残缺，建筑框架既承认空白，又保证有限记忆仍能组织后来资料。
narrative_function: 交代文本取舍并建立全书的容器结构，使不完整性成为可继续补建的形式。
transfer_rule: 用建筑结构说明叙事层级时，要先确定哪些关系承担骨架功能，再让后续材料有可定位空位；首处建框，后文续用。
failure_boundary: 若文章只是压缩篇幅而没有预留补全关系，框架会夸大结构性；若后续资料将推翻骨架，建筑稳定性也不适用。
