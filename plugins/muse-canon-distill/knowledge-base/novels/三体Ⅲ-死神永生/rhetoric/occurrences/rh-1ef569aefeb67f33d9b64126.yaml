chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 姿态很奇怪，像一个不懂透视原理的孩童笨拙地画出来的
sensory_mapping: 两具身体仍扣在一起，却把原本前后相抱的肢体全摊在纸面，像孩子把每只手脚都硬画出来。
context_fact: 二维投射要求没有重叠，三维中互相遮挡的身体部分必须在平面并排展开。
image_mechanism: 儿童画用“画错透视”解释物理上正确却违背视觉经验的投影结果，把陌生几何转换成常见笨拙图像。
property_alignment: 不重叠投影对应不懂遮挡；器官并排对应部件全画；奇怪姿态对应透视错误；仍可辨拥抱对应主题关系保留。
context_alignment: 文明末日把成人生命压成儿童画，而石刻墓室也让高度文明退回婴儿时代，退化意象相互呼应。
narrative_function: 解释二维人体为何既准确又怪异，并在死亡画面中保留情侣最后的拥抱关系。
transfer_rule: 异常投影比作儿童画时，应指出具体违反了哪些透视或遮挡规则，以及哪些语义关系仍可辨。
failure_boundary: 二维图形由原子级规则精确生成，并非技术笨拙；孩童只形容三维观察者的视觉判断。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 一对情侣拥抱跌落后，并排展开、仍可辨拥抱却不符合三维视觉习惯的二维人体图形
vehicle: 不懂透视的孩子试图画拥抱人物，保留部件与关系，却把空间姿态笨拙摊平
ground: 形体可辨；三维遮挡消失；部件并列；比例姿态怪异；缺乏透视深度；画面带朴拙感
