chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 前方的蓝色星团和后方的红色星团都在渐渐散开，像两团绽放的焰火一般
sensory_mapping: 前方蓝核和后方红核同时松开，星点从两个中心四散，像两朵反向绽放的宇宙焰火。
context_fact: 飞船旋转一百八十度减速，多普勒蓝红色逐渐消退，星空恢复正常分布。
image_mechanism: 焰火以逆向展开解释像差消退，既承接此前毁灭焰火意象，也把到站还原星空写成庆典式开放。
property_alignment: 聚集星团对应焰火核；星点散开对应火星飞射；蓝红色对应焰色；减速过程对应绽放时程；满天星海对应焰火覆盖。
context_alignment: 启示号二维化曾以焰火终结生命，此处星空以焰火展开迎接新星系，同形意象从死亡转为抵达。
narrative_function: 可视化减速与参照系恢复，完成太阳系离场并开启DX3906的新空间。
transfer_rule: 聚集点场散开比作焰火时，应明确中心、径向扩展、色彩变化、时间和散开后的新秩序。
failure_boundary: 恒星没有爆炸或移动，光点变化来自飞船减速；焰火只描述视野中的反向展开。
