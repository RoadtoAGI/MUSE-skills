tenor: 关一帆在飞船内部产生的强烈幽闭恐惧和身体空间被压缩感
vehicle: 身体先被硬塞进狭细管道，又夹在两块无限铁板之间持续压成薄片
ground: 可活动维度受到极端限制；边界贴身逼近并施加无法逃脱的压迫
