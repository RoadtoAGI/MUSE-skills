chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 像被塞到一根细管子里，有时又觉得被两片无限大的铁片压在中间，压扁了
sensory_mapping: 球形舱在感知中先收成细管，再展开成上下两面铁板；身体的体积与厚度依次被挤掉。
context_fact: 他长期住在纵横管线中的小观测舱，经历四维广阔空间后回到三维飞船，开始严重恐惧封闭。
image_mechanism: 细管限制横向活动，铁片进一步取消厚度，两幅图像连续减少自由维度，正好外化他对三维空间突然嫌窄的感受。
property_alignment: 舱室狭窄对应细管内径；无法离开对应被塞入；空间边界逼近对应铁片夹压；维度降低感对应身体压扁。
context_alignment: 真实诱因是接触四维后返回三维，压扁意象在不知真相的供述中提前泄露维度差，而医生只读成普通幽闭症。
narrative_function: 让抽象空间维数以身体压迫显形，同时为四维碎片真相留下可回读的症状证据。
transfer_rule: 描写幽闭时可按自由度逐级缩减空间形状；管、夹板等喻体应分别限制不同方向，形成可执行的动态序列。
failure_boundary: 开放环境中的一般焦虑、只有空气不足而无边界压迫，或人物未体验空间尺度反差时，无限铁片会显得无根。
