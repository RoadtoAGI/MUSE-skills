chapter: 【威慑纪元12年，“青铜时代”号】
figure_type: simile
quote: 人们如落叶般缓缓向舷窗飘去
sensory_mapping: 人体失去重量成为叶片，舷窗转成地面，减速力像秋日静风把叶群缓缓落下。
context_fact: 青铜时代号开始最后减速，舰尾方向产生逐渐增强到一G的过载。
image_mechanism: 落叶比坠落更慢更轻，准确匹配过载渐增过程；群体飘移让重力方向改变可见。
property_alignment: 失重人体对应轻叶；缓慢加速度对应轻风下落；多人同向对应叶群飘落；贴窗对应落地。
context_alignment: 经历长期太空航行后，人们重新获得地球重力，落叶带有回归地面的温柔而非撞击危险。
narrative_function: 直观展示飞船重力坐标旋转，并为母星拥抱意象准备落地动作。
transfer_rule: 微重力群体运动宜选低终端速度物；方向、速度增长和最终接触面要与动力过程一致。
failure_boundary: 过载突然很强、人体高速撞窗或有固定座椅时，缓缓落叶不成立。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 失重漂浮者在减速加速度出现后缓慢移向舰尾舷窗
vehicle: 落叶受微弱重力或气流牵引，轻缓飘向地面
ground: 个体姿态松散、速度缓慢；许多轻体朝同一新下方漂落并最终贴住表面
