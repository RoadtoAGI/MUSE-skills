chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 零光速是真正意义上的死亡，绝对的死，百分之百的死
sensory_mapping: 黑柱内部连夸克的微颤也被按住，像死亡把每一层活动同时关闭，石块一进入便从可见世界消失。
context_fact: 死线标出零光速区，内部无表面细节且等同无引力源的黑洞，投石无法返回。
image_mechanism: 死亡把多尺度的物理静止统一成日常绝对终止概念，重复‘死’逐级封死任何例外。
property_alignment: 粒子无振动对应生命活动停止；无光传播对应无交流；黑洞不可返对应死亡不可逆；绝对零速对应百分之百死亡；死线命名对应死亡边界。
context_alignment: 人物站在名为死线的黑柱前，词义与可验证物理机制重叠，使拟人命名具有科学支撑。
narrative_function: 让零光速从参数变成存在论恐惧，并解释归零计划为何可能永远越不过零点。
transfer_rule: 物理停滞比作死亡时，要逐层列出运动、信息、返回和可逆性如何归零，避免只借黑色气氛。
failure_boundary: 粒子没有生命，‘死’不涉及生物机能；零光速理论也由人物转述，未被实验完全证明。
quality_assessment: exemplary
