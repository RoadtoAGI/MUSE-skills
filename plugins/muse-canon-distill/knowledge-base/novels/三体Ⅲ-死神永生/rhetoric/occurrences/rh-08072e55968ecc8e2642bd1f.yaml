chapter: 【广播纪元7年，云天明的童话】
figure_type: analogy
quote: 在天亮的过程中，周围的世界就像是一幅正在绘制中的画
sensory_mapping: 晨光像画笔从灰底起稿，先勾树田，再填绿红银白，太阳升起前整幅风景刚好收笔。
context_fact: 公主首次离开深宫，从山冈继续赶路，亲眼看见广阔乡野在日出中显形。
image_mechanism: 光照增强与绘画步骤同向推进，使自然显影变成连续创作，而非静态景色罗列。
property_alignment: 暗中轮廓对应底稿；渐明线条对应勾勒；颜色出现对应上色；日出前完整对应画成。
context_alignment: 她正逃避能把人变成画的针眼；现实世界也像画，却容许生命行动，构成关键反差。
narrative_function: 以公主新鲜视角展开宫外世界，并让日出承担从逃亡黑夜到成长旅程的转场。
transfer_rule: 黎明写成绘画时，应按轮廓、细节、色彩、光源和完成时刻排列映射。
failure_boundary: 自然没有画师或预定构图，景物一直存在；绘制只描述可见度逐渐增加。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 黎明里景物由模糊轮廓、暗淡色块逐步显出清晰线条与丰富颜色的过程
vehicle: 画师从底稿开始逐层补线、上色，直到一幅风景画完成
ground: 先有轮廓；细节逐步增加；色彩由少到多；完成有明确时点；整个视野像同一画面
