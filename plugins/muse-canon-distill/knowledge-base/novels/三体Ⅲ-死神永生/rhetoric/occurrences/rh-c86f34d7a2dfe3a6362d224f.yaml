review_status: reviewed
tenor: 三体科技由相对稳定进步转为短期内跨越多个层级的增长过程
vehicle: 运动物体从匀速突然获得爆炸冲击，在极短时间把速度和距离剧烈放大
ground: 增长率从稳定转为陡升；转折时间短；结果远超原趋势能够达到的范围
