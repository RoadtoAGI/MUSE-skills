chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 三体世界的技术发展是从什么时候由匀速变为爆炸式加速的
sensory_mapping: 技术曲线先平稳前行，某一时刻像被爆炸推力击中，斜率猛然竖起并冲出旧轨道。
context_fact: 人类无法确定三体科技何时飞跃，但第二舰队已能瞬间进入和脱离光速。
image_mechanism: 把知识积累写成运动状态，使发展速度、加速度和断点都能由一条动态轨迹观看。
property_alignment: 长期稳定进步对应匀速；短期跨代突破对应爆炸加速；光速技术出现对应冲出旧速度上限。
context_alignment: 上一节刚以舰队航迹和速度证明突变，运动学词汇顺着可观测证据进入科技史解释。
narrative_function: 把三体新优势从单项技术扩展为发展机制改变，并提出人类无法回答的历史谜题。
transfer_rule: 增长写成运动时，应分别对应基线速度、转折加速度和新轨迹，避免只用爆炸表达大。
failure_boundary: 技术领域并非同向运动，突破也可能分散发生；爆炸不说明具体知识来源或真实增长函数。
quality_assessment: effective
