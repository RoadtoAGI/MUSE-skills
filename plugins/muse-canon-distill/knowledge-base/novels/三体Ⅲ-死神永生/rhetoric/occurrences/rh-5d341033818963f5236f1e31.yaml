chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 一阵骚动，像初降的暴雨落入树丛一般
sensory_mapping: 一句没有快放像第一阵雨落下，人群化成树冠，惊呼和转身在各处叶面噼啪响起。
context_fact: 画面中的航迹正以肉眼可见速度延长，证明第二舰队接近光速。
image_mechanism: 初降暴雨精确截取骚动起始阶段，雨点分散又快速增密，对应信息在人群内同步爆开。
property_alignment: 人群对应树丛；惊呼对应雨点击叶；多点反应对应分散落雨；骚动扩展对应雨声连片。
context_alignment: 球形大厅内人员悬浮成群，声响没有地面脚步，树叶承雨的多点听觉比洪水移动更贴切。
narrative_function: 让冷静技术答案产生即时群体声场，并为随后的速度结论留出震惊节拍。
transfer_rule: 群体初始骚动如落雨时，应匹配多点触发、密度增长、承接介质和声音纹理。
failure_boundary: 若反应是统一喊叫或持续巨响，初雨的分散细密会偏弱；暴雨也不说明观点方向。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 众人得知三体舰队航迹以原速肉眼延伸后突然出现的密集低声议论和动作
vehicle: 暴雨最初一阵大滴落进繁密树叶，四处分散敲响并迅速连成沙沙声
ground: 许多局部声响近乎同时发生；声音落在密集群体各处；由安静骤转为连续嘈杂
