chapter: 【威慑纪元61年，执剑人】
figure_type: simile
quote: 街道像一条五光十色的河流
sensory_mapping: 路面液化成河道，信息窗成为发光漂浮物，追随广告形成短小支流后并回主流。
context_fact: 未来街道上信息窗口主动感知行人兴趣，漂出跟随一段后返回。
image_mechanism: 河流不仅写色彩和密度，还完整解释主流、分流、回流的界面行为，空间动线连续。
property_alignment: 窗口群移动对应水流；多彩发光对应彩色水面；窗口跟随对应支流分出；返回对应汇流。
context_alignment: 与树状城市框架并存，河流用于信息层而非建筑层，避免同一喻体承担所有结构。
narrative_function: 让主动信息系统的交通逻辑可见，呈现城市既有机生长又流动响应。
transfer_rule: 界面群如河时，应找到稳定主方向和可识别分汇流行为；色彩只是辅助，运动拓扑才是核心。
failure_boundary: 信息窗固定悬停、随机瞬移或没有共同流向时，河流机制不成立；后文虫飞森林属既有树框架复用。
quality_assessment: exemplary
