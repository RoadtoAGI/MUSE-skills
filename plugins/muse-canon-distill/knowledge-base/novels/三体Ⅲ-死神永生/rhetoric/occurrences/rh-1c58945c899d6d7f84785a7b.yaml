tenor: 漂满信息窗口、窗口随主流移动并偶尔分流跟人的高架街道
vehicle: 彩色漂浮物随主流前进、支流短暂分出又汇回的河流
ground: 大量对象沿共同方向连续移动；个体可从主流分出、伴随目标后再回流
