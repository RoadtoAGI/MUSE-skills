chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: simile
quote: 程心仿佛悬浮在牛奶宇宙之中。这是一团直径160亿光年的牛奶
sensory_mapping: 大厅和屏幕的白扩张成乳白液体，地面感随之消失，程心像被悬在没有上下的浓白之中。
context_fact: 水滴进入最后数分钟倒计时，程心面对全白显示，思维暂时一片空白。
image_mechanism: 牛奶把空白从缺少内容改写成有颜色、有质感却无法辨向的包围物，白色越充满视野，孤立越强。
property_alignment: 牛奶的乳白对应大厅与屏幕的纯白；液体包围对应程心失去方向；浑一表面对应她找不到任何决策支点。
context_alignment: 控制中心的实体白色给喻体提供现场色彩，160亿光年又把个人眩晕放大到可毁灭的宇宙尺度。
narrative_function: 在技术倒计时之间显影程心的认知停摆，为随后生命史图景涌入意识留出空场。
transfer_rule: 表现感知空白时，可用一种均质介质填满场景，同时对应颜色、包围方式和方向丧失。
failure_boundary: 若场景仍有清楚边界或人物能够稳定站立，牛奶宇宙会夸大失重；此处不表示大厅真的充满液体。
