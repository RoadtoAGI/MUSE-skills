chapter: 【危机纪元4年，云天明】
figure_type: analogy
quote: 像把墓室装饰成新房
sensory_mapping: 粉红心形和鲜花从医院移入石质墓室，暖色喜庆表面压在冷暗死亡用途上。
context_fact: 院方想让安乐室更人性化，装饰却让云天明恐惧恶心，觉得效果适得其反。
image_mechanism: 墓室揭开房间功能，新房放大装饰语义，两者强行同室后产生用途和符号的尖锐错位。
property_alignment: 安乐室对应执行死亡的墓室；鲜花心形对应新房婚庆装饰；人性化意图对应以喜庆遮掩死亡。
context_alignment: 主人公刚目睹死亡制度化，错位装饰使程序性善意显得更怪异，吻合其当场生理反感。
narrative_function: 解释为何美化反而加重恐怖，并批示符号不能改变空间的真实用途。
transfer_rule: 表现装饰失配时，可分别锁定空间功能与符号惯常场景，再将两者并置；两端情感方向越明确，反差越可验证。
failure_boundary: 若装饰用于悼念、颜色克制并承认死亡，便不等于新房粉饰；若房间不执行死亡，墓室也会夸大。
