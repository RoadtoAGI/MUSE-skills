quote: 程心像在自语
sensory_mapping: 她望着空无一物的旧址，声音落回自己耳边，像在反复确认一条只剩她相信的线索。
context_fact: 地面遗迹尽失，程心仍坚信艾AA会留下可跨越时间的石刻信息。
image_mechanism: 自语把一句事实判断转成内心支撑动作，轻声和失去听众的姿态显示希望孤立。
property_alignment: 低声陈述对应自言自语；未直接问关一帆对应无听者；执着石刻对应自我确认；注意力沉浸对应内收。
context_alignment: 关一帆准备放弃搜寻，程心的语气从对话退回独白，符合她与故人信息之间的私人联系。
narrative_function: 以声音方式推动她坚持地下探测，同时保留希望近乎无凭的脆弱感。
transfer_rule: 用自语刻画执念时，应让音量、视线、听者关系和句子用途共同指向自我确认。
failure_boundary: 程心身边有能听见的关一帆，她的话也确实推动了交流；并非真正独处自言。
