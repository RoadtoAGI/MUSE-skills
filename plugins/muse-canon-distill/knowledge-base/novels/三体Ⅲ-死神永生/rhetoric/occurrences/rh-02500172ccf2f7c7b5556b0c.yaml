figure_type: simile
quote: 像发狂的野兽般声嘶力竭地咆哮
sensory_mapping: 兽口咆哮；喉声撕裂；狂性外露；重复吼叫；攻击扑势
context_fact: 程心回忆维德在阶梯计划时期面对阻力时反复喊“前进，不择手段地前进”。
image_mechanism: 维德自称极端理性的意志在高压处反而穿破语言，口号退化成兽吼；声音的重复和破裂暴露理性驱动下的疯狂内核。
property_alignment: 维德对应野兽；执念失控对应发狂；喊声对应咆哮；沙哑耗力对应声嘶力竭；推进欲对应扑击；不择手段对应兽性攻击；重复口号对应连续吼叫
context_alignment: 段落正定义他为“极端理智带来的极端冷酷和疯狂”，野兽意象具象化理性与疯狂并存的悖论。
narrative_function: 以听觉闪回恢复维德早年的危险强度，让当前沉静老者仍带有可爆发的兽性。
transfer_rule: 用发狂野兽写人的喊叫时，应有音量失控、语言退化为重复指令、攻击性目标和明显越过社交克制的身体表现。
failure_boundary: 人物只是坚定演说、声音清晰克制、没有攻击倾向，或喊叫属于求救时，野兽发狂会误读动机。
