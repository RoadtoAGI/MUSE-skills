chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 我就想停下对宇宙的思考，但却像吸毒一样，停不下来
sensory_mapping: 星空每次让他寒冷疲惫，他仍像成瘾者回到下一次宇宙推演，越知道黑暗越想继续看。
context_fact: 关一帆从万有引力号时期就恐惧星空，却成为宇宙学家并不断探索规律战争与终结。
image_mechanism: 成瘾框架同时解释求知的吸引力、自知伤害和意志失效，使学术执着摆脱纯崇高叙述。
property_alignment: 宇宙思考对应毒品；知识刺激对应快感；恐惧疲惫对应副作用；停止愿望对应戒断；继续追问对应复吸。
context_alignment: 程心听真相后星海像噩梦，关一帆却长期主动进入这场噩梦，二人的受困方式不同。
narrative_function: 揭示关一帆选择永恒等待的一部分动机：低光速困局终于替他强制戒断宇宙思考。
transfer_rule: 求知比作成瘾时，应呈现吸引、伤害、自知、戒断失败和外力停止，避免只用“上瘾”空泛赞美。
failure_boundary: 科学思考没有药理依赖，也能带来公共知识价值；吸毒类比集中于个人强迫体验。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 关一帆明知宇宙思考使自己恐惧疲惫，仍无法停止追问和研究终极问题
vehicle: 吸毒者知道物质有害并想戒断，却因强烈依赖与渴求反复使用、无法凭意志停止
ground: 行为带痛苦和损害；主体有清楚认识；仍产生强迫渴求；多次尝试停止失败；短暂满足强化循环；最终希望外力终止
