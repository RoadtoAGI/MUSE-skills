chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 在这金碧辉煌的宫殿和珠光宝气的宾客中像一只惊恐的小老鼠
sensory_mapping: 灰斗篷在珠宝灯火间缩成一团鼠影，大厅的每道目光都像逼它寻找墙缝。
context_fact: 冰沙王子把真正危险的魔画师作为少年礼物引入宴会，众人尚不知道其能力。
image_mechanism: 鼠的弱小与惊惧制造错误威胁判断，越显可怜越能掩护其捕食式杀人能力。
property_alignment: 瘦小少年对应小鼠；灰斗篷对应鼠色；缩身步态对应受惊逃避；宫廷宾客对应巨大异境。
context_alignment: 华贵庆典把针眼的灰暗轮廓衬到最低，正适合王子让武器以无害形态入场。
narrative_function: 以视觉误导完成反派伪装，并为稍后的锐利目光和魔法杀戮积蓄反差。
transfer_rule: 危险人物先写成小兽时，应让体形、颜色、步态与环境比例支持其表面弱势。
failure_boundary: 针眼并不怯懦无害，老鼠的逃生本能也不能解释其计划；弱小只属于外观。
