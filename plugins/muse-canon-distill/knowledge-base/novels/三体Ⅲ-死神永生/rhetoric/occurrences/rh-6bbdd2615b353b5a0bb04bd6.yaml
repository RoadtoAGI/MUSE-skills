chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 画室没有窗户，两个银烛台上的蜡烛大部分已经燃尽，使这里像地堡一样阴冷
sensory_mapping: 无窗厚壁；残烛冷光；地下寒气；封闭角落；戒备静寂
context_fact: 长帆进入针眼画师的房间寻找公主画像，画师本人已把自己画入画中逃离现实。
image_mechanism: 墙面仿佛加厚并沉入地下，外界天光被完全切断，只剩两处将灭火点；画室从艺术空间变成藏匿和防守秘密的堡穴。
property_alignment: 画室对应地堡；无窗对应地下墙体；残烛对应应急灯；阴冷空气对应地下低温；画师秘密作业对应军事隐蔽；空无一人对应撤离后的堡室
context_alignment: 针眼用画像从现实逃脱，地堡感使画室成为他最后的防御工事，也衬出画中窗口的反常开放。
narrative_function: 建立压抑底色，让随后的明亮画像和通向另一世界的画面更突出。
transfer_rule: 用地堡写室内阴冷时，应有封闭厚重、自然光缺失、低温、人工微光和防御或藏匿功能。
failure_boundary: 房间开窗通风、阳光充足、装饰轻盈且用于社交时，地堡会强行注入战争封闭感。
