chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 像拿着一团白色的影子
sensory_mapping: 白皂躺在掌上却不给皮肤任何压力，像从墙面揭下一团亮影捧在手里。
context_fact: 这种异域香皂比羽毛还轻，是王国仅存的珍品，遇水会产生大量泡沫。
image_mechanism: 影子制造视觉与重量的感官矛盾，白色又反常修正普通黑影，使材料陌生性更强。
property_alignment: 皂块轮廓对应影形；无重量对应非实体；雪白对应亮影；易飘对应无法抓牢。
context_alignment: 童话以材料性质编码技术信息，白影喻体精准突出最反常且可测的低质量属性。
narrative_function: 让关键香皂道具获得可记忆物性，并为随后海量轻泡沫铺垫。
transfer_rule: 超轻物写成影子时，应同时保留可见轮廓、触觉缺失、颜色修正和操持风险。
failure_boundary: 香皂仍有实体、摩擦与化学性质，影子不能被拿起；比较仅限重量错觉。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 卫队长手中雪白、有清晰形状却几乎没有重量的赫尔辛根默斯肯香皂
vehicle: 具有可见白色轮廓却无质量、手指无法感到承重的影子
ground: 视觉存在而触觉近乎缺席；重量极轻；轮廓可辨；稍松手便可能飘走
