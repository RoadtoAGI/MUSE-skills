quote: 仿佛陷入了比刚才更深的恐惧中
sensory_mapping: 幽深坑穴；继续下沉；四壁压近；光线变暗；无法爬出
context_fact: AA只能带三至五个孩子，要求教师自己决定人选，教师面对整群孩子无法选择。
image_mechanism: 原有恐惧已是一个低处，选择命令又抽走脚下地面，使她再坠一层；孩子围在四周像坑壁，她找不到可迈出的方向。
property_alignment: 恐惧状态对应深坑；情绪程度对应深度；选择要求对应地面塌陷；行动困难对应攀爬受阻；孩子围视对应坑壁；视线回避对应不敢向上看
context_alignment: 逃生资源不足把普通害怕变成道德深渊，‘更深’准确区分外部危险与亲手取舍的内在恐惧。
narrative_function: 显示AA的选择方案没有解决困境，反而把死亡分配责任压给教师。
transfer_rule: 用下陷写情绪升级时，应有先前基线、触发第二次坠落、行动能力下降、包围感和难以返回原状态。
failure_boundary: 情绪很快缓解、人物立即果断行动，或只是惊讶程度增加时，深坑会夸大持续束缚。
