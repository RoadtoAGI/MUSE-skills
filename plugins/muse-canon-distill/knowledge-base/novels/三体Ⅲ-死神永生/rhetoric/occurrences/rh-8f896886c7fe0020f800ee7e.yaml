chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 谁会注意到远处的三只小蚂蚁呢
sensory_mapping: 沙上三蚁；巨人俯视；远点微动；呼喊无声；尺度悬殊
context_fact: 深水王子此时在远处看似顶天立地，公主跳起呼喊，他的目光扫过却没有发现三人。
image_mechanism: 透视异常把王子抬到山峰尺度，岸边人物随之缩成三枚黑点；蚂蚁模型同时解释视觉不可辨和声音无法抵达。
property_alignment: 公主三人对应三蚁；王子对应俯瞰人类；远岸对应地面远处；身体小点对应蚁形；跳喊对应蚁群活动；未被注意对应人忽略昆虫；危险海岸对应蚁群脆弱
context_alignment: 深水王子不符合透视原理，远看保持正常视角大小，蚂蚁反差让这一关键物理暗示先以童话尺度显现。
narrative_function: 解释王子没有回应，并强化深水王子“远看巨人”的规则，为透视谜底埋线。
transfer_rule: 以蚂蚁写远处人物时，应建立高位或巨物视角、极端尺度差、难辨细节和交流失败，而非只说人数少。
failure_boundary: 双方距离近、人物轮廓与声音清楚，或观察者本身并不巨大时，小蚂蚁会过度缩小对方。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 从墓岛巨人深水王子的远距视角看，岸边露珠公主、宽姨和长帆三人的微小身影
vehicle: 三只尺寸极小的蚂蚁停在远处地面，虽在移动呼喊也难被高处巨人察觉
ground: 三个人对应三只蚂蚁；远距缩小对应昆虫尺度；巨人视角对应人俯看蚁；呼喊不被听见对应蚁动难察；沙滩对应地面；个体脆弱对应蚂蚁易忽略
