chapter: 【广播纪元7年，程心】
figure_type: simile
quote: 感觉世界像刷新了一样
sensory_mapping: 黑暗五年后，世界像屏幕完成重绘，边缘重新锐利，颜色和远景在同一瞬加载出来。
context_fact: 她原有中度近视，视网膜坏死后用克隆干细胞培育的新视网膜完成移植。
image_mechanism: 刷新把生物复明转成数字显示动作，新视网膜如新的绘制周期，让整个世界而非单个物体显得更新。
property_alignment: 旧近视视野对应模糊旧帧；移植复明对应刷新指令；异常清晰对应重绘画面；新阶段对应页面重新载入。
context_alignment: 广播纪元的生活和社会也在下一段被称为刷新，个人视觉更新与时代舆论翻页形成双重语义。
narrative_function: 以当代技术口语快速标记复明奇迹，并开启六年后全新社会景象。
transfer_rule: 感知如界面刷新时，应指出旧帧缺陷、触发更新的事件、整体重绘效果和新旧切换速度。
failure_boundary: 世界本身没有更新，变化发生在程心视网膜和视觉体验；刷新也不意味着创伤记忆被清除。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 程心移植视网膜复明后，视野比失明前更清晰明亮的新鲜感
vehicle: 显示屏重新载入并绘制画面，旧的模糊残影被清除，像素以清晰状态一次呈现
ground: 视觉内容整体更新；清晰度突然提高；旧状态被新画面覆盖；主体感到重新开始
