chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 乌云自西向东，像帷幕一样遮住了夜空
sensory_mapping: 云层像黑布从西侧缓缓拉过穹顶，星月这幅背景被一寸寸合上。
context_fact: 寿宴散场，王子和画师即将趁黎明前黑暗赴地堡实施谋杀。
image_mechanism: 帷幕的关闭动作把天气变化写成舞台换景，庆典明场结束，阴谋暗场开始。
property_alignment: 乌云片层对应布幕；东西移动对应横拉；遮星月对应挡住布景；黑夜加深对应落幕。
context_alignment: 上一场是灯火通明的宫廷演出，云幕合拢恰好给真正行动提供遮蔽。
narrative_function: 以自然景象完成场景转调，并给地堡段落建立童话剧场式开幕。
transfer_rule: 云写成帷幕时，应落实移动方向、覆盖面、被遮对象和场景转换功能。
failure_boundary: 云没有织物边缘或人为操作者，帷幕也不能解释寒风；比喻限于视觉遮蔽。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 成片横移并逐步封闭夜空的厚重乌云
vehicle: 从舞台一侧拉向另一侧、合拢后遮断全部背景的黑色帷幕
ground: 大面积连续覆盖；横向移动；遮蔽后方景物；带来场景切换和封闭感
