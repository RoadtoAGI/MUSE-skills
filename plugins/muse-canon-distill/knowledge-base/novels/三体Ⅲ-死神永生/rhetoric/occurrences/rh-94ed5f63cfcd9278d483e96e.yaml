review_status: reviewed
tenor: 太空艇旋转一百八十度时，舷窗中的星野和银河连续横移展开的视觉景象
vehicle: 一轴绘有密集星图的长卷在观看者面前缓缓舒开，画面连续从一端流向另一端
ground: 宽广图景按方向连续显露；观看框固定而内容横移；画面细节丰富；运动平滑有展开感
