chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 群星和银河像一轴展开的长卷般从视野中流过
sensory_mapping: 透明罩像卷轴窗框，黑底星图一寸寸舒展，银河亮带随艇身转向从一侧流到另一侧。
context_fact: 太空艇掉头准备减速，太阳移出视野，群星、银河和最终出现的地球依次经过舷窗。
image_mechanism: 长卷把旋转产生的视野扫掠变成展开阅读，星空本身未动，画面流动由载具转向负责。
property_alignment: 星空对应卷画；舷窗对应观看框；艇身旋转对应展卷；银河横移对应画面流过；连续星野对应长轴。
context_alignment: 前文四维飞船如巨画展开，此处三维星空如长卷展开；同为画面，观察机制由升维改为转向。
narrative_function: 把掉头的空间方位变化写成一段壮阔视觉过门，引出重新居中的脆弱地球。
transfer_rule: 移动全景如展卷时，应固定观看窗口，标出展卷方向、画面连续性和真正运动的载体。
failure_boundary: 群星没有画在平面卷轴上，也并非自身流动；长卷只对应视野扫过的顺序。
quality_assessment: exemplary
