chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: analogy
quote: 就像把死者的遗物一起埋葬
sensory_mapping: 坐标入墓；记录陪葬；数据库封土；死星遗物；归档葬礼
context_fact: 目标三体星系已被其他清理者摧毁，歌者依规将无用坐标及相关通信记录转入“墓”。
image_mechanism: 冷冰冰的数据生命周期被组织成葬礼：星系先获得“死者”身份，通信文件随之成为遗物，数据库目录则成为隔离死者与工作区的墓穴。
property_alignment: 毁灭星系对应死者；坐标对应遗体身份；数据库“墓”对应墓穴；通信历史对应遗物；批量转移对应陪葬；归档不再处理对应埋藏；后续检索对应开墓查看
context_alignment: 歌者文明把灭绝当清理，却仍在信息管理中保留死亡习俗，日常葬礼语言使宇宙屠杀呈现官僚化。
narrative_function: 用熟悉仪式解释外星数据库规程，并让三体文明的毁灭以一份“遗物”进入太阳系线索。
transfer_rule: 以葬礼写数据归档时，应有明确失效主体、与之绑定的附属记录、隔离存储区和不再参与当前工作的终止状态。
failure_boundary: 数据仍高频更新使用、归档只是复制备份，或附属记录与主体无关系时，陪葬会误写信息生命周期。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 把已遭清理的星系坐标及其通信、历史等关联记录一并移入名为“墓”的数据库归档
vehicle: 按母世界葬俗埋葬死者时，将其生前遗物随遗体一同放入墓中封存
ground: 被毁星系坐标对应死者；墓数据库对应坟墓；关联记录对应遗物；归档操作对应下葬；停止使用对应与生者世界隔离；保留历史对应陪葬保存
