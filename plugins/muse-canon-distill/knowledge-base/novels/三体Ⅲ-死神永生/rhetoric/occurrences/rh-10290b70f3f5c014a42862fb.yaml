chapter: 【危机纪元4年，云天明】
figure_type: metaphor
quote: 那是他大学生活中最阳光明媚的一天。事实上那天天气并不好，下着蒙蒙细雨
sensory_mapping: 情绪亮度覆盖真实天气，蒙蒙细雨仍被记忆内部的日光照亮，心理气候与物理气候分层。
context_fact: 实际郊游下着小雨，但程心坐到他身边交谈，使这天成为其大学最珍贵记忆。
image_mechanism: 先断言阳光明媚，再用坏天气纠正字面读法，迫使光线完全归属于情感；反差验证它不是天气描述。
property_alignment: 幸福温暖对应日照温度；记忆鲜明对应强光清晰；孤僻大学生活对应阴暗背景；该日突出对应最明亮一天。
context_alignment: 小雨后来成为他爱程心的私人符号，心理阳光与真实细雨并存，保留记忆独有的双重天气。
narrative_function: 标定程心在主人公生命中的价值峰值，并为纸船梦境和赠星决定建立来源。
transfer_rule: 用天气写记忆时，可主动保留真实天气作反证；只有情感确实改变感知价值，心理气候才有独立层次。
failure_boundary: 若原日真实晴朗且文本不区分心理感受，阳光明媚只是字面天气；若记忆主要是痛苦，也不应借最亮日光。
