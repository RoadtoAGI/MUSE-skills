tenor: 老画师视力衰退后看见的事物轮廓模糊、颜色不清
vehicle: 真实景物被大范围雾气覆盖，远近边界和色彩都被白灰介质削弱
ground: 视野整体模糊；细节丧失；色彩变淡；观察距离缩短；遮蔽位于观看者与世界之间
