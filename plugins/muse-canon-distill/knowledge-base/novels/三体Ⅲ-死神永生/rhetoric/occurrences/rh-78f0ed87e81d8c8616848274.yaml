chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 世界在他昏花的老眼中已蒙上了雾霭
sensory_mapping: 老眼前像升起一层灰雾，笑脸和宫殿退到雾后，画笔抓不住清晰边线。
context_fact: 国王拒绝让年老宫廷画师记录庆典，冰沙借机献上针眼。
image_mechanism: 雾霭把生理视觉退化外投为整个世界的天气，使老画师主观失真获得环境规模。
property_alignment: 晶状体混浊对应雾层；轮廓模糊对应远景隐没；辨色下降对应雾中褪色；画不清对应看不穿。
context_alignment: 庆典被写得极亮极彩，老眼之雾却无法接收它，给新旧画师替换提供感官理由。
narrative_function: 自然引出针眼登场，并把记录权从无害老画师交给致命新画师。
transfer_rule: 视力衰退写成雾时，应匹配遮蔽位置、细节损失、色彩变化和任务影响。
failure_boundary: 外界并无真实天气变化，老画师或可借工具改善；雾只对应主观视觉。
