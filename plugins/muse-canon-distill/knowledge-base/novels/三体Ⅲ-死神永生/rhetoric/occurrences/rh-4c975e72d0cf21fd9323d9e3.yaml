figure_type: simile
quote: 这种东西以前在他的精神世界中是很难看到的，就像火中难以见到水
sensory_mapping: 烈火核心；一滴水；瞬间汽化；火势受扰；不相容物质
context_fact: 程心提出把星环公司交给维德并要求他承诺服从，维德第一次显得犹豫无助。
image_mechanism: 他的精神被写成持续燃烧的高温区域，软弱像一滴水落入其中，刚被看见就应汽化；正因无法共存，这一瞬比普通表情更震动程心。
property_alignment: 维德意志对应火焰；冷酷能量对应高温；犹豫对应水滴；无助对应水的柔软；性格排斥对应汽化；罕见持续对应水难存；程心发现对应看见蒸汽瞬间
context_alignment: 此前维德被比作核燃料，火性已建立；水的出现标记程心条件真正触及他力量结构。
narrative_function: 揭示维德接受控制条件的困难，让他的承诺具有真实代价。
transfer_rule: 用火中水写人格异质情绪时，应先建立稳定火性，再让柔性情绪短暂出现、相互排斥并可能改变火势。
failure_boundary: 人物平常就常犹豫示弱，或水火在文本中没有性格前史时，罕见性会被夸大。
