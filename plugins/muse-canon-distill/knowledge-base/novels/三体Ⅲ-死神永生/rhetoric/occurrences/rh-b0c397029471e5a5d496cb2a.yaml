quote: 座椅像大手掌般合拢，把她们握在中间
sensory_mapping: 座椅两侧包片像粗大手指弯拢，背垫是掌心，把两人整个握进安全的机械手中。
context_fact: 星环号将从轨道向蓝星地表下降，乘员需要承受聚变推进和着陆载荷。
image_mechanism: 手掌把冷机械固定系统转成身体熟悉的保护动作，合拢与握持精确说明座椅变形方式。
property_alignment: 座椅背面对应掌心；侧翼对应手指；闭合对应握住；乘员对应掌中物；约束对应握力；缓冲对应保护。
context_alignment: 离开母亲星球后，陌生蓝星着陆前由飞船以大手托住，机械暂时承担家园保护功能。
narrative_function: 用一个动作交代座椅技术与着陆准备，并缓和进入未知行星的身体不安。
transfer_rule: 包覆装置比作手掌时，应落实掌心、手指、合拢路径、握力和保护对象。
failure_boundary: 座椅没有触觉或意志，过强闭合也会造成伤害；手掌感限于结构与保护功能。
