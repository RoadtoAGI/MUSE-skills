chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 中轴线上的人海开始向与平面相反的方向扩散，就像一道被无形的手缓缓提起的帷幔
sensory_mapping: 密集人群在银光里连成一幅黑幕，被无形力量从逼近的水线前一点点提向高处。
context_fact: 失重使三百万人浮在中轴线上，二维平面从城的一侧上升，人人用微型推进器逃离。
image_mechanism: 帷幔抹去个体动作，突出百万身体共同构成的柔性表面；无形之手同时暗示空间流动在操纵全体。
property_alignment: 人海薄层对应布幕；群体扩散对应帷幔展开；反向移动对应提起；空间作用对应无形手；缓慢逃逸对应缓提。
context_alignment: 人群以帷幕般动作试图避开一张真正的二维平面，三维生命自身先在构图上变薄。
narrative_function: 把百万人的同步逃生压成一幅可读动态图，并显示他们虽然行动一致仍无法脱离。
transfer_rule: 群体比作帷幔时，应对齐整体厚度、边缘、运动方向、形变速度和驱动力来源。
failure_boundary: 人群并非相连布料，个体方向和速度各异；连续帷幔是远景密度造成的视觉整合。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 悬浮居民为躲开上升二维面，整体向相反方向移动并在中轴线上铺展的形态
vehicle: 一只看不见的手捏住布幕上缘，将整幅柔软帷幔缓慢向上提起
ground: 群体形成连续薄层；整体同向移动；边缘先升；形状柔软变化；驱动力不可见；速度缓慢而无力
