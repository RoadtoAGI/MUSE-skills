context_fact: 公众与政界普遍反对光速飞船，星环城仍吸引大批优秀学者，联邦体制内科学家也暗中合作。
image_mechanism: 被法律压制的技术目标获得宗教信仰的凝聚力，城市由研究场所升为精神坐标；学者的合作和迁入则成为朝圣路线。
property_alignment: 光速飞行对应信仰；科学家对应信徒；星环城对应圣地；聚集优秀学者对应朝圣；暗中合作对应秘密礼拜；基础研究领先对应神圣权威；政治反对对应外部迫害
context_alignment: 光速事业已从正常科研变成少数人的禁忌理想，圣地恰能表现参与者超越职业利益的献身态度。
narrative_function: 概括星环城的人才吸引力与象征地位，为守城者愿意冒死铺垫价值基础。
transfer_rule: 以圣地写机构时，应有被共同信念连接的人群、主动汇聚行为、超越实用利益的敬畏和清晰的象征中心。
failure_boundary: 人们只因高薪短期任职、机构没有共同理想，或地点可被任意替换而不影响认同时，圣地会美化普通人才中心。
