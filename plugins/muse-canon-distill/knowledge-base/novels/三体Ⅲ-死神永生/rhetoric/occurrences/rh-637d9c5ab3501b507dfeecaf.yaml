tenor: 冰沙王子长大后减少公开暴虐、以沉默收敛掩盖攻击欲
vehicle: 狼把尖牙收在闭合嘴中，暂时不攻击却仍保持捕食本性与武器
ground: 危险本质未变；武器暂时不可见；外表平静；等待合适时机；旁观者仍能判断威胁
