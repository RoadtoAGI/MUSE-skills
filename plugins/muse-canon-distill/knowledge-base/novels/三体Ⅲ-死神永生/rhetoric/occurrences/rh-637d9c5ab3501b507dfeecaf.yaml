chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 这只是狼藏起了獠牙
sensory_mapping: 王子的狂笑收回嘴里，獠牙藏到阴沉目光后面，安静只是狼口暂时合上。
context_fact: 他幼时虐杀动物，成年后不再公开施暴，却将在失去继承权后策划弑亲。
image_mechanism: 藏牙区分行为收敛与欲望改变，动物捕食机制让国王的判断具有明确预警意义。
property_alignment: 暴虐本性对应狼性；攻击能力对应獠牙；沉默寡言对应闭口；政变等待对应伏击时机。
context_alignment: 后文针眼外表像惊恐小鼠，狼与鼠的动物谱系反转主从：真正主谋是隐藏捕食者。
narrative_function: 否定成长等于改过的表象，为取消继承权和阴谋爆发建立因果。
transfer_rule: 收敛的危险人物写成藏牙野兽时，应对齐本性、武器、表面动作和等待目标。
failure_boundary: 人类人格不由捕食本能单独决定，沉默也不必然意味着伏击；判断受童话善恶简化。
