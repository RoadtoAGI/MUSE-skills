chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 大旋涡仿佛成了世界的中心
sensory_mapping: 固定涡心；环转天空；山海公转；世界轴点；中心眩晕
context_fact: 为减轻眩晕，直升机按旋涡角速度旋转；结果涡面静止而旋涡外全部景物转动。
image_mechanism: 飞行器把镜头锁在涡心，旋转被从水体转移到天地；一个海坑获得世界轴心的地位，远山和天空像巨大轮盘绕它扫过。
property_alignment: 涡心对应世界中心；直升机共转对应固定观察台；天空海洋山脉对应环绕天体；外景转动对应公转；持续眩晕对应中心参照失效
context_alignment: 这是参考系操作造成的真实视觉结果，夸张的世界中心又表现人类试图用技术消除眩晕反而扩大错觉。
narrative_function: 展示共转方案失败，并把旋涡的视觉统治范围扩展到整个世界。
transfer_rule: 用世界中心写相对运动时，应有固定参照物、周边整体环转、观察系主动转换和尺度扩张。
failure_boundary: 周围景物保持稳定、中心自身明显旋转，或只有单个物体绕行时，世界中心会夸大参照效应。
quality_assessment: effective
confidence: 0.99
review_status: reviewed
tenor: 直升机与旋涡同速旋转后，旋涡在乘员视野中固定，天空、海洋和山脉反而都绕它转动
vehicle: 宇宙中绝对静止的中心点，整个可见世界的天体和地景都围绕它公转
ground: 旋涡视觉静止对应中心不动；外界旋转对应万物绕行；观察者位于上方对应中心观测；眩晕不减对应参考系颠倒
