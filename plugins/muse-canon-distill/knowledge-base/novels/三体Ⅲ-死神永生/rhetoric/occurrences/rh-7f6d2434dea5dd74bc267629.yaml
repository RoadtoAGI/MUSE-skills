chapter: 【掩体纪元11年，光速二号】
figure_type: simile
quote: 这废墟像一头搁浅的巨鲸，它躺在那里年代久远，只剩下干裂的皮和骨骼，生命早已离它而去
sensory_mapping: 巨鲸横卧；皮层外翻；骨架裸露；干裂尸身；无声搁浅
context_fact: 光速二号原为容纳黑洞的科学城，如今不自转、无人居住，外表遍布破洞裂缝。
image_mechanism: 工程外壳被读成死亡巨兽的皮，承力框架成为肋骨；太空中的无依静止获得搁浅姿态，使废墟显得曾有生命而今彻底死亡。
property_alignment: 城体对应鲸身；庞大尺度对应巨鲸；停止旋转对应横卧；外壳裂口对应皮肤干裂；金属框架对应骨骼；无人状态对应尸体；太空孤悬对应岸上搁浅
context_alignment: 太空城曾承载人类最前沿研究，却因高Way死亡而废弃，鲸尸把技术巨物的过去活力与当前死亡同时显形。
narrative_function: 在进入黑洞故事前赋予废城尸体感，建立敬畏、恐惧和古老秘密的气氛。
transfer_rule: 以搁浅巨兽写废弃机器时，应匹配庞大有机轮廓、失去移动能力、外层破损、内部骨架暴露和长期静置痕迹。
failure_boundary: 设施仍在运转、结构方正紧凑、表皮完整，或漂移具有明确动力时，搁浅鲸尸会错误宣告死亡。
