chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 现在感觉它们像一个裸露的大脑，这大脑在夕阳的余晖中呈现出迷离的沟回
sensory_mapping: 沙丘的柔弧突然皱成脑回，谷地像深沟，整片大脑没有颅骨地暴露在晚霞下思考。
context_fact: 师生正在质疑人类是否真能从规律理解宇宙，沙漠随后将在回忆梦境中塌成深坑。
image_mechanism: 大脑把地貌复杂性转成认知器官，裸露使宇宙思想既可见又脆弱，替换了先前肉体审美。
property_alignment: 沙丘起伏对应脑回；谷沟对应脑沟；无植被对应裸露；迷离光影对应难解思维。
context_alignment: 纸条像宇宙基准面，沙漠像大脑；外部几何与内部认知互相映照，突出理解危机。
narrative_function: 让哲学谈话侵入景物视觉，并预示白Ice多年后由纸条重新唤醒导师警告。
transfer_rule: 地貌写成器官时，应匹配结构纹理、功能主题、暴露条件和旧视角如何被替换。
failure_boundary: 沙漠没有神经活动，沟回相似也不表示自然具有意识；这是人物认知投射。
