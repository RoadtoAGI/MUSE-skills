chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: metaphor
quote: 那光焰似乎要吞没整个宇宙
sensory_mapping: 白色巨口；火焰边界扩张；星空被吃掉；视野全白；太阳消失
context_fact: 真空氢弹能量主要以辐射释放，摄像机不断调暗仍在最亮时只剩雪白画面。
image_mechanism: 光不再照亮对象，而反过来吃掉可见世界；火球边缘越涨，星空、太阳和仪器画面就一层层进入白色腹中。
property_alignment: 核火球对应吞噬者；扩张光焰对应张口；宇宙景物对应被吞对象；过曝消失对应进入体内；太阳被压过对应强物也被吃；全白画面对应吞尽后的单一内部
context_alignment: 试验只模拟恒星爆发，却在画面尺度上短暂完成宇宙吞没，准确表现无大气核爆的辐射压倒性。
narrative_function: 把亮度峰值写成视觉灭世，为石块熔化和公众希望爆发提供能量尺度。
transfer_rule: 用吞没写强光过曝时，应有光域扩张、背景逐项消失、强弱压制、视野单色化和观察设备失效。
failure_boundary: 光源局部微弱、背景仍清楚可见，或‘吞没’实际指物质吸收而非视觉覆盖时，应区分机制。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 氢弹火球亮度和视直径迅速超过太阳，使直播画面全部过曝成白色、看不见任何背景
vehicle: 巨兽或洪流张开边界不断扩张，把周围万物吞入口中，使外部空间完全消失
ground: 光焰扩张对应巨口张开；背景被过曝对应物体被吞；画面全白对应宇宙消失；亮度压倒太阳对应吞噬更强光源；持续增长对应进食推进
