quote: 约五十万吨物质，相当于公元世纪一艘大型油轮的运载量
sensory_mapping: 五十万吨从宇宙数字缩成一艘油轮的满载货舱，足以建成田园，却在宇宙天平上近乎一粒尘。
context_fact: 647号属于三体数百小宇宙中最小一类，机器人正把其中全部物质送回大宇宙。
image_mechanism: 油轮载量为巨大数字提供人类工程尺度，同时与大宇宙尺度并置，制造大与微不足道的双重判断。
property_alignment: 五十万吨对应油轮载重；小宇宙物质对应货物；归还过程对应卸载；人类尺度巨大对应大型船；宇宙尺度微小对应一船对海洋。
context_alignment: 终章从宇宙命运落到土壤小车逐件搬运，油轮中间尺度帮助读者跨越抽象总量与具体劳动。
narrative_function: 量化647号牺牲的物质规模，并解释为何个体选择看似微小却仍属于集体临界问题。
transfer_rule: 天文数量换算日常载荷时，应保留单位等价，并同时标出在人类与宇宙两个尺度下的不同重量感。
failure_boundary: 小宇宙质量由土壤、设备、空气等复杂成分组成，不是油轮中的同质液体货物。
