figure_type: simile
quote: 那朵蘑菇云像是一个丑陋的头像，在夕阳中露出一种奇怪的表情
sensory_mapping: 蘑菇冠收拢成额头与脸，夕照在尘褶中压出眼口，让爆炸遗迹仿佛远远回看程心。
context_fact: 程心知道水滴已毁掉广播系统，现场军人仍把喷尘当作普通火山现象。
image_mechanism: 头像让无生命尘云获得凝视方向，奇怪表情承载她无法命名的失败、嘲弄与凶兆。
property_alignment: 蘑菇冠对应头颅外形；云中阴影对应五官；夕阳变色对应表情；正面远观对应头像回望。
context_alignment: 此前所有生命用眼睛注视程心，此刻第一幅战败景象也长出一张脸，延续被审视感。
narrative_function: 把战略毁灭人格化为不祥见证，使远景从地质现象转成对人物的心理逼视。
transfer_rule: 景物拟成面孔时，要指出轮廓、明暗和视线方向，并让人物情绪决定表情的可解释范围。
failure_boundary: 头像表情来自程心的视觉投射，云没有意志；近距离失去整体轮廓后映射会瓦解。
