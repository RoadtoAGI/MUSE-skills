chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 由民主文明的地球向银河系播撒无数个极权的种子
sensory_mapping: 银河撒种；黑色种粒；远星生根；极权繁殖；母地扬播
context_fact: 反对派引用太空生存会迅速催生极权，担心光速飞船令这种社会形态遍布银河。
image_mechanism: 政治制度被压进移民群体内部成为可遗传胚芽，飞船离地同时完成播种；距离越远，母文明越无法修剪其生长。
property_alignment: 移民飞船对应种子；民主地球对应母株与播种地；银河对应土壤；极权倾向对应基因；殖民地对应植株；数量扩散对应播撒；制度复制对应繁殖；不可控制对应野生生长
context_alignment: 担忧来自黑暗战役中飞船社会的真实案例，种子隐喻把一次危机经验外推为银河殖民的制度传播机制。
narrative_function: 让抽象政治风险呈现可复制、不可回收的扩散图景，解释精英反对强度。
transfer_rule: 用种子写制度扩散时，应有携带者、可复制核心、多个新环境和脱离原中心后自主繁衍的过程。
failure_boundary: 移民仍受地球实时治理、制度可自由多样选择，或群体不建立后代社会时，种子会把可能性写成遗传必然。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 地球向星际派出的独立人类群体在封闭太空环境中迅速退化为极权社会，并在银河各处建立后代文明
vehicle: 母地向广大田野撒出大量种子，每粒携带相同遗传倾向，在不同地点生根繁殖成同类植物群落
ground: 星际移民群对应种子；地球对应播种者；银河对应田野；极权结构对应遗传特征；殖民扩张对应发芽繁殖；多艘飞船对应多粒种；后代社会对应植株
