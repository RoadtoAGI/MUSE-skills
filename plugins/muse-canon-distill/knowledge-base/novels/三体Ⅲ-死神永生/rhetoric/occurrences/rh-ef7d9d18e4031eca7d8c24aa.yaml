review_status: reviewed
tenor: 针眼扫视公主时极短、极快却足以完成记忆的一眼
vehicle: 瞬间劈过视野、明亮集中并立即消失的闪电
ground: 持续时间极短；速度快；亮点突现；冲击集中；过后仍留下印象
