chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 针眼画师看露珠公主的时间更短，如闪电般看了一眼
sensory_mapping: 他的视线在公主脸上只亮了一瞬，像细电光划过，尚未看清动作便已收回。
context_fact: 针眼凭一次注视便能在心中完整绘下人物，之后将公主画入魔画。
image_mechanism: 闪电以可见瞬时轨迹度量观察速度，也暗藏一眼即可致命的电击感。
property_alignment: 短暂注视对应闪电瞬发；目光锐亮对应电光；快速收回对应闪灭；危险后果对应雷击潜能。
context_alignment: 前句目光如烈焰旁利剑，此处改为闪电，持续强化视觉能力的速度与杀伤预兆。
narrative_function: 说明魔画不需长时间写生，消除后续阴谋在技术上的疑问。
transfer_rule: 极快观察比作闪电时，应对齐出现时长、亮度轨迹、冲击和留下的信息。
failure_boundary: 目光没有电流或雷声，公主也未在当场受伤；闪电仅标定速度和危险感。
quality_assessment: effective
