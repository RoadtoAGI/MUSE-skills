chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 这种感觉通过他如神的画笔凝固在画布上
sensory_mapping: 眼中掠过的色形沿画笔流到纸面，像液体遇冷，立刻结成清晰不动的图像。
context_fact: 针眼能将见过的人分毫不差画出，画面还会替代现实人物。
image_mechanism: 凝固给感知到图像的转换增加物态过程，突出画笔不仅记录，还把活物锁成固定平面。
property_alignment: 瞬时感觉对应流动物；画笔对应传输通道；作画对应相变；完成画像对应固态定形。
context_alignment: 童话核心正是人物被画面固定并从现实消失，凝固一词提前暗示魔法的致命规则。
narrative_function: 将普通写生能力与后续现实凝结进画布的魔法悄然接轨。
transfer_rule: 创作写成凝固时，应说明流动的输入、转化工具、定形结果及固定带来的代价。
failure_boundary: 感觉不是物质，画笔也不具神力这一事实尚未被证明；凝固不能解释画技全部步骤。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 针眼对色形的瞬时感知被准确、永久地转化为画面
vehicle: 流动或无定形物质经通道冷却，固结成不会再变化的实体
ground: 原本短暂流动；经过工具传递；形态被固定；结果可长期保存
