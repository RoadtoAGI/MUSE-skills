chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 我的一生，就是在攀登一道责任的阶梯
sensory_mapping: 从做一个不让父母失望的孩子起，她一级级向上，火箭、执剑与文明责任成为踏板，最后站到宇宙命运的高处。
context_fact: 节选逐段列举程心不同人生阶段的责任，并在L4632明确称将登上责任顶峰。
image_mechanism: 阶梯把离散履历组织为单向垂直结构，责任范围的扩大对应高度，个人承受与视野也随攀登同步增加。
property_alignment: 人生阶段对应台阶；责任扩大对应升高；主动选择对应攀登；前期能力对应下层基础；宇宙责任对应顶峰；普通生活对应地面道路。
context_alignment: 智子刚说她仍为责任活着，随后的第一人称阶梯为这一判断提供程心自己的完整内部解释。
narrative_function: 用统一空间结构收束全书人物弧线，并把最后归还小宇宙定位为最高一级。
transfer_rule: 一生写成阶梯时，各级应有可验证的先后、范围增量、承接关系和顶点行动，不能只罗列荣誉。
failure_boundary: 责任不必天然越大越高或更道德，程心的选择也有倒退、矛盾与被迫成分；阶梯是其自我叙事。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 程心从童年自律、专业工作、执剑责任逐级走到对文明乃至宇宙命运负责的人生历程
vehicle: 攀登者沿一架向上延伸的阶梯逐级升高，每一级位置更高、负担与风险也随之增加，最终到达顶峰
ground: 阶段按先后排列；每级建立在前级之上；高度持续增加；攀登需要主动承担；越高视野与风险越大；存在顶峰；难以退回普通地面
