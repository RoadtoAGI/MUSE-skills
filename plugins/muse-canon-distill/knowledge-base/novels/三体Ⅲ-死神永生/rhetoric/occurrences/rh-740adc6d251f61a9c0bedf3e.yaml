figure_type: metaphor
quote: 那里升起的是一个黑色的巨轮，把黑色的光芒洒向世界
sensory_mapping: 晨曦位置升起巨大黑日，暗色光束反向铺开，把本应被照亮的天地一层层染黑。
context_fact: 程心短暂昏厥后睁眼完全看不见，仍转向自己认为的东方寻找太阳。
image_mechanism: 黑光以矛盾方式保留太阳的升起和辐射结构，却反转其效果，准确呈现视网膜世界的负日出。
property_alignment: 东方位置对应太阳升起；中心黑斑对应巨轮；失明扩满视野对应黑光辐射；世界不可见对应暗光覆盖。
context_alignment: 社会也正从晨光坠入食人黑暗，生理失明把文明反启蒙压成程心眼前的反太阳。
narrative_function: 把失明从医学症状提升为整段历史的视觉结论，并延续太阳不会升起的预感。
transfer_rule: 反向光源要保留光源位置、辐射方向和覆盖效果，再精确翻转亮暗属性。
failure_boundary: 外界太阳仍正常升起，黑轮只属于失明感知；不能当作客观天象或完整心理诊断。
