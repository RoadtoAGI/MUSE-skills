tenor: 四维中的蓝色空间号人员绕过皮肤骨骼、直接取出三维人体内部器官的能力
vehicle: 人伸手到近旁树枝，无遮挡地握住外露苹果并轻松摘下
ground: 目标在施行者视野中完全暴露；外层结构不构成阻挡；动作短、直接且所需力量小
