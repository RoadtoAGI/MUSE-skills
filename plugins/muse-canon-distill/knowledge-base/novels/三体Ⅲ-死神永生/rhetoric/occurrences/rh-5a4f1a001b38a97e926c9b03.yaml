chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 他们摘除你们的心脏或大脑就像从眼前的树枝上摘个苹果一样容易
sensory_mapping: 人体胸腔在四维视野中像没有树叶遮挡的枝头，心脏和大脑成了伸手可取的果实。
context_fact: 亨特胸膛无伤，心脏却已被取出；朴义君以此迫使军官不要乱动。
image_mechanism: 摘果把高维穿透从抽象拓扑降到手部动作，外壳失效与难度低同时得到说明。
property_alignment: 器官对应苹果；皮肤骨骼对应不再遮挡的枝叶；四维进入对应伸手；无创摘除对应果实脱枝。
context_alignment: 威胁在军官刚目睹心脏水母后提出，果园的轻松日常感使绝对技术差更冷酷。
narrative_function: 解释控制全舰为何无需继续交火，并给四维能力建立最低认知台阶。
transfer_rule: 高维绕过外壳可用摘果类比，但需对应目标暴露、屏障失效、动作路径和难度。
failure_boundary: 器官与身体有复杂连接，摘除并非真正苹果般无阻；类比只取四维可达性，不解释医学后果。
quality_assessment: exemplary
