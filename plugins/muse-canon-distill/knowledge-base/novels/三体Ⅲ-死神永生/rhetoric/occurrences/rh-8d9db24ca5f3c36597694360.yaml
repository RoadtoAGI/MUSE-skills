tenor: 公主在极度放松中失去身体边界感，仿佛与浴池泡沫融为一体
vehicle: 固体受热溶解，原有轮廓消失并混入周围轻盈介质
ground: 边界弱化；支撑消失；环境完全包围；个体感下降；变化带来舒适而非痛苦
