chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 感到自己在融化，成了泡沫的一部分
sensory_mapping: 她的身体轮廓像在热泡中溶开，皮肤与白泡接缝消失，只剩一团共同浮动的柔软。
context_fact: 泡浴后她不能自行移动，由女仆抱出，舒适感持续到次晨。
image_mechanism: 融化把放松推到自我边界消失，成为泡沫一部分则把环境包裹升级为材质同化。
property_alignment: 肌肉松弛对应固体融化；边界模糊对应溶入；泡沫包身对应周围介质；不愿动对应失去独立形态。
context_alignment: 空灵画师曾像雾消失，人物也会被画抹去；此处同样失形却是安全享受，语义方向相反。
narrative_function: 把王宫舒适写到近乎自我消解，强化公主离开保护性生活后的成长代价。
transfer_rule: 沉浸舒适写成融化时，应明确热源、边界变化、混入介质、主观感受和恢复方式。
failure_boundary: 身体没有发生相变，泡沫也未吸收她；过度融化若脱离舒适语境会转成伤害。
quality_assessment: effective
