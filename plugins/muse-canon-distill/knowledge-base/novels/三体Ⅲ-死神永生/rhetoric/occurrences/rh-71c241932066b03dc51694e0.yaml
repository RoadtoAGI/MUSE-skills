chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 在漆黑的背景上看出了隐隐约约的轮廓线，勾勒出一个大致的圆形，像夜空中的一个肥皂泡
sensory_mapping: 黑空透明泡；细薄圆边；微弱反光；空心球体；悬浮无重
context_fact: 超级望远镜在三体星云外三十天文单位处发现一圈极淡轮廓，后来被解释为光速飞船的曲率航迹。
image_mechanism: 看不见的低光速区像吹入太空的一只巨泡，内部和背景同黑，只在光线折射的边缘留下一圈薄亮线；观察者先看见形状，尚不知物理性质。
property_alignment: 曲率区对应肥皂泡；区域边界对应泡膜；近圆形对应球泡投影；低对比轮廓对应透明薄膜；深空对应夜空；内部空间对应泡腔；孤立悬浮对应漂浮泡泡
context_alignment: 童话已用魔泡和白色尾迹编码曲率，现实观测再次出现泡形，使信息与物证跨越两个叙事层闭合。
narrative_function: 以可辨视觉形状首次揭示光速飞船遗迹，并保留神秘感。
transfer_rule: 用肥皂泡写透明空间区域时，应匹配薄边界、圆形投影、内部近空、背景透见和微弱折射。
failure_boundary: 区域边界锐利不透明、形状不闭合，或内部充满高亮物质时，肥皂泡会误写光学性质。
quality_assessment: exemplary
