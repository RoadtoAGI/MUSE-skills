chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 在她过去的生活中，幸运的时光只是大灾难和大毁灭的间隙，她对幸运有些恐惧了
sensory_mapping: 她的幸运像灾难巨石间一条窄缝，每次刚容身体喘息，下一块毁灭便又压下来。
context_fact: 她刚逃出太阳系，抵达云天明赠星的宜居行星并收到人类导航信号，却不敢相信来者是他。
image_mechanism: 间隙把时间序列空间化，幸运不再是正面实体，只是灾难暂时缺席的负空间，因此本身带恐惧。
property_alignment: 灾难对应两侧实体；幸运时光对应缝隙；短暂安稳对应容身；预期再毁对应缝隙闭合；一生经历对应连续夹层。
context_alignment: 人类把掩体当安全间隙仍被降维，程心个人也不再相信任何局部安全可以持续。
narrative_function: 解释她面对潜在团聚为何先摇头而非欣喜，维持蓝星抵达后的情绪可信度。
transfer_rule: 好运写成灾难间隙时，应给出前后灾难、间隙时长、容身感和人物由经验形成的预期。
failure_boundary: 幸运并非必然引出灾难，程心的模式来自创伤经验；蓝星此刻也确有真实安全条件。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 程心一生中短暂幸福总夹在接连灾难之间，使她把好运视为下一次灾难前的短暂停顿
vehicle: 连续坚硬破坏层之间仅剩的狭窄缝隙，人只能暂时停在缝中，四周压力随时重新合拢
ground: 持续时间短；位于两个灾难之间；空间狭窄；不能提供长期安全；边界由灾难定义；越美好越预示下一段终止
