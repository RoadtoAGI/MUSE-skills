chapter: 【掩体纪元67年，二维太阳系】
figure_type: analogy
quote: 太空城像一艘底部破口的巨轮，在二维平面海洋上沉下去。二维平面像船内的水面，迅速上升
sensory_mapping: 椭球太空城成了一艘漏底巨轮，明亮二维水线从赤道舱底爬升，楼群一层层没入平面。
context_fact: 二维平面与建筑接触即将其展开，居民从中轴线向远离平面的方向扩散。
image_mechanism: 巨轮与水面构成完整动态模型，将维度坍缩翻译为熟悉的进水沉船过程，界面运动与逃生方向都可直觉理解。
property_alignment: 太空城对应巨轮；首次接触点对应船底破口；二维区对应进水；平面上升对应舱内水线；建筑二维化对应舱层淹没。
context_alignment: 掩体城原被视为宇宙中的安全方舟，末日时却以沉船方式毁灭，庇护结构反转为无法逃出的船舱。
narrative_function: 为后续十分钟二维化建立连续空间坐标，使复杂物理过程具有可追踪的水位和沉没节奏。
transfer_rule: 陌生灾变借沉船解释时，应形成封闭对应系统：破口、船体、水线、乘员逃向和最终沉没缺一不可。
failure_boundary: 太空城没有重力意义上的上下，二维平面也非液体进入内部；水面上升是三维结构跌向固定边界的相对效果。
