review_status: reviewed
tenor: 生态和建筑拆除后，仅剩太阳、一间房子、飞船与几个人漂在无星黑空中的小宇宙
vehicle: 儿童用少量简单图形在空白背景上画出的、比例稚拙而元素孤零的宇宙图画
ground: 元素极少；形状简化；背景空旷；比例关系幼稚；物体彼此孤立；整体可一眼看尽；带童年视角
