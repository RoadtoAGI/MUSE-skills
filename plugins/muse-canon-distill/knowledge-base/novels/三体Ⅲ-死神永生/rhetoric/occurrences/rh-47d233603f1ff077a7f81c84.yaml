chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这个简单的世界很像她小时候画过的一幅稚拙的画
sensory_mapping: 漆黑画纸上只剩一个太阳、一间小房和一艘船，构图简单得像孩子把世界缩成几个孤单符号。
context_fact: 机器人已拆走土壤、地面和大部分房屋，空气正在流失，小宇宙显出人造裸态。
image_mechanism: 儿童画用极简构图解释被拆空的宇宙，同时把文明终局拉回程心童年的最初世界想象。
property_alignment: 少数物体对应少量图形；无星黑空对应空白画纸；简化布局对应稚拙构图；微型宇宙对应儿童缩小世界；孤立悬浮对应分散符号。
context_alignment: 程心一生由普通童年走到宇宙责任，终章在拆除世界时召回她最小尺度的图画，形成生命圆环。
narrative_function: 让宏大的宇宙退场显得朴素而私人，为最后生态球的微小生命画面预热。
transfer_rule: 残余世界比作儿童画时，要列出被删减后的具体元素、构图空白、比例简化及人物童年关系。
failure_boundary: 飞船、太阳和空间都是真实复杂技术，稚拙只描述远观构图与元素数量。
quality_assessment: exemplary
