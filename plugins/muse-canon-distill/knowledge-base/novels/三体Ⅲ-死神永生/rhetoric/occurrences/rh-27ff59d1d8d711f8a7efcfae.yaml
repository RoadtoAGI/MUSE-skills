chapter: 【掩体纪元67年，“星环”号】
figure_type: analogy
quote: 这不像一个已经进入掩体、面对打击胸有成竹的世界，倒是很像三个多世纪前，不，已经是四个世纪前，三体危机刚出现时的状态
sensory_mapping: 海王星掩体的未来办公室像被四百年前的旧光照中，人的脸重新戴上PIA时代的绝望表情。
context_fact: 程心原以为掩体世界已能承受黑暗森林打击，却发现官员面对外星来客仍放弃一切般漠然。
image_mechanism: 历史类比让同一情绪跨四世纪重叠，先进空间设施未能改变人面对绝对技术差的心理底图。
property_alignment: 未知飞船对应初见三体；掩体信心崩塌对应早期无防御；官员麻木对应PIA旧气氛；实力悬殊对应宇宙强力。
context_alignment: 程心刚苏醒并观察新时代，历史记忆是她识别异常的唯一标尺，类比因此来自人物经验而非抽象判断。
narrative_function: 在揭示纸条前先否定掩体安全感，让读者意识到真正威胁超出既有末日模型。
transfer_rule: 时代状态作历史类比时，应对齐威胁结构、制度信心、群体表情和观察者跨时代记忆。
failure_boundary: 两次危机的敌人、信息量和防御条件不同；相似只指心理状态，不能推出事件必然重复。
