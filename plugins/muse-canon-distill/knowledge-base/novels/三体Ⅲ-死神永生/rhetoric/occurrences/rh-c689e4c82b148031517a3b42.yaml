tenor: 维德回头看程心时传递对云天明测试结果的判断与挑衅
vehicle: 不经声带和语言，目光本身开口说出一整句可被对方理解的话
ground: 双方共享足够背景，无需明说即可完成明确命题传递；视线具有指向、语气和轮到对方回应的结构
