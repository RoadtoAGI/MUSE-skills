chapter: 【危机纪元5-7年，阶梯计划】
figure_type: metaphor
quote: 他用目光说
sensory_mapping: 会堂寂静中，维德的眼睛成为嘴，冷光排成句子；程心也用无声目光回问，形成封闭对话。
context_fact: 云天明拒绝宣誓反而通过测试，维德借回望告诉程心这种不可预测正是需要的素质。
image_mechanism: 说把非语言理解提升为完整会话，后文逐句记录双方心中问答，证明视线承担了轮次与语义。
property_alignment: 目光指向对应说话对象；共同事件对应语境；冷笑与回望对应语气；程心内心反问对应对话回应。
context_alignment: 公开场合不便交谈，两人又长期以权力和良心互相试探，无声语言符合关系中的隐蔽对抗。
narrative_function: 在不打断宣誓程序的情况下完成两套价值判断交锋，并让维德把人的痛苦继续当作游戏。
transfer_rule: 目光如语言时，文本应给足共享语境、明确收发者和可复原内容；最好出现回应验证信息确已送达。
failure_boundary: 双方陌生、信息复杂且无共同背景时，单一目光无法可靠承载整句；读者推断不等于角色真的读心。
