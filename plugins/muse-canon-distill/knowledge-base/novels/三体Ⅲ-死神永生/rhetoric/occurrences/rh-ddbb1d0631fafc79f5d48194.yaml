tenor: 随时可能毁灭地球与三体两个文明的广播威慑，以及由罗辑个人意志维持的触发条件
vehicle: 一柄致命利剑悬在头顶，只由一根极细发丝吊住，丝断便立刻坠落斩杀下方的人
ground: 灾难始终近距离待发；整体安全压在单一、脆弱且难预测的维持点上
