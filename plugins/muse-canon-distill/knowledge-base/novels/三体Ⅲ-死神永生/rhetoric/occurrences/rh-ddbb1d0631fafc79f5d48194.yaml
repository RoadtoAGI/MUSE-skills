chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 黑暗森林威慑是悬在两个世界头上的达摩克利斯之剑，罗辑就是悬剑的发丝
sensory_mapping: 两个世界共同坐在剑锋下，广播系统化成长剑，罗辑的一念收细成吊剑发丝，每次动摇都让剑身颤动。
context_fact: 群体控制威慑度近零，只有罗辑91.9%至98.4%的毁灭意愿能令三体世界不敢进攻。
image_mechanism: 达摩克利斯之剑提供持续恐惧，发丝进一步标出控制点细弱；执剑人称谓由悬剑结构自然生出。
property_alignment: 坐标广播对应致命剑刃；两界毁灭对应剑落斩杀；罗辑个体对应单根发丝；威慑稳定对应发丝持续承重。
context_alignment: 上一句倒置金字塔已表现宏观平衡压在针尖，本句换成生命威胁并明确谁维持触发，属于机制深化。
narrative_function: 为执剑人名称提供核心物象，同时把威慑成功与文明安全的极端脆弱一次说清。
transfer_rule: 悬剑威胁应对齐受威胁者、吊点、断裂条件和坠落后果；吊材尺度要反映系统脆弱度。
failure_boundary: 若存在多个独立控制者、自动冗余或灾难并非即时触发，单根发丝会误写系统结构。
