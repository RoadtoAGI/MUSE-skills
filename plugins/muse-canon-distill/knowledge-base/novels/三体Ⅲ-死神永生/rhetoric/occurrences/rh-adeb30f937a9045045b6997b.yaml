chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 任何进入黑洞的物体都将永远固定在视界上，很像是被画入画中
sensory_mapping: 黑色视界；静止影像；平面画纸；运动冻结；边界上的人物
context_fact: 解读者试图用黑洞视界解释童话画像隐喻，但多数人认为旋涡已有明确含义，无需再设此坐标。
image_mechanism: 高速坠落物在远方观察者眼里被时间压扁并黏在视界表面，像一个活人逐渐退入画纸，只留下永不跨过边界的定格图像。
property_alignment: 黑洞外物体对应被画人物；事件视界对应画面；时间延缓对应动作定格；三维落入对应降到平面；外部观察者对应看画者；信息停留对应画像保存
context_alignment: 该解释虽最终未采纳，却用童话内部最难解的画像规则准确触及黑洞外观，体现解码的多义风险。
narrative_function: 展示专家如何建立含义坐标，也说明技术相似不足以确定云天明的唯一暗示。
transfer_rule: 用画像解释视界冻结时，应区分外部观察外观与物体自身经历，并匹配边界、定格、维度表面和信息保留。
failure_boundary: 不能由此推断物体真的物理静止或变成二维画；若采用自由落体自身视角，画中定格关系即不成立。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 外部观察者看到物体接近黑洞视界时时间无限延缓，影像仿佛永久停留在二维边界
vehicle: 三维人物被针眼画师转移到平面画像，现实身体消失而固定形象永远留在画纸上
ground: 黑洞视界对应画纸；物体影像冻结对应画像定格；三维物体进入边界对应人物被画入；外部不再见其继续运动对应现实消失；边界信息保留对应画面留下
