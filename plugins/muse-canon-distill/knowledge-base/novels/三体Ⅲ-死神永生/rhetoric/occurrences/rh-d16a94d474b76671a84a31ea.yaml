property_alignment: 两世界存亡对应全体被审；广播不可撤回对应终审；舰员表决对应法官裁决；宇宙打击对应执行死刑。
context_alignment: 星舰人刚自认超越两个世界威胁，却立刻被迫担当审判者，权力自由与责任重压同时到来。
