chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 飞船只是由帆和探测器组成，轻得像一片羽毛
sensory_mapping: 航天器的工程质量缩成掌上羽毛，核爆辐射压力成为一阵能将它推走的风。
context_fact: 阶梯方案把核弹预置在航路上，飞船只需帆接受爆炸辐射逐次加速。
image_mechanism: 羽毛不只报轻，还提供受风推动的机制图；帆面积与低质量共同转化为对辐射冲量的高响应。
property_alignment: 探测器低质量对应羽毛轻；大帆薄面对应羽片展开；辐射推动对应气流吹羽。
context_alignment: 它直接回答推重比嘲笑，把飞船从载弹重物改成被外部爆炸推动的轻帆。
narrative_function: 用熟悉动力直觉解释方案关键质量条件，使技术反转立即可懂。
transfer_rule: 工程轻量化借羽毛时，应同时对齐质量、受力面积和外部推动方式；随后最好给出实际质量指标校准夸张。
failure_boundary: 飞船若携带重设备、截面积很小或依靠自身发动机，羽毛受风机制不适用；它也不意味着结构脆弱可忽略。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 不携带核弹、仅含帆与探测器的极低质量飞船
vehicle: 空气中重量极小、易被外力推动的羽毛
ground: 相对驱动力质量极低；大面积薄结构能被微小动量轻易加速
