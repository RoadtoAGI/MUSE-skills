chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 在远处王国的海岸上出现了一支马队，像黑压压的潮水般涌上海滩
sensory_mapping: 黑色潮头；密集马群；海滩被覆；连续涌动；甲胄闪点
context_fact: 深水王子准备随公主返回时，王国岸边出现禁卫军马队，后来他们围住两艘船。
image_mechanism: 远距视野抹去单个骑手，只留下黑甲连成的移动平面；马蹄让边缘翻涌，整支军队像涨潮一样把空海滩迅速吃掉。
property_alignment: 骑士群对应潮水；前排骑兵对应潮头；黑色盔甲对应暗色海水；马队推进对应涨潮；海滩占满对应潮水漫滩；难以阻挡对应水势压力
context_alignment: 饕餮鱼刚构成海中危险，岸上军队又以潮水形态出现，使公主从一种包围进入另一种包围。
narrative_function: 以整体运动放大禁卫军人数和压迫感，迅速转换返航后的威胁。
transfer_rule: 用潮水写人马推进时，应匹配连续密度、宽阔前锋、覆盖地面、同向涌动和难以逐个分辨。
failure_boundary: 队伍稀疏单列、静止列队或颜色明亮分散时，黑潮会夸大连续性与覆盖范围。
quality_assessment: effective
