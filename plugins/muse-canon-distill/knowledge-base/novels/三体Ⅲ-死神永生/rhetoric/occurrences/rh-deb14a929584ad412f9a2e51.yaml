chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 历史学家把它称为危机幼稚症
sensory_mapping: 整个人类文明被置于诊室，面壁与群星计划成为可列举的症状，危机年代成为发病期。
context_fact: 文本将群星计划和面壁计划列为典型，并追问文明面对空前冲击时为何产生非正常反应。
image_mechanism: 幼稚先说明能力阶段，症再把分散事件组织为同一病理表征，使历史评价兼具年龄差与诊断感。
property_alignment: 文明经验不足对应儿童未成熟；荒唐政策对应外显症状；危机触发对应发病诱因；后来恢复判断对应阶段过去。
context_alignment: 危机迫使文明进入全新生存环境，旧经验骤然失效，集体反应确有适应期而非单一政策失误。
narrative_function: 给群星计划的历史插叙设定总框架，并把个人赠星故事嵌入文明失常与偶然遗产之中。
transfer_rule: 以疾病命名历史阶段时，应明确症状群、诱因和时间边界；诊断要解释多个事件而非只作贬称。
failure_boundary: 若行为长期稳定且是充分知情后的理性选择，幼稚症会把价值分歧误写为能力缺陷；文明也没有真实生理年龄。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 三体危机初期人类社会做出的一系列短视、失常而后来难以理解的集体行为
vehicle: 儿童心智尚未成熟时出现、具有共同症状和阶段性的幼稚疾病
ground: 判断能力未适应新环境；多个异常举动共享病因并集中出现在文明转型早期
