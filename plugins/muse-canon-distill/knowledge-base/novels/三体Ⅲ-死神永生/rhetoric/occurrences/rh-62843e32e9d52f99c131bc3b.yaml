chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 目光像一只惊恐的老鼠
sensory_mapping: 抽象目光实体化成一只在面部活动的小动物，视线闪烁和身体瑟缩共享同一惊惧节奏。
context_fact: 皇帝回头审视狄奥伦娜，她裹紧斗篷、瑟瑟发抖，处于权力与异能暴露的双重压力下。
image_mechanism: 老鼠把视线游移写成逃窜冲动，也把她的社会弱势压缩为小型猎物；局部目光与整只动物形成感官跨接。
property_alignment: 目光闪避对应老鼠寻找逃路；身体发抖对应受惊小兽颤动；被皇帝审视的弱势位置对应老鼠暴露于捕食者前。
context_alignment: 她拥有可怖能力却仍是受审底层女子，胆怯动物与超强力量的不对称保留人物矛盾。
narrative_function: 在奇术成功后阻止人物变成自信巫师，让社会性恐惧继续主导其外在表现。
transfer_rule: 将目光比作动物时，动物运动路径应能由视线表现，并由人物权力位置补足捕食关系。
failure_boundary: 文本没有明写视线游移，因此目光与整只老鼠的语法跨度偏大；若她直视皇帝，喻体会直接失效。
