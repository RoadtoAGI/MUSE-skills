chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: metaphor
quote: 世上万事在程心的心中都磨砺得如同眼前这块巨石一样圆润，维德就是这块石头上唯一仍然锐利的地方
sensory_mapping: 圆润巨石；岁月摩擦；唯一尖角；手指被割；暗处冷硬表面
context_fact: 程心经历多次世纪与危机后已较坦然，但八年未见的维德仍让她打寒战并难以保持声音平静。
image_mechanism: 她的精神世界被压成手中巨石，经历像沙水把所有棱角磨平；维德却作为一枚未钝化的石刺保留，触到便重新割开旧伤。
property_alignment: 程心心境对应巨石；多年经历对应磨料；世事冲击对应原有棱角；成熟平静对应圆润表面；维德对应尖锐突起；紧张反应对应触碰割伤；唯一例外对应单一锐点
context_alignment: 眼前真实试验巨石已被磨成圆形道具，物理景物直接承载程心对维德的心理例外。
narrative_function: 用一块石头概括人物多年变化，并重新确立维德仍能伤及她的关系张力。
transfer_rule: 用磨圆石头写情绪钝化时，应有长期磨料、多数棱角消失、触感变化、唯一残锐和触碰后果。
failure_boundary: 人物对多数事仍反应剧烈，或维德已不再影响她时，圆石与唯一锐点都不成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 多年经历使程心能平静接纳多数事物，唯独维德仍能刺破她的防御、引发恐惧和冲突
vehicle: 一块石头经长期摩擦磨去棱角，整体圆滑，只有一个尖锐突起仍能割伤触碰者
ground: 万事淡化对应石面磨圆；时间经历对应持续磨砺；情绪平和对应无棱角；维德对应残留锐点；难以冷静对应被尖处刺伤
