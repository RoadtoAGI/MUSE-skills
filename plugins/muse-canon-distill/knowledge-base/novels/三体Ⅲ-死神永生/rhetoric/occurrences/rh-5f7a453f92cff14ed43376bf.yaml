chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 银河系像一大片掩盖血迹的冰渍
sensory_mapping: 银亮银河不再是星海，而像一层冻白污痕抹过黑空，把看不见的文明血迹盖在冰下。
context_fact: 她刚得知宇宙规律被战争反复改写，现有宇宙可能是无数文明毁灭后的结果。
image_mechanism: 冰渍将银河美感翻成犯罪现场遮盖物，白银光带取得寒冷、污染和掩血三重性质。
property_alignment: 银色银河对应冰；星带范围对应大片渍痕；宇宙战争对应血迹；未知历史对应被遮盖；程心寒冷感对应冻结。
context_alignment: 太阳系后方曾如血红，银河此刻以冰覆盖更大的血，个体灾难被纳入宇宙长期暴力层。
narrative_function: 用一幅反美图像重写熟悉银河，使关一帆的理论直接改变程心视觉。
transfer_rule: 美丽景物写成遮血冰渍时，应让颜色、温度、覆盖层、隐藏历史和人物新知共同支持。
failure_boundary: 银河没有真实冰层或血迹，宇宙战争史也未被直接观测；图像是恐惧后的主观重释。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 在程心恐惧视角中，冰冷银白的银河横跨黑空并似乎遮住宇宙战争留下的毁灭痕迹
vehicle: 大片冻结、苍白寒冷的冰污覆盖在暗红血迹上，表面洁白而下面藏着伤害
ground: 范围广大；色泽冷白；表层遮盖；下方暗含血红与暴力；质感污浊凝结；美观外表掩住死亡证据
