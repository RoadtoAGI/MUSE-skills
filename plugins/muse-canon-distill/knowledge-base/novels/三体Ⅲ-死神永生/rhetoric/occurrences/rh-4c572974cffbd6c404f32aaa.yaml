chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 两支长桨在他手中像一对飞翔的翅膀，推动着小船平稳前行
sensory_mapping: 双翼展开；节律拍动；船身滑行；肌肉发力；海面飞翔
context_fact: 长帆在海上比陆地更自如，独自操桨载着公主和宽姨穿过饕餮鱼海域。
image_mechanism: 桨叶离水、入水的弧线被抬到空中成为拍翼轨迹，小船不再笨重划行，而像由长帆双臂长出的翅膀托着从海面飞过。
property_alignment: 左右船桨对应左右双翼；桨叶对应翼面；划桨节拍对应拍翼；水阻反推对应空气升力；船前进对应鸟飞行；平稳航向对应两翼协调
context_alignment: 危险水域中没有帆，长帆本人以肌肉和双桨补成飞行器官，兑现其名字和天生水手身份。
narrative_function: 把艰苦划行写得轻盈有力，表现卫队长保护公主时的行动能力。
transfer_rule: 用翅膀写成对桨具时，应匹配左右对称、周期摆动、介质反推、稳定前进和操作者身体延伸。
failure_boundary: 只有单桨、动作杂乱失衡、船原地打转或主要靠风机推进时，双翼模型会误写动力。
quality_assessment: exemplary
