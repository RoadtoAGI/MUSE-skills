quote: 失明后听觉变得格外灵敏，几乎像第三只眼一样
sensory_mapping: 耳中旋翼声像光点在黑暗里移动，升降、远近和悬停轨迹被这只无形眼睛逐段看见。
context_fact: 程心听出直升机在两公里外弗雷斯家降低悬停、再升空远去。
image_mechanism: 第三只眼不只说灵敏，而把声音处理结果定义为空间图像，显示听觉正在接管视觉任务。
property_alignment: 声源方向对应视线方向；音量变化对应远近；旋翼动态对应目标轨迹；听觉补偿对应新增眼睛。
context_alignment: 失明章节持续把声音转成潮水和枯林，此处完成从恐怖声场到可用导航感官的变化。
narrative_function: 让程心确认救援者接走AA和弗雷斯，并显示她在黑暗中开始恢复判断能力。
transfer_rule: 感官替代类比应指出原感官任务、替代信号和重建出的空间信息。
failure_boundary: 听觉不能识别颜色、形状或被静音目标，第三只眼只适用于发声物的方向追踪。
