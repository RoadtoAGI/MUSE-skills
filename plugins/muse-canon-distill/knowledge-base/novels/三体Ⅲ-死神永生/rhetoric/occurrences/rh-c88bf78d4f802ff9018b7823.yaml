chapter: 【掩体纪元67年，银河系猎户旋臂】
figure_type: metaphor
quote: 这一连串事件构成了一个不祥的图景，昭示着危险
sensory_mapping: 事件成线；记录拼图；暗图显形；危险入画；观察者辨兆
context_fact: 歌者把不同时间的通信记录联系起来，推断太阳系坐标已暴露却未自我封闭，因而比三体世界更危险。
image_mechanism: 分散在数据库中的时间节点被拉到同一平面，因果线索像笔画互相补全；当最后一笔落下，原本不可见的未来危险以暗色画面显现。
property_alignment: 各次通信对应图中元素；先后间隔对应构图距离；记录组合对应拼画；共同指向对应画面主题；风险结论对应不祥色调；歌者分析对应观图；未来行动对应图景预示
context_alignment: 歌者依赖直觉从信息细节识人，图景延续视觉化推理，使其越权关注太阳系具有连贯认知方式。
narrative_function: 压缩跨数十时间颗粒的事件链，清楚呈现歌者为何把太阳系判为必须清理的目标。
transfer_rule: 用图景写证据合成时，应让每个事件承担不同画面元素，只有组合后才出现可辨主题，并明确观看者由何处读出风险。
failure_boundary: 单一事件已足以定论、各记录彼此无因果关系，或组合仍无法支持结论时，成图会掩盖证据跳跃。
quality_assessment: conventional
confidence: 0.98
review_status: reviewed
tenor: 三次通信、再次坐标广播及随后第三方广播组合后，共同显示人类既暴露又未进入慢雾，因而具有扩张威胁
vehicle: 分散线条和色块按关系拼合成一幅完整画面，观看者从整体形状直接看出灾祸征兆
ground: 单个事件对应画面元素；时间顺序对应构图关系；组合分析对应成画；总体风险对应不祥主题；歌者判断对应观看；未来威胁对应图景昭示
