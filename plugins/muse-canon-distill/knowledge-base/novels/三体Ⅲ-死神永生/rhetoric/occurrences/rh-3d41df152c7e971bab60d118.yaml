chapter: 【广播纪元8年，地日拉格朗日点】
figure_type: simile
quote: 石块被画得不像木星，倒像一头太空怪兽，大红斑就是它的眼睛
sensory_mapping: 岩石兽身；条纹皮肤；红色独眼；暗空潜伏；突然被光照醒
context_fact: 工程师把试验巨石画成木星，但不规则外形破坏行星效果，稍后蓝焰会照亮红斑。
image_mechanism: 圆行星的绘画落在崎岖石体上，条纹随棱角扭曲成兽皮，红斑从装饰集中成瞳孔；一块道具石因此获得等待睁眼的生命。
property_alignment: 小行星对应怪兽；岩面起伏对应兽体；木星条纹对应皮纹；大红斑对应巨眼；阴影对应潜伏黑暗；推进器照明对应眼睛睁开；试验危险对应怪兽威胁
context_alignment: 试验本想模拟巨行星，失败的涂装反而把维德冷酷对话外化为一只监视程心的眼。
narrative_function: 给测试道具建立威胁意象，并为红眼骤亮和程心紧张埋伏。
transfer_rule: 用独眼怪兽写不规则天体时，应由整体躯体、表面纹理、单一醒目斑点、暗中悬浮和后续光变支撑。
failure_boundary: 石体规则圆整、红斑众多无视觉中心，或场景明亮温和时，怪兽独眼会失去形态依据。
