tenor: 画有木星条纹和大红斑的不规则小行星整体轮廓，在暗空中显得像带独眼的生物
vehicle: 一头潜伏太空的巨大怪兽，身体表面有斑纹，唯一红色巨眼从黑暗中注视来客
