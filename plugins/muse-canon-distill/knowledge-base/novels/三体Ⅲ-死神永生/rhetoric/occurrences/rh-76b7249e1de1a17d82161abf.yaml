chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 现在这个希望成了泡影。其实，在二百八十六光年之外、四个世纪之后的一个约会本来就是泡影
sensory_mapping: 跨越二百八十六光年的约会像一个映着星光的泡泡，她抵达时才发现其中没有可握住的人。
context_fact: 云天明位置未知，三体舰队亦无确切消息；关一帆等到的只有程心和AA。
image_mechanism: 泡影将希望的视觉完整与实体空缺并置，光年和世纪越巨大，泡膜反而越显不可能承重。
property_alignment: 团聚想象对应泡中影；未知位置对应空心；时间距离对应薄膜压力；抵达未见对应破泡；精神支撑消失对应无痕。
context_alignment: AA的话曾像水滴滑过，程心希望又成水泡；水意象从无法渗入的劝慰转为无法承重的愿望。
narrative_function: 宣告约会线当下失败，并把程心精神死亡的直接触发物凝成脆弱图像。
transfer_rule: 希望比作泡影时，应说明它反射的具体愿景、空心证据、破裂时刻和破后损失。
failure_boundary: 尚无证据证明云天明永远无法出现，泡影是程心此刻判断，不是叙事全知结论。
quality_assessment: conventional
confidence: 0.99
review_status: reviewed
tenor: 程心相信能在赠星与云天明团聚的希望，在抵达后因长期无消息而显出无法实现
vehicle: 水面薄泡反射出完整美丽影像，却空心脆弱，轻触或片刻后便破灭不留实体
ground: 外观美好；内部空无；持续时间有限；容易破裂；难以抓住；依赖表面条件；破后不留实物
