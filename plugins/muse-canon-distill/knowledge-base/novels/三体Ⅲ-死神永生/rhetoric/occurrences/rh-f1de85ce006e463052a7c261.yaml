chapter: 地球文明
figure_type: analogy
quote: 可你别说，还真的找到了一亿年前留下来的信息，当然不是人类留下的，是恐龙的脚印
sensory_mapping: 现代存储器纷纷衰变后，地层里一枚粗糙脚印反而像最耐久的信息页，穿过一亿年仍可阅读。
context_fact: 量子存储器寿命数千年，特殊印刷品约二十万年，研究者据此转向把字刻在石头上。
image_mechanism: 把足迹重新分类为信息，使低技术压痕与高技术存储进入同一寿命比较，答案的反差自然显现。
property_alignment: 足印轮廓对应编码；岩层对应介质；古生物学家辨认对应读取；一亿年地层对应保存期；无意留痕对应被动写入。
context_alignment: 后文“留下脚印比创造世界更难”正由此事实生长，恐龙无意完成了人类神级技术做不到的事。
narrative_function: 为石刻方案提供经验依据，并把整段文明时间哲思锚定在一个具体史前痕迹。
transfer_rule: 自然痕迹类比信息载体时，应明确编码内容、介质、读取者、保存机制和有意无意之别。
failure_boundary: 脚印只传递有限形态信息，不能保存恐龙文化或完整生命；其保存也依赖罕见地质条件。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 能够跨越一亿年保存、让后来者辨认出远古生物活动的信息载体
vehicle: 恐龙踩过地面留下的脚印在地层中固化，向后世传递形状、步态与存在证据
ground: 由物理刻痕承载；内容极少却可辨；材料与环境共同保存；无需供能；跨越地质纪年；留下者无意传播
