figure_type: analogy
quote: 这三人面对史耐德就像面对一个电脑查询界面一样
sensory_mapping: 史耐德身体变成屏幕，军官语句成为检索框输入，回答成为无情感结果列表。
context_fact: 他穿囚服回到曾经的家交接系统，接收者冷淡且不说任何多余的话。
image_mechanism: 界面模型精确说明冷漠不是敌意爆发，而是彻底工具化：人只剩可访问知识库功能。
property_alignment: 技术提问对应查询输入；等待回答对应系统返回；无礼貌闲话对应机器协议；囚犯身份被忽略对应界面无人格。
context_alignment: 新部队已抹去旧船员生活痕迹，对人和舰都只保留功能，查询界面完成同一去人格化。
narrative_function: 用交互结构呈现制度性排斥，比直接说冷酷更具体。
transfer_rule: 人物界面化应由输入—输出节奏、信息单一目的和社交信号消失共同支撑；不能只因对话简短。
failure_boundary: 若军官表达同情、进行协商或关注史耐德经验，纯查询协议就被打破。
