tenor: 被光粒在三体恒星光球层和对流层击出的五万千米亮孔
vehicle: 高温熔炉敞开的炉门，门内炽白火焰和强热辐射直接向外喷照
ground: 开口通向极高温内部；亮度强烈；热辐射从孔洞直射外界；靠近者会被迅速灼毁
