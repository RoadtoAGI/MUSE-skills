chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 它像熔炉的大门
sensory_mapping: 太阳表面裂开一扇炽白炉门，千万度深层火光从门洞直泼向行星，地表生命瞬间焦黑。
context_fact: 光粒击穿恒星外层，强辐射不再被光球、对流层和色球层阻挡，直接照到三体行星。
image_mechanism: 熔炉门把多层恒星结构压成一道隔热屏障，破孔等于开门，内部热量取得直线出口。
property_alignment: 恒星外层对应炉壁；裂孔对应炉门；内部辐射对应炉火热浪；行星灼烧对应门外物体受烤。
context_alignment: 毁灭过程从远距天文事件落到工业热源常识，门的开启也准确说明为何几秒内半球生命焦化。
narrative_function: 在给出孔径数字后补上热传递直觉，让读者理解第一阶段杀伤机制。
transfer_rule: 高温天体孔洞如炉门时，应对应隔热外壳、开口路径、内部热源和门外受害区域。
failure_boundary: 恒星没有门框或人工炉膛，孔也不是主动开启；炉门模型不解释光粒撞击和核反应。
