chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 飞船流线型的光洁机体像一面大哈哈镜，把二维行星的映像拉成流畅的长条
sensory_mapping: 两颗圆形行星落到银亮船壳上，被弧面一抻，像哈哈镜里拖成长带的脸。
context_fact: 程心和AA搬着古代文物走向飞船，二维行星的冷光照亮白色降落场。
image_mechanism: 哈哈镜把船体曲率造成的光学畸变变成熟悉游乐经验，轻松物象却反射行星毁灭，产生错位。
property_alignment: 光洁船壳对应镜面；流线弧度对应曲面；行星映像对应镜中像；长条畸变对应哈哈镜拉伸。
context_alignment: 二维化已把行星本体变成平面图像，飞船镜面又对图像二次变形，现实层级不断被压成可观看图案。
narrative_function: 在巨大灾象与小小归家动作之间安插具体反光细节，并显出星环号坚固流畅的外形。
transfer_rule: 曲面反射比作哈哈镜时，应写明镜面材质、曲率方向、原像和可见畸变结果。
failure_boundary: 船体不是供娱乐的镜子，反射也不一定清晰；哈哈镜只解释映像拉长这一光学效果。
