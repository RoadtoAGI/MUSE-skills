tenor: 澳大利亚断电断粮后将发生暴力、饥饿和食人的生存环境
vehicle: 痛苦无休、人与人互相折磨且无法逃离的地狱落到人世
ground: 居民被封锁不能离开；苦难由环境持续施加；死亡和道德崩坏成为日常
