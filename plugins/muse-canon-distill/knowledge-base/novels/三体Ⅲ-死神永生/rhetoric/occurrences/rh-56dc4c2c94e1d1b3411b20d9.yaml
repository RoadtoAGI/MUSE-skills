chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 这里很快就变成人间地狱了
sensory_mapping: 沙漠大陆边界像地狱之门合拢，饥饿、枪声和食人把活人区逐层烧成刑场。
context_fact: 治安军指挥官劝失明的程心离开；智子已宣布断电并让四十多亿人互相当粮食。
image_mechanism: 人间地狱把未来社会同时定位为现实地点和极端惩罚场，强调苦难不是死后想象而是即将发生。
property_alignment: 大陆封锁对应地狱无出口；饥饿互食对应持续刑罚；四十亿受困对应群体受难；秩序崩坏对应恶境统治。
context_alignment: 威慑纪元天堂早已反转为移民地狱，此处由主观抱怨升级为有食人机制支撑的现实判断。
narrative_function: 给程心最后一次离开机会标明后果，并显示连治安军执行者也理解计划性质。
transfer_rule: 场所称人间地狱时，应具体落实封闭、持续痛苦、死亡机制和道德崩坏。
failure_boundary: 三个月后的具体过程尚未发生，部分人可能逃生；地狱是风险总括而非每处同等惨烈。
