chapter: 【威慑纪元13年，审判】
figure_type: metaphor
quote: 太空本身就是一个思想钢印
sensory_mapping: 无边太空化成巨大印模，返航可能一消失便压入每名舰员意识，把个人轮廓印成集体细胞。
context_fact: 史耐德称得知飞船成为全部世界后，五分钟内多数舰员放弃自我，接受攻击同类以求集体生存。
image_mechanism: 本身二字取消了秘密设备，环境即施压器；钢印的坚硬与一次成型解释转变为何迅速、统一而难逆。
property_alignment: 永不返航对应印模压下；价值骤变对应一次盖印；集体极权共识对应相同图案；恢复地球思维困难对应钢印难除。
context_alignment: 思想钢印是作品内已有强制认知技术，人物借它解释物理处境如何达到类似效果，世界设定与心理变化同构。
narrative_function: 为黑暗战役中的道德转型提供核心因果形象，并挑战地球法庭把行为仅视作个人犯罪的理解。
transfer_rule: 环境如思想印模时，应说明触发条件、压印速度、共享信念和不可逆度；改变必须超出普通态度波动。
failure_boundary: 仍有明确归途、成员价值分化明显或转变可轻易撤销时，钢印会过度决定论；环境也没有真实精神控制装置。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 永远失去地球归途的深空环境对舰员价值观、自我边界和集体生存逻辑的瞬间重塑
vehicle: 不可逆地压入大脑、强制固定一套信念并排除原有判断的思想钢印
ground: 外部条件无需逐步说服便造成骤然认知转变；改变深入人格，并让群体成员共享同一价值指令
