chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 却两次以爱的名义把世界推向深渊
sensory_mapping: 她双手想护住世界，却在两个临界点上把它向前一推，越过威慑与光速技术的崖沿。
context_fact: 威慑终止招致三体入侵，曲率研究终止可能延误光速飞船和黑域，太阳系最终被二维化。
image_mechanism: 推向深渊把善意决策与灾难后果放在同一身体动作中，爱的方向和世界运动方向形成伦理悖论。
property_alignment: 程心决策对应推力；人类文明对应世界；技术临界对应崖边；政策不可逆对应越界；毁灭对应坠渊；爱对应主观名义。
context_alignment: 空间正在跌向二维深渊，程心内心把物理坠落重新归因于自己的两次推动，外灾与罪责合形。
narrative_function: 浓缩程心自我审判的核心矛盾：保护生命的伦理为何在宇宙环境中产生致命结果。
transfer_rule: 善意造成灾难可用推崖模型，但应明确动机、临界点、因果链、不确定性和不可挽回部分。
failure_boundary: 世界毁灭由多重主体和黑暗森林规则造成，程心没有单独物理推动；该句是强烈的事后责任框架。
