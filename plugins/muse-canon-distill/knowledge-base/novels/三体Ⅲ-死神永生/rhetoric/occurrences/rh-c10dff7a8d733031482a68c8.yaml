tenor: 程心出于保护生命与反对暴力作出的两次决定，事后看来使人类走向无法挽回的毁灭
vehicle: 掌权者以善意名义从高处施力，将整个世界推过悬崖边缘坠入无底深渊
ground: 施力者有行动权；动机与结果相反；对象规模巨大；越过临界点后不可返回；结局是毁灭；深处无法挽救
