chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 公主会感到身体变得面条般柔软
sensory_mapping: 热泡沫把四肢泡得像熟面条，关节不再用力，身体沿水面软软铺开。
context_fact: 她舒服得不愿动，只能由女仆抱出浴池、擦干并送上床。
image_mechanism: 日常食物的煮软状态把肌肉放松夸张成结构失稳，兼具童话口吻和触觉幽默。
property_alignment: 放松肢体对应软面；热水浸泡对应煮制；无法自行起身对应失去支撑；女仆抱起对应需要托盛。
context_alignment: 逃亡让身体僵硬疲劳，回忆中的面条柔软成为她最强烈的宫廷舒适对照。
narrative_function: 把抽象舒服写成可弯可托的身体状态，并引出融入泡沫的进一步幻想。
transfer_rule: 身体松弛比作软食物时，应对应处理条件、支撑变化、弯曲程度和他人托举需求。
failure_boundary: 人体仍保有骨骼和主动运动能力，面条的湿滑与断裂不能外推。
quality_assessment: effective
