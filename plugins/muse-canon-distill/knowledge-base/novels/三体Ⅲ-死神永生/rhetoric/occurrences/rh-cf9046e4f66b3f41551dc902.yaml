review_status: reviewed
tenor: 热水和泡沫包裹下公主全身肌肉松弛、无力维持姿势的舒适感
vehicle: 煮软面条失去硬挺支撑，可任意弯曲并顺着承托面垂落
ground: 柔软度高；支撑力降低；身体可弯曲；需要外力托抱；状态来自浸泡
