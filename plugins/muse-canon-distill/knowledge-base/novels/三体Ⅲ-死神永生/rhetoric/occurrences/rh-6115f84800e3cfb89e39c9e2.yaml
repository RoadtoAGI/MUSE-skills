chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 现在回望危机纪元之初的阶梯计划，就是这样一种东西。它试图用当时的落后技术把一个很轻的载荷推进到光速的百分之一
sensory_mapping: 核弹和帆被摆成现代火龙的母箭与子箭，一次次爆炸如连发弩推进轻载荷，古代兵器轮廓套入星际航线。
context_fact: 人类没有高性能发动机，只能预置一千余枚核弹，以连续脉冲将极轻飞行器推至百分之一光速。
image_mechanism: 历史类比把先进组合与落后部件拆开评价，既承认设计聪明，又提前限定其无法替代基础技术跃迁。
property_alignment: 成熟核弹对应旧火箭箭矢；航线布设对应武器重新组合；准相对论速度对应貌似超时代能力；计划局限对应古兵器未成现代武器。
context_alignment: 叙述站在后世回望，正适合用已知古代技术失败评价危机初期的孤注一掷，而不削弱当时突破意义。
narrative_function: 为阶梯计划作历史定位，在壮丽发射之前同时保留聪明、原始与注定有限三种评价。
transfer_rule: 历史技术类比应对齐部件水平、组合创新、目标能力和最终上限；相似项与时代差距都要明确。
failure_boundary: 若方案依赖真正的新基础原理并开启成熟产业链，古兵器拼装会低估创新；表面组合相似也不等于性能机制相同。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 阶梯计划用成熟核弹、辐射帆和精密控制组合出远超当时常规宇航水平的能力
vehicle: 火龙出水与连发弩把落后的火箭和弓箭重新编排，试图提前获得两级导弹与机关枪效果
ground: 单项技术均落后，创新集中在组合顺序；系统短暂逼近未来能力，却难真正开启对应技术时代
