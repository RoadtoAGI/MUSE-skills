quote: 产生这样自我复制的分子链的几率如此之小，如同一阵龙卷风卷起一堆金属垃圾，落下后就组装成一辆奔驰车一般
sensory_mapping: 分子的微观碰撞被放大成废铁在风柱中翻飞，风停后杂乱声响突然凝成一辆完整汽车。
context_fact: 程心在倒计时中回想生命起源，叙述强调自复制分子出现后才开启三十五亿年演化。
image_mechanism: 把不可直觉的组合概率换成机械装配：读者知道风能搬动物件，却不能承担选件、排序和精密连接。
property_alignment: 随机分子碰撞对应龙卷风乱卷；复杂分子结构对应汽车零件体系；正确自复制关系对应车辆完整装配；罕见成功对应反常落地结果。
context_alignment: 宏大生命史从一次微小偶然起步，工业废料与成车的尺度足以让程心感到这份偶然不可轻弃。
narrative_function: 把概率悬殊转成常识性惊异，为她拒绝终止生命进程提供感性重量。
transfer_rule: 解释极低生成概率时，应让喻体中的随机机制、部件复杂度与目标结构精度逐项对应。
failure_boundary: 龙卷风模型忽略化学选择、复制后的累积演化与漫长试验次数，只说明一次随机装配的反常程度。
