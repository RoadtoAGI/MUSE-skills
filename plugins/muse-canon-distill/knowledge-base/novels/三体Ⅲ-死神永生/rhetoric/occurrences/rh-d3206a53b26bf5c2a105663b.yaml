chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 画中的公主让他感到这阴暗的画室如天国一般明亮起来
sensory_mapping: 阴室亮起；圣洁天光；画中眼睛；黑暗退散；救赎空间
context_fact: 长帆来烧毁控制公主生死的画像，看到画中人后被美与目光摄住，片刻后才清醒行动。
image_mechanism: 画像本身并未发光，长帆的注意却把残烛空间全部改写成天国；公主面容像唯一光源向墙角扩散，危险画室短暂失去阴影。
property_alignment: 公主画像对应天国光源；画室黑暗对应尘世阴影；找到所爱对应获得救赎；画像美感对应圣洁光辉；陶醉凝视对应信徒沉浸；烧画使命对应从幻境醒来
context_alignment: 上一句画室像地堡，本句以天国反照；极端明暗转换准确表现爱意几乎妨碍救援的瞬间。
narrative_function: 让长帆烧画前经历一次美的阻力，证明行动不是无感破坏而是克服陶醉。
transfer_rule: 用天国明亮写人物带来的情绪照明时，应有原先黑暗、核心人物光源、救赎关联、感受主体和随后行动代价。
failure_boundary: 人物只觉得画像技法高超、无爱慕救赎情绪，或房间本就明亮时，天国光会失去心理转化。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 长帆在阴冷昏暗画室看到露珠公主画像后，因爱慕与希望而感到整个空间骤然明亮美好
vehicle: 宗教想象中充满纯净光辉、幸福与救赎，没有阴影的天国
ground: 公主美丽对应天国光辉；找到画像对应获得救赎；阴室情绪转亮对应进入天堂；长帆陶醉对应信徒幸福；画中目光对应神圣召唤
