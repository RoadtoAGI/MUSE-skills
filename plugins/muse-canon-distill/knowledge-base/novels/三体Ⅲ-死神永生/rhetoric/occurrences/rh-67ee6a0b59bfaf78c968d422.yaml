chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 像看到幽灵似的
sensory_mapping: 直勾勾的目光获得撞鬼后的身体冻结感，尚未说出的事实先以面部反应显形。
context_fact: 他将报告战俘头部完整而大脑被隔空取出，此刻只先说几乎拿到了。
image_mechanism: 幽灵把事件的不可能提前投射到看者脸上；皇帝虽是正常对象，法扎兰却像仍透过他看到地堡残影。
property_alignment: 目光僵直对应撞见幽灵后的冻结；震惊难言对应常识被超自然打破；持续盯视对应恐惧对象无法回避。
context_alignment: 中世纪人物能直接理解幽灵恐惧，喻体符合时代经验，并为隔墙取脑提供适度预告。
narrative_function: 让人物反应先于事实抵达，形成短暂悬念并标定事件的认知冲击等级。
transfer_rule: 揭示异常事实前，可用见证者像看见某物的反应作预告；对象应属于该时代最直接的禁忌经验。
failure_boundary: 若后文只是普通坏消息或法扎兰仅感悲伤，幽灵会虚高异常等级；时代人物不共享亡灵观念时，预告也无法即时生效。
