chapter: 【掩体纪元66年，太阳系外围】
figure_type: simile
quote: 有过载却无加速，像被某种力量钉死在太空中
sensory_mapping: 几千米火流向后喷射，飞船却像被无形巨钉穿过船心，牢牢固定在黑色宇宙板上。
context_fact: 二维空间扩展使周围三维空间反向流动，恰好抵消飞船的加速。
image_mechanism: 钉死把参照系抵消转成固定约束，人员感到推力却看不到位移的矛盾因此获得机械图像。
property_alignment: 飞船对应被钉物；空间流动对应固定力；发动机推力对应拔拉；无位移对应钉牢；超重对应材料受力。
context_alignment: 纸条曾像宇宙基准面绝对不动，如今其二维空间反过来把人类飞船也变成相对静止物。
narrative_function: 用一句标记逃跑失败，促使白Ice说明空间流动和光速逃逸条件。
transfer_rule: 有力无位移写成钉固时，应分别说明驱动力、约束来源、参照位置、内部受力和挣脱阈值。
failure_boundary: 没有实体钉子，飞船其实随空间向二维面加速；静止只相对导航参照短暂成立。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 启示号发动机全推力、人员承受过载，导航却显示飞船相对外界没有前进
vehicle: 钉子穿透物体并把它固定在坚硬底板上，物体受拉仍无法移动
ground: 外力持续施加；位置保持不变；存在不可见固定作用；挣脱需要超过约束；主体承受内部应力
