figure_type: metaphor
quote: 这黑暗竟成为一种保护，因为这黑暗之外是更恐怖的所在
sensory_mapping: 浓黑沥青不再只封眼，而在她四周凝成壳层，把枪声背后的食人画面挡在外面。
context_fact: 程心完全失明，周围骚动、枪声和惨叫加剧，食人危机即将展开。
image_mechanism: 把残疾从损失反转为护罩，比较黑暗本身与黑暗之外现实的恐怖等级。
property_alignment: 视觉黑暗对应不透明层；看不见暴行对应遮挡；心理少受冲击对应保护；外部混乱对应壳外危险。
context_alignment: 此前她一直试图看清并承担世界，此刻世界恐怖到失去观看能力反成唯一庇护。
narrative_function: 将个人失明与文明黑暗分层，并强调后者已超出感官可承受范围。
transfer_rule: 剥夺性状态反写为保护时，应明确它阻断的通道、挡住的对象和仍付出的代价。
failure_boundary: 失明也令程心更易受伤且不能长期保护心理；若外界需要视觉逃生，黑暗会增加风险。
