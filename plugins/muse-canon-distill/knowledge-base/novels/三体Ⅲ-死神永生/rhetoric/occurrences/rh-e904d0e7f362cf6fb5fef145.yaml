chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 被称为“太空狼烟”
sensory_mapping: 太阳闪烁和大功率电波化成宇宙烽火台上的烟柱，在黑暗中升起，既报信也标出发信者所在。
context_fact: 环太阳核弹链以太阳闪烁广播坐标，电磁波在太空衰减畸变快，后来被引力波广播取代。
image_mechanism: 狼烟同时携带原始、远望和暴露三层属性，比泛称旧技术更准确呈现黑暗森林通信的危险代价。
property_alignment: 电磁广播对应烟柱信号；恒星级功率对应高烽火；坐标暴露对应标出位置；衰减有限对应视距受限；技术落后对应古代手段。
context_alignment: 黑暗森林中发信相当于在危险边疆点火，狼烟来自既有森林战争语境，也衔接威慑武器演化。
narrative_function: 以历史通信物象概括第一代威慑手段局限，为引力波广播的远距优势建立参照。
transfer_rule: 通信如狼烟时，应对应载体可见性、传输距离、信息容量和暴露风险；原始性要有后继技术比较。
failure_boundary: 加密、定向且不可反向定位的通信不适合狼烟；引力波全向广播虽也暴露位置，传播机制不同。
quality_assessment: effective
confidence: 0.97
review_status: reviewed
tenor: 用可见光和其他电磁波向宇宙广播坐标的早期星际通信手段
vehicle: 边疆点燃、靠远处观察烟柱传递简单警报或位置的古代狼烟
ground: 信号技术原始且容易被远方看见；传播范围受衰减限制，能传内容有限却会暴露位置
