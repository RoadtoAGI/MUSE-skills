quote: 一个策划已久的灭绝计划已经走到了最后一步
sensory_mapping: 移民、缴械与断电像脚印排成长路，智子的食人宣告落下最后一只脚，终点就是灭绝。
context_fact: 智子告诉各国首脑四十二亿人就是彼此粮食，现有存粮仅够一个月。
image_mechanism: 走路把阴谋的时间次序和完成度可视化，最后一步强调此刻才看懂已太迟。
property_alignment: 强制移民对应前段路程；解除技术对应中段；断电饥荒对应末段；食人竞争对应终点。
context_alignment: 人类曾把每项命令当临时管理措施，路径图在终点才显现，贴合迟到认知。
narrative_function: 重释此前一年全部事件为统一灭绝计划，并关闭谈判补救空间。
transfer_rule: 计划如行路时，应列明阶段脚印、依赖顺序和最后一步为何不可逆。
failure_boundary: 执行仍可能受抵抗或广播事件打断，最后一步是人物当时判断，不等于结果必然完成。
