chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 水滴，在群星背景前像一颗黯淡的流星一闪而过
sensory_mapping: 水滴不再以镜面照亮银河，只剩一个暗点从群星间划过，像将熄的流星。
context_fact: 水滴已错过飞船，高速摄影才捕捉到它，肉眼因速度过快无法看见。
image_mechanism: 流星把摄影中的速度和短暂显影合并，同时以黯淡预告水滴神性和动力已经消失。
property_alignment: 高速掠镜对应流星划过；瞬间可见对应一闪；表面晦暗对应黯淡光点；星空背景对应夜空。
context_alignment: 水滴曾是永恒光滑的神器，此刻像会衰灭的普通天象，完成第一层降格。
narrative_function: 给高速影像一个可识别运动单位，并引导观众定格放大检查异常。
transfer_rule: 高速物如流星时，应匹配背景、显影时长、亮度和轨迹，不只借用快。
failure_boundary: 水滴不燃烧也未进入大气，不具流星尾迹；喻体只描述摄影外观和速度。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 失去力场后高速掠过摄影视野、表面变暗的水滴
vehicle: 亮度微弱、沿天空高速划过并转瞬消失的流星
ground: 相对背景高速横移；可见时间极短；小而黯淡的物体留下瞬时轨迹感
