chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 这是白噪声图像，就像收不到信号的电视屏幕上的一片雪花
sensory_mapping: 智子球面铺满细白亮点，像老电视的雪花急速跳动，三分钟后噪点退去，麦田画面显出。
context_fact: 球体内部亮点浮到表面形成闪动光斑，随后几光年外图像清晰出现。
image_mechanism: 电视雪花直接提供通信状态语法，陌生智子球因此暂时成为读者熟悉的失锁显示器。
property_alignment: 随机亮点对应电视雪花；球面对应屏幕；远端未接通对应无信号；图像出现对应频道锁定。
context_alignment: 未来超距通信仍先呈现公元电视噪声，程心能以旧经验识别，也缓解了智子球的异质感。
narrative_function: 给等待时长提供可见过程，并清楚标志通信从载波噪声切换到会面画面。
transfer_rule: 未知显示噪声如旧屏雪花时，应匹配粒子形态、随机性、覆盖面、信号状态和消退节点。
failure_boundary: 白噪声成因未必与模拟电视相同，球面也不是平面屏；类比只描述视觉和通信阶段。
quality_assessment: functional
