review_status: reviewed
tenor: 跨光年通信图像建立前，智子球面上由无数随机亮点组成的白噪声
vehicle: 旧电视未接收到频道信号时，屏幕布满高速随机闪烁的黑白雪花点
ground: 亮点数量极多；位置随机变化；整体覆盖显示面；表示信号尚未锁定；持续到图像出现
