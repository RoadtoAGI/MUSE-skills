chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 这些发光的窗口像一群来自刚刚消逝的时代的幽灵，这里是它们最后的聚集地
sensory_mapping: 全息窗像半透明魂影飘过疲惫官员头顶，从一个处理者游向下一个，帐篷成了最后灵堂。
context_fact: 移民区大多失去IT，市政厅仍集中许多超信息窗口，但也即将断电。
image_mechanism: 幽灵同时匹配全息图像的透明漂浮和技术时代的死亡，使残余先进设施带上迟暮感。
property_alignment: 全息无实体对应鬼影；自动飘移对应游魂；超信息时代消失对应死亡；市厅仅存对应最后聚集地。
context_alignment: 程心进入帐篷短暂找回旧时代感觉，鬼魂意象立即说明这种返回只是假性回声。
narrative_function: 在求助场景中显示治理技术仅剩孤岛，并预示断电将终结最后信息秩序。
transfer_rule: 旧技术如幽灵时，应同时匹配视觉透明、运动方式、所属时代死亡和残存地点。
failure_boundary: 窗口仍真实工作并非死物；若技术正在普遍复兴，幽灵的末日条件不成立。
