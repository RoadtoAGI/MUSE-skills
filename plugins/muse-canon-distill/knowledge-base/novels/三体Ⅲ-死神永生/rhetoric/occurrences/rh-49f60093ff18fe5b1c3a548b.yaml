chapter: 【威慑纪元61年，执剑人】
figure_type: simile
quote: 像是这梦幻森林中的精灵
sensory_mapping: 行人衣光成为精灵微光，高架树城成为其原生森林，普通街行带上飘逸步态。
context_fact: 程心初见威慑时代街头，发现行人几乎全呈女性化美貌。
image_mechanism: 精灵把个体美貌与既有森林环境扣合，使她们不像装扮者，而像由城市本身生出的物种。
property_alignment: 美丽轻盈对应精灵形态；闪光服饰对应魔法微光；树状城市对应精灵森林栖居。
context_alignment: 程心感到时代陌生而梦幻，精灵化保留欣赏，也预示性别外观认知将被挑战。
narrative_function: 把未来人的审美变化嵌入城市意象，维持初醒者的童话化观看。
transfer_rule: 人物如幻想种族时，应让外貌、行动与环境美学共同归属同一世界；仅因漂亮不足。
failure_boundary: 服饰朴素、动作粗重或城市非森林结构时，精灵的环境同构会消失。
