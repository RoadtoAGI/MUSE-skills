chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 她刚才还透明空灵的心突然抽紧了绞痛起来，像被许多只手抓住
sensory_mapping: 原本空旷的心室忽然伸入两位朋友连成的多只手，从四周攥紧，把将滚落的露珠硬生生留住。
context_fact: AA来电话谈水果，弗雷斯持续关心她；程心意识到死亡会给这两位真正朋友造成打击。
image_mechanism: 多手把抽象牵挂变成抓握，既造成痛苦又执行救援：心被攥痛，生命也因此不能轻易滑走。
property_alignment: 朋友牵挂对应多只手；突然想起对应骤然伸入；心绞痛对应抓紧；放弃自杀对应被留住。
context_alignment: 前文她自认轻装远行、露珠滚落，抓手同时反转无行李和无牵挂两幅图，证明关系仍有重量。
narrative_function: 让朋友的伦理力量以身体疼痛介入，完成从自杀平静到重新承担生活的转折。
transfer_rule: 牵挂如抓握时，应明确每股力量来自谁、抓住何处、疼痛与保护如何并存以及它阻止的动作。
failure_boundary: 没有实体手触碰心脏，朋友也不知道她正要自杀；抓握表现的是内化关系而非外部强迫。
