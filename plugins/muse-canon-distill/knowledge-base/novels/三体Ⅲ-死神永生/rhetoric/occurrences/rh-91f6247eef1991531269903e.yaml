tenor: 程心想到自杀会伤害AA和弗雷斯后，牵挂同时涌入并打断麻木平静的心痛
vehicle: 许多只手从不同方向抓住心脏并同时收紧，阻止它离开且造成挤压绞痛
ground: 力量来自多个关系方向；作用突然；主体被牢牢留住；压力集中于心口并产生疼痛
