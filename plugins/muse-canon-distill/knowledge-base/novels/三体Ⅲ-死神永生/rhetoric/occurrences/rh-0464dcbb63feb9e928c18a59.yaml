chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，威慑控制中心】
figure_type: metaphor
quote: 上方四十五千米厚的地层又显示出沉重的存在，那是沉积的时间
sensory_mapping: 每一亿年落成一层岩石，生命故事封存在层理中，四十亿年从头顶整块压向地下大厅。
context_fact: 程心在攻击倒计时中想象太古海洋、生命诞生和演化史，无法按键终止三十五亿年进程。
image_mechanism: 控制中心真实地质深度给时间物质化提供天然剖面，沉积同时解释年代顺序、厚度和心理重压。
property_alignment: 地质年代对应沉积层；生命事件对应层中遗迹；时间漫长对应地层厚度；进化遗产对应上覆重量；决断窒息对应承压。
context_alignment: 此前四十五千米地层代表执剑责任，此刻责任被重新解释为全部生命历史，重量来源从职位扩展到进化。
narrative_function: 把抽象三十五亿年压到程心身体上，显示她拒绝毁灭不是临时软弱，而是被生命连续性占满感知。
transfer_rule: 时间如沉积时，应让顺序、层厚、保存内容和当前承重各自对应；现场地质可提供可信尺度。
failure_boundary: 地层并非逐年等量记录全部生命史，物理厚度不能直接衡量价值；若人物重视未来多于过去，压力方向会不同。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 从地球诞生、生命起源到人类文明累积的四十亿年历史对程心决断形成的重量
vehicle: 漫长时间像矿物颗粒逐层沉降压实，最终形成四十五千米厚、真实承重的地层
ground: 微小过程按年代连续累积；越古老的层位越深，全部历史在当前时刻共同施加压力
