chapter: 【掩体纪元66年，太阳系外围】
figure_type: metaphor
quote: 附近的一个沙丘被坑吞没了
sensory_mapping: 小坑张开黑口，一座沙丘沿坡滑入，越过坑沿后像被一口咽掉。
context_fact: 丁仪手挖的小坑已扩至百米，随后会吞没整片沙漠并形成环形沙瀑。
image_mechanism: 吞没在第一次吞下一座丘时建立坑的捕食角色，后文吞整个沙漠只是同一框架的尺度升级。
property_alignment: 坑口对应嘴；扩张边缘对应张口；沙丘对应猎物；滑入对应吞咽；黑底对应腹内。
context_alignment: 二维面也从方寸纸条扩大到太阳系，局部吞噬先展示正反馈增长。
narrative_function: 标记噩梦从小异常跨过不可逆阈值，并迫使师生上车逃跑。
transfer_rule: 扩张区首次写成吞噬者时，应选取具体被吞对象、越界动作、消失结果和后续尺度延展。
failure_boundary: 坑没有意志且沙丘物质只是下落；吞咽不解释几何扩张原因。
quality_assessment: effective
