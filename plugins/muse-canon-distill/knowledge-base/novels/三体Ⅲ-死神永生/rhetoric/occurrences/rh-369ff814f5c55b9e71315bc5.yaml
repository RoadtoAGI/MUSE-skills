tenor: 迅速扩大的沙坑边界越过沙丘，使整个丘体滑入深处并从地表消失
vehicle: 不断张大的口腔把附近猎物整只吞下，猎物越过口沿后不再可见
ground: 边界扩张；对象整体进入；表面迅速消失；中心深黑；过程有主动捕食感
