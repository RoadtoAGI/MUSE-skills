chapter: 【威慑后第一年，澳大利亚】
figure_type: simile
quote: 有潮水一般的脚步声
sensory_mapping: 看不见的脚掌不再逐个落地，合成一片涨潮，从四周滚来并拍过她身边。
context_fact: 广场人群在屠杀宣告后混乱奔跑，程心失明，只能凭声音感知。
image_mechanism: 潮水把不可定位的众多脚步合成有方向的声体，让她在黑暗中感到人群流量。
property_alignment: 密集脚步对应水滴拍击；人群奔涌对应潮进；声音包围对应水位漫来。
context_alignment: 此前人群多次被写成洪水和油汤，失明后同一流体框架由视觉转到听觉。
narrative_function: 重建黑暗中的空间尺度，并表现程心随时会被人流撞倒的危险。
transfer_rule: 脚步如潮须有群体密度、整体方向和声浪叠加，单人规律脚步不适用。
failure_boundary: 人流未必同向周期涨落，潮汐只写声量；若场面稀疏，潮水会夸大人数。
