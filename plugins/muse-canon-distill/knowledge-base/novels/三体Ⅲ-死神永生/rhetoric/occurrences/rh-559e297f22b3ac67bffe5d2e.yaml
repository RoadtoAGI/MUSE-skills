chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 再往远处，世界就是一大块模糊的黑天鹅绒
sensory_mapping: 火把光圈之外铺着厚黑绒布，田野道路的边缘都陷进没有纹理的柔暗表面。
context_fact: 公主第一次见到广阔星空和真正夜色，车上火把只能照亮身边一小块。
image_mechanism: 天鹅绒以吸光材质和触感厚度把空无夜色物化，衬托其上星点的明亮。
property_alignment: 夜色对应黑绒；无细节对应模糊绒面；世界广阔对应大块布；火光止步对应吸光。
context_alignment: 白日世界是一幅鲜艳画，夜间翻成黑色织物，公主对外界的感官教育持续换材质。
narrative_function: 建立海边前夜的深暗背景，让听觉和星光成为导航线索。
transfer_rule: 夜色比作织物时，应对齐色泽、吸光性、铺展面积、纹理清晰度和触觉联想。
failure_boundary: 世界没有被布覆盖，天鹅绒的温暖柔软也不等于夜间安全；仅描述视野。
