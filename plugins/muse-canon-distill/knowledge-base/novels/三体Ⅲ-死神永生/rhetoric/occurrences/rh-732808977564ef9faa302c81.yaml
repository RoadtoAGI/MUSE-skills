chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 她感觉自己就像个孩子，在这个男人面前，她有一种久违的依赖感
sensory_mapping: 关一帆替她套上厚重衣层、逐个指出开关，七百岁的程心在他面前重新像被照料穿衣的孩子。
context_fact: 低光速使现代自动太空服失效，两人必须改穿全手动古式装备。
image_mechanism: 年龄倒置将技术退化与情感退行同步：设备回到古代，程心也暂时回到需要成人帮助的童年位置。
property_alignment: 程心对应孩子；关一帆对应照料成人；穿太空服对应穿衣；开关讲解对应教导；依赖感对应亲子安全。
context_alignment: 文明和科学多次退回婴儿时代，此处个人在规律灾难中也退回孩子状态，但获得了具体照料而非抽象无力。
narrative_function: 在生存操作中推进关系亲近，并表现程心长期强撑后允许自己依赖他人。
transfer_rule: 成人比作孩子时，应由具体照料动作、能力差、知识依赖和情感安全支撑。
failure_boundary: 程心仍能判断和操作，关一帆也非父亲；孩子感限于虚弱、陌生装备和依赖。
