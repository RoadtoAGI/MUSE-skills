chapter: 【掩体纪元11年，星环城】
figure_type: metaphor
quote: 他们把我们和我们的子孙关在这个半径五十个天文单位、名叫太阳系的监狱里
sensory_mapping: 太阳系牢墙；技术门锁；星空在外；世代囚徒；自由被截断
context_fact: 联邦以安全和社会稳定为由禁止曲率驱动研究，星环自卫队认为这剥夺了全人类进入银河的可能。
image_mechanism: 抽象法令在太阳系外缘竖起实体围墙，光速技术成为唯一可能开启的门；把后代一并写入牢房，使当前禁令获得无限刑期。
property_alignment: 太阳系对应牢房；外缘尺度对应监狱围墙；联邦对应看守；光速禁令对应锁门；人类与子孙对应囚犯；银河世界对应墙外自由；无法出航对应不得越狱；永久政策对应代际刑期
context_alignment: 战士把争端从一座城市的自治提升为物种自由，监狱意象符合其战争动员口吻，也解释他为何视投降为出卖后代。
narrative_function: 赋予光速计划强烈自由伦理，为武装抵抗建立最有感染力的自我辩护。
transfer_rule: 用监狱写空间性限制时，应明确围界、执行禁令的权力、被阻断的出口、墙外可实现的自由和受限者无法自愿离开的事实。
failure_boundary: 边界来自不可改变的自然距离、居民可自由离开，或墙外同样没有可达世界时，监狱会把生存条件错写成政治囚禁。
quality_assessment: exemplary
