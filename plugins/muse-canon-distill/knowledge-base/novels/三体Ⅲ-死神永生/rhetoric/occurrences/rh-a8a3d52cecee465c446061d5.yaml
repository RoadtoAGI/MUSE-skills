tenor: 联邦禁止光速飞船，使当代人及后代无法离开太阳系、接触外部世界或自主选择星际生活
vehicle: 权力机构把人及其后代终身锁进有明确墙界的监狱，门外虽有广阔自由空间，囚徒却不得越界
