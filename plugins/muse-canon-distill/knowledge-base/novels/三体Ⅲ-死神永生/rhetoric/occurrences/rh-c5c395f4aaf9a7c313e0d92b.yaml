chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: metaphor
quote: 我是墓地。
sensory_mapping: 暗铜圆环像悬在四维海中的巨大坟冢，擦痕是墓碑风化纹路，自动应答如墓中留下的一缕回声。
context_fact: 魔戒表面陈旧、无活动迹象，却迅速学习人类语言，并声明建造者已死、飞船本身也是死的。
image_mechanism: 墓地把机器自称死亡与乘员灭绝合并：会说话的控制残余仍可存在，却只承担保存和见证逝者的功能。
property_alignment: 死去建造者对应墓中死者；废弃飞船对应墓园场所；自动控制残余对应遗留碑文；无活动航行对应生命终止。
context_alignment: 周围上百个封闭四维实体也无信号，单个墓地的自称随即扩张成整片文明遗迹群的解释。
narrative_function: 把首次第三文明接触从发现活跃他者翻转成进入宇宙坟场，并引出维度衰亡史。
transfer_rule: 让设施成为墓地时，应交代死者是谁、遗存由何物保存、尚存回应为何仍不等于生命活动。
failure_boundary: 魔戒控制系统能学习和通信，是否具有意识并不确定；死亡是其自我定义，不能据此断言所有功能停止。
