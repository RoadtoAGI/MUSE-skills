chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 长长的沉默像天国的宁静
sensory_mapping: 电话线路的静音扩展成无边天国空间，等待中的每一秒失去尘世噪声和时间推进感。
context_fact: 程心阻止其安乐死，却无法救治；云天明在心中让她带着星星去幸福，愿沉默延续。
image_mechanism: 天国把普通停顿赋予永恒和死后安息，沉默既是两人最接近的一刻，也是他已放弃尘世交流的证明。
property_alignment: 电话无言对应天国无扰；长时间停顿对应永恒宁静；将死者的愿望对应死后安息想象。
context_alignment: 他不求程心回应爱情，只求她幸福，天国式静默符合单向告别而非现实团聚。
narrative_function: 把救援后的对话收束成精神葬礼，让未说出的赠星告白获得庄重停顿。
transfer_rule: 沉默借超验空间时，应让人物价值观、死亡处境与对永恒的愿望共同支撑；时长本身不足以构成天国。
failure_boundary: 若沉默充满尴尬、敌意或即将爆发争吵，宁静语义失效；人物若无死亡意识，天国层级会过重。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 云天明与电话另一端程心之间持续而无言的安静
vehicle: 脱离尘世扰动、没有痛苦与言语的天国宁静
ground: 外界声响和行动暂时停止；主体希望这一无扰状态永恒延续并与死亡安息相连
