chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 能听到一阵由小到大的铃声，像风铃，但更急促
sensory_mapping: 伞越转越快，边缘石球像被疾风摇动的铃片，脆响挤成急促一串。
context_fact: 年代久远的伞若转太快会散架，因此上限警报必须与慢速鸟鸣区分。
image_mechanism: 风铃天然由风速控制，正好把旋转速度映射为铃声密度，并用更急促标明超限。
property_alignment: 石球和伞骨碰响对应铃片；旋转对应风吹；转速增加对应风势增强；散架风险对应铃声急迫。
context_alignment: 鸟鸣与风铃组成双端听觉刻度，后文卫队长转快时铃声直接唤醒公主。
narrative_function: 完成黑伞可执行的速度控制规则，让情节机关在后续无需再解释。
transfer_rule: 速度反馈写成风铃时，应让声响密度、强度、驱动力和危险上限同步变化。
failure_boundary: 实际声源未必是碰撞，风铃音色也可能因材质不同；比较只帮助识别急促警报。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 黑伞转速过快、可能散架时由弱转强且节奏密集的另一种警报
vehicle: 多片风铃受强风连续碰撞，发出清脆、成串并随风势加急的铃音
ground: 声音清脆；密度随速度增加；由弱到强；多次碰击连成一阵；提示外力过大
