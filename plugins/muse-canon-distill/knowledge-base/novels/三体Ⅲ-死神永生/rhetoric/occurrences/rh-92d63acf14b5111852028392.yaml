figure_type: metaphor
quote: 已经被击成碎片并被炽热的岩浆吞没
sensory_mapping: 暗红岩浆像张开的胃腔卷住天线碎片，金属轮廓逐块沉没，地表再无痕迹。
context_fact: 水滴击碎地幔空洞中的圆柱天线，喷发坑底仍有一洼暗红岩浆。
image_mechanism: 吞没给无方向的液体覆盖赋予入口、包围和消失顺序，完整呈现设施从文明器官变成地质残渣。
property_alignment: 岩浆包围对应口腔摄入；碎片沉入对应猎物下咽；高温熔蚀对应体内消化；不可回收对应消失。
context_alignment: 程心在坑边看不到天线，只能由岩浆想象其终局，生物性吞咽增强埋葬感。
narrative_function: 为威慑设施安排彻底、不可逆的物质结局，并把程心的自毁诱惑集中到坑底。
transfer_rule: 液体吞没物体时，应写包围、下沉和消失阶段，并让介质的破坏性质支撑消化感。
failure_boundary: 岩浆没有捕食意图，天线碎片也未必完全熔化；吞没只写视觉消失和不可回收。
