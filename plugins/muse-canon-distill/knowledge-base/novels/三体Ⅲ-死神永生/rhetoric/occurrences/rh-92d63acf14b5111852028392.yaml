tenor: 破碎的引力波天线完全沉入、覆盖在岩浆中而不可见
vehicle: 张口摄入猎物并使其消失在体内的巨大生物
ground: 对象从外部可见转为被整体包围；高温介质持续侵蚀；进入后难以取回
