chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 像漫天尘土中一群英勇的蚂蚁
sensory_mapping: 俯瞰视角压小人群，飞尘变成土层，砖瓦沙袋则像蚂蚁衔运的颗粒。
context_fact: 炮弹刚击开缺口，人们就在碎石未落尽时一拥而上，用各类材料抢修。
image_mechanism: 视点从人的高度陡升到城防全景，勇敢落到一群小生物逆着坍塌物反复搬运的动作上。
property_alignment: 人群与巨墙的比例对应蚂蚁与巢体的比例；众人一拥而上对应蚁群协同行进；搬运砖瓦沙袋对应蚂蚁搬运颗粒修巢。
context_alignment: 这群人勇敢却受制于巨炮尺度，蚂蚁既保存其协作和坚韧，也显出个人力量在帝国战争中的渺小。
narrative_function: 同时呈现守城者的英雄性与徒劳感，避免单向赞颂削弱围城压迫。
transfer_rule: 群体劳动的喻体应保留奔赴、搬运、填补的任务链；缩尺可表达弱势，喻体也须具备同等协作能力。
failure_boundary: 若人群行动松散、没有共同搬运目标，蚁群的组织性就不成立；若视角贴近个人表情，蚂蚁会抹掉必要的个体经验。
