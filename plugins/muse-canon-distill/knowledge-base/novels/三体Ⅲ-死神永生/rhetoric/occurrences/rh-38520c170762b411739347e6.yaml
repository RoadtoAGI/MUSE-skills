chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 初看根本看不出它们是机器，像是一堆怪诞的雕塑或某种自然形成的地质构造
sensory_mapping: 地板揭开后没有管线与机柜，只有一堆无法命名的曲面和突起，介于展厅雕塑与裸露岩层之间。
context_fact: 这是二人在小宇宙中首次看到带有三体特征的实物，机器人随即拆卸并送走这些设备。
image_mechanism: 并列两类喻体从人工但无功能、自然且无设计两端夹住陌生机器，精确表达观察者分类失效。
property_alignment: 无可辨部件对应抽象雕塑；非人体尺度对应怪诞造型；不规则组合对应地质构造；难见用途对应观赏或自然物；成堆静置对应展品岩层。
context_alignment: 此前小宇宙所有用品模仿人类风格，外壳拆除后突然露出三体设计，双喻体突出文化界面的终止。
narrative_function: 在终章首次给三体技术实体外观，同时保留其根本不可译性。
transfer_rule: 异质技术可用两个不同来源域夹写：一个解释人工痕迹，一个解释无功能可读性，并指出两者各覆盖什么。
failure_boundary: 设备有精确工程目的和内部秩序，既非艺术品也非随机地质产物；相似只在初见外形。
quality_assessment: exemplary
