chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 但立刻被一片死寂吞没了
sensory_mapping: 一线尖叫刚划开晨空，四周静默像黑水合拢，把声线整段卷入口中。
context_fact: 人群听见智子要求四十多亿人互相当粮食后，只有一声女人尖叫，随后无人说话。
image_mechanism: 吞没给无声以体积和主动包围力，说明恐惧不是缺少反应，而是压倒所有发声能力。
property_alignment: 单声尖叫对应小物；全场静默对应巨大包围介质；声音骤止对应被吞入；无回应对应不留痕迹。
context_alignment: 食人宣告刚把人称为粮食，静默随即获得吞食动作，使会场本身先示范一次吞没。
narrative_function: 在极端信息后制造声场真空，并把程心的昏厥与失明推到前景。
transfer_rule: 静默吞声时，要有清楚的先行声音、尺度反差和骤停，不宜用于自然渐弱。
failure_boundary: 尖叫是声波衰减而非实体被吃；若现场随后喧闹回应，死寂的整体覆盖不成立。
quality_assessment: exemplary
