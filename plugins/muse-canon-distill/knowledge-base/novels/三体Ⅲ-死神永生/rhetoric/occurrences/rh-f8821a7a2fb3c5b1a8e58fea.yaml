review_status: reviewed
tenor: 女人的尖叫短暂响起后，在全体人群震惊沉默中迅速消失
vehicle: 巨大无声生物或深水张口包围声音，把它完全摄入而不留回响
ground: 小而尖锐的信号进入更大介质；边界迅速被包住；片刻后再也听不见
