chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 马蹄声很响，像要把星星震下来
sensory_mapping: 每一下马蹄都撞进黑绒夜幕，星点像钉得不牢，被震得在头顶发颤。
context_fact: 公主此前从未体验如此广阔寂静的星空，环境安静使车声异常突出。
image_mechanism: 夸张震落将听觉强度转成天幕位移，越不可达到的星星越能标定马蹄在寂静中的响度。
property_alignment: 马蹄冲击对应震源；夜空对应受震顶棚；星星对应可落亮点；连续蹄声对应反复摇动。
context_alignment: 黑天鹅绒已把夜空物化成布面，星星因而像缀在布上的物件，可以被声音震落。
narrative_function: 让寂静通过声响反证，并触发公主停车聆听陌生海声。
transfer_rule: 巨响写成震落高物时，应先建立可受震的空间表面，再匹配冲击节奏和听觉反差。
failure_boundary: 马蹄声无法影响恒星，星光闪动也非真的摇落；这是主观响度夸张。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 寂静夜路上被空旷环境放大的连续马蹄声
vehicle: 强烈震动传到高空，把原本固定的星点从天幕上摇落
ground: 声响冲击强；周围极静；震动似向上扩散；高处亮点显得可被撼动；节奏连续
