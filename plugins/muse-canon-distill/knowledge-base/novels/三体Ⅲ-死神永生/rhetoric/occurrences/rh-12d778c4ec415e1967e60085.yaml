chapter: 【危机纪元5-7年，阶梯计划】
figure_type: analogy
quote: 和云天明一样，她也要在无边的黑暗中漂流了
sensory_mapping: 冬眠舱脱离地面成为黑海小舟，意识熄灭等于看不见岸，时间流逝成为无声漂移。
context_fact: 云天明飞行器已偏航，程心作为计划联络员也被送往未来。
image_mechanism: 两人路径一为空间、一为时间，却共享黑暗、失控和未知抵达；相似命运给她一丝补偿性安慰。
property_alignment: 冬眠无意识对应深空黑暗；跨世纪对应远距航行；无法控制未来对应飞行器漂流。
context_alignment: 她无法陪伴云天明本人，只能让自己的生命也离开当代，类比表达迟到的共同行动。
narrative_function: 以命运平行收束危机纪元，把人物送入威慑时代。
transfer_rule: 时间旅行与空间旅行类比时，应对齐感知状态、控制权和抵达不确定性；情感价值来自人物明确的共命运愿望。
failure_boundary: 若程心冬眠可随时中止、未来确定且有人全程照料，她的失控漂流程度低于云天明；两者结局不可等同。
