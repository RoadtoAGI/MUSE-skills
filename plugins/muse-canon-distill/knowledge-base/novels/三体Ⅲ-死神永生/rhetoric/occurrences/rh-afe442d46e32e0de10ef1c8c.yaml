chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 海干了鱼就要聚集在水洼里，水洼也在干涸，鱼都将消失。
sensory_mapping: 无边四维海床已经裸露，只余黑暗水洼；各形飞船像鱼群拥挤其中，水线仍在下降。
context_fact: 两舰进入半径仅几十天文单位的四维碎块，发现上百艘来源不同、已经死亡或将死亡的四维实体。
image_mechanism: 海—水洼—鱼构成一条动态生态链，把维度退化、避难聚集和文明灭绝压进同一幅持续干涸的景象。
property_alignment: 完整四维宇宙对应海；残余碎块对应水洼；四维飞船与文明对应鱼；降维持续对应水分蒸发；灭绝对应鱼离水死亡。
context_alignment: 魔戒先自称墓地，随后用水生物对介质的依赖回答遗迹为何密集，使空间异常转为一场已发生许久的生态灾难。
narrative_function: 首次揭开宇宙维度战争的历史尺度，并用易懂生态过程预示四维碎块即将消失。
transfer_rule: 用生态系统解释文明与环境共亡时，应完整对应介质、依赖者、退缩过程、聚集反应和最终结局。
failure_boundary: 四维空间不是液体，飞船也能暂时进入低维；鱼只能说明对原生维度的依赖，不能推出所有文明被动困死。
quality_assessment: exemplary
