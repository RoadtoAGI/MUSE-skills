tenor: 曾广布宇宙的四维空间已降维消退，残余碎块聚集四维文明飞船且仍在缩小
vehicle: 大海干涸后只剩逐渐蒸发的水洼，水生鱼群被迫挤在最后水体中并将随水消失
ground: 生存介质从广大连续体退缩为局部残片；依赖该介质的群体被迫集中；残片继续耗尽；群体面临共同灭绝
