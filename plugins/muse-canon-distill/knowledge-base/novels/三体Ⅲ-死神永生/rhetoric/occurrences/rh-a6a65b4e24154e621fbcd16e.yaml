chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 形成了大量的二维日饵，像围绕着二维太阳的一圈曼妙舞者，在二维太空中变幻着千万种汪洋悠意的舞姿
sensory_mapping: 金色日饵从太阳边缘舒展成舞者的长袖和肢体，一圈身影在黑空中旋转、散开、远去。
context_fact: 二维太阳大气越过圆周边缘，日饵在熄灭前仍受辐射支撑而活跃运动。
image_mechanism: 舞者把磁流体变化解释为身体编舞，曼妙自由与即将熄灭的恒星形成最后演出般的悲壮。
property_alignment: 日饵对应舞者；太阳圆周对应舞台；气流变形对应舞姿；金色对应服饰光泽；脱离日饵对应舞者离场。
context_alignment: 地球冰环像舞台艺术品，太阳日饵又成为舞者，二维灾变把太阳系最后时刻转成无人导演的舞台。
narrative_function: 使恒星分层说明获得动态高潮，并为下一段舞者枯萎倒下准备连续生命弧。
transfer_rule: 流体结构比作舞者时，应对齐中心舞台、身体形变、运动节律、群体编排和退场方式。
failure_boundary: 日饵没有人体、意志或编舞目的，运动由恒星物理控制；舞姿只形容形态和节律。
quality_assessment: exemplary
