review_status: reviewed
tenor: 越过二维太阳圆周、受气流和辐射支撑而不断变形飘动的大量金色日饵
vehicle: 一圈身姿优美、自由舒展、围绕舞台中心不断变换动作的曼妙舞者
ground: 数量众多且环绕中心；形态柔软变化；动作连续；色彩耀眼；部分离开群体远飘；整体有节律与美感
