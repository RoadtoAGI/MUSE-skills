chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 如今与智子隔着的那道沟壑已无法跨越
sensory_mapping: 茶席近在咫尺，程心和智子脚下却像裂开无底峡谷，人类广播与三体火海分列两岸。
context_fact: 程心想说女性之间的话，但人类两舰的广播直接导致智子母星和绝大多数三体人死亡。
image_mechanism: 沟壑把身份伦理差异转成不可通行地形，身体距离很近与情感距离无穷因此同时可见。
property_alignment: 人类与三体立场对应两岸；母星毁灭对应地面断裂；欲言又止对应无桥；无法和解对应不能跨越。
context_alignment: 清泉、茶道和女人身份都在拉近二人，沟壑则指出私人共感无法越过文明级死亡责任。
narrative_function: 解释程心为何放弃安慰智子、转而询问官方问题，并为茶道谈话保持冷静礼仪。
transfer_rule: 关系如沟壑时，应交代两岸身份、造成裂缝的事件、尝试跨越的动机和桥梁为何不存在。
failure_boundary: 双方仍能交流并保持礼仪，未来立场也非物理不可变；无法跨越是程心当下的伦理感受。
