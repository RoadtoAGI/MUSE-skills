tenor: 自卫队战士高度一致、没有同情与犹疑的目光和表情所呈现的冷酷精神状态
vehicle: 金属表面冰冷、坚硬、统一而无生命温度，受力时保持规定形态
ground: 情感冷淡对应金属低温；意志强硬对应金属硬度；表情一致对应标准化材质；缺乏同情对应无生命；训练纪律对应机械规则；目光锋利对应金属锐面
