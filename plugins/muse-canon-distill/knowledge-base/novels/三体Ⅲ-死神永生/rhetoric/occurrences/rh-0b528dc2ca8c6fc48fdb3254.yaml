figure_type: simile
quote: 透出金属般的冷酷
sensory_mapping: 冷金属脸；硬直目光；同质表面；无温反光；机械队列
context_fact: 战士在服装、装备和精神状态上表现出训练形成的整体性，身体强壮、表情目光相似。
image_mechanism: 个体面孔的温度和差异被压平为同一种材料，肌肉、眼神与队列共同呈现可加工、可驱动的金属部件感。
property_alignment: 冷酷情绪对应金属冷触；坚决对应硬度；统一训练对应标准件；相似表情对应同质材质；漠然对应无生命；武装威胁对应金属锋刃
context_alignment: 这些人随后被称为战争机器，金属触感先在面孔层面建立机械化群体，支撑黑色巨轮意象。
narrative_function: 把抽象冷酷变成触觉材质，消除战士作为普通人的温度。
transfer_rule: 以金属写人物冷酷时，应有低情感反应、动作纪律、表情同质和潜在硬性力量，材质应落实到可感部位。
failure_boundary: 人物情绪外露、行为杂乱、温柔犹疑占主导，或只因穿金属装备便称冷酷时，属性映射会失真。
