chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 形成广阔的吸积盘，像两片灰色的墓场
sensory_mapping: 两轮太阳周围铺开灰色圆盘，恒星与行星碎屑像无数墓碑和骨灰，环绕没有祭奠者的空墓园。
context_fact: 一颗恒星爆发、三体行星彻底破碎后，剩余两太阳组成稳定双星，系统再无生命。
image_mechanism: 墓场把吸积盘成分从中性尘埃恢复为文明与天体遗骸，两个盘面则像两块并列安葬区。
property_alignment: 碎裂物质对应遗骸；灰色盘面对应墓地色调；生命灭绝对应死者；稳定环绕对应长期墓园。
context_alignment: 三体世界曾反复重生，此刻稳定日出终于出现却无人享受，墓场准确把规律与死亡并置。
narrative_function: 以静止灰景结束剧烈爆发过程，为三体文明的物理终局盖上视觉封土。
transfer_rule: 遗迹如墓场时，应说明埋葬对象、残骸材质、空间范围和与幸存环境的关系。
failure_boundary: 吸积盘没有墓碑、仪式或有意安葬，物质仍可能继续演化；墓场表达生命史意义。
