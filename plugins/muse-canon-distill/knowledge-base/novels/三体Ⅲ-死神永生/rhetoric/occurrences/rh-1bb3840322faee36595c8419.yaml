figure_type: simile
quote: 那些山像一根根巨大的柱子
sensory_mapping: 崎岖自然地貌被几何化为柱列，飞行视角掠过时产生穿行巨构建筑的尺度感。
context_fact: 镜头从太空俯冲到无生命行星，越过沙漠、怪山、裂谷和圆盆地。
image_mechanism: 柱子抹平山峰常见的坡面，将陌生地貌的关键异常集中到陡直长轴；一根根又给出重复节奏。
property_alignment: 陡峭山身对应柱体直立；群峰排列对应柱列；巨大高度对应建筑尺度被极端放大。
context_alignment: 这是参数生成的异星而非地球写生，规则柱形既可视化算法结果，也维持地貌陌生感。
narrative_function: 用熟悉几何体快速交代异星地貌形态，支撑高速镜头连续浏览。
transfer_rule: 写陌生地形时，可先提取最异常的几何轴和重复方式，再选结构物；不要让喻体凭空添加其并不具备的用途。
failure_boundary: 山峰若有宽缓坡脚、尖锥顶或大小杂乱，柱体的平行侧面与重复性就不成立；文本也未说这些山真正承重。
