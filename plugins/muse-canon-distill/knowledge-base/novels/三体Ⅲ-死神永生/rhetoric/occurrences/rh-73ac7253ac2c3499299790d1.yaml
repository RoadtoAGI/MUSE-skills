chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 人类在星际就保留了一个前哨和种子，保留了一个探索的机会
sensory_mapping: 一艘战舰同时立成黑暗边疆的岗哨，又缩成飘往恒星土壤的种子，舱内人类成为待萌发胚芽。
context_fact: 蓝色空间号提议交出三分之二嫌疑人，留下三分之一继续前往类地行星目标，但追击舰拒绝。
image_mechanism: 前哨负责认知价值，种子负责生存价值，两物并列避免把远航只写成逃亡，清楚列出方案双重收益。
property_alignment: 远离太阳系对应边疆位置；持续探索对应前哨侦察；幸存人口对应种子胚芽；类地行星对应可萌发土壤；文明重建对应生长繁殖。
context_alignment: 审判社会认为舰员被太空异化，种子喻体反向主张他们仍能代表并延续人类，揭示归属争议。
narrative_function: 赋予投降方案超越自保的文明意义，也让万有引力号的拒绝显出失去另一条生存线的代价。
transfer_rule: 群体如种子时，应说明携带的核心信息、目标环境、萌发条件和扩张可能；前哨则需有信息回传或探索功能。
failure_boundary: 人口与资源不足以繁衍、目标不可居住或群体已放弃人类认同时，文明种子可能无法萌发。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 让部分蓝色空间号人员继续远航，为人类保留太阳系之外的观察点与文明延续可能
vehicle: 边疆前沿的侦察哨站，以及能在新土地萌发生长、繁殖成完整群落的种子
ground: 小规模存在可先行获取远方信息；它还携带复制整体所需核心，能在原中心毁灭后重新扩展
