chapter: 【危机纪元5-7年，阶梯计划】
figure_type: simile
quote: 他们的生命如一盏油已几乎耗尽的灯，在最后的时刻被拨亮了灯芯的火焰
sensory_mapping: 病弱身体成为小油灯，寿命成为剩余灯油，使命像手指拨高灯芯，面容精神随火焰亮起。
context_fact: 候选人病容明显甚至坐轮椅，却因即将代表人类执行任务而精神很好。
image_mechanism: 拨亮没有增加灯油，只加速最后燃烧；振奋与耗尽因而不是矛盾，而是同一终末过程。
property_alignment: 绝症寿命短对应油将尽；精神振奋对应火焰拨亮；使命刺激对应拨动灯芯；死亡临近对应即将熄灭。
context_alignment: 候选人把剩余生命转成文明用途，油灯既庄严化奉献，也保留其不可延长的代价。
narrative_function: 用光亮呈现临终使命感，并为云天明拒绝宣誓形成对照。
transfer_rule: 终末振奋可借耗材灯具写，但应明确亮度来自加速消耗而非生命恢复；刺激源须在场。
failure_boundary: 若治疗使寿命真正延长、病情逆转或精神持续多年，拨芯末亮会错误压缩过程。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 绝症候选人生命将尽却因使命而精神振奋的状态
vehicle: 灯油将枯的油灯在熄灭前被拨芯、短暂燃得更亮
ground: 剩余维持资源极少、终点临近；外部动作让残余能量在短时集中释放为高亮
