chapter: 【广播纪元7年，云天明的童话】
figure_type: metaphor
quote: 王子要以针眼画师作武器
sensory_mapping: 冰沙不用亲自拔剑，而是把针眼握成一件远射武器，每幅画像都是一次发射。
context_fact: 针眼在世界任何地方作画都能使王宫人物消失，王子已命他杀死父母和忠臣。
image_mechanism: 武器化明确区分使用者与杀伤载体，也将绘画从艺术行为翻转为可定向攻击技术。
property_alignment: 冰沙对应持械者；针眼对应武器；人物记忆对应瞄准；完成画像对应击发；消失对应命中。
context_alignment: 国王早把针眼目光比作利剑，此处终于说明那件隐蔽兵刃由谁握持。
narrative_function: 用一句话澄清政变分工和魔画的政治用途，使公主立即理解追杀风险。
transfer_rule: 人物被工具化为武器时，应说明控制者、瞄准信息、触发动作、攻击距离和重复能力。
failure_boundary: 针眼有独立意志和责任，不是无生命工具；武器喻可能遮蔽其主动共谋。
quality_assessment: exemplary
