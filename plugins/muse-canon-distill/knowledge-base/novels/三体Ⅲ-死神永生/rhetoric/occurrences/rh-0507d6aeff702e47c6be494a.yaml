tenor: 冰沙王子利用针眼的魔画能力远程清除政治敌人的策略
vehicle: 操作者持有并瞄准目标的杀伤器械，按意志发射后使对象死亡
ground: 由主谋选择目标；执行者提供杀伤能力；可远距作用；重复使用；服务夺权目的
