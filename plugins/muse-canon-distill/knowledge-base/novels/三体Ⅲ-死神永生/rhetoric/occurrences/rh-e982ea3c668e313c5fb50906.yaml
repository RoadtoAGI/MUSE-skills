chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 他无法入世也无法出世，他没有入世的能力也没有出世的资本，只能痛苦地悬在半空
sensory_mapping: 社会与超脱成为两片相隔的地面，云天明失去落脚点，身体吊在两者之间的空域。
context_fact: 他缺乏职场交往能力，也没有财富、信仰或事业支撑隐退，未来道路完全茫然。
image_mechanism: 悬空把双重否定转成第三个可见位置，这个位置不是折中而是无支撑状态，准确区别于自由飞翔。
property_alignment: 融入社会对应一侧着陆；超然隐居对应另一侧着陆；两者条件不足对应无处落脚；持续痛苦对应悬空耗力。
context_alignment: 下一句人生道路突然看到尽头，癌症诊断等于为无法落地者提供死亡终点，空间困局因此直接推动安乐选择。
narrative_function: 把人物的社会失败概括为结构性无位置，并为他把绝症当作出口建立心理逻辑。
transfer_rule: 用悬空写两难时，应明确两端各是什么、为何都不可达，以及中间状态为何不能长期承受。
failure_boundary: 若人物能在两种生活间灵活切换，或悬浮本身带来自由快感，痛苦无支点的机制就不成立。
quality_assessment: exemplary
confidence: 0.98
review_status: reviewed
tenor: 云天明既不能融入竞争社会、又无条件彻底脱离社会的生存困局
vehicle: 一个人离开两侧可站立之地，悬在没有支点的半空，既无法着陆也不能飞走
ground: 主体不属于任何稳定位置；上下左右都缺少可执行去向，持续停留需要承受失重与危险
