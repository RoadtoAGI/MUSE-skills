chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 太空和星海越来越虚化，越来越像噩梦
sensory_mapping: 银河还在舷窗外发亮，却像梦里会随时改变法则的虚景，星点越看越不真实。
context_fact: 关一帆说明高等文明能把维度和光速武器化，宇宙当前规律可能只是战争残迹。
image_mechanism: 噩梦把认识论失稳转成视觉虚化：当规则本身可被改写，任何稳定景物都像梦境布景。
property_alignment: 未知规律对应梦中逻辑；星海虚化对应梦景；宇宙威胁对应噩梦危险；无力改变对应梦者受困；3G实感对应醒觉触感。
context_alignment: 太阳系二维化曾与凡·高幻象重叠，此刻更大宇宙也失去实在，程心无法再把正常星海当可靠现实。
narrative_function: 从理论说明转入人物身体恐惧，并为超重拥抱带来的短暂实在感建立反差。
transfer_rule: 现实环境写成噩梦时，应指出哪项知识使规则失稳、视觉如何虚化、什么身体感还能充当现实锚。
failure_boundary: 星海物理存在，关一帆的宇宙终局也只是猜测；噩梦感属于程心创伤反应。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 听完规律战争和宇宙终结推演后，程心眼中的真实星空逐渐失去可信与安全感
vehicle: 梦者身处逻辑扭曲、景物虚浮、威胁压迫且无法凭常识逃离的噩梦世界
ground: 现实感下降；环境广阔却不稳定；规则令人恐惧；主体难以掌控；景物似幻；醒来愿望强烈；寒冷压迫
