chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 这一切仿佛是一张伪造的地球彩色照片，除了色彩变换，其他的都一样
sensory_mapping: 草原、雪山、天空和太阳沿用地球构图，却像被人用调色软件把绿、蓝、白昼色逐项换掉。
context_fact: 蓝星含氧、重力近地球，植物形状相似但草为蓝色，天空淡黄，太阳浅红。
image_mechanism: 伪造照片把生物与行星的平行演化读成“复制后改色”，熟悉结构与异常色谱因此同时可见。
property_alignment: 地貌构图对应原照片；蓝星生态对应复制景；颜色替换对应伪造处理；相同形状对应模板保留；异星身份对应伪造破绽。
context_alignment: 太阳系刚变成平面巨画，她们抵达的新世界也先以照片被感知，现实仍隔着图像经验进入。
narrative_function: 用一个整体比喻迅速总结蓝星的似地与非地，避免逐项说明失去感官统一。
transfer_rule: 陌生环境比作改色照片时，应明确保持不变的构图、被替换的色相和观察者识别原型的依据。
failure_boundary: 蓝星没有伪造者或地球模板，景观是独立自然演化；照片感来自人类中心的相似判断。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 蓝星上形态近似地球却采用蓝草、黄天、红日等替换色彩的山地草原景观
vehicle: 有人复制一张地球风景照片，再人为调换色相，制成看似熟悉却露出破绽的伪造图
ground: 构图和物形高度相似；颜色系统整体错置；第一眼可认出地球模板；细看确定并非原景；平面视觉感强
