chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 可以看到在星光下移动的树林，那些树木行走的速度比草要快许多，远远看去像夜行的军队一样
sensory_mapping: 山脊上的树影一排排移过银光，树冠像头盔和旗影，整片森林仿佛正在夜色中行军。
context_fact: 蓝星植物以根须作脚，按季节在纬度间迁徙，树木移动比草丛更快。
image_mechanism: 军队将违反地球经验的移动森林组织成可辨队列，夜行时间、群体方向和速度都获得熟悉行为框架。
property_alignment: 树干对应士兵身形；树林对应军队；季节迁徙对应行军任务；星夜移动对应夜行；共同方向对应队列。
context_alignment: 人类舰队在宇宙中迁徙，蓝星植物也以军队姿态迁徙，移动成为这个幸存时代的普遍生存方式。
narrative_function: 以一幅宏观动态展示蓝星生态最陌生的规则，并将草丛细响扩展到整片山脊。
transfer_rule: 群体植物比作军队时，应让夜间、队形、方向、速度、季节目标逐项支持，避免仅凭数量。
failure_boundary: 树木没有军事纪律、武器或战争目的，移动可能不完全同步；军队只形容远景迁徙。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 蓝星夜间成片迁徙、轮廓高大且步调向共同方向移动的行走树林
vehicle: 大批士兵在夜色掩护下列队行军，队形连绵、步伐一致、目标明确
ground: 数量多；整体向同一方向移动；夜间行动；远看个体成队；速度稳定；轮廓竖直；有迁徙目标
