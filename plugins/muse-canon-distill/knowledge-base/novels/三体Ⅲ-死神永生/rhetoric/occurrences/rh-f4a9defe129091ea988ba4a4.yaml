chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 城市的其余部分则像是巨树森林中华丽的废墟
sensory_mapping: 树形高楼撑起黑色林冠，下面形态各异的城市在银光里摊成一片仍华丽却已无人使用的遗址。
context_fact: 太空城尚未实际坍塌，仍有三百万人等待末日，但电力、自转和日常秩序已停止。
image_mechanism: 废墟意象把仍完整的城市提前置于毁灭后的观看时间，功能死亡使建筑在物理毁灭前先成为遗迹。
property_alignment: 树形建筑对应巨树森林；其余城区对应林中遗址；形态各异对应华丽残构；停电寂静对应废弃；末日临近对应历史终结。
context_alignment: 程心刚从保存文明遗产的地下墓室出来，屏幕中的活城市也已自动变成下一座文明遗址。
narrative_function: 把六百万人口的现代太空城定格成后世无人的景观，预演它几分钟后的二维化。
transfer_rule: 完整城市写成废墟时，应以功能停摆、无人感、照明变化和已知倒计时支撑时间提前。
failure_boundary: 画面中的建筑大体完整，居民仍有一半留城；废墟表示观察感受与注定结局，并非当前物理状态。
quality_assessment: exemplary
