chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 巨人的头顶已经沐浴在阳光中，金灿灿的，像着火似的
sensory_mapping: 金色火焰；高处燃点；发丝火舌；晨光闪耀；暗海上亮冠
context_fact: 清晨太阳尚未从公主所在位置升起，远处巨人因极高而头顶先进入阳光。
image_mechanism: 低处仍在黎明阴影中，最高处的头发却被光逐绺点燃；风让金色发梢像火舌活动，巨人的高度因此被亮暗边界量出。
property_alignment: 受光头发对应火焰；金色对应火光；飘动发丝对应火舌；高处先照亮对应顶部燃烧；背景未日出对应暗中火冠
context_alignment: 火感来自真实晨光和发丝运动，同时暗示王子越过普通空间尺度、先接触日出。
narrative_function: 用局部燃亮增强巨人奇观，并以光照差提示墓岛空间异常。
transfer_rule: 用着火写受光头发时，应具备暖金色、高亮反差、细丝动态和局部光源先到的条件。
failure_boundary: 光线冷白均匀、头发静止湿暗，或整个场景已同样明亮时，火焰的局部跃动感会消失。
