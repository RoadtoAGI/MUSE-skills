chapter: 【威慑后第一天至第五天，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: simile
quote: 仿佛有一支无形的巨笔，不断地在太空中标示出四维与三维的交界线
sensory_mapping: 黑太空成画纸，一支不可见巨笔蘸蓝光落下，划出万千公里直线，转红弯折后像墨迹散去。
context_fact: 长线只在碎块边缘出现，由四维小质量物质三维展开并衰变形成。
image_mechanism: 巨笔把随机出现的物质线赋予标界功能，线的发亮、弯曲、断裂被读成落笔到收笔的连续动作。
property_alignment: 四维物质长线对应笔画；黑暗太空对应画面；边缘位置对应标界线；无形机制对应看不见的执笔者。
context_alignment: 碎块边缘本不可见，笔迹像现场测绘标志，让两舰能够跟着它谨慎追踪后退界面。
narrative_function: 把降维迹象从物理数据转成宇宙尺度书写，为上帝丁字尺的后续图像预埋制图框架。
transfer_rule: 自然线迹如书写时，应匹配载体表面、落笔过程、线迹位置功能和不可见的生成力。
failure_boundary: 没有主体有意标示边界，长线是物质衰变结果；巨笔不能推出宇宙存在设计者。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 四维物质跌入三维时突然出现、发光弯曲再消失的一道道长线
vehicle: 看不见的巨人握笔，在黑色画面上反复画出边界标记，笔迹短暂发亮
ground: 线条细长且突然生成；出现位置沿同一边界分布；每笔具有起落变化；绘制者本身不可见
