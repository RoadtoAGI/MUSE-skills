chapter: 【公元1453年5月，魔法师之死】
figure_type: simile
quote: 像一轮在黑暗中发着冷光的残月
sensory_mapping: 刀刃曲线与月牙叠合，金属反光被降温为月光，地堡黑暗承担夜空底色。
context_fact: 阴暗地堡中，火把照亮狄奥伦娜拿出的土耳其弯刀。
image_mechanism: 喻体沿刀刃外轮廓精准贴合，再以冷光把视觉色温转成杀伤触感，使尚未挥动的刀先带上寒意。
property_alignment: 弯刀刀身对应残月弧线；金属冷亮对应月牙清光；地堡暗处对应夜空背景。
context_alignment: 她随即说自己不需要刀；武器形象越锋利，越能反衬其隔空能力无需常规刀刃。
narrative_function: 迅速定格道具外形与危险气质，同时为人物拒绝实体武器制造视觉反差。
transfer_rule: 器物外形可选轮廓一笔重合的自然物，再让现场光源支持材质色温；将被弃用的道具先写鲜明，可增强情节反差。
failure_boundary: 直刀、宽刃或暖色反光都会破坏残月的弧度与冷感；明亮环境没有暗背景时，月牙悬浮感也会消失。
