chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 身处他们中间，程心仿佛置身于阴冷的井底
sensory_mapping: 围拢的身体化成井壁，阴沉目光压成井口，程心的寒战给心理井底补上真实冷感。
context_fact: 六人不回答她，只交换目光且神色更阴沉，程心无法判断他们的共同意图。
image_mechanism: 井底把平面包围改造成垂直落差：她不仅被围住，还被放到低处承受看不清出口的压迫。
property_alignment: 六人围绕对应井壁合拢；阴沉目光对应井口俯视；信息不透明对应井深无光；寒战对应井底阴冷。
context_alignment: 候选人群体掌握未明信息，程心虽是中心人物却处在认知低位，空间高差准确表达这种权力倒置。
narrative_function: 在谈话揭示前先制造困陷预感，提示执剑人候选身份背后存在共同而严峻的判断。
transfer_rule: 用井底表现群体压力时，应同时具备环形封闭、视线高差和出口不明；寒冷最好由人物身体反应落地。
failure_boundary: 若围观者友善、人物掌握全局或随时能从明显出口离开，井底的低位与困闭都会过重。
