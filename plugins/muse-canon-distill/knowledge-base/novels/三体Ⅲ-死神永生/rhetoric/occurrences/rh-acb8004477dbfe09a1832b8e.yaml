tenor: 程心被六名沉默而敌意不明的男性候选人围在中央的处境
vehicle: 一个人落在阴冷深井底部，被井口上方的人影俯视
ground: 四周封闭且缺少退路；来自上方的审视造成低位、寒冷和危险感
