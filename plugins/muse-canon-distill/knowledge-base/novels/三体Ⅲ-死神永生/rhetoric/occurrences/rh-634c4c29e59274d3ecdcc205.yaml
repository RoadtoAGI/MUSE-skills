chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 他们的存在，是人类这段不堪回首的历史中唯一的亮色
sensory_mapping: 澳大利亚和空城铺成灰黑历史画布，深山与下水道中的抵抗者成为其上唯一未被涂暗的色块。
context_fact: 抵抗成员知道战斗无望，仍为最后尊严作战并付出极大牺牲。
image_mechanism: 亮色将道德评价转为构图关系，数量极少不削弱可见度，反而因黑背景而更醒目。
property_alignment: 黑暗历史对应暗画面；抵抗行动对应亮色；人数少对应局部色块；尊严被看见对应吸引目光。
context_alignment: 前文希望之星投向三体舰队，此处真正的亮色落在人类抵抗者，纠正光明来源。
narrative_function: 为这一纪元保留正向价值判断，防止群体崩坏被写成全人类同质堕落。
transfer_rule: 历史局部写成亮色时，应先建立总体色调，并用具体行为说明为何该处发亮。
failure_boundary: 抵抗不是历史中唯一值得肯定的行动，唯一属于叙述聚焦；颜色也不能衡量战略成效。
quality_assessment: effective
confidence: 0.98
review_status: reviewed
tenor: 抵抗者在投降、背叛、饥饿和暴政时期保存的人类尊严
vehicle: 一幅阴暗画面中唯一明亮、有色彩并能吸引目光的局部
ground: 总体基调低暗；局部价值与背景形成强反差；少量亮点改变整幅画的道德可读性
