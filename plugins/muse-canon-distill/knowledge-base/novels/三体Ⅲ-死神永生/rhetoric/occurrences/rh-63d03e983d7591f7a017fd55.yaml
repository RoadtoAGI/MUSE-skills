chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 宇宙黑暗的面纱又被揭开一层
sensory_mapping: 六世纪前罗辑掀开第一层黑纱看见黑暗森林，如今关一帆再掀一层，后面露出规律战争的更深暗面。
context_fact: 罗辑冰湖悟出黑暗森林状态；关一帆说明那只是宇宙大战场上的狙击小事。
image_mechanism: 面纱为知识分层，‘又’把两次宇宙认知突破跨六世纪连接；揭开没有带来光，反而看见更深黑暗。
property_alignment: 未知宇宙对应被遮对象；黑暗森林对应首层纱；规律战争对应下一层；关一帆讲述对应揭纱；程心聆听对应观看。
context_alignment: 程心说心中无光后仍要求揭幕，认识行为不再追求光明，而是承受更完整黑暗。
narrative_function: 作为章节级转门提示理论层级升级，同时召回罗辑冰湖的系列关键时刻。
transfer_rule: 真相比作多层面纱时，应标出前一层揭示、当前揭示者、下一层内容和揭开后的认知代价。
failure_boundary: 宇宙真相未必按固定层级排列，关一帆也只掌握一点与猜测；面纱不保证后面存在最终核心。
