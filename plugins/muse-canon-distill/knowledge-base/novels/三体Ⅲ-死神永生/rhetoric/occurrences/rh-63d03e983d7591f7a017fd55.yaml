tenor: 关一帆将向程心进一步透露隐藏在黑暗森林之后的规律武器与宇宙战争真相
vehicle: 覆盖神秘对象的多层黑色面纱被手逐层掀开，每揭一层便多看见部分内里
ground: 真相原被遮挡；遮挡有多层；揭示渐进；观看者主动选择；每次只见局部；颜色与内容皆黑暗；知识不可复原为无知
