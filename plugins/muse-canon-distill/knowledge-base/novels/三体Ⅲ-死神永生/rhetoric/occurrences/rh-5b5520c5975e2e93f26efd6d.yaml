chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 又出现了黑暗森林这个怪物
sensory_mapping: 神学刚修补好伊甸园边界，一头黑暗巨兽又撞进园中，亿万文明的影子挤满原本只为人类设计的空间。
context_fact: 教会用一个多世纪重新解释三体存在，随后黑暗森林揭示宇宙遍布相互猎杀的文明。
image_mechanism: 怪物把理论的教义不相容转成空间入侵，重新解释不再是添一条条文，而是必须处理无法驯化的新物种。
property_alignment: 黑暗森林理论对应怪物；传统教义对应旧秩序；文明众多对应庞大异形；神学困难对应无法安置驯服。
context_alignment: 段落从伊甸园人口荒诞推演到宗教受创，怪物语气属于信仰体系受威胁的视角，而非科学评价。
narrative_function: 以一个入侵形象概括黑暗森林对宗教世界观的二次冲击，为宗教复兴反弹蓄势。
transfer_rule: 新理论如怪物时，应说明它闯入哪套分类、破坏何种秩序、造成何种恐惧和为何难以驯化。
failure_boundary: 理论没有生命或恶意，也可能被教义重新解释；怪物只表现宗教体系感受的异质压力。
quality_assessment: effective
