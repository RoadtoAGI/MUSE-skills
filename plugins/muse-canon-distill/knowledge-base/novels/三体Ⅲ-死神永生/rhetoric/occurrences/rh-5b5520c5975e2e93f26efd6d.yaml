review_status: reviewed
tenor: 令传统宗教教义难以容纳、破坏以人类为中心宇宙秩序的黑暗森林理论
vehicle: 突然闯入既有世界的畸异怪物，体形庞大、规则陌生，使旧秩序恐惧且无法安置
ground: 对象超出原分类；出现带来威胁；迫使旧解释体系变形；难以被温和整合；引发群体恐惧
