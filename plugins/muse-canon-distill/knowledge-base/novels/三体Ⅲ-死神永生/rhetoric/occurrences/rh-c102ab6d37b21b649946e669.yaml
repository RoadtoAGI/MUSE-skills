chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 在那目光中，她感觉自己像纸一样薄而轻飘，甚至完全透明了
sensory_mapping: 罗辑的目光成为透射强光，程心的身体被压成飘纸，轮廓失重，内心暗处也随纸面透明。
context_fact: 两任执剑人短暂对视，程心无法读懂罗辑五十四年沉淀的思想，却感到自己的灵魂被扫过。
image_mechanism: 薄、轻、透明连续减少厚度、重量和遮蔽能力，把权威差距从抽象经验差转成自我实体逐项消失。
property_alignment: 意志未受长期磨炼对应纸薄；面对罗辑失去稳定对应轻飘；被目光看穿对应透明；无法反向读懂对方对应单向透视。
context_alignment: 控制中心上覆厚重地层，罗辑思想也被猜为厚重，程心自觉如纸，厚薄反差构成接任风险的空间尺度。
narrative_function: 在交接瞬间揭示两人威慑人格的不对称，为后来三体世界立即判断她不会按键作准备。
transfer_rule: 人物如纸时，可分别调用厚度、重量和透光性，但每一项都应对应不同心理弱点，避免同义堆叠。
failure_boundary: 若人物此刻坚定沉着、能隐藏意图并反制审视，薄轻透明会贬低真实力量；轻盈愉悦也不是此处的轻飘。
quality_assessment: exemplary
