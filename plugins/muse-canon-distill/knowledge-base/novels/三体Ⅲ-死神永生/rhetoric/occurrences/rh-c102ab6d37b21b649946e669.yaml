review_status: reviewed
tenor: 程心被罗辑深邃锐利的目光扫过时产生的自我脆弱、浅薄和被看穿感
vehicle: 一张厚度近乎为零、没有重量且光线可以穿透的薄纸
ground: 主体感到缺乏抵抗和内在深度；隐藏内容无法遮蔽，整个人可被轻易穿透或看清
