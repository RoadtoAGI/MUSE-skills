chapter: 【掩体纪元67年，二维太阳系】
figure_type: simile
quote: 这话像闪电般照亮了程心黑色的思绪
sensory_mapping: “去找他们”四个字像一道白电劈进她的黑暗意识，未来航线在一瞬间被照出轮廓。
context_fact: 程心刚因责任感到前方航程一片空白，认为去哪里都无意义。
image_mechanism: 先将思绪定色为黑，再用闪电完成认知照明，抽象希望以强烈亮暗切换呈现。
property_alignment: 绝望思绪对应夜空；罗辑的话对应闪电；理解“他们”对应地形显现；瞬时对视对应电光时长；新目标对应被照方向。
context_alignment: 太阳系所有光源熄灭后，最后提供方向的不是天体光，而是一句寻找幸存人类的话。
narrative_function: 结束程心自责的静止状态，把飞船从无目的逃离转成主动寻找共同体。
transfer_rule: 话语比作闪电时，应先建立具体黑暗认知，再让信息瞬时揭示目标，并说明电光之后留下些什么。
failure_boundary: 这句话没有解决位置未知等实际问题，闪电照明也短暂；它只恢复目标感。
quality_assessment: exemplary
confidence: 1.0
review_status: reviewed
tenor: 罗辑提出“去找他们”后，程心在绝望迷茫中突然理解新的航行目标
vehicle: 闪电在漆黑天空瞬间爆亮，短时间照出原本不可见的地形和方向
ground: 出现突然；亮度强；黑暗背景；瞬间揭示结构；方向由不可见转为可辨；冲击感强
