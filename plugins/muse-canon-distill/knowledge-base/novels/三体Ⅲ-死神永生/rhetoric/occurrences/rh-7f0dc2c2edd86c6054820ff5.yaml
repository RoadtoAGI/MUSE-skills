chapter: 【广播纪元7年，云天明的童话】
figure_type: simile
quote: 空灵大画师的身体渐渐变得透明，然后像雾气一般消失了
sensory_mapping: 老画师的衣身先透出后方房间，轮廓像晨雾被光吹薄，最后一缕也散空。
context_fact: 他把唯一保护伞让给露珠，针眼已经完成他的画像，魔力随即生效。
image_mechanism: 雾散提供连续透明化的物态路径，使超自然消失具有可逐帧观看的视觉规则。
property_alignment: 身体透明对应雾的半透；轮廓淡化对应雾散；渐进消失对应稀释；空处对应空气恢复清明。
context_alignment: 他的名字空灵在此获得形态兑现，死亡既轻盈又残酷，与从容笑容相合。
narrative_function: 可视化画像杀人机制，并以缓慢过程让牺牲落到公主眼前。
transfer_rule: 实体消失比作雾散时，应对应透明度曲线、轮廓变化、持续时间和最终残留。
failure_boundary: 人体没有化成水汽，雾可再凝结也不代表画师可复生；只映射消失外观。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 失去黑伞保护后，空灵画师身体由实体逐渐透明直至完全不见的魔法过程
vehicle: 一团雾由浓到淡，被空气缓慢稀释，边缘先散而后整体消失
ground: 透明度逐步增加；轮廓变淡；消失并非瞬断；实体感转为无形；现场留下空处
