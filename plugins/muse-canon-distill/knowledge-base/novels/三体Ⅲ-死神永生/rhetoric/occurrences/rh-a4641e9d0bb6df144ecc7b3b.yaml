chapter: 【威慑后第一年，澳大利亚】
figure_type: analogy
quote: 他那种对苦难现实的超然犹如镇痛剂一般安抚着她那颗破碎的心
sensory_mapping: 程心心中的裂口仍在，老人平静话语像药液沿裂缝渗入，把尖锐疼痛压成可承受的钝感。
context_fact: 老人少谈时局，能在门廊和暴雨中安睡，并以祖先的简朴生存经验面对失去住房的可能。
image_mechanism: 镇痛剂准确区分安抚与治愈：他的超然不改写威慑失败，只改变程心承受事实的身体强度。
property_alignment: 精神创伤对应破碎伤口；超然陪伴对应药剂；情绪缓和对应痛觉下降；现实未变对应伤处仍存。
context_alignment: 弗雷斯曾是医生，医疗喻体自然回到他的身份，也避免把土著智慧神秘化为万能救赎。
narrative_function: 说明程心依恋老人并非获得答案，而是获得继续活下去的止痛条件。
transfer_rule: 把安慰比作药物时，应区分止痛、治疗和治愈，明确作用对象与持续限度。
failure_boundary: 超然可能逃避政治现实，效果也非药理稳定；若人物问题已被解决，镇痛剂会低估改变。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 弗雷斯的平静态度缓解程心因失败、自责和现实苦难产生的精神痛楚
vehicle: 药物进入受伤身体后降低痛觉，使破损处仍在却暂时不再剧烈疼痛
ground: 伤害本身没有消失；外来作用降低痛感；缓解使患者能够继续生活而非立刻治愈
