quote: 你观察精神病人，我观察宇宙；和你一样，我也有一套判定观察对象是否健全的标准
sensory_mapping: 宇宙坐到诊室里的患者位置，星系和维度成为可检查的行为表征，数学美则像一份宇宙病历的正常指标。
context_fact: 韦斯特是心理医生，关一帆认为宇宙三维宏观、其余维度蜷缩，缺乏数学和谐。
image_mechanism: 共同的观察—标准—诊断三步结构将跨学科工作对齐，使宇宙可从客观背景转为有健全状态的检查对象。
property_alignment: 精神病人对应宇宙整体；临床观察对应天文研究；心理健全标准对应数学和谐美；异常症状对应维度不对称。
context_alignment: 类比发生在两位专业观察者对话中，关一帆借医生熟悉的判断框架引出高位截瘫诊断。
narrative_function: 为随后宇宙病人隐喻搭桥，把抽象维度问题转换成可追问的病理命题。
transfer_rule: 跨学科类比应对齐角色、操作步骤和判据，再迁移结论；仅共享观察行为不足以推出相同诊断。
failure_boundary: 若宇宙理论没有明确正常性判据，或数学美只代表个人偏好，精神病诊断的客观性会被过度借用。
