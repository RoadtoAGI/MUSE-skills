chapter: 【银河纪元409年，我们的星星】
figure_type: simile
quote: 程心感觉自己的声音像是从很远的地方传来的
sensory_mapping: “是吗”明明从她口中发出，她听来却像越过二百八十七光年才抵达耳边的一句远声。
context_fact: 程心此前认定约会破灭并精神死亡，AA的消息突然推翻她维持数日的绝望。
image_mechanism: 把创伤性解离空间化，声音与身体的距离复刻她和云天明跨世纪光年的距离。
property_alignment: 自我疏离对应远声；震惊迟钝对应传播延迟；低声答问对应音量衰减；光年情境对应主观距离。
context_alignment: 太阳系最后通信也因距离变成吟唱；此刻她自己的声音取得远距传播质地，私人情感承接宇宙通信。
narrative_function: 避免直接命名震惊，用听觉错位表现希望返回时人物一时无法相信。
transfer_rule: 自我声音比作远声时，应让心理解离、实际距离主题、音量和反应延迟相互支持。
failure_boundary: 声音实际从她喉咙近距传出，没有通信延迟；远感属于瞬时主观知觉。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 得知云天明仍年轻且来过后，程心因震惊产生自我疏离，听自己的答话也不似来自当下身体
vehicle: 遥远空间中的声音经过长距离传来，音量弱、来源与听者分离、带延迟和不真实感
ground: 说话者与声音主观分离；距离感大；声音微弱；现实感下降；反应迟缓；仿佛经长途传播才抵达意识
