chapter: 《时间之外的往事》(节选)
figure_type: analogy
quote: 人类只是在表演着没有观众的行为艺术，不管做得多么诚心，除自己外没人能看到
sensory_mapping: 地球像黑暗剧场中央的孤台，全人类认真拆毁技术、改变制度，观众席却空无一人，远星只见一个暗点。
context_fact: 黑暗森林打击者不做近距离探测，从远方无法分辨太阳系内部的社会和技术变化。
image_mechanism: 行为艺术区分行动真实与传播有效：表演本身可诚恳，观众缺席仍使它不能成为被相信的声明。
property_alignment: 自残方案对应艺术动作；安全意图对应表演主题；宇宙文明对应观众；远距不可见对应空席；地球自证对应自我观看。
context_alignment: 上一段称方案为想象力盛宴，这里把热闹创作置入空剧场，直接拆除方案设计者默认存在的观看者。
narrative_function: 指出所有既有安全声明方案共同的通信缺陷，把问题从诚意转向远距可观测性。
transfer_rule: 沟通行为如无观众表演时，应明确发送动作、目标接收者、缺失通道和真诚为何不能弥补可见性。
failure_boundary: 少数文明可能近距监测地球，内部行动也有自我治理效果；无观众只概括绝大多数远方观察者。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 人类通过降低技术、自残或制度安排证明安全，却无法让远方宇宙文明观测到这些细节
vehicle: 表演者在空场认真完成行为艺术，现场没有观众，动作无法被任何预期评价者看见
ground: 行动以向外传意为目标；执行可以真诚复杂；接收者缺席；没有可见通道时表达失效；只有表演者自知
