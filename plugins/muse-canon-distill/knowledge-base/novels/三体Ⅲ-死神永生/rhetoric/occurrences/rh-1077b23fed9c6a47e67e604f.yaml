chapter: 【掩体纪元67年，二维太阳系】
figure_type: metaphor
quote: 太阳和行星，所有的实体和存在，只是这时空乱流产生的幻象
sensory_mapping: 天体像乱流表面偶然卷出的图案，仿佛手一伸就会穿过，下一阵涌动便不复存在。
context_fact: 二维图纸保留原子信息，却让城市、人体、行星和恒星都失去原有三维功能。
image_mechanism: 幻象把降维的本体损失推到极端：存在的信息仍可见，存在本身却不再被观察者承认为实体。
property_alignment: 二维图形对应幻象画面；时空乱流对应生成介质；无厚度对应不可触；结构变动对应幻象消散；不真实感对应识别怀疑。
context_alignment: 《星空》的画面与真实宇宙重叠后，现实反而取得绘画和幻象属性，艺术与实体的等级彻底倒置。
narrative_function: 为二维太阳系总景下哲学判词，表达降维不只毁灭生命，也动摇“物存在于空间中”的常识。
transfer_rule: 实体写成介质幻象时，应说明仍保留哪些可见信息、失去哪种实在属性、如何依赖背景生成。
failure_boundary: 二维物质仍有物理存在并受引力支配，不是真正幻觉；该句表达三维观察者的本体感受。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 二维化后太阳与行星的物质结构完全摊入空间流动，失去独立体积与稳定实体感
vehicle: 乱流短暂形成、看似有物却没有独立实在、随介质变化即可消散的视觉幻象
ground: 依赖背景介质；边界不稳定；缺乏厚度；看似实体却难触及；可能随流动消失；观察者产生不真实感
