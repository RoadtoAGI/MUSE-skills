chapter: 【掩体纪元11年，掩体世界】
figure_type: simile
quote: 冰面上纵横交错的条纹，像白色巨掌上的掌纹
sensory_mapping: 白色巨掌；交错掌纹；冰冷皮肤；头顶铺展；近距掠过
context_fact: 木卫二以每秒十四千米相对速度从太空城头顶掠过，城市一度飞临其冰洋上空。
image_mechanism: 卫星不再是远处小球，而在头顶展开成一只无边白掌；冰裂缝从地质线条转成皮肤纹路，仿佛巨手贴面扫过城市。
property_alignment: 木卫二对应巨掌；冰冻海洋对应掌面；白冰对应白皮肤；纵横裂纹对应掌纹；卫星三千千米尺度对应巨手；近距掠过对应手掌从头顶扫过
context_alignment: 城市刚像鱼躲在木星后，此刻另一颗卫星以身体部位逼近，生物尺度表现太空城在天体面前的脆弱。
narrative_function: 把高速近飞的表面细节与巨大尺度同时呈现，增强木卫二掠过的压迫感。
transfer_rule: 用掌纹写冰面裂缝时，应匹配浅色大面、网状细线、近距视角、整体弧度和身体尺度反差。
failure_boundary: 表面暗黑无裂纹、条纹平行规则如人工道路，或卫星仍只是远点时，巨掌会失去依据。
