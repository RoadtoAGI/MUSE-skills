chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 心里仍一片黑暗，终日处于抑郁的深海中。精神的痛苦已不再那么灼热、那么撕心裂肺，但变得绵绵无绝期。痛苦和抑郁仿佛是与生俱来地渗透了她的每一个细胞
sensory_mapping: 眼睛重见明亮，心却沉在无光海底，冷水从皮肤向内渗透，直到每个细胞都带着同一种暗色。
context_fact: 程心冬眠五年完成治疗，失明痊愈但精神打击未消退，拒绝信息和公司事务。
image_mechanism: 深海先构造外部抑郁环境，渗透再把水推进身体内部，说明痛苦由剧烈创伤转成稳定人格底色。
property_alignment: 抑郁黑暗对应深海无光；长期压迫对应水压；无绝期对应海域无边；深入性格对应水渗细胞。
context_alignment: AA把苦难水珠从叶面滚落，程心却被同类水性物质内外浸透，相邻段落形成精确人物对照。
narrative_function: 跨过五年时间直接呈现创伤固化结果，解释她为何复明和社会获救后仍无法恢复生活。
transfer_rule: 情绪如浸没介质时，可设计由环境包围到身体渗透的层级，分别对应持续、强度与人格化深度。
failure_boundary: 抑郁不是液体，也不能据细胞渗透断言先天或不可治疗；仿佛明确这是程心的主观永久感。
