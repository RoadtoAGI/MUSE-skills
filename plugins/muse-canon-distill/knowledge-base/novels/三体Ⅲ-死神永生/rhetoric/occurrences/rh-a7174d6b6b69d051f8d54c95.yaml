chapter: 《时间之外的往事》(节选)
figure_type: simile
quote: 人类群体就像海滩上脆弱的沙堡，随时可能在风中崩溃
sensory_mapping: 城市与制度像潮边高高堆起的沙堡，人群是细沙颗粒，等待中的一阵风就能让塔墙整片滑落。
context_fact: 公众知道太阳系将遭打击却不知道何时发生，社会处于危险的茫然等待，官方急需稳定信息。
image_mechanism: 沙堡把庞大文明缩成颗粒临时结构，脆弱不来自规模小，而来自成员间凝聚力在恐惧中流失。
property_alignment: 个人对应沙粒；社会制度对应堆筑形状；共同信念对应湿沙黏合；恐慌冲击对应风；失序对应坍塌。
context_alignment: 人类刚以繁荣自我安慰，沙堡外观仍壮观却经不起风，准确揭示官方担忧的是心理风暴而非即时物理打击。
narrative_function: 把抽象社会稳定风险转成可瞬间崩落的结构，说明为何官方甚至考虑编造信息。
transfer_rule: 群体如颗粒建筑时，要对应个体材料、黏合机制、表面完整性、扰动来源和连锁坍塌。
failure_boundary: 社会有制度修复与主动协作能力，不像沙堡全然被动；一阵风也不必然导致文明崩溃。
quality_assessment: exemplary
confidence: 0.99
review_status: reviewed
tenor: 确认三体毁灭后，失去确定未来、处于茫然等待中的人类社会秩序
vehicle: 海滩上由松散湿沙临时堆成的城堡，外形完整却可能被一阵风吹散坍塌
ground: 整体由大量松散个体构成；稳定依赖暂时黏合；外观像坚固建筑而实际承压弱；轻微扰动即可连锁崩解
