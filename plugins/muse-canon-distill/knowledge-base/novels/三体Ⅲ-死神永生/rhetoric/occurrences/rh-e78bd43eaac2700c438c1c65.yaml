chapter: 【威慑纪元最后十分钟，62年11月28日16:17:34至16:27:58，奥尔特星云外，“万有引力”号和“蓝色空间”号】
figure_type: analogy
quote: 像是有一个与航线垂直的外力连续地作用于水滴，把它从攻击航线上推开
sensory_mapping: 水滴沿白线高速冲刺，一只看不见的手始终从侧面轻推，微弯最终把尖端移出舰体。
context_fact: 态势数据表明两条三十万千米攻击线有极小曲率，与水滴惯常锐角机动不同。
image_mechanism: 侧推模型把肉眼不可见曲率变成持续触力，并可反推出隐形穿梭机在四维方向施力。
property_alignment: 抛物航迹对应持续侧力；垂直偏移对应横推；几十米误差对应微力累积；非水滴机动对应外源作用。
context_alignment: 四维攻击者尚未现形，力学类比先以可验证轨迹为其存在留下证据。
narrative_function: 将侥幸擦过转成有意营救，推动指挥官怀疑蓝色空间号已控制局势。
transfer_rule: 从轨迹推外力时，应匹配力向、曲率、持续时间和累计位移，保留推断性质。
failure_boundary: 实际推力来源和维度当时未知，其他控制故障也可能弯轨；图景不能单独证明施力者身份。
