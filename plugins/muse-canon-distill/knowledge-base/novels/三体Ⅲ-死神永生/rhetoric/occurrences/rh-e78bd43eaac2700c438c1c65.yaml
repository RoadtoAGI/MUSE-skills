review_status: reviewed
tenor: 水滴本应直击飞船却沿微小抛物线持续偏离、最终错靶几十米的航迹
vehicle: 运动物体在前进时不断受到稳定侧向推力，轨迹因此逐渐弯离原直线
ground: 偏移从微小量持续累积；受力方向垂直原运动；速度前进与侧向位移同时发生
