review_status: reviewed
tenor: 三体危机使公众对未来社会的预期从持续进步骤变为毁灭、贫困和痛苦
vehicle: 同一目的地从幸福无缺的天堂瞬间翻转成火海与折磨构成的地狱
ground: 价值评价从最高正向跳到最低负向；目的地仍在前方，却由诱惑转为必须躲避的危险
