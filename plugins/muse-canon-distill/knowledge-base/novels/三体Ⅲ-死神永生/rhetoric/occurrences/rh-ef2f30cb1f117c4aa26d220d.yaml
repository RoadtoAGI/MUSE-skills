chapter: 《时间之外的往事》(节选)
figure_type: metaphor
quote: 一夜之间，未来由天堂变成了地狱
sensory_mapping: 原本明亮向上的未来门口一夜烧成火海，准备冬眠的人从奔赴乐土变为惧怕醒在废墟。
context_fact: 危机前社会相信百年后更美好，危机后绝症病人也担心醒来时文明毁灭、连止痛药都没有。
image_mechanism: 天堂与地狱共用死后去处结构，适合冬眠这种闭眼后抵达另一时代的技术；一夜强调预期而非现实建设的骤变。
property_alignment: 进步预期对应天堂；危机毁灭对应地狱；冬眠苏醒对应抵达彼岸；舆论骤变对应一夜翻转。
context_alignment: 未来在冬眠决策中就是目的地，宗教两极使风险认知的方向逆转无需抽象概率说明。
narrative_function: 解释危机为何解除冬眠限制却降低个人需求，并把时间逃亡的政治语境彻底改写。
transfer_rule: 用天堂地狱写预期翻转时，应保持目标时点不变，只改变抵达后的生活价值；转折需由重大证据触发。
failure_boundary: 未来仅略有恶化或仍有较大改善可能时，天堂到地狱过于绝对；它表达集体预期而非已知事实。
quality_assessment: effective
