chapter: 【银河纪元409年，我们的星星】
figure_type: metaphor
quote: 那人踏着蓝色的草浪向“星环”号走来
sensory_mapping: 蓝草在风里成片伏起，关一帆的腿从草峰间分开一道波纹，像从海浪上走来。
context_fact: 蓝星陆地植被呈蓝色，稍后发现这些草还能以根须作脚迁徙。
image_mechanism: 蓝色先把草原海洋化，风动与人行补上波浪；异星陆地在视觉上取得本应属于海洋的属性。
property_alignment: 蓝草对应海水；草叶起伏对应浪；草原范围对应海面；行走穿草对应踏浪；风对应造浪动力。
context_alignment: 蓝星海洋反而淡黄，陆地蓝草成为视觉海；颜色错置通过草浪一词首次动态显形。
narrative_function: 为关一帆登场提供宁静长镜头，并在揭示植物会行走前暗示草原并非静止地表。
transfer_rule: 草原比作海浪时，应让颜色、风动、范围、穿行动作和真实海洋色彩的反差共同成立。
failure_boundary: 草叶没有液体连续性，关一帆仍踩在土地上；草浪只描述远观起伏与蓝色。
quality_assessment: effective
confidence: 1.0
review_status: reviewed
tenor: 关一帆穿过被风和自身移动扰动、成片起伏的蓝色草原走向飞船
vehicle: 行人踏过蓝色海面连续起伏的波浪，身体在浪峰浪谷间前进
ground: 大片同色介质；表面随风起伏；移动者穿行其上；波纹连续传播；颜色为蓝；视野开阔
