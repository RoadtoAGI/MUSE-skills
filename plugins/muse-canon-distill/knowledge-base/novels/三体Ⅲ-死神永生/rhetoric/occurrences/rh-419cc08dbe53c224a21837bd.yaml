quote: 各种设备发出的嗡嗡声清晰可闻，空气中有一种温暖的感觉，穿梭机复活了
sensory_mapping: 黑冷的金属躯壳重新亮起柔光、发出低鸣并暖起来，像心跳呼吸逐项回到身体。
context_fact: 常规控制系统因低光速停机，神经元计算机历时十六天完成启动。
image_mechanism: 复活把设备重启拆成体温、声音与活动三项生命征象，与冬眠醒来的程心形成同步苏醒。
property_alignment: 设备嗡鸣对应呼吸心跳；空气温暖对应体温；灯光恢复对应睁眼；控制重启对应意识恢复；死船前态对应死亡。
context_alignment: 上一章飞船被写成死船，本章开篇以同一生命框架完成逆转，叙事衔接严密。
narrative_function: 用一句感官总括跨过十六天技术等待，立即确认二人生存希望恢复。
transfer_rule: 机器复活应以先前停机为前提，再选择声音、温度、光和协同动作作为具体生命征象。
failure_boundary: 穿梭机只是备用系统启动，没有意识或真正死亡经验，且常规电子系统仍不可用。
