chapter: 【掩体纪元67年，冥王星】
figure_type: analogy
quote: 地球确实是一个等待终结的好地方，落叶归根嘛
sensory_mapping: 两位远离旧时代的人像被太空吹散的叶片，末日前仍想落回地球这株母树根部。
context_fact: 两人实际乘星环号前往更远的冥王星，只能多争取几天，并不能逃离二维打击。
image_mechanism: 成语把无解的逃亡选择改写为生命归宿：既然不能生存，空间方向便由安全转为回到源头。
property_alignment: 人对应落叶；地球对应根；太空漂泊对应离枝；末日死亡对应凋落；返航愿望对应归根。
context_alignment: 程心来自公元世纪又多次冬眠，地球既是物种故乡也是她个人时代的最后实体坐标。
narrative_function: 说明回地球愿望的情感逻辑，并让曹彬温和转向冥王星任务而不否定死亡选择。
transfer_rule: 用落叶归根写临终返乡时，应具体对齐生命来源、漂泊路径、终点选择和不可逆季节。
failure_boundary: 人并非树叶，死亡也不要求回故乡；两人最终没有归地球，这只是愿望的文化框架。
quality_assessment: conventional
confidence: 1.0
review_status: reviewed
tenor: 程心与AA在生命末期希望回到人类和自己出发的地球等待死亡
vehicle: 树叶凋落后回到生长它的树根附近，完成生命循环
ground: 生命由原处发端；终结后回到原处；归返带安宁；循环首尾闭合；死亡不可避免
