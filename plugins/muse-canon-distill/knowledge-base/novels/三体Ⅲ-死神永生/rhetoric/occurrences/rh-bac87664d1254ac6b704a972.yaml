tenor: 曹彬发现太阳系第三宇宙速度这一关键阈值后显出的顿悟兴奋，并让其他专家迅速理解同一结论
vehicle: 一对先燃亮的火源向四周传播火焰，逐一点燃其他灯芯，使整个圈子由暗转亮
