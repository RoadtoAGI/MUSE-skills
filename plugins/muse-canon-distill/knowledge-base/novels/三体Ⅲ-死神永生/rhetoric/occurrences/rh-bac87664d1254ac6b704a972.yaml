context_fact: 研究者长期卡在低光速与黑洞的联系上，曹彬突然想到每秒十六点七千米的太阳系逃逸速度。
image_mechanism: 关键数字成为火种，先在曹彬眼中燃起，再沿共同物理知识瞬间跨越每个人的视线；群体理解用亮灯次序被看见。
property_alignment: 曹彬顿悟对应首火；眼睛亮对应燃烧；数字解释对应火种；专家理解对应被点燃；兴奋蔓延对应传火；共同知识对应可燃灯芯；解决难题对应环境转亮
context_alignment: 此前程心思想被闪电照亮、AA目光被点燃，光意象持续标记解码时刻；此处从个人亮转为群体传火，规模升级贴合最终突破。
narrative_function: 用视觉连锁表现科学发现的瞬时传播，在公式出现前先让集体顿悟发生。
transfer_rule: 用眼睛点燃眼睛写认知传播时，应有一个明确首悟者、可共享的关键线索、他人依次理解和可见的情绪同步。
failure_boundary: 旁人仍困惑反对、信息没有说出，或眼神变化来自愤怒而非理解时，点燃会错误宣告共识。
