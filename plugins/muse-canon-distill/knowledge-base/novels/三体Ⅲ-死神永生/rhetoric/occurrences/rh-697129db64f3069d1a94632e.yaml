chapter: 【威慑后第一年，澳大利亚】
figure_type: metaphor
quote: 立刻发现这些都是没有IT的死东西
sensory_mapping: 人们手指仍按向熟悉表面，界面却像尸体皮肤一样冰冷无反应，所有光和声音都停止。
context_fact: 超信息社会居民到移民区后习惯性乱点周围物体，却发现没有IT，基本通信也无法保障。
image_mechanism: 死把技术功能视作日常物件的生命，外壳保留与交互消失之间因此产生尸体感。
property_alignment: 物体外形完好对应身体仍在；界面不亮对应生命反应停止；触碰无回应对应尸体不能交流。
context_alignment: 对这代人而言信息交互就是环境活性，称死东西准确呈现他们对普通物质的陌生。
narrative_function: 以一个触摸动作展示技术断代，并为信息失明类比提供物理前奏。
transfer_rule: 设备失效写成死亡时，应保留外壳、指出丧失的响应，并展示用户仍尝试唤醒。
failure_boundary: 桌墙仍能承担物理功能，也可重新接入技术；死只限定交互状态，不等同报废。
