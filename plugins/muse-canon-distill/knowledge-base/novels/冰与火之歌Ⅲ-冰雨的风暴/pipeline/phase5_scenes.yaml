# ── 张力曲线 ──

tension_curve:
  description: >
    全书张力曲线呈"双峰+尾峰"结构：
    第一峰：阿斯塔波之变/斗熊坑（ARC-2 高潮，约 40% 处）——正面情绪峰值
    第二峰：红色婚礼（ARC-3 高潮，约 60% 处）——全书最大负面情绪冲击
    尾峰群：紫色婚礼→比武审判→弑父之夜→石心夫人（ARC-4/5，80-100%）——密集的高潮序列
    两峰之间有一段"通往孪河城"的张力爬升（ARC-3 SEQ1），
    不祥预兆的积累让读者在灾难发生前就已经紧张。
  peaks:
    - S06  # 阿斯塔波之变
    - S13  # 红色婚礼
    - S16  # 紫色婚礼
    - S17  # 比武审判
    - S20  # 弑父之夜
    - S23  # 石心夫人
  valleys:
    - S03  # 琼恩进入曼斯营地（建置性场景，张力较低）
    - S09  # 布兰控制阿多（紧张但规模小）
    - S12  # 进入孪河城（铺垫性场景，张力在酝酿中）

