# Phase 3: 脊椎 — 《冰与火之歌Ⅲ·冰雨的风暴》

# 注：多 POV 群像叙事无单一脊椎。
# 以下提取全书统一的戏剧问题和各线脊椎，
# 然后通过 Arc 框架统一各线的结构节奏。

# ── 全书统一脊椎 ──

inciting_incident:
  description: >
    先民拳峰之战（第148章序幕）+ 各线的承前设定：
    守夜人在先民拳峰遭异鬼袭击溃败，
    同时五王之战进入最危险的阶段——
    罗柏违反佛雷婚约（第162章揭示），
    泰温重返君临掌权（第152章），
    丹妮决定购买无垢者军队（第156章）。
  type: accident  # 异鬼袭击是意外；但罗柏毁约是决定
  timing: 第148-162章（全书前20%为多线激励事件密集区）
  balance_before: >
    五王之战已进行一年：罗柏在战场上连胜但战略孤立，
    提利昂因黑水河之战获功但被架空，
    琼恩在野人营地潜伏，丹妮拥有三条幼龙但无军队。
  balance_after: >
    所有平衡被打破：守夜人溃败、莫尔蒙被杀（组织崩溃），
    罗柏毁约（政治危机），提利昂被命令娶珊莎（被工具化），
    丹妮获得无垢者（从难民到征服者的跃迁）。
  impact_on_protagonist: >
    每条线的主角被推入不可逆的轨道：
    琼恩必须在忠诚与生存间选择，
    提利昂被迫成为父亲的棋子，
    罗柏必须面对毁约的后果。

# ── 各线脊椎 ──

desire_object:
  # 多 POV 无单一欲望对象，按线提取
  conscious: >
    各线显意识追求：
    琼恩——履行守夜人职责、守卫长城；
    提利昂——获得父亲认可、保住权力；
    罗柏/凯特琳——赢得战争、收复北境；
    詹姆——回到瑟曦身边、恢复自由；
    丹妮——建立军队回维斯特洛夺回铁王座；
    艾莉亚——回到家人身边；
    珊莎——逃离君临获得自由；
    戴佛斯——保护史坦尼斯免受梅丽珊卓影响。
  unconscious: >
    各线真正需要：
    琼恩——找到身份认同（不再是私生子）；
    提利昂——被当作一个完整的人对待（而非残缺的怪物）；
    詹姆——被当作有荣誉的人（而非弑君者）；
    丹妮——学会统治而非仅仅征服；
    艾莉亚——接受失去（家破人亡后如何继续活下去）；
    珊莎——长大（从被动的天真少女变成理解权力的人）；
    戴佛斯——成为有意义的人（从走私贩到拯救世界的关键推手）。
  tension: >
    每条线的张力核心相同：
    **你追求的东西和你真正需要的东西之间存在根本冲突。**
    琼恩追求职责但需要身份→当总司令即两者合一；
    提利昂追求父亲认可但需要自我价值→弑父即认可幻灭后的觉醒；
    詹姆追求回到瑟曦但需要荣誉→与瑟曦决裂即荣誉的重生。

spine_statement: >
  在权力的游戏中，每个人都在追求他们以为自己想要的东西
  （权力/复仇/回家/爱情），而故事的进程迫使他们面对
  自己真正需要的东西（身份/荣誉/成长/接受失去），
  这一过程中有人被毁灭（罗柏/凯特琳），有人获得重生（詹姆/琼恩），
  有人走向未知（艾莉亚/丹妮/提利昂）。

spine_type: unconscious
  # 多数角色的核心弧光由不自觉需要驱动

dramatic_question:
  question: >
    在一个奖赏背叛、惩罚荣誉的世界中，
    选择坚守誓言和道德的人是否注定失败？
  obligatory_scene: >
    红色婚礼（第199章）回答了"是"（荣誉者被毁灭），
    但琼恩当选总司令（第227章）和詹姆赠剑布蕾妮（第220章）
    提供了辩证的"但"——荣誉在政治层面失败，在个体层面获胜。

opposing_forces:
  internal:
    - 琼恩的誓言 vs 对耶哥蕊特的爱 / 对临冬城的渴望
    - 提利昂对父亲的爱恨交织
    - 詹姆的弑君者耻辱 vs 内心的荣誉感
    - 丹妮的征服欲望 vs 统治责任
    - 艾莉亚的复仇执念 vs 残存的人性（拒绝给猎狗慈悲一刀）
  personal:
    - 提利昂 vs 泰温/瑟曦（家族内部的权力压迫）
    - 罗柏 vs 佛雷/波顿（盟友变为杀手）
    - 琼恩 vs 艾里沙·索恩/杰诺斯·史林特（守夜人内部政治）
    - 珊莎 vs 小指头（保护者即操控者）
    - 戴佛斯 vs 梅丽珊卓（良心 vs 狂信）
  external:
    - 野人大军南侵长城（生存级威胁）
    - 异鬼的超自然威胁（文明级危机，本卷为远景）
    - 五王之战的政治格局剧变（红色婚礼→兰尼斯特独霸）
    - 奴隶湾的奴隶制社会结构（丹妮征服的外部阻力）

# ── 幕/Arc 框架 ──

arcs:
  - arc_id: ARC-1
    name: "棋局初设"
    chapters: "第148-169章"
    value_at_start: >
      各方势力处于不稳定平衡：守夜人在先民拳峰扎营，
      罗柏在西境连胜，提利昂仍有黑水河之战的余威，
      丹妮拥有龙但无军队。
    value_at_end: >
      所有平衡被打破：守夜人溃败，提利昂被架空，
      罗柏毁约的后果浮现——
      **詹姆断手**是本 Arc 的核心价值逆转（身份毁灭）。
    climax_event: "詹姆被山羊砍断右手（第169章）"
    function_note: >
      建置型 Arc——确立所有线索的起点和方向。
      通过詹姆断手宣告本书的主题：
      在这个世界里，你最珍视的东西（詹姆的剑手）会被最粗暴地夺走。

  - arc_id: ARC-2
    name: "征服与觉醒"
    chapters: "第170-192章"
    value_at_start: >
      各线主角处于被动/受困状态：詹姆断手后濒死，
      提利昂被命令娶珊莎，琼恩深入敌后，丹妮尚无军队。
    value_at_end: >
      多线完成关键转折：丹妮通过龙火获得无垢者（征服者觉醒），
      詹姆在澡堂揭示弑君真相（身份重塑），
      布兰首次控制人类意识（超自然觉醒），
      詹姆跳入熊坑救布蕾妮（荣誉行动）。
    climax_event: "詹姆折返赫伦堡跳入斗熊坑救布蕾妮（第192章）"
    function_note: >
      递进型 Arc——从被动到主动的转折。
      丹妮的阿斯塔波之变（第175章）是本 Arc 最壮观的场景，
      但詹姆跳入熊坑是主题上更关键的转折——
      它标志着"弑君者"开始成为"守誓者"。

  - arc_id: ARC-3
    name: "红色婚礼"
    chapters: "第193-205章"
    value_at_start: >
      罗柏制定了收复北境的三路计划，
      艾德慕即将完成佛雷联姻，
      形势似乎在好转。
    value_at_end: >
      **全书核心灾难**：罗柏和凯特琳被杀，北方独立覆灭；
      琼恩失去耶哥蕊特；丹妮征服弥林但失去信任体系；
      布兰穿越长城走向未知。
    climax_event: "红色婚礼——罗柏和凯特琳在婚宴中被佛雷/波顿联手屠杀（第199章）"
    function_note: >
      灾难型 Arc——全书的情感核弹。
      红色婚礼不仅是单一事件，而是整个五王之战的终结符号：
      背叛比勇气更有效，权谋比战场更致命。
      所有后续 Arc 都是这场灾难的余震。

  - arc_id: ARC-4
    name: "审判与崩塌"
    chapters: "第206-221章"
    value_at_start: >
      红色婚礼后兰尼斯特看似全面胜利：
      北方被征服，乔佛里即将大婚，提利昂被边缘化。
    value_at_end: >
      兰尼斯特从内部崩塌：乔佛里被毒死，提利昂被判死刑，
      珊莎逃离——同时外部出现转机：
      史坦尼斯击溃野人大军，长城危机解除。
    climax_event: "史坦尼斯大军突至击溃野人，曼斯被俘（第221章）"
    function_note: >
      逆转型 Arc——胜者变败者。
      紫色婚礼（第208章）和比武审判（第218章）是内部高潮，
      但史坦尼斯救援长城（第221章）才是结构转折——
      它回应了戴佛斯线的因果链（求援信→北上→击溃野人），
      证明在权力游戏之外还有更大的棋局。

  - arc_id: ARC-5
    name: "抉择与重生"
    chapters: "第222-229章"
    value_at_start: >
      各线主角面临终极选择：
      提利昂被判死刑，琼恩面对临冬城诱惑，
      艾莉亚与垂死的猎狗同行。
    value_at_end: >
      每个角色做出定义性选择：
      提利昂弑父（选择反抗而非顺从），
      琼恩拒绝临冬城当选总司令（选择职责而非欲望），
      艾莉亚前往布拉佛斯（选择未知而非回头），
      詹姆赠剑布蕾妮（选择荣誉而非瑟曦），
      石心夫人复活（爱变为复仇——非选择的选择）。
    climax_event: "提利昂弑父之夜——勒死雪伊、射杀泰温（第225章）"
    function_note: >
      高潮型 Arc——全书主控思想在此显现。
      提利昂弑父是全书最大的单一动作——
      它同时解决了提利昂线（反抗父权）和君临政治线（权力真空）。
      但主控思想的辩证面由琼恩的选择（第227章）完成：
      拒绝私欲、选择职责——证明荣誉在个体层面可以获胜。

story_climax_design:
  # 多 POV 无单一故事高潮，以提利昂线为核心高潮，琼恩线为辩证高潮
  crisis:
    dilemma: >
      提利昂被詹姆救出后得知泰莎真相——
      是悄悄逃走保全性命，还是去找泰温算最后一笔账？
    option_a: 逃走——活命但永远带着屈辱
    option_b: 去找泰温——可能丧命但获得心理解放
    character_revelation: >
      提利昂选择了去找泰温，途中发现雪伊在泰温床上。
      这个选择揭示：提利昂追求的从来不是权力或认可，
      而是**真相**——他需要知道自己是否被所有人欺骗。

  climax:
    action: >
      提利昂勒死雪伊（背叛的代价），
      用十字弓射杀坐在厕所上的泰温（权力的虚幻），
      泰温最后的话"不准用那个词"（拒绝承认妓女的存在→拒绝承认提利昂的人性）。
    value_change:
      from: "提利昂是泰温的工具/受害者"
      to: "提利昂以弑父的方式宣告自主——但也失去了一切"
    controlling_idea_expression: >
      泰温——全书最强大的权力操纵者——死于自己最蔑视的儿子之手，
      死在最私密、最无尊严的场所（厕所），
      证明了"以权力建立的秩序终将被权力摧毁"。
      但提利昂也为此失去了最后的情感联系（雪伊之死），
      证明了主控思想的反讽：胜利者也是受害者。

  resolution:
    new_balance: >
      旧秩序崩塌、新秩序萌芽：
      泰温之死→兰尼斯特权力真空（瑟曦独揽大权）；
      琼恩当选总司令→守夜人获得新领导力；
      史坦尼斯在长城→新的权力博弈；
      丹妮留在弥林→东方线暂时脱离维斯特洛主线；
      石心夫人复活→复仇正义在暗处运作。
    lingering_feeling: >
      苦涩的转折感——没有真正的赢家。
      正义没有得到伸张（佛雷/波顿仍然掌权），
      但种子已经种下（石心夫人的复仇、提利昂的流亡、琼恩的崛起）。
      读者被留在一个"暴风雨后短暂平静"的状态中——
      知道更大的风暴即将到来。
