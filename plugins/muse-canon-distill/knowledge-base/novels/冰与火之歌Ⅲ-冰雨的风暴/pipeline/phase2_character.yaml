# Phase 2: 角色系统 — 《冰与火之歌Ⅲ·冰雨的风暴》
# 系统设计图：只记角色之间的关系，不记个体画像。
# 个体画像见 characters/*.md

# ── 群像结构 ──

cast_overview:
  # 多 POV 无单一主角。按叙事功能分层。
  protagonist: >
    群像主角（10 个 POV 角色），按本卷弧光深度排序：
    提利昂（权力与父权的终极对抗）、
    琼恩（身份认同→领袖）、
    詹姆（道德重生）、
    艾莉亚（失去与求生）、
    凯特琳（爱与毁灭→复仇）
  antagonist: >
    无单一反派。对抗力量分三层：
    1. 系统性对抗：封建权力结构本身（背叛比忠诚更受奖赏）
    2. 个体对手：泰温（提利昂线）、瓦德·佛雷+波顿（凯特琳/罗柏线）、
       梅丽珊卓（戴佛斯线）、曼斯·雷德（琼恩线前半）
    3. 超自然对抗：异鬼/尸鬼（长城线，本卷为远景威胁）
  supporting_cast:
    - name: 罗柏·史塔克
      function: "悲剧英雄——战场无败的年轻王因政治天真被灭。他的死是全书主题的核心论证。"
    - name: 布蕾妮
      function: "詹姆的道德镜像——她的存在迫使詹姆面对自己被遗弃的荣誉。"
    - name: 桑铎·克里冈（猎狗）
      function: "艾莉亚的黑暗导师——教会她暴力世界的生存法则，同时展示仇恨的代价。"
    - name: 雪伊
      function: "提利昂线的情感陷阱——她的存在让提利昂无法理性自保，最终成为悲剧催化剂。"
    - name: 奥柏伦·马泰尔（红毒蛇）
      function: "复仇的化身——他的比武审判展示'正义的复仇'如何因执念而功亏一篑。"
    - name: 山姆威尔·塔利
      function: "知识型英雄——在武力世界中以智慧和勇气（龙晶杀异鬼、操纵选举）创造奇迹。"
    - name: 培提尔·贝里席（小指头）
      function: "幕后操纵者——全系列阴谋的总设计师，珊莎线的终极对手/导师。"
    - name: 梅丽珊卓
      function: "信仰的极端化身——与戴佛斯的常识理性形成对比。"
    - name: 耶哥蕊特
      function: "琼恩的自由诱惑——她代表了琼恩可以选择但最终放弃的另一种人生。"
    - name: 瓦里斯
      function: "信息掮客——在提利昂线中既是工具又是不确定因素，最终帮助逃亡。"

# ── 对比轴 ──

contrast_axes:
  # 本书最核心的角色设计是通过"相似处境、不同选择"来揭示主题

  - axis: "父权压迫下的不同反应"
    characters: [提利昂, 詹姆, 瑟曦]
    description: >
      三个兰尼斯特子女面对同一个父亲：
      提利昂——被蔑视→反抗→弑父（以暴力打破父权）；
      詹姆——被工具化→拒绝继承→选择自己的道路（以拒绝脱离父权）；
      瑟曦——被忽视→模仿父亲→成为新的暴君（以复制延续父权）。

  - axis: "荣誉在压力下的不同表现"
    characters: [琼恩, 罗柏, 詹姆, 戴佛斯]
    description: >
      琼恩——在卧底中保持底线（拒绝杀老人），最终选择职责而非私欲；
      罗柏——为荣誉处决卡史塔克（正确但致命），为爱情毁约（高尚但灾难）；
      詹姆——年轻时为救城弑君，十七年背负骂名后终于被理解；
      戴佛斯——以走私贩的身份做出整本书中最关键的政治决策（求援信）。

  - axis: "失去家人后的不同走向"
    characters: [艾莉亚, 珊莎, 凯特琳/石心夫人]
    description: >
      艾莉亚——失去一切后走向无名（前往布拉佛斯成为无面者）；
      珊莎——失去一切后被迫学会伪装（化名阿莲，成为棋子）；
      凯特琳——失去一切后被复活，爱变为纯粹的仇恨（石心夫人）。

  - axis: "权力的获取与使用"
    characters: [丹妮莉丝, 泰温, 小指头]
    description: >
      丹妮——以解放者身份获取权力（龙火+解放奴隶），最终选择学习统治；
      泰温——以恐惧和算计获取权力（红色婚礼），但被自己蔑视的人反噬；
      小指头——以信息和操纵获取权力（毒杀、陷害），代价是永远不被信任。

  - axis: "忠诚的代价"
    characters: [戴佛斯, 布蕾妮, 山姆威尔]
    description: >
      三个"配角型"忠诚者在本书中做出了改变全局的关键行动：
      戴佛斯偷走艾德瑞克+求援信→史坦尼斯北上；
      布蕾妮的存在→詹姆道德重生；
      山姆的政治操纵→琼恩当选总司令。
      忠诚者表面被动，实际塑造了故事走向。

# ── 关系网络 ──

relationships:
  power_dynamics:
    - pair: [泰温, 提利昂]
      dynamic: >
        绝对的父权压迫。泰温掌控一切——职位、婚姻、生死。
        提利昂的每次反抗都被碾碎，直到弑父之夜的终极逆转。
    - pair: [泰温, 詹姆]
      dynamic: >
        泰温视詹姆为理想继承人，但詹姆拒绝扮演这个角色。
        两人的冲突是安静的——詹姆用沉默和拒绝而非暴力来对抗。
    - pair: [曼斯·雷德, 琼恩]
      dynamic: >
        曼斯既是琼恩的对手也是镜像——两人都是守夜人叛离者，
        区别在于曼斯选择了自由，琼恩最终选择了职责。
    - pair: [小指头, 珊莎]
      dynamic: >
        小指头是珊莎的保护者/操控者/权力导师。
        他看到的是凯特琳的影子，但珊莎终将超越这个角色。
    - pair: [丹妮莉丝, 乔拉]
      dynamic: >
        乔拉的情感依附vs丹妮的女王权威。
        间谍身份的揭露彻底打破了这段关系——信任一旦破碎不可修复。

  key_tensions:
    - "提利昂与瑟曦的权力争斗贯穿全书——瑟曦操纵审判，提利昂最终以弑父回应"
    - "琼恩在守夜人内部面对索恩/史林特的政治排挤——直到选举翻盘"
    - "詹姆与布蕾妮从押送者/囚徒到生死之交——本书最核心的关系转变"
    - "艾莉亚与猎狗的共生/对抗——他保护她同时教会她暴力"
    - "戴佛斯与梅丽珊卓的良心vs狂信——围绕史坦尼斯展开的灵魂争夺"

  potential_shifts:
    - "詹姆→完成从弑君者到守誓者的转变（本卷已实现）"
    - "珊莎→从被动棋子到主动棋手（本卷仍在过渡中）"
    - "提利昂→弑父后从兰尼斯特体系中彻底脱离（去向未定）"
    - "凯特琳→从母亲到石心夫人的不可逆变形（本卷终章揭示）"
    - "艾莉亚→从失家少女到布拉佛斯无面者学徒（本卷末启动）"
