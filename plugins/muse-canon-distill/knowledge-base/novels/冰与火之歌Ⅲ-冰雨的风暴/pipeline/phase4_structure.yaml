# Phase 4: 结构（序列展开）— 《冰与火之歌Ⅲ·冰雨的风暴》

# 注：多 POV 小说的序列往往跨越多条叙事线。
# 以下按 Arc 展开关键序列，标注各序列的主导叙事线。

arc_expansions:

  - arc_id: ARC-1
    sequences:
      - seq_id: ARC1-SEQ1
        name: "溃败与逃亡"
        chapters: "148-153"
        core_conflict: 各线主角在战败/失权后如何求生
        escalation_direction: >
          从物理层面的生存危机（先民拳峰异鬼→戴佛斯困礁→艾莉亚出逃）
          到权力层面的被剥夺（提利昂被泰温架空）
        sequence_climax: "提利昂向泰温索要凯岩城被拒（第152章）——父子关系定调"
        closed: 各线主角的前作遗留状态被清算
        opened: >
          提利昂的核心冲突确立（追求认可 vs 被蔑视），
          戴佛斯的反梅丽珊卓动机确立
        dominant_threads: [提利昂线, 长城线, 戴佛斯线]

      - seq_id: ARC1-SEQ2
        name: "暗流涌动"
        chapters: "154-162"
        core_conflict: 各方势力在表面平静下暗中布局
        escalation_direction: >
          从个人层面（珊莎被提利尔家拉拢、琼恩打入野人内部）
          到政治层面（罗柏毁约的后果浮现、丹妮决定购买军队）
          到存在层面（布兰决定北行寻找三眼乌鸦）
        sequence_climax: "罗柏已娶维斯特林家女孩的事实揭露（第162章）——全书最大灾难的导火索"
        closed: 各线方向确立，铺垫完成
        opened: >
          罗柏毁约→佛雷复仇动机激活，
          珊莎嫁高庭计划→提利尔/兰尼斯特的信息战，
          丹妮的无垢者计划→征服叙事启动

      - seq_id: ARC1-SEQ3
        name: "身份粉碎"
        chapters: "163-169"
        core_conflict: 核心角色的身份被暴力摧毁或根本动摇
        escalation_direction: >
          从信息层面（先民拳峰毁灭的发现、泰温命提利昂娶珊莎）
          到身体层面（詹姆断手——全书第一个重大暴力转折）
        sequence_climax: "詹姆被砍断右手（第169章）——剑士身份的物理性毁灭"
        closed: Arc 1 的建置阶段结束，所有角色被推入不可逆轨道
        opened: >
          詹姆的身份危机（没有剑的弑君者是谁？），
          罗柏损失卡史塔克骑兵（军事形势恶化），
          提利昂被迫娶珊莎（工具化加深）
        dominant_threads: [詹姆线, 提利昂线, 琼恩线]

    arc_progression_note: >
      ARC-1 内部三个序列呈递进的"剥夺"模式：
      SEQ1 剥夺权力（提利昂被架空），
      SEQ2 剥夺盟友（罗柏毁约后陷入政治孤立），
      SEQ3 剥夺身份（詹姆断手）。
      每次剥夺的层次更深、更不可逆。

  - arc_id: ARC-2
    sequences:
      - seq_id: ARC2-SEQ1
        name: "觉醒之火"
        chapters: "170-177"
        core_conflict: 弱者如何获得力量？力量的代价是什么？
        escalation_direction: >
          从预言铺垫（冥河之女的三个梦境）→ 丹妮隐藏实力（假装不懂瓦雷利亚语）
          → 丹妮以龙火屠灭阿斯塔波（力量的爆发性展示）
          → 珊莎被迫嫁提利昂（力量的缺失）
        sequence_climax: "阿斯塔波之变——丹妮以龙火获得无垢者军队（第175章）"
        closed: 丹妮从流亡者完成到征服者的跃迁
        opened: 丹妮的统治考验（有了军队，然后呢？）
        dominant_threads: [丹妮线, 珊莎线]

      - seq_id: ARC2-SEQ2
        name: "真相与转变"
        chapters: "178-188"
        core_conflict: 被遮蔽的真相如何改变身份认同？
        escalation_direction: >
          从身体的跨越（野人翻越长城）→ 求生意志的觉醒（詹姆从求死到求生）
          → 守夜人军团的组织崩溃（莫尔蒙被杀）
          → 身份的根本揭示（詹姆弑君真相、布兰控制人类意识）
        sequence_climax: "詹姆在澡堂向布蕾妮讲述弑君全部真相（第185章）"
        closed: 詹姆的"弑君者"单一标签被打破——他曾是救世者
        opened: >
          詹姆开始重建荣誉的可能性，
          布蕾妮被扣留（为斗熊坑铺垫）
        dominant_threads: [詹姆线, 长城线, 布兰线]

      - seq_id: ARC2-SEQ3
        name: "选择与行动"
        chapters: "189-192"
        core_conflict: 知道真相后如何行动？
        escalation_direction: >
          从琼恩暴露身份叛离野人（选择忠诚）
          → 丹妮渊凯之战胜利（选择解放）
          → 詹姆折返赫伦堡救布蕾妮（选择荣誉）
        sequence_climax: "詹姆跳入斗熊坑救布蕾妮（第192章）"
        closed: Arc 2 的觉醒进程完成——詹姆用行动证明了新的身份
        opened: >
          琼恩带伤逃向黑城堡（长城防御线启动），
          艾莉亚被猎狗劫持（第191章，新的不确定性）
        dominant_threads: [詹姆线, 琼恩线, 丹妮线]

    arc_progression_note: >
      ARC-2 的三个序列构成"认知→揭示→行动"的觉醒弧：
      SEQ1 展示力量的获得（丹妮）和预言的铺垫，
      SEQ2 揭示被遮蔽的真相（詹姆、布兰），
      SEQ3 将觉醒转化为行动（詹姆救人、琼恩回归）。

  - arc_id: ARC-3
    sequences:
      - seq_id: ARC3-SEQ1
        name: "通往孪河城"
        chapters: "193-198"
        core_conflict: 命运的齿轮如何不可阻挡地转动？
        escalation_direction: >
          从战略部署（罗柏的三路夹击计划、继承人文件）
          → 不祥预兆积累（灰风拒绝进城、猎狗带艾莉亚赶赴婚宴）
          → 短暂的虚假安全（婚宴开始，一切似乎正常）
        sequence_climax: "罗柏军抵达孪河城，灰风拒绝进城被隔离（第197章）——最后的警告被忽视"
        closed: 所有角色到位，灾难不可避免
        opened: 红色婚礼的倒计时
        dominant_threads: [凯特琳线, 艾莉亚线]

      - seq_id: ARC3-SEQ2
        name: "红色婚礼"
        chapters: "199-201"
        core_conflict: 当背叛碾碎一切时，幸存者如何继续？
        escalation_direction: >
          凯特琳内视角经历屠杀全过程（第199章）
          → 艾莉亚外围目击营地毁灭、被猎狗击昏（第200章）
          → 提利昂事后得知真相，泰温揭露幕后策划（第201章）
        sequence_climax: "凯特琳被割喉（第199章）——全书情感核弹"
        closed: 北方独立运动终结，史塔克家族的王权覆灭
        opened: >
          泰温揭露布局（波顿为北境守护），
          猎狗带着昏迷的艾莉亚逃离，
          复仇的种子种下
        dominant_threads: [凯特琳线, 艾莉亚线, 提利昂线]

      - seq_id: ARC3-SEQ3
        name: "余震"
        chapters: "202-205"
        core_conflict: 灾难后各线如何重组？
        escalation_direction: >
          从诅咒"应验"的回响（戴佛斯读到求援信）
          → 长城防御战爆发、耶哥蕊特之死（琼恩线的个人灾难）
          → 布兰穿越长城（希望的种子）
          → 丹妮征服弥林但信任体系崩塌（巴利斯坦揭发乔拉）
        sequence_climax: "巴利斯坦揭发乔拉为间谍（第205章）——丹妮的信任危机"
        closed: >
          红色婚礼的政治余震扩散完毕，
          新的力量对比确立（兰尼斯特独霸、北方沦陷）
        opened: >
          戴佛斯的求援信→史坦尼斯北上的可能性，
          琼恩从守卫者到指挥者的角色跃迁
        dominant_threads: [戴佛斯线, 琼恩线, 丹妮线, 布兰线]

    arc_progression_note: >
      ARC-3 是全书的情感和叙事重心。
      三个序列构成"不祥预兆→灾难爆发→余震扩散"的经典灾难弧。
      红色婚礼的叙事力量来自三视角的层叠：
      凯特琳的内在恐怖→艾莉亚的外围无力→提利昂的事后揭秘。

  - arc_id: ARC-4
    sequences:
      - seq_id: ARC4-SEQ1
        name: "紫色婚礼"
        chapters: "206-212"
        core_conflict: 胜利者内部如何自我毁灭？
        escalation_direction: >
          从表面繁华（乔佛里大婚、权力鼎盛）
          → 乔佛里被毒死（第208章，胜利者内部的暗算）
          → 珊莎逃离、小指头灭口唐托斯（第209章，阴谋浮现）
          → 詹姆拒绝继承凯岩城（第210章，内部分裂）
          → 长城大战、诺伊战死、琼恩接管指挥（第212章）
        sequence_climax: "琼恩接管长城指挥权——'长城是你的了，琼恩·雪诺'（第212章）"
        closed: 乔佛里之死打破兰尼斯特的胜利表象
        opened: >
          提利昂入狱→审判线启动，
          珊莎进入小指头势力范围，
          琼恩从士兵到领袖的跃迁
        dominant_threads: [提利昂线, 珊莎线, 琼恩线]

      - seq_id: ARC4-SEQ2
        name: "审判与拯救"
        chapters: "213-221"
        core_conflict: 正义能否通过制度实现？
        escalation_direction: >
          从艾莉亚/猎狗的流浪（战争废墟中的个体命运）
          → 比武审判：奥柏伦被魔山反杀（第218章，制度正义的失败）
          → 丹妮决定留在弥林（第219章，征服者的自我约束）
          → 詹姆赠剑布蕾妮（第220章，个人正义的实践）
          → 史坦尼斯击溃野人（第221章，外部力量打破僵局）
        sequence_climax: "史坦尼斯大军突至击溃野人，曼斯被俘（第221章）"
        closed: >
          长城军事危机解除，
          丹妮的征服阶段告一段落（转入统治），
          詹姆的道德转变以赠剑完成
        opened: >
          提利昂被判死刑（生死悬念），
          史坦尼斯入场（新权力变量），
          珊莎在小指头控制下（新的棋局）
        dominant_threads: [提利昂线, 琼恩线, 詹姆线, 丹妮线]

    arc_progression_note: >
      ARC-4 双线高潮结构——
      君临线（紫色婚礼→审判）展示权力内部的自毁，
      长城线（攻防战→史坦尼斯救援）展示更大格局的力量介入。
      两条线在时间上平行但因果上独立，
      通过戴佛斯的求援信实现唯一的因果连接。

  - arc_id: ARC-5
    sequences:
      - seq_id: ARC5-SEQ1
        name: "终极抉择"
        chapters: "222-227"
        core_conflict: 每个角色面对终极选择——定义"你是谁"
        escalation_direction: >
          从艾莉亚抛下猎狗登上前往布拉佛斯的船（第222章，选择未知）
          → 山姆操纵选举（第223-226章，知识即权力）
          → 琼恩面对"临冬城公爵"诱惑（第224章，欲望 vs 职责）
          → 提利昂弑父之夜（第225章，全书最大单一动作）
          → 白灵回归，琼恩拒绝诱惑当选总司令（第227章，职责战胜欲望）
        sequence_climax: "提利昂勒死雪伊、射杀泰温（第225章）——兰尼斯特帝国从内部崩塌"
        closed: >
          各线主角的身份危机获得（暂时的）回答：
          提利昂选择反抗，琼恩选择职责，艾莉亚选择重生
        opened: 每个"回答"都打开新的不确定性（提利昂流亡何方？琼恩如何治理？）
        dominant_threads: [提利昂线, 琼恩线, 艾莉亚线]

      - seq_id: ARC5-SEQ2
        name: "余音与回响"
        chapters: "228-229"
        core_conflict: 真相与复仇——故事的最终底色
        escalation_direction: >
          从珊莎堆雪模型的宁静假象
          → 莱莎歇斯底里揭露全书第一案真相（琼恩·艾林之死是小指头策划）
          → 小指头推莱莎出月门（第228章）
          → 终章视角切换到佛雷家——石心夫人以复活之身审判并绞死佛雷人（第229章）
        sequence_climax: "石心夫人（复活的凯特琳）点头判死佛雷家人（第229章）——全书终幕"
        closed: >
          全书以复仇的意象收束——红色婚礼的罪行开始遭到清算。
          同时揭露全系列的阴谋源头（小指头策划琼恩·艾林之死）。
        opened: >
          石心夫人的复仇将走向何方？
          小指头掌控谷地后野心几何？
          珊莎是棋子还是将成为棋手？
        dominant_threads: [珊莎线, 终章]

    arc_progression_note: >
      ARC-5 是全书的收束弧，采用"抉择→后果→回响"结构。
      提利昂弑父（SEQ1）是动作层面的高潮，
      石心夫人（SEQ2）是主题层面的终章——
      证明爱（凯特琳对子女的爱）在被毁灭后
      不会消失，而是变形为不可控的复仇力量。

# ── 全篇递进关系 ──

arc_progression:
  impact_escalation: >
    ARC-1（身份毁灭：詹姆断手）→ 个人层面
    ARC-2（力量觉醒：斗熊坑救援）→ 人际层面
    ARC-3（红色婚礼）→ 政治/文明层面（一个王国的覆灭）
    ARC-4（紫色婚礼+史坦尼斯救援）→ 权力结构层面（旧秩序崩塌+新力量介入）
    ARC-5（弑父+总司令+石心夫人）→ 存在层面（身份重定义+死亡与复活的终极问题）
    冲击力严格递增：从个体痛苦到集体灾难到秩序重建。

  causal_chain: >
    ARC-1 罗柏毁约 →
    ARC-2 佛雷被激怒 + 泰温暗中策划 →
    ARC-3 红色婚礼（罗柏/凯特琳之死）→
    ARC-4 兰尼斯特看似全胜但内部腐烂（乔佛里被杀）→
    ARC-5 泰温被杀（权力帝国崩塌）+ 石心夫人复活（复仇开始）

# ── 多线叙事 ──

narrative_threads:
  - name: "君临权力线"
    description: 兰尼斯特家族的权力运作与内部崩溃
    primary_arcs: [ARC-1, ARC-4, ARC-5]
    pov_characters: [提利昂, 珊莎, 詹姆]

  - name: "北方战争线"
    description: 罗柏的北方独立运动从高峰到覆灭
    primary_arcs: [ARC-1, ARC-3]
    pov_characters: [凯特琳, 艾莉亚]

  - name: "长城防御线"
    description: 守夜人对抗野人入侵+异鬼威胁
    primary_arcs: [ARC-1, ARC-3, ARC-4, ARC-5]
    pov_characters: [琼恩, 山姆威尔]

  - name: "詹姆-布蕾妮线"
    description: 弑君者的道德重生之旅
    primary_arcs: [ARC-1, ARC-2, ARC-4, ARC-5]
    pov_characters: [詹姆]

  - name: "奴隶湾征服线"
    description: 丹妮从流亡者到女王的转变
    primary_arcs: [ARC-2, ARC-3, ARC-4]
    pov_characters: [丹妮莉丝]

  - name: "戴佛斯-史坦尼斯线"
    description: 良心vs狂信，最终导向长城救援
    primary_arcs: [ARC-1, ARC-3, ARC-4]
    pov_characters: [戴佛斯]

  - name: "布兰觉醒线"
    description: 超自然力量的觉醒与北行
    primary_arcs: [ARC-1, ARC-2, ARC-3]
    pov_characters: [布兰]
    presence: 间歇出现，每次出场都标记超自然能力的升级

  - name: "预言暗线"
    description: 冥河之女的梦境预言 + 水蛭诅咒 + 石心夫人伏笔
    primary_arcs: [ARC-2, ARC-3, ARC-5]
    presence: 贯穿但从不独立成序列——始终作为悬念和因果暗示
