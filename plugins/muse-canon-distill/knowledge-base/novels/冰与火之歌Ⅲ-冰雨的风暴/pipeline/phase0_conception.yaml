# Phase 0: 构想 — 《冰与火之歌Ⅲ·冰雨的风暴》

# 注：本作为多 POV 群像叙事，无单一主角。
# "主角"是一组视角人物，"对手"是结构性的对抗力量而非单一反派。
# 主控思想通过多条线索的汇聚而非单一弧光来表达。

premise: >
  如果在一个权力即正义的世界中，五王之战的幸存者们
  各自追求正义、荣誉、复仇、自由和权力，
  他们的选择将把他们——以及这个世界——推向何方？

core_value:
  positive: 荣誉（honor）— 信守誓言、保护弱者、遵从内心的道德律
  negative: 背叛（betrayal）— 违背誓言、屠杀宾客、出卖信任
  spectrum:
    contradictory: 冷漠（indifference）— 不背叛但也不守诺，如波隆的雇佣兵逻辑
    contrary: 务实（pragmatism）— 不以荣誉为最高准则，如泰温"以一场婚宴换万人性命"的算计
    negation_of_negation: >
      以荣誉之名行背叛（betrayal in the name of honor）—
      佛雷以"受辱"为由行宾客屠杀，波顿以"北境守护"之名弑主；
      凯特琳复活后以正义之名行无差别复仇

controlling_idea:
  value: >
    荣誉不能在权力的游戏中保全性命（罗柏之死），
    但荣誉可以在个体灵魂中获得重生（詹姆的转变）
  cause: >
    当权力结构奖赏背叛、惩罚忠诚时，
    坚持荣誉需要付出一切代价——
    但背弃荣誉者虽然暂时获胜，
    却种下了自身毁灭的种子（泰温被亲子射杀）
  full_statement: >
    在一个以权力为终极货币的世界里，荣誉是致命的弱点——
    坚守者被毁灭（罗柏/凯特琳），背弃者暂时得势（泰温/佛雷/波顿）——
    但荣誉的真正力量不在于保全生命，而在于重塑灵魂：
    那些在废墟中选择履行誓言的人（詹姆、琼恩、戴佛斯）
    最终定义了这个世界的走向。
  type: ironic
  # 反讽型：既非纯理想主义（荣誉者被杀）也非纯悲观主义（背叛者被反噬），
  # 而是一个复杂的辩证——荣誉在政治层面失败，在个体层面获胜。

genre:
  primary: 史诗奇幻（Epic Fantasy）
  secondary: 政治权谋剧（Political Thriller）
  conventions:
    - setting: 中世纪欧洲式封建世界，多王国并立
    - characters: 国王、骑士、领主、流亡公主、私生子、侏儒
    - events: 大规模战争、宫廷阴谋、联姻与背叛、龙与魔法
    - values: 荣誉 vs 权力、忠诚 vs 生存、命运 vs 自由意志

originality_statement:
  unique_angle: >
    颠覆传统奇幻的"善必胜恶"叙事：
    最遵守骑士道德的人（罗柏）在故事中段被杀，
    而最不道德的人（泰温）在临近结尾才被反噬。
    没有命运眷顾的英雄——只有选择与后果。
    多 POV 结构让读者同时看到施暴者和受害者的视角（红色婚礼：凯特琳内部+艾莉亚外围+提利昂事后），
    拒绝简单的善恶二分。
  cliches_to_avoid:
    - 主角光环——最重要的"英雄"（罗柏）在全书 2/3 处被杀
    - 正义必胜——红色婚礼证明背叛比战场更有效
    - 龙骑士征服——丹妮选择留下学习统治而非直接征服
    - 爱情拯救一切——耶哥蕊特之死、雪伊的背叛、凯特琳的爱变为石心之恨

style_directives:
  - 多POV交替叙事，同一事件从不同视角呈现（如红色婚礼三视角）
  - 预言系统作为结构性悬念（水蛭诅咒、冥河之女的梦）
  - 婚礼作为暴力场景的颠覆性容器（红色婚礼、紫色婚礼）
  - 零度叙事与残酷写实并存——死亡场景从不回避身体细节
  - 章节标题即POV角色名，强化多视角身份感
  - 镜像对比结构（泰温拒绝两个儿子继承凯岩城的措辞几乎相同）

word_count: 758000
