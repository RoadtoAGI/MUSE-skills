# Phase 1: 世界 — 《冰与火之歌Ⅲ·冰雨的风暴》

setting:
  era: >
    维斯特洛大陆封建时代，约AC 299-300年（征服纪元）。
    五王之战末期：劳勃已死、蓝礼被影子刺杀、巴隆即将丧命，
    罗柏和乔佛里在本卷中死去，史坦尼斯从败将转为长城救援者。
  duration: >
    约一年（从先民拳峰之战到琼恩当选总司令）。
    多线并行但时间略有错位——丹妮线稍超前于君临线。
  location: >
    四大地理区域平行展开：
    1. 长城及以北（琼恩/山姆/布兰线）
    2. 河间地（凯特琳/艾莉亚/詹姆线）
    3. 君临及南方（提利昂/珊莎/戴佛斯线）
    4. 奴隶湾（丹妮线，独立于维斯特洛大陆）
  conflict_levels:
    internal: >
      身份认同危机——
      琼恩在誓言与爱情间撕裂，詹姆在弑君者身份与荣誉骑士间挣扎，
      提利昂在父亲的蔑视与自我价值间挣扎，
      丹妮在征服者野心与统治者责任间犹豫。
    personal: >
      家族内部的背叛与对抗——
      提利昂vs泰温/瑟曦（父权压迫与反抗），
      詹姆vs瑟曦（从共生到决裂），
      罗柏vs凯特琳（爱与战略的冲突），
      珊莎被小指头操控。
    external: >
      多层级政治-军事冲突——
      五王之战收尾（红色婚礼终结北方独立），
      野人南侵长城（异鬼推动的生存危机），
      丹妮征服奴隶湾（自由vs奴役的文明冲突）。

world_rules:
  physical:
    - 季节无规律：夏冬交替可能持续数年甚至数十年，当前长夏即将结束
    - 龙的存在改变战争规则：三条幼龙是丹妮征服奴隶湾的核心武器
    - 异鬼与尸鬼：长城以北存在超自然死亡力量，龙晶/黑曜石可杀异鬼
    - 易形术（warging）：少数人可将意识投入动物甚至人类（布兰/艾莉亚）
    - 光之王的火焰魔法：复活（贝里六次）、预言（梅丽珊卓的火焰视觉）
  social:
    - 宾客权（Guest Right）：在主人屋檐下共食面包和盐即获保护——红色婚礼对此的践踏是全书最大的道德罪行
    - 长子继承制：但存在诸多例外（私生子可合法化，白袍骑士放弃继承权）
    - 守夜人誓言：终身效力，不婚不育，不参与王国政治——琼恩在此框架下被迫做出选择
    - 封建效忠链：封臣对领主效忠→领主对国王效忠，但实际由利益驱动（佛雷/波顿的倒戈）
    - 比武审判：以武力决定神的裁决——提利昂的命运由此决定
    - 联姻即政治：婚姻是权力交易（罗柏违约→红色婚礼，提利昂娶珊莎→争夺北境）
  psychological:
    - 荣誉是社会面具，压力下才显真相：詹姆的"弑君者"之名遮蔽了救城真相
    - 权力使人腐化但无权更危险：提利昂被架空后步步被动
    - 爱是弱点也是力量：凯特琳因爱放走詹姆→导致战略灾难；但猎狗因对艾莉亚的保护展现人性
    - 复活有代价：贝里每次复活都失去更多自我→凯特琳复活为石心夫人，只剩仇恨
    - 预言的自证性：水蛭诅咒→三王之死，因果模糊（巧合还是魔法？），但影响行动者的信念

genre_conventions:
  primary_genre: 史诗奇幻
  secondary_genre: 政治权谋
  conventions:
    - convention: 英雄主角在逆境中成长并最终获胜
      planned_subversion: >
        罗柏·史塔克——年轻英雄王，战场无败绩——在故事 2/3 处的婚宴上被屠杀。
        马丁通过杀死"传统意义上的主角"来宣告：这个世界不保护英雄。
    - convention: 善恶分明的阵营对立
      planned_subversion: >
        最"邪恶"的角色（詹姆弑君者）被揭示为曾经的救世者；
        最"正义"的行动（凯特琳复活复仇）变成了无差别的恐怖。
        读者被迫在每个POV中理解"另一面"。
    - convention: 魔法作为解决问题的工具
      planned_subversion: >
        魔法在本书中始终是双刃剑：龙火可以解放奴隶也可以屠杀；
        复活术剥夺人性（石心夫人）；预言引发行动但不保证结果。
        真正改变局势的是政治决策和人性选择，而非魔法。
    - convention: 联姻作为和平手段
      planned_subversion: >
        两场婚礼（红色/紫色）成为全书最暴力的场景。
        婚姻在这个世界中不是和平的工具，而是权力的武器。

daily_life:
  - dimension: 战争对平民的影响
    findings:
      - detail: 河间地被反复蹂躏——庄稼被烧、村庄被毁、幸存者流离失所
        story_implication: 艾莉亚线的旅程本身就是战争创伤的全景——她所经过的每个地方都是废墟
      - detail: 长城守夜人物资匮乏、人手不足，依赖王国供给但被遗忘
        story_implication: 琼恩线的真正敌人不只是野人，更是资源枯竭和被遗弃感
  - dimension: 宴饮文化
    findings:
      - detail: 宴饮是政治仪式——座次、敬酒、食物质量都传递权力信号
        story_implication: 红色婚礼颠覆了宴饮的安全性；乔佛里婚宴上的羞辱是权力展示
  - dimension: 信仰多元
    findings:
      - detail: 七神（南方主流）、旧神（北方/绝境长城）、光之王（东方引入）并存
        story_implication: 信仰冲突驱动戴佛斯线（反对梅丽珊卓）和琼恩线（史坦尼斯要求弃旧神）

creative_constraints:
  - constraint: 宾客权的神圣性
    narrative_function: >
      红色婚礼的震撼力完全依赖于"宾客权不可侵犯"这一世界规则。
      读者必须先相信婚宴是安全的，才能在屠杀发生时感到极端的背叛。
  - constraint: 守夜人的政治中立誓言
    narrative_function: >
      琼恩的所有重大选择都在此框架内展开——
      他不能参与王国政治，不能拥有土地和家族，不能娶妻。
      史坦尼斯的"临冬城公爵"提议之所以构成危机，
      正因为它要求琼恩打破这一根本约束。
  - constraint: 死者可被复活但付出人性代价
    narrative_function: >
      贝里的六次复活递减其人性→为凯特琳的石心夫人转变建立规则预期：
      读者理解复活并非恩赐而是诅咒，因此终章的震撼不仅是"她回来了"，
      更是"她回来了但已不再是她"。
