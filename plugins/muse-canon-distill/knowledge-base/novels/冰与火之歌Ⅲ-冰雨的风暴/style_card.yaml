novel: 冰与火之歌Ⅲ·冰雨的风暴
author: 乔治·R·R·马丁
lang: zh
translator: ''
narration_voice: 多POV限知贴身，每章被视角人物欲望和误判染色
diction: 译文文白相济，宫廷礼语、军政词、粗口和异域名词并置
rhetoric_density: medium
dialogue_mode: 对白承担权谋、试探和羞辱，关键处以短句落槌
pacing: 长铺礼仪地貌与身体细节，转折处骤然压成暴力断裂
signature_moves:
- 让宏大战争经局部POV的饥寒疼痛和误判呈现
- 用婚礼、审判、交易等仪式反转为暴力机关
- 把权力关系落到项链、鞭子、人头、旗帜等实物
- 关键秘密先省略铺垫，再用一句话或一个动作引爆
- 章末常以死亡、身份揭示或职责选择落重锤
anti_signature:
- 全知旁白替所有阵营解释动机就不像
- 把暴力写成英雄爽感而无身体代价就不像
- 对白只传信息不含身份、权力和试探就不像
author_cross_ref: 延续系列多POV限知与仪式工笔，本卷更集中于婚礼背叛、身份毁灭和权力反噬。
style_card_by: Codex (executor)
