novel: 指环王
author: J.R.R.托尔金
lang: zh
translator: 邓嘉宛、石中歌、杜蕴慈
narration_voice: 全知史诗叙述为底，逐场贴定单一人物限知，要紧处插「看哪」呼语与史官议论
diction: 译笔书面文白相济，称谓古雅，韵文歌谣穿插，专名密集自成体系
rhetoric_density: medium
dialogue_mode: 对白承重推进，归属几乎只用「某某说」，独白绵延数段，声口按种族身份分层
pacing: 蓄势缓而爆发短，战斗一句一段，复沓句式推压，大事之后必留一段抒情缓冲
signature_moves:
- 韵文歌谣嵌入正文，承担预言、施法与悼亡，叙事在诗处停步
- 高潮处插「看哪」「但是看啊」呼语，把读者拽到史诗目击位
- 声口分层并存一书：廷议庄雅语、霍比特乡土语、咕噜复沓自语、戒灵文言「汝」
- 拟声与句式复沓推压节奏，如「咚隆」「战鼓隆隆」「格龙得缓缓前进」
- 绝望谷底伏入转机信号：鸡鸣、号角、风向或黎明，以光暗互换收束场景
anti_signature:
- 叙述者讥诮吐槽或现代口语俚词混入庄严场面
- 直白剖析反派内心，长期以内聚焦魔王视角叙事
- 对白省略归属语，只靠密集机锋短句互怼推进
