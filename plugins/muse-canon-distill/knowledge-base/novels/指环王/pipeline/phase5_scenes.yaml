        beat_direction: "从史诗到日常的完美降落——全书以最简单的一句话收束"
        source_chapter: 卷六第9章

tension_curve:
  description: |
    全书张力曲线呈现"双峰+余波"结构：
    第一个高峰在ARC-2末尾（远征队分裂）后短暂回落，
    随后ARC-3/4双线交替制造持续递增的张力，
    第二个（也是最高的）高峰在ARC-5/6的交界处——
    佩兰诺之战（外线高潮）与末日山（内线高潮）几乎同时爆发，
    之后的漫长收束（加冕→夏尔平乱→灰港）以逐渐下降但仍有波澜的方式
    将张力释放到"我回来了"的最终宁静。
