# Phase 2: 人物系统设计图 — 《指环王》逆向分析
# 本文件只记角色之间的关系与功能分配，不记个体画像（声音、对白、弧光等见 characters/*.md）

analysis_meta:
  novel: 指环王
  source_text: 指环王.md
  source_form: "长篇（三部曲合一，约77万字，62章，邓嘉宛、石中歌、杜蕴慈译本）"
  evidence_note: "结论以'卷X第Y章'锚定（对照 navigation.md 章节摘要索引与角色表）"

cast_overview:
  protagonist: 弗罗多·巴金斯
  co_protagonist: 山姆怀斯·甘姆吉  # 山姆的叙事功能已超越配角——他是弗罗多故事的见证者和最终继承者
  antagonist:
    primary: "索隆——从未直接现身，以魔眼/意志/魔戒的腐蚀力量体现；他不是一个'角色'，而是一种无处不在的压迫力量"
    secondary: "至尊戒本身——作为具有自主意志的'角色'，它持续腐蚀弗罗多，是真正的终极对手"
    proxies:
      - "萨茹曼——索隆力量的变体：以知识和秩序为名追求权力的堕落智者"
      - "戒灵/那兹古尔——索隆力量的物理执行者，追踪与恐惧的化身"
      - "咕噜——魔戒腐蚀力量的活标本，同时是弗罗多的暗影镜像"

  supporting_cast:
    - name: 甘道夫
      function: "战略指挥者/道德导师——制定'以弱抗强'的总体策略，在关键时刻提供方向性指引，但刻意不代替英雄行动"
    - name: 阿拉贡
      function: "平行主角/王者线承载者——承担'归来之王'的叙事弧，为弗罗多的使命创造军事条件（佯攻黑门），体现'自愿延迟权力'的正面价值"
    - name: 波洛米尔
      function: "堕落的镜像——展示魔戒腐蚀'好人'的过程，他的失败为远征队分裂提供因果动力，他的忏悔证明人性并非不可救赎"
    - name: 法拉米尔
      function: "波洛米尔的救赎镜像——面对同样的诱惑做出相反选择，证明魔戒的腐蚀并非不可抵抗，为弗罗多东线之旅注入信心"
    - name: 梅里
      function: "成长线承载者A——从好奇少年到刚铎骑士，与伊奥温联手杀死戒灵王实现'弱者改变命运'的主题变奏"
    - name: 皮平
      function: "成长线承载者B——最年轻的远征队员，好奇心既制造危机（偷看帕蓝提尔）也推动情节，最终在黑门之战中证明勇气"
    - name: 咕噜/斯密戈
      function: "弗罗多的暗影镜像 + 命运的工具——展示魔戒长期腐蚀的终极结果，同时是仁慈因果链的关键环节"
    - name: 伊奥温
      function: "被压抑的英雄——打破'女性不能上战场'和'无人能杀戒灵王'的双重预设，展示另一种英雄模式"
    - name: 希奥顿
      function: "觉醒的君王——从被精神控制的傀儡到黎明冲锋的战士，体现'永远不会太晚去做正确的事'"
    - name: 加拉德瑞尔
      function: "权力放弃的范例——她对魔戒的拒绝预演了全书的主控思想：真正的力量在于自愿放弃权力"
    - name: 萨茹曼
      function: "堕落的智者——'以知识对抗邪恶'这条路的失败样本，与甘道夫的'以仁慈对抗邪恶'形成根本对比"
    - name: 树须
      function: "自然力量的代言人——恩特的觉醒代表被忽视的古老力量在关键时刻的介入"

contrast_axes:
  # 以下是角色在相同情境下的核心对比方式

  power_response: |
    **面对至尊戒/绝对权力时的反应**——全书最核心的对比轴：
    - 弗罗多：长期抵抗但最终屈服——意志力有极限（卷六第3章）
    - 山姆：短暂持有后自愿归还——欲望淡泊是最强的盾（卷四第10章/卷六第1章）
    - 加拉德瑞尔：经历剧烈内心挣扎后拒绝——智慧+自我认知（卷二第7章）
    - 波洛米尔：从理性劝说升级为武力夺取——"为了正义"的权力欲最致命（卷二第10章）
    - 法拉米尔：从未动心——高贵品格的极端表现（卷四第5章）
    - 甘道夫：一开始就拒绝接触——理解自己的弱点（卷一第2章"别引诱我"）
    - 咕噜：完全被征服——500年腐蚀的最终结果（卷一第2章来历/卷六第3章）
    - 萨茹曼：被自己的求知欲引导向权力——知识堕落为统治欲（卷二第2章甘道夫的叙述/卷三第10章）

  leadership_style: |
    **危机中的领导方式**：
    - 甘道夫：战略家——以信息不对称和心理博弈对抗力量劣势（佯攻黑门）
    - 阿拉贡：仆人式领袖——以治愈而非征服证明王权（"王者之手乃医者之手"）
    - 希奥顿：觉醒的勇士——从被控制到亲自冲锋，以行动赎回失去的时间
    - 德内梭尔：绝望的独裁者——信息优势（帕蓝提尔）反而加速了崩溃
    - 萨茹曼：技术官僚——以"知识与秩序"为名的暴政

  heroism_mode: |
    **英雄主义的表现形式**——全书最重要的主题对比：
    - 弗罗多：承受型英雄——他的英雄性不在于战斗而在于持续承受魔戒的腐蚀
    - 山姆：朴素的忠诚——没有使命感只有"我不能让少爷一个人"
    - 阿拉贡：传统英雄——剑术/领导力/血统，但选择以医者而非征服者身份出场
    - 伊奥温：反叛型英雄——打破性别和命运的预设
    - 梅里/皮平：意外英雄——好奇心和忠诚驱动的小人物完成大事
    - 波洛米尔：悲剧英雄——军事勇气无法弥补道德弱点

relationships:
  power_dynamics: |
    三层权力关系：
    1. **神灵层**：甘道夫（迈雅）> 萨茹曼（堕落迈雅）> 索隆（更强大的迈雅，但受限于魔戒的束缚）
       → 甘道夫白袍归来后取代萨茹曼成为巫师之首
    2. **政治层**：索隆 vs 自由民族联盟（刚铎+洛汉+精灵残部）
       → 力量极度不对称，但索隆的盲点（不理解放弃权力）提供了渗透机会
    3. **个人层**：弗罗多 vs 魔戒
       → 最关键的权力关系——持有者与武器之间的拉锯，越接近魔多越不利

  key_tensions:
    - "弗罗多 vs 山姆 vs 咕噜——信任三角：弗罗多信任咕噜（基于怜悯），山姆不信任咕噜（基于直觉），咕噜内心善恶交战。三方张力在奇立斯乌苟阶梯上达到顶点"
    - "甘道夫 vs 德内梭尔——两种应对绝望的方式：甘道夫选择赌博（佯攻黑门），德内梭尔选择放弃（自焚）"
    - "波洛米尔 vs 法拉米尔——同一父亲的两个儿子面对同一诱惑的不同选择，揭示品格差异"
    - "阿拉贡 vs 伊奥温——伊奥温对阿拉贡的爱实际上是对逃离'笼中金丝雀'命运的渴望，直到法拉米尔帮她找到不依赖战争的自我价值"
    - "甘道夫 vs 萨茹曼——同为巫师，一个选择'从下方'（与渺小者结盟），一个选择'从上方'（追求统治）"

  potential_shifts:
    - "波洛米尔从盟友到威胁再到忏悔——全书中角色关系变化最剧烈的一条线"
    - "咕噜从敌人到向导到背叛者到（意外的）拯救者——最复杂的角色功能转换"
    - "希奥顿从傀儡到战士到殉难者——觉醒弧线最完整的配角"
    - "伊奥温从绝望的战士到接受治愈的爱人——从死亡冲动到生命选择"
