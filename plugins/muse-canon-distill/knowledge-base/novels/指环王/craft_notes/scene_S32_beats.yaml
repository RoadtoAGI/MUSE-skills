  ai_default_failure: 高潮处不敢插入日常事件，直接让援军救场
  transfer_rule: 至暗转折用最小日常声响开启，希望经声音链传递
  quote: 一只公鸡开始喔喔啼叫
overall_traits:
- 恐惧是主武器，战场在守军心智中
- 重复即节奏，模拟围城的单调压迫
- 最小元素承载最大转折
