baseline_voice:
  observed_summary: '冷静的五步抑扬格 + 偏好"时间 / 种子 / 树木 / 收获"这一组农事 - 时间隐喻（"seeds of time"，"if there come truth from them"，"thou hast
    it now"——以"现在"为锚点判断未来）。他几乎没有命令式 / 感叹式句子；他大多用条件从句和反问。在公开场合他比 Macbeth 更短小直接（A1S6 martlet 描述、A3S1 公开应答 Macbeth 的晚宴邀请），从不长篇大论。他的独白与
    aside（A1S3 怀疑女巫 / A2S1 cursèd thoughts / A3S1 thou hast it now）都很短——他不是会被语言冲走的人，而是用语言反复检查自己的人。死后作为幽灵他没有台词，但在 A4S1"show
    of eight kings"中作为视觉物再次出现，承担"被预言确认"的最终视觉功能。


