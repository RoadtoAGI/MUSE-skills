    - scenes/scene_A1S5.md:L93-L120（unsex 段——A1-A3 调式的代表）

    - scenes/scene_A1S7.md:L83-L138（manhood ↔ 动作的话术）

    - scenes/scene_A5S1.md:L71-L142（A5S1 调式翻转的代表段）'
