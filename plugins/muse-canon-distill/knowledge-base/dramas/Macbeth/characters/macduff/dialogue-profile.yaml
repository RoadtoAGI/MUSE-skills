    to govern? No, not to live"；"Despair thy charm"；"Turn, hell-hound, turn"），把整段思考压缩到一个动词或者一个否决。他的语言永远低于他承受的情感量级——这与 Macbeth
    永远高于他承受的语言量级形成完整对比。


