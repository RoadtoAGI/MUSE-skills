novel: Macbeth
author: William Shakespeare
lang: en
translator: ''
dialogue_voice: 声口按存在界分层：巫语唱咒韵，人语素体诗，底层人物转散文；独白当众推理
diction: 庄雅素体为基，血、睡眠、夜禽、不合身衣袍等意象成网，贯穿全剧反复回响
rhetoric_density: high
stage_direction_style: 极简标记为基，雷声钟声敲门号角等声响指示承担转场与心理压迫
pacing: 短场快切与长独白停驻交替；一记声响即斩断停驻，把心理拖回行动
signature_moves:
- 超自然场用四音步双行咒韵，与人间素体诗形成可听的界域切换
- 独白当众思考：人物在台上逐步推理出决定，观众全程旁听心理过程
- 关键暴力放幕后，只写行前悬念与事后血手，恐怖由旁观者反应折射
- 双关谶语先埋后爆：台词以双重语义立约，结局按字面意义兑现
- 礼仪场景藏杀机：宴席迎驾的客套台词与观众已知的阴谋同台对冲
anti_signature:
- 巫与人写成同一种声口、统一成白话散文——界域分层一失即不像
- 舞台指示写成心理氛围长段注释——本剧指示只给动作与声响
- 暴行正面铺陈血腥细节，独白写成抒情感叹而非推理决断
