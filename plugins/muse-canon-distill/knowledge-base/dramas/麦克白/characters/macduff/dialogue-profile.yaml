  observed_summary: '麦克德夫的台词在全剧最朴素、最少修辞——他的标志特征是"用最少的字承担最大的情感重量"：临听家人死讯的回应不是修辞 / 不是独白 / 不是问神，而是连续四个具体问句（"我的孩子也都死了吗？" / "我的妻子也被杀了吗？"
    / "他们一个也不存吗？" / "你说他们一个也不存吗？"）——他用问句承担震荡。整体倾向：(1) 短句为主，鲜有长独白；(2) 当面冲突时直白不掩饰（"我没有话说；我的话都在我的剑上"——A5S7 与麦克白对决的全部回应）；(3) 几乎不用条件句——与麦克白长篇"要是…要是…"的独白形成最强反差，麦克德夫不在内心里反复辩论，决定就是决定。


