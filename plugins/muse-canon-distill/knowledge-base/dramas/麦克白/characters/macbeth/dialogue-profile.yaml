baseline_voice:
  observed_summary: '麦克白的台词在全剧密度最高——他几乎所有的关键转折都通过独白承担：每个动手前他都会先把动作的全部后果意象化（弑君前的"赤裸婴儿在风中飘游 / 御气而行的天婴"、动手时的"匕首在哪儿"、动手后的"麦克白已经杀害了睡眠"、宴会失态时的"鸢鸟的胃囊将要变成我们的坟墓"），后期意象密度逐渐贫化——A5S5"明天又明天"用最朴素的语法承担最大的虚无，是莎翁刻意让他的语言"穷尽"的设计。倾向：长句叠浪、动词驱动、条件句密集（"要是…要是…"前期为良知拷问，后期为预言屏障）；情绪进入崩溃区时句子会变短并堆叠重复（"瞧那边！瞧！瞧！瞧！"）；公开场合的礼仪用语极其熟练但与独白形成强反差——这种反差本身是莎翁让他"潜台词与台词分裂"的核心声音机制。


    来源：phase2_roles.yaml → macbeth.voice_function + voice_markers + soliloquy_signature + subtext_signature

