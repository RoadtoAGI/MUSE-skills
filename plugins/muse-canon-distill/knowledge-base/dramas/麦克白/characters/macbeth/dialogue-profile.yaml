    - scenes/scene_A1S7.md:L7-L7 （独白"要是干了以后就完了"——条件句驱动的良知拷问）

    - scenes/scene_A2S1.md:L41-L41 （"在我面前摇晃着、它的柄对着我的手的，不是一把刀子吗？"——意象密度峰值）

    - scenes/scene_A2S2.md:L47-L47 （"那清白的睡眠，把忧虑的乱丝编织起来的睡眠..."—动词链 + 排比）

    - scenes/scene_A3S1.md:L55-L55 （对刺客的狗类比——熟练操控修辞）

    - scenes/scene_A3S4.md:L69-L69 （崩溃区短促叠句"瞧那边！瞧！瞧！瞧！"）

    - scenes/scene_A5S3.md:L23-L23 （"我已经活得够长久了；我的生命已经日就枯萎"——意象贫化）

    - scenes/scene_A5S5.md:L19-L19 （"明天，明天，再一个明天"——节奏单调即风格信号）'
