baseline_voice:
  observed_summary: '班柯是麦克白的反极——同样的诗体，但意象指向截然不同：麦克白的意象向"血、刀、夜、鬼、蝎子"集中，班柯的意象向"神明、祈祷、清白"集中。他的声音有三个稳定特征：(1) 当面与同僚交流时使用清晰的提问式（"将军，您为什么这样吃惊"
    / "什么，爵爷！还没有安息吗？"）——他善于用问句外化自己的怀疑而不直说，把判断留给对方；(2) 关键诊断（A1S3 "魔鬼说真话"）一旦出口立即收束，从不重复——典型的"说一次就够了"风格；(3) 独自时使用祈祷式（"慈悲的神明！抑制那些罪恶的思想"）——他面对内心冲突的标准回应是把它交给神，而不是与自己辩论。整体风格比麦克白少
    1-2 倍意象密度、少独白长度、少修辞——这种"少"本身是声音特征，提示他是稳态人格。


