analysis_meta:
  source: 雷雨
  source_medium: stage_play
  dramatic_form: tragedy
  reverse_engineered_from: drama-analysis@0.4.1
  completed_at: 2026-05-24

world_type: family-tragedy-of-fate         # 与 phase0.genre 对应

# 4D 设定
setting_4d:
  era: 1925_china_republican               # 民国十四年前后
  duration: |
    第一至四幕：一日（夏，郁热欲雨 → 深夜两点雷雨）。
    序幕 + 尾声：十年后（约 1935），冬日下午，腊月三十日。
  locations:
    - 周公馆客厅（北方某城；用于第一、二、四幕）
    - 杏花巷十号鲁家小屋（杏花巷池塘边的下层市民区；用于第三幕）
    - 教堂附设医院的客厅（即十年后的旧周公馆，已卖给教堂改医院；用于序幕、尾声）
  conflict_layers:
    - inner: 萍的乱伦悔疚 / 蘩漪被禁锢的情欲 / 四凤的怀孕秘密 / 侍萍三十年未清的恨
    - personal: 萍-蘩漪、萍-四凤、朴园-侍萍、大海-萍、冲-四凤
    - extra_personal: 矿工罢工 vs 资本家董事长（次轴）
    - cosmic: 命运 / "宇宙间的残忍" / 雷雨天意

primary_space:                             # 戏剧空间（剧场可演的物理位置）
  - parlour_of_zhou_mansion                # 周公馆客厅——三十年前的旧物（侍萍喜欢的家具）原封不动
  - lu_family_small_room                   # 鲁家小屋——四凤的卧室 + 鲁贵睡的外屋
  - garden_offstage                        # 花园（offstage：藤萝架、电线杆，第四幕死亡发生地）
  - mining_site_offstage                   # 矿山（offstage：罢工、警察开枪打死三十名工人）
  - hospital_parlour_ten_years_later       # 十年后改为医院客厅的同一空间（序幕 / 尾声）

power_structure:                           # 戏剧权力结构（往往显于上下场调度）
  - patriarchy: 朴园对全家的绝对支配（"喝药"场为核心展示）
  - capital: 朴园作为煤矿董事长 vs 鲁大海工人代表
  - servant_master: 鲁贵 / 四凤 / 侍萍处于仆从地位但握有家族秘密
  - generational: 父辈（朴园 / 侍萍）vs 子辈（萍 / 蘩漪 / 大海 / 四凤 / 冲）
  - gender: 蘩漪、侍萍、四凤三代女性在男性主导秩序内的受困

rules:                                     # 世界规则（戏剧层）
  - 家庭体面是首要的、必须以公开仪式（喝药、跪劝）维持
  - 三十年前的弃妇之债无法用钱（5000 块支票 / 20000 块支票）清偿
  - 资产阶级父亲是道德 / 经济 / 情感的三重审判者
  - 旧物（家具 / 衬衣 / 关窗户的习惯 / 相片）承载记忆并触发认母
  - 命运通过偶然（侍萍被同一个东家请去 / 走电的电线杆 / 蘩漪关窗户）显形
  - 雷雨是天意 / 报应的可见符号——人物起誓时必有雷声
  - 起誓不可违背：四凤"要是再见周家人，天上的雷劈了我"立时应验

stagecraft_constraints:                    # 媒介约束（stage_play 必填）
  - 第一、二、四幕共享同一布景（周公馆客厅）——景物不变而气氛随时间 / 雷雨变化
  - 第三幕换景（鲁家小屋）；序幕 / 尾声共享第三套布景（同一客厅十年后）
  - 关键动作（藤萝架触电 / 萍开枪自杀）发生在 offstage 或半 offstage，由声音传达
  - 全剧无独白（中国话剧规约；区别于莎剧 / 古希腊悲剧）——所有信息通过对白与上下场调度
  - 雷雨声 / 闪电 / 教堂合唱声（巴赫 B 小调弥撒）作为重要的非视觉舞台元素

set_motif_inventory:                       # 重要的戏剧道具与符号
  - 红木书桌（朴园三十年带在身边的旧物）
  - 镜台柜（周萍生母梅小姐顶爱的东西，里面曾放绣花虎头鞋）
  - 关窗户的习惯（侍萍生萍时受病、怕风；朴园 30 年不变此习惯）
  - 绣梅花的旧衬衣（袖襟烧破后用丝线绣梅花补的，旁边绣"萍"字）—— 认母决定性物证
  - 5000 块支票 / 20000 块支票（朴园两次试图用钱清偿旧债）
  - 鲁大海的手枪（矿上警察打罢工工人时掉的，第三幕鲁大海拔出威胁鲁贵，
    第四幕传到周萍手中成为自杀工具）
  - 藤萝架的走电电线（第二幕蘩漪提醒、第四幕电死狗、终局电死四凤 + 周冲）
  - 雨衣（朴园要"旧雨衣"，是触发侍萍下楼来到客厅的契机）
  - 红纸灯罩（四凤约会周萍的暗号；蘩漪从外面关窗）

key_offstage_action:                       # 关键 offstage 行动
  - 三十年前侍萍年三十夜投河
  - 警察在矿上枪杀三十名工人
  - 第四幕花园中：四凤碰电线、周冲扑救、同时触电
  - 第四幕书房：周萍开枪自杀（只闻枪声）

xiqu_program: null                         # 非戏曲，留空
