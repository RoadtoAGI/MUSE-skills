analysis_meta:
  source: 雷雨
  source_medium: stage_play
  dramatic_form: tragedy
  reverse_engineered_from: drama-analysis@0.4.1
  completed_at: 2026-05-24
  analyst_notes: |
    雷雨没有传统意义上的单一 protagonist——
    曹禺在序中说"在《雷雨》里的八个人物，我最早想出的，并且也较觉真切的是周蘩漪"——
    但蘩漪是欲望最炽的角色，不是结构上的 protagonist。
    结构 protagonist 应该是周萍（夹在所有秘密交叉点）；
    情感 protagonist 是蘩漪；
    伦理 protagonist 是鲁侍萍。
    本文件按 dramatic_role 分类，不强行选一个 protagonist。

roles:
  zhou_puyuan:
    name_zh: 周朴园
    age: 55
    dramatic_role: catalyst-and-antagonist          # 既是命运扰动源也是结构上的反派
    desire: |
      external: 维持"最圆满最有秩序的家庭"作为他作为资本家 + 父亲的成就证明
      internal: 把三十年前对侍萍的弃绝压在合法体面之下，通过保留旧物变相赎罪 + 占有
    obstacle:
      - 侍萍仍活着且被命运推回他面前
      - 长子周萍偷偷与继母乱伦 + 偷偷与四凤恋爱
      - 次子鲁大海是工人代表来反对他
      - 妻子蘩漪不再服从他的"圆满"剧本
    tactic: 父权仪式（喝药 / 跪劝）+ 金钱清偿（5000 → 20000）+ 公开训话
    voice_function: 父权权威话语——总是用"长子 / 自爱 / 道德 / 圆满"等抽象词
    soliloquy_signature: false                      # 中国话剧规约——无独白
    status_arc: |
      巨型家长(+) → 旧情人浮出(-) → 强行金钱清偿被驳(-) → 长子打弟弟被旁人识穿(-)
      → 半夜独坐"家里只剩我一个人醒着"(-) → 大揭示被迫承认侍萍身份(--)
      → 三子三死后"我丢了一个儿子，不能再丢第二个了"(---) → 十年后独自苟活
    voice_subtext_pattern: |
      总是把私密情感包裹在公共修辞里——
      "你的生母永远喜欢夏天把窗户关上的"（实为"我从未忘记你母亲"），
      "我们想把她的坟修一修"（实为"我心里一直有她"），
      "我教育出来的孩子，绝对不愿叫任何人说他们一点闲话"（实为"我的私生子不准让外人知道"）。
    aria_or_soliloquy_locations: []                 # 无独白；最接近独白的是 A4 开场对仆人说话
    relationship_anchors:
      - 鲁侍萍 (旧情人 / 三十年前抛弃)
      - 周蘩漪 (现妻 / 控制对象)
      - 周萍 (长子 / 与侍萍所生 / 接班对象)
      - 周冲 (与蘩漪所生 / 失望的次子)
      - 鲁大海 (不知是次子 / 罢工工人代表)
      - 鲁四凤 (使女 / 不知是亲生女)

  zhou_fanyi:
    name_zh: 周蘩漪
    age: 35
    dramatic_role: protagonist-of-desire / 复仇执行者
    desire: |
      external: 把周萍从离开自己的路上拽回来；不让他与四凤逃走
      internal: 被一个真爱她的人承认为"活着的女人"——
                "我不是冲弟弟的母亲，我不是周朴园的妻子，我也不是他的后母——
                 我是要一个男人真爱她、要真真活着的女人"
    obstacle:
      - 朴园把她封在"病人 / 妻子 / 母亲"的位置上（喝药一场是其封闭性的展演）
      - 周萍试图脱离她去与四凤建立"干净"的关系
      - 自己的儿子周冲不能也不该被她的复仇牵连
    tactic: |
      A1: 隐忍（被强制喝药）
      A2: 当面摊牌（揭萍是私生子 + 揭朴园引诱梅家姑娘）
      A3: 半 offstage 跟踪（窗外把窗关上 = 死局封口）
      A4: 召唤所有秘密人物入场 + 强迫朴园下楼大揭示
    voice_function: |
      雷雨型 / 极端型——
      "极端"与"矛盾"是作者明言的两个基调（见序第 33 行）。
      她的台词在抒情 + 报复 + 自怜之间高速切换。
    soliloquy_signature: false                      # 无独白；但 A2 末有最接近独白的几句
                                                    # ("我希望我今天变成火山的口...")
    status_arc: |
      被禁锢的妻子(-) → 喝药仪式中被公开羞辱(--) → 摊牌掌握主动(+)
      → 雨夜跟踪 / 关窗(++) → 召集大揭示(+++) → 三死后崩塌为最痛的母亲(----)
      → 十年后变疯，每节期在窗前望一晚上
    voice_subtext_pattern: |
      话面是讥讽 / 怪笑 / 低声，话里是"求"。
      A4 "如果今天你不走，你父亲那儿我可以替你想法子" = 已经低到尘埃里的乞求。
      A4 三死之后说"冲儿你该死、该死" = 自我惩罚 + 报复欲望的同源。
      她的"疯"不是病，是文化无处安放她这种欲望的应激。
    aria_or_soliloquy_locations:
      - A2_末段_独自咏叹（"我希望我今天变成火山的口..."）—— 最接近独白
    relationship_anchors:
      - 周朴园 (丈夫 / 阎王)
      - 周萍 (继子 / 情人 / 在三年的乱伦关系中)
      - 周冲 (亲子 / 在 A4 末段才被她真正"看见"为儿子)
      - 鲁四凤 (情敌)
      - 鲁侍萍 (前夫的旧情人 / 在 A4 末段才识破)

  zhou_ping:
    name_zh: 周萍
    age: 28
    dramatic_role: structural-protagonist-and-victim    # 结构 protagonist——所有秘密的交叉点
    desire: |
      external: 借去矿上做事逃离这个家 + 带四凤一起走 + 与父亲 / 蘩漪都干净地切断
      internal: 把自己从"乱伦的过去 + 弃妇之子"的双重诅咒中救赎出来
    obstacle:
      - 蘩漪不放他走
      - 父亲要他做"自爱的长子"
      - 四凤的真实身份（亲妹妹）他不知道
      - 鲁大海是亲弟弟他也不知道
      - 自己的怯弱（作者序中明言"周萍是个情感和矛盾的奴隶"）
    tactic: 逃避 / 借酒胡闹 / 突围（去矿上）/ 私奔（带四凤走）
    voice_function: |
      怯弱-怀疑-冲动的复合体——
      作者在 A1 进场时的人物描写专门强调他"灰暗的眼神里你看见了不定、犹疑、怯弱同冲突"。
      他的台词在"是、爸爸"的服从与"我恨我自己"的爆发之间高速切换。
    soliloquy_signature: false
    status_arc: |
      乱伦悔疚中(-) → 决心逃避去矿上(±) → 被蘩漪当面揭破私生子身份(-)
      → 当众打弟弟(-) → 与蘩漪正面切断(±) → 决定带四凤走(+)
      → 大揭示中得知四凤是妹妹(----) → 取大海留下的枪进书房自杀(---)
    voice_subtext_pattern: |
      他的对白底下永远是"我恨我自己"——
      不论对父亲（"是，爸爸"）、对蘩漪（"我厌恶这种不自然的关系"）、
      对四凤（"我对不起你"）、对大海（"我要你死...我恨活着"），
      他都在表达对自己的厌恶而非对他人的真实回应。
    aria_or_soliloquy_locations: []
    relationship_anchors:
      - 周朴园 (父亲 / 不知是侍萍弃子的同一个家长)
      - 周蘩漪 (继母 / 三年乱伦情人 / 想要彻底切断)
      - 鲁四凤 (爱人 / 未知是亲妹妹 / 三个月身孕)
      - 鲁大海 (在 A2 是工人代表; A4 才知是亲弟弟)
      - 周冲 (亲弟弟 / 被自己抢走爱人)
      - 鲁侍萍 (亲生母亲 / 大揭示中才认)

  zhou_chong:
    name_zh: 周冲
    age: 17
    dramatic_role: collateral-victim / 理想主义者
    desire: |
      external: 与四凤共建"白帆船向天边飞"的乌托邦 / 帮工人争取公平 / 跟母亲做朋友
      internal: 用纯净的梦掩盖现实——他对四凤的爱"不是四凤本人，
                而是'爱'这个抽象观念"（作者序明言）
    obstacle:
      - 父亲对他理想的冷酷否决（"你读过几本关于社会经济的书？"）
      - 四凤已心有所属（他不知是大哥）
      - 母亲对他的真实需求未被满足（她"早死了"）
      - 现实本身——他在鲁家被大海的"穷骨头"现实碾压时第一次幻灭
    tactic: 谈话 / 帮助 / 送钱 / 慷慨让步
    voice_function: |
      抒情型青年——
      作者称之为"雷雨郁热氛围里的一个春梦 / 不调和的谐音"。
      他的台词富有抒情性："白帆船" / "天边飞" / "腥的咸的海风" / "鹰的翅膀"
      ——这是雷雨里唯一带浪漫主义诗意的声音。
    soliloquy_signature: false
    status_arc: |
      抒情的少年(+) → 求婚被四凤拒绝(±) → 在鲁家被大海羞辱(-)
      → 看到四凤选萍(--) → 末段说"我大概是胡闹"幻想自破(--)
      → 扑救四凤同触电死(---)
    voice_subtext_pattern: |
      他的台词字面是诗，字下面是"我不属于这个家"——
      他对四凤说"白帆船"时其实是说"我要逃出周公馆"。
      他在 A4 最后说"我好像并不是真爱四凤、以前我大概是胡闹"
      ——这句话是他唯一一次走出抒情幻象、看清楚自己 ——
      也是他在悲剧时刻里最不悲剧的一刻。
    aria_or_soliloquy_locations:
      - A3_他对四凤的"白帆船向天边飞"段（最接近 aria）
    relationship_anchors:
      - 周蘩漪 (母亲 / 在 A4 末段才真正被她看见为儿子)
      - 周朴园 (父亲 / 永远的威权阴影)
      - 周萍 (哥哥 / 后来发现是情敌)
      - 鲁四凤 (爱人 / 后来发现她爱哥哥)
      - 鲁大海 (想做朋友 / 被对方拒绝)

  lu_shiping:
    name_zh: 鲁侍萍（鲁妈）
    age: 47
    dramatic_role: ethical-protagonist / 旧债的承担者
    desire: |
      external: 让女儿四凤不再走自己的旧路 → 带她远走济南
      internal: 让三十年前的事就"过去了"——撕碎支票时"我这些年的苦不是你拿钱算得清的"
                + 终场"罪过我一个人担"
    obstacle:
      - 命运把她的女儿送回了她当年被弃的家
      - 周朴园 30 年来仍把她当作可以用钱清偿的对象
      - 她自己的儿子鲁大海（前夫所生）痛恨周家而不能不痛
      - 她另一个儿子周萍是抛弃她的男人的接班人
    tactic: |
      A2: 撕支票 + 拒绝叙旧情
      A3: 逼四凤起誓 + 决定明天就走
      A4: 把所有罪揽在自己身上 → 让兄妹"一块儿走"
    voice_function: |
      庄重 + 隐忍 + 决断——
      作者描写她"高贵的气质和她的丈夫的鄙俗奸小恰成一个强烈的对比"。
      她说话"低、沉稳，南方音 + 北方音夹杂"——
      与朴园的官腔、蘩漪的尖锐、鲁贵的卑鄙形成质感对比。
    soliloquy_signature: false
    status_arc: |
      二度母亲（来自济南）(+) → 旧屋触发记忆(-) → 认朴园(±)
      → 撕支票(+) → 萍打大海被命名(-) → 雷雨夜逼四凤起誓(+)
      → 大揭示中"罪过我一个人担"(--) → 四凤死后"我哭不出来"(---) → 十年后痴呆
    voice_subtext_pattern: |
      她话面是"我没有委屈"，话下面是"三十年的恨"——
      A2 撕完支票后说"我没有委屈，我有的是恨"是雷雨少数把潜台词浮到台面的瞬间。
      她终场"罪过我一个人担"在结构上是"母亲式的代赎"，
      但作者用三死收场否决了这种代赎的有效性。
    aria_or_soliloquy_locations: []
    relationship_anchors:
      - 周朴园 (三十年前的少爷 / 旧情人 / 抛弃她的人)
      - 周萍 (亲生长子 / 不愿相认)
      - 鲁大海 (亲生次子 / 视为自己的命)
      - 鲁四凤 (与鲁贵所生 / 最疼的女儿)
      - 鲁贵 (现夫 / 鄙俗无能 / 把女儿送进周家是他的"功劳")

  lu_dahai:
    name_zh: 鲁大海
    age: 27
    dramatic_role: secondary-protagonist-and-class-axis
    desire: |
      external: 为矿上罢工的工人争取条件
      internal: 不认朴园做父亲 + 把妹妹从周家救出来
    obstacle:
      - 三个工人代表叛变签字（A2.5）
      - 朴园开除他
      - 母亲让他不能伤害周家的人
      - 妹妹不肯走
    tactic: 罢工代表 / 拔枪威胁鲁贵 / 暴力对抗周家仆人 / 最终冒雨爬墙进周公馆
    voice_function: |
      刚硬 + 直白 + 粗砺——
      作者描写"他说话微微有点口吃，但是在他的感情激昂的时候，他词锋是锐利的"。
      他在 A2 见朴园时一上来就"董事长，您不要同我摆架子，您难道不知道我是谁么？" ——
      这是雷雨少数把人物关系"明说"的瞬间，但他自己尚不知朴园是亲父。
    soliloquy_signature: false
    status_arc: |
      工人代表(+) → 三代表叛变(-) → 被开除(-) → 被亲哥打耳光(-)
      → 雨夜逼鲁贵 + 给萍一枪(+) → 大揭示时连踢带打逃出(±)
      → 十年后没出现——朴园猜已死 → 雷雨唯一未明结局的人物
    voice_subtext_pattern: |
      他话面是阶级愤怒，话下面是"我不认这个家"——
      A2 见朴园："你？我只知道你是罢工闹得最凶的工人代表" / "对了，一点儿也不错" =
      互相不承认彼此为亲生关系。
      A4 把枪给萍时说"老太太们最糊涂——我妹妹是她的命"=
      他做出了与母亲一致的让步，但内心仍恨。
    aria_or_soliloquy_locations: []
    relationship_anchors:
      - 鲁侍萍 (亲生母亲)
      - 周朴园 (不知是亲生父亲 / 罢工对手)
      - 周萍 (不知是亲哥 / 当面打他)
      - 鲁四凤 (亲妹 / 想保护)
      - 鲁贵 (继父 / 鄙视)

  lu_sifeng:
    name_zh: 鲁四凤
    age: 18
    dramatic_role: collateral-victim / 命运清算焦点
    desire: |
      external: 与心爱的萍走 / 不背叛母亲的誓言 / 不让父亲鲁贵继续敲她钱
      internal: 像母亲一样疼爱母亲 + 像情人一样信任萍 → 两条线在同一夜被命运拉成死结
    obstacle:
      - 鲁贵把她当摇钱树
      - 蘩漪要赶她走（她不知原因是情敌）
      - 母亲不让她与周家来往
      - 怀孕（三个月）她还未告知任何人
      - 萍是她亲哥（她不知）
    tactic: 隐忍 / 红灯暗号 / 起誓 / 投奔 / 触电
    voice_function: |
      自然 + 单纯 + 健康——
      作者描写"她的一双大而有长睫毛的水灵灵的眼睛能够很灵敏地转动 ...
       但是她面部整个轮廓是很庄重地显露着诚恳"。
      她的台词大多是简短、直接、生活化的——
      作者明言"演鲁妈与四凤的应该懂得节制"，因为这两个角色"经不起重击"。
    soliloquy_signature: false
    status_arc: |
      家中使女(+) → 受鲁贵敲诈(-) → 被怀疑(-) → 被太太辞退(-)
      → 雷雨夜起誓(±) → 投奔萍(+) → 告知怀孕(+)
      → 大揭示得知萍是亲哥(----) → 奔出触电死(---)
    voice_subtext_pattern: |
      她的台词字面经常是"是" / "不" / "您说吧"，字下面是巨大的羞愧 + 恐惧——
      A3 起誓时"那——那天上的雷劈了我"是她唯一一次把潜台词浮上台面，
      而这句台词在 30 分钟后字面应验。
    aria_or_soliloquy_locations: []
    relationship_anchors:
      - 鲁侍萍 (母亲 / 最疼的人 / 起誓违背的对象)
      - 鲁贵 (父亲 / 鄙俗)
      - 鲁大海 (哥哥 / 保护)
      - 周萍 (爱人 / 不知是亲哥 / 怀孕 3 个月)
      - 周冲 (周家二少爷 / 不知她爱大哥)
      - 周蘩漪 (太太 / 情敌 / 在 A2 不知 / 在 A4 才发现自己是情敌)

  lu_gui:
    name_zh: 鲁贵
    age: 48
    dramatic_role: comic_relief-and-corruption-axis     # 兼具"卑下喜剧"功能 + 资产阶级仆从腐败的具象
    desire: 钱 / 酒 / 自我感觉良好的"机灵"
    obstacle: 自己的赌输 / 妻子的"乡气"清廉 / 大海的暴力 / 主家的辞退
    tactic: 拍马 / 偷烟 / 用秘密讨钱 / 醉酒训人 / 最后的勒索（A4 进周公馆找蘩漪）
    voice_function: |
      谄媚 + 粗鄙 + 自夸——
      作者称"周朴园 → 鲁贵"是"两个极端的阴影"。
      鲁贵的台词大量用"咳" / "他妈的" / "你看人家"——粗俗市井的话语场，
      与朴园的官话形成对比。
    soliloquy_signature: false
    status_arc: |
      周家仆人 + 知情人(+) → 用秘密讨钱(+) → 被辞退(-) → 醉骂(±)
      → 被大海拔枪威胁(-) → 又进周公馆勒索蘩漪(±) → 三死后无后续
    voice_subtext_pattern: |
      他话面是"忠仆"，话下面是"我握有你们家的秘密"——
      所有的卑屈拍马都是在为"你别把我当下人"的实际索取做铺垫。
    aria_or_soliloquy_locations: []
    relationship_anchors:
      - 鲁侍萍 (现妻 / 鄙视)
      - 鲁四凤 (亲女 / 钱袋)
      - 鲁大海 (继子 / 互相不认)
      - 周朴园 (主家 / 主家的秘密握有者)
      - 周蘩漪 (主家 / 主家的秘密握有者)

# 角色对比轴
contrast_axes:
  axis_dignity_vs_baseness:
    poles: [鲁侍萍 (高贵但隐忍), 鲁贵 (鄙俗但鲜活)]
    function: 同是仆人阶层 / 同住一屋 / 同抚一女——两个极端的伦理质感对比

  axis_youth_archetypes:
    poles: [周冲 (理想主义 / 浪漫), 鲁大海 (现实主义 / 阶级)]
    function: 两种"反父亲"的年轻人 —— 一个用乌托邦反、一个用罢工反
             —— 都被父辈的旧债清算（冲死、大海消失）

  axis_three_women_three_traps:
    poles: [周蘩漪 (情欲 / 反抗), 鲁侍萍 (母性 / 隐忍), 鲁四凤 (天真 / 怀孕)]
    function: 三代女性在男性主导秩序内的三种被困方式——
             "怀孕"成为四凤的旧路，与侍萍三十年前完全对应（"她的女儿走了她的旧路"）

  axis_father_son_unknown:
    poles: [周朴园 ↔ 鲁大海 (父子互不相认), 周朴园 ↔ 周萍 (父子相认却隔阂)]
    function: 两组父子关系——一组血缘已断、一组血缘维持但情感已断

  axis_two_brothers_unknown:
    poles: [周萍 ↔ 鲁大海 (异母兄弟 / 当众打架), 周萍 ↔ 周冲 (亲兄弟 / 抢爱人)]
    function: 两组兄弟关系都因不知 / 误识而走向悲剧
             ——这是中国话剧最早一次大规模使用"古希腊式不知"的设计

# 关系核心张力
relationships:
  key_tensions:
    - 周朴园 ↔ 鲁侍萍 (三十年弃妇与抛弃者；钱不能清偿伦理债务)
    - 周萍 ↔ 周蘩漪 (三年乱伦关系 + 切断未成功 = 雷雨第一引擎)
    - 周萍 ↔ 鲁四凤 (爱情 + 不知血缘 = 雷雨第二引擎)
    - 周朴园 ↔ 鲁大海 (资本家与工人代表 + 不知是父子 = 阶级 + 血缘双重叠加)
    - 周蘩漪 ↔ 周冲 (在 A4 末段才被互相"看见"为亲生母子)
    - 鲁侍萍 ↔ 鲁四凤 (母女 + 起誓的双方 + 命运重复)

  micro_dynamics:
    - 鲁贵 ↔ 鲁侍萍 = 经济 / 道德双重不对等
    - 周朴园 ↔ 周蘩漪 = 父权 vs 反抗（喝药一场是其展演）
    - 鲁大海 ↔ 鲁贵 = 继父子敌对（拔枪威胁）
    - 鲁大海 ↔ 周冲 = 阶级敌意 + 善意尝试

# Notes on 中国话剧规约（与西方戏剧分析的差异）
chinese_drama_conventions:
  no_soliloquy: |
    雷雨没有独白——这是中国话剧从易卜生 / 契诃夫继承的现实主义规约，
    不同于莎剧 / 古希腊悲剧的独白传统。
    所有"内心"必须通过对白、动作、舞台指示传达。
  no_aside: |
    没有旁白（aside）。
  long_stage_directions: |
    曹禺写了大量超长的人物进场舞台指示（如周萍进场的舞台指示约 700 字、
    周朴园 600 字、蘩漪 500 字），相当于"人物小传"。
    这些指示是给导演 / 演员的，舞台上不可直接呈现 ——
    但在文本分析时是 character voice 的最权威源头。
