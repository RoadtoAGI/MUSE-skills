analysis_meta:
  source: 雷雨
  source_medium: stage_play
  dramatic_form: tragedy
  reverse_engineered_from: drama-analysis@0.4.1
  completed_at: 2026-05-24
  analyst_notes: |
    以含序幕 + 尾声的完整版（六场结构）为底本。
    曹禺在序中明言：写《雷雨》"并没有显明地意识着我是要匡正讽刺或攻击些什么"，
    "宇宙间的残忍"是首要的情感动力；"暴露大家庭罪恶"是次生而非首生。
    因此 controlling_idea 与一般教科书"反封建说"有意拉开。

premise: |
  一个一夜之间集中爆发的资产阶级大家庭悲剧——三十年前被抛弃的女佣作为新仆人之妻重返旧主屋，
  与失散儿女、旧情人、新妻在同一日内被命运拽回原点；当所有秘密（认母 / 兄妹乱伦 / 母子乱伦
  / 父子敌对）在雷雨夜同一客厅完成揭示，年轻一代全数毁灭，旧人剩下苟活。

genre: family-tragedy-of-fate              # 命运型家庭悲剧；与"问题剧/社会剧"区分

controlling_idea: |
  当一个人以"立家立业"的体面外壳压住三十年前的弃女与私生子，且企图在新的体面中继续掌控他人时——
  被压抑的伦理债务会借命运的随机偶然在一日之内集中清算，并把所有未犯罪的孩子（四凤、周冲）
  一并烧成灰烬。
  作者称之为"宇宙间一种残忍"——既非简单的因果报应，也非阶级控诉，
  而是一种"上帝/命运/自然法则"借家庭悲剧显形的盲目力量。

core_tension:
  - public_decency_vs_buried_crime          # 体面 vs 旧债：朴园的"圆满家庭"压住三十年前的弃女
  - past_vs_present_collapse_in_one_day     # 过去 / 现在在一日内塌缩（古典三一律压缩）
  - desire_vs_kinship                       # 欲望（萍-蘩漪、萍-四凤）vs 不知道的血缘
  - innocent_youth_vs_inherited_sin         # 无辜的孩子（冲、四凤）vs 父辈未清的债
  - working_class_vs_capitalist_house       # 矿工罢工 vs 董事长（次轴，不是主轴）

dramatic_engine:
  inciting_disturbance: |
    周朴园三十年前抛弃女佣侍萍（怀有他第二个儿子，年三十夜被逼离周家投河），
    侍萍未死、改嫁鲁贵，并把所生女儿四凤送进了周公馆当使女——
    这个"扰动"在剧本时间开始之前已经写定，戏剧只是在揭示它。
  sustaining_pressure: |
    第一至第三幕：在郁热的一日内，三组关系同时承压——
    (a) 周萍-周蘩漪母子乱伦关系即将破裂；
    (b) 周萍-鲁四凤兄妹（不知）恋情正在加深，四凤怀孕；
    (c) 鲁大海率工人罢工、被周朴园开除、当面被亲生兄长打耳光。
    雷雨意象在台词与舞台指示中持续累积，与压力同步。
  terminal_pressure: |
    第四幕半夜两点：所有人因蘩漪的最后"拆穿动作"被锁在同一客厅；
    周朴园被迫承认侍萍身份 → 萍/四凤兄妹关系曝光 → 四凤触电死 → 周冲救她同死 → 周萍开枪自杀。
    三个孩子一夜全数毁灭；蘩漪疯、侍萍痴呆；十年后只剩朴园探望两个"疯妇"。

theatricality_notes: |
  雷雨在结构上严格遵守古典三一律变体（地点三处但时间集中在一昼夜）——
  这是中国话剧"易卜生式 + 古希腊悲剧"双重血脉的产物。
  作者自述参考过欧里庇得斯《希波吕托斯》（继母乱伦母题）与拉辛《费德尔》，但否认刻意模仿。
  序幕 / 尾声在结构上承担"希腊悲剧 chorus 一部分的功能"——拉开欣赏的距离，
  让观众"以神佛/先知的座俯视这堆在下面蠕动的生物"（作者原话）。
  全剧无外部叙述者、无独白——所有信息只能通过对白、上下场调度、舞台指示揭示，
  这是其"易卜生式回溯结构"的根本约束。
