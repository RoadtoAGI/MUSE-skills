novel: 雷雨
author: 曹禺
lang: zh
translator: ''
dialogue_voice: 声口按身份与权势分层：仆役谄媚、家长威压、青年闪躲，台词随关系翻转变调。
diction: 二十年代白话口语为底，骂语俚语入词；激情处转书面化长句控诉，不用文言。
rhetoric_density: medium
stage_direction_style: 幕首工笔长描布景气候，人物初登场作小说化肖像，行进中括号密注语气情绪。
pacing: 短句对答急速攻防层层加码，关键揭示前以半晌停顿蓄势，幕尾骤转收束。
signature_moves:
- 每句台词前置括号情绪副词如（怜悯地）（冷冷地），把表演指令写进文本节奏。
- 郁热、雷声、蝉蛙等天候声响贯穿全剧，气压随冲突升级同步收紧，景即心境。
- 序幕尾声合成十年后回看的距离框，悲剧主体装进回忆装置，离场情绪归于哀静。
- 以「半晌」「静默」标记的停顿与台词等重，对峙靠沉默蓄力再单行急转。
- 人物初登场用数百字小说化肖像直写性格与欲望，供演员与读者双重阅读。
anti_signature:
- 台词写得文绉绉满是成语对仗，或混入当代腔，就失了市井白话的糙劲。
- 舞台指示只剩干瘪调度、删去括号情绪注记与工笔肖像，气味全无。
- 冲突一路高喊到底、不设停顿与压场，失去郁热低压下的张弛节律。
