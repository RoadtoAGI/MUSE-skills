  observed_summary: "葛簇特的声音通常短、柔、调停性强，偏向“乖儿”“甜蜜的姑娘”“冷静下来”这类亲密或安抚词。她很少长篇论证，压力越大越转向惊呼、请求、复述和身体性反应；当她不得不叙述死亡时，语言会变得抒情而回避责任，例如用花、水、衣裳和歌声讲欧菲莉亚溺亡。潜台词模式是回避因果：她能描述创伤现场，却常绕开“谁应负责”。\
