  observed_summary: "欧菲莉亚的声音随对象与处境变化。对父亲，她用敬称、疑问与不确定表达回应训诫，也以哈姆雷特的诚意和誓言申辩，最后接受命令；对哥哥，她在答应谨慎的同时，用教士与道路的比喻要求他同样遵守劝诫。面对哈姆雷特，她能完整解释退还纪念品的理由，直接说出受骗的判断；受到进一步攻击后转向祈祷，独处时又以长段哀叹比较他的昔日与如今。父死后的表达以民谣、碎片故事、花语和宗教祝愿交织失去、爱情与责问，也包含要求听者听完和直接说出流泪缘由的句子。正式语域、短句或断裂各有现场作用，人物的判断与痛苦随表达方式继续显现。\
