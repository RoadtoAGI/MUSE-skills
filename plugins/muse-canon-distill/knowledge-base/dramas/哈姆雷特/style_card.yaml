novel: 哈姆雷特
author: 威廉·莎士比亚
lang: zh
translator: ''
dialogue_voice: 声口按身份分层：君王称朕摆廷议文言，王子机锋双关，仆役丑角俚白打诨
diction: 文白夹杂译本腔：白话为骨嵌四字文语与典故，双关与出处靠注脚随文补解
rhetoric_density: high
stage_direction_style: 方括号简记上下场，花括号补动机与表演提示，哑剧决斗等关键处转工笔
pacing: 长独白停驻与短句攻防交替，场内多缓起渐紧，以爆发或死亡骤然收束
signature_moves:
- 对句互掷：角色原样借对方句式回敬（娘，你深深触犯了我的父亲），成回声攻防
- 双关藏刺：谐音与一词两义连发，疯话表层下埋第二层语义，必要时注脚补刀
- 戏中戏换体：嵌入演出改用七言韵文，与台下散语对白形成台上台下两层声口
- 独白自问自答：以设问推进思辨链条，层层递进至一个行动决断收尾
- 花括号导演眼：舞台指示写进角色心理与潜台词（接班人先问此话），笔触诙谐
anti_signature:
- 全场声口均质化——仆役与君王说同一种书面语，身份分层一失即不像
- 台词直说情绪、不留双关与潜台词，把装疯写成真疯呓语
- 舞台指示只剩进出标记，丢掉花括号里的动机、心理与调度注解
author_cross_ref: ''
