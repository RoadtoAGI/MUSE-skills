tension_curve:
  description: "全剧张力呈五段阶梯：第一幕以幽灵建立秘密压力；第二至三幕前半以窥探和戏中戏形成侦查高峰；第三幕后半误杀让压力外泄成血债；第四幕用欧菲莉亚疯癫和雷尔提返国扩散为公共危机；第五幕先在墓园下沉为死亡静观，再在毒决斗中一次性爆发。"
  peaks: ["S04", "S07", "S09", "S11", "S12", "S15"]
  valleys: ["S03", "S10", "S13", "S14"]

causal_chain: "S01 鬼魂出现 → S02 赫瑞修通知哈姆雷特 → S04 鬼魂揭露弑兄罪并命令复仇 → S05 宫廷误读装疯，哈姆雷特转向戏剧验证 → S07 捕鼠器逼克劳地离席 → S08 哈姆雷特因祈祷时机放过克劳地 → S09 转入母子寝室并误杀波隆尼尔 → S10 克劳地送哈姆雷特赴英并密令处死，福丁布拉镜像刺激哈姆雷特行动决心 → S11 欧菲莉亚疯癫和雷尔提返国使误杀后果公开化 → S12 克劳地与雷尔提设计毒剑毒酒 → S13 墓园冲突把双方推向决斗 → S14 哈姆雷特接受比赛 → S15 毒计反噬，克劳地被杀，真相交给赫瑞修。"
