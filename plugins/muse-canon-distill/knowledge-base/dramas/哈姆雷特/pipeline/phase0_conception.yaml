premise: "如果一个被谋杀的国王之子被父亲亡魂要求复仇，但他必须在充满窥探、谎言与乱伦罪感的宫廷中先辨认真相并守住灵魂边界，将会发生什么？"

core_value:
  positive: "正义、真相、道德秩序"
  negative: "篡位、乱伦、谋杀与腐败统治"
  spectrum:
    contradictory: "有罪者暂时掌权，真相只能以暗示、戏剧和疯言碎语泄漏。"
    contrary: "道德瘫痪：人人知道不对劲，却被礼仪、权力和自保压住行动。"
    negation_of_negation: "以复仇之名恢复正义，却不断制造新的死亡，使正义本身沾上血污。"

controlling_idea:
  value: "真相最终公开，篡夺者受到惩罚，但旧宫廷秩序被整体清空。"
  cause: "因为隐藏的弑兄篡位罪只能在一连串窥探、误杀、反复仇和自食其果中被逼到公开处，复仇者也必须接受死亡才能完成揭露。"
  full_statement: "在腐败宫廷里，被压住的真相终会借复仇与误杀爆发出来，惩罚罪人，同时毁灭那些被卷入旧秩序的人。"
  type: "ironic"

genre:
  primary: "复仇悲剧"
  secondary: "宫廷政治悲剧 / 心理悲剧 / 幽灵剧"
  conventions:
    - setting: "王室、城堡、国葬与婚礼并置，外部战争威胁压住内部罪案。"
      evidence: "第一幕第一景；第一幕第二景"
    - characters: "被命令复仇的王子、弑兄篡位的国王、迅速再婚的王后、被利用的恋人、镜像复仇者。"
      evidence: "第一幕第二景；第一幕第五景；第四幕第五景"
    - events: "亡魂显灵、复仇誓约、装疯、戏中戏试探、误杀、流放、毒剑毒酒决斗。"
      evidence: "第一幕第五景；第三幕第二景；第三幕第四景；第五幕第二景"
    - values: "忠孝、王权合法性、死后审判、名誉、复仇与赦免的冲突。"
      evidence: "第一幕第五景；第三幕第三景；第五幕第二景"

originality_statement:
  unique_angle: "把传统复仇剧的行动重心转为认识论和良心困局：哈姆雷特不是不知道要复仇，而是不肯在证据、灵魂去向与行动意义未明时成为另一个盲目的杀人者。"
  cliches_to_avoid:
    - "不要把复仇简化为热血行动链；本作的核心张力来自行动被思想、证据和良心反复折返。"
    - "不要把装疯写成单纯伪装；它同时是刺探工具、语言护甲和精神边界被侵蚀的外化。"
    - "不要把克劳地写成扁平暴君；他的罪感、祈祷失败和政治机敏共同构成对手压力。"
    - "不要把欧菲莉亚写成纯功能牺牲品；她的服从、沉默和疯歌是父权窥探系统反噬自身的证据。"

style_directives:
  - "以对白和独白驱动结构，少用旁白解释心理。"
  - "让讽刺、双关、装疯话语承担信息泄露和关系攻击。"
  - "用镜像人物推进主题：福丁布拉、雷尔提与哈姆雷特分别给出行动、复仇、思虑的不同极端。"
  - "关键事件常以舞台动作突然落下：鬼魂出现、国王离席、帐幕后误杀、毒酒误饮、毒剑换手。"
  - "把宫廷礼仪写成遮蔽暴力的表面秩序。"

