analysis_meta:
  novel: "哈姆雷特"
  author: "威廉·莎士比亚"
  source_text: "full_text.md"
  source_form: "戏剧/复仇悲剧；短中篇，约 69773 字"
  evidence_note: "Phase A 第二轮人物系统分析；证据以幕/景标注，未做行号级场景切分。本文件只记角色系统关系与候选信号，不复述个体档案。"
  source_path: "dramas/哈姆雷特/full_text.md"
  work_type: "drama"

cast_overview:
  protagonist:
    name: "哈姆雷特"
    function: "秘密复仇者 / 认识论困局承载者 / 腐败宫廷的语言解剖者。"
    system_role: "全剧几乎所有关系都通过他的怀疑、装疯、试探和延迟被重新组织；他的每次行动迟疑都会把压力转嫁给其他角色。"
    voice_traits: "哲学独白、双关讽刺、快速转调、把礼貌语境拆成死亡/腐败/性厌恶隐喻。"
    character_arc: "从丧父后的厌世与怀疑，到借戏剧验证罪行，再到误杀后被迫承担反噬，最后在死亡准备中行动并交付真相。"
    evidence: ["第一幕第二景", "第一幕第五景", "第三幕第二景", "第三幕第四景", "第五幕第二景"]

  antagonist:
    type: "人格化对手 + 腐败秩序"
    primary:
      name: "克劳地"
      function: "弑兄篡位者 / 政治修辞高手 / 反侦查与暗杀机制的发动者。"
      system_role: "既是哈姆雷特必须惩罚的对象，也是宫廷权力、婚姻、外交和监控网络的中心。"
      voice_traits: "公开场合平衡哀与喜、亲情与国政；私下转为罪感审判和冷静算计。"
      character_arc: "从粉饰新秩序，到被戏中戏逼出罪感，再到以英格兰密令和毒决斗主动清除哈姆雷特，最终被自己的毒计反噬。"
      evidence: ["第一幕第二景", "第三幕第二景", "第三幕第三景", "第四幕第三景", "第四幕第七景", "第五幕第二景"]
    systemic_components:
      - role: "宫廷窥探系统"
        function: "波隆尼尔、罗生克兰、盖登思邓和旁听布置共同构成克劳地权力的感官延伸。"
      - role: "王权礼仪"
        function: "朝会、观剧、流放、赌赛和祝酒都被克劳地改造成掩盖暴力的形式。"
      - role: "死亡与审判规则"
        function: "祈祷、忏悔、炼狱和死后归宿让哈姆雷特不能像普通复仇者那样直接动手。"

  supporting_cast:
    - name: "葛簇特"
      function: "母亲 / 王后 / 腐败婚姻秩序的情感入口。她未必掌握弑兄真相，却是哈姆雷特厌恶与克劳地合法化的共同支点。"
      voice_traits: "情感劝慰、回避尖锐原因、在压力下转为惊惧和忏悔式回应。"
      character_arc: "从要求哈姆雷特接受新父王，到寝室中被迫看见自身良心污点，结尾误饮毒酒成为克劳地阴谋反噬的第一具身体。"
      evidence: ["第一幕第二景", "第三幕第四景", "第四幕第一景", "第四幕第七景", "第五幕第二景"]
    - name: "鬼魂"
      function: "亡父命令者 / 真相触发器 / 复仇边界的设定者。给出谋杀真相，也限定不得报复母亲。"
      voice_traits: "命令式、宗教惩罚意象浓重、反复要求记忆与复仇。"
      character_arc: "从国家凶兆中的沉默显现，到对哈姆雷特揭示私密罪案，再到寝室中提醒他不要偏离使命。"
      evidence: ["第一幕第一景", "第一幕第五景", "第三幕第四景"]
    - name: "赫瑞修"
      function: "可信见证人 / 情绪稳定器 / 结尾叙事继承者。"
      voice_traits: "简洁、谨慎、重事实；面对异常先验证再承认。"
      character_arc: "从怀疑幽灵的学者，到哈姆雷特计划的唯一可信观察者，最后放弃自杀并承担讲述真相的责任。"
      evidence: ["第一幕第一景", "第三幕第二景", "第五幕第二景"]
    - name: "欧菲莉亚"
      function: "父权与王权试探中的爱情线人物 / 受约束仍表达判断的牺牲者 / 丧亲后以疯歌与花语揭露创伤者。"
      voice_traits: "对父亲以敬称、疑问和申辩回应训诫，最终服从；对哥哥用比喻要求他同样遵守劝诫。面对哈姆雷特能完整解释退还纪念品的理由、说出受骗判断，受辱后转向祈祷和长段哀叹。父死后以民谣、花语和碎片故事交织哀痛与责问，也会直接说明流泪缘由并要求听者听完。"
      character_arc: "从相信哈姆雷特追求，到服从父兄成为试探工具；父亲被杀后理智崩解，最终溺死并把哈姆雷特与雷尔提推向公开冲突。"
      evidence: ["第一幕第三景", "第三幕第一景", "第四幕第五景", "第四幕第七景", "第五幕第一景"]
    - name: "波隆尼尔"
      function: "窥探系统的家庭化执行者 / 冗言智囊 / 误判制造者。"
      voice_traits: "格言化、绕弯、过度解释，自认为机智但常暴露权力欲和浅判断。"
      character_arc: "从教训儿女和派人刺探，到把哈姆雷特误诊为相思疯，再到帐幕后偷听时被误杀。"
      evidence: ["第一幕第三景", "第二幕第一景", "第二幕第二景", "第三幕第四景"]
    - name: "雷尔提"
      function: "快速复仇镜像 / 荣誉伦理载体 / 克劳地毒计的执行刀。"
      voice_traits: "直接、誓言密集、荣誉和家族情感先于论证。"
      character_arc: "从训诫妹妹的兄长，到丧父后率众闯宫的复仇者，再到参与毒剑阴谋并临死揭露克劳地。"
      evidence: ["第一幕第三景", "第四幕第五景", "第四幕第七景", "第五幕第一景", "第五幕第二景"]
    - name: "福丁布拉"
      function: "行动型王子镜像 / 外部军事秩序 / 结尾政权接收者。"
      voice_traits: "军事化、简短、目标明确；常由他人报告强化其行动性。"
      character_arc: "从挪威外患传闻，到为小块土地出兵刺激哈姆雷特羞耻，再到结尾以军礼接收丹麦。"
      evidence: ["第一幕第一景", "第二幕第二景", "第四幕第四景", "第五幕第二景"]
    - name: "罗生克兰与盖登思邓"
      function: "旧友变密探的双人节点 / 王权吞食小臣的例证。"
      voice_traits: "圆滑、顺从、试探性寒暄；缺少独立判断。"
      character_arc: "从被召来安抚哈姆雷特，到承运英格兰密令，最终被哈姆雷特掉包国书送死。"
      evidence: ["第二幕第二景", "第三幕第二景", "第四幕第三景", "第五幕第二景"]
    - name: "戏班演员"
      function: "艺术取证工具 / 情感表演镜子 / 戏剧理论载体。"
      voice_traits: "可塑、修辞华丽、情感外显；被哈姆雷特要求克制和真实。"
      character_arc: "作为偶然来客进入宫廷，却让哈姆雷特找到验证罪行的唯一可行形式。"
      evidence: ["第二幕第二景", "第三幕第二景"]
    - name: "掘坟工人"
      function: "死亡平等性的底层评论者 / 第五幕死亡教育的喜剧入口。"
      voice_traits: "粗粝、机智、法律逻辑滑稽化，用职业习惯消解死亡崇高。"
      character_arc: "无传统弧光；功能是把哈姆雷特从抽象死亡思辨带到具体头骨和欧菲莉亚坟墓。"
      evidence: ["第五幕第一景"]

contrast_axes:
  - axis: "对父亲之死的反应速度"
    description: "同样面对父辈死亡，角色的行动速度构成复仇剧核心对照。"
    responses:
      哈姆雷特: "先验证、思辨、表演和延迟；他把复仇当作真相与灵魂问题。"
      雷尔提: "立刻率众闯宫，要求知道仇人并愿意在教堂割喉；他把复仇当作荣誉反射。"
      福丁布拉: "以军事组织处理父辈失地，即使目标微小也能动员军队；他把复仇/继承当作国家行动。"
      欧菲莉亚: "父死后在宫廷以哭泣、歌谣和花语表达哀痛与责问，随后溺亡；她的悲伤成为在场者解读并回应的公共事件。"
    narrative_function: "把哈姆雷特的延迟从单纯性格弱点扩展为三种行动模式的结构选择。"

  - axis: "语言与真相的关系"
    description: "谁用语言遮蔽，谁用语言泄露，谁用语言保存事实。"
    responses:
      克劳地: "用平衡、庄重、政治理由遮蔽罪行；独处时语言才触及真实罪感。"
      哈姆雷特: "用疯话、双关、猥亵笑话和哲学独白拆穿别人，也保护自己。"
      波隆尼尔: "用格言和绕弯证明自己聪明，实则制造误判。"
      欧菲莉亚: "清醒时以申辩、评价与哀叹表达判断和伤痛；丧亲后以疯歌、花语及直接哭诉显露创伤，听者从中解读责问。"
      赫瑞修: "少修辞、重见证；结尾承担把混乱翻译成历史叙述的任务。"
    narrative_function: "让对白不只是信息交换，而是权力、伪装、伤害和见证的战场。"

  - axis: "对窥探系统的站位"
    description: "宫廷里几乎每个人都被看或看别人，差异在于是否主动参与。"
    responses:
      克劳地: "调度旁听、密探、流放和决斗，是监控系统的最高节点。"
      波隆尼尔: "把窥探当作智慧，从儿子到女儿再到皇后寝室都使用间接监控。"
      罗生克兰与盖登思邓: "把友情交给王命，成为可被挤干的海绵式工具。"
      哈姆雷特: "用装疯反向抵抗窥探，并以戏剧审问窥探者的良心。"
      赫瑞修: "不参与刺探，只在哈姆雷特授权下观察克劳地反应。"
      欧菲莉亚: "被父亲和国王安排成诱饵，是系统中最少主动权的一环。"
    narrative_function: "把宫廷设计成互相监视的封闭空间，使误判和误杀成为必然风险。"

  - axis: "母性/女性位置的压力"
    description: "女性角色不是同一类受害者，而被不同制度位置压迫。"
    responses:
      葛簇特: "身处王后位置，拥有情感影响却回避罪行认知；她的婚姻让篡位合法化。"
      欧菲莉亚: "身处女儿和恋人位置，几乎没有政治权力；她的身体和名誉被男性用来验证男性。"
      戏中伶后: "作为镜像人物，在舞台上说出再嫁与背叛的誓言压力，反照葛簇特。"
    narrative_function: "把乱伦婚姻、贞节管控和戏中戏镜像统一成对男性复仇结构的情感代价。"

  - axis: "终局中的道德反应"
    description: "毒计暴露后，各角色在临死或临近死亡时如何处理真相。"
    responses:
      雷尔提: "承认阴谋并指认国王，临死请求互相宽恕。"
      哈姆雷特: "立即转向公开复仇，并阻止赫瑞修自杀，要求留下真相。"
      葛簇特: "用最后一句话指出酒中有毒，把私人母爱转为公开证词。"
      克劳地: "仍试图被救，直到被强迫饮下自己的毒酒。"
      赫瑞修: "想追随死亡，但被迫承担叙事责任。"
    narrative_function: "让最终清算不是单纯杀敌，而是通过临死选择重排每个人的道德位置。"

relationships:
  power_dynamics: >
    克劳地掌握王权、外交、密探和公共解释权，是宫廷明面权力中心；
    哈姆雷特拥有王位继承合法性、民众爱戴和真相线索，却缺少公开证据与行动自由；
    葛簇特连接王权合法性和哈姆雷特情感弱点；
    波隆尼尔家族处于服务王权的位置，却因窥探和误杀承受最大反噬；
    赫瑞修几乎没有政治权力，但拥有结尾解释权；
    福丁布拉在丹麦之外积累军事行动力，等旧宫廷自毁后接管空位。

  key_tensions:
    - between: ["哈姆雷特", "克劳地"]
      tension: "真相与权力的核心对抗。哈姆雷特知道罪案但不能公开证明；克劳地拥有权力但无法摆脱良心暴露和王子威胁。"
      evidence: ["第一幕第五景", "第三幕第二景", "第三幕第三景", "第五幕第二景"]
    - between: ["哈姆雷特", "葛簇特"]
      tension: "儿子的道德控诉与母亲的情感回避。她的再婚既是哈姆雷特创伤，也是克劳地统治的合法化外衣。"
      evidence: ["第一幕第二景", "第三幕第四景", "第五幕第二景"]
    - between: ["哈姆雷特", "欧菲莉亚"]
      tension: "真实情感、装疯策略和父权利用互相污染；哈姆雷特攻击她时同时在攻击女性、婚姻和监控诱饵。"
      evidence: ["第一幕第三景", "第三幕第一景", "第五幕第一景"]
    - between: ["哈姆雷特", "波隆尼尔"]
      tension: "语言拆解者 vs 冗言窥探者。波隆尼尔不断误读哈姆雷特，最终死于自己最惯用的偷听位置。"
      evidence: ["第二幕第二景", "第三幕第四景"]
    - between: ["哈姆雷特", "赫瑞修"]
      tension: "行动者与见证者。赫瑞修无法替他复仇，但能帮助验证、稳定情绪并保存故事。"
      evidence: ["第一幕第一景", "第三幕第二景", "第五幕第二景"]
    - between: ["哈姆雷特", "雷尔提"]
      tension: "两个丧父之子的镜像冲突。一个延迟到误杀，一个立即行动到被利用；终局通过互伤互谅合并。"
      evidence: ["第四幕第五景", "第五幕第一景", "第五幕第二景"]
    - between: ["克劳地", "雷尔提"]
      tension: "国王把雷尔提的孝子怒火改造成自己的暗杀工具，雷尔提以为在复仇，实际上在替真正罪人服务。"
      evidence: ["第四幕第七景", "第五幕第二景"]
    - between: ["克劳地", "葛簇特"]
      tension: "婚姻同盟维持王权表面，但葛簇特的母爱和无知最终破坏毒酒计划。"
      evidence: ["第一幕第二景", "第四幕第一景", "第五幕第二景"]
    - between: ["丹麦旧宫廷", "福丁布拉"]
      tension: "内部腐败与外部秩序的对照。旧宫廷越陷入私密血债，外部军事继承者越显得可接管。"
      evidence: ["第一幕第一景", "第四幕第四景", "第五幕第二景"]

  potential_shifts:
    - shift: "哈姆雷特在祈祷场直接杀死克劳地。"
      blocked_by: "他认为忏悔时杀人会让克劳地上天堂，复仇反成奖赏。"
      result: "克劳地暂时获救，误杀波隆尼尔成为下一场灾难。"
      evidence: "第三幕第三景"
    - shift: "葛簇特公开站到哈姆雷特一边。"
      blocked_by: "她未直接掌握谋杀证据，也仍在王后与母亲身份之间摇摆。"
      result: "她保守哈姆雷特装疯秘密，但没有能力阻止克劳地后续毒计。"
      evidence: "第三幕第四景至第五幕第二景"
    - shift: "欧菲莉亚成为哈姆雷特的情感同盟。"
      blocked_by: "父亲命令、国王旁听、哈姆雷特装疯策略和性厌恶语言共同切断信任。"
      result: "爱情线转化为伤害线，最终通过葬礼回到主冲突。"
      evidence: "第一幕第三景；第三幕第一景；第五幕第一景"
    - shift: "雷尔提把怒火指向真正罪人克劳地。"
      blocked_by: "信息不对称和克劳地的转移话术。"
      result: "他成为毒剑执行者，直到临死才完成指认。"
      evidence: "第四幕第五景至第五幕第二景"
    - shift: "罗生克兰与盖登思邓保留朋友立场。"
      blocked_by: "王命、仕途依附和缺乏道德判断。"
      result: "他们携带死亡密令而不自知，最终被掉包国书反杀。"
      evidence: "第二幕第二景；第五幕第二景"
    - shift: "赫瑞修追随哈姆雷特自杀。"
      blocked_by: "哈姆雷特临死要求他留下讲述真相。"
      result: "私人忠诚被转化为公共见证，悲剧获得可传达的历史形式。"
      evidence: "第五幕第二景"

ensemble_design:
  revenge_mirror_cluster:
    members: ["哈姆雷特", "雷尔提", "福丁布拉"]
    collective_function: "三位年轻男性都继承父辈伤口：哈姆雷特代表延迟与验证，雷尔提代表即时荣誉复仇，福丁布拉代表军事行动和政治继承。"
    note: "这个三角结构防止哈姆雷特的迟疑被孤立理解；作品让不同速度的行动彼此照亮，也彼此批判。"

  surveillance_cluster:
    members: ["克劳地", "波隆尼尔", "罗生克兰与盖登思邓", "欧菲莉亚"]
