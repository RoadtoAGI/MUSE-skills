analysis_meta:
  novel: "哈姆雷特"
  source_text: "full_text.md"
  source_form: "戏剧/复仇悲剧；短中篇，约 69773 字"
  evidence_note: "Phase A 第一轮逆向分析；证据以幕/景标注，未做行号级场景切分。"
  source_path: "dramas/哈姆雷特/full_text.md"
  work_type: "drama"

inciting_incident:
  description: "哈姆雷特在城墙上跟随父王亡魂，得知克劳地弑兄篡位并被命令复仇。"
  type: "accident"
  timing: "第一幕第五景"
  balance_before: "哈姆雷特深陷父丧和母亲仓促再婚的厌恶中，只能怀疑宫廷有阴恶之事。"
  balance_after: "怀疑变成复仇誓约；他决定清空记忆、记住亡父，并让赫瑞修等人为自己未来的装疯保密。"
  impact_on_protagonist: "哈姆雷特从忧郁王子变成秘密复仇者，但同时被证据怀疑、灵魂审判和母亲禁令束缚。"

desire_object:
  conscious: "确认克劳地罪行并为父亲复仇。"
  unconscious: "在一个腐败、可疑、充满表演的世界里恢复真相与道德秩序，同时避免自己变成无差别的凶手。"
  tension: "复仇要求他行动，良心和理智要求他等待可验证的真相；越等待，越多无辜者被卷入。"

spine_statement: "哈姆雷特从亡魂处获得弑父真相后，借装疯、戏剧和语言试探逼近克劳地，直到被对手的毒计推入公开决斗，在临死前杀死篡位者并交付真相。"
spine_type: "conscious"

dramatic_question:
  question: "哈姆雷特能否揭露并惩罚克劳地，而不让复仇完全吞没自己的灵魂和丹麦秩序？"
  obligatory_scene: "第五幕第二景的毒剑毒酒决斗：克劳地阴谋公开，葛簇特、雷尔提与哈姆雷特相继中毒，哈姆雷特在临死前杀死克劳地并委托赫瑞修讲述真相。"

opposing_forces:
  internal: "过度思辨、对死后审判的恐惧、对母亲性/婚姻的厌恶、对自身懦弱的羞辱感、复仇伦理的迟疑。"
  personal: "克劳地的谋杀与反谋杀；葛簇特的再婚和软弱；波隆尼尔的窥探；欧菲莉亚被父权利用；罗生克兰与盖登思邓的密探角色；雷尔提的反复仇。"
  external: "王权礼仪、宫廷监控、民众舆论、英格兰密令、挪威军队和贵族决斗制度。"

arcs:
  - arc_id: "ARC-1"
    name: "恶兆到复仇誓约"
    value_at_start: "宫廷表面完成权力交接，哈姆雷特只有哀悼和厌恶。"
    value_at_end: "隐藏谋杀被亡魂揭开，哈姆雷特承担复仇使命。"
    climax_event: "第一幕第五景，鬼魂揭露克劳地用毒谋杀先王并要求哈姆雷特复仇。"
    function_note: "把国家不安、家庭乱伦和超自然命令合并为单一复仇驱动。"
  - arc_id: "ARC-2"
    name: "装疯侦查与戏剧取证"
    value_at_start: "哈姆雷特有真相线索，但不能确定幽灵是否可信。"
    value_at_end: "戏中戏逼出克劳地反应，复仇对象被确认。"
    climax_event: "第三幕第二景，克劳地在毒杀场面中起身离席。"
    function_note: "把复仇从亡魂证言推进到可见的良心证据。"
  - arc_id: "ARC-3"
    name: "行动机会变成误杀灾难"
    value_at_start: "哈姆雷特似乎已获得行动理由。"
    value_at_end: "他错过直接杀死克劳地的机会，误杀波隆尼尔，被送往英格兰。"
    climax_event: "第三幕第四景，哈姆雷特在皇后寝室刺死帐幕后偷听的波隆尼尔。"
    function_note: "让拖延不再只是心理状态，而变成可扩散的血债。"
  - arc_id: "ARC-4"
    name: "复仇反噬与毒计成形"
    value_at_start: "克劳地试图把哈姆雷特流放，宫廷暂时压住波隆尼尔之死。"
    value_at_end: "欧菲莉亚疯死，雷尔提归国复仇，克劳地把雷尔提的怒火改造成毒剑毒酒陷阱。"
    climax_event: "第四幕第七景，克劳地与雷尔提设计无护剑和毒酒，随后葛簇特报告欧菲莉亚溺死。"
    function_note: "把哈姆雷特制造的附带死亡转化为对他的反复仇机制。"
  - arc_id: "ARC-5"
    name: "死亡接受与公开清算"
    value_at_start: "哈姆雷特返国，已在墓园直面肉身朽坏与欧菲莉亚之死。"
    value_at_end: "旧王室几乎全灭，克劳地罪行公开，福丁布拉接管丹麦。"
    climax_event: "第五幕第二景，毒剑毒酒连环暴露，哈姆雷特杀死克劳地后死亡。"
    function_note: "把私人复仇转成公共历史和政权交接。"

story_climax_design:
  crisis:
    dilemma: "哈姆雷特在内心有不祥预感时，是否接受国王安排的与雷尔提比剑。"
    option_a: "拒绝或推迟决斗，保全自己并等待更多时机，但克劳地仍掌权且英格兰消息将逼近。"
    option_b: "接受决斗，把自己交给不可控的场面和天意，可能落入陷阱。"
    character_revelation: "他不再试图用思辨控制全部因果，而是在死亡准备中行动。"
  climax:
    action: "雷尔提用毒剑刺伤哈姆雷特，换剑后也被毒剑伤及；葛簇特误饮毒酒；雷尔提临死揭露克劳地，哈姆雷特用毒剑刺王并逼其饮下毒酒。"
    value_change:
      from: "罪行被礼仪和阴谋遮蔽，复仇迟滞且误伤旁人。"
      to: "罪行当众暴露，篡位者被惩罚，但正义以王室灭亡为代价。"
    controlling_idea_expression: "毒计反噬设计者，显示腐败秩序无法只清除一个敌人；真相必须公开，但公开之时已经没有旧世界的幸存余地。"
  resolution:
    new_balance: "哈姆雷特、葛簇特、克劳地、雷尔提皆死；赫瑞修成为叙事见证者；福丁布拉获得继承认可并以军礼安葬哈姆雷特。"
    lingering_feeling: "复仇完成后的宁静不是胜利快感，而是高贵心灵破碎后由外部秩序接管的寒意。"
