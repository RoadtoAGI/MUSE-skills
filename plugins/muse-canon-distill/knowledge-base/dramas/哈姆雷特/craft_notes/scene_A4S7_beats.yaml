  quote: 有株倾斜的杨柳树
- pattern_id: A4S7-p7
  beat: 泪与火退场
  dimension: exchange
  original_move: 退场台词自我矛盾，密谋场以失控收尾
  ai_default_failure: 雷尔提冷静退场，双重燃料失效
  transfer_rule: 密谋后让情绪破防一次再收场
