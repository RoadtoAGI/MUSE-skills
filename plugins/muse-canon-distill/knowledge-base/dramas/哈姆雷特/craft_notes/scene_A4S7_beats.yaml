  ai_default_failure: 直接下达比剑指令，操纵感全无
  transfer_rule: 操纵戏让被操纵者自以为方案出自己手
  quote: 他对你的剑术, 更是赞不绝口
- pattern_id: A4S7-p4
  beat: 忠孝试探
