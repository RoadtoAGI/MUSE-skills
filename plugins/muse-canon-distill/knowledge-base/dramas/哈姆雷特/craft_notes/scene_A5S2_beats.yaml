patterns:
- pattern_id: A5S2-p1
  beat: 海上追叙
  dimension: monologue
  original_move: 海上冒险全部口述，省戏给性格转变
  ai_default_failure: 实拍海战夺走终局篇幅
  transfer_rule: 动作戏可省，篇幅留给讲述动作的人
  quote: 结局还总归是神来安排的
- pattern_id: A5S2-p2
