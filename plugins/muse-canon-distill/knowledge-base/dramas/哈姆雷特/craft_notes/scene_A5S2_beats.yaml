  original_move: 三重保险逐一反噬设计者，短令切碎节奏
  ai_default_failure: 决斗写成长篇描写，节拍拖沓
  transfer_rule: 终局乱局让误中者先于目标
  quote: 那是毒酒, 已太迟了...
- pattern_id: A5S2-p6
  beat: 临终供词
  dimension: exchange
