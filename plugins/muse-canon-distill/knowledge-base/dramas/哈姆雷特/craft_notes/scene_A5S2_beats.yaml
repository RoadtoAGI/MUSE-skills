  ai_default_failure: 主角自行宣判处决，无人作证
  transfer_rule: 弑君前必须先有当众供词
  quote: 国王...国王就是罪人...
- pattern_id: A5S2-p7
  beat: 遗言与止杯
  dimension: exchange
  original_move: 夺杯阻友殉死，遗言托付的是叙事权
  ai_default_failure: 遗言用于抒情告别或复仇宣言
  transfer_rule: 主角遗言可托付「被正确讲述」
  quote: 忍痛告诉世人我的故事罢
- pattern_id: A5S2-p8
  beat: 福丁布拉接管
  dimension: blocking
  original_move: 收场交给未卷入血债的第三方，军礼定价
  ai_default_failure: 幕落于尸横遍野，无人恢复秩序
  transfer_rule: 终局后由结构旁观者收拾并致敬
  quote: 命将士们放炮!
