  ai_default_failure: 比剑邀约严肃直递，反差尽失
  transfer_rule: 大限前插一段纯讽刺喜剧加深不安
  quote: 请你把帽子戴好
- pattern_id: A5S2-p3
  beat: 麻雀预感
  dimension: exchange
  original_move: 预感被说出又被放行，主角清醒赴死
  ai_default_failure: 主角毫无预感，结局沦为意外
  transfer_rule: 让主角拒绝最后一个逃生口
  quote: 连一支麻雀之死, 都是预先注定的
- pattern_id: A5S2-p4
  beat: 和解致辞
  dimension: exchange
  original_move: 致歉真诚而辩词诡辩，和解与杀局双层并立
  ai_default_failure: 和解写成真和解，杀局转折突兀
  transfer_rule: 终局前可设表层和解底层杀局
  quote: 就是哈姆雷特的疯症所干的
- pattern_id: A5S2-p5
  beat: 决斗连环引爆
